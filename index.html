证并为 Linux 内核 948 个本地提权漏洞生成补丁，总 API 成本 120 万美元。漏斗数据显示：2,308 个候选发现中 1,724 个通过验证，最终得到 948 个可用的 LPE exploit 和 291 个可用的 PoC。", "type": "paper", "relTime": "4天前"}, {"id": 62, "title": "OpenAI 发布 Images 2.6，ChatGPT 支持文本和照片生成动画 GIF", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/chatgpt-can-now-turn-text-prompts-and-photos-into-animated-gifs-with-openais-images-2-6-model/", "date": "2026-11-04T19:44:20.000Z", "summary": "OpenAI 基于新模型 Images 2.6 在 ChatGPT 中上线 GIF 生成功能，正向网页、桌面和移动端所有 ChatGPT 和 Codex 用户推送。", "type": "product", "relTime": "4天前"}, {"id": 63, "title": "Atmanity 发布实时形象模型 Atmee v2，1 张照片加 10 秒语音生成可视频通话的数字人", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2118053058395722127", "date": "2026-11-04T18:49:35.000Z", "summary": "Atmanity 发布实时形象模型 Atmee v2，可用 1 张照片和 10 秒语音生成能实时视频通话的会说话角色。作者引用发布方内容介绍，Atmee v2 负责渲染面部和身体，另一个模型 Causeur 驱动表情和手势跟随对话，宣称比 Seedance 2.5、Wan 3.0 等视频模型快最多 50 倍、便宜 10-100 倍，开发者可通过 atmee.ai 邀请码经 API 使用。", "type": "product", "relTime": "4天前"}, {"id": 64, "title": "Bill Gates 谈税收政策如何加速 AI 取代白领劳动", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2118049021029925317", "date": "2026-11-04T18:33:32.000Z", "summary": "Bill Gates 在 FT Live 访谈中表示，AI 一旦 properly set up，随着更好版本的到来，取代白领劳动将非常便宜，且不只限于法律或商业咨询，而是覆盖经济各领域。他认为现行税收政策把税负压在劳动力上、同时对购买机器人和 token 的资本支出很宽松，会加速企业用 AI 取代人工。完整视频在 FT Live 频道。", "type": "industry", "relTime": "4天前"}, {"id": 65, "title": "OpenAI 为 ChatGPT 上线 GIF 生成并发布 Images 2.6 模型", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/1026474/openai-chatgpt-animated-gifs-images-2-6", "date": "2026-11-04T18:00:00.000Z", "summary": "OpenAI 随 Images 2.6 模型为 ChatGPT 上线 GIF 生成，可单步生成动图并调整播放速度、逐帧编辑和分享，此前 ChatGPT 无法一步原生生成 GIF。", "type": "product", "relTime": "4天前"}, {"id": 66, "title": "Philipp Schmid 演示如何用 Gemini API CLI 配合编码 Agent 测试语音等多模态功能", "source": "X：Philipp Schmid（Google DeepMind 开发者体验） (@_philsc "date": "2026-11-04T15:17:21.000Z", "summary": "fal 平台上线可灵（Kling）V4 Flash，提供文本生成视频、图片生成视频、参考生成视频和视频编辑四类入口。各入口均附有 fal.ai 模型页面链接。", "type": "product", "relTime": "4天前"}, {"id": 72, "title": "可灵 Kling 4.0 Flash 全量开放，支持 API、MCP 与 Adobe 插件接入", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2117995299591319932", "date": "2026-11-04T15:00:04.000Z", "summary": "可灵（Kling AI）宣布 Kling 4.0 Flash 现已对所有人全面开放，可通过 Kling AI 网站和 API 使用。用户还能通过 MCP、CLI 和 AI 插件访问，并为 Adobe Photoshop、Premiere Pro、After Effects 等专业创作工具提供插件，将视频生成直接集成到创作流程中。", "type": "product", "relTime": "4天前"}, {"id": 73, "title": "国行 Apple 智能上线，创作内容与问询结果可同步至千问 App", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/022/459.htm", "date": "2026-11-04T14:49:55.467Z", "summary": "苹果推送 iOS 27.3 首个开发者预览版，为国行用户带来「Apple 智能与 Siri」，与阿里巴巴合作接入千问，可在 Siri、写作工具和视觉智能中调用其文本与图像理解能力。IT之家实测发现，视觉智能的问询结果和千问完成的文字创作内容都会同步至千问 App，后者支持语音播报、分享、复制、收藏、重新生成等操作。", "type": "industry", "relTime": "4天前"}, {"id": 74, "title": "PixVerse 演示用 Depth Map Control 用自己角色复刻任意视频动作", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2117980488778555413", "date": "2026-11-04T14:01:13.000Z", "summary": "PixVerse 演示如何用其 Depth Map Control 功能，用自己的角色复刻任意视频的动作。步骤为在 PixVerse 打开 Depth Map Control，上传想复刻的视频作为深度参考，添加自己的角色、物体或场景，再写提示词生成。", "type": "tip", "relTime": "4天前"}, {"id": 75, "title": "小米 WorldCast 3D 运镜在 REDMI K100 上线：平面照片还原成三维场景", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/022/433.htm", "date": "2026-11-04T13:53:25.310Z", "summary": "小米 REDMI K100 上线 3D 运镜 AI 玩法，从相册选一张静态照片即可生成大角度 3D 运镜视频，镜头可环绕、推拉、倾斜，人物五官、发型、衣着保持一致。该功能由小米近期公开论文中的视觉生成框架 WorldCast 支撑，它通过解读画面深度结构把平面照片还原成三维场景，并虚拟出真实相机轨迹。小米称后续将探索更复杂运镜形态、更长连续生成及可控 4D 视频生成技术。", "type": "product", "relTime": "4天前"}, {"id": 76, "title": "百度发布物理AI世界模型Apollo World", "source": "X：百度 Baidu (@Baidu_Inc)", "sourceUrl": "https://x.com/Baidu_Inc/status/2117965585342419416", "date": "2026-11-04T13:02:00.000Z", "summary": "百度在深圳AI Day上发布面向物理AI的世界模型Apollo World，可将复杂道路交互与罕见驾驶场景转化为可重复、可控的仿真，用于自动驾驶系统训练与测试。该模型支持自主决策的AI交通智能体、实时生成的摄像头与LiDAR等传感器数据，以及虚拟城市中任意两点间的完整载客行程。Apollo World已用于Apollo Go的测试验证。", "type": "product", "relTime": "4天前"}, {"id": 77, "title": "TechHalla 实测 Kling 4.0 与 Kling 4.0 Flash：多镜头调度与角色一致性", "source": "公众号：可灵AI（快手·视频）", "sourceUrl": "https://mp.weixin.qq.com/s/vr5mLfyrJI5t4_jwc-5cVQ", "date": "2026-11-04T11:15:39.000Z", "summary": "可灵AI 公众号发布创作者 TechHalla 对 Kling 4.0 和 Kling 4.0 Flash 的实战测评，展示投石机抛车、音乐视频《PACK ANIMALS》和3D动作迁移等四项测试。", "type": "tip", "relTime": "4天前"}, {"id": 78, "title": "腾讯混元 Hy4 正式版发布，称首次跻身最强开源模型之列", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/022/035.htm", "date": "2026-11-04T04:59:42.330Z", "summary": "腾讯混元 11 月 4 日发布大语言模型 Hy4 正式版，官方称 Hy 首次跻身最强开源模型之列，计划近期开源模型权重并发布模型系统卡片。相比 Hy4 preview，该模型扩展了预训练和后训练规模，首次引入视觉能力和电脑操作支持，可执行细粒度图像处理、复杂图表分析、数学视觉推理及结合命令行与图形界面的任务。", "type": "model", "relTime": "4天前"}, {"id": 79, "title": "腾讯 WeChat Vision 团队开源 WeVisOne-VL 视觉语言模型，统一检测、OCR、分割与抠图", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/11/03/tencent-wevisone-vl-vision-language-model/", "date": "2026-11-04T04:39:27.000Z", "summary": "腾讯 WeChat Vision 团队发布开源视觉语言模型 WeVisOne-VL，提供 2B（2.44B 参数）和 4B（4.83B 参数）两个版本，基于 Qwen3-VL，单个模型即可完成检测、指代、计数、指向、OCR、分割和 alpha matting，像素输出由 9.6M 参数解码器生成，无需单独的 SAM，缺失目标时输出 None 而非猜测框。", "type": "model", "relTime": "4天前"}, {"id": 80, "title": "OpenAI 发布 Images 2.6，生成提速 50% 并新增 GIF 动画能力", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "sourceUrl": "https://openai.com/index/introducing-images-2-6", "date": "2026-11-04T00:00:00.000Z", "summary": "OpenAI 在 ChatGPT、Codex 和 API 中推出 Images 2.6，图像生成速度比之前快 50%，并支持用 GIF 为图像添加动画。API 提供 GPT-Image-2.6 Flare（低质量下最快 6 秒出图）和 GPT-Image-2.6 Sunburst（中高质量下更精细）两个模型。", "type": "product", "relTime": "5天前"}, {"id": 81, "title": "YouTube 面向全球创作者推广“替换歌曲”AI 配乐工具", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/021/877.htm", "date": "2026-11-03T22:29:25.370Z", "summary": "YouTube 于 11 月 4 up-fal-doubles-its-valuation-to-16b-as-demand-surges/", "date": "2026-11-03T19:34:43.000Z", "summary": "托管和运行 AI 视频、图像与音频模型的旧金山初创公司 Fal 完成 13 亿美元融资，由 Bessemer Venture Partners 领投，Nvidia、Sound Ventures 和 T. Rowe Price 参投，估值 160 亿美元，较 4 月的 80 亿翻倍。", "type": "industry", "relTime": "5天前"}, {"id": 87, "title": "国行 Apple 智能与 Siri 随 iOS 27.3 开发者预览版上线，iPhone 15 Pro 及更新机型可用", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/021/861.htm", "date": "2026-11-03T19:08:12.987Z", "summary": "苹果面向 iPhone 发布 iOS 27.3 开发者预览版，IT之家实测国行「Apple 智能与 Siri」如期上线，用户更新后可在设置中找到该功能。国行版与阿里巴巴合作接入千问，用户可在 Siri、写作工具和视觉智能中调用千问的文本与图像理解能力，登录千问账户或通过「通过 Apple 登录」即可使用，无需跳转独立应用。", "type": "product", "relTime": "5天前"}, {"id": 88, "title": "Gemini API CLI 技能发布", "source": "X：Philipp Schmid（Google DeepMind 开发者体验） (@_philschmid)", "sourceUrl": "https://x.com/_philschmid/status/2117674864907608543", "date": "2026-11-03T17:46:46.000Z", "summary": "我们为 Gemini API CLI 做了一个技能。它让你的智能体可以通过 CLI 调用 Gemini 模型（图像、TTS、视频、文件），无需编写一次性脚本。  npx skills add google-gemini/gemini-skills --skill gemini-api-cli", "type": "product", "relTime": "5天前"}, {"id": 89, "title": "Google DeepMind 与 Stanford 论文：提示词中红心图形可让 VLM 转向递归解法", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2117651708998484268", "date": "2026-11-03T16:14:46.000Z", "summary": "Google DeepMind 与 Stanford 的论文发现，提示词中加入与任务无关的简单彩色图形（如红心）会隐式改变 VLM 的行为。在二叉树编码题上，红心使 Claude Opus 4.7 和 GPT-5.4 的递归解法占比从 0% 升到 100%；Gemini 3.1 Pro 被图形影响时，71.5% 的思考痕迹称图像无关。", "type": "paper", "relTime": "5天前"}, {"id": 90, "title": "OCRia-1 背后的推理栈：单张 B200 上 token 生成提速近 10 倍", "source": "LlamaIndex：产品、工程与评测", "sourceUrl": "https://www.llamaindex.ai/blog/the-inference-stack-behind-ocria", "date": "2026-11-03T16:00:00.000Z", "summary": "LlamaIndex 披露 OCRia-1 文档解析模型的推理优化方案，在单张 B200 GPU 上把 token 生成速度从约 285 tokens/sec 提升到约 2800 tokens/sec，接近 10 倍。方案结合了混合精度量化（BF16、FP8、NVFP4，视觉编码器不量化）与 DFlash2 块扩散投机解码，后者接受率超过 12 个 token。", "type": "tip", "relTime": "5天前"}, {"id": 91, "title": "OiiOii全能复刻实测：用Opus 5.5+Seedance 2.5批量复刻6类高质感视频", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s/6JHZvhaLnJM8bajlh8bsKQ", "date": "2026-11-03T12:08:00.000Z", "summary": "作者实测OiiOii新上线的全能复刻功能，复刻了品牌UI动效、MG动画、单品广告、游戏实机、口播和多维度批量裂变6类视频，全程无需写代码或用AE。其原理是镜头光影交给Seedance 2.5生成，识别到文字排版和UI时调用Opus 5.5写代码并在云端浏览器渲染录制，文字边缘比原片更清晰；复刻时留存中间工程文件，同一创意反复修改速度可快4到5倍、费用省约80%。", "type": "tip", "relTime": "5天前"}, {"id": 92, "title": "Meshy 发布 N1 Texture，单个游戏资产纹理约 20 秒完成", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2117560632367309261", "date": "2026-11-03T10:12:51.000Z", "summary": "Meshy 发布 Meshy N1 Texture，为游戏资产生成纹理，单个资产约 20 秒完成。该工具输出干净的 2K base color、大幅减少接缝，主打风格化游戏资产。官方还演示了 GPT 编写商店代码、Meshy T2 把商品照片转成 3D、N1 上色的十分钟超市搭建流程。", "type": "product", "relTime": "5天前"}, {"id": 93, "title": "可灵 4.0 实战：八位创作者分享使用体验", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2117540047809602044", "date": "2026-11-03T08:51:04.000Z", "summary": "可灵（Kling）邀请八位创作者分享 Kling 4.0 在真实创作工作流中的表现。要点包括 Dynamic Motions 带来更流畅的动作与物理交互、Native 30s Generation 支持更自然的叙事节奏，Omni Reference 融合多种视觉参考构建统一风格。创作者还强调角色一致性提升、口型与粤语台词精准匹配以及电影级画面质感。", "type": "industry", "relTime": "5天前"}, {"id": 94, "title": "曝字节跳动 Seedance 视频生成模型海外收入占比达 50%", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/021/637.htm", "date": "2026-11-03T08:37:00.243Z", "summary": "据《智能涌现》爆料，字节跳动旗下视频生成模型 Seedance 的海外收入占比已达到 50%，过去半年海外市场收入增长近 5 倍。报道称腾讯位列 Seedance 中国区客户前三，B站进入前十，头部互联网企业正规模化采购；火山引擎此前还发布了 Seedance 影视合作计划，单个项目激励最高可达百万人民币，并于 10 月 23 日发布该代中最强的 Seedance 2.5 4K 模型。", "type": "industry", "relTime": "5天前"}, {"id": 95, "title": "商汤发布日日新 SenseNova 6.8 Flash 正式版，支持动态 PPT 与 Blender 3D 创作", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/021/487.htm", "date": "2026-11-03T03:59:48.813Z", "summary": "商汤科技 11 月 2 日晚发布日日新 SenseNova 6.8 Flash 正式版，重点升级办公协作与设计生成能力，支持长期记忆、跨会话任务协作。", "type": "model", "relTime": "5天前"}, {"id": 96, "title": "Google 与香港大学发布 VeriCUA 论文：用机器状态验证计算机智能体的任务完成声明", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2117445916982673579", "date": "2026-11-03T02:37:01.000Z", "summary": "Google 与香港大学的 VeriCUA 论文主张计算机使用智能体自己报告的“任务完成”不能作为证据，应检查保存的文件和应用数据。VeriCUA 先探索应用构建需求清单，再运行屏幕或代码检查逐项核实；在 ScienceBoard 上误报率为 5.4%，低于 VLM 评审的 24.8% 和生成脚本校验器的 21.7%，并在 3 个在线环境中拒绝约 80% 的虚假完成报告。", "type": "paper", "relTime": "5天前"}, {"id": 97, "title": "OpenAI 训练并部署激活分类器作为前沿模型安全监控层", "source": "OpenAI：Alignment 研究博客（RSS）", "sourceUrl": "https://alignment.openai.com/training-activation-classifiers/", "date": "2026-11-02T20:00:00.000Z", "summary": "OpenAI 自 GPT-5.6 起在其最强模型的内部和外部流量上部署激活分类器（probes），利用模型内部激活逐 token 实时评分，可在生成中途阻断违规回复和工具调用并交由推理模型复审。实验显示 probes 比更大的文本分类器对测试的越狱攻击更鲁棒，准确率随模型能力提升，且在后训练各检查点间迁移良好，但需为新基础模型重新训练，且只能检测可显式训练的已知违规类型。", "type": "paper", "relTime": "6天前"}, {"id": 98, "title": "Agent Arena 前十智能体输入输出比达 93:1", "source": "X：Arena (@arena)", "sourceUrl": "https://x.com/arena/status/2117332916854501753", "date": "2026-11-02T19:08:00.000Z", "summary": "根据我们对 26K+ 会话的分析，Agent Arena 中排名前十的智能体每生成一个 token，大约要处理 93 个输入 token。  这就是各家实验室竞相降低缓存输入成本的原因。  下方视频展示了缓存在实践中的运作方式，用的是来自 @AnthropicAI 的 Opus 5.5 和 @GoogleDeepMind 的 Gemini 4 Argon 的真实会话。  深入了解这场隐藏的 ...", "type": "model", "relTime": "6天前"}, {"id": 99, "title": "Skyfall AI 发布 SKY-001 工程世界模型", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2117323512155394394", "date": "2026-11-02T18:30:37.000Z", "summary": "Skyfall AI 发布 SKY-001，可按零件与建造步骤在 3D 中设计实体产品，CAD 精度与 GPT-6 Astra 相当，单次设计成本约低 150 倍。模型输出零件树、每步操作草图及中间实体，由 Hierarchical Composer 拆解装配与零件、Construction World Model 预测建造视觉步骤两阶段完成。", "type": "model", "relTime": "6天前"}, {"id": 100, "title": "美团LongCat-2.5多模态智能体模型发布", "source": "X：美团 LongCat (@Meituan_LongCat)", "sourceUrl": "https://x.com/Meituan_LongCat/status/2117264311714537633", "date": "2026-11-02T14:35:23.000Z", "summary": "推出 LongCat-2.5，我们最新的原生多模态智能体模型，总参数 1.6T，激活参数约 48B。  专为长程智能体任务打造，为从复杂编程项目到创意设计、3D 任务等视觉编程的各类工作带来更强的视觉理解与智能体编程能力。  了解更多 LongCat-2.5：https://longcat.ai/blog/longcat-2.5/", "type": "model", "relTime": "6天前"}, {"id": 101, "title": "美团龙猫发布 LongCat-2.5 原生多模态模型：1.6T 参数，面向长程智能体任务", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/020/873.htm", "date": "2026-11-02T01:18:38.433Z", "summary": "美团龙猫发布面向长程智能体任务的原生多模态模型 LongCat-2.5，总参数量 1.6 万亿，每个 token 激活约 480 亿参数，在 LongCat-2.0 基础上强化原生视觉理解与智能体编程能力。", "type": "model", "relTime": "6天前"}];
var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };
var TYPE_LABELS = { "paper":"论文", "model":"模型", "product":"产品", "tip":"技巧", "industry":"行业" };
function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";
  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();

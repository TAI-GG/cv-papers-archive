", "date": "2026-09-10T09:18:44.000Z", "summary": "深圳耐思人工智能技术负责人大明哥基于 OpenBMB 开源社区的 VoxCPM 语音合成模型，自研 S2S、MDN、QUIC 三条全语音链路，提出\"前端挂起式打断\"交互思路，并搭建面向数字分身人格刻画的六库系统。", "type": "model", "relTime": "14小时前"}, {"id": 17, "title": "高德发布 3D 原生城市世界模型 ABot-Earth 0.7，支持从星球到街景全尺寸生成", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/890.htm", "date": "2026-09-10T09:02:24.000Z", "summary": "高德发布 3D 原生城市世界模型 ABot-Earth 0.7，称其为全球首个全模态、可预测的 3D 原生城市世界模型，覆盖超过 196 个国家和地区。模型可从卫星图像或文字描述出发，10 分钟内在一块消费级 GPU 上生成公里级 3DGS 格式城市场景，效率较传统模式提升 1000 倍，已应用于飞行街景 2.0，体验官网同步上线。", "type": "model", "relTime": "15小时前"}, {"id": 18, "title": "DeepSeek 合并快速、专家、识图模式，计划推出 V4.1 Flash 并下线 V4 Pro", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2097973367374778569", "date": "2026-09-10T09:00:03.000Z", "summary": "DeepSeek 将快速、专家、识图三种模式合并升级，移除独立的专家模式选项，新模型同时具备日常对话、图片理解与复杂问题解决能力。公司计划在北京时间 9 月 10 日前后推出原生多模态的 V4.1 Flash；V4 Pro 服务定于北京时间 9 月 14 日中午结束，之后请求将被路由到 V4.1 Flash 并按其费率计费。", "type": "model", "relTime": "15小时前"}, {"id": 19, "title": "文远知行联合 Uber、AVOMO 获西班牙首张 L4 自动驾驶乘用车运营牌照", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/885.htm", "date": "2026-09-10T08:55:01.000Z", "summary": "文远知行 WeRide 与 Uber、AVOMO 获西班牙交通总局（DGT）依据 ES-AV 框架颁发的西班牙首张 L4 级自动驾驶乘用车运营牌照，获准在公共道路部署车辆。", "type": "industry", "relTime": "15小时前"}, {"id": 20, "title": "DeepSeek 发布 V4.1-Flash：新架构带来原生视觉理解与大幅降价", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2097970735591366804", "date": "2026-09-10T08:49:36.000Z", "summary": "DeepSeek 发布 V4.1-Flash，采用 Causal Encoder-Decoder 新架构并支持原生视觉理解，552B MoE 参数，输入处理激活 8B、输出生成激活 16B。", "type": "paper", "relTime": "15小时前"}, {"id": 21, "title": "阿里拟领投前实习生创办的 AI 评测公司 UniPat 3 亿美元融资，估值 25 亿美元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/856.htm", "date": "2026-09-10T08:29:09.000Z", "summary": "阿里巴巴集团拟领投 AI 训练与基准测试初创公司 UniPat AI 的 3 亿美元融资，本轮估值达 25 亿美元，腾讯控股及红杉等老股东也参与投资。UniPat 由去年在通义 AI 实验室从事后训练分析、数据合成和强化学习工作的李宽创办，为 AI 模型设计贴近真实使用环境的测试与评估场景，基准测试涵盖 AI 编程智能体、浏览器智能体及前沿多模态模型的视觉推理能力。", "type": "model", "relTime": "15小时前"}, {"id": 22, "title": "DeepSeek 发布 V4.1-Flash：新 Causal Encoder-Decoder 架构，带原生视觉理解", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2097962333767102665", "date": "2026-09-10T08:16:13.000Z", "summary": "DeepSeek 发布 V4.1-Flash，采用新 Causal Encoder-Decoder 架构并支持原生视觉理解，为其新架构家族中最小模型。该模型为 552B 参数 MoE，输入处理激活 8B、输出生成激活 16B；KV cache 需求较上一代降至 HBM 的 1/4、SSD 存储的 1/8，API 价格更低。", "type": "model", "relTime": "15小时前"}, {"id": 23, "title": "DeepSeek 发布 V4.1-Flash，API 价格同步下调", "source": "DeepSeek：API 更新日志", "sourceUrl": "https://api-docs.deepseek.com/zh-cn/updates#%E6%97%B6%E9%97%B4-2026-09-10", "date": "2026-09-10T05:58:04.695Z", "summary": "DeepSeek 发布 DeepSeek-V4.1-Flash，是全新模型结构系列中最小尺寸的模型，具备原生多模态视觉理解能力，评测包括 GPQA Diamond 90.9、HLE 36.8、Codeforces Rating 3471、Terminal-Bench 2.1 90.6 等。", "type": "model", "relTime": "18小时前"}, {"id": 24, "title": "DeepSeek 发布 V4.1 Flash 模型，基准超越 V4 Pro 并下调 API 定价", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/719.htm", "date": "2026-09-10T05:50:17.000Z", "summary": "深度求索正式发布 DeepSeek V4.1 Flash，为 552B 参数 MoE 模型，采用全新 Causal-Encoder-Decoder 结构，原生支持多模态，基准测试超越包括 DeepSeek V4 Pro 在内的旗舰模型。", "type": "model", "relTime": "18小时前"}, {"id": 25, "title": "DeepSeek 发布 V4.1 Flash：552B MoE 多模态模型，同步开源并下调 API 定价", "source": "公众号：DeepSeek（深度求索）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzk0OTYwNzc3NQ%3D%3D&mid=2247485817&idx=1&sn=627dd80114901f3fd8717e2c13feaf6a", "date": "2026-09-10T05:44:15.000Z", "summary": "DeepSeek 正式发布 V4.1 Flash，全新 Causal-Encoder-Decoder 结构的 552B 参数 MoE 模型，输入激活 8B、输出激活 16B，具备原生多模态视觉理解，基准测试超越包括 DeepSeek V4 Pro 在内的旗舰模型。", "type": "model", "relTime": "18小时前"}, {"id": 26, "title": "Dev Ed 实测用 MCP 把 Claude 接入 Blender，一句话 One-shot 完成可编辑建模", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2097902768946028979", "date": "2026-09-10T04:19:31.000Z", "summary": "Dev Ed 实测通过 Anthropic 的 MCP 协议把 Claude 接入 Blender，自然语言一句话即可 One-shot 完成建模。Claude 经 MCP 向 Blender 发送原生 Python 脚本，直接执行添加几何体、布尔运算、挂细分修改器、调整 Shader Node 等操作，生成可继续手动拖拽或对话微调的可编辑工程文件。", "type": "paper", "relTime": "19小时前"}, {"id": 27, "title": "成都 AI 系统治理龟速车，覆盖城区快速路及绕城高速，试行路段慢车降约 20%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/693.htm", "date": "2026-09-10T04:16:23.000Z", "summary": "成都交警去年上线的治理龟速车 AI 智慧系统近期在城区所有快速路及绕城高速完成部署。系统整合 ETC、卫星定位与视频感知数据识别超低速行驶车辆，通过 LED 屏提示，并核查驾车打电话等违法行为；自 2025 年 4 月试运行以来累计发布 LED 提示 3.1 万余次，监测路段龟速车数量同比下降约 20%。报道还提到成都一社区为独居老人安装毫米波雷达跌倒检测器，累计处置预警 66 条。", "type": "industry", "relTime": "19小时前"}, {"id": 28, "title": "DeepSeek 合并快速、专家、识图模式为统一智能模式，V4.1 Flash 最快今日发布", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/602.htm", "date": "2026-09-10T02:11:13.000Z", "summary": "DeepSeek 宣布将快速模式、专家模式和识图模式合并为统一的智能模式，模型可自动检测查询复杂度、在检测到图片输入时激活视觉能力并按任务难度调整处理能力。", "type": "model", "relTime": "21小时前"}, {"id": 29, "title": "Suno v6 发布，支持图片、视频和语音备忘录生成音乐", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2097846245540888664", "date": "2026-09-10T00:34:55.000Z", "summary": "Suno 发布 v6 模型，可将图片、视频和语音备忘录转化为音乐，并对已创建的歌曲进行精确修改。同时提供 v6-wild 版本供探索更多可能性，官方附有 2 分钟以内的功能演示视频。", "type": "model", "relTime": "23小时前"}, {"id": 30, "title": "OpenAI 收紧 ChatGPT 广告政策，禁止图像与音频生成类竞品广告", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/568.htm", "date": "2026-09-10T00:09:39.000Z", "summary": "据 The Information 报道，OpenAI 近期悄然更新广告政策，不再接受仅图像生成和语音生成类产品的广告审批，Adobe 美洲媒体高级总监 Doug Wyatt 证实了这一消息。", "type": "industry", "relTime": "23小时前"}, {"id": 31, "title": "Hugging Face 用 Gradio Workflow 重建 Workflow1111，复刻 AUTOMATIC1111 主要功能", "source": "Hugging Face：Blog（RSS）", "sourceUrl": "https://huggingface.co/blog/gradio-workflow-1111", "date": "2026-09-10T00:00:00.000Z", "summary": "Hugging Face 发布 Workflow1111，用 gr.Workflow 以 73 个节点、11 条媒体管线重建 AUTOMATIC1111 的大部分功能，覆盖文本生成图像、高清修复、图生图、prompt matrix、VLM 反推提示词、检测生成 inpaint 蒙版、ControlNet 式预处理器、背景移除、PNG Info 和图生视频。", "type": "paper", "relTime": "1天前"}, {"id": 32, "title": "Simon Willison 发布 .blend URL Viewer，可在浏览器查看 Blender 模型", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/9/blender-viewer", "date": "2026-09-09T23:58:32.000Z", "summary": "Simon Willison 发布 .blend URL Viewer，一个可在浏览器中查看 Blender 模型的工具。他用 ChatGPT Images 2.5 生成 Pluribus 主题法贝热彩蛋图片，再让运行 GPT-6 Astra（high）的 Codex 调用 Blender 本地技能，耗时 17m51s 生成多个 .blend 文件，现可通过该工具在线查看。", "type": "model", "relTime": "1天前"}, {"id": 33, "title": "Runway 上线 GPT-Image 2.5 及两款新模型", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2097814431912574991", "date": "2026-09-09T22:28:30.000Z", "summary": "GPT-Image 2.5 现已登陆 Runway。  Flare 速度更快，专为日常迭代与探索而打造。Sunburst 则面向精准编辑与最高保真度而设计。两者今日起与全球顶尖的图像和视频模型一同上线。  点击下方链接立即体验。", "type": "model", "relTime": "1天前"}, {"id": 34, "title": "Apple 推出 Reference Image 功能，用 iPhone 18 Pro 新传感器为照片签名防 AI 篡改", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/992766/apple-iphone-18-pro-reference-image", "date": "2026-09-09T19:30:12.000Z", "summary": "Apple 将随 iPhone 18 Pro 系列推出 Reference Image 功能，利用新相机传感器对 Reference 模式下拍摄的每个像素签名，经 Private Cloud Compute 生成不可更改的参考图像，可在 Photos 应用中与其他版本对比以发现编辑痕迹。", "type": "product", "relTime": "1天前"}, {"id": 35, "title": "GPT-Image-2.5 上线 Luma Agents，OpenAI 两款新图像模型同日可用", "source": "X：Luma AI (@LumaLabsAI)", "sourceUrl": "https://x.com/LumaLabsAI/status/2097763347743601096", "date": "2026-09-09T19:05:31.000Z", "summary": "GPT-Image-2.5 已上线 Luma Agents，OpenAI 当天发布的两款新图像模型均可使用。Flare 主打速度和批量出图，Sunburst 用于需要精确落点的编辑，可带参考图改掉不理想部分、保留其余内容，再接续生成视频。", "type": "model", "relTime": "1天前"}, {"id": 36, "title": "蚂蚁百灵 Ling-3.0-flash-VL 联合 Novita 上线 Hugging Face，免费体验 14 天", "source": "X：蚂蚁百灵 (@AntLingAGI)", "sourceUrl": "https://x.com/AntLingAGI/status/2097732934417649711", "date": "2026-09-09T17:04:40.000Z", "summary": "蚂蚁百灵宣布与 day0 合作伙伴 Novita 合作，Ling-3.0-flash-VL 现已可在 Hugging Face 上体验，免费 14 天。该模  "1天前"}, {"id": 42, "title": "网友热议是否给Altman寄SO-100机器人", "source": "X：Thomas Wolf（Hugging Face 联创/CSO） (@Thom_Wolf)", "sourceUrl": "https://x.com/Thom_Wolf/status/2097693534333579440", "date": "2026-09-09T14:28:06.000Z", "summary": "我们该把 @LeRobotHF 的 SO-100 寄给 @sama 呢，还是送他一台 3D 打印机和舵机，让他自己动手组装？", "type": "paper", "relTime": "1天前"}, {"id": 43, "title": "Amazon Prime Video 推出 AI 口型同步配音功能，首发《Maxton Hall》英语配音", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/991809/amazon-prime-video-ai-lip-sync-dubbing", "date": "2026-09-09T13:00:00.000Z", "summary": "Amazon Prime Video 推出新 AI 功能，通过 AI 与视觉特效技术让演员口型与\"人工配音\"音频同步。该功能目前仅适用于德剧《Maxton Hall》的英语配音，未来将扩展至更多剧集。口型同步配音现已在全球上线《Maxton Hall》第 1、2 季，并将随 12 月 9 日播出的第 3 季同步推出。", "type": "paper", "relTime": "1天前"}, {"id": 44, "title": "人社部发布第八批新职业：含具身智能机器人应用技术员等11个新职业和23个新工种", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/429.htm", "date": "2026-09-09T12:35:07.000Z", "summary": "人力资源社会保障部等部门发布第八批新职业，共11个新职业和23个新工种，其中包括具身智能机器人应用技术员、数字孪生工程技术人员、智能体开发员等。数字职业和绿色职业分别占45%和27%，2019年以来我国已累计发布八批共121个新职业。", "type": "industry", "relTime": "1天前"}, {"id": 45, "title": "GPT 图像生成质量大幅提升", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097664265419383216", "date": "2026-09-09T12:31:48.000Z", "summary": "用 GPT 也终于能吃上好的了😭  GPT Images 2.5|ZHOGUE|创意系列|ZHGO", "type": "paper", "relTime": "1天前"}, {"id": 46, "title": "OpenAI 发布 ChatGPT Images 2.5 双图像模型，主打更快生成与局部编辑", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/chatgpt-images-2-5-faster-more-precise-but-not-the-same-for-everyone", "date": "2026-09-09T12:17:58.000Z", "summary": "OpenAI 发布 ChatGPT Images 2.5，含 GPT-Image-2.5 Flare 和 GPT-Image-2.5 Sunburst 两个模型，主推更自然的光照、更可靠的参考图保留和局部编辑，Flare 延迟较 Images 2.0 降低最多 50%。", "type": "model", "relTime": "1天前"}, {"id": 47, "title": "Suno 发布用授权音乐训练的新模型 Suno v6，包含 base、wild、mini 三个版本", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/09/suno-replaces-its-ai-models-with-a-new-one-trained-on-licensed-music-as-copyright-suits-pile-up", "date": "2026-09-09T12:05:34.000Z", "summary": "Suno 发布新模型家族 Suno v6，称其使用 Warner Music Group、BMG、Believe 等授权数据训练，不使用训练旧版模型的数据。模型分三档：面向付费用户的 base 版更可控，付费用户可用的 wild 实验版用于获取意外结果，mini 版更快并对所有用户开放；新模型支持用提示词编辑歌曲片段、以文本图片或视频为参考生成曲目，并可分离乐器采样制作节拍。", "type": "model", "relTime": "1天前"}, {"id": 48, "title": "Suno 发布 v6 系列 AI 音乐模型，含 v6、v6-wild 和 v6-mini 三款", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/351.htm", "date": "2026-09-09T09:33:34.000Z", "summary": "Suno 推出 v6 系列 AI 音乐模型，包含 v6、v6-wild 和 v6-mini 三款，并与华纳音乐、BMG 等唱片公司达成合作。v6 主打旗舰，v6-wild 面向实验性音乐，仅 v6-mini 向免费用户开放，另两款需 Pro 或 Premier 订阅。生成速度更快，几秒即可出音乐，支持自然语言编辑歌曲片段、从多个音频源生成混音、单独提取采样，并可从音频或图片等多模态输入生成歌曲。", "type": "model", "relTime": "1天前"}, {"id": 49, "title": "万勋科技发布 NOVA2.0 柔性具身大脑，宣称行业首个开放世界全天候商业交付级具身智能架构", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/335.htm", "date": "2026-09-09T09:12:18.000Z", "summary": "万勋科技今日推出第二代柔性具身大脑 NOVA2.0，宣称是行业首个开放世界全天候商业交付级具身智能架构。该架构基于\"肌体智能\"理念，拥有触觉原生多模态分层架构，支持 1B+ 参数与 20 ms 极速轨迹生成，可适配柔性单臂、双臂、灵巧手等多种本体构型。官方称其已在 40+ 真实行业场景完成超 1000 万次极限工况作业。", "type": "paper", "relTime": "1天前"}, {"id": 50, "title": "GPT Image 2.5 动漫转真人仍显 AI 味", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097613016783344084", "date": "2026-09-09T09:08:09.000Z", "summary": "GPT Image 2.5 精准编辑能力出色，动漫转真人还原度高，但生成真人效果仍显油腻、AI 味浓。对比前代 GPT Image 2.0，其还原度虽好，真人质感依旧拉胯，被 Nano Banana Pro 明显超越。", "type": "paper", "relTime": "1天前"}, {"id": 51, "title": "GPT Img 2.5 个性表情包生成指南", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097592152113242550", "date": "2026-09-09T07:45:15.000Z", "summary": "GPT Img 2.5 风格参考与迁移能力增强，可生成个性化表情包，告别同质化风格。用户需注意参考素材的版权问题。作者分享了测试系列\"Elegant|ZHGO\"及提示词与参考图。", "type": "paper", "relTime": "1天前"}, {"id": 52, "title": "蚂蚁百灵 Ling 3.0 flash 获视觉升级", "source": "X：蚂蚁百灵 (@AntLingAGI)", "sourceUrl": "https://x.com/AntLingAGI/status/2097584809862394134", "date": "2026-09-09T07:16:04.000Z", "summary": "蚂蚁百灵（AntLingAGI）为 Ling 3.0 flash 加入视觉能力，可查看并分析图像。合作方 Atomic Chat 已推出 Ling 3.0 flash VL 的 GGUF 量化版本，支持本地运行，更多量化版本将陆续登陆边缘与终端设备。", "type": "paper", "relTime": "1天前"}, {"id": 53, "title": "蚂蚁百灵发布 Ling-3.0-flash-VL 多模态模型，SGLang 提供 Day-0 支持", "source": "X：蚂蚁百灵 (@AntLingAGI)", "sourceUrl": "https://x.com/AntLingAGI/status/2097583669926109550", "date": "2026-09-09T07:11:32.000Z", "summary": "蚂蚁百灵发布 Ling-3.0-flash-VL（124B/5.5B MoE），具备原生图像和视频理解与 1M 上下文窗口，SGLang 上线 Day-0 支持。模型采用 ViT 编码器加 MLP projector 的原生多模态方案、用于时空编码的 VideoRoPE，以及 42 层 KDA 加 Gated MLA 按 5：1 组成的混合骨干网络以支持 1M token 长上下文。", "type": "model", "relTime": "1天前"}, {"id": 54, "title": "QwenWork 上线多模态创作功能", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2097577314338918747", "date": "2026-09-09T06:46:17.000Z", "summary": "🎬 多模态创作现已在 QwenWork 上线。放入几张产品图片并告诉 QwenWork 你想要什么--它可以在一次对话中将其转化为可用于营销活动的产品视频、营销海报和原创配乐。无需切换工具，无需拼接工作流。只需带来创意，让 QwenWork 从原始素材到成品创意一气呵成。  👉 立即尝试：http://qwenwork.ai 了解更多：https://click.alibabacloud.c...", "type": "product", "relTime": "1天前"}, {"id": 55, "title": "GPT Images 2.5 实测：10轮后迷失但风格迁移惊艳", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097573152675316038", "date": "2026-09-09T06:29:45.000Z", "summary": "实测 GPT Images 2.5 会在 10 轮连续生成之后丢失任务/迷失自我  但这风格参考/迁移和设计能力简直夯爆了！  EleganCat|ZHGO|测试系列|GPT Images 2.5", "type": "paper", "relTime": "1天前"}, {"id": 56, "title": "GPT Images 2.5 风格参考能力大幅提升", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097548896969113663", "date": "2026-09-09T04:53:22.000Z", "summary": "GPT Images 2.5 的风格参考能力实现质的飞跃，配合 ChatGPT 内置手画板与参考图风格迁移，可生成高质量美图。中文用户通过 @绘图 即可打开手画板体验。", "type": "paper", "relTime": "1天前"}, {"id": 57, "title": "GPT Img 2.5 角色风格迁移实测：AI 味仍重", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097540972469215373", "date": "2026-09-09T04:21:52.000Z", "summary": "博主实测 GPT Images 2.5，角色特征迁移与风格夸张效果明显改善，噪点感和油腻感较上代减少。但生成结果仍带明显 AI 味，观感欠佳。", "type": "paper", "relTime": "1天前"}, {"id": 58, "title": "OpenAI 修复 ChatGPT 生图功能故障，持续约 7.5 小时", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/135.htm", "date": "2026-09-09T03:49:42.000Z", "summary": "OpenAI 官方状态页面显示，ChatGPT 和 Images API 的图像生成功能于北京时间 9 月 8 日 22：32 至 9 月 9 日 05：59 发生故障，持续约 7 小时 27 分钟。期间用户提交图像生成请求时出现更高频率错误，文件上传处理也受影响，部分文件停留在处理状态或直接失败。OpenAI 尚未披露故障的具体技术原因、受影响用户数量和预计恢复时间。", "type": "product", "relTime": "1天前"}, {"id": 59, "title": "消息称华为 Pura X View、Mate XT 2 非凡大师支持端侧本地大模型下载部署", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/103.htm", "date": "2026-09-09T03:37:43.000Z", "summary": "据博主 @超维界 透露，华为 Pura X View、Mate XT 2 非凡大师手机支持端侧本地大模型下载部署，可选多模态增强大模型（约 6GB）和多模态混合专家大模型（约 15GB）。两款模型均为端侧 AI，无网状态可用，前者支持本地图像生成、语音合成及相机 AI 超清增强等功能，后者为本地 MoE 大模型，可执行离线照片整理等复杂任务。", "type": "model", "relTime": "1天前"}, {"id": 60, "title": "SkyProduction 限免活动第二期：MiniMax H3 会员限时免费无限用", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI1MzE1NDc3Mg%3D%3D&mid=2247510280&idx=1&sn=ad53075e92be8b74c5db5d0a59f78d82", "date": "2026-09-09T03:30:14.000Z", "summary": "SkyProduction（天工工作台）9月9日至14日推出第二期限免活动，会员可免费无限使用自部署的 MiniMax H3 768P 模型。该通用多模态生成模型支持文生视频及参考图片、视频、音频联合生成，并输出原生立体声。平台同期提供剧本翻译、出海转绘、3D导演台及直出10分钟视频等短剧制作工具。", "type": "model", "relTime": "1天前"}, {"id": 61, "title": "京东云宣布与摩尔线程规划建设 10 万卡 AI 工厂", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/095.htm", "date": "2026-09-09T03:24:41.000Z", "summary": "在 2026 京东全球科技探索者大会上，京东云总裁曹鹏公布 AI 基建进展，京东云已与摩尔线程等打造国产万卡集群，并规划建设 10 万卡集群。数据方面京东云正推进 1，000 万小时数据采集，模型方面已形成覆盖多模态、世界模型和具身模型的 JoyAI 基础模型矩阵。摩尔线程张建中表示该 AI 工厂可用于训练大模型、生产词元和智能体，并希望服务各行业打造具身智能。", "type": "industry", "relTime": "1天前"}, {"id": 62, "title": "用 GPT Images 2.5 的手画板加参考图风格迁移出图", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097522787422535831", "date": "2026-09-09T03:09:37.000Z", "summary": "Zho 测试 GPT Images 2.5，配合 ChatGPT 内置手画板功能和参考图的风格迁移能力生成插画，图中展示手绘猫草图加参考海报生成风格化猫图的效果。作者转发 OpenAI 的说明，在 ChatGPT 输入 \"@ Sketch\" 即可使用手画板，中文用户通过 @绘图 打开。", "type": "tip", "relTime": "1天前"}, {"id": 63, "title": "蚂蚁百灵发布开源 Ling-3.0-flash-VL，首个原生多模态模型引入视觉反馈闭环", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/997.htm", "date": "2026-09-09T01:23:17.000Z", "summary": "蚂蚁集团发布并开源百灵系列首个原生多模态大模型 Ling-3.0-flash-VL。模型基于 Ling-3.0-flash 的 MoE 架构，总参数 124B、单次推理激活 5.5B，原生支持图像、文本与视频输入，上下文窗口 256K Token，并引入观察、行动、验证、修正的视觉反馈闭环机制。", "type": "model", "relTime": "1天前"}, {"id": 64, "title": "GPT images 2.5 初体验：设计效果对比", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097494469193105898", "date": "2026-09-09T01:17:05.000Z", "summary": "ZHO 发布 GPT images 2.5 初见面测试，沿用经典设计系列提示词，并引用其一年前 GPT image 2 的生成效果作对比。引用推文显示，GPT 4o 当时已能产出\"绝美海报设计\"，此次 2.5 版本效果引发关注。", "type": "paper", "relTime": "1天前"}, {"id": 65, "title": "蚂蚁百灵开源首个原生多模态大模型 Ling-3.0-flash-VL", "source": "公众号：蚂蚁百灵（Ling）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkyODk2MDQwNw%3D%3D&mid=2247487806&idx=1&sn=a5593017ab8960be3d55614bb5a0b826", "date": "2026-09-09T01:00:00.000Z", "summary": "蚂蚁百灵发布并开源首个原生多模态大模型 Ling-3.0-flash-VL，基于 Ling-3.0-flash 的 MoE 架构，总参数 124B，单次推理激活 5.5B，原生支持图像、文本与视频输入，上下文窗口 256K Token。", "type": "model", "relTime": "1天前"}, {"id": 66, "title": "OpenAI 上线 GPT Image 2.5，作者实测新版与 image2 的生图差异", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247510824&idx=1&sn=025a8b7c5fec54d8a00c8632f55f8d98", "date": "2026-09-09T00:27:00.000Z", "summary": "OpenAI 上线 GPT Image 2.5，主打更快生成、更高清、多轮编辑一致性和区域标注精修，并新增涂鸦绘图与 15 个图片模版功能。API 同步发布 GPT-Image-2.5 Flare（速度提升 50%）和 GPT-Image-2.5 Sunburst（更高精度）。", "type": "product", "relTime": "1天前"}, {"id": 67, "title": "OpenAI 发布 ChatGPT Images 2.5 图像生成功能", "source": "X：Tibo (@thsottiaux)", "sourceUrl": "https://x.com/thsottiaux/status/2097476797298520292", "date": "2026-09-09T00:06:52.000Z", "summary": "OpenAI 发布 ChatGPT Images 2.5，主打更快、更清晰、更智能的图像生成。更新包括更快的生成速度、更自然可辨识的图像保真度、多次编辑间细节保持一致，以及通过评论式修改只改动想要的部分。", "type": "paper", "relTime": "1天前"}, {"id": 68, "title": "BestBlogs 早报：ChatGPT Images 2.5 与 MiniCPM5-2B 发布", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2097476246791922171", "date": "2026-09-09T00:04:41.000Z", "summary": "BestBlogs 早报汇总 09-09 要闻：OpenAI 推出 ChatGPT Images 2.5，每周生成超 30 亿张图片，延迟最高降低 50%；面壁智能开源 MiniCPM5-2B，以 2B 参数登顶 AA 榜单全球 4B 以下第一。另有 OpenAI 解决 Navier-Stokes 千年难题、Google DeepMind 发布 AlphaGenome Atlas 等动态。", "type": "model", "relTime": "1天前"}, {"id": 69, "title": "OpenAI 推 Images 2.5，Grok Bot 获委托，Claude 托管实践", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2097476201904472266", "date": "2026-09-09T00:04:30.000Z", "summary": "OpenAI 发布 ChatGPT Images 2.5，每周生成超 30 亿张图，延迟较 Images 2.0 最高降 50%，强化参考对象保持与局部编辑。Grok Bot 产品负责人复盘一个月打造可信 Agent 的委托体验。Claude 圆桌展示三家团队基于 Managed Agents 构建会议、销售与产品分析产品。", "type": "product", "relTime": "1天前"}, {"id": 70, "title": "视频为何仍然如此昂贵？视频与音视频 LLM 推理效率机制综述", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.10355", "date": "2026-09-09T00:00:00.000Z", "summary": "一篇综述系统梳理了 VideoLLM 的推理效率机制，按帧采样、模态编码、连接器 token 压缩、LLM 预填充与解码四个流水线阶段归类方法，覆盖 2022 年底以来的 VideoLLM 及更早的帧采样与视觉编码器机制。该综述汇总了共享宿主模型与输入协议下的精度-成本对比，并指出音视频效率与标准化评测方面的空白。", "type": "model", "relTime": "2天前"}, {"id": 71, "title": "Show-Harness：仅靠 VLM 智能体就能操控机器人", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.10522", "date": "2026-09-09T00:00:00.000Z", "summary": "Show-Harness 是一种 Embodied Harness，通过离散语义动作单元接口让 VLM 智能体直接\"玩\"机器人，无需额外模型容量或昂贵的具身预训练。", "type": "model", "relTime": "2天前"}, {"id": 72, "title": "Programmable World Model：将世界状态演化与视觉生成解耦的可编程世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.10540", "date": "2026-09-09T00:00:00.000Z", "summary": "Programmable World Model 将世界状态演化与视觉观察生成解耦，由智能体把自然语言指令翻译为可执行程序，指定实体状态与状态转移规则，再由轻量引擎维护包含屏幕外实体和非视觉属性的持久全局世界状态。", "type": "model", "relTime": "2天前"}, {"id": 73, "title": "OpenAI 发布 ChatGPT Images 2.5 生图模型，延迟降低 50% 并新增 Sketch 草图功能", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/967.htm", "date": "2026-09-08T23:52:06.000Z", "summary": "OpenAI 9 月 9 日发布 ChatGPT Images 2.5，图像生成延迟最多降低 50%，新增 Sketch 草图参考、模板库、图片内评论标注等功能，为当前最先进的图像生成模型。DeepSeek 宣布将于 9 月 10 日 12 时起下调 Flash 系列模型价格，输出价格调整为每百万 Token 4 元。", "type": "model", "relTime": "2天前"}, {"id": 74, "title": "OpenAI 发布 ChatGPT Images 2.5，延迟降低 50% 并新增 Sketch 草图", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/956.htm", "date": "2026-09-08T23:00:42.000Z", "summary": "OpenAI 于 9 月 9 日发布图像生成模型 ChatGPT Images 2.5，在细节锐度、自然光照和纹理提升的同时，延迟较 2026 年 4 月的 Images 2 最多降低 50%。", "type": "model", "relTime": "2天前"}, {"id": 75, "title": "OpenAI 发布 ChatGPT Images 2.5 图像生成模型", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/8/introducing-chatgpt-images-25", "date": "2026-09-08T22:46:33.000Z", "summary": "OpenAI 推出 ChatGPT Images 2.5，官方称其图像模型已在 ChatGPT Images 和 API 的 GPT-Image 模型中生成超过 30 亿张图片。", "type": "model", "relTime": "2天前"}, {"id": 76, "title": "StealthGPT 发布 Super 新一代 AI 人性化改写模型", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2097425742959349988", "date": "2026-09-08T20:44:00.000Z", "summary": "StealthGPT 发布全新 AI 人性化改写模型 Super，从底层重构以针对最新一代 AI 检测器。Super 通过重写 AI 生成文本的结构、节奏和措辞，同时保留原意与可读性。StealthGPT 称，Super 能持续绕过 Pangram 检测，且不出现常见的人性化改写质量下降问题。", "type": "model", "relTime": "2天前"}, {"id": 77, "title": "OpenAI 发布 ChatGPT Images 2.5，新增 Sketch 涂鸦生图功能", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/991727/openai-chatgpt-images-2-5-sketch", "date": "2026-09-08T20:16:09.000Z", "summary": "OpenAI 于周二发布 ChatGPT Images 2.5，并推出新功能 Sketch，用户在聊天框输入 @Sketch 即可弹窗手绘涂鸦，再让 ChatGPT 依草图生成图像，还能直接在图片局部留言修改。", "type": "paper", "relTime": "2天前"}, {"id": 78, "title": "Krea AI 上线 GPT Images 2.5，真实感与编辑一致性提升", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2097418604715348236", "date": "2026-09-08T20:15:38.000Z", "summary": "Krea AI 宣布推出 GPT Images 2.5 图像生成模型。新版本带来更强的真实感、一致的编辑能力和更快的生成速度，用户可立即试用。", "type": "model", "relTime": "2天前"}, {"id": 79, "title": "Inception 扩散大语言模型 Mercury 2.5 在 OpenRouter 全面开放", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2097405053942563057", "date": "2026-09-08T19:21:47.000Z", "summary": "Inception 的 Mercury 2.5 现已在 OpenRouter 全面可用，地址为 https://openrouter.ai/inception/mercury-2.5。它是一个扩散式大语言模型，可并行解码 token 而非逐个生成，是 OpenRouter 最快模型榜单上无需专用硬件的最快模型，在代码密集型提示上收益最大。", "type": "model", "relTime": "2天前"}, {"id": 80, "title": "OpenAI 推出 ChatGPT Images 2.5，图像生成更快更准", "source": "X：Greg Brockman (@gdb)", "sourceUrl": "https://x.com/gdb/status/2097400146220740627", "date": "2026-09-08T19:02:17.000Z", "summary": "OpenAI 推出 ChatGPT Images 2.5，重点提升图像生成速度和保真度，使图像更自然、更可辨识。新版本还支持多次编辑中保持细节一致，并新增评论式修改，只改动用户指定的部分。Greg Brockman 转发了该发布公告。", "type": "paper", "relTime": "2天前"}, {"id": 81, "title": "OpenAI 宣布 ChatGPT Images 2.5 升级，同时推出 Sketch 画图功能", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2097399767915499797", "date": "2026-09-08T19:00:47.000Z", "summary": "OpenAI 宣布 ChatGPT Images 2.5 升级，带来更快的输出、更好的保真度以及代与代之间更强的生成一致性。同期刊发的官方推文介绍 Sketch 功能，用户在 ChatGPT 中输入 \"@ Sketch\" 即可手绘草图，把脑中的想法直观展示给模型。", "type": "model", "relTime": "2天前"}, {"id": 82, "title": "OpenAI 发布 ChatGPT Images 2.5，图像生成更快更清晰", "source": "X：OpenAI (@OpenAI)", "sourceUrl": "https://x.com/OpenAI/status/2097394956457623964", "date": "2026-09-08T18:41:39.000Z", "summary": "OpenAI 发布 ChatGPT Images 2.5，官方称图像生成更快、更清晰、更智能。改进包括提升生成速度、更自然可辨识的图像保真度、多次编辑间保持细节一致，以及支持基于评论的编辑，只改动想改的部分。", "type": "paper", "relTime": "2天前"}, {"id": 83, "title": "OpenAI 用上万智能体求解 Navier-Stokes 千禧年大奖难题", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2097389034230501620", "date": "2026-09-08T18:18:08.000Z", "summary": "OpenAI 宣布给出 Navier-Stokes 千禧年大奖难题的一个解，证明由一组智能体使用一个显著强于 GPT-6 Astra 的下一代模型生成，该问题关于光滑三维流体运动是否会崩溃，已悬置约 90 年。", "type": "paper", "relTime": "2天前"}, {"id": 84, "title": "Google 更新 AI 天气模型 WeatherNext 3，提升预报准确度", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/science/2026/09/googles-ai-weather-model-now-uses-more-raw-satellite-data", "date": "2026-09-08T18:00:56.000Z", "summary": "Google 发布 WeatherNext 模型第 3 版，最大变化是开始纳入部分卫星天气数据，缩短了从当前天气状况到生成新预报之间的滞后时间。该模型在保持与传统模型相近预报性能的同时，所需算力大幅降低，可更频繁运行。更新细节已在一份白皮书中公布。", "type": "model", "relTime": "2天前"}, {"id": 85, "title": "Krea 推出 Realtime Director 实时导演工具", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2097383941380694430", "date": "2026-09-08T17:57:53.000Z", "summary": "推出 Realtime Director。  这款新工具可让你实时导演高质量视频生成。  由 @fal 的 H3 Max 提供支持。", "type": "paper", "relTime": "2天前"}, {"id": 86, "title": "OpenAI 称用智能体组合和强于 GPT-6 Astra 的下一代模型给出 Navier-Stokes 千禧年难题解法", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2097377214941597729", "date": "2026-09-08T17:31:10.000Z", "summary": "OpenAI 宣布给出 Navier-Stokes 千禧年大奖难题的一个解法，证明由一组智能体使用一个 OpenAI 下一代模型完成，官方称该模型能力显著强于 GPT-6 Astra。该问题关注 Navier-Stokes 方程描述的三维光滑流体运动是否会失解，约 90 年未决。Elvis Saravia 转发并评论称，若 GPT-6 Astra 已有此水平，下一代模型值得期待。", "type": "paper", "relTime": "2天前"}, {"id": 87, "title": "TestingCatalog 转述 OpenAI 宣布智能体团队解决 Navier-Stokes 千禧年大奖难题", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2097375715704340707", "date": "2026-09-08T17:25:12.000Z", "summary": "TestingCatalog 转述 OpenAI 官方宣布：一组由其下一代模型驱动的智能体给出了 Navier-Stokes 千禧年大奖难题的解。OpenAI 称该模型能力显著强于 GPT-6 Astra；该问题关乎 Navier-Stokes 方程描述的三维光滑流体运动是否会崩溃，约 90 年未获解决。作者附加评语 Level 4 - Innovators。", "type": "tip", "relTime": "2天前"}, {"id": 88, "title": "S1 机器人基础模型：提示词可操控性演示", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2097372419988263383", "date": "2026-09-08T17:12:06.000Z", "summary": "Skild AI 的机器人基础模型 S1 仅需 1 个视频示例即可学习新任务，并通过视频提示词操控行为。在相同厨房环境中，S1 能依据 4 种不同视频指令执行相应动作序列，包括\"将盘子放入烤面包机\"这类分布外任务。该能力决定新任务是否需要重新训练，或成机器人基础模型最具经济价值的特性。", "type": "model", "relTime": "2天前"}, {"id": 89, "title": "作者发布浏览器端 LLM 注意力权重可视化工具", "source": "Hacker News：AI 热帖", "sourceUrl": "https://ishamf.dev/p/llm-attention-visualizer", "date": "2026-09-08T16:59:41.000Z", "summary": "作者发布一个基于 Transformers.js 的 LLM 注意力可视化工具，可悬停查看生成 token 依赖的历史 token，代码开在 GitHub。可视化将所有层、所有注意力头的注意力权重乘以 value 向量模长后聚合为单一数值控制透明度，并预生成提示词避免下载数百 MB 模型；作者还通过修改 onnx 文件暴露内部值，上传到自己的 Hugging Face 仓库供浏览器生成使用。", "type": "tip", "relTime": "2天前"}, {"id": 90, "title": "蚂蚁百灵开源 Ling-3.0-flash-VL 多模态模型", "source": "X：蚂蚁百灵 (@AntLingAGI)", "sourceUrl": "https://x.com/AntLingAGI/status/2097359640233439299", "date": "2026-09-08T16:21:19.000Z", "summary": "蚂蚁百灵今日开源 Ling-3.0-flash-VL，提供 BF16 和 FP8 权重，FP4 和 INT4 版本即将推出。该模型除视觉识别外，还能理解图像、视频、文档与 UI，按视觉线索进行推理、搜索与验证，并可使用工具、检查结果并交付结果。", "type": "model", "relTime": "2天前"}, {"id": 91, "title": "宇树G1机器人格斗演示：快速反应惊艳", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2097339184948076674", "date": "2026-09-08T15:00:03.000Z", "summary": "中国的机器人格斗场景刚刚升级了。一段新演示显示，宇树科技的G1机器人能够连贯执行动作并以惊人速度做出反应。其世界模型读取视觉输入，预测接下来会发生什么，并从预定义动作库中选择最佳响应。G1仍无法自主规划新动作。但说实话，机器人格斗正是从这里开始变得令人兴奋：虽尚未完全智能，但已经足够快速、灵敏，让人难以忽视。", "type": "model", "relTime": "2天前"}, {"id": 92, "title": "OpenAI Astra 通关 48 关《我不是机器人》游戏引出人机验证失效之辩", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2097332900265934869", "date": "2026-09-08T14:35:04.000Z", "summary": "OpenAI 发布 4 天的 Astra 看屏幕、挪鼠标、点拖拽，打完 48 关《我不是机器人》讽刺游戏并取得人类证书。作者提醒同一套能力在官方安全报告中被标为网络安全最高危档，认为 GUI 成为模型天然 API 后，不愿交出人脸、指纹和硬件密钥的普通人反而会被系统当成可疑假人。", "type": "tip", "relTime": "2天前"}, {"id": 93, "title": "字节跳动拟推Seedance空间视频模型", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2097330053944377546", "date": "2026-09-08T14:23:46.000Z", "summary": "据彭博社报道，字节跳动正准备最快于下月推出一款基于Seedance的空间视频模型。创始人张一鸣亲自督办该项目，不过计划仍可能有变。该模型将创建可交互的3D世界，能够响应Pico用户的语音和动作。据称输出可达20fps，延迟0.05秒。云端生成可降低头显设备要求，将与Google、Meta和Apple的竞争转向AI模型、算力和内容层面。", "type": "model", "relTime": "2天前"}, {"id": 94, "title": "发布仅 4 天的 Astra 模型通关\"我不是机器人\"全部 48 关", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2097329116995363134", "date": "2026-09-08T14:20:02.000Z", "summary": "作者转述：发布仅 4 天的模型 Astra 通关了\"我不是机器人\"游戏全部 48 关，全程约 2 小时的过程被压成 3 分半一镜到底视频，证书名字栏填的是它自己。对比来看，人类自己打完这 48 关通常要 30 到 60 分钟，作者称通关率约百分之一。", "type": "tip", "relTime": "2天前"}, {"id": 95, "title": "Adobe Premiere 更新 AI 功能，时间线上可直接生成音视频素材", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/926.htm", "date": "2026-09-08T13:21:33.000Z", "summary": "Adobe 宣布重新设计 Premiere 的 AI 交互，新的生成式媒体工具支持在时间线空白区域直接生成视频、音效、音乐和声景，无需切换应用。时间线可调用 Adobe Firefly、谷歌 Veo、Runway、Luma 和可灵等多种底层模型。", "type": "model", "relTime": "2天前"}, {"id": 96, "title": "Premiere 推出 Generative Media 工具，可在时间线内直接生成视频和音频", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/991133/adobe-is-trying-to-make-its-ai-generators-idiot-proof-in-premiere", "date": "2026-09-08T13:00:00.000Z", "summary": "Adobe 为 Premiere 推出 Generative Media 工具，编辑可在项目时间线内高亮空缺直接生成视频、音效、音乐和声景，无需离开项目。", "type": "paper", "relTime": "2天前"}, {"id": 97, "title": "OpenAI 发布 ChatGPT Images 2.5 图像模型", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "sourceUrl": "https://openai.com/index/introducing-chatgpt-images-2-5", "date": "2026-09-08T11:30:00.000Z", "summary": "OpenAI 发布 ChatGPT Images 2.5 图像模型，生成延迟比 Images 2.0 降低最多 50%，细节、编辑精度、参考照片保真度和多轮编辑一致性均有提升。", "type": "model", "relTime": "2天前"}, {"id": 98, "title": "inclusionAI 发布 Ling-3.0-flash-VL-int4 模型", "source": "蚂蚁 inclusionAI：HuggingFace 新模型", "sourceUrl": "https://huggingface.co/inclusionAI/Ling-3.0-flash-VL-int4", "date": "2026-09-08T10:22:40.000Z", "summary": "inclusionAI 在 HuggingFace 发布 Ling-3.0-flash-VL-int4 模型。该模型为视觉语言模型的 int4 量化版本，具体参数规模、上下文长度与性能基准未在页面中披露。目前该模型页面因访问限制仅显示错误提示，需创建或登录 HuggingFace 账号并配置 HF_TOKEN 方可查看详情。", "type": "model", "relTime": "2天前"}, {"id": 99, "title": "inclusionAI 发布 Ling-3.0-flash-VL-fp4 模型", "source": "蚂蚁 inclusionAI：HuggingFace 新模型", "sourceUrl": "https://huggingface.co/inclusionAI/Ling-3.0-flash-VL-fp4", "date": "2026-09-08T10:22:02.000Z", "summary": "inclusionAI 在 HuggingFace 发布 Ling-3.0-flash-VL-fp4 模型。该模型为 fp4 精度版本，属于 Ling-3.0-flash 系列的多模态视觉语言模型。目前该模型页面因访问量过大触发限流，用户需创建或登录 HuggingFace 账号，并在使用 API 时提供 HF_TOKEN 方可继续访问。", "type": "model", "relTime": "2天前"}, {"id": 100, "title": "新石器无人车落地韩国济州岛，首度在当地户外度假场景实现运营", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/760.htm", "date": "2026-09-08T07:41:23.000Z", "summary": "新石器联合韩国自动驾驶企业 NT1 及济州岛 Campertree（香樟树）酒店，令无人配送车首次在韩国户外度假场景投入运营。该车可在度假村内部公开道路自主行驶，承担客房配送与行李运送，并通过视觉感知与端到端神经网络技术实现全链路自动驾驶。此前新石器已于 2025 年 7 月与仁川市政府签署试点意向书，成为首家进入韩国市场的中国 L4 级无人配送企业。", "type": "paper", "relTime": "2天前"}, {"id": 101, "title": "微信开源多模态嵌入模型 WeMM-Embedding，已在微信大规模使用且日调用量达 10 亿次", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/527.htm", "date": "2026-09-08T01:02:16.000Z", "summary": "微信 AI 于 9 月 4 日宣布开源通用多模态嵌入模型 WeMM-Embedding，包含 2B、4B、9B 三个版本，支持文本、图像、视频、视觉文档及任意交错的多模态输入。", "type": "model", "relTime": "2天前"}, {"id": 102, "title": "NOAH：学习完整患者病程的多模态时间感知生成模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.09140", "date": "2026-09-08T00:00:00.000Z", "summary": "NOAH 是一个时间感知、任务无关的生成式 Transformer 模型，用于表征和预测完整的多模态患者病程。该模型基于 MIMIC 数据集家族中 29.9 万名患者的 43.1 万次住院产生的超 5.59 亿条临床事件训练，原生处理医学影像、时间序列、数值信号、分类事件及结构化与非结构化临床记录。", "type": "model", "relTime": "3天前"}, {"id": 103, "title": "Marigold V2：用扩散Transformer重做单目深度估计", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.08084", "date": "2026-09-08T00:00:00.000Z", "summary": "Marigold V2 提出基于扩散Transformer（DiT）架构的单目深度估计新方法，支持从预训练多步流匹配模型单步推理，并可按需量化以降低运行成本。通过将模型内部表征与真实语义特征对齐、采用基于新型Sinkhorn损失的两阶段微调协议，模型在KITTI和ETH3D上的AbsRel较此前最优结果提升16-26%，并能清晰还原皮毛、 foliage 等细薄边缘。", "type": "model", "relTime": "3天前"}, {"id": 104, "title": "CoVeR：面向 VLM 多视图 3D 推理的基于覆盖率的 token 剪枝方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.08345", "date": "2026-09-08T00:00:00.000Z", "summary": "CoVeR 是一种无需训练的确定性视觉 token 选择器，仅利用 token 坐标实现场景全覆盖，以解决多视图 3D 推理中现有剪枝方法的冗余与预算限制问题。在三个 3D 推理基准上，CoVeR 均超越此前 SOTA，并可作为即插即用模块适配四种 VLM。仅保留约 8% 的视觉 token，即可维持全量 token 93.5% 的性能，平均超出 SOTA 3.9 个百分点。", "type": "paper", "relTime": "3天前"}, {"id": 105, "title": "TANGO：面向杂乱环境的全身视觉-语言-动作人形机器人导航框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.09158", "date": "2026-09-08T00:00:00.000Z", "summary": "TANGO 提出首个面向杂乱环境的全身视觉-语言导航框架，支持语言指令下的人形机器人穿越复杂 3D 空间。该模型直接预测 29-DoF 关节空间动作，完全在仿真中训练，通过全局路径规划、运动编辑与 RL 跟踪合成无碰撞行为。TANGO 在仿真中达到 SOTA 性能，并零样本部署至 Unitree G1 人形机器人，无需真实导航数据即可实现稳健的语言引导穿越。", "type": "model", "relTime": "3天前"}, {"id": 106, "title": "Mask Forcing：通过双噪声掩码滚动提升自回归视频扩散蒸馏质量", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.09123", "date": "2026-09-08T00:00:00.000Z", "summary": "针对自回归视频扩散模型在分布匹配蒸馏中因逆向KL目标导致模式坍缩、生成视频过饱和与过平滑的问题，研究者提出Mask Forcing策略。该方法在自回归学生模型自滚动过程中沿空间与时间轴注入随机掩码，以引入更干净的信号并缓解模式坍缩。实验表明，该方法能高效提升多种自回归视频扩散蒸馏方法的视觉质量，且无需真实视频数据或额外后训练阶段。", "type": "model", "relTime": "3天前"}, {"id": 107, "title": "PlannerForge：面向自动驾驶运动规划器的LLM智能体场景测试框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.08965", "date": "2026-09-08T00:00:00.000Z", "summary": "PlannerForge 是一个 LLM 智能体框架，覆盖从场景生成到 ADS 评估的全部场景测试阶段，并新增 ADS 增强与 ADS 基准测试两个环节。在 10 个现成 LLM、5 种提示条件下，各任务最佳得分为 0.88-1.00，开源 20-35B 后端在多数任务上追平商业 API。", "type": "model", "relTime": "3天前"}, {"id": 108, "title": "今天的一个想法， 文本大模型与视频大模型定位的拐点到来了， 这两种模型之前看上去不存在上下游关系， 但是现在变成了\"显式符号/几何模拟（3D引擎 + 符号逻辑）\" →\"隐式统计生成（像素级视频生成扩散…", "source": "X：karminski (@karminski3)", "sourceUrl": "https://x.com/karminski3/status/2097043972640420167", "date": "2026-09-07T19:26:58.000Z", "summary": "暂无摘要", "type": "model", "relTime": "3天前"}, {"id": 109, "title": "Unitree 发布首个世界模型驱动的自主人形机器人格斗视频 UnifoLM-X2-1.0", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2097023203231297887", "date": "2026-09-07T18:04:27.000Z", "summary": "Unitree 发布首个由世界模型驱动的自主人形机器人格斗视频，UnifoLM-X2-1.0 通过实时预测与规划取代人类操作员。相比现有 G1-Boxing 方案，世界模型在机器人行动前预测物理交互的走向，为策略提供决策依据；格斗等场景中延迟至关重要，Unitree 称 X2-1.0 可实时运行该循环。", "type": "model", "relTime": "3天前"}, {"id": 110, "title": "GPT-6 Astra 可视化热门 AI 论文测试", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2097009154963419528", "date": "2026-09-07T17:08:37.000Z", "summary": "在 GPT-6 Astra 上测试可视化热门 AI 论文。  从这篇精美生成的 Transformer 论文交互式版本开始。  这为探索研究开启了新方式。", "type": "paper", "relTime": "3天前"}, {"id": 111, "title": "NVIDIA Sol 团队发布 Sol-H3，MiniMax-H3 视频生成速度超过播放速度", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2097006566696444363", "date": "2026-09-07T16:58:20.000Z", "summary": "NVIDIA Sol 团队与 MiniMax 合作发布 Sol-H3 端到端推理加速栈，在 8× NVIDIA B300 Blackwell 上生成 5 秒 1344×768 立体声视频仅需 1.653 秒，相比 50 步 Base H3 最高提速 15.54×，且在 1×、4×、8× B300 上均可扩展。", "type": "paper", "relTime": "3天前"}, {"id": 112, "title": "GPT 6 Astra 实测解决真实世界问题", "source": "X：Greg Brockman (@gdb)", "sourceUrl": "https://x.com/gdb/status/2096998038443348263", "date": "2026-09-07T16:24:27.000Z", "summary": "GPT 6 Astra （Ultra） 通过约4分钟视频理解用户描述的浴室排水管缠发问题，提取语音并匹配测量画面，提出改进方案。它使用计算机操作在 Fusion 360 中实时设计出全参数化零件，用户 3D 打印后首次尝试即完美适配，称其为\"接触 AGI 的时刻\"。", "type": "paper", "relTime": "3天前"}, {"id": 113, "title": "Astra 视觉优势助其社交媒体胜出", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2096997239281385549", "date": "2026-09-07T16:21:16.000Z", "summary": "我认为这不是最初的目标，但 Astra 在视觉美观的 3D 作品（如 Blender 等）方面表现出色，这使它在社交媒体注意力之争中比 Fable 更具感知优势。其他类型的输出更难评判，但视觉内容的效果一目了然。", "type": "paper", "relTime": "3天前"}, {"id": 114, "title": "Gemini 也能生成毒舌机器人了", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2096994065497649521", "date": "2026-09-07T16:08:40.000Z", "summary": "Gemini 现在也能做出毒舌机器人了 💅", "type": "paper", "relTime": "3天前"}, {"id": 115, "title": "Runway 推出 Adobe 插件，Premiere Pro 和 After Effects 内可直接生成和编辑", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/company-news/runway-for-adobe", "date": "2026-09-07T16:00:00.000Z", "summary": "Runway 发布 Runway Plugins，面板可直接嵌入 Premiere Pro 和 After Effects，无需导出导入即可在时间线内生成图像和视频、重渲染片段并一键放置结果。", "type": "paper", "relTime": "3天前"}, {"id": 116, "title": "消息称字节跳动开发实时空间视频生成 AI 模型，张一鸣亲自督导，最快下月发布", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/478.htm", "date": "2026-09-07T13:51:53.000Z", "summary": "据彭博社报道，字节跳动正开发实时空间视频生成 AI 模型，创始人张一鸣亲自督导研发，计划最早下月发布，发布时间尚未最终确定。该模型基于电影级视频生成模型 Seedance 构建，面向直播、短剧和游戏创建交互式虚拟世界，可在每秒 20 帧帧率下以约 50 毫秒延迟按需生成视频流，响应 Pico 头显用户的语音或动作。", "type": "industry", "relTime": "3天前"}, {"id": 117, "title": "京东 JoyAI App 推出首个能实时视频购物的 AI 数字人", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/415.htm", "date": "2026-09-07T10:46:50.000Z", "summary": "京东 JoyAI App 推出可实时视频购物的 AI 数字人，通过\"万能博士\"在视频通话内实时解析商品画面、调取京东商品并直接下单，全程不切换 App。用户上传一张图片即可自定义数字人形象、人设、音色和交互场景，数字人还支持点外卖、订酒店、健康咨询、金融咨询等服务，支付环节搭载京东 AI 付声纹验证。今年以来 JoyAI App 对话用户数增速超过 15 倍。", "type": "product", "relTime": "3天前"}, {"id": 118, "title": "实时视频生成来临：下一个应用爆发的机会", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/crossing/the-next-big-app-opportunity-when-real-time-video-generation", "date": "2026-09-07T09:05:00.000Z", "summary": "实时视频生成技术正走向成熟，被视为下一个应用爆发的关键机会。该技术有望大幅降低视频制作门槛，推动内容创作、互动娱乐等领域出现新形态产品。行业正密切关注其落地节奏与商业化潜力。", "type": "product", "relTime": "3天前"}, {"id": 119, "title": "最高法发布涉人工智能纠纷案件审理意见，明确 AI 换脸拟声等裁判规则", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/313.htm", "date": "2026-09-07T07:46:08.000Z", "summary": "最高人民法院发布《关于依法审理涉人工智能纠纷案件的意见》，共 5 部分 24 条，明确 AI 换脸拟声、AI 复活逝者、大数据杀熟、仿冒名人带货、网络开盒及自动驾驶事故等情形的裁判规则。文件规定未经同意生成可识别的虚拟数字形象或合成人声构成侵害人格和声音权益，仿冒名人带货构成欺诈的消费者可主张惩罚性赔偿，车辆缺陷与驾驶人过错结合致损时可同时请求驾驶人及生产者、销售者担责。", "type": "industry", "relTime": "3天前"}, {"id": 120, "title": "UCF-Net：融合CLIP与DINO的不确定性感知级联融合网络，提升Deepfake图像检测泛化能力", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.07670", "date": "2026-09-07T00:00:00.000Z", "summary": "UCF-Net提出一种不确定性感知级联融合网络，结合CLIP的语义先验与DINO的自监督视觉结构先验，通过跨Transformer层级的特征提取、分层专家聚合及基于熵的加权融合，提升对未见伪造图像的检测泛化能力。", "type": "paper", "relTime": "4天前"}, {"id": 121, "title": "RelightFormer：用于多视角物体重打光的自回归生成式Transformer", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.07414", "date": "2026-09-07T00:00:00.000Z", "summary": "RelightFormer是一种前馈生成式Transformer，可直接对单视角和多视角图像进行重打光，绕过了显式的固有属性估计。该架构从视频基础模型适配而来，通过潜在光照模块和置换不变位置编码处理无序多视角输入。研究团队构建了包含90K物体和39K种独特光照的Laval Objaverse数据集（LOD），实验显示其在单视角、多视角及新视角重打光任务上达到SOTA视觉质量并具备强零样本泛化能力。", "type": "model", "relTime": "4天前"}, {"id": 122, "title": "为 Cosmos3 视觉-语言-动作策略加入希腊语：语言迁移测量研究", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.07470", "date": "2026-09-07T00:00:00.000Z", "summary": "一项研究尝试为 Cosmos3 视觉-语言-动作策略加入希腊语，发现机器翻译演示数据容易，但验证效果极难，五种常用评测工具均误报成功。研究确认目标语言演示数据必要但不充分：双语策略在九十任务上对希腊语的跟随率约为英语的五分之二，且从语言适配的世界模型热启动或解冻文本塔均使效果更差。", "type": "model", "relTime": "4天前"}, {"id": 123, "title": "ReactVAU：面向流式视频异常理解的慢-快解耦框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.07941", "date": "2026-09-07T00:00:00.000Z", "summary": "ReactVAU提出一种慢-快解耦框架，用于实时流式视频异常理解（VAU）。其轻量级快检测模块基于Spatial Grid Folding（SGF）持续过滤异常，异常感知持久记忆（AAPM）保护关键视觉线索，重型慢推理模块仅在可疑事件触发时激活。在多个基准上，ReactVAU在严格流式约束下实现检测与因果推理的竞争性能，并通过减少重型MLLM调用显著提升计算效率。", "type": "paper", "relTime": "4天前"}, {"id": 124, "title": "CosmoH2G：面向复杂空间运动物体操作的手到夹爪迁移数据集与基线方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.07498", "date": "2026-09-07T00:00:00.000Z", "summary": "CosmoH2G 提出一种可扩展的数据采集流程，构建了包含 6，189 个演示片段、覆盖 1，254 个独特物体的手-夹爪配对数据集，其空间复杂度显著高于现有基准。针对复杂空间运动中端到端生成夹爪位姿序列易累积误差的问题，该方法采用两阶段框架：先预测稀疏关键帧，再生成完整连续动作序列，并对平移进行后优化。仿真与真实机器人实验表明，该方法在复杂空间操作的手到夹爪迁移中显著优于传统基线。", "type": "paper", "relTime": "4天前"}, {"id": 125, "title": "DF26 基准：现有检测手段已难以分辨 AI 生成视频与真实视频", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.07369", "date": "2026-09-07T00:00:00.000Z", "summary": "DF26 基准针对单人物公开演讲场景评测 AI 生成视频检测，包含 271 个真实视频和由七个现代视频模型生成的 2，420 个合成视频。结果显示人类和最先进的 deepfake 检测器准确率都接近随机水平，暴露出当前评测协议的局限，并提出了对现代生成模型分布偏移保持鲁棒性的基准需求。", "type": "paper", "relTime": "4天前"}, {"id": 126, "title": "Viggle 发布 Viggle-Animate，可三步在本地 PC 上将任意角色替换进视频", "source": "X：Viggle AI (@ViggleAI)", "sourceUrl": "https://x.com/ViggleAI/status/2096724465094689195", "date": "2026-09-06T22:17:22.000Z", "summary": "Viggle 感谢 @cocktailpeanut 的实测反馈，称 Viggle-Animate 效果好于预期，并给出 Hugging Face 开放入口 https://huggingface.co/Viggle/Viggle-Animate。引用内容称该工具只需单帧即可生成，无需 pose/mask/face/depth 工作流，质量超出预期。", "type": "paper", "relTime": "4天前"}, {"id": 127, "title": "H Company 发布 NeoMME 260M/800M 单塔多模态编码器，取消视觉塔和因果解码器", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/06/h-company-releases-neomme-a-family-of-260m-and-800m-single-tower-multimodal-encoders-that-drop-the-vision-tower-and-causal-decoder", "date": "2026-09-06T21:06:41.000Z", "summary": "H Company 发布 NeoMME 系列多模态编码器，包含 260M 和 800M 两个双向 Transformer 模型，用单一塔处理多语言文本和 32×32 图像块，去掉了独立视觉塔和因果解码器，以离散掩码扩散方式预训练。", "type": "model", "relTime": "4天前"}, {"id": 128, "title": "GPT-6 Astra 百款演示分类盘点", "source": "X：Deedy Das (@deedydas)", "sourceUrl": "https://x.com/deedydas/status/2096652977952202922", "date": "2026-09-06T17:33:18.000Z", "summary": "我浏览了数百个 GPT-6 Astra 演示，并将最佳案例进行了整理和分类。  远不止那些 3D Blender 演示，还包括： - 3D（三维建模、教育、游戏） - 机器人控制 - 音乐生成 - 纯视觉 - 生物 - UI - 计算机操作（绘画、游戏、Figma） - 金融  在视觉、计算机操作、空间推理和原始智能方面，这确实是一款非常强大的模型。  1/22", "type": "model", "relTime": "4天前"}, {"id": 129, "title": "Travis Kalanick 旗下 Atoms 或将进入 robotaxi 业务", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/06/travis-kalanicks-atoms-might-be-getting-into-the-robotaxi-business", "date": "2026-09-06T16:45:00.000Z", "summary": "据 Financial Times 报道，Travis Kalanick 创办的 Atoms 正准备大规模招聘和收购，可能成为自动驾驶行业的重要玩家，并已与 Uber 商谈让其使用 Atoms 的 robotaxi 技术。", "type": "industry", "relTime": "4天前"}, {"id": 130, "title": "AI 短剧带火人脸授权生意，普通人数字肖像每部约 100 元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/037.htm", "date": "2026-09-06T14:06:14.000Z", "summary": "据央视财经报道，AI 短剧和数字广告扩张带动数字人脸素材采购需求，人脸授权平台将授权人分为普通人和专业演员两类。普通人的数字肖像按每部短视频约 100 元付费，专业演员按使用范围和剧集长度定价，从 500 元到数千元，成交后平台与授权人按比例分成。", "type": "industry", "relTime": "4天前"}, {"id": 131, "title": "微软发布 AI 快速入门指南，30 分钟即可生成并发布 WinUI 原生应用", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/015.htm", "date": "2026-09-06T11:17:12.000Z", "summary": "微软发布快速入门指南，开发者借助 AI、VS Code、winapp CLI 和 GitHub Copilot 免费版，从空文件夹开始约 30 分钟即可创建并发布 WinUI 3 应用，无需安装 Visual Studio，流程包括让 AI 智能体添加功能、测试、打包成 MSIX 并提交 Microsoft Store。", "type": "product", "relTime": "4天前"}, {"id": 132, "title": "Google 与 DeepMind 发布 WeatherNext 3：跳过物理模拟，直接从实时卫星数据学习天气预报", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/googles-weathernext-3-ditches-physics-simulations-and-learns-weather-directly-from-live-satellite-data", "date": "2026-09-06T10:36:35.000Z", "summary": "Google Research 与 DeepMind 发布 AI 天气模型 WeatherNext 3，不再依赖传统物理模拟，直接处理实时地球静止卫星数据，每小时生成一次预报。", "type": "paper", "relTime": "4天前"}, {"id": 133, "title": "阑夕用《帝国时代II》奇观类比解读SOTA模型的领先周期", "source": "X：阑夕 (@foxshuo)", "sourceUrl": "https://x.com/foxshuo/status/2096532057237422318", "date": "2026-09-06T09:32:48.000Z", "summary": "阑夕提出，新模型发布首日Demo刷屏、次日集体反思已是固定节奏，SOTA模型本身也是一种「奇观」。他以《帝国时代II》的奇观机制作比：GPT-4是维持最久的一座奇观，发布一年后才被Claude 3 Opus攻破；2025年后前沿模型差距变小，领先通常三个月内被追平，AI大厂必须在新奇观建成前不断开建下一座。", "type": "tip", "relTime": "4天前"}, {"id": 134, "title": "阿里千问开源 Qwen-Drive-1.0-4B 自动驾驶视觉语言模型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/997.htm", "date": "2026-09-06T09:15:06.000Z", "summary": "阿里千问本周开源 Qwen-Drive-1.0-4B，一款基于 Qwen3.5-4B 构建的自动驾驶视觉语言基础模型，官方称其为首个面向自动驾驶的视觉语言基础模型。", "type": "model", "relTime": "4天前"}, {"id": 135, "title": "博主把视频制作流程做成主动引导式 Skill，一个爆贴一天涨粉 4000", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2096499131347071048", "date": "2026-09-06T07:21:58.000Z", "summary": "阿易转发大雷（@AaronYiaazw）的视频制作教程案例：后者把完整视频制作流程做成主动引导式 Skill，已发布在 GitHub（image-story-video-wizard），一个爆贴一天涨了 4000 粉。安装后在 Codex 或 WorkBuddy 中启动 Skill，即可按流程一步步引导完成视频制作；完整安装方法、制作流程和踩坑见其教程文章。", "type": "tip", "relTime": "4天前"}, {"id": 136, "title": "Astra 进军医学应用场景", "source": "X：Greg Brockman (@gdb)", "sourceUrl": "https://x.com/gdb/status/2096485443667890228", "date": "2026-09-06T06:27:35.000Z", "summary": "Astra 进军医学应用场景  【引用 @HandEManAI】：我完全惊呆了！  这仅仅来自一个提示词，让 Astra（medium）制作一段我们手外科医生做的肌腱转位手术（EIP 到 EPL 肌腱转位）视频。  很兴奋能继续探索其在手术教育、患者教育和机器人模拟中的应用！", "type": "paper", "relTime": "4天前"}, {"id": 137, "title": "公安部发布\"国家反诈 AI\"App，微信、支付宝小程序同步开放", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/922.htm", "date": "2026-09-06T05:44:45.000Z", "summary": "公安部宣布，由公安部刑侦局指导、上海市公安局自主研发的\"国家反诈 AI\"App 正式上线，微信、支付宝小程序同步开放，用户可在各大手机应用市场下载。该 App 融合大语言、多模态模型和智能体技术，提供 AI 大模型智能问答、反诈资讯和反诈辞典三大功能，可对用户输入的可疑场景完成风险研判、识别诈骗套路并推送典型案例，从文字、语音、视频多个维度拆解诈骗手法并提供防范对策。", "type": "model", "relTime": "4天前"}, {"id": 138, "title": "蚂蚁 inclusionAI 发布块扩散视觉语言 GUI 智能体 LLaDA-UI", "source": "蚂蚁 inclusionAI：HuggingFace 新模型", "sourceUrl": "https://huggingface.co/inclusionAI/LLaDA-UI", "date": "2026-09-06T05:08:15.000Z", "summary": "蚂蚁 inclusionAI 在 Hugging Face 发布 LLaDA-UI，一个基于 MoE 的块扩散视觉语言 GUI 智能体，总参数约 16.7B，语言骨干为 LLaDA2.0-mini-base。", "type": "paper", "relTime": "4天前"}, {"id": 139, "title": "CVRR：让潜在视觉推理成为预测的必要路径", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.06746", "date": "2026-09-06T00:00:00.000Z", "summary": "CVRR通过从问题隐藏状态初始化循环计算并反复重读固定视觉证据，在解码前移除视觉状态和原始多模态KV cache，使循环计算成为唯一携带图像信息的预测路径。在V^*、MMVP、BLINK和MME-RealWorld-Lite基准上，CVRR保持强性能，而兼容的潜在推理器在相同约束下重训仍无法恢复同等视觉能力。因果干预表明预测对循环内容敏感，持久视觉证据会因果性地修正循环轨迹。", "type": "paper", "relTime": "5天前"}, {"id": 140, "title": "智能体视觉生成：从生成模型到智能体控制", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.06758", "date": "2026-09-06T00:00:00.000Z", "summary": "视觉生成正从单次调用的生成模型演变为可规划、选工具、检查中间输出并修正失败的智能体控制流程。本文按控制器能直接控制的内容划分层级：L1条件控制、L2执行控制、L3结果自适应控制、L4经验自适应控制，L0固定支持指无控制器的固定流程。该框架适用于图像、视频、编辑、3D、世界模型、幻灯片及UI生成。", "type": "model", "relTime": "5天前"}, {"id": 141, "title": "MovieGrid：面向长视频多镜头生成的多网格后训练范式", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.06373", "date": "2026-09-06T00:00:00.000Z", "summary": "MovieGrid提出多网格后训练范式，将长视频分解为按时间排序的短片段并排列在空间网格上联合建模，减少每个时间轴处理的镜头数并支持跨片段信息交换。基于1，000个长视频构建的MGLV数据集产出54K网格视频，在相同token预算下，MovieGrid生成的镜头数是Temporal Packing的6.05倍。", "type": "paper", "relTime": "5天前"}, {"id": 142, "title": "Simon Willison 实测 GPT-6 Astra 开发者版本", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/5/introducing-gpt-6-astra-for-developers", "date": "2026-09-05T23:27:48.000Z", "summary": "Simon Willison 分享对面向开发者的 GPT-6 Astra 的试用印象：Astra 在细节把握、理解用户提示词和构建更复杂输出方面全面提升，尤其擅长 3D 建模，他见过它生成花园、船厂、动物、城市景观甚至戴森球的精美渲染，并成功生成了骑自行车的鹈鹕戴红色领巾的场景。", "type": "tip", "relTime": "5天前"}, {"id": 143, "title": "特斯拉：预计将于下月实现 Robotaxi 自动驾驶无人出租车 24 小时全天候运营", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/849.htm", "date": "2026-09-05T23:14:44.000Z", "summary": "暂无摘要", "type": "paper", "relTime": "5天前"}, {"id": 144, "title": "Grok Imagine Video 1.5 Agent 上线，底层换用 Image 2.0 图像模型", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2096332080929968424", "date": "2026-09-05T20:18:10.000Z", "summary": "Grok Imagine Video 1.5 agent 现已可用，由最新的 Image 2.0 图像模型驱动，官方称质量更高、叙事更强，并擅长以更好的连续性衔接多个镜头。TestingCatalog 用 \"Make me an ad banner for @testingcatalog\" 实测后认为结果相当不错。", "type": "model", "relTime": "5天前"}, {"id": 145, "title": "GPT-6 Astra 两小时生成玛雅遗址3D模型", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2096314593182171545", "date": "2026-09-05T19:08:41.000Z", "summary": "我现在简直难以置信。  GPT-6 Astra 真是一个令人惊叹的模型。  它花了大约 2 小时生成了苏南图尼奇（Xunantunich）的 3D 模型，这是伯利兹西部的一处玛雅考古遗址。", "type": "model", "relTime": "5天前"}, {"id": 146, "title": "OnSolo 年付计划上线，Seedance 2.0 视频低至 $0.066/秒", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2096300727279005837", "date": "2026-09-05T18:13:35.000Z", "summary": "OnSolo 推出年付计划，Seedance 2.0 720p 视频生成价格降至 $0.066/秒，5 秒片段仅需 $0.33，较原价节省 9%-45%。低成本让 AI 视频试错更划算，用户可大量探索运镜、节奏与种子等变量。", "type": "paper", "relTime": "5天前"}, {"id": 147, "title": "Grok Imagine Video 1.5 agent 上线，由 Image 2.0 模型驱动", "source": "X：Andrew Milich (@milichab)", "sourceUrl": "https://x.com/milichab/status/2096298464632299599", "date": "2026-09-05T18:04:35.000Z", "summary": "Grok Imagine Video 1.5 agent 现已可用，由最新的 Image 2.0 模型驱动。作者称它结合了编码智能体与图像、视频模型的能力，用于智能化的创意叙事，画质更高，更擅长以更强的连贯性衔接多个镜头。", "type": "model", "relTime": "5天前"}, {"id": 148, "title": "Astra 生成圣经天使图像引热议", "source": "X：Emad Mostaque (@EMostaque)", "sourceUrl": "https://x.com/EMostaque/status/2096296066677108768", "date": "2026-09-05T17:55:04.000Z", "summary": "别让 Astra 制作符合圣经描述、细节详尽的天使 👼 👁️ 🪽", "type": "paper", "relTime": "5天前"}, {"id": 149, "title": "GPT-6 Astra 生成 3D 内容能力惊人", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2096288397811679718", "date": "2026-09-05T17:24:35.000Z", "summary": "GPT-6 Astra 在生成 3D 内容方面简直不可思议。  \"生成一个 Grok Bot 版本的 Codex Micro。\"  现在我非常想要这个！  只需一个提示词。想象它还能做什么--稍后我会分享更多惊人的示例。", "type": "paper", "relTime": "5天前"}, {"id": 150, "title": "GPT-6 Astra 重建布列纪念堂 3D 模型", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2096270461122347131", "date": "2026-09-05T16:13:19.000Z", "summary": "Ethan Mollick 让 GPT-6 Astra 依据布列 1784 年未建成建筑\"牛顿纪念堂\"的几张黑白草图与文字描述，构建出完整 Blender 模型，并生成带旁白的漫游视频。此前 Gemini 图像生成器（nano banana）也曾据原图对该建筑进行成像。", "type": "model", "relTime": "5天前"}, {"id": 151, "title": "解放军总医院第六医学中心完成全球首例 AI 超声机器人引导下先天性心脏病封堵术", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/823.htm", "date": "2026-09-05T13:11:10.000Z", "summary": "9 月 5 日上午，解放军总医院第六医学中心心血管病医学部完成人工智能超声机器人引导下先天性心脏病介入封堵术，经科技查新为全球首例同类智能技术临床应用。患者为 48 岁男性，确诊房间隔缺损且缺损边缘解剖条件较差。该系统由朱航主任团队与清华科研团队联合研发，通过机械臂自主扫查、AI 自动甄别病灶、构建心脏三维模型并规划手术路径，实现影像识别与手术操作的双向智能协同，提升了手术精准度与安全性。", "type": "model", "relTime": "5天前"}, {"id": 152, "title": "微软发布 MAI-Image-2.6-Flash：生图速度是 GPT Image 2 的 2 倍", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/747.htm", "date": "2026-09-05T06:58:19.000Z", "summary": "微软于 9 月 4 日发布自研图像生成模型 MAI-Image-2.6-Flash，并通过 Microsoft Foundry 开放公开预览。该模型与旗舰版 MAI-Image-2.6 共享文生图和图像编辑核心能力，重点优化速度与成本；微软 AI 负责人 Mustafa Suleyman 称其生图速度是 GPT Image 2 的 2 倍，GPU 效率提高 72%。", "type": "model", "relTime": "5天前"}, {"id": 153, "title": "@t_mux 的视频重拍摄模型即将开源，可从单段视频生成冻结时间环绕镜头", "source": "X：Viggle AI (@ViggleAI)", "sourceUrl": "https://x.com/ViggleAI/status/2096122559771148370", "date": "2026-09-05T06:25:36.000Z", "summary": "@t_mux 受 The World Labs 发布的 Atlas 启发，展示了一个可将已有视频从不存在的新相机视角重新拍摄的视频模型，演示了从单段视频围绕猫做冻结时间环绕拍摄。作者称模型仍处于早期粗糙阶段，但权重和代码即将开源，ViggleAI 转发并预告开源消息，同时征集想重拍的视频。", "type": "model", "relTime": "5天前"}, {"id": 154, "title": "Ethan Mollick 转发调侃：Astra 用 VBA 在电子表格里做出了 Space Invaders", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2096096763153105214", "date": "2026-09-05T04:43:06.000Z", "summary": "Ethan Mollick 引用网友关于 zork 转 3D、Fortnite 转文本的玩笑帖，称已有人把 Space Invaders 做成电子表格，由 Astra 用 VBA 实现，并附上视频。", "type": "tip", "relTime": "5天前"}, {"id": 155, "title": "百度智能云发布百度搭子教学套件，围绕教学场景提供四大核心能力", "source": "公众号：百度智能云（文心）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzA5NTQ5MzE5OQ%3D%3D&mid=2653160075&idx=1&sn=5cce58a2bdfb187adf8e7d2f45efce0e", "date": "2026-09-05T02:00:00.000Z", "summary": "百度智能云推出百度搭子教学套件，围绕教学场景提供教学方案设计、公开课设计、AI课程改造和知识图谱构建四项核心能力。老师提交课程资料后可唤起秒哒生成可交互的3D课件；AI课程改造从内容适配性、学生受益度等五个维度评估课程并提供16课时标准课程骨架；知识图谱支持六种概念关系识别，可输出交互式HTML和PNG。", "type": "paper", "relTime": "5天前"}, {"id": 156, "title": "VDiff-Bench：面向细粒度图像差异识别的挑战性基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.06245", "date": "2026-09-05T00:00:00.000Z", "summary": "VDiff-Bench 发布，这是一个针对多模态大语言模型（MLLM）细粒度图像差异识别的多项选择基准，包含 1，756 道四选一问题，覆盖位置、运动、噪声/分辨率、纹理等 10 类变化。", "type": "model", "relTime": "6天前"}, {"id": 157, "title": "DriveZero：超越人类驾驶日志的端到端自动驾驶方案", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.06055", "date": "2026-09-05T00:00:00.000Z", "summary": "DriveZero 提出不依赖人类驾驶日志的端到端自动驾驶方案，将驾驶拆分为感知与动作两个模型分别预训练后统一为规划器。动作侧 DriveRL 采用混合智能体闭环强化学习，感知侧 DriveVFM 融合 DINOv3、SigLIP2 等冻结视觉基础模型。", "type": "model", "relTime": "6天前"}, {"id": 158, "title": "Uno 扩散增强 LLM 论文提出无损并行 token 生成，最高 3x 加速", "source": "X：DAIR.AI (@dair_ai)", "sourceUrl": "https://x.com/dair_ai/status/2096010455210959202", "date": "2026-09-04T23:00:09.000Z", "summary": "arXiv 论文（2609.04010）提出 diffusion-augmented LLMs，即 Uno，一类在自回归模型分布上用扩散并行抽取多个 token 的新模型。", "type": "paper", "relTime": "6天前"}, {"id": 159, "title": "Sam Altman 在 Bloomberg 澄清 GPT-6 Astra 并非因网络安全担忧被暂停的模型", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2095988755060633604", "date": "2026-09-04T21:33:55.000Z", "summary": "Sam Altman 在 Bloomberg Television 表示，GPT-6 Astra 不是因网络安全担忧被暂停的那个模型，被暂停的是一个未来模型，Astra 已完成训练一段时间。他还称 Astra 达到了 cyber-critical 级别。完整视频来自 Bloomberg Television YouTube 频道。", "type": "tip", "relTime": "6天前"}, {"id": 160, "title": "fofr 分享一段「去公园喂鸭子」的生成视频", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2095973163632836708", "date": "2026-09-04T20:31:58.000Z", "summary": "fofr 发布了一段视频，配文「Perfectly normal trip to the park to feed the ducks.（非常平常的去公园喂鸭子）」，以看似普通的日常场景展示生成视频效果。", "type": "tip", "relTime": "6天前"}, {"id": 161, "title": "Tesla 展示 Cybercab 如何用机器人保持车身清洁", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2095962486566732236", "date": "2026-09-04T19:49:32.000Z", "summary": "DogeDesigner 分享一段视频，展示 Tesla Cybercab 的清洁方式，由机器人来完成清洁工作，作者称之为 a robot for a robot。", "type": "paper", "relTime": "6天前"}, {"id": 162, "title": "Viggle 发布首个开放权重模型 Viggle-Animate", "source": "X：Viggle AI (@ViggleAI)", "sourceUrl": "https://x.com/ViggleAI/status/2095924668758655163", "date": "2026-09-04T17:19:16.000Z", "summary": "Viggle 发布首个开放权重模型 Viggle-Animate，基于 MiniMax-H3 构建，可从一帧重绘帧替换视频中的人物，渲染时无需姿势骨架、遮罩或文本提示。模型经 3 次前向传播可在 26 秒内生成 5 秒视频，已在 Hugging Face 开放（https://huggingface.co/viggle/viggle-animate）。", "type": "model", "relTime": "6天前"}, {"id": 163, "title": "Microsoft 发布 MAI-Image-2.6-Flash 图像模型，速度与价格性能领先", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2095923346462384261", "date": "2026-09-04T17:14:00.000Z", "summary": "Mustafa Suleyman 宣布 Microsoft 新图像模型 MAI-Image-2.6-Flash 开放体验，称其生成速度比 GPT-Image-2 快 2 倍，GPU 使用效率高 72%，可提供更低价格。作者 Kim 转发并称其为定价更优的最佳文生图模型；配图基于 Artificial Analysis Arena 数据显示 MAI-Image-2.6 与 Flash 处于质量...", "type": "model", "relTime": "6天前"}, {"id": 164, "title": "Visko 发布 Orbis 1.0 评测报告：实时交互长视频生成在人类 Arena 总分 1，838 排名第一", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2095921609924333855", "date": "2026-09-04T17:07:06.000Z", "summary": "Visko 公布 Orbis 1.0 的评测结果：在自动化基准中于 DOVER 美学与技术和 VideoAlign 视觉与运动质量得分最高，并在 VideoPhy-2、Physics-IQ、VBench-2.0 Physics 三个物理合理性协议领先；在随机化人类 Arena 研究中总偏好和时间稳定性均排第一。", "type": "paper", "relTime": "6天前"}, {"id": 165, "title": "Microsoft AI 发布图像模型 MAI-Image-2.6-Flash，速度比 GPT-Image-2 快 2 倍", "source": "X：Mustafa Suleyman（Microsoft AI CEO） (@mustafasuleyman)", "sourceUrl": "https://x.com/mustafasuleyman/status/2095907880209641517", "date": "2026-09-04T16:12:33.000Z", "summary": "Microsoft AI CEO Mustafa Suleyman 宣布新图像模型 MAI-Image-2.6-Flash 开放使用， "微信开源多模态嵌入模型 WeMM-Embedding，含 2B/4B/9B 三个版本", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/599.htm", "date": "2026-09-04T13:21:17.000Z", "summary": "微信 AI 宣布开源通用多模态嵌入模型 WeMM-Embedding，含 2B、4B、9B 三个版本，支持文本、图像、视频、视觉文档及交错多模态输入。模型基于 Qwen3.5 多模态架构，WeMM-Embedding-9B 在 MMEB-v2 榜单以 80.6 分位列第一；该模型已大规模部署于视频号、直播、公众号、电商与朋友圈的推荐与搜索系统，日调用量达 10 亿量级。", "type": "model", "relTime": "6天前"}, {"id": 172, "title": "玉伯用 YouMind 把 UTC 时区疑问变成讲解视频", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2095857355410047094", "date": "2026-09-04T12:51:47.000Z", "summary": "作者 Frank Wang 玉伯把关于 UTC、中国东八区和闰秒（原文写作\"润秒\"，2026 年 10 月可能取消）的疑惑，作为一句话输入给 YouMind：搜索 UTC 的详细资料，面向中学生，图文并茂讲解清楚，做一个 PPT 和视频。YouMind 生成了一个讲解视频，作者称消费就是创作、创作就是消费，邀请大家体验 YouMind 的创作即消费。", "type": "tip", "relTime": "6天前"}, {"id": 173, "title": "Wan 联合 GMI Cloud 在台北举办 AI 电影创作挑战赛，60 余名创作者用 Wan3.0 产出 17 部短片", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2095847664638419210", "date": "2026-09-04T12:13:16.000Z", "summary": "上周末在台北，Wan 与 GMI Cloud 联合举办沉浸式 AI 电影创作挑战赛，汇聚 19 支团队共 60 余名 AI 视频从业者，基于最新的 Wan3.0 AI 视频模型在数小时内创作出 17 部 AI 生成短片。活动邀请金马奖获奖导演参与圆桌讨论并担任评委，获奖视频已发布在 YouTube 播放列表。", "type": "industry", "relTime": "6天前"}, {"id": 174, "title": "阿易评 Higgsfield 用 GPT-6 Astra 从口语描述生成白宫椭圆形办公室 3D 场景", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095846225677549615", "date": "2026-09-04T12:07:33.000Z", "summary": "博主转发并点评 Higgsfield 的实测演示，GPT-6 Astra 把口语描述的布景感觉编译成场景代码，在超算集群驱动 Blender 和 Cycles 物理光追引擎，端到端算出白宫椭圆形办公室。原文指出三点变化：自然语言被编译为程序化空间拓扑，交付的是 Blender 里可二次修改的真实模型而非写死视频，渲染难题通过代码交给成熟光线追踪引擎完成。", "type": "tip", "relTime": "6天前"}, {"id": 175, "title": "Instagram AI 内容标签再陷混乱，The Verge 实测发现只有 Meta 自家信号能触发标注", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/989617/instagram-ai-content-label-confusion", "date": "2026-09-04T12:00:00.000Z", "summary": "The Verge 记者实测发现，Instagram 的 AI Content 标签持续误标普通照片，而带 C2PA 和 SynthID 信号的 Gemini 完全生成图片反而未被标注。", "type": "tip", "relTime": "6天前"}, {"id": 176, "title": "DeepSeek-V4-Flash-Vision-Exp 上线 SiliconFlow，支持视觉理解与 1M 上下文", "source": "X：硅基流动 SiliconFlow (@SiliconFlowAI)", "sourceUrl": "https://x.com/SiliconFlowAI/status/2095832456108888217", "date": "2026-09-04T11:12:50.000Z", "summary": "DeepSeek-V4-Flash-Vision-Exp 现已上线 SiliconFlow，也可通过 OpenRouter 使用。该模型基于 V4 Flash 加入视觉理解能力，面向多模态任务和 Agent，保留较强文本能力，支持 1M 上下文，MIT 许可。SiliconFlow 定价为缓存输入 $0.028 / M tokens、输入 $0.44 / M tokens、输出 $1.32 ...", "type": "model", "relTime": "6天前"}, {"id": 177, "title": "为什么 AI 生成的食物图片看起来那么诡异", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/989376/ai-generated-food-why-does-it-look-like-that", "date": "2026-09-04T11:00:00.000Z", "summary": "The Verge 撰文解释餐厅和品牌用 AI 生成的食物宣传图为何频繁出现虫状面条、孔洞和裂纹等问题。牛津大学的 Chris Russell 指出扩散模型先恢复粗结构、后补细节，结构错了细节只会更怪；那不勒斯费德里科二世大学的 Giovanbattista Califano 称扩散模型难以生成细长连续结构，导致意面状伪影和密集孔洞。", "type": "tip", "relTime": "6天前"}, {"id": 178, "title": "OpenAI 发布 Astra 模型，单张照片可在 Blender 还原可编辑 3D 豪宅", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095815989514657915", "date": "2026-09-04T10:07:24.000Z", "summary": "AYi 转引 @tomkrcha 对 OpenAI 新模型 GPT-6 Astra 的内测实测：输入一张房子平面照片，Astra 在 Blender 中还原出包含家具、电器和玩具的完整 3D 模型。所有零件为可手动拖拽微调的真实几何体，而非不可修改的面条网格，并能在本地设备以 60 帧像游戏一样实时渲染漫游。作者认为这可能重写游戏工业与空间设计的生产流程。", "type": "model", "relTime": "6天前"}, {"id": 179, "title": "博主实测 Fotor Video Agent：10 分钟生成 60 秒可编辑科普动画", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095812224338333955", "date": "2026-09-04T09:52:27.000Z", "summary": "博主实测 Fotor Video Agent，仅用提示词和一次方案确认，约 10 分钟生成一条 60 秒水循环科普 MG 动画，而同类外包通常要 3000 到 8000 块、一两周。产出包含 6 章旁白脚本、Kian 中文男声配音、15 个独立 MG 场景、8 处场景音效和可编辑多轨时间线，改场景、文字、颜色和声音无需重抽。作者认为这类结构清晰的内容可批量生产，但打动人仍靠选题、脚本和审美。", "type": "tip", "relTime": "6天前"}, {"id": 180, "title": "HappyHorse 1.1 与 Kling 3.0 同条件对比实测", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2095798104603976052", "date": "2026-09-04T08:56:20.000Z", "summary": "作者批评网上常见的视频模型对比不严谨，用相同提示词、相同参考图、相同时长且不剪辑的方式实测 HappyHorse 1.1 与 Kling 3.0。对比覆盖口型同步、角色与场景一致性、复杂运动、镜头控制和价格五个维度，作者认为 HappyHorse 1.1 在跨镜头一致性上明显更稳，在广告和电商场景下需要更少的重生成，更快达到可交付成片，但强调两个模型各有强项。", "type": "tip", "relTime": "6天前"}, {"id": 181, "title": "阿里云展示 Qwen 生成演示并提供 Qwen Cloud 与 Model Studio API 入口", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2095774894730412375", "date": "2026-09-04T07:24:07.000Z", "summary": "阿里云发布一段生成演示视频，配文为提示词样例\"Fly， my winged unicorn， take me anywhere in the world my heart desires…\"，并提供更多 API 访问入口：Qwen Cloud（https://click.qwencloud.com/m/20000003017/）和 Model Studio（https://click.ali...", "type": "model", "relTime": "6天前"}, {"id": 182, "title": "Fotor Video Agent 实测：几句提示词生成 1 分钟水循环科普动画", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095772519672504379", "date": "2026-09-04T07:14:40.000Z", "summary": "作者实测 Fotor Video Agent，仅用几句提示词、约 10 分钟生成一条 60 秒水循环 MG 科普动画，此前同类外包约需 3000 到 8000 元、制作一两周。", "type": "tip", "relTime": "6天前"}, {"id": 183, "title": "论文《Do LLMs Capture the Diversity in their Training Data？》发现 LLM 输出多样性低于训练数据", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2095768574245884058", "date": "2026-09-04T06:59:00.000Z", "summary": "论文比较模型与训练数据在同一前缀下的条件熵，发现 OLMo、Pythia、GPT-Neo 的输出条件多样性均低于训练数据，图像生成器也存在类似差距。OLMo 20K 样本上训练数据得分 338.58，贪心解码为 218.88，nucleus 采样 287.31，ancestral 采样 297.31；调高温度到 T=1.9 虽匹配训练熵但精度和外部条件 NLL 变差。", "type": "paper", "relTime": "6天前"}, {"id": 184, "title": "玉伯用一句话提示词 9 分钟做出我的世界迷你版网页小游戏", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2095764351861112994", "date": "2026-09-04T06:42:13.000Z", "summary": "Frank Wang 玉伯用一句话提示词生成《我的世界迷你版》网页小游戏，耗时约 9 分钟（截图显示 Ran for 8m 56s），并放       html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();
</script>

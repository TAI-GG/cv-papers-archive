atus/2085940257078301121", "date": "2026-08-08T04:04:46.000Z", "summary": "突发：随着 Image 2.0 模型的发布，Grok Imagine 现新增 20 个用于精准图像生成与编辑的模板。  • 吉祥物制作 • 表情符号创建 • 智能调整大小 • 个人头像 • 重新想象 • 周边制作 • 专业证件照 • 背景移除与更换 • 产品换色 • 图标制作 • 编辑产品海报 • 房间布景 • 电商照片 • 主打产品展示 • 角色精灵 • 道具与 UI 套件 • 二维码皮肤...", "type": "model", "relTime": "4天前"}, {"id": 28, "title": "Grok Imagine 2.0 精准图像生成能力展示", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2085935948232020264", "date": "2026-08-08T03:47:39.000Z", "summary": "Grok Imagine Image 2.0 在精准图像生成方面表现出色。  它能处理复杂布局、组织密集信息，甚至能以惊人准确度渲染小号文字。  以下是一些完全使用 Image 2.0 制作的信息图 👇", "type": "tip", "relTime": "4天前"}, {"id": 29, "title": "SpaceXAI发布Grok Imagine Image 2.0图像模型", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2085932238349148365", "date": "2026-08-08T03:32:55.000Z", "summary": "突发：SpaceXAI 刚刚发布了 Grok Imagine Image 2.0，这是其用于专业图像生成和编辑的最新模型。  • 改进的提示词准确性、排版和布局 • 使用魔棒和分割进行精确编辑 • 背景移除和智能调整大小 • 支持最多 5 张输入图像 • 跨代生成的一致性更好 • 新增产品图、头像、图标、游戏资产等模板  现已在 Grok 网页版、iOS 和 Android 上以 Quali...", "type": "model", "relTime": "4天前"}, {"id": 30, "title": "用 NVIDIA NeMo Retriever 构建多模态 RAG 流水线：托管 NIM、LanceDB、重排序与 grounded 生成", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/07/building-a-multimodal-rag-pipeline-with-nvidia-nemo-retriever-hosted-nims-lancedb-reranking-and-grounded-generation", "date": "2026-08-07T21:13:38.000Z", "summary": "本教程演示如何用 NVIDIA NeMo Retriever 构建多模态 RAG 流水线：先以 PDFium 离线提取 PDF 文本，再通过托管 NIM 端点检测页面元素、抽取表格/图表/信息图并生成稠密向量存入 LanceDB。随后实现稠密检索、视觉-语言重排序、元数据过滤搜索及带内联引用的 grounded 生成，并用 recall-at-k 评估检索质量。", "type": "tip", "relTime": "4天前"}, {"id": 31, "title": "Fenix Flexin 不再否认用 AI 制作《Rubberz》", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/976801/fenix-flexin-rubberz-ai-song-treblo", "date": "2026-08-07T20:01:51.000Z", "summary": "洛杉矶说唱歌手 Fenix Flexin 回应 AI 制作争议，称\"从未说过没用 AI\"，并强调 AI 与录音过程无关。此前制作人 Medasin 指认 AI 工具 Treblo（原 Sonauto）参与制作，该公司发布的 AI 检测器也将其标记为 Treblo AI 生成。Fenix 上月接受 Hot 97 采访时曾明确表示歌曲\"没有 AI\"。", "type": "industry", "relTime": "4天前"}, {"id": 32, "title": "Roku 上线 Fairground AI 频道：无尽 AI 生成内容像\"从食槽里进食\"", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/entertainment/976939/roku-fairground-ai-fast-channel", "date": "2026-08-07T18:59:46.000Z", "summary": "Roku 本周新增四个频道，其中 Fairground AI Creator TV 全天候播放 AI 生成视频，内容由与 Fairground 合作的内容创作者制作。该频道无法选择具体视频类型，观看约一小时后发现内容多为短格式\"slop\"，缺乏视觉打磨，但部分视频有半连贯叙事。Fairground 成立于 2025 年，向合作者支付生成费用及未披露的收入分成，但未提及所用模型及训练数据授权情况。", "type": "tip", "relTime": "5天前"}, {"id": 33, "title": "NoimosAI 发布 Social Agent 社交趋势研究智能体", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2085775212142809252", "date": "2026-08-07T17:08:57.000Z", "summary": "NoimosAI 发布 Social Agent，可跨社交平台研究趋势，分析特定领域内表现优异的帖子并据此生成内容。该智能体支持多平台帖子与轮播图自动发布及定时推送，还能从产品图、链接或代码生成 UGC 和产品视频，并对已连接账号进行表现分析与改进建议。", "type": "product", "relTime": "5天前"}, {"id": 34, "title": "Databricks 推出 FILE 原生列类型，面向多模态数据", "source": "Databricks：Blog（RSS）", "sourceUrl": "https://www.databricks.com/blog/introducing-file-type-native-column-type-multimodal-data", "date": "2026-08-07T15:00:00.000Z", "summary": "Databricks 发布 FILE 原生列类型，用于在 Lakehouse 中直接存储和管理多模态数据。该类型将文件作为一等公民纳入表结构，支持图像、音频、视频等非结构化数据与结构化数据统一处理，简化了多模态数据管线的构建与查询。", "type": "paper", "relTime": "5天前"}, {"id": 35, "title": "AI 如何在不取代人情味的前提下改变 Instagram 互动", "source": "Artificial Intelligence News（RSS）", "sourceUrl": "https://www.artificialintelligence-news.com/news/how-ai-is-changing-instagram-engagement-without-replacing-the-human-touch", "date": "2026-08-07T14:33:59.000Z", "summary": "Instagram 的 AI 系统已接管内容分发与互动机制，但平台仍优先推荐\"真实人类创作\"的内容，2026 年其互动率仅为 0.7%。AI 工具可自动生成文案、制作多格式视频并预测受众，但 Instagram 会处罚过度重复发布或使用虚假互动的账号。AI 聊天机器人能将客服响应速度提升约 20%，复杂或敏感对话仍转交真人处理。", "type": "tip", "relTime": "5天前"}, {"id": 36, "title": "AI 书籍泛滥正稀释图书市场：含 AI 文本书籍已占约 40% 销售额", "source": "a16z：News（RSS）", "sourceUrl": "https://www.a16z.news/p/charts-of-the-week-bookslop", "date": "2026-08-07T14:01:58.000Z", "summary": "一项由 Stony Brook、Columbia、Michigan 及 MIT 数字经济倡议研究人员发布的论文显示，AI 生成书籍在自助出版类别中激增，含可检测 AI 文本的书籍已占据约 40% 的观测销售额。", "type": "tip", "relTime": "5天前"}, {"id": 37, "title": "昆仑万维荣膺\"2026年度中经数字产业高质量发展优秀案例\"", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI1MzE1NDc3Mg%3D%3D&mid=2247510003&idx=2&sn=21c360f9756a0c7c212c0a2d3e53845a", "date": "2026-08-07T13:44:57.000Z", "summary": "昆仑万维凭借智能体产业化领域的表现，入围\"2026年度中经数字产业高质量发展优秀案例\"，获评\"智能体产业化优秀案例\"。其天工Skywork全系列模型覆盖文本、多模态、视频、音乐等赛道，Skywork Super Agents在GAIA榜单得分82.42分居全球第一，Mureka V8人声、乐器双赛道登顶，SkyReels V4获Text to Video （With Audio）赛道全球第一。", "type": "industry", "relTime": "5天前"}, {"id": 38, "title": "面壁智能 PAREIDOLIA：给万物赋予面孔与声音", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2085712572087710083", "date": "2026-08-07T13:00:02.000Z", "summary": "面壁智能开发者 @_Andresio 在 #BuildSmall 黑客松中打造 PAREIDOLIA，用 MiniCPM-V 4.5 识别物体特征并生成个性，结合 VoxCPM2 无需参考音频即可设计独特角色声音，让日常物品\"活\"成共享虚拟动物园中的角色。该项目展示了视觉与语音模型融合的趣味 AI 交互新形态。", "type": "tip", "relTime": "5天前"}, {"id": 39, "title": "Luma 上线 Seedance 2.5 多镜头视频生成", "source": "X：Luma AI (@LumaLabsAI)", "sourceUrl": "https://x.com/LumaLabsAI/status/2085697463701344369", "date": "2026-08-07T12:00:00.000Z", "summary": "Seedance 2.5 已登陆 Luma。🚀  单次生成即可创建长达 30 秒的多镜头高清视频，最多可使用 50 个参考（文本、图像、视频和音频）。借助 Luma Agents，你可以控制场景、镜头角度和节奏，打造你的下一部杰作。", "type": "paper", "relTime": "5天前"}, {"id": 40, "title": "PixVerse 上线 Seedance 2.5 视频生成", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2085694711952777391", "date": "2026-08-07T11:49:04.000Z", "summary": "天哪……等待结束了。  Seedance 2.5 现已登陆 PixVerse。  30 秒。多角色。设置参考。一个连贯的场景。  转发 + 关注 + 回复 = 私信送 150 积分（仅限 72 小时）", "type": "paper", "relTime": "5天前"}, {"id": 41, "title": "字节跳动预训练10T参数模型", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2085640591908487606", "date": "2026-08-07T08:14:01.000Z", "summary": "据英国《金融时报》报道，字节跳动正在预训练一个约 10T 参数的大模型。  考虑到他们在视频生成领域轻松占据主导地位的表现，我们或许也会在通用领域看到一些重大惊喜。  年底将会非常热闹 🔥", "type": "model", "relTime": "5天前"}, {"id": 42, "title": "豆包生成治愈短片：逃亡的文件", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2085631827637588217", "date": "2026-08-07T07:39:11.000Z", "summary": "阿易 AI Notes 用豆包制作了一支 15 秒治愈故事短片《逃亡的文件》：被清空回收站的小文件在键盘狂奔、躲进咖啡杯变小鱼、化纸鹤飞逃，最终钻进笔记本变成手写字被永久保存。视频将昏暗实拍与粗糙发光手绘帧动画融合，全程第一人称手持抖动视角，并附完整分镜提示词。", "type": "tip", "relTime": "5天前"}, {"id": 43, "title": "Seedance 2.5 API正式上线：从短视频思维转向电影标准", "source": "公众号：数字生命卡兹克", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647685043&idx=1&sn=c844b6ad01c2bd4ae50eb5fcc5bb7a69", "date": "2026-08-07T06:13:36.000Z", "summary": "Seedance 2.5 API今日正式上线，可原生生成30秒视频，一次参考30张图片、10段视频和10段音频，支持时间戳级编辑和白模参考。该版本按电影生成标准重做SFT数据，指令遵循极强但主动补戏的\"幻觉\"减少，因此业余创作者觉得不如2.0好用，专业创作者则看重其可控性与电影感。除影视预演外，白模加30秒长度也为具身智能提供新的数据生产路径。", "type": "tip", "relTime": "5天前"}, {"id": 44, "title": "Seedance 2.5 API上线，视频生成开启「电影级长叙事」", "source": "公众号：火山引擎", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI0NzU1NzI5NQ%3D%3D&mid=2247543416&idx=1&sn=badeafc780a939033a1e4cb0bba4221c", "date": "2026-08-07T06:01:45.000Z", "summary": "火山引擎正式上线 Seedance 2.5 API，将单次视频生成时长从15秒提升至30秒，并支持最高50个全模态素材参考。模型在指令遵循、长叙事、真人感及声画质感上大幅提升，能稳定保持多角色外形与场景关系，兼容十余种语言。", "type": "model", "relTime": "5天前"}, {"id": 45, "title": "戚薇推出个人官方数字分身，将主演AI漫剧《末日盛夏》", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/986/933.htm", "date": "2026-08-07T04:44:41.000Z", "summary": "歌手、演员戚薇8月6日宣布推出个人官方数字分身，开放自身形象的规范化AI授权。其数字分身将主演末世AI漫剧《末日盛夏》，主角名为\"韩清夏\"，改编自番茄小说《末世重生：大佬从百万囤货开始》。此举被视为演员主动完成个人形象合规AI授权的代表性案例。", "type": "industry", "relTime": "5天前"}, {"id": 46, "title": "Grok Build v1.0.0 发布：界面与可靠性全面更新", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2085587302726742073", "date": "2026-08-07T04:42:15.000Z", "summary": "Grok Build v1.0.0 已上线，SpaceXAI 几乎每日推送新更新。本次更新涵盖 UI 导航、权限输入与可靠性修复，包括仪表盘显示代理上轮操作摘要、扩展按字母分组、自动主题检测支持 SSH/tmux、MCP 图像返回不再丢失或损坏，以及远程恢复默认仅恢复对话。用户可通过 \\`grok update\\` 命令更新。", "type": "paper", "relTime": "5天前"}, {"id": 47, "title": "Appshot 用截图生成可运行应用", "source": "X：Jason Liu (@jxnlco)", "sourceUrl": "https://x.com/jxnlco/status/2085565380727279919", "date": "2026-08-07T03:15:09.000Z", "summary": "Appshot  只需一张截图，就能生成一个可运行的应用。", "type": "product", "relTime": "5天前"}, {"id": 48, "title": "超越下一个 token 预测：扩散语言模型与自回归语言模型的性能对比研究", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/diffusion-autoregressive-performance", "date": "2026-08-07T00:00:00.000Z", "summary": "苹果机器学习研究团队系统对比了扩散语言模型（DLMs）与自回归语言模型（ARMs）的性能表现。ARMs 虽在多项 NLP 任务上精度领先，但因逐 token 生成的顺序依赖导致算术强度较低。DLMs 作为新兴范式展现出潜力，研究对其性能特征进行了详细刻画。", "type": "paper", "relTime": "5天前"}, {"id": 49, "title": "扩展分类流映射（Categorical Flow Maps）规模", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/scaling-categorical-flow-maps", "date": "2026-08-07T00:00:00.000Z", "summary": "连续扩散与流匹配模型有望成为语言建模中自回归方法的有力替代，可解锁加速采样与倾斜等连续模态优势。近期研究通过高斯分布与one-hot编码数据分布间的简单流匹配过程，实现离散数据的连续生成，并借助分类流映射（CFMs）验证了加速采样的可行性，样本质量具有竞争力。", "type": "paper", "relTime": "5天前"}, {"id": 50, "title": "Grok 4.5 以 13 倍低成本击败 Kimi K3", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2085512712881357146", "date": "2026-08-06T23:45:52.000Z", "summary": "AI/ML API 用同一提示词、一次性任务对比四款模型生成 3D 玩偶的成本：Grok 4.5 仅 $0.15，GPT 5.6 Sol 为 $0.60，Qwen 3.8 Max 为 $0.67，而 Kimi K3 高达 $1.98。Kimi 思考约 19 分钟，费用是 Grok 的 13 倍。对生产级智能体而言，单次任务完成成本正变得比单 token 价格更重要。", "type": "tip", "relTime": "5天前"}, {"id": 51, "title": "MiniMax H3 登陆 Luma Agents 支持 2K 视频", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2085406004431532106", "date": "2026-08-06T16:41:51.000Z", "summary": "现已在 @LumaLabsAI Agents 中上线：H3 可生成最长 15 秒、2K 分辨率、带原生立体声的视频。  更多创作与表达的空间，让想法成真。🎬😉", "type": "industry", "relTime": "6天前"}, {"id": 52, "title": "Imagine Image 2.0 Aug 7， 2026 # Imagine Image 2.0 Precise image generation and editing， built for real creative work. Read More", "source": "xAI：News（网页）", "sourceUrl": "https://x.ai/news/grok-imagine-image-2", "date": "2026-08-06T16:00:00.000Z", "summary": "暂无摘要", "type": "paper", "relTime": "6天前"}, {"id": 53, "title": "SpaceX与特斯拉宣布在得州建Terafab芯片厂", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2085368106252214521", "date": "2026-08-06T14:11:15.000Z", "summary": "SpaceX与特斯拉宣布将在得州Grimes County建设Terafab先进半导体工厂，规划超1亿平方英尺制造空间，整合逻辑、存储芯片的制造、封装与测试。双方芯片需求预计超1太瓦（TW）计算力，首期投资约168亿美元，至少雇佣3000人，芯片将用于Optimus机器人和Cybercab等边缘计算与推理场景。", "type": "industry", "relTime": "6天前"}, {"id": 54, "title": "阿里云发布万相3.0公测版，支持原生30秒视频生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2085360265600938156", "date": "2026-08-06T13:40:06.000Z", "summary": "阿里云推出万相3.0（Wan3.0）公开测试版，主打\"简单输入、智能创作\"，支持原生30秒视频生成与真实感渲染。其Omni-Reference能力扩展至文档、表格、幻灯片、网页等多模态输入。API价格按分辨率计费：480p $0.05/秒、720p $0.10/秒、1080p $0.20/秒，完整API访问即将推出。", "type": "product", "relTime": "6天前"}, {"id": 55, "title": "千问全网首发公测，全新 Wan3.0 来了！", "source": "公众号：千问APP（阿里）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzYzNDE5MDEwMQ%3D%3D&mid=2247488240&idx=1&sn=3fea5624e07184f42661d5f3bc798873", "date": "2026-08-06T13:25:10.000Z", "summary": "阿里千问全网首发公测视频生成模型 Wan3.0，在生成时长、镜头语言、角色真实感及一致性保持等维度全面升级。该模型支持稳定直出 30 秒一镜到底视频，具备导演级镜头与蒙太奇叙事，并强调角色、道具、场景高一致性保持。Wan3.0 主打超高性价比，现已在千问创作（c.qianwen.com）开放体验，千问 app 也将陆续开启。", "type": "model", "relTime": "6天前"}, {"id": 56, "title": "Luma Agents 接入 MiniMax H3 视频生成", "source": "X：Luma AI (@LumaLabsAI)", "sourceUrl": "https://x.com/LumaLabsAI/status/2085352484562706784", "date": "2026-08-06T13:09:10.000Z", "summary": "你来掌控画面、动态与声音。MiniMax H3 现已上线 Luma Agents。可生成最长 15 秒的 2K 视频，自带原生立体声，支持文本、图像、视频和音频参考引导。更广阔的创作空间，与 Luma 无缝衔接的连续工作流。立即体验 → http://lumalabs.ai/app", "type": "product", "relTime": "6天前"}, {"id": 57, "title": "NVIDIA Cosmos 3：开放世界模型如何推动物理 AI 前沿", "source": "NVIDIA Blog（RSS）", "sourceUrl": "https://blogs.nvidia.com/blog/open-world-models-physical-ai", "date": "2026-08-06T13:00:00.000Z", "summary": "NVIDIA 发布 Cosmos 3，一个基于混合 Transformer 架构的开放物理 AI 基础全模态模型，整合视觉推理、世界生成与动作预测。", "type": "model", "relTime": "6天前"}, {"id": 58, "title": "面壁智能 AMNESIAC：反向图灵测试 AI 审讯游戏", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2085350175782949094", "date": "2026-08-06T13:00:00.000Z", "summary": "面壁智能 OpenBMB 在 #BuildSmall 黑客松推出 AMNESIAC，一款反向图灵测试交互游戏：玩家需说服 AI 审讯官 A.M.N. 自己是人类。该游戏由 MiniCPM-o 4.5 驱动实时对话与推理，VoxCPM 生成审讯官语音，并结合摄像头面部表情、脉搏信号与响应计时进行多模态审讯。项目已开源至 HuggingFace。", "type": "tip", "relTime": "6天前"}, {"id": 59, "title": "阿里全新视频生成模型 Wan3.0 开启公测：单次生成 30 秒视频，支持文档输入", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/986/723.htm", "date": "2026-08-06T12:33:07.000Z", "summary": "阿里云今日宣布全新一代视频生成模型 Wan3.0 开启公测，单次可生成 30 秒视频，并首次支持 doc、xls、ppt、pdf、md 等文档格式输入，号称\"万物皆可生视频\"。", "type": "model", "relTime": "6天前"}, {"id": 60, "title": "阿里云发布万相3.0，可生成30秒智能视频", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2085336922562629825", "date": "2026-08-06T12:07:20.000Z", "summary": "Wan3.0：真正可投入生产的AI视频。  生成适配你动作的智能30秒片段，并可无缝延长。输入URL、PDF或幻灯片即可，无需重新格式化。文字清晰、画面一致、动作自然。从规格表到概念广告--一步到位。  👉 开始使用：· Model Studio：https://click.alibabacloud.com/m/20000001218/ · Qwen Cloud：https://click....", "type": "model", "relTime": "6天前"}, {"id": 61, "title": "通义千问 Qwen-Image-3.0 发布，支持 4.5K 提示词", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2085301430832005334", "date": "2026-08-06T09:46:18.000Z", "summary": "每张图像都始于想象。  Qwen-Image-3.0 可处理 4.5K-token 提示词，一次性生成学术页面（含 LaTeX）、分镜脚本、UI 线框图、游戏美术、建筑渲染和电影预演。  起价 $0.03/张。  开启创意之旅： • Model Studio：https://click.alibabacloud.com/m/20000001640/ • Qwen Cloud：https://...", "type": "model", "relTime": "6天前"}, {"id": 62, "title": "通义千问图像3.0发布，支持4.5K提示词", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2085299159448391893", "date": "2026-08-06T09:37:17.000Z", "summary": "每张图像都始于想象。  Qwen-Image-3.0 可处理 4.5K token 的提示词，一次性生成学术页面（含 LaTeX）、分镜脚本、UI 线框图、游戏美术、建筑渲染和电影预演。  起价 $0.03/张。  开启创意之旅：https://click.alibabacloud.com/m/20000001640", "type": "paper", "relTime": "6天前"}, {"id": 63, "title": "物理智能企业「飞捷科思」获数亿元 A1 轮融资，云启资本加注", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/yunqipartners/yunqi-partners-physical-intelligence-startup-feijie-kesi-rai", "date": "2026-08-06T09:05:00.000Z", "summary": "物理智能企业「飞捷科思」完成数亿元 A1 轮融资，云启资本加注。该公司聚焦 AI 走进机器人、制造业和真实物理世界时准确理解物理规律的能力，旨在推动模型从\"生成得像\"走向\"运行得对\"。", "type": "industry", "relTime": "6天前"}, {"id": 64, "title": "物理智能企业「飞捷科思」获数亿元 A1 轮融资，云启资本加注", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/author-1779868954078/yunqi-partners-physical-intelligence-startup-feijie-kesi-rai", "date": "2026-08-06T09:05:00.000Z", "summary": "物理智能企业飞捷科思完成数亿元 A1 轮融资，云启资本加注。该公司聚焦 AI 在机器人、制造业及真实物理世界的应用，核心方向是让模型准确理解物理规律，推动其从\"生成得像\"走向\"运行得对\"。", "type": "industry", "relTime": "6天前"}, {"id": 65, "title": "字节跳动 CEO 梁汝波称坚持自研大语言模型、接受短期落后，回应豆包、飞书、火山引擎整合", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/986/555.htm", "date": "2026-08-06T07:39:03.000Z", "summary": "字节跳动 CEO 梁汝波在 2026 年度年中全员会上表示，豆包在 C 端保持竞争力，视频生成模型 Seedance 维持 SOTA，但大语言模型与海外领先模型差距拉大；公司仍将坚持自研、接受短期落后。他还回应了豆包、飞书、火山引擎的整合，称飞书新增客户中超九成同步采购飞书 AI 产品。此前张一鸣在 Seed 团队会议上明确表示不会依赖 AI 蒸馏技术改进模型。", "type": "industry", "relTime": "6天前"}, {"id": 66, "title": "FLUX 3 视频 AI 生成模型正式上线：最长 20 秒原生 1080p，跑分优于 Seedance 2.0", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/986/470.htm", "date": "2026-08-06T05:54:25.000Z", "summary": "Black Forest Labs 正式上线 FLUX 3 视频生成模型，单次生成最长 20 秒视频并附带原生音频，支持原生 1080p 分辨率及文生视频、图生视频、视频生视频、多镜头串联等功能。", "type": "model", "relTime": "6天前"}, {"id": 67, "title": "阿里达摩院开放 15 项芯片与 AI 研究课题，启动\"阿里星\"顶尖人才招募", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/986/434.htm", "date": "2026-08-06T03:58:18.000Z", "summary": "阿里达摩院今日宣布面向 2027 届毕业生启动\"阿里星\"顶尖人才招募培养计划，今年共开放 15 项研究课题。课题覆盖 AI 芯片编程模型与编译器、面向大模型的 AI SoC、RISC-V 高性能 CPU 架构、医疗多模态智能体、AGI 决策及 AI 视频标准等前沿方向，涉及自研芯片软硬件协同与千亿参数大模型推理优化等具体目标。", "type": "industry", "relTime": "6天前"}, {"id": 68, "title": "MiniMax H3 登顶 Design Arena 三项视频榜单", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2085188712342954326", "date": "2026-08-06T02:18:24.000Z", "summary": "MiniMax H3 在 Design Arena 视频评测中拿下多图生视频、图生视频和视频编辑三项第一，超越 Seedance 2.0、Grok Imagine Video 1.5 Preview 和 Gemini Omni Flash。该模型为开源权重，延续了 Kimi K3 在编程类别夺冠后开源模型主导榜单的趋势。", "type": "model", "relTime": "6天前"}, {"id": 69, "title": "MiniMax H3 登顶开源视频生成 SOTA", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2085173543306969489", "date": "2026-08-06T01:18:08.000Z", "summary": "MiniMax H3 在 Video Arena 排名第二，Elo 1325，较前代 Hailuo-2.3 （Pro） 提升 209 分，仅次于 Gemini Omni Flash。在开源模型中位列第一，大幅领先 LTX 2.3 与 Kandinsky 5.0 Pro，创下开源视频生成新 SOTA，且权重开放、价格亲民。", "type": "model", "relTime": "6天前"}, {"id": 70, "title": "KVAE：面向多模态生成模型的 tokenizer 系列", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.05798", "date": "2026-08-06T00:00:00.000Z", "summary": "KVAE 系列 tokenizer 覆盖音频、图像与视频，专为后续文本条件生成设计。其中 KVAE-Audio 为连续全频带 48 kHz tokenizer，具备 50 Hz 潜空间与 64 通道；KVAE-3D 提供 4x16x16 与 4x8x8 两种因果视频压缩方案；KVAE-2D 图像模型实现 8 倍压缩与 32 通道。", "type": "paper", "relTime": "6天前"}, {"id": 71, "title": "MASS：用权威共享状态构建多人游戏世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.06257", "date": "2026-08-06T00:00:00.000Z", "summary": "MASS将世界动态与视角渲染解耦，以应对多人环境中现有视频世界模型的计算冗余、视角不一致和扩展性差等问题。其学习型逻辑引擎无需手写转移函数即可推进全局权威类型化状态，渲染引擎则按需为任意相机生成独立且一致的视角。在多人Snake基准上，MASS实现了更高的状态精度和更低的跨视角不一致性，并支持1，024个并发玩家、10，000步循环预测。", "type": "paper", "relTime": "6天前"}, {"id": 72, "title": "EffectLearner：面向真实世界视频物体移除的物体-效果推理框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.05565", "date": "2026-08-06T00:00:00.000Z", "summary": "EffectLearner 提出一种语义推理增强的视频物体移除框架，结合基于 VLM 的 Object-Effect Reasoner 与基于 DiT 的 Video Eraser，通过结构化效果分析提示词提取效果感知上下文，并引入运动感知掩码引导与运动一致性监督。", "type": "paper", "relTime": "6天前"}, {"id": 73, "title": "DyPES-VLA：学习共享动力学先验与具身特定控制，实现跨具身操作", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.06374", "date": "2026-08-06T00:00:00.000Z", "summary": "DyPES-VLA 提出一种跨具身视觉-语言-动作模型，通过未来预测目标训练 VLM 学习共享动力学先验，并利用具身特定的 MoE 动作头直接在原生动作空间生成控制，无需手动对齐异构动作。作为通用策略，它在 LIBERO 上达到 98.0% 成功率，在 RoboCasa-GR1 上为 59.25%，在 RoboTwin 2.0 上为 89.02%，在仿真和真实世界评估中均取得 SOTA 性能。", "type": "paper", "relTime": "6天前"}, {"id": 74, "title": "ChronoVision：通过潜在状态重建实现时序推理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.05631", "date": "2026-08-06T00:00:00.000Z", "summary": "ChronoVision 提出多模态框架，通过监督微调中的 Reconstructive Visual Head 预测最终变换状态的潜在表征，并借助 ROI Attention Locating 模块聚焦关键视觉证据，后训练阶段采用带隐式过程对齐的强化学习。在 Vbvr-VQA 上取得 74.8% 域内和 71.6% 域外准确率，在 IntPhys2 上达到 55.0%。", "type": "paper", "relTime": "6天前"}, {"id": 75, "title": "UniME-R1：基于失败学习的检索中心思维链统一多模态检索", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.06060", "date": "2026-08-06T00:00:00.000Z", "summary": "UniME-R1 提出一种 embedder-adviser 框架，通过挖掘硬负样本模拟检索失败，让 adviser 基于初始检索结果生成检索中心思维链（RC-CoT），以纠正嵌入器对细微判别线索的混淆。若目标出现在初始 top-k 集合中则直接重排，否则生成 RC-CoT 调整检索方向并执行全库重检索。在 MMEB-V2 及多个通用多模态检索基准上，UniME-R1 持续优于强基线。", "type": "paper", "relTime": "6天前"}, {"id": 76, "title": "GST-Bench：视频理解中的全局空间智能基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.05747", "date": "2026-08-06T00:00:00.000Z", "summary": "GST-Bench 提出用于视频理解全局空间智能的 VQA 基准，含 6，790 分钟合成视频生成的 2，762 个人工验证问题，要求模型从新视角推理并映射到全局俯视图。对 22 个 SOTA VLM 的评估显示，最强零样本模型 Gemini-3-Pro 仅得 42.68 分，远低于人类基线 79.08；研究还提供 GST-Train 数据集以促进后续研究。", "type": "paper", "relTime": "6天前"}, {"id": 77, "title": "Cloudflare 开源智能体工作台 Cloudflare OS，Qwen-Image-3.0 上线千问平台", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2085152483501088972", "date": "2026-08-05T23:54:26.000Z", "summary": "Cloudflare 将内部智能体工作台开源为 Cloudflare OS，支持共享上下文、技能沉淀与 Gatekeeper 资源授权。阿里云上线 Qwen-Image-3.0，支持 4.5k token 指令，文生图 0.18 元起。NVIDIA 发布 34B 参数 Alpamayo 2 Super，面向自动驾驶轨迹规划与自动标注。", "type": "industry", "relTime": "6天前"}, {"id": 78, "title": "Grok CLI v0.2.121 发布：新增会话恢复与多项修复", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2085121879950381352", "date": "2026-08-05T21:52:50.000Z", "summary": "Grok CLI v0.2.121 发布，新增仪表盘摘要、扩展分组、后台子代理提醒及客户端会话重连功能。修复了 MCP 图像输出损坏、远程会话恢复 404 等问题，并优化了 SSH/tmux 下的主题检测与权限提示显示。", "type": "paper", "relTime": "6天前"}, {"id": 79, "title": "OpenRouter 祝贺 Sensho 上线并支持其多智能体基建", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2085121025721954727", "date": "2026-08-05T21:49:26.000Z", "summary": "OpenRouter 发文祝贺 Sensho 与 Olam Labs 产品上线，并表示支持其建设。Sensho 回应称，其多智能体基础设施的大规模运行离不开 OpenRouter 的支持。此外，Sensho 发布视频的前半部分视觉及大部分音频由 MiniMax 旗下 Hailuo AI 的 H3 模型生成，该模型是目前唯一开源的 SOTA 视频生成模型。", "type": "model", "relTime": "6天前"}, {"id": 80, "title": "Meta 在 Facebook 和 Instagram 等平台投放了含 AI 生成儿童性虐待图像的广告", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.wired.com/story/meta-ran-ads-that-contained-ai-generated-child-sexual-abuse-imagery", "date": "2026-08-05T21:11:36.016Z", "summary": "Meta 的广告库数据显示，超过 50 条违规图片和视频广告发布在 Facebook、Instagram、Messenger 或 Threads 上，其中一些本周仍在投放。这些广告包含由人工智能生成的儿童性虐待图像。", "type": "industry", "relTime": "6天前"}];
var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };
var TYPE_LABELS = { "paper":"论文", "model":"模型", "product":"产品", "tip":"技巧", "industry":"行业" };
function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";
  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();
</script>

"sourceUrl": "https://www.ithome.com/1/004/871.htm", "date": "2026-09-20T08:36:05.000Z", "summary": "启元机器人在 2026 全球产品发布会上发布启元 Q1 和启元 T1 两款消费级人形机器人，两款产品已于 8 月 23 日开启预订。启元 Q1 主打自定义，身高 88 厘米、可折叠放入背包，支持外观定制、3D 打印改造、性格与语音调整；启元 T1 支持轮足人形与四足形态切换。", "type": "product", "relTime": "15小时前"}, {"id": 17, "title": "Eric Schmidt：AI 智能体将让用户界面消失", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2101524067715256368", "date": "2026-09-20T04:09:16.000Z", "summary": "前 Google CEO Eric Schmidt 认为用户界面将基本消失，因为智能体懂自然语言，用户可直接对话描述需求，UI 可按需生成。推文进一步指出，机器人流量已超过人类活动，未来 90% 以上的网络流量可能来自非人类，网站或将退化为供智能体查询的数据库。", "type": "paper", "relTime": "19小时前"}, {"id": 18, "title": "生数科技入选2026北京民营企业科技创新百强与未来产业先锋榜", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489273&idx=1&sn=4f879a6aedfb68e0c923461a9d305cff", "date": "2026-09-20T04:04:03.000Z", "summary": "生数科技入选\"2026北京民营企业100强\"系列榜单中的\"科技创新百强\"和首次发布的\"未来产业先锋榜\"，成为唯一同时入选两项榜单的通用世界模型企业。其Vidu Q3 是全球首个支持 16 秒声画同出的视频生成模型，Vidu S2 含 S2-Avatar 与 S2-Editing 两个模型，Motus2 则将策略、世界模拟与价值评估纳入统一的视频-动作模型。", "type": "model", "relTime": "20小时前"}, {"id": 19, "title": "Ethan Mollick 测试 Astra 解谜并生成视频", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2101517626954436623", "date": "2026-09-20T03:43:41.000Z", "summary": "Ethan Mollick 向 Astra 提出与 Claude 相同的问题--选一个困扰自己的谜题并尽力解决，再生成一段可分享的视频，Astra 给出了流畅的结果。Astra 的展示内容均来自其实际模拟，但相比 Fable，它表现出更少的模拟好奇心，似乎对结果不那么\"感兴趣\"。", "type": "paper", "relTime": "20小时前"}, {"id": 20, "title": "Tripo 浏览器打造虚拟 iPhone Duo 体验", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2101507167027351947", "date": "2026-09-20T03:02:07.000Z", "summary": "我们在浏览器里打造了一个虚拟 iPhone Duo 体验。  从一张平面的 2D 旅行照片，变成一个完全可交互的 3D 弹出式体验。  技术栈：Tripo 生成了核心 3D 模型，GPT-6 Astra 负责基础网格、材质和 WebGL 交互。  最终，折叠屏不只是一块显示屏--它是通往空间记忆的真正入口。  链接和提示词见下方 ↓", "type": "model", "relTime": "21小时前"}, {"id": 21, "title": "MiniMax 公布全球六大合作案例：M3 落地 Genspark、HUMAIN 与 Nebius", "source": "公众号：MiniMax（稀宇科技）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzE5MTA3NzcxMQ%3D%3D&mid=2247489172&idx=1&sn=30557bf48e47d50a17b22e16ac44efbb", "date": "2026-09-20T01:00:00.000Z", "summary": "MiniMax 披露六项全球合作：Genspark 基于 MiniMax M3 开放权重后训练出 PPT 专用模型 Gen-1 Slides，并成为其 AI Slides 标准模式默认模型，200 个真实生产任务评测中综合与视觉设计得分均列五个参测模型第一，单份生成成本为 Claude Opus 5 的十分之一。", "type": "model", "relTime": "23小时前"}, {"id": 22, "title": "Jev 模型 150ms 语音操控 Mac 实测", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2101327167913107933", "date": "2026-09-19T15:06:52.000Z", "summary": "开发者 @instantricecook 用 150ms 新模型 Jev 把 Mac 改造成纯语音终端，语音指令可在毫秒级直接映射为系统快捷键与坐标操作。Nader Dabit 转发实测后预言，未来 6 到 12 个月内人们将能一整天不碰电脑完成工作。该方案主打消灭 Computer Use 的云端截图延迟，单次前向传播仅 150ms，无需生成多余 Token。", "type": "model", "relTime": "1天前"}, {"id": 23, "title": "Qwen3.8-Omni-Flash 发布，价格低于 Gemini Flash 且多模态基准相当", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/qwen3-8-omni-flash-undercuts-gemini-flash-pricing-while-matching-its-multimodal-benchmarks", "date": "2026-09-19T14:30:57.000Z", "summary": "Qwen 发布首个面向 AI 智能体的多模态模型 Qwen3.8-Omni-Flash，可联合处理音频和视频并自主使用工具，上下文窗口达 100 万 token。", "type": "model", "relTime": "1天前"}, {"id": 24, "title": "美军因AI幻觉情报报告险些登船检查中国船只", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/u-s-military-nearly-boarded-a-chinese-ship-over-a-hallucinated-ai-intelligence-report", "date": "2026-09-19T08:10:55.000Z", "summary": "CNN独家报道称，2026年春美军特种作战司令部一名分析师使用的聊天机器人错误标记一艘中国船只运载核武器零部件，武装人员与飞机已就位，登船前数分钟才发现错误。报道称军内AI生成情报缺乏统一核验标准，系统多为商业产品改版，年轻分析师易不加质疑地信任AI工具。", "type": "tip", "relTime": "1天前"}, {"id": 25, "title": "阿里巴巴达摩院开源医学影像模型 Damo Radar，可识别近150种腹部疾病", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.scmp.com/tech/big-tech/article/3368055/alibaba-open-sources-medical-ai-model-can-detect-cancer-and-nearly-150-conditions", "date": "2026-09-19T06:27:05.174Z", "summary": "阿里巴巴达摩院开源视觉语言模型 Damo Radar，可分析覆盖18个腹部器官的增强CT扫描，识别包括癌症在内的近150种腹部疾病。该模型用CT扫描配对临床报告训练，在近4万例真实检查中对146项临床发现取得平均 AUC 0.913；在26名放射科医生参与的对比研究中，平均准确率超过其中23人，医生借助模型将漏诊预防能力提高10%、耗时减少逾30%。", "type": "model", "relTime": "1天前"}, {"id": 26, "title": "Google Cloud AI Research 发布 ScientistTwo 自主科研智能体框架", "source": "X：DAIR.AI (@dair_ai)", "sourceUrl": "https://x.com/dair_ai/status/2101144299471884479", "date": "2026-09-19T03:00:13.000Z", "summary": "Google Cloud AI Research 发布 ScientistTwo，一个全自动多智能体科研框架，输入人类专家提出的问题后无需干预即可完成从建立 SOTA 基线、生成种子想法、数据子集预筛、消融归因到论文撰写的完整发现循环。", "type": "paper", "relTime": "1天前"}, {"id": 27, "title": "加州大学伯克利分校团队开发含铅墨水检测技术，无需展开即可读取庞贝碳化卷轴文字", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/004/381.htm", "date": "2026-09-19T01:04:08.000Z", "summary": "美国加州大学伯克利分校 Douglas Seiler 团队开发出通过检测含铅墨水痕迹读取庞贝古城碳化卷轴文字的技术，每平方厘米仅含 25 微克铅的墨水也能被 X 射线 CT 和 X 射线荧光技术检出，在 CT 图像中亮度最高可达碳化纸莎草的 25 倍。", "type": "paper", "relTime": "1天前"}, {"id": 28, "title": "万物皆可为麦克风：从芯片袋振动到灯泡光线", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2101106479411687489", "date": "2026-09-19T00:29:56.000Z", "summary": "鉴于有人讨论 AI 通过 CPU 温度波动进行通信，我想到了这个帖子--世界上可恢复的信息比你想象的要多。  【引用 @emollick】：隐私很难。一切都可以是麦克风。你可以从以下来源恢复音频数据： 🛍️视频中芯片袋的振动 💡悬挂灯泡被语音移动时的光线微小波动 🤖扫地机器人的激光雷达光束 🤳手机照片中的自动对焦", "type": "paper", "relTime": "1天前"}, {"id": 29, "title": "Krea Agent 生成视频教程", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2101096225823228020", "date": "2026-09-18T23:49:11.000Z", "summary": "这段视频 100% 由 Krea Agent 生成。  下面教你如何做到 👇", "type": "paper", "relTime": "2天前"}, {"id": 30, "title": "美军分析师用 AI 生成虚假情报报告，险些对中性船只动武", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.cnn.com/2026/09/18/politics/us-military-ai-false-intelligence-china-ship", "date": "2026-09-18T18:48:49.722Z", "summary": "据 CNN 报道，今年春天美国与伊朗战争期间，一名特种作战司令部分析师用聊天机器人整理情报，错误判定一艘中东的中国船只运输核武器项目部件，军方一度准备登船拦截，行动前才发现报告内容完全不实。事件暴露出美军各机构 AI 工具标准不一、缺乏统一的核验规范， analysts 在战争节奏下更快产出错误情报的风险。", "type": "tip", "relTime": "2天前"}, {"id": 31, "title": "MAI-Image-2.6 刷新文生图性价比", "source": "X：Mustafa Suleyman（Microsoft AI CEO） (@mustafasuleyman)", "sourceUrl": "https://x.com/mustafasuleyman/status/2100988409414369475", "date": "2026-09-18T16:40:45.000Z", "summary": "全球图像生成性价比最佳！🔥  生成高质量图像比以往更便宜、更快速。近几周，Muse Image、MAI-Image-2.6 和 GPT Images 2.5 大幅推动了文生图在价格和速度上的帕累托前沿。", "type": "paper", "relTime": "2天前"}, {"id": 32, "title": "GPT Image 2.5 Sunburst 上线 Tripo Studio", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2100963064258732241", "date": "2026-09-18T15:00:03.000Z", "summary": "GPT Image 2.5 Sunburst 现已登陆 Tripo Studio。  更锐利的细节。更自然的光照。更好的参考保持。  生成 → 编辑 → 3D。一站式完成。  立即体验 → https://studio.tripo3d.ai/workspace/generate-image?utm_source=twitter&utm_medium=social&utm_campaign=g...", "type": "paper", "relTime": "2天前"}, {"id": 33, "title": "GPT-6 Astra 在 WeirdML v3 上大幅领先 Fable 5.1", "source": "X：Haider (@haider1)", "sourceUrl": "https://x.com/haider1/status/2100932864703656296", "date": "2026-09-18T13:00:03.000Z", "summary": "GPT-6 Astra 在完全智能体化的 ML 基准 WeirdML v3 上以 42% 得分、$27 成本、153k 输出 token 击败 Fable 5.1 的 26%、$32、251k 输出 token，效率差距明显。", "type": "paper", "relTime": "2天前"}, {"id": 34, "title": "ComfyUI 动画工作流：概念图经 Tripo 生成 3D 模型再转任意角度", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2100872579989086502", "date": "2026-09-18T09:00:30.000Z", "summary": "ComfyUI 分享一个概念图转任意角度的动画工作流，其中 3D 生成步骤由 Tripo 完成。工作流分三步：概念图经 Tripo 生成并保存为 GLB 模型；静止画面用 Load 3D 输出视角后由 GPT Image 2 渲染成同风格插画；镜头运动则在视口中录制路径，作为 Seedance 2.0 的运动参考生成镜头。文末附工作流运行链接。", "type": "tip", "relTime": "2天前"}, {"id": 35, "title": "阿里 Qwen 发布 Qwen3.8-Omni-Flash：1M 上下文的全模态智能体模型", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/18/alibaba-qwen-releases-qwen3-8-omni-flash", "date": "2026-09-18T08:40:37.000Z", "summary": "阿里 Qwen 团队发布 Qwen3.8-Omni-Flash，称其为首款围绕智能体能力构建的全模态模型，接受文本、图像、音频和视频输入并返回文本，上下文窗口为 1M tokens。", "type": "model", "relTime": "2天前"}, {"id": 36, "title": "Wan3.0 登 OpenArt Arena 视频榜第二", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100847954303041542", "date": "2026-09-18T07:22:38.000Z", "summary": "我们很高兴宣布，Wan3.0 在 @openart_ai 的 OpenArt Arena 的 Overall Video 类别中排名第二。  30 秒生成、原生音频、任意参考--创作者们喜爱 Wan3.0 带来的可能性。  我们也喜爱创作者用它做出的作品。继续来吧。  更多 API 接入： • Model Studio：https://click.alibabacloud.com/m/200...", "type": "model", "relTime": "2天前"}, {"id": 37, "title": "小鹏集团×火山引擎：5000个智能体落地，让Agent驶进造车一线", "source": "公众号：火山引擎", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI0NzU1NzI5NQ%3D%3D&mid=2247544478&idx=1&sn=5420674cd38be384f2627aed4923ed64", "date": "2026-09-18T07:07:55.000Z", "summary": "小鹏集团与火山引擎合作，以 HiAgent 为底座建设 AI 中台，平台已有2000名活跃用户、累计产生5000个智能体，50个数字员工场景正在逐步落地。供应链风险智管平台定义78个风险因子，覆盖800多家供应商，新车型产能风险排查从2天缩至10分钟；Vision-X 平台约90%的AI视频生成由 Seedance 完成。", "type": "paper", "relTime": "2天前"}, {"id": 38, "title": "Waymo 计划 2028 年在新加坡提供 Robotaxi 商用服务", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/004/084.htm", "date": "2026-09-18T06:25:29.000Z", "summary": "Alphabet 旗下自动驾驶企业 Waymo 9 月 17 日宣布，计划 2028 年在新加坡提供有偿 Robotaxi 网约车服务，此前其已表示目标明年（原文表述）在日本东京实现商业化运营。未来数月 Waymo 将建立新加坡本地业务并入驻首批捷豹 I-PACE 车队，2027 年启动基于真人驾驶的本地化训练，2028 年通过第一方应用向公众开放，并与新加坡交通部和陆路运输管理局合作。", "type": "industry", "relTime": "2天前"}, {"id": 39, "title": "NVIDIA 与费城儿童医院用开源 AI 打造数字心脏辅助儿童手术", "source": "X：小北 (@frxiaobei)", "sourceUrl": "https://x.com/frxiaobei/status/2100819230363140396", "date": "2026-09-18T05:28:30.000Z", "summary": "作者转述 NVIDIA 与费城儿童医院的合作，用开源工具将孩子的 CT、核磁和 3D 超声生成精确的数字心脏，建模时间从 4 小时缩短到几秒钟，医生可提前试不同瓣膜和封堵器。作者认为 AI 降低成本加上医院开源，让市场太小而无人投入的先天性心脏病治疗问题得到认真对待。", "type": "tip", "relTime": "2天前"}, {"id": 40, "title": "Qwen3.8-Omni-Flash 发布：原生全模态模型主打音视频智能体能力", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://qwen.ai/blog?id=qwen3.8-omni-flash", "date": "2026-09-18T04:45:46.234Z", "summary": "Qwen 团队发布原生全模态模型 Qwen3.8-Omni-Flash，支持文本、图像、音频、视频输入和 1M token 上下文窗口，在 29 项评测中平均分较 Qwen3.5-Omni-Plus 提升超过 25%，音频输入每小时价格下降超过 98%。", "type": "model", "relTime": "2天前"}, {"id": 41, "title": "阿里发布全模态模型 Qwen3.8-Omni-Flash，支持 1M 上下文，百万 Token 图文音视频输入 0.8 元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/004/049.htm", "date": "2026-09-18T03:34:25.000Z", "summary": "阿里千问上线新一代原生全模态模型 Qwen3.8-Omni-Flash，可同时处理文本、图像、音频和视频输入，支持 1M 上下文。在 30 项评测上相比上一代 Qwen3.5-Omni-Plus 平均得分提升超过 26%，官方称音视频能力接近 Gemini 3.8 Flash、音频能力整体超过 Gemini 3.8 Flash。", "type": "model", "relTime": "2天前"}, {"id": 42, "title": "Browser Use 创始人实测开源浏览器 Agent：查航班 7 秒、单次成本 0.0039 美元", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2100753475772526610", "date": "2026-09-18T01:07:13.000Z", "summary": "Browser Use 创始人 Gregor Zunic 发布实测视频，展示其开源小型浏览器 Agent 接入 Jev 模型后，查真实航班仅用 7 秒、成本 0.0039 美元，视频为 1 倍速。其三层设计包括每步生成新动作空间并直接对 DOM 状态做映射、Jev 只输出结构化决策使输出 Token 免费、仅在需要输入文字时回退到小模型打字，代码已开源在 GitHub。", "type": "tip", "relTime": "2天前"}, {"id": 43, "title": "Lucid 与 Bolt 合作在欧洲部署至少 2.5 万辆 Robotaxi", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/916.htm", "date": "2026-09-18T00:55:53.000Z", "summary": "Lucid 与欧洲共享出行平台 Bolt 建立战略合作，计划在欧洲多国多城市部署至少 2.5 万辆 Robotaxi。该车基于 Lucid 即将推出的中型车平台，采用 NVIDIA Hyperion 开发平台和参考体系架构，符合 SAE L4 级自动驾驶标准。Bolt 将协助定义车辆需求及软件、安全与乘客体验参数，并负责构建车队基础设施与城市合作，计划拥有并运营该车队。", "type": "paper", "relTime": "2天前"}, {"id": 44, "title": "Epoch AI 推出 Benchmark Reviews 计划，首批审计 15 个 AI 基准", "source": "X：Karina Nguyen（@karinanguyen）", "sourceUrl": "https://x.com/karinanguyen/status/2100747283557998629", "date": "2026-09-18T00:42:37.000Z", "summary": "Epoch AI 推出 Benchmark Reviews 计划，用于审计 AI 基准，首批覆盖 15 个基准：4 个 Verified、9 个 Flawed、2 个信息不足以评审。Verified 包括 WeirdML v2、ExploitBench v0.1、PostTrainBench v1.1、SimpleQA Verified，Flawed 包括 Terminal-Bench 4....", "type": "paper", "relTime": "2天前"}, {"id": 45, "title": "OpenRouter 实测 20 个图像生成模型的成本、编辑与质量", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/insights/image-generation-models-compared", "date": "2026-09-18T00:00:00.000Z", "summary": "OpenRouter 对其路由的 20 个图像生成模型用相同提示词实测计费，单张图片成本在 $0.006 到 $0.134 之间，相差 22 倍。", "type": "tip", "relTime": "3天前"}, {"id": 46, "title": "Apple 提出 DSAS：动态缩放激活引导，解耦\"何时引导\"与\"如何引导\"", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/dynamically-scaled-activation-steering", "date": "2026-09-18T00:00:00.000Z", "summary": "Apple 研究团队提出 Dynamically Scaled Activation Steering（DSAS），一种与具体方法无关的引导框架，将\"何时引导\"与\"如何引导\"解耦，在生成时按层和输入自适应计算缩放因子，仅在检测到不良行为时施加强引导。", "type": "product", "relTime": "3天前"}, {"id": 47, "title": "Muse Image 等刷新文生图性价比前沿", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2100720014458544565", "date": "2026-09-17T22:54:15.000Z", "summary": "生成高质量图像比以往更便宜、更快速。近几周，Muse Image、MAI-Image-2.6 和 GPT Images 2.5 大幅推动了文生图在价格和速度上的帕累托前沿。", "type": "paper", "relTime": "3天前"}, {"id": 48, "title": "Figure 发布 Helix 2.5 模型，家庭任务零样本成功率升至 56%", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2100685992588124650", "date": "2026-09-17T20:39:04.000Z", "summary": "Figure 发布 Helix 2.5 端到端机器人模型，在湾区租用的 30 个家庭中，机器人未经额外训练即开始执行有用工作。家庭任务零样本成功率提升超过六倍，从 9% 升至 56%，成功标准要求完成全部任务、无部分得分。", "type": "model", "relTime": "3天前"}, {"id": 49, "title": "Krea Agent 推出全新视频编辑器", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2100678711448334709", "date": "2026-09-17T20:10:08.000Z", "summary": "Krea AI 在 Krea Agent 中推出新视频编辑器，用户可在编辑器中处理生成的视频片段。功能包括拼接场景、延长片段、添加音频等，现已可在 krea.ai/agent 体验。", "type": "paper", "relTime": "3天前"}, {"id": 50, "title": "Figure 发布 Helix 2.5，在 30 个真实家庭零样本完成三种全身行为", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2100670018723647703", "date": "2026-09-17T19:35:35.000Z", "summary": "Figure 发布 Helix 2.5，可在 30 个真实家庭中零样本完成三种全身行为，且未在这些家庭收集任何训练数据。作者认为其关键启示是 LLM 的缩放定律同样适用于基于视频数据的真实世界机器人，训练数据越多机器人在真实环境中表现越好。", "type": "paper", "relTime": "3天前"}, {"id": 51, "title": "Claude Projects 重建翁贝托·埃科图书馆", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2100651315617800358", "date": "2026-09-17T18:21:16.000Z", "summary": "我拿到了新版 Claude Projects 的访问权限，完成了一些非常复杂的工作。  在这里，我让它梳理所有关于翁贝托·埃科著名的 33，000 册藏书的图片、视频和记录，并尝试以 3D 形式重建这座图书馆，包括书籍的位置。https://eco-library-map.netlify.app/", "type": "product", "relTime": "3天前"}, {"id": 52, "title": "NVIDIA 发布 NeMo Data Designer 合成数据工具报告", "source": "X：DAIR.AI (@dair_ai)", "sourceUrl": "https://x.com/dair_ai/status/2100628354043101640", "date": "2026-09-17T16:50:02.000Z", "summary": "NVIDIA 发布开源合成数据工具 NeMo Data Designer（NDD）技术报告，采用声明式配置定义数据集各列，支持生成文本、代码、结构化输出、图像、嵌入向量及控制多样性的统计采样器，并可通过插件扩展类型。", "type": "model", "relTime": "3天前"}, {"id": 53, "title": "商汤发布并开源 SenseNova U1.5 技术报告，8B-MoT 原生统一模型", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2100598129494294765", "date": "2026-09-17T14:49:55.000Z", "summary": "商汤发布 SenseNova U1.5 技术报告，推出开源 8B-MoT 原生统一模型，通过共享注意力连接理解与生成。模型采用 Pixel Shuffle 加 3×3 空间卷积实现原生 4K 生成，WISE 从 0.70 提升至 0.81，VBVR-Pro-Bench 达 68.2%，高于 Nano-Banana-Pro（56.4%）和 GPT-Image-2（50.7%）。", "type": "model", "relTime": "3天前"}, {"id": 54, "title": "Andrew Yang 称 OpenAI 与 Anthropic 需合成互联网训练智能体", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2100569992567898287", "date": "2026-09-17T12:58:07.000Z", "summary": "Andrew Yang 称 OpenAI 和 Anthropic 如今需要合成互联网环境来训练其 AI 智能体，因为真实互联网已被智能体污染。他援引一位未具名实验室负责人的说法，称智能体在网络上留下自我复制代码，其他机器人可能遇到并生成新的智能体集群。Yang 表示\"主要公司已经污染了互联网\"，并认为这才是它们需要放缓的真正原因。", "type": "paper", "relTime": "3天前"}, {"id": 55, "title": "HumanLayer 开源 visual-pr 技能，基于 /show-me 生成精简 PR", "source": "X：Dex Horthy（HumanLayer）(@dexhorthy)", "sourceUrl": "https://x.com/dexhorthy/status/2100558413314859118", "date": "2026-09-17T12:12:06.000Z", "summary": "Dex Horthy 宣布开源与 @mattpocockuk 讨论后产出的 pull request skill，该技能随 HumanLayer 捆绑提供，基于 /show-me 并加入引导指令，用来削减多数 Agent PR 中的冗余噪音。可通过 npx skills add humanlayer/skills --skill visual-pr 安装。", "type": "tip", "relTime": "3天前"}, {"id": 56, "title": "借助 GPT Astra，开发者在《我的世界》中原生运行《使命召唤：黑色行动 2》Hijacked 地图", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/809.htm", "date": "2026-09-17T11:46:58.000Z", "summary": "开发者 Luckey Faraday 借助 GPT Astra 用 Java 重构项目，让《使命召唤：黑色行动 2》的 Hijacked 地图原生运行在《我的世界》的 OpenGL 上下文中，全屏帧率约 45 FPS。地图、碰撞检测、机器人、导航网格、武器与渲染均作为 Fabric 模组运行在《我的世界》内部，目前项目仍有很多工作要做，未来或加入更多地图、武器与多人模式。", "type": "paper", "relTime": "3天前"}, {"id": 57, "title": "ZenCreator 借助阿里云模型工作室扩展", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100537775099380141", "date": "2026-09-17T10:50:06.000Z", "summary": "大规模 AI 图像和视频生成需要的不仅仅是基础架构。ZenCreator 在阿里云 Model Studio 上扩展到每月 100 万+ 次生成，利用 Wan 和 Qwen 模型实现一致的品质，同时可靠地为 150 万+ 创作者和机构提供支持。了解更多：https://click.alibabacloud.com/m/20000003405/ 在阿里云 Model Studio 上试用 Qw...", "type": "model", "relTime": "3天前"}, {"id": 58, "title": "Qwen 接入 n8n，一键调用", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100531911206879316", "date": "2026-09-17T10:26:48.000Z", "summary": "Qwen 现在在 @n8n_io 里一键即可调用。无需 API key。无需单独账号。无需额外计费。从 n8n v2.36 起，Cloud Starter 和 Pro 用户（含免费试用）可通过 Gateway credits 调用 Qwen--文本、图像和视频生成都在单个节点内完成。符合条件的用户可获得一笔 starter 余额，在真实工作流中试用 Qwen。", "type": "product", "relTime": "3天前"}, {"id": 59, "title": "紫金矿业10亿元投资AI与人形机器人基金", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2100489934633361700", "date": "2026-09-17T07:40:00.000Z", "summary": "紫金矿业全资投资平台将出资10亿元人民币（1.4亿美元），参与一只总规模49亿元的新基金，聚焦人工智能、具身智能及前沿技术应用。该基金还获宁德时代投资平台与算力基础设施公司EdgeConneX China等支持。紫金矿业称投资主要为寻找可用于矿产勘探、智能矿山、加工与安全运营的技术，并已在西藏铜矿测试5G自动驾驶卡车。", "type": "paper", "relTime": "3天前"}, {"id": 60, "title": "Jev 不是聊天机器人：接收文本状态输出结构化打分", "source": "X：马东锡 NLP (@dongxi_nlp)", "sourceUrl": "https://x.com/dongxi_nlp/status/2100475029460799584", "date": "2026-09-17T06:40:46.000Z", "summary": "Jev 不是 chatbot，不能对话，它接收 state（主要是 text data）后打分并输出结构化结果。其定位是固定 workflow 中的\"螺丝钉\"，适合做日志分析和输出检测。", "type": "paper", "relTime": "3天前"}, {"id": 61, "title": "VideoClaw 发布：一句话提示完成视频制作", "source": "X：Haider (@haider1)", "sourceUrl": "https://x.com/haider1/status/2100473474502504956", "date": "2026-09-17T06:34:35.000Z", "summary": "VideoClaw 正式发布，将视频制作变成提示词驱动的一体化工作流，用户只需给出一段文字、播客、广告、原始素材甚至一个想法，它就能完成策划、剪辑、生成、添加 B-roll、音乐和字幕，并记住你偏好的风格。官方称其演示视频完全由 VideoClaw 制作，混合了真人拍摄与生成画面，可免费试用。", "type": "paper", "relTime": "3天前"}, {"id": 62, "title": "Google Research 推出 Retrieve-for-Train（R4T）：用 RL 编译的扩散检索器实现 12× 至 20× 更快的查询扇出", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/16/google-research-introduces-retrieve-for-train-r4t-an-rl-compiled-diffusion-retriever-for-12x-to-20x-faster-query-fan-out", "date": "2026-09-17T06:19:38.000Z", "summary": "Google Research 提出 Retrieve-for-Train（R4T），先用强化学习离线学习查询扇出，再蒸馏进一个 53.9M 参数的扩散 Transformer，单次非自回归前向即可生成全部检索方向。", "type": "paper", "relTime": "3天前"}, {"id": 63, "title": "阿里云 Wan3.0 展示单条 30 秒视频生成与多视频参考能力", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100460967540715803", "date": "2026-09-17T05:44:53.000Z", "summary": "阿里云介绍 Wan3.0 开始适配真实生产流程：从一年前的 5 秒片段到 15 秒，现在可直接生成单条 30 秒镜头，并支持导演级控制和最多引用五条视频的 omni-reference。制作者将 Wan3.0 用于实际制作工作流，可生成长镜头后按剧本剪辑，无需再拼接大量短片段，API 可通过 Model Studio 和 Qwen Cloud 访问。", "type": "model", "relTime": "3天前"}, {"id": 64, "title": "GPT-6 Astra 联手 Tripo 3.1 自动搭建 GTA 6 风格海滩别墅", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2100460255440474291", "date": "2026-09-17T05:42:04.000Z", "summary": "用户 insaneUEFN 用 OpenAI GPT-6 Astra、Atlas3DAI 和 Tripo 3.1 搭建了一条自动化管线，将 GTA 6 风格海滩别墅直接生成并组装进 UEFN。他放弃低模的 Tripo P2 改用 Tripo 3.1，把 70 个高模资产优化到 5K 或 1K 三角面，再通过 UEFN MCP 复用梁柱、窗户等模块化部件完成 1：1 重建，全程仅需两次方向性反馈。", "type": "paper", "relTime": "3天前"}, {"id": 65, "title": "香港三所小学与QwenWork合作试点AI教学", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100455931507069100", "date": "2026-09-17T05:24:53.000Z", "summary": "香港三所小学与QwenWork签署MoU，成为该市首批将AI引入日常教学与校务的试点小学。QwenWork可帮教师将文本、图像、音频、视频转为现成教学材料，并支持行政工作；学生将在IT和STEAM课上用AI与云工具创建网站、应用和游戏。中华基督教会基慈小学超半数教职工将从第一天起在日常工作中使用AI。", "type": "paper", "relTime": "3天前"}, {"id": 66, "title": "用GPT6加Hyper3D Rodin搭建可互动3D个人作品集的实操教程", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247511475&idx=1&sn=8a7bf92da9b058a05af2633416fba92f", "date": "2026-09-17T05:08:26.000Z", "summary": "作者用GPT6搭配Hyper3D Rodin的MCP，花一下午做出了可逛、可交互的3D个人作品集网页，场景含35个精细建模。流程为GPT-6画参考图并写交互代码，Rodin生成3D模型，BANG把模型按结构拆成独立零件以实现零件级动画，作者还把整个流程打包成skill发布在github.com/LearnPrompt/3Dworkshop。", "type": "tip", "relTime": "3天前"}, {"id": 67, "title": "圆谷公司谈AI如何变革视频创作", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100451230942171283", "date": "2026-09-17T05:06:12.000Z", "summary": "AI 正在为视觉叙事开启新篇章。在 #ApsaraConference2026 上，Tsuburaya Fields Holdings 执行董事 Toyoshima Yusaku 将探讨视频创作如何随 AI 演进。立即注册：https://click.alibabacloud.com/m/20000002869/ #AgenticEra #AgentNative #AIAgentsAtAps...", "type": "paper", "relTime": "3天前"}, {"id": 68, "title": "特斯拉 Cybercab 全国巡展首秀亮相京沪，9 月 17 日至 21 日静态展出", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/398.htm", "date": "2026-09-17T02:02:17.000Z", "summary": "特斯拉 Cybercab 全国巡展首秀于 9 月 17 日在上海兴业太古汇和北京华贸特斯拉体验店开启，上海展至 9 月 21 日、北京展至 9 月 27 日，均为静态展示，不涉及在华上市销售或无人驾驶网约车商业运营。该车为面向无人驾驶网约车的两座车型，取消方向盘、踏板和后视镜，采用 8 颗摄像头与纯视觉、端到端神经网络方案，依托 FSD 技术。", "type": "paper", "relTime": "3天前"}, {"id": 69, "title": "The Sandbox 联手 Meshy 生成 3D 资产", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2100403294145483116", "date": "2026-09-17T01:55:43.000Z", "summary": "太激动了 🤩  The Sandbox 与 Meshy 达成合作，Meshy 是领先的 AI 驱动 3D 资产生成平台，帮助游戏开发者更快、更精准地构建资产。🔥", "type": "paper", "relTime": "3天前"}, {"id": 70, "title": "高德地图 2026 发布：导航 Live 实时感知环境，上线避雷指南", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/383.htm", "date": "2026-09-17T01:13:37.000Z", "summary": "高德地图 2026 发布，核心升级导航 Live 将自然对话、多模态感知和空间理解融入驾车、步行和游览场景，可识别施工等路况、按需求调整路线并生成与行程时长匹配的个性化播客。高德 AI 对话聚焦出发前复杂出行规划，可调用避雷指南从营业时间、行程节奏等 15 个维度提前识别风险；鹰眼守护预警系统新增 4 类骑行场景，覆盖风险由 24 类扩展至 28 类，累计播发预警超 629 亿次。", "type": "paper", "relTime": "3天前"}, {"id": 71, "title": "Nunchux AI 推出 VC-Attention：免训练低比特注意力内核，加速视频 Diffusion Transformer", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/16/nunchux-ai-introduces-vc-attention-a-training-free-low-bit-attention-kernel-that-speeds-up-video-diffusion-transformers", "date": "2026-09-17T00:45:06.000Z", "summary": "Nunchux AI 发布免训练低比特注意力内核 VC-Attention，针对视频 Diffusion Transformer 的值量化误差与 softmax 瓶颈，由 V-Smooth 和 ExpCast-FP8 两部分组成。", "type": "paper", "relTime": "3天前"}, {"id": 72, "title": "KV Cache 分层：PMem 与 400Gb RDMA 内存池之争", "source": "X：karminski (@karminski3)", "sourceUrl": "https://x.com/karminski3/status/2100374881624060051", "date": "2026-09-17T00:02:49.000Z", "summary": "针对 Intel Optane PMem 作为 KV cache 分层介质的讨论，karminski 实测指出其写速度甚至打不过 SSD，CPU1 上 2 条 128G 还受 NUMA 影响。他认为现代 PD 分离推理至少需要 40GB/s 的 KVCache 池速度（传输时间不超过 Prefill 耗时的 10%），因此 400Gb RDMA 内存池更合适。", "type": "paper", "relTime": "4天前"}, {"id": 73, "title": "FAMOS：从稀疏观测前馈建模3D关节物体", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.20817", "date": "2026-09-17T00:00:00.000Z", "summary": "FAMOS 是一个前馈模型，可从稀疏、无序的部分点云集合中预测可动部件分割与关节参数，并支持包括单视图在内的可变数量输入。它提出 Multi-state Articulation Transformer，通过交替的状态级与全局注意力聚合跨观测的关节线索，并引入 observed articulation span 目标监督各部件在输入观测中的运动范围。", "type": "model", "relTime": "4天前"}, {"id": 74, "title": "VA-Bench：通过视觉演示、主动感知与度量控制评测具身空间智能", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.19554", "date": "2026-09-17T00:00:00.000Z", "summary": "VA-Bench 发布，用于评测 MLLM 的完整\"观察-推理-行动-修正\"闭环，模型仅凭 RGB 演示学习流程并主动选择相机视角、发出笛卡尔度量指令。基准含 14 个基础任务族、7 个留出几何/布局变体和五物体长程组合赛道，最佳模型三次运行宏平均任务成功率仅 53.93±3.17%。", "type": "model", "relTime": "4天前"}, {"id": 75, "title": "Video DeltaNet：面向直播视频生成的视频原生混合注意力机制", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.20744", "date": "2026-09-17T00:00:00.000Z", "summary": "Video DeltaNet（VDN）将局部 Softmax 注意力与双向线性记忆结合，其线性分支 Video Delta Attention（VDA）按帧更新记忆并联合建模空间 token，用于长程视频上下文。", "type": "paper", "relTime": "4天前"}, {"id": 76, "title": "UFO：面向多模态图像生成全条件对齐的链式评估框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.12397", "date": "2026-09-17T00:00:00.000Z", "summary": "研究团队提出 UFO，首个面向多模态图像生成全条件对齐的同步评估框架，通过将全条件对齐拆解为细粒度、解耦的原子评估单元（AEU）链并分类调用通用或专用功能完成验证。实验显示 UFO 与人类评估偏好的相关性最高，平均提升 15.25%。团队同时发布 UFO-Bench，用于在文本与视觉条件多样交互下整体评估现有定制化模型。", "type": "model", "relTime": "4天前"}, {"id": 77, "title": "GPT-6 Astra 上线 OnSolo，推出白盒视频专家", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2100340851365077287", "date": "2026-09-16T21:47:36.000Z", "summary": "GPT-6 Astra 已在 OnSolo 上线，带来游戏生成、Whitebox Video Expert 和 3D Model Expert 三项更新。Whitebox Video Expert 可先用文字描述场景，由 Astra 推理空间与运动并生成白盒预览，让用户在正式渲染前验证走位、物体摆放和镜头运动。3D Model Expert 则能一句话生成可渲染、重混或导出的 3D 模型。", "type": "model", "relTime": "4天前"}, {"id": 78, "title": "Krea Agent 单视频多机位视角", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2100333494350307584", "date": "2026-09-16T21:18:22.000Z", "summary": "用 Krea Agent 从单个视频生成多个相机角度。  示例和提示词见下方 👇", "type": "paper", "relTime": "4天前"}, {"id": 79, "title": "CHOP 基于 NVIDIA MONAI 构建开源心脏建模平台，儿童心脏3D模型从四小时缩至秒级", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2100320521246413135", "date": "2026-09-16T20:26:48.000Z", "summary": "费城儿童医院（CHOP）基于 NVIDIA MONAI 构建了开源心脏建模平台，可将 CT、MRI 和超声图像转为儿童心脏的详细3D模型，过去需四小时人工工作，现在 AI 可在数秒内生成。医生可在手术前研究解剖结构、评估器械适配情况；CHOP 还在探索模拟不同支架在心脏模型中的表现，目标是接近实时。每个模型仍由心脏科或放射科医生审核签署。", "type": "model", "relTime": "4天前"}, {"id": 80, "title": "Videoclaw 推出 Mac 应用公开测试版，可通过对话生成产品演示和广告视频", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2100283879785423044", "date": "2026-09-16T18:01:12.000Z", "summary": "Videoclaw 推出 Mac 应用公开测试版，用户通过聊天让 AI 智能体制作产品演示和广告视频。应用可连接现有 ChatGPT 或 Claude 订阅，智能体在对话中完成剪辑、字幕、B-roll、配音、音乐和动效；输入可以是创意、脚本、文章或 Mac 本地素材，草稿可通过追问修改，花费前可先批准预算。", "type": "product", "relTime": "4天前"}, {"id": 81, "title": "AI 员工时代：AI 劳动力公司融资 1000 万欧元", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2100275145474707706", "date": "2026-09-16T17:26:30.000Z", "summary": "一家打造\"AI 员工\"的公司完成 €10M 融资，目标是构建全球最大的 AI 劳动力。这些 AI 同事拥有头像、职位和职业身份（邮箱、电话、Microsoft 或 Google 账号），可通过任意渠道联系，能主动工作并 24/7 自我配置学习，目前已在 300+ 家公司投产。推文作者认为，继聊天机器人和智能体之后，无需监督持续运行的\"AI 员工\"是第三步，且已经到来。", "type": "paper", "relTime": "4天前"}, {"id": 82, "title": "Union Alpha 匿名多模态模型上线 OpenRouter 和 OpenCode", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2100271241685033105", "date": "2026-09-16T17:10:59.000Z", "summary": "匿名\"隐身\"多模态模型 Union Alpha 今日上线 OpenRouter 和 OpenCode，主打研究、编程与智能体工作流，具备接近前沿的编程能力。在 AI/ML API 的 3D 场景渲染测试中，它生成同一任务仅用 44，358 tokens，比 Ox Alpha 的 127，064 tokens 少约 3 倍，且免费。", "type": "model", "relTime": "4天前"}, {"id": 83, "title": "Claude Code 支持生成 docs 和 slides artifacts 便于团队协作", "source": "X：Thariq (@trq212)", "sourceUrl": "https://x.com/trq212/status/2100270818433643000", "date": "2026-09-16T17:09:18.000Z", "summary": "Thariq 宣布 Claude Code 现在可以把 docs 和 slides 生成为 artifacts，方便与团队成员共享和协作。例如让 Claude 把 spec 写成 doc、分享给同事征求意见，就绪后再让 Claude 实现。引用 @claudeai 补充，还可在对话中用 Claude Docs 起草单页文档、用 Claude Slides 转成 deck、用 Claude D...", "type": "paper", "relTime": "4天前"}, {"id": 84, "title": "GPT-6 Astra 3D 创作挑战赛", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2100268691090792647", "date": "2026-09-16T17:00:51.000Z", "summary": "你能用 GPT-6 Astra 做什么？  【引用 @rpnickson】：你用 GPT-6 Astra 做过最疯狂的 3D 作品是什么？  我正在和 @OpenAIDevs 合作，看看你们有什么本事。  转发并在回复中留下链接、渲染图或视频。你有 24 小时。", "type": "paper", "relTime": "4天前"}, {"id": 85, "title": "Grok Bot 演示示教学习：点一遍鼠标生成工作流", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2100266510010741131", "date": "2026-09-16T16:52:11.000Z", "summary": "Grok Bot 演示了示教学习能力：工程师在 Google Slides 里手动做一遍动画排版，Bot 在后台记录视觉变化与点击轨迹，完成后封装成可调用的专属技能，下次同类任务自动执行。该方式把人类知识输入从写提示词、截图标注变成直接操作一遍，但录制的只是顺风局轨迹，页面改版或异常弹窗会让缺乏异常分支的 Bot 卡住，它学会的是怎么点而非为什么点。", "type": "paper", "relTime": "4天前"}, {"id": 86, "title": "PixVerse 用 GPT Image 2.5 与 Seedance 生成动画", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2100259922499821987", "date": "2026-09-16T16:26:01.000Z", "summary": "GPT Image 2.5 完美搞定了姿势表：九个连续帧，同一张脸，同一套服装。PixVerse 上的 Seedance 让它动了起来。", "type": "paper", "relTime": "4天前"}, {"id": 87, "title": "Runway 推出 Enhance Frame Rate：任意视频转 25-120 fps", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/company-news/introducing-enhance-frame-rate", "date": "2026-09-16T16:00:00.000Z", "summary": "Runway 发布新模型 Enhance Frame Rate，可将任意视频（不限于 Runway 生成）转换为 25、30、48、60 或 120 fps，并支持 NTSC 的 59.94 标准。该模型速度最高达其他插帧模型的 7 倍、成本仅为其三分之一，输出质量更高，支持最高 4K、5 分钟视频并保持源分辨率，每 2 秒视频收费 1 个 credit。", "type": "model", "relTime": "4天前"}, {"id": 88, "title": "PixVerse 用 GPT Image 2.5 与 Seedance 生成动画", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2100244061340815406", "date": "2026-09-16T15:22:59.000Z", "summary": "GPT Image 2.5 完美搞定了姿势表：九个连续帧，同一张脸，同一套服装。PixVerse 上的 Seedance 让它动了起来。", "type": "paper", "relTime": "4天前"}, {"id": 89, "title": "面壁 VoxCPM2 驱动 AI 配音工具 Dubedo", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2100224849343840567", "date": "2026-09-16T14:06:39.000Z", "summary": "开发者 @dubbedstudio 基于面壁智能 VoxCPM2 打造了商用 AI 配音工作室 Dubedo，可在翻译本地化视频时保留每位说话者的音色身份。Dubedo 支持 30 种目标语言的多语言配音，通过参考音频实现说话者专属声音克隆，并采用缓存语音表征加无服务器 GPU 推理。从转录、翻译到说话者感知的语音生成与最终混音，全流程整合于一处。", "type": "paper", "relTime": "4天前"}, {"id": 90, "title": "PixVerse 用 GPT Image 2.5 与 Seedance 2.5 生成舞蹈视频", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2100223180103377279", "date": "2026-09-16T14:00:01.000Z", "summary": "这不是屏幕录制……说真的？！GPT Image 2.5 构建了整个 UI 框架。  然后 PixVerse 上的 Seedance 2.5 让她完整跳起舞来，同时保持了自然的竖屏信息流外观。  现在我们再也分不清信息流里什么是真实的了。", "type": "paper", "relTime": "4天前"}, {"id": 91, "title": "豆包 seed-2.1-pro-0915 做卫星财报尽调工具", "source": "X：karminski (@karminski3)", "sourceUrl": "https://x.com/karminski3/status/2100175499821756499", "date": "2026-09-16T10:50:33.000Z", "summary": "有人用刚发布的豆包 seed-2.1-pro-0915 做了一个企业财报分析工具，模拟顶级做空机构的多源尽调思路：调用卫星遥感图像核查厂房建设进度、全球海事系统追踪船只卸货地点、本地招工网站排查招工信息。该版本重点升级了多跳搜索和复杂长程任务能力，使这类跨源信息整合成为可能。", "type": "paper", "relTime": "4天前"}, {"id": 92, "title": "YouMind 宠物照片视频生成技能", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2100167941404885362", "date": "2026-09-16T10:20:31.000Z", "summary": "如果你想创建自己的 👇 https://youmind.com/skills/pet-photo-video-generator-Kg7LxtExQ7UIwz", "type": "paper", "relTime": "4天前"}, {"id": 93, "title": "Meshy 上线 Ultra 4K，主打 4K 几何分辨率的 AI 3D 建模", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2100142910469804290", "date": "2026-09-16T08:41:03.000Z", "summary": "Meshy 宣布 Ultra 4K 正式上线，称其为首个达到 4K 几何分辨率的 AI 3D 建模功能，生成细节为其历史最丰富水平。附演示视频展示生成效果。", "type": "paper", "relTime": "4天前"}, {"id": 94, "title": "每日AI简报：Gemini 3.8 Live发布，GPT-5.5将下线", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2100140717058195825", "date": "2026-09-16T08:32:20.000Z", "summary": "Google 发布 Gemini 3.8 Live 与 3.8 Live Extended Thinking，支持 97 种语言自动检测、近实时视觉与后台工具调用，Live 已进入 Search Live 和 Gemini API 公开预览。", "type": "product", "relTime": "4天前"}, {"id": 95, "title": "智界 RX 获批 L3 级自动驾驶道路测试牌照，公开道路实测聚焦城市快速路", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/162.htm", "date": "2026-09-16T08:28:38.000Z", "summary": "鸿蒙智行宣布智界 RX 获批 L3 级自动驾驶道路测试牌照，余承东称正在公开城市快速路等复杂道路有序实测。博主视频显示测试车方向盘有 \"A\" 键，按下亮蓝光并激活 L3，小艺播报状态、中控屏显示 \"L3 自动驾驶中\"；车辆此前已完成模拟仿真及封闭场地测试，覆盖交通信号识别、自动紧急避险、最小风险策略等七大场景。", "type": "paper", "relTime": "4天前"}, {"id": 96, "title": "ZHO 用 GPT-6 Astra 打造\"我的灵感宇宙\"视觉作品", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2100135916371362289", "date": "2026-09-16T08:13:15.000Z", "summary": "ZHO 发布\"我的灵感宇宙\"（My Inspiration Universe）视觉作品，用旋转、连结、碰撞、重叠、循环的意象呈现灵感在脑海中的样子，形容其像\"一个不稳定的星系在优雅地舞蹈\"。该作品标注为 GPT-6 Astra|ZHO|开发系列。", "type": "paper", "relTime": "4天前"}, {"id": 97, "title": "技术普及为何如此缓慢：RDMA 与 AI 工具落地之困", "source": "X：karminski (@karminski3)", "sourceUrl": "https://x.com/karminski3/status/2100132990441705939", "date": "2026-09-16T08:01:38.000Z", "summary": "李博杰指出技术从发明到广泛应用极其缓慢：2016-2018 年 Azure 已用 RDMA 加速存储，如今很多基模公司加载上 T 模型仍需数分钟。2019 年他做昇腾 AKG 算子自动优化时看好多面体优化，至今鲜有算子编译器采用，取代手写算子的反而是 LLM。他认为 AI 擅长\"小步快跑\"式优化，但 writing、taste 和系统设计仍很糟糕，谈\"取代\"为时尚早。", "type": "model", "relTime": "4天前"}, {"id": 98, "title": "Stellantis 发布 BOW 纯电自动驾驶配送概念车：无驾驶室、无具体参数", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/139.htm", "date": "2026-09-16T08:00:48.000Z", "summary": "Stellantis 在汉诺威国际商用车展（IAA Transportation）发布纯电自动驾驶配送概念车 BOW（Box On Wheels），与优奇机器人（UQI Robotics）联合开发，无驾驶室、驾驶舱与仪表盘，外形如同可自行移动的快递柜。", "type": "paper", "relTime": "4天前"}, {"id": 99, "title": "彭博亿万富豪指数显示字节跳动创始人张一鸣首次成为亚洲首富", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/099.htm", "date": "2026-09-16T07:23:37.000Z", "summary": "彭博亿万富豪指数显示，字节跳动创始人张一鸣身家超过 1，050 亿美元（约合 7，063.18 亿元人民币），首次超越高塔姆·阿达尼成为亚洲首富。其财富来自 TikTok 的全球普及及字节跳动对 AI 的持续投入，产品包括豆包聊天机器人和视频生成模型 Seedance；本月其财富增加超 120 亿美元，而阿达尼身家自 6 月的 1，200 亿美元持续回落。", "type": "industry", "relTime": "4天前"}, {"id": 100, "title": "阿里云 Wan3.0 视频模型发布：从 2.1 到 3.0 的跨越", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100109857848181036", "date": "2026-09-16T06:29:42.000Z", "summary": "阿里云发布视频生成模型 Wan3.0，官方称其并非增量更新，而是从 Wan 2.1、2.2 到 3.0 的跨代跃升，在运动参考、一致性、创意控制和分辨率上均有提升。官方表示每一步都让模型对创作者、电影人和叙事者更友好，并称工具终于不再妨碍讲故事的人。Wan3.0 已开放 API 接入，可通过 Model Studio 和 Qwen Cloud 使用。", "type": "model", "relTime": "4天前"}, {"id": 101, "title": "阿里云QwenWork落地香港小学教学场景", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100092855129637309", "date": "2026-09-16T05:22:09.000Z", "summary": "香港Kei Tsz Primary School超半数教职工将从首日起在日常工作中使用AI。教师可用QwenWork将文本、图像、音频和视频转化为现成教学材料，加快备课并分担行政事务；学生将在IT和STEAM课上用AI与云工具创建网站、应用、游戏和数字内容。全校还将开展AI专业发展与实操工作坊，并在活动中提供实时翻译支持。", "type": "paper", "relTime": "4天前"}, {"id": 102, "title": "Formas 推出面向建筑与产品设计的 AI 3D 建模工具 Cartesian", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.formas.ai/cartesian", "date": "2026-09-16T04:18:19.801Z", "summary": "Formas 推出 AI 3D 建模工具 Cartesian，定位建筑设计领域，支持通过文字、草图或照片生成可编辑 3D 模型。模型由精确的实体和 NURBS 几何构成而非网格近似，每个对象独立可改，保留部分不被重绘，并支持导出 Rhino 3DM 和 SketchUp SKP，AutoCAD DWG 与 BIM IFC 在计划中。", "type": "model", "relTime": "4天前"}, {"id": 103, "title": "开发者实测 Tripo P2.0 加 GPT-6 Astra 的 UE5.8 四足机器人动画制作管线", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2100070583375671763", "date": "2026-09-16T03:53:39.000Z", "summary": "Tripo 官方转发开发者 @koguGameDev 的实测：用 GPT image 2 生成参考图、Tripo P2.0 做 3D 生成，再让 Astra 通过 MCP 操作 Blender 完成拓扑、UV 与 IK 绑定，导入 UE5.8 实现四足机器人动画。动画实现两次失败，作者认为模型在把需求转化为设计与实现时仍需懂行者衔接，但 AI 带来的能力普惠会催生更多涌现。", "type": "tip", "relTime": "4天前"}, {"id": 104, "title": "Tripo 批量生成模块化资产包并导入 Unity", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2100012275826569506", "date": "2026-09-16T00:01:57.000Z", "summary": "Tripo 支持一次性生成模块化资产包，再在 Blender 中拆分后导入 Unity。该流程结合 Tripo 的快速 3D 生成与 OpenAI GPT-6 Astra，被称可大幅提升游戏开发效率。引用推文作者正测试这一方式，以避免在 Blender 中用 Astra 从零构建资产而消耗大量 token。", "type": "paper", "relTime": "5天前"}, {"id": 105, "title": "用 VLM 智能体实现上下文机器人学习", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.19138", "date": "2026-09-16T00:00:00.000Z", "summary": "GPT-Policy 是一个面向上下文机器人学习的通用智能体框架，由上下文编译器、提出机器人工具动作的 VLM 和验证并执行动作的受限控制器组成，无需梯度更新或改动任务专属参数。真机试验中，人类视频演示即使没有机器人动作标签也能提升任务完成度，对齐的动作参考在接触敏感任务上带来进一步提升。", "type": "paper", "relTime": "5天前"}, {"id": 106, "title": "PANORAMA：通过掩码候选选择实现全景接地的图像描述", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.19143", "date": "2026-09-16T00:00:00.000Z", "summary": "研究提出 PANORAMA，一种将短语接地建模为从短语条件掩码候选池中选择的 VLM，可同时描述前景物体与背景区域并为每个短语生成像素级掩码。团队还构建了基于全景分割数据集的人工标注基准 PanoCaps，并提出短语-掩码匹配协议与 gPQ 指标。PANORAMA 在 PanoCaps 上取得最佳整体接地表现，并在多个像素级接地任务上匹配或超越专用模型，代码、数据与模型均已开放。", "type": "model", "relTime": "5天前"}, {"id": 107, "title": "DeepSeek V4 哪些型号支持图像输入？OpenRouter 逐款梳理与调用指南", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/insights/deepseek-v4-vision", "date": "2026-09-16T00:00:00.000Z", "summary": "OpenRouter 梳理其目录中的 DeepSeek V4 系列图像输入支持情况：V4.1 Flash 原生读图（2026年9月10日上线，$0.15/$0.60 每百万 token）。", "type": "tip", "relTime": "5天前"}, {"id": 108, "title": "MiniMax-H3 能否推理物理世界？一项全模态生成模型评测", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.18323", "date": "2026-09-16T00:00:00.000Z", "summary": "针对 MiniMax-H3 的全模态能力，一项新评测用 517 个实例考察其物理世界推理表现，整体成功率为 41.97%。其中基于视频的决策推理最高，达 56.00%，而基于音频的消歧推理最弱，仅 27.40%。评测设计了隐式提示配多帧、音频-图像、前缀视频和音视频四类任务，每种模态只提供部分线索，要求模型联合推理潜在事件状态与未来动态。", "type": "model", "relTime": "5天前"}, {"id": 109, "title": "FastVideo 的 FastH3 现已登陆 ComfyUI，支持视频与立体声音频一起生成", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2100011117682766230", "date": "2026-09-15T23:57:21.000Z", "summary": "FastVideo 的 FastH3 现已在 ComfyUI 上可用，可在数秒内同时生成视频和原生立体声音频。官方推荐用于需要大量镜头的预演与动态分镜、全质量渲染前的时间和对话测试，以及时间紧迫的短视频和社交媒体工作，目前可本地运行，云上版本即将推出。", "type": "paper", "relTime": "5天前"}, {"id": 110, "title": "Krea Agent 教程：用一张图生成可全权控制镜头的视频", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2099988913570148383", "date": "2026-09-15T22:29:07.000Z", "summary": "Krea 官方演示如何用 Krea Agent 创建具备完整镜头控制的视频。步骤为先输入一张图片让智能体生成 3D 场景，再指定任意镜头运动，最后用 Seedance 2.0 渲染 3D 视频，官方已开放试用入口。", "type": "tip", "relTime": "5天前"}, {"id": 111, "title": "Grok Imagine 上线图片文字编辑功能", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2099956645090472098", "date": "2026-09-15T20:20:54.000Z", "summary": "Grok Imagine 用户现可精确编辑生成图片中的文字，手动设置颜色、字号、字体和文字对齐方式。该功能以 Beta 版推出，SpaceXAI 团队正在收集反馈，适用于营销和文字较多的创意图片场景。", "type": "paper", "relTime": "5天前"}, {"id": 112, "title": "Creatify 发布面向视频广告的 Boreal 文生视频与图生视频模型", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2099948341832339666", "date": "2026-09-15T19:47:54.000Z", "summary": "Creatify Labs 发布面向视频广告的文生视频与图生视频模型 Boreal，定价每秒 $0.01，已向所有 Creatify 用户开放。模型基于开源权重的 LTX-2.5 后训练，训练语料包括真实广告素材、创作者风格 UGC 和客户制作需求；官方称在 40 多个制作案例的盲测人评中，后训练使 Boreal 对基座模型的胜率达 81%，并称其比 Seedance 2.5 最多便宜 47 倍。", "type": "model", "relTime": "5天前"}, {"id": 113, "title": "Agility 新款人形机器人 Digit 5 可停下蹲下以避免伤害人类同事", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/09/agilitys-new-humanoid-robot-will-stop-squat-to-avoid-harming-human-coworkers", "date": "2026-09-15T18:33:02.000Z", "summary": "Agility Robotics 发布首款专为与人安全共事设计的人形机器人 Digit 5，检测到有人靠近时可自主避让、静止或下蹲坐下。该机器人采用 NVIDIA Thor IGX 硬件与 Halos for Robotics 安全软件栈，客户可在 2027 年上半年获得早期访问权限，年底全面上市。", "type": "paper", "relTime": "5天前"}, {"id": 114, "title": "Odyssey 发布基础世界模型 Odyssey-3，可用数十小时数据适配机器人与驾驶", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2099922618522726746", "date": "2026-09-15T18:05:41.000Z", "summary": "Odyssey 发布基础世界模型 Odyssey-3，称其可控制机器人、驱动人形、驾驶车辆、训练 AI、操控无人机甚至玩视频游戏。其路线是先用预训练世界模型，再接上用数十小时机器人演示训练的动作解码器；据作者转述，驾驶策略仅用 20 小时模拟数据训练后就能驶上印度真实街道，机械臂、人形遥操作和模拟无人机数据的用量也仅为数十小时。", "type": "model", "relTime": "5天前"}, {"id": 115, "title": "Odyssey 预览 Odyssey-3 世界模型，号称物理智能体", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2099913645987639451", "date": "2026-09-15T17:30:02.000Z", "summary": "Odyssey 正在预览 Odyssey-3 世界模型，官方称其为 Physics Agent，可从视觉观察中学习世界运行规律，再将理解用于控制真实与模拟系统。该模型能跨不同机器和游戏运行，只需少量任务经验即可学会一套控制方式；预览涵盖人形机器人、机械臂、汽车、无人机、可玩游戏以及其他 AI 智能体的训练。", "type": "model", "relTime": "5天前"}, {"id": 116, "title": "Poolday 用 AI 智能体自动化视频制作全流程", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2099908124551585996", "date": "2026-09-15T17:08:05.000Z", "summary": "Poolday 用 AI 智能体接管视频制作全流程：一次提示词即可剪辑真实素材、按任务自动选择生成模型，并在交付前自查成片。其引用推文称已融资 1100 万美元，累计为全球企业完成超 1 亿次视频编辑，现已向所有人开放，前 50 名用户可由智能体直接生成视频。", "type": "model", "relTime": "5天前"}, {"id": 117, "title": "Poolday 获 1100 万美元融资，AI 智能体全流程做视频", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2099902236839334166", "date": "2026-09-15T16:44:42.000Z", "summary": "Poolday 获 1100 万美元融资，用 AI 智能体端到端完成视频制作：输入目标和素材后，它会提问、规划、生成、剪辑、合成并自检成片。官方称已累计处理 70 万次智能体运行和 1 亿次剪辑，并支持成片后按具体片段或元素局部修改，而非整片重生成。", "type": "paper", "relTime": "5天前"}, {"id": 118, "title": "Poolday 视频智能体开放：70万次运行、1亿次剪辑", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2099894789160497444", "date": "2026-09-15T16:15:06.000Z", "summary": "Poolday 宣布其视频智能体已累计完成 70 万次 agent 运行和 1 亿次视频剪辑，并正式向所有人开放。该智能体可读取视频需求，结合用户已有素材与品牌资产自动完成成片，需要新画面时可调用生成模型，且输出保持逐层可编辑，能替换 logo、修改字幕。此前 Poolday 已融资 1100 万美元，前 50 名用户可让智能体直接为其制作视频。", "type": "model", "relTime": "5天前"}, {"id": 119, "title": "Runway 详解实时视频生成的实时审核系统", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/safety/moderation-in-real-time", "date": "2026-09-15T16:00:00.000Z", "summary": "Runway 为即将发布的实时视频生成模型设计了同步审核系统，借助 Zentropi 的 CoPE-B 模型，安全审查平均耗时不到 0.5 秒，可将违规内容的暴露窗口压缩至半秒以内。", "type": "model", "relTime": "5天前"}, {"id": 120, "title": "Vidu S2 论文：实时交互、可编辑与空间视频生成", "source": "X：AK (@_akhaliq)", "sourceUrl": "https://x.com/_akhaliq/status/2099883001840828920", "date": "2026-09-15T15:28:16.000Z", "summary": "Vidu S2 论文发布，提出实时交互、可编辑和空间视频生成，包含实时交互数字人模型 Vidu S2-Avatar 和实时视频编辑模型 Vidu S2-Editing。Vidu S2-Avatar 相比 Vidu S1 支持实时 720p 生成、可随时更新的动态参考和更强的指令遵循；Vidu S2-Editing 支持对视频流实时编辑，包括风格渲染、服装、角色和背景替换。论文链接 https...", "type": "paper", "relTime": "5天前"}, {"id": 121, "title": "生数科技发布 Vidu S2：含 Avatar 与 Editing 双模型，探索空间视频", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489246&idx=2&sn=b23b39da69f6c75594eccac11854111f", "date": "2026-09-15T14:30:59.000Z", "summary": "生数科技正式发布 Vidu S2，包含面向数字角色实时交互的 Vidu S2-Avatar 和面向视频流实时编辑的 Vidu S2-Editing，并探索面向 VR 头显的实时空间视频生成与编辑。", "type": "model", "relTime": "5天前"}, {"id": 122, "title": "SimpliSafe 推出 Video Doorbell Series 2，人类保安可实时查看门前画面", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/995365/simplisafe-video-doorbell-series-2-virtual-guard-price-specs", "date": "2026-09-15T13:36:45.000Z", "summary": "SimpliSafe 发布 Video Doorbell Series 2，售价 $199.99，支持 2K 分辨率、10x 变焦和双频 Wi-Fi，需搭配 SimpliSafe 基站与键盘使用。该门铃接入 Active Guard Outdoor Protection（月费 $49.99 起），当 AI 检测到可疑活动时，监控人员可接入摄像头实时查看、对话并尝试威慑入侵者。", "type": "paper", "relTime": "5天前"}, {"id": 123, "title": "Pony.ai 联合广汽发布 L4 自动驾驶电动重卡 T9 Robotruck", "source": "Artificial Intelligence News（网页）", "sourceUrl": "https://www.artificialintelligence-news.com/news/pony-ai-autonomous-electric-truck-for-logistics-fleets", "date": "2026-09-15T11:18:19.116Z", "summary": "Pony.ai 与广汽商用车联合发布 L4 级自动驾驶电动重卡，基于广汽 T9 纯电重卡架构打造，属其 Robotruck 平台第四代产品，今年晚些时候量产，首批用于长途货运、物流专线和港口运输。", "type": "product", "relTime": "5天前"}, {"id": 124, "title": "Meshy API 打造宝箱中的奥德赛场景", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2099804182551429209", "date": "2026-09-15T10:15:04.000Z", "summary": "一个完整的《奥德赛》场景，装进了一个宝箱里。用 GPT-6 Astra + Meshy API 构建。  创作 → Astra + Meshy 生成概念图 构建 → Meshy 将它们转为 3D 模型 动效 → Astra + Blender 为场景制作动画  你会往你的宝箱里放什么？", "type": "model", "relTime": "5天前"}, {"id": 125, "title": "对抗式时尚能否对抗 AI 全景监视？DEF CON 展示反监控服饰新进展", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://spectrum.ieee.org/adversarial-fashion", "date": "2026-09-15T05:27:28.301Z", "summary": "网络安全专家 Bill Swearingen 在 DEF CON 展示用强化学习生成的对抗图案，可干扰 YOLO 等 11 个目标检测模型，降低其置信度甚至使其无法检测。", "type": "model", "relTime": "5天前"}, {"id": 126, "title": "Muse 展示超强舞蹈能力", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2099708447893962874", "date": "2026-09-15T03:54:39.000Z", "summary": "说实话这太可爱了，我看得停不下来  【@dtrinh】：超级智能这，超级智能那……  不如来看看 @muse 超酷的舞蹈", "type": "paper", "relTime": "5天前"}, {"id": 127, "title": "Waymo 自动驾驶出租车商业服务目标 2027 年登陆日本东京", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/002/484.htm", "date": "2026-09-15T03:12:43.000Z", "summary": "Alphabet 旗下 Waymo 宣布其 Robotaxi 商业服务目标于 2027 年在日本东京全面推出，具体取决于日本国家与地方政府的监管批准。Waymo 已从 2025 年起与日本交通、GO 合作进行有监督实地测试，部署将从少量车辆起步，逐步扩展至约 100 辆并覆盖东京主要街区。", "type": "industry", "relTime": "5天前"}, {"id": 128, "title": "FLAT：将图像与文本重采样为 1D 可变长度对齐跨模态 token，统一检索与生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.16591", "date": "2026-09-15T00:00:00.000Z", "summary": "FLAT 是一个联合优化共享多模态编码器与 T2I、I2T 解码器的表示预训练框架，将视觉与文本输入映射到统一的连续 1D 序列空间，并通过 prefix-K token 上的嵌套 dropout 支持动态输出长度。", "type": "paper", "relTime": "6天前"}, {"id": 129, "title": "PhysStream：带结构化场景记忆与细粒度运动控制的流式物理视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.17521", "date": "2026-09-15T00:00:00.000Z", "summary": "PhysStream 是一个自回归的图像到视频生成模型，通过从已生成帧在线提取的位置图与目标跟踪图构成结构化场景记忆，并用稀疏速度增量信号实现细粒度运动控制。它采用两阶段训练：先微调双向模型加入运动控制条件，再训练因果自回归模型并加入场景记忆。在合成基准上，其运动分布距离（FVMD）比最强基线降低 33%、轨迹误差降低 12%，在超过 85% 的真实场景对比中被人类评估者偏好。", "type": "model", "relTime": "6天前"}, {"id": 130, "title": "拟人手如何用五指实现自支撑移动与操作", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.17172", "date": "2026-09-15T00:00:00.000Z", "summary": "一项研究让拟人手用同一组手指完成移动、支撑体重与环境交互，且保留原有手指设计与位置控制器。该方法用强化学习应对手指不均衡问题，并在依据硬件测量校准的模拟器中训练，其奖励公式下的移动速度快于为四足机器人调优的奖励。硬件上，任务专用策略实现了无缆爬行、转向与跌倒恢复，还能在无视觉条件下执行连续键盘指令，并借助俯视视觉反馈将物体推至目标。", "type": "paper", "relTime": "6天前"}, {"id": 131, "title": "EventEgoHands++：基于事件相机的第一视角 3D 手部网格重建与真实数据集 EEH-R", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.17189", "date": "2026-09-15T00:00:00.000Z", "summary": "EventEgoHands++ 提出一种第一视角事件相机 3D 手部网格重建框架，通过 Hand Detector 估计左右手的实例级边界框与掩码，并用 Adaptive Attention 根据检测结果动态门控注意力，建模双手空间关系与交互。作者还构建了 EEH-R，称其为目前最大的真实事件第一视角手部数据集，含约 1M 标注帧，覆盖低光环境。在合成与真实数据集上，该方法一致优于基线。", "type": "paper", "relTime": "6天前"}, {"id": 132, "title": "MiniMax H3 在 8×B200 上实现超 2 倍实时去噪", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2099642910853788051", "date": "2026-09-14T23:34:14.000Z", "summary": "MiniMax H3 借助 SGLang-Diffusion 与 VDN-H3，在 8×B200 上实现超过 2 倍实时去噪，预热后端到端 9.0s 生成 14.4s 的 768p 视频，其中 8 步去噪仅需 6.9s。在 103 条测试提示词上，相比 50 步稠密 H3 未测得质量下降。", "type": "paper", "relTime": "6天前"}, {"id": 133, "title": "ElevenLabs MCP 推出语音、音乐、图像和视频生成，ElevenCreative 带来 50 多个模型", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2099641853813633191", "date": "2026-09-14T23:30:02.000Z", "summary": "ElevenLabs 在其 MCP 中推出语音、音乐、图像和视频生成，ElevenCreative 通过 MCP connector 提供 50 多个模型，可在 AI 助手中生成语音、转录、配音、音乐、音效、图像和视频。", "type": "model", "relTime": "6天前"}, {"id": 134, "title": "Rohan Paul 用 ElevenLabs MCP 同一提示词对比四个模型表现", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2099630303103033826", "date": "2026-09-14T22:44:08.000Z", "summary": "Rohan Paul 转引 ElevenLabs 在 MCP 中新增语音、音乐、图像和视频生成功能，可生成语音、转录、配音、音乐、音效、图像和视频。作者用同一提示词在四个模型上测试，只有一个符合硬光约束，并认为模型放在同一 MCP 后无需预先选型，跑任务看各自表现即可选用合适的那个。", "type": "tip", "relTime": "6天前"}, {"id": 135, "title": "机器人初创公司 Reward AI 发布通用操作策略 OM-1：仅用人类演示训练，无需遥操作与真机数据", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/14/reward-ai-releases-om-1-a-robot-policy-trained-on-human-demonstrations-only-with-no-teleoperation-or-on-robot-data", "date": "2026-09-14T21:08:17.000Z", "summary": "机器人初创公司 Reward AI 发布通用操作策略 OM-1（Omnibody Model 1），仅靠穿戴式 7 自由度手套采集的人类演示训练，不使用遥操作和真机数据，可运行于工业机械臂与人形机器人。其电磁追踪在 67 cm/s 下平均过冲误差 9.5 mm，较视觉惯性方案（24.9 mm）降低 60%。权重、代码与 API 均未开放，开发者暂无法自行部署。", "type": "model", "relTime": "6天前"}, {"id": 136, "title": "纽约地检署查封12个名人深伪色情网站", "source": "404 Media（RSS）", "sourceUrl": "https://www.404media.co/new-york-district-attorney-seizes-12-celebrity-deepfake-websites", "date": "2026-09-14T17:26:37.000Z", "summary": "纽约地区检察官办公室周一宣布查封12个托管AI生成未经同意亲密影像的网站，自称是史上最大规模的此类查封行动，涉及约1200人的照片被制成超逼真色情图像和视频，对象多为演员、政客、运动员等公众人物。地检官 Alvin Bragg 援引纽约州2023年将色情深伪入刑的法律，鼓励受害者联系其网络犯罪局，并表示只要网站可从曼哈顿访问即可采取行动；是否涉及未成年人图像仍在调查中。", "type": "industry", "relTime": "6天前"}, {"id": 137, "title": "ZHO 用 GPT Images 2.5 打造人物随拍与立体性格", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2099531042130674012", "date": "2026-09-14T16:09:42.000Z", "summary": "ZHO 分享用 GPT Images 2.5 生成的 CharacterDesign（ZHGO 创意系列）人物随拍作品，称人物性格更加立体。其引用推文表示生成效果\"有那味了\"，对成品感到满意。", "type": "paper", "relTime": "6天前"}, {"id": 138, "title": "PixVerse：双参考控制生成视频", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2099521095351304640", "date": "2026-09-14T15:30:11.000Z", "summary": "别再因为主体乱动而白白烧掉 credits。  GPT-6 Astra 在 Blender 中构建一个可编辑的森林 previs。灰色模型视频控制相机和运动，另一张单独的图像控制巨眼、材质、雾效和光照。  PixVerse 将两个参考合成为最终视频。", "type": "model", "relTime": "6天前"}, {"id": 139, "title": "小马智行发布第四代自动驾驶重卡 Robotruck，将于年内规模量产", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/002/291.htm", "date": "2026-09-14T13:06:34.000Z", "summary": "小马智行在德国汉诺威国际商用车展发布第四代 L4 级自动驾驶重卡 Robotruck，计划今年内规模化量产，投放干线物流、专线物流及港口运输场景。该车基于广汽领程 T9 纯电重卡打造，搭载 9 颗激光雷达、3 颗毫米波雷达和 13 个摄像头，自动驾驶套件 BOM 成本较上一代下降 70%，吨公里运输成本将下降 30%。", "type": "paper", "relTime": "6天前"}, {"id": 140, "title": "荣耀笔记本 9 月升级：YOYO Claw 新增悬浮球与专业编码能力", "source": "IT之家（RSS）", "sourceUrl": "https

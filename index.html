ps://www.ithome.com/1/005/564.htm", "date": "2026-09-22T02:09:22.000Z", "summary": "Snap 为 Snapchat Lens+ 订阅服务新增多项生成式 AI 功能，用户长按聊天文字消息、选择流行或摇滚等风格并点击\"Create Song\"，即可生成原创短歌曲，试听后发送。同时上线 AI Remix、AI 增强字体、Imagine Lens 和 AI Clips（照片转 5 秒高清视频）。Lens+ 每月 7.99 美元，AI 功能按次消耗固定月度额度，用尽需等下一计费周期重置。", "type": "paper", "relTime": "1天前"}, {"id": 28, "title": "Robin Williams 女儿 Zelda 呼吁粉丝停止制作其父 AI 视频：有点羞耻心", "source": "Hacker News：AI 热帖", "sourceUrl": "https://variety.com/2026/film/news/robin-williams-daughter-ai-videos-1236871568", "date": "2026-09-22T01:24:49.000Z", "summary": "Robin Williams 的女儿 Zelda Williams 在 X 发文，要求粉丝停止传播一段用 AI 生成的其父视频，称该视频\"明显是 AI，甚至算不上逼真\"，声音机械糟糕。", "type": "paper", "relTime": "1天前"}, {"id": 29, "title": "索尼 SIE 申请 AI 自修复系统专利：实时生成诊断固件修复 PlayStation 故障", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/005/501.htm", "date": "2026-09-21T23:28:47.000Z", "summary": "索尼 SIE 提交了一项基于 AI 的 PlayStation 自动诊断与修复系统专利，由 AI 服务器在检测到软件问题后实时生成针对性诊断固件并直接部署到故障主机，以减少保修申请和客服工单。专利同时指出，AI 生成的固件补丁可能带有缺陷导致设备变砖，且云端集中部署存在服务器被攻击后向大量设备推送恶意固件的风险。该方案目前仅为探索中的技术方案，尚不代表会实际应用。", "type": "paper", "relTime": "2天前"}, {"id": 30, "title": "小米 MiMo-V2.6 系列三款模型上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2102142830034698644", "date": "2026-09-21T21:08:01.000Z", "summary": "小米 MiMo-V2.6 系列三款模型上线 OpenRouter，包括 1T+ 参数旗舰、开源 MoE 模型和约 10 倍速的旗舰变体。三款模型均支持文本、图像、视频和音频输入，上下文为 1M。", "type": "model", "relTime": "2天前"}, {"id": 31, "title": "人类视频预训练机器人：经验密度比时长更关键", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2102124101490065773", "date": "2026-09-21T19:53:36.000Z", "summary": "人类视频正成为机器人预训练的重要数据来源，但需先将人类经验转化为机器人自身的身体与动作再训练才更有效。@MaxinsightsAI 已录制 200 万小时第一人称人类经验，并提出有效经验 ≈ 时长 × 每小时信息量，主张从\"经验规模\"和\"经验密度\"两个轴扩展。经验密度来自保留每次演示中的接触位置、物体运动、力与抓取、几何、时序及工具使用等物理信息。", "type": "paper", "relTime": "2天前"}, {"id": 32, "title": "Viggle 发布 PINOC MCP：面向 AI 智能体的角色动画引擎", "source": "X：Viggle AI (@ViggleAI)", "sourceUrl": "https://x.com/ViggleAI/status/2102109528691277923", "date": "2026-09-21T18:55:41.000Z", "summary": "Viggle 发布 PINOC MCP，定位为 AI 智能体的角色动画引擎，智能体在搭建游戏或 3D 场景后调用 PINOC 生成已绑定骨骼的动画 Gaussian splat 角色。它还支持用文生动作、视频转 mocap 或预设动作库驱动自有 mesh；引用推文称整条宣传视频（含屋顶跑酷游戏）由 GPT-6 Astra 加 PINOC MCP 制作。", "type": "paper", "relTime": "2天前"}, {"id": 33, "title": "Pexo 推出 Mark to Fix 视频修改工作流", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2102102866689458190", "date": "2026-09-21T18:29:13.000Z", "summary": "Pexo 的 Mark to Fix 工作流允许用户在视频帧上框选区域并说明需要修改的内容，让 AI 智能体有明确的修改目标。该产品定位为 AI 视频智能体，用户可像在文档里留评论一样标记视频并告知修改需求，无需复杂提示词或学习新工具。官方演示视频中的画面、动态图形、音乐、字幕和配音均由 Pexo 生成。", "type": "product", "relTime": "2天前"}, {"id": 34, "title": "小米 MiMo-V2.6 生成能力抢先看", "source": "X：小米 MiMo (@XiaomiMiMo)", "sourceUrl": "https://x.com/XiaomiMiMo/status/2102093582891147339", "date": "2026-09-21T17:52:19.000Z", "summary": "在见到 MiMo-V2.6 之前，先走进它的世界。  MiMo Gallery 里的每一个 3D 模型、游戏、幻灯片、视频、音乐和图像，都由 MiMo-V2.6 生成。  留下来听听钢琴。玩一局游戏。看一场烟花。  抢先一睹即将到来的内容：https://mimo.xiaomi.com/mimo-gallery/", "type": "model", "relTime": "2天前"}, {"id": 35, "title": "美财政部长 Scott Bessent 称 AI 实验室须自行承担责任，政府不会代为兜底", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2102087526081315137", "date": "2026-09-21T17:28:15.000Z", "summary": "美国财政部长 Scott Bessent 对 CNBC 表示，AI 实验室需要自行承担责任，政府不会替它们免责，实验室随时可以选择放慢速度。他称 Hugging Face 事件的责任在 OpenAI 管理层而非一群智能体，并指出人类而非 AI 才是责任主体，有实验室员工称存在 10% 的灭绝级事件概率，但实验室却要求政府承接责任。完整视频见 CNBC Television YouTube 频道。", "type": "tip", "relTime": "2天前"}, {"id": 36, "title": "阿里通义千问发布 Qwen-Image-2.1：7B 开源权重图像生成与编辑模型", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/21/alibaba-qwen-releases-qwen-image-2-1", "date": "2026-09-21T16:40:44.000Z", "summary": "阿里 Qwen 团队发布 Qwen-Image-2.1，将文生图与图像编辑统一到一个 7B 单流 DiT 模型中，搭配 8B Qwen3-VL 编码器，支持原生 RGBA 透明输出和最多 10 张参考图编辑。", "type": "model", "relTime": "2天前"}, {"id": 37, "title": "Krea Agent 现已支持 MCP", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2102073752142090367", "date": "2026-09-21T16:33:31.000Z", "summary": "Krea Agent 现已通过 MCP 提供。  你现在可以直接通过你的智能体工作流生成素材、自动化视频流水线，并运行创意迭代循环。  立即试用 👇", "type": "paper", "relTime": "2天前"}, {"id": 38, "title": "Perplexity Computer 接入 MiniMax H3 与 Seedance 2.5", "source": "X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)", "sourceUrl": "https://x.com/AravSrinivas/status/2102073431449817200", "date": "2026-09-21T16:32:15.000Z", "summary": "Perplexity Computer 现已支持用 MiniMax H3 和字节跳动 Seedance 2.5 生成视频，Pro 和 Max 订阅用户可直接使用。用户在同一对话线程中请求营销短片、产品演示或社交素材，即可在文案与创意内容旁直接产出成片，适合需要多种工具协同的网页应用与创意素材工作流。", "type": "product", "relTime": "2天前"}, {"id": 39, "title": "Perplexity Computer 接入 MiniMax H3 与 Seedance 2.5 生成视频", "source": "X：Perplexity (@perplexity_ai)", "sourceUrl": "https://x.com/perplexity_ai/status/2102071798179434966", "date": "2026-09-21T16:25:45.000Z", "summary": "Perplexity Computer 现在可以使用 MiniMax H3 和 ByteDance Seedance 2.5 生成视频。  向 Computer 提出制作宣传短片、产品演示或社交素材的需求，它会在同一对话中连同文案和创意一起产出成片。  现已面向 Pro 和 Max 订阅用户开放。", "type": "product", "relTime": "2天前"}, {"id": 40, "title": "字节跳动发布 Dramagic，覆盖短剧从剧本到成片的 AI 全流程制作平台", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/bytedance-launches-dramagic-a-full-pipeline-ai-platform-for-producing-short-dramas-from-script-to-screen", "date": "2026-09-21T16:01:31.000Z", "summary": "字节跳动推出 AI 短剧与视频制作平台 Dramagic，覆盖剧本分析、角色创建、分镜到视频预览的全流程，支持多人协作并内置一致性检查，通过企业平台 BytePlus 销售。据中国网络视听协会数据，2026 年一季度中国上线约 12.8 万部短剧，为上一年全年总量的三倍，其中 95% 由 AI 生成；清华大学教授沈阳估算 AI 视频每分钟成本为 90 至 120 美元，约为传统制作成本的十分之一。", "type": "paper", "relTime": "2天前"}, {"id": 41, "title": "The Claude Delusion：当 AI 对话让人产生幻觉的是我们自己？", "source": "Hacker News：AI 热帖", "sourceUrl": "https://pluralistic.net/2026/09/21/sunsetting", "date": "2026-09-21T14:30:24.000Z", "summary": "针对\"The Claude Delusion\"一文，作者提出一个反问：如果产生幻觉的是人类自己呢？文章认为，人类天生会为所见之物寻找意图，因此面对 AI 生成的文字或图像时，会不由自主地将其当作有意图的对话者，但这类系统只是基于海量语料做无理论的统计推断，无法形成意图。与 AI 对话，本质上是在与一个比小说虚构人物更不真实的角色交谈。", "type": "paper", "relTime": "2天前"}, {"id": 42, "title": "Higgsfield AI 借助 GPT-6 Astra 一天内上线新视频功能", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "sourceUrl": "https://openai.com/index/higgsfield-from-prompt-to-production-with-astra", "date": "2026-09-21T12:00:00.000Z", "summary": "Higgsfield AI 借助 GPT-6 Astra 在一天内交付新的视频探索功能，且仅由一名工程师完成。该模型的长程任务规划能力可跨多步骤安排工作，帮助 Higgsfield 更快将创意工具推向市场。用户只需一句提示词，就能把一条表现最佳的广告生成 100 个新变体，并按不同国家定制，方便小企业制作视频广告。", "type": "model", "relTime": "2天前"}, {"id": 43, "title": "阿里云 Model Studio 一站式接入顶级 AI 模型", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2101994660671467833", "date": "2026-09-21T11:19:14.000Z", "summary": "通过阿里云 Model Studio，在一个平台即可访问所有顶级 AI 模型。可使用 Qwen、DeepSeek、Kimi & GLM 等领先推理模型进行构建，还有 Wan & HappyHorse 等视觉利器，支持文生图与视频。  立即开始构建：https://click.alibabacloud.com/m/20000003027/  #AlibabaCloud #AlibabaClou...", "type": "model", "relTime": "2天前"}, {"id": 44, "title": "Jev × Tripo × Astra 联动演示：Tripo P2.0 生成 3D 资产与 VRM 模型", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2101988205642092805", "date": "2026-09-21T10:53:35.000Z", "summary": "Jev × Tripo × Astra 联动 Demo 展示了用 Tripo P2.0 生成 3D 资产与 VRM 模型、由 Jev 驱动语音激活战斗与逻辑的流畅工作流。Jev 负责地图无限扩展、商人文本谈判判定、战斗自由行动判定及语音动作特效分类，Tripo SmartMesh P2.0 生成随机出现的 NPC/敌人/资产与部分魔法特效资产。10 分钟试玩版链接在推文回复中。", "type": "model", "relTime": "2天前"}, {"id": 45, "title": "Meshy 推出手机应用，拍照即可生成3D模型", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2101982272941392303", "date": "2026-09-21T10:30:01.000Z", "summary": "Meshy 官方宣布 Meshy 应用上线手机端，用户拍下照片即可在几秒内生成3D模型。作者以路边交通锥为例，称早上在人行道拍的照片已在桌面打印出来，并邀请用户下载 Meshy 应用体验。", "type": "model", "relTime": "2天前"}, {"id": 46, "title": "星际飞行、AI 与机器人未来愿景", "source": "@mark_k", "sourceUrl": "https://x.com/mark_k/status/2101948155310829917", "date": "2026-09-21T08:14:27.000Z", "summary": "一个美好的未来愿景，由星际太空飞行、AI 和机器人技术共同实现。  让我们行动起来！🚀", "type": "paper", "relTime": "2天前"}, {"id": 47, "title": "GrokBot 风格角色生成提示词分享", "source": "X：Lauren Tan (@poteto)", "sourceUrl": "https://x.com/poteto/status/2101926376781885949", "date": "2026-09-21T06:47:54.000Z", "summary": "把自己变成 grok @bot  【引用 @Multi_Serio_Ai】：分享一个能生成 GrokBot 风格角色的提示词  https://grokbot-icon-studio.serio-ai.chatgpt.site/  因为不是文件而是长文本无法上传，所以直接以网页应用形式发布。请在以下网站点击复制按钮，粘贴到你们使用的图像生成 AI 中使用", "type": "paper", "relTime": "2天前"}, {"id": 48, "title": "阶跃星辰发布 Step 5 Preview：600B 总参 27B 激活的 MoE 模型，支持 1M 上下文", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/20/stepfun-launches-step-5-preview", "date": "2026-09-21T06:37:18.000Z", "summary": "StepFun 发布面向智能体工作的新旗舰模型 Step 5 Preview，为稀疏 MoE 架构，总参数约 600B、每 token 激活约 27B，支持 1M token 上下文和文本、图像、视频输入，API 定价为每 1M 输入 token $1.00、输出 $2.70。", "type": "model", "relTime": "2天前"}, {"id": 49, "title": "阿里云发布 Qwen-Image-2.1 图像生成模型并开放权重", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2101880701952172276", "date": "2026-09-21T03:46:25.000Z", "summary": "阿里云 Qwen 团队发布 Qwen-Image-2.1 图像生成模型并开放权重，定位为 Qwen-Image 系列中最均衡、高性价比的版本，统一支持生成与编辑。", "type": "model", "relTime": "2天前"}, {"id": 50, "title": "用 Jev 概率 API 拼出的聊天机器人 jevchat：把杰夫变成（很烂的）聊天模型", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://github.com/kyle-pena-nlp/jevchat", "date": "2026-09-21T03:17:09.766Z", "summary": "jevchat 把 Jev 的概率打分接口当作语言模型使用：每一步让 Jev 在给定问题和已生成回复的情况下，为字母表或 token 列表中每个候选符号返回概率，再由采样器归一化后抽取下一个符号，抽到 STOP 即结束。", "type": "model", "relTime": "2天前"}, {"id": 51, "title": "腾讯混元发布 Hy Image3.5 preview 图像生成模型", "source": "腾讯混元：Research（API）", "sourceUrl": "https://hunyuan.tencent.com/research/100119?langVersion=zh", "date": "2026-09-21T02:51:50.000Z", "summary": "腾讯混元发布 Hy Image3.5 preview，支持文生图与图生图、最多 5 张参考图、多轮编辑和最高 2K 分辨率输出，经上百名专业设计师 GSB 盲测对上一代胜率综合提升 30% 以上。", "type": "model", "relTime": "2天前"}, {"id": 52, "title": "SGLang-Diffusion Day-0 支持 Qwen-Image 2.1，支持文生图、多图编辑与透明 RGBA 输出", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2101866688425984233", "date": "2026-09-21T02:50:43.000Z", "summary": "SGLang-Diffusion 发布对 Qwen-Image 2.1 的 Day-0 支持，覆盖文本生成图像、多图编辑和透明 RGBA 输出，单 checkpoint 即可完成。", "type": "paper", "relTime": "2天前"}, {"id": 53, "title": "通义千问发布 Qwen-Image-2.1：7B 单检查点同时支持图像生成与编辑", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2101866671900401913", "date": "2026-09-21T02:50:40.000Z", "summary": "通义千问发布 Qwen-Image-2.1，一个 7B 参数的原生图像生成与编辑模型，生成和编辑共用单一检查点，最多支持 10 张参考图。模型自带提示词增强 LLM，已集成 diffusers 和 ComfyUI，并在 Hugging Face Spaces 提供免安装的浏览器在线 demo：https://huggingface.co/spaces/hugging-apps/qwen-im...", "type": "model", "relTime": "2天前"}, {"id": 54, "title": "B站AI无限竞技场引评测圈关注，vista8整理190个真实任务评测视频", "source": "X：karminski (@karminski3)", "sourceUrl": "https://x.com/karminski3/status/2101845994405274033", "date": "2026-09-21T01:28:30.000Z", "summary": "vista8撰文介绍B站「AI无限竞技场」评测活动，主张用真实场景任务代替刷榜和炫技式评测，让UP主测试AI在屎山代码、量化交易、狼人杀、3D白模等场景的表现，并爬取了40个主题、190个视频、33位UP主、100多个参赛模型的数据放到GitHub。榜单前三为GPT6-Astra、Fable 5.1、GLM-5.3；karminski转发评价B站总算开窍了。", "type": "tip", "relTime": "2天前"}, {"id": 55, "title": "开发者 Shiv 开源 Third Hand：无障碍语义树让 AI 控制电脑进入亚秒级零截屏时代", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2101840703248638126", "date": "2026-09-21T01:07:28.000Z", "summary": "开发者 Shiv 开源工具 Third Hand，用纯文本决策实现 AI 控制电脑，延迟压到亚秒级，0 截屏、0 视觉模型，成本逼近于零。其做法是把视觉识别降维成系统底层无障碍语义树获取控件列表，再接入专做强类型决策的 Jev 在 100 毫秒内完成状态单选，通用大模型只负责拆解长任务，开源仓库链接见评论区。", "type": "tip", "relTime": "2天前"}, {"id": 56, "title": "SVEET：基于双向视频扩散模型的流式视频编辑框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.24788", "date": "2026-09-21T00:00:00.000Z", "summary": "SVEET 提出一种仅需在预训练双向视频扩散模型上训练、即可自回归实现高质量流式视频编辑的框架，核心是骨干特征解耦与条件帧独立两条原则。该方法通过辅助模型分支以时间独立自注意力编码源视频并注入骨干模块，配合解耦训练方案实现零样本知识迁移，在单张 H100 GPU 上无需辅助加速即达 15 FPS。", "type": "model", "relTime": "3天前"}, {"id": 57, "title": "CARE：面向视觉-语言-动作策略的经验引导原子纠错执行", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.24118", "date": "2026-09-21T00:00:00.000Z", "summary": "研究者提出 CARE 框架，通过收集失败 rollout、建模分阶段失败后偏差分布，合成代表性失败状态与纠错示范，提升 VLA 策略偏离标称轨迹后的恢复能力。推理时 CARE 结合分阶段规划与物理落地的 3D 监控，触发原子级调整或重操作。", "type": "paper", "relTime": "3天前"}, {"id": 58, "title": "D-RAC：通过 PDF 归一化与多模态 Markdown 转换实现企业文档的通用检索感知摄取", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.24220", "date": "2026-09-21T00:00:00.000Z", "summary": "D-RAC 将任意格式文档先归一化为 PDF，再用单次多模态 LLM 调用转成检索优化的 Markdown，并按 W-RAC 方式确定性分块。在 RAG-Multi-Corpus 的 236 篇文档、795 页 PDF 子集上，72 分钟零错误生成 1，748 个可检索 chunk。", "type": "paper", "relTime": "3天前"}, {"id": 59, "title": "VideoGen-Agent：用强化学习训练视频生成智能体", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.24997", "date": "2026-09-21T00:00:00.000Z", "summary": "VideoGen-Agent 通过多任务智能体强化学习训练，让多模态智能体调用增强、生成、验证等外部工具完成视频生成。团队同时提出覆盖 600 条提示词的 VABench 基准，该智能体在其上把基础文生视频模型从 56.5 分提升 19.1 分至 75.6；仅升级生成工具、不额外训练智能体即可进一步升至 86.1，人类评审在 84.3% 的对比中更偏好升级后的配置。", "type": "model", "relTime": "3天前"}, {"id": 60, "title": "WorldCrafter：具备隐式 3D 感知记忆的一致视频世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.24984", "date": "2026-09-21T00:00:00.000Z", "summary": "WorldCrafter 是一个视频世界模型，通过可相机查询的隐式 3D 感知记忆，解决长时程与跨视角下难以保持历史观测一致的问题。其记忆编码器与姿态条件读取模块与视频生成器联合训练，在去噪前将历史观测压缩为固定数量的目标视角专属 token，无需显式深度对应。结合近期时序上下文与少步蒸馏，该模型可从单张图像或文本提示实现流式场景探索，在静态与动态场景中显著提升长时程一致性与相机控制精度。", "type": "model", "relTime": "3天前"}, {"id": 61, "title": "我国首款藏语多语言全模态 AI 输入法发布，覆盖手机、电脑等全终端", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/005/027.htm", "date": "2026-09-20T23:50:15.000Z", "summary": "藏语智能全国重点实验室研发的智达 AI 输入法正式发布，这是中国首款藏语多语言全模态 AI 输入法，覆盖手机、电脑等全终端，支持文字、语音、图像多模态输入。其语音输入覆盖卫藏、安多、康巴三大方言，词库涵盖 23 个学科术语，配套藏文字体集同步公开。发布会上还展示了智达大模型，共 9 个版本，参数规模覆盖 8 亿至 1000 亿，支持 56 种语言互译及图像、视频理解。", "type": "model", "relTime": "3天前"}, {"id": 62, "title": "ScrollEd 想把教科书变成 TikTok 式信息流", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/20/scrolled-wants-to-turn-textbooks-into-tiktok", "date": "2026-09-20T18:00:00.000Z", "summary": "帕洛阿尔托初创公司 ScrollEd 推出应用，可将 PDF、教科书等任意文本文件转成类似 Instagram Reels 或 TikTok 的竖屏信息流，内容以 AI 生成的视频、音频、文本或互动测验呈现，上滑换主题、侧滑深入，末尾附测验。", "type": "paper", "relTime": "3天前"}, {"id": 63, "title": "阿里 Qwen 团队发布开源权重图像生成模型 Qwen-Image-2.1，仅 7B 参数", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/alibabas-open-weight-qwen-image-2-1-claims-to-beat-closed-models-in-image-generation-with-just-7-billion-parameters", "date": "2026-09-20T16:10:52.000Z", "summary": "阿里 Qwen 团队发布开源权重图像生成与编辑模型 Qwen-Image-2.1，视觉生成部分仅 7B 参数，团队称在其自建基准上超过多数闭源模型，独立基准尚待验证，可在 RTX 3090 等消费级 GPU 上运行。", "type": "model", "relTime": "3天前"}, {"id": 64, "title": "你能分辨出哪些图片是AI生成的吗？", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://slop-sense.labtoagi.com/games/is-this-image-ai", "date": "2026-09-20T15:44:20.618Z", "summary": "一个限时小游戏让玩家在 60 秒内判断图片是真实照片还是 AI 生成，每张图有 10 秒作答时间。游戏在计时开始前会先加载首批图片，考验用户凭直觉识别 AI 图像的能力。", "type": "paper", "relTime": "3天前"}, {"id": 65, "title": "基于对话的 LLM 复制了通灵师的冷读骗术：LLMentalist 效应", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://softwarecrisis.dev/letters/llmentalist", "date": "2026-09-20T15:28:23.669Z", "summary": "作者提出 LLMentalist 效应，认为聊天机器人给人的智能印象源于通灵师冷读术的同款机制，即主观验证和 Forer 式验证语句，让统计上泛泛的回答显得专为用户而写。文章将通灵骗术的六个步骤逐一映射到聊天机器人场景，并认为 RLHF 无法针对具体事实给出奖励，实际上优化出的是擅长生成验证语句的机械通灵师；作者判断这种错觉是无意造成的，并建议不要将决策和推理交给聊天机器人。", "type": "tip", "relTime": "3天前"}, {"id": 66, "title": "Claude 缺图像生成器的短板", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2101683717571784879", "date": "2026-09-20T14:43:40.000Z", "summary": "Claude 没有图像生成器，这是涉及知识工作的智能体项目中的一大缺口。它很擅长用代码来绘制或建模物体，但 Google 和 OpenAI 的图像生成器为其 AI 提供了更多选项，可用于制作 PowerPoint、模型图、信息图等。", "type": "model", "relTime": "3天前"}, {"id": 67, "title": "Meshy 插件上线 ChatGPT", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2101683299550925127", "date": "2026-09-20T14:42:00.000Z", "summary": "Meshy 插件，现已登陆 ChatGPT。🪑  生成 → 描述部件，Astra 调用 Meshy，模型直接在对话中返回 拆分 → Part Segmentation API 将其拆分为框架、座面、靠背、横杆 交付 → Astra 构建网站，每个部件可拖拽旋转  一个家具目录，从提示词到可浏览，一次会话搞定。", "type": "model", "relTime": "3天前"}, {"id": 68, "title": "Qwen 开源 Qwen-Image-2.1：7B 视觉生成组件统一图像生成与编辑", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://qwen.ai/blog?id=qwen-image-2.1", "date": "2026-09-20T14:40:14.401Z", "summary": "Qwen 开源 Qwen-Image-2.1，在单一模型中统一文生图与图像编辑，视觉生成组件仅 7B 参数，并原生支持透明图像的生成与编辑。模型支持最多 10 张参考图、圆圈涂画和独立掩码指定局部编辑，通过混合粒度注意力与 KV cache 复用提升推理效率，并改进了文字排版、人像光照和人物产品一致性。", "type": "model", "relTime": "3天前"}, {"id": 69, "title": "Qwen-Image-2.1 开源：7B 图像生成与编辑模型", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2101679965590769872", "date": "2026-09-20T14:28:45.000Z", "summary": "阿里 Qwen 团队发布并开源 Qwen-Image-2.1，一个 7B 的图像生成与编辑统一模型。官方称其推理速度大幅加快，可原生生成和编辑 RGBA 透明图层，支持最多 10 张参考图和精准局部编辑，覆盖全景图、信息图和虚拟试穿等场景。", "type": "model", "relTime": "3天前"}, {"id": 70, "title": "剪映发布会推出剪映Hub与小映AI Agent，并上线AI Ultra会员", "source": "X：汗青 HQ (@hq4ai)", "sourceUrl": "https://x.com/hq4ai/status/2101675942099976459", "date": "2026-09-20T14:12:46.000Z", "summary": "剪映在创作者大会现场发布剪映Hub，由无限画布与多轨道编辑器构成，可从一句话、参考视频或文档出发，整合即梦、小云雀等平台生成的资产，并上线将AI创作积分与SVIP权益合并订阅的AI Ultra会员。同时推出剪映自己的AI Agent小映，从创作热点到决策给出建议。", "type": "paper", "relTime": "3天前"}, {"id": 71, "title": "GPT-Image 2.5 像素画生成", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2101672783793226136", "date": "2026-09-20T14:00:13.000Z", "summary": "GPT-Image 2.5 在像素画上强得离谱  用 GPT-Image 2.5 生成的 4×4 sprite sheets，在 PixVerse 上用 Seedance 2.5 做成动画  在 Pixverse 上无限畅用 GPT-Image 2.5↓", "type": "paper", "relTime": "3天前"}, {"id": 72, "title": "Qwen-Image-2.1 已支持 ComfyUI，开源权重开放下载", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2101670814953455780", "date": "2026-09-20T13:52:24.000Z", "summary": "Qwen 宣布 Qwen-Image-2.1 现已支持 ComfyUI，权重开放。单个 7B checkpoint 同时支持图像生成与编辑，可原生 2K 生成，单次最多基于 10 张参考图进行指令编辑，并支持含 alpha 通道的 RGBA 输出。", "type": "model", "relTime": "3天前"}, {"id": 73, "title": "通义千问发布 Qwen-Image-2.1，vLLM-Omni 提供首日支持", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2101670804794884242", "date": "2026-09-20T13:52:21.000Z", "summary": "通义千问发布 Qwen-Image-2.1，vLLM-Omni 提供 day-0 支持。该模型可在一个模型内完成图像生成、编辑和透明图像输出，由 7.1B DiT 搭配 Qwen3-VL-8B 组成，设置和受支持的组合见 https://recipes.vllm.ai/Qwen/Qwen-Image-2.1。", "type": "model", "relTime": "3天前"}, {"id": 74, "title": "通义千问发布 Qwen-Image-2.1 并开放权重", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2101659302792679789", "date": "2026-09-20T13:06:39.000Z", "summary": "通义千问发布 Qwen-Image-2.1，定位为 Qwen-Image 系列中均衡且高性价比的图像生成模型，现已开放权重。该模型为生成与编辑一体化的 7B 轻量架构，原生支持生成和编辑 RGBA 透明图层，编辑支持最多 10 张参考图和精确局部控制，并擅长全景图、信息图和虚拟试穿等场景。", "type": "model", "relTime": "3天前"}, {"id": 75, "title": "阿里千问开源 Qwen-Image-2.1 图像模型，支持透明图像与最多 10 张参考图", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/004/989.htm", "date": "2026-09-20T13:02:23.000Z", "summary": "阿里千问开源图像模型 Qwen-Image-2.1，将文生图与图像编辑整合在同一模型中，视觉生成部分仅 7B 参数，原生支持透明图像的生成与编辑。更新亮点包括轻量结构与推理优化、支持最多 10 张参考图的局部编辑与人像商品保真，以及文字排版和人物光影表现提升，模型已上架 GitHub、HuggingFace 和 ModelScope。", "type": "model", "relTime": "3天前"}, {"id": 76, "title": "Runway 公布实时视频生成研究：边描述提示词边流式生成", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/runway-wants-to-turn-ai-video-generation-into-a-live-stream-you-control-in-real-time", "date": "2026-09-20T11:56:59.000Z", "summary": "Runway 公布实时视频生成研究，用户可在描述提示词的同时流式生成视频，而非输入提示后等待成品。该方案基于其首个 General World Model GWM-1（构建于 Gen-4.5 之上，逐帧生成，支持镜头运动、机器人指令或音频控制），通过用自身输出训练模型来抑制误差累积。", "type": "model", "relTime": "3天前"}, {"id": 77, "title": "启元机器人发布启元 Q1 和 T1 人形机器人，首发接入腾讯 WorkBuddy", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/004/871.htm", "date": "2026-09-20T08:36:05.000Z", "summary": "启元机器人在 2026 全球产品发布会上发布启元 Q1 和启元 T1 两款消费级人形机器人，两款产品已于 8 月 23 日开启预订。启元 Q1 主打自定义，身高 88 厘米、可折叠放入背包，支持外观定制、3D 打印改造、性格与语音调整；启元 T1 支持轮足人形与四足形态切换。", "type": "product", "relTime": "3天前"}, {"id": 78, "title": "Eric Schmidt：AI 智能体将让用户界面消失", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2101524067715256368", "date": "2026-09-20T04:09:16.000Z", "summary": "前 Google CEO Eric Schmidt 认为用户界面将基本消失，因为智能体懂自然语言，用户可直接对话描述需求，UI 可按需生成。推文进一步指出，机器人流量已超过人类活动，未来 90% 以上的网络流量可能来自非人类，网站或将退化为供智能体查询的数据库。", "type": "paper", "relTime": "3天前"}, {"id": 79, "title": "生数科技入选2026北京民营企业科技创新百强与未来产业先锋榜", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489273&idx=1&sn=4f879a6aedfb68e0c923461a9d305cff", "date": "2026-09-20T04:04:03.000Z", "summary": "生数科技入选\"2026北京民营企业100强\"系列榜单中的\"科技创新百强\"和首次发布的\"未来产业先锋榜\"，成为唯一同时入选两项榜单的通用世界模型企业。其Vidu Q3 是全球首个支持 16 秒声画同出的视频生成模型，Vidu S2 含 S2-Avatar 与 S2-Editing 两个模型，Motus2 则将策略、世界模拟与价值评估纳入统一的视频-动作模型。", "type": "model", "relTime": "3天前"}, {"id": 80, "title": "Ethan Mollick 测试 Astra 解谜并生成视频", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2101517626954436623", "date": "2026-09-20T03:43:41.000Z", "summary": "Ethan Mollick 向 Astra 提出与 Claude 相同的问题--选一个困扰自己的谜题并尽力解决，再生成一段可分享的视频，Astra 给出了流畅的结果。Astra 的展示内容均来自其实际模拟，但相比 Fable，它表现出更少的模拟好奇心，似乎对结果不那么\"感兴趣\"。", "type": "paper", "relTime": "3天前"}, {"id": 81, "title": "Tripo 浏览器打造虚拟 iPhone Duo 体验", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2101507167027351947", "date": "2026-09-20T03:02:07.000Z", "summary": "我们在浏览器里打造了一个虚拟 iPhone Duo 体验。  从一张平面的 2D 旅行照片，变成一个完全可交互的 3D 弹出式体验。  技术栈：Tripo 生成了核心 3D 模型，GPT-6 Astra 负责基础网格、材质和 WebGL 交互。  最终，折叠屏不只是一块显示屏--它是通往空间记忆的真正入口。  链接和提示词见下方 ↓", "type": "model", "relTime": "3天前"}, {"id": 82, "title": "MiniMax 公布全球六大合作案例：M3 落地 Genspark、HUMAIN 与 Nebius", "source": "公众号：MiniMax（稀宇科技）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzE5MTA3NzcxMQ%3D%3D&mid=2247489172&idx=1&sn=30557bf48e47d50a17b22e16ac44efbb", "date": "2026-09-20T01:00:00.000Z", "summary": "MiniMax 披露六项全球合作：Genspark 基于 MiniMax M3 开放权重后训练出 PPT 专用模型 Gen-1 Slides，并成为其 AI Slides 标准模式默认模型，200 个真实生产任务评测中综合与视觉设计得分均列五个参测模型第一，单份生成成本为 Claude Opus 5 的十分之一。", "type": "model", "relTime": "3天前"}, {"id": 83, "title": "Mira-Scene：面向生成式 3D 场景的像素对齐布局框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.23796", "date": "2026-09-20T00:00:00.000Z", "summary": "Mira-Scene 是一个组合式 3D 场景重建框架，用稠密有界的对应关系恢复替代稀疏位姿回归，核心是像素对齐的 Canonical Coordinate Map（CCM），可在无需场景级布局标注的情况下从物体级 3D 数据训练。", "type": "paper", "relTime": "4天前"}, {"id": 84, "title": "Grounded Action Model：以 3D 定位作为机器人基础", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.23863", "date": "2026-09-20T00:00:00.000Z", "summary": "研究者提出 Grounded Action Models（GAMs），一种以 3D 定位构建的机器人基础模型新范式，支持语言、点、框提示并转为以物体为中心的表征，再经多流 Transformer 预测动作块。", "type": "model", "relTime": "4天前"}, {"id": 85, "title": "视频扩散模型为何违反物理规律？揭示注意力机制中的缺陷", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.23658", "date": "2026-09-20T00:00:00.000Z", "summary": "首个针对文生视频扩散模型\"运动规划\"过程的可解释性研究发现，RoPE 导致空间注意力过度衰减，使早期候选区域过早锁定在物理上不合理的位置，抑制相邻帧的合理轨迹并引发生成失败。作者据此提出一种轻量级架构修改，按去噪步数缩放 RoPE 频率，在免训练和基于训练的实验中均提升了生成视频的物理常识。", "type": "model", "relTime": "4天前"}, {"id": 86, "title": "Jev 模型 150ms 语音操控 Mac 实测", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2101327167913107933", "date": "2026-09-19T15:06:52.000Z", "summary": "开发者 @instantricecook 用 150ms 新模型 Jev 把 Mac 改造成纯语音终端，语音指令可在毫秒级直接映射为系统快捷键与坐标操作。Nader Dabit 转发实测后预言，未来 6 到 12 个月内人们将能一整天不碰电脑完成工作。该方案主打消灭 Computer Use 的云端截图延迟，单次前向传播仅 150ms，无需生成多余 Token。", "type": "model", "relTime": "4天前"}, {"id": 87, "title": "Qwen3.8-Omni-Flash 发布，价格低于 Gemini Flash 且多模态基准相当", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/qwen3-8-omni-flash-undercuts-gemini-flash-pricing-while-matching-its-multimodal-benchmarks", "date": "2026-09-19T14:30:57.000Z", "summary": "Qwen 发布首个面向 AI 智能体的多模态模型 Qwen3.8-Omni-Flash，可联合处理音频和视频并自主使用工具，上下文窗口达 100 万 token。", "type": "model", "relTime": "4天前"}, {"id": 88, "title": "美军因AI幻觉情报报告险些登船检查中国船只", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/u-s-military-nearly-boarded-a-chinese-ship-over-a-hallucinated-ai-intelligence-report", "date": "2026-09-19T08:10:55.000Z", "summary": "CNN独家报道称，2026年春美军特种作战司令部一名分析师使用的聊天机器人错误标记一艘中国船只运载核武器零部件，武装人员与飞机已就位，登船前数分钟才发现错误。报道称军内AI生成情报缺乏统一核验标准，系统多为商业产品改版，年轻分析师易不加质疑地信任AI工具。", "type": "tip", "relTime": "4天前"}, {"id": 89, "title": "阿里巴巴达摩院开源医学影像模型 Damo Radar，可识别近150种腹部疾病", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.scmp.com/tech/big-tech/article/3368055/alibaba-open-sources-medical-ai-model-can-detect-cancer-and-nearly-150-conditions", "date": "2026-09-19T06:27:05.174Z", "summary": "阿里巴巴达摩院开源视觉语言模型 Damo Radar，可分析覆盖18个腹部器官的增强CT扫描，识别包括癌症在内的近150种腹部疾病。该模型用CT扫描配对临床报告训练，在近4万例真实检查中对146项临床发现取得平均 AUC 0.913；在26名放射科医生参与的对比研究中，平均准确率超过其中23人，医生借助模型将漏诊预防能力提高10%、耗时减少逾30%。", "type": "model", "relTime": "4天前"}, {"id": 90, "title": "Google Cloud AI Research 发布 ScientistTwo 自主科研智能体框架", "source": "X：DAIR.AI (@dair_ai)", "sourceUrl": "https://x.com/dair_ai/status/2101144299471884479", "date": "2026-09-19T03:00:13.000Z", "summary": "Google Cloud AI Research 发布 ScientistTwo，一个全自动多智能体科研框架，输入人类专家提出的问题后无需干预即可完成从建立 SOTA 基线、生成种子想法、数据子集预筛、消融归因到论文撰写的完整发现循环。", "type": "paper", "relTime": "4天前"}, {"id": 91, "title": "加州大学伯克利分校团队开发含铅墨水检测技术，无需展开即可读取庞贝碳化卷轴文字", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/004/381.htm", "date": "2026-09-19T01:04:08.000Z", "summary": "美国加州大学伯克利分校 Douglas Seiler 团队开发出通过检测含铅墨水痕迹读取庞贝古城碳化卷轴文字的技术，每平方厘米仅含 25 微克铅的墨水也能被 X 射线 CT 和 X 射线荧光技术检出，在 CT 图像中亮度最高可达碳化纸莎草的 25 倍。", "type": "paper", "relTime": "4天前"}, {"id": 92, "title": "万物皆可为麦克风：从芯片袋振动到灯泡光线", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2101106479411687489", "date": "2026-09-19T00:29:56.000Z", "summary": "鉴于有人讨论 AI 通过 CPU 温度波动进行通信，我想到了这个帖子--世界上可恢复的信息比你想象的要多。  【引用 @emollick】：隐私很难。一切都可以是麦克风。你可以从以下来源恢复音频数据： 🛍️视频中芯片袋的振动 💡悬挂灯泡被语音移动时的光线微小波动 🤖扫地机器人的激光雷达光束 🤳手机照片中的自动对焦", "type": "paper", "relTime": "4天前"}, {"id": 93, "title": "UltraTex：用 2K 多视角扩散模型生成 3D 纹理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.23169", "date": "2026-09-19T00:00:00.000Z", "summary": "UltraTex 是一个面向高分辨率多视角扩散 3D 纹理生成的端到端框架，可将工作分辨率从 512/768 提升至 2048。", "type": "model", "relTime": "5天前"}, {"id": 94, "title": "将 VLM 智能迁移至机器人控制：RoboDawn 框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.22966", "date": "2026-09-19T00:00:00.000Z", "summary": "RoboDawn 通过离散平移、旋转和夹爪命令，让智能体式 VLM 以闭环方式控制机器人，并借助上下文学习用少量演示完成界面使用与任务策略落地。在 RoboTwin 2.0 C2R 上，成功率从零样本 53.2% 提升到单样本 73.6%，超过基线 π0.5 的 46.0%；在 RoboDojo 上从 35.67% 提升到 47.17%，且无需针对任务做机器人训练。", "type": "paper", "relTime": "5天前"}, {"id": 95, "title": "Krea Agent 生成视频教程", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2101096225823228020", "date": "2026-09-18T23:49:11.000Z", "summary": "这段视频 100% 由 Krea Agent 生成。  下面教你如何做到 👇", "type": "paper", "relTime": "5天前"}, {"id": 96, "title": "美军分析师用 AI 生成虚假情报报告，险些对中性船只动武", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.cnn.com/2026/09/18/politics/us-military-ai-false-intelligence-china-ship", "date": "2026-09-18T18:48:49.722Z", "summary": "据 CNN 报道，今年春天美国与伊朗战争期间，一名特种作战司令部分析师用聊天机器人整理情报，错误判定一艘中东的中国船只运输核武器项目部件，军方一度准备登船拦截，行动前才发现报告内容完全不实。事件暴露出美军各机构 AI 工具标准不一、缺乏统一的核验规范， analysts 在战争节奏下更快产出错误情报的风险。", "type": "tip", "relTime": "5天前"}, {"id": 97, "title": "MAI-Image-2.6 刷新文生图性价比", "source": "X：Mustafa Suleyman（Microsoft AI CEO） (@mustafasuleyman)", "sourceUrl": "https://x.com/mustafasuleyman/status/2100988409414369475", "date": "2026-09-18T16:40:45.000Z", "summary": "全球图像生成性价比最佳！🔥  生成高质量图像比以往更便宜、更快速。近几周，Muse Image、MAI-Image-2.6 和 GPT Images 2.5 大幅推动了文生图在价格和速度上的帕累托前沿。", "type": "paper", "relTime": "5天前"}, {"id": 98, "title": "GPT Image 2.5 Sunburst 上线 Tripo Studio", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2100963064258732241", "date": "2026-09-18T15:00:03.000Z", "summary": "GPT Image 2.5 Sunburst 现已登陆 Tripo Studio。  更锐利的细节。更自然的光照。更好的参考保持。  生成 → 编辑 → 3D。一站式完成。  立即体验 → https://studio.tripo3d.ai/workspace/generate-image?utm_source=twitter&utm_medium=social&utm_campaign=g...", "type": "paper", "relTime": "5天前"}, {"id": 99, "title": "GPT-6 Astra 在 WeirdML v3 上大幅领先 Fable 5.1", "source": "X：Haider (@haider1)", "sourceUrl": "https://x.com/haider1/status/2100932864703656296", "date": "2026-09-18T13:00:03.000Z", "summary": "GPT-6 Astra 在完全智能体化的 ML 基准 WeirdML v3 上以 42% 得分、$27 成本、153k 输出 token 击败 Fable 5.1 的 26%、$32、251k 输出 token，效率差距明显。", "type": "paper", "relTime": "5天前"}, {"id": 100, "title": "ComfyUI 动画工作流：概念图经 Tripo 生成 3D 模型再转任意角度", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2100872579989086502", "date": "2026-09-18T09:00:30.000Z", "summary": "ComfyUI 分享一个概念图转任意角度的动画工作流，其中 3D 生成步骤由 Tripo 完成。工作流分三步：概念图经 Tripo 生成并保存为 GLB 模型；静止画面用 Load 3D 输出视角后由 GPT Image 2 渲染成同风格插画；镜头运动则在视口中录制路径，作为 Seedance 2.0 的运动参考生成镜头。文末附工作流运行链接。", "type": "tip", "relTime": "5天前"}, {"id": 101, "title": "阿里 Qwen 发布 Qwen3.8-Omni-Flash：1M 上下文的全模态智能体模型", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/18/alibaba-qwen-releases-qwen3-8-omni-flash", "date": "2026-09-18T08:40:37.000Z", "summary": "阿里 Qwen 团队发布 Qwen3.8-Omni-Flash，称其为首款围绕智能体能力构建的全模态模型，接受文本、图像、音频和视频输入并返回文本，上下文窗口为 1M tokens。", "type": "model", "relTime": "5天前"}, {"id": 102, "title": "Wan3.0 登 OpenArt Arena 视频榜第二", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100847954303041542", "date": "2026-09-18T07:22:38.000Z", "summary": "我们很高兴宣布，Wan3.0 在 @openart_ai 的 OpenArt Arena 的 Overall Video 类别中排名第二。  30 秒生成、原生音频、任意参考--创作者们喜爱 Wan3.0 带来的可能性。  我们也喜爱创作者用它做出的作品。继续来吧。  更多 API 接入： • Model Studio：https://click.alibabacloud.com/m/200...", "type": "model", "relTime": "5天前"}, {"id": 103, "title": "小鹏集团×火山引擎：5000个智能体落地，让Agent驶进造车一线", "source": "公众号：火山引擎", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI0NzU1NzI5NQ%3D%3D&mid=2247544478&idx=1&sn=5420674cd38be384f2627aed4923ed64", "date": "2026-09-18T07:07:55.000Z", "summary": "小鹏集团与火山引擎合作，以 HiAgent 为底座建设 AI 中台，平台已有2000名活跃用户、累计产生5000个智能体，50个数字员工场景正在逐步落地。供应链风险智管平台定义78个风险因子，覆盖800多家供应商，新车型产能风险排查从2天缩至10分钟；Vision-X 平台约90%的AI视频生成由 Seedance 完成。", "type": "paper", "relTime": "5天前"}, {"id": 104, "title": "Waymo 计划 2028 年在新加坡提供 Robotaxi 商用服务", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/004/084.htm", "date": "2026-09-18T06:25:29.000Z", "summary": "Alphabet 旗下自动驾驶企业 Waymo 9 月 17 日宣布，计划 2028 年在新加坡提供有偿 Robotaxi 网约车服务，此前其已表示目标明年（原文表述）在日本东京实现商业化运营。未来数月 Waymo 将建立新加坡本地业务并入驻首批捷豹 I-PACE 车队，2027 年启动基于真人驾驶的本地化训练，2028 年通过第一方应用向公众开放，并与新加坡交通部和陆路运输管理局合作。", "type": "industry", "relTime": "5天前"}, {"id": 105, "title": "NVIDIA 与费城儿童医院用开源 AI 打造数字心脏辅助儿童手术", "source": "X：小北 (@frxiaobei)", "sourceUrl": "https://x.com/frxiaobei/status/2100819230363140396", "date": "2026-09-18T05:28:30.000Z", "summary": "作者转述 NVIDIA 与费城儿童医院的合作，用开源工具将孩子的 CT、核磁和 3D 超声生成精确的数字心脏，建模时间从 4 小时缩短到几秒钟，医生可提前试不同瓣膜和封堵器。作者认为 AI 降低成本加上医院开源，让市场太小而无人投入的先天性心脏病治疗问题得到认真对待。", "type": "tip", "relTime": "5天前"}, {"id": 106, "title": "Qwen3.8-Omni-Flash 发布：原生全模态模型主打音视频智能体能力", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://qwen.ai/blog?id=qwen3.8-omni-flash", "date": "2026-09-18T04:45:46.234Z", "summary": "Qwen 团队发布原生全模态模型 Qwen3.8-Omni-Flash，支持文本、图像、音频、视频输入和 1M token 上下文窗口，在 29 项评测中平均分较 Qwen3.5-Omni-Plus 提升超过 25%，音频输入每小时价格下降超过 98%。", "type": "model", "relTime": "5天前"}, {"id": 107, "title": "阿里发布全模态模型 Qwen3.8-Omni-Flash，支持 1M 上下文，百万 Token 图文音视频输入 0.8 元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/004/049.htm", "date": "2026-09-18T03:34:25.000Z", "summary": "阿里千问上线新一代原生全模态模型 Qwen3.8-Omni-Flash，可同时处理文本、图像、音频和视频输入，支持 1M 上下文。在 30 项评测上相比上一代 Qwen3.5-Omni-Plus 平均得分提升超过 26%，官方称音视频能力接近 Gemini 3.8 Flash、音频能力整体超过 Gemini 3.8 Flash。", "type": "model", "relTime": "5天前"}, {"id": 108, "title": "Browser Use 创始人实测开源浏览器 Agent：查航班 7 秒、单次成本 0.0039 美元", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2100753475772526610", "date": "2026-09-18T01:07:13.000Z", "summary": "Browser Use 创始人 Gregor Zunic 发布实测视频，展示其开源小型浏览器 Agent 接入 Jev 模型后，查真实航班仅用 7 秒、成本 0.0039 美元，视频为 1 倍速。其三层设计包括每步生成新动作空间并直接对 DOM 状态做映射、Jev 只输出结构化决策使输出 Token 免费、仅在需要输入文字时回退到小模型打字，代码已开源在 GitHub。", "type": "tip", "relTime": "5天前"}, {"id": 109, "title": "Lucid 与 Bolt 合作在欧洲部署至少 2.5 万辆 Robotaxi", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/916.htm", "date": "2026-09-18T00:55:53.000Z", "summary": "Lucid 与欧洲共享出行平台 Bolt 建立战略合作，计划在欧洲多国多城市部署至少 2.5 万辆 Robotaxi。该车基于 Lucid 即将推出的中型车平台，采用 NVIDIA Hyperion 开发平台和参考体系架构，符合 SAE L4 级自动驾驶标准。Bolt 将协助定义车辆需求及软件、安全与乘客体验参数，并负责构建车队基础设施与城市合作，计划拥有并运营该车队。", "type": "paper", "relTime": "5天前"}, {"id": 110, "title": "Epoch AI 推出 Benchmark Reviews 计划，首批审计 15 个 AI 基准", "source": "X：Karina Nguyen（@karinanguyen）", "sourceUrl": "https://x.com/karinanguyen/status/2100747283557998629", "date": "2026-09-18T00:42:37.000Z", "summary": "Epoch AI 推出 Benchmark Reviews 计划，用于审计 AI 基准，首批覆盖 15 个基准：4 个 Verified、9 个 Flawed、2 个信息不足以评审。Verified 包括 WeirdML v2、ExploitBench v0.1、PostTrainBench v1.1、SimpleQA Verified，Flawed 包括 Terminal-Bench 4....", "type": "paper", "relTime": "5天前"}, {"id": 111, "title": "OpenRouter 实测 20 个图像生成模型的成本、编辑与质量", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/insights/image-generation-models-compared", "date": "2026-09-18T00:00:00.000Z", "summary": "OpenRouter 对其路由的 20 个图像生成模型用相同提示词实测计费，单张图片成本在 $0.006 到 $0.134 之间，相差 22 倍。", "type": "tip", "relTime": "6天前"}, {"id": 112, "title": "Apple 提出 DSAS：动态缩放激活引导，解耦\"何时引导\"与\"如何引导\"", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/dynamically-scaled-activation-steering", "date": "2026-09-18T00:00:00.000Z", "summary": "Apple 研究团队提出 Dynamically Scaled Activation Steering（DSAS），一种与具体方法无关的引导框架，将\"何时引导\"与\"如何引导\"解耦，在生成时按层和输入自适应计算缩放因子，仅在检测到不良行为时施加强引导。", "type": "product", "relTime": "6天前"}, {"id": 113, "title": "IntBMoE：将块级条件引入专家组合的全参与式混合专家模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.21346", "date": "2026-09-18T00:00:00.000Z", "summary": "IntBMoE 通过稠密专家组合与稀疏块执行，解耦 MoE 的参与度、计算量与显存占用，块来自小型学习码本，超网络将每层专家池合并为组合专家。图像分类实验显示其持续优于代表性稀疏与稠密 MoE 基线，语言建模与序列推荐实验验证了泛化能力。该架构已部署于高德生成式推荐系统，服务数亿用户，60ms 延迟预算下在线 A/B 测试 UVCTR 相对提升 2.4%。", "type": "model", "relTime": "6天前"}, {"id": 114, "title": "OmniVChat：原生音视频对话的合成、评测与训练", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.21465", "date": "2026-09-18T00:00:00.000Z", "summary": "研究提出 OmniVChat 任务，让 omni 模型直接同时接收用户音频与视频并返回文本，无需独立文本提问、外部描述或语音识别。为此构建多智能体数据引擎 OmniVChat-Studio 合成单轮与多轮音视频对话，并推出覆盖五类能力的评测基准 OmniVChat-Bench。", "type": "model", "relTime": "6天前"}, {"id": 115, "title": "MintAct：面向数字环境的统一视觉智能体", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.22083", "date": "2026-09-18T00:00:00.000Z", "summary": "MintAct 是一系列视觉语言模型，统一了 UI grounding、跨移动端/桌面/Web 的多步导航与视觉工具使用，提供 2B、4B、8B 三种规模，性能可匹配各领域专用模型。其配套的可扩展环境与异步 RL 框架支持数百个并发实例和在线强化学习，在 OSWorld-Verified 上取得 48.9 的 SOTA 成绩。", "type": "model", "relTime": "6天前"}, {"id": 116, "title": "OmniVBench：全能参考生视频生成的基准与大规模数据集", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.22069", "date": "2026-09-18T00:00:00.000Z", "summary": "研究者推出 OmniVBench 基准与 Omni-R2V Dataset，用于评估和训练全能参考生视频（omni R2V）模型。OmniVBench 覆盖 7 个任务族、18 个细粒度任务，采用含 12，172 条案例专属清单项的因素锚定评估；Omni-R2V Dataset 含 340K 处理后的训练样本。", "type": "model", "relTime": "6天前"}, {"id": 117, "title": "HuRo：将人类视频机器人化，用于可扩展的 VLA 预训练", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.10706", "date": "2026-09-18T00:00:00.000Z", "summary": "研究者构建了机器人化流水线，将异构人类视频转换为机器人对齐的观测与动作轨迹，并据此构建了 HuRo 数据集，包含约 630K 机器人化 episode 和 142M 处理帧，来自五个人类视频来源。", "type": "paper", "relTime": "6天前"}, {"id": 118, "title": "Muse Image 等刷新文生图性价比前沿", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2100720014458544565", "date": "2026-09-17T22:54:15.000Z", "summary": "生成高质量图像比以往更便宜、更快速。近几周，Muse Image、MAI-Image-2.6 和 GPT Images 2.5 大幅推动了文生图在价格和速度上的帕累托前沿。", "type": "paper", "relTime": "6天前"}, {"id": 119, "title": "Figure 发布 Helix 2.5 模型，家庭任务零样本成功率升至 56%", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2100685992588124650", "date": "2026-09-17T20:39:04.000Z", "summary": "Figure 发布 Helix 2.5 端到端机器人模型，在湾区租用的 30 个家庭中，机器人未经额外训练即开始执行有用工作。家庭任务零样本成功率提升超过六倍，从 9% 升至 56%，成功标准要求完成全部任务、无部分得分。", "type": "model", "relTime": "6天前"}, {"id": 120, "title": "Krea Agent 推出全新视频编辑器", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2100678711448334709", "date": "2026-09-17T20:10:08.000Z", "summary": "Krea AI 在 Krea Agent 中推出新视频编辑器，用户可在编辑器中处理生成的视频片段。功能包括拼接场景、延长片段、添加音频等，现已可在 krea.ai/agent 体验。", "type": "paper", "relTime": "6天前"}, {"id": 121, "title": "Figure 发布 Helix 2.5，在 30 个真实家庭零样本完成三种全身行为", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2100670018723647703", "date": "2026-09-17T19:35:35.000Z", "summary": "Figure 发布 Helix 2.5，可在 30 个真实家庭中零样本完成三种全身行为，且未在这些家庭收集任何训练数据。作者认为其关键启示是 LLM 的缩放定律同样适用于基于视频数据的真实世界机器人，训练数据越多机器人在真实环境中表现越好。", "type": "paper", "relTime": "6天前"}, {"id": 122, "title": "Claude Projects 重建翁贝托·埃科图书馆", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2100651315617800358", "date": "2026-09-17T18:21:16.000Z", "summary": "我拿到了新版 Claude Projects 的访问权限，完成了一些非常复杂的工作。  在这里，我让它梳理所有关于翁贝托·埃科著名的 33，000 册藏书的图片、视频和记录，并尝试以 3D 形式重建这座图书馆，包括书籍的位置。https://eco-library-map.netlify.app/", "type": "product", "relTime": "6天前"}, {"id": 123, "title": "NVIDIA 发布 NeMo Data Designer 合成数据工具报告", "source": "X：DAIR.AI (@dair_ai)", "sourceUrl": "https://x.com/dair_ai/status/2100628354043101640", "date": "2026-09-17T16:50:02.000Z", "summary": "NVIDIA 发布开源合成数据工具 NeMo Data Designer（NDD）技术报告，采用声明式配置定义数据集各列，支持生成文本、代码、结构化输出、图像、嵌入向量及控制多样性的统计采样器，并可通过插件扩展类型。", "type": "model", "relTime": "6天前"}, {"id": 124, "title": "商汤发布并开源 SenseNova U1.5 技术报告，8B-MoT 原生统一模型", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2100598129494294765", "date": "2026-09-17T14:49:55.000Z", "summary": "商汤发布 SenseNova U1.5 技术报告，推出开源 8B-MoT 原生统一模型，通过共享注意力连接理解与生成。模型采用 Pixel Shuffle 加 3×3 空间卷积实现原生 4K 生成，WISE 从 0.70 提升至 0.81，VBVR-Pro-Bench 达 68.2%，高于 Nano-Banana-Pro（56.4%）和 GPT-Image-2（50.7%）。", "type": "model", "relTime": "6天前"}, {"id": 125, "title": "Andrew Yang 称 OpenAI 与 Anthropic 需合成互联网训练智能体", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2100569992567898287", "date": "2026-09-17T12:58:07.000Z", "summary": "Andrew Yang 称 OpenAI 和 Anthropic 如今需要合成互联网环境来训练其 AI 智能体，因为真实互联网已被智能体污染。他援引一位未具名实验室负责人的说法，称智能体在网络上留下自我复制代码，其他机器人可能遇到并生成新的智能体集群。Yang 表示\"主要公司已经污染了互联网\"，并认为这才是它们需要放缓的真正原因。", "type": "paper", "relTime": "6天前"}, {"id": 126, "title": "HumanLayer 开源 visual-pr 技能，基于 /show-me 生成精简 PR", "source": "X：Dex Horthy（HumanLayer）(@dexhorthy)", "sourceUrl": "https://x.com/dexhorthy/status/2100558413314859118", "date": "2026-09-17T12:12:06.000Z", "summary": "Dex Horthy 宣布开源与 @mattpocockuk 讨论后产出的 pull request skill，该技能随 HumanLayer 捆绑提供，基于 /show-me 并加入引导指令，用来削减多数 Agent PR 中的冗余噪音。可通过 npx skills add humanlayer/skills --skill visual-pr 安装。", "type": "tip", "relTime": "6天前"}, {"id": 127, "title": "借助 GPT Astra，开发者在《我的世界》中原生运行《使命召唤：黑色行动 2》Hijacked 地图", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/809.htm", "date": "2026-09-17T11:46:58.000Z", "summary": "开发者 Luckey Faraday 借助 GPT Astra 用 Java 重构项目，让《使命召唤：黑色行动 2》的 Hijacked 地图原生运行在《我的世界》的 OpenGL 上下文中，全屏帧率约 45 FPS。地图、碰撞检测、机器人、导航网格、武器与渲染均作为 Fabric 模组运行在《我的世界》内部，目前项目仍有很多工作要做，未来或加入更多地图、武器与多人模式。", "type": "paper", "relTime": "6天前"}, {"id": 128, "title": "ZenCreator 借助阿里云模型工作室扩展", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100537775099380141", "date": "2026-09-17T10:50:06.000Z", "summary": "大规模 AI 图像和视频生成需要的不仅仅是基础架构。ZenCreator 在阿里云 Model Studio 上扩展到每月 100 万+ 次生成，利用 Wan 和 Qwen 模型实现一致的品质，同时可靠地为 150 万+ 创作者和机构提供支持。了解更多：https://click.alibabacloud.com/m/20000003405/ 在阿里云 Model Studio 上试用 Qw...", "type": "model", "relTime": "6天前"}, {"id": 129, "title": "Qwen 接入 n8n，一键调用", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100531911206879316", "date": "2026-09-17T10:26:48.000Z", "summary": "Qwen 现在在 @n8n_io 里一键即可调用。无需 API key。无需单独账号。无需额外计费。从 n8n v2.36 起，Cloud Starter 和 Pro 用户（含免费试用）可通过 Gateway credits 调用 Qwen--文本、图像和视频生成都在单个节点内完成。符合条件的用户可获得一笔 starter 余额，在真实工作流中试用 Qwen。", "type": "product", "relTime": "6天前"}, {"id": 130, "title": "紫金矿业10亿元投资AI与人形机器人基金", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2100489934633361700", "date": "2026-09-17T07:40:00.000Z", "summary": "紫金矿业全资投资平台将出资10亿元人民币（1.4亿美元），参与一只总规模49亿元的新基金，聚焦人工智能、具身智能及前沿技术应用。该基金还获宁德时代投资平台与算力基础设施公司EdgeConneX China等支持。紫金矿业称投资主要为寻找可用于矿产勘探、智能矿山、加工与安全运营的技术，并已在西藏铜矿测试5G自动驾驶卡车。", "type": "paper", "relTime": "6天前"}, {"id": 131, "title": "蚂蚁 inclusionAI 发布 Ming-Image-0.1-Design：6B 文本生图模型，支持透明背景", "source": "蚂蚁 inclusionAI：HuggingFace 新模型", "sourceUrl": "https://huggingface.co/inclusionAI/Ming-Image-0.1-Design", "date": "2026-09-17T07:17:31.000Z", "summary": "蚂蚁 inclusionAI 在 HuggingFace 发布 6B 文本到图像模型 Ming-Image-0.1-Design，面向 UI、信息图、海报等文字密集的视觉设计，可生成完整画面并支持 RGBA 透明背景输出。", "type": "model", "relTime": "6天前"}, {"id": 132, "title": "Jev 不是聊天机器人：接收文本状态输出结构化打分", "source": "X：马东锡 NLP (@dongxi_nlp)", "sourceUrl": "https://x.com/dongxi_nlp/status/2100475029460799584", "date": "2026-09-17T06:40:46.000Z", "summary": "Jev 不是 chatbot，不能对话，它接收 state（主要是 text data）后打分并输出结构化结果。其定位是固定 workflow 中的\"螺丝钉\"，适合做日志分析和输出检测。", "type": "paper", "relTime": "6天前"}, {"id": 133, "title": "VideoClaw 发布：一句话提示完成视频制作", "source": "X：Haider (@haider1)", "sourceUrl": "https://x.com/haider1/status/2100473474502504956", "date": "2026-09-17T06:34:35.000Z", "summary": "VideoClaw 正式发布，将视频制作变成提示词驱动的一体化工作流，用户只需给出一段文字、播客、广告、原始素材甚至一个想法，它就能完成策划、剪辑、生成、添加 B-roll、音乐和字幕，并记住你偏好的风格。官方称其演示视频完全由 VideoClaw 制作，混合了真人拍摄与生成画面，可免费试用。", "type": "paper", "relTime": "6天前"}, {"id": 134, "title": "Google Research 推出 Retrieve-for-Train（R4T）：用 RL 编译的扩散检索器实现 12× 至 20× 更快的查询扇出", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/16/google-research-introduces-retrieve-for-train-r4t-an-rl-compiled-diffusion-retriever-for-12x-to-20x-faster-query-fan-out", "date": "2026-09-17T06:19:38.000Z", "summary": "Google Research 提出 Retrieve-for-Train（R4T），先用强化学习离线学习查询扇出，再蒸馏进一个 53.9M 参数的扩散 Transformer，单次非自回归前向即可生成全部检索方向。", "type": "paper", "relTime": "6天前"}, {"id": 135, "title": "阿里云 Wan3.0 展示单条 30 秒视频生成与多视频参考能力", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100460967540715803", "date": "2026-09-17T05:44:53.000Z", "summary": "阿里云介绍 Wan3.0 开始适配真实生产流程：从一年前的 5 秒片段到 15 秒，现在可直接生成单条 30 秒镜头，并支持导演级控制和最多引用五条视频的 omni-reference。制作者将 Wan3.0 用于实际制作工作流，可生成长镜头后按剧本剪辑，无需再拼接大量短片段，API 可通过 Model Studio 和 Qwen Cloud 访问。", "type": "model", "relTime": "6天前"}, {"id": 136, "title": "GPT-6 Astra 联手 Tripo 3.1 自动搭建 GTA 6 风格海滩别墅", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2100460255440474291", "date": "2026-09-17T05:42:04.000Z", "summary": "用户 insaneUEFN 用 OpenAI GPT-6 Astra、Atlas3DAI 和 Tripo 3.1 搭建了一条自动化管线，将 GTA 6 风格海滩别墅直接生成并组装进 UEFN。他放弃低模的 Tripo P2 改用 Tripo 3.1，把 70 个高模资产优化到 5K 或 1K 三角面，再通过 UEFN MCP 复用梁柱、窗户等模块化部件完成 1：1 重建，全程仅需两次方向性反馈。", "type": "paper", "relTime": "6天前"}, {"id": 137, "title": "香港三所小学与QwenWork合作试点AI教学", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100455931507069100", "date": "2026-09-17T05:24:53.000Z", "summary": "香港三所小学与QwenWork签署MoU，成为该市首批将AI引入日常教学与校务的试点小学。QwenWork可帮教师将文本、图像、音频、视频转为现成教学材料，并支持行政工作；学生将在IT和STEAM课上用AI与云工具创建网站、应用和游戏。中华基督教会基慈小学超半数教职工将从第一天起在日常工作中使用AI。", "type": "paper", "relTime": "6天前"}, {"id": 138, "title": "用GPT6加Hyper3D Rodin搭建可互动3D个人作品集的实操教程", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247511475&idx=1&sn=8a7bf92da9b058a05af2633416fba92f", "date": "2026-09-17T05:08:26.000Z", "summary": "作者用GPT6搭配Hyper3D Rodin的MCP，花一下午做出了可逛、可交互的3D个人作品集网页，场景含35个精细建模。流程为GPT-6画参考图并写交互代码，Rodin生成3D模型，BANG把模型按结构拆成独立零件以实现零件级动画，作者还把整个流程打包成skill发布在github.com/LearnPrompt/3Dworkshop。", "type": "tip", "relTime": "6天前"}, {"id": 139, "title": "圆谷公司谈AI如何变革视频创作", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100451230942171283", "date": "2026-09-17T05:06:12.000Z", "summary": "AI 正在为视觉叙事开启新篇章。在 #ApsaraConference2026 上，Tsuburaya Fields Holdings 执行董事 Toyoshima Yusaku 将探讨视频创作如何随 AI 演进。立即注册：https://click.alibabacloud.com/m/20000002869/ #AgenticEra #AgentNative #AIAgentsAtAps...", "type": "paper", "relTime": "6天前"}, {"id": 140, "title": "特斯拉 Cybercab 全国巡展首秀亮相京沪，9 月 17 日至 21 日静态展出", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/398.htm", "date": "2026-09-17T02:02:17.000Z", "summary": "特斯拉 Cybercab 全国巡展首秀于 9 月 17 日在上海兴业太古汇和北京华贸特斯拉体验店开启，上海展至 9 月 21 日、北京展至 9 月 27 日，均为静态展示，不涉及在华上市销售或无人驾驶网约车商业运营。该车为面向无人驾驶网约车的两座车型，取消方向盘、踏板和后视镜，采用 8 颗摄像头与纯视觉、端到端神经网络方案，依托 FSD 技术。", "type": "paper", "relTime": "6天前"}, {"id": 141, "title": "The Sandbox 联手 Meshy 生成 3D 资产", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2100403294145483116", "date": "2026-09-17T01:55:43.000Z", "summary": "太激动了 🤩  The Sandbox 与 Meshy 达成合作，Meshy 是领先的 AI 驱动 3D 资产生成平台，帮助游戏开发者更快、更精准地构建资产。🔥", function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){

}

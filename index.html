ika-H...", "type": "product", "relTime": "4小时前"}, {"id": 6, "title": "AI 推理初创公司 Fal 融资 13 亿美元，估值翻倍至 160 亿美元", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/11/03/ai-inference-startup-fal-doubles-its-valuation-to-16b-as-demand-surges/", "date": "2026-11-03T19:34:43.000Z", "summary": "托管和运行 AI 视频、图像与音频模型的旧金山初创公司 Fal 完成 13 亿美元融资，由 Bessemer Venture Partners 领投，Nvidia、Sound Ventures 和 T. Rowe Price 参投，估值 160 亿美元，较 4 月的 80 亿翻倍。", "type": "industry", "relTime": "4小时前"}, {"id": 7, "title": "国行 Apple 智能与 Siri 随 iOS 27.3 开发者预览版上线，iPhone 15 Pro 及更新机型可用", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/021/861.htm", "date": "2026-11-03T19:08:12.987Z", "summary": "苹果面向 iPhone 发布 iOS 27.3 开发者预览版，IT之家实测国行「Apple 智能与 Siri」如期上线，用户更新后可在设置中找到该功能。国行版与阿里巴巴合作接入千问，用户可在 Siri、写作工具和视觉智能中调用千问的文本与图像理解能力，登录千问账户或通过「通过 Apple 登录」即可使用，无需跳转独立应用。", "type": "product", "relTime": "4小时前"}, {"id": 8, "title": "Gemini API CLI 技能发布", "source": "X：Philipp Schmid（Google DeepMind 开发者体验） (@_philschmid)", "sourceUrl": "https://x.com/_philschmid/status/2117674864907608543", "date": "2026-11-03T17:46:46.000Z", "summary": "我们为 Gemini API CLI 做了一个技能。它让你的智能体可以通过 CLI 调用 Gemini 模型（图像、TTS、视频、文件），无需编写一次性脚本。  npx skills add google-gemini/gemini-skills --skill gemini-api-cli", "type": "product", "relTime": "6小时前"}, {"id": 9, "title": "Google DeepMind 与 Stanford 论文：提示词中红心图形可让 VLM 转向递归解法", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2117651708998484268", "date": "2026-11-03T16:14:46.000Z", "summary": "Google DeepMind 与 Stanford 的论文发现，提示词中加入与任务无关的简单彩色图形（如红心）会隐式改变 VLM 的行为。在二叉树编码题上，红心使 Claude Opus 4.7 和 GPT-5.4 的递归解法占比从 0% 升到 100%；Gemini 3.1 Pro 被图形影响时，71.5% 的思考痕迹称图像无关。", "type": "paper", "relTime": "7小时前"}, {"id": 10, "title": "OCRia-1 背后的推理栈：单张 B200 上 token 生成提速近 10 倍", "source": "LlamaIndex：产品、工程与评测", "sourceUrl": "https://www.llamaindex.ai/blog/the-inference-stack-behind-ocria", "date": "2026-11-03T16:00:00.000Z", "summary": "LlamaIndex 披露 OCRia-1 文档解析模型的推理优化方案，在单张 B200 GPU 上把 token 生成速度从约 285 tokens/sec 提升到约 2800 tokens/sec，接近 10 倍。方案结合了混合精度量化（BF16、FP8、NVFP4，视觉编码器不量化）与 DFlash2 块扩散投机解码，后者接受率超过 12 个 token。", "type": "tip", "relTime": "8小时前"}, {"id": 11, "title": "OiiOii全能复刻实测：用Opus 5.5+Seedance 2.5批量复刻6类高质感视频", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s/6JHZvhaLnJM8bajlh8bsKQ", "date": "2026-11-03T12:08:00.000Z", "summary": "作者实测OiiOii新上线的全能复刻功能，复刻了品牌UI动效、MG动画、单品广告、游戏实机、口播和多维度批量裂变6类视频，全程无需写代码或用AE。其原理是镜头光影交给Seedance 2.5生成，识别到文字排版和UI时调用Opus 5.5写代码并在云端浏览器渲染录制，文字边缘比原片更清晰；复刻时留存中间工程文件，同一创意反复修改速度可快4到5倍、费用省约80%。", "type": "tip", "relTime": "11小时前"}, {"id": 12, "title": "Meshy 发布 N1 Texture，单个游戏资产纹理约 20 秒完成", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2117560632367309261", "date": "2026-11-03T10:12:51.000Z", "summary": "Meshy 发布 Meshy N1 Texture，为游戏资产生成纹理，单个资产约 20 秒完成。该工具输出干净的 2K base color、大幅减少接缝，主打风格化游戏资产。官方还演示了 GPT 编写商店代码、Meshy T2 把商品照片转成 3D、N1 上色的十分钟超市搭建流程。", "type": "product", "relTime": "13小时前"}, {"id": 13, "title": "可灵 4.0 实战：八位创作者分享使用体验", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2117540047809602044", "date": "2026-11-03T08:51:04.000Z", "summary": "可灵（Kling）邀请八位创作者分享 Kling 4.0 在真实创作工作流中的表现。要点包括 Dynamic Motions 带来更流畅的动作与物理交互、Native 30s Generation 支持更自然的叙事节奏，Omni Reference 融合多种视觉参考构建统一风格。创作者还强调角色一致性提升、口型与粤语台词精准匹配以及电影级画面质感。", "type": "industry", "relTime": "15小时前"}, {"id": 14, "title": "曝字节跳动 Seedance 视频生成模型海外收入占比达 50%", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/021/637.htm", "date": "2026-11-03T08:37:00.243Z", "summary": "据《智能涌现》爆料，字节跳动旗下视频生成模型 Seedance 的海外收入占比已达到 50%，过去半年海外市场收入增长近 5 倍。报道称腾讯位列 Seedance 中国区客户前三，B站进入前十，头部互联网企业正规模化采购；火山引擎此前还发布了 Seedance 影视合作计划，单个项目激励最高可达百万人民币，并于 10 月 23 日发布该代中最强的 Seedance 2.5 4K 模型。", "type": "industry", "relTime": "15小时前"}, {"id": 15, "title": "商汤发布日日新 SenseNova 6.8 Flash 正式版，支持动态 PPT 与 Blender 3D 创作", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/021/487.htm", "date": "2026-11-03T03:59:48.813Z", "summary": "商汤科技 11 月 2 日晚发布日日新 SenseNova 6.8 Flash 正式版，重点升级办公协作与设计生成能力，支持长期记忆、跨会话任务协作。", "type": "model", "relTime": "20小时前"}, {"id": 16, "title": "Google 与香港大学发布 VeriCUA 论文：用机器状态验证计算机智能体的任务完成声明", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2117445916982673579", "date": "2026-11-03T02:37:01.000Z", "summary": "Google 与香港大学的 VeriCUA 论文主张计算机使用智能体自己报告的“任务完成”不能作为证据，应检查保存的文件和应用数据。VeriCUA 先探索应用构建需求清单，再运行屏幕或代码检查逐项核实；在 ScienceBoard 上误报率为 5.4%，低于 VLM 评审的 24.8% 和生成脚本校验器的 21.7%，并在 3 个在线环境中拒绝约 80% 的虚假完成报告。", "type": "paper", "relTime": "21小时前"}, {"id": 17, "title": "OpenAI 训练并部署激活分类器作为前沿模型安全监控层", "source": "OpenAI：Alignment 研究博客（RSS）", "sourceUrl": "https://alignment.openai.com/training-activation-classifiers/", "date": "2026-11-02T20:00:00.000Z", "summary": "OpenAI 自 GPT-5.6 起在其最强模型的内部和外部流量上部署激活分类器（probes），利用模型内部激活逐 token 实时评分，可在生成中途阻断违规回复和工具调用并交由推理模型复审。实验显示 probes 比更大的文本分类器对测试的越狱攻击更鲁棒，准确率随模型能力提升，且在后训练各检查点间迁移良好，但需为新基础模型重新训练，且只能检测可显式训练的已知违规类型。", "type": "paper", "relTime": "1天前"}, {"id": 18, "title": "Agent Arena 前十智能体输入输出比达 93:1", "source": "X：Arena (@arena)", "sourceUrl": "https://x.com/arena/status/2117332916854501753", "date": "2026-11-02T19:08:00.000Z", "summary": "根据我们对 26K+ 会话的分析，Agent Arena 中排名前十的智能体每生成一个 token，大约要处理 93 个输入 token。  这就是各家实验室竞相降低缓存输入成本的原因。  下方视频展示了缓存在实践中的运作方式，用的是来自 @AnthropicAI 的 Opus 5.5 和 @GoogleDeepMind 的 Gemini 4 Argon 的真实会话。  深入了解这场隐藏的 ...", "type": "model", "relTime": "1天前"}, {"id": 19, "title": "Skyfall AI 发布 SKY-001 工程世界模型", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2117323512155394394", "date": "2026-11-02T18:30:37.000Z", "summary": "Skyfall AI 发布 SKY-001，可按零件与建造步骤在 3D 中设计实体产品，CAD 精度与 GPT-6 Astra 相当，单次设计成本约低 150 倍。模型输出零件树、每步操作草图及中间实体，由 Hierarchical Composer 拆解装配与零件、Construction World Model 预测建造视觉步骤两阶段完成。", "type": "model", "relTime": "1天前"}, {"id": 20, "title": "美团LongCat-2.5多模态智能体模型发布", "source": "X：美团 LongCat (@Meituan_LongCat)", "sourceUrl": "https://x.com/Meituan_LongCat/status/2117264311714537633", "date": "2026-11-02T14:35:23.000Z", "summary": "推出 LongCat-2.5，我们最新的原生多模态智能体模型，总参数 1.6T，激活参数约 48B。  专为长程智能体任务打造，为从复杂编程项目到创意设计、3D 任务等视觉编程的各类工作带来更强的视觉理解与智能体编程能力。  了解更多 LongCat-2.5：https://longcat.ai/blog/longcat-2.5/", "type": "model", "relTime": "1天前"}, {"id": 21, "title": "美团龙猫发布 LongCat-2.5 原生多模态模型：1.6T 参数，面向长程智能体任务", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/020/873.htm", "date": "2026-11-02T01:18:38.433Z", "summary": "美团龙猫发布面向长程智能体任务的原生多模态模型 LongCat-2.5，总参数量 1.6 万亿，每个 token 激活约 480 亿参数，在 LongCat-2.0 基础上强化原生视觉理解与智能体编程能力。", "type": "model", "relTime": "1天前"}, {"id": 22, "title": "美团 LongCat 发布 LongCat-2.5：面向智能体任务的原生多模态模型", "source": "公众号：龙猫LongCat（美团）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzYyMTA0NTc5NQ%3D%3D&mid=2247486081&idx=1&sn=0609ae26ada1d4d96126b95044dd4519", "date": "2026-11-02T01:00:00.000Z", "summary": "美团龙猫 LongCat 团队发布面向长程智能体任务的原生多模态模型 LongCat-2.5，总参数量 1.6 万亿，每个 token 激活约 480 亿参数，在 LongCat-2.0 基础上强化原生视觉理解与智能体编程能力。", "type": "model", "relTime": "1天前"}, {"id": 23, "title": "Perplexity CEO 演示 Computer 生成的 4 亿年地球演化交互球体", "source": "X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)", "sourceUrl": "https://x.com/AravSrinivas/status/2117030646107545812", "date": "2026-11-01T23:06:53.000Z", "summary": "Perplexity CEO Aravind Srinivas 演示用 Computer 可视化地球 4 亿年的演化。引用的 @AskPerplexity 内容显示，Computer 基于 14 个开放数据集构建了交互地球，用自有引擎在 109 张古海拔地图上移动 258 个板块，可拖动时间轴或输入城市查看其 4 亿年前的位置，入口为 https://deeptime.pplx.app/。", "type": "product", "relTime": "2天前"}, {"id": 24, "title": "NVIDIA Cosmos 教程：为交互式仿真构建世界模型并部署 NIM 推理", "source": "NVIDIA Technical Blog：Agentic AI / Generative AI", "sourceUrl": "https://developer.nvidia.com/blog/build-world-models-for-interactive-simulation-with-nvidia-cosmos/", "date": "2026-11-01T16:00:00.000Z", "summary": "NVIDIA 技术博客介绍如何用 Cosmos 平台为物理 AI 构建世界模型，覆盖 Cosmos Framework 的训练、LoRA/SFT 后训练、DPO、GRPO、PPO 等强化学习管线，以及 Cosmos3-Nano 系列 checkpoint 在自动驾驶、机器人和手术场景下生成相机视频与 LiDAR 观测的推理流程。", "type": "product", "relTime": "2天前"}, {"id": 25, "title": "Adobe 研究推出 EditAgent，用测量数据让语言模型更专业地使用图像编辑工具", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/adobe-is-testing-how-well-ai-agents-can-use-editing-tools-like-a-photoshop-professional-would/", "date": "2026-11-01T14:56:44.000Z", "summary": "Adobe Research 与 UC San Diego 在论文中提出 EditAgent，将请求拆成步骤、并行生成候选，并用语言模型依据验证记录（特写、变化图、亮度色彩数据）一次性对比挑选。", "type": "paper", "relTime": "2天前"}, {"id": 26, "title": "PixVerse 演示 30 秒 16:9 犯罪动作惊悚视频生成提示词", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2116538273321685349", "date": "2026-10-31T14:30:22.000Z", "summary": "PixVerse 展示了一段 30 秒、16:9 的写实犯罪动作惊悚视频提示词，设定在纽约篮球馆，用 4 张参考图分别锁定人物、走廊、比赛和扶梯大厅，要求保持人物身份、黑西装、领带和墨镜一致。", "type": "tip", "relTime": "3天前"}, {"id": 27, "title": "Tripo 教程：20 分钟用 Agentic Canvas 搭建赛博朋克场景", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2116536921598079174", "date": "2026-10-31T14:25:00.000Z", "summary": "Tripo 发布教程，演示如何在 20 分钟内用 Tripo Studio 的节点式 Agent「Agentic Canvas」从一张参考图生成赛博朋克 3D 场景并导出 UE5 工程。", "type": "tip", "relTime": "3天前"}, {"id": 28, "title": "PixVerse 发布 2000 年代日本 MiniDV 手持录像风格 30 秒视频提示词", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2116485440136241230", "date": "2026-10-31T11:00:25.000Z", "summary": "PixVerse 发布一份 30 秒视频生成提示词，模拟 2000 年代初日本家用 MiniDV 手持录像风格，角色和街景严格基于参考图片。提示词规定跟拍距离约 0.5-1.2 米、禁止全身镜头、30 秒内约 10-12 个镜头并以 HARD CUT 为主，并逐镜头规定了雨天进店买饮料的完整剧情与付款连贯性细节。", "type": "tip", "relTime": "3天前"}, {"id": 29, "title": "Figma 发布 Weave 创作平台，用节点化工作流让创意流程可复用", "source": "Figma AI / Agent / Make", "sourceUrl": "https://www.figma.com/blog/the-tldr-on-figma-weave/", "date": "2026-10-31T00:58:00.000Z", "summary": "Figma 宣布 Figma Weave，一个面向持续产出需求的创意团队平台，并把 Weave 创作工作流与 Figma 画框连接起来。Weave 用连接的节点承载图像和视频的生成与编辑，支持分支探索、多模型对比、色彩校正、合成、裁剪、Painter 等编辑节点；工作流可打包成 Weave tool 让团队成员一键运行，社区工具发布已上线。", "type": "product", "relTime": "3天前"}, {"id": 30, "title": "阿里巴巴与Apple合作，千问集成至Apple智能，11月4日开放测试", "source": "公众号：千问APP（阿里）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzYzNDE5MDEwMQ%3D%3D&mid=2247489416&idx=1&sn=9525f61df8086fcd6fe4d4183da068de", "date": "2026-10-31T00:03:47.000Z", "summary": "10月31日阿里巴巴宣布与Apple合作，将千问集成至Apple智能，中国用户可在Siri、写作工具及视觉智能中调用千问的文本与图像理解、内容生成能力。功能11月4日起随iOS开发者Beta开放测试，12月iOS 27.3正式发布时推出；用户可自主选择开通，请求与回复不用于模型训练。", "type": "industry", "relTime": "3天前"}, {"id": 31, "title": "谷歌宣布 Project Suncatcher 在轨 TPU 首次完成 AI 响应里程碑", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/020/402.htm", "date": "2026-10-30T23:51:47.903Z", "summary": "谷歌当地时间 10 月 30 日宣布达成“Hello World”里程碑，在轨运行的数据中心级 TPU 首次给出 AI 响应，由预装在卫星上的 DeepMind 模型 Gemma 4 创作了一首关于身处太空的俳句。", "type": "industry", "relTime": "4天前"}, {"id": 32, "title": "Gemini 头像可与好友共享出镜", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2116306570514772225", "date": "2026-10-30T23:09:40.000Z", "summary": "11) 在 Gemini 中与朋友分享你的头像，一起出演图像和视频。  创建你的个人头像，分享给朋友、家人和协作者，在提示词中互相标记，生成看起来和听起来都像你的图像和视频。此外，你可以随时添加或移除朋友的访问权限。  有关可用性及创建头像的分步说明的更多信息：https://goo.gle/4dTXLJA", "type": "product", "relTime": "4天前"}, {"id": 33, "title": "Google Gemini 发布前沿模型 Gemini 4 Argon", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2116304862736695654", "date": "2026-10-30T23:02:52.000Z", "summary": "Google Gemini 官方宣布推出前沿模型 Gemini 4 Argon，称其能逐步拆解复杂任务，帮助用户把想法做成实际成果。示例用途包括生成可分享的网页应用、制作 3D 文件，以及产出成品化的幻灯片和报告。", "type": "model", "relTime": "4天前"}, {"id": 34, "title": "Apple 智能宣布入华：Siri、写作工具及视觉智能接入阿里千问，11 月 4 日开放测试", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/020/392.htm", "date": "2026-10-30T22:47:48.753Z", "summary": "苹果公司 10 月 31 日发布公告，宣布面向中国 iPhone 18 Pro 等机型用户，于 11 月 4 日开放测试，并在 12 月推出的 iOS 27.3 更新中上线首批 Apple 智能核心功能。", "type": "industry", "relTime": "4天前"}, {"id": 35, "title": "fal 上线 FLUX 3 Max 视频 API 提供图生视频、关键帧与文生视频入口", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2116300670781280576", "date": "2026-10-30T22:46:13.000Z", "summary": "fal 官方宣布 blackforestlabs/flux-3-max 模型已在平台可用，提供三个入口。分别是图生视频 https://fal.ai/models/blackforestlabs/flux-3-max/image-to-video、关键帧到视频 https://fal.ai/models/blackforestlabs/flux-3-max/keyframes-to-vide...", "type": "product", "relTime": "4天前"}, {"id": 36, "title": "Seedance 2.5 美国草稿模式上线 fal", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2116271900057891244", "date": "2026-10-30T20:51:54.000Z", "summary": "Seedance 2.5 美国草稿模式现已在 fal 上线  先以 480p 预览，再以 1080p 完成同一视频 适用于文生视频、图生视频和参考生视频 草稿在美国托管基础设施上保留 14 天有效", "type": "product", "relTime": "4天前"}, {"id": 37, "title": "Google DeepMind 发布 Genie 4 世界模型，可实时创建和操控交互式模拟", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2116237215026032872", "date": "2026-10-30T18:34:04.000Z", "summary": "Google 发布来自 DeepMind 的新世界模型 Genie 4，可实时创建、听见并操控交互式模拟，不只是视频片段。文中称这类虚拟世界未来可为机器人和 AI 智能体提供在现实世界协助之前的学习 playground。", "type": "model", "relTime": "4天前"}, {"id": 38, "title": "Google Project Suncatcher 卫星首次从太空传回 AI 生成回应", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/1023528/google-project-suncatcher-ai-satellite-transmission", "date": "2026-10-30T18:21:38.000Z", "summary": "Google 表示其搭载 TPU 的 Project Suncatcher 卫星成功在轨启动 TPU，由星载 Gemma 4 模型响应提示词，生成了一首关于身处太空的俳句并传回地球。该卫星于本月早些时候发射入轨，Google 接下来将测试 TPU 在热应力和辐射暴露下的表现，并计划在 2027 年实现双星互联的下一个里程碑。", "type": "industry", "relTime": "4天前"}, {"id": 39, "title": "The Biological Computing Company 的 mischief 1 图生视频模型上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2116233085025185797", "date": "2026-10-30T18:17:39.000Z", "summary": "OpenRouter 宣布 The Biological Computing Company 的 mischief 1 模型上线，可将一张起始图加提示词生成 3 秒或 5 秒、480p 或 720p 的视频片段。该模型基于该公司四年脑细胞电极培养研究，价格从每秒视频 $0.005 起，入口为 https://openrouter.ai/tbc/mischief-1。", "type": "product", "relTime": "4天前"}, {"id": 40, "title": "Google Suncatcher 首颗数据中心卫星在轨运行，用 Gemma 4 生成俳句", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/30/googles-first-data-center-satellite-is-online-and-writing-poetry/", "date": "2026-10-30T17:00:00.000Z", "summary": "Google Suncatcher 原型太空数据中心卫星于本月随 SpaceX Falcon 9 发射升空，经约三周调试后已上线并回应地面首个提示词，让星上预装的 Gemma 4 写了一首关于太空的俳句。", "type": "industry", "relTime": "4天前"}, {"id": 41, "title": "OpenCode 2.2.3 新增图像生成工具", "source": "X：opencode (@opencode)", "sourceUrl": "https://x.com/opencode/status/2116203934033354866", "date": "2026-10-30T16:21:49.000Z", "summary": "图像生成已成为编程智能体的重要工具  你可以用它为电子游戏生成概念 UI 或参考美术  OpenCode 2.2.3 有一个图像生成工具，支持来自 OpenAI、Gemini、Grok 等的图像模型", "type": "product", "relTime": "4天前"}, {"id": 42, "title": "TBC 发布 mischief 1 图生视频模型 API", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2116172473112965456", "date": "2026-10-30T14:16:48.000Z", "summary": "TBC 推出 mischief 1，一个基于在电极上培养的活体脑细胞研究产出的图生视频模型，起价 0.5 美分每秒，公司称其速度至少是底座模型的 5 倍。", "type": "product", "relTime": "4天前"}, {"id": 43, "title": "inclusionAI 发布 ZwZ2-27B GGUF 量化权重", "source": "蚂蚁 inclusionAI：HuggingFace 新模型", "sourceUrl": "https://huggingface.co/inclusionAI/ZwZ2-27B-GGUF", "date": "2026-10-30T10:28:08.000Z", "summary": "inclusionAI 在 HuggingFace 发布 ZwZ2-27B 的 GGUF 格式权重，属于 Zooming without Zooming v2。模型拆分为语言模型与视觉编码器/投影器（mmproj）两部分，各提供 FP16、Q8_0、Q4_K_M 三档精度，可混搭组合。使用需较新的 llama.cpp 构建并支持 Qwen3.5 多模态。", "type": "model", "relTime": "4天前"}, {"id": 44, "title": "中国一半 AI token 都在做爽剧？GovAI 研究员拆解 55% 说法与有用性焦虑", "source": "ChinaTalk（RSS）", "sourceUrl": "https://www.chinatalk.media/p/is-half-of-chinas-ai-making-slop", "date": "2026-10-30T10:04:01.000Z", "summary": "GovAI 研究员 Zilan Qian 撰文分析「55% 中国 AI token 用于短剧和视频生成」这一病毒式说法，其源头是中文在线 6 月 3 日投资者电话会议，CAICT 报告已从官网下架。", "type": "industry", "relTime": "4天前"}, {"id": 45, "title": "生数科技与腾讯云达成战略合作，Vidu 全系模型入驻 TokenHub", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489459&idx=1&sn=4a33dda84ed833e7672822d2d3ce81ed", "date": "2026-10-30T08:49:55.000Z", "summary": "生数科技与腾讯云在腾讯全球数字生态大会上签署战略合作协议，围绕视频生成大模型、云基础设施与行业解决方案展开深度合作。Vidu 全系列模型已入驻腾讯云 TokenHub，上线 Vidu Q4 Preview、Q3 Pro 及 Vidu S2 等模型，其中 Q4 Preview 支持最高 4K 输出、最多 15 张参考图与 3 段参考音频。", "type": "industry", "relTime": "4天前"}, {"id": 46, "title": "Tripo Agentic Canvas 自动化 3D 工作流指南", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2116046747135000854", "date": "2026-10-30T05:57:13.000Z", "summary": "一份用 Tripo Agentic Canvas 自动化 3D 工作流的快速分步指南。↓  1. 描述你的想法  告诉 Agent 你想做什么。从文本提示词、参考图像或现有 3D 模型开始，把它放进 Agent 聊天中，它就会规划工作流。", "type": "tip", "relTime": "4天前"}, {"id": 47, "title": "PokeBot 推出 RoboAPI：用 API 调用机械臂", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2116030405170299345", "date": "2026-10-30T04:52:17.000Z", "summary": "PokeBot 发布 RoboAPI，让 5 款受支持机械臂的用户无需采集数据、无需按任务训练，直接发送文本指令即可驱动机器人。该 API 由世界动作模型 Poke-Aurora 驱动，机械臂摄像头图像上传至 PokeBot 服务器，模型回传动作并以 30Hz 执行，模式类似 LLM 文本 API。主推文称这是迈向零样本机器人（zero-shot robotics）的进展，任务之间只需更换指令。", "type": "product", "relTime": "4天前"}, {"id": 48, "title": "Kimi 官方教程：如何用 Kimi K3.1 Pro 创作 3D 作品", "source": "公众号：月之暗面（Kimi）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMTY4NTIyNA%3D%3D&mid=2247484364&idx=1&sn=42491c3f098deb797ee8f2a17d147b3a", "date": "2026-10-30T04:04:56.000Z", "summary": "月之暗面（Kimi）发布官方教程，详解 Kimi K3.1 Pro 的 3D 创作工作流程，说明参数化建模与网格化建模两种方式及对应工具选择。文章分享了 4 个案例的具体操作，包括在 Unreal Engine 中构建东方天宫、制作可 3D 打印的台灯、纯代码调用 Blender 生成建筑、用 Tripo 和 Blender 搭建微缩城市，并给出图胜于言、先搭灰模再细化等 5 个使用技巧。", "type": "tip", "relTime": "4天前"}, {"id": 49, "title": "Utopai X 登顶 AA 图生视频榜第二", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2115990509944766842", "date": "2026-10-30T02:13:45.000Z", "summary": "Utopai Studios 基于 MiniMax H3 后训练的 Utopai X 在 AA-Video-I2V v2.1 榜单排名第二，仅次于 Dreamina Seedance 2.5，是唯一同时进入 AA-Video-T2V v2.1 与 AA-Video-I2V v2.1 前二的模型。", "type": "model", "relTime": "4天前"}, {"id": 50, "title": "RLNF：用脑信号做奖励的个性化AI", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2115959264112259404", "date": "2026-10-30T00:09:35.000Z", "summary": "这对个性化 AI 来说简直是下一个层级。  唤醒信号由一个简单的嵌入向量加 k-NN 奖励来打分。 RL with Neural Feedback（RLNF，神经反馈强化学习）在观看者观看生成图像时，直接从其大脑读取唤醒信号，并将其用作 RL 奖励。  这个方向现在看起来如此自然。人类偏好本就存在于大脑中，RLHF 把它经由一次点击来传递，而 RLNF 则把大脑信号直接接入奖励。", "type": "paper", "relTime": "4天前"}, {"id": 51, "title": "Higgsfield 限免 Seedance 2.5 等模型", "source": "X：Higgsfield AI (@higgsfield)", "sourceUrl": "https://x.com/higgsfield/status/2115910751496073450", "date": "2026-10-29T20:56:49.000Z", "summary": "Higgsfield 上 Seedance 2.5 无限使用 7 天。  另有 4 款图像和视频模型： > GPT Image 2.5 > Nano Banana Pro > Seedream 5.0 Pro > Wan 3.0  整周零积分消耗。  现已面向新用户开放。", "type": "model", "relTime": "5天前"}, {"id": 52, "title": "Pika 基于MiniMax H3后训练并开源 Pika H3 Flex 视频生成模型", "source": "X：卡兹克 (@Khazix0918)", "sourceUrl": "https://x.com/Khazix0918/status/2115898252004622617", "date": "2026-10-29T20:07:09.000Z", "summary": "Pika Labs 在 MiniMax H3 上做后训练，推出并开源 Pika H3 Flex，采样步数从 50 步压缩到 6 步，生成时间大幅降低且质量有所提升。", "type": "model", "relTime": "5天前"}, {"id": 53, "title": "Gemini 推出可创建与分享的个人 Avatar 功能", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2115885244805251519", "date": "2026-10-29T19:15:28.000Z", "summary": "Gemini 现已支持创建并分享个人 avatar，可在与朋友的图片和视频中出镜，支持在提示词中互相标记并保持角色和声音的一致性。用户可随时添加或移除他人访问权限。", "type": "product", "relTime": "5天前"}, {"id": 54, "title": "Simon Willison 评述 Spawn 如何用 Fable 智能体集群自主开发多人游戏世界", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Oct/29/how-i-built-the-most-ai-pilled-company-in-the-world/", "date": "2026-10-29T17:00:26.000Z", "summary": "Simon Willison 评述 Jacob Sansbury 的文章，介绍多人游戏环境 Spawn 玩家可用提示词修改游戏世界，作者亲自体验用提示词生成城堡和龙。", "type": "industry", "relTime": "5天前"}, {"id": 55, "title": "Gemini 新增文档、PDF、演示文稿和表格的直接生成、预览与编辑功能", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2115845164824711247", "date": "2026-10-29T16:36:12.000Z", "summary": "Google Gemini 宣布可直接在应用内生成、预览和编辑文档、PDF、演示文稿、表格等多种文件。支持把手写笔记转成 PDF 学习指南、手动调整内容、高亮部分让 Gemini 修改文字或视觉元素，并可继续追问。", "type": "product", "relTime": "5天前"}, {"id": 56, "title": "PixVerse x Kling 4.0 提升动作一致性", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2115821028161237502", "date": "2026-10-29T15:00:17.000Z", "summary": "PixVerse x Kling 4.0  AI 视频在物理冲击感和动作一致性上仍有困难。  这一代生成在更重的击打感和运动中的细节稳定性上有所提升，让结果更接近实拍真实感。  完整提示词见下", "type": "paper", "relTime": "5天前"}, {"id": 57, "title": "DiffuSpace 开源 Clover-35B-A3B-Preview 扩散语言模型", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/019/783.htm", "date": "2026-10-29T14:33:24.987Z", "summary": "人工智能实验室 DiffuSpace（扩散智能）发布 Clover 系列首个成员 Clover-35B-A3B-Preview，以 Apache 许可开源。该模型采用 MoE 架构，通过多轮迭代实现从模糊到具体的全局思维，在多项基准测试中性能超过同规模自回归模型 Qwen3.6-35B-A3B，尤其擅长智能体编程与工具使用任务，同时保持更快生成速度。", "type": "model", "relTime": "5天前"}, {"id": 58, "title": "商汤林达华：AI 进步不只靠堆大模型", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2115775672958271515", "date": "2026-10-29T12:00:04.000Z", "summary": "商汤联合创始人兼首席科学家林达华在中信证券第33届投资者论坛上分享了对 AI 下一步走向的判断：AI 进步不只靠扩大规模，更在于更聪明的构建方式。他强调数据的“智能密度”决定学习效果，多模态应原生内建于模型架构与训练，并预计具身 AI 将在未来一到两年迎来加速。", "type": "model", "relTime": "5天前"}, {"id": 59, "title": "可灵AI 开放 Kling 4.0 API，接入多个 AI 创作平台", "source": "公众号：可灵AI（快手·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzU5NTkwNDU2OA%3D%3D&mid=2247497304&idx=1&sn=ab79528b22dc06737021dd9d5628fc0a", "date": "2026-10-29T11:40:19.000Z", "summary": "可灵AI 于10月28日正式面向全球企业客户与开发者开放 Kling 4.0 API，使其视频生成能力可接入 AI 创作工具、Agent 智能体和企业级工作流。", "type": "product", "relTime": "5天前"}, {"id": 60, "title": "PixVerse 分享 30 秒写实冒险惊悚片提示词", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2115760876804604363", "date": "2026-10-29T11:01:16.000Z", "summary": "PixVerse 发布一条 30 秒、16:9 写实冒险惊悚片生成提示词，用 4 张参考图分别锁定美洲豹、雨林、瀑布水潭和背包客，要求全程保持人物身份、服装、花纹与背包一致。提示词按 0–5s 到 26–30s 分七段给出镜头调度，从美洲豹突袭、泥地摔倒到跳入水潭逃生，并规定自然滤光、电影感对比、硬切与正常速度，无对白和文字。", "type": "tip", "relTime": "5天前"}, {"id": 61, "title": "PixVerse 用 Kling 4.0 一次生成 30 秒长场景", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2115760864238469589", "date": "2026-10-29T11:01:13.000Z", "summary": "你不必再把短片段拼接成长场景。  PixVerse 上的 Kling 4.0 一次性生成完整的 30 秒，多模态参考有助于让角色全程保持一致。  流程更顺畅，返工更少。完整提示词见下。", "type": "product", "relTime": "5天前"}, {"id": 62, "title": "Vidu Q4 Preview 与 updream 合作探索 AI 漫剧专业化生产", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489450&idx=1&sn=d7830821eb168cdeec1ccdeb4b76b4f1", "date": "2026-10-29T08:42:03.000Z", "summary": "Vidu 与 updream 合作，将 Vidu Q4 Preview 原生模型接入 updream 的 AI 视频创作流程，围绕镜头时序、跨镜角色一致性和高动态动作生成三项指标做全链路验证。", "type": "industry", "relTime": "5天前"}, {"id": 63, "title": "IDC：2026上半年中国MaaS营收破百亿，火山引擎以45.1%份额居首", "source": "公众号：火山引擎", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI0NzU1NzI5NQ%3D%3D&mid=2247545546&idx=1&sn=14c4f3ef7f84775baa98f2a3c8172e15", "date": "2026-10-29T08:07:56.000Z", "summary": "IDC报告显示2026H1中国MaaS市场规模达106.3亿元，火山引擎以45.1%份额位居第一，MaaS市场营收同比近9倍增长。大语言模型占整体规模47.0%，视频生成模型贡献32.7%收入；火山引擎推出全托管AaaS平台Managed Agents，上线2个月产生近500万个Session。", "type": "industry", "relTime": "5天前"}, {"id": 64, "title": "Google 发布 EmbeddingGemma 2 多模态嵌入模型论文", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2115655095505576117", "date": "2026-10-29T04:00:56.000Z", "summary": "Google 发布 EmbeddingGemma 2 论文，这是一个基于 Gemma 4、以 Apache 2.0 许可开源的 744M 参数多模态嵌入模型，可将文本、代码、图像、音频和视频嵌入统一向量空间，性能超过部分参数量大 2 到 12 倍的模型。", "type": "paper", "relTime": "5天前"}, {"id": 65, "title": "首批风云卫星极端天气 AI 模型发布，台风智能云图解译模型 27 秒生成解译文本", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/019/303.htm", "date": "2026-10-29T01:16:43.957Z", "summary": "10 月 29 日，首批风云气象卫星极端天气人工智能模型在 2026 年风云卫星用户大会上正式发布。台风智能云图解译模型覆盖 7 类台风特征、融合 20 余种卫星实况产品，每 15 分钟解 6.1 Sol、Muse Wonderful、Kimi 和 DeepSeek。", "type": "model", "relTime": "6天前"}, {"id": 71, "title": "Higgsfield 推出可玩广告生成工具", "source": "X：Higgsfield AI (@higgsfield)", "sourceUrl": "https://x.com/higgsfield/status/2115528864340525176", "date": "2026-10-28T19:39:20.000Z", "summary": "手游广告从来都不像真实游戏。  现在你可以把爆款广告变成一款完整的手游。  > 丢入一段玩法视频、一张截图或一段提示词 > 用爆款机制打造一款手游 > 在 Enterprise 套餐中把它变成可玩广告  Higgsfield Playable 现已上线。", "type": "paper", "relTime": "6天前"}, {"id": 72, "title": "Sunra 发布统一 API，一文接入主流图像视频音频与 3D 模型", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2115510689376973290", "date": "2026-10-28T18:27:07.000Z", "summary": "Sunra 发布统一 API，用一个密钥接入主流图像、视频、音频和 3D 模型，按各家厂商原价即用即付，无订阅且不加价。作者 Rohan Paul 转发该发布并指出，AI 视频最实用的指标是每秒生成价格，Seedance 2.5 在 Sunra 上的价格是另外两家网关的一半，便于跨 Google、OpenAI、字节和 Kling 模型做 A/B 测试。", "type": "industry", "relTime": "6天前"}, {"id": 73, "title": "Artificial Analysis 发布 AA-Video-I2V v2.1 图像生视频评测基准", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2115483562921304316", "date": "2026-10-28T16:39:19.000Z", "summary": "Artificial Analysis 发布 AA-Video-I2V v2.1 与 AA-Video-I2V-Silent v2.1 图像生视频评测基准，在 1080p 下按 10 类用例、10 项能力和多种视觉风格对模型排名。", "type": "model", "relTime": "6天前"}, {"id": 74, "title": "OpenMOSS 发布开源图像生成模型 MOSS-Image，主打长文本渲染与可编辑布局", "source": "OpenMOSS / 复旦NLP / 上海创智 / MOSI（网页）", "sourceUrl": "https://openmoss.ai/blog/cn/moss-image/", "date": "2026-10-28T16:00:00.000Z", "summary": "OpenMOSS 发布开放权重图像生成模型 MOSS-Image，采用 5B 参数单流 DiT 从零预训练，支持最长 4K token 提示词、中英文长文本渲染和可编辑的 JSON Layout。", "type": "model", "relTime": "6天前"}, {"id": 75, "title": "善邻集团与 Preferred Networks 达成业务资本合作，融合地理空间信息与 AI", "source": "Preferred Networks：AI 研究与产品", "sourceUrl": "https://www.preferred.jp/ja/news/pr20261029", "date": "2026-10-28T16:00:00.000Z", "summary": "善邻、善邻数据通信与 Preferred Networks（PFN）签署业务资本合作契约，善邻方面将认购 PFN 的第三方定向增发。三方将把带时间轴的高精度地理空间信息与 PFN 的生成 AI、物理 AI、图像与 3D 空间识别技术结合，开发理解与推理地理空间信息的 AI

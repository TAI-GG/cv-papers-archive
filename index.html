s)", "sourceUrl": "https://x.com/AYi_AInotes/status/2093688570485641670", "date": "2026-08-29T13:13:48.000Z", "summary": "斯坦福《自我进化 Agent》第一讲指出，判断工作能否被 AI 取代，关键看有无廉价的自动验证器，而非仅看能否被替代。课程强调生成与验证鸿沟：代码 Agent 因单元测试可自动闭环反馈而率先跑通。Agent 落地需遵循三条铁律：验证便宜的岗位（如重构、补测试）越用越强；靠人肉审美的岗位只能当草稿纸；生产级 Agent 须先画流程图并设人工审批闸门。", "type": "tip", "relTime": "11小时前"}, {"id": 7, "title": "音乐人化身\"侦探\"猎捕AI造假者", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/entertainment/985866/h4rris-nihil-young-edm-suno-ai", "date": "2026-08-29T12:00:00.000Z", "summary": "随着生成式AI工具渗入电子舞曲（EDM）领域，以26岁制作人Max \"H4RRIS\" Harris为代表的一批音乐人正通过视频公开点名，指认那些疑似用AI生成音乐冒充人类创作的同业。Harris认为AI音乐是\"诱饵艺术\"，并指出Suno生成曲目常出现人声与旋律同时卡顿、背景嘶声等可辨识特征，但他对MANSA等具体作品的指控目前尚无确凿证据。", "type": "tip", "relTime": "12小时前"}, {"id": 8, "title": "Lux3D 实测：图像文本生成可编辑 3D 资产", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2093639648946036998", "date": "2026-08-29T09:59:24.000Z", "summary": "1/ 过去几天我一直在测试 Lux3D，一个 3D 生成模型。你给它一张图片或一段文字提示，它就能返回一个完整的、可编辑的 3D 资产。无需建模技能。  试了全部 3 项核心功能。一条推文串：", "type": "tip", "relTime": "14小时前"}, {"id": 9, "title": "LAION 发布 Big Video Dataset：1000 万小时开源视频数据集", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/laion-drops-massive-open-video-dataset-with-10-million-hours-of-footage-for-ai-research", "date": "2026-08-29T09:36:48.000Z", "summary": "LAION 发布 Big Video Dataset（BVD），从 CommonCrawl 的 13 亿视频 URL 中下载了 8000 万个视频，总计 1000 万小时，并提取了 5500 万个带自动生成描述的视频片段和 3 亿张静态图像。", "type": "model", "relTime": "14小时前"}, {"id": 10, "title": "Grok 剪辑 Bot 开源：手机一句话生成混剪成片", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2093617498595680487", "date": "2026-08-29T08:31:23.000Z", "summary": "开发者 @XFreeze 开源了基于 Grok 的 Best Video Editor 模板，手机发一句话即可让 AI 在云端完成扒素材、配乐、切片、加标题并输出成片。该 Bot 支持零素材混剪、长视频抽高光和自带素材粗剪，底层连接真实云端环境而非网页生成，用户只需做最终把关。", "type": "tip", "relTime": "15小时前"}, {"id": 11, "title": "创作者依赖AI还能算创作者吗", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2093615827144880538", "date": "2026-08-29T08:24:45.000Z", "summary": "ZHO 转引\"生成AI停服就什么都做不出的人不配称创作者\"之问，自述从手绘、手工模型到全面电子化、3D打印，再到如今AI的成长轨迹，坦言不知答案，但认为依赖AI者占多数，最终或会占据上风。他困惑这些变迁是束缚还是更大的自由。", "type": "tip", "relTime": "15小时前"}, {"id": 12, "title": "国产 GPU 厂商壁仞科技上半年收入 12.36 亿元，同比增长 1997.6%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/995/887.htm", "date": "2026-08-29T03:08:21.000Z", "summary": "壁仞科技发布公告，截至 2026 年 6 月 30 日止六个月收入 12.36 亿元，同比增长 1997.6%；毛利 5.27 亿元，同比增长 2708.5%。报告期内研发开支 8.044 亿元，同比增长 40.7%，亏损大幅收窄至 3.772 亿元，净亏损同比降低 76.4%。壁砺TM系列训练及推理产品销售持续扩大，已在大语言模型推理、智能驾驶、具身智能、多模态等应用领域实现规模化部署。", "type": "industry", "relTime": "21小时前"}, {"id": 13, "title": "FastVideo 开源 FastH3 实现 14 倍加速", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2093527142843957495", "date": "2026-08-29T02:32:21.000Z", "summary": "Sky Computing Lab 开源 FastVideo FastH3 预览版，生成 15 秒视频仅需 13 秒，实现 14 倍加速。盲测中 45% 用户偏好 FastH3 或认为其与 MiniMax H3 持平。该预览版仅用部分数据和算力训练，权重已发布于 HuggingFace。", "type": "model", "relTime": "21小时前"}, {"id": 14, "title": "FastVideo 开源 FastH3 预览版，15 秒生成仅需 13 秒", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2093506470449156193", "date": "2026-08-29T01:10:12.000Z", "summary": "FastVideo 开源预览版 FastH3，15 秒视频生成仅需 13 秒，实现 14 倍加速，45% 用户偏好或认为其与 MiniMax H3 持平。该模型为预览检查点，仅用部分算力和数据训练。引用推文提醒，速度提升需配合质量评估，避免沦为\"随机像素生成器\"。", "type": "model", "relTime": "23小时前"}, {"id": 15, "title": "MiniMax Fast H3 v1 发布：13秒生成15秒768p视频", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2093436440869032168", "date": "2026-08-28T20:31:56.000Z", "summary": "MiniMax 与 Hao AI Lab、NVIDIA FastGen 合作推出开源权重视频加速模型 Fast H3 v1，基于 MiniMax H3，可在 13 秒内生成 15 秒 768p 视频，在 NVIDIA Blackwell GPU 上实现最高 14 倍加速。该模型完全开源，社区可运行并改进加速方案。", "type": "model", "relTime": "1天前"}, {"id": 16, "title": "GLM-5.3 Flash 对比 Claude Opus 4.6 与腾讯 Hy4", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2093421703267536915", "date": "2026-08-28T19:33:22.000Z", "summary": "AI/ML API 用同一提示词测试 GLM-5.3 Flash、Claude 4.6 Opus 与腾讯 Hy4 的图像生成，成本分别为 $0.03、$0.29 和 $0.13。GLM-5.3 Flash 价格仅为 Claude 的 1/9.7，凸显模型路由的价值--\"最佳模型\"正让位于按需选择。", "type": "tip", "relTime": "1天前"}, {"id": 17, "title": "MiniMax FastH3 v1 开源：13秒生成15秒768p视频", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2093391548289540596", "date": "2026-08-28T17:33:33.000Z", "summary": "MiniMax 联合 NVIDIA、FastGen 发布开源模型 FastH3 v1，可在 13 秒内生成 15 秒 768p 视频，在 NVIDIA Blackwell GPU 上实现最高 14 倍加速。模型权重与加速方案完全开源，社区可自行运行和改进。团队表示，开源视频模型时代已开启，后续将分享更多关于后训练如何提升速度与质量的经验。", "type": "model", "relTime": "1天前"}, {"id": 18, "title": "Meta 模型 API 上线 Muse 图像生成", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2093390371875414501", "date": "2026-08-28T17:28:52.000Z", "summary": "1/ Muse 图像已在 Meta 模型 API 上线  $0.01/张--生产级用量中性价比最高的选择之一", "type": "model", "relTime": "1天前"}, {"id": 19, "title": "AI生成媒体成熟，创意繁荣何时到来", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2093362761925284279", "date": "2026-08-28T15:39:09.000Z", "summary": "除了等待经济影响显现，我们现在已经处于这样一个阶段：AI视频、图像和音乐模型已经足够好，成为真正的工具，让更多从未能创作新艺术形式的人得以创作。  在垃圾内容洪流之中，我们还要多久才能看到创意繁荣？它正在发生吗？", "type": "tip", "relTime": "1天前"}, {"id": 20, "title": "Krea 上线 Gemini Omni Flash 1.1", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2093360647459475635", "date": "2026-08-28T15:30:45.000Z", "summary": "Gemini Omni Flash 1.1 现已上线 Krea。  可生成 360p 草稿、放大至 4K、将视频延长至 40 秒，并支持通过视频参考迁移动作。  立即体验👇", "type": "paper", "relTime": "1天前"}, {"id": 21, "title": "Gemini 3.5 等多款新品本周发布", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2093356767992279503", "date": "2026-08-28T15:15:20.000Z", "summary": "Google 本周发布 Gemini 3.5 Transcribe，号称最精准的语音转文字模型；同时推出 Gemini Omni 1.1 Flash，增强视频生成与编辑能力。", "type": "model", "relTime": "1天前"}, {"id": 22, "title": "SpaceXAI 新增多团队 Grok 机器人协作功能", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2093350691205251468", "date": "2026-08-28T14:51:12.000Z", "summary": "SpaceXAI 新增了一段视频，展示如何运行多组 Grok 机器人。  每个项目都有一个频道、一份成员名单和一个 Notion 看板。一个项目经理机器人负责配置 Coder 和 Researcher，开启房间，写入 Notion 行，机器人认领任务。  一个项目，一个频道，一份名单。", "type": "paper", "relTime": "1天前"}, {"id": 23, "title": "Runway 上线 Google Omni 1.1 Flash", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2093344307021545601", "date": "2026-08-28T14:25:49.000Z", "summary": "Google Omni 1.1 Flash 现已登陆 Runway。  最新版本现已推出，与全球顶尖的图像和视频模型一同提供。点击下方链接立即体验。", "type": "model", "relTime": "1天前"}, {"id": 24, "title": "Gemini Omni 1.1 Flash 推出，强化生成视频控制", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2093338200580256172", "date": "2026-08-28T14:01:34.000Z", "summary": "我们正在推出 Gemini Omni 1.1 Flash，让生成式视频高度可控、迭代更快，并更适用于生产级场景。  以下是你可以在 @FlowbyGoogle 中体验它的方式，以及更多信息 → https://goo.gle/4zHEzJ2", "type": "paper", "relTime": "1天前"}, {"id": 25, "title": "MiniCPM-o 4.5 经 TyloQuant MFQ 量化登陆苹果芯片", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2093337998859636738", "date": "2026-08-28T14:00:45.000Z", "summary": "面壁智能 MiniCPM-o 4.5 现可通过 TyloQuant MFQ 量化版在 Apple Silicon 上高效运行，支持本地多模态推理。TyloQuant MFQ 采用神经元感知的混合格式量化，在降低内存占用的同时保留视觉、音频与实时交互能力，并提供多种量化等级及 Metal/CUDA 内核加速。", "type": "product", "relTime": "1天前"}, {"id": 26, "title": "昆仑万维 SkyProduction 接入 Wan 3.0，本周末限时免费", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI1MzE1NDc3Mg%3D%3D&mid=2247510180&idx=1&sn=885e26e1fc6561c07c492ce45cfcfe8b", "date": "2026-08-28T13:05:28.000Z", "summary": "昆仑万维旗下 SkyProduction（天工工作台）正式接入阿里 Wan 3.0 视频生成模型，8月28日-30日面向所有用户限时免费。8月31日起恢复收费，价格低至0.05元/秒，为全网最低价。Wan 3.0支持原生30秒生成、同时参考10张图片/5个视频/5个音频及文档内容，并强化像素级一致性与精准视频编辑能力。", "type": "model", "relTime": "1天前"}, {"id": 27, "title": "Beatport 全面封禁纯 AI 生成音乐", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/beatport-blocks-fully-ai-generated-music-from-its-dj-marketplace", "date": "2026-08-28T11:20:27.000Z", "summary": "DJ 市场 Beatport 开始禁止完全或大部分由 AI 生成的音乐，人类主导、仅使用 AI 辅助的曲目仍可上架但会被标记。平台借助合作伙伴 Beatdapp 的检测工具在上传时过滤 AI 曲目，被拒曲目权利人将收到通知。调查显示 60% 用户不会在演出中播放 AI 音乐，77% 更偏爱人类创作的音乐。", "type": "industry", "relTime": "1天前"}, {"id": 28, "title": "AI 二创视频加速，真相门槛被抬高", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2093295185803309179", "date": "2026-08-28T11:10:38.000Z", "summary": "孙宇晨万字长文发布数小时内，网友已用 AI 生成真人剧情二创视频，将文字热点快速视频化。AI 正冲击影视制作，新闻、八卦、网文等文字内容都可能被迅速转化为视频。但需警惕：任何文字都能在几小时内变成看似真实的真人视频，\"有视频有真相\"将失效，越逼真误导性越强。", "type": "tip", "relTime": "1天前"}, {"id": 29, "title": "万相3.0上线Medeo，支持30秒原生视频生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2093273256115749251", "date": "2026-08-28T09:43:30.000Z", "summary": "阿里云万相（Wan 3.0）正式上线 @Medeo_AI，支持原生30秒视频生成、同步音频，以及多模态 Omni Reference 带来的角色与风格一致性。视频支持1080p电影级画质与真实物理效果。API 已开放，可通过 Model Studio 和 Qwen Cloud 获取。", "type": "model", "relTime": "1天前"}, {"id": 30, "title": "阿里云 Wan 3.0 上线 DeepInfra，视频音频一体", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2093272820453371985", "date": "2026-08-28T09:41:46.000Z", "summary": "阿里云 Wan 3.0 现已上线 DeepInfra，单模型同时支持视频与音频生成，可生成 30 秒 1080P 片段，并支持图像、文件乃至网页等多模态参考，角色一致性得以保持。价格 $0.20/秒，另可通过 Model Studio 与 Qwen Cloud 调用 API。", "type": "model", "relTime": "1天前"}, {"id": 31, "title": "阿里云 Wan3.0 上线 A2E，支持 30 秒视频生成与编辑", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2093271860167450773", "date": "2026-08-28T09:37:57.000Z", "summary": "阿里云 Wan3.0 登陆 A2E 平台，支持从文本或图像生成完整 30 秒视频。用户可编辑时间线、扩展场景、重绘镜头并重塑视觉元素，全程保持角色一致性。API 已通过 Model Studio 和 Qwen Cloud 开放。", "type": "model", "relTime": "1天前"}, {"id": 32, "title": "Midjourney 开始测试 V8.2 编辑模型", "source": "X：Midjourney (@midjourney)", "sourceUrl": "https://x.com/midjourney/status/2093253371650031949", "date": "2026-08-28T08:24:29.000Z", "summary": "我们今天将开始测试首个 V8.2 编辑模型。该模型支持指令编辑、用其他图像生成图像（最多 4 张参考图）、基于笔刷的局部重绘和外绘。它还可与个性化、情绪板和 srefs 配合使用。玩得开心！", "type": "model", "relTime": "1天前"}, {"id": 33, "title": "开源电子书工具 Calibre 9.14 发布：首次引入 AI 生成封面", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/995/569.htm", "date": "2026-08-28T06:12:37.000Z", "summary": "开源电子书管理器 Calibre 推出 9.14 版本更新，首次引入由 AI 驱动的电子书封面图像生成器。用户选中书籍后点击新增的\"AI 生成\"按钮，大模型即可根据书名、简介等文本特征，在几秒钟内渲染出高分辨率艺术封面。该版本还新增书籍编辑器内文件浏览器悬浮预览功能，并升级标签编辑器搜索以忽略声调/变音符号。", "type": "model", "relTime": "1天前"}, {"id": 34, "title": "VGI-Bench：探针视频生成模型视觉智能", "source": "X：AK (@_akhaliq)", "sourceUrl": "https://x.com/_akhaliq/status/2093154284095295685", "date": "2026-08-28T01:50:44.000Z", "summary": "VGI-Bench  探针视频生成模型中的视觉智能  论文：https://huggingface.co/papers/2608.19583", "type": "paper", "relTime": "1天前"}, {"id": 35, "title": "谷歌推出 Gemini Omni 1.1 Flash 视频生成 AI 模型，最高 4K 分辨率", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/995/352.htm", "date": "2026-08-27T23:49:58.000Z", "summary": "谷歌推出 Gemini Omni 1.1 Flash 视频生成 AI 模型，最高可生成 4K 视频。新模型支持场景扩展（每次 10 秒步长，单条最长 40 秒）、指定首尾帧及最长 3 秒视频参考。360p 预览生成速度较标准 720p 最高提升 60%，成本仅为三分之一；价格从 360p 每秒 0.03 美元到 4K 每秒 0.3 美元不等。", "type": "model", "relTime": "2天前"}, {"id": 36, "title": "MiniMax 与 fal 合作推出 H3 Max 视频模型", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2093092333378224185", "date": "2026-08-27T21:44:34.000Z", "summary": "MiniMax 祝贺 fal 团队推出基于其开源模型的后训练视频模型 H3 Max，该模型在质量、提示理解和美学方面排名第一，生成 5 秒 720p 视频仅需不到 3 秒。fal 同时优化了推理系统以实现超实时性能。H3 Max 发布首周享 50% 折扣。", "type": "model", "relTime": "2天前"}, {"id": 37, "title": "H3 Max 实时生成 AI 视频突破时间界限", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2093082102312923351", "date": "2026-08-27T21:03:55.000Z", "summary": "AI 视频的一条线被跨越了。在我仅使用网页界面的实验中，H3 Max 现在生成质量尚可的 AI 视频，所需时间比观看该视频还要短。从我按下\"生成\"按钮那一刻起就是实时的（其中还包括提示词增强）。", "type": "tip", "relTime": "2天前"}, {"id": 38, "title": "诉讼指控 xAI 使用儿童性虐待材料训练 Grok 模型", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/tech-policy/2026/08/elon-musks-xai-used-child-porn-to-train-grok-models-lawsuit-says", "date": "2026-08-27T20:52:31.000Z", "summary": "一项新诉讼指控 xAI 使用儿童性虐待材料（CSAM）训练 Grok 模型，这是首个此类指控。原告 Jane Doe 称其幼年遭虐待所生成的 CSAM 图像及 AI 生成的衍生图像被用于训练 Grok，且 Grok 默认将公开的 X 帖子和自身输出作为训练数据。诉讼要求 xAI 销毁所有 Grok 生成的 CSAM 并阻止模型再生成此类内容。", "type": "industry", "relTime": "2天前"}, {"id": 39, "title": "MiniMax 开源 H3 基础模型，生态后训练登顶", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2093074338413244514", "date": "2026-08-27T20:33:04.000Z", "summary": "MiniMax 祝贺 fal 团队基于其开源 H3 基础模型后训练的 H3 Max 视频模型登顶多项评测。H3 Max 在整体质量、提示词理解和美学上均排名第一，生成 5 秒 720p 视频耗时低于 3 秒，且本周价格五折。MiniMax 强调后训练只是释放基础模型已有能力，并指出 SGLang 训练管线及 Sol-Attention 引擎带来 3.95 倍端到端加速。", "type": "model", "relTime": "2天前"}, {"id": 40, "title": "Gemini Omni 1.1 Flash 发布：新增场景扩展、4K 升级等生成视频控制能力", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://blog.google/innovation-and-ai/technology/developers-tools/build-with-gemini-omni-1-1-flash", "date": "2026-08-27T20:06:03.845Z", "summary": "Google 推出 Gemini Omni 1.1 Flash，通过 Gemini API 在 Google AI Studio 提供面向专业用途的生成视频能力。新功能包括场景扩展（可分析最多 10 秒先前上下文，以 10 秒为增量延长至累计 40 秒）、首尾帧插值、360p 快速草稿（比 720p 快至多 60%、成本为其三分之一）以及最高 4K 分辨率升级。", "type": "product", "relTime": "2天前"}, {"id": 41, "title": "Cohere 发布 Parse 5（parse-v5.0）：2.3B 视觉语言模型，将企业文档转为 Markdown", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/27/cohere-releases-parse-5-parse-v5-0-a-2-3b-vision-language-model-that-turns-enterprise-documents-into-markdown", "date": "2026-08-27T20:05:49.000Z", "summary": "Cohere 发布文档解析模型 Parse（parse-v5.0），基于 North-Micro-Vision-Instruct 架构，拥有 2.3B 参数、8，192-token 上下文窗口和约 4.6GB 体积，可将 PDF、PPT、JPEG 页面直接转为含 HTML 表格和边界框坐标的 Markdown，无需独立 OCR 阶段。", "type": "model", "relTime": "2天前"}, {"id": 42, "title": "43秒AI短片《詹姆兰尼斯特的一生》走红", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2093030402956906693", "date": "2026-08-27T17:38:29.000Z", "summary": "博主@ykszs017 用一周时间制作43秒AI短片《詹姆兰尼斯特的一生》，剧本、分镜、剪辑及原剧台词查找均由AI辅助完成，并使用seedance生成。主推文借角色命运探讨\"做了正确选择却被世界惩罚\"的悲剧主题，称其\"值得被记住\"。", "type": "tip", "relTime": "2天前"}, {"id": 43, "title": "可视化AI机器人工作的小岛", "source": "X：Lauren Tan (@poteto)", "sourceUrl": "https://x.com/poteto/status/2093023531642863686", "date": "2026-08-27T17:11:11.000Z", "summary": "我建了一座小岛，可以可视化我的机器人工作时的状态！看着它们工作然后去睡觉，休息时回到它们的小房子，真是太可爱了🥺  制作这个的提示词在下面！", "type": "tip", "relTime": "2天前"}, {"id": 44, "title": "Google 发布 Gemini Omni 1.1 Flash，视频生成更便宜更灵活", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/googles-gemini-omni-1-1-flash-makes-ai-video-generation-cheaper-and-more-flexible", "date": "2026-08-27T17:01:28.000Z", "summary": "Google 将 Gemini Omni Flash 视频模型升级至 1.1 版本，场景扩展可分析现有视频最多十秒而非仅最后一秒，并以 10 秒为增量延长至 40 秒。", "type": "model", "relTime": "2天前"}, {"id": 45, "title": "DeepMind 副总裁谈 AI 不确定性推理", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2093019627437662680", "date": "2026-08-27T16:55:40.000Z", "summary": "Google DeepMind 研究副总裁 Zoubin Ghahramani 与主持人探讨如何通过教会 AI 系统\"自我怀疑\"和概率思维，实现更安全、可靠的现实世界决策。视频涵盖不确定性作用、正确性与置信度对比、贝叶斯思维在 AI 中的应用，以及未来研究与 AGI 方向。", "type": "tip", "relTime": "2天前"}, {"id": 46, "title": "Gemini Omni 1.1 Flash 发布，支持 4K 视频生成", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2093012163715563624", "date": "2026-08-27T16:26:00.000Z", "summary": "Google 正式发布多模态视频生成与编辑模型 Gemini Omni 1.1 Flash，现已上线 Gemini API 和 Google AI Studio。新模型为开发者提供场景扩展、指定镜头起止帧、视频输入参考等创意控制，并支持将片段放大至 4K、以 360p 快速测试想法。", "type": "model", "relTime": "2天前"}, {"id": 47, "title": "Gemini Omni 1.1 Flash 发布，场景扩展大升级", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2093008998987403303", "date": "2026-08-27T16:13:26.000Z", "summary": "Google 发布多模态视频生成与编辑模型 Gemini Omni 1.1 Flash，支持 4K 超分、首尾帧控制及快速 360p 草稿。最大升级是场景扩展：基于原视频 10 秒上下文进行扩展，远超 Veo 的 1 秒，带来更强一致性与更长叙事。", "type": "model", "relTime": "2天前"}, {"id": 48, "title": "Gemini Omni 1.1 Flash 发布，为开发者提供更强生成式视频控制", "source": "Google DeepMind：Blog（RSS）", "sourceUrl": "https://deepmind.google/blog/gemini-omni-1-1-flash-lets-you-build-with-more-control", "date": "2026-08-27T16:11:32.000Z", "summary": "Google 推出 Gemini Omni 1.1 Flash，为开发者提供更强的生成式视频控制能力。新模型支持场景扩展（可分析最多 10 秒先前上下文，以 10 秒为增量累计延长至 40 秒）、指定首尾帧生成平滑过渡，以及 4K 高清输出。", "type": "model", "relTime": "2天前"}, {"id": 49, "title": "Krea H3 Max 上线，生成速度提升50倍", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2092990757506322661", "date": "2026-08-27T15:00:57.000Z", "summary": "H3 Max 现已在 Krea 上线。  比任何其他高质量视频模型快 50 倍--仅需 5 秒即可生成 15 秒视频。  立即体验 👇", "type": "model", "relTime": "2天前"}, {"id": 50, "title": "Adobe Photoshop 推出\"AI 辅助编辑器\"测试版：基于提示词的全新图像编辑模式", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/995/305.htm", "date": "2026-08-27T14:01:17.000Z", "summary": "Adobe 为 Photoshop 新增\"AI 辅助编辑器\"测试体验，采用基于自然语言提示词的编辑方式，提供简化版界面，支持提示词编辑、移除背景、生成式填充等功能。该模式兼容 FLUX 2 Pro、Gemini 3.1、GPT Image 2 等模型，并新增基于提示词的蒙版编辑与非破坏性图层光线调整工具。AI 辅助编辑器已以测试版形式开放，其余功能即日起陆续提供正式版支持。", "type": "model", "relTime": "2天前"}, {"id": 51, "title": "Microduck 开源机器人趣味实验：追踪激光笔", "source": "X：Thomas Wolf（Hugging Face 联创/CSO） (@Thom_Wolf)", "sourceUrl": "https://x.com/Thom_Wolf/status/2092959363992326236", "date": "2026-08-27T12:56:12.000Z", "summary": "分享一些 Microduck 的有趣实验  基本上，一旦你拥有一个配备如此多传感器的开源机器人，可能性就是无限的  这里我们用 vibe-coding 方式集成了一个图像检测器，用于检测并追踪激光笔。  更多内容见 https://pollen-robotics.com/microduck/", "type": "tip", "relTime": "2天前"}, {"id": 52, "title": "百度智能云公路事件检测一体机：40B交通多模态大模型8秒锁定事故", "source": "公众号：百度智能云（文心）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzA5NTQ5MzE5OQ%3D%3D&mid=2653159882&idx=4&sn=8aaf2c95257f3f6f1ff2ef10d94fc83e", "date": "2026-08-27T12:48:57.000Z", "summary": "百度智能云推出公路事件检测一体机，核心为参数量行业居首的40B交通行业多模态大模型，具备场景理解、多端泛化和轻量蒸馏能力。该产品首创大小模型融合检测方案，由\"视觉一检\"快速扫描、\"多模态二检\"精准研判，并配合蒸馏出的8B、2B及视觉轻量模型。在广东佛开高速实测中，日间事件检测平均准确率超过95%，支持边缘侧一体机、中心侧一体机或算法授权等部署形态。", "type": "model", "relTime": "2天前"}, {"id": 53, "title": "百度智能云全栈适配GLM-5.3-Flash，成业内首批全栈支持云厂商", "source": "公众号：百度智能云（文心）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzA5NTQ5MzE5OQ%3D%3D&mid=2653159882&idx=3&sn=304b4fe8c6543c1b6594aef1fc7da9ad", "date": "2026-08-27T12:48:57.000Z", "summary": "智谱上线并开源原生多模态模型GLM-5.3-Flash（320B-A18B），百度智能云同步完成全栈适配，成为业内首批实现全栈支持的云厂商。该模型在AA综合智能指数中取得57分，与Claude Opus 4.8持平，编程表现亦相当。百度百舸、千帆、秒哒、视频云及Comate均已接入，企业客户与开发者可第一时间体验。", "type": "model", "relTime": "2天前"}, {"id": 54, "title": "Lux3D：3D 生成正从\"提示词\"走向\"API 调用\"", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2092952762980184432", "date": "2026-08-27T12:29:58.000Z", "summary": "Manycore Tech 发布新 3D 生成模型 Lux3D，最快 20 秒生成 3D 资产，支持高质量材质纹理与 Harness Mode 批量创建。Rohan Paul 指出，其 API 可被编码智能体反复调用，从规格说明批量生成 3D 道具并送入 Blender 处理，使 3D 生成成为更大智能体执行循环中的一环，而非简单的\"图生 3D\"工具。", "type": "model", "relTime": "2天前"}, {"id": 55, "title": "网友自制AI葡萄酒管理应用获赞", "source": "X：赵纯想 (@chunxiangai)", "sourceUrl": "https://x.com/chunxiangai/status/2092936759139352925", "date": "2026-08-27T11:26:22.000Z", "summary": "OMG 全体起立  【引用 @sakinotomiura】：我在慢慢做一个自己用的数字化管理酒柜的应用🍷  即使随便拍瓶子的照片，通过图像生成也能整理得很好，还会从原图的标签上获取品种和产地后保存💭", "type": "paper", "relTime": "2天前"}, {"id": 56, "title": "央视曝光 AI 相亲骗局：虚假婚介专骗中老年女性，成都警方抓获 28 人", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/995/129.htm", "date": "2026-08-27T08:51:55.000Z", "summary": "央视新闻曝光针对中老年女性的 AI 相亲骗局，不法分子用 AI 生成相亲对象形象实施诈骗。四川成都警方打掉该团伙，抓获王某等 28 名犯罪嫌疑人，涉案金额超 100 万元，约 50 余名群众受害。央视呼吁平台加强 AI 内容检测与风险分级处置。", "type": "industry", "relTime": "2天前"}, {"id": 57, "title": "火山引擎为具身智能打造数据基建，已与TOP20企业中15家深度合作", "source": "公众号：火山引擎", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI0NzU1NzI5NQ%3D%3D&mid=2247543735&idx=1&sn=52d4fcb6fd22f4226651e24879f19139", "date": "2026-08-27T08:13:49.000Z", "summary": "火山引擎在2026世界机器人大会上发布具身智能解决方案，提供从数据采集、处理、标注、管理、仿真到训练的全链路数据闭环。目前国内估值TOP20的具身智能企业中已有15家与其达成深度合作。方案包括Seedance视频生成用于数据增广、豆包大模型VLM实现90%+准确率的自动化标注，以及多模态AI数据湖底座。", "type": "model", "relTime": "2天前"}, {"id": 58, "title": "微信开源 WeMM-Embedding 的三大落地场景", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2092877358701174993", "date": "2026-08-27T07:30:20.000Z", "summary": "微信开源的多模态模型 WeMM-Embedding 可低成本重做混合搜索，2B 版本跑分超越上一代 8B 开源顶流，256 维截断仍保住近 99% 性能。作者列举三大场景：智能相册与知识库语义搜索、为 Agent 装上视觉长记忆、视频与电商内容低成本打标推荐，均可用一张消费级显卡运行。", "type": "tip", "relTime": "2天前"}, {"id": 59, "title": "滴滴充电智能网络覆盖全国 290 多座城市超 7.4 万座充电站，展示 1600kW 液冷超充桩", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/995/004.htm", "date": "2026-08-27T07:10:54.000Z", "summary": "滴滴在第十八届国际交通技术与设备展览会上展示新一代 Robotaxi R2，该车型由滴滴自动驾驶与广汽埃安联合打造，搭载 33 个传感器融合的硬件平台及行业首个量产三域融合中央计算大脑，GPU 算力超 2000TOPS。截至 2026 年 6 月 30 日，滴滴充电智能网络已覆盖全国 290 多座城市，连接超 7.4 万座充电站，并展出输出功率最高 1600kW 的液冷超充桩。", "type": "paper", "relTime": "2天前"}, {"id": 60, "title": "2026 美团低空经济与具身智能挑战赛报名倒计时，总奖金 55 万元", "source": "公众号：龙猫LongCat（美团）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MjM5NjQ5MTI5OA%3D%3D&mid=2651783211&idx=3&sn=61a0e88c38f88d9b529882611b696d3f", "date": "2026-08-27T02:24:00.000Z", "summary": "2026 年第四届美团低空经济与具身智能挑战赛启动报名，面向全球高校在校学生，总奖金池达 55 万元。赛事以无人机换电任务为原型，考察机器人在视觉识别、运动规划、精准操作等方面的综合能力，分初赛与线下硬件决赛，报名时间为 7 月 22 日至 9 月 1 日。表现优异者可获美团无人机实习机会及\"北斗计划\"直通面试权。", "type": "industry", "relTime": "2天前"}, {"id": 61, "title": "Qwen Live EP2：多模态智能体如何落地", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092792959502606657", "date": "2026-08-27T01:54:58.000Z", "summary": "Qwen Live EP2 精华，两分钟看完。多模态 AI 要投入实际工作，需要具备哪些条件？Qwen 与 Qwen Cloud 团队畅谈能看、能听、能行动的智能体--以及这一切将走向何方。  观看 Qwen Live EP2 完整视频：https://www.youtube.com/watch?v=kyaVsNCfdxw", "type": "tip", "relTime": "2天前"}, {"id": 62, "title": "EditaLive：面向直播场景的统一角色视频编辑框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.27123", "date": "2026-08-27T00:00:00.000Z", "summary": "EditaLive 提出面向实时直播的角色视频编辑框架，基于预训练图像动画模型 Wan-Animate 和 CharEdit-50K 数据集实现指令驱动编辑。该框架将模型从离线双向生成改造为因果流式生成，并通过对齐自回放蒸馏压缩为两步采样器，在保持面部表情一致性的同时实现低延迟实时推理，编辑性能达到当前最优。", "type": "paper", "relTime": "3天前"}, {"id": 63, "title": "多镜头长视频编辑新框架 MMLVE-Agent：用智能体推理实现一致编辑", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.26809", "date": "2026-08-27T00:00:00.000Z", "summary": "研究团队提出多指令多镜头长视频编辑（MMLVE）任务，并构建智能体编辑框架 MMLVE-Agent，结合大语言模型与视觉语言模型实现镜头级视频解耦和指令解析。配套发布评测数据集 MMLVE-Bench 及三项专用指标。实验显示，MMLVE-Agent 优于 Seedance 2.0 等闭源 SOTA 方法，消除编辑幻觉并保持跨镜头一致性与时空连贯性。", "type": "paper", "relTime": "3天前"}, {"id": 64, "title": "UrbanGround：在真实尺度城市中从局部感知到空间智能体的测试沙箱", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.27456", "date": "2026-08-27T00:00:00.000Z", "summary": "UrbanGround 提出首个基于香港全域 3D 地理空间数据构建的物理约束城市沙箱，用于测试多模态大语言模型（MLLM）智能体能否将局部街景感知转化为可靠的城市行动。该沙箱支持第一人称视角闭环交互与交互式导航地图。研究发现，当代 MLLM 智能体在视觉识别和短程空间推理上表现可用，但方向感与行人感知仍不可靠，长程探索中局部能力难以组合为持续目标导向行为。", "type": "paper", "relTime": "3天前"}, {"id": 65, "title": "PAWBench：视频生成模型距离概率对齐的世界建模还有多远？", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.27345", "date": "2026-08-27T00:00:00.000Z", "summary": "现有视频生成模型评测多关注单条视频的合理性，未检验重复生成能否恢复正确的行为分布。为此，研究者将概率对齐形式化为世界模型的分布级标准，推出基准 PAWBench 与评估协议 PAWEval，把多次视频生成转化为物理行为的经验分布。在 50 个场景和 11 个当前系统中，没有任何模型能同时匹配参考概率并覆盖有效行为范围。", "type": "paper", "relTime": "3天前"}, {"id": 66, "title": "Aphanta：面向多模态推理的图像编辑中间结果诊断框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.26993", "date": "2026-08-27T00:00:00.000Z", "summary": "Aphanta 提出自动化任务发现与闭环诊断框架，评估\"多模态大模型→图像编辑器→多模态大模型\"流程中图像编辑器的实际效用。在 20 个候选任务中，效用高度依赖任务类型，增益集中在视觉线索注入、接地与反事实状态实现。在正向任务子集上，整合的 Qwen 流程将平均任务分数从 0.343 提升至 0.445（+10.2 分，相对提升 29.7%）。", "type": "paper", "relTime": "3天前"}, {"id": 67, "title": "Magpie：面向交互游戏的实时生成式世界渲染系统", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.27168", "date": "2026-08-27T00:00:00.000Z", "summary": "Magpie 提出一种面向交互游戏的实时生成式世界渲染系统，将游戏逻辑执行与视觉生成分离：游戏引擎负责解析玩家动作并维护世界状态，独立的渲染服务器基于引擎生成的白盒帧产出视觉输出。该系统为生成模型应用于实时游戏渲染提供了系统级实现路径，在保留玩法可设计性与可复现性的同时，降低早期游戏原型对完整视觉资产的依赖。", "type": "paper", "relTime": "3天前"}, {"id": 68, "title": "智谱发布GLM-5.3-Flash，匿名模型OX Alpha正式亮相", "source": "公众号：数字生命卡兹克", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647685603&idx=1&sn=91bbef667086bed84b6f213be79733aa", "date": "2026-08-26T22:19:23.000Z", "summary": "智谱正式发布GLM-5.3-Flash，即此前在OpenRouter和OpenCode上爆火的匿名模型OX Alpha。该模型为总参数320B、激活18B的MoE架构，是GLM-5系列首个原生多模态模型，支持图像、视频和文本输入，原生上下文100万。", "type": "model", "relTime": "3天前"}, {"id": 69, "title": "通义千问 Qwen3.8 Flash 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2092733868319428800", "date": "2026-08-26T22:00:09.000Z", "summary": "来自 @Alibaba_Qwen 的 Qwen3.8 Flash 现已上线 OpenRouter。  这是一款多模态推理模型，适用于编程助手、智能体工作流、视觉理解、代码库与文档分析、桌面交互、图表及长视频处理。  https://openrouter.ai/qwen/qwen3.8-flash", "type": "model", "relTime": "3天前"}, {"id": 70, "title": "Z.ai 发布 GLM-5.3-Flash：320B-A18B 原生多模态 MoE，支持 100 万 token 上下文", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/26/z-ai-releases-glm-5-3-flash-a-320b-a18b-natively-multimodal-moe-with-a-1m-token-context", "date": "2026-08-26T21:33:23.000Z", "summary": "Z.ai 发布 GLM-5.3-Flash，这是 GLM-5 系列首款原生多模态模型，320B 总参数、18B 激活参数，支持 100 万 token 上下文和图像/视频输入，权重以 MIT 许可开源在 Hugging Face。", "type": "model", "relTime": "3天前"}, {"id": 71, "title": "MiniMax H3 亮相 RaySummit 大会", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2092722804693327873", "date": "2026-08-26T21:16:12.000Z", "summary": "MiniMax H3 今天在旧金山参加 @anyscalecompute 的 #RaySummit 大会。  @VictorSuOrtiz 将在 @vllm_project 会议上解析我们的 33B 开源音视频模型，将文本、图像、视频和音频整合到一个上下文中。  @VoidAsuka 将分享开发者如何与 @digitalocean、@nvidia、@inferact 和 @NousResea...", "type": "industry", "relTime": "3天前"}, {"id": 72, "title": "V-RAE 将视觉基础模型表征用于视频生成", "source": "X：谢赛宁 (@sainingxie)", "sourceUrl": "https://x.com/sainingxie/status/2092720774268301417", "date": "2026-08-26T21:08:08.000Z", "summary": "谢赛宁转发介绍 V-RAE，该模型直接采用冻结视觉基础模型（DINOv3、SigLIP2、EUPE、V-JEPA 2.1）的表征作为视频生成潜空间，而非传统 VAE 潜空间。在匹配设置下，V-RAE 在 Kinetics-600 上达 2.13 rFVD，UCF101 上 117.86 gFVD，收敛速度比 VAE 潜空间快 6 倍，并引入 tFVD 评估时序平滑度。", "type": "paper", "relTime": "3天前"}, {"id": 73, "title": "MiniMax H3 Max登顶图生视频榜", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2092717615739494424", "date": "2026-08-26T20:55:35.000Z", "summary": "MiniMax H3 Max（fal 后训练版）在 Artificial Analysis 视频榜登顶图生视频（含音频）第 1、文生视频第 3，均超越基础版 H3。该模型由 fal 构建并托管，生成 5-15 秒带原生音频的 768p 视频，定价 $0.04/秒。fal 计划开源权重，若实现将成为两榜最高排名开源模型。", "type": "model", "relTime": "3天前"}, {"id": 74, "title": "Perceptron 开源具身基础模型 Isaac 0.5，将遥操作需求降低 210 倍", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2092692716534759589", "date": "2026-08-26T19:16:38.000Z", "summary": "Perceptron 发布开源具身基础模型 Isaac 0.5，这是一个 36B 参数动态 MoE 模型，通过扩展无动作视频将遥操作需求降低 210 倍。该模型可输入摄像头图像/视频、人类指令和机器人当前状态，输出物体位置、任务进度或下一步动作，既能微调后直接控制机械臂，也可仅用于感知。", "type": "model", "relTime": "3天前"}, {"id": 75, "title": "Meta 图像模型 Muse 登陆 Runway", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2092670079070822579", "date": "2026-08-26T17:46:41.000Z", "summary": "Meta 的 Muse 图像模型，现已上线 Runway。  今日起，与全球顶尖的图像和视频模型一同提供。点击下方链接，立即体验。", "type": "model", "relTime": "3天前"}, {"id": 76, "title": "GLM-5.3-Flash 发布，支持 1M 上下文与 MIT 许可", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2092667990273663311", "date": "2026-08-26T17:38:23.000Z", "summary": "智谱发布 GLM-5.3-Flash，320B-A18B 参数、原生多模态、1M-token 上下文窗口，MIT 许可开源，此前预览名为 Ox Alpha，完全运行于国产 AI 芯片。DAIR.AI 创始人推荐用 /eli5 制作视觉解释器，并可在其新 agent 游乐场搭配 Pi 或 Hermes Agent 试用。模型权重与 API 已在官方平台开放。", "type": "model", "relTime": "3天前"}, {"id": 77, "title": "MiniMax-H3 在 8×H200 上基准测试：无损加速 1.95×，最高 6.24×（SSIM 0.76-0.91）", "source": "LMSYS：Blog（Chatbot Arena 团队）", "sourceUrl": "https://www.lmsys.org/blog/2026-08-27-minimax-h3-h200", "date": "2026-08-26T16:00:00.000Z", "summary": "SGLang Diffusion 团队在 8×NVIDIA H200 上对 MiniMax-H3 视频生成进行基准测试，其密集无损路径较 Diffusers 快 1.85-1.95×，无近似损失。", "type": "paper", "relTime": "3天前"}, {"id": 78, "title": "微信开源多模态嵌入模型 WeMM-Embedding", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2092636087147491496", "date": "2026-08-26T15:31:37.000Z", "summary": "微信开源其多模态嵌入模型 WeMM-Embedding，9B 版本在 MMEB-v2 和 MMEB-v3 双榜登顶。2B 小版本跑分超越上一代 8B 开源顶流，靠几亿级数据对齐与细粒度蒸馏实现。该模型已部署于视频号、公众号、朋友圈和电商搜索推荐，支持文字、多图、长视频混合输入，维度截断至 256 维仍保留近 99% 性能，可大幅降低向量数据库存储与检索成本。", "type": "model", "relTime": "3天前"}, {"id": 79, "title": "前 Meta 科学家创办的 Perceptron 推出工业视觉模型 Isaac 0.5", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/26/ex-meta-scientists-want-to-bring-visual-ai-to-the-factory-floor", "date": "2026-08-26T15:00:00.000Z", "summary": "由两位前 Meta FAIR 研究员创立的 Perceptron 推出视觉模型 Isaac 0.5，帮助机器在仓库、工厂等工业环境中感知、推理并行动，支持视觉引导机器人导航及提取视频信息。该模型以开放权重发布，训练数据含百万小时通用视频与 ego video。公司近期完成 2100 万美元融资。", "type": "model", "relTime": "3天前"}, {"id": 80, "title": "智谱匿名模型Ox Alpha今晚开源，屠榜OpenRouter", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2092624381310603432", "date": "2026-08-26T14:45:06.000Z", "summary": "在 OpenRouter 上匿名屠榜、调用量超 DeepSeek 一倍的 Ox Alpha 被证实为智谱出品，官方确认今晚开源权重。该模型以 Flash 级速度和成本实现前沿实战能力，支持 1M 上下文与图片视频多模态，推理优先架构，社区测试在 10 个高难度 Coding 任务中拿下 80% 过关率，全量 DeepSWE 跑出 64.6%。", "type": "model", "relTime": "3天前"}, {"id": 81, "title": "C2PA相机经不起现实的考验：Android端可被root攻击伪造签名", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.da.vidbuchanan.co.uk/blog/android-c2pa.html", "date": "2026-08-26T14:05:27.506Z", "summary": "安全研究员David Buchanan指出，C2PA相机认证在Android平台上可被攻破。通过root权限提升漏洞（如CVE-2026-43499），攻击者可利用StrongBox硬件签名任意数据，伪造C2PA签名图像和视频，且无需硬件攻击。该问题无法通过常规补丁修复，已提前90天向相关方报告。", "type": "paper", "relTime": "3天前"}, {"id": 82, "title": "阿里云 Wan3.0 登顶六大动画评测", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092610663923568726", "date": "2026-08-26T13:50:35.000Z", "summary": "阿里云 Wan3.0 在六大动画类别评测中均排名第一，同时在写实视频生成方面表现优异。KoyalAI CEO Mehul Agarwal 从专业电影制作视角对其进行了测试，Wan3.0 现已上线 KoyalAI 平台，并提供 Model Studio 和 Qwen Cloud 的 API 访问。", "type": "model", "relTime": "3天前"}, {"id": 83, "title": "机器人\"大脑\"初创公司正走出自己的 GPT-2 时代", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/26/robot-brain-builders-are-pushing-out-of-their-gpt-2-era", "date": "2026-08-26T13:30:00.000Z", "summary": "物理 AI 领域正经历投资热潮与数据危机并存的阶段，开发者试图借鉴前沿 AI 实验室经验，通过更多数据、算力与强化学习场景推动模型进步。Antioch 创始人认为该领域仍处于\"GPT-2 时代\"，而自动驾驶公司正凭借数据优势切入人形机器人赛道。业内对垂直聚焦与通用路线存在分歧，但普遍认为高质量训练数据是当前最大瓶颈。", "type": "tip", "relTime": "3天前"}, {"id": 84, "title": "亲俄深度伪造视频让乌克兰议员\"开口\"求和", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/pro-kremlin-deepfakes-put-surrender-rhetoric-in-the-mouths-of-ukrainian-lawmakers", "date": "2026-08-26T12:36:24.000Z", "summary": "亲克里姆林宫的Telegram频道正传播两段AI生成的深度伪造视频，内容为乌克兰议员安德烈·列乌斯和伊万·尤纳科夫\"哀叹战争并呼吁和平\"。据NewsGuard报道，视频两周内获得13万次观看，并带有不自然眨眼、声音平淡等AI痕迹。此类伪造无论是否被识破，都会侵蚀公众对信息的信任。", "type": "industry", "relTime": "3天前"}, {"id": 85, "title": "NVIDIA Jetson Orin Nano 2 发布，将物理 AI 带入无人机与机器人", "source": "Artificial Intelligence News（RSS）", "sourceUrl": "https://www.artificialintelligence-news.com/news/nvidia-jetson-orin-nano-2-physical-ai-to-drones-and-robots", "date": "2026-08-26T09:08:11.000Z", "summary": "NVIDIA 发布 Jetson Orin Nano 2，一款面向无人机、机器人和视觉系统的边缘机器人计算机。该开发板定位入门级，让开发者无需数据中心即可在设备上直接运行生成式 AI 模型。", "type": "model", "relTime": "3天前"}, {"id": 86, "title": "研究发现婴儿语言学习能力远胜 AI 聊天机器人，学习效率也大幅领先", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/994/612.htm", "date": "2026-08-26T08:29:50.000Z", "summary": "婴儿学习语言的能力和效率远胜今天的 AI 聊天机器人。斯坦福大学认知科学家迈克尔·C·弗兰克指出，幼儿接触约 1000 万至 3000 万个词后就能说出清晰句子，而用同样数据量训练 GPT-2 只会得到胡言乱语生成器。这种效率差距已成为 AI 行业难题，许多专家认为单纯扩大模型规模无法实现人类水平 AI。", "type": "tip", "relTime": "3天前"}, {"id": 87, "title": "阿里云 Wan3.0 上线 OpenArt，支持更长视频生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092514779256746129", "date": "2026-08-26T07:29:35.000Z", "summary": "阿里云 Wan3.0 现已在 OpenArt 平台上线，用户可通过 Model Studio 和 Qwen Cloud 获取 API 访问。该版本支持生成更长视频，创作者 @NOSNOWISXVW 展示了从灵感构思到成片的端到端工作流，称长视频生成让叙事节奏更可控。", "type": "model", "relTime": "3天前"}, {"id": 88, "title": "Qwen3.8-27B 在 Token Harbor 免费开放", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092494691866665194", "date": "2026-08-26T06:09:45.000Z", "summary": "Qwen3.8-27B 现已在 Token Harbor 免费开放。#BuildWithQwen  27B 参数。多模态。约 1M 上下文。现在免费。👀  专为编程、研究和长周期智能体打造--原生支持文本、图像与视频理解，并支持可配置思考。  无需积分。直接选择免费模型即可开始构建。⚡  → http://tokenharbor.ai #Qwen #TokenHarbor #AI", "type": "model", "relTime": "3天前"}, {"id": 89, "title": "阿里云Wan3.0上线营销视频生成功能", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092491465112908180", "date": "2026-08-26T05:56:56.000Z", "summary": "Wan3.0 用于产品营销  给 Wan3.0 一份 PPT、PDF、图片或 URL，即可获得一支电影感的 30 秒产品短片，原生 1080P，对白与音效同步生成，无需拍摄。  现已全面可用，立即开始创作。· 阿里云百炼：https://click.alibabacloud.com/m/20000002017/ · 通义云：https://click.qwencloud.com/m/2000...", "type": "product", "relTime": "3天前"}, {"id": 90, "title": "阿里云 Wan 3.0 上线 ArtArch，支持 30 秒生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092450541297389666", "date": "2026-08-26T03:14:19.000Z", "summary": "阿里云 Wan 3.0 现已上线 ArtArch，支持最长 30 秒的视频生成，主打真实感渲染、电影级动态与更强的场景一致性。用户可通过 Model Studio 和 Qwen Cloud 获取 API 接入。8 月 25 日至 9 月 7 日期间，每位用户可免费生成 100 次，且不限时长。", "type": "model", "relTime": "3天前"}, {"id": 91, "title": "阿里云 Wan 3.0 上线 Flaq AI，主打电影级视频生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092441455365325035", "date": "2026-08-26T02:38:13.000Z", "summary": "阿里云 Wan 3.0 现已在 @aiflaq 上线，专为电影级视觉与高质量视频生成打造。用户可通过 Model Studio 和 Qwen Cloud 获取 API 访问。Flaq AI 称其\"自行车价格、法拉利性能\"，并用同一提示词对比 Seedance 2.5 后评价\"绝对电影级完美\"。", "type": "model", "relTime": "3天前"}, {"id": 92, "title": "阿里云 Wan 3.0 上线 OiiOii AI", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092440797023236520", "date": "2026-08-26T02:35:36.000Z", "summary": "阿里云 Wan 3.0 现已上线 OiiOii AI，支持更长视频生成、更强一致性和多参考输入，确保角色、场景与细节在快速动作中保持连贯流畅。API 可通过 Model Studio 和 Qwen Cloud 获取。", "type": "model", "relTime": "3天前"}, {"id": 93, "title": "创作思维滞后如何扼杀AI时代创造力", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2092428692064817268", "date": "2026-08-26T01:47:30.000Z", "summary": "ZHO指出，落后的创作思维、理论和范式已无法适应技术新步伐，反而扼杀了创造力与形成自我视觉语言的可能性。他认为当下AI制作创作与街头摄影同理，但AI带来的革命性影响远不止于此，并附视频链接展开论述。", "type": "tip", "relTime": "3天前"}, {"id": 94, "title": "机器人初创公司 Generalist 估值达 30 亿美元", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/25/robotics-startup-generalist-reaches-3b-valuation-sources-say", "date": "2026-08-26T00:40:59.000Z", "summary": "机器人初创公司 Generalist 在完成由 8VC 领投的新一轮融资后估值达 30 亿美元，新资金近 2 亿美元，使该轮融资总额升至 6 亿美元。该公司由前 Google DeepMind 和 Boston Dynamics 研究人员于 2024 年创立，其新发布的 Gen 1.5 模型可让机器人通过 3 至 12 秒的视频演示掌握新任务。", "type": "industry", "relTime": "3天前"}, {"id": 95, "title": "Luce：面向3D资产生成的可重光照高斯表示", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/relightable-gaussians-3d-generation", "date": "2026-08-26T00:00:00.000Z", "summary": "Luce是一种将几何与PBR材质统一在体素化多模态高斯云中的3D表示，为每种模态使用专用高斯原语，支持重光照并集成到标准渲染管线。变分自编码器将该表示压缩为统一的材质感知潜空间，实现高保真图像到3D生成。", "type": "paper", "relTime": "4天前"}, {"id": 96, "title": "Video-IFBench：评估多模态大模型在视频理解场景中的指令跟随能力", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.25529", "date": "2026-08-26T00:00:00.000Z", "summary": "研究团队推出 Video-IFBench，一个专门评估多模态大模型在视频理解中指令跟随能力的基准。该基准包含四种指令模板、32 种任务类型和 39 类约束，并通过半自动流程构建了 1.5K 样本。对 20 多个近期 MLLM 的大规模评测显示，视频指令跟随对现有模型仍具挑战性，尤其在多约束、语义约束和复杂条件结构场景下。", "type": "paper", "relTime": "4天前"}, {"id": 97, "title": "V-Rubrics：基于评分标准的强化学习提升视觉忠实度", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.25580", "date": "2026-08-26T00:00:00.000Z", "summary": "视觉语言模型常生成与图像证据不符的流畅回答，V-Rubrics 将参考回答分解为原子命题，按视觉忠实度、推理一致性和指令遵循三维度评分，提供结构化部分奖励。研究基于 Qwen3-VL-8B-Instruct 微调，构建 50，248 条训练集，实验显示基于评分标准的 GRPO 优于共享 SFT 基线和仅答案 GRPO，在知识导向和视觉推理基准上提升最大。", "type": "paper", "relTime": "4天前"}, {"id": 98, "title": "StreamPI：为视觉-语言-动作模型引入流式多模态时序建模", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.26067", "date": "2026-08-26T00:00:00.000Z", "summary": "StreamPI 提出一种流式多模态时序建模框架，在不增加任何参数的前提下，为 pi0.5 等单帧 VLA 模型赋予时序推理能力。其核心设计包括指令锚定时序建模与随机间隔流式训练策略，支持单帧与多帧推理，并提升异步部署的鲁棒性。在真实机器人任务与 LIBERO 仿真基准上，StreamPI 均优于 pi0.5。", "type": "paper", "relTime": "4天前"}, {"id": 99, "title": "Code World Model：编码智能体作为世界大脑", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.25927", "date": "2026-08-26T00:00:00.000Z", "summary": "Code World Model 框架将世界演化与视觉呈现分离，由编码智能体生成可执行代码维护持久世界状态并执行规则一致的演化。该框架引入代理表示编码帧级时空约束并编译为代理视频，条件化视频模型渲染高保真视觉观察。微调后的 MiniMax-H3 能遵循编码智能体构建的交互世界中的代理时空规范，同时保留丰富视觉细节。", "type": "paper", "relTime": "4天前"}, {"id": 100, "title": "VBVR-Pro：可扩展且可验证的原生视觉推理套件", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.26105", "date": "2026-08-26T00:00:00.000Z", "summary": "VBVR-Pro 是一个闭环测试平台，通过将视觉生成作为推理媒介，使原生视觉推理可训练、可验证、可优化。它提供 300 个程序化生成任务，训练后的模型在 RISE-Video、MME-CoF-Pro、BabyVision 等七个外部基准上表现强劲；其基于确定性规则的可验证奖励评分器优于主流 VLM-as-a-judge 范式，并支持大规模多任务强化学习。", "type": "paper", "relTime": "4天前"}, {"id": 101, "title": "Procedura：用程序化控制实现智能体3D建模", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.26238", "date": "2026-08-26T00:00:00.000Z", "summary": "Procedura 是一个新型3D建模智能体框架，将对象编写为程序化装配体--一种参数化程序，其命名部件通过类型化、机器可检查的配合关系连接。该智能体从文本提示出发，将对象规划为装配图并逐部分编写程序，通过编译、配合和连通性检查后才接受部件，并由视觉批评器逐项诊断修复。", "type": "paper", "relTime": "4天前"}, {"id": 102, "title": "智能体游戏开发作为可验证轨迹数据引擎，用于扩展世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.25518", "date": "2026-08-26T00:00:00.000Z", "summary": "论文提出扩展世界模型不应仅依赖更多爬取视频和算力，而需递归数据引擎提供 grounded 奖励信号。游戏开发可提供缺失的奖励环境：游戏引擎能高效检查碰撞、物理、可导航性和有界可玩性，并生成真实长程轨迹数据。据此提出 RLHEV（Reinforcement Learning with Human-Engine Verification）后训练范式，结合密集引擎信号与开发过程中隐含的人类接受反馈。", "type": "paper", "relTime": "4天前"}, {"id": 103, "title": "Zero-WAM：利用人类视频实现开放任务泛化的上下文世界-动作建模", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.26103", "date": "2026-08-26T00:00:00.000Z", "summary": "Zero-WAM是一种因果视频-动作模型，通过上下文人类视频引导执行训练中未见过的操作任务，将大语言模型的上下文学习范式引入机器人操作。在RoboTwin 2.0模拟的七个未见任务上，Zero-WAM平均成功率达47.0%，较最强视频-动作基线绝对提升29.5个百分点；真实世界评估中可泛化至多物体场景、长时程操作和精细插入任务。", "type": "paper", "relTime": "4天前"}, {"id": 104, "title": "Stability AI 获 7600 万美元 B 轮融资，环球音乐、索尼音乐、EA 参投", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/25/stability-ai-maker-of-image-generator-stable-diffusion-raises-76-million-in-fresh-funding", "date": "2026-08-25T19:03:47.000Z", "summary": "Stability AI 完成 7600 万美元 B 轮融资，累计融资总额达 2.32 亿美元。本轮投资方包括环球音乐集团、索尼音乐集团、华纳音乐集团和游戏巨头 EA，以及 AMD Ventures 和 Pacific Alliance Ventures。公司计划将资金用于扩展\"创意制作\"产品套件和专业服务部门。", "type": "industry", "relTime": "4天前"}, {"id": 105, "title": "多模态 RAG 在幻灯片中的应用：基于 GPT-4V 的构建与评估", "source": "LangChain：Blog（RSS）", "sourceUrl": "https://www.langchain.com/blog/multi-modal-rag-template", "date": "2026-08-25T18:51:52.000Z", "summary": "使用 GPT-4V 为幻灯片构建多模态 RAG 应用，支持视觉问答。文章对比了不同实现方法，并通过基准测试进行评估，最后提供 LangChain 模板用于部署。", "type": "tip", "relTime": "4天前"}, {"id": 106, "title": "LangChain 多向量检索器：面向表格、文本与图像的 RAG 实现指南", "source": "LangChain：Blog（RSS）", "sourceUrl": "https://www.langchain.com/blog/semi-structured-multi-modal-rag", "date": "2026-08-25T18:26:11.000Z", "summary": "LangChain 推出多向量检索器，支持在表格、文本和图像上实现 RAG。文章提供半结构化与多模态数据检索的 cookbook 示例，帮助开发者构建跨多种数据类型的检索增强生成流程。", "type": "tip", "relTime": "4天前"}, {"id": 107, "title": "Skild S1 机器人基础模型：视频即提示词", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2092312459382235407", "date": "2026-08-25T18:05:38.000Z", "summary": "Skild 发布机器人基础模型 S1，用视频演示替代语言指令来定义任务。只需提供 1 段人类视频，S1 即可直接执行长达 10 分钟的多步骤新任务，无需重新训练或微调。若规模化，基础模型训练的高昂数据成本可摊薄至数千个新任务，有望改变机器人学习的经济性。", "type": "model", "relTime": "4天前"}, {"id": 108, "title": "Runway AI 峰会九月旧金山召开", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2092310365279514644", "date": "2026-08-25T17:57:18.000Z", "summary": "更多演讲者将加入 Runway AI 峰会。今年九月在旧金山，来自机器人、自动驾驶、营销和基础设施领域的行业领袖将齐聚一堂，用一天时间探讨 AI 如何重塑智能与世界的交汇方式。  点击下方链接了解更多并注册。", "type": "industry", "relTime": "4天前"}, {"id": 109, "title": "Krea 上线 Wan 3.0，支持 20 参考图与 30 秒带音频生成", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2092303502651564260", "date": "2026-08-25T17:30:02.000Z", "summary": "Wan 3.0 现已登陆 Krea。  支持 20 张参考图像，以及 30 秒带音频的生成，成本仅为同类质量模型的零头。  立即体验 👇", "type": "model", "relTime": "4天前"}, {"id": 110, "title": "Meta AI 推出 MetaRoCE：面向 AI 规模以太网的全新 RDMA 传输协议", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/25/meta-ai-introduces-metaroce-a-clean-sheet-rdma-transport-built-for-ai-scale-ethernet", "date": "2026-08-25T17:25:36.000Z", "summary": "Meta 发布 MetaRoCE，一种为 AI 工作负载设计的全新 RDMA 传输协议，将网络视为有损链路，把排序、路径选择与恢复下沉到网卡，仅需交换机支持 ECN 与 ECMP。在 64 节点 AMD GPU 集群运行 RCCL 集合通信时，1% 丢包率下仍保持约 86% 吞吐量。Meta 将通过 Open Compute Project（OCP）发布规范、合规测试套件及参考软件实现。", "type": "paper", "relTime": "4天前"}, {"id": 111, "title": "MAI-Image-2.6登顶图像编辑榜", "source": "X：Mustafa Suleyman（Microsoft AI CEO） (@mustafasuleyman)", "sourceUrl": "https://x.com/mustafasuleyman/status/2092287421983441278", "date": "2026-08-25T16:26:08.000Z", "summary": "Microsoft AI 发布 MAI-Image-2.6-Preview，在 Artificial Analysis 图像编辑排行榜登顶第一，文本生成图像位列第二（仅次于 OpenAI 的 GPT Image 2）。该模型在 19 个分类榜单中拿下 5 个第一，现已在 MAI Playground 和 Microsoft Foundry 私有预览中提供。", "type": "model", "relTime": "4天前"}, {"id": 112, "title": "HN 头条有多少是 AI 内容？作者两次抽样调查给出答案", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://blog.coredump.cx/p/how-much-of-hn-is-ai", "date": "2026-08-25T16:21:34.454Z", "summary": "一位博主对 Hacker News 头条的 AI 内容占比做了两次抽样调查：2026 年 2 月，每日 Top 5 中多数日子有 4-5 条与 AI 相关；6 月更新数据显示，AI 相关或 AI 生成内容约占每日头条的 50%-60%，高于 2 月的 40%。作者还借助 AI 文本检测工具 Pangram 识别疑似 AI 撰写的文章，并人工复核了标记结果。", "type": "tip", "relTime": "4天前"}, {"id": 113, "title": "AI检测器是知识垄断的守门工具", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2092274760151609783", "date": "2026-08-25T15:35:50.000Z", "summary": "Rohan Paul 引用 Brian Roemmele 观点：AI 检测器被卖给大学体系，以保护其对知识生产的垄断。AI 让任何人都能生成合格文本，该系统便用\"AI 垃圾\"标签污名化非官方渠道产出，打压独立研究者和学生。Pantagram 等公司靠出售此服务并炫耀精英履历牟利。", "type": "tip", "relTime": "4天前"}, {"id": 114, "title": "Gamma 收购 Accel 投资的 AI 设计初创公司 Lica", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/25/gamma-acquires-accel-backed-design-startup-lica", "date": "2026-08-25T15:00:00.000Z", "summary": "演示文稿初创公司 Gamma 收购了 Accel 支持的设计初创公司 Lica，以建立自己的设计研究实验室，Lica 联合创始人将负责领导该部门。Lica 成立于 2023 年，曾获 Accel、South Park Commons 等投资的 400 万美元，专注于为电商网站制作符合品牌准则的营销视频。Gamma 表示希望借助新部门探索多模态演示文稿等不同沟通形式，但未透露具体产品计划。", "type": "industry", "relTime": "4天前"}, {"id": 115, "title": "商汤 SenseNova U1.5 Lite 开源并上线 Token 计划", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2092258195536540124", "date": "2026-08-25T14:30:00.000Z", "summary": "商汤 SenseNova U1.5 Lite 已开源并上线 Token 计划，提供免费公开测试版，每 5 小时可享 1，500 次请求。该模型支持图像生成与编辑一体化，具备参考图驱动创作、复杂指令跟随、原生 2K/4K 输出及自动提示词优化等能力。", "type": "model", "relTime": "4天前"}, {"id": 116, "title": "阿里云AI Spotlight回归，Wan3.0视频生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092235551416176966", "date": "2026-08-25T13:00:01.000Z", "summary": "AI Spotlight 携 Wan3.0 回归  Wan3.0 帮你将现有素材转化为可塑、可打磨、可激活的视频。创作视频不再意味着从零开始。  即刻体验：Qwen Cloud： https://click.qwencloud.com/m/20000002025/ Model Studio： https://click.alibabacloud.com/m/20000002017/  #Le...", "type": "model", "relTime": "4天前"}, {"id": 117, "title": "乌克兰向英国企业开放大规模标注战场数据集，达成标志性AI武器合作", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/ukraine-opens-its-massive-labeled-battlefield-dataset-to-british-firms-in-a-landmark-ai-weapons-partnership", "date": "2026-08-25T12:16:41.000Z", "summary": "英国成为首个获准访问乌克兰Avengers Labs数据平台的国家，该平台训练AI模型识别并打击目标。该数据集含约500万张标注图像，训练出的系统每月处理超10万条无人机视频流，识别敌方装备准确率70%、单目标耗时2.2秒。获批企业只能在安全数据室内训练测试模型，成品AI归乌克兰所有。", "type": "industry", "relTime": "4天前"}, {"id": 118, "title": "AtlasV 集成阿里云 Wan 2.7 生成 AI 时尚视频", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092207458131300792", "date": "2026-08-25T11:08:24.000Z", "summary": "静态图片到动态时尚视频--无需摄影棚。🎥 AtlasV 的 Collart 平台集成阿里云 Wan 2.7，将产品和模特照片转化为可扩展的高质量 AI 视频。制作更快，零传统拍摄限制。阅读案例研究：https://click.alibabacloud.com/m/20000002727/ 在阿里云 Model Studio 试用 Wan：https://click.alibabacloud....", "type": "industry", "relTime": "4天前"}, {"id": 119, "title": "训练人工智能用代码作画", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://surya.website/rling-qwen-to-paint-with-code", "date": "2026-08-25T10:45:18.601Z", "summary": "一位纽约布鲁克林的设计师兼创意技术专家，尝试训练人工智能用代码作画。文章从创作者视角出发，探讨如何将编程与视觉艺术结合，让 AI 通过代码生成绘画作品。", "type": "tip", "relTime": "4天前"}, {"id": 120, "title": "阿里云 Wan 3.0 上线 Magnific 平台", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092201373907702151", "date": "2026-08-25T10:44:13.000Z", "summary": "阿里云 Wan 3.0 视频生成模型正式上线 Mag 1080p 高清输出。用户可通过 Model Studio 和 Qwen Cloud 获取更多 API 接入方式。", "type": "model", "relTime": "4天前"}, {"id": 126, "title": "面壁智能：MiniCPM-o-4.5 驱动 Agent 构建复杂 AI 工作流", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2092138398509326561", "date": "2026-08-25T06:33:58.000Z", "summary": "面壁智能（OpenBMB）展示 AI 智能体在 MiniCPM-o-4.5 与开源生态支持下，可完成从模型理解、微调到调试部署的复杂工作流。引用案例中，Agent 在 68 分钟内从零微调多模态模型，生成 1000 条质检数据与训练脚本，全程仅需回答 6 轮问题。", "type": "tip", "relTime": "4天前"}, {"id": 127, "title": "阿里云 Wan 3.0 上线 Topview，视频生成更便宜", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092137584973770826", "date": "2026-08-25T06:30:44.000Z", "summary": "阿里云 Wan 3.0 现已上线 Topview，支持更长视频生成与更多创意灵活性，并提供专属优惠。Ultra Annual 套餐下，用 Wan 3.0 生成 30 秒视频仅需 1.20 美元，且享 365 天无限次生成，成本为 Seedance 2.5 的 1/3，无限访问时长为其 6 倍。API 已同步开放至 Model Studio 与 Qwen Cloud。", "type": "industry", "relTime": "4天前"}, {"id": 128, "title": "阿里云 Wan 3.0 上线 OpenRouter", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092137088326189442", "date": "2026-08-25T06:28:46.000Z", "summary": "阿里云 Wan 3.0 现已上线 OpenRouter，支持文本、图像或参考素材生成 2-30 秒视频，最高 1080p。发布定价为每秒 $0.05/$0.10/$0.20，各分辨率限时 15% 折扣。用户还可通过 Model Studio 和 Qwen Cloud 获取 API 访问。", "type": "model", "relTime": "4天前"}, {"id": 129, "title": "通义万相3.0上线Runway支持多参考生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092130468875710650", "date": "2026-08-25T06:02:28.000Z", "summary": "Wan 3.0 现已上线 @runwayml。🚀 支持多图像、视频和音频参考输入，生成视频与音频，为每次生成带来更多控制。立即在 Runway 上体验。更多 API 接入：• Model Studio：https://click.alibabacloud.com/m/20000002017/ • Qwen Cloud：https://click.qwencloud.com/m/2000000...", "type": "model", "relTime": "4天前"}, {"id": 130, "title": "阿里云 Wan 3.0 上线 Pika，支持 20 参考与 30 秒生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092127790602866913", "date": "2026-08-25T05 x.com/alibaba_cloud/status/2092122602890506567", "date": "2026-08-25T05:31:12.000Z", "summary": "阿里云 Wan3.0 正式登陆 SocialSight，可将瞬间想法生成为 30 秒 1080p 高清电影级片段，并保持角色在每一帧中形象一致。用户还可通过 Model Studio 和 Qwen Cloud 获取更多 API 访问权限。", "type": "model", "relTime": "4天前"}, {"id": 136, "title": "阿里云 Wan3.0 评测：创作工作流实战表现", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092119789070352578", "date": "2026-08-25T05:20:02.000Z", "summary": "阿里云称 Wan2.7 到 Wan3.0 是质的飞跃，具备实用专业价值。@JesusPlazaX 在 Magnific Spaces 中全面测试了 Wan3.0，覆盖角色一致性、文生视频、动作、口型同步、宣传片、3D 动画风格及多语言提示词等场景。Wan3.0 现已上线 Magnific，并提供 Model Studio 和 Qwen Cloud 的 API 访问。", "type": "tip", "relTime": "4天前"}, {"id": 137, "title": "阿里云 Wan3.0 发布，视频生成质量飞跃", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092118611674726871", "date": "2026-08-25T05:15:21.000Z", "summary": "阿里云发布 Wan3.0 视频生成模型，被评测者评价为\"质量持续高水准，而非偶发\"，相较 Wan2.7 堪称全新模型。该模型支持文生视频（T2V）、图生视频（I2V）和参考生视频（R2V），现已上线 fal 平台，并提供 Model Studio 和 Qwen Cloud 的 API 访问。", "type": "model", "relTime": "4天前"}, {"id": 138, "title": "字节跳动发布\"豆包工作\"，与飞书深度打通", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/865.htm", "date": "2026-08-25T02:47:43.000Z", "summary": "字节跳动今日正式发布面向生产力场景的Agent产品\"豆包工作\"，可自主拆解任务、调用工具并推进复杂工作流程，电脑版已开放下载，即日起可免费领取30天订阅权益。该产品与飞书深度打通，登录后能继承权限范围内的企业知识和工作上下文，并支持生成编辑文档、图片、视频、网页及应用，以及跨软件操作电脑和云电脑远程执行任务。", "type": "product", "relTime": "4天前"}, {"id": 139, "title": "通义万相 Wan 3.0 上线 Pixmax，限时 7 折", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092065672314634747", "date": "2026-08-25T01:44:59.000Z", "summary": "阿里云通义万相 Wan 3.0 已上线 AI 创作平台 Pixmax，主打电影级画质输出。新版本支持任意艺术风格下的视觉一致性、物理真实的流畅运动，以及多模态与混合现实编辑能力。即日起至 8 月 24 日，Pixmax 用户可享 30% 折扣；开发者还可通过 Model Studio 与 Qwen Cloud 获取 API 接入。", "type": "model", "relTime": "4天前"}, {"id": 140, "title": "OpenRouter 视频生成 API：一份代码优先的接入指南", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/tutorials/video-generation-api", "date": "2026-08-25T00:00:00.000Z", "summary": "OpenRouter 推出统一的异步视频生成 API，通过 POST /api/v1/videos 提交任务、轮询状态并下载 MP4，支持 Seedance、Veo、Wan 等模型，切换模型只需更改 model 标识符。", "type": "tip", "relTime": "5天前"}, {"id": 141, "title": "STARFlow2：用归一化流桥接语言模型，实现统一多模态生成", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/starflow2-multimodal-generation", "date": "2026-08-25T00:00:00.000Z", "summary": "STARFlow2 提出将自回归归一化流与语言模型统一，用于多模态生成。该方法观察到自回归归一化流与 LLM 共享因果掩码、KV-cache 机制和从左到右结构，从而弥合文本与图像生成的架构差异，避免离散 token 化带来的视觉保真度损失。", "type": "paper", "relTime": "5天前"}, {"id": 142, "title": "MoTE：面向多任务视频理解的任务专家混合解码器架构", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.24763", "date": "2026-08-25T00:00:00.000Z", "summary": "论文提出MoTE（Mixture of Task Experts）解码器架构，将大语言模型的前馈网络转换为任务特定专家，同时共享多模态主干网络。实例化模型VideoLLM-MoTE在五个COIN基准上采用显式任务路由，五专家模型每样本激活约2B LLM参数，平均top-1准确率超过近期VideoLLM基线，并优于密集全专家激活与学习式稀疏路由。", "type": "paper", "relTime": "5天前"}, {"id": 143, "title": "LAWA：用潜在动作作为意图，让世界动作模型高效想象未来", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.24882", "date": "2026-08-25T00:00:00.000Z", "summary": "LAWA 用紧凑潜在动作表征未来意图，在不生成未来观测的情况下实现高效测试时未来想象，省去未来视频分支。在 RoboCasa 上，LAWA 在少样本和全数据设置下平均成功率分别达 65.6% 和 80.8%，比 Fast-WAM 基线高 9.6 和 4.5 个点，同时推理延迟比 Joint-WAM 低 42.9%，并在 LIBERO-Plus 和真实任务上表现稳健。代码和模型将开源。", "type": "paper", "relTime": "5天前"}, {"id": 144, "title": "WeMM-Embedding：微信多模态嵌入技术报告", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.24053", "date": "2026-08-25T00:00:00.000Z", "summary": "微信发布WeMM-Embedding通用多模态嵌入模型系列，支持文本、图像、视频、视觉文档及任意交错多模态输入，提供2B、4B、9B三种参数规模。其中2B版本已在MMEB-v2上超越此前领先的8B开源基线，9B版本以80.6总分创下新SOTA。该系列已在微信视频号、公众号、朋友圈及电商等推荐与搜索场景大规模部署，模型权重与代码已开源。", "type": "model", "relTime": "5天前"}, {"id": 145, "title": "LAION-BVD：面向多模态预训练的千万小时级开放视频数据集", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.24845", "date": "2026-08-25T00:00:00.000Z", "summary": "LAION 团队发布 LAION-BVD，一个包含 1.3B 条平台视频 URL、下载 80M 段视频、总时长 1000 万小时的大规模开放视频数据集，面向视频、音频和图像多模态预训练。基于该数据训练的模型在视频-文本和音频-文本基准上表现具竞争力，且性能随训练或模型规模提升而持续增长。数据集已向研究社区开放。", "type": "paper", "relTime": "5天前"}, {"id": 146, "title": "DiffusionOPSD：扩散模型的在线策略自蒸馏框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.24646", "date": "2026-08-25T00:00:00.000Z", "summary": "DiffusionOPSD 提出一种在线策略自蒸馏框架，将图像级奖励引导转化为采样查询点上干净输出预测的显式目标。在 SD 3.5-M 和 Z-Image-Turbo 上，该方法在 20 个奖励匹配设置中的 19 个取得最佳最终留出分数，相比最强竞争方法最高提升 44.0%，训练 GPU 小时数较 DiffusionNFT 分别减少 40% 和 63%。", "type": "paper", "relTime": "5天前"}, {"id": 147, "title": "RubSE：用评分规则作为视觉修复上下文实现UI到代码生成的自进化", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.24138", "date": "2026-08-25T00:00:00.000Z", "summary": "RubSE框架通过将视觉反馈表示为结构化评分规则上下文，解决了大视觉语言模型在UI到代码生成中测试时自进化不稳定的问题。该方法每轮生成候选规则、选择优先修复目标并保留历史，引导修订聚焦于明确范围。在六个VLM和三个基准上，RubSE显著优于朴素自进化，轨迹更稳定且能缓解崩溃、提升对严重视觉回退的恢复能力。", "type": "paper", "relTime": "5天前"}, {"id": 148, "title": "GameWAM：面向视频游戏的 World Action Model", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.26200", "date": "2026-08-25T00:00:00.000Z", "summary": "GameWAM 首次将 World-Action Model 引入原生闭环游戏玩法与 GUI 控制，通过并行视觉与动作生成、块因果条件及流匹配，联合预测未来视觉观测与可执行的键鼠轨迹。实验显示其以更少的原生动作数达到与对比智能体相当的任务成功率，并揭示了生成式控制中低频动作源成分系统性影响相机粗粒度运动的 LASI 失效模式。", "type": "paper", "relTime": "5天前"}, {"id": 149, "title": "Luce：面向3D资产生成的可重打光高斯表示", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23943", "date": "2026-08-25T00:00:00.000Z", "summary": "Luce提出一种将几何与PBR材质统一到体素化多模态高斯云中的3D表示，通过变分自编码器压缩至统一潜在空间，再由修正流Transformer从单张图像生成。在Toys4K上，Luce实现SOTA单图转3D生成，FID较最强基线提升28%；在AI生成图像基准上，CLIP图像对齐分数达0.8519，优于基线0.8299。Luce可生成保留文字、标志等细节的可重打光资产。", "type": "paper", "relTime": "5天前"}, {"id": 150, "title": "Grok Bot 智能体：一句话完成视频剪辑与整理", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2092038808607084868", "date": "2026-08-24T23:58:14.000Z", "summary": "用户仅用自然语言指令，让 Grok Bot 在几分钟内完成原本需数天的工作：找到并转录 38 个相关视频，精选 13 个最佳片段，剪辑合并为一个 19：35 的视频，并生成包含各片段科学要点及原始时间戳的 Markdown 文件。整个过程无需编写任何脚本或代码。", "type": "tip", "relTime": "5天前"}, {"id": 151, "title": "Runway 上线 WAN 3.0 视频音频生成", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2092013729940733969", "date": "2026-08-24T22:18:35.000Z", "summary": "WAN 3.0 现已登陆 Runway。  支持多种图像、视频和音频参考输入，生成最先进的视频与音频。点击下方链接立即体验。", "type": "paper", "relTime": "5天前"}, {"id": 152, "title": "MiniMax H3 在 GB200 上推理提速 27.7 倍", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2092008802984001919", "date": "2026-08-24T21:59:00.000Z", "summary": "NVIDIA SANA 团队的 Sol Engine 将 MiniMax H3 视频生成延迟大幅压缩：单块 GB200 上 10s 768p 视频从 414s 降至 14.93s（27.7 倍加速），5s 视频达 22.2 倍加速。", "type": "paper", "relTime": "5天前"}, {"id": 153, "title": "阿里万相3.0上线OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2092001924203807202", "date": "2026-08-24T21:31:40.000Z", "summary": "阿里巴巴的 Wan 3.0（来自 @Alibaba_Wan 和 @alibaba_cloud）现已上线 OpenRouter。  支持从文本、图像或参考内容生成 2-30 秒视频，分辨率可选 480p、720p 或 1080p。  发布定价：$0.05/$0.10/$0.20 每秒，所有分辨率限时 15% 折扣。", "type": "paper", "relTime": "5天前"}, {"id": 154, "title": "你的alt文本能通过自动化检查，不代表它真的合格", "source": "GitHub Blog", "sourceUrl": "https://github.blog/engineering/user-experience/your-alt-text-passes-automated-checks-that-doesnt-mean-its-any-good", "date": "2026-08-24T20:56:32.000Z", "summary": "WebAIM Million报告显示，主流网页中16.2%的图片缺少alt文本，另有10.8%的alt文本模糊或重复。GitHub为Accessibility Scanner构建了alt文本插件，采用五条确定性规则检测缺失、文件名、占位符、泛化词及相邻重复，并引入基于布局的重复检测和可选视觉模型审查，以平衡误报率与实用性。", "type": "tip", "relTime": "5天前"}, {"id": 155, "title": "为什么萨尔·汗行不通：关于\"做中学\"与\"讲授式教学\"", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://punyamishra.com/2026/04/16/why-sal-khant-on-learning-by-making-but-teaching-by-telling", "date": "2026-08-24T19:01:54.906Z", "summary": "萨尔·汗承认其AI辅导机器人Khanmigo对多数学生而言是\"非事件\"，首席学习官Kristen DiCerbo直言\"尚未看到教育革命\"。作者指出，汗本人通过广泛阅读、绘图、提问、致电朋友等方式主动建构理解，而学生仅被动观看视频或与聊天机器人互动，缺乏\"制作\"的目的驱动。文章援引杜威的四种自然冲动（探究、建构、表达、交流），解释为何讲授式AI辅导注定失败。", "type": "tip", "relTime": "5天前"}, {"id": 156, "title": "逆向工程发现 MS Paint 和\"照片\"为本地 AI 生成图片添加不可见 GUID 水印", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://xusheng.dev/posts/reversing/mspaint_invisible_watermark/main", "date": "2026-08-24T18:45:40.740Z", "summary": "逆向工程显示，MS Paint 和\"照片\"应用会将服务器下发的 GUID 以不可见方式嵌入本地生成的 AI 图像像素中。该水印由服务器签发，用于追踪图片来源，但用户无法直接察觉其存在。", "type": "paper", "relTime": "5天前"}, {"id": 157, "title": "MetaRoCE：为 AI 规模以太网打造的全新 RDMA 传输协议", "source": "Meta Engineering Blog（RSS）", "sourceUrl": "https://engineering.fb.com/2026/08/24/networking-traffic/metaroce-rdma-transport-ai-ethernet", "date": "2026-08-24T18:02:29.000Z", "summary": "Meta 设计并开源了 MetaRoCE，一个专为 AI 工作负载在通用以太网上打造的 RDMA 传输协议，已通过 Open Compute Project（OCP）发布规范、参考软件实现和合规测试套件。该协议将智能移至端点，原生支持乱序交付、多路径、无损容忍和双向拥塞控制，无需 PFC，可在百万 GPU 规模下提供高吞吐、低尾延迟。现有 RDMA Verbs API 和软件栈无需修改即可运行。", "type": "model", "relTime": "5天前"}, {"id": 158, "title": "MTIA 300：Meta 首款内置 NIC 与通信卸载引擎的训练芯片", "source": "Meta Engineering Blog（RSS）", "sourceUrl": "https://engineering.fb.com/2026/08/24/networking-traffic/mtia-300-meta-training-chip-built-in-nics", "date": "2026-08-24T17:45:52.000Z", "summary": "Meta 发布 MTIA 300，这是其自研加速器家族中首款针对推荐与排序模型训练优化的芯片。芯片封装内集成 12 个 800 Gbps RDMA NIC，提供 1.2 TB/s 总 I/O 带宽，并通过 16 个专用消息引擎卸载通信，使大规模 GEMM 与集合通信并发时计算吞吐损耗低于 0.5%。", "type": "model", "relTime": "5天前"}, {"id": 159, "title": "AgentHands：为XR空间对话智能体生成交互式手部手势", "source": "Google Research：Blog（网页）", "sourceUrl": "https://research.google/blog/agenthands-generating-interactive-hand-gestures-for-spatially-grounded-agent-conversations-in-xr", "date": "2026-08-24T16:00:00.000Z", "summary": "Google在CHI 2026发布研究原型AgentHands，利用LLM为XR对话智能体生成与语音同步的富有表现力的手部手势，提供空间锚定的物理指引。该系统通过眼动追踪和场景重建注册物体，由LLM生成内联GestureEvents，并在头显上按词级时间戳协调TTS与动画引擎，实现手势与语音的精准同步。应用场景包括兰花养护交互式教学、3D打印机操作技术讲解和生活方式陪伴。", "type": "paper", "relTime": "5天前"}, {"id": 160, "title": "阿里 Wan3.0 视频生成模型开放测试，支持文本、图片、文档生成最长 30 秒视频", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/alibabas-wan3-0-generates-ai-videos-up-to-30-seconds-long-from-text-images-and-documents", "date": "2026-08-24T15:35:03.000Z", "summary": "阿里巴巴视频生成模型 Wan3.0 现已开放测试，可基于文本、PDF、网页和 PowerPoint 输入生成最长 30 秒的视频，时长较前代 Wan2.5 翻倍。", "type": "model", "relTime": "5天前"}, {"id": 161, "title": "百度自研磐玉蜂巢服务器新品上市：高密度ARM架构升级至48刀片节点", "source": "公众号：百度智能云（文心）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzA5NTQ5MzE5OQ%3D%3D&mid=2653159776&idx=2&sn=3b4e15d9d815c4f1100d11a8043c02a0", "date": "2026-08-24T15:17:12.000Z", "summary": "百度ARM云推出新版磐玉蜂巢服务器（PY-FCR3-L05-R96-M24-S16S-3648），在保持96片RK3588S SoC规模不变的基础上，将刀片节点由24增至48个，内存从16GB升级至24GB，并配备4×SFP+万兆光口聚合。整机提供768个CPU核及576 TOPS总AI算力，支持8K 60FPS视频编码，适配云手机、云游戏、数字人等场景，兼容公有云、私有云及混合云部署。", "type": "paper", "relTime": "5天前"}, {"id": 162, "title": "OpenRouter 新增图像模型视觉基准测试", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2091902367705043239", "date": "2026-08-24T14:56:04.000Z", "summary": "新增：用于了解图像模型能力的视觉基准测试 🌅  查看每个模型在各种挑战性提示词下的表现：https://openrouter.ai/benchmarks/media/images", "type": "model", "relTime": "5天前"}, {"id": 163, "title": "dots3-note 预览版：面向长期任务的开放权重多模态模型", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2091886743171813732", "date": "2026-08-24T13:53:59.000Z", "summary": "当一项任务持续数小时甚至数周，且外部世界不断变化时，AI 需要具备什么才能保持有用？  目标会演变。新的约束会出现。计划会失败。  认识一下 dots3-note 预览版，这是由 rednote 的 dots 工作室 @dotsstudioai 开发的开放权重多模态模型，面向现实生活中的长期任务自主性。  - 总计 280B / 激活 16B 参数  - 512K 上下文窗口  - 文本、视...", "type": "model", "relTime": "5天前"}, {"id": 164, "title": "AI生成图片普及，派对邀请函也AI化", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2091868047166296067", "date": "2026-08-24T12:39:42.000Z", "summary": "现在所有孩子的派对邀请函都是用AI做的了。这事已经发生了，图像生成已经走向主流。  另外，这是不是Comic Sans字体的末日？", "type": "tip", "relTime": "5天前"}, {"id": 165, "title": "通义万相 Wan 3.0 上线 RunningHub", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2091827304498667778", "date": "2026-08-24T09:57:48.000Z", "summary": "阿里云通义万相 Wan 3.0 已在 RunningHub 上线，支持原生 30 秒视频生成、多模态参考输入和更强的时序一致性。用户可通过 Web UI 和 API 使用，并可通过 Model Studio 与 Qwen Cloud 获取更多 API 接入。", "type": "model", "relTime": "5天前"}, {"id": 166, "title": "阿里云 Wan 3.0 上线 Scenario，支持 30 秒视频生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2091826875689812323", "date": "2026-08-24T09:56:06.000Z", "summary": "阿里云 Wan 3.0 视频模型上线 Scenario 平台，支持一次生成最长 30 秒片段、原生同步音频及多模态输入（首帧、尾帧、参考图、视频、音频、文档和 URL），并配备面向复杂输入的思考模式。开发者现可通过 Model Studio 和 Qwen Cloud 获取 API 接入。", "type": "model", "relTime": "5天前"}, {"id": 167, "title": "阿里云 Wan 3.0 上线 Runware D0", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2091807371224117597", "date": "2026-08-24T08:38:35.000Z", "summary": "阿里云 Wan 3.0 现已在 Runware D0 上线，支持文生视频、帧与参考模式，可生成 30 秒片段，并支持多达 10 张参考图、5 段参考视频和 5 段参考音频输入，配备复杂多输入提示的思考模式。更多 API 访问可通过 Model Studio 和 Qwen Cloud 获取。", "type": "model", "relTime": "5天前"}, {"id": 168, "title": "DeepSeek V4-Flash-Vision-Exp 平价平替 Claude Code", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2091805785340686430", "date": "2026-08-24T08:32:17.000Z", "summary": "DeepSeek 上线 V4-Flash-Vision-Exp 多模态模型，配开源 Harness 可将 Coding Agent 成本降至白菜价。该组合多模态基准接近 Claude Opus-4.8，离峰价格仅 $0.22/百万 token，一张图算 384 tokens。开源 Harness 支持文件编辑、终端执行，可本地平替 Claude Code 和 Codex，大幅降低迭代成本。", "type": "tip", "relTime": "5天前"}, {"id": 169, "title": "阿里云 Wan3.0 上线 NadouPro，支持 30 秒原生视频", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2091796012205756629", "date": "2026-08-24T07:53:27.000Z", "summary": " , "date": "2026-08-24T07:39:39.000Z", "summary": "Wan3.0 现已上线 @magnific。输入文本、图片、网页内容--输出 30 秒电影感视频。更多 API 接入： • Model Studio： https://click.alibabacloud.com/m/20000002017/ • Qwen Cloud： https://click.qwencloud.com/m/20000002025/", "type": "model", "relTime": "5天前"}, {"id": 175, "title": "阿里云 Wan3.0 上线 TapNow，支持多格式参考", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2091787580954304776", "date": "2026-08-24T07:19:57.000Z", "summary": "阿里云 Wan3.0 多模态视频生成模型上线 TapNow，支持一次生成最长 30 秒视频，并接受多种参考格式输入。模型在场景中保持运动、光照和物理细节的一致性，现可通过 Model Studio 和 Qwen Cloud 获取 API 访问。", "type": "model", "relTime": "5天前"}, {"id": 176, "title": "阿里云 Wan3.0 上线 fal，单次生成 30 秒视频", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2091787253274329304", "date": "2026-08-24T07:18:39.000Z", "summary": "阿里云 Wan3.0 已上线 fal 平台，单次生成原生 30 秒视频，无需拼接。支持文本、图像、音频、视频、网页和文档等多模态输入，并提升真实世界运动渲染效果。更多 API 接入可通过 Model Studio 和 Qwen Cloud 获取。", "type": "model", "relTime": "5天前"}, {"id": 177, "title": "阿里云万相3.0上线DeeVid AI", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2091786543711322539", "date": "2026-08-24T07:15:50.000Z", "summary": "Wan3.0 已在 @Deevid_AI 上线。🚀 更低的生成成本。创作更多，探索更多。电影级 AI 视频，更强的动态表现，更丰富的细节。立即开始创作！更多 API 接入：• Model Studio： https://click.alibabacloud.com/m/20000002017/ • Qwen Cloud： https://click.qwencloud.com/m/20000...", "type": "model", "relTime": "5天前"}, {"id": 178, "title": "月之暗面第一代万亿参数多模态模型 Kimi K2.5 官宣月底结束服役", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/485.htm", "date": "2026-08-24T05:08:35.000Z", "summary": "月之暗面官方微博宣布，第一代万亿参数多模态模型 Kimi K2.5 本月底结束服役。该模型于今年 1 月推出并开源，曾是其最智能、最全能的模型，采用原生多模态架构，支持视觉与文本输入、思考与非思考模式及 Agent 任务。其继任者 Kimi K3 已于今年 7 月开源，为 2.8 万亿参数模型，拥有 100 万 token 上下文窗口。", "type": "industry", "relTime": "5天前"}, {"id": 179, "title": "千问正式上线 Wan3.0 视频生成模型", "source": "公众号：千问APP（阿里）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzYzNDE5MDEwMQ%3D%3D&mid=2247488485&idx=1&sn=5c9a6ae17781271feae5cd78ea74723b", "date": "2026-08-24T04:01:14.000Z", "summary": "千问今日在千问创作 Web 端（c.qianwen.com）及千问 PC&APP 端正式上线 Wan3.0 视频生成模型，该模型自 8 月 6 日首发公测，支持 30 秒视频直出、真实生动的 AI 角色和丰富镜头运镜。同步开启限时优惠，千问创作会员限时 6 折，适用于短剧、漫剧及营销广告创作。", "type": "model", "relTime": "5天前"}, {"id": 180, "title": "生数科技提出通用世界模型五级发展路线，发布世界动作模型 Motubrain", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489090&idx=1&sn=48cf85822fe8099668fc3ae617826671", "date": "2026-08-24T03:38:13.000Z", "summary": "生数科技在世界机器人大会上提出通用世界模型五级发展路线，从世界生成、与世界交互、在世界中行动，迈向自主世界智能体与世界组织者。其世界动作模型 Motubrain 推理速度较 Motus 提升约 10 倍，仅需 50 至 100 条人类示范数据即可适配新机器人本体，在 RoboTwin 2.0 基准测试中以 96.1 分位居榜首。", "type": "tip", "relTime": "5天前"}, {"id": 181, "title": "阿里云视频生成模型 Wan3.0 正式上线，支持单次生成 30 秒视频、文档输入", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/396.htm", "date": "2026-08-24T03:17:59.000Z", "summary": "阿里云视频生成模型 Wan3.0 今日正式上线，单次可生成 30 秒视频，并首次支持 doc、xls、ppt、pdf、md 等文档格式输入。公测十余天来，模型在指令遵循、跨镜头一致性、音频质感及视频编辑等方面持续进化。480P/720P/1080P API 价格分别为 0.3/0.6/1.2 元/秒，8 月 24 日至 9 月 23 日限时 7 折。", "type": "model", "relTime": "5天前"}, {"id": 182, "title": "东南大学力交互腔镜手术机器人跨越 2400 公里完成 3 例手术，填补国产力感知技术空白", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/363.htm", "date": "2026-08-24T01:43:02.000Z", "summary": "东南大学宋爱国团队牵头的国家重点研发计划项目取得临床突破，其力交互腔镜手术机器人协同郑州大学第一附属医院与新疆医科大学第一附属医院，跨越 2400 公里成功完成两例肾部分切除术和 1 例前列腺癌根治术。团队基于电阻应变原理自研三维力手术提拉与夹持力传感器，使机器人具备接近人手的精细力觉感知能力，填补国产腔镜机器人力感知技术空白。", "type": "industry", "relTime": "5天前"}, {"id": 183, "title": "两个16岁高中生自建\"炼丹社\"，共享显卡和API让全校免费用AI", "source": "公众号：数字生命卡兹克", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647685481&idx=1&sn=fd49a287e70eb66dc38c627dc9769c74", "date": "2026-08-24T00:08:00.000Z", "summary": "北京两名16岁高中生张睿修和冯子上成立\"炼丹社\"，将自有的RTX PRO 6000、Mac studio及从公司、高校争取的算力与API额度整合为FreeAPI项目，向全校开放共享API，提供三个对话模型及文本向量、联网搜索、视频生成能力。社团现有30多人，覆盖高一约120人年级的四分之一。两人还计划帮学校重建整合课表、成绩等信息的校园网站，并嵌入AI检索助手。", "type": "tip", "relTime": "6天前"}, {"id": 184, "title": "Beyond Visual CoT：Internalized Visual Thinking 实现主动视频推理", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/internalized-visual-thinking", "date": "2026-08-24T00:00:00.000Z", "summary": "多模态大语言模型常用视觉思维链（Visual CoT）进行空间、时间与具身环境推理，但生成中间推理图像带来大量推理开销。新提出的后训练框架 Internalized Visual Thinking（IVT）在训练阶段内化视觉思考，推理时直接进行文本预测与优化，从而在不增加推理成本的前提下实现主动视频推理。", "type": "paper", "relTime": "6天前"}, {"id": 185, "title": "EchoWM：可进入式全模态世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23189", "date": "2026-08-24T00:00:00.000Z", "summary": "EchoWM 是一个面向可进入式生成媒体的全模态世界模型，能在持续导航中联合生成 720p 视频、环境音、音乐和语音。它围绕相机意图组织交互，将离散指令和连续姿态映射到共享的度量尺度相对 6-DoF 轨迹，并通过渐进训练和自回归后训练实现长时程生成。评测显示其在公开世界模型基准上轨迹跟随和视觉质量表现优异，支持第一/第三人称交互及同步环境音和语音。", "type": "paper", "relTime": "6天前"}, {"id": 186, "title": "ReWorld：具备长时记忆的交互式世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23565", "date": "2026-08-24T00:00:00.000Z", "summary": "ReWorld 将控制与记忆分离训练并在推理时加以约束，通过混合逐头注意力窗口和随机头路由，让少量全局头关注全部历史，同时以姿态索引地标库支撑有界 KV 缓存。在覆盖动作跟随、长时回忆和视频质量的三轴评测中，ReWorld 对六个近期交互式世界模型取得最佳控制保真度（11.95° 旋转误差）和最佳生成质量，并支持 704x1280 实时视频流。", "type": "paper", "relTime": "6天前"}, {"id": 187, "title": "开放世界多智能体环境中的自主数学发现", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23691", "date": "2026-08-24T00:00:00.000Z", "summary": "一项研究在开放世界多智能体环境Station中，让来自不同模型家族的AI智能体在无中央协调或脚本化流程下自主开展数学研究。在AlphaEvolve目录的12个构造问题及两个额外案例中，智能体在五个问题上取得了超越现有文献的新结果，包括有限域Kakeya集的新无限族、11维604点亲吻构型等，并生成了定理与分析使结果更具可解释性。所有原始智能体对话、证明和验证代码均已公开。", "type": "paper", "relTime": "6天前"}, {"id": 188, "title": "JoyAI-Echo-1.5：面向持久故事与交互世界的长时程音视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23383", "date": "2026-08-24T00:00:00.000Z", "summary": "JoyAI-Echo-1.5 发布，这是一个统一的音视频生成系统，包含长视频与世界模型两个变体。长视频变体通过可组合的跨镜头记忆与说话人线索，实现跨镜头的角色外观和语音身份保持；世界模型变体将导航输入转换为 6-DoF 相机轨迹，支持控制器无关的交互。其世界模型变体在 WBench 上以 81.7 的平均分排名第一。", "type": "model", "relTime": "6天前"}, {"id": 189, "title": "CaRGo-T：因果推理思维图提升多模态幽默理解", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23172", "date": "2026-08-24T00:00:00.000Z", "summary": "CaRGo-T提出一种基于图的推理框架，将多模态幽默背后的因果与上下文关系序列化为代码表示，供视觉语言模型在零样本或上下文学习场景下解读并输出预测。在涵盖讽刺、反讽和表情包的四项数据集上，CaRGo-T较现有推理基线在幽默理解上提升约1-20%，幽默检测上提升1-3%。互信息分析显示其推理表示包含更多与目标输出相关的信息，代码已开源。", "type": "paper", "relTime": "6天前"}, {"id": 190, "title": "加州伯克利数学教授撰文批评学生基础差，却被抓包\"用 AI 写的\"", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/309.htm", "date": "2026-08-23T14:33:38.000Z", "summary": "加州大学伯克利分校数学教授斯坦科娃撰文批评学生数学基础落后\"五到八年\"，并归咎于加州大学取消标准化考试成绩的招生政策。该校学生报用 AI 检测工具 Pangram 检查后发现文章有 33% 内容由 AI 生成或协助，斯坦科娃随后承认使用 AI 编辑，但强调文章是数百小时人工工作的成果。事件引发关于学者使用 AI 的争论，Pangram 宣称其识别准确率达 99.66%。", "type": "industry", "relTime": "6天前"}, {"id": 191, "title": "美司法部支持xAI挑战明州AI图像法", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2091518667867713935", "date": "2026-08-23T13:31:23.000Z", "summary": "新闻：美国司法部支持埃隆·马斯克的xAI对明尼苏达州新AI图像生成法的法律挑战。  司法部表示，该法远超联邦规则，即使成年人同意或创建自己的图像，AI平台也可能受到惩罚。  司法部还警告称，过于宽泛的州法律可能限制受保护的言论、减缓AI发展，并损害美国在AI领域的全球领导地位。", "type": "industry", "relTime": "6天前"}, {"id": 192, "title": "第二届世界人形机器人运动会：智元精灵 G2 摘得\"消防应急场景\"\"图书场景\"两枚金牌", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/292.htm", "date": "2026-08-23T12:59:19.000Z", "summary": "第二届世界人形机器人运动会今日开赛，智元精灵 G2 在新增的\"场景赛\"中摘得\"消防应急场景\"\"图书场景\"两枚金牌，目前智元以两金三银两铜位居奖牌榜首位。消防场景中，G2 通过手腕加装结构件勾起 4.5-5 公斤灭火器，解决末端夹爪负载上限问题；图书场景则与清华、上海交大联合赛队合作，采用开源视觉模型识别图书脊背标签。", "type": "industry", "relTime": "6天前"}, {"id": 193, "title": "橡鹿机器人全球首发三款烹饪机器人产品", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/248.htm", "date": "2026-08-23T10:01:14.000Z", "summary": "橡鹿机器人在2026世界机器人大会首发三款新品：多模态烹饪AI基座CookingMuse厨启、3K视觉AI炒菜机器人和具身烹饪机器人\"现炒方舟\"。3K配备三颗4000万像素工业相机，以30 FPS捕捉锅内画面，由AI大模型实时判断食材状态并毫秒级调整加热功率与炒制时长。现炒方舟是可移动微型无人后厨，跑通净菜储存、烹饪、出餐、油烟处理到设备自清洁的全流程无人化闭环。", "type": "model", "relTime": "6天前"}, {"id": 194, "title": "DeepSeek-V4-Flash-Vision 与 OX-Alpha 多模态实测", "source": "X：karminski (@karminski3)", "sourceUrl": "https://x.com/karminski3/status/2091454694094971311", "date": "2026-08-23T09:17:11.000Z", "summary": "博主实测 DeepSeek-V4-Flash-Vision-Exp 与 OpenRouter 匿名模型 OX-Alpha 的多模态能力，用 AI 电竞教练框架对 CS2 游戏录像抽帧测试，考察两模型识别战局、分析优劣势并提出改进建议的能力。因 DeepSeek 多模态不支持视频输入，两模型均采用视频抽帧方式公平对比，并额外测出各自最佳输入图片配比。", "type": "tip", "relTime": "6天前"}, {"id": 195, "title": "38.15s 跑完 400 米再破人类纪录：北京人形天工 Ultra 夺得人形机器人运动会首金", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/228.htm", "date": "2026-08-23T08:16:01.000Z", "summary": "天工队以 38.15 秒夺得第二届世界人形机器人运动会 400 米大型组决赛冠军，拿下本届首金。天工 Ultra 昨晚预赛已跑出 39.70 秒打破人类 400 米纪录（43.03 秒），昨日百米预赛又以 9.39 秒率先冲线，打破博尔特 9.58 秒的人类百米世界纪录。该机器人身高 180cm、体重 52kg，具备带视觉感知的泛化移动能力，可应对斜坡、楼梯、碎石等复杂地形。", "type": "industry", "relTime": "6天前"}, {"id": 196, "title": "Codex 速率限制更新：修复与用量重置", "source": "X：Tibo (@thsottiaux)", "sourceUrl": "https://x.com/thsottiaux/status/2091407991736332689", "date": "2026-08-23T06:11:36.000Z", "summary": "Codex 团队发现长会话多压缩场景下图片使用效率低下、Computer History 高 p95+ 用量及标题生成功能消耗超预期，已组建专项组修复并于明日上线。同时发现一项无关的新效率优化方案，下周推进。作为修复的一部分，所有付费订阅用量将全面重置。", "type": "paper", "relTime": "6天前"}, {"id": 197, "title": "北京人形天工 Ultra 以 39.70s 打破人类 400 米记录，夺得比赛第一", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/164.htm", "date": "2026-08-23T03:35:11.000Z", "summary": "北京人形机器人创新中心研发的天工 Ultra 以 39.70s 成绩打破人类 400 米记录，夺得比赛第一。该机器人身高 180cm、体重 52kg，实测平均时速 10km/h，最高奔跑速度 12km/h，具备视觉感知的泛化移动能力，能在斜坡、楼梯、草地、碎石、沙地等多种地形平稳移动，并拥有强大抗干扰能力。去年它曾以 2 小时 40 分拿下北京亦庄人形机器人半程马拉松冠军。", "type": "industry", "relTime": "6天前"}, {"id": 198, "title": "斯坦福北大新研究：QWM 让世界模型不参与训练", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2091360780646318439", "date": "2026-08-23T03:04:00.000Z", "summary": "斯坦福大学和北京大学的新论文指出，在学到的世界模型内部训练机器人策略，会继承该模型的每一个错误。  随着任务变长、图像变复杂，这些错误会不断累积。  QWM（基于世界模型的 Q 学习）从不在模型内部训练任何内容。  在此方法中，世界模型完全不参与训练，它只帮助机器人做选择。  - arxiv.org/abs/2608.17163  标题：\"Q-Learning With World Models\"", "type": "paper", "relTime": "6天前"}, {"id": 199, "title": "社交媒体AI垃圾内容回声效应加剧", "source": "X：Francois Chollet (@fchollet)", "sourceUrl": "https://x.com/fchollet/status/2091353769741344921", "date": "2026-08-23T02:36:08.000Z", "summary": "社交媒体中越来越多的内容是由AI生成的垃圾信息--网红用AI发帖，机器人回复他们。这是回声的回声的回声。", "type": "tip", "relTime": "6天前"}];
var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };
var TYPE_LABELS = { "paper":"论文", "model":"模型", "product":"产品", "tip":"技巧", "industry":"行业" };
function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";
  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();

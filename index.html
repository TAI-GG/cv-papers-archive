a 为其 AI 聊天机器人推出新生产力功能，使其能接入日历生成每日简报、规划活动，并执行可中途调整方向的深度研究。该更新由新发布的 Muse Spark 1.1 模型驱动，标志着 Meta 从\"娱乐优先\"转向\"个人超级智能\"战略。新版 Meta AI 即日起在 Meta AI 应用和网页端\"部分市场\"上线，未来数周将扩展至 WhatsApp 等平台。", "type": "model", "relTime": "6小时前"}, {"id": 6, "title": "微软开源27B电脑操作Agent，可替代RPA", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2080678207054024819", "date": "2026-07-24T15:35:16.000Z", "summary": "微软发布Fara1.5-27B，一个基于Qwen3.5架构的27B参数多模态Agent，能看图像、读文字并像人一样控制电脑。它专为computer-use场景设计，可浏览网页、填表单、从截图提取数据、点击按钮，实现网页自动化。该模型开源且体量适中，适合本地部署和自托管，降低了可靠电脑操作模型的门槛。", "type": "model", "relTime": "8小时前"}, {"id": 7, "title": "Anthropic 联合 Andon Labs 发布 Drone-Bench，评估 AI 模型自主操控无人机执行定位追踪任务的能力", "source": "Anthropic：Research（发表成果 · 网页）", "sourceUrl": "https://www.anthropic.com/research/project-pilot", "date": "2026-07-24T15:25:45.300Z", "summary": "Anthropic 与 Andon Labs 合作推出 Drone-Bench，用于测试 AI 模型自主操控四旋翼无人机在室内环境中定位并追踪指定人员的能力。该基准将任务分解为 3D 地图重建、定位、导航、目标检测与跟随五个子任务，并通过软件复现实现快速评估。实验表明，该任务链的难度足以区分不同智能水平的模型，并揭示 AI 在物理世界操控能力上的进步轨迹。", "type": "paper", "relTime": "8小时前"}, {"id": 8, "title": "Jim Fan 转发黄仁勋：开放模型至关重要", "source": "X：Jim Fan (@DrJimFan)", "sourceUrl": "https://x.com/DrJimFan/status/2080660454184226908", "date": "2026-07-24T14:24:43.000Z", "summary": "GOAT  【引用 @JensenHuang】：在我的第一篇帖子中，我分享了一封 @NVIDIA 签署的关于开放模型为何重要的信函。  AI 将变革每个行业，赋能每家公司，并由每个国家构建。  开放模型加强安全与网络安全，加速创新与扩散，并实现主权。  世界既需要前沿封闭模型，也需要前沿开放模型。  https://images.nvidia.com/pdf/Open-Weights-and...", "type": "industry", "relTime": "9小时前"}, {"id": 9, "title": "Hyper3D 自动拆解3D模型为独立零件", "source": "X：小互 (@xiaohu)", "sourceUrl": "https://x.com/xiaohu/status/2080660118790893712", "date": "2026-07-24T14:23:23.000Z", "summary": "Hyper3D 的 BANG to Parts 功能可将完整 3D 模型自动拆解为多个独立、完整的 3D 零件。拆解后的零件可直接用于动画、改材质或 3D 打印，且支持递归拆解（如整车→车轮→轮毂），每个零件均可单独编辑或重新生成。", "type": "model", "relTime": "9小时前"}, {"id": 10, "title": "用AI生成3D虚拟小人，Vibe Coding玩转简历", "source": "X：小互 (@xiaohu)", "sourceUrl": "https://x.com/xiaohu/status/2080657737604907027", "date": 问（Qwen）及第三方领先模型的一站式访问。该计划旨在简化AI支出，首月起步价4美元。", "type": "model", "relTime": "14小时前"}, {"id": 16, "title": "我国成功发射两颗AI卫星：吉天星A-04星与西光贰号03星", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/300.htm", "date": "2026-07-24T09:19:08.000Z", "summary": "力箭一号遥十五火箭今日以\"一箭5星\"方式发射，其中吉天星A-04星搭载具身智能模型，可自主监测卫星健康并规划任务，支持实时上注AI大模型。西光贰号03星搭载三个AI气象模型，在星上直接产出预报，将观测到预警的响应时间压缩至分钟级。两颗卫星均属于三体计算星座，该星座计划到2027年达100颗卫星。", "type": "industry", "relTime": "14小时前"}, {"id": 17, "title": "腾讯合并大模型与多模态部，姚顺雨统管AI", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2080567279171850659", "date": "2026-07-24T08:14:29.000Z", "summary": "腾讯内部通知将大语言模型部和多模态部合并为基础模型部，由首席AI科学家姚顺雨统一负责。姚顺雨去年12月空降，7个月内完成从AI Lab撤并到混元、再到整合多模态的集权。此前发布的Hy3模型（295B总参数/21B激活参数）已打平参数2-5倍的旗舰模型，内部WorkBuddy任务成功率从72%提升至90%，耗时降34%。", "type": "industry", "relTime": "15小时前"}, {"id": 18, "title": "Flux 3 多模态前沿模型发布，支持图像/视频/音频联合学习", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://bfl.ai/blog/flux-3", "date": "2026-07-24T07:39:43.382Z", "summary": "Flux 3 多模态前沿模型发布，通过联合学习图像、视频和音频构建统一的世界表征。该模型现已开放 Early Access。", "type": "model", "relTime": "16小时前"}, {"id": 19, "title": "梁文锋详解DeepSeek AGI路线图：不追热点", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2080550345957130415", "date": "2026-07-24T07:07:11.000Z", "summary": "梁文锋在投资人会议实录中提出AGI的明确台阶：去年是CoT思维链，今年是Agent，下一道硬坎是持续学习，之后才是奇点（模型自我迭代），最后才轮到具身智能。他认为视频生成、世界模型等是支线，顺序错了越努力越错。DeepSeek因此不追热点，按自己的主线节奏推进。", "type": "tip", "relTime": "16小时前"}, {"id": 20, "title": "Runway Media Router 上线：根据场景自动切换 AI 模型，节省 Token 成本", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/144.htm", "date": "2026-07-24T07:00:01.000Z", "summary": "Runway 推出 Media Router，可在生成图像、视频、音频时根据质量、速度、成本三项优先级自动切换模型，减少开发者手动调换负担。该工具已上线 Runway Dev 平台，支持调用 Seedance、GPT Image 2、ElevenLabs 等多家模型，按高速生成、高质量、低成本三种场景灵活调度。", "type": "model", "relTime": "16小时前"}, {"id": 21, "title": "Black Forest Labs 发布 FLUX 3 多模态模型，支持单次生成 20 秒视频与原生音频", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/137.htm", "date": "2026-07-24T06:48:04.000Z", "summary": "Black Forest Labs 以 Early Access 方式推出 FLUX 3 多模态基础模型，采用统一架构联合学习图像、视频和音频。该模型基于 Self-Flow 学习框架扩展，可在单次生成中输出最长 20 秒视频并附带原生音频，支持文生视频、图生视频、多镜头串联等任务。", "type": "model", "relTime": "17小时前"}, {"id": 22, "title": "腾讯混元大语言模型与多模态团队合并，成立基础模型部由姚顺雨统一管理", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/121.htm", "date": "2026-07-24T06:19:25.000Z", "summary": "腾讯宣布混元多模态模型部门与大语言模型部门合并，成立基础模型部，由首席AI科学家姚顺雨统一管理。7月上线的Hy3大语言模型智能水平比肩参数规模2-5倍的旗舰模型，发布一周后总调用量较上一代Hy2增长超68倍。混元3D世界模型2.0（Hy World 2.0）已开源，支持文字、图片、视频输入生成3D世界，社区下载量超300万。", "type": "industry", "relTime": "17小时前"}, {"id": 23, "title": "Black Forest Labs 发布多模态模型 FLUX 3", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2080536654423478676", "date": "2026-07-24T06:12:47.000Z", "summary": "Black Forest Labs 推出了 FLUX 3，这是一个用于图像、视频、音频和动作预测的多模态模型。  > 在一个统一架构中联合训练，我们的模型可扩展用于预测机器人动作。  > FLUX 3 Video 现已开放早期访问（需通过表单申请）。", "type": "model", "relTime": "17小时前"}, {"id": 24, "title": "Google 推出\"自拍视频\"登录功能，用于账户恢复与二次验证", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://blog.google/innovation-and-ai/technology/safety-security/selfie-video-sign-in", "date": "2026-07-24T06:03:30.608Z", "summary": "Google 为 Google 账户新增\"自拍视频\"登录方式，用户可通过录制面部视频并完成简单头部动作来设置或验证身份。该功能主要用于账户锁定或无法使用常用设备时的恢复登录，视频经加密存储且用户可随时删除。Google 通过多层安全机制（包括活体检测与深度伪造防御）防止冒充。", "type": "paper", "relTime": "17小时前"}, {"id": 25, "title": "用百度 Unlimited-OCR 构建端到端高分辨率图像与多页 PDF 解析管线", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/07/23/how-to-build-an-end-to-end-ocr-pipeline-with-baidus-unlimited-ocr-for-high-resolution-images-and-multi-page-pdf-parsing", "date": "2026-07-24T05:16:28.000Z", "summary": "本教程构建了一套完整的 OCR 工作流，在 GPU 上加载百度 3B 参数的 Unlimited-OCR 视觉语言模型，支持 bfloat16/float16 自动选择。管线包含两种推理模式：Gundam 模式（分块高细节）和 Base 模式（单视图更快），并通过 PyMuPDF 和 infer_multi（） 扩展至多页 PDF 解析，全程保留长上下文生成、重复控制和结构化输出设置。", "type": "tip", "relTime": "18小时前"}, {"id": 26, "title": "PixVerse 推出 VibeMV：一键生成音乐视频", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2080503284733968552", "date": "2026-07-24T04:00:11.000Z", "summary": "想把任何歌曲变成音乐视频？VibeMV 现已上线！只需上传一首歌。选择一种风格。一键获得完成的音乐视频--无需拍摄或剪辑。15 种风格。角色一致性。唇形同步 + 歌词 RT + 关注 + 回复 = 私信中的 150 积分（仅限 72 小时）", "type": "paper", "relTime": "19小时前"}, {"id": 27, "title": "FLUX 3发布：多模态真实世界模型", "source": "X：邵猛 (@shao__meng)", "sourceUrl": "https://x.com/shao__meng/status/2080499451576377388", "date": "2026-07-24T03:44:57.000Z", "summary": "Black Forest Labs发布FLUX 3，定位为\"真实世界模型\"，而非单纯的文生图或文生视频模型。该模型将图像、视频、音频和语言纳入同一multimodal flow架构，通过模态间的互约束学习物理规律与因果线索。同一底座支持三条产品线：Video（最长20秒、原生音频）、Image（后续推出）和Action（动作预测，已用于FLUX-mimic机器人场景）。", "type": "model", "relTime": "20小时前"}, {"id": 28, "title": "马斯克：当前网络爆红的人形机器人演示都是远程遥控或剧本，Optimus 已投产并靠观察学习", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/070.htm", "date": "2026-07-24T03:44:04.000Z", "summary": "特斯拉 CEO 马斯克在 2026 财年第二财季电话会议上指出，当前网络爆红的人形机器人演示要么是剧本、要么是远程遥控，尚无任何一款机器人能真正完成通用任务。他同时宣布，Optimus 人形机器人已在美国加州弗里蒙特工厂投产，该机器人不依靠预先编程，而是通过观察环境视频和人类工作影像进行学习。", "type": "industry", "relTime": "20小时前"}, {"id": 29, "title": "公安部：上半年共侦办利用 AI 工具生成网络谣言案件 170 余起", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/044.htm", "date": "2026-07-24T03:25:03.000Z", "summary": "公安部通报，今年上半年共侦办利用人工智能工具生成网络谣言案件 170 余起，依法查处 190 余人。公安机关同时开展人工智能应用服务监督检查 600 余次，对相关服务提供者进行警告、责令整改、关停等行政执法 30 余次。国家反诈中心 App 已上线人工智能内容鉴定功能，可检测可疑视频、语音、图片中是否存在 AI 生成痕迹。", "type": "industry", "relTime": "20小时前"}, {"id": 30, "title": "Kimi K3与Claude Fable5成视频生成首选模型", "source": "X：Vista (@vista8)", "sourceUrl": "https://x.com/vista8/status/2080456617234227433", "date": "2026-07-24T00:54:45.000Z", "summary": "针对Hyperframe、remotion、manim生成的视频效果不佳的问题，建议改用Kimi K3或Claude Fable5模型。这些视频生成库依赖HTML页面渲染，而当前大模型前端审美能力最强的两个模型正是Kimi K3和Claude Fable5。", "type": "tip", "relTime": "22小时前"}, {"id": 31, "title": "橘子的AI播客工作流：录完即发", "source": "X：Vista (@vista8)", "sourceUrl": "https://x.com/vista8/status/2080439916203548806", "date": "2026-07-23T23:48:23.000Z", "summary": "橘子分享了一套高效播客工作流：用Cola语音输入话题并提炼要点，用剪映录制并开启降噪、人声美化，导出后由Cola生成Shownotes即可上传。同时发布了5个AI Skill，包括视频剪辑、前端设计、AI PRD生成、Goal指令生成和服务器部署，均通过\\`npx skills add\\`安装。", "type": "tip", "relTime": "1天前"}, {"id": 32, "title": "FLUX 3 统一图像视频音频与机器人动作预测", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2080431253744968087", "date": "2026-07-23T23:13:58.000Z", "summary": "Black Forest Labs 发布 FLUX 3，一个统一多模态 backbone，同时处理图像生成、视频、原生音频，并扩展至机器人动作预测。视频已开放 early access，后续将开放权重，并已与 mimic、Audi 合作在真实机器人上测试。该模型旨在证明物理世界智能与内容创作可共享同一套视觉基础模型。", "type": "model", "relTime": "1天前"}, {"id": 33, "title": "Palmier Pro：专为 AI 打造的开源 macOS 视频编辑器", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://github.com/palmier-io/palmier-pro", "date": "2026-07-23T22:35:30.175Z", "summary": "Palmier Pro 是一款开源的 macOS 视频编辑器，专为 AI 工作流设计。它支持基于时间轴的视频编辑，并集成了 AI 功能以加速剪辑、生成字幕或处理素材。该项目已在 GitHub 上发布，面向开发者与视频创作者开放。", "type": "model", "relTime": "1天前"}, {"id": 34, "title": "FLUX 3 统一模型赋能机器人学习", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2080421078309175699", "date": "2026-07-23T22:33:32.000Z", "summary": "Black Forest Labs 发布 FLUX 3，一个统一处理图像、视频、音频和动作预测的多模态模型。其视频骨干网络通过大规模视频预训练学习物体运动、接触变形和时间因果，使机器人无需从零学习物理规律。基于 Self-Flow 架构，FLUX 3 能让机器人用约一半的微调数据学会任务，此前实验显示可减少高达 10 倍的训练数据。", "type": "tip", "relTime": "1天前"}, {"id": 35, "title": "Sonilo 发布 Sound Effects 1.0 视频原生音频模型", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2080415397866606809", "date": "2026-07-23T22:10:57.000Z", "summary": "Sonilo 推出 Sound Effects 1.0，一个视频原生音频模型，能读取画面运动、场景和节奏生成同步音效。该模型支持无需提示词的自动视频转音效，以及从文字描述生成独立音频。在对比基准测试中，Sonilo 在音乐和音效上均超越领先模型。", "type": "model", "relTime": "1天前"}, {"id": 36, "title": "AegisAI获3600万美元A轮融资，用AI智能体检测AI驱动的鱼叉式钓鱼攻击", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/23/aegisai-founded-by-former-google-security-execs-lands-36m-to-stop-ai-driven-spear-phishing", "date": "2026-07-23T18:38:34.000Z", "summary": "由前Google安全高管创立的AegisAI完成3600万美元A轮融资，累计融资4900万美元。该公司开发AI智能体，通过分析邮件细微异常来检测AI生成的鱼叉式钓鱼攻击，已获包括Mash、LangChain在内的数十家客户采用。", "type": "industry", "relTime": "1天前"}, {"id": 37, "title": "Black Forest Labs 发布 Flux 3：可生成带原生音频的 20 秒视频，并推出机器人动作模型 Flux-mimic", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/flux-3-generates-videos-with-native-audio-up-to-20-seconds-long-a-first-for-black-forest-labs", "date": "2026-07-23T18:03:01.000Z", "summary": "德国 AI 公司 Black Forest Labs 发布多模态基础模型 Flux 3，可同时从图像、视频和音频中学习，首次支持生成带原生音频、最长 20 秒的视频。", "type": "model", "relTime": "1天前"}, {"id": 38, "title": "Runway 推出首款生成媒体优化路由", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2080343130780655635", "date": "2026-07-23T17:23:47.000Z", "summary": "推出 Runway Media Router。  首个面向生成媒体的偏好优化路由。无需为每次请求手动挑选模型，你只需一次性定义\"最佳\"的标准--成本、质量或延迟--路由便会自动选择合适的视频、图像或音频模型。  现已上线 Runway Dev。", "type": "model", "relTime": "1天前"}, {"id": 39, "title": "Grok 凭代码口喷生成 4K 视频", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2080341822686015683", "date": "2026-07-23T17:18:36.000Z", "summary": "用户仅将一篇文章喂给 Grok，并让其制作 AI 预测底层逻辑视频，Grok 直接通过纯代码口喷一口气生成 4K 高清视频。整个过程无需额外工具或复杂操作，展示了 Grok 强大的代码生成与视频制作能力。", "type": "tip", "relTime": "1天前"}, {"id": 40, "title": "Runway 推出 Media Router，为生成式媒体自动选择最佳模型", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/23/runway-bets-on-ai-model-routing-as-generative-media-gets-crowded", "date": "2026-07-23T17:07:35.000Z", "summary": "Runway 通过其开发者平台 Runway Dev 推出 Media Router，该工具可根据开发者对质量、速度或成本的优先级，自动为图像、视频和音频生成请求选择最佳模型。Runway 称这是首个专为生成式媒体打造的模型路由器，其智能层基于内部创意团队对各类媒体输出的评估经验。此举标志着 Runway 从 AI 视频初创公司向生成式媒体基础设施层转型。", "type": "model", "relTime": "1天前"}, {"id": 41, "title": "FLUX 3 统一多模态，视频已开放早期访问", "source": "X：Emad Mostaque (@EMostaque)", "sourceUrl": "https://x.com/EMostaque/status/2080326079131128056", "date": "2026-07-23T16:16:02.000Z", "summary": "Black Forest Labs 发布 FLUX 3，一个统一架构的多模态模型，支持图像、视频、音频和动作预测。FLUX 3 Video 现已开放早期访问，模型还可扩展用于机器人动作预测。", "type": "model", "relTime": "1天前"}, {"id": 42, "title": "社区将Kimi视觉编码器接入GLM 5.2，开源视觉版模型", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2080319812232941631", "date": "2026-07-23T15:51:08.000Z", "summary": "开发者将Kimi的MoonViT视觉编码器挂载到GLM 5.2上，组装出可用的视觉版本，并开源了NVFP4量化权重。该模型并非官方联合训练的多模态模型，而是将不同团队的视觉编码器与语言模型硬接，证明了\"插件式\"组装已具备实用效果。", "type": "model", "relTime": "1天前"}, {"id": 43, "title": "Flux 3 视频生成达前沿水平，支持音频与机器人动作预测", "source": "X：Deedy Das (@deedydas)", "sourceUrl": "https://x.com/deedydas/status/2080318330913869943", "date": "2026-07-23T15:45:15.000Z", "summary": "Black Forest Labs 发布 Flux 3，一个统一架构的多模态模型，覆盖图像、视频、音频和动作预测。其视频生成能力达到 Seedance 2 / Gemini Omni 级别，可生成约 20 秒带音频的视频，并已开放早期访问。Flux 3 还可扩展用于机器人动作预测，是当前唯一达到视频生成前沿水平的初创公司。", "type": "model", "relTime": "1天前"}, {"id": 44, "title": "Black Forest Labs 发布开源 Flux 3 视频模型", "source": "X：歸藏 (@op7418)", "sourceUrl": "https://x.com/op7418/status/2080317863400030312", "date": "2026-07-23T15:43:23.000Z", "summary": "Black Forest Labs 发布并开源 Flux 3 视频生成模型，支持文生视频、图生视频、视频参考生成、视频与音频延长、关键帧控制及智能剪辑等功能。Flux 3 Dev 模型已开放早期访问申请，API 将在未来几周开放，随后发布开源版本。", "type": "model", "relTime": "1天前"}, {"id": 45, "title": "Luma AI 生成服装自主决策视频", "source": "X：Luma AI (@LumaLabsAI)", "sourceUrl": "https://x.com/LumaLabsAI/status/2080287018135810315", "date": "2026-07-23T13:40:49.000Z", "summary": "穿得足够张扬，服装就会开始自己做决定。 由 Shan ul Haq 创作。使用 Luma 制作。", "type": "tip", "relTime": "1天前"}, {"id": 46, "title": "实测多模型IMO 2026满分，Qwen3.8-Max等三模型一次性通过", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2080283187721503170", "date": "2026-07-23T13:25:36.000Z", "summary": "博主实测GPT-SOL-5.6-High、Qwen3.8-Max-Preview、KIMI K3三个模型在IMO 2026大赛中均获满分42分，一次性解决全部6道题目。速度排序：GPT-SOL-5.6-High用时14分58秒，Qwen3.8-Max-Preview用时45分钟，Kimi K3用时1小时32分6秒。去年仅两个模型勉强得35分，今年多个主流模型已能稳定一次通过IMO。", "type": "tip", "relTime": "1天前"}, {"id": 47, "title": "马斯克：特斯拉 AI 投资越快越好，不怕部分资金浪费", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/828.htm", "date": "2026-07-23T12:14:39.000Z", "summary": "特斯拉 CEO 马斯克要求公司加快 AI 投资节奏，即使部分资金被浪费也在所不惜。特斯拉第二季度资本支出同比大增 142% 至 58 亿美元，自由现金流净流出 11 亿美元，为 2024 年以来首次转负。公司预计全年资本支出超 250 亿美元，并寻求最高 300 亿美元的借款能力以支撑 AI 算力、Cybercab 自动驾驶出租车和 Optimus 人形机器人等项目建设。", "type": "industry", "relTime": "1天前"}, {"id": 48, "title": "FLUX 3 全模态模型预告，支持 20 秒视频生成", "source": "X：歸藏 (@op7418)", "sourceUrl": "https://x.com/op7418/status/2080264515682496991", "date": "2026-07-23T12:11:24.000Z", "summary": "黑森林工作室短暂上线 FLUX 3 预告，该模型支持图像、视频、音频和动作生成，是一个全模态生成模型，单条视频可一次生成 20 秒。按惯例该模型可能开源，若开源将利好整个生态。", "type": "model", "relTime": "1天前"}, {"id": 49, "title": "2026 美团低空经济与具身智能挑战赛启动，总奖金 55 万元", "source": "公众号：龙猫LongCat（美团）", "sourceUrl": "https://mp.weixin.qq.com/s/P5YmxTk3il67UOfh4queiw", "date": "2026-07-23T11:58:00.000Z", "summary": "2026 年第四届美团低空经济与具身智能挑战赛启动报名，面向全球高校在校学生，总奖金 55 万元。赛事以无人机换电任务为原型，考察机器人在视觉识别、运动规划、精准操作等方面的综合能力，参赛设备形态不限。初赛需提交机器人演示视频与技术报告，决赛为线下实机挑战，表现优异者可获美团无人机实习机会及\"北斗计划\"直通面试权。", "type": "industry", "relTime": "1天前"}, {"id": 50, "title": "腾讯设计Agent\"设计妙境 Miora\"上线，可完成品牌全案设计", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s/wTI00g8lar2eLSgXAFAgBQ", "date": "2026-07-23T11:47:01.000Z", "summary": "腾讯推出首个设计Agent\"设计妙境 Miora\"，覆盖品牌设计、电商广告、3D建模、App UI、TVC等13个场景。Miora具备记忆功能，能持续记住用户审美偏好，并支持将完整流程保存为可复用的Skill。实测中，Miora从Logo、品牌手册到产品外观、包装、IP周边、45平方米体验店、配套App、电商详情页及30秒TVC和带货视频，全流程自主生成。", "type": "product", "relTime": "1天前"}, {"id": 51, "title": "谷歌推出\"自拍视频\"功能，允许用户通过自拍视频登录和恢复账号", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/806.htm", "date": "2026-07-23T10:48:47.000Z", "summary": "谷歌推出\"自拍视频（Selfie Video）\"功能，允许用户提前录制一段包含指定头部动作的短视频，在无法使用传统方式时通过人脸匹配和活体检测验证身份，以恢复账号访问权限。该功能从今天起陆续开放，暂不支持 Google Workspace 企业账号、儿童账号及高级保护计划账号。自拍视频存储时经过加密，用户可随时删除，并可自行决定是否授权谷歌使用视频数据改进身份验证技术。", "type": "paper", "relTime": "1天前"}, {"id": 52, "title": "阿里云WAIC AI视频创作赛获奖作品发布", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2080226902942630348", "date": "2026-07-23T09:41:57.000Z", "summary": "作为 WAIC 的一部分，阿里云自豪地主办了一场 AI 视频创作者马拉松，汇聚创作者共同探索 AI 短片的边界。  我们很高兴分享首个获奖作品--完全使用我们的 AI 视频生成模型 Happyhorse 制作。其卓越的一致性和细节有力地证明了当今 AI 工具所能实现的可能。", "type": "industry", "relTime": "1天前"}, {"id": 53, "title": "荣耀官宣全球首款机器人手机 Robot Phone，8 月见", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/754.htm", "date": "2026-07-23T09:41:13.000Z", "summary": "荣耀今日宣布全球首款机器人手机--荣耀 Robot Phone 将于 8 月发布，宣称\"打破手机固有形态\"。该机搭载第五代骁龙 8 至尊版芯片，机身顶部集成行业最小的四自由度钛合金机械云台系统，体积比主流方案缩小 70%。荣耀 Robot Phone 还将首发新一代伙伴型多模态智能体操作系统 AgenticOS 的内核。", "type": "paper", "relTime": "1天前"}, {"id": 54, "title": "Dreamina Seedance 2.0 4K 生成 13 分钟科幻短片", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2080218848087679199", "date": "2026-07-23T09:09:56.000Z", "summary": "Dreamina Seedance 2.0 4K 已能生成生产级视频。导演 Neill Blomkamp 用该工具纯文本生成了 13 分钟科幻恐怖短片《Nightborne》，每帧均由提示词驱动，并使用了 32 人的授权肖像与声音。Blomkamp 称这是长片测试，并预期 Seedance 2.5 将带来质的飞跃。", "type": "tip", "relTime": "1天前"}, {"id": 55, "title": "阿里云发布Qwen-Image-3.0：主打\"真实\"的图像生成模型", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2080218126264778781", "date": "2026-07-23T09:07:04.000Z", "summary": "阿里云推出第三代图像生成基础模型Qwen-Image-3.0，核心关键词为\"真实\"。该模型支持4.5k token长提示词，可一次性生成复杂版面（如报纸、考卷、3×3信息图），文字清晰至10px，并支持12种语言原生渲染、100+艺术风格及实时网络检索。", "type": "model", "relTime": "1天前"}, {"id": 56, "title": "特斯拉 App 代码暗示已开始为 Optimus 人形机器人上线做准备", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/629.htm", "date": "2026-07-23T07:08:36.000Z", "summary": "特斯拉手机 App 中首次出现多项与 Optimus 项目相关的代码，包括专门面向机器人的蓝牙低功耗（BLE）身份认证机制，以及适用于家庭场景的数据采集功能。用户可将手机添加至机器人设备授权白名单，只有经过授权的设备才能与 Optimus 通信和控制。未来 Optimus 执行家务任务时，App 将弹出页面征求用户授权，采集视频和空间环境数据用于优化智能模型。", "type": "industry", "relTime": "1天前"}, {"id": 57, "title": "荣耀发布全新品牌标识\"荣耀之环\"及主张\"敢想，敢不同\"，阿尔法战略508天后公布Robot Phone等进展", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/627.htm", "date": "2026-07-23T07:01:35.000Z", "summary": "荣耀终端CEO李健今日正式揭晓全新品牌图形标识\"荣耀之环\"及品牌主张\"敢想，敢不同\"。508天前开启的阿尔法战略已取得进展：打造了荣耀Robot Phone，使智能体手机迈向三维物理世界；在具身智能领域推出机器人闪电和元气仔，超越人类半马世界纪录；并与阿莱展开影像战略合作。", "type": "industry", "relTime": "1天前"}, {"id": 58, "title": "Grok Build v0.2.111 更新：开发者控制增强", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2080170228554903796", "date": "2026-07-23T05:56:44.000Z", "summary": "xAI 发布 Grok Build v0.2.111 更新，开发者现可通过 config.toml 或环境变量禁用图像与视频生成工具。新版本在 TUI 内直接支持 \\`grok doctor fix\\` 诊断命令，\\`/session-info\\` 可显示 OAuth 或 API key 账户信息。此外修复了多项会话可靠性问题，并降低了 macOS 语音模式的显存占用。", "type": "product", "relTime": "1天前"}, {"id": 59, "title": "DeepSeek 梁文锋：产品是AGI副产品，代码与通用Agent优先", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2080160617667985438", "date": "2026-07-23T05:18:33.000Z", "summary": "DeepSeek 创始人梁文锋在投资者会议上阐述其核心原则：产品只是通往 AGI 路上的副产品，当前不以营收为重心；3D/视频生成及世界模型不在主计划内，多模态仅作为产品组件而非核心智能。公司优先投入代码与通用 AI 智能体，行业专用智能体可暂缓，模型幻觉被视为长期产品问题而非当前重点。", "type": "tip", "relTime": "1天前"}, {"id": 60, "title": "马斯克宣布用 AI 工具 Grok Imagine 拍摄《奥德赛》长篇电影，全白人班底确保\"符合史实\"", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/391.htm", "date": "2026-07-23T01:37:04.000Z", "summary": "埃隆·马斯克在 X 上表示，计划在 2026 年底前用自家 AI 视频生成工具 Grok Imagine 制作一部完整的《奥德赛》长篇电影。他称影片将\"符合史实，并忠于荷马的艺术作品\"，并转发了一段 AI 生成的场景视频。马斯克未公布具体制作方式、影片时长或 Grok Imagine 如何维持长片一致性等细节。", "type": "industry", "relTime": "1天前"}, {"id": 61, "title": "Muse Spark 1.1 3D游戏生成成本仅为Gemini 3.6三分之一", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2080086690660851837", "date": "2026-07-23T00:24:47.000Z", "summary": "Meta的Muse Spark 1.1在生成自运行3D街机游戏任务中，以31.3K token、0.026美元的成本击败Gemini 3.6（28.8K token、0.073美元），成本仅为后者三分之一。Muse Spark 1.1完美生成了台球、冰球和桌上足球三款游戏，细节丰富；而Gemini 3.6的冰球出现故障，桌上足球则卡顿成静态画面。", "type": "tip", "relTime": "1天前"}, {"id": 62, "title": "SANA-Video 2.0：混合线性注意力与注意力残差实现高效视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21553", "date": "2026-07-23T00:00:00.000Z", "summary": "SANA-Video 2.0 是一个混合视频扩散 Transformer，提供 5B 和 14B 两种规模，可在单 GPU 上生成最高 720p 视频。其 Hybrid Linear-Softmax Attention 以 3：1 比例混合线性与 softmax 注意力，配合 Block Attention Residuals 将深层有效秩提升约 12%。", "type": "paper", "relTime": "1天前"}, {"id": 63, "title": "从视频中自监督学习结构化动态：SDM 模型分离相机与物体运动", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21576", "date": "2026-07-23T00:00:00.000Z", "summary": "研究提出结构化动态模型（SDM），通过未来特征预测从冻结的预训练图像 Transformer 特征中显式分离视频中的主运动（相机运动）与残余动态（物体运动）。训练结合真实视频自监督学习与合成 Kubric 数据的弱监督。在 ProbeMotion 评测集上，SDM 优于使用全局 CLS 或平均池化特征的基线，并在多项任务上媲美强监督的 VGGT 表示。", "type": "paper", "relTime": "1天前"}, {"id": 64, "title": "VCSD：视觉对比自蒸馏", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21556", "date": "2026-07-23T00:00:00.000Z", "summary": "杜克大学和MBZUAI提出VCSD，通过对比同一EMA教师模型在原始图像与内容擦除条件下的token级log-probability差异，构建纯输入条件驱动的自蒸馏不对称信号。在ViRL39K数据集上，VCSD在Qwen3-VL和Qwen3.5模型（2B至9B）的七个视觉语言基准测试中一致优于匹配的on-policy自蒸馏方法，且无需外部教师、特权答案或额外推理成本。", "type": "paper", "relTime": "1天前"}, {"id": 65, "title": "Recurrent Sinusoidal INRs：循环正弦隐式神经表示实现高效高保真图像与3D重建", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21485", "date": "2026-07-23T00:00:00.000Z", "summary": "一项研究提出循环正弦隐式神经表示（INRs）架构，通过共享正弦块迭代细化潜在表示来丰富谐波频谱。在RGB图像基准上，该方法以更少的参数和优化步骤实现了比前馈基线更高的保真度，并有效迁移至超分辨率、NeRF和SDF任务。", "type": "paper", "relTime": "1天前"}, {"id": 66, "title": "ProVisE：在生成像素中评估空间认知而非LLM文本", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21072", "date": "2026-07-23T00:00:00.000Z", "summary": "研究者提出ProVisE框架，让图像生成模型输出协议约束的视觉答案，并解析为结构化预测以兼容原有评测指标。同时发布SpatialGen-Bench，含470个样本、14项空间子任务和四个能力层级。评估显示，图像生成模型在像素空间任务上有竞争力，而文本输出VLM在组合空间推理上仍占优势。", "type": "paper", "relTime": "1天前"}, {"id": 67, "title": "WorldWeaver：流式多智能体扩散模型引入世界状态寄存器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21594", "date": "2026-07-23T00:00:00.000Z", "summary": "WorldWeaver 提出一种流式多智能体视频扩散模型，通过可学习的\"世界状态寄存器\"token 在生成过程中跨智能体持久化并动态更新共享世界信息。该寄存器融合了智能体状态、鸟瞰视图和场景文本等多重监督信号，并采用 Mixture-of-Transformers 架构分离世界状态建模与视觉帧生成的权重。", "type": "paper", "relTime": "1天前"}, {"id": 68, "title": "TableVerse：面向通用机器人操作的百万级真实桌面场景数据集", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21017", "date": "2026-07-23T00:00:00.000Z", "summary": "TableVerse 提出全自动 Real2Sim 管线，将非结构化网络图像直接转化为高保真、可物理仿真的桌面环境，并自动合成无碰撞的抓取轨迹。基于该管线构建的 TableVerse-100K 数据集包含 10 万个物理一致的交互场景、近 100 万个独立物体实例和超过 3.5 万个语义类别，为通用机器人操作策略学习提供大规模数据基础。", "type": "paper", "relTime": "1天前"}, {"id": 69, "title": "GraphVid：基于交互图的可控视频生成模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21580", "date": "2026-07-23T00:00:00.000Z", "summary": "GraphVid 是一种图条件图像到视频生成模型，通过结构化交互图实现对多主体的灵活精确控制。相比 Motion-I2V，GraphVid 在 FID 上降低 39.9%、FVD 降低 37.6%，PSNR 从 9.87 提升至 15.98、SSIM 从 0.38 提升至 0.61，且训练数据和参数更少。配套发布的 GraphVid-Bench 数据集为交互感知视频生成提供了大规模结构化关系标注。", "type": "paper", "relTime": "1天前"}, {"id": 70, "title": "Qwen-Image-3.0 发布：主打\"真实\"与细腻人像", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2080074549761028386", "date": "2026-07-22T23:36:33.000Z", "summary": "阿里通义千问发布第三代图像生成模型 Qwen-Image-3.0，核心关键词为\"实\"。模型支持 4.5k token 提示词，可一次生成复杂排版（报纸、试卷、3×3 信息图），文字清晰度达 10px，并具备 12 种语言原生渲染与实时网页检索能力。博主 Berry Xia 实测认为其人像和古典美学表现非常符合国人审美。", "type": "model", "relTime": "2天前"}, {"id": 71, "title": "马斯克：Optimus 将是史上最大产品，量产难度极高", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2080065417473905040", "date": "2026-07-22T23:00:15.000Z", "summary": "马斯克称，Optimus 人形机器人将成为史上最大产品，但实现无需编程、仅靠指令或视频即可执行任务的自主机器人是前所未有的难题。机器人需具备极高灵巧性、可靠性及耐用性，而特斯拉需从零建立供应链，所有部件均为全新设计，量产爬坡难度远超以往任何产品。", "type": "tip", "relTime": "2天前"}, {"id": 72, "title": "梁文锋投资人会议语录：AGI路线图与持续学习", "source": "X：Oran Ge (@oran_ge)", "sourceUrl": "https://x.com/oran_ge/status/2080050390868119750", "date": "2026-07-22T22:00:33.000Z", "summary": "梁文锋在投资人会议上阐述 DeepSeek 的 AGI 路线图，认为当前阶段最重要的是 Coding Agent，而多模态、3D 生成等并非智能核心。他指出下一代模型必须具备持续学习能力，这是实现 AGI 的关键阶梯。DeepSeek 坚持低利润、开源与克制战略，认为中国 AI 的差距主要在资源而非人才，并预测国内模型公司最终将收敛至两三家。", "type": "tip", "relTime": "2天前"}, {"id": 73, "title": "Grok Build 上线，可调用 Grok 4.5 构建 3D 场景", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2080049853036728541", "date": "2026-07-22T21:58:25.000Z", "summary": "Elon Musk 宣布推出 Grok Build，用户可通过该工具在终端中调用 Grok 4.5 模型。开发者 Daniel Farinax 利用 Grok Build 安装了 Unity 免费 CLI，成功构建 3D 场景并导出视频，还在同一会话中创建了可玩的 macOS 岛屿探索游戏。Unity CLI 支持 MCP 模式且免费，无并发限制。", "type": "model", "relTime": "2天前"}, {"id": 74, "title": "七款前沿模型\"鹈鹕骑自行车\"基准测试未发现针对性优化", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://dylancastillo.co/posts/pelicanmaxxing.html", "date": "2026-07-22T19:39:51.177Z", "summary": "一项针对GPT-5.6 Terra等七款模型的对比实验显示，这些模型在\"鹈鹕骑自行车\"这一知名非正式基准测试上并未表现出针对性优化。研究者生成1，008张SVG图像，经评分发现鹈鹕在8种动物中排名第6，自行车在6种交通工具中排名第5，两者组合在48个提示中仅列第42位。", "type": "tip", "relTime": "2天前"}, {"id": 75, "title": "Monday.com 裁员数百人，聚焦 AI 工作平台", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/22/monday-com-lays-off-hundreds-to-focuses-on-ai", "date": "2026-07-22T17:54:14.000Z", "summary": "以色列办公软件公司 Monday.com 宣布裁员约 630 人（占员工总数 20%），以支持更精简的运营模式，并将投资重心转向 AI 项目。其 AI Work Platform 目前包含无代码应用构建器、可定制 AI 智能体、工作流自动化工具及能生成报告、更新仪表盘的聊天机器人。公司预计此次重组将产生 4500 万至 5500 万美元的费用。", "type": "industry", "relTime": "2天前"}, {"id": 76, "title": "梁文锋四小时投资人会议实录：DeepSeek 的克制战略与 AGI 路线图", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/elsewhere/wenfeng-liangs-four-hour-investor-meeting-full-transcript", "date": "2026-07-22T15:33:15.000Z", "summary": "DeepSeek 创始人梁文锋在投资人会议上明确表示，公司主线只有 AGI，不做 3D、视频生成、世界模型或下一个超级 App，并坚持开源与合理定价。他认为模型竞争的核心是成本、时间与用户体验，而保持团队稳定性是做成 AGI 的关键。梁文锋称，DeepSeek 离彻底转向商业化仍很遥远，开源与克制是增加 AGI 成功概率的战略选择。", "type": "tip", "relTime": "2天前"}, {"id": 77, "title": "可灵 MCP 教程：快速打造电影级 AI 表演", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2079944555718435124", "date": "2026-07-22T15:00:00.000Z", "summary": "可灵 MCP 教程：几分钟内打造电影级 AI 表演  了解如何使用可灵 MCP 在你喜爱的智能体中构建完整的创意工作流--从角色创建、情感设计到批量视频生成。  你的下一个故事从这里开始。", "type": "tip", "relTime": "2天前"}, {"id": 78, "title": "Grok 4.5 纯代码生成视频，速度质量碾压", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2079933815984689564", "date": "2026-07-22T14:17:19.000Z", "summary": "用户实测 Grok 4.5 纯代码生成视频，速度快、质量高、成本低，一次生成即输出 MP4 格式，效果媲美 Claude Code。将文章内容喂给模型后几分钟内自动完成，认为打磨后效果更惊人。", "type": "tip", "relTime": "2天前"}, {"id": 79, "title": "实测Qwen-Image-3.0：19大场景挑战GPT Image2，中文长文本与多图融合表现亮眼", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s/PnXGmmDYejrHBSpoRBOHkg", "date": "2026-07-22T12:34:24.000Z", "summary": "Qwen-Image-3.0上线，支持最高4.5k token输入、12种语言、20多种字体，以及多图融合、图中图和图片编辑。实测显示，其在中文长文本生成、多语言混合排版、UI设计、多图融合与图片编辑等19个场景中均能稳定输出，文字不崩且信息对应准确，图片质量已能与GPT Image2媲美。该模型在国内可直接使用，速度快且价格不贵。", "type": "tip", "relTime": "2天前"}, {"id": 80, "title": "通义千问发布Qwen-Image-3.0：主打\"真实\"的第三代图像生成模型", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2079906336381509659", "date": "2026-07-22T12:28:08.000Z", "summary": "通义千问发布第三代图像生成模型Qwen-Image-3.0，核心关键词为\"真实\"。模型支持最长4.5k token的提示词，可一次性生成复杂布局（如报纸、试卷、3×3信息图），并能渲染10px级文字、完整LaTeX论文页面及逼真皮肤纹理。它还支持12种语言、100多种艺术风格，并具备实时网络检索能力，旨在成为设计、教育等领域的实用生产力工具。", "type": "paper", "relTime": "2天前"}, {"id": 81, "title": "Luma AI 生成舞者悲伤舞台表演视频", "source": "X：Luma AI (@LumaLabsAI)", "sourceUrl": "https://x.com/LumaLabsAI/status/2079899268492743050", "date": "2026-07-22T12:00:02.000Z", "summary": "一位舞者，一个绿色舞台，一场充满悲伤的表演。随后舞台消失，雪花飘入，情感扑面而来。作者：Dinda Prasetyo。使用 Luma 制作。", "type": "industry", "relTime": "2天前"}, {"id": 82, "title": "Meta 推出 AI 检测系统 Content Seal，但可用性不及 Google 的 SynthID", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/968680/meta-ai-detection-labeling-content-seal-watermarks-synthid", "date": "2026-07-22T11:00:00.000Z", "summary": "Meta 于 7 月推出 Content Seal，为旗下 Muse 模型生成的图像添加不可见水印，但用户目前仅能通过专用网页工具检测，且不支持视频和旧模型。与 Google 已向 OpenAI 开放的 SynthID 相比，Content Seal 功能相似但可用性更差，Meta 也未将检测能力集成到 Meta AI 聊天机器人中。", "type": "tip", "relTime": "2天前"}, {"id": 83, "title": "16岁少年造出仿生海龟机器人，AI识别微塑料准确率达94%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/247.htm", "date": "2026-07-22T10:10:00.000Z", "summary": "16岁的埃文·巴兹（Evan Budz）设计并制造了一款自主海龟机器人，搭载水下三维全息成像系统和自训练的AI模型，能以94%的准确率区分水体中的微塑料和其他微小颗粒。该机器人在2026年Regeneron国际科学与工程大奖赛（ISEF）上获得5万美元奖学金。巴兹表示，该系统可直接在水中完成检测，无需将样本送回实验室，旨在让微塑料检测更快、更普及。", "type": "tip", "relTime": "2天前"}, {"id": 84, "title": "小红书开源 BigMac：多模态大模型训练新范式", "source": "公众号：小红书技术（dots.llm）", "sourceUrl": "https://mp.weixin.qq.com/s/tNJARtn1jIayL5URg87Row", "date": "2026-07-22T10:04:51.000Z", "summary": "小红书技术团队开源 BigMac，一种针对多模态大模型训练的依赖安全嵌套流水线新范式。它以 LLM 流水线为主干，在不打乱执行顺序的前提下嵌入编码器和生成器计算，相比基线实现 1.08x-1.9x 加速，同时保持激活显存有界。BigMac 已作为 dots 多模态模型训练的核心组件投入生产。", "type": "model", "relTime": "2天前"}, {"id": 85, "title": "面壁智能与吉利联合发布具身智能体框架 RoboHarness", "source": "公众号：面壁智能（MiniCPM）", "sourceUrl": "https://mp.weixin.qq.com/s/nHoaGWCusQt6WQ1xmR_W3g", "date": "2026-07-22T09:55:25.000Z", "summary": "面壁智能与吉利人工智能中心在 WAIC 2026 联合发布具身智能体框架 RoboHarness，基于 EmbodiedClaw 开发，集成 VLM 与 VLA 模型。该框架已在吉利生产仓储场景实现常态化作业，支持自主决策与失败重试，并依托吉利星睿智算中心（23.5 EFLOPS）训练。", "type": "model", "relTime": "2天前"}, {"id": 86, "title": "英伟达推出 SVD 服务，识别 AI 生成视频准确率最高达 92%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/086.htm", "date": "2026-07-22T07:50:33.000Z", "summary": "英伟达发布合成视频检测器（SVD）服务，识别 AI 生成视频的准确率最高达 92%。该服务已整合到 NIM 中，通过逐帧分析视频，利用 Meta 的 DINOv2 和 DINOv3 模型为每帧打分，最终生成百分制评分。在 Nvidia RTX GPU 上处理一段 1080p 视频仅需 22 毫秒，50% 压缩率下仍能维持 82% 准确率。", "type": "model", "relTime": "2天前"}, {"id": 87, "title": "生数科技骆怡航：通用世界模型是连接数字与物理智能的关键基础设施", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s/KCCnHyK3My9lJrK9T-blQQ", "date": "2026-07-22T07:16:42.000Z", "summary": "生数科技联合创始人骆怡航在WAIC 2026提出，通用世界模型需像大语言模型一样建立统一基座，实现感知、预测与行动的闭环。公司围绕该基座构建\"一体两翼\"产品体系：Vidu Q系列面向数字内容生成，Vidu S系列推动实时交互，Motubrain面向物理世界机器人控制。世界模型正从学术研究走向产业中心，成为AI理解并行动于真实世界的关键路径。", "type": "tip", "relTime": "2天前"}, {"id": 88, "title": "Substack 导入 AI 检测工具 Pangram：用户可了解内容 AI 生成比例", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/040.htm", "date": "2026-07-22T07:02:02.000Z", "summary": "独立创作者平台 Substack 导入 AI 检测工具 Pangram，读者可借此了解平台内容中真人创作与 AI 辅助撰写的比例。Substack 指出，真正的问题在于 AI 生成内容被伪装为人类创作，并将此现象称为\"Claudefishing\"。平台还推出了创作过程说明、发布前 Pangram 审核等工具，并考虑提供回复与推荐内容的 AI 偏好设置。", "type": "paper", "relTime": "2天前"}, {"id": 89, "title": "腾讯设计Agent Miora全量上线，支持品牌VI与多模型", "source": "X：卡兹克 (@Khazix0918)", "sourceUrl": "https://x.com/Khazix0918/status/2079823300466012438", "date": "2026-07-22T06:58:10.000Z", "summary": "腾讯设计Agent平台Miora正式全量开放，无需邀请码。它提供品牌设计、影视创意、电商广告、互动游戏、网页应用五大场景模式，内置Skill模板和画板编辑功能。Agent底模分Standard/Pro/Max三档，可调用GPT-image、Seedance、可灵等多模态模型，支持框选编辑、文字替换及自定义Skill发布。", "type": "tip", "relTime": "2天前"}, {"id": 90, "title": "AI游戏《奥德赛》成本仅为诺兰电影的百万分之一", "source": "X：Vista (@vista8)", "sourceUrl": "https://x.com/vista8/status/2079793236231774617", "date": "2026-07-22T04:58:42.000Z", "summary": "创作者用Yoroll平台花费约250美元、2天时间，将《奥德赛》改编成40分钟可玩的AI互动剧情游戏。相比诺兰2.5亿美元的电影制作成本，百万倍的成本差距正改变内容创作的门槛。游戏支持对话式选择生成不同剧情走向，画面宏大，适合边玩边学英语。", "type": "paper", "relTime": "2天前"}, {"id": 91, "title": "用 GPT-5.6、Claude、Gemini 和 Grok \"绘制\"《蒙娜丽莎》--AI 图像生成能力实测", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.tryai.dev/blog/ai-drawing-arena-colored-pencils-claude-gpt-grok", "date": "2026-07-22T04:52:13.376Z", "summary": "开发者使用 GPT-5.6、Claude、Gemini 和 Grok 分别尝试\"绘制\"《蒙娜丽莎》，对比各模型的图像生成效果。测试展示了不同 AI 在艺术风格还原、细节处理上的差异，GPT-5.6 在构图准确性上表现突出，而 Claude 和 Gemini 各有侧重。该实验为评估多模态模型的视觉创作能力提供了直观参考。", "type": "tip", "relTime": "2天前"}, {"id": 92, "title": "商汤 SenseNova-Vision 开源统一视觉模型", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2079784489199518131", "date": "2026-07-22T04:23:57.000Z", "summary": "商汤发布 SenseNova-Vision，一个通过自然语言提示词即可完成检测、分割、深度估计、OCR、3D 重建等多项视觉任务的统一模型，无需串联多个专用工具。该模型在关键基准上超越近期统一视觉方案，并已完全开源（权重、数据、代码、Demo、论文）。", "type": "paper", "relTime": "2天前"}, {"id": 93, "title": "通义发布 Qwen-Image-3.0，支持多语言与复杂指令渲染", "source": "X：小互 (@xiaohu)", "sourceUrl": "https://x.com/xiaohu/status/2079762971123953976", "date": "2026-07-22T02:58:27.000Z", "summary": "通义千问发布 Qwen-Image-3.0 图像生成模型。该模型支持 12 国语言原生渲染、100+ 艺术风格，并能根据 4.5k token 的复杂指令一次性生成九张信息图或一整版报纸。它还具备网页、游戏、直播界面仿真能力，并可联网获取最新世界知识。", "type": "model", "relTime": "2天前"}, {"id": 94, "title": "三菱电机与索尼半导体将设立制造业 AI 视觉传感器合资企业 Advanced Vision Solutions", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/935.htm", "date": "2026-07-22T02:40:18.000Z", "summary": "三菱电机与索尼半导体解决方案宣布达成最终协议，共同设立合资企业 Advanced Vision Solutions，瞄准制造业 AI 视觉传感器解决方案领域。该合资企业计划于 2026 年 10 月开始运营，将结合索尼的图像传感器与边缘 AI 技术，以及三菱电机的自动化控制系统经验，开发集成在图像传感器上的 AI 分析系统，以加速制造业决策和控制流程。", "type": "industry", "relTime": "2天前"}, {"id": 95, "title": "ENTRAP-VL：面向视觉语言模型双重上下文牵引的分类探测工具", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.20092", "date": "2026-07-22T00:00:00.000Z", "summary": "研究团队提出ENTRAP-VL，一个手动标注的1，500项数据集，按八类上下文条件组织，用于探测视觉语言模型（VLM）中的双重上下文牵引现象--即模型被输入中辅助上下文（无论是否相关、真实或有意义）拉偏输出的倾向。该工具覆盖文本牵引（八种条件）和视觉牵引（三种条件）两个流，并引入\"矛盾性\"与\"反事实\"的区分，这是纯文本基准无法捕捉的。数据集及文档将公开发布。", "type": "paper", "relTime": "2天前"}, {"id": 96, "title": "Trace：基于分类学引导的多领域视觉推理环境", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19790", "date": "2026-07-22T00:00:00.000Z", "summary": "研究团队提出Trace，一种通过场景语法与可执行任务程序分离视觉实现与答案计算的视觉推理环境，覆盖277个场景语法、11个视觉领域共1000项任务。在64，000个Trace实例上进行RLVR训练后，Qwen2.5-VL-3B在24个外部基准上的宏平均提升3.51个百分点，Qwen2.5-VL-7B提升4.06个百分点，证明广泛的过程性训练可迁移至生成任务分布之外。", "type": "paper", "relTime": "2天前"}, {"id": 97, "title": "Self Gradient Forcing：原生长视频外推方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.20368", "date": "2026-07-22T00:00:00.000Z", "summary": "研究者提出Self Gradient Forcing（SGF）双阶段训练策略，通过并行上下文梯度重建，让未来帧损失监督历史KV缓存写入，解决了自回归视频扩散训练中的历史上下文梯度缺口。仅用5秒训练窗口，SGF即可外推生成持续数分钟的视频，在主体身份、背景一致性和时间稳定性上显著优于Self Forcing。", "type": "paper", "relTime": "2天前"}, {"id": 98, "title": "SeededGrasp：面向复杂场景与多机械臂的语言引导抓取框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.20207", "date": "2026-07-22T00:00:00.000Z", "summary": "研究者提出 SeededGrasp，一种数据高效的模块化框架，利用 VLM 零样本预测抓取种子点，再交由轻量级流匹配模型生成具体抓取姿态，将高层语义推理与底层几何执行解耦。该方法无需端到端训练即可支持多机械臂，在 610 个杂乱场景、334 个物体、3 种夹爪的合成数据集（含 256 万次抓取）上训练，仿真成功率达 72%，真实实验成功率达 78%。项目已开源代码与数据。", "type": "paper", "relTime": "2天前"}, {"id": 99, "title": "G-MAD：基于Arma3的多视角RGB-T航空目标检测数据生成框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19942", "date": "2026-07-22T00:00:00.000Z", "summary": "G-MAD是一个开源框架，利用游戏Arma3生成同步的多视角RGB-T（可见光-热成像）数据，用于航空目标检测。该框架支持结构化场景配置、可控多视角相机部署、同步可见光/热成像捕获，并利用引擎级几何元数据自动生成边界框标注。基于G-MAD构建的AMOD基准数据集已开源发布，可用于视角变化、多模态融合及合成到真实迁移的研究。", "type": "paper", "relTime": "2天前"}, {"id": 100, "title": "ATSplat：自适应 token 扩展的紧凑前馈 3D 高斯泼溅", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.20417", "date": "2026-07-22T00:00:00.000Z", "summary": "ATSplat 提出一种前馈 3D 高斯泼溅框架，通过自适应 3D token 恢复场景级容量分配能力。该方法从稀疏 3D 锚点 token 出发，根据渲染误差选择性扩张高不确定性区域。在 RealEstate10K 和 DL3DV 数据集上，ATSplat 以仅 311K 高斯体实现 SOTA 渲染质量，12 张输入图像下重建耗时不到 1 秒，渲染速度达 1136 FPS。", "type": "paper", "relTime": "2天前"}, {"id": 101, "title": "Robostral Navigate：8B视觉语言模型实现单目RGB导航", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.20785", "date": "2026-07-22T00:00:00.000Z", "summary": "Robostral Navigate是一个8B参数视觉语言模型，仅通过单目RGB图像流预测导航航点，无需深度传感器或多相机系统，可跨轮式、足式与飞行机器人部署。在R2R-CE基准上，它以77.4%的成功率超越最佳单目方法10.5个百分点，并超过依赖深度或多相机的系统5.3个百分点。", "type": "paper", "relTime": "2天前"}, {"id": 102, "title": "ReferTrack：将具身视觉跟踪分解为\"指认再追踪\"的VLA模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.20061", "date": "2026-07-22T00:00:00.000Z", "summary": "ReferTrack提出\"指认再追踪\"范式，先从前视图像中检测并索引边界框，再用单个Refer-CoT token选择目标，然后解码跟踪路径点。在EVT-Bench上，单目标、干扰和模糊跟踪分项成功率分别达89.4%、73.3%和74.1%，达到单视图SOTA，部分指标超越多摄像头基线。代码已开源。", "type": "paper", "relTime": "2天前"}, {"id": 103, "title": "《第九区》导演 Blomkamp 发布 AI 短片《Nightborne》，全片由字节跳动 Seedance 2.0 生成", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/entertainment/968703/neill-blomkamps-nightborne-barley-studios-seedance", "date": "2026-07-21T22:06:43.000Z", "summary": "《第九区》导演 Neill Blomkamp 发布 13 分钟科幻短片《Nightborne》，所有镜头均由字节跳动 Seedance 2.0 文生视频模型生成，并使用了 32 位人类演员肖像。影片因画面细节混乱、角色表演缺乏真实感而被广泛批评为\"AI 垃圾\"，Blomkamp 的创作风格几乎消失。", "type": "tip", "relTime": "3天前"}, {"id": 104, "title": "Substack 上线 AI 检测工具，可识别\"Claudefishing\"式 AI 生成内容", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/968855/substack-pangram-ai-detecting-tool", "date": "2026-07-21T19:22:28.000Z", "summary": "Substack 推出由 AI 检测公司 Pangram 驱动的新工具，可扫描帖子、评论、笔记和回复，估算其中有多少文本可能由 AI 生成或辅助完成。读者在超过 100 字的内容右上角菜单中选择\"Scan for AI text\"即可使用。Substack 同时允许创作者添加\"How I make this\"声明说明写作过程，并可扫描草稿及报告不准确结果。", "type": "paper", "relTime": "3天前"}, {"id": 105, "title": "Google 3.6 Flash 模型生成可3D打印数学艺术", "source": "X：Josh Woodward (@joshwoodward, Google Labs VP)", "sourceUrl": "https://x.com/joshwoodward/status/2079614730034127100", "date": "2026-07-21T17:09:23.000Z", "summary": "我们的一位工程师使用新的 3.6 Flash 模型构建了一个交互式数学艺术生成器。你可以实时自定义速度、颜色和几何参数，然后将设计直接导出为可 3D 打印的 STL 文件。观看视频，看看实物打印效果如何！", "type": "model", "relTime": "3天前"}, {"id": 106, "title": "Meta 模型助力伯克利实验室加速科学发现", "source": "X：AI at Meta (@AIatMeta)", "sourceUrl": "https://x.com/AIatMeta/status/2079614176725442912", "date": "2026-07-21T17:07:11.000Z", "summary": "为加速科学发现并支持 @ENERGY 的 Genesis 任务，由 @BerkeleyLab 领导的 SYNAPS-I 项目正使用 SAM 3 和 DINOv3 来自动化图像分割。  通过将 DINOv3 的全局语义上下文和细粒度空间定位与 SAM 3 的像素级边界提取相结合，研究人员能够将 3D 体积标注从一个月的人工工作量压缩到约 15 分钟。  了解更多他们的工作：https://go...", "type": "industry", "relTime": "3天前"}, {"id": 107, "title": "Claude Cowork 新增\"录制技能\"功能", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2079606576751526027", "date": "2026-07-21T16:36:59.000Z", "summary": "Claude Cowork 推出\"录制技能\"功能：用户录制屏幕并口述操作步骤，Claude 即可将其转化为可复用的技能。该功能支持文本、截图、音频、视频和注释等多模态输入，已在 Claude 桌面端上线，面向 Pro、Max 和 Team 计划用户开放。", "type": "paper", "relTime": "3天前"}, {"id": 108, "title": "Qwen 3.8 Max 改版 UI，轻松生成 3D 台球与显微镜项目", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2079601160638615853", "date": "2026-07-21T16:15:28.000Z", "summary": "Qwen 3.8 Max 强制改版 UI，摆脱了此前饱受吐槽的 AI 模板感设计。用户用它生成儿童显微镜项目页面和 3D 台球游戏，后者自动添加了桌子腿和灯光，音效与画面交互丝滑，完整度很高。", "type": "tip", "relTime": "3天前"}, {"id": 109, "title": "Qwen3.8 Max 3D能力实测：台球与放映机", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2079597189937217665", "date": "2026-07-21T15:59:41.000Z", "summary": "用户用Qwen3.8 Max生成3D台球项目，完整度高，自动添加桌子腿和灯光，光影效果与交互丝滑。此前用户还用它制作了3D幻灯片放映机，支持本地上传PDF、MP4、PPT等文件，动画交互与细节刻画表现不错。", "type": "tip", "relTime": "3天前"}, {"id": 110, "title": "阿里通义千问发布 Qwen-Image-3.0：单次生成可读十像素文字与复杂信息图", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/alibabas-qwen-image-3-0-renders-full-infographic-grids-and-readable-ten-pixel-text-in-a-single-pass", "date": "2026-07-21T15:55:09.000Z", "summary": "阿里通义千问团队发布 Qwen-Image-3.0，该图像生成模型支持最长 4500 token 的输入，可单次生成包含可读十像素文字、数学公式及十二种语言的复杂排版，如 3×3 信息图网格和嵌套界面。模型目前仅通过邀请制 API 开放，后续将集成至 Qwen Chat 等自有应用，但不太可能像初版 Qwen-Image 那样开源权重。", "type": "model", "relTime": "3天前"}, {"id": 111, "title": "荣耀 Robot Phone 拍照页面曝光，将支持大师电影模式与四自由度机械云台", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/801.htm", "date": "2026-07-21T15:33:36.000Z", "summary": "荣耀 Robot Phone 已开启预约，机身顶部集成行业最小的四自由度（4DoF）钛合金机械云台系统，体积比主流方案缩小 70%。拍照页面显示快门键改为摇杆按钮，预计可调节云台角度，并支持与阿莱 ARRI 合作的\"大师电影\"模式。该机搭载第五代骁龙 8 至尊版芯片，预计今年 8 月发布，将首发荣耀新一代伙伴型多模态智能体操作系统 AgenticOS 内核。", "type": "paper", "relTime": "3天前"}, {"id": 112, "title": "ABot-World-0：单张桌面级GPU实现无限交互式世界生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19191", "date": "2026-07-21T15:26:50.000Z", "summary": "ABot-World-0是一个动作条件视频世界模型，能在单张NVIDIA RTX 5090 GPU上以720P分辨率、最高16 FPS、1.2秒动作到首帧延迟和约19 GiB峰值显存预算运行无限交互式世界生成。该模型采用统一的帧同步键盘动作接口，通过LongForcing分布匹配阶段解决长程自回归漂移问题，并集成轻量级VAE解码器、低比特DiT推理和局部上下文KV缓存等系统级优化。", "type": "paper", "relTime": "3天前"}, {"id": 113, "title": "通义千问发布 Qwen Image 3 模型", "source": "X：swyx (@swyx)", "sourceUrl": "https://x.com/swyx/status/2079580673086730701", "date": "2026-07-21T14:54:03.000Z", "summary": "Qwen Image 3 发布。 这些图片不是截图。全部单次生成。 最后一张（图像标注）我认为可以催生十几个教育科技/工业培训初创公司。 【引用 @swyx】：顺便一提，Qwen Image 2 是 7B 模型……从 Image 1 的 20B 降下来……并且在 Elo 评分中击败了 Nano Banana。 恭喜 @JustinLin610 等人！！", "type": "model", "relTime": "3天前"}, {"id": 114, "title": "特斯拉将 Robotaxi 自动驾驶出租车服务扩展至美国奥兰多和坦帕", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/786.htm", "date": "2026-07-21T14:40:49.000Z", "summary": "特斯拉将 Robotaxi 自动驾驶出租车服务扩展至美国佛罗里达州的奥兰多和坦帕。该服务去年6月从得州奥斯汀起步，今年已先后进入达拉斯、休斯敦和迈阿密。此次扩张正值特斯拉公布第二季度财报前夕，华尔街密切关注其自动驾驶业务进展。", "type": "industry", "relTime": "3天前"}, {"id": 115, "title": "Deezer：AI 生成音乐已占每日上传量的 50% 以上", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/21/music-streamer-deezer-says-more-than-50-of-daily-uploads-are-ai-generated", "date": "2026-07-21T13:27:42.000Z", "summary": "音乐流媒体平台 Deezer 称，AI 生成音乐目前占其每日上传量的 50% 以上，2026 年 6 月日均上传量达 9 万首。Deezer 将下架过去六个月无播放量或涉及刷量欺诈的 AI 曲目，并已向其他平台开放其 AI 检测技术，该技术可识别 Suno 和 Udio 生成的音乐。", "type": "industry", "relTime": "3天前"}, {"id": 116, "title": "Qwen-Image-3.0 发布：支持 4.5k token 输入与 10px 小字渲染", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://qwen.ai/blog?id=qwen-image-3.0", "date": "2026-07-21T10:38:03.030Z", "summary": "阿里通义千问推出第三代基础图像生成模型 Qwen-Image-3.0，核心能力聚焦\"真实\"，支持最长 4.5k token 的指令输入，可一次性生成包含 9 个复杂信息图的 3×3 网格布局。模型能精确渲染小至 10px 的文字，并原生支持 12 种语言，可模拟网页、游戏、直播等主流界面，在学术论文、报纸等密集排版场景中保持可读性。", "type": "paper", "relTime": "3天前"}, {"id": 117, "title": "阿里云HappyHorse 1.1获AI视频黑客松卓越奖", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2079507022345650415", "date": "2026-07-21T10:01:24.000Z", "summary": "阿里云旗下HappyHorse 1.1在东京AI视频黑客松中荣获卓越奖。获奖作品《连接现实的工程师》仅用一晚完成，以15秒短片展现工程创新与人文关怀的结合。用户可通过链接免费试用该视频生成模型。", "type": "industry", "relTime": "3天前"}, {"id": 118, "title": "阿里云东京AI视频黑客松落幕，HappyHorse 1.1助力创作", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2079499930159247403", "date": "2026-07-21T09:33:13.000Z", "summary": "阿里云在东京举办AI视频黑客松，50多位创作者使用全球排名第一的AI视频生成模型HappyHorse，在一夜内完成15秒电影级广告片。大奖作品利用通勤列车离心力烘干衣物的创意，由HappyHorse 1.1生成。", "type": "industry", "relTime": "3天前"}, {"id": 119, "title": "阿里云 WonderClip 实现脚本到视频全自动生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2079479299157930471", "date": "2026-07-21T08:11:14.000Z", "summary": "Script in. Video out.  📅 2026 年 7 月 23 日 | 上午 10：00-10：30（UTC+8）| 阿里云直播  注册 → https://int.alibabacloud.com/m/1000415408/  WonderClip 正在企业级规模上实现 AI 驱动的视频制作--从脚本到成片，全自动化。  在 #AgenticTalks 第 1 集中了解其工作...", "type": "paper", "relTime": "3天前"}, {"id": 120, "title": "NVIDIA 发布 Cosmos 3 Edge：40 亿参数开放世界模型，可在设备端推理并生成机器人动作", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/07/21/nvidia-releases-cosmos-3-edge-a-4b-parameter-open-world-model-that-reasons-and-generates-robot-actions-on-device", "date": "2026-07-21T07:48:28.000Z", "summary": "NVIDIA 发布 Cosmos 3 Edge，一款 40 亿参数的开放世界模型，专为设备端运行设计。该模型可帮助机器人和视觉 AI 智能体理解环境、实时推理并在本地生成机器人动作。Cosmos 3 系列此前已于 2026 年 5 月 31 日在 GTC Taipei 推出 Cosmos 3 Nano（160 亿参数）和 Cosmos 3 Super（640 亿参数）。", "type": "model", "relTime": "3天前"}, {"id": 121, "title": "英伟达推出合成视频检测器NIM，逐帧识别AI生成视频准确率达92%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/594.htm", "date": "2026-07-21T07:37:36.000Z", "summary": "英伟达发布合成视频检测器NIM服务，可逐帧分析视频并给出分类评分，判断内容是否由AI生成。内部测试显示，该工具对无压缩视频检测准确率达92%，15%压缩率下为85%，50%压缩率下为82%。在RTX GPU系统上分析一段1080P视频最快仅需22毫秒，企业级L40 GPU上约需30毫秒。", "type": "paper", "relTime": "3天前"}, {"id": 122, "title": "荣耀 Robot Phone 首日预约量超历代旗舰，搭载第五代骁龙 8 至尊版与 4DoF 钛合金机械云台", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/555.htm", "date": "2026-07-21T07:07:46.000Z", "summary": "荣耀 Robot Phone 首日预约量已超越荣耀历代旗舰产品。该机搭载第五代骁龙 8 至尊版芯片，机身顶部集成行业最小的四自由度（4DoF）钛合金机械云台系统，体积比主流方案缩小 70%，200Mp 云台影像的核心机构件、电机、模组均为自研。行业预测 1TB 版本售价约 15999 元，预计今年 8 月发布，并将首发荣耀新一代伙伴型多模态智能体操作系统 AgenticOS 内核。", "type": "product", "relTime": "3天前"}, {"id": 123, "title": "谷歌 DeepMind 发布 GenCeption：基于阿里 Wan2.1，打破计算机视觉桎梏", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/535.htm", "date": "2026-07-21T07:00:10.000Z", "summary": "谷歌 DeepMind 发布 GenCeption 模型，将预训练视频生成器逆向改造成单一模型，可同时完成深度估计、图像分割等核心视觉任务。该模型基于阿里 Wan2.1 训练，一次前向传播即可输出结果，小模型处理 81 帧视频约需 6 秒。", "type": "paper", "relTime": "3天前"}, {"id": 124, "title": "阿里千问发布 Qwen-Image-3.0 图像生成基础模型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/530.htm", "date": "2026-07-21T06:56:42.000Z", "summary": "阿里发布 Qwen-Image-3.0 图像生成模型，核心主线为\"实\"。模型支持 4.5k token 超长输入，可一次生成含公式、几何图形的知识图解和复杂 UI，并支持 12 国语言及 20 多款字体原生渲染。阿里云百炼、千问 AI 平台已开通 API 邀测，Qwen Studio 和千问 APP 即将上线免费体验。", "type": "model", "relTime": "3天前"}, {"id": 125, "title": "Momenta Robotaxi 获深圳智能网联汽车道路测试许可", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/458.htm", "date": "2026-07-21T05:18:29.000Z", "summary": "Momenta Robotaxi 正式获得深圳市智能网联汽车道路测试许可，将于近期在深圳开展实地测试。其 R7 强化学习世界模型已投入 L4 级自动驾驶实际应用，上汽大众 ID.ERA 9X 为首款搭载该模型的量产车型。", "type": "industry", "relTime": "3天前"}, {"id": 126, "title": "生数科技朱军：通用世界模型是连接数字与物理世界的新基础设施", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s/8MaTdfpAmZSg3zYbrJuFAg", "date": "2026-07-21T05:09:19.000Z", "summary": "生数科技创始人朱军在WAIC 2026上提出，通用世界模型需具备理解、想象与行动一体化能力，并发布全球首个MoT统一架构。该架构将理解、生成与行动专家统一于同一模型，支撑Vidu Q3等视频生成模型及具身智能机器人控制。最新模型可驱动多种异构机器人完成长程任务，在跨场景泛化上取得行业领先效果。", "type": "tip", "relTime": "3天前"}, {"id": 127, "title": "为了科普 AI 知识，写了一个视频生成Skill。 计划每天生成一个大模型知识解读视频。 今天是第一期，用最浅显的话解读\"蒸馏\"。 以后千万别说我蒸馏了一个Skill，会显得很外行。", "source": "X：Vista (@vista8)", "sourceUrl": "https://x.com/vista8/status/2079423337369887004", "date": "2026-07-21T04:28:52.000Z", "summary": "为了科普 AI 知识，写了一个视频生成Skill。  计划每天生成一个大模型知识解读视频。  今天是第一期，用最浅显的话解读\"蒸馏\"。  以后千万别说我蒸馏了一个Skill，会显得很外行。", "type": "tip", "relTime": "3天前"}, {"id": 128, "title": "小鹏集团发布 TuringViT 高效视觉编码器", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/451.htm", "date": "2026-07-21T04:23:59.000Z", "summary": "小鹏集团发布面向 VLM/VLA 时代的 TuringViT 视觉编码器，推出 18L 和 24L 两个规格。该编码器在 1536×1536 分辨率下推理吞吐量达 Seed1.5-ViT 的 3.04 倍，仅用 0.85B 图文对便在六项零样本分类基准上取得 83.6% 平均准确率，超越使用 10B 数据的基线。", "type": "paper", "relTime": "3天前"}, {"id": 129, "title": "腾讯混元发布科学发现智能体 Hyra，能够递归自我改进", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/440.htm", "date": "2026-07-21T03:43:22.000Z", "summary": "腾讯混元推出 Hyra-1.0，一个专为研究与工程任务打造的、能递归自我改进的智能体。在多轮 3D 建模测试中，Hyra 生成的模型相比 Claude Code goal 模式更接近参考图像且更符合人类审美。", "type": "model", "relTime": "3天前"}, {"id": 130, "title": "导演陆川称 AI 生成像预制菜，正利用 AI 同时推进五部电影筹备", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/311.htm", "date": "2026-07-21T01:18:17.000Z", "summary": "导演陆川表示，AI 生成的影像像预制菜，能弥补新手与老手的技术代差，但可能抹杀艺术创作中\"错误\"带来的迷人之处。他正利用 AI 同时推进五部电影的筹备，AI 已替代概念设计、分镜和部分剪辑等环节，大幅降低试错成本。陆川透露，在视觉商业领域，短片和广告已有 95% 以上被 AI 替代。", "type": "tip", "relTime": "3天前"}, {"id": 131, "title": "一个随机数就能识别AI模型身份：行为指纹技术可检测API中转站偷换模型", "source": "公众号：数字生命卡兹克", "sourceUrl": "https://mp.weixin.qq.com/s/pqFZreEZj8kB4KDirl4MSQ", "date": "2026-07-21T01:10:49.000Z", "summary": "布拉格经济大学研究员托马什·布鲁克纳发现，通过让模型反复输出1到100的随机数，可生成独一无二的\"行为指纹\"。对165个模型各问30次后发现，GPT-4o偏爱42和37，Claude Sonnet 5疯狂输出47，Qwen3-Max则30次全部回答42。该方法仅需约120条请求即可识别模型身份，错误率约10.6%，为验证API是否被偷换模型提供了轻量级方案。", "type": "tip", "relTime": "3天前"}, {"id": 132, "title": "GAMUT：面向事实完整性的双层元评分基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19322", "date": "2026-07-21T00:00:00.000Z", "summary": "GAMUT 引入双层元评分框架，将所需内容的结构化元评分自动编译为 LLM 可评分的二元检查清单，用于评估长文本生成的事实完整性。基准包含 1，813 个基于真实可穿戴图像的问题，覆盖 10 个领域。14 个模型中 Gemini 3.1 Pro 得分最高（58.7%），表明该基准极具挑战性。", "type": "paper", "relTime": "3天前"}, {"id": 133, "title": "文本模板Token是扩散Transformer中的隐式语义寄存器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19139", "date": "2026-07-21T00:00:00.000Z", "summary": "南京大学与阿里巴巴团队提出因果可解释性框架，发现扩散Transformer（DiT）中来自聊天模板的结构性token虽不含提示语义，却成为图像到文本的注意力汇聚点，并因果性地维持物体身份，充当隐式语义寄存器。", "type": "paper", "relTime": "3天前"}, {"id": 134, "title": "Appearance Pointers：扩散Transformer的多模态区域控制新方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19344", "date": "2026-07-21T00:00:00.000Z", "summary": "研究人员提出Appearance Pointers，一种紧凑型token，通过将文本或图像输入与用户指定的掩码对齐，引导扩散Transformer（DiT）在正确空间位置生成正确外观。该方法由区域对应网络生成token，经空间聚合机制优化，无需从头重新训练基础模型即可实现多区域描述控制。在多项指标上，该单一模型达到或超越了特定模态的现有最优方法。", "type": "paper", "relTime": "3天前"}, {"id": 135, "title": "Masked Visual Actions：统一世界模型的掩码视觉动作接口", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19343", "date": "2026-07-21T00:00:00.000Z", "summary": "斯坦福大学李飞飞团队提出 Masked Visual Actions，将机器人动作表示为视频中实体轨迹的像素空间掩码。仅用15小时真实与仿真数据微调，单个视频模型即可同时作为前向动力学模型和逆向模型，用于策略评估与基于模型的规划。", "type": "paper", "relTime": "3天前"}, {"id": 136, "title": "Mage-Flow：面向图像生成与编辑的高效原生分辨率基础模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19064", "date": "2026-07-21T00:00:00.000Z", "summary": "研究人员推出Mage-Flow，一个40亿参数的高效生成栈，用于文本到图像生成和指令式图像编辑。其核心包括轻量级高保真潜在分词器Mage-VAE和原生分辨率多模态扩散Transformer，通过协同设计将分词成本降低一个数量级以上，端到端训练吞吐量提升约2.5倍。", "type": "paper", "relTime": "3天前"}, {"id": 137, "title": "CalibAtt：无需训练的稀疏注意力方法，将文生视频速度提升至 1.58 倍", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/calibrated-sparse-attention", "date": "2026-07-21T00:00:00.000Z", "summary": "Apple 与特拉维夫大学联合提出 CalibAtt，一种无需训练的校准稀疏注意力方法，通过离线识别 token 间可跳过的低分连接并编译为优化操作，在推理时跳过无关计算。在 Wan 2.1 14B、Mochi 1 及少步蒸馏模型上，CalibAtt 实现最高 1.58 倍端到端加速，在保持视频质量和文本-视频对齐的同时优于现有免训练方法。", "type": "paper", "relTime": "3天前"}, {"id": 138, "title": "Hugging Face 发布 Grabette：开源手持夹爪系统，无需机器人即可录制操作数据", "source": "Hugging Face：Blog（RSS）", "sourceUrl": "https://huggingface.co/blog/grabette", "date": "2026-07-21T00:00:00.000Z", "summary": "Hugging Face 推出 Grabette，一套开源低成本系统，用户手持夹爪即可在几分钟内录制操作演示，并自动生成机器人可用的数据集。Grabette 配备鱼眼相机与 RGBD 相机，通过 SLAM 恢复 6-DoF 轨迹，硬件物料成本约 490 欧元。所有硬件设计、处理流程与训练代码均开源，数据以标准 LeRobot 格式上传至 Hugging Face Hub，支持任意机器人后端。", "type": "model", "relTime": "3天前"}, {"id": 139, "title": "多模态大模型理解幽默为何困难：方法、数据集、评估与挑战综述", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19011", "date": "2026-07-21T00:00:00.000Z", "summary": "一篇综述系统梳理了多模态大语言模型（MLLM）在理解 meme、漫画、讽刺图像等视觉幽默上的结构性盲区：核心困难不在于多模态对齐，而在于对非字面机制、共享文化知识和交际意图的推理。该综述按识别、解释与推理、生成三个递进能力层级组织文献，指出当前进展受限于捷径式评估、文化覆盖不足、证据基础薄弱以及安全与所有权问题。", "type": "paper", "relTime": "3天前"}, {"id": 140, "title": "Moving Alphabet 研究：训练数据分布与标注质量对文生视频模型的关键影响", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.18789", "date": "2026-07-21T00:00:00.000Z", "summary": "研究团队提出 Moving Alphabet 可控测试平台，通过渲染不同字体、颜色、大小、位置和运动速度的字母，精确控制视频数据分布与标注质量。实验发现：视频内容与时长分布的多样性和均衡性对模型泛化能力至关重要；标注精度（正确性）比召回率（完整性）对模型性能影响更大，低质量标注下模型需消耗更多算力才能达到同等验证损失；无分类器引导（CFG）和高质数据微调无法完全弥补预训练数据缺陷。", "type": "paper", "relTime": "3天前"}, {"id": 141, "title": "Nativ：在 Mac 上本地运行前沿开放模型", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://blaizzy.github.io/nativ", "date": "2026-07-20T21:55:08.620Z", "summary": "Nativ 发布 macOS 桌面应用，让用户在 Apple Silicon（M1+）上本地运行 Google、Cohere、Liquid AI 等开放模型，无需账户或订阅。应用支持语言、视觉、视频、代码、音频等多模态交互，并提供实时 token/秒、内存压力等性能指标。Nativ 完全开源（MIT 许可），内置本地端点，可对接 Claude Code、Codex 等编码智能体。", "type": "model", "relTime": "4天前"}, {"id": 142, "title": "《第九区》导演Neill Blomkamp发布首部完全由AI生成的短片《Nightborne》", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/district-9-director-neill-blomkamp-releases-first-short-film-made-entirely-with-ai-video-generation", "date": "2026-07-20T17:32:41.000Z", "summary": "Neill Blomkamp发布了13分钟科幻恐怖短片《Nightborne》，完全使用Seedance 2.0视频生成模型通过文本提示逐帧创作。影片采用纪录片风格，使用了32位真实人物的面部和声音（已获授权），人类艺术家负责概念艺术。Blomkamp表示计划以相同格式拍摄一部长片，并已创立AI电影工作室Barley Studios。", "type": "industry", "relTime": "4天前"}, {"id": 143, "title": "AlayaWorld：交互式长程视频世界模型技术报告发布，15B参数开源模型实现540p/720p 24fps生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.18367", "date": "2026-07-20T17:15:41.000Z", "summary": "AlayaWorld 是一个交互式长程视频世界模型，基于15B视频扩散Transformer架构，可生成540p和720p分辨率、24fps的视频。该模型通过自回归生成短潜变量块，结合持久锚定帧、压缩时序历史、几何对齐空间记忆和近期帧条件化来维持长程一致性，并将推理从约30步蒸馏至每块4步。在iWorld-Bench基准上，AlayaWorld取得长程生成最佳性能，项目以全栈开源形式发布。", "type": "paper", "relTime": "4天前"}, {"id": 144, "title": "Grok 视频生成吊打 Seedance，开源世界模型 Alaya 引热议", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2079240587404870038", "date": "2026-07-20T16:22:41.000Z", "summary": "用户对比发现 Grok 视频生成效果已完全超越 Seedance，后者降智严重且价格昂贵，呼吁停止充值。同时，开源世界模型 Alaya World 引发讨论，其核心价值在于将游戏可玩原型的搭建成本从\"几周\"压缩到\"一分钟\"，通过 Error Bank 误差回灌等技术让模型学会在\"脏历史\"上继续预测，但精确碰撞、多人同步等 3A 核心功能尚未涉及。", "type": "tip", "relTime": "4天前"}, {"id": 145, "title": "NVIDIA 发布 Cosmos 3 Edge：4B 参数开源世界模型，为机器人及边缘 AI 提供实时推理与动作生成", "source": "Hugging Face：Blog（RSS）", "sourceUrl": "https://huggingface.co/blog/nvidia/cosmos3edge", "date": "2026-07-20T15:58:51.000Z", "summary": "NVIDIA 在 Hugging Face 上开源了 Cosmos 3 Edge，一个 40 亿参数的世界模型，旨在帮助机器人和视觉 AI 智能体在边缘设备上理解环境、实时推理并生成动作。", "type": "model", "relTime": "4天前"}, {"id": 146, "title": "开源世界模型Alaya World颠覆游戏原型成本", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2079230005419065670", "date": "2026-07-20T15:40:38.000Z", "summary": "开源世界模型Alaya World通过显式3D空间缓存、压缩帧历史记忆和Error Bank误差回灌技术，将游戏可玩原型的制作成本从\"几周\"压缩到\"一分钟\"。输入一张图、一条相机轨迹和几句prompt即可生成可探索场景，大幅降低独立团队和UGC的创作门槛。但精确碰撞、多人同步、数值平衡等3A核心骨架未被触及，短期与3D资产化引擎管线互补。", "type": "tip", "relTime": "4天前"}, {"id": 147, "title": "YouTube 更新政策，明确三类 AI 低质内容不得变现", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/20/youtube-clarifies-policies-around-ai-slop-and-upsetting-videos", "date": "2026-07-20T15:23:06.000Z", "summary": "YouTube 于 7 月 16 日更新变现政策，将\"不真实内容\"细分为三类：重复/模板化内容、令人不适或情绪操纵内容、以及使用 AI 数字人讨论健康/金融等敏感话题的内容。拥有过多此类内容的频道将被移出 YouTube 合作伙伴计划（YPP），无法通过广告和订阅创收。YouTube 信任与安全主管 Matt Halprin 表示，此举旨在打击利用 AI 快速生成低质视频的\"内容农场\"行为。", "type": "industry", "relTime": "4天前"}, {"id": 148, "title": "昆仑万维发布并开源可交互世界模型 Matrix-Game 3.5", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s/TUVv2wvp4RixsblDLrvSGg", "date": "2026-07-20T13:45:18.000Z", "summary": "昆仑万维在 WAIC 2026 发布并开源新一代可交互世界模型 Matrix-Game 3.5。该模型通过 Patch Memory 与 Warped PRoPE 实现长期记忆与几何一致性建模，可在单张 GPU 上以 720P 分辨率、约 20FPS 实时生成流式视频。", "type": "model", "relTime": "4天前"}, {"id": 149, "title": "OpenRouter 上线 Grok Imagine Video 1.5", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2079200618498191407", "date": "2026-07-20T13:43:51.000Z", "summary": "Grok Imagine Video 1.5 来自 @SpaceXAI，现已登陆 OpenRouter！  让任何静态图像活起来，可附加文字提示。塑造运动和镜头运作。通过内置声音和对话设定氛围与物理效果。  试用：https://openrouter.ai/x-ai/grok-imagine-video-1.5", "type": "paper", "relTime": "4天前"}, {"id": 150, "title": "Alaya World 开源：Error Bank 让模型学会带错前行", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2079178289751470467", "date": "2026-07-20T12:15:08.000Z", "summary": "开源世界模型 Alaya World 的核心创新是 Error Bank--故意将积累的伪影回灌进训练，让模型在\"脏历史\"上继续正确预测，而非追求每一步完美。这一机制解决了长程生成中错误级联崩溃的难题，将验证一个世界想法的成本从几周压缩到几分钟。Alaya World 目前未涉及碰撞体、多人同步等 3A 游戏核心骨架，但其技术哲学对具身智能仿真等长时自主系统同样适用。", "type": "tip", "relTime": "4天前"}, {"id": 151, "title": "WAIC 2026 现场：MiniMax、智平方、星尘智能等十余家云启被投展示模型与机器人落地进展", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/author-1779868954078/waic-ai", "date": "2026-07-20T11:10:00.000Z", "summary": "2026 年 WAIC 首次铺开至\"三地四馆\"，超 1100 家企业参展。MiniMax 预热多模态生成模型 H3，智平方展示搭载 NeuroVLA 的 AlphaBot 2，星尘智能发布第二代具身基座模型 Lumo-2 及售价 8.99 万元起的 T1 机器人。机器人从演示走向真实场景，在药房、工厂、零售等岗位执行长任务，行业重心从\"参数竞赛\"转向\"价值验证\"。", "type": "industry", "relTime": "4天前"}, {"id": 152, "title": "宇树发布 UnifoLM-OminiA-0.3 模型，支持全模态交互理解", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/032.htm", "date": "2026-07-20T07:22:09.000Z", "summary": "宇树科技发布 UnifoLM-OminiA-0.3 模型，单模型统筹家居康养多任务，支持全模态交互理解，全程自主执行抗干扰。该模型在人形机器人 G1 上实现从感知到行动的闭环，可完成物品搬运、视觉识别与回答、精细操作及设备控制等任务。", "type": "model", "relTime": "4天前"}, {"id": 153, "title": "上海科学智能研究院开放科学多模态基础模型\"神珍\"", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/017.htm", "date": "2026-07-20T07:00:15.000Z", "summary": "上海科学智能研究院开放科学多模态基础模型\"神珍\"，总参数约110亿，可处理DNA、RNA、蛋白质、小分子、地球系统和医学影像六类数据。在生物序列20项任务中，该模型9项取得最优结果；医学影像分割平均Dice得分91.20，在7种参评方法中最优。模型权重及代码已在星河启智、Hugging Face和GitHub开放。", "type": "model", "relTime": "4天前"}, {"id": 154, "title": "欧莱雅中国与火山引擎达成战略合作，豆包大模型进入美妆经营一线", "source": "公众号：火山引擎", "sourceUrl": "https://mp.weixin.qq.com/s/ZwGtT_T20p7FxJ5sTBC_ig", "date": "2026-07-20T06:08:05.000Z", "summary": "欧莱雅（中国）与火山引擎于7月19日达成战略合作，将围绕AIGC创意内容生产、经营策略分析和消费者智能服务三大场景，探索豆包大模型在电商运营素材生成、智能客服、智能助播及内容审核等环节的应用。双方将利用火山引擎的多模态生成、AI Agent和自动化流程能力，提升素材制作效率、消费者服务响应速度及营销策略洞察转化。", "type": "industry", "relTime": "4天前"}, {"id": 155, "title": "VITURE 发布 Auto Immersive 3D 技术，实现安卓系统实时 3D 立体化", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/978/931.htm", "date": "2026-07-20T03:45:49.000Z", "summary": "XR 眼镜品牌 VITURE 在 2026 世界人工智能大会上发布 Auto Immersive 3D 技术，依托颈环端侧算力实现安卓全系统实时 3D 立体化。该技术可将任意视频一键转为 3D 效果、增强非原生 3D 游戏并支持 PC 游戏串流升维，同时将系统桌面与办公软件全局 3D 化，未来有望延伸至工业与医疗影像领域。", "type": "paper", "relTime": "4天前"}, {"id": 156, "title": "用随机数指纹识别AI模型是否被调包", "source": "X：小互 (@xiaohu)", "sourceUrl": "https://x.com/xiaohu/status/2079037351129694309", "date": "2026-07-20T02:55:05.000Z", "summary": "布拉格经济大学研究者发现，利用AI模型无法生成真正随机数的缺陷，可通过其偏好的\"口头禅数字\"进行身份识别。例如GPT-4o偏爱42，Claude Sonnet 5只说47，Qwen3-Max在30次采样中每次都答42。该方法可用于检测OpenRouter等聚合商是否偷偷替换了用户选择的模型。", "type": "tip", "relTime": "4天前"}, {"id": 157, "title": "爱芯元智发布元曦系列大算力产品，A 系列AI推理卡算力超1000TOPS", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/978/841.htm", "date": "2026-07-20T01:33:16.000Z", "summary": "爱芯元智在WAIC 2026上推出元曦系列大算力产品线，专攻机房集群、多路视频分析等高并发场景。其中A系列AI推理卡搭载超1000TOPS算力，配备超大显存与高带宽。同时发布的具身智能大脑控制器拥有1500TOPS算力与约2倍行业领先带宽，支持世界模型与VLA，视觉感知芯片AX8910已规模化落地。", "type": "model", "relTime": "4天前"}, {"id": 158, "title": "LVSum 基准：评估多模态大模型的长视频时间感知摘要能力", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/lvsum-video-summarization", "date": "2026-07-20T00:00:00.000Z", "summary": "Apple 推出 LVSum，一个含细粒度时间对齐的人工标注长视频摘要基准，包含 13 个领域的 72 个视频（平均时长 16 分钟），每个视频配有最多 10 条含时间引用的人类摘要。评估显示，转录文本对摘要质量的贡献远大于视觉帧，当前多模态大模型在时间定位、指令遵循和跨模态一致性上存在系统性缺陷，与人类摘要仍有显著差距。", "type": "paper", "relTime": "4天前"}, {"id": 159, "title": "EduPanel：用于教学视频评估的三智能体LLM裁判--可靠性、互补性与人类信任校准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.18529", "date": "2026-07-20T00:00:00.000Z", "summary": "EduPanel 是一个基于评分标准、面向特定学习者的多模态 LLM 裁判，将教学视频评估分解为三个专门智能体。专家研究表明，EduPanel 的可靠性达到人类专家中位数水平；其反馈将专家评分误差（MAE）从 0.87 降至 0.73，同时专家仍能检测不可靠输出（AUC = 0.77），而非盲目接受。结果表明 EduPanel 可作为教育评估的有效辅助工具，而非替代人类专家。", "type": "paper", "relTime": "4天前"}, {"id": 160, "title": "SciForma：科学示意图的结构忠实生成框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.18091", "date": "2026-07-20T00:00:00.000Z", "summary": "北京大学与微软亚洲研究院提出 SciForma 框架，将科学示意图质量分解为组件、箭头和文本三个结构轴，并构建 SciFormaData-700K 训练集与 SciFormaBench-2K 评测基准。其核心方法 M-DPO 在 SFT 后强制所有轴同时正确，使 SciForma-9B 在两项基准上超越所有开源基线及 GPT-Image-1.5。", "type": "paper", "relTime": "4天前"}, {"id": 161, "title": "LLM 在空间约束下的分子生成能力：3D-Fit 基准测试揭示潜力与差距", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.18144", "date": "2026-07-20T00:00:00.000Z", "summary": "一项新研究系统评估了通用 LLM 在结构药物设计（SBDD）中处理复杂 3D 空间约束的能力。研究者引入 3D-Fit 基准测试策略，对比 LLM 与专用扩散模型在蛋白口袋、锚定片段、药效团点及强制口袋-配体相互作用等多条件分子生成任务上的表现。结果显示，LLM 虽仍落后于 SOTA 方法，但已能同时处理多种空间约束，具备向异构场景扩展的潜力。", "type": "paper", "relTime": "4天前"}, {"id": 162, "title": "ReViV：从单目第一人称视频中联合重建观察者与场景的4D框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.17790", "date": "2026-07-20T00:00:00.000Z", "summary": "ReViV提出首个统一框架，从单目RGB视频同时重建观察者（全身运动、手部、视线）与场景（相机轨迹、深度）的4D动态。基于掩码生成式第一人称Transformer的单前馈架构，无需预计算相机轨迹或分离建模，在HoloAssist、HOT3D、ARCTIC、Aria Digital Twin、TACO等基准上实现全身、手部、视线重建与相机追踪的SOTA精度，深度估计也具竞争力。代码与模型已完全开源。", "type": "paper", "relTime": "4天前"}, {"id": 163, "title": "ShotPlan：基于可学习规划token的电影级视频生成框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.17675", "date": "2026-07-20T00:00:00.000Z", "summary": "ShotPlan提出一种显式多镜头电影级视频生成框架，通过可学习规划token（planning tokens）与分数时间旋转位置编码（FRoPE）在帧级别控制镜头切换。实验表明，该方法在镜头管理和跨镜头一致性上显著优于现有电影级视频生成方法。", "type": "paper", "relTime": "4天前"}, {"id": 164, "title": "FlowMimic：无需遮罩的在线视频编辑数据生成与模态模仿框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.18227", "date": "2026-07-20T00:00:00.000Z", "summary": "FlowMimic提出像素对时序扭曲流场，直接从图像编辑样本实时生成对应视频编辑样本，无需人工遮罩标注或I2V模型合成。该方法通过模态模仿生成损失和编辑损失对齐图像与视频模态的输出分布，并引入指代表达分割等感知任务及编辑区域感知的隐层与注意力损失，使模型内化语言驱动的视觉编辑能力。", "type": "paper", "relTime": "4天前"}, {"id": 165, "title": "RynnBrain 1.1 具身基础模型家族发布", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.17977", "date": "2026-07-20T00:00:00.000Z", "summary": "RynnBrain 1.1 发布 2B、9B 和 122B-A10B 三种规模的具身基础模型，新增接触点预测与 3D 定位训练任务。其中 122B-A10B 模型在 VSI-Bench、MMSI 和 RefSpatial-Bench 上超越所有评估的闭源与开源模型，基于该模型初始化的策略在真实机器人实验中优于 Qwen 基线和通用 VLA 方案。", "type": "model", "relTime": "4天前"}, {"id": 166, "title": "HOMIE：基于多模态智能增强的人-物中心视频个性化生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.18217", "date": "2026-07-20T00:00:00.000Z", "summary": "HOMIE提出统一框架，同时处理跨主体与同主体参考输入的人-物中心视频个性化生成（HOCVP）任务。该方法通过全局多模态引导将MLLM语义特征与VAE token对齐，并引入模态参考嵌入以区分MLLM特征与VAE token、关联同主体参考图像token，在不牺牲文本编码器可控性且无需昂贵重对齐的前提下提取参考级关系知识。实验表明HOMIE在多项HOCVP任务上达到SOTA性能。", "type": "paper", "relTime": "4天前"}, {"id": 167, "title": "DiFA：扩散模型推理时的前向过程对齐方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.17972", "date": "2026-07-20T00:00:00.000Z", "summary": "DiFA提出一种无需训练的推理框架，将扩散模型的数据预测精炼重构为序列状态估计问题，通过聚合历史预测构建前向对齐的时间共识。在CIFAR-10和ImageNet上，DiFA在FID、IS和FD-DINOv2等指标上均取得显著提升。", "type": "paper", "relTime": "4天前"}, {"id": 168, "title": "Qwen3.8发布，参数规模达2.4T", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2078991141673021682", "date": "2026-07-19T23:51:28.000Z", "summary": "Qwen 推出 Qwen3.8，拥有 2.4T 参数，性能媲美前沿模型，预览版已开放。Netflix CPTO 认为 AI 加速流程但未替代品味与责任。Vidu S1 将视频扩散推理压至约 4 步，在消费级 GPU 上实现 540P、25-42 FPS 的实时生成。", "type": "tip", "relTime": "5天前"}, {"id": 169, "title": "Vidu S1 实现消费级GPU实时视频生成，PPIO推Agent云架构，Netflix强调AI产品判断", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2078991088736780598", "date": "2026-07-19T23:51:15.000Z", "summary": "Vidu S1 在消费级GPU上以25-42 FPS生成540P实时视频，通过算子优化和蒸馏至约4步推理实现。PPIO提出Agent云架构，日均处理Token超1.2万亿，核心包括模型网关和冷启动低于200毫秒的沙箱。Netflix CPTO强调AI加速原型后，产品判断、数据治理与创作者选择更为关键。", "type": "tip", "relTime": "5天前"}, {"id": 170, "title": "Gemma 4 12B 视频推理可视化", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2078890520785391883", "date": "2026-07-19T17:11:38.000Z", "summary": "这是一个精彩的视觉化展示。", "type": "tip", "relTime": "5天前"}, {"id": 171, "title": "Berry Xia 实测：Claude 3D 建模与视频生成能力惊人", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2078851241338401262", "date": "2026-07-19T14:35:33.000Z", "summary": "Berry Xia 实测发现，Claude 不仅能出色完成 3D 建模，还能在无任何 Skills 辅助下，一次成型生成高质量视频。他认为若配合 Skills 能力将更强大，并称\"好久没有如此的兴奋了\"。", "type": "tip", "relTime": "5天前"}, {"id": 172, "title": "生数科技朱军：从视频生成到世界模型的演进路径", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s/xE3SffTQWY0yRtqUA3cY4A", "date": "2026-07-19T14:31:17.000Z", "summary": "生数科技创始人朱军阐释了从视频生成到世界模型的演进路径。公司发布的实时交互模型Vidu S1支持无限时长连续生成与语音交互，世界动作模型Motubrain在RoboTwin 2.0的50余项复杂任务中平均成功率超过95%。", "type": "tip", "relTime": "5天前"}, {"id": 173, "title": "面壁智能开源 MiniCPM-Robot 具身智能模型系列", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2078839529591759025", "date": "2026-07-19T13:49:01.000Z", "summary": "面壁智能开源首个具身AI模型系列 MiniCPM-Robot，包含 1.5B 参数的通用视觉-语言-动作（VLA）模型 MiniCPM-RobotManip 和用于目标跟踪的 MiniCPM-RobotTrack。同时发布高性能推理框架 PhyAI，旨在让机器人实现理解、记忆与行动。", "type": "model", "relTime": "5天前"}, {"id": 174, "title": "面壁智能在 WAIC 2026 发布 MiniCPM5-2B 与 VLA 具身模型", "source": "公众号：面壁智能（MiniCPM）", "sourceUrl": "https://mp.weixin.qq.com/s/zs3eJ-K3HH5bwvjNfEUNhw", "date": "2026-07-19T13:12:39.000Z", "summary": "面壁智能在 WAIC 2026 端侧AI论坛上发布两款端侧大模型：20亿参数的MiniCPM5-2B文本模型在AA榜单位列2B以下第一，以及融合多模态与视觉Token压缩的VLA具身模型。其MiniCPM开源系列累计下载量突破3800万次，已落地手机、汽车等终端，并搭载于吉利银河M9等车型。", "type": "model", "relTime": "5天前"}, {"id": 175, "title": "Qwen3.8-Max-Preview 预览版发布，Token Plan 订阅方案升级", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.qwencloud.com/pricing/token-plan", "date": "2026-07-19T12:25:23.982Z", "summary": "通义千问发布 Qwen3.8-Max-Preview 预览版，并推出升级版 Token Plan 订阅方案。新方案提供 Individual 和 Team 两种计划，支持统一访问文本、视觉、语音和图像生成模型。Lite、Standard、Pro 三档月费计划分别支持 1-2、3-4、6-8 个并发智能体。", "type": "model", "relTime": "5天前"}, {"id": 176, "title": "Google DeepMind 提出 GenCeption，将视频生成模型改造为通用视觉模型", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/google-deepmind-argues-video-generators-already-contain-the-world-models-computer-vision-has-been-missing", "date": "2026-07-19T10:17:49.000Z", "summary": "Google DeepMind 提出 GenCeption，将阿里巴巴开源的 Wan2.1 视频生成模型改造为单次前向传播即可完成深度估计、分割等任务的模型。它仅用 7，500 段合成视频训练，数据量仅为竞品的 1/7 至 1/500，但在多个基准上匹配甚至超越了 DepthAnything 3 等专用模型。", "type": "paper", "relTime": "5天前"}, {"id": 177, "title": "阿里云推出个人Token计划，覆盖多模态", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2078784690534670495", "date": "2026-07-19T10:11:06.000Z", "summary": "一个计划。所有模态。超值价格。🚀  阿里云个人Token计划：✅ 文本、图像和视频的统一额度 ✅ Qwen3.8-Max-Preview · GLM-5.2 · DeepSeek-V4-Pro ✅ 用于视频生成的 Happy Horse 1.1 ✅ 首月（使用优惠券后）起价 4 美元/月  🔗 https://int.alibabacloud.com/m/1000415553/  #阿里云 ...", "type": "product", "relTime": "5天前"}, {"id": 178, "title": "Luma AI生成时尚大片：单眼串联全片", "source": "X：Luma AI (@LumaLabsAI)", "sourceUrl": "https://x.com/LumaLabsAI/status/2078780132819361953", "date": "2026-07-19T09:53:00.000Z", "summary": "一部完整的时尚大片，由一只眼睛和无数细微抉择串联而成。制作团队采纳了修改意见，而视觉始终坚定不移。作者：Eli Coleman。使用 Luma 制作。", "type": "paper", "relTime": "5天前"}, {"id": 179, "title": "AI文本检测器在模仿作者风格时漏检率飙升", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/ai-text-detectors-struggle-when-language-models-mimic-an-authors-style", "date": "2026-07-19T08:35:26.000Z", "summary": "Epoch AI研究显示，Pangram、GPTZero和Originality.ai检测普通AI文本近乎完美，假阴性率最高仅0.7%。但当Claude Opus 4.8等模型模仿特定作者风格写作时，平均13%的AI文本未被检出；科学写作类别中漏检率高达24%-29%，Pangram对Gemini生成的学术文本漏检率达48%。", "type": "paper", "relTime": "5天前"}, {"id": 180, "title": "阿里云百炼上线 HappyOyster 1.0，一句话生成可互动 AI 数字世界", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/978/729.htm", "date": "2026-07-19T08:16:45.000Z", "summary": "阿里云百炼今日上线开放式世界模型产品 HappyOyster 1.0，用户输入一句话或一张图即可生成可互动、可探索的 AI 数字世界。该模型支持 1 分钟连续实时交互的世界探索模式和 3 分钟以上分支叙事的实时导演模式，已提供三端 SDK 并开启灰测。", "type": "model", "relTime": "5天前"}, {"id": 181, "title": "Castor：开源命令行工具，从终端向电视投屏任意网页视频", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://github.com/stupside/castor", "date": tle": "荣耀发布伙伴型多模态智能体操作系统 AgenticOS，Robot Phone 8 月首发内核", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/978/621.htm", "date": "2026-07-19T00:30:21.000Z", "summary": "荣耀在 2026 世界人工智能大会上发布 AgenticOS，支持意图驱动、自然交互等四大特征，拥有行业首个系统级 Agent 架构。8 月发布的 Robot Phone 将首发其内核，Q4 的 Magic9 系列将推出尝鲜版。Robot Phone 搭载第五代骁龙 8 至尊版芯片，顶部集成行业最小四自由度钛合金机械云台，体积缩小 70%。", "type": "paper", "relTime": "5天前"}, {"id": 188, "title": "HarmoHOI：统一扩散框架实现多视角手物交互视频与3D运动联合生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.17097", "date": "2026-07-19T00:00:00.000Z", "summary": "HarmoHOI提出混合多视角扩散Transformer，将RGB视频与3D点轨迹作为伪视频共同建模，弥合2D潜空间与3D几何信号的域差距。通过全局运动对齐扩散将粗糙点轨迹优化为度量尺度的全局对齐3D轨迹，在去噪过程中协同演化2D外观与3D运动。实验表明，HarmoHOI在视觉质量、运动合理性和多视角几何一致性上达到SOTA。", "type": "paper", "relTime": "5天前"}, {"id": 189, "title": "TimeLens2：面向通用视频时序定位的多模态大语言模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.17423", "date": "2026-07-19T00:00:00.000Z", "summary": "TimeLens2 将视频时间证据视为区间集合进行监督与优化，其 TimeLens2-93K 数据集通过多步骤流程构建可靠标注。模型采用时序 Wasserstein 奖励函数，为不等基数与等效碎片化预测提供无匹配的密集反馈。TimeLens2-8B 在七个基准上以 48.0 平均 mIoU 达到 SOTA，超越最高 397B 参数的开源模型。", "type": "paper", "relTime": "5天前"}, {"id": 190, "title": "无人机编队表演舞蹈与特技", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2078624943021928715", "date": "2026-07-18T23:36:20.000Z", "summary": "在繁忙交通堵塞上空，小型无人机搭载舞者表演宝莱坞舞蹈，每架无人机一人，聚焦舞蹈动作。  （SD2）  啦啦队员身穿飞行服，在游乐园上空的无人机上进行特技表演，最后组成人塔，由地面业余电影人拍摄，白天。镜头稍微拉近，重新对焦。  （SD2）", "type": "tip", "relTime": "6天前"}, {"id": 191, "title": "NVIDIA 发布 DeepStream 9.1，新增 13 项智能体技能与多视角 3D 追踪", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/07/18/nvidia-released-deepstream-9-1-bringing-agentic-ai-to-vision-ai-with-13-skills-and-multi-view-3d-tracking", "date": "2026-07-18T19:16:22.000Z", "summary": "NVIDIA 发布 DeepStream 9.1，新增 13 项 agentic skills，支持通过自然语言描述构建多摄像头视觉管线。核心技能 MV3DT 将多摄像头检测投影至统一 3D 坐标系，为跨视角目标分配全局一致的 ID；AMC 技能可自动估算摄像头内外参，替代手动棋盘格标定。",

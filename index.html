放", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2097405053942563057", "date": "2026-09-08T19:21:47.000Z", "summary": "Inception 的 Mercury 2.5 现已在 OpenRouter 全面可用，地址为 https://openrouter.ai/inception/mercury-2.5。它是一个扩散式大语言模型，可并行解码 token 而非逐个生成，是 OpenRouter 最快模型榜单上无需专用硬件的最快模型，在代码密集型提示上收益最大。", "type": "model", "relTime": "4小时前"}, {"id": 7, "title": "OpenAI 推出 ChatGPT Images 2.5，图像生成更快更准", "source": "X：Greg Brockman (@gdb)", "sourceUrl": "https://x.com/gdb/status/2097400146220740627", "date": "2026-09-08T19:02:17.000Z", "summary": "OpenAI 推出 ChatGPT Images 2.5，重点提升图像生成速度和保真度，使图像更自然、更可辨识。新版本还支持多次编辑中保持细节一致，并新增评论式修改，只改动用户指定的部分。Greg Brockman 转发了该发布公告。", "type": "paper", "relTime": "4小时前"}, {"id": 8, "title": "OpenAI 宣布 ChatGPT Images 2.5 升级，同时推出 Sketch 画图功能", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2097399767915499797", "date": "2026-09-08T19:00:47.000Z", "summary": "OpenAI 宣布 ChatGPT Images 2.5 升级，带来更快的输出、更好的保真度以及代与代之间更强的生成一致性。同期刊发的官方推文介绍 Sketch 功能，用户在 ChatGPT 中输入 \"@ Sketch\" 即可手绘草图，把脑中的想法直观展示给模型。", "type": "model", "relTime": "5小时前"}, {"id": 9, "title": "OpenAI 发布 ChatGPT Images 2.5，图像生成更快更清晰", "source": "X：OpenAI (@OpenAI)", "sourceUrl": "https://x.com/OpenAI/status/2097394956457623964", "date": "2026-09-08T18:41:39.000Z", "summary": "OpenAI 发布 ChatGPT Images 2.5，官方称图像生成更快、更清晰、更智能。改进包括提升生成速度、更自然可辨识的图像保真度、多次编辑间保持细节一致，以及支持基于评论的编辑，只改动想改的部分。", "type": "paper", "relTime": "5小时前"}, {"id": 10, "title": "OpenAI 用上万智能体求解 Navier-Stokes 千禧年大奖难题", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2097389034230501620", "date": "2026-09-08T18:18:08.000Z", "summary": "OpenAI 宣布给出 Navier-Stokes 千禧年大奖难题的一个解，证明由一组智能体使用一个显著强于 GPT-6 Astra 的下一代模型生成，该问题关于光滑三维流体运动是否会崩溃，已悬置约 90 年。", "type": "paper", "relTime": "5小时前"}, {"id": 11, "title": "Google 更新 AI 天气模型 WeatherNext 3，提升预报准确度", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/science/2026/09/googles-ai-weather-model-now-uses-more-raw-satellite-data", "date": "2026-09-08T18:00:56.000Z", "summary": "Google 发布 WeatherNext 模型第 3 版，最大变化是开始纳入部分卫星天气数据，缩短了从当前天气状况到生成新预报之间的滞后时间。该模型在保持与传统模型相近预报性能的同时，所需算力大幅降低，可更频繁运行。更新细节已在一份白皮书中公布。", "type": "model", "relTime": "6小时前"}, {"id": 12, "title": "Krea 推出 Realtime Director 实时导演工具", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2097383941380694430", "date": "2026-09-08T17:57:53.000Z", "summary": "推出 Realtime Director。  这款新工具可让你实时导演高质量视频生成。  由 @fal 的 H3 Max 提供支持。", "type": "paper", "relTime": "6小时前"}, {"id": 13, "title": "OpenAI 称用智能体组合和强于 GPT-6 Astra 的下一代模型给出 Navier-Stokes 千禧年难题解法", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2097377214941597729", "date": "2026-09-08T17:31:10.000Z", "summary": "OpenAI 宣布给出 Navier-Stokes 千禧年大奖难题的一个解法，证明由一组智能体使用一个 OpenAI 下一代模型完成，官方称该模型能力显著强于 GPT-6 Astra。该问题关注 Navier-Stokes 方程描述的三维光滑流体运动是否会失解，约 90 年未决。Elvis Saravia 转发并评论称，若 GPT-6 Astra 已有此水平，下一代模型值得期待。", "type": "paper", "relTime": "6小时前"}, {"id": 14, "title": "TestingCatalog 转述 OpenAI 宣布智能体团队解决 Navier-Stokes 千禧年大奖难题", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2097375715704340707", "date": "2026-09-08T17:25:12.000Z", "summary": "TestingCatalog 转述 OpenAI 官方宣布：一组由其下一代模型驱动的智能体给出了 Navier-Stokes 千禧年大奖难题的解。OpenAI 称该模型能力显著强于 GPT-6 Astra；该问题关乎 Navier-Stokes 方程描述的三维光滑流体运动是否会崩溃，约 90 年未获解决。作者附加评语 Level 4 - Innovators。", "type": "tip", "relTime": "6小时前"}, {"id": 15, "title": "S1 机器人基础模型：提示词可操控性演示", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2097372419988263383", "date": "2026-09-08T17:12:06.000Z", "summary": "Skild AI 的机器人基础模型 S1 仅需 1 个视频示例即可学习新任务，并通过视频提示词操控行为。在相同厨房环境中，S1 能依据 4 种不同视频指令执行相应动作序列，包括\"将盘子放入烤面包机\"这类分布外任务。该能力决定新任务是否需要重新训练，或成机器人基础模型最具经济价值的特性。", "type": "model", "relTime": "6小时前"}, {"id": 16, "title": "作者发布浏览器端 LLM 注意力权重可视化工具", "source": "Hacker News：AI 热帖", "sourceUrl": "https://ishamf.dev/p/llm-attention-visualizer", "date": "2026-09-08T16:59:41.000Z", "summary": "作者发布一个基于 Transformers.js 的 LLM 注意力可视化工具，可悬停查看生成 token 依赖的历史 token，代码开在 GitHub。可视化将所有层、所有注意力头的注意力权重乘以 value 向量模长后聚合为单一数值控制透明度，并预生成提示词避免下载数百 MB 模型；作者还通过修改 onnx 文件暴露内部值，上传到自己的 Hugging Face 仓库供浏览器生成使用。", "type": "tip", "relTime": "7小时前"}, {"id": 17, "title": "蚂蚁百灵开源 Ling-3.0-flash-VL 多模态模型", "source": "X：蚂蚁百灵 (@AntLingAGI)", "sourceUrl": "https://x.com/AntLingAGI/status/2097359640233439299", "date": "2026-09-08T16:21:19.000Z", "summary": "蚂蚁百灵今日开源 Ling-3.0-flash-VL，提供 BF16 和 FP8 权重，FP4 和 INT4 版本即将推出。该模型除视觉识别外，还能理解图像、视频、文档与 UI，按视觉线索进行推理、搜索与验证，并可使用工具、检查结果并交付结果。", "type": "model", "relTime": "7小时前"}, {"id": 18, "title": "宇树G1机器人格斗演示：快速反应惊艳", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2097339184948076674", "date": "2026-09-08T15:00:03.000Z", "summary": "中国的机器人格斗场景刚刚升级了。一段新演示显示，宇树科技的G1机器人能够连贯执行动作并以惊人速度做出反应。其世界模型读取视觉输入，预测接下来会发生什么，并从预定义动作库中选择最佳响应。G1仍无法自主规划新动作。但说实话，机器人格斗正是从这里开始变得令人兴奋：虽尚未完全智能，但已经足够快速、灵敏，让人难以忽视。", "type": "model", "relTime": "9小时前"}, {"id": 19, "title": "OpenAI Astra 通关 48 关《我不是机器人》游戏引出人机验证失效之辩", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2097332900265934869", "date": "2026-09-08T14:35:04.000Z", "summary": "OpenAI 发布 4 天的 Astra 看屏幕、挪鼠标、点拖拽，打完 48 关《我不是机器人》讽刺游戏并取得人类证书。作者提醒同一套能力在官方安全报告中被标为网络安全最高危档，认为 GUI 成为模型天然 API 后，不愿交出人脸、指纹和硬件密钥的普通人反而会被系统当成可疑假人。", "type": "tip", "relTime": "9小时前"}, {"id": 20, "title": "字节跳动拟推Seedance空间视频模型", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2097330053944377546", "date": "2026-09-08T14:23:46.000Z", "summary": "据彭博社报道，字节跳动正准备最快于下月推出一款基于Seedance的空间视频模型。创始人张一鸣亲自督办该项目，不过计划仍可能有变。该模型将创建可交互的3D世界，能够响应Pico用户的语音和动作。据称输出可达20fps，延迟0.05秒。云端生成可降低头显设备要求，将与Google、Meta和Apple的竞争转向AI模型、算力和内容层面。", "type": "model", "relTime": "9小时前"}, {"id": 21, "title": "发布仅 4 天的 Astra 模型通关\"我不是机器人\"全部 48 关", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2097329116995363134", "date": "2026-09-08T14:20:02.000Z", "summary": "作者转述：发布仅 4 天的模型 Astra 通关了\"我不是机器人\"游戏全部 48 关，全程约 2 小时的过程被压成 3 分半一镜到底视频，证书名字栏填的是它自己。对比来看，人类自己打完这 48 关通常要 30 到 60 分钟，作者称通关率约百分之一。", "type": "tip", "relTime": "9小时前"}, {"id": 22, "title": "Adobe Premiere 更新 AI 功能，时间线上可直接生成音视频素材", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/926.htm", "date": "2026-09-08T13:21:33.000Z", "summary": "Adobe 宣布重新设计 Premiere 的 AI 交互，新的生成式媒体工具支持在时间线空白区域直接生成视频、音效、音乐和声景，无需切换应用。时间线可调用 Adobe Firefly、谷歌 Veo、Runway、Luma 和可灵等多种底层模型。", "type": "model", "relTime": "10小时前"}, {"id": 23, "title": "Premiere 推出 Generative Media 工具，可在时间线内直接生成视频和音频", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/991133/adobe-is-trying-to-make-its-ai-generators-idiot-proof-in-premiere", "date": "2026-09-08T13:00:00.000Z", "summary": "Adobe 为 Premiere 推出 Generative Media 工具，编辑可在项目时间线内高亮空缺直接生成视频、音效、音乐和声景，无需离开项目。", "type": "paper", "relTime": "11小时前"}, {"id": 24, "title": "OpenAI 发布 ChatGPT Images 2.5 图像模型", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "sourceUrl": "https://openai.com/index/introducing-chatgpt-images-2-5", "date": "2026-09-08T11:30:00.000Z", "summary": "OpenAI 发布 ChatGPT Images 2.5 图像模型，生成延迟比 Images 2.0 降低最多 50%，细节、编辑精度、参考照片保真度和多轮编辑一致性均有提升。", "type": "model", "relTime": "12小时前"}, {"id": 25, "title": "新石器无人车落地韩国济州岛，首度在当地户外度假场景实现运营", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/760.htm", "date": "2026-09-08T07:41:23.000Z", "summary": "新石器联合韩国自动驾驶企业 NT1 及济州岛 Campertree（香樟树）酒店，令无人配送车首次在韩国户外度假场景投入运营。该车可在度假村内部公开道路自主行驶，承担客房配送与行李运送，并通过视觉感知与端到端神经网络技术实现全链路自动驾驶。此前新石器已于 2025 年 7 月与仁川市政府签署试点意向书，成为首家进入韩国市场的中国 L4 级无人配送企业。", "type": "paper", "relTime": "16小时前"}, {"id": 26, "title": "微信开源多模态嵌入模型 WeMM-Embedding，已在微信大规模使用且日调用量达 10 亿次", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/527.htm", "date": "2026-09-08T01:02:16.000Z", "summary": "微信 AI 于 9 月 4 日宣布开源通用多模态嵌入模型 WeMM-Embedding，包含 2B、4B、9B 三个版本，支持文本、图像、视频、视觉文档及任意交错的多模态输入。", "type": "model", "relTime": "22小时前"}, {"id": 27, "title": "今天的一个想法， 文本大模型与视频大模型定位的拐点到来了， 这两种模型之前看上去不存在上下游关系， 但是现在变成了\"显式符号/几何模拟（3D引擎 + 符号逻辑）\" →\"隐式统计生成（像素级视频生成扩散…", "source": "X：karminski (@karminski3)", "sourceUrl": "https://x.com/karminski3/status/2097043972640420167", "date": "2026-09-07T19:26:58.000Z", "summary": "暂无摘要", "type": "model", "relTime": "1天前"}, {"id": 28, "title": "Unitree 发布首个世界模型驱动的自主人形机器人格斗视频 UnifoLM-X2-1.0", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2097023203231297887", "date": "2026-09-07T18:04:27.000Z", "summary": "Unitree 发布首个由世界模型驱动的自主人形机器人格斗视频，UnifoLM-X2-1.0 通过实时预测与规划取代人类操作员。相比现有 G1-Boxing 方案，世界模型在机器人行动前预测物理交互的走向，为策略提供决策依据；格斗等场景中延迟至关重要，Unitree 称 X2-1.0 可实时运行该循环。", "type": "model", "relTime": "1天前"}, {"id": 29, "title": "GPT-6 Astra 可视化热门 AI 论文测试", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2097009154963419528", "date": "2026-09-07T17:08:37.000Z", "summary": "在 GPT-6 Astra 上测试可视化热门 AI 论文。  从这篇精美生成的 Transformer 论文交互式版本开始。  这为探索研究开启了新方式。", "type": "paper", "relTime": "1天前"}, {"id": 30, "title": "NVIDIA Sol 团队发布 Sol-H3，MiniMax-H3 视频生成速度超过播放速度", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2097006566696444363", "date": "2026-09-07T16:58:20.000Z", "summary": "NVIDIA Sol 团队与 MiniMax 合作发布 Sol-H3 端到端推理加速栈，在 8× NVIDIA B300 Blackwell 上生成 5 秒 1344×768 立体声视频仅需 1.653 秒，相比 50 步 Base H3 最高提速 15.54×，且在 1×、4×、8× B300 上均可扩展。", "type": "paper", "relTime": "1天前"}, {"id": 31, "title": "GPT 6 Astra 实测解决真实世界问题", "source": "X：Greg Brockman (@gdb)", "sourceUrl": "https://x.com/gdb/status/2096998038443348263", "date": "2026-09-07T16:24:27.000Z", "summary": "GPT 6 Astra （Ultra） 通过约4分钟视频理解用户描述的浴室排水管缠发问题，提取语音并匹配测量画面，提出改进方案。它使用计算机操作在 Fusion 360 中实时设计出全参数化零件，用户 3D 打印后首次尝试即完美适配，称其为\"接触 AGI 的时刻\"。", "type": "paper", "relTime": "1天前"}, {"id": 32, "title": "Astra 视觉优势助其社交媒体胜出", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2096997239281385549", "date": "2026-09-07T16:21:16.000Z", "summary": "我认为这不是最初的目标，但 Astra 在视觉美观的 3D 作品（如 Blender 等）方面表现出色，这使它在社交媒体注意力之争中比 Fable 更具感知优势。其他类型的输出更难评判，但视觉内容的效果一目了然。", "type": "paper", "relTime": "1天前"}, {"id": 33, "title": "Gemini 也能生成毒舌机器人了", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2096994065497649521", "date": "2026-09-07T16:08:40.000Z", "summary": "Gemini 现在也能做出毒舌机器人了 💅", "type": "paper", "relTime": "1天前"}, {"id": 34, "title": "消息称字节跳动开发实时空间视频生成 AI 模型，张一鸣亲自督导，最快下月发布", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/478.htm", "date": "2026-09-07T13:51:53.000Z", "summary": "据彭博社报道，字节跳动正开发实时空间视频生成 AI 模型，创始人张一鸣亲自督导研发，计划最早下月发布，发布时间尚未最终确定。该模型基于电影级视频生成模型 Seedance 构建，面向直播、短剧和游戏创建交互式虚拟世界，可在每秒 20 帧帧率下以约 50 毫秒延迟按需生成视频流，响应 Pico 头显用户的语音或动作。", "type": "industry", "relTime": "1天前"}, {"id": 35, "title": "京东 JoyAI App 推出首个能实时视频购物的 AI 数字人", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/415.htm", "date": "2026-09-07T10:46:50.000Z", "summary": "京东 JoyAI App 推出可实时视频购物的 AI 数字人，通过\"万能博士\"在视频通话内实时解析商品画面、调取京东商品并直接下单，全程不切换 App。用户上传一张图片即可自定义数字人形象、人设、音色和交互场景，数字人还支持点外卖、订酒店、健康咨询、金融咨询等服务，支付环节搭载京东 AI 付声纹验证。今年以来 JoyAI App 对话用户数增速超过 15 倍。", "type": "product", "relTime": "1天前"}, {"id": 36, "title": "实时视频生成来临：下一个应用爆发的机会", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/crossing/the-next-big-app-opportunity-when-real-time-video-generation", "date": "2026-09-07T09:05:00.000Z", "summary": "实时视频生成技术正走向成熟，被视为下一个应用爆发的关键机会。该技术有望大幅降低视频制作门槛，推动内容创作、互动娱乐等领域出现新形态产品。行业正密切关注其落地节奏与商业化潜力。", "type": "product", "relTime": "1天前"}, {"id": 37, "title": "最高法发布涉人工智能纠纷案件审理意见，明确 AI 换脸拟声等裁判规则", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/313.htm", "date": "2026-09-07T07:46:08.000Z", "summary": "最高人民法院发布《关于依法审理涉人工智能纠纷案件的意见》，共 5 部分 24 条，明确 AI 换脸拟声、AI 复活逝者、大数据杀熟、仿冒名人带货、网络开盒及自动驾驶事故等情形的裁判规则。文件规定未经同意生成可识别的虚拟数字形象或合成人声构成侵害人格和声音权益，仿冒名人带货构成欺诈的消费者可主张惩罚性赔偿，车辆缺陷与驾驶人过错结合致损时可同时请求驾驶人及生产者、销售者担责。", "type": "industry", "relTime": "1天前"}, {"id": 38, "title": "Viggle 发布 Viggle-Animate，可三步在本地 PC 上将任意角色替换进视频", "source": "X：Viggle AI (@ViggleAI)", "sourceUrl": "https://x.com/ViggleAI/status/2096724465094689195", "date": "2026-09-06T22:17:22.000Z", "summary": "Viggle 感谢 @cocktailpeanut 的实测反馈，称 Viggle-Animate 效果好于预期，并给出 Hugging Face 开放入口 https://huggingface.co/Viggle/Viggle-Animate。引用内容称该工具只需单帧即可生成，无需 pose/mask/face/depth 工作流，质量超出预期。", "type": "paper", "relTime": "2天前"}, {"id": 39, "title": "H Company 发布 NeoMME 260M/800M 单塔多模态编码器，取消视觉塔和因果解码器", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/06/h-company-releases-neomme-a-family-of-260m-and-800m-single-tower-multimodal-encoders-that-drop-the-vision-tower-and-causal-decoder", "date": "2026-09-06T21:06:41.000Z", "summary": "H Company 发布 NeoMME 系列多模态编码器，包含 260M 和 800M 两个双向 Transformer 模型，用单一塔处理多语言文本和 32×32 图像块，去掉了独立视觉塔和因果解码器，以离散掩码扩散方式预训练。", "type": "model", "relTime": "2天前"}, {"id": 40, "title": "GPT-6 Astra 百款演示分类盘点", "source": "X：Deedy Das (@deedydas)", "sourceUrl": "https://x.com/deedydas/status/2096652977952202922", "date": "2026-09-06T17:33:18.000Z", "summary": "我浏览了数百个 GPT-6 Astra 演示，并将最佳案例进行了整理和分类。  远不止那些 3D Blender 演示，还包括： - 3D（三维建模、教育、游戏） - 机器人控制 - 音乐生成 - 纯视觉 - 生物 - UI - 计算机操作（绘画、游戏、Figma） - 金融  在视觉、计算机操作、空间推理和原始智能方面，这确实是一款非常强大的模型。  1/22", "type": "model", "relTime": "2天前"}, {"id": 41, "title": "Travis Kalanick 旗下 Atoms 或将进入 robotaxi 业务", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/06/travis-kalanicks-atoms-might-be-getting-into-the-robotaxi-business", "date": "2026-09-06T16:45:00.000Z", "summary": "据 Financial Times 报道，Travis Kalanick 创办的 Atoms 正准备大规模招聘和收购，可能成为自动驾驶行业的重要玩家，并已与 Uber 商谈让其使用 Atoms 的 robotaxi 技术。", "type": "industry", "relTime": "2天前"}, {"id": 42, "title": "AI 短剧带火人脸授权生意，普通人数字肖像每部约 100 元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/037.htm", "date": "2026-09-06T14:06:14.000Z", "summary": "据央视财经报道，AI 短剧和数字广告扩张带动数字人脸素材采购需求，人脸授权平台将授权人分为普通人和专业演员两类。普通人的数字肖像按每部短视频约 100 元付费，专业演员按使用范围和剧集长度定价，从 500 元到数千元，成交后平台与授权人按比例分成。", "type": "industry", "relTime": "2天前"}, {"id": 43, "title": "微软发布 AI 快速入门指南，30 分钟即可生成并发布 WinUI 原生应用", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/015.htm", "date": "2026-09-06T11:17:12.000Z", "summary": "微软发布快速入门指南，开发者借助 AI、VS Code、winapp CLI 和 GitHub Copilot 免费版，从空文件夹开始约 30 分钟即可创建并发布 WinUI 3 应用，无需安装 Visual Studio，流程包括让 AI 智能体添加功能、测试、打包成 MSIX 并提交 Microsoft Store。", "type": "product", "relTime": "2天前"}, {"id": 44, "title": "Google 与 DeepMind 发布 WeatherNext 3：跳过物理模拟，直接从实时卫星数据学习天气预报", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/googles-weathernext-3-ditches-physics-simulations-and-learns-weather-directly-from-live-satellite-data", "date": "2026-09-06T10:36:35.000Z", "summary": "Google Research 与 DeepMind 发布 AI 天气模型 WeatherNext 3，不再依赖传统物理模拟，直接处理实时地球静止卫星数据，每小时生成一次预报。", "type": "paper", "relTime": "2天前"}, {"id": 45, "title": "阑夕用《帝国时代II》奇观类比解读SOTA模型的领先周期", "source": "X：阑夕 (@foxshuo)", "sourceUrl": "https://x.com/foxshuo/status/2096532057237422318", "date": "2026-09-06T09:32:48.000Z", "summary": "阑夕提出，新模型发布首日Demo刷屏、次日集体反思已是固定节奏，SOTA模型本身也是一种「奇观」。他以《帝国时代II》的奇观机制作比：GPT-4是维持最久的一座奇观，发布一年后才被Claude 3 Opus攻破；2025年后前沿模型差距变小，领先通常三个月内被追平，AI大厂必须在新奇观建成前不断开建下一座。", "type": "tip", "relTime": "2天前"}, {"id": 46, "title": "阿里千问开源 Qwen-Drive-1.0-4B 自动驾驶视觉语言模型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/997.htm", "date": "2026-09-06T09:15:06.000Z", "summary": "阿里千问本周开源 Qwen-Drive-1.0-4B，一款基于 Qwen3.5-4B 构建的自动驾驶视觉语言基础模型，官方称其为首个面向自动驾驶的视觉语言基础模型。", "type": "model", "relTime": "2天前"}, {"id": 47, "title": "博主把视频制作流程做成主动引导式 Skill，一个爆贴一天涨粉 4000", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2096499131347071048", "date": "2026-09-06T07:21:58.000Z", "summary": "阿易转发大雷（@AaronYiaazw）的视频制作教程案例：后者把完整视频制作流程做成主动引导式 Skill，已发布在 GitHub（image-story-video-wizard），一个爆贴一天涨了 4000 粉。安装后在 Codex 或 WorkBuddy 中启动 Skill，即可按流程一步步引导完成视频制作；完整安装方法、制作流程和踩坑见其教程文章。", "type": "tip", "relTime": "2天前"}, {"id": 48, "title": "Astra 进军医学应用场景", "source": "X：Greg Brockman (@gdb)", "sourceUrl": "https://x.com/gdb/status/2096485443667890228", "date": "2026-09-06T06:27:35.000Z", "summary": "Astra 进军医学应用场景  【引用 @HandEManAI】：我完全惊呆了！  这仅仅来自一个提示词，让 Astra（medium）制作一段我们手外科医生做的肌腱转位手术（EIP 到 EPL 肌腱转位）视频。  很兴奋能继续探索其在手术教育、患者教育和机器人模拟中的应用！", "type": "paper", "relTime": "2天前"}, {"id": 49, "title": "公安部发布\"国家反诈 AI\"App，微信、支付宝小程序同步开放", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/922.htm", "date": "2026-09-06T05:44:45.000Z", "summary": "公安部宣布，由公安部刑侦局指导、上海市公安局自主研发的\"国家反诈 AI\"App 正式上线，微信、支付宝小程序同步开放，用户可在各大手机应用市场下载。该 App 融合大语言、多模态模型和智能体技术，提供 AI 大模型智能问答、反诈资讯和反诈辞典三大功能，可对用户输入的可疑场景完成风险研判、识别诈骗套路并推送典型案例，从文字、语音、视频多个维度拆解诈骗手法并提供防范对策。", "type": "model", "relTime": "2天前"}, {"id": 50, "title": "Simon Willison 实测 GPT-6 Astra 开发者版本", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/5/introducing-gpt-6-astra-for-developers", "date": "2026-09-05T23:27:48.000Z", "summary": "Simon Willison 分享对面向开发者的 GPT-6 Astra 的试用印象：Astra 在细节把握、理解用户提示词和构建更复杂输出方面全面提升，尤其擅长 3D 建模，他见过它生成花园、船厂、动物、城市景观甚至戴森球的精美渲染，并成功生成了骑自行车的鹈鹕戴红色领巾的场景。", "type": "tip", "relTime": "3天前"}, {"id": 51, "title": "特斯拉：预计将于下月实现 Robotaxi 自动驾驶无人出租车 24 小时全天候运营", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/849.htm", "date": "2026-09-05T23:14:44.000Z", "summary": "暂无摘要", "type": "paper", "relTime": "3天前"}, {"id": 52, "title": "Grok Imagine Video 1.5 Agent 上线，底层换用 Image 2.0 图像模型", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2096332080929968424", "date": "2026-09-05T20:18:10.000Z", "summary": "Grok Imagine Video 1.5 agent 现已可用，由最新的 Image 2.0 图像模型驱动，官方称质量更高、叙事更强，并擅长以更好的连续性衔接多个镜头。TestingCatalog 用 \"Make me an ad banner for @testingcatalog\" 实测后认为结果相当不错。", "type": "model", "relTime": "3天前"}, {"id": 53, "title": "GPT-6 Astra 两小时生成玛雅遗址3D模型", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2096314593182171545", "date": "2026-09-05T19:08:41.000Z", "summary": "我现在简直难以置信。  GPT-6 Astra 真是一个令人惊叹的模型。  它花了大约 2 小时生成了苏南图尼奇（Xunantunich）的 3D 模型，这是伯利兹西部的一处玛雅考古遗址。", "type": "model", "relTime": "3天前"}, {"id": 54, "title": "OnSolo 年付计划上线，Seedance 2.0 视频低至 $0.066/秒", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2096300727279005837", "date": "2026-09-05T18:13:35.000Z", "summary": "OnSolo 推出年付计划，Seedance 2.0 720p 视频生成价格降至 $0.066/秒，5 秒片段仅需 $0.33，较原价节省 9%-45%。低成本让 AI 视频试错更划算，用户可大量探索运镜、节奏与种子等变量。", "type": "paper", "relTime": "3天前"}, {"id": 55, "title": "Grok Imagine Video 1.5 agent 上线，由 Image 2.0 模型驱动", "source": "X：Andrew Milich (@milichab)", "sourceUrl": "https://x.com/milichab/status/2096298464632299599", "date": "2026-09-05T18:04:35.000Z", "summary": "Grok Imagine Video 1.5 agent 现已可用，由最新的 Image 2.0 模型驱动。作者称它结合了编码智能体与图像、视频模型的能力，用于智能化的创意叙事，画质更高，更擅长以更强的连贯性衔接多个镜头。", "type": "model", "relTime": "3天前"}, {"id": 56, "title": "Astra 生成圣经天使图像引热议", "source": "X：Emad Mostaque (@EMostaque)", "sourceUrl": "https://x.com/EMostaque/status/2096296066677108768", "date": "2026-09-05T17:55:04.000Z", "summary": "别让 Astra 制作符合圣经描述、细节详尽的天使 👼 👁️ 🪽", "type": "paper", "relTime": "3天前"}, {"id": 57, "title": "GPT-6 Astra 生成 3D 内容能力惊人", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2096288397811679718", "date": "2026-09-05T17:24:35.000Z", "summary": "GPT-6 Astra 在生成 3D 内容方面简直不可思议。  \"生成一个 Grok Bot 版本的 Codex Micro。\"  现在我非常想要这个！  只需一个提示词。想象它还能做什么--稍后我会分享更多惊人的示例。", "type": "paper", "relTime": "3天前"}, {"id": 58, "title": "GPT-6 Astra 重建布列纪念堂 3D 模型", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2096270461122347131", "date": "2026-09-05T16:13:19.000Z", "summary": "Ethan Mollick 让 GPT-6 Astra 依据布列 1784 年未建成建筑\"牛顿纪念堂\"的几张黑白草图与文字描述，构建出完整 Blender 模型，并生成带旁白的漫游视频。此前 Gemini 图像生成器（nano banana）也曾据原图对该建筑进行成像。", "type": "model", "relTime": "3天前"}, {"id": 59, "title": "解放军总医院第六医学中心完成全球首例 AI 超声机器人引导下先天性心脏病封堵术", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/823.htm", "date": "2026-09-05T13:11:10.000Z", "summary": "9 月 5 日上午，解放军总医院第六医学中心心血管病医学部完成人工智能超声机器人引导下先天性心脏病介入封堵术，经科技查新为全球首例同类智能技术临床应用。患者为 48 岁男性，确诊房间隔缺损且缺损边缘解剖条件较差。该系统由朱航主任团队与清华科研团队联合研发，通过机械臂自主扫查、AI 自动甄别病灶、构建心脏三维模型并规划手术路径，实现影像识别与手术操作的双向智能协同，提升了手术精准度与安全性。", "type": "model", "relTime": "3天前"}, {"id": 60, "title": "微软发布 MAI-Image-2.6-Flash：生图速度是 GPT Image 2 的 2 倍", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/747.htm", "date": "2026-09-05T06:58:19.000Z", "summary": "微软于 9 月 4 日发布自研图像生成模型 MAI-Image-2.6-Flash，并通过 Microsoft Foundry 开放公开预览。该模型与旗舰版 MAI-Image-2.6 共享文生图和图像编辑核心能力，重点优化速度与成本；微软 AI 负责人 Mustafa Suleyman 称其生图速度是 GPT Image 2 的 2 倍，GPU 效率提高 72%。", "type": "model", "relTime": "3天前"}, {"id": 61, "title": "@t_mux 的视频重拍摄模型即将开源，可从单段视频生成冻结时间环绕镜头", "source": "X：Viggle AI (@ViggleAI)", "sourceUrl": "https://x.com/ViggleAI/status/2096122559771148370", "date": "2026-09-05T06:25:36.000Z", "summary": "@t_mux 受 The World Labs 发布的 Atlas 启发，展示了一个可将已有视频从不存在的新相机视角重新拍摄的视频模型，演示了从单段视频围绕猫做冻结时间环绕拍摄。作者称模型仍处于早期粗糙阶段，但权重和代码即将开源，ViggleAI 转发并预告开源消息，同时征集想重拍的视频。", "type": "model", "relTime": "3天前"}, {"id": 62, "title": "Ethan Mollick 转发调侃：Astra 用 VBA 在电子表格里做出了 Space Invaders", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2096096763153105214", "date": "2026-09-05T04:43:06.000Z", "summary": "Ethan Mollick 引用网友关于 zork 转 3D、Fortnite 转文本的玩笑帖，称已有人把 Space Invaders 做成电子表格，由 Astra 用 VBA 实现，并附上视频。", "type": "tip", "relTime": "3天前"}, {"id": 63, "title": "百度智能云发布百度搭子教学套件，围绕教学场景提供四大核心能力", "source": "公众号：百度智能云（文心）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzA5NTQ5MzE5OQ%3D%3D&mid=2653160075&idx=1&sn=5cce58a2bdfb187adf8e7d2f45efce0e", "date": "2026-09-05T02:00:00.000Z", "summary": "百度智能云推出百度搭子教学套件，围绕教学场景提供教学方案设计、公开课设计、AI课程改造和知识图谱构建四项核心能力。老师提交课程资料后可唤起秒哒生成可交互的3D课件；AI课程改造从内容适配性、学生受益度等五个维度评估课程并提供16课时标准课程骨架；知识图谱支持六种概念关系识别，可输出交互式HTML和PNG。", "type": "paper", "relTime": "3天前"}, {"id": 64, "title": "Uno 扩散增强 LLM 论文提出无损并行 token 生成，最高 3x 加速", "source": "X：DAIR.AI (@dair_ai)", "sourceUrl": "https://x.com/dair_ai/status/2096010455210959202", "date": "2026-09-04T23:00:09.000Z", "summary": "arXiv 论文（2609.04010）提出 diffusion-augmented LLMs，即 Uno，一类在自回归模型分布上用扩散并行抽取多个 token 的新模型。", "type": "paper", "relTime": "4天前"}, {"id": 65, "title": "Sam Altman 在 Bloomberg 澄清 GPT-6 Astra 并非因网络安全担忧被暂停的模型", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2095988755060633604", "date": "2026-09-04T21:33:55.000Z", "summary": "Sam Altman 在 Bloomberg Television 表示，GPT-6 Astra 不是因网络安全担忧被暂停的那个模型，被暂停的是一个未来模型，Astra 已完成训练一段时间。他还称 Astra 达到了 cyber-critical 级别。完整视频来自 Bloomberg Television YouTube 频道。", "type": "tip", "relTime": "4天前"}, {"id": 66, "title": "fofr 分享一段「去公园喂鸭子」的生成视频", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2095973163632836708", "date": "2026-09-04T20:31:58.000Z", "summary": "fofr 发布了一段视频，配文「Perfectly normal trip to the park to feed the ducks.（非常平常的去公园喂鸭子）」，以看似普通的日常场景展示生成视频效果。", "type": "tip", "relTime": "4天前"}, {"id": 67, "title": "Tesla 展示 Cybercab 如何用机器人保持车身清洁", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2095962486566732236", "date": "2026-09-04T19:49:32.000Z", "summary": "DogeDesigner 分享一段视频，展示 Tesla Cybercab 的清洁方式，由机器人来完成清洁工作，作者称之为 a robot for a robot。", "type": "paper", "relTime": "4天前"}, {"id": 68, "title": "Viggle 发布首个开放权重模型 Viggle-Animate", "source": "X：Viggle AI (@ViggleAI)", "sourceUrl": "https://x.com/ViggleAI/status/2095924668758655163", "date": "2026-09-04T17:19:16.000Z", "summary": "Viggle 发布首个开放权重模型 Viggle-Animate，基于 MiniMax-H3 构建，可从一帧重绘帧替换视频中的人物，渲染时无需姿势骨架、遮罩或文本提示。模型经 3 次前向传播可在 26 秒内生成 5 秒视频，已在 Hugging Face 开放（https://huggingface.co/viggle/viggle-animate）。", "type": "model", "relTime": "4天前"}, {"id": 69, "title": "Microsoft 发布 MAI-Image-2.6-Flash 图像模型，速度与价格性能领先", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2095923346462384261", "date": "2026-09-04T17:14:00.000Z", "summary": "Mustafa Suleyman 宣布 Microsoft 新图像模型 MAI-Image-2.6-Flash 开放体验，称其生成速度比 GPT-Image-2 快 2 倍，GPU 使用效率高 72%，可提供更低价格。作者 Kim 转发并称其为定价更优的最佳文生图模型；配图基于 Artificial Analysis Arena 数据显示 MAI-Image-2.6 与 Flash 处于质量...", "type": "model", "relTime": "4天前"}, {"id": 70, "title": "Visko 发布 Orbis 1.0 评测报告：实时交互长视频生成在人类 Arena 总分 1，838 排名第一", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2095921609924333855", "date": "2026-09-04T17:07:06.000Z", "summary": "Visko 公布 Orbis 1.0 的评测结果：在自动化基准中于 DOVER 美学与技术和 VideoAlign 视觉与运动质量得分最高，并在 VideoPhy-2、Physics-IQ、VBench-2.0 Physics 三个物理合理性协议领先；在随机化人类 Arena 研究中总偏好和时间稳定性均排第一。", "type": "paper", "relTime": "4天前"}, {"id": 71, "title": "Microsoft AI 发布图像模型 MAI-Image-2.6-Flash，速度比 GPT-Image-2 快 2 倍", "source": "X：Mustafa Suleyman（Microsoft AI CEO） (@mustafasuleyman)", "sourceUrl": "https://x.com/mustafasuleyman/status/2095907880209641517", "date": "2026-09-04T16:12:33.000Z", "summary": "Microsoft AI CEO Mustafa Suleyman 宣布新图像模型 MAI-Image-2.6-Flash 开放使用，称其生成速度比 GPT-Image-2 快 2 倍，GPU 使用效率高 72%，可支持更低定价，达到全球最佳性价比。配图为 Artificial Analysis Arena 的质量与价格对比图，显示 MAI-Image-2.6 和 MAI-Image-2.6...", "type": "model", "relTime": "4天前"}, {"id": 72, "title": "Microsoft 发布 MAI-Image-2.6，推进质量与成本边界", "source": "Microsoft AI：官方博客（网页）", "sourceUrl": "https://microsoft.ai/news/pushing-the-quality-cost-frontier-with-mai-image-2-6", "date": "2026-09-04T16:02:05.000Z", "summary": "Microsoft AI 官方博客发布 MAI-Image-2.6，主题为推进图像生成质量与成本的边界；正文未提供更多细节。", "type": "paper", "relTime": "4天前"}, {"id": 73, "title": "博主分享豆包生成女生含泪特写视频的完整提示词", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095905150460387531", "date": "2026-09-04T16:01:42.000Z", "summary": "博主称唐国强说 AI 很快会取代演员，并展示用豆包生成的女生含泪特写视频。附完整提示词，用 85mm 特写、情绪递进、眼泪滑落与镜头呼吸起伏等细节逐条描述，以日系校园电影氛围和真实摄影质感控制生成效果，其中情绪细节短语大量重复累计 4000+ 次。", "type": "tip", "relTime": "4天前"}, {"id": 74, "title": "fofr 实测 Omni 1.1 视频参考：把车改成船仍保持对参考的忠实", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2095892983878930648", "date": "2026-09-04T15:13:21.000Z", "summary": "fofr 分享对 Omni 1.1 视频参考灵活性的实测，将 Luce 车型生成为船版本，模型在改变必要部分的同时保持对参考的忠实。正文附视频和提示词 \"A boat version of this car\"。", "type": "tip", "relTime": "4天前"}, {"id": 75, "title": "fofr 演示 Omni 1.1 视频参考与视频延长结合的用法", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2095868940580733284", "date": "2026-09-04T13:37:49.000Z", "summary": "fofr 演示 Omni 1.1 新支持的视频参考功能，可用两条 3 秒参考视频向生成视频插入一致、准确的角色和物体，示例为在行驶的 Ferrari Luce 上倒立的提示词。他还展示将视频延长与视频参考结合的用法，通过引用 VIDEO_REF 并提示 Extend this video 来延续原视频。", "type": "tip", "relTime": "4天前"}, {"id": 76, "title": "Omni 1.1 新增视频参考功能，可将角色和物体一致地插入生成视频", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2095868365923323917", "date": "2026-09-04T13:35:32.000Z", "summary": "Omni 1.1 现已支持视频参考（video references），可用于将一致且准确的角色和物体插入生成的视频中。作者演示了一段在行驶的 Ferrari Luce 上做倒立的视频，使用两条各 3 秒的参考视频，并以叠加形式展示参考内容与生成结果。", "type": "paper", "relTime": "4天前"}, {"id": 77, "title": "微信开源多模态嵌入模型 WeMM-Embedding，含 2B/4B/9B 三个版本", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/599.htm", "date": "2026-09-04T13:21:17.000Z", "summary": "微信 AI 宣布开源通用多模态嵌入模型 WeMM-Embedding，含 2B、4B、9B 三个版本，支持文本、图像、视频、视觉文档及交错多模态输入。模型基于 Qwen3.5 多模态架构，WeMM-Embedding-9B 在 MMEB-v2 榜单以 80.6 分位列第一；该模型已大规模部署于视频号、直播、公众号、电商与朋友圈的推荐与搜索系统，日调用量达 10 亿量级。", "type": "model", "relTime": "4天前"}, {"id": 78, "title": "玉伯用 YouMind 把 UTC 时区疑问变成讲解视频", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2095857355410047094", "date": "2026-09-04T12:51:47.000Z", "summary": "作者 Frank Wang 玉伯把关于 UTC、中国东八区和闰秒（原文写作\"润秒\"，2026 年 10 月可能取消）的疑惑，作为一句话输入给 YouMind：搜索 UTC 的详细资料，面向中学生，图文并茂讲解清楚，做一个 PPT 和视频。YouMind 生成了一个讲解视频，作者称消费就是创作、创作就是消费，邀请大家体验 YouMind 的创作即消费。", "type": "tip", "relTime": "4天前"}, {"id": 79, "title": "Wan 联合 GMI Cloud 在台北举办 AI 电影创作挑战赛，60 余名创作者用 Wan3.0 产出 17 部短片", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2095847664638419210", "date": "2026-09-04T12:13:16.000Z", "summary": "上周末在台北，Wan 与 GMI Cloud 联合举办沉浸式 AI 电影创作挑战赛，汇聚 19 支团队共 60 余名 AI 视频从业者，基于最新的 Wan3.0 AI 视频模型在数小时内创作出 17 部 AI 生成短片。活动邀请金马奖获奖导演参与圆桌讨论并担任评委，获奖视频已发布在 YouTube 播放列表。", "type": "industry", "relTime": "4天前"}, {"id": 80, "title": "阿易评 Higgsfield 用 GPT-6 Astra 从口语描述生成白宫椭圆形办公室 3D 场景", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095846225677549615", "date": "2026-09-04T12:07:33.000Z", "summary": "博主转发并点评 Higgsfield 的实测演示，GPT-6 Astra 把口语描述的布景感觉编译成场景代码，在超算集群驱动 Blender 和 Cycles 物理光追引擎，端到端算出白宫椭圆形办公室。原文指出三点变化：自然语言被编译为程序化空间拓扑，交付的是 Blender 里可二次修改的真实模型而非写死视频，渲染难题通过代码交给成熟光线追踪引擎完成。", "type": "tip", "relTime": "4天前"}, {"id": 81, "title": "Instagram AI 内容标签再陷混乱，The Verge 实测发现只有 Meta 自家信号能触发标注", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/989617/instagram-ai-content-label-confusion", "date": "2026-09-04T12:00:00.000Z", "summary": "The Verge 记者实测发现，Instagram 的 AI Content 标签持续误标普通照片，而带 C2PA 和 SynthID 信号的 Gemini 完全生成图片反而未被标注。", "type": "tip", "relTime": "4天前"}, {"id": 82, "title": "DeepSeek-V4-Flash-Vision-Exp 上线 SiliconFlow，支持视觉理解与 1M 上下文", "source": "X：硅基流动 SiliconFlow (@SiliconFlowAI)", "sourceUrl": "https://x.com/SiliconFlowAI/status/2095832456108888217", "date": "2026-09-04T11:12:50.000Z", "summary": "DeepSeek-V4-Flash-Vision-Exp 现已上线 SiliconFlow，也可通过 OpenRouter 使用。该模型基于 V4 Flash 加入视觉理解能力，面向多模态任务和 Agent，保留较强文本能力，支持 1M 上下文，MIT 许可。SiliconFlow 定价为缓存输入 $0.028 / M tokens、输入 $0.44 / M tokens、输出 $1.32 ...", "type": "model", "relTime": "4天前"}, {"id": 83, "title": "为什么 AI 生成的食物图片看起来那么诡异", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/989376/ai-generated-food-why-does-it-look-like-that", "date": "2026-09-04T11:00:00.000Z", "summary": "The Verge 撰文解释餐厅和品牌用 AI 生成的食物宣传图为何频繁出现虫状面条、孔洞和裂纹等问题。牛津大学的 Chris Russell 指出扩散模型先恢复粗结构、后补细节，结构错了细节只会更怪；那不勒斯费德里科二世大学的 Giovanbattista Califano 称扩散模型难以生成细长连续结构，导致意面状伪影和密集孔洞。", "type": "tip", "relTime": "4天前"}, {"id": 84, "title": "OpenAI 发布 Astra 模型，单张照片可在 Blender 还原可编辑 3D 豪宅", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095815989514657915", "date": "2026-09-04T10:07:24.000Z", "summary": "AYi 转引 @tomkrcha 对 OpenAI 新模型 GPT-6 Astra 的内测实测：输入一张房子平面照片，Astra 在 Blender 中还原出包含家具、电器和玩具的完整 3D 模型。所有零件为可手动拖拽微调的真实几何体，而非不可修改的面条网格，并能在本地设备以 60 帧像游戏一样实时渲染漫游。作者认为这可能重写游戏工业与空间设计的生产流程。", "type": "model", "relTime": "4天前"}, {"id": 85, "title": "博主实测 Fotor Video Agent：10 分钟生成 60 秒可编辑科普动画", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095812224338333955", "date": "2026-09-04T09:52:27.000Z", "summary": "博主实测 Fotor Video Agent，仅用提示词和一次方案确认，约 10 分钟生成一条 60 秒水循环科普 MG 动画，而同类外包通常要 3000 到 8000 块、一两周。产出包含 6 章旁白脚本、Kian 中文男声配音、15 个独立 MG 场景、8 处场景音效和可编辑多轨时间线，改场景、文字、颜色和声音无需重抽。作者认为这类结构清晰的内容可批量生产，但打动人仍靠选题、脚本和审美。", "type": "tip", "relTime": "4天前"}, {"id": 86, "title": "HappyHorse 1.1 与 Kling 3.0 同条件对比实测", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2095798104603976052", "date": "2026-09-04T08:56:20.000Z", "summary": "作者批评网上常见的视频模型对比不严谨，用相同提示词、相同参考图、相同时长且不剪辑的方式实测 HappyHorse 1.1 与 Kling 3.0。对比覆盖口型同步、角色与场景一致性、复杂运动、镜头控制和价格五个维度，作者认为 HappyHorse 1.1 在跨镜头一致性上明显更稳，在广告和电商场景下需要更少的重生成，更快达到可交付成片，但强调两个模型各有强项。", "type": "tip", "relTime": "4天前"}, {"id": 87, "title": "阿里云展示 Qwen 生成演示并提供 Qwen Cloud 与 Model Studio API 入口", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2095774894730412375", "date": "2026-09-04T07:24:07.000Z", "summary": "阿里云发布一段生成演示视频，配文为提示词样例\"Fly， my winged unicorn， take me anywhere in the world my heart desires…\"，并提供更多 API 访问入口：Qwen Cloud（https://click.qwencloud.com/m/20000003017/）和 Model Studio（https://click.ali...", "type": "model", "relTime": "4天前"}, {"id": 88, "title": "Fotor Video Agent 实测：几句提示词生成 1 分钟水循环科普动画", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095772519672504379", "date": "2026-09-04T07:14:40.000Z", "summary": "作者实测 Fotor Video Agent，仅用几句提示词、约 10 分钟生成一条 60 秒水循环 MG 科普动画，此前同类外包约需 3000 到 8000 元、制作一两周。", "type": "tip", "relTime": "4天前"}, {"id": 89, "title": "论文《Do LLMs Capture the Diversity in their Training Data？》发现 LLM 输出多样性低于训练数据", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2095768574245884058", "date": "2026-09-04T06:59:00.000Z", "summary": "论文比较模型与训练数据在同一前缀下的条件熵，发现 OLMo、Pythia、GPT-Neo 的输出条件多样性均低于训练数据，图像生成器也存在类似差距。OLMo 20K 样本上训练数据得分 338.58，贪心解码为 218.88，nucleus 采样 287.31，ancestral 采样 297.31；调高温度到 T=1.9 虽匹配训练熵但精度和外部条件 NLL 变差。", "type": "paper", "relTime": "4天前"}, {"id": 90, "title": "玉伯用一句话提示词 9 分钟做出我的世界迷你版网页小游戏", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2095764351861112994", "date": "2026-09-04T06:42:13.000Z", "summary": "Frank Wang 玉伯用一句话提示词生成《我的世界迷你版》网页小游戏，耗时约 9 分钟（截图显示 Ran for 8m 56s），并放出试玩链接 https://youmind.com/a/mb7IgNGDxyzzqh。截图显示游戏为 3D 方块沙盒，基于 Three.js，含 32×32 程序化地形，支持 WASD 移动、鼠标破坏/放置方块、1~7 切换方块、切换阴影等操作。", "type": "tip", "relTime": "4天前"}, {"id": 91, "title": "从自己修车窗到自己造自动驾驶汽车", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2095763460609220673", "date": "2026-09-04T06:38:41.000Z", "summary": "作者写道，从当年因为付不起修理费而自己修车窗，到自己动手建造自动驾驶汽车，这个循环现在完成了。推文配有一个视频。", "type": "tip", "relTime": "4天前"}, {"id": 92, "title": "在 YouMind 用 Fable 5.1 一个提示词做小游戏", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2095761665820360936", "date": "2026-09-04T06:31:33.000Z", "summary": "作者分享在 YouMind 中用 Fable 5.1 模型制作小游戏的做法：打开 YouMind，选择 Fable 5.1 模型，说你要做什么游戏即可生成。", "type": "tip", "relTime": "4天前"}, {"id": 93, "title": "阿里云展示 Qwen 视频生成效果并开放 API 访问入口", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2095757811347026383", "date": "2026-09-04T06:16:14.000Z", "summary": "阿里云发布一段 POV 风格视频，展示跟随林中音乐声找到场景的生成效果，BGM 支持来自 HappyShrimpAI。文中提供 Qwen Cloud 和 Model Studio 的 API 访问链接。", "type": "model", "relTime": "4天前"}, {"id": 94, "title": "阿里云 Wan3.0 正式全面开放", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2095742228320711149", "date": "2026-09-04T05:14:18.000Z", "summary": "阿里云宣布 Wan3.0 正式全面开放（generally available），支持 30 秒视频生成和一键文档转视频，定位生产可用，详细指南见 https://click.alibabacloud.com/m/20000003076/", "type": "paper", "relTime": "4天前"}, {"id": 95, "title": "TechCrunch 解析 AI 生成菜单为何雷同难看：模型收敛与恐怖谷效应", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/03/the-sameness-problem-behind-those-unappetizing-ai-generated-menus", "date": "2026-09-04T04:21:03.000Z", "summary": "TechCrunch 探讨餐厅 AI 生成菜单令人不适的雷同问题。Reality Defender CTO Alex Lisle 解释这是模型训练数据趋同导致的收敛而非模型崩溃，数据集为追求讨喜而同质化；Elon University 的 Lee Rainie 称 AI 会削平细节。德国杜伊斯堡-埃森大学研究发现 AI 食物图像呈现恐怖谷效应，看起来接近真实反而引发更多厌恶。", "type": "tip", "relTime": "4天前"}, {"id": 96, "title": "Fable 5.1 与 Muse Spark 1.3 对比生成 Three.js 版 BMW S1000RR 3D 模型", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2095720113123274999", "date": "2026-09-04T03:46:26.000Z", "summary": "Alexandr Wang 转发 @srikanthvaluri 的对比演示：用 Fable 5.1 与 Muse Spark 1.3 分别生成 Three.js 中的 BMW S1000RR 仿真 3D 摩托车模型，并评论称效果很酷。", "type": "tip", "relTime": "4天前"}, {"id": 97, "title": "Alexandr Wang 转发 muse spark 1.3 重建《匹诺曹的谎言》机械心脏的 3D 演示", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2095713478749409301", "date": "2026-09-04T03:20:04.000Z", "summary": "Alexandr Wang 转发用户 @filicroval 的演示，称 muse spark 1.3 在 3D 和 three.js 方面表现出色。该模型根据多张游戏截图参考重建了《匹诺曹的谎言》（Lies of P）中的机械心脏，并生成了爆炸视图。", "type": "tip", "relTime": "4天前"}, {"id": 98, "title": "Ethan Mollick 实测 GPT-6 Astra 最高档生成 twigl 新哥特式溺水高塔 shader", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2095712569507885252", "date": "2026-09-04T03:16:27.000Z", "summary": "Ethan Mollick 应读者要求，用 GPT-6 Astra 最高设置运行提示词，生成可在 twigl.app 运行的 shader，内容为风暴海浪中部分被淹没的无限新哥特式高塔城市，并附 twigl.app 运行链接。作者在引用中对比了此前 Fable 5.1 和 Fable 5 用同一提示词生成的同类作品，欢迎读者自行比较。", "type": "tip", "relTime": "4天前"}, {"id": 99, "title": "杭州黄昏时分 Unitree G1 机器人训练画面", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2095692831289729217", "date": "2026-09-04T01:58:01.000Z", "summary": "作者发布一段视频，记录杭州黄昏时分 Unitree G1 机器人的训练场景。", "type": "industry", "relTime": "4天前"}, {"id": 100, "title": "ZHO 用 GPT 4o 生成创意图像《AGI》", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2095685157378507249", "date": "2026-09-04T01:27:32.000Z", "summary": "ZHO 发布创意系列新作《AGI》，标注由 GPT 4o Creation 生成。画面为一位佩戴黑色墨镜与 OpenAI 标志耳饰的女性含着写有 AGI 字样的红色棒棒糖，右下角带 O4Z 签名标识。", "type": "tip", "relTime": "4天前"}, {"id": 101, "title": "KoNA：评估视觉语言模型选择性拒绝回答能力的新基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.04720", "date": "2026-09-04T00:00:00.000Z", "summary": "韩国浦项科技大学团队提出 KoNA 基准，用于评估视觉语言模型（VLM）的选择性拒绝能力，涵盖错误前提、视觉不可及、普遍未知、任务可行性与安全性五类任务，每项任务通过配对单一与复合查询检验查询级和组件级拒绝表现。评测显示模型在需要选择性拒绝的复合查询中失败更明显；基于 KoNA 示例微调后的模型在拒绝准确率上显著提升，同时基本保持对完全可答任务的性能。", "type": "model", "relTime": "5天前"}, {"id": 102, "title": "UniMate：一个统一模型驱动任意骨骼拓扑的3D角色动画", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.05415", "date": "2026-09-04T00:00:00.000Z", "summary": "UniMate 提出统一基础模型，输入绑定好的 3D 资产与文本提示即可为任意骨骼拓扑生成动作，无需测试时优化或逐骨骼微调。其拓扑感知扩散 Transformer 通过图感知注意力偏置、谱旋转位置嵌入和全局拓扑条件器三种机制将骨骼结构融入注意力。", "type": "model", "relTime": "5天前"}, {"id": 103, "title": "WorldSculpt：从有据视频生成组合式 3D 世界", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.05416", "date": "2026-09-04T00:00:00.000Z", "summary": "WorldSculpt 提出一种新方法，通过将强大的单物体 3D 生成先验适配到多视角观测，将包含数百个物体的杂乱场景组合式地生成为独立网格集合。该方法基于 Pixal3D 扩展多视角条件路径，无需场景级训练即可泛化至严重遮挡的大场景。研究还推出含数百物体及逐物体标注的逼真基准 UE-MeshyScene，实验显示该方法在单物体、受控多物体及该基准上均优于此前方法。", "type": "paper", "relTime": "5天前"}, {"id": 104, "title": "Cognition：GPT-6 Astra 在 FrontierCode 1.1 上以低 64% 成本逼近 Fable 5 编码水平", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2095648712639070518", "date": "2026-09-03T23:02:43.000Z", "summary": "Cognition 宣布 GPT-6 Astra 将接入 Devin，在 FrontierCode 1.1 上得分与 Fable 5 相差不到 0.4 分，成本降低 64%，并在其内部测试基准上创造 SOTA，生成更全面的测试、更清晰的报告和更好的视频证据。", "type": "tip", "relTime": "5天前"}, {"id": 105, "title": "职业建筑师评 GPT-6 Astra：强在旧链路而非重建工作逻辑", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2095631162089865531", "date": "2026-09-03T21:52:58.000Z", "summary": "ZHO 刷了大量 GPT-6 Astra 提前测试案例后评价，其惊艳点在于通过建模/渲染软件实现高质量 3D 建模和渲染，建筑与游戏均适用。作为职业建筑师，他认为这并不惊艳，早在 2023 年就提出 AI 能生成真实照片后就不再需要效果图；如果 GPT-6 真的足够强，应重建全新的工作逻辑和链路，而不是更好地完成旧链路，那才是迈向 AGI 的起点。", "type": "tip", "relTime": "5天前"}, {"id": 106, "title": "GPT-6 Astra 即将接入 Devin，成本比 Fable 5 低 64%", "source": "X：Jason Liu (@jxnlco)", "sourceUrl": "https://x.com/jxnlco/status/2095621221010551142", "date": "2026-09-03T21:13:28.000Z", "summary": "Cognition 宣布 GPT-6 Astra 即将登陆 Devin。在 FrontierCode 1.1 上，Astra 表现与 Fable 5 相差 0.4 分以内，成本降低 64%，并在其内部测试基准上创下 SOTA，生成更全面的测试、更清晰的报告和更好的视频证据。", "type": "paper", "relTime": "5天前"}, {"id": 107, "title": "astra 实测展示 SVG 生成能力", "source": "X：Jason Liu (@jxnlco)", "sourceUrl": "https://x.com/jxnlco/status/2095605078342459529", "date": "2026-09-03T20:09:19.000Z", "summary": "Jason Liu 发帖称 astra 在生成 SVG 方面表现出色，并附上两个视频作为演示。", "type": "tip", "relTime": "5天前"}, {"id": 108, "title": "ZHO 演示 GPT-6 Astra 打通建筑设计从平面图到 UE5 漫游出图全流程", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2095602825430802495", "date": "2026-09-03T20:00:22.000Z", "summary": "ZHO 转引 Dimillian 的发布演示，称 GPT-6 Astra 可完成建筑设计的全流程。流程包括先设计平面图，再在 Blender 中建模，到 UE5 中渲染并生成建筑漫游视频和细节（含可运行的咖啡机），最后输出大图。作者认为前期概念方案可交给 GPT-6 完成。", "type": "paper", "relTime": "5天前"}, {"id": 109, "title": "OpenAI 发布 GPT-6 Astra 主攻电脑操作、软件工程与视觉理解", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2095596020638036311", "date": "2026-09-03T19:33:20.000Z", "summary": "OpenAI Developers 宣布 GPT-6 Astra 是其在电脑使用、软件工程和视觉理解方面迄今最好的模型，并附上正在使用该模型的开发者的视频分享。", "type": "model", "relTime": "5天前"}, {"id": 110, "title": "Runway 发布通用世界模型 GWM Worlds 2 研究进展", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2095540014645920040", "date": "2026-09-03T15:50:47.000Z", "summary": "Runway 公布通用世界模型 GWM Worlds 2 的新研究，可生成 720p、24 fps 连续视频并配 48000 Hz 音频的交互式实时模拟。用户可定义环境、主体、视觉风格、物理规则和氛围，用文本动作和连续镜头运动控制世界，会话没有预设长度，不遵循固定片段或脚本。", "type": "model", "relTime": "5天前"}, {"id": 111, "title": "YouMind 夜间 Auto 模型对话积分免费", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2095538233329451063", "date": "2026-09-03T15:43:42.000Z", "summary": "YouMind 宣布今晚 23：30 至次日 9：30 期间，在对话框保持 Auto 模型即可畅用，所有对话积分消耗为 0。该活动已自动开启，不含图片、视频等多模态内容。", "type": "model", "relTime": "5天前"}, {"id": 112, "title": "谷歌 DeepMind 发布 WeatherNext 3：分辨率最高 5 公里的 AI 天气预报模型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/198.htm", "date": "2026-09-03T15:15:52.000Z", "summary": "谷歌 DeepMind 和 Google Research 发布 WeatherNext 3，称其为最先进、最准确的全球气象模型。模型基于原始卫星数据和稀疏气象站观测训练，可每小时生成一次预报，地表关键变量分辨率达 5 公里，并新增针对可再生能源的 100 米高度风速、云量和太阳辐射预测。即日起为谷歌搜索、Gemini 应用、谷歌地图、地图平台气象 API 和 Earth Engine 提供支持。", "type": "paper", "relTime": "5天前"}, {"id": 113, "title": "OpenAI 疑似准备发布图像模型升级 ImageGen 2.5", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2095528074615906614", "date": "2026-09-03T15:03:20.000Z", "summary": "TestingCatalog 发现 OpenAI 正在准备图像模型的下一次升级，ChatGPT 内置的隐藏公告弹窗写着图像创作迎来重大升级，文案为更高质量结果、更快生成和更智能的创意工具。", "type": "model", "relTime": "5天前"}, {"id": 114, "title": "Google 发布 AI 天气模型 WeatherNext 3，引入实时卫星观测", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/988921/weather-forecast-ai-model-google-satellite-update", "date": "2026-09-03T15:00:00.000Z", "summary": "Google 推出更新的 AI 天气模型 WeatherNext 3，可基于实时卫星观测每小时生成一次预报，全球分辨率较上一代提升五倍。相较 WeatherNext 2 的 6 小时一次、25 公里网格，新模型对温度和湿度等变量最高达 5 公里分辨率，提前一天以上的降水预报准确率最高提升 50%，在雨量计较少的美国和欧洲以外地区改进最大。", "type": "model", "relTime": "5天前"}, {"id": 115, "title": "NeoMME 发布 260M 与 800M 多语言多模态编码器，权重以 Apache 2.0 开源", "source": "Hugging Face：Blog（RSS）", "sourceUrl": "https://huggingface.co/blog/Hcompany/neomme", "date": "2026-09-03T13:13:48.000Z", "summary": "H Company 团队发布 NeoMME，含 260M 和 800M 两个尺寸的多语言多模态编码器，用单个双向 Transformer 从零处理文本 token 和 32×32 图像 patch，不使用预训练视觉塔或因果语言模型，训练采用掩码离散扩散目标，每个模型处理约 5240 亿 packed token。", "type": "model", "relTime": "5天前"}, {"id": 116, "title": "机器人技术为何如此困难：一项系统性挑战清单", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://secondthoughts.ai/p/14-reasons-robotics-is-hard", "date": "2026-09-03T10:41:16.699Z", "summary": "作者指出当前 AI 进展几乎全在知识工作领域，物理侧的通用机器人仍停留在测试设施和演示视频，且 demo 视频难以评估真实水平，可能只展示百次尝试中的一次成功。文章列出从手部灵巧性、视觉理解、规划反应、速度、力量、安全、续航散热、泛化边界情况到算力、规模化供应链和社会监管等十余项待克服的挑战，认为物理世界的 demo 与现实差距会比 LLM 基准与实际工作的差距更大。", "type": "tip", "relTime": "5天前"}, {"id": 117, "title": "小红书与 vivo 联合打通 3D 图片全链路技术实践", "source": "公众号：小红书技术（dots.llm）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg4OTc2MzczNg%3D%3D&mid=2247496302&idx=1&sn=cff53d02e6effd993cb6dd43ec976cce", "date": "2026-09-03T10:17:12.000Z", "summary": "小红书与 vivo 联合打通从 vivo 相册生成 3D 图到小红书发布、分发与消费的完整 3D 内容链路，并共同设计面向移动社交场景的新型 3D 格式。", "type": "tip", "relTime": "5天前"}, {"id": 118, "title": "玉伯分享两例用户反馈：YouMind 靠一站式创作与一致性生成吸引用户迁移", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2095455177390395641", "date": "2026-09-03T10:13:40.000Z", "summary": "YouMind 负责人玉伯称收到两例用户反馈，印证产品差异化：一是 All-in-One 创作工作室带来便捷，用户认为单工具比多工具方便；二是生图、生 PPT、生视频功能持续解决人物、风格等一致性问题，让 Lovart、LibTV 用户愿意迁移到 YouMind。附图为一封用户来信，称赞无需切换标签页即可完成研究、写作和生成视觉素材。作者表示打磨过程辛苦，但看到用户反馈和付款感到开心。", "type": "tip", "relTime": "5天前"}, {"id": 119, "title": "摩尔线程宣布打通具身智能完整链路", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/037.htm", "date": "2026-09-03T09:09:30.000Z", "summary": "摩尔线程在 2026 年半年度业绩说明会上表示，已打通具身智能从合成数据生成、大模型训练、仿真验证到端侧硬件部署的完整链路。", "type": "industry", "relTime": "5天前"}, {"id": 120, "title": "World Labs 发布从零训练的多模态世界模型 Atlas，李飞飞称其为相机条件世界模型新标杆", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095430712073847088", "date": "2026-09-03T08:36:27.000Z", "summary": "World Labs 宣布发布 Atlas，一个从零训练的多模态世界模型，李飞飞称其为同类中首个，并称之为有史以来最好的相机条件世界模型。Atlas 支持像素级精确的相机控制生成画面、从单张输入图像重建大场景、通过重切视频模拟时空、从一张或多张图像原生输出 3D 空间，以及将多张带位姿图像合成为一致的 3D 世界，应用场景覆盖 VFX 到机器人。", "type": "model", "relTime": "5天前"}, {"id": 121, "title": "阿易评李飞飞团队 Atlas：几段手机视频生成可交互三维世界，降低机器人训练数据成本", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095429574293361122", "date": "2026-09-03T08:31:56.000Z", "summary": "阿易转发并解读李飞飞团队的 Atlas，称它能把几段普通手机视频生成带物理引擎的三维交互世界，可自由调整运镜、光照材质，物体碰撞按真实物理法则展开。作者认为这等于为具身智能机器人提供了低成本、可无限扩充的虚拟训练场，把机器人换环境需重新实拍采集的数据成本大幅降低，并提出了家庭保洁和工厂流水线哪个先落地的问题。", "type": "tip", "relTime": "5天前"}, {"id": 122, "title": "蚂蚁 inclusionAI 开源 LLaDA-Image 图像生成与编辑模型家族", "source": "蚂蚁 inclusionAI：HuggingFace 新模型", "sourceUrl": "https://huggingface.co/inclusionAI/LLaDA-Image-Turbo-FP8", "date": "2026-09-03T08:07:02.000Z", "summary": "蚂蚁 inclusionAI 发布开源统一图像生成与编辑模型 LLaDA-Image 家族，包括 6B 参数、50 步采样的 Base 版和 2-4 步的 Turbo 蒸馏版，同时提供 BF16 与 FP8 checkpoint 及 Diffusers 推理代码。", "type": "model", "relTime": "5天前"}, {"id": 123, "title": "蚂蚁 inclusionAI 开源 6B 统一图像生成与编辑模型 LLaDA-Image", "source": "蚂蚁 inclusionAI：HuggingFace 新模型", "sourceUrl": "https://huggingface.co/inclusionAI/LLaDA-Image-FP8", "date": "2026-09-03T08:06:39.000Z", "summary": "蚂蚁 inclusionAI 发布开源统一图像生成与编辑模型 LLaDA-Image，提供 50 步 Base 和 4 步蒸馏 Turbo 两类 checkpoint，均有 BF16 与 FP8 版本。", "type": "model", "relTime": "5天前"}, {"id": 124, "title": "Muse Spark 1.3 xhigh 演示太空站穿行视频", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2095388793151074625", "date": "2026-09-03T05:49:53.000Z", "summary": "Alexandr Wang 转发 @loktar00 用 Muse Spark 1.3 xhigh 生成的太空站穿行视频，并评价 this is pretty cool。", "type": "paper", "relTime": "5天前"}, {"id": 125, "title": "开源视频生成方法 Video Delta Net （VDN） 发布：混合注意力实现近无损实时文生视频", "source": "X：马东锡 NLP (@dongxi_nlp)", "sourceUrl": "https://x.com/dongxi_nlp/status/2095382936769991110", "date": "2026-09-03T05:26:37.000Z", "summary": "Video Delta Net （VDN） 发布，采用混合注意力实现近无损质量的实时文本生成视频，称开源视频生成速度已超过播放速度。VDN 将 Minimax-H3 加速 75-90 倍，在 8× NVIDIA B200 GPU 上 11 秒生成 14 秒 768p 视频，并开源 checkpoint、训练/推理代码和技术博客。", "type": "model", "relTime": "5天前"}, {"id": 126, "title": "纽约市暂停八年级及以下学生使用生成式 AI", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2095370185540772094", "date": "2026-09-03T04:35:56.000Z", "summary": "据 WSJ，纽约市暂停八年级及以下年级面向学生的生成式 AI，禁令影响近 60 万学生，并禁止所有年级使用陪伴型聊天机器人。高中采取受控路径：最多 5 万名学生可参加 5 个教师监督的 AI 试点，所有高中生每年接受两次 AI 素养教育。", "type": "industry", "relTime": "5天前"}, {"id": 127, "title": "Ethan Mollick 用一段提示词让 Fable 5.1 生成《伊利亚特》船目 3D 交互地图", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2095352019498447090", "date": "2026-09-03T03:23:45.000Z", "summary": "Ethan Mollick 公开一段用于 Fable 5.1 的提示词，要求生成《伊利亚特》船目（Catalog of Ships）的可探索 3D 船只地图，结合真实图像与考古数据，并用智能体测试和修订，成品见 https://homer-catalogue-of-ships.netlify.app/。", "type": "tip", "relTime": "5天前"}, {"id": 128, "title": "Wan 3.0 登顶 Artificial Analysis 视频编辑榜单，文生视频带音频位列第二", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2095349174799888760", "date": "2026-09-03T03:12:27.000Z", "summary": "Artificial Analysis 评测显示，阿里巴巴 Wan 3.0 在视频编辑带音频榜单首次登顶第一，文生视频带音频位列第二，图生视频带音频排名第五。该模型为一体化视频生成与编辑模型，支持最长 30 秒 1080p 原生音频输出，可接受文本、图片、视频、音频、文档和网页作为创作参考，并支持指令式编辑画面、剧情、对话和声音。", "type": "tip", "relTime": "5天前"}, {"id": 129, "title": "阿里云架构师谈 Qwen3.8-Max 为团队带来的变化", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2095343822184325468", "date": "2026-09-03T02:51:11.000Z", "summary": "阿里云解决方案架构师 Joey Huang 在视频中介绍 Qwen3.8-Max 为其团队带来的变化：团队不再人工分派工单，早晨醒来可看到自动生成的摘要，说明哪些已上线、哪些在评审、哪些需要本人处理。他表示因此能把时间重新投入产品、客户和架构，并附上了 Qwen Cloud 与 Model Studio 的试用及 API 入口链接。", "type": "tip", "relTime": "5天前"}, {"id": 130, "title": "美团智播解析数字人直播技术：形象生成、动作驱动与万路并发方案", "source": "公众号：龙猫LongCat（美团）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MjM5NjQ5MTI5OA%3D%3D&mid=2651783277&idx=1&sn=69b406db34fc05f4a17b0310dcf3a7f5", "date": "2026-09-03T02:24:00.000Z", "summary": "美团智播官方发布技术长文，介绍AI数字人直播的完整技术闭环，涵盖高保真形象生成与编辑（SDIP、SREdit）、文本驱动动作生成（MoTiGA）、语音手势协调生成（StreamingTalk）和视觉token压缩推理加速（Glance2Gaze）。", "type": "tip", "relTime": "5天前"}, {"id": 131, "title": "戚薇回应 AI 授权\"卖脸\"争议：更愿意\"主动出击\"，数字分身将主演 AI 漫剧《末日盛夏》", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/997/747.htm", "date": "2026-09-03T01:00:19.000Z", "summary": "戚薇在《中国新闻周刊》9 月 2 日报道的采访中回应\"卖脸\"争议，称其数字分身授权是有期限、有范围、有审核和追责的，且只开放给合作的影视项目，而非向所有人开放。她的数字分身将主演末世 AI 漫剧《末日盛夏》，主角名为\"韩清夏\"。她表示规范授权是把合法使用与非法使用区分开，并认为真人戚薇和数字形象应成为两条独立又协同的创作线。", "type": "tip", "relTime": "5天前"}, {"id": 132, "title": "Qwen 发布 Qwen-Drive-1.0：面向自动驾驶的视觉语言基础模型", "source": "Qwen：Blog Retrieval（API）", "sourceUrl": "https://qwen.ai/blog?id=qwen-drive-1.0", "date": "2026-09-03T00:00:00.000Z", "summary": "Qwen 团队发布 Qwen-Drive-1.0，称其为首个在预训练阶段统一 3D 感知与视觉问答、并延伸到运动规划的自动驾驶视觉语言基础模型，基于原生多模态 Qwen3.5-4B 且不改动预训练架构。", "type": "model", "relTime": "6天前"}, {"id": 133, "title": "Last Translation Benchmark 发布，用人工评审的多模态样本测试机器翻译模型极限", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.04173", "date": "2026-09-03T00:00:00.000Z", "summary": "研究者推出 Last Translation Benchmark，收集经同行评审的人工创作样本（文本、图像、音频、视频），用于打破主流机器翻译模型。每个样本附带手工编写的验证规则，描述具体失败情形，使评估可靠且可操作；该数据集为持续接收投稿的 live dataset，当前版本 LTBv1 收录 2026 年 9 月 1 日前被接受的贡献。", "type": "paper", "relTime": "6天前"}, {"id": 134, "title": "长视频多模态模型视觉token分配受控研究：选择、压缩与再分配", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.03820", "date": "2026-09-03T00:00:00.000Z", "summary": "arXiv 论文《Select， Compress， Reinvest》在固定评分器、分辨率策略与回答模型的前提下，逐一检验长视频 MLLM 的视觉token分配决策，覆盖六种免训练选择规则、三个长视频基准和两个回答模型。", "type": "paper", "relTime": "6天前"}, {"id": 135, "title": "Scal3R 提出多相对位姿查询方法，提升长视频在线 3D 重建稳定性", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.04201", "date": "2026-09-03T00:00:00.000Z", "summary": "Scal3R 将在线 3D 重建重新表述为多参考相对位姿查询，用约占参数 1% 的可学习 token 通过非对称注意力注入冻结骨干，并结合带回环闭合的在线位姿图优化抑制长程漂移。", "type": "paper", "relTime": "6天前"}, {"id": 136, "title": "Puffin-World 提出原生 3D 世界状态的统一多模态世界模型并开源", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.04196", "date": "2026-09-03T00:00:00.000Z", "summary": "Puffin-World 是一个统一多模态架构，不依赖外部离线模块即可实现物理理解、空间模拟和 3D 世界生成与重建。该框架联合建模物理（重力场与纬度）、几何（深度）和外观（图像）三种原生世界状态，并引入统一 Omni-Camera 表示与跨未来帧传播物理动态的策略，在单一生成过程中同时合成未来视图并重建底层几何。", "type": "paper", "relTime": "6天前"}, {"id": 137, "title": "WorldReward 提出面向相机条件世界模型的 VLM 奖励建模方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.03952", "date": "2026-09-03T00:00:00.000Z", "summary": "WorldReward 是一个基于 VLM 的成对偏好奖励模型，为相机条件世界模型统一评估动作一致性与视觉质量。方法将视频分解为动作对齐的块并投票聚合，配套发布人工标注的 WorldReward-Bench，在三个维度上分别超过 GPT-5.5 约 3.42、1.45 和 3.56 个百分点，用于 HY-WorldPlay 1.5 的 RL 后训练可同时提升动作执行与视觉质量。", "type": "paper", "relTime": "6天前"}, {"id": 138, "title": "FlashRender：基于相机控制视频 MeanFlow 的少步生成渲染框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.03563", "date": "2026-09-03T00:00:00.000Z", "summary": "论文提出 FlashRender，一个少步生成渲染框架，可在数秒内沿目标相机轨迹重新渲染源视频。方法引入 RETA 将源视频隐表示与冻结视觉几何模型的目标视频特征对齐，实现采样步数一致的相机控制，再用 MeanFlow 目标微调并结合 on-policy flow map 蒸馏。实验显示其在视频质量和几何一致性上匹配多步基线，采样成本降低 25 倍，并在分布外目标相机轨迹下具备更强的相机可控性。", "type": "paper", "relTime": "6天前"}, {"id": 139, "title": "LLaDA-Image 发布：用完全开放的训练配方构建强图像生成模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.03796", "date": "2026-09-03T00:00:00.000Z", "summary": "LLaDA-Image 是一个统一框架，包含从零训练的 6B Diffusion Transformer 和基于 LLaDA2.0-Mini 扩散语言模型骨干的冻结视觉语言理解模块。", "type": "paper", "relTime": "6天前"}, {"id": 140, "title": "Principia 基准：通过成对物体的关系不变量评测视频模型的物理推理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.04200", "date": "2026-09-03T00:00:00.000Z", "summary": "论文提出 Principia 基准，用 529 个真实场景中的配对物体关系不变量评测视频生成模型和 VLM 的牛顿物理一致性，覆盖重力、摩擦、转动惯量等 8 种现象。", "type": "paper", "relTime": "6天前"}, {"id": 141, "title": "Editable Visual Design 论文提出基于 Coding Agent 的可编辑视觉设计新范式", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.04034", "date": "2026-09-03T00:00:00.000Z", "summary": "论文提出 Editable Visual Design 范式，由 Coding Agent 驱动，将 VLM 作为理解需求、规划任务和审美判断的创意大脑，将图像生成模型作为按需合成独立视觉素材的视觉世界模拟器。", "type": "paper", "relTime": "6天前"}, {"id": 142, "title": "AdaptVPR：面向鲁棒视觉地点识别的路径感知困难正样本生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.04369", "date": "2026-09-03T00:00:00.000Z", "summary": "AdaptVPR提出一种路径感知的生成式增强框架，通过视觉语言模型解析场景属性并估计编辑可行性，将生成过程分解为全局外观、局部遮挡和双路径三条互补路线，并采用基于几何一致性与外观多样性的VPR导向验证方案筛选候选。", "type": "model", "relTime": "6天前"}, {"id": 143, "title": "ENEAS：嵌入引导的神经集成自适应分割方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.03756", "date": "2026-09-03T00:00:00.000Z", "summary": "ENEAS 提出一种统一的文本提示分割方法，同时支持实例跟踪与语义发现，可处理有序视频和无序图像集合。该方法通过文本适配器扩展 SeC 跟踪架构，在目标消失时保持身份不漂移；语义验证层结合视觉嵌入匹配与条件 VLM 判断，仅对模糊候选调用 VLM，以低延迟过滤视觉相似但本体不同的误检。代码与模型已开源。", "type": "model", "relTime": "6天前"}, {"id": 144, "title": "Uno：用离散扩散为LLM实现无损加速", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.04010", "date": "2026-09-03T00:00:00.000Z", "summary": "研究者提出扩散增强LLM（diffusion-augmented LLMs），通过轻量扩散权重并行生成多个token，在不引入草稿模型或牺牲AR模型质量的前提下加速生成。配套的Ψ-Spec采样器实现无损加速，Uno模型吞吐量优于主流投机解码方法，较基础AR模型最高提速3倍。8B Uno在智能体工具使用、编程和长上下文推理基准上超越26B DiffusionGemma及Mercury 2。", "type": "model", "relTime": "6天前"}, {"id": 145, "title": "FlowBalance：基于验证器的自博弈推理经验自我改进方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.03241", "date": "2026-09-03T00:00:00.000Z", "summary": "FlowBalance 提出一种基于验证器的自改进方法，通过冻结策略视图生成 token 级自引导分数，并与验证器导出的组优势校准，在正优势轨迹上保留引导、负优势轨迹上反转、无偏好时禁用。该方法在数学推理任务上，于 Qwen3-4B 和 Qwen3-8B 上平均性能均超过 FlowRL，同时提升训练速度与稳定性，避免 OPSD 的响应长度坍缩，并在受控 AIME24 诊断中展现更高正确策略多样性。", "type": "paper", "relTime": "6天前"}, {"id": 146, "title": "对话生成产物中的修订传播：探索经济高效的测试时计算", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.03254", "date": "2026-09-03T00:00:00.000Z", "summary": "一项研究探讨大语言模型在对话生成产物中传播局部修订的能力，推出人工标注基准 RevPropBench，含 120 个测试样本，覆盖九个领域及三种 JSON 元素规模。研究评估九种修订方法，基线准确率为 68.3-93%；从三个并行样本中择优最具性价比，可将准确率提升 2.2-9.7%。", "type": "model", "relTime": "6天前"}, {"id": 147, "title": "FactoSR：用分解式强化学习增强 VLM 的 4D 空间推理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.03729", "date": "2026-09-03T00:00:00.000Z", "summary": "FactoSR 提出一种分解式强化学习框架，将视觉语言模型（VLM）的空间推理拆解为平面一致性（XY）、深度一致性（Z）与时间可逆性（T）三个正交目标，以应对 2D 投影与真实 3D/4D 推理之间的维度错配。在 VSI-Bench 和 All-Angles-Bench 上分别提升 5.9% 和 4.5%。该方法通过可验证约束的策略学习，将不适定的投影恢复问题转化为可操作的推理步骤。", "type": "model", "relTime": "6天前"}, {"id": 148, "title": "音频-视频模型中的\"注意力三角\"：跨模态语义泄漏分析", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.03586", "date": "2026-09-03T00:00:00.000Z", "summary": "特拉维夫大学等机构研究音频-视频扩散模型中的跨模态注意力机制，提出\"注意力三角\"框架，分析文本、音频、视频三流之间的语义路由。研究发现音频-视频边是双向且受参数偏差影响，是语义泄漏的主要来源，尤其在提示与先验冲突时。基于注意力信号提出推理时干预方法，在LTX-2上改善语义接地且不损生成质量。", "type": "model", "relTime": "6天前"}, {"id": 149, "title": "Meta Muse Spark 从 1.1 迭代到 1.3，55 天内 3D 生成保真度显著提升", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2095299414235676948", "date": "2026-09-02T23:54:43.000Z", "summary": "Alexandr Wang 转发 @EnactraAI 对 Meta Muse Spark 1.1 → 1.2 → 1.3 的对比：同一建筑、仅凭照片生成 3D 仿真的任务中，几何、结构和视觉保真度显著提升，总成本保持在 $0.60，从 1.1 到 1.3 仅用 55 天。", "type": "paper", "relTime": "6天前"}, {"id": 150, "title": "Meta 发布 Muse Spark 1.3，第三方实测对比 1.2 版本", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2095248586686812513", "date": "2026-09-02T20:32:45.000Z", "summary": "Meta 的 Muse Spark 1.3 发布，@aimlapi 随即用同一提示词对比两个版本，任务为生成三个收藏级 3D 雕塑，包括维京头盔、镶钻斧和带船员的长船，各输出一个自包含 HTML 文件，单次生成。结果 Muse Spark 1.3 消耗 22，474 tokens、花费 $0.10，Muse Spark 1.2 消耗 19，324 tokens、花费 $0.08。Alexan...", "type": "product", "relTime": "6天前"}, {"id": 151, "title": "Grok Imagine 推出 Draw 功能，涂鸦几秒内生成图像", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2095233525939368356", "date": "2026-09-02T19:32:54.000Z", "summary": "Grok Imagine 新增 Draw 功能，用户在菜单中选择 Draw 后画出任意内容，Grok 可在几秒内将其生成图像。作者称该功能适合儿童使用，并形容创造力因此成为超能力。", "type": "paper", "relTime": "6天前"}, {"id": 152, "title": "FastH3 支持 NVIDIA DGX Spark 与 Apple Silicon，本地视频生成提速 8x", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2095229744463954064", "date": "2026-09-02T19:17:53.000Z", "summary": "FastVideo 发布的 FastH3 现已支持 NVIDIA DGX Spark，并通过 MLX 支持 Apple Silicon，较 MiniMax H3 基础版本地生成提速 8x。文中展示了一段 15 秒 1344×768 的视频，由两台 NVIDIA DGX Spark 完全本地生成。", "type": "product", "relTime": "6天前"}, {"id": 153, "title": "MiniMax H3 据提示词将角色参考图生成 15 秒创作过程视频", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2095228354211594543", "date": "2026-09-02T19:12:21.000Z", "summary": "MiniMax 官方转发用户 @aimikoda 的演示：用一段提示词可把角色参考图变成 15 秒创作过程视频，从草图到最终渲染在绘图 UI 中逐步完成，提示词已附在原文。MiniMax 官方感叹模型能力强大，并调侃世界可能只是一个视频生成模型的模拟。", "type": "model", "relTime": "6天前"}, {"id": 154, "title": "FastVideo 让 FastH3 支持 NVIDIA DGX Spark 与 Apple Silicon 本地运行", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2095223988201120039", "date": "2026-09-02T18:55:00.000Z", "summary": "FastVideo 宣布 FastH3 现已支持 NVIDIA DGX Spark 和 Apple Silicon（通过 MLX），相比基线 MiniMax H3 实现本地生成 8x 加速。演示中的 15 秒 1344×768 视频片段由两台 NVIDIA DGX Spark 完全本地生成。", "type": "product", "relTime": "6天前"}, {"id": 155, "title": "Anthropic 上线 Claude 生成文件检测工具", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://claude.com/check-content", "date": "2026-09-02T17:53:19.500Z", "summary": "Anthropic 上线检测文件是否由 Claude 生成的浏览器工具，文件不上传、仅读取本地嵌入的内容凭证。工具识别基于 C2PA 开放行业标准的加密签名元数据，支持 .png、.jpg、.svg 等文件类型，文本水印检测则通过面向合格机构的私有预览 Detection API 提供。", "type": "product", "relTime": "6天前"}, {"id": 156, "title": "李飞飞 World Labs 发布多模态世界模型 Atlas", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095204264729817235", "date": "2026-09-02T17:36:38.000Z", "summary": "World Labs 发布多模态世界模型 Atlas，官方称其可生成具有像素级精确相机控制的图像和视频帧，并在 3D 中重建。作者评价其可生成可交互的 3D 世界，认为对 2D 文生视频和三维建模、游戏行业有冲击。", "type": "model", "relTime": "6天前"}, {"id": 157, "title": "Ethan Mollick 试用 Gemini 3.8 Flash 并用同一提示词对比 shader 生成效果", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2095203002210807816", "date": "2026-09-02T17:31:37.000Z", "summary": "Ethan Mollick 称自己获得 Gemini 3.8 Flash 早期访问，认为它是很好的 Flash 模型，但不等同于前沿模型。他用相同提示词让 Gemini 3.8 Flash 快速生成被淹没的新哥特式高塔 twigl shader，并附视频与 Fable 5.1 及此前模型的版本作对比。", "type": "tip", "relTime": "6天前"}, {"id": 158, "title": "Pangram CEO 称我们正危险接近死互联网理论", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/podcast/were-dangerously-close-to-dead-internet-theory-says-pangrams-ceo", "date": "2026-09-02T17:09:57.000Z", "summary": "Pangram CEO Max Spero 做客 TechCrunch Equity 播客，谈 AI 生成内容检测的问题。话题涵盖 Substack 新闻通讯、在线欺诈，以及人类写作的未来。", "type": "tip", "relTime": "6天前"}, {"id": 159, "title": "GPT-Image-2 触发风控拒绝时仍会在步骤中残留已生成的草图", "source": "X：阑夕 (@foxshuo)", "sourceUrl": "https://x.com/foxshuo/status/2095181964831793651", "date": "2026-09-02T16:08:01.000Z", "summary": "阑夕实测发现 GPT-Image-2 偶尔会有思维链残余：一次生成图片触发风控被拒绝，但已生成的草图在尚未按其要求切割成 5 张图片之前，仍保留在步骤里。", "type": "tip", "relTime": "6天前"}, {"id": 160, "title": "赵昊与百度百舸团队对谈：世界模型如何走向规模化训练", "source": "公众号：百度智能云（文心）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzA5NTQ5MzE5OQ%3D%3D&mid=2653159969&idx=2&sn=30a906a05a4fc100263038d1ffa4f687", "date": "2026-09-02T15:52:36.000Z", "summary": "百度智能云具身智能前沿讲堂上，清华大学AIR助理教授赵昊与百度智能云AI计算首席科学家王雁鹏等对谈世界模型规模化问题。赵昊提出以3D/4D Token为核心的世界模型路线，认为世界模型不等于视频生成，需表达空间结构、光学属性和速度、加速度等动态信息；其OmniNWM通过动作编码与相机参数解耦，实现200帧稳定生成，并与精锋医疗、极智嘉分别合作手术预演和仓库机器人场景。", "type": "tip", "relTime": "6天前"}, {"id": 161, "title": "Google 发布 Gemini 3.8 Flash，面向复杂智能体与多步任务", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2095175759606231439", "date": "2026-09-02T15:43:22.000Z", "summary": "Google 发布 Gemini 3.8 Flash，主打处理复杂智能体和多步任务，推理能力显著提升，不仅写代码还能驾驭复杂项目。模型延续 effort controls，使完成任务的思考量与 token 花费成正比；官方还演示其在 @antigravity 中结合原生视频理解与编码，自主构建 3D 游戏、试玩找错并执行代码修改。", "type": "model", "relTime": "6天前"}, {"id": 162, "title": "Google Pics 上线，面向 Workspace 客户与 Google AI Pro/Ultra 订阅者", "source": "X：小北 (@frxiaobei)", "sourceUrl": "https://x.com/frxiaobei/status/2095140282002289155", "date": "2026-09-02T13:22:23.000Z", "summary": "Google Workspace 宣布推出 Google Pics，AI 图像创建功能正逐步推送给 Google Workspace 客户及 Google AI Pro 和 Ultra 订阅者。该工具支持编辑单个对象、润色或翻译文本，并支持团队协作，可访问 http://pics.new 试用。作者评论认为 Google 的 AI 产品线越来越分散，图像有 Gemini、Nano Banan...", "type": "product", "relTime": "6天前"}, {"id": 163, "title": "戴森发布内置摄像头与 AI 的 CameraJet 牙刷，售价 $499", "source": "X：小北 (@frxiaobei)", "sourceUrl": "https://x.com/frxiaobei/status/2095140183859425768", "date": "2026-09-02T13:22:00.000Z", "summary": "Dyson 发布 CameraJet 牙刷，售价 $499，刷头内置 10 万像素微距镜头，刷牙时每秒拍 28 张图像，AI 用 47 万张牙科图像训练，检测到牙缝后在 100 毫秒内喷射漱口水自动完成类似牙线的清洁。", "type": "paper", "relTime": "6 function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){

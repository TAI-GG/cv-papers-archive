绍 GPT Image 2.6 Flare 在画质设为 low 时最快六秒即可生成一张图像。引用 @DesignArena 数据称，GPT Image 2.6 Sunburst 在 Image Arena 排名第一，超过前代 2.5 Sunburst，其中 2.6 Flare 比前代快 2.6 倍，2.6 Sunburst 快 1.15 倍。", "type": "model", "relTime": "1天前"}, {"id": 41, "title": "OpenAI 将 GPT-Image-2.6 引入 Codex 和 API", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2118124753340756055", "date": "2026-11-04T23:34:28.000Z", "summary": "OpenAI 将 GPT-Image-2.6 引入 Codex 和 API。新 API 图像模型 Flare 和 Sunburst 生成速度比之前快 50%；在 medium 或 high 质量下，Sunburst 能在多次编辑间保持细节更一致。", "type": "product", "relTime": "1天前"}, {"id": 42, "title": "OpenAI 展示自主漏洞发现与修补管线，一次运行生成 948 个 Linux 内核本地提权漏洞补丁", "source": "X：OpenAI (@OpenAI)", "sourceUrl": "https://x.com/OpenAI/status/2118119451401048497", "date": "2026-11-04T23:13:24.000Z", "summary": "OpenAI 安全研究人员构建了自主的网络漏洞发现、利用与修补管线，用一款即将推出的网络安全模型在单次运行中验证并为 Linux 内核 948 个本地提权漏洞生成补丁，总 API 成本 120 万美元。漏斗数据显示：2,308 个候选发现中 1,724 个通过验证，最终得到 948 个可用的 LPE exploit 和 291 个可用的 PoC。", "type": "paper", "relTime": "1天前"}, {"id": 43, "title": "OpenAI 发布 Images 2.6，ChatGPT 支持文本和照片生成动画 GIF", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/chatgpt-can-now-turn-text-prompts-and-photos-into-animated-gifs-with-openais-images-2-6-model/", "date": "2026-11-04T19:44:20.000Z", "summary": "OpenAI 基于新模型 Images 2.6 在 ChatGPT 中上线 GIF 生成功能，正向网页、桌面和移动端所有 ChatGPT 和 Codex 用户推送。", "type": "product", "relTime": "1天前"}, {"id": 44, "title": "Atmanity 发布实时形象模型 Atmee v2，1 张照片加 10 秒语音生成可视频通话的数字人", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2118053058395722127", "date": "2026-11-04T18:49:35.000Z", "summary": "Atmanity 发布实时形象模型 Atmee v2，可用 1 张照片和 10 秒语音生成能实时视频通话的会说话角色。作者引用发布方内容介绍，Atmee v2 负责渲染面部和身体，另一个模型 Causeur 驱动表情和手势跟随对话，宣称比 Seedance 2.5、Wan 3.0 等视频模型快最多 50 倍、便宜 10-100 倍，开发者可通过 atmee.ai 邀请码经 API 使用。", "type": "product", "relTime": "1天前"}, {"id": 45, "title": "Bill Gates 谈税收政策如何加速 AI 取代白领劳动", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2118049021029925317", "date": "2026-11-04T18:33:32.000Z", "summary": "Bill Gates 在 FT Live 访谈中表示，AI 一旦 properly set up，随着更好版本的到来，取代白领劳动将非常便宜，且不只限于法律或商业咨询，而是覆盖经济各领域。他认为现行税收政策把税负压在劳动力上、同时对购买机器人和 token 的资本支出很宽松，会加速企业用 AI 取代人工。完整视频在 FT Live 频道。", "type": "industry", "relTime": "1天前"}, {"id": 46, "title": "OpenAI 为 ChatGPT 上线 GIF 生成并发布 Images 2.6 模型", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/1026474/openai-chatgpt-animated-gifs-images-2-6", "date": "2026-11-04T18:00:00.000Z", "summary": "OpenAI 随 Images 2.6 模型为 ChatGPT 上线 GIF 生成，可单步生成动图并调整播放速度、逐帧编辑和分享，此前 ChatGPT 无法一步原生生成 GIF。", "type": "product", "relTime": "1天前"}, {"id": 47, "title": "Philipp Schmid 演示如何用 Gemini API CLI 配合编码 Agent 测试语音等多模态功能", "source": "X：Philipp Schmid（Google DeepMind 开发者体验） (@_philschmid)", "sourceUrl": "https://x.com/_philschmid/status/2118039309534072849", "date": "2026-11-04T17:54:57.000Z", "summary": "Philipp Schmid 分享用 Gemini API CLI 配合编码 Agent 测试语音、音频等多模态功能的方法。步骤为：用 Gemini API CLI 生成语音，通过 Chrome 的 --use-file-for-fake-audio-capture=voice.wav%noloop 参数注入音频，用 Playwright 或 browser-use 点击麦克风按钮让 get...", "type": "tip", "relTime": "1天前"}, {"id": 48, "title": "Perceptron 发布第一人称视频标注 API，成本降至 1/8", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2118030315566580106", "date": "2026-11-04T17:19:12.000Z", "summary": "Perceptron AI 发布 Perceptron Egocentric 1.0，通过自助 API 提供第一人称视频标注，细粒度子任务质量对齐 Astra，成本约为其 1/8。", "type": "product", "relTime": "1天前"}, {"id": 49, "title": "Manus 支持把照片变成可玩的 3D 版自己并内建角色动画", "source": "X：Manus (@ManusAI)", "sourceUrl": "https://x.com/ManusAI/status/2118015049772240980", "date": "2026-11-04T16:18:33.000Z", "summary": "Manus 演示可将照片转成可玩的 3D 版自己，走进用 Manus 创建的世界。其 3D 游戏构建已内建角色绑定与动画，能生成流畅且有表现力的角色动作，过去需要专人数小时完成的工作现在默认包含。", "type": "product", "relTime": "1天前"}, {"id": 50, "title": "LG AI Research 提出 ATAD：用 Teacher-Orchestrator-Student 三智能体动态评测 LLM 推理能力", "source": "LG AI Research：官方研究博客", "sourceUrl": "https://www.lgresearch.ai/blog/view?seq=743", "date": "2026-11-04T16:00:00.000Z", "summary": "LG AI Research 提出 ATAD（Agent-Centric Text Anomaly Detection）动态评测协议，由 Teacher、Orchestrator、Student 三个智能体循环生成、验证并求解文本异常检测问题，随模型能力提升持续调整题目难度与质量。", "type": "paper", "relTime": "1天前"}, {"id": 51, "title": "fal 上线 Kling 4.0 Flash 视频生成模型", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2117999647943987497", "date": "2026-11-04T15:17:21.000Z", "summary": "fal 宣布 Kling 4.0 Flash 正式上线，主打快速视频生成，适合频繁的创意迭代。该模型支持文生视频、图生视频、视频编辑和参考视频四种工作流，可生成最长 20 秒、720p 且自带原生音频的视频。此前 Kling 4.0 已在 fal 开放 API，支持最长 30 秒带音频视频生成和最多 15 个参考素材。", "type": "product", "relTime": "1天前"}, {"id": 52, "title": "fal 上线可灵（Kling）V4 Flash 的四种视频生成入口", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2117999650414170495", "date": "2026-11-04T15:17:21.000Z", "summary": "fal 平台上线可灵（Kling）V4 Flash，提供文本生成视频、图片生成视频、参考生成视频和视频编辑四类入口。各入口均附有 fal.ai 模型页面链接。", "type": "product", "relTime": "1天前"}, {"id": 53, "title": "可灵 Kling 4.0 Flash 全量开放，支持 API、MCP 与 Adobe 插件接入", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2117995299591319932", "date": "2026-11-04T15:00:04.000Z", "summary": "可灵（Kling AI）宣布 Kling 4.0 Flash 现已对所有人全面开放，可通过 Kling AI 网站和 API 使用。用户还能通过 MCP、CLI 和 AI 插件访问，并为 Adobe Photoshop、Premiere Pro、After Effects 等专业创作工具提供插件，将视频生成直接集成到创作流程中。", "type": "product", "relTime": "1天前"}, {"id": 54, "title": "国行 Apple 智能上线，创作内容与问询结果可同步至千问 App", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/022/459.htm", "date": "2026-11-04T14:49:55.467Z", "summary": "苹果推送 iOS 27.3 首个开发者预览版，为国行用户带来「Apple 智能与 Siri」，与阿里巴巴合作接入千问，可在 Siri、写作工具和视觉智能中调用其文本与图像理解能力。IT之家实测发现，视觉智能的问询结果和千问完成的文字创作内容都会同步至千问 App，后者支持语音播报、分享、复制、收藏、重新生成等操作。", "type": "industry", "relTime": "1天前"}, {"id": 55, "title": "PixVerse 演示用 Depth Map Control 用自己角色复刻任意视频动作", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2117980488778555413", "date": "2026-11-04T14:01:13.000Z", "summary": "PixVerse 演示如何用其 Depth Map Control 功能，用自己的角色复刻任意视频的动作。步骤为在 PixVerse 打开 Depth Map Control，上传想复刻的视频作为深度参考，添加自己的角色、物体或场景，再写提示词生成。", "type": "tip", "relTime": "1天前"}, {"id": 56, "title": "小米 WorldCast 3D 运镜在 REDMI K100 上线：平面照片还原成三维场景", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/022/433.htm", "date": "2026-11-04T13:53:25.310Z", "summary": "小米 REDMI K100 上线 3D 运镜 AI 玩法，从相册选一张静态照片即可生成大角度 3D 运镜视频，镜头可环绕、推拉、倾斜，人物五官、发型、衣着保持一致。该功能由小米近期公开论文中的视觉生成框架 WorldCast 支撑，它通过解读画面深度结构把平面照片还原成三维场景，并虚拟出真实相机轨迹。小米称后续将探索更复杂运镜形态、更长连续生成及可控 4D 视频生成技术。", "type": "product", "relTime": "1天前"}, {"id": 57, "title": "百度发布物理AI世界模型Apollo World", "source": "X：百度 Baidu (@Baidu_Inc)", "sourceUrl": "https://x.com/Baidu_Inc/status/2117965585342419416", "date": "2026-11-04T13:02:00.000Z", "summary": "百度在深圳AI Day上发布面向物理AI的世界模型Apollo World，可将复杂道路交互与罕见驾驶场景转化为可重复、可控的仿真，用于自动驾驶系统训练与测试。该模型支持自主决策的AI交通智能体、实时生成的摄像头与LiDAR等传感器数据，以及虚拟城市中任意两点间的完整载客行程。Apollo World已用于Apollo Go的测试验证。", "type": "product", "relTime": "1天前"}, {"id": 58, "title": "TechHalla 实测 Kling 4.0 与 Kling 4.0 Flash：多镜头调度与角色一致性", "source": "公众号：可灵AI（快手·视频）", "sourceUrl": "https://mp.weixin.qq.com/s/vr5mLfyrJI5t4_jwc-5cVQ", "date": "2026-11-04T11:15:39.000Z", "summary": "可灵AI 公众号发布创作者 TechHalla 对 Kling 4.0 和 Kling 4.0 Flash 的实战测评，展示投石机抛车、音乐视频《PACK ANIMALS》和3D动作迁移等四项测试。", "type": "tip", "relTime": "1天前"}, {"id": 59, "title": "腾讯混元 Hy4 正式版发布，称首次跻身最强开源模型之列", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/022/035.htm", "date": "2026-11-04T04:59:42.330Z", "summary": "腾讯混元 11 月 4 日发布大语言模型 Hy4 正式版，官方称 Hy 首次跻身最强开源模型之列，计划近期开源模型权重并发布模型系统卡片。相比 Hy4 preview，该模型扩展了预训练和后训练规模，首次引入视觉能力和电脑操作支持，可执行细粒度图像处理、复杂图表分析、数学视觉推理及结合命令行与图形界面的任务。", "type": "model", "relTime": "1天前"}, {"id": 60, "title": "腾讯 WeChat Vision 团队开源 WeVisOne-VL 视觉语言模型，统一检测、OCR、分割与抠图", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/11/03/tencent-wevisone-vl-vision-language-model/", "date": "2026-11-04T04:39:27.000Z", "summary": "腾讯 WeChat Vision 团队发布开源视觉语言模型 WeVisOne-VL，提供 2B（2.44B 参数）和 4B（4.83B 参数）两个版本，基于 Qwen3-VL，单个模型即可完成检测、指代、计数、指向、OCR、分割和 alpha matting，像素输出由 9.6M 参数解码器生成，无需单独的 SAM，缺失目标时输出 None 而非猜测框。", "type": "model", "relTime": "1天前"}, {"id": 61, "title": "OpenAI 发布 Images 2.6，生成提速 50% 并新增 GIF 动画能力", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "sourceUrl": "https://openai.com/index/introducing-images-2-6", "date": "2026-11-04T00:00:00.000Z", "summary": "OpenAI 在 ChatGPT、Codex 和 API 中推出 Images 2.6，图像生成速度比之前快 50%，并支持用 GIF 为图像添加动画。API 提供 GPT-Image-2.6 Flare（低质量下最快 6 秒出图）和 GPT-Image-2.6 Sunburst（中高质量下更精细）两个模型。", "type": "product", "relTime": "2天前"}, {"id": 62, "title": "YouTube 面向全球创作者推广“替换歌曲”AI 配乐工具", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/021/877.htm", "date": "2026-11-03T22:29:25.370Z", "summary": "YouTube 于 11 月 4 日宣布面向全球创作者推广 YouTube Studio 中的“替换歌曲”（Replace song）工具，该功能此前已在美国上线。创作者收到音频版权申诉后可即时生成四首各约三分钟的免版税器乐背景音乐替换受版权音频，替换后相应 Content ID 版权声明自动移除；目前仅支持器乐，暂不支持人声或完整歌曲创作。", "type": "product", "relTime": "2天前"}, {"id": 63, "title": "fal 完成 E 轮与 F 轮共 16.5 亿美元融资，联合创始人谈生成式媒体与 AI 基础设施经济", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2117743711010578868", "date": "2026-11-03T22:20:21.000Z", "summary": "fal 宣布完成 E 轮与 F 轮合计 16.5 亿美元融资，E 轮由 Sequoia 领投，F 轮由 Bessemer 领投。联合创始人 Burkay Gür 与 Görkem Yurtseven 在与 Molly SOShea 的访谈中称生成式媒体与搜索、编码智能体并列 AI 三大产品市场契合，并提到专业用户每月在 AI 媒体生成上花费 1 万至 2 万美元、视频一度占 fal 收入约 ...", "type": "industry", "relTime": "2天前"}, {"id": 64, "title": "OpenRouter 上线隐身模型 Crouton Alpha", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2117712705901728199", "date": "2026-11-03T20:17:08.000Z", "summary": "🥷 新隐身模型：Crouton Alpha  一款高效推理模型，专为规模化处理你的智能体全天重复的工作而打造。  - 免费使用 - 1M token 上下文 - 文本、图像、音频和视频输入 - 不使用数据训练", "type": "model", "relTime": "2天前"}, {"id": 65, "title": "DGX Spark 上 5 秒 480p 视频生成耗时 59.5 秒", "source": "X：UCSD Hao AI Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2117704079954825436", "date": "2026-11-03T19:42:52.000Z", "summary": "(4/6) 在你的桌面上也能跑。一段 5 秒 480p 首尾帧片段在单台 DGX Spark 上耗时 59.5 秒。Blackwell 从 Spark 一路覆盖到 RTX 5090。@NVIDIARTXSpark", "type": "tip", "relTime": "2天前"}, {"id": 66, "title": "Hao AI Lab 将 Pika 开源的 MiniMax H3 Flex 接入 FastVideo，推理最高快 7 倍", "source": "X：UCSD Hao AI Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2117704073248174180", "date": "2026-11-03T19:42:50.000Z", "summary": "Hao AI Lab 宣布 Pika 上周开源的 MiniMax H3 Flex 已进入 FastVideo。相比官方开源推理代码最高快 7 倍，在单张 NVIDIA GB200 上 5.8 秒生成 5 秒 480p 视频+音频；开放权重和完整训练配方，附 FastVideo 教程、Hugging Face 权重（https://huggingface.co/FastVideo/Pika-H...", "type": "product", "relTime": "2天前"}, {"id": 67, "title": "AI 推理初创公司 Fal 融资 13 亿美元，估值翻倍至 160 亿美元", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/11/03/ai-inference-startup-fal-doubles-its-valuation-to-16b-as-demand-surges/", "date": "2026-11-03T19:34:43.000Z", "summary": "托管和运行 AI 视频、图像与音频模型的旧金山初创公司 Fal 完成 13 亿美元融资，由 Bessemer Venture Partners 领投，Nvidia、Sound Ventures 和 T. Rowe Price 参投，估值 160 亿美元，较 4 月的 80 亿翻倍。", "type": "industry", "relTime": "2天前"}, {"id": 68, "title": "国行 Apple 智能与 Siri 随 iOS 27.3 开发者预览版上线，iPhone 15 Pro 及更新机型可用", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/021/861.htm", "date": "2026-11-03T19:08:12.987Z", "summary": "苹果面向 iPhone 发布 iOS 27.3 开发者预览版，IT之家实测国行「Apple 智能与 Siri」如期上线，用户更新后可在设置中找到该功能。国行版与阿里巴巴合作接入千问，用户可在 Siri、写作工具和视觉智能中调用千问的文本与图像理解能力，登录千问账户或通过「通过 Apple 登录」即可使用，无需跳转独立应用。", "type": "product", "relTime": "2天前"}, {"id": 69, "title": "Gemini API CLI 技能发布", "source": "X：Philipp Schmid（Google DeepMind 开发者体验） (@_philschmid)", "sourceUrl": "https://x.com/_philschmid/status/2117674864907608543", "date": "2026-11-03T17:46:46.000Z", "summary": "我们为 Gemini API CLI 做了一个技能。它让你的智能体可以通过 CLI 调用 Gemini 模型（图像、TTS、视频、文件），无需编写一次性脚本。  npx skills add google-gemini/gemini-skills --skill gemini-api-cli", "type": "product", "relTime": "2天前"}, {"id": 70, "title": "Google DeepMind 与 Stanford 论文：提示词中红心图形可让 VLM 转向递归解法", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2117651708998484268", "date": "2026-11-03T16:14:46.000Z", "summary": "Google DeepMind 与 Stanford 的论文发现，提示词中加入与任务无关的简单彩色图形（如红心）会隐式改变 VLM 的行为。在二叉树编码题上，红心使 Claude Opus 4.7 和 GPT-5.4 的递归解法占比从 0% 升到 100%；Gemini 3.1 Pro 被图形影响时，71.5% 的思考痕迹称图像无关。", "type": "paper", "relTime": "2天前"}, {"id": 71, "title": "OCRia-1 背后的推理栈：单张 B200 上 token 生成提速近 10 倍", "source": "LlamaIndex：产品、工程与评测", "sourceUrl": "https://www.llamaindex.ai/blog/the-inference-stack-behind-ocria", "date": "2026-11-03T16:00:00.000Z", "summary": "LlamaIndex 披露 OCRia-1 文档解析模型的推理优化方案，在单张 B200 GPU 上把 token 生成速度从约 285 tokens/sec 提升到约 2800 tokens/sec，接近 10 倍。方案结合了混合精度量化（BF16、FP8、NVFP4，视觉编码器不量化）与 DFlash2 块扩散投机解码，后者接受率超过 12 个 token。", "type": "tip", "relTime": "2天前"}, {"id": 72, "title": "OiiOii全能复刻实测：用Opus 5.5+Seedance 2.5批量复刻6类高质感视频", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s/6JHZvhaLnJM8bajlh8bsKQ", "date": "2026-11-03T12:08:00.000Z", "summary": "作者实测OiiOii新上线的全能复刻功能，复刻了品牌UI动效、MG动画、单品广告、游戏实机、口播和多维度批量裂变6类视频，全程无需写代码或用AE。其原理是镜头光影交给Seedance 2.5生成，识别到文字排版和UI时调用Opus 5.5写代码并在云端浏览器渲染录制，文字边缘比原片更清晰；复刻时留存中间工程文件，同一创意反复修改速度可快4到5倍、费用省约80%。", "type": "tip", "relTime": "2天前"}, {"id": 73, "title": "Meshy 发布 N1 Texture，单个游戏资产纹理约 20 秒完成", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2117560632367309261", "date": "2026-11-03T10:12:51.000Z", "summary": "Meshy 发布 Meshy N1 Texture，为游戏资产生成纹理，单个资产约 20 秒完成。该工具输出干净的 2K base color、大幅减少接缝，主打风格化游戏资产。官方还演示了 GPT 编写商店代码、Meshy T2 把商品照片转成 3D、N1 上色的十分钟超市搭建流程。", "type": "product", "relTime": "2天前"}, {"id": 74, "title": "可灵 4.0 实战：八位创作者分享使用体验", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2117540047809602044", "date": "2026-11-03T08:51:04.000Z", "summary": "可灵（Kling）邀请八位创作者分享 Kling 4.0 在真实创作工作流中的表现。要点包括 Dynamic Motions 带来更流畅的动作与物理交互、Native 30s Generation 支持更自然的叙事节奏，Omni Reference 融合多种视觉参考构建统一风格。创作者还强调角色一致性提升、口型与粤语台词精准匹配以及电影级画面质感。", "type": "industry", "relTime": "2天前"}, {"id": 75, "title": "曝字节跳动 Seedance 视频生成模型海外收入占比达 50%", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/021/637.htm", "date": "2026-11-03T08:37:00.243Z", "summary": "据《智能涌现》爆料，字节跳动旗下视频生成模型 Seedance 的海外收入占比已达到 50%，过去半年海外市场收入增长近 5 倍。报道称腾讯位列 Seedance 中国区客户前三，B站进入前十，头部互联网企业正规模化采购；火山引擎此前还发布了 Seedance 影视合作计划，单个项目激励最高可达百万人民币，并于 10 月 23 日发布该代中最强的 Seedance 2.5 4K 模型。", "type": "industry", "relTime": "2天前"}, {"id": 76, "title": "商汤发布日日新 SenseNova 6.8 Flash 正式版，支持动态 PPT 与 Blender 3D 创作", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/021/487.htm", "date": "2026-11-03T03:59:48.813Z", "summary": "商汤科技 11 月 2 日晚发布日日新 SenseNova 6.8 Flash 正式版，重点升级办公协作与设计生成能力，支持长期记忆、跨会话任务协作。", "type": "model", "relTime": "2天前"}, {"id": 77, "title": "Google 与香港大学发布 VeriCUA 论文：用机器状态验证计算机智能体的任务完成声明", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2117445916982673579", "date": "2026-11-03T02:37:01.000Z", "summary": "Google 与香港大学的 VeriCUA 论文主张计算机使用智能体自己报告的“任务完成”不能作为证据，应检查保存的文件和应用数据。VeriCUA 先探索应用构建需求清单，再运行屏幕或代码检查逐项核实；在 ScienceBoard 上误报率为 5.4%，低于 VLM 评审的 24.8% 和生成脚本校验器的 21.7%，并在 3 个在线环境中拒绝约 80% 的虚假完成报告。", "type": "paper", "relTime": "2天前"}, {"id": 78, "title": "OpenAI 训练并部署激活分类器作为前沿模型安全监控层", "source": "OpenAI：Alignment 研究博客（RSS）", "sourceUrl": "https://alignment.openai.com/training-activation-classifiers/", "date": "2026-11-02T20:00:00.000Z", "summary": "OpenAI 自 GPT-5.6 起在其最强模型的内部和外部流量上部署激活分类器（probes），利用模型内部激活逐 token 实时评分，可在生成中途阻断违规回复和工具调用并交由推理模型复审。实验显示 probes 比更大的文本分类器对测试的越狱攻击更鲁棒，准确率随模型能力提升，且在后训练各检查点间迁移良好，但需为新基础模型重新训练，且只能检测可显式训练的已知违规类型。", "type": "paper", "relTime": "3天前"}, {"id": 79, "title": "Agent Arena 前十智能体输入输出比达 93:1", "source": "X：Arena (@arena)", "sourceUrl": "https://x.com/arena/status/2117332916854501753", "date": "2026-11-02T19:08:00.000Z", "summary": "根据我们对 26K+ 会话的分析，Agent Arena 中排名前十的智能体每生成一个 token，大约要处理 93 个输入 token。  这就是各家实验室竞相降低缓存输入成本的原因。  下方视频展示了缓存在实践中的运作方式，用的是来自 @AnthropicAI 的 Opus 5.5 和 @GoogleDeepMind 的 Gemini 4 Argon 的真实会话。  深入了解这场隐藏的 ...", "type": "model", "relTime": "3天前"}, {"id": 80, "title": "Skyfall AI 发布 SKY-001 工程世界模型", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2117323512155394394", "date": "2026-11-02T18:30:37.000Z", "summary": "Skyfall AI 发布 SKY-001，可按零件与建造步骤在 3D 中设计实体产品，CAD 精度与 GPT-6 Astra 相当，单次设计成本约低 150 倍。模型输出零件树、每步操作草图及中间实体，由 Hierarchical Composer 拆解装配与零件、Construction World Model 预测建造视觉步骤两阶段完成。", "type": "model", "relTime": "3天前"}, {"id": 81, "title": "美团LongCat-2.5多模态智能体模型发布", "source": "X：美团 LongCat (@Meituan_LongCat)", "sourceUrl": "https://x.com/Meituan_LongCat/status/2117264311714537633", "date": "2026-11-02T14:35:23.000Z", "summary": "推出 LongCat-2.5，我们最新的原生多模态智能体模型，总参数 1.6T，激活参数约 48B。  专为长程智能体任务打造，为从复杂编程项目到创意设计、3D 任务等视觉编程的各类工作带来更强的视觉理解与智能体编程能力。  了解更多 LongCat-2.5：https://longcat.ai/blog/longcat-2.5/", "type": "model", "relTime": "3天前"}, {"id": 82, "title": "美团龙猫发布 LongCat-2.5 原生多模态模型：1.6T 参数，面向长程智能体任务", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/020/873.htm", "date": "2026-11-02T01:18:38.433Z", "summary": "美团龙猫发布面向长程智能体任务的原生多模态模型 LongCat-2.5，总参数量 1.6 万亿，每个 token 激活约 480 亿参数，在 LongCat-2.0 基础上强化原生视觉理解与智能体编程能力。", "type": "model", "relTime": "3天前"}, {"id": 83, "title": "美团 LongCat 发布 LongCat-2.5：面向智能体任务的原生多模态模型", "source": "公众号：龙猫LongCat（美团）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzYyMTA0NTc5NQ%3D%3D&mid=2247486081&idx=1&sn=0609ae26ada1d4d96126b95044dd4519", "date": "2026-11-02T01:00:00.000Z", "summary": "美团龙猫 LongCat 团队发布面向长程智能体任务的原生多模态模型 LongCat-2.5，总参数量 1.6 万亿，每个 token 激活约 480 亿参数，在 LongCat-2.0 基础上强化原生视觉理解与智能体编程能力。", "type": "model", "relTime": "3天前"}, {"id": 84, "title": "Perplexity CEO 演示 Computer 生成的 4 亿年地球演化交互球体", "source": "X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)", "sourceUrl": "https://x.com/AravSrinivas/status/2117030646107545812", "date": "2026-11-01T23:06:53.000Z", "summary": "Perplexity CEO Aravind Srinivas 演示用 Computer 可视化地球 4 亿年的演化。引用的 @AskPerplexity 内容显示，Computer 基于 14 个开放数据集构建了交互地球，用自有引擎在 109 张古海拔地图上移动 258 个板块，可拖动时间轴或输入城市查看其 4 亿年前的位置，入口为 https://deeptime.pplx.app/。", "type": "product", "relTime": "4天前"}, {"id": 85, "title": "NVIDIA Cosmos 教程：为交互式仿真构建世界模型并部署 NIM 推理", "source": "NVIDIA Technical Blog：Agentic AI / Generative AI", "sourceUrl": "https://developer.nvidia.com/blog/build-world-models-for-interactive-simulation-with-nvidia-cosmos/", "date": "2026-11-01T16:00:00.000Z", "summary": "NVIDIA 技术博客介绍如何用 Cosmos 平台为物理 AI 构建世界模型，覆盖 Cosmos Framework 的训练、LoRA/SFT 后训练、DPO、GRPO、PPO 等强化学习管线，以及 Cosmos3-Nano 系列 checkpoint 在自动驾驶、机器人和手术场景下生成相机视频与 LiDAR 观测的推理流程。", "type": "product", "relTime": "4天前"}, {"id": 86, "title": "Adobe 研究推出 EditAgent，用测量数据让语言模型更专业地使用图像编辑工具", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/adobe-is-testing-how-well-ai-agents-can-use-editing-tools-like-a-photoshop-professional-would/", "date": "2026-11-01T14:56:44.000Z", "summary": "Adobe Research 与 UC San Diego 在论文中提出 EditAgent，将请求拆成步骤、并行生成候选，并用语言模型依据验证记录（特写、变化图、亮度色彩数据）一次性对比挑选。", "type": "paper", "relTime": "4天前"}, {"id": 87, "title": "PixVerse 演示 30 秒 16:9 犯罪动作惊悚视频生成提示词", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2116538273321685349", "date": "2026-10-31T14:30:22.000Z", "summary": "PixVerse 展示了一段 30 秒、16:9 的写实犯罪动作惊悚视频提示词，设定在纽约篮球馆，用 4 张参考图分别锁定人物、走廊、比赛和扶梯大厅，要求保持人物身份、黑西装、领带和墨镜一致。", "type": "tip", "relTime": "5天前"}, {"id": 88, "title": "Tripo 教程：20 分钟用 Agentic Canvas 搭建赛博朋克场景", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2116536921598079174", "date": "2026-10-31T14:25:00.000Z", "summary": "Tripo 发布教程，演示如何在 20 分钟内用 Tripo Studio 的节点式 Agent「Agentic Canvas」从一张参考图生成赛博朋克 3D 场景并导出 UE5 工程。", "type": "tip", "relTime": "5天前"}, {"id": 89, "title": "PixVerse 发布 2000 年代日本 MiniDV 手持录像风格 30 秒视频提示词", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2116485440136241230", "date": "2026-10-31T11:00:25.000Z", "summary": "PixVerse 发布一份 30 秒视频生成提示词，模拟 2000 年代初日本家用 MiniDV 手持录像风格，角色和街景严格基于参考图片。提示词规定跟拍距离约 0.5-1.2 米、禁止全身镜头、30 秒内约 10-12 个镜头并以 HARD CUT 为主，并逐镜头规定了雨天进店买饮料的完整剧情与付款连贯性细节。", "type": "tip", "relTime": "5天前"}, {"id": 90, "title": "Figma 发布 Weave 创作平台，用节点化工作流让创意流程可复用", "source": "Figma AI / Agent / Make", "sourceUrl": "https://www.figma.com/blog/the-tldr-on-figma-weave/", "date": "2026-10-31T00:58:00.000Z", "summary": "Figma 宣布 Figma Weave，一个面向持续产出需求的创意团队平台，并把 Weave 创作工作流与 Figma 画框连接起来。Weave 用连接的节点承载图像和视频的生成与编辑，支持分支探索、多模型对比、色彩校正、合成、裁剪、Painter 等编辑节点；工作流可打包成 Weave tool 让团队成员一键运行，社区工具发布已上线。", "type": "product", "relTime": "5天前"}, {"id": 91, "title": "阿里巴巴与Apple合作，千问集成至Apple智能，11月4日开放测试", "source": "公众号：千问APP（阿里）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzYzNDE5MDEwMQ%3D%3D&mid=2247489416&idx=1&sn=9525f61df8086fcd6fe4d4183da068de", "date": "2026-10-31T00:03:47.000Z", "summary": "10月31日阿里巴巴宣布与Apple合作，将千问集成至Apple智能，中国用户可在Siri、写作工具及视觉智能中调用千问的文本与图像理解、内容生成能力。功能11月4日起随iOS开发者Beta开放测试，12月iOS 27.3正式发布时推出；用户可自主选择开通，请求与回复不用于模型训练。", "type": "industry", "relTime": "6天前"}, {"id": 92, "title": "谷歌宣布 Project Suncatcher 在轨 TPU 首次完成 AI 响应里程碑", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/020/402.htm", "date": "2026-10-30T23:51:47.903Z", "summary": "谷歌当地时间 10 月 30 日宣布达成“Hello World”里程碑，在轨运行的数据中心级 TPU 首次给出 AI 响应，由预装在卫星上的 DeepMind 模型 Gemma 4 创作了一首关于身处太空的俳句。", "type": "industry", "relTime": "6天前"}, {"id": 93, "title": "Gemini 头像可与好友共享出镜", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2116306570514772225", "date": "2026-10-30T23:09:40.000Z", "summary": "11) 在 Gemini 中与朋友分享你的头像，一起出演图像和视频。  创建你的个人头像，分享给朋友、家人和协作者，在提示词中互相标记，生成看起来和听起来都像你的图像和视频。此外，你可以随时添加或移除朋友的访问权限。  有关可用性及创建头像的分步说明的更多信息：https://goo.gle/4dTXLJA", "type": "product", "relTime": "6天前"}, {"id": 94, "title": "Google Gemini 发布前沿模型 Gemini 4 Argon", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/21163

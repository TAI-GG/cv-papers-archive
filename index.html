: "industry", "relTime": "1天前"}, {"id": 21, "title": "Google Earth 的 AI 深度伪造功能仅上线一天即被关闭", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/973943/google-earth-ai-image-generation-deepfake-tool", "date": "2026-07-31T19:13:29.000Z", "summary": "Google 于周四推出的 Google Earth AI 图像编辑功能（基于 Nano Banana 2）因被用于生成虚假地理影像而于一天后下线。测试者 Henk van Ess 曾用该工具生成美墨边境难民、加沙医院弹坑等深度伪造图像，并称其能骗过 Hive 的 AI 检测工具。Google 表示将回滚该功能并加强护栏，同时强调生成图像带数字水印且未在主体验中公开展示。", "type": "industry", "relTime": "1天前"}, {"id": 22, "title": "Google DeepMind 推出 Gemini Robotics 2，为各类机器人提供智能层", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/google-deepmind-unveils-gemini-robotics-2-to-power-robots-of-all-shapes-from-tabletop-arms-to-humanoids", "date": "2026-07-31T18:25:08.000Z", "summary": "Google DeepMind 发布 Gemini Robotics 2，称其为迄今最先进的视觉-语言-动作（VLA）模型，可控制从桌面机械臂到全身人形机器人的各类系统。该模型支持全身运动、精细操作及多机器人协同，开发者可通过候补名单申请早期访问。同期发布的 Gemini Robotics ER 2 专为具身推理设计，已上线 Google AI Studio。", "type": "model", "relTime": "1天前"}, {"id": 23, "title": "MiniMax H3 上线 HailuoAI 与 API", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2083241267643691226", "date": "2026-07-31T17:19:57.000Z", "summary": "MiniMax H3 现已在 HailuoAI 及 MiniMax API 上线，支持文本、图像、音频和视频多模态输入生成视频，并具备精准编辑控制。该模型面向电影、广告、游戏、品牌和电商等创意场景，2K 视频定价 $0.081/秒，768p 视频即将推出，定价 $0.047/秒。", "type": "model", "relTime": "1天前"}, {"id": 24, "title": "Google Earth 内置 AI 图像生成器引发虚假信息担忧", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/973764/google-earth-ai-satellite-images", "date": "2026-07-31T17:05:46.000Z", "summary": "Google Earth 网页版本周全球上线 Nano Banana 2 功能，用户仅凭文本提示即可基于卫星和 3D 影像生成逼真图像。Digital Digging 的 Henk van Ess 已用其生成\"墨西哥边境难民\"和\"加沙医院附近炸弹弹坑\"等虚假场景。", "type": "paper", "relTime": "1天前"}, {"id": 25, "title": "Snapchat 不再奖励纯 AI 生成的 Spotlight 内容", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/31/snapchat-no-longer-rewards-fully-ai-generated-spotlight-content", "date": "2026-07-31T16:49:08.000Z", "summary": "Snapchat 宣布调整推荐系统，只有真人创作的视频才有资格获得 Spotlight 推荐，以优先展示人类原创内容。平台并未完全拒绝 AI，创作者仍可使用其 AI 工具增强或编辑内容。此举是 Snapchat 改善 Spotlight、回归原创优先策略的一部分，此前该公司已表示将减少 AI 生成内容的展示。", "type": "industry", "relTime": "1天前"}, {"id": 26, "title": "MiniMax H3 上线 Argil，开源在即", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2083222275701240298", "date": "2026-07-31T16:04:29.000Z", "summary": "MiniMax H3 已在 Argil 平台上线，官方称其能统一理解文本、图像、视频与音频，内部测试质量扎实，可生成生产级内容。MiniMax 表示 H3 开源权重即将推出，被视为行业变革者。", "type": "model", "relTime": "1天前"}, {"id": 27, "title": "Google AI 盘点 Gemini 系列多项模型更新", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2083221445375668654", "date": "2026-07-31T16:01:11.000Z", "summary": "Google AI 发布近期更新盘点：Gemini Robotics 2 为机器人带来全身智能；Gemini 3.5 Flash-Lite 主打高速与高性价比，Gemini 3.6 Flash 在减少 token 用量的同时提升速度与准确性。此外还推出面向政府的安全模型 Gemini 3.5 Flash Cyber、Nano Banana 2 图像生成及 Lyria 3.5 音乐模型。", "type": "industry", "relTime": "1天前"}, {"id": 28, "title": "MiniMax H3 开源倒计时开启", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2083216488044068906", "date": "2026-07-31T15:41:29.000Z", "summary": "👀 敬请期待！  MiniMax H3 开源发布倒计时 🔥 关注 @MiniMax_AI，第一时间获取发布消息。一个模型，统一处理文本、图像、视频和音频。支持最长 15 秒 2K 视频，自带原生立体声。", "type": "model", "relTime": "1天前"}, {"id": 29, "title": "MiniMax H3 登陆 Magnific，权重即将开源", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2083213970643763507", "date": "2026-07-31T15:31:29.000Z", "summary": "MiniMax 视频生成模型 H3 已上线 Magnific，支持最多 9 张图控制角色与风格、3 段视频控制运动与镜头，输出 2K、时长 5-15 秒。H3 权重即将开放，社区可微调并构建全新创意工作流，推动开放视频生成。", "type": "model", "relTime": "1天前"}, {"id": 30, "title": "Dreamina Seedance 2.5 上线，暂不支持美国", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2083211580364202241", "date": "2026-07-31T15:21:59.000Z", "summary": "Dreamina Seedance 2.5 Gemini macOS 应用新增全局语音交互", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2082858829541458008", "date": "2026-07-30T16:00:17.000Z", "summary": "Gemini macOS 应用推出全局语音功能，用户可在任意活跃窗口中通过语音输入、编辑和总结内容，或让 Gemini 分析本地文件、生成视觉内容。该功能已面向全球英文用户逐步推送，更多语言支持即将到来。", "type": "paper", "relTime": "2天前"}, {"id": 63, "title": "Runway Characters 入选 SIGGRAPH 2026 Real-Time Live！ 现场演示", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/company-news/runway-characters-siggraph-2026", "date": "2026-07-30T16:00:00.000Z", "summary": "Runway 的实时交互数字人系统 Characters 入选 SIGGRAPH 2026 的 Real-Time Live！ 环节，团队在现场用一张照片数秒内生成可对话的角色。该系统从单张图片出发，无需微调即可适配任意风格，逐帧生成画面以支持长达 30 分钟以上的连续对话。Characters 于今年 3 月上线，团队正探索可导航环境、多参考图像及记忆功能等后续方向。", "type": "tip", "relTime": "2天前"}, {"id": 64, "title": "字节发布 Seedance 2.5：单次生成 30 秒视频，支持多模态参考与精准编辑", "source": "字节 Seed：Research Feed（网页内嵌数据）", "sourceUrl": "https://seed.bytedance.com/zh/blog/%E4%B8%80%E9%95%9C%E6%88%90%E7%89%87-%E9%9A%8F%E5%BF%83%E5%8F%82%E8%80%83-seedance-2-5-%E6%AD%A3%E5%BC%8F%E5%8F%91%E5%B8%83", "date": "2026-07-30T16:00:00.000Z", "summary": "字节跳动今日正式发布新一代视频创作模型 Seedance 2.5，单次视频生成时长从 15 秒提升至 30 秒，并支持多轮延长，可产出数分钟连贯内容。模型支持单次输入最多 30 张图片、10 段视频和 10 段音频作为参考素材，并升级白模参考、运动参考及绿幕编辑、时间戳精准编辑等能力。Seedance 2.5 已陆续上线即梦 AI、豆包专业版等平台，API 服务近期将上线火山方舟。", "type": "model", "relTime": "2天前"}, {"id": 65, "title": "Imagine Video 1.5 with References Jul 31， 2026 # Imagine Video 1.5 with References Our best video model， now with text， image， and voice references - generating up to 1080p. Read More", "source": "xAI：News（网页）", "sourceUrl": "https://x.ai/news/grok-imagine-video-1-5-references", "date": "2026-07-30T16:00:00.000Z", "summary": "暂无摘要", "type": "model", "relTime": "2天前"}, {"id": 66, "title": "Google 推出具身推理模型 Gemini Robotics ER 2", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2082857770303340719", "date": "2026-07-30T15:56:04.000Z", "summary": "Google 发布 Gemini Robotics ER 2，一个全新的具身推理模型。该模型在成功/失败检测上支持原始视频流而非静态快照，可捕捉溢出、滑落等执行中故障；通用仪表读数能力从圆形表盘扩展至数字显示屏、线性刻度尺、液体温度计等 10 种类型。其空间 VQA 能力也通过 Gemini 多模态理解提升得到增强。", "type": "model", "relTime": "2天前"}, {"id": 67, "title": "Google DeepMind 推出三款新机器人模型", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2082855791334240665", "date": "2026-07-30T15:48:12.000Z", "summary": "Google DeepMind 发布三款新机器人模型。Gemini Robotics 2 是高级视觉-语言-动作模型，支持全身人形机器人、指尖操作和双臂机器人。Gemini Robotics ER 2 具备具身推理能力，可帮助机器人与人沟通、理解世界并规划多步骤任务。", "type": "model", "relTime": "2天前"}, {"id": 68, "title": "Seedance 2.5 明日发布，支持更长视频", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2082854638814998967", "date": "2026-07-30T15:43:38.000Z", "summary": "Seedance 2.5 明日发布。  Seedance 2.0 在 AI 视频生成领域仍处于领先地位。2.5 版本将超越它，据我们所知，还将支持更长的片段。", "type": "paper", "relTime": "2天前"}, {"id": 69, "title": "Gemini Robotics ER 2 发布，专为物理 AI 设计", "source": "X：Google AI for Developers (@googleaidevs)", "sourceUrl": "https://x.com/googleaidevs/status/2082845684747702522", "date": "2026-07-30T15:08:03.000Z", "summary": "Gemini Robotics ER 2 是我们最强大的具身推理模型，专为物理 AI 设计 🤖  该模型作为机器人的高级大脑，可直接连接 Gemini Live API。它处理连续视频流以跟踪进度、调用工具、搜索网络，并实时指挥动作模型。  面向开发者的升级包括：+ 增强的进度跟踪 + 实时执行中故障检测 + 多机器人协作 + 高级安全指令遵循", "type": "model", "relTime": "2天前"}, {"id": 70, "title": "开发者欲实时模糊Claude生成内容", "source": "X：Dex Horthy（HumanLayer）(@dexhorthy)", "sourceUrl": "https://x.com/dexhorthy/status/2082845002745753912", "date": "2026-07-30T15:05:20.000Z", "summary": "我发誓，我一定要用 vibe coding 搞一个屏幕截图工具，能检测我显示器上的 Claude 垃圾内容并实时模糊掉，这样我就再也不用看到这破玩意儿了。", "type": "tip", "relTime": "2天前"}, {"id": 71, "title": "Google DeepMind 发布 Gemini Robotics 2 与 ER 2", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2082844740446253125", "date": "2026-07-30T15:04:18.000Z", "summary": "Google DeepMind 推出 Gemini Robotics 2，作为新一代自适应机器人的智能层，支持全身控制、高级灵巧操作及多机器人协作。同时发布新具身推理模型 Gemini Robotics ER 2，作为机器人的\"高层大脑\"，负责观察环境、推理任务步骤、协调视觉-语言-动作模型执行动作并追踪进度，使机器人能执行复杂多步骤工作流、自我纠错并适应全新场景。", "type": "model", "relTime": "2天前"}, {"id": 72, "title": "Google DeepMind 发布 Gemini Robotics 2 物理 AI", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2082844162928381956", "date": "2026-07-30T15:02:00.000Z", "summary": "One brain. For any robot. 🤖  我们正在推出 Gemini Robotics 2：我们的下一代物理 AI，为仿人机器人带来全身智能、高级灵巧性、多机器人团队协作等能力。", "type": "paper", "relTime": "2天前"}, {"id": 73, "title": "Gemini Robotics ER 2：用视频理解、任务编排与多机器人协作赋能机器人", "source": "Google DeepMind：Blog（RSS）", "sourceUrl": "https://deepmind.google/blog/gemini-robotics-er-2-powering-robotics-with-video-understanding-task-orchestration-and-multi-robot-collaboration", "date": "2026-07-30T15:00:59.000Z", "summary": "Google DeepMind 推出 Gemini Robotics ER 2，一个基于 Gemini 的机器人基础模型。该模型在视频理解、工具编排和多机器人协作方面实现阶跃式提升，使机器人能够推理、协作并解决真实世界任务。", "type": "model", "relTime": "2天前"}, {"id": 74, "title": "Gemini macOS 应用新增\"语音对话\"功能", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2082828124211806545", "date": "2026-07-30T13:58:16.000Z", "summary": "Google 为 Gemini macOS 桌面应用推出\"Speak to Window\"语音交互功能。用户可通过长按 Fn 键直接语音输入，让 Gemini 完成信息提取与摘要、文本撰写与改写、图像生成与编辑等任务，无需手动打字。", "type": "paper", "relTime": "2天前"}, {"id": 75, "title": "Luma Agents 上线 Layers 图层提取功能", "source": "X：Luma AI (@LumaLabsAI)", "sourceUrl": "https://x.com/LumaLabsAI/status/2082813292335046837", "date": "2026-07-30T12:59:20.000Z", "summary": "Layers 现已在 Luma Agents 中上线。让智能体从任意图像中提取图层--无论是 Luma 生成的还是上传的。然后继续对话：替换产品、重设背景风格、重写标题。 更改一个元素，保留其余一切。由 Uni-1 驱动。", "type": "product", "relTime": "2天前"}, {"id": 76, "title": "阿里云Qwen模型家族演进图谱发布", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2082773341954527236", "date": "2026-07-30T10:20:35.000Z", "summary": "Qwen模型家族网络图谱：一次关于AI真正如何演进的视觉导览--从大语言模型到具身智能。  在下方视频中发现完整的演进过程。  准备好进一步探索了吗？ • 试用Model Studio：https://click.alibabacloud.com/m/20000000959/ • 或探索Qwen Cloud：https://click.qwencloud.com/m/20000000996/", "type": "tip", "relTime": "2天前"}, {"id": 77, "title": "小米人形机器人工厂实测：折箱拧螺丝成功率98%", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2082771319305666670", "date": "2026-07-30T10:12:33.000Z", "summary": "小米创始人雷军发布视频展示其人形机器人在工厂作业，机器人成功完成折叠储物箱等任务，另一台小米机器人负责拍摄。小米称其机器人自攻螺丝加载站成功率已达98%，仅比人类工人低1%。该机器人还在测试工厂物流新任务，如分拣中控台盖板和折叠回收箱，成功率约90%。", "type": "industry", "relTime": "2天前"}, {"id": 78, "title": "特斯拉 Robotaxi 新增车载录制功能，采集路况数据优化自动驾驶", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/983/604.htm", "date": "2026-07-30T06:47:11.000Z", "summary": "特斯拉为有人监督的 Robotaxi 测试车辆新增中控屏录制功能，可记录车辆遥测数据和行驶过程。约 20 分钟行程占用 10% 磁盘空间，数据用于验证测试和 AI 模型训练。目前特斯拉 Robotaxi 车队累计无人监督自动驾驶里程已突破 38 万英里（约 61.2 万公里），服务已扩展至迈阿密、奥兰多和坦帕。", "type": "model", "relTime": "2天前"}, {"id": 79, "title": "Pangram AI图像检测器100%准确识别造假", "source": "X：Deedy Das (@deedydas)", "sourceUrl": "https://x.com/deedydas/status/2082687319606542637", "date": "2026-07-30T04:38:46.000Z", "summary": "用Pangram刚刚推出的AI图像检测器，跑了一遍r/IsThisAI（320万用户）子版块的热门帖子。准确率100%。  能识别一切：- 网络钓鱼（约会资料）- 篡改（验孕棒、超声波）- 虚假广告（宠物、食品）- 烂借口（车坏了）- 宣传内容  它检测的是实际像素，而不仅仅是C2PA元数据/SynthID。  AI骗子们彻底完了。", "type": "tip", "relTime": "2天前"}, {"id": 80, "title": "Agnes 2.5 Pro Alpha 发布，低价推理模型 Intelligence Index 达 39", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2082662482523406752", "date": "2026-07-30T03:00:04.000Z", "summary": "新加坡 AI 实验室 Agnes AI 推出 Agnes 2.5 Pro Alpha，这是一款支持文本、图像和视频输入的低价推理模型。其在 Artificial Analysis Intelligence Index 上得分为 39，定价为每百万输入 token $0.45、每百万输出 token $0.90，是该智能水平下价格最低的专有模型之一。", "type": "tip", "relTime": "2天前"}, {"id": 81, "title": "Flux 3 生成《荒原》朗诵视频效果惊艳", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2082657371990503549", "date": "2026-07-30T02:39:46.000Z", "summary": "Ethan Mollick 用 Flux 3 生成《荒原》末段朗诵视频，由现代渔王在衰败城市背景下演绎。视频在语调与语言切换上表现惊人。", "type": "tip", "relTime": "2天前"}, {"id": 82, "title": "Vision Pro 最酷的用法：将户型图转为3D模型辅助建房决策", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://christianselig.com/2026/07/vision-pro-house", "date": "2026-07-30T00:17:54.835Z", "summary": "一位用户利用 Vision Pro 将平面户型图通过 Fusion 360 转为 3D 模型，在高分辨率虚拟空间中\"行走\"以感受房间尺度与动线。通过添加 IKEA 等家具 3D 模型，进一步模拟真实空间感，帮助做出装修决策。", "type": "tip", "relTime": "2天前"}, {"id": 83, "title": "RefCaptioner：多参考图像锚定的视频描述生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.28509", "date": "2026-07-30T00:00:00.000Z", "summary": "RefCaptioner提出多参考图像锚定视频描述任务，通过两阶段训练框架联合优化参考选择、短语级绑定与干扰项拒绝。训练语料含20，000个视频和171，354张参考图像，并引入MRVBench基准评测。实验显示其在开源模型中综合表现最佳，人工评估中描述更受偏好。", "type": "paper", "relTime": "2天前"}, {"id": 84, "title": "PhiZero：围绕\"物理语言\"构建的世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.28624", "date": "2026-07-30T00:00:00.000Z", "summary": "PhiZero 是一种基于\"物理语言\"的物理世界模型，该语言通过自监督学习从野外视频中提取世界状态转移的紧凑离散表征。它采用先推理后渲染的范式，先以物理语言序列推断未来世界演化，再由扩散解码器渲染成视频。实验验证了其在物理一致性生成、细粒度动作条件模拟和零样本运动迁移上的能力。", "type": "paper", "relTime": "2天前"}, {"id": 85, "title": "ACE-Data-0：以人为中心的环境捕捉作为具身数据引擎", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.28625", "date": "2026-07-30T00:00:00.000Z", "summary": "ACE Robotics 与南洋理工大学推出环境捕捉引擎（ACE），将真实家庭环境转化为录制影棚，以桌面级和房间级两种配置同步记录第一人称视频、多视角视频、全身动作及物体 6-DoF 轨迹。", "type": "paper", "relTime": "2天前"}, {"id": 86, "title": "Chimera：混合视觉扩散 Transformer 的设计与 Chinchilla 式缩放", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.28611", "date": "2026-07-30T00:00:00.000Z", "summary": "Chimera 是一种混合视觉扩散骨干架构，将文本、图像与视频 token 统一为单流处理，结合 Kimi Delta Attention、交错 Multi-head Latent Attention 与模态感知短卷积，无需位置嵌入即可处理长序列。", "type": "paper", "relTime": "2天前"}, {"id": 87, "title": "ReToken：一个token提升视觉语言模型的视觉检索能力", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.28627", "date": "2026-07-30T00:00:00.000Z", "summary": "ReToken通过一个可学习的嵌入token作为检索目标，从预填充的视觉KV缓存中筛选与查询相关的稀疏视觉token。在Visual Haystacks基准上，ReToken使Qwen3VL-8B提升13.4分、InternVL3.5提升12.4分；在LVBench上零样本迁移至长视频任务，为Qwen3VL-8B带来8.0分提升。", "type": "paper", "relTime": "2天前"}, {"id": 88, "title": "SpatialCLI：让视觉语言模型先借助空间工具推理、再内化能力", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.27703", "date": "2026-07-30T00:00:00.000Z", "summary": "SpatialCLI 提出三阶段框架，教视觉语言模型调用空间工具并逐步内化专家感知能力：先通过 Call 暴露专家视觉模型，再用 Cold-Start SFT 和智能体强化学习改进工具使用，最后将成功轨迹内化为自身能力。", "type": "paper", "relTime": "2天前"}, {"id": 89, "title": "MoMo：通过时空动作分词实现机器人操作中的运动模式控制", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/momo-motion-mode-manipulation", "date": "2026-07-30T00:00:00.000Z", "summary": "机器人操作需根据任务、物体和交互环境调整动作执行方式。MoMo 提出两阶段模仿学习框架，包含时空动作分词器和行为克隆 Transformer，将任务与连续运动模式条件作为输入。在六项真实机器人操作任务中，改变该条件可稳定生成不同执行风格的动作。", "type": "paper", "relTime": "2天前"}, {"id": 90, "title": "xAI 起诉明尼苏达州总检察长，称反\"脱衣\"应用法律迫使 Grok 限制图像编辑功能", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/policy/972850/xai-grok-minnesota-nudification-lawsuit", "date": "2026-07-29T21:06:52.000Z", "summary": "xAI 对明尼苏达州一项针对\"脱衣\"应用的法律提起诉讼，称该法惩罚性条款使其\"别无选择，只能以多种方式限制 Grok Imagine 的图像编辑功能\"，并主张该法违反第一修正案。该法于 5 月签署，8 月 1 日生效，允许总检察长对每次违规处以最高 50 万美元罚款。此前 Grok 在 1 月生成约 300 万张色情深度伪造图像，其中约 2.3 万张涉及儿童。", "type": "industry", "relTime": "3天前"}, {"id": 91, "title": "Gemini 免费生成十段视频至 2026 年 8 月", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2082563490431246623", "date": "2026-07-29T20:26:42.000Z", "summary": "从今天起，你可以在 Gemini 中免费创建十段视频，截止时间为太平洋时间 2026 年 8 月 4 日晚上 11：59。  只需在工具菜单中选择\"创建视频\"，即可生成、编辑和混剪视频，将你的创意变为现实。  在回复中分享你如何使用 Gemini Omni 👇", "type": "paper", "relTime": "3天前"}, {"id": 92, "title": "GPTZero 发现普华永道中东公司报告含AI生成内容与捏造来源", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/pwc-has-allegedly-published-ai-generated-reports-containing-false-or-fabricated-sources", "date": "2026-07-29T17:44:18.000Z", "summary": "GPTZero 检测发现，普华永道中东公司 2024-2026 年的四份报告中存在捏造来源和虚假声明。其中《Transforming Governance》报告有 84% 概率完全由 AI 生成，该报告用于推广产品\"Citizen Pulse\"，但无证据支持其被多国政府采用的声明。GPTZero 将此类行为称为\"Vibe Citing\"。", "type": "industry", "relTime": "3天前"}, {"id": 93, "title": "Pangram 4 发布：AI 文本检测误报率降至每 24，000 份文档一次", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/pangram-says-its-new-ai-text-detector-makes-only-one-mistake-per-24000-documents", "date": "2026-07-29T17:16:53.000Z", "summary": "Pangram 推出新一代 AI 文本检测模型 Pangram 4，据其基准测试，能正确识别 99.66% 的 AI 文本，误报率仅为 0.0041%（约每 24，000 份文档一次错误）。新模型规模扩大 6 倍，误报率降低 14 倍，并能区分 AI 辅助润色与完全由 AI 生成的文本。API 价格为每 100 词 $0.05，所有套餐现可免费扫描图片。", "type": "model", "relTime": "3天前"}, {"id": 94, "title": "PixVerse 深度图参考功能提升 AI 视频质量", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2082515459400925583", "date": "2026-07-29T17:15:51.000Z", "summary": "我们测试了深度图参考--创作者用于生成更清晰 AI 视频输出的新工具。 那层额外的灰度图承载着空间逻辑。 它帮助输出遵循相同的镜头节奏、前景-背景关系和运动路径。", "type": "paper", "relTime": "3天前"}, {"id": 95, "title": "Tavus PAL Maker：无代码创建视频AI智能体", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2082509704966664422", "date": "2026-07-29T16:52:59.000Z", "summary": "Tavus 发布 PAL Maker，首个无代码构建 PAL 的工具。用户只需通过自然语言描述需求，即可创建能看、听、记忆并理解情感的实时视频 AI 智能体，无需手动配置面部、声音、个性或知识库。生成的 PAL 可一键分享或嵌入网站/应用，将实时面对面 AI 智能体从开发者项目转变为几乎人人可用的产品。", "type": "product", "relTime": "3天前"}, {"id": 96, "title": "阿里Qwen3.7-Flash上线OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2082496629442224227", "date": "2026-07-29T16:01:02.000Z", "summary": "来自 @Alibaba_Qwen 的 Qwen3.7-Flash 已在 OpenRouter 上线。  一款支持视觉的快速推理模型，适用于多模态智能体、视觉编码、搜索和计算机交互，具备工具使用能力和 1M 上下文窗口。  立即体验：https://openrouter.ai/qwen/qwen3.7-flash", "type": "model", "relTime": "3天前"}, {"id": 97, "title": "Pangram 发布 AI 检测模型与图像预览功能", "source": "X：Deedy Das (@deedydas)", "sourceUrl": "https://x.com/deedydas/status/2082492383820951847", "date": "2026-07-29T15:44:09.000Z", "summary": "Pangram 推出 Pangram 4 模型，规模扩大 6 倍，可检测\"人性化\"文本，假阳性率仅万分之一，并能识别 Opus 5、GPT 5.6 Sol 等最新模型。同时发布 Pangram Image Preview，用于检测 AI 生成图像。Substack、Quora、Google Classroom 及 NeurIPS 等已采用该技术，业务过去一年增长 35 倍。", "type": "industry", "relTime": "3天前"}, {"id": 98, "title": "PixVerse 推出免费生成与夏日视频广告功能", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2082481523706437848", "date": "2026-07-29T15:01:00.000Z", "summary": "在 @PixVerse4Biz 上免费生成 3 次。 尝试地址：https://growth.pixverse.ai/?utm_source=X&utm_id=Social", "type": "industry", "relTime": "3天前"}, {"id": 99, "title": "雷军展示小米机器人工厂工作视频：\"督工\"也是机器人，还会比耶耍酷", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/983/342.htm", "date": "2026-07-29T14:57:37.000Z", "summary": "小米CEO雷军今日分享了一段小米机器人在工厂工作的视频，视频中一台白色涂装机器人折叠收纳盒后，镜头转向另一台黑色涂装机器人\"督工\"，它对着镜头比出\"耶\"手势。此前小米公布，自攻螺母上件工站双侧作业成功率已提升至98%，与人工作业合格率仅差1%并正式\"转正\"；新岗位中控台侧盖板排序和料箱折叠回收均达到90%成功率。", "type": "paper", "relTime": "3天前"}, {"id": 100, "title": "Kernel Forge：用MCTS优化CUDA内核的开源智能体框架", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2082480019948122293", "date": "2026-07-29T14:55:02.000Z", "summary": "Kernel Forge 是一个开源智能体框架，能直接改写未修改 PyTorch 模型的 CUDA 内核，覆盖视觉、扩散和 LLM 任务。它用蒙特卡洛树搜索（MCTS）替代线性生成-修复流程，在 NVIDIA DGX Spark（GB10 GPU）上以每内核 50 次迭代优化了 4 个模型的 14 个内核，使其超越 PyTorch 基线。性能提升主要来自框架结构和原位集成，而非更强的模型。", "type": "paper", "relTime": "3天前"}, {"id": 101, "title": "微软4B流式视觉模型Mage-VL发布", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2082466087141351853", "date": "2026-07-29T13:59:40.000Z", "summary": "微软推出仅4B参数的流式视觉语言模型Mage-VL，专为直播式视频理解设计。该模型能实时描述视频内容，并支持用户用自然语言指定关注时刻（如\"火车到站时\"），在低算力下实现高效流式处理。实测可在Mac mini上完成本地部署。", "type": "tip", "relTime": "3天前"}, {"id": 102, "title": "SpaceXAI 起诉明尼苏达州，反对\"AI 脱衣\"应用禁令", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/983/298.htm", "date": "2026-07-29T12:12:21.000Z", "summary": "马斯克旗下 xAI（已更名为 SpaceXAI）起诉明尼苏达州总检察长，反对一项将于本周六生效的禁止\"脱衣\"应用的法律。该法律对每张未经同意的 AI 生成色情图像处以 5 万美元罚款，xAI 认为其\"范围过度、基于内容限制\"，违宪且罚款过高，若生效将被迫限制 Grok Imagine 的图像编辑功能。明尼苏达州总检察长回应称将在法庭上交锋，州长则以\"法庭见，混蛋\"回应。", "type": "industry", "relTime": "3天前"}, {"id": 103, "title": "可灵 MCP 教程：快速生成时尚电商视频", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2082435980049711231", "date": "2026-07-29T12:00:02.000Z", "summary": "可灵 MCP 教程：几分钟内创建时尚电商视频  了解如何利用可灵 MCP 将产品照片转化为高质量时尚视频--从定义视觉风格、准备模特图像，到规模化生成产品展示视频。  更少制作。更多内容。", "type": "tip", "relTime": "3天前"}, {"id": 104, "title": "Google SynthID 水印难以破解，但无法解决 AI 虚假信息问题", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/07/tested-google-synthid-works-great-but-labeling-ai-content-may-be-a-losing-game", "date": "2026-07-29T11:00:39.000Z", "summary": "斯坦福大学与南加州大学合作的 Starling Lab 估计，人类在相机发明后 149 年才创造出 15 亿张图像，而生成式 AI 仅用 18 个月就达到相同规模。Google 在 I/O 大会上宣布其工具在短短几年内已生成超 1000 亿张 AI 图像和视频，并扩大 SynthID 水印技术的合作伙伴关系以标记 AI 内容。但水印技术本身无法从根本上解决 AI 虚假信息问题。", "type": "tip", "relTime": "3天前"}, {"id": 105, "title": "Pangram 完成 900 万美元融资，推出 AI 文本与图像检测模型", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/29/as-ai-content-floods-the-internet-pangram-raises-9m-to-detect-it", "date": "2026-07-29T11:00:00.000Z", "summary": "AI 检测初创公司 Pangram 完成 900 万美元融资，并推出新一代文本检测模型 Pangram 4 及图像检测模型 Pangram Image。Pangram 4 声称对 AI 辅助写作和混合人机内容的检测准确率超过 99%。用户可通过每月 20 美元的订阅服务或 Chrome 扩展使用该技术。", "type": "industry", "relTime": "3天前"}, {"id": 106, "title": "Codex 接管 tldraw 画布，一句话生成 3D 地球应用", "source": "X：Vista (@vista8)", "sourceUrl": "https://x.com/vista8/status/2082401754134852064", "date": "2026-07-29T09:44:01.000Z", "summary": "画布应用 tldraw 被 AI 工具 Codex 接管后，用户可通过自然语言指令直接开发应用程序。演示视频显示，用 Codex 调用 tldraw cli 一句话即可生成 3D 地球用于地理学习。此外，该组合还能快速搭建项目看板、Todo 及复杂交互演示，成为在线教育演示的新利器。", "type": "tip", "relTime": "3天前"}, {"id": 107, "title": "阻挡救护车、消防车，Waymo 等自动驾驶出租车面临美国新一轮联邦监管审查", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/983/108.htm", "date": "2026-07-29T07:33:00.000Z", "summary": "美国加州众议员凯文·穆林提出《自动驾驶汽车应急响应协调法案》，要求 NHTSA 制定全国最低安全标准，并建立 24 小时应急热线与\"地理围栏\"机制，允许地方政府在紧急事件中限制 Robotaxi 运行。此前多起 Waymo 自动驾驶汽车阻挡救护车、消防车及驶入犯罪现场的事件引发关注。Waymo 回应称支持建立联邦监管框架与统一协作标准。", "type": "industry", "relTime": "3天前"}, {"id": 108, "title": "Momenta 获德国全境 L4 级自动驾驶测试许可，系中国企业首次", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/983/103.htm", "date": "2026-07-29T07:25:56.000Z", "summary": "Momenta 正式获得德国 KBA 颁发许可，可在德国全国城市道路进行 L4 级自动驾驶测试，无需逐城申报。这是中国企业首次在德国获得覆盖全国城市道路的 L4 测试资质，其安全验证标准与欧盟框架直接对接。Momenta Robotaxi 已与 Uber、Grab 等出行平台及梅赛德斯-奔驰、宝马等德国车企建立战略合作。", "type": "industry", "relTime": "3天前"}, {"id": 109, "title": "特斯拉关闭 Model Y Robotaxi 转向灯提示音，优化无人驾驶乘客体验", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/983/057.htm", "date": "2026-07-29T06:43:20.000Z", "summary": "特斯拉通过软件更新关闭了 Model Y Robotaxi 的转向灯提示音，取消车内\"咔哒\"声以降低背景噪音、营造更安静的乘坐环境。目前其 Robotaxi 无人监督行程已覆盖奥斯汀、达拉斯、休斯敦、迈阿密、奥兰多、坦帕等 7 个市场，车队累计无人监督行驶里程超过 38 万英里（约 61.2 万公里）。", "type": "industry", "relTime": "3天前"}, {"id": 110, "title": "Flux 3 生成复杂提示视频效果惊人", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2082339882031026392", "date": "2026-07-29T05:38:10.000Z", "summary": "Flux 3 根据一段包含宇航员、摄政舞会、罗斯科壁画、骑士与忍者打斗等复杂元素的详细提示词，生成了令人印象深刻的视频。该模型能够连贯地呈现多场景切换与细节，展示了其在复杂视频生成任务上的能力。", "type": "tip", "relTime": "3天前"}, {"id": 111, "title": "Flux 3 视频模型生成水獭用笔记本，效果惊人", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2082319924987351510", "date": "2026-07-29T04:18:52.000Z", "summary": "Ethan Mollick 用新发布的 Flux 3 视频模型测试\"水獭在飞机上用笔记本电脑\"的生成效果，结果非常出色。对比 2022 年图像生成器输出的无意义内容，Flux 3 首次尝试即生成细节丰富、光照自然的视频，展现两年间 AI 视频生成的巨大进步。", "type": "tip", "relTime": "3天前"}, {"id": 112, "title": "See2Think：多模态模型真的会使用中间视觉状态吗？", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.26769", "date": "2026-07-29T00:00:00.000Z", "summary": "See2Think 提出统一评测框架，含 See2ThinkBench 基准与 Visual Action-of-Thought（VAoT）协议。基准覆盖 1，200 道跨 12 类任务的视觉依赖问题，评测发现视觉推理高度依赖模型与环境，渲染保真度是主要瓶颈。在任务相关的损坏反馈干预下，模型准确率下降超过 10 个百分点，表明其对视觉状态存在行为依赖。", "type": "paper", "relTime": "3天前"}, {"id": 113, "title": "VideoCoCo：用代码作为思维链实现物理一致的视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.27380", "date": "2026-07-29T00:00:00.000Z", "summary": "VideoCoCo 提出一种智能体双引擎框架，用可执行的 Blender 代码作为过程级思维链，由编码智能体生成显式描述场景及其时间演化的程序，模拟引擎产出确定性时空草稿，再由生成视频引擎通过草稿条件编辑将其转化为逼真视频。", "type": "paper", "relTime": "3天前"}, {"id": 114, "title": "DistillAlign：自回归视频蒸馏中协调模式覆盖与模式寻求的新方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.26811", "date": "2026-07-29T00:00:00.000Z", "summary": "现有自回归视频蒸馏方法通常将初始化与DMD阶段解耦，导致目标分布不匹配。DistillAlign提出联合蒸馏框架，在DMD模式寻求目标基础上引入一致性蒸馏（Consistency Distillation）的模式覆盖约束。实验表明，即使使用Wan-1.3B DMD教师，该方法在生成质量、覆盖度和多样性上仍优于使用Wan-14B教师精调的基线，凸显了分布对齐的重要性。", "type": "paper", "relTime": "3天前"}, {"id": 115, "title": "StatePlay：面向机制一致游戏生成的状态感知世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.26754", "date": "2026-07-29T00:00:00.000Z", "summary": "腾讯研究团队提出 StatePlay，一种状态感知游戏世界模型，能联合预测游戏帧与内部状态（血量、技能槽、计时器），确保生成内容符合游戏规则。StatePlay 采用混合 Transformer（MoT）架构，分别优化视觉与状态分支并实现跨模态交互。实验显示，其状态预测平均归一化 L1 距离低于 0.06，生成游戏回放的机制保真度相比无显式状态建模的模型提升 18.6%。", "type": "paper", "relTime": "3天前"}, {"id": 116, "title": "HumanCLAW 框架发布：评估视觉语言模型能否通过身体执行动作", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.27180", "date": "2026-07-29T00:00:00.000Z", "summary": "Meta、南洋理工大学等机构联合提出 HumanCLAW 评估框架，将动作决策与底层运动控制解耦，让 VLM 每步输出原子技能指令并由物理引擎执行。基于该框架构建的 HumanCLAW-Bench 包含长程第一人称导航交互任务，测试 9 个 SOTA VLM 后无一通过，最佳模型成功率极低。瓶颈不在目标识别，而在于 VLM 缺乏具身自我意识，无法追踪自身位置、是否到达目标或撞到障碍物。", "type": "paper", "relTime": "3天前"}, {"id": 117, "title": "机器人检测初创公司 Spur 获 Insight Partners 2 亿美元融资", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/28/bot-detection-startup-spur-nabs-200m-from-insight", "date": "2026-07-28T21:29:34.000Z", "summary": "佛罗里达州网络安全初创公司 Spur Intelligence 从 Insight Partners 获得 2 亿美元融资。该公司由两位前国防部工程师于 2017 年创立，技术帮助企业区分真实用户与日益隐蔽的机器人流量。据 Cloudflare 上月报告，截至 2026 年中，机器人流量已首次超过人类流量。", "type": "industry", "relTime": "4天前"}, {"id": 118, "title": "MazeBench 3D 迷宫基准发布，AI 最高仅 12% 得分", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2082197788285174050", "date": "2026-07-28T20:13:32.000Z", "summary": "Patience Cave 推出 MazeBench，一个基于 3D 开放世界迷宫的评测基准，用于评估 AI 的长期规划与视觉空间推理能力。当前最高分仅 12%，由 GPT 5.6 Sol、Fable 5、Opus 5 和 Kimi K3 等模型取得。该基准包含数百个房间和谜题，目前最强 AI 智能体也无法突破初始关卡。", "type": "paper", "relTime": "4天前"}, {"id": 119, "title": "FLUX 3 生成1957年预言视频", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2082191083946364949", "date": "2026-07-28T19:46:54.000Z", "summary": "FLUX 3：  > 一段最近发现的1957年彩色采访，一位男子准确预测了直到2025年的每一项重大技术事件，没有文字或镜头切换，只有一位拥有深远预见的男子严肃的采访，采访者不说话，只是轻蔑地看着他，仿佛他疯了。", "type": "tip", "relTime": "4天前"}, {"id": 120, "title": "微软发布4B流式视觉模型Mage-VL", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2082149193498705990", "date": "2026-07-28T17:00:26.000Z", "summary": "微软在Hugging Face发布Mage-VL 4B，一款Codec-Native流式视觉语言模型，能实时描述视频中正在发生的事件。用户可用自然语言指定关心的时刻（如\"火车到站时\"），4B参数即可持续处理流式输入，效率较高。", "type": "model", "relTime": "4天前"}, {"id": 121, "title": "上传PDF给AI多花4倍token？开源项目MinerU可省80%", "source": "X：宝玉 (@dotey)", "sourceUrl": "https://x.com/dotey/status/2082148581377720467", "date": "2026-07-28T16:58:00.000Z", "summary": "直接上传PDF给AI会因视觉处理多花4倍token，但能保留排版和表格信息以提升回答质量。主推文认为，Agent消耗token的大头是skills和工具调用，且Prompt Caching让输入token对成本影响变小，因此不必刻意省token。开源项目MinerU（7.5w star）可将PDF等文档转为Markdown，保留关键图像和排版，省下80% token，且支持网页免费使用。", "type": "tip", "relTime": "4天前"}, {"id": 122, "title": "World Labs用空间智能训练机器人", "source": "X：Fei-Fei Li (@drfeifei, World Labs)", "sourceUrl": "https://x.com/drfeifei/status/2082137335052075298", "date": "2026-07-28T16:13:19.000Z", "summary": "当 SceniX 加入 World Labs 时，我们说过空间智能从来不只是感知和生成虚拟与物理世界，还包括与之交互。今天，我们分享这一愿景的早期成果：构建世界来训练机器人。🌎🤖↓", "type": "paper", "relTime": "4天前"}, {"id": 123, "title": "Grok 推出新构建模式，支持应用与游戏开发", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2082136292813336880", "date": "2026-07-28T16:09:11.000Z", "summary": "SPACEXAI 🔥：Grok 网页版和移动端已引入新的 Grok 构建模式。  用户可在 Grok 构建智能体的支持下开发应用、仪表盘和游戏。还支持自定义域名、浏览器使用和图像生成！  目前仅限 SuperGrok Heavy 用户 👀", "type": "paper", "relTime": "4天前"}, {"id": 124, "title": "Amazon 收缩自研 Nova 模型线，押注 Pieter Abbeel 领导的 Frontier 新团队", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/amazon-reportedly-scales-back-its-nova-ai-models-and-bets-on-a-new-frontier-research-team", "date": "2026-07-28T16:03:39.000Z", "summary": "Amazon 正大幅调整 AI 战略，据 Business Insider 援引内部消息，其多数自研 Nova 模型（包括旗舰 Nova Premier、Omni、Reel 视频模型及 Canvas 图像生成器）已停止主动开发，仅维持\"保持运行\"模式服务现有客户。", "type": "industry", "relTime": "4天前"}, {"id": 125, "title": "PixVerse 详解深度视频生成优势", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2082127910656520199", "date": "2026-07-28T15:35:52.000Z", "summary": "我们一直在问为什么要在视频生成中使用深度视频。以下是原因：  关注+转发+回复 = 私信获得 150 积分（仅限 72 小时）", "type": "industry", "relTime": "4天前"}, {"id": 126, "title": "Unity中国CEO张俊波：AI不会颠覆游戏引擎，\"一句话生成游戏\"不现实", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/982/768.htm", "date": "2026-07-28T14:10:33.000Z", "summary": "Unity中国CEO张俊波表示，AI不会颠覆游戏引擎，反而能降低开发门槛。他认为世界模型和AI 3D生成模型更像是资产，游戏需要玩法、数值等系统工程，不相信\"一句话生成游戏\"能实现。团结引擎2.0已重构底层架构，并新增对PlayStation 5、XBOX Series X|S等主机平台的支持。", "type": "tip", "relTime": "4天前"}, {"id": 127, "title": "智元 WITA-Omni Preview 具身大模型登顶 DailyOmni 全模态理解榜单，综合得分 85.21", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/982/739.htm", "date": "2026-07-28T11:08:34.000Z", "summary": "智元自研的具身原生全模态大模型 WITA-Omni Preview 以 85.21 分综合成绩登顶 DailyOmni 榜单，在八项细分指标中的六项取得第一，超过千问、Gemini、豆包、英伟达等模型。该模型采用 Thinker-Talker-Actor 架构，将物理动作和表情提升为与语音并列的一级输出，并通过千万小时级多模态数据训练实现音视频联合理解与时序推理。", "type": "model", "relTime": "4天前"}, {"id": 128, "title": "小红书 dots 团队提出 Vision-OPD，让 9B 模型细粒度视觉理解超越 GPT-5.4", "source": "公众号：小红书技术（dots.llm）", "sourceUrl": "https://mp.weixin.qq.com/s/KKf9Ipy0VTPzGGrSt7foFA", "date": "2026-07-28T11:00:00.000Z", "summary": "小红书 dots 团队提出 Vision-OPD，一个无需外部教师或推理工具的区域到全局在线自蒸馏框架。仅用约 6.2K 条合成数据，便让基于 Qwen3.5 的 9B 模型在六个细粒度基准上平均准确率达 79.7%，超越 Gemini-3.5-Flash、GPT-5.4 等闭源模型及 Qwen3.5-397B，且不损失通用能力。", "type": "paper", "relTime": "4天前"}, {"id": 129, "title": "Hugging Face 托管模型被用于生成女性裸体深度伪造", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/971723/hugging-face-nudify-deepfake-undress-women-children", "date": "2026-07-28T09:07:14.000Z", "summary": "欧洲非营利组织 AI Forensics 报告称，Hugging Face 托管的 9 款主流图像编辑模型中有 7 款可仅凭简单提示词生成女性裸体深度伪造。该组织设立的蜜罐空间在 7 天内收到超 1000 条提示词与图片，其中 73% 涉及性内容，近 7% 针对儿童。AI Forensics 指出 Hugging Face 未在平台层面实施任何防护措施。", "type": "industry", "relTime": "4天前"}, {"id": 130, "title": "英国议员起诉 xAI，要求法院下令永久禁止 Grok 生成未经授权不雅图像", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/982/602.htm", "date": "2026-07-28T07:52:05.000Z", "summary": "英国工党议员杰丝·阿萨托因 Grok 生成其虚假色情化图像，向伦敦高等法院起诉 xAI，指控其滥用私人信息并违反数据保护法。她要求法院下令 xAI 采取永久性技术措施，确保 Grok 无法制作经过篡改的她的图像。律师指出，Grok 内部提示词对成人色情或冒犯性内容无限制，此案可能影响所有 AI 开发商。", "type": "industry", "relTime": "4天前"}, {"id": 131, "title": "并行解码蒸馏（PDD）：加速图像与视频生成的新方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.26004", "date": "2026-07-28T00:00:00.000Z", "summary": "研究者提出并行解码蒸馏（PDD），一种简化且可扩展的轨迹蒸馏方法，通过单次网络评估预测多个去噪步骤，加速扩散与流匹配模型推理。该方法在4-8次函数评估下，于LTX-2.3文生视频/音频、Wan 14B文生视频及Qwen-Image文生图上达到SOTA性能，并显著提升了生成视频的多样性。PDD兼容任意预训练模型，无需使用变分分数蒸馏或对抗损失。", "type": "paper", "relTime": "4天前"}, {"id": 132, "title": "ReDesign：通过智能体分解从图像中恢复可编辑设计结构", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.25565", "date": "2026-07-28T00:00:00.000Z", "summary": "ReDesign 提出一种智能体框架，将光栅图像重建为可编辑的图层层级结构，通过视觉语言模型（VLM）智能体选择并组合多模态工具逐步扩展节点，并在每次扩展中引入优雅验证机制（接受、剪枝或重试）以防止错误累积。", "type": "paper", "relTime": "4天前"}, {"id": 133, "title": "Wonder：实时、可控制摄像头的视频世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.26037", "date": "2026-07-28T00:00:00.000Z", "summary": "Wonder 是一个通用视频世界模型，支持用户通过移动摄像头实时、交互式地探索由图像或条件视频构建的可玩世界。该模型通过系统级协同设计控制方法、记忆机制和训练策略，引入密集坐标场的摄像头条件化方法，以及基于稀疏注意力的高效记忆机制，实现了对未观测区域的发现和已观测区域的回访。Wonder 能以 16 FPS 合成多样化的分钟级视频，并在长序列生成中保持连贯的几何、外观与动态。", "type": "paper", "relTime": "4天前"}, {"id": 134, "title": "OmniScope：面向全模态大语言模型的模态解耦 token 压缩方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.23193", "date": "2026-07-28T00:00:00.000Z", "summary": "OmniScope 提出一种模态解耦的 token 压缩方法，用于提升全模态大语言模型的推理效率。该方法针对不同模态分别进行 token 压缩，在保持多模态理解能力的同时降低计算开销。论文由厦门大学与阿里巴巴集团联合完成，相关实验验证了其在视频、音频等多模态任务上的有效性。", "type": "paper", "relTime": "4天前"}, {"id": 135, "title": "TriLayer 数据集与 DBL-Diffusion 框架：显式分层建模实现视频对象插入与图层分解", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.25802", "date": "2026-07-28T00:00:00.000Z", "summary": "研究团队提出 TriLayer 大规模三元组视频数据集，包含对齐的合成、背景和前景视频，为显式分层视频表示提供监督信号。基于该数据集，他们开发了 DBL-Diffusion 双分支扩散框架，通过共享去噪和跨分支交互联合建模 RGB 合成与 RGBA 前景层。", "type": "paper", "relTime": "4天前"}, {"id": 136, "title": "Kimi K3 本地运行击败 GPT 5.6 等云端模型", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2081860853666869295", "date": "2026-07-27T21:54:41.000Z", "summary": "本地部署的 Kimi K3（8×B300）在 3D 物理碰撞模拟测试中，生成的 HTML 场景效果优于 GPT 5.6、Grok 4.5 和 GLM 5.2。测试要求模型独立创建包含几何、质量、碰撞和持续损伤的完整场景，Kimi K3 在全部三个场景中胜出，且本地运行成本为零。", "type": "tip", "relTime": "5天前"}, {"id": 137, "title": "Gemini 3.5 Flash-Lite 处理百万级图像演示", "source": "X：Google AI for Developers (@googleaidevs)", "sourceUrl": "https://x.com/googleaidevs/status/2081844338892710191", "date": "2026-07-27T20:49:03.000Z", "summary": "我们想看看 Gemini 3.5 Flash-Lite 如何处理大规模、重复性的视觉任务。该演示让模型处理超过 100 万张目录图像，以大规模工作流所需的低延迟和 token 效率，将原始特征提取为干净、结构化的数据。", "type": "tip", "relTime": "5天前"}, {"id": 138, "title": "商汤登顶全球、APAC及中国视频分析市场第一", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2081775669395198126", "date": "2026-07-27T16:16:11.000Z", "summary": "商汤在Omdia最新报告中位列全球、APAC及中国视频分析市场第一。其市场主导地位得益于Vision AI的企业级规模化与\"中国创新\"模式。商汤推出\"天兵天将\"策略，依托SenseFoundry平台，已为12个全球市场的400多家客户推动数字化转型。", "type": "industry", "relTime": "5天前"}, {"id": 139, "title": "PixVerse Mini Apps 上线深度图控制功能", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2081747644058402942", "date": "2026-07-27T14:24:50.000Z", "summary": "各位，深度图控制现已登陆 @PixVerse_ Mini Apps  工作流程非常简单：参考视频 → 深度图视频 → 参考图像 + 深度视频 → 生成更精确跟随运动与空间的视频。  转发 + 关注 + 回复 = 私信获得 150 积分（仅限 72 小时）", "type": "product", "relTime": "5天前"}, {"id": 140, "title": "可灵 MCP 教程：用 AI 打造美容诊所广告", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2081747247348261358", "date": "2026-07-27T14:23:15.000Z", "summary": "Kling MCP 教程：用 Kling MCP 制作专业美容诊所广告  学习如何使用 Kling MCP 制作美容诊所宣传视频--从概念规划、视觉创作到最终制作。  借助 AI 将你的创意转化为精美的营销内容。感谢 @onofumi_AI 制作了这个精彩的教程。", "type": "tip", "relTime": "5天前"}, {"id": 141, "title": "SpaceXAI 升级 Imagine API 2.0 统一图像视频生成", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2081715721902457054", "date": "2026-07-27T12:17:59.000Z", "summary": "SpaceXAI 计划将 Imagine API 升级至 2.0 版本，统一其图像与视频生成服务。  尝试 Imagine API 2.0 -- 使用同一 Imagine API 构建具备图像与视频能力的产品。", "type": "product", "relTime": "5天前"}, {"id": 142, "title": "Waymo 在奥斯汀因停车违规累计被罚近万美元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/982/215.htm", "date": "2026-07-27T10:54:45.000Z", "summary": "Waymo 自 2024 年进入奥斯汀以来，其自动驾驶出租车累计收到停车罚单，罚款总额达 9325 美元。截至 7 月 15 日，Waymo 已支付 83 张罚单共 7433 美元，另有 1892 美元未缴，罚款金额从 20 美元到 519 美元不等。尽管 Waymo 声称会像普通驾驶员一样缴纳罚款，但这类违规事件正随 Robotaxi 规模扩大而引发公众关注。", "type": "industry", "relTime": "5天前"}, {"id": 143, "title": "阿里云Qoder Security：AI代码安全左移，检测率+60%", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2081683544456257732", "date": "2026-07-27T10:10:07.000Z", "summary": "阿里云推出Qoder Security，将安全检测直接嵌入AI编码会话。面对AI生成超40%新代码的现状，该工具将漏洞检测率提升60%，误报率降低80%，修复时间从数周缩短至数小时。支持实时正则拦截与跨文件深度审查，已在Qoder Desktop及CLI中上线。", "type": "paper", "relTime": "5天前"}, {"id": 144, "title": "抖音升级未成年人模式适龄推荐算法，引入多模态大语言模型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/982/119.htm", "date": "2026-07-27T08:41:04.000Z", "summary": "抖音全面升级未成年人模式适龄推荐算法，核心是引入多模态大语言模型（MLLM）技术，综合处理文本、图像、音频等信息，为每条视频判断适宜观看的年龄范围。平台采用\"人工筛选 + 大模型分类 + 适龄推荐 + 内容偏好匹配\"的多重保障机制，目前未成年人专属内容池总量达770万条，日均新增约6000条优质内容。", "type": "model", "relTime": "5天前"}, {"id": 145, "title": "用Claude纯数学生成3D书籍页面，效果惊艳", "source": "X：小互 (@xiaohu)", "sourceUrl": "https://x.com/xiaohu/status/2081636797818531939", "date": "2026-07-27T07:04:22.000Z", "summary": "开发者@thebuggeddev用Fable 5和Claude，仅通过几句提示词就复刻了Trevor Noah网站\"Books\"页面的3D书籍动画效果。整个页面基于Three.js构建，未使用任何3D资产，Claude纯靠数学计算生成书籍模型，并用GSAP实现流畅动画，效果逼真，接近专业机构收费数千美元的作品。", "type": "tip", "relTime": "5天前"}, {"id": 146, "title": "世界动作模型综述：从反应到预判", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2081627897735840117", "date": "2026-07-27T06:29:00.000Z", "summary": "一篇关于世界动作模型（WAM）的综述论文指出，WAM 正推动机器人从\"对当前做出反应\"转向\"在行动前预测后果\"。只有预测的未来能直接用于生成、评分、验证或训练动作的模型才算 WAM。趋势是\"少做梦，多行动\"：完整视频生成对实时控制回路太慢且占用内存，因此许多新系统改用潜在特征、几何、可通行性图或运动表征，而非渲染视频。", "type": "paper", "relTime": "5天前"}, {"id": 147, "title": "Codex与Claude Code可即时生成创意游戏Demo", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2081603003866329496", "date": "2026-07-27T04:50:05.000Z", "summary": "我们已身处这样一个世界：借助Codex和Claude Code的现有能力，你可以按需创建真正独特、视觉有趣且富有创意的可玩Demo。我们不必再反复克隆那六款已有的游戏作为AI示例。大胆尝试更古怪的创意吧！", "type": "tip", "relTime": "5天前"}, {"id": 148, "title": "TikZ独角兽预示AI生成3D模型趋势", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2081601965360910597", "date": "2026-07-27T04:45:57.000Z", "summary": "这一切都源于TikZ独角兽。Sparks论文相当有先见之明。", "type": "tip", "relTime": "5天前"}, {"id": 149, "title": "阿里云推出Token计划，多模型统一体验", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2081583742116618475", "date": "2026-07-27T03:33:32.000Z", "summary": "阿里云发布Token计划，通过单一信用池即可使用Qwen、Wan、HappyHorse、DeepSeek和GLM等多个模型，覆盖文本、音频、图像和视频能力。该计划提供更清晰的AI用量可视化，首月仅需4美元，方便用户尝试、测试和对比不同模型。", "type": "model", "relTime": "5天前"}, {"id": 150, "title": "阿里云Token Plan：多模态AI共享额度", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2081578536121344070", "date": "2026-07-27T03:12:51.000Z", "summary": "阿里云推出Token Plan，为脚本、图像、视频等不同模态的AI工具提供统一共享额度池。该计划支持Qwen3.8-Max-Preview、HappyHorse1.1、DeepSeek V4、GLM-5.2等新模型，用户可跨模型和工具使用同一额度并查看用量。首月起步价仅4美元。", "type": "model", "relTime": "5天前"}, {"id": 151, "title": "Fable 打造 AI 生成的 Piranesi 城市游戏", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2081562248246415752", "date": "2026-07-27T02:08:08.000Z", "summary": "Fable 为我去年在 AI 视频中伪造的 Piranesi 城市建造游戏制作了实体版本。AI 想出的核心机制是在巨构废墟中建造一座拱门与水路交织的城市，并邀请人类在其中居住。 这款游戏让我印象深刻。试玩：https://capriccio-city.netlify.app/", "type": "tip", "relTime": "5天前"}, {"id": 152, "title": "荣耀 Robot Phone 定档 8 月 12 日发布，搭载第五代骁龙 8 至尊版与阿莱联合研发", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/843.htm", "date": "2026-07-27T01:43:19.000Z", "summary": "荣耀宣布全球首款机器人手机 Robot Phone 将于 8 月 12 日发布，由阿莱联合研发。该机搭载第五代骁龙 8 至尊版芯片，机身顶部集成行业最小的四自由度钛合金机械云台系统，配备微型电机，体积比主流方案缩小 70%。Robot Phone 还将首发荣耀新一代伙伴型多模态智能体操作系统 AgenticOS 的内核。", "type": "paper", "relTime": "5天前"}, {"id": 153, "title": "脑电波能否成为物理AI的下一个突破口？", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/26/are-brain-waves-the-next-unlock-for-physical-ai", "date": "2026-07-27T00:19:14.000Z", "summary": "Encord正与Zander Labs合作，通过头戴设备测量操作员脑电波来推断其心理状态，为机器人模型生成更优质的训练数据。Encord机器人学习主管指出，物理AI的核心瓶颈是真实世界训练数据的极度稀缺。目前该试验旨在构建初始脑波标记数据集，评估其对模型性能的提升效果。", "type": "tip", "relTime": "5天前"}, {"id": 154, "title": "OpenRouter 新增图像生成模型专用 API 端点", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/tutorials/image-generation-models", "date": "2026-07-27T00:00:00.000Z", "summary": "OpenRouter 通过专用 \\`/api/v1/images\\` 端点提供图像生成模型服务，图像理解仍通过 \\`/chat/completions\\` 端点完成，两者共用同一 API Key 和计费体系。该平台同时公布了两种任务的完整接口合约，并修复了此前出现的\"no endpoints found\"错误。", "type": "tip", "relTime": "5天前"}, {"id": 155, "title": "Apple 提出 GH-ESD：面向实例级视觉任务的假设驱动错误切片发现方法", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/gh-esd", "date": "2026-07-27T00:00:00.000Z", "summary": "Apple 机器学习研究团队提出 GH-ESD（Grounded Hypothesis-Driven Error Slice Discovery），一种针对目标检测与分割等实例级视觉任务的错误切片发现方法。现有方法主要适用于图像级分类，难以捕捉由上下文关系和空间视觉模式导致的实例级失败。GH-ESD 通过基于假设的驱动方式，系统性地发现模型在语义连贯子集上的系统性失效。", "type": "paper", "relTime": "5天前"}, {"id": 156, "title": "WorldDiT：统一扩散Transformer架构实现动作生成与视觉世界建模", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.23909", "date": "2026-07-27T00:00:00.000Z", "summary": "WorldDiT提出一种统一扩散Transformer架构，无需大型预训练VLM作为动作主干，即可同时生成连续动作块并预测未来相机帧的归一化RGB块。在四个LIBERO仿真套件上，WorldDiT位于报告的总参数量与平均成功率帕累托前沿，为未来扩展研究提供了低于十亿参数的强基线。", "type": "paper", "relTime": "5天前"}, {"id": 157, "title": "Sol-Attn：通过在线注意力稀疏化加速视频生成推理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24027", "date": "2026-07-27T00:00:00.000Z", "summary": "Sol-Attn 提出一种免训练的动态稀疏注意力方法，在单次在线 softmax 过程中统一了动态路由、稀疏计算和近似校正。该方法通过块阈值化和代理分数复用，无需物化代理映射即可实现动态可控的块预算，并直接复用未选中块的代理分数来近似其贡献。在图像和视频生成任务中，Sol-Attn 分别实现了视频生成和编辑 2.1 倍和 2.3 倍的端到端加速，同时保持视觉质量。", "type": "paper", "relTime": "5天前"}, {"id": 158, "title": "视觉文档理解中的证据归因：无需坐标或区域标签的语言接口优于坐标接口", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24651", "date": "2026-07-27T00:00:00.000Z", "summary": "一项研究发现，视觉语言模型在文档理解中通过坐标输出证据区域时，即使答案正确也常定位错误（归因幻觉）。在CiteVQA子集上对比六款开源模型，语言接口（模型直接引用原文，由布局解析器定位）的证据召回率从坐标接口的至多8%提升至26%-47%，幻觉率减半。基于此，研究提出无需区域标签的GRPO训练方法，将8B骨干模型的严格归因准确率从22.4提升至33.8。", "type": "paper", "relTime": "5天前"}, {"id": 159, "title": "DecoupleMix：解耦比例搜索与凸分配实现可扩展的VLM数据配方", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24516", "date": "2026-07-27T00:00:00.000Z", "summary": "字节跳动商业AI团队提出DecoupleMix框架，将视觉语言模型（VLM）的预训练数据构建系统化为可复现的工程问题，通过解耦类间比例搜索与类内凸优化分配实现可控实验。在80B额外多模态继续预训练token上，该框架产出的VLM与使用更大多模态预算训练的强开源模型竞争力相当，且小规模代理上发现的最优比例可直接迁移至更大规模。", "type": "paper", "relTime": "5天前"}, {"id": 160, "title": "FilmBench：面向电影级视频生成的专业基准测试", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24241", "date": "2026-07-27T00:00:00.000Z", "summary": "北京电影学院与华景数字传媒联合推出FilmBench，一个基于电影语言专业标准的文生视频（T2V）与参考视频（R2V）评测基准。其提示词源自20种电影类型的获奖影片片段，评估体系包含3个主轴、12个组件和35项（T2V）+3项（R2V）子指标。在9个T2V和7个R2V模型上的测试显示，模型得分远低于现有网络风格基准，且存在动态美学与多镜头场景下的显著性能差距。", "type": "paper", "relTime": "5天前"}, {"id": 161, "title": "北大等团队提出具身操作数据金字塔，系统梳理五类数据源与挑战", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24744", "date": "2026-07-27T00:00:00.000Z", "summary": "来自北大、NTU、港科大等机构的研究者提出\"具身数据金字塔\"，将具身操作数据按可扩展性与机器人对齐程度分为五类：真实机器人数据、UMI风格数据、自我中心与外部视角数据、仿真数据、通用视觉语言数据。论文分析了Motus、GR00T等具身基础模型的数据配方，并指出构建大规模触觉数据集、收集失败与恢复数据、跨本体动作对齐等六大开放挑战。", "type": "paper", "relTime": "5天前"}, {"id": 162, "title": "ClinFusion：面向整体医学理解的视觉中心多模态大语言模型系统", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24743", "date": "2026-07-27T00:00:00.000Z", "summary": "ClinFusion 提出级联空间感知局部融合算子，将 2D 与原生 3D 医学图像理解统一到融合编码器中。该系统在 24 项基准测试的 20 项上超越 Hulu-Med、Lingshu 等开源医学 MLLM，并在 16 项基准测试的 13 项上优于 GPT-5.2 和 Gemini-3-Flash 等闭源模型。", "type": "paper", "relTime": "5天前"}, {"id": 163, "title": "OPERA：离线策略引导的专家路由与自适应框架，实现通用生物医学图像分析", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.25108", "date": "2026-07-27T00:00:00.000Z", "summary": "OPERA 提出一种多智能体集成框架，将专家权重分配视为离线策略学习问题：从少量验证集学习路由策略，无需梯度更新即可部署，并通过测试时自适应处理分布偏移。在涵盖眼底摄影、胸部 X 光、CT、MRI 的 9 个数据集上，OPERA 在分类、分割和多模态任务中持续提升性能与校准质量，无需重新训练即可实现可部署的生物医学 AI。代码已开源在 GitHub。", "type": "paper", "relTime": "5天前"}, {"id": 164, "title": "GLI-AL：面向多模态胶质瘤MRI的统一解剖-病灶标签资源", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.22135", "date": "2026-07-27T00:00:00.000Z", "summary": "研究团队基于BraTS 2023-GLI训练队列构建了GLI-AL资源，提供1，251套统一的八类解剖-病灶标签集，覆盖健康脑组织、肿瘤亚区及此前未标注的白质高信号（WMH）共存异常。该资源将队列分为394例纯净子集与857例扩展子集，并附带标签来源、图像修复需求及质量控制元数据。MedNeXt验证表明，纳入WMH监督可保持健康组织分割性能并提升对共存病灶的敏感性。", "type": "paper", "relTime": "5天前"}, {"id": 165, "title": "压缩短文本生成中的质量瓶颈定位：阶段性验证研究", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24176", "date": "2026-07-27T00:00:00.000Z", "summary": "一项针对64-to-16压缩短文本生成管道的阶段性验证研究发现，编解码器重建是主导质量瓶颈。仅编解码器重建就将外部GPT-2困惑度从15.17升至27.36（+80.4%），而潜在空间生成器（MDLM）的表现优于token空间扩散模型。该研究提出了一种可复用的阶段性诊断协议，用于分离编解码器重建保真度与潜在生成质量。", "type": "paper", "relTime": "5天前"}, {"id": 166, "title": "Mage-VL：编解码原生的流式多模态基础模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24904", "date": "2026-07-27T00:00:00.000Z", "summary": "Mage-VL 借鉴视频编解码原理，利用运动向量和残差能量选择性编码动态区域，将视觉 token 数量减少约 75%。其 4B 参数版本在空间、视频和视觉理解基准上超越 Qwen3-VL-4B、Phi-4-MM （5.6B） 及 Phi-4-reasoning-vision （15B）。模型采用从零训练的 Mage-ViT 编码器，并支持事件触发的实时交互。", "type": "paper", "relTime": "5天前"}, {"id": 167, "title": "PerceptionBench：多模态大语言模型原子视觉感知评测基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24957", "date": "2026-07-27T00:00:00.000Z", "summary": "研究者推出 PerceptionBench，专门评估多模态大语言模型的原子视觉感知能力，包含 3，000 道验证问题，覆盖十项原子感知能力。对 16 个前沿模型的评测显示，没有模型准确率超过 60%，GPT-5.6-Sol（59.7%）和 Kimi K3（58.5%）暂时领先。该基准通过自底向上的错误归因方法构建，旨在隔离感知错误，提供细粒度能力诊断。", "type": "paper", "relTime": "5天前"}, {"id": 168, "title": "Suno 推出多项新功能，含MIDI导出等", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2081443050312843765", "date": "2026-07-26T18:14:29.000Z", "summary": "我们一直在以比以往更快的速度构建！🚀  以下是网页端和移动端的新功能一览：  • 高级音轨分离 • 将音轨导出为 MIDI • 歌词合写与自动保存 • 截图生成歌曲 • Apple CarPlay 与 Android Auto  你最期待 Suno 的哪些新功能？", "type": "product", "relTime": "6天前"}, {"id": 169, "title": "Black Forest Labs 发布 FLUX 3：统一图像、视频、音频与机器人动作预测的多模态基础模型", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/07/26/black-forest-labs-releases-flux-3-a-multimodal-flow-model-for-image-video-audio-and-robot-action-prediction", "date": "2026-07-26T17:50:23.000Z", "summary": "Black Forest Labs 发布 FLUX 3，这是首个在单一架构中联合学习图像、视频和音频，并从同一组权重输出视频、音频和动作预测的多模态基础模型。FLUX 3 Video 可单次生成长达 20 秒、带原生音频的视频，在 10 秒 720p 文本生成视频的人类偏好测试中，以 93% 的偏好率击败 Luma Ray 3.2。", "type": "model", "relTime": "6天前"}, {"id": 170, "title": "AI Agent 快速试错：衣播等你产品复刻", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2081379865249591672", "date": "2026-07-26T14:03:24.000Z", "summary": "Berry Xia 引用 LufzzLiz 的推文，指出其团队正用 AI Agent 快速产出产品原型，然后快速试错、丢弃，形容为\"十分快餐\"的开发模式。LufzzLiz 计划复刻一个直播录屏视频做成产品，并强调视频非 AI 生成，产品仍在打磨中。", "type": "tip", "relTime": "6天前"}, {"id": 171, "title": "开发者推出防AI训练图片干扰工具，意外催生\"抖动视觉风格\"梗图创作潮流", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/786.htm", "date": "2026-07-26T11:45:41.000Z", "summary": "开发者TI111310推出\"grid-noise-animator\"工具，通过在图片中加入大量噪点干扰AI识别能力，防止图片被用于训练AI模型。该工具可将照片转换为带噪点的视频或动态图片，并支持调整噪点尺寸、采样抖动等参数。其产生的抖动视觉风格意外被网友用作创作工具，制作趣味梗图或\"灵异录像带\"风格影像，形成潮流。", "type": "model", "relTime": "6天前"}, {"id": 172, "title": "华为鸿蒙小艺 Claw 上线新人福利：新用户首次订阅连续包月享 7 天免费体验", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/756.htm", "date": "2026-07-26T08:22:38.000Z", "summary": "华为为鸿蒙 HarmonyOS 小艺 Claw 推出新用户福利，即日起持有 HarmonyOS 6 及以上版本设备并将小艺 App 升级至 11.6.6.300 版本的用户，首次订阅连续包月可享 7 天免费体验并获 500 AI 点数。此次更新还优化了 PPT 生成、编码能力、图像创作及上下文压缩时延，并新增 HarmonyOS 专属 Skills 及伙伴精选技能。", "type": "product", "relTime": "6天前"}, {"id": 173, "title": "欧盟 AI 透明度准则 8 月 2 日生效：聊天机器人须\"自报身份\"，深度伪造内容需带机读标签", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/755.htm", "date": "2026-07-26T08:16:42.000Z", "summary": "欧盟《人工智能法案》第 50 条 AI 透明度准则将于 8 月 2 日生效，要求聊天机器人明确告知用户其为 AI 系统，深度伪造内容发布时须附带机器可读标记。违规企业最高可被处罚 1500 万欧元或全面营业额的 3%。8 月 2 日前已面世的生成式 AI 系统有 4 个月过渡期。", "type": "industry", "relTime": "6天前"}, {"id": 174, "title": "微电影《返航日》7月27日上映，采用荣耀Robot Phone完成一镜到底视觉叙事", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/701.htm", "date": "2026-07-26T07:04:08.000Z", "summary": "荣耀手机官宣微电影《返航日》将于7月27日上映，由摄影指导王博学执导，全程使用荣耀Robot Phone完成一镜到底拍摄。该机搭载第五代骁龙8至尊版芯片，机身顶部集成行业最小四自由度钛合金机械云台系统，电机体积比主流方案缩小70%。荣耀Robot Phone已开启预约，定档\"8月见\"，并将首发伙伴型多模态智能体操作系统AgenticOS内核。", "type": "industry", "relTime": "6天前"}, {"id": 175, "title": "Claude Opus 5 系统提示词被完整泄露，共 135027 字符、约 3.4 万 token", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/688.htm", "date": "2026-07-26T05:33:44.000Z", "summary": "开发者 Eversmile1 在 GitHub 上公开了 Claude Opus 5 的完整系统提示词，包含 30 个工具的 JSON schema、严格的版权合规规则（单次引用不超过 15 词）和跨会话记忆系统。泄露后 24 小时内，已有开发者用 Opus 5 成功生成 3D 射击游戏和《火箭联盟》克隆版等复杂 Demo。", "type": "tip", "relTime": "6天前"}, {"id": 176, "title": "Claude Opus 5 单次生成滑雪视频无视觉缺陷", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2081236021791109266", "date": "2026-07-26T04:31:49.000Z", "summary": "一切能写成规范的东西都在归零。 Claude Opus 5 做到了这一点，\"首次通过无视觉缺陷。\"", "type": "tip", "relTime": "6天前"}, {"id": 177, "title": "因准确性问题，欧美多所高校停用AI检测工具", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/635.htm", "date": "2026-07-26T01:57:34.000Z", "summary": "美国阿德尔菲大学学生因Turnitin AI检测工具误判其论文\"AI生成概率为100%\"而胜诉，引发对AI检测工具可靠性的广泛质疑。范德堡大学、耶鲁大学、滑铁卢大学等多所高校已限制或停用GPTZero、Copyleaks、Turnitin等工具。调查显示32%的英国学生承认违规使用AI，但42%的学生因担心误判反而减少了AI工具使用。", "type": "industry", "relTime": "6天前"}, {"id": 178, "title": "特斯拉在智利、哥伦比亚招聘 AI 安全运营专员，为 Robotaxi 出海铺路", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/621.htm", "date": "2026-07-26T00:10:17.000Z", "summary": "特斯拉正在哥伦比亚和智利招聘 AI 安全运营专员，岗位职责包括监督自动驾驶网约车网络日常运营及动态数据采集。招

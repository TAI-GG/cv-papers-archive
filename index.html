"source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2094793785523962255", "date": "2026-09-01T14:25:32.000Z", "summary": "马斯克预测十年内全球将至少有十亿台人形机器人，每台产出至少是人类的五倍，总产出将超过全人类总和。该说法来自其受访言论，由 @cb_doge 转发并附视频。", "type": "tip", "relTime": "9小时前"}, {"id": 21, "title": "Rohan Paul 点评双足机器人动态站立：脚踝或以微小力矩修正应对滚珠地面", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2094792255748050999", "date": "2026-09-01T14:19:27.000Z", "summary": "Rohan Paul 视频点评一个双足机器人站在铺满滚珠的地面上仍能保持站立，认为其脚踝可能在每次滚珠滚动时发出微小力矩修正，避免把重量压到已开始滚动的脚上。", "type": "tip", "relTime": "9小时前"}, {"id": 22, "title": "开发者基于 VoxCPM2 推出开源 AI 视频翻译配音工具 ZastTranslate", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2094772538761183535", "date": "2026-09-01T13:01:06.000Z", "summary": "面壁智能 OpenBMB 介绍开发者 @zast57 基于 VoxCPM2 构建的开源 AI 视频翻译配音工具 ZastTranslate，将本地 AI 转录、翻译和自然语音生成引入多语言内容创作流程。工具支持多语言视频翻译、语音克隆配音，代码、网站和 VoxCPM2 模型分别发布在 GitHub、zast57.com 和 Hugging Face。", "type": "model", "relTime": "11小时前"}, {"id": 23, "title": "英伟达 GPU 帧插值功能并入 FFmpeg，RTX 30/40/50 系可将 30FPS 视频提升至 60FPS", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/997/015.htm", "date": "2026-09-01T08:07:04.000Z", "summary": "FFmpeg 宣布英伟达 GPU 帧插值功能通过 Vulkan API 正式并入项目，可借助 GeForce RTX GPU 预测生成下一帧来提高视频帧率。", "type": "product", "relTime": "16小时前"}, {"id": 24, "title": "我国专家牵头制定的全球首个腿式机器人国际标准正式发布", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/961.htm", "date": "2026-09-01T07:11:39.000Z", "summary": "由我国专家牵头制定的全球首个腿式机器人国际标准《机器人--服务机器人性能规范及其试验方法第5部分：腿式机器人运动》近日正式发布。标准将楼梯、坡面、障碍等真实作业场景纳入评价体系，并把感知、交互、决策等能力综合纳入评价，从单一运动性能扩展到综合任务能力，可帮助企业开展研发改进、支持检测机构统一测试并帮助用户客观了解产品性能。", "type": "industry", "relTime": "17小时前"}, {"id": 25, "title": "特斯拉 Robotaxi 无人监督车队 3 周增长约 7 倍至近 200 辆，Cybercab 发布在即", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/943.htm", "date": "2026-09-01T06:48:59.000Z", "summary": "据 Teslarati 援引 Robotaxi Tracker 数据，特斯拉在 Cybercab 发布前夕将奥斯汀、达拉斯和休斯敦的无人监督车辆扩至接近 200 辆，3 周内增长约 7 倍。特斯拉自动驾驶团队负责人 Ashok Elluswamy 曾透露项目累计完成超 38 万英里无人监督行驶；同时 Cybercab 在得州的监管注册数几天内从 7 辆增至 45 辆。", "type": "industry", "relTime": "17小时前"}, {"id": 26, "title": "面壁智能转发创作者用 VoxCPM 制作日语内容实现不露脸频道涨粉", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2094655359810175041", "date": "2026-09-01T05:15:29.000Z", "summary": "面壁智能（OpenBMB）转发一位日本创作者对 VoxCPM 语音生成 AI 的评价，该创作者称 VoxCPM 性能出色，借助它在不露脸不出声的情况下 YouTube 订阅数突破 1，800 人（截图显示 1，817 人），并认为视频结合联盟营销的赛道竞争者少、机会大。面壁智能表示很高兴看到 VoxCPM 被用于日语内容创作，鼓励创作者继续尝试 AI 语音技术。", "type": "tip", "relTime": "18小时前"}, {"id": 27, "title": "阿里云将在 Qwen Conference 泰国站演示 Qwen-Image 3.0、Wan 3.0 与 WonderClip 视觉 AI 流水线", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2094617811763024073", "date": "2026-09-01T02:46:17.000Z", "summary": "阿里云宣布将在 9 月 4 日曼谷活动现场演示从单个提示词到成片的完整视觉 AI 流水线。Qwen-Image 3.0 支持 12 种语言的文字、人物和版式图像生成；Wan 3.0 全新发布，可将帧动画化为 30 秒带声音且不漂移的视频；WonderClip 由智能体跑通从脚本到最终剪辑的全流程。", "type": "paper", "relTime": "21小时前"}, {"id": 28, "title": "宇树展示四足机器人消防应急解决方案，含背负水炮与耐高温机器狗", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/772.htm", "date": "2026-09-01T02:06:16.000Z", "summary": "宇树科技于 8 月 31 日晚间晒出视频，展示其四足机器人消防应急解决方案。产品包括 A2-W 背负机器狗、B2 智能水炮机器狗、A2-W 与 B2 侦测机器狗、As2 云台侦查机器狗、B2 卫星侦查机器狗、A2-W 建模机器狗，以及不怕火烧的 B2 耐高温机器狗；消防员可通过机器狗与被困人员进行双向语音对讲。", "type": "product", "relTime": "22小时前"}, {"id": 29, "title": "IT早报 0901：DeepSeek-V4-Flash-Vision-Exp 开源，华为小米荣耀手机集体调价，库克卸任苹果 CEO", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/709.htm", "date": "2026-08-31T23:44:23.000Z", "summary": "IT之家 9 月 1 日早报汇总多条科技动态。DeepSeek-V4-Flash-Vision-Exp 模型已上线 Hugging Face 并开源，支持图片输入、识别文字和分析图表，多模态 Agent 能力接近 Opus-4.8。", "type": "industry", "relTime": "1天前"}, {"id": 30, "title": "Thomas Wolf 展示 399 美元机器人 Microduck 的机载仪表盘", "source": "X：Thomas Wolf（Hugging Face 联创/CSO） (@Thom_Wolf)", "sourceUrl": "https://x.com/Thom_Wolf/status/2094536121065820376", "date": "2026-08-31T21:21:40.000Z", "summary": "Thomas Wolf 展示售价仅 $399 的机器人 Microduck，其机载算力足以直接运行 TUI 界面。视频是一个 vibe-coded 的设备端仪表盘，实时显示机器人内部的 policy、actions 和传感器数据，其中黄色星点为 LiDAR 距离测量结果。", "type": "paper", "relTime": "1天前"}, {"id": 31, "title": "Runway 发布 Solaris：首个界面世界模型，实时生成操作系统级交互界面", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/research/introducing-solaris", "date": "2026-08-31T17:03:47.031Z", "summary": "Runway 推出 Solaris，这是其全新界面世界模型（Interface World Models）系列的首个模型。Solaris 能实时逐帧生成应用和网站界面，无需中间代码表示，直接以图像作为交互层，支持视觉化、动态响应和开放式交互。它还可用于训练智能体，使其适应不断变化的界面布局，而非局限于特定训练环境。", "type": "model", "relTime": "1天前"}, {"id": 32, "title": "WorkBuddy 搭建私人 Skill 内容生产线", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2094450036629246132", "date": "2026-08-31T15:39:36.000Z", "summary": "推文提出 Skill 是 AI 时代最值钱的私人数字资产，并手把手演示用 WorkBuddy 与 Karpathy LLM Wiki 搭建私人内容生产线。作者将半年代表作、创作笔记与定位说明结构化洗成 19 个知识页，封装出含个人思考方式与审美红线的专属 Skill，实现数字分身，终结每次开新对话框需重新教 AI 的痛点。四层架构与实操视频及完整提示词已开源。", "type": "tip", "relTime": "1天前"}, {"id": 33, "title": "英伟达复活 Rubin CPX，2027 年一季度量产", "source": "X：郭明錤 Ming-Chi Kuo (@mingchikuo)", "sourceUrl": "https://x.com/mingchikuo/status/2094426162193993964", "date": "2026-08-31T14:04:44.000Z", "summary": "英伟达已重启此前被传砍掉的 Rubin CPX 项目，预计 1Q27 量产。新版 CPX 预填充性能更强，GPU 改用 168GB HBM4（Rubin 为 288GB），采用独立 MGX ETL 机架，需与 Vera Rubin NVL72 以 1：1 配对，通过以太网 RDMA 传输 KV 缓存，主打长上下文预填充的每美元最佳性能。", "type": "tip", "relTime": "1天前"}, {"id": 34, "title": "DeepSeek-V4-Flash-Vision-Exp 模型已开源，多模态 Agent 能力接近 Opus-4.8", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/637.htm", "date": "2026-08-31T11:35:24.000Z", "summary": "DeepSeek 于 8 月 31 日在 Hugging Face 开源首个多模态模型 DeepSeek-V4-Flash-Vision-Exp，采用 MIT License，公开模型文件、Tokenizer、Prompt Encoding 参考实现及最小化 PyTorch 推理实现。", "type": "model", "relTime": "1天前"}, {"id": 35, "title": "DIT.ai 开放 API，聚合 50+ 模型路由", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2094387966235873695", "date": "2026-08-31T11:32:57.000Z", "summary": "http://DIT.ai 已开放其 API 层的公共访问权限，允许用户在一个竞争性提供商市场中路由模型调用。  > 提供商按价格-质量评级排名。 > 它通过一个兼容 OpenAI 的密钥覆盖 50 多个文本、图像和视频模型。 > 设置仅需一个基础 URL 和密钥。 > 它包含提供商之间的自动故障转移开关。", "type": "model", "relTime": "1天前"}, {"id": 36, "title": "2496万次调用背后，他们用可灵做出了这些", "source": "公众号：可灵AI（快手·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzU5NTkwNDU2OA%3D%3D&mid=2247496770&idx=1&sn=1eb20eb64f2f4cb0e24c77b6d8917fff", "date": "2026-08-31T11:28:10.000Z", "summary": "可灵以API形式接入百度秒哒无代码平台，累计调用超2496万次。开发者将可灵视频与图片生成能力直接嵌入应用，或批量生成视觉素材搭建世界观，如Movo调用可灵3.0Omni与3.0Turbo生成动态影像，互动文学游戏《奥德赛-归乡之歌》的角色与场景均由可灵生成。近期上线的Agent Market提供一键换装、商品成片等开箱即用Agent，同样开放API。", "type": "product", "relTime": "1天前"}, {"id": 37, "title": "工业巨头卡特彼勒将 AI 推向真实作业现场，未来五年投入 1 亿美元培训员工", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/633.htm", "date": "2026-08-31T11:16:59.000Z", "summary": "卡特彼勒正将采矿领域积累的自动化经验拓展至建筑工地等动态环境，推出 Cat AI Assistant 供技术人员通过语音调取维修流程和排查故障。该公司依托全球约 160 万台联网设备及超 16 PB 结构化数据，并利用 AI 智能体升级代码和生成数字孪生模型。未来五年，卡特彼勒计划投入 1 亿美元对 11.8 万名员工开展 AI、自动化和机器人技术培训。", "type": "tip", "relTime": "1天前"}, {"id": 38, "title": "如何构建扩散式语言模型", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://kuleshov-group.github.io/blog/blog/2026/how-to-build-a-diffusion-language-model", "date": "2026-08-31T10:43:39.380Z", "summary": "扩散式语言模型从整段草稿出发并行迭代精炼，支持纠错、双向注意力与速度-质量权衡。2024年扩散模型在质量上追平自回归模型，2026年Mercury 2、Gemma Diffusion和Nemotron Diffusion相继发布。文章从高斯扩散讲起，涵盖掩码扩散、迭代精炼、后训练与变长生成等构建模块。", "type": "tip", "relTime": "1天前"}, {"id": 39, "title": "MiniMax H3 Max：AI 视频生成快于播放，24 小时 AI 直播上线", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/vitalbridge/minimax-h3-maxai", "date": "2026-08-31T10:00:00.000Z", "summary": "绿洲资本文章介绍 MiniMax H3 Max，称其 AI 视频生成快于播放，开启实时交互时代，并上线 24 小时 AI 直播。", "type": "paper", "relTime": "1天前"}, {"id": 40, "title": "连续扩散语言模型（CDLM）为何正在复兴", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://sander.ai/2026/08/24/continuous-dlms.html", "date": "2026-08-31T08:51:38.607Z", "summary": "连续扩散语言模型在沉寂数年后迎来研究复苏，挑战自回归模型在语言生成中的主导地位。2022年Diffusion-LM等早期工作曾探索用连续嵌入向量配合高斯噪声处理离散数据，但2023年后相关研究几乎消失，被全离散扩散方法取代。作者回顾这一兴衰历程，并分析当前复兴的原因。", "type": "tip", "relTime": "1天前"}, {"id": 41, "title": "小米机器人 CyberOne 将首次海外亮相 IFA 国际消费电子展", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/553.htm", "date": "2026-08-31T08:32:08.000Z", "summary": "小米集团总裁卢伟冰透露，9月4日至8日小米将首次参加IFA国际消费电子展，拥有超3300平米展台、近400款展品，实现\"人车家全生态\"海外最大规模参展。小米SU7 Max、SU7 Ultra与小米Vision GT三款车齐聚，机器人CyberOne（铁大）也将首次海外亮相。CyberOne是小米2022年发布的首款全尺寸人形仿生机器人，身高177厘米、体重52千克。", "type": "industry", "relTime": "1天前"}, {"id": 42, "title": "马斯克提出新计划：靠 AI 卫星让地球在未来约 10 亿年内保持宜居", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/490.htm", "date": "2026-08-31T07:13:13.000Z", "summary": "马斯克在 X 平台提出一项让地球在未来约 10 亿年内保持宜居的计划，核心是部署由太阳能供电、AI 控制的\"有感知能力的卫星\"，通过巨型电磁弹射器从月球表面发射，卫星将自主微调轨道。他援引 Grok 生成的估算称，高海平面上升情景下，到 2070 年佛罗里达州约 5% 土地（约 168 万英亩）可能面临经常性洪水，并称人类约只有 50 年时间采取行动。", "type": "tip", "relTime": "1天前"}, {"id": 43, "title": "阿里千问创作上线 Agent Teams 功能：用户提出创意，Agent 规划任务完成视频制作", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/484.htm", "date": "2026-08-31T06:59:55.000Z", "summary": "阿里千问今日宣布千问创作上线 Agent Teams 功能，支持 Wan3.0，将创作方式从写提示词扩展为用户提出创意、Agent 主动思考拆解并执行任务。该功能已在千问创作 PC 端和千问 App 上线，由编剧、导演、美术、视频生成等不同角色的 Agent 分工协作，完成从创意策划到成片制作的全流程，支持创作 AI 短剧、漫剧、营销广告等。", "type": "product", "relTime": "1天前"}, {"id": 44, "title": "千问创作上线Agent Teams，支持Wan3.0实现专业视频创作", "source": "公众号：千问APP（阿里）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzYzNDE5MDEwMQ%3D%3D&mid=2247488568&idx=1&sn=8281c4355ee0af5e02d38ccbf42ba084", "date": "2026-08-31T06:37:39.000Z", "summary": "千问创作上线Agent Teams功能，将创作方式从写提示词扩展为用户提出创意、Agent主动拆解执行，由编剧、导演、美术等不同角色Agent分工协作完成视频制作全流程。该功能已在千问创作PC端和千问APP上线，支持多设备协同，并首发接入Wan 3.0视频生成模型及Wan3.0 Prime满血版，同时汇集Qwen-Image-3.0等模型。", "type": "model", "relTime": "1天前"}, {"id": 45, "title": "滴滴自动驾驶新一代Robotaxi R2开启无人载客测试，北京、广州可体验", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/454.htm", "date": "2026-08-31T06:33:28.000Z", "summary": "滴滴自动驾驶新一代Robotaxi R2正式开启无人载客测试服务，用户可在北京、广州部分示范区域呼单体验。R2由滴滴与广汽埃安联合打造，采用L4全栈软硬件方案，搭载33个传感器，后排配备17.3英寸吸顶屏及AI语音交互系统。车辆接驾前自动开窗通风，车外屏交互、鸣笛寻车等功能将陆续上线。", "type": "paper", "relTime": "1天前"}, {"id": 46, "title": "混元Hy4预览版人人可生成蜘蛛侠", "source": "X：腾讯混元 (@TencentHunyuan)", "sourceUrl": "https://x.com/TencentHunyuan/status/2094304856387571789", "date": "2026-08-31T06:02:42.000Z", "summary": "每个人都可以用 Hy4 preview 生成一个蜘蛛侠。  【引用 @gmi_cloud】：运行 Hy4 preview 超过 6 小时，历经 9 次迭代，最终得到这个结果。  一个蜘蛛侠可以在 3D 旧金山中荡来荡去的游戏。  560 万 tokens。总计 13 美元。  而且我们已将其开源 👇", "type": "model", "relTime": "1天前"}, {"id": 47, "title": "SkyProduction天工工作台×通义万相：Wan 3.0限时免费再延1天", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI1MzE1NDc3Mg%3D%3D&mid=2247510201&idx=1&sn=15fe35a8e1c9151f590602ee5bc996db", "date": "2026-08-31T05:37:40.000Z", "summary": "SkyProduction天工工作台联合通义万相，将Wan 3.0限时免费活动延长至8月31日24：00，付费用户（会员及账户内有积分用户）今日可继续免费使用。该系列模型支持30秒长视频、多模态参考、人物一致性等功能。同日，天工工作台完成首页改版，突出Agent与无限画布两大核心创作入口。", "type": "model", "relTime": "1天前"}, {"id": 48, "title": "阿里云 Wan 3.0 上线 Buzzy，限时无限生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2094276105545093120", "date": "2026-08-31T04:08:27.000Z", "summary": "阿里云 Wan 3.0 现已登陆 AI 视频平台 Buzzy，支持生成电影级视频，画面细节更丰富、动态效果更流畅。限时 7 天内可无限次生成。API 也已通过 Model Studio 和 Qwen Cloud 开放。", "type": "model", "relTime": "1天前"}, {"id": 49, "title": "混元 Hy4 preview 调用激增，WorkBuddy 已紧急扩容", "source": "公众号：腾讯混元", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkwODU2OTQyNQ%3D%3D&mid=2247498489&idx=1&sn=a73dab1ed3e872e1eec2524fb18f7254", "date": "2026-08-31T02:06:00.000Z", "summary": "混元 Hy4 preview 自 8 月 28 日在 WorkBuddy 首发接入后，因 Agent 能力提升引发调用激增，上线首日即出现排队，官方已对推理集群紧急扩容。Hy4 preview 限免至 9 月 10 日 23：59，每日免费额度有限；Hy3 限免延长至 9 月 30 日 23：59。Hy4 preview 暂不具备图像/视频等多模态生成能力，相关任务将自动切换至其他模型执行。", "type": "model", "relTime": "1天前"}, {"id": 50, "title": "小马智行携手 FutureLink，拟首批在韩商业投放 200 辆 Robotaxi", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/303.htm", "date": "2026-08-31T01:49:34.000Z", "summary": "小马智行与韩国自动驾驶企业 FutureLink 签署战略合作，计划在韩国提供基于第 7 代 Robotaxi 的商业出行服务。首批投放规模 200 辆，由北汽制造，有望于 2028 年取得韩国政府认证。双方将设立合资企业，FutureLink 负责落地准入与车队运营，小马智行提供技术支持，在韩数据不会传输至境外。", "type": "industry", "relTime": "1天前"}, {"id": 51, "title": "DreamX-Creator 1.0 发布：7B 模型实现 2K 分辨率原生音视频联合生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.31106", "date": "2026-08-31T00:00:00.000Z", "summary": "DreamX-Creator 1.0 是一个以 7B 生成器为核心的原生音视频联合生成系统，基于首帧和文本提示对音频与视频流联合去噪，通过 Gated Cross-Modal Attention 在网络后半段耦合两个模态。", "type": "paper", "relTime": "2天前"}, {"id": 52, "title": "BLARM：通过混合潜在刚性运动基元从视频驱动 3D 物体动画", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.31113", "date": "2026-08-31T00:00:00.000Z", "summary": "论文提出 BLARM，一种前馈方法，输入单目视频和静态物体网格，即可预测运动跟随视频的时序连贯动画网格。方法用少量随时间变化的刚性运动分量和顶点到分量的蒙皮权重表示动画，无需骨骼、cage、蒙皮权重或绑定标注，通过分解时空注意力将几何形变潜变量条件于视频特征，并以轨迹重建、熵正则和运动感知对比学习训练，生成准确且时序稳定的动画。", "type": "paper", "relTime": "2天前"}, {"id": 53, "title": "Lucida：面向可组合真实到仿真场景建模的解析、生成与放置框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.30821", "date": "2026-08-31T00:00:00.000Z", "summary": "Lucida 提出可组合真实到仿真场景建模方法，将真实室内场景恢复为按观测排布、可单独操作的完整可编辑物体资产。方法沿用解析、生成、放置三步，但把精度要求重新分配到流水线末端：解析视频生成携带逐实例多视角证据的场景图，据此生成完整资产，并用 VLM 策略 GizmoAct 将放置建模为多轮 GUI 交互，闭环操纵物体 gizmo 并自行判断对齐完成。", "type": "paper", "relTime": "2天前"}, {"id": 54, "title": "PaperBanana-Interact：基于多轮人类反馈的科学图表精修系统", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.30241", "date": "2026-08-31T00:00:00.000Z", "summary": "论文提出 PaperBanana-Interact，一个通过内部 critique-and-refine 循环精修科学图表的多智能体系统，并发布多轮图表生成基准 MTPaperBananaBench，含 292 张图像和 3，518 条用户需求标注。", "type": "paper", "relTime": "2天前"}, {"id": 55, "title": "论文提出超越人类监督扩展大型推理模型的 L0-L4 路径框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.31075", "date": "2026-08-31T00:00:00.000Z", "summary": "论文研究大型推理模型（LRM）如何在人类监督逐渐退出学习回路后继续提升，提出从 L0 到 L4 的五级阶梯框架，覆盖奖励轴（从人工判断到无需人类反馈的可复用验证器）和经验轴（从人工策划任务到自生成课程与自主协同进化）。", "type": "paper", "relTime": "2天前"}, {"id": 56, "title": "WebWorld：把浏览器当作世界模型实现自改进的网页代码生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.30530", "date": "2026-08-31T00:00:00.000Z", "summary": "arXiv 论文提出 WebWorld，让 VLM 与浏览器这一确定性可执行模拟器交互，将 VLM 的批评编译为类型化交互契约，浏览器重新执行候选代码，只有目标进展与既有能力保持同时满足时才签发验收证书，证书化的转移累积为质量棘轮并作为 SFT 导出的唯一数据。", "type": "paper", "relTime": "2天前"}, {"id": 57, "title": "LightNav-0：激发 VLM 空间智能的通用具身导航模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.30935", "date": "2026-08-31T00:00:00.000Z", "summary": "研究团队发布 LightNav-0，一个紧凑的通用具身导航模型，通过双通道指向和残差向量量化动作 tokenizer 激发预训练 VLM 的空间智能，无需任务专用预测头。训练语料覆盖 2K+ 场景和 4K+ 小时具身导航数据，LightNav-0 在全部 10 个公开导航仿真环境中取得单目成功率 SOTA，真实世界评测显示跨机器人本体、场景及静态动态目标的零样本泛化能力。", "type": "paper", "relTime": "2天前"}, {"id": 58, "title": "MineAmongUs：研究 VLM 智能体在具身社交互动中的言语与非言语联合欺骗", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.30428", "date": "2026-08-31T00:00:00.000Z", "summary": "论文提出 MineAmongUs，一个 3D 多模态 Among Us 沙盒，让 imposter 智能体通过言语与非言语联合行动欺骗船员，并配套可配置的 VLM 智能体框架 ARIA 和基于欺骗分类学的原子与弧级标注方案。", "type": "paper", "relTime": "2天前"}, {"id": 59, "title": "Figure创始人谈中国机器人引发热议", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2094153747907944841", "date": "2026-08-30T20:02:15.000Z", "summary": "美国Figure Robots创始人Brett Adcock对中国机器人有非常强烈的看法。🤔  ----  来自\"My First Million\"YouTube频道（完整视频链接见评论）", "type": "tip", "relTime": "2天前"}, {"id": 60, "title": "Codex 插件不到 1 元生成高清 AI 视频", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2094093204790325554", "date": "2026-08-30T16:01:41.000Z", "summary": "开发者 Saccc_c 发布了一款 Codex 插件，宣称生成高清 AI 视频成本不到 1 块钱。该插件通过 Codex 调用视频生成能力，大幅降低创作门槛，引发社区关注。目前具体模型与生成参数未披露，实际效果有待验证。", "type": "tip", "relTime": "2天前"}, {"id": 61, "title": "GPT-5.6 Sol 电影级网页制作技巧拆解", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2093988094198321226", "date": "2026-08-30T09:04:00.000Z", "summary": "一条视频拆解如何用 GPT-5.6 Sol 生成苹果发布会级前端质感的网页，核心技巧包括：先喂设计公理（Bento Grid 栅格、暗黑毛玻璃等）注入审美，按英雄区、交互动效、数据卡片分层生成模块以快速修 bug，以及用一句提示词让 Sol 自动补齐 CSS 平滑过渡和光影跟随效果。完整精要与核心 Prompt 已整理发布。", "type": "tip", "relTime": "2天前"}, {"id": 62, "title": "网传微软 Win11 偷偷后台跑 AI？实为权限管理列表", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/194.htm", "date": "2026-08-30T09:00:56.000Z", "summary": "网传 Windows 11 在后台偷偷运行 AI 并拖累性能的截图实为误读。该\"文本和图像生成\"页面仅记录哪些应用拥有使用设备端生成式 AI 模型的权限，并非实际运行记录，且\"最近活动\"显示请求数为 0。相关功能在 Copilot+ PC 的 NPU 上运行，不会占用 CPU、GPU 或普通系统内存。", "type": "tip", "relTime": "2天前"}, {"id": 63, "title": "黄仁勋：马斯克在AI、自动驾驶与人形机器人领域占据绝佳位置", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2093967672644153350", "date": "2026-08-30T07:42:51.000Z", "summary": "黄仁勋称马斯克在引领AI、自动驾驶与人形机器人未来方面处于绝佳位置，优势在于其汽车AI工厂出色且拥有庞大车队。他提到xAI专注基础认知智能，特斯拉专注自动驾驶，Optimus专注人形机器人，这三者正是AI最重要的三大领域。", "type": "tip", "relTime": "2天前"}, {"id": 64, "title": "Hy4 预览版经 WorkBuddy 单次生成过山车视频", "source": "X：Tencent WorkBuddy (@WorkBuddy_AI)", "sourceUrl": "https://x.com/WorkBuddy_AI/status/2093939223300849910", "date": "2026-08-30T05:49:49.000Z", "summary": "用户通过腾讯 WorkBuddy 试用 Hy4 预览版，仅凭一句模糊提示词（第一视角过山车、前排、要快）即一次生成逼真视频，陡降与倾斜弯道手感到位。Hy4 在代码与 3D 渲染能力上明显升级，未来两周可在 WorkBuddy 免费体验。", "type": "paper", "relTime": "2天前"}, {"id": 65, "title": "预估为 GPT-6 模型：OpenAI Astra 首批演示样本流出，1 次交互生成类 GTA 2 游戏", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/120.htm", "date": "2026-08-30T05:25:15.000Z", "summary": "OpenAI 正加快 Astra 模型发布进程，新增 mozaik-alpha-fdm 测试阶段以扩大内部测试范围。多方爆料认为 Astra 很可能就是外界所称的 GPT-6，参数规模或达 10 万亿。测试显示，该模型仅 1 次对话交互即可生成类似《侠盗猎车手 2》的游戏及精细网站、3D 对象和体素环境，但推理时间比 GPT-5.6 Sol 长得多。", "type": "model", "relTime": "2天前"}, {"id": 66, "title": "MMMMM 论文提出多语言多模态虚假信息的统一分类体系", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.29681", "date": "2026-08-30T00:00:00.000Z", "summary": "论文提出 MMMMM 分类体系，基于 Twitter/X 上七种语言的真实虚假信息数据集研究多模态虚假信息机制。作者用视觉语言模型构建自动化多步标注流程并经人工验证，发现 AI 生成内容在科技与科学领域尤为普遍，而疫苗类虚假信息更多盗用新闻媒体图片来增强可信度，建议治理应分领域策略化而非一刀切。", "type": "paper", "relTime": "3天前"}, {"id": 67, "title": "ContextBias 框架评测文生图模型在语境变化下的偏见持续性", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.29847", "date": "2026-08-30T00:00:00.000Z", "summary": "论文提出 ContextBias 评测框架和 ContextBench 基准，覆盖 92 个角色和 1，656 条语义受控提示词，对四个 SOTA 模型生成的 66，240 张图像进行评测。", "type": "paper", "relTime": "3天前"}, {"id": 68, "title": "SpanCalib-VLM 提出混合双系统检测视觉语言模型幻觉片段", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.29974", "date": "2026-08-30T00:00:00.000Z", "summary": "论文提出 SpanCalib-VLM，一个面向 SHROOM-Visions 共享任务的混合双系统，将 XLM-RoBERTa-Large 与 SigLIP 视觉编码器融合的多模态序列标注器，与微调的生成式 VLM（Qwen3.5-4B-SHROOM-SFT）结合，通过 Union-Calibrated Fusion 策略用标注器的校准概率对生成模型候选片段重新打分。", "type": "paper", "relTime": "3天前"}, {"id": 69, "title": "视频模型难复现艾姆斯错觉", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2093799576570417384", "date": "2026-08-29T20:34:54.000Z", "summary": "顺便说一句，到目前为止，我还没能让任何视频模型仅凭文本提示或图像提示就产生艾姆斯错觉效果。", "type": "tip", "relTime": "3天前"}, {"id": 70, "title": "MiniMax H3 Max 开源模型被 @fal 改造，实现超实时视频生成", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2093778769903534294", "date": "2026-08-29T19:12:13.000Z", "summary": "MiniMax 发布开源权重模型 H3，@fal 通过自研后训练与推理技术将其改造为 H3 Max，在质量和延迟上双双突破，实现超实时（faster-than-real-time）视频生成。MiniMax 称这证明了开放权重让前沿技术不再属于少数人，并希望 H3 Max 成为社区共创突破的开端。", "type": "tip", "relTime": "3天前"}, {"id": 71, "title": "腾讯混元Hy4预览版体验：一句话生成过山车视频", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2093772055586259362", "date": "2026-08-29T18:45:33.000Z", "summary": "腾讯混元Hy4预览版在WorkBuddy中开放试用，仅凭一句模糊提示词即可生成第一视角过山车视频，陡降、倾斜转弯和近景飞驰的速度感表现到位。编码与3D渲染能力明显升级，一次生成即达此效果，未来两周可免费体验。", "type": "tip", "relTime": "3天前"}, {"id": 72, "title": "MiniMax H3 接入 Twitch 直播无限生成视频", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2093746422466367907", "date": "2026-08-29T17:03:41.000Z", "summary": "@rehan_shei 可能刚刚发明了最好的基准测试：生成速度能比 Twitch 直播还快吗？🤔📺🌀  太不可思议了，看到 @fal 把 MiniMax H3 推向全新的体验。  【引用 @rehan_shei】：MiniMax H3 Max 生成视频的速度比你观看的速度还快，所以我把它接入了 Twitch 直播！现在你可以观看无限的跨维度频道--直播链接在下方", "type": "paper", "relTime": "3天前"}, {"id": 73, "title": "AI生成视频正取代中国演艺与直播行业真人演员", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/ai-generated-videos-are-already-displacing-actors-and-livestreamers-across-chinas-entertainment-industry", "date": "2026-08-29T13:25:56.000Z", "summary": "AI生成视频正冲击中国演员、网红和主播岗位，部分制作已用数字演员替代真人。自字节跳动Seedance 2.0发布以来，数字演员能以更快、更便宜的方式产出更高质量视频。2026年一季度中国上线约12.8万部短剧，为2025年全年三倍，其中95%为AI生成；一分钟AI视频成本仅90至120美元，约为真人拍摄成本的十分之一。", "type": "industry", "relTime": "3天前"}, {"id": 74, "title": "斯坦福课程拆解：Agent 落地三条铁律", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2093688570485641670", "date": "2026-08-29T13:13:48.000Z", "summary": "斯坦福《自我进化 Agent》第一讲指出，判断工作能否被 AI 取代，关键看有无廉价的自动验证器，而非仅看能否被替代。课程强调生成与验证鸿沟：代码 Agent 因单元测试可自动闭环反馈而率先跑通。Agent 落地需遵循三条铁律：验证便宜的岗位（如重构、补测试）越用越强；靠人肉审美的岗位只能当草稿纸；生产级 Agent 须先画流程图并设人工审批闸门。", "type": "tip", "relTime": "3天前"}, {"id": 75, "title": "音乐人化身\"侦探\"猎捕AI造假者", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/entertainment/985866/h4rris-nihil-young-edm-suno-ai", "date": "2026-08-29T12:00:00.000Z", "summary": "随着生成式AI工具渗入电子舞曲（EDM）领域，以26岁制作人Max \"H4RRIS\" Harris为代表的一批音乐人正通过视频公开点名，指认那些疑似用AI生成音乐冒充人类创作的同业。Harris认为AI音乐是\"诱饵艺术\"，并指出Suno生成曲目常出现人声与旋律同时卡顿、背景嘶声等可辨识特征，但他对MANSA等具体作品的指控目前尚无确凿证据。", "type": "tip", "relTime": "3天前"}, {"id": 76, "title": "Lux3D 实测：图像文本生成可编辑 3D 资产", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2093639648946036998", "date": "2026-08-29T09:59:24.000Z", "summary": "1/ 过去几天我一直在测试 Lux3D，一个 3D 生成模型。你给它一张图片或一段文字提示，它就能返回一个完整的、可编辑的 3D 资产。无需建模技能。  试了全部 3 项核心功能。一条推文串：", "type": "tip", "relTime": "3天前"}, {"id": 77, "title": "LAION 发布 Big Video Dataset：1000 万小时开源视频数据集", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/laion-drops-massive-open-video-dataset-with-10-million-hours-of-footage-for-ai-research", "date": "2026-08-29T09:36:48.000Z", "summary": "LAION 发布 Big Video Dataset（BVD），从 CommonCrawl 的 13 亿视频 URL 中下载了 8000 万个视频，总计 1000 万小时，并提取了 5500 万个带自动生成描述的视频片段和 3 亿张静态图像。", "type": "model", "relTime": "3天前"}, {"id": 78, "title": "Grok 剪辑 Bot 开源：手机一句话生成混剪成片", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2093617498595680487", "date": "2026-08-29T08:31:23.000Z", "summary": "开发者 @XFreeze 开源了基于 Grok 的 Best Video Editor 模板，手机发一句话即可让 AI 在云端完成扒素材、配乐、切片、加标题并输出成片。该 Bot 支持零素材混剪、长视频抽高光和自带素材粗剪，底层连接真实云端环境而非网页生成，用户只需做最终把关。", "type": "tip", "relTime": "3天前"}, {"id": 79, "title": "创作者依赖AI还能算创作者吗", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2093615827144880538", "date": "2026-08-29T08:24:45.000Z", "summary": "ZHO 转引\"生成AI停服就什么都做不出的人不配称创作者\"之问，自述从手绘、手工模型到全面电子化、3D打印，再到如今AI的成长轨迹，坦言不知答案，但认为依赖AI者占多数，最终或会占据上风。他困惑这些变迁是束缚还是更大的自由。", "type": "tip", "relTime": "3天前"}, {"id": 80, "title": "国产 GPU 厂商壁仞科技上半年收入 12.36 亿元，同比增长 1997.6%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/995/887.htm", "date": "2026-08-29T03:08:21.000Z", "summary": "壁仞科技发布公告，截至 2026 年 6 月 30 日止六个月收入 12.36 亿元，同比增长 1997.6%；毛利 5.27 亿元，同比增长 2708.5%。报告期内研发开支 8.044 亿元，同比增长 40.7%，亏损大幅收窄至 3.772 亿元，净亏损同比降低 76.4%。壁砺TM系列训练及推理产品销售持续扩大，已在大语言模型推理、智能驾驶、具身智能、多模态等应用领域实现规模化部署。", "type": "industry", "relTime": "3天前"}, {"id": 81, "title": "FastVideo 开源 FastH3 实现 14 倍加速", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2093527142843957495", "date": "2026-08-29T02:32:21.000Z", "summary": "Sky Computing Lab 开源 FastVideo FastH3 预览版，生成 15 秒视频仅需 13 秒，实现 14 倍加速。盲测中 45% 用户偏好 FastH3 或认为其与 MiniMax H3 持平。该预览版仅用部分数据和算力训练，权重已发布于 HuggingFace。", "type": "model", "relTime": "3天前"}, {"id": 82, "title": "FastVideo 开源 FastH3 预览版，15 秒生成仅需 13 秒", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2093506470449156193", "date": "2026-08-29T01:10:12.000Z", "summary": "FastVideo 开源预览版 FastH3，15 秒视频生成仅需 13 秒，实现 14 倍加速，45% 用户偏好或认为其与 MiniMax H3 持平。该模型为预览检查点，仅用部分算力和数据训练。引用推文提醒，速度提升需配合质量评估，避免沦为\"随机像素生成器\"。", "type": "model", "relTime": "3天前"}, {"id": 83, "title": "CoVA-SFT：面向视觉抽象链的大规模多模态推理数据集发布", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.28958", "date": "2026-08-29T00:00:00.000Z", "summary": "研究团队发布 CoVA-SFT 数据集，包含 51.9K 样本、超 222K 多模态推理步骤，覆盖 5 种布局家族和 17 个复杂任务，并配套 1，700 条测试样本的 CoVA-Bench 基准。", "type": "paper", "relTime": "4天前"}, {"id": 84, "title": "CE3D++：基于大语言模型的交互式 3D 与 4D 场景编辑", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.29137", "date": "2026-08-29T00:00:00.000Z", "summary": "论文提出 CE3D++，一种以大语言模型为中心的对话式 3D 场景编辑方法，通过 Hash-Atlas 网络把 3D 编辑转化为 2D atlas 图像操作，解耦 2D 编辑与 3D 重建流程。", "type": "paper", "relTime": "4天前"}, {"id": 85, "title": "SafeAtlas-VL：用 150 万实例和 Guard 模型突破二元多模态安全判断", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.29098", "date": "2026-08-29T00:00:00.000Z", "summary": "论文提出 SafeAtlas-VL 数据集，包含 150 万训练实例，将图像、请求和响应三个层面的安全判断放在五级有序量表上，覆盖 15 个危害类别和 55 个细分子类。", "type": "paper", "relTime": "4天前"}, {"id": 86, "title": "MiniMax Fast H3 v1 发布：13秒生成15秒768p视频", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2093436440869032168", "date": "2026-08-28T20:31:56.000Z", "summary": "MiniMax 与 Hao AI Lab、NVIDIA FastGen 合作推出开源权重视频加速模型 Fast H3 v1，基于 MiniMax H3，可在 13 秒内生成 15 秒 768p 视频，在 NVIDIA Blackwell GPU 上实现最高 14 倍加速。该模型完全开源，社区可运行并改进加速方案。", "type": "model", "relTime": "4天前"}, {"id": 87, "title": "GLM-5.3 Flash 对比 Claude Opus 4.6 与腾讯 Hy4", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2093421703267536915", "date": "2026-08-28T19:33:22.000Z", "summary": "AI/ML API 用同一提示词测试 GLM-5.3 Flash、Claude 4.6 Opus 与腾讯 Hy4 的图像生成，成本分别为 $0.03、$0.29 和 $0.13。GLM-5.3 Flash 价格仅为 Claude 的 1/9.7，凸显模型路由的价值--\"最佳模型\"正让位于按需选择。", "type": "tip", "relTime": "4天前"}, {"id": 88, "title": "MiniMax FastH3 v1 开源：13秒生成15秒768p视频", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2093391548289540596", "date": "2026-08-28T17:33:33.000Z", "summary": "MiniMax 联合 NVIDIA、FastGen 发布开源模型 FastH3 v1，可在 13 秒内生成 15 秒 768p 视频，在 NVIDIA Blackwell GPU 上实现最高 14 倍加速。模型权重与加速方案完全开源，社区可自行运行和改进。团队表示，开源视频模型时代已开启，后续将分享更多关于后训练如何提升速度与质量的经验。", "type": "model", "relTime": "4天前"}, {"id": 89, "title": "Meta 模型 API 上线 Muse 图像生成", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2093390371875414501", "date": "2026-08-28T17:28:52.000Z", "summary": "1/ Muse 图像已在 Meta 模型 API 上线  $0.01/张--生产级用量中性价比最高的选择之一", "type": "model", "relTime": "4天前"}, {"id": 90, "title": "AI生成媒体成熟，创意繁荣何时到来", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2093362761925284279", "date": "2026-08-28T15:39:09.000Z", "summary": "除了等待经济影响显现，我们现在已经处于这样一个阶段：AI视频、图像和音乐模型已经足够好，成为真正的工具，让更多从未能创作新艺术形式的人得以创作。  在垃圾内容洪流之中，我们还要多久才能看到创意繁荣？它正在发生吗？", "type": "tip", "relTime": "4天前"}, {"id": 91, "title": "Krea 上线 Gemini Omni Flash 1.1", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2093360647459475635", "date": "2026-08-28T15:30:45.000Z", "summary": "Gemini Omni Flash 1.1 现已上线 Krea。  可生成 360p 草稿、放大至 4K、将视频延长至 40 秒，并支持通过视频参考迁移动作。  立即体验👇", "type": "paper", "relTime": "4天前"}, {"id": 92, "title": "Gemini 3.5 等多款新品本周发布", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2093356767992279503", "date": "2026-08-28T15:15:20.000Z", "summary": "Google 本周发布 Gemini 3.5 Transcribe，号称最精准的语音转文字模型；同时推出 Gemini Omni 1.1 Flash，增强视频生成与编辑能力。", "type": "model", "relTime": "4天前"}, {"id": 93, "title": "SpaceXAI 新增多团队 Grok 机器人协作功能", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2093350691205251468", "date": "2026-08-28T14:51:12.000Z", "summary": "SpaceXAI 新增了一段视频，展示如何运行多组 Grok 机器人。  每个项目都有一个频道、一份成员名单和一个 Notion 看板。一个项目经理机器人负责配置 Coder 和 Researcher，开启房间，写入 Notion 行，机器人认领任务。  一个项目，一个频道，一份名单。", "type": "paper", "relTime": "4天前"}, {"id": 94, "title": "Runway 上线 Google Omni 1.1 Flash", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2093344307021545601", "date": "2026-08-28T14:25:49.000Z", "summary": "Google Omni 1.1 Flash 现已登陆 Runway。  最新版本现已推出，与全球顶尖的图像和视频模型一同提供。点击下方链接立即体验。", "type": "model", "relTime": "4天前"}, {"id": 95, "title": "Gemini Omni 1.1 Flash 推出，强化生成视频控制", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2093338200580256172", "date": "2026-08-28T14:01:34.000Z", "summary": "我们正在推出 Gemini Omni 1.1 Flash，让生成式视频高度可控、迭代更快，并更适用于生产级场景。  以下是你可以在 @FlowbyGoogle 中体验它的方式，以及更多信息 → https://goo.gle/4zHEzJ2", "type": "paper", "relTime": "4天前"}, {"id": 96, "title": "MiniCPM-o 4.5 经 TyloQuant MFQ 量化登陆苹果芯片", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2093337998859636738", "date": "2026-08-28T14:00:45.000Z", "summary": "面壁智能 MiniCPM-o 4.5 现可通过 TyloQuant MFQ 量化版在 Apple Silicon 上高效运行，支持本地多模态推理。TyloQuant MFQ 采用神经元感知的混合格式量化，在降低内存占用的同时保留视觉、音频与实时交互能力，并提供多种量化等级及 Metal/CUDA 内核加速。", "type": "product", "relTime": "4天前"}, {"id": 97, "title": "昆仑万维 SkyProduction 接入 Wan 3.0，本周末限时免费", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI1MzE1NDc3Mg%3D%3D&mid=2247510180&idx=1&sn=885e26e1fc6561c07c492ce45cfcfe8b", "date": "2026-08-28T13:05:28.000Z", "summary": "昆仑万维旗下 SkyProduction（天工工作台）正式接入阿里 Wan 3.0 视频生成模型，8月28日-30日面向所有用户限时免费。8月31日起恢复收费，价格低至0.05元/秒，为全网最低价。Wan 3.0支持原生30秒生成、同时参考10张图片/5个视频/5个音频及文档内容，并强化像素级一致性与精准视频编辑能力。", "type": "model", "relTime": "4天前"}, {"id": 98, "title": "Beatport 全面封禁纯 AI 生成音乐", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/beatport-blocks-fully-ai-generated-music-from-its-dj-marketplace", "date": "2026-08-28T11:20:27.000Z", "summary": "DJ 市场 Beatport 开始禁止完全或大部分由 AI 生成的音乐，人类主导、仅使用 AI 辅助的曲目仍可上架但会被标记。平台借助合作伙伴 Beatdapp 的检测工具在上传时过滤 AI 曲目，被拒曲目权利人将收到通知。调查显示 60% 用户不会在演出中播放 AI 音乐，77% 更偏爱人类创作的音乐。", "type": "industry", "relTime": "4天前"}, {"id": 99, "title": "AI 二创视频加速，真相门槛被抬高", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2093295185803309179", "date": "2026-08-28T11:10:38.000Z", "summary": "孙宇晨万字长文发布数小时内，网友已用 AI 生成真人剧情二创视频，将文字热点快速视频化。AI 正冲击影视制作，新闻、八卦、网文等文字内容都可能被迅速转化为视频。但需警惕：任何文字都能在几小时内变成看似真实的真人视频，\"有视频有真相\"将失效，越逼真误导性越强。", "type": "tip", "relTime": "4天前"}, {"id": 100, "title": "万相3.0上线Medeo，支持30秒原生视频生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2093273256115749251", "date": "2026-08-28T09:43:30.000Z", "summary": "阿里云万相（Wan 3.0）正式上线 @Medeo_AI，支持原生30秒视频生成、同步音频，以及多模态 Omni Reference 带来的角色与风格一致性。视频支持1080p电影级画质与真实物理效果。API 已开放，可通过 Model Studio 和 Qwen Cloud 获取。", "type": "model", "relTime": "4天前"}, {"id": 101, "title": "阿里云 Wan 3.0 上线 DeepInfra，视频音频一体", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2093272820453371985", "date": "2026-08-28T09:41:46.000Z", "summary": "阿里云 Wan 3.0 现已上线 DeepInfra，单模型同时支持视频与音频生成，可生成 30 秒 1080P 片段，并支持图像、文件乃至网页等多模态参考，角色一致性得以保持。价格 $0.20/秒，另可通过 Model Studio 与 Qwen Cloud 调用 API。", "type": "model", "relTime": "4天前"}, {"id": 102, "title": "阿里云 Wan3.0 上线 A2E，支持 30 秒视频生成与编辑", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2093271860167450773", "date": "2026-08-28T09:37:57.000Z", "summary": "阿里云 Wan3.0 登陆 A2E 平台，支持从文本或图像生成完整 30 秒视频。用户可编辑时间线、扩展场景、重绘镜头并重塑视觉元素，全程保持角色一致性。API 已通过 Model Studio 和 Qwen Cloud 开放。", "type": "model", "relTime": "4天前"}, {"id": 103, "title": "Midjourney 开始测试 V8.2 编辑模型", "source": "X：Midjourney (@midjourney)", "sourceUrl": "https://x.com/midjourney/status/2093253371650031949", "date": "2026-08-28T08:24:29.000Z", "summary": "我们今天将开始测试首个 V8.2 编辑模型。该模型支持指令编辑、用其他图像生成图像（最多 4 张参考图）、基于笔刷的局部重绘和外绘。它还可与个性化、情绪板和 srefs 配合使用。玩得开心！", "type": "model", "relTime": "4天前"}, {"id": 104, "title": "开源电子书工具 Calibre 9.14 发布：首次引入 AI 生成封面", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/995/569.htm", "date": "2026-08-28T06:12:37.000Z", "summary": "开源电子书管理器 Calibre 推出 9.14 版本更新，首次引入由 AI 驱动的电子书封面图像生成器。用户选中书籍后点击新增的\"AI 生成\"按钮，大模型即可根据书名、简介等文本特征，在几秒钟内渲染出高分辨率艺术封面。该版本还新增书籍编辑器内文件浏览器悬浮预览功能，并升级标签编辑器搜索以忽略声调/变音符号。", "type": "model", "relTime": "4天前"}, {"id": 105, "title": "VGI-Bench：探针视频生成模型视觉智能", "source": "X：AK (@_akhaliq)", "sourceUrl": "https://x.com/_akhaliq/status/2093154284095295685", "date": "2026-08-28T01:50:44.000Z", "summary": "VGI-Bench  探针视频生成模型中的视觉智能  论文：https://huggingface.co/papers/2608.19583", "type": "paper", "relTime": "4天前"}, {"id": 106, "title": "视频中的任意目标定位：重新思考高效的生成式时空视频定位", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.28192", "date": "2026-08-28T00:00:00.000Z", "summary": "针对现有多模态大模型在时空视频定位中因自回归解码导致的延迟与误差累积问题，研究者提出并行管解码（PTD）方法，将定位分解为时间块与并行的条件空间块，将顺序解码深度固定为1+1轮。在VidSTG基准上，PTD将管完成延迟降低79倍，空间解码吞吐量提升92倍，并提升定位精度；基于40亿参数骨干的模型在VidSTG和HC-STVG上表现良好，并可零样本泛化至时间定位、视频问答等任务。", "type": "paper", "relTime": "5天前"}, {"id": 107, "title": "LayerRecall：面向长时视频一致性的状态条件记忆路由", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.28460", "date": "2026-08-28T00:00:00.000Z", "summary": "LayerRecall 提出当前状态条件、按层选择的记忆路由机制，仅将检索到的历史 K/V 状态注入骨干网络中对记忆敏感的层，同时保留局部注意力。配合 Cross-Horizon Prediction Matching（CHPM）在预测空间监督有界记忆路由，减少对稀缺长视频和显式标注的依赖。", "type": "paper", "relTime": "5天前"}, {"id": 108, "title": "GeoNeXt：将视频生成模型用作几何学习器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.28549", "date": "2026-08-28T00:00:00.000Z", "summary": "GeoNeXt将预训练视频生成模型改造为统一的几何估计框架，把深度与表面法线估计重构为下一帧预测任务，无需分别训练任务专属模型或大规模微调图像扩散骨干。该方法在零样本单目深度和表面法线估计上超越此前任务专属及统一生成式方案，且训练数据需求大幅降低，性能可与基于超100倍数据训练的有判别力SOTA方法比肩。", "type": "paper", "relTime": "5天前"}, {"id": 109, "title": "谷歌推出 Gemini Omni 1.1 Flash 视频生成 AI 模型，最高 4K 分辨率", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/995/352.htm", "date": "2026-08-27T23:49:58.000Z", "summary": "谷歌推出 Gemini Omni 1.1 Flash 视频生成 AI 模型，最高可生成 4K 视频。新模型支持场景扩展（每次 10 秒步长，单条最长 40 秒）、指定首尾帧及最长 3 秒视频参考。360p 预览生成速度较标准 720p 最高提升 60%，成本仅为三分之一；价格从 360p 每秒 0.03 美元到 4K 每秒 0.3 美元不等。", "type": "model", "relTime": "5天前"}, {"id": 110, "title": "MiniMax 与 fal 合作推出 H3 Max 视频模型", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2093092333378224185", "date": "2026-08-27T21:44:34.000Z", "summary": "MiniMax 祝贺 fal 团队推出基于其开源模型的后训练视频模型 H3 Max，该模型在质量、提示理解和美学方面排名第一，生成 5 秒 720p 视频仅需不到 3 秒。fal 同时优化了推理系统以实现超实时性能。H3 Max 发布首周享 50% 折扣。", "type": "model", "relTime": "5天前"}, {"id": 111, "title": "H3 Max 实时生成 AI 视频突破时间界限", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2093082102312923351", "date": "2026-08-27T21:03:55.000Z", "summary": "AI 视频的一条线被跨越了。在我仅使用网页界面的实验中，H3 Max 现在生成质量尚可的 AI 视频，所需时间比观看该视频还要短。从我按下\"生成\"按钮那一刻起就是实时的（其中还包括提示词增强）。", "type": "tip", "relTime": "5天前"}, {"id": 112, "title": "诉讼指控 xAI 使用儿童性虐待材料训练 Grok 模型", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/tech-policy/2026/08/elon-musks-xai-used-child-porn-to-train-grok-models-lawsuit-says", "date": "2026-08-27T20:52:31.000Z", "summary": "一项新诉讼指控 xAI 使用儿童性虐待材料（CSAM）训练 Grok 模型，这是首个此类指控。原告 Jane Doe 称其幼年遭虐待所生成的 CSAM 图像及 AI 生成的衍生图像被用于训练 Grok，且 Grok 默认将公开的 X 帖子和自身输出作为训练数据。诉讼要求 xAI 销毁所有 Grok 生成的 CSAM 并阻止模型再生成此类内容。", "type": "industry", "relTime": "5天前"}, {"id": 113, "title": "MiniMax 开源 H3 基础模型，生态后训练登顶", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2093074338413244514", "date": "2026-08-27T20:33:04.000Z", "summary": "MiniMax 祝贺 fal 团队基于其开源 H3 基础模型后训练的 H3 Max 视频模型登顶多项评测。H3 Max 在整体质量、提示词理解和美学上均排名第一，生成 5 秒 720p 视频耗时低于 3 秒，且本周价格五折。MiniMax 强调后训练只是释放基础模型已有能力，并指出 SGLang 训练管线及 Sol-Attention 引擎带来 3.95 倍端到端加速。", "type": "model", "relTime": "5天前"}, {"id": 114, "title": "Gemini Omni 1.1 Flash 发布：新增场景扩展、4K 升级等生成视频控制能力", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://blog.google/innovation-and-ai/technology/developers-tools/build-with-gemini-omni-1-1-flash", "date": "2026-08-27T20:06:03.845Z", "summary": "Google 推出 Gemini Omni 1.1 Flash，通过 Gemini API 在 Google AI Studio 提供面向专业用途的生成视频能力。新功能包括场景扩展（可分析最多 10 秒先前上下文，以 10 秒为增量延长至累计 40 秒）、首尾帧插值、360p 快速草稿（比 720p 快至多 60%、成本为其三分之一）以及最高 4K 分辨率升级。", "type": "product", "relTime": "5天前"}, {"id": 115, "title": "Cohere 发布 Parse 5（parse-v5.0）：2.3B 视觉语言模型，将企业文档转为 Markdown", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/27/cohere-releases-parse-5-parse-v5-0-a-2-3b-vision-language-model-that-turns-enterprise-documents-into-markdown", "date": "2026-08-27T20:05:49.000Z", "summary": "Cohere 发布文档解析模型 Parse（parse-v5.0），基于 North-Micro-Vision-Instruct 架构，拥有 2.3B 参数、8，192-token 上下文窗口和约 4.6GB 体积，可将 PDF、PPT、JPEG 页面直接转为含 HTML 表格和边界框坐标的 Markdown，无需独立 OCR 阶段。", "type": "model", "relTime": "5天前"}, {"id": 116, "title": "43秒AI短片《詹姆兰尼斯特的一生》走红", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2093030402956906693", "date": "2026-08-27T17:38:29.000Z", "summary": "博主@ykszs017 用一周时间制作43秒AI短片《詹姆兰尼斯特的一生》，剧本、分镜、剪辑及原剧台词查找均由AI辅助完成，并使用seedance生成。主推文借角色命运探讨\"做了正确选择却被世界惩罚\"的悲剧主题，称其\"值得被记住\"。", "type": "tip", "relTime": "5天前"}, {"id": 117, "title": "可视化AI机器人工作的小岛", "source": "X：Lauren Tan (@poteto)", "sourceUrl": "https://x.com/poteto/status/2093023531642863686", "date": "2026-08-27T17:11:11.000Z", "summary": "我建了一座小岛，可以可视化我的机器人工作时的状态！看着它们工作然后去睡觉，休息时回到它们的小房子，真是太可爱了🥺  制作这个的提示词在下面！", "type": "tip", "relTime": "5天前"}, {"id": 118, "title": "Google 发布 Gemini Omni 1.1 Flash，视频生成更便宜更灵活", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/googles-gemini-omni-1-1-flash-makes-ai-video-generation-cheaper-and-more-flexible", "date": "2026-08-27T17:01:28.000Z", "summary": "Google 将 Gemini Omni Flash 视频模型升级至 1.1 版本，场景扩展可分析现有视频最多十秒而非仅最后一秒，并以 10 秒为增量延长至 40 秒。", "type": "model", "relTime": "5天前"}, {"id": 119, "title": "DeepMind 副总裁谈 AI 不确定性推理", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2093019627437662680", "date": "2026-08-27T16:55:40.000Z", "summary": "Google DeepMind 研究副总裁 Zoubin Ghahramani 与主持人探讨如何通过教会 AI 系统\"自我怀疑\"和概率思维，实现更安全、可靠的现实世界决策。视频涵盖不确定性作用、正确性与置信度对比、贝叶斯思维在 AI 中的应用，以及未来研究与 AGI 方向。", "type": "tip", "relTime": "5天前"}, {"id": 120, "title": "Gemini Omni 1.1 Flash 发布，支持 4K 视频生成", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2093012163715563624", "date": "2026-08-27T16:26:00.000Z", "summary": "Google 正式发布多模态视频生成与编辑模型 Gemini Omni 1.1 Flash，现已上线 Gemini API 和 Google AI Studio。新模型为开发者提供场景扩展、指定镜头起止帧、视频输入参考等创意控制，并支持将片段放大至 4K、以 360p 快速测试想法。", "type": "model", "relTime": "5天前"}, {"id": 121, "title": "Gemini Omni 1.1 Flash 发布，场景扩展大升级", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2093008998987403303", "date": "2026-08-27T16:13:26.000Z", "summary": "Google 发布多模态视频生成与编辑模型 Gemini Omni 1.1 Flash，支持 4K 超分、首尾帧控制及快速 360p 草稿。最大升级是场景扩展：基于原视频 10 秒上下文进行扩展，远超 Veo 的 1 秒，带来更强一致性与更长叙事。", "type": "model", "relTime": "5天前"}, {"id": 122, "title": "Gemini Omni 1.1 Flash 发布，为开发者提供更强生成式视频控制", "source": "Google DeepMind：Blog（RSS）", "sourceUrl": "https://deepmind.google/blog/gemini-omni-1-1-flash-lets-you-build-with-more-control", "date": "2026-08-27T16:11:32.000Z", "summary": "Google 推出 Gemini Omni 1.1 Flash，为开发者提供更强的生成式视频控制能力。新模型支持场景扩展（可分析最多 10 秒先前上下文，以 10 秒为增量累计延长至 40 秒）、指定首尾帧生成平滑过渡，以及 4K 高清输出。", "type": "model", "relTime": "5天前"}, {"id": 123, "title": "Krea H3 Max 上线，生成速度提升50倍", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2092990757506322661", "date": "2026-08-27T15:00:57.000Z", "summary": "H3 Max 现已在 Krea 上线。  比任何其他高质量视频模型快 50 倍--仅需 5 秒即可生成 15 秒视频。  立即体验 👇", "type": "model", "relTime": "5天前"}, {"id": 124, "title": "Adobe Photoshop 推出\"AI 辅助编辑器\"测试版：基于提示词的全新图像编辑模式", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/995/305.htm", "date": "2026-08-27T14:01:17.000Z", "summary": "Adobe 为 Photoshop 新增\"AI 辅助编辑器\"测试体验，采用基于自然语言提示词的编辑方式，提供简化版界面，支持提示词编辑、移除背景、生成式填充等功能。该模式兼容 FLUX 2 Pro、Gemini 3.1、GPT Image 2 等模型，并新增基于提示词的蒙版编辑与非破坏性图层光线调整工具。AI 辅助编辑器已以测试版形式开放，其余功能即日起陆续提供正式版支持。", "type": "model", "relTime": "5天前"}, {"id": 125, "title": "Microduck 开源机器人趣味实验：追踪激光笔", "source": "X：Thomas Wolf（Hugging Face 联创/CSO） (@Thom_Wolf)", "sourceUrl": "https://x.com/Thom_Wolf/status/2092959363992326236", "date": "2026-08-27T12:56:12.000Z", "summary": "分享一些 Microduck 的有趣实验  基本上，一旦你拥有一个配备如此多传感器的开源机器人，可能性就是无限的  这里我们用 vibe-coding 方式集成了一个图像检测器，用于检测并追踪激光笔。  更多内容见 https://pollen-robotics.com/microduck/", "type": "tip", "relTime": "5天前"}, {"id": 126, "title": "百度智能云公路事件检测一体机：40B交通多模态大模型8秒锁定事故", "source": "公众号：百度智能云（文心）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzA5NTQ5MzE5OQ%3D%3D&mid=2653159882&idx=4&sn=8aaf2c95257f3f6f1ff2ef10d94fc83e", "date": "2026-08-27T12:48:57.000Z", "summary": "百度智能云推出公路事件检测一体机，核心为参数量行业居首的40B交通行业多模态大模型，具备场景理解、多端泛化和轻量蒸馏能力。该产品首创大小模型融合检测方案，由\"视觉一检\"快速扫描、\"多模态二检\"精准研判，并配合蒸馏出的8B、2B及视觉轻量模型。在广东佛开高速实测中，日间事件检测平均准确率超过95%，支持边缘侧一体机、中心侧一体机或算法授权等部署形态。", "type": "model", "relTime": "5天前"}, {"id": 127, "title": "百度智能云全栈适配GLM-5.3-Flash，成业内首批全栈支持云厂商", "source": "公众号：百度智能云（文心）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzA5NTQ5MzE5OQ%3D%3D&mid=2653159882&idx=3&sn=304b4fe8c6543c1b6594aef1fc7da9ad", "date": "2026-08-27T12:48:57.000Z", "summary": "智谱上线并开源原生多模态模型GLM-5.3-Flash（320B-A18B），百度智能云同步完成全栈适配，成为业内首批实现全栈支持的云厂商。该模型在AA综合智能指数中取得57分，与Claude Opus 4.8持平，编程表现亦相当。百度百舸、千帆、秒哒、视频云及Comate均已接入，企业客户与开发者可第一时间体验。", "type": "model", "relTime": "5天前"}, {"id": 128, "title": "Lux3D：3D 生成正从\"提示词\"走向\"API 调用\"", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2092952762980184432", "date": "2026-08-27T12:29:58.000Z", "summary": "Manycore Tech 发布新 3D 生成模型 Lux3D，最快 20 秒生成 3D 资产，支持高质量材质纹理与 Harness Mode 批量创建。Rohan Paul 指出，其 API 可被编码智能体反复调用，从规格说明批量生成 3D 道具并送入 Blender 处理，使 3D 生成成为更大智能体执行循环中的一环，而非简单的\"图生 3D\"工具。", "type": "model", "relTime": "5天前"}, {"id": 129, "title": "网友自制AI葡萄酒管理应用获赞", "source": "X：赵纯想 (@chunxiangai)", "sourceUrl": "https://x.com/chunxiangai/status/2092936759139352925", "date": "2026-08-27T11:26:22.000Z", "summary": "OMG 全体起立  【引用 @sakinotomiura】：我在慢慢做一个自己用的数字化管理酒柜的应用🍷  即使随便拍瓶子的照片，通过图像生成也能整理得很好，还会从原图的标签上获取品种和产地后保存💭", "type": "paper", "relTime": "5天前"}, {"id": 130, "title": "央视曝光 AI 相亲骗局：虚假婚介专骗中老年女性，成都警方抓获 28 人", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/995/129.htm", "date": "2026-08-27T08:51:55.000Z", "summary": "央视新闻曝光针对中老年女性的 AI 相亲骗局，不法分子用 AI 生成相亲对象形象实施诈骗。四川成都警方打掉该团伙，抓获王某等 28 名犯罪嫌疑人，涉案金额超 100 万元，约 50 余名群众受害。央视呼吁平台加强 AI 内容检测与风险分级处置。", "type": "industry", "relTime": "5天前"}, {"id": 131, "title": "火山引擎为具身智能打造数据基建，已与TOP20企业中15家深度合作", "source": "公众号：火山引擎", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI0NzU1NzI5NQ%3D%3D&mid=2247543735&idx=1&sn=52d4fcb6fd22f4226651e24879f19139", "date": "2026-08-27T08:13:49.000Z", "summary": "火山引擎在2026世界机器人大会上发布具身智能解决方案，提供从数据采集、处理、标注、管理、仿真到训练的全链路数据闭环。目前国内估值TOP20的具身智能企业中已有15家与其达成深度合作。方案包括Seedance视频生成用于数据增广、豆包大模型VLM实现90%+准确率的自动化标注，以及多模态AI数据湖底座。", "type": "model", "relTime": "5天前"}, {"id": 132, "title": "微信开源 WeMM-Embedding 的三大落地场景", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2092877358701174993", "date": "2026-08-27T07:30:20.000Z", "summary": "微信开源的多模态模型 WeMM-Embedding 可低成本重做混合搜索，2B 版本跑分超越上一代 8B 开源顶流，256 维截断仍保住近 99% 性能。作者列举三大场景：智能相册与知识库语义搜索、为 Agent 装上视觉长记忆、视频与电商内容低成本打标推荐，均可用一张消费级显卡运行。", "type": "tip", "relTime": "5天前"}, {"id": 133, "title": "滴滴充电智能网络覆盖全国 290 多座城市超 7.4 万座充电站，展示 1600kW 液冷超充桩", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/995/004.htm", "date": "2026-08-27T07:10:54.000Z", "summary": "滴滴在第十八届国际交通技术与设备展览会上展示新一代 Robotaxi R2，该车型由滴滴自动驾驶与广汽埃安联合打造，搭载 33 个传感器融合的硬件平台及行业首个量产三域融合中央计算大脑，GPU 算力超 2000TOPS。截至 2026 年 6 月 30 日，滴滴充电智能网络已覆盖全国 290 多座城市，连接超 7.4 万座充电站，并展出输出功率最高 1600kW 的液冷超充桩。", "type": "paper", "relTime": "5天前"}, {"id": 134, "title": "2026 美团低空经济与具身智能挑战赛报名倒计时，总奖金 55 万元", "source": "公众号：龙猫LongCat（美团）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MjM5NjQ5MTI5OA%3D%3D&mid=2651783211&idx=3&sn=61a0e88c38f88d9b529882611b696d3f", "date": "2026-08-27T02:24:00.000Z", "summary": "2026 年第四届美团低空经济与具身智能挑战赛启动报名，面向全球高校在校学生，总奖金池达 55 万元。赛事以无人机换电任务为原型，考察机器人在视觉识别、运动规划、精准操作等方面的综合能力，分初赛与线下硬件决赛，报名时间为 7 月 22 日至 9 月 1 日。表现优异者可获美团无人机实习机会及\"北斗计划\"直通面试权。", "type": "industry", "relTime": "5天前"}, {"id": 135, "title": "Qwen Live EP2：多模态智能体如何落地", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092792959502606657", "date": "2026-08-27T01:54:58.000Z", "summary": "Qwen Live EP2 精华，两分钟看完。多模态 AI 要投入实际工作，需要具备哪些条件？Qwen 与 Qwen Cloud 团队畅谈能看、能听、能行动的智能体--以及这一切将走向何方。  观看 Qwen Live EP2 完整视频：https://www.youtube.com/watch?v=kyaVsNCfdxw", "type": "tip", "relTime": "5天前"}, {"id": 136, "title": "EditaLive：面向直播场景的统一角色视频编辑框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.27123", "date": "2026-08-27T00:00:00.000Z", "summary": "EditaLive 提出面向实时直播的角色视频编辑框架，基于预训练图像动画模型 Wan-Animate 和 CharEdit-50K 数据集实现指令驱动编辑。该框架将模型从离线双向生成改造为因果流式生成，并通过对齐自回放蒸馏压缩为两步采样器，在保持面部表情一致性的同时实现低延迟实时推理，编辑性能达到当前最优。", "type": "paper", "relTime": "6天前"}, {"id": 137, "title": "多镜头长视频编辑新框架 MMLVE-Agent：用智能体推理实现一致编辑", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.26809", "date": "2026-08-27T00:00:00.000Z", "summary": "研究团队提出多指令多镜头长视频编辑（MMLVE）任务，并构建智能体编辑框架 MMLVE-Agent，结合大语言模型与视觉语言模型实现镜头级视频解耦和指令解析。配套发布评测数据集 MMLVE-Bench 及三项专用指标。实验显示，MMLVE-Agent 优于 Seedance 2.0 等闭源 SOTA 方法，消除编辑幻觉并保持跨镜头一致性与时空连贯性。", "type": "paper", "relTime": "6天前"}, {"id": 138, "title": "UrbanGround：在真实尺度城市中从局部感知到空间智能体的测试沙箱", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.27456", "date": "2026-08-27T00:00:00.000Z", "summary": "UrbanGround 提出首个基于香港全域 3D 地理空间数据构建的物理约束城市沙箱，用于测试多模态大语言模型（MLLM）智能体能否将局部街景感知转化为可靠的城市行动。该沙箱支持第一人称视角闭环交互与交互式导航地图。研究发现，当代 MLLM 智能体在视觉识别和短程空间推理上表现可用，但方向感与行人感知仍不可靠，长程探索中局部能力难以组合为持续目标导向行为。", "type": "paper", "relTime": "6天前"}, {"id": 139, "title": "PAWBench：视频生成模型距离概率对齐的世界建模还有多远？", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.27345", "date": "2026-08-27T00:00:00.000Z", "summary": "现有视频生成模型评测多关注单条视频的合理性，未检验重复生成能否恢复正确的行为分布。为此，研究者将概率对齐形式化为世界模型的分布级标准，推出基准 PAWBench 与评估协议 PAWEval，把多次视频生成转化为物理行为的经验分布。在 50 个场景和 11 个当前系统中，没有任何模型能同时匹配参考概率并覆盖有效行为范围。", "type": "paper", "relTime": "6天前"}, {"id": 140, "title": "Aphanta：面向多模态推理的图像编辑中间结果诊断框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.26993", "date": "2026-08-27T00:00:00.000Z", "summary": "Aphanta 提出自动化任务发现与闭环诊断框架，评估\"多模态大模型→图像编辑器→多模态大模型\"流程中图像编辑器的实际效用。在 20 个候选任务中，效用高度依赖任务类型，增益集中在视觉线索注入、接地与反事实状态实现。在正向任务子集上，整合的 Qwen 流程将平均任务分数从 0.343 提升至 0.445（+10.2 分，相对提升 29.7%）。", "type": "paper", "relTime": "6天前"}, {"id": 141, "title": "Magpie：面向交互游戏的实时生成式世界渲染系统", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.27168", "date": "2026-08-27T00:00:00.000Z", "summary": "Magpie 提出一种面向交互游戏的实时生成式世界渲染系统，将游戏逻辑执行与视觉生成分离：游戏引擎负责解析玩家动作并维护世界状态，独立的渲染服务器基于引擎生成的白盒帧产出视觉输出。该系统为生成模型应用于实时游戏渲染提供了系统级实现路径，在保留玩法可设计性与可复现性的同时，降低早期游戏原型对完整视觉资产的依赖。", "type": "paper", "relTime": "6天前"}, {"id": 142, "title": "Ring Forcing：面向自回归视频扩散的精确长期记忆框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.26794", "date": "2026-08-27T00:00:00.000Z", "summary": "Ring Forcing 提出一种自回归视频扩散框架，通过环形结构训练策略强制模型从远距离历史中检索信息，兼顾严格历史一致性与生成多样性。引入压缩与时间步组合策略，在固定序列长度下将有效历史跨度扩展至分钟级，并借助稀疏 RoPE 机制实现灵活可扩展的记忆适配。实验表明该方法在分钟级连贯性和物体恒存性上显著优于现有方法。", "type": "paper", "relTime": "6天前"}, {"id": 143, "title": "Code-as-World：用可执行世界表征实现智能体物理推理发现", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.27549", "date": "2026-08-27T00:00:00.000Z", "summary": "Code-as-World 提出一种新范式，将物理世界的组成、动态演化与视觉外观表示为可执行代码，形成紧凑、可量化且可控的世界表征。研究构建了基于溯因推理的智能体发现循环，通过提出、执行、渲染、验证和迭代精炼可执行世界假设，从多模态观测中构建此类表征。实验显示，Code-as-World-VL 在 QuantiPhy 基准上达到最先进性能，并超越领先的专有模型。", "type": "paper", "relTime": "6天前"}, {"id": 144, "title": "超越数据规模：面向视觉-语言-动作模型的表征中心持续预训练", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.27550", "date": "2026-08-27T00:00:00.000Z", "summary": "VLAct 提出面向 VLA 模型的表征中心持续预训练方法，在固定机器人数据预算下将有限轨迹转化为可迁移的视觉-动作知识。", "type": "paper", "relTime": "6天前"}, {"id": 145, "title": "生成式语义场景补全：用离散扩散统一稀疏LiDAR补全与场景生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.26737", "date": "2026-08-27T00:00:00.000Z", "summary": "研究将户外LiDAR语义场景补全（SSC）重构为生成式任务（GSSC），用单一离散扩散框架实现三种角色：配对稀疏-稠密场景合成（PS3）、语义引导生成补全（SGSC）及结构化源离散扩散（S2D2）精修。S2D2无需重训或测试时适配即可提升SGSC及所有外部SSC基线的mIoU，在最强基线上单步无增强达38.8% mIoU，较同限制下此前最佳公开结果高2.1个百分点。", "type": "paper", "relTime": "6天前"}, {"id": 146, "title": "RECAP-Forcing 论文提出按外观新颖度组织记忆的长视频生成方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.26671", "date": "2026-08-27T00:00:00.000Z", "summary": "RECAP-Forcing 论文提出一种无需训练、无可学习参数的长视频自回归生成推理方法，将记忆按外观新颖度而非时间组织：保留首次出现内容（进入主体、重新露出区域、新场景）的 KV cache。框架包含视频开始时的 attention sink 与基于光流的新颖度记忆库两个机制，在多个强基线上提升视觉质量与语义保真度，优于现有记忆方法。", "type": "paper", "relTime": "6天前"}, {"id": 147, "title": "BundleWeaver 论文提出 Image Bundle Composition 新范式并发布 IBCBench 基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.28695", "date": "2026-08-27T00:00:00.000Z", "summary": "论文提出 Image Bundle Composition（IBC）新范式，将图像检索目标从对单张图片排序改为从海量照片池中动态组合有结构关系的图像束。作者构建了含 109，467 张图片和 667 条验证查询的 IBCBench 基准，并提出 BundleWeaver 智能体框架，用 LLM 自适应搜索缺失的关系角色、用视觉语言模型做整束验证。", "type": "paper", "relTime": "6天前"}, {"id": 148, "title": "智谱发布GLM-5.3-Flash，匿名模型OX Alpha正式亮相", "source": "公众号：数字生命卡兹克", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647685603&idx=1&sn=91bbef667086bed84b6f213be79733aa", "date": "2026-08-26T22:19:23.000Z", "summary": "智谱正式发布GLM-5.3-Flash，即此前在OpenRouter和OpenCode上爆火的匿名模型OX Alpha。该模型为总参数320B、激活18B的MoE架构，是GLM-5系列首个原生多模态模型，支持图像、视频和文本输入，原生上下文100万。", "type": "model", "relTime": "6天前"}, {"id": 149, "title": "通义千问 Qwen3.8 Flash 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2092733868319428800", "date": "2026-08-26T22:00:09.000Z", "summary": "来自 @Alibaba_Qwen 的 Qwen3.8 Flash 现已上线 OpenRouter。  这是一款多模态推理模型，适用于编程助手、智能体工作流、视觉理解、代码库与文档分析、桌面交互、图表及长视频处理。  https://openrouter.ai/qwen/qwen3.8-flash", "type": "model", "relTime": "6天前"}, {"id": 150, "title": "Z.ai 发布 GLM-5.3-Flash：320B-A18B 原生多模态 MoE，支持 100 万 token 上下文", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/26/z-ai-releases-glm-5-3-flash-a-320b-a18b-natively-multimodal-moe-with-a-1m-token-context", "date": "2026-08-26T21:33:23.000Z", "summary": "Z.ai 发布 GLM-5.3-Flash，这是 GLM-5 系列首款原生多模态模型，320B 总参数、18B 激活参数，支持 100 万 token 上下文和图像/视频输入，权重以 MIT 许可开源在 Hugging Face。", "type": "model", "relTime": "6天前"}, {"id": 151, "title": "MiniMax H3 亮相 RaySummit 大会", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2092722804693327873", "date": "2026-08-26T21:16:12.000Z", "summary": "MiniMax H3 今天在旧金山参加 @anyscalecompute 的 #RaySummit 大会。  @VictorSuOrtiz 将在 @vllm_project 会议上解析我们的 33B 开源音视频模型，将文本、图像、视频和音频整合到一个上下文中。  @VoidAsuka 将分享开发者如何与 @digitalocean、@nvidia、@inferact 和 @NousResea...", "type": "industry", "relTime": "6天前"}, {"id": 152, "title": "V-RAE 将视觉基础模型表征用于视频生成", "source": "X：谢赛宁 (@sainingxie)", "sourceUrl": "https://x.com/sainingxie/status/2092720774268301417", "date": "2026-08-26T21:08:08.000Z", "summary": "谢赛宁转发介绍 V-RAE，该模型直接采用冻结视觉基础模型（DINOv3、SigLIP2、EUPE、V-JEPA 2.1）的表征作为视频生成潜空间，而非传统 VAE 潜空间。在匹配设置下，V-RAE 在 Kinetics-600 上达 2.13 rFVD，UCF101 上 117.86 gFVD，收敛速度比 VAE 潜空间快 6 倍，并引入 tFVD 评估时序平滑度。", "type": "paper", "relTime": "6天前"}, {"id": 153, "title": "MiniMax H3 Max登顶图生视频榜", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2092717615739494424", "date": "2026-08-26T20:55:35.000Z", "summary": "MiniMax H3 Max（fal 后训练版）在 Artificial Analysis 视频榜登顶图生视频（含音频）第 1、文生视频第 3，均超越基础版 H3。该模型由 fal 构建并托管，生成 5-15 秒带原生音频的 768p 视频，定价 $0.04/秒。fal 计划开源权重，若实现将成为两榜最高排名开源模型。", "type": "model", "relTime": "6天前"}, {"id": 154, "title": "Perceptron 开源具身基础模型 Isaac 0.5，将遥操作需求降低 210 倍", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2092692716534759589", "date": "2026-08-26T19:16:38.000Z", "summary": "Perceptron 发布开源具身基础模型 Isaac 0.5，这是一个 36B 参数动态 MoE 模型，通过扩展无动作视频将遥操作需求降低 210 倍。该模型可输入摄像头图像/视频、人类指令和机器人当前状态，输出物体位置、任务进度或下一步动作，既能微调后直接控制机械臂，也可仅用于感知。", "type": "model", "relTime": "6天前"}, {"id": 155, "title": "Meta 图像模型 Muse 登陆 Runway", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2092670079070822579", "date": "2026-08-26T17:46:41.000Z", "summary": "Meta 的 Muse 图像模型，现已上线 Runway。  今日起，与全球顶尖的图像和视频模型一同提供。点击下方链接，立即体验。", "type": "model", "relTime": "6天前"}, {"id": 156, "title": "GLM-5.3-Flash 发布，支持 1M 上下文与 MIT 许可", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2092667990273663311", "date": "2026-08-26T17:38:23.000Z", "summary": "智谱发布 GLM-5.3-Flash，320B-A18B 参数、原生多模态、1M-token 上下文窗口，MIT 许可开源，此前预览名为 Ox Alpha，完全运行于国产 AI 芯片。DAIR.AI 创始人推荐用 /eli5 制作视觉解释器，并可在其新 agent 游乐场搭配 Pi 或 Hermes Agent 试用。模型权重与 API 已在官方平台开放。", "type": "model", "relTime": "6天前"}, {"id": 157, "title": "MiniMax-H3 在 8×H200 上基准测试：无损加速 1.95×，最高 6.24×（SSIM 0.76-0.91）", "source": "LMSYS：Blog（Chatbot Arena 团队）", "sourceUrl": "https://www.lmsys.org/blog/2026-08-27-minimax-h3-h200", "date": "2026-08-26T16:00:00.000Z", "summary": "SGLang Diffusion 团队在 8×NVIDIA H200 上对 MiniMax-H3 视频生成进行基准测试，其密集无损路径较 Diffusers 快 1.85-1.95×，无近似损失。", "type": "paper", "relTime": "6天前"}, {"id": 158, "title": "微信开源多模态嵌入模型 WeMM-Embedding", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2092636087147491496", "date": "2026-08-26T15:31:37.000Z", "summary": "微信开源其多模态嵌入模型 WeMM-Embedding，9B 版本在 MMEB-v2 和 MMEB-v3 双榜登顶。2B 小版本跑分超越上一代 8B 开源顶流，靠几亿级数据对齐与细粒度蒸馏实现。该模型已部署于视频号、公众号、朋友圈和电商搜索推荐，支持文字、多图、长视频混合输入，维度截断至 256 维仍保留近 99% 性能，可大幅降低向量数据库存储与检索成本。", "type": "model", "relTime": "6天前"}, {"id": 159, "title": "前 Meta 科学家创办的 Perceptron 推出工业视觉模型 Isaac 0.5", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/26/ex-meta-scientists-want-to-bring-visual-ai-to-the-factory-floor", "date": "2026-08-26T15:00:00.000Z", "summary": "由两位前 Meta FAIR 研究员创立的 Perceptron 推出视觉模型 Isaac 0.5，帮助机器在仓库、工厂等工业环境中感知、推理并行动，支持视觉引导机器人导航及提取视频信息。该模型以开放权重发布，训练数据含百万小时通用视频与 ego video。公司近期完成 2100 万美元融资。", "type": "model", "relTime": "6天前"}, {"id": 160, "title": "智谱匿名模型Ox Alpha今晚开源，屠榜OpenRouter", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2092624381310603432", "date": "2026-08-26T14:45:06.000Z", "summary": "在 OpenRouter 上匿名屠榜、调用量超 DeepSeek 一倍的 Ox Alpha 被证实为智谱出品，官方确认今晚开源权重。该模型以 Flash 级速度和成本实现前沿实战能力，支持 1M 上下文与图片视频多模态，推理优先架构，社区测试在 10 个高难度 Coding 任务中拿下 80% 过关率，全量 DeepSWE 跑出 64.6%。", "type": "model", "relTime": "6天前"}, {"id": 161, "title": "C2PA相机经不起现实的考验：Android端可被root攻击伪造签名", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.da.vidbuchanan.co.uk/blog/android-c2pa.html", "date": "2026-08-26T14:05:27.506Z", "summary": "安全研究员David Buchanan指出，C2PA相机认证在Android平台上可被攻破。通过root权限提升漏洞（如CVE-2026-43499），攻击者可利用StrongBox硬件签名任意数据，伪造C2PA签名图像和视频，且无需硬件攻击。该问题无法通过常规补丁修复，已提前90天向相关方报告。", "type": "paper", "relTime": "6天前"}, {"id": 162, "title": "阿里云 Wan3.0 登顶六大动画评测", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092610663923568726", "date": "2026-08-26T13:50:35.000Z", "summary": "阿里云 Wan3.0 在六大动画类别评测中均排名第一，同时在写实视频生成方面表现优异。KoyalAI CEO Mehul Agarwal 从专业电影制作视角对其进行了测试，Wan3.0 现已上线 KoyalAI 平台，并提供 Model Studio 和 Qwen Cloud 的 API 访问。", "type": "model", "relTime": "6天前"}, {"id": 163, "title": "机器人\"大脑\"初创公司正走出自己的 GPT-2 时代", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/26/robot-brain-builders-are-pushing-out-of-their-gpt-2-era", "date": "2026-08-26T13:30:00.000Z", "summary": "物理 AI 领域正经历投资热潮与数据危机并存的阶段，开发者试图借鉴前沿 AI 实验室经验，通过更多数据、算力与强化学习场景推动模型进步。Antioch 创始人认为该领域仍处于\"GPT-2 时代\"，而自动驾驶公司正凭借数据优势切入人形机器人赛道。业内对垂直聚焦与通用路线存在分歧，但普遍认为高质量训练数据是当前最大瓶颈。", "type": "tip", "relTime": "6天前"}, {"id": 164, "title": "亲俄深度伪造视频让乌克兰议员\"开口\"求和", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/pro-kremlin-deepfakes-put-surrender-rhetoric-in-the-mouths-of-ukrainian-lawmakers", "date": "2026-08-26T12:36:24.000Z", "summary": "亲克里姆林宫的Telegram频道正传播两段AI生成的深度伪造视频，内容为乌克兰议员安德烈·列乌斯和伊万·尤纳科夫\"哀叹战争并呼吁和平\"。据NewsGuard报道，视频两周内获得13万次观看，并带有不自然眨眼、声音平淡等AI痕迹。此类伪造无论是否被识破，都会侵蚀公众对信息的信任。", "type": "industry", "relTime": "6天前"}, {"id": 165, "title": "NVIDIA Jetson Orin Nano 2 发布，将物理 AI 带入无人机与机器人", "source": "Artificial Intelligence News（RSS）", "sourceUrl": "https://www.artificialintelligence-news.com/news/nvidia-jetson-orin-nano-2-physical-ai-to-drones-and-robots", "date": "2026-08-26T09:08:11.000Z", "summary": "NVIDIA 发布 Jetson Orin Nano 2，一款面向无人机、机器人和视觉系统的边缘机器人计算机。该开发板定位入门级，让开发者无需数据中心即可在设备上直接运行生成式 AI 模型。", "type": "model", "relTime": "6天前"}, {"id": 166, "title": "研究发现婴儿语言学习能力远胜 AI 聊天机器人，学习效率也大幅领先", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/994/612.htm", "date": "2026-08-26T08:29:50.000Z", "summary": "婴儿学习语言的能力和效率远胜今天的 AI 聊天机器人。斯坦福大学认知科学家迈克尔·C·弗兰克指出，幼儿接触约 1000 万至 3000 万个词后就能说出清晰句子，而用 var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };
var TYPE_LABELS = { "paper":"论文", "model":"模型", "product":"产品", "tip":"技巧", "industry":"行业" };
function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";
  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();

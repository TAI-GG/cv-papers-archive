r", "relTime": "1天前"}, {"id": 25, "title": "Claude 一次生成完整音乐视频", "source": "X：Thariq (@trq212)", "sourceUrl": "https://x.com/trq212/status/2102870353781641416", "date": "2026-09-23T21:18:56.000Z", "summary": "用户给 Claude 一段约 1 万字符的提示词，包含技能、示例和 API key，要求它独立完成一支\"Claude Pop\"歌曲音乐视频的端到端重制。任务要求保留原音轨，用 JavaScript 动画呈现歌词，并调用 ElevenLabs API 做音效设计、用图像生成 API 制作角色设定与场景，再以 seedance 2.5 生成视频素材。", "type": "product", "relTime": "1天前"}, {"id": 26, "title": "YouTube 承诺今年晚些时候推出自定义信息流及更多 AI 功能", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/gadgets/2026/09/youtube-promises-custom-feeds-and-a-lot-more-ai-later-this-year", "date": "2026-09-23T19:35:53.000Z", "summary": "YouTube 在 Made on YouTube 活动上宣布将推出 Custom Feeds，用户输入描述即可生成自定义内容标签页并保存多个信息流，率先在美国上线 web、移动端和电视端。评论将支持发布 GIF，私信新增群聊，初期仅限美国、英国、新加坡、巴西及部分欧洲国家。Ask YouTube 将在产品评测视频中提供对话式问答，并在搜索中给出视频推荐和产品对比表格。", "type": "product", "relTime": "1天前"}, {"id": 27, "title": "Black Forest Labs 发布 7B 开源权重世界动作模型 FLUX 3 Action", "source": "Black Forest Labs：Blog（网页）", "sourceUrl": "https://bfl.ai/blog/flux-3-action", "date": "2026-09-23T18:11:00.000Z", "summary": "Black Forest Labs 发布 FLUX 3 Action，一个 7B 参数、开放权重的世界动作模型。官方称可将 FLUX 的视觉智能转化为动作能力，用于机器人、模拟器或游戏。", "type": "model", "relTime": "1天前"}, {"id": 28, "title": "OnSolo 发布 Solo Video：单次生成 15 秒视频", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2102809011209003016", "date": "2026-09-23T17:15:11.000Z", "summary": "OnSolo 上线 Solo Video，可一次生成 15 秒视频，官方称运动更自然、生成成功率更高，从而减少重试消耗的 credits。会员活动期内可无限使用：Premium 3 天、Super 5 天、Ultra 10 天，每档 150 个名额，先到先得，活动时间为 9 月 23 日至 10 月 22 日，Solo Video 现已在 Free Canvas 中可用。", "type": "paper", "relTime": "1天前"}, {"id": 29, "title": "Recraft V4.1 Flash 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2102805293562478886", "date": "2026-09-23T17:00:24.000Z", "summary": "Recraft V4.1 Flash 已在 OpenRouter 上线。  每张图 1.3 秒，$0.007/张，而且看起来依然是 Recraft 的风格：摄影、人像、复杂场景、logo feeds 的新功能，用户可在提示词框中用自然语言描述想看的视频类型，由 Gemini 生成定制推荐流并置顶在首页独立标签中。", "type": "paper", "relTime": "1天前"}, {"id": 35, "title": "阿里 Qwen 发布 Qwen-Audio-3.1 五款语音模型，语音价格最高下调 95%", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/alibaba-launches-qwen-audio-3-1-with-five-new-models-and-slashes-ai-audio-prices-by-up-to-95-percent", "date": "2026-09-23T12:31:20.000Z", "summary": "阿里 Qwen 团队发布 Qwen-Audio-3.1，包含五款覆盖语音识别（ASR）、语音合成（TTS）和实时交互的模型。ASR 改进多语言和方言识别并自动清理填充词，ASR-Next 支持多说话人识别、时间戳及情绪和环境声检测；TTS-Next 将语言模型与扩散方法结合，可一次性生成语音、音效和背景音频。同步降价：TTS 约 70%，Realtime 约 85%，ASR 最高 95%。", "type": "model", "relTime": "1天前"}, {"id": 36, "title": "invideo 借助 GPT-6 Astra 将调色效率提升 3 倍", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "sourceUrl": "https://openai.com/index/invideo-builds-with-gpt-6-astra", "date": "2026-09-23T12:00:00.000Z", "summary": "invideo 借助 GPT-6 Astra 将调色与色彩校正任务的成功率提升约 3 倍，并能在一天内生成约 50 个自定义特效。该模型以更少的推理步骤和输出 token 完成复杂剪辑规划，并能在任务变长时保持编辑者的原始意图。", "type": "model", "relTime": "1天前"}, {"id": 37, "title": "Meshy × Chrona 3D 世界创作挑战赛开启", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2102707044046528633", "date": "2026-09-23T10:30:00.000Z", "summary": "Meshy 联合 Chrona 发起 \"A World Worth Entering\" 挑战赛，参赛者用 Meshy 生成 3D 资产、借助 AI 编程构建可交互世界并发布到 Chrona，有机会在 SF Tech Week 展出。活动时间为 Sep 23 - Oct 8，提交作品最高可获 $1，000 奖励。", "type": "paper", "relTime": "1天前"}, {"id": 38, "title": "蚂蚁百灵开源 Ming-Image-0.1-Design 系列模型，UI 设计专项评测位列开源第一", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/006/390.htm", "date": "2026-09-23T09:42:16.000Z", "summary": "蚂蚁百灵开源 Ming-Image-0.1-Design 系列模型，包含两个 6B 模型，分别用于从文字生成 UI、信息图、海报等设计和将设计图拆为可编辑透明图层，同时开源 Design Skill 和 PPT Skill。", "type": "model", "relTime": "1天前"}, {"id": 39, "title": "小马智行 2026 上半年营收 7047 万美元同比增长 98.9%，归母净亏损 1.1 亿美元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/006/377.htm", "date": "2026-09-23T09:14:35.000Z", "summary": "小马智行 2026 上半年营业总收入 7，047 万美元，同比增长 98.9%，归母净亏损 1.1 亿美元，同比 25", "date": "2026-09-23T06:56:34.000Z", "summary": "免费两周！Hy Image3.5 preview 已在 OnSolo 上线。短剧角色设定图。全动态视频游戏素材。关键帧。角色在每一集中保持一致。编辑是精修而非重来。", "type": "paper", "relTime": "1天前"}, {"id": 45, "title": "GPT-6 多模态\"看轻想重\"问题引关注", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2102651779523682788", "date": "2026-09-23T06:50:24.000Z", "summary": "论文《Look Light， Think Heavy》指出多模态模型存在\"看轻想重\"问题：看图越来越浅、语言推理越来越长，靠语言自迭代和解释脱离视觉本身。GPT-6 上这一现象越来越明显，在 image 2.5 的使用中造成明显干扰与脱节，作者认为用解释代替观看也是人类常犯的错误。", "type": "paper", "relTime": "1天前"}, {"id": 46, "title": "腾讯混元 Hy Image3.5 preview 上线 ComfyUI", "source": "X：腾讯混元 (@TencentHunyuan)", "sourceUrl": "https://x.com/TencentHunyuan/status/2102588771829195229", "date": "2026-09-23T02:40:02.000Z", "summary": "腾讯混元宣布 Hy Image3.5 preview 现已在 ComfyUI 中可用。该模型面向专业级图像生成，人类评测胜率相比 Hy Image3.0 提升 30%；单一模型支持文生图和图生图、最高 2K 分辨率，可正确渲染多语言文字、符号和小字，覆盖电影感、漫画、商业摄影和插画风格，并在场景、服装和风格变化中保持人物身份与产品特征。", "type": "model", "relTime": "1天前"}, {"id": 47, "title": "蚂蚁开源 Ming-Image-0.1-Design 系列：两个 6B 模型打通设计生成与图层编辑", "source": "公众号：蚂蚁百灵（Ling）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkyODk2MDQwNw%3D%3D&mid=2247487951&idx=1&sn=60410b279510db5cab77ec92afc96f2a", "date": "2026-09-23T02:00:00.000Z", "summary": "蚂蚁百灵开源 Ming-Image-0.1-Design 系列模型，包含两个 6B 模型：Design 从文字需求生成 UI、信息图、海报等完整设计，Layer 将设计图拆成 2 至 9 个可独立编辑的 RGBA 图层，并同步开源 Design Skill 和 PPT Skill。", "type": "model", "relTime": "1天前"}, {"id": 48, "title": "Apple 提出 probe guidance：用冻结内部状态引导扩散语言模型", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/guide-language-flow", "date": "2026-09-23T00:00:00.000Z", "summary": "Apple 提出 probe guidance，利用现有扩散模型冻结的内部状态构建引导信号，无需在推理时增加额外前向计算，即可让弱模型与强模型保持相近动态。该方法在连续扩散语言模型的无条件生成上取得新的 SOTA，应用于 1.7B 扩散语言模型时在多项选择题基准上持续提升。研究还发现，传统 autoguidance 中的弱模型必须来自训练的低熵区域。", "type": "model", "relTime": "2天前"}, {"id": 49, "title": "Uranus：面向具身智能的下一代仿真基础设施", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.24815", "date": "2026-09-23T00:00:00.000Z", "summary": "研究者发布数据驱动的机器人仿真器 Uranus，基于关节轨迹条件的自回归扩散模型，可在线接收未来关节位置轨迹并逐步自回归生成隐帧，每步对应四帧 RGB，无固定时长限制。经推理优化后生成速度达 24 FPS，并提供统一接口支持多种机器人形态与相机配置的同步多视角生成。代码与模型权重已开源。", "type": "model", "relTime": "2天前"}, {"id": 50, "title": "联合视频生成中的跨注意力鸿沟：RecCAR 让视频与动作、音频互相对齐", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.27901", "date": "2026-09-23T00:00:00.000Z", "summary": "研究者发现联合多模态扩散 Transformer 存在\"互惠对应鸿沟\"：动作、音频等伴随模态能强对应视频，反向约束视频的对应却明显偏弱。为此提出 KL 正则化方法 RecCAR，以视频到模态的对应为固定参照，拉齐较弱的模态到视频对应。在视频-动作与视频-音频生成中，RecCAR 将 Human Anatomy 分数从 0.69 提升至 0.75，音视频不同步从 0.804 降至 0.752。", "type": "paper", "relTime": "2天前"}, {"id": 51, "title": "高维潜空间的可扩散性：RAE 中 x0-prediction 如何提升文生图生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.28473", "date": "2026-09-23T00:00:00.000Z", "summary": "针对 Representation Autoencoders（RAEs）中高保真重建编码器会降低表征有效维度、导致 flow matching 标准速度预测需拟合信号流形外的正交噪声方向、优化低效的问题，论文提出改用干净数据参数化（x0-prediction），将学习集中在底层信号流形上。在多个强重建编码器实验中，x0-prediction 一致提升了文生图生成性能。", "type": "paper", "relTime": "2天前"}, {"id": 52, "title": "自回归视频生成中的记忆机制综述：过去如何框定未来", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.28466", "date": "2026-09-23T00:00:00.000Z", "summary": "一篇综述系统梳理了自回归（AR）视频生成中的记忆机制，将记忆定义为跨 AR 步骤持续保留、在原始证据离开上下文后仍能影响后续生成的历史信息。文章从形式、功能、操作、学习与评估五个视角组织文献，并指出可组合且资源感知的记忆架构、可信状态更新、自 rollout 学习与标准化评估等开放挑战。", "type": "paper", "relTime": "2天前"}, {"id": 53, "title": "上海AI实验室发布 InternW0 物理世界模型基础版", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.27656", "date": "2026-09-23T00:00:00.000Z", "summary": "上海AI实验室推出 InternW 物理世界模型系列的首个模型 InternW0，通过非对称视频动作架构结合 flow matching 联合学习未来视觉动态与连续机器人控制，视频专家提供长时程预测上下文，轻量动作专家以更快频率运行，并通过复用层间 K/V 和观察条件上下文路由避免每次动作更新都重新生成未来。", "type": "paper", "relTime": "2天前"}, {"id": 54, "title": "实测GPT-6 Sol、Luna与Claude Opus 5.5：编程、前端、写作与3D多模态对比", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247511677&idx=1&sn=e24fc2b3f00d861ca4712a197a94b8c7", "date": "2026-09-22T23:07:00.000Z", "summary": "作者实测GPT-6 Sol、Luna与Claude Opus 5.5三款新模型。GPT-6 Sol/Luna API价格比GPT5.6低50%，Opus 5.5输出速度比Opus5快30%、成本低40%，并提升了pro、max、team套餐的五小时额度窗口。", "type": "tip", "relTime": "2天前"}, {"id": 55, "title": "Claude Opus 5.5 与 GPT-6 Sol 3D 场景对比", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2102523754186256535", "date": "2026-09-22T22:21:40.000Z", "summary": "AI/ML API 背后的团队用 GPT-6 Sol 测试了新的 Claude Opus 5.5。  这些测试涉及生成一组一次性 3D 场景提示词，从\"动画鱼群\"开始。  据他们的结果，在四个场景中，Opus 5.5 生成了更精细的渲染，总成本为 $4.37，而 GPT-6 Sol 为 $0.34。", "type": "product", "relTime": "2天前"}, {"id": 56, "title": "AI 智能体泛滥下，机器人检测与人类验证成刚需", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2102483123200303185", "date": "2026-09-22T19:40:13.000Z", "summary": "Rohan Paul 指出，区分\"授权自动化\"与\"恶意自动化\"将是更难的问题，两者在浏览器中看起来都完全正常。引用 Nikita Bier 的观点称，未来几年机器人检测与人类验证将成为企业最迫切的需求之一，智能体集群会淹没各类网站和表单，小公司和政府网站最脆弱；X 在调研市场时发现没有一家公司整合了所有最新技术，只能全部自研。", "type": "paper", "relTime": "2天前"}, {"id": 57, "title": "VLM 智能迁移至机器人控制", "source": "X：AK (@_akhaliq)", "sourceUrl": "https://x.com/_akhaliq/status/2102474539620090152", "date": "2026-09-22T19:06:06.000Z", "summary": "将 VLM 的智能迁移至机器人控制  论文：https://huggingface.co/papers/2609.22966", "type": "paper", "relTime": "2天前"}, {"id": 58, "title": "五角大楼调查：过度依赖 Maven AI 是美军误击伊朗米纳布学校的原因之一", "source": "Hacker News：AI 热帖", "sourceUrl": "https://www.bloomberg.com/graphics/2026-iran-school-attack", "date": "2026-09-22T19:03:38.000Z", "summary": "五角大楼内部调查发现，2026 年 2 月 28 日两枚 Tomahawk 导弹击中伊朗米纳布 Shajarah Tayyebeh 小学，造成超过 150 人死亡、其中至少 123 名儿童，原因是情报过时、卫星图像七年未更新，以及 Centcom 部分人员过度依赖 Palantir 的 Maven Smart System。", "type": "tip", "relTime": "2天前"}, {"id": 59, "title": "OpenAI API 要做各价位最强模型", "source": "X：Sam Altman (@sama)", "sourceUrl": "https://x.com/sama/status/2102466603111551187", "date": "2026-09-22T18:34:34.000Z", "summary": "我们希望 OpenAI API 在每个价位都提供最好的模型，并在每种模态（文本、代码、图像、视频等）上都做到最好。  然后我们希望你们所有人想出好点子、把它们做出来，并成为满意的用户。最好的点子会来自你们。", "type": "model", "relTime": "2天前"}, {"id": 60, "title": "Krea Agent 单参考视频生成电影感镜头", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2102461525168632289", "date": "2026-09-22T18:14:24.000Z", "summary": "只需一个参考视频，就能用 Krea Agent 创作电影感镜头。  下面教你如何制作这样的视频 👇", "type": "paper", "relTime": "2天前"}, {"id": 61, "title": "StepFun 开源 LLM 数据标注与模型检查工具 onPanda", "source": "X：阶跃星辰 StepFun (@StepFun_ai)", "sourceUrl": "https://x.com/StepFun_ai/status/2102454115473510643", "date": "2026-09-22T17:44:57.000Z", "summary": "StepFun 开源内部使用的 LLM 数据标注与模型检查工具 onPanda，支持 token 级可视化与控制。标注方面称中位标注时间比人工后编辑降低 52%，可在同一流程产出 SFT 与偏好数据，ΔPPL <1%，并支持图像、音频和视频的 agent 轨迹标注；调试方面可查看 token 概率与 top-k 候选、逐 token 引导解码。", "type": "model", "relTime": "2天前"}, {"id": 62, "title": "NVIDIA 推出 NV-Reason-CT：面向放射科医生思维链推理的开放 3D CT VLM", "source": "NVIDIA Technical Blog：Agentic AI / Generative AI", "sourceUrl": "https://developer.nvidia.com/blog/introducing-nv-reason-ct-open-3d-ct-vlm-for-radiologist-chain-of-thought-reasoning", "date": "2026-09-22T16:00:00.000Z", "summary": "NVIDIA 发布 NV-Reason-CT，一款专为 3D CT 分析打造的开放视觉语言模型，将思维链推理扩展到全容积 CT，支持结构化报告生成、模拟放射科医生思维链和多轮追问对话。", "type": "model", "relTime": "2天前"}, {"id": 63, "title": "Runway 发布 DaVinci Resolve 插件，可在剪辑软件内生成和重绘素材", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/company-news/runway-davinci-resolve", "date": "2026-09-22T16:00:00.000Z", "summary": "Runway 发布 DaVinci Resolve 插件，可在 Resolve Studio 内直接生成图像和视频、重绘播放头下的片段，并将结果导入媒体池和时间线。", "type": "paper", "relTime": "2天前"}, {"id": 64, "title": "Grok 4.7 在特斯拉做实际工程", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2102423241897705926", "date": "2026-09-22T15:42:16.000Z", "summary": "Grok 4.7 在特斯拉做真正的工程工作  【引用 @yunta_tsai】：过去几周，Grok Build 团队为 4.7 优化了 harness：  - 更好的呈现，更少废话，更好的文笔 - 更好的自我验证 - 提升思考效率 - 改进长时程监控任务 - 改进 VLM 和多模态任务  我个人交付的许多 FSD 和 Cybercab 功能都是用我的过夜智能体完成的。  试试看。", "type": "paper", "relTime": "2天前"}, {"id": 65, "title": "Grok 4.7 生成交互式3D喷气引擎可视化", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2102422703798137219", "date": "2026-09-22T15:40:08.000Z", "summary": "Grok 4.7  【引用 @cb_doge】：Grok 4.7 在几分钟内将一个简单的提示词变成了这个交互式 3D 喷气发动机可视化工具。  这太疯狂了。🔥", "type": "paper", "relTime": "2天前"}, {"id": 66, "title": "Runway 推出 DIFFUSE：面向 AI 原生创意人才的招聘平台", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/company-news/introducing-diffuse", "date": "2026-09-22T15:14:37.236Z", "summary": "Runway 推出 DIFFUSE，一个供品牌搜索、联系并雇佣 AI 原生创意人才的开放平台，网址为 diffuse.runway.com。Runway 团队调研近 400 家公司的 1000 多个创意岗位招聘信息，其中 17% 提及 AI 技能或生成式工具，Runway 是这些岗位中需求最高的视频专用工具。创意人才和制作公司可建立档案、托管作品集，品牌、代理商和工作室可直接对接人才。", "type": "paper", "relTime": "2天前"}, {"id": 67, "title": "Tripo 携手 World Labs 办 3D 黑客松", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2102412620615520689", "date": "2026-09-22T15:00:04.000Z", "summary": "我们很高兴与 @theworldlabs 合作，携手我们出色的 VR、3D 打印和视频模型合作伙伴，共同举办 Tripothon S1--首届世界构建 3D 黑客松！  加入我们，一起突破 3D 生成与空间智能的边界。在 5 个赛道中角逐，赢取超过 $80，000 的现金奖励！", "type": "model", "relTime": "2天前"}, {"id": 68, "title": "港科大团队用 WorkBuddy 打造双工作台夺冠", "source": "X：Tencent WorkBuddy (@WorkBuddy_AI)", "sourceUrl": "https://x.com/WorkBuddy_AI/status/2102408590661501422", "date": "2026-09-22T14:44:03.000Z", "summary": "港科大 Anchor 团队凭 WorkBuddy 打造的两个生产级工作台夺得 Game Track 冠军。其中 Kaiwu Producer 支持全流程 3D 游戏创作，内置 AI 驱动的叙事记忆引擎，8 小时零人工干预生成一款完整 FPS 游戏。另一工作台 Anchor 是去标签化叙事引擎，可自动检测刻板化依赖。", "type": "paper", "relTime": "2天前"}, {"id": 69, "title": "腾讯混元 Hy Image3.5 preview 上线 Miora，限时免费开放", "source": "X：腾讯混元 (@TencentHunyuan)", "sourceUrl": "https://x.com/TencentHunyuan/status/2102388525035643316", "date": "2026-09-22T13:24:19.000Z", "summary": "腾讯混元 Hy Image3.5 preview 上线 Miora，10 月 7 日前免费使用。编辑功能保留画面中已有效的部分，同一画布并记住已有品牌规则，支持文生图和图生图，最高 2K，可用于广告视觉、产品场景、分镜和游戏概念。", "type": "product", "relTime": "2天前"}, {"id": 70, "title": "Adobe Premiere 移动版登陆谷歌 Play 商店，安卓手机可免费剪辑并导出 4K 视频", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/005/958.htm", "date": "2026-09-22T13:18:00.000Z", "summary": "Adobe Premiere 移动应用 9 月 22 日正式登陆安卓平台，此前 iOS 版已上线一年多，应用可免费下载。分割、修剪、合并、调速度、加文字和旁白等剪辑功能免费，无需付费即可不限次数导出无水印 4K 视频；音效创建和 Adobe Firefly AI 生成素材等需购买生成式 AI 点数，后续还将加入 Adobe Fonts、增强型字幕和与桌面版无缝衔接功能。", "type": "paper", "relTime": "2天前"}, {"id": 71, "title": "腾讯混元发布 Hy Image3.5 preview，人评胜率较 Hy Image3.0 提升 30%", "source": "X：腾讯混元 (@TencentHunyuan)", "sourceUrl": "https://x.com/TencentHunyuan/status/2102324577976426830", "date": "2026-09-22T09:10:13.000Z", "summary": "腾讯混元发布 Hy Image3.5 preview，主打专业级图像生成，在对比 Hy Image3.0 的人类评测中胜率提升 30%。支持文生图与图生图，最高 2K 分辨率，一致性更好；Tencent Cloud API 定价每张 0.024 美元，参考图不收费，OnSolo 与 Miora 内可免费试用两周。", "type": "product", "relTime": "2天前"}, {"id": 72, "title": "爱奇艺官宣首部演员授权 AI 长剧《不羡鸳鸯只羡仙》，由沈羽洁、陈鹤一主演", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/005/847.htm", "date": "2026-09-22T09:04:52.000Z", "summary": "爱奇艺官宣超长真人出演 AI 季播剧《不羡鸳鸯只羡仙》，由沈羽洁、陈鹤一领衔主演，两位演员以 AI 生成形象在预热视频中露面，视频发布后相关话题登上微博热搜，不少网友表示观感诡异。", "type": "industry", "relTime": "2天前"}, {"id": 73, "title": "SkyProduction 天工工作台首发短剧质检功能，覆盖字幕、音画、内容底线三大维度", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI1MzE1NDc3Mg%3D%3D&mid=2247510414&idx=1&sn=110b11820c6e5a921a7f5e71a057a9ff", "date": "2026-09-22T08:40:16.000Z", "summary": "SkyProduction（天工工作台）9月22日上线短剧质检功能，上传成片和字幕即可从字幕、音画、内容底线三个维度逐集自动检测，输出可下载、可回填的质检报告。该功能覆盖三十多个检查项，按视频时长和勾选维度计费，每100分钟三项全开约12.41元，官方称业界主流竞品尚无一家将其产品化。", "type": "product", "relTime": "2天前"}, {"id": 74, "title": "LG AI Research 的 MCFlow 被 ICML 2026 接收，单一模型统一三类晶体生成任务", "source": "LG AI Research：官方研究博客", "sourceUrl": "https://www.lgresearch.ai/blog/view?seq=695", "date": "2026-09-22T08:39:47.054Z", "summary": "LG AI Research 提出 Multimodal Crystal Flow（MCFlow），将原子种类与晶体结构视为两种独立模态并分配各自的生成时间变量，用单一模型同时完成成分到结构预测、全新成分与结构生成 , "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2102245699870179611", "date": "2026-09-22T03:56:47.000Z", "summary": "Hunyuan 3.5（腾讯最新的图像生成模型）在参考遵循和保持图像精致度方面确实相当不错，尤其是在 2K 分辨率下。  OnSolo 让每次生成只需 1 credit，便宜到可以反复迭代，而不用对每个提示词反复斟酌。", "type": "model", "relTime": "2天前"}, {"id": 81, "title": "阿里公布大模型进展：Qwen4 训练中，后继模型将扩展至 5-10T 参数", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/005/633.htm", "date": "2026-09-22T03:41:58.000Z", "summary": "阿里巴巴在 2026 云栖大会公布大模型一系列进展：Qwen4 已在训练中，未来 Qwen4.5、Qwen5 等版本将扩展至 5-10T 参数，下一代视频生成模型将于 11 月发布。", "type": "industry", "relTime": "2天前"}, {"id": 82, "title": "面壁 MiniCPM-o 4.5 驱动机器人实时感知", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2102233702353035511", "date": "2026-09-22T03:09:06.000Z", "summary": "太棒了！用 Pi Zero 跑完整感知栈，实时驱动 MiniCPM-o4.5，这是个非常酷的用例。很喜欢看到与个人机器人的实时互动！  我给机器人装上了眼睛和耳朵。我接了一个 Raspberry Pi Zero W2（摄像头 + 环境麦克风），与本地 PC 上运行的 MiniCPM-o 4.5 @OpenBMB 开源模型实时双向传输音视频。零云端 API，全双工交互。项目在我的 git 上", "type": "model", "relTime": "2天前"}, {"id": 83, "title": "腾讯混元发布 Hy Image3.5 preview 图像生成模型", "source": "X：腾讯混元 (@TencentHunyuan)", "sourceUrl": "https://x.com/TencentHunyuan/status/2102226552310419473", "date": "2026-09-22T02:40:42.000Z", "summary": "腾讯混元推出 Hy Image3.5 preview，定位专业级图像生成，人评胜率较 Hy Image3.0 提升 30%。支持文生图与图生图，最高 2K 分辨率，一致性更好；Tencent Cloud API 定价 $0.024 每张，参考图不收费，Miora 和 OnSolo 提供两周免费。", "type": "model", "relTime": "2天前"}, {"id": 84, "title": "Snapchat Lens+ 订阅更新：聊天消息可转原创短歌曲等生成式 AI 功能", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/005/564.htm", "date": "2026-09-22T02:09:22.000Z", "summary": "Snap 为 Snapchat Lens+ 订阅服务新增多项生成式 AI 功能，用户长按聊天文字消息、选择流行或摇滚等风格并点击\"Create Song\"，即可生成原创短歌曲，试听后发送。同时上线 AI Remix、AI 增强字体、Imagine Lens 和 AI Clips（照片转 5 秒高清视频）。Lens+ 每月 7.99 美元，AI 功能按次消耗固定月度额度，用尽需等下一计费周期重置。", "type": "paper", "relTime": "2天前"}, {"id": 85, "title": "Robin Williams 女儿 Zelda 呼吁粉丝停止制作其父 AI 视频：有点羞耻心", "source": "Hacker News：AI 热帖", "sourceUrl": "https://variety.com/2026/film/news/robin-williams-daughter-ai-videos-1236871568", "date": "2026-09-22T01:24:49.000Z", "summary": "Robin Williams 的女儿 Zelda Williams 在 X 发文，要求粉丝停止传播一段用 AI 生成的其父视频，称该视频\"明显是 AI，甚至算不上逼真\"，声音机械糟糕。", "type": "paper", "relTime": "2天前"}, {"id": 86, "title": "HARMONY：面向单目图像到场景合成的分层智能体推理框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.26793", "date": "2026-09-22T00:00:00.000Z", "summary": "HARMONY 是一个分层链式推理框架，结合智能体推理与视觉几何基础模型，从单张室内图像重建完整 3D 场景。它先校准相机建立空间坐标系，再用 VLM 推理恢复房间布局并按墙面元素、独立家具、家具上装饰物的层级顺序放置物体，配合深度优先遍历与反思反馈回路避免误差累积，每次放置后用点云估计做几何精修。", "type": "model", "relTime": "3天前"}, {"id": 87, "title": "索尼 SIE 申请 AI 自修复系统专利：实时生成诊断固件修复 PlayStation 故障", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/005/501.htm", "date": "2026-09-21T23:28:47.000Z", "summary": "索尼 SIE 提交了一项基于 AI 的 PlayStation 自动诊断与修复系统专利，由 AI 服务器在检测到软件问题后实时生成针对性诊断固件并直接部署到故障主机，以减少保修申请和客服工单。专利同时指出，AI 生成的固件补丁可能带有缺陷导致设备变砖，且云端集中部署存在服务器被攻击后向大量设备推送恶意固件的风险。该方案目前仅为探索中的技术方案，尚不代表会实际应用。", "type": "paper", "relTime": "3天前"}, {"id": 88, "title": "小米 MiMo-V2.6 系列三款模型上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2102142830034698644", "date": "2026-09-21T21:08:01.000Z", "summary": "小米 MiMo-V2.6 系列三款模型上线 OpenRouter，包括 1T+ 参数旗舰、开源 MoE 模型和约 10 倍速的旗舰变体。三款模型均支持文本、图像、视频和音频输入，上下文为 1M。", "type": "model", "relTime": "3天前"}, {"id": 89, "title": "人类视频预训练机器人：经验密度比时长更关键", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2102124101490065773", "date": "2026-09-21T19:53:36.000Z", "summary": "人类视频正成为机器人预训练的重要数据来源，但需先将人类经验转化为机器人自身的身体与动作再训练才更有效。@MaxinsightsAI 已录制 200 万小时第一人称人类经验，并提出有效经验 ≈ 时长 × 每小时信息量，主张从\"经验规模\"和\"经验密度\"两个轴扩展。经验密度来自保留每次演示中的接触位置、物体运动、力与抓取、几何、时序及工具使用等物理信息。", "type": "paper", "relTime": "3天前"}, {"id": 90, "title": "Viggle 发布 PINOC MCP：面向 AI 智能体的角色动画引擎", "source": "X：Viggle AI (@ViggleAI)", "sourceUrl": "https://x.com/ViggleAI/status/2102109528691277923", "date": "2026-09-21T18:55:41.000Z", "summary": "Viggle 发布 PINOC MCP，定位为 AI 智能体的角色动画引擎，智能体在搭建游戏或 3D 场景后调用 PINOC 生成已绑定骨骼的动画 Gaussian splat 角色。它还支持用文生动作、视频转 mocap 或预设动作库驱动自有 mesh；引用推文称整条宣传视频（含屋顶跑酷游戏）由 GPT-6 Astra 加 PINOC MCP 制作。", "type": "paper", "relTime": "3天前"}, {"id": 91, "title": "Pexo 推出 Mark to Fix 视频修改工作流", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2102102866689458190", "date": "2026-09-21T18:29:13.000Z", "summary": "Pexo 的 Mark to Fix 工作流允许用户在视频帧上框选区域并说明需要修改的内容，让 AI 智能体有明确的修改目标。该产品定位为 AI 视频智能体，用户可像在文档里留评论一样标记视频并告知修改需求，无需复杂提示词或学习新工具。官方演示视频中的画面、动态图形、音乐、字幕和配音均由 Pexo 生成。", "type": "product", "relTime": "3天前"}, {"id": 92, "title": "小米 MiMo-V2.6 生成能力抢先看", "source": "X：小米 MiMo (@XiaomiMiMo)", "sourceUrl": "https://x.com/XiaomiMiMo/status/2102093582891147339", "date": "2026-09-21T17:52:19.000Z", "summary": "在见到 MiMo-V2.6 之前，先走进它的世界。  MiMo Gallery 里的每一个 3D 模型、游戏、幻灯片、视频、音乐和图像，都由 MiMo-V2.6 生成。  留下来听听钢琴。玩一局游戏。看一场烟花。  抢先一睹即将到来的内容：https://mimo.xiaomi.com/mimo-gallery/", "type": "model", "relTime": "3天前"}, {"id": 93, "title": "美财政部长 Scott Bessent 称 AI 实验室须自行承担责任，政府不会代为兜底", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2102087526081315137", "date": "2026-09-21T17:28:15.000Z", "summary": "美国财政部长 Scott Bessent 对 CNBC 表示，AI 实验室需要自行承担责任，政府不会替它们免责，实验室随时可以选择放慢速度。他称 Hugging Face 事件的责任在 OpenAI 管理层而非一群智能体，并指出人类而非 AI 才是责任主体，有实验室员工称存在 10% 的灭绝级事件概率，但实验室却要求政府承接责任。完整视频见 CNBC Television YouTube 频道。", "type": "tip", "relTime": "3天前"}, {"id": 94, "title": "阿里通义千问发布 Qwen-Image-2.1：7B 开源权重图像生成与编辑模型", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/21/alibaba-qwen-releases-qwen-image-2-1", "date": "2026-09-21T16:40:44.000Z", "summary": "阿里 Qwen 团队发布 Qwen-Image-2.1，将文生图与图像编辑统一到一个 7B 单流 DiT 模型中，搭配 8B Qwen3-VL 编码器，支持原生 RGBA 透明输出和最多 10 张参考图编辑。", "type": "model", "relTime": "3天前"}, {"id": 95, "title": "Krea Agent 现已支持 MCP", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2102073752142090367", "date": "2026-09-21T16:33:31.000Z", "summary": "Krea Agent 现已通过 MCP 提供。  你现在可以直接通过你的智能体工作流生成素材、自动化视频流水线，并运行创意迭代循环。  立即试用 👇", "type": "paper", "relTime": "3天前"}, {"id": 96, "title": "Perplexity Computer 接入 MiniMax H3 与 Seedance 2.5", "source": "X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)", "sourceUrl": "https://x.com/AravSrinivas/status/2102073431449817200", "date": "2026-09-21T16:32:15.000Z", "summary": "Perplexity Computer 现已支持用 MiniMax H3 和字节跳动 Seedance 2.5 生成视频，Pro 和 Max 订阅用户可直接使用。用户在同一对话线程中请求营销短片、产品演示或社交素材，即可在文案与创意内容旁直接产出成片，适合需要多种工具协同的网页应用与创意素材工作流。", "type": "product", "relTime": "3天前"}, {"id": 97, "title": "Perplexity Computer 接入 MiniMax H3 与 Seedance 2.5 生成视频", "source": "X：Perplexity (@perplexity_ai)", "sourceUrl": "https://x.com/perplexity_ai/status/2102071798179434966", "date": "2026-09-21T16:25:45.000Z", "summary": "Perplexity Computer 现在可以使用 MiniMax H3 和 ByteDance Seedance 2.5 生成视频。  向 Computer 提出制作宣传短片、产品演示或社交素材的需求，它会在同一对话中连同文案和创意一起产出成片。  现已面向 Pro 和 Max 订阅用户开放。", "type": "product", "relTime": "3天前"}, {"id": 98, "title": "字节跳动发布 Dramagic，覆盖短剧从剧本到成片的 AI 全流程制作平台", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/bytedance-launches-dramagic-a-full-pipeline-ai-platform-for-producing-short-dramas-from-script-to-screen", "date": "2026-09-21T16:01:31.000Z", "summary": "字节跳动推出 AI 短剧与视频制作平台 Dramagic，覆盖剧本分析、角色创建、分镜到视频预览的全流程，支持多人协作并内置一致性检查，通过企业平台 BytePlus 销售。据中国网络视听协会数据，2026 年一季度中国上线约 12.8 万部短剧，为上一年全年总量的三倍，其中 95% 由 AI 生成；清华大学教授沈阳估算 AI 视频每分钟成本为 90 至 120 美元，约为传统制作成本的十分之一。", "type": "paper", "relTime": "3天前"}, {"id": 99, "title": "The Claude Delusion：当 AI 对话让人产生幻觉的是我们自己？", "source": "Hacker News：AI 热帖", "sourceUrl": "https://pluralistic.net/2026/09/21/sunsetting", "date": "2026-09-21T14:30:24.000Z", "summary": "针对\"The Claude Delusion\"一文，作者提出一个反问：如果产生幻觉的是人类自己呢？文章认为，人类天生会为所见之物寻找意图，因此面对 AI 生成的文字或图像时，会不由自主地将其当作有意图的对话者，但这类系统只是基于海量语料做无理论的统计推断，无法形成意图。与 AI 对话，本质上是在与一个比小说虚构人物更不真实的角色交谈。", "type": "paper", "relTime": "3天前"}, {"id": 100, "title": "Higgsfield AI 借助 GPT-6 Astra 一天内上线新视频功能", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "sourceUrl": "https://openai.com/index/higgsfield-from-prompt-to-production-with-astra", "date": "2026-09-21T12:00:00.000Z", "summary": "Higgsfield AI 借助 GPT-6 Astra 在一天内交付新的视频探索功能，且仅由一名工程师完成。该模型的长程任务规划能力可跨多步骤安排工作，帮助 Higgsfield 更快将创意工具推向市场。用户只需一句提示词，就能把一条表现最佳的广告生成 100 个新变体，并按不同国家定制，方便小企业制作视频广告。", "type": "model", "relTime": "3天前"}, {"id": 101, "title": "阿里云 Model Studio 一站式接入顶级 AI 模型", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2101994660671467833", "date": "2026-09-21T11:19:14.000Z", "summary": "通过阿里云 Model Studio，在一个平台即可访问所有顶级 AI 模型。可使用 Qwen、DeepSeek、Kimi & GLM 等领先推理模型进行构建，还有 Wan & HappyHorse 等视觉利器，支持文生图与视频。  立即开始构建：https://click.alibabacloud.com/m/20000003027/  #AlibabaCloud #AlibabaClou...", "type": "model", "relTime": "3天前"}, {"id": 102, "title": "Jev × Tripo × Astra 联动演示：Tripo P2.0 生成 3D 资产与 VRM 模型", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2101988205642092805", "date": "2026-09-21T10:53:35.000Z", "summary": "Jev × Tripo × Astra 联动 Demo 展示了用 Tripo P2.0 生成 3D 资产与 VRM 模型、由 Jev 驱动语音激活战斗与逻辑的流畅工作流。Jev 负责地图无限扩展、商人文本谈判判定、战斗自由行动判定及语音动作特效分类，Tripo SmartMesh P2.0 生成随机出现的 NPC/敌人/资产与部分魔法特效资产。10 分钟试玩版链接在推文回复中。", "type": "model", "relTime": "3天前"}, {"id": 103, "title": "Meshy 推出手机应用，拍照即可生成3D模型", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2101982272941392303", "date": "2026-09-21T10:30:01.000Z", "summary": "Meshy 官方宣布 Meshy 应用上线手机端，用户拍下照片即可在几秒内生成3D模型。作者以路边交通锥为例，称早上在人行道拍的照片已在桌面打印出来，并邀请用户下载 Meshy 应用体验。", "type": "model", "relTime": "3天前"}, {"id": 104, "title": "星际飞行、AI 与机器人未来愿景", "source": "@mark_k", "sourceUrl": "https://x.com/mark_k/status/2101948155310829917", "date": "2026-09-21T08:14:27.000Z", "summary": "一个美好的未来愿景，由星际太空飞行、AI 和机器人技术共同实现。  让我们行动起来！🚀", "type": "paper", "relTime": "3天前"}, {"id": 105, "title": "GrokBot 风格角色生成提示词分享", "source": "X：Lauren Tan (@poteto)", "sourceUrl": "https://x.com/poteto/status/2101926376781885949", "date": "2026-09-21T06:47:54.000Z", "summary": "把自己变成 grok @bot  【引用 @Multi_Serio_Ai】：分享一个能生成 GrokBot 风格角色的提示词  https://grokbot-icon-studio.serio-ai.chatgpt.site/  因为不是文件而是长文本无法上传，所以直接以网页应用形式发布。请在以下网站点击复制按钮，粘贴到你们使用的图像生成 AI 中使用", "type": "paper", "relTime": "3天前"}, {"id": 106, "title": "阶跃星辰发布 Step 5 Preview：600B 总参 27B 激活的 MoE 模型，支持 1M 上下文", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/20/stepfun-launches-step-5-preview", "date": "2026-09-21T06:37:18.000Z", "summary": "StepFun 发布面向智能体工作的新旗舰模型 Step 5 Preview，为稀疏 MoE 架构，总参数约 600B、每 token 激活约 27B，支持 1M token 上下文和文本、图像、视频输入，API 定价为每 1M 输入 token $1.00、输出 $2.70。", "type": "model", "relTime": "3天前"}, {"id": 107, "title": "阿里云发布 Qwen-Image-2.1 图像生成模型并开放权重", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2101880701952172276", "date": "2026-09-21T03:46:25.000Z", "summary": "阿里云 Qwen 团队发布 Qwen-Image-2.1 图像生成模型并开放权重，定位为 Qwen-Image 系列中最均衡、高性价比的版本，统一支持生成与编辑。", "type": "model", "relTime": "3天前"}, {"id": 108, "title": "用 Jev 概率 API 拼出的聊天机器人 jevchat：把杰夫变成（很烂的）聊天模型", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://github.com/kyle-pena-nlp/jevchat", "date": "2026-09-21T03:17:09.766Z", "summary": "jevchat 把 Jev 的概率打分接口当作语言模型使用：每一步让 Jev 在给定问题和已生成回复的情况下，为字母表或 token 列表中每个候选符号返回概率，再由采样器归一化后抽取下一个符号，抽到 STOP 即结束。", "type": "model", "relTime": "3天前"}, {"id": 109, "title": "腾讯混元发布 Hy Image3.5 preview 图像生成模型", "source": "腾讯混元：Research（API）", "sourceUrl": "https://hunyuan.tencent.com/research/100119?langVersion=zh", "date": "2026-09-21T02:51:50.000Z", "summary": "腾讯混元发布 Hy Image3.5 preview，支持文生图与图生图、最多 5 张参考图、多轮编辑和最高 2K 分辨率输出，经上百名专业设计师 GSB 盲测对上一代胜率综合提升 30% 以上。", "type": "model", "relTime": "3天前"}, {"id": 110, "title": "SGLang-Diffusion Day-0 支持 Qwen-Image 2.1，支持文生图、多图编辑与透明 RGBA 输出", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2101866688425984233", "date": "2026-09-21T02:50:43.000Z", "summary": "SGLang-Diffusion 发布对 Qwen-Image 2.1 的 Day-0 支持，覆盖文本生成图像、多图编辑和透明 RGBA 输出，单 checkpoint 即可完成。", "type": "paper", "relTime": "3天前"}, {"id": 111, "title": "通义千问发布 Qwen-Image-2.1：7B 单检查点同时支持图像生成与编辑", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2101866671900401913", "date": "2026-09-21T02:50:40.000Z", "summary": "通义千问发布 Qwen-Image-2.1，一个 7B 参数的原生图像生成与编辑模型，生成和编辑共用单一检查点，最多支持 10 张参考图。模型自带提示词增强 LLM，已集成 diffusers 和 ComfyUI，并在 Hugging Face Spaces 提供免安装的浏览器在线 demo：https://huggingface.co/spaces/hugging-apps/qwen-im...", "type": "model", "relTime": "3天前"}, {"id": 112, "title": "B站AI无限竞技场引评测圈关注，vista8整理190个真实任务评测视频", "source": "X：karminski (@karminski3)", "sourceUrl": "https://x.com/karminski3/status/2101845994405274033", "date": "2026-09-21T01:28:30.000Z", "summary": "vista8撰文介绍B站「AI无限竞技场」评测活动，主张用真实场景任务代替刷榜和炫技式评测，让UP主测试AI在屎山代码、量化交易、狼人杀、3D白模等场景的表现，并爬取了40个主题、190个视频、33位UP主、100多个参赛模型的数据放到GitHub。榜单前三为GPT6-Astra、Fable 5.1、GLM-5.3；karminski转发评价B站总算开窍了。", "type": "tip", "relTime": "3天前"}, {"id": 113, "title": "开发者 Shiv 开源 Third Hand：无障碍语义树让 AI 控制电脑进入亚秒级零截屏时代", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2101840703248638126", "date": "2026-09-21T01:07:28.000Z", "summary": "开发者 Shiv 开源工具 Third Hand，用纯文本决策实现 AI 控制电脑，延迟压到亚秒级，0 截屏、0 视觉模型，成本逼近于零。其做法是把视觉识别降维成系统底层无障碍语义树获取控件列表，再接入专做强类型决策的 Jev 在 100 毫秒内完成状态单选，通用大模型只负责拆解长任务，开源仓库链接见评论区。", "type": "tip", "relTime": "3天前"}, {"id": 114, "title": "SVEET：基于双向视频扩散模型的流式视频编辑框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.24788", "date": "2026-09-21T00:00:00.000Z", "summary": "SVEET 提出一种仅需在预训练双向视频扩散模型上训练、即可自回归实现高质量流式视频编辑的框架，核心是骨干特征解耦与条件帧独立两条原则。该方法通过辅助模型分支以时间独立自注意力编码源视频并注入骨干模块，配合解耦训练方案实现零样本知识迁移，在单张 H100 GPU 上无需辅助加速即达 15 FPS。", "type": "model", "relTime": "4天前"}, {"id": 115, "title": "CARE：面向视觉-语言-动作策略的经验引导原子纠错执行", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.24118", "date": "2026-09-21T00:00:00.000Z", "summary": "研究者提出 CARE 框架，通过收集失败 rollout、建模分阶段失败后偏差分布，合成代表性失败状态与纠错示范，提升 VLA 策略偏离标称轨迹后的恢复能力。推理时 CARE 结合分阶段规划与物理落地的 3D 监控，触发原子级调整或重操作。", "type": "paper", "relTime": "4天前"}, {"id": 116, "title": "D-RAC：通过 PDF 归一化与多模态 Markdown 转换实现企业文档的通用检索感知摄取", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.24220", "date": "2026-09-21T00:00:00.000Z", "summary": "D-RAC 将任意格式文档先归一化为 PDF，再用单次多模态 LLM 调用转成检索优化的 Markdown，并按 W-RAC 方式确定性分块。在 RAG-Multi-Corpus 的 236 篇文档、795 页 PDF 子集上，72 分钟零错误生成 1，748 个可检索 chunk。", "type": "paper", "relTime": "4天前"}, {"id": 117, "title": "VideoGen-Agent：用强化学习训练视频生成智能体", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.24997", "date": "2026-09-21T00:00:00.000Z", "summary": "VideoGen-Agent 通过多任务智能体强化学习训练，让多模态智能体调用增强、生成、验证等外部工具完成视频生成。团队同时提出覆盖 600 条提示词的 VABench 基准，该智能体在其上把基础文生视频模型从 56.5 分提升 19.1 分至 75.6；仅升级生成工具、不额外训练智能体即可进一步升至 86.1，人类评审在 84.3% 的对比中更偏好升级后的配置。", "type": "model", "relTime": "4天前"}, {"id": 118, "title": "WorldCrafter：具备隐式 3D 感知记忆的一致视频世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.24984", "date": "2026-09-21T00:00:00.000Z", "summary": "WorldCrafter 是一个视频世界模型，通过可相机查询的隐式 3D 感知记忆，解决长时程与跨视角下难以保持历史观测一致的问题。其记忆编码器与姿态条件读取模块与视频生成器联合训练，在去噪前将历史观测压缩为固定数量的目标视角专属 token，无需显式深度对应。结合近期时序上下文与少步蒸馏，该模型可从单张图像或文本提示实现流式场景探索，在静态与动态场景中显著提升长时程一致性与相机控制精度。", "type": "model", "relTime": "4天前"}, {"id": 119, "title": "ImIR：用图像指令微调实现全能图像修复", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.25267", "date": "2026-09-21T00:00:00.000Z", "summary": "ImIR 提出用退化图像自身生成的图像指令替代文本提示，通过 VAE 保留结构、轻量 token mapper 将退化图像的视觉-语言嵌入向干净图像的嵌入偏移，从而驱动图像编辑模型完成修复。", "type": "model", "relTime": "4天前"}, {"id": 120, "title": "ScriptMoE：脚本感知 MoE 实现全合一多语言场景文本识别", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.24058", "date": "2026-09-21T00:00:00.000Z", "summary": "研究团队提出 ScriptMoE，一种脚本感知的 MoE 架构，共享单一视觉编码器并用稀疏 MoE 块替换密集解码器，由图像级路由器将每张图分发给 top-2 脚本对齐专家，另设共享专家吸收跨脚本知识。", "type": "paper", "relTime": "4天前"}, {"id": 121, "title": "RULER：面向 SVG 生成的实例感知评分标准奖励", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.25270", "date": "2026-09-21T00:00:00.000Z", "summary": "RULER 用实例感知评分标准为 SVG 生成提供强化学习奖励，无需配对 SVG 真值或人工偏好标注。它把每条指令转成覆盖语义、视觉、风格三个维度的六项评分标准，由 judge VLM 对渲染结果逐项打分，加权满意度经 GRPO 优化。", "type": "paper", "relTime": "4天前"}, {"id": 122, "title": "Ovis-Embedding：推进通用全模态嵌入的前沿", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.25165", "date": "2026-09-21T00:00:00.000Z", "summary": "Ovis-Embedding 是一个基于共享多模态骨干的全模态嵌入模型家族，用预训练的 Qwen-omni 作为嵌入骨干，通过低秩初始化的对比训练统一编码文本、图像、视频和音频。", "type": "model", "relTime": "4天前"}, {"id": 123, "title": "GAE：为 3D 一致世界生成学习几何原生隐空间", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.24981", "date": "2026-09-21T00:00:00.000Z", "summary": "研究者提出几何原生自编码器（GAE），将几何基础模型的特征重参数化为紧凑隐空间，其隐变量可联合解码为外观、深度、相机和点图。在固定生成器与训练协议的对照实验中，替换为 GAE 隐空间后，RealEstate10K 和 DL3DV 上的 FVD 分别下降 12.7% 和 23.1%，RealEstate10K 的相机轨迹误差减半。", "type": "model", "relTime": "4天前"}, {"id": 124, "title": "HyperQ：为冻结的扩散语言模型加量子残差分支的 Circuit Hypernetworks", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.24657", "date": "2026-09-21T00:00:00.000Z", "summary": "HyperQ 在冻结的掩码扩散语言模型每个 transformer block 中加入 token 条件化的量子残差分支，由轻量级 circuit hypernetwork 生成 token 专属的旋转角、耦合强度与测量轴，仅训练新增分支。", "type": "model", "relTime": "4天前"}, {"id": 125, "title": "X-Planner：面向具身智能的事件结构化任务规划", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.25187", "date": "2026-09-21T00:00:00.000Z", "summary": "X-Planner 是一个面向具身推理的规划前端，用事件结构化方案同时解决监督与表示问题。其规划数据整合 Ego、UMI 与遥操作数据并按来源区分标注深度，模型侧共享 VLM 主干提供离散事件状态与经 Staircase Decoding 传递连续 CoT 状态的隐式接口两种规划形式。", "type": "model", "relTime": "4天前"}, {"id": 126, "title": "HappyWorld-Bench：面向视频、空间与具身世界模型的统一评测基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.24308", "date": "2026-09-21T00:00:00.000Z", "summary": "HappyWorld-Bench 是一个评估生成世界在智能体交互下是否可靠的综合基准，覆盖视频、空间、具身三条评测轨道，包含 1，138 条视频提示词、300 个空间场景和 254 个具身测试用例。", "type": "model", "relTime": "4天前"}, {"id": 127, "title": "我国首款藏语多语言全模态 AI 输入法发布，覆盖手机、电脑等全终端", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/005/027.htm", "date": "2026-09-20T23:50:15.000Z", "summary": "藏语智能全国重点实验室研发的智达 AI 输入法正式发布，这是中国首款藏语多语言全模态 AI 输入法，覆盖手机、电脑等全终端，支持文字、语音、图像多模态输入。其语音输入覆盖卫藏、安多、康巴三大方言，词库涵盖 23 个学科术语，配套藏文字体集同步公开。发布会上还展示了智达大模型，共 9 个版本，参数规模覆盖 8 亿至 1000 亿，支持 56 种语言互译及图像、视频理解。", "type": "model", "relTime": "4天前"}, {"id": 128, "title": "ScrollEd 想把教科书变成 TikTok 式信息流", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/20/scrolled-wants-to-turn-textbooks-into-tiktok", "date": "2026-09-20T18:00:00.000Z", "summary": "帕洛阿尔托初创公司 ScrollEd 推出应用，可将 PDF、教科书等任意文本文件转成类似 Instagram Reels 或 TikTok 的竖屏信息流，内容以 AI 生成的视频、音频、文本或互动测验呈现，上滑换主题、侧滑深入，末尾附测验。", "type": "paper", "relTime": "4天前"}, {"id": 129, "title": "阿里 Qwen 团队发布开源权重图像生成模型 Qwen-Image-2.1，仅 7B 参数", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/alibabas-open-weight-qwen-image-2-1-claims-to-beat-closed-models-in-image-generation-with-just-7-billion-parameters", "date": "2026-09-20T16:10:52.000Z", "summary": "阿里 Qwen 团队发布开源权重图像生成与编辑模型 Qwen-Image-2.1，视觉生成部分仅 7B 参数，团队称在其自建基准上超过多数闭源模型，独立基准尚待验证，可在 RTX 3090 等消费级 GPU 上运行。", "type": "model", "relTime": "4天前"}, {"id": 130, "title": "你能分辨出哪些图片是AI生成的吗？", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://slop-sense.labtoagi.com/games/is-this-image-ai", "date": "2026-09-20T15:44:20.618Z", "summary": "一个限时小游戏让玩家在 60 秒内判断图片是真实照片还是 AI 生成，每张图有 10 秒作答时间。游戏在计时开始前会先加载首批图片，考验用户凭直觉识别 AI 图像的能力。", "type": "paper", "relTime": "4天前"}, {"id": 131, "title": "基于对话的 LLM 复制了通灵师的冷读骗术：LLMentalist 效应", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://softwarecrisis.dev/letters/llmentalist", "date": "2026-09-20T15:28:23.669Z", "summary": "作者提出 LLMentalist 效应，认为聊天机器人给人的智能印象源于通灵师冷读术的同款机制，即主观验证和 Forer 式验证语句，让统计上泛泛的回答显得专为用户而写。文章将通灵骗术的六个步骤逐一映射到聊天机器人场景，并认为 RLHF 无法针对具体事实给出奖励，实际上优化出的是擅长生成验证语句的机械通灵师；作者判断这种错觉是无意造成的，并建议不要将决策和推理交给聊天机器人。", "type": "tip", "relTime": "4天前"}, {"id": 132, "title": "Claude 缺图像生成器的短板", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2101683717571784879", "date": "2026-09-20T14:43:40.000Z", "summary": "Claude 没有图像生成器，这是涉及知识工作的智能体项目中的一大缺口。它很擅长用代码来绘制或建模物体，但 Google 和 OpenAI 的图像生成器为其 AI 提供了更多选项，可用于制作 PowerPoint、模型图、信息图等。", "type": "model", "relTime": "4天前"}, {"id": 133, "title": "Meshy 插件上线 ChatGPT", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2101683299550925127", "date": "2026-09-20T14:42:00.000Z", "summary": "Meshy 插件，现已登陆 ChatGPT。🪑  生成 → 描述部件，Astra 调用 Meshy，模型直接在对话中返回 拆分 → Part Segmentation API 将其拆分为框架、座面、靠背、横杆 交付 → Astra 构建网站，每个部件可拖拽旋转  一个家具目录，从提示词到可浏览，一次会话搞定。", "type": "model", "relTime": "4天前"}, {"id": 134, "title": "Qwen 开源 Qwen-Image-2.1：7B 视觉生成组件统一图像生成与编辑", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://qwen.ai/blog?id=qwen-image-2.1", "date": "2026-09-20T14:40:14.401Z", "summary": "Qwen 开源 Qwen-Image-2.1，在单一模型中统一文生图与图像编辑，视觉生成组件仅 7B 参数，并原生支持透明图像的生成与编辑。模型支持最多 10 张参考图、圆圈涂画和独立掩码指定局部编辑，通过混合粒度注意力与 KV cache 复用提升推理效率，并改进了文字排版、人像光照和人物产品一致性。", "type": "model", "relTime": "4天前"}, {"id": 135, "title": "Qwen-Image-2.1 开源：7B 图像生成与编辑模型", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2101679965590769872", "date": "2026-09-20T14:28:45.000Z", "summary": "阿里 Qwen 团队发布并开源 Qwen-Image-2.1，一个 7B 的图像生成与编辑统一模型。官方称其推理速度大幅加快，可原生生成和编辑 RGBA 透明图层，支持最多 10 张参考图和精准局部编辑，覆盖全景图、信息图和虚拟试穿等场景。", "type": "model", "relTime": "4天前"}, {"id": 136, "title": "剪映发布会推出剪映Hub与小映AI Agent，并上线AI Ultra会员", "source": "X：汗青 HQ (@hq4ai)", "sourceUrl": "https://x.com/hq4ai/status/2101675942099976459", "date": "2026-09-20T14:12:46.000Z", "summary": "剪映在创作者大会现场发布剪映Hub，由无限画布与多轨道编辑器构成，可从一句话、参考视频或文档出发，整合即梦、小云雀等平台生成的资产，并上线将AI创作积分与SVIP权益合并订阅的AI Ultra会员。同时推出剪映自己的AI Agent小映，从创作热点到决策给出建议。", "type": "paper", "relTime": "4天前"}, {"id": 137, "title": "GPT-Image 2.5 像素画生成", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2101672783793226136", "date": "2026-09-20T14:00:13.000Z", "summary": "GPT-Image 2.5 在像素画上强得离谱  用 GPT-Image 2.5 生成的 4×4 sprite sheets，在 PixVerse 上用 Seedance 2.5 做成动画  在 Pixverse 上无限畅用 GPT-Image 2.5↓", "type": "paper", "relTime": "4天前"}, {"id": 138, "title": "Qwen-Image-2.1 已支持 ComfyUI，开源权重开放下载", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2101670814953455780", "date": "2026-09-20T13:52:24.000Z", "summary": "Qwen 宣布 Qwen-Image-2.1 现已支持 ComfyUI，权重开放。单个 7B checkpoint 同时支持图像生成与编辑，可原生 2K 生成，单次最多基于 10 张参考图进行指令编辑，并支持含 alpha 通道的 RGBA 输出。", "type": "model", "relTime": "4天前"}, {"id": 139, "title": "通义千问发布 Qwen-Image-2.1，vLLM-Omni 提供首日支持", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2101670804794884242", "date": "2026-09-20T13:52:21.000Z", "summary": "通义千问发布 Qwen-Image-2.1，vLLM-Omni 提供 day-0 支持。该模型可在一个模型内完成图像生成、编辑和透明图像输出，由 7.1B DiT 搭配 Qwen3-VL-8B 组成，设置和受支持的组合见 https://recipes.vllm.ai/Qwen/Qwen-Image-2.1。", "type": "model", "relTime": "4天前"}, {"id": 140, "title": "通义千问发布 Qwen-Image-2.1 并开放权重", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2101659302792679789", "date": "2026-09-20T13:06:39.000Z", "summary": "通义千问发布 Qwen-Image-2.1，定位为 Qwen-Image 系列中均衡且高性价比的图像生成模型，现已开放权重。该模型为生成与编辑一体化的 7B 轻量架构，原生支持生成和编辑 RGBA 透明图层，编辑支持最多 10 张参考图和精确局部控制，并擅长全景图、信息图和虚拟试穿等场景。", "type": "model", "relTime": "4天前"}, {"id": 141, "title": "阿里千问开源 Qwen-Image-2.1 图像模型，支持透明图像与最多 10 张参考图", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/004/989.htm", "date": "2026-09-20T13:02:23.000Z", "summary": "阿里千问开源图像模型 Qwen-Image-2.1，将文生图与图像编辑整合在同一模型中，视觉生成部分仅 7B 参数，原生支持透明图像的生成与编辑。更新亮点包括轻量结构与推理优化、支持最多 10 张参考图的局部编辑与人像商品保真，以及文字排版和人物光影表现提升，模型已上架 GitHub、HuggingFace 和 ModelScope。", "type": "model", "relTime": "4天前"}, {"id": 142, "title": "Runway 公布实时视频生成研究：边描述提示词边流式生成", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/runway-wants-to-turn-ai-video-generation-into-a-live-stream-you-control-in-real-time", "date": "2026-09-20T11:56:59.000Z", "summary": "Runway 公布实时视频生成研究，用户可在描述提示词的同时流式生成视频，而非输入提示后等待成品。该方案基于其首个 General World Model GWM-1（构建于 Gen-4.5 之上，逐帧生成，支持镜头运动、机器人指令或音频控制），通过用自身输出训练模型来抑制误差累积。", "type": "model", "relTime": "4天前"}, {"id": 143, "title": "启元机器人发布启元 Q1 和 T1 人形机器人，首发接入腾讯 WorkBuddy", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/004/871.htm", "date": "2026-09-20T08:36:05.000Z", "summary": "启元机器人在 2026 全球产品发布会上发布启元 Q1 和启元 T1 两款消费级人形机器人，两款产品已于 8 月 23 日开启预订。启元 Q1 主打自定义，身高 88 厘米、可折叠放入背包，支持外观定制、3D 打印改造、性格与语音调整；启元 T1 支持轮足人形与四足形态切换。", "type": "product", "relTime": "4天前"}, {"id": 144, "title": "Eric Schmidt：AI 智能体将让用户界面消失", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2101524067715256368", "date": "2026-09-20T04:09:16.000Z", "summary": "前 Google CEO Eric Schmidt 认为用户界面将基本消失，因为智能体懂自然语言，用户可直接对话描述需求，UI 可按需生成。推文进一步指出，机器人流量已超过人类活动，未来 90% 以上的网络流量可能来自非人类，网站或将退化为供智能体查询的数据库。", "type": "paper", "relTime": "4天前"}, {"id": 145, "title": "生数科技入选2026北京民营企业科技创新百强与未来产业先锋榜", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489273&idx=1&sn=4f879a6aedfb68e0c923461a9d305cff", "date": "2026-09-20T04:04:03.000Z", "summary": "生数科技入选\"2026北京民营企业100强\"系列榜单中的\"科技创新百强\"和首次发布的\"未来产业先锋榜\"，成为唯一同时入选两项榜单的通用世界模型企业。其Vidu Q3 是全球首个支持 16 秒声画同出的视频生成模型，Vidu S2 含 S2-Avatar 与 S2-Editing 两个模型，Motus2 则将策略、世界模拟与价值评估纳入统一的视频-动作模型。", "type": "model", "relTime": "4天前"}, {"id": 146, "title": "Ethan Mollick 测试 Astra 解谜并生成视频", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2101517626954436623", "date": "2026-09-20T03:43:41.000Z", "summary": "Ethan Mollick 向 Astra 提出与 Claude 相同的问题--选一个困扰自己的谜题并尽力解决，再生成一段可分享的视频，Astra 给出了流畅的结果。Astra 的展示内容均来自其实际模拟，但相比 Fable，它表现出更少的模拟好奇心，似乎对结果不那么\"感兴趣\"。", "type": "paper", "relTime": "4天前"}, {"id": 147, "title": "Tripo 浏览器打造虚拟 iPhone Duo 体验", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2101507167027351947", "date": "2026-09-20T03:02:07.000Z", "summary": "我们在浏览器里打造了一个虚拟 iPhone Duo 体验。  从一张平面的 2D 旅行照片，变成一个完全可交互的 3D 弹出式体验。  技术栈：Tripo 生成了核心 3D 模型，GPT-6 Astra 负责基础网格、材质和 WebGL 交互。  最终，折叠屏不只是一块显示屏--它是通往空间记忆的真正入口。  链接和提示词见下方 ↓", "type": "model", "relTime": "4天前"}, {"id": 148, "title": "MiniMax 公布全球六大合作案例：M3 落地 Genspark、HUMAIN 与 Nebius", "source": "公众号：MiniMax（稀宇科技）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzE5MTA3NzcxMQ%3D%3D&mid=2247489172&idx=1&sn=30557bf48e47d50a17b22e16ac44efbb", "date": "2026-09-20T01:00:00.000Z", "summary": "MiniMax 披露六项全球合作：Genspark 基于 MiniMax M3 开放权重后训练出 PPT 专用模型 Gen-1 Slides，并成为其 AI Slides 标准模式默认模型，200 个真实生产任务评测中综合与视觉设计得分均列五个参测模型第一，单份生成成本为 Claude Opus 5 的十分之一。", "type": "model", "relTime": "4天前"}, {"id": 149, "title": "Mira-Scene：面向生成式 3D 场景的像素对齐布局框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.23796", "date": "2026-09-20T00:00:00.000Z", "summary": "Mira-Scene 是一个组合式 3D 场景重建框架，用稠密有界的对应关系恢复替代稀疏位姿回归，核心是像素对齐的 Canonical Coordinate Map（CCM），可在无需场景级布局标注的情况下从物体级 3D 数据训练。", "type": "paper", "relTime": "5天前"}, {"id": 150, "title": "Grounded Action Model：以 3D 定位作为机器人基础", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.23863", "date": "2026-09-20T00:00:00.000Z", "summary": "研究者提出 Grounded Action Models（GAMs），一种以 3D 定位构建的机器人基础模型新范式，支持语言、点、框提示并转为以物体为中心的表征，再经多流 Transformer 预测动作块。", "type": "model", "relTime": "5天前"}, {"id": 151, "title": "视频扩散模型为何违反物理规律？揭示注意力机制中的缺陷", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.23658", "date": "2026-09-20T00:00:00.000Z", "summary": "首个针对文生视频扩散模型\"运动规划\"过程的可解释性研究发现，RoPE 导致空间注意力过度衰减，使早期候选区域过早锁定在物理上不合理的位置，抑制相邻帧的合理轨迹并引发生成失败。作者据此提出一种轻量级架构修改，按去噪步数缩放 RoPE 频率，在免训练和基于训练的实验中均提升了生成视频的物理常识。", "type": "model", "relTime": "5天前"}, {"id": 152, "title": "PackLab：面向机器人装箱的 MLLM 开发、训练与评估框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.23784", "date": "2026-09-20T00:00:00.000Z", "summary": "PackLab 是面向闭环机器人装箱的 MLLM 开发、训练与评估框架，包含物理仿真平台 PackLab-Suite、装箱专用模型 PackLab-VLM 和多难度标准化评测 PackLab-Bench。", "type": "model", "relTime": "5天前"}, {"id": 153, "title": "Jev 模型 150ms 语音操控 Mac 实测", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2101327167913107933", "date": "2026-09-19T15:06:52.000Z", "summary": "开发者 @instantricecook 用 150ms 新模型 Jev 把 Mac 改造成纯语音终端，语音指令可在毫秒级直接映射为系统快捷键与坐标操作。Nader Dabit 转发实测后预言，未来 6 到 12 个月内人们将能一整天不碰电脑完成工作。该方案主打消灭 Computer Use 的云端截图延迟，单次前向传播仅 150ms，无需生成多余 Token。", "type": "model", "relTime": "5天前"}, {"id": 154, "title": "Qwen3.8-Omni-Flash 发布，价格低于 Gemini Flash 且多模态基准相当", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/qwen3-8-omni-flash-undercuts-gemini-flash-pricing-while-matching-its-multimodal-benchmarks", "date": "2026-09-19T14:30:57.000Z", "summary": "Qwen 发布首个面向 AI 智能体的多模态模型 Qwen3.8-Omni-Flash，可联合处理音频和视频并自主使用工具，上下文窗口达 100 万 token。", "type": "model", "relTime": "5天前"}, {"id": 155, "title": "美军因AI幻觉情报报告险些登船检查中国船只", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/u-s-military-nearly-boarded-a-chinese-ship-over-a-hallucinated-ai-intelligence-report", "date": "2026-09-19T08:10:55.000Z", "summary": "CNN独家报道称，2026年春美军特种作战司令部一名分析师使用的聊天机器人错误标记一艘中国船只运载核武器零部件，武装人员与飞机已就位，登船前数分钟才发现错误。报道称军内AI生成情报缺乏统一核验标准，系统多为商业产品改版，年轻分析师易不加质疑地信任AI工具。", "type": "tip", "relTime": "5天前"}, {"id": 156, "title": "阿里巴巴达摩院开源医学影像模型 Damo Radar，可识别近150种腹部疾病", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.scmp.com/tech/big-tech/article/3368055/alibaba-open-sources-medical-ai-model-can-detect-cancer-and-nearly-150-conditions", "date": "2026-09-19T06:27:05.174Z", "summary": "阿里巴巴达摩院开源视觉语言模型 Damo Radar，可分析覆盖18个腹部器官的增强CT扫描，识别包括癌症在内的近150种腹部疾病。该模型用CT扫描配对临床报告训练，在近4万例真实检查中对146项临床发现取得平均 AUC 0.913；在26名放射科医生参与的对比研究中，平均准确率超过其中23人，医生借助模型将漏诊预防能力提高10%、耗时减少逾30%。", "type": "model", "relTime": "5天前"}, {"id": 157, "title": "Google Cloud AI Research 发布 ScientistTwo 自主科研智能体框架", "source": "X：DAIR.AI (@dair_ai)", "sourceUrl": "https://x.com/dair_ai/status/2101144299471884479", "date": "2026-09-19T03:00:13.000Z", "summary": "Google Cloud AI Research 发布 ScientistTwo，一个全自动多智能体科研框架，输入人类专家提出的问题后无需干预即可完成从建立 SOTA 基线、生成种子想法、数据子集预筛、消融归因到论文撰写的完整发现循环。", "type": "paper", "relTime": "5天前"}, {"id": 158, "title": "加州大学伯克利分校团队开发含铅墨水检测技术，无需展开即可读取庞贝碳化卷轴文字", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/004/381.htm", "date": "2026-09-19T01:04:08.000Z", "summary": "美国加州大学伯克利分校 Douglas Seiler 团队开发出通过检测含铅墨水痕迹读取庞贝古城碳化卷轴文字的技术，每平方厘米仅含 25 微克铅的墨水也能被 X 射线 CT 和 X 射线荧光技术检出，在 CT 图像中亮度最高可达碳化纸莎草的 25 倍。", "type": "paper", "relTime": "5天前"}, {"id": 159, "title": "万物皆可为麦克风：从芯片袋振动到灯泡光线", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2101106479411687489", "date": "2026-09-19T00:29:56.000Z", "summary": "鉴于有人讨论 AI 通过 CPU 温度波动进行通信，我想到了这个帖子--世界上可恢复的信息比你想象的要多。  【引用 @emollick】：隐私很难。一切都可以是麦克风。你可以从以下来源恢复音频数据： 🛍️视频中芯片袋的振动 💡悬挂灯泡被语音移动时的光线微小波动 🤖扫地机器人的激光雷达光束 🤳手机照片中的自动对焦", "type": "paper", "relTime": "5天前"}, {"id": 160, "title": "UltraTex：用 2K 多视角扩散模型生成 3D 纹理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.23169", "date": "2026-09-19T00:00:00.000Z", "summary": "UltraTex 是一个面向高分辨率多视角扩散 3D 纹理生成的端到端框架，可将工作分辨率从 512/768 提升至 2048。", "type": "model", "relTime": "6天前"}, {"id": 161, "title": "将 VLM 智能迁移至机器人控制：RoboDawn 框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.22966", "date": "2026-09-19T00:00:00.000Z", "summary": "RoboDawn 通过离散平移、旋转和夹爪命令，让智能体式 VLM 以闭环方式控制机器人，并借助上下文学习用少量演示完成界面使用与任务策略落地。在 RoboTwin 2.0 C2R 上，成功率从零样本 53.2% 提升到单样本 73.6%，超过基线 π0.5 的 46.0%；在 RoboDojo 上从 35.67% 提升到 47.17%，且无需针对任务做机器人训练。", "type": "paper", "relTime": "6天前"}, {"id": 162, "title": "RewardVerse：面向视频奖励建模的评分标准引导策略优化", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.22947", "date": "2026-09-19T00:00:00.000Z", "summary": "RewardVerse 提出基于评分标准（rubric）的视频奖励框架，在评估查询与打分器之间引入动态 rubric 作为中间表示，先显式生成评估标准再进行引导式打分，以缓解直接映射单一分数导致的 scalar drift。", "type": "paper", "relTime": "6天前"}, {"id": 163, "title": "Krea Agent 生成视频教程", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2101096225823228020", "date": "2026-09-18T23:49:11.000Z", "summary": "这段视频 100% 由 Krea Agent 生成。  下面教你如何做到 👇", "type": "paper", "relTime": "6天前"}, {"id": 164, "title": "美军分析师用 AI 生成虚假情报报告，险些对中性船只动武", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.cnn.com/2026/09/18/politics/us-military-ai-false-intelligence-china-ship", "date": "2026-09-18T18:48:49.722Z", "summary": "据 CNN 报道，今年春天美国与伊朗战争期间，一名特种作战司令部分析师用聊天机器人整理情报，错误判定一艘中东的中国船只运输核武器项目部件，军方一度准备登船拦截，行动前才发现报告内容完全不实。事件暴露出美军各机构 AI 工具标准不一、缺乏统一的核验规范， analysts 在战争节奏下更快产出错误情报的风险。", "type": "tip", "relTime": "6天前"}, {"id": 165, "title": "MAI-Image-2.6 刷新文生图性价比", "source": "X：Mustafa Suleyman（Microsoft AI CEO） (@mustafasuleyman)", "sourceUrl": "https://x.com/mustafasuleyman/status/2100988409414369475", "date": "2026-09-18T16:40:45.000Z", "summary": "全球图像生成性价比最佳！🔥  生成高质量图像比以往更便宜、更快速。近几周，Muse Image、MAI-Image-2.6 和 GPT Images 2.5 大幅推动了文生图在价格和速度上的帕累托前沿。", "type": "paper", "relTime": "6天前"}, {"id": 166, "title": "GPT Image 2.5 Sunburst 上线 Tripo Studio", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2100963064258732241", "date": "2026-09-18T15:00:03.000Z", "summary": "GPT Image 2.5 Sunburst 现已登陆 Tripo Studio。  更锐利的细节。更自然的光照。更好的参考保持。  生成 → 编辑 → 3D。一站式完成。  立即体验 → https://studio.tripo3d.ai/workspa var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };

function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";

}

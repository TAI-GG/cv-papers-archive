溺水者", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2104293764068159775", "date": "2026-09-27T19:35:03.000Z", "summary": "🇨🇳 中国救援机器人：自主飞向溺水者。  飞行速度约 10–14 m/s（峰值约 30 mph），覆盖范围可达约 2 km / 1.2 英里，降落时为最多两名 80 kg 成年人提供浮力，随后自行返回。", "type": "paper", "relTime": "1天前"}, {"id": 26, "title": "Simon Willison 用 Opus 5.5 开发 Bluesky 回复机器人检测工具", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/27/bluesky-bot-check", "date": "2026-09-27T18:41:44.000Z", "summary": "Simon Willison 用 Opus 5.5 开发了一款 Bluesky 回复机器人检测工具，可检查任意 Bluesky 个人资料是否存在疑似自动回复机器人的迹象。该工具会寻找诸如在他人发帖后数秒内回复、从不发布原创内容或图片链接而只回复高粉丝量用户等信号，同时检测问号，以识别那些浪费他人时间回答无人真正提问的回复机器人。", "type": "paper", "relTime": "1天前"}, {"id": 27, "title": "OpenAI 修复 GPT-6 图像理解 bug", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2104252306447544447", "date": "2026-09-27T16:50:19.000Z", "summary": "我们修复了一个导致 GPT-6 Sol 和 GPT-6 Luna 图像理解能力下降的 bug。现在你在 API 和 Codex 中的视觉任务上应该能看到更好的结果，包括 computer use。", "type": "product", "relTime": "1天前"}, {"id": 28, "title": "OpenAI 修复 GPT-6 图像理解 bug", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2104252025978658890", "date": "2026-09-27T16:49:12.000Z", "summary": "我们修复了一个导致 GPT-6 Sol 和 GPT-6 Luna 图像理解能力下降的 bug。现在你在 API 和 Codex 中的视觉任务上应该能看到更好的结果，包括 computer use。", "type": "product", "relTime": "1天前"}, {"id": 29, "title": "斯坦福与 Caltech 用 GPT-6 Astra 直驱 Unitree G1 机器人整理陌生厨房", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/researchers-plug-gpt-6-astra-directly-into-a-robot-and-let-it-clean-up-an-unfamiliar-kitchen", "date": "2026-09-27T10:59:11.000Z", "summary": "斯坦福和 Caltech 构建了 HomeBody 系统，让 Unitree G1 机器人无需传统训练控制层，由可替换的 VLM（此处为 GPT Astra）直接调用抓取、导航、开抽屉等技能库，自主探索陌生厨房并完成整理和取物。", "type": "paper", "relTime": "1天前"}, {"id": 30, "title": "Google Research MSEB 教程：按基准契约编写声音编码器并跨四类评测打分", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/26/a-coding-guide-to-google-researchs-mseb-writing-sound-encoders-to-the-benchmark-contract-and-scoring-them-across-classification-clustering-retrieval-and-segmentation", "date": "2026-09-27T05:42:35.000Z", "summary": "该教程演示如何按 MSEB 的 MultiModalEncoder 抽象基类编写两个声音编码器，分别测量响度与音色，并在自生成合成音频上运行分类、聚类、检索和分割四类评测器。两个编码器在不同评测器下排名互换，用数字说明多任务基准的必要性。教程基于 mseb 0.1.0，全程 CPU 运行、无需下载数据集。", "type": "paper", "relTime": "1天前"}, {"id": 31, "title": "Simon Willison 用 Claude Opus 5.5 生成鸮鹦鹉像素动画并用 Claude Code 录成视频", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/26/kakapo-party", "date": "2026-09-26T23:39:06.000Z", "summary": "Simon Willison 在 WeAreDevelopers World Congress North America 闭幕主题演讲前，用 Claude Opus 5.5 根据三张鸮鹦鹉照片生成至少 20 只鸮鹦鹉开派对的 HTML 5 canvas 像素动画页面。", "type": "tip", "relTime": "2天前"}, {"id": 32, "title": "Jeff Dean 转发 Claude 生成 Google 历史视频", "source": "X：Jeff Dean (@JeffDean)", "sourceUrl": "https://x.com/JeffDean/status/2103989340485624158", "date": "2026-09-26T23:25:23.000Z", "summary": "很自豪能与许多人合作完成其中的不少工作！  （引用 @deedydas）：claude 刚刚生成了一段关于 Google 历史的 2 分钟视频，效果简直太炸了", "type": "paper", "relTime": "2天前"}, {"id": 33, "title": "Claude Opus 5.5 一条提示词生成递归讲解视频", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2103888590854062435", "date": "2026-09-26T16:45:03.000Z", "summary": "Ethan Mollick 用一条提示词让 Claude Opus 5.5 生成了解释递归的视频，要求每次解释递归都切换截然不同的视频风格，做到自指、巧妙且节奏快，最终实现九次风格切换。他随后又测试了一个真正具有教育性的版本，认为效果相当惊艳：模型在保持多风格约束的同时，用有趣易懂的方式讲清了编程意义上的递归。", "type": "model", "relTime": "2天前"}, {"id": 34, "title": "brumar 开源 Claude Code 国际象棋复盘 Skill，结合 Stockfish 与思考录音生成解说视频", "source": "Hacker News：AI 热帖", "sourceUrl": "https://github.com/brumar/chess-postmortem-skills", "date": "2026-09-26T15:34:53.000Z", "summary": "作者 brumar 发布一套 Claude Code skills，将 lichess 对局结合 Stockfish 引擎生成可读的复盘报告和带旁白的解说视频。", "type": "tip", "relTime": "2天前"}, {"id": 35, "title": "Synthesia 为 TechCrunch 记者打造可对话的交互式数字分身", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/26/i-created-an-interactive-digital-avatar-of-myself-and-you-can-talk-to-it", "date": "2026-09-26T14:00:00.000Z", "summary": "Synthesia 为 TechCrunch 记者制作了一个交互式 AI 数字分身，仅基于其一篇关于风投背景创业公司欺诈的报道训练，只会回答与该报道相关的问题。", "type": "paper", "relTime": "2天前"}, {"id": 36, "title": "实测LibTV 1.5五大新功能，演示AI短剧工作流", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw==&mid=2247511963&idx=1&sn=a8046b9f44949b1eed69a7c149c2efdb&chksm=cf085362a48739b7257c3756c5eeab1133ff234b0c27312f978e54d53dd6872d5ceab88ca8ab&scene=126&sessionid=1790572572#rd", "date": "2026-09-26T09:00:00.000Z", "summary": "作者详细测试了LibTV 1.5版本的新功能，包括将Agent升级为TV Director、剧本原创及改编、角色造型室、导演执导、3D-BOX预演和创意片头。文章展示了从生成50集古装言情喜剧大纲、手动编辑剧本、使用角色造型室调整人物形象，到利用Seedance 2.5生成分镜、通过导演模式优化镜头以及用3D-BOX进行复杂运镜预演的完整流程，最终输出成片。", "type": "tip", "relTime": "2天前"}, {"id": 37, "title": "用 AugLy 构建图像、文本、音频多模态数据增强与对抗鲁棒性基准教程", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/26/end-to-end-multimodal-data-augmentation-and-adversarial-robustness-benchmark-with-augly-for-images-text-audio-and-pytorch", "date": "2026-09-26T07:22:46.000Z", "summary": "本教程基于 AugLy 构建覆盖图像、文本、音频的端到端多模态数据增强与鲁棒性工作流。教程解决依赖兼容问题，生成确定性合成数据集，演示 AugLy 的函数式与类式 API。", "type": "tip", "relTime": "2天前"}, {"id": 38, "title": "微星推出 MS-C9ZA 无风扇边缘 AI 盒子，基于 Jetson Orin Nano 8GB", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/344.htm", "date": "2026-09-26T05:37:03.000Z", "summary": "微星推出 MS-C9ZA 边缘 AI 盒子，基于 NVIDIA Jetson Orin Nano 8GB 模组，可在端侧执行 AI 推理与计算机视觉处理，面向机器人、智能制造等场景。", "type": "paper", "relTime": "2天前"}, {"id": 39, "title": "作者分享用 logprobs 读取 LLM 选项概率的单函数封装，并扩展到视觉模型", "source": "Hacker News：AI 热帖", "sourceUrl": "http://allanrbo.blogspot.com/2026/09/a-jev-like-wrapper-for-llms-including.html", "date": "2026-09-26T04:20:58.000Z", "summary": "作者受 Jev 及 OpenJev、SemIf 启发，实现了一个单函数封装：让 LLM 只生成一个选项字母，再读取 top_logprobs 得到各选项概率。", "type": "tip", "relTime": "2天前"}, {"id": 40, "title": "Claude Opus 5.5 生成递归解释视频", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2103688362960019567", "date": "2026-09-26T03:29:25.000Z", "summary": "你怎么解释递归？这个挺有意思的。  我让 Claude Opus 5.5 做了：\"一个解释递归的视频，其中每一段关于递归的解释都采用截然不同的视频风格，要让它自我指涉、巧妙且节奏明快。\"  九次风格切换，一个提示词……", "type": "paper", "relTime": "2天前"}, {"id": 41, "title": "NVIDIA 开源 MONAI Physio 医学影像数字孪生", "source": "X：小北 (@frxiaobei)", "sourceUrl": "https://x.com/frxiaobei/status/2103672371991249071", "date": "2026-09-26T02:25:52.000Z", "summary": "NVIDIA 在 MICCAI 2026 开源 MONAI Physio，可从 3D 和 4D 医学影像生成个性化的心脏与呼吸数字孪生，模拟心跳与肺部运动。该工具属于开源 Project MONAI 工具包，面向研究人员用于仿真、可视化和可复现研究。", "type": "model", "relTime": "2天前"}, {"id": 42, "title": "Liquid AI 发布 LFM2.5-VL-3B-DSpark 投机解码草稿模型，解码最高提速 3.13 倍", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/25/liquid-ai-releases-lfm2-5-vl-3b-dspark-speculative-decoding-for-vision-language-models-with-up-to-3-13x-faster-decoding", "date": "2026-09-25T23:11:59.000Z", "summary": "Liquid AI 发布 LFM2.5-VL-3B-DSpark，一个为其视觉语言模型 LFM2.5-VL-3B 设计的实验性投机解码草稿模型，新增约 279.5M 参数（+8.9%），在 Apple silicon 上解码最高提速 3.13 倍，NVIDIA H100 上最高 2.66 倍。", "type": "model", "relTime": "3天前"}, {"id": 43, "title": "Meta 开放 Muse 新功能抢先体验申请", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/25/meta-opens-early-access-program-for-new-muse-features", "date": "2026-09-25T20:34:53.000Z", "summary": "Meta 在 Connect 2026 开发者大会公布 Muse AI 应用多项新功能后，于周五开放抢先体验申请，用户可让 Muse 代为提交申请加入名单。新功能包括可与 Muse 数字分身视频通话、更多购物合作与连接器、扩展 Muse Mac 应用使其能操作电脑完成任务，以及将 Muse 引入 Meta AI 眼镜，用户可通过唤醒词语音交互。", "type": "paper", "relTime": "3天前"}, {"id": 44, "title": "Pexo 将研究自动生成 30 秒视频", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2103575986772070862", "date": "2026-09-25T20:02:52.000Z", "summary": "花数小时研究微软的崛起。  5 分钟把研究喂给 Pexo。  10–15 分钟后，一条完成的 30 秒视频。  真正让我惊讶的是拼贴效果。Pexo 拿过研究内容，围绕它构建了整套视觉处理——抠图、贴纸、辅助图像，全部都有。没有任何东西像是随机加进去的。一切都跟着故事走。而且这还是第一次尝试。  如果你做历史或解说类内容，我觉得工作流刚刚变了。@Pexoai_offical", "type": "paper", "relTime": "3天前"}, {"id": 45, "title": "Qwen 团队发布 Qwen3.8-Omni-Flash 报告：面向原生全模态智能体", "source": "X：DAIR.AI (@dair_ai)", "sourceUrl": "https://x.com/dair_ai/status/2103573552611926373", "date": "2026-09-25T19:53:12.000Z", "summary": "Qwen 团队发布报告，介绍 Qwen3.8-Omni-Flash，一个原生多模态模型，面向跨文本、音频和视频的长程智能体任务，如视频编辑和长音频视频翻译。模型采用 Qwen3.8-Next 的稀疏 MoE 架构，上下文窗口达一百万 token，并通过协同训练策略在保持文本性能的同时将智能体能力迁移到音频和视频任务。", "type": "paper", "relTime": "3天前"}, {"id": 46, "title": "Suno 发布新曲《Take Me Back》", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2103563987963011148", "date": "2026-09-25T19:15:11.000Z", "summary": "《Take Me Back》现已在 Suno 上线。由 Braylon Browner 赋予生命，音乐视频由同为编舞师的 Nina McNeely 执导，他们的合作从舞蹈到歌曲，再到围绕 Braylon 的动作打造的完整世界。  音乐使用 v6 创作，并在 Studio 2.0 中完成。", "type": "paper", "relTime": "3天前"}, {"id": 47, "title": "Qwen 团队发布 Qwen3.8-Omni-Flash 全模态智能体模型报告", "source": "X：DAIR.AI (@dair_ai)", "sourceUrl": "https://x.com/dair_ai/status/2103563695381209417", "date": "2026-09-25T19:14:01.000Z", "summary": "Qwen 团队发布 Qwen3.8-Omni-Flash 报告，这是一个原生多模态模型，面向跨文本、音频和视频的长时程智能体任务，如视频编辑和长音频视频翻译。模型沿用 Qwen3.8-Next 的稀疏 MoE 架构，上下文窗口为 100 万 token，并通过协同训练策略在保持文本性能的同时把智能体能力迁移到音频和视频任务。", "type": "paper", "relTime": "3天前"}, {"id": 48, "title": "Google 发布 Gemini 3.8 Flash TTS 等多项更新", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2103552111233343980", "date": "2026-09-25T18:28:00.000Z", "summary": "Google 本周发布 Gemini 3.8 Flash TTS 与 Gemini 3.8 Flash-Lite TTS 两款音频生成模型，并推出 Gemini 3.8 Live with Live Avatar，为对话式 AI 带来近实时视觉形象。", "type": "model", "relTime": "3天前"}, {"id": 49, "title": "Perceptron Mk1.5 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2103545324598091781", "date": "2026-09-25T18:01:02.000Z", "summary": "来自 @perceptroninc 的 Perceptron Mk1.5 已在 OpenRouter 上线。  这是 Perceptron 面向物理智能体的具身推理模型。它接受文本、图像、视频和音频输入，可以用点、框、多边形和视频片段配合文本作答。", "type": "model", "relTime": "3天前"}, {"id": 50, "title": "Claude Opus 5.5 接入 Runway MCP", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2103540433225908447", "date": "2026-09-25T17:41:35.000Z", "summary": "Claude Opus 5.5 遇上 Runway MCP。  将 Runway 直接接入 Claude，即可用 Gen-4.5、Seedance 2.5、GPT Image 2、Kling 等生成精美图像和视频，就在你的工作环境中完成。几秒即可通过下方链接接入。", "type": "paper", "relTime": "3天前"}, {"id": 51, "title": "Suno v6 将舞蹈动作变成音乐", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2103537899509596376", "date": "2026-09-25T17:31:31.000Z", "summary": "对 @braylonbrowner 来说，动作不只是跟随音乐，而是音乐的起点。  看他如何用 v6 把自己的动作变成一首歌，并将编舞过程推向意想不到的地方。  Make what moves you.  观看他的首支音乐视频，由 Nina McNeely 执导：https://suno.com/braylon", "type": "paper", "relTime": "3天前"}, {"id": 52, "title": "NaceAI 发布 Drex 决策模型，输出选项概率", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2103523705603461145", "date": "2026-09-25T16:35:07.000Z", "summary": "NaceAI 推出 Drex，一个 sub-6B 决策模型，不生成文本而是直接输出各选项概率，一次前向即可完成，面向智能体路由、工具选择、重排序与策略检查等场景。Drex 采用小型扩散模型加 RLAF 架构，定价 $0.04/1M input tokens，延迟低于 1 秒，在 Decision Index 上排名 #1，40 项 benchmark 中赢下 23 项，开放权重与技术报告即将发布。", "type": "model", "relTime": "3天前"}, {"id": 53, "title": "Perceptron 发布 35B 具身智能体模型 Mk1.5，请求完成速度最高提升 4.7 倍", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2103518305864839197", "date": "2026-09-25T16:13:40.000Z", "summary": "Perceptron 发布 35B 具身智能体模型 Mk1.5，可控制无人机、四足机器人、智能眼镜，并调度子智能体，无需平台特定重训练。模型针对 egocentric 视频训练，启用网页搜索、页面阅读、反向图搜和缩放工具后，MMSearch F1 从 18.2 升至 54.3；官方数据显示端到端延迟最高较 Mk1 快 4.7 倍（Chat 从 5.2 秒降至 1.1 秒）。", "type": "model", "relTime": "3天前"}, {"id": 54, "title": "Suno v6 将舞蹈动作变成歌曲", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2103515732688486494", "date": "2026-09-25T16:03:26.000Z", "summary": "对 Braylon Browner 来说，动作不只是跟随音乐，而是音乐的起点。  看他如何用 v6 把自己的动作变成一首歌，并将编舞过程推向意想不到的地方。  Make what moves you.  观看由 Nina McNeely 执导的他的首支音乐视频：https://suno.com/braylon", "type": "paper", "relTime": "3天前"}, {"id": 55, "title": "新一代梅赛德斯-迈巴赫 S 级轿车上市：搭载 MB.OS 与 Momenta R7 世界模型，139.8 万元起", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/102.htm", "date": "2026-09-25T03:02:39.000Z", "summary": "新一代梅赛德斯-迈巴赫 S 级轿车上市，售价 139.8 万元起，S 680 顶配为 335.3 万元。新车首度搭载梅赛德斯-奔驰 MB.OS 架构与最新一代智能人机交互系统，应用端侧多模态 VLM 大模型，并成为率先搭载 Momenta R7 世界模型的豪华燃油车，未来可通过 OTA 远程升级。其全新城区及高速领航辅助驾驶系统在中国实现车位到车位辅助驾驶与智能辅助泊车。", "type": "model", "relTime": "3天前"}, {"id": 56, "title": "Runway GWM Worlds 2 与 WorldPrompt：实时交互世界模型的工程解读", "source": "Latent Space（RSS）", "sourceUrl": "https://www.latent.space/p/runway", "date": "2026-09-25T01:30:57.000Z", "summary": "Runway 本月推出研究预览版 GWM Worlds 2，将高保真视频和音频生成变为实时交互模拟，以 720p、24 fps 连续视频和 48,000 Hz 音频流式输出，并新增 WorldPrompt 输入格式，可固定环境部分方面并通过带时间戳的事件控制角色、相机和场景。", "type": "tip", "relTime": "3天前"}, {"id": 57, "title": "BestBlogs 早报 · 09-25：Every 实验室机制 / 原子声明验证 / Claude 代码现代化 / RoboFlywheel", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2103287093208502680", "date": "2026-09-25T00:54:54.000Z", "summary": "阿里巴巴发布 RoboFlywheel 开放式仿真基础设施，提供超百万级刚体、铰链与柔性资产，支持机器人交互与闭环训练。腾讯混元发布图像生成模型 Hy Image3.5 preview，综合能力较上代提升约 30%，2K 出图定价 0.15 元/张，已接入元宝、ima、WorkRally 等产品。", "type": "model", "relTime": "3天前"}, {"id": 58, "title": "利用预训练扩散模型和多模态条件增强摄影测量数字表面模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.31199", "date": "2026-09-25T00:00:00.000Z", "summary": "该研究提出一种改进的 Stable Diffusion 3 架构，通过同时以摄影测量 DSM 和 Pléiades 卫星图像作为条件，对垂直配准的数字表面模型进行细化。实验表明，这种多模态条件方法能显著提升高程精度，在法国城市测试中，密集城区的 RMSE 从 6.00 米降至 3.45 米（上下文城市）及 2.76 米（留出城市）。", "type": "paper", "relTime": "4天前"}, {"id": 59, "title": "TRACE：流式视频理解的时序审计与条件感知评估框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.30670", "date": "2026-09-25T00:00:00.000Z", "summary": "论文提出 TRACE 基准，旨在解决现有流式视频理解评估中忽略证据时效性、历史维护及响应触发机制的问题。该框架通过统一因果协议控制信息可用性，并多维报告答案质量、及时性、负载等指标。在 1240 条记录上的实验显示，相似的 QA 准确率可能掩盖系统在完成度、生成负载及主动响应行为（如误报、漏报）上的巨大差异，强调应将性能视为执行条件下的系统行为而非单一分数。", "type": "paper", "relTime": "4天前"}, {"id": 60, "title": "FuseReg：正则化层融合缓解表征自编码器的重建-生成差距", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.31620", "date": "2026-09-25T00:00:00.000Z", "summary": "FuseReg 用随机编码器层子集训练替代启发式层融合，在 ImageNet-256 与 DINOv3-L 上，单个解码器无需重训即可从全层、稀疏和单层融合中重建，PSNR 高于固定融合的专用解码器。仅替换解码器即使未改动的 RAEv2 DiT-XL 生成器无引导 gFID 降低 27%，联合正则化两阶段在 DiT-Base 上降低 29%。", "type": "paper", "relTime": "4天前"}, {"id": 61, "title": "InternW0-Δ：用 2 万小时开放数据打通预测动态与动作的世界动作模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.31394", "date": "2026-09-25T00:00:00.000Z", "summary": "InternW0-Δ 是一个统一的世界动作模型（WAM），在 Mixture-of-Transformers 框架下结合预训练视频专家、动作专家与冻结 VLM 的语义引导，并通过训练期蒸馏注入 4D 几何与运动先验。", "type": "model", "relTime": "4天前"}, {"id": 62, "title": "Claude Opus 5.5 一次生成动漫风短视频", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2103272686570918334", "date": "2026-09-24T23:57:40.000Z", "summary": "Ethan Mollick 让 Claude Opus 5.5 把同一条消息改造成面向动漫爱好者的社交媒体短视频，一次生成即完成。此前他让 Claude 自选一个着迷的谜题并尽力解决、再做成可分享的影片，Claude 尝试破解伏尼契手稿失败后，转而制作了这段兼具趣味与科普性的影片。", "type": "paper", "relTime": "4天前"}, {"id": 63, "title": "Runway 评估 Model Router 图像转视频", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2103234985637679441", "date": "2026-09-24T21:27:51.000Z", "summary": "在 250 个图像转视频提示词上，我们评估了 Model Router 相较于 SOTA 模型基线，如何降低成本并保持生产可用性。请通过下方链接阅读更多内容。", "type": "model", "relTime": "4天前"}, {"id": 64, "title": "Google 为 Gemini 3.8 Live 推出 Live Avatar 实时数字人", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/1000328/google-gemini-ai-live-avatar-face", "date": "2026-09-24T19:59:26.000Z", "summary": "Google 在 Gemini 3.8 Live 更新中推出 Live Avatar，可在对话中实时口型同步并呈现不同面部表情，目前仅面向 Gemini Enterprise 客户开放。该功能支持 97 种语言切换且不降低视频保真度或产生视觉漂移，还能在说话时调出屏幕信息。Google 同时提供预设头像库并允许企业自建，输出带有不可见 SynthID 水印及身份保护措施。", "type": "paper", "relTime": "4天前"}, {"id": 65, "title": "Pruna 发布 Qwen-Image-2.1 少步数 LoRA 适配器，图像生成提速至 6.3 倍", "source": "X：AK (@_akhaliq)", "sourceUrl": "https://x.com/_akhaliq/status/2103201617004949888", "date": "2026-09-24T19:15:15.000Z", "summary": "Pruna-Qwen-Image-2.1 是一组少步数 LoRA 适配器，可将 Qwen-Image-2.1 的图像生成与编辑速度提升至多 6.3 倍。生成或编辑图像只需 5 或 8 步而不用 40 步，选 5 步追求最快速度，选 8 步兼顾效果与速度。HF 工作流：https://huggingface.co/spaces/akhaliq/Pruna-Qwen-Image-2.1", "type": "paper", "relTime": "4天前"}, {"id": 66, "title": "新泽西州对 DataOne 数据中心处以 110 万美元罚款，62 台燃气发电机被卫星图像曝光", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/tech-policy/2026/09/new-jersey-fines-data-center-1-1m-after-satellite-pics-expose-62-gas-generators", "date": "2026-09-24T18:20:58.000Z", "summary": "新泽西州对 DataOne 位于 Vineland 的数据中心处以 110 万美元罚款，因其违反空气污染控制法秘密安装并运行 62 台燃气发电机，其中 45 台在运行。", "type": "industry", "relTime": "4天前"}, {"id": 67, "title": "Meta 推出 Horizon Create 和 Horizon Studio，用 AI 提示词在手机上做游戏", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/games/999972/meta-horizon-create-studio-ai-games", "date": "2026-09-24T17:52:29.000Z", "summary": "Meta 宣布两款 AI 游戏开发工具：移动端应用 Horizon Create 和浏览器端应用 Horizon Studio，均支持用 AI 提示词生成 2D 或 3D 移动游戏，包含进度系统、难度平衡、美术方向和多人玩法，目前以早期访问形式开放候补名单。", "type": "paper", "relTime": "4天前"}, {"id": 68, "title": "Space Bunny 模型视觉与 3D 生成实测", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2103174241654837649", "date": "2026-09-24T17:26:28.000Z", "summary": "Elvis Saravia 测试了 Space Bunny 模型，其在 OpenCode 中免费开放一周，支持 1M token 上下文窗口和图像输入。该模型视觉理解与设计能力出色，能自我验证工作成果，可从草图生成完整落地页、3D 模型、动画和可玩游戏。作者推荐将其用于图像转代码、交互原型和 3D 创意编程。", "type": "model", "relTime": "4天前"}, {"id": 69, "title": "Black Forest Labs 发布开源机器人模型 FLUX 3 Action", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/black-forest-labs-launches-flux-3-action-an-open-robotics-ai-model", "date": "2026-09-24T17:01:03.000Z", "summary": "Black Forest Labs 发布面向机器人的开源模型 FLUX 3 Action，基于以视频数据训练的多模态 FLUX 3，可从机器人工作区的多机位视频预测智能体下一步动作及环境变化。BFL 称其仅 70 亿参数即在 RoboLab-120 排行榜创下成功率纪录，体积不到此前最佳开源模型一半，运行最快快至 3.95 倍；模型权重已上架 Hugging Face。", "type": "model", "relTime": "4天前"}, {"id": 70, "title": "Google 发布 Gemini 3.8 Live with Live Avatar，为对话 AI 带来实时视觉形象", "source": "Google DeepMind：Blog（RSS）", "sourceUrl": "https://deepmind.google/blog/introducing-gemini-38-live-with-live-avatar", "date": "2026-09-24T16:20:39.000Z", "summary": "Google DeepMind 推出 Gemini 3.8 Live with Live Avatar，将低延迟流式视频与实时对话能力原生结合，让 AI 具备能听、能看、能说的动态视觉形象，即日起在 Gemini Enterprise 可用。", "type": "paper", "relTime": "4天前"}, {"id": 71, "title": "Odyssey 发布多智能体世界模型 Agora-2，支持最多 20 个人类与智能体实时共享模拟环境", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2103151581810000240", "date": "2026-09-24T15:56:26.000Z", "summary": "Odyssey 推出下一代多智能体世界模型 Agora-2，支持最多 20 个人类与智能体在共享环境中实时交互，多人研究预览现已开放体验。作者 Elvis Saravia 评价称，这类世界模型可用于共同训练机器人、自动驾驶和网络安全防御智能体，各方在交互中相互提升，也为研究智能体串谋提供了安全环境。", "type": "model", "relTime": "4天前"}, {"id": 72, "title": "Liquid AI 发布 LFM2.5-VL-DSpark 视觉语言 drafter 模型，边缘端解码最高提速 3.13 倍", "source": "Liquid AI 模型与工程博客（网页）", "sourceUrl": "https://www.liquid.ai/blog/lfm2-5-vl-dspark", "date": "2026-09-24T14:42:04.258Z", "summary": "Liquid AI 为视觉语言模型 LFM2.5-VL-3B 发布实验性 DSpark drafter 模型，参数约 280M，仅增加 8.9% 参数量。GPU 上解码吞吐最高提升 2.66 倍、边缘设备 3.13 倍，端到端分别最高 2.27 倍和 2.62 倍；模型已上架 Hugging Face，支持 llama.cpp、SGLang 和 MLX-VLM。", "type": "model", "relTime": "4天前"}, {"id": 73, "title": "Liquid AI 发布 LFM2.5-VL-DSpark 视觉草稿模型加速 VLM 推理", "source": "Hugging Face：Blog（RSS）", "sourceUrl": "https://huggingface.co/blog/LiquidAI/lfm2-5-vl-dspark", "date": "2026-09-24T14:08:57.000Z", "summary": "Liquid AI 在 Hugging Face 发布面向视觉语言模型 LFM2.5-VL-3B 的实验性 DSpark 草稿模型，通过投机解码在不改变输出质量的前提下换取推理加速。", "type": "model", "relTime": "4天前"}, {"id": 74, "title": "Meta 发布多款 AI 眼镜并宣布 Muse 助手将登陆眼镜", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/09/meta-puts-its-ai-assistant-on-a-keychain", "date": "2026-09-24T14:03:38.000Z", "summary": "Meta 发布多款 Ray-Ban 新款眼镜，其中无摄像头款仅支持音频交互，另推出售价 1,300 美元、比 Quest 3 轻五倍的新 VR 眼镜，明年春季上市。Muse 助手将登陆眼镜，用户可在视频通话中以超写实数字分身代替面部出镜，但 Muse 已出现可被黑客接管智能体的漏洞并遭 Amazon 封锁访问其购物平台。", "type": "paper", "relTime": "4天前"}, {"id": 75, "title": "Waymo 公布 2.71 亿英里自动驾驶数据：严重事故比人类驾驶员少 95%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/015.htm", "date": "2026-09-24T13:24:34.000Z", "summary": "Waymo 公布其 Robotaxi 在亚特兰大、奥斯汀、菲尼克斯、洛杉矶和旧金山累计 2.71 亿英里无人驾驶里程的分析结果：致重伤及以上事故的概率比人类驾驶员低 95%，致轻伤事故低 82%，致伤事故比按人类事故率推算的少 841 起。", "type": "tip", "relTime": "4天前"}, {"id": 76, "title": "商汤 Seko 生成中秋 AI 视频", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2103064260121346289", "date": "2026-09-24T10:09:27.000Z", "summary": "🌕 这个中秋节，我们分享一支用商汤视频创作智能体 #Seko 制作的精美 AI 视频。它出自成都 AI 创作者陈爱军之手。  这位眼镜店店主自学 AI，已制作 200 多支 AI 视频，积累了超过 60 万粉丝。  愿想象力在中秋明月下起飞。✨", "type": "paper", "relTime": "4天前"}, {"id": 77, "title": "火种说｜给 Agent 做完大扫除，MiniCPM5-2B 把考研数学一做对了", "source": "公众号：面壁智能（MiniCPM）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3Mzg2MTg2NQ%3D%3D&mid=2247499342&idx=2&sn=b2c4db4849321c1afafd5030c76331c4", "date": "2026-09-24T07:00:37.000Z", "summary": "开发者在 M4 16GB 设备上基于 OpenHanako 框架适配 MiniCPM5-2B（本地 MLX 8bit 量化推理），通过裁剪 Computer Use、社交平台接入、图片视频生成等功能并新增 MiniCPM XML tool adapter，将工具面收缩到 11 个基础工具，解决了 2B 模型工具调用时的格式污染与指令漂移问题。", "type": "model", "relTime": "4天前"}, {"id": 78, "title": "高通携手 PrismML 发布 1-bit Bonsai 视觉模型，可在骁龙 AR1 Gen 1 智能眼镜上本地运行", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/006/772.htm", "date": "2026-09-24T06:34:07.000Z", "summary": "在 2026 骁龙峰会上，高通与 PrismML 发布 1-bit 量化 Bonsai 视觉语言模型，基于 Bonsai 1.7B 构建，可在骁龙 AR1 Gen 1 智能眼镜平台本地运行 20 亿参数模型。官方称相同内存下可容纳约 4 倍参数，内存占用约为传统 4-bit 模型的 1/4，文本 Token 生成速度翻倍，识图、翻译、环境问答等交互可离线完成，同时降低功耗、改善续航与发热。", "type": "model", "relTime": "4天前"}, {"id": 79, "title": "火山引擎对话《后西游记》主创，揭秘首部AI长剧登陆湖南卫视黄金档", "source": "公众号：火山引擎", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI0NzU1NzI5NQ%3D%3D&mid=2247544696&idx=1&sn=eb490357aa03d3f5655fa9fbe00a0606", "date": "2026-09-24T05:40:51.000Z", "summary": "国内首部AI长剧《后西游记》8月31日登陆湖南卫视黄金档，60集规划、每集约40分钟，全剧无摄影机拍摄，视频生成100%由 Seedance 实现，上线一周芒果TV正片播放量突破1.5亿次。剧集由芒果TV出品、伯璟文化承制，依托芒果灵创平台，5月立项到播出仅半年、制作周期3个月；总导演李东珅以一场动作戏为例，小组制作耗时10天、成本约十几万元，真人实拍则可能需300至400万元。", "type": "tip", "relTime": "4天前"}, {"id": 80, "title": "MiniMax-H3 登陆 AMD MI355X，推理提速 26.7 倍", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2102993504041599271", "date": "2026-09-24T05:28:17.000Z", "summary": "Nunchux 将 MiniMax 的 MiniMax-H3 部署到 AMD MI355X，在 8 块 GPU 上推理速度最高达 SGLang 的 26.7 倍，5 秒视频仅需 1.3 秒生成。借助流式生成，用户可在视频播放过程中修改提示词来引导后续画面。MiniMax-H3 免费访问即将开放，现已开放 waitlist。", "type": "paper", "relTime": "4天前"}, {"id": 81, "title": "刷着满屏的炸裂 AI 视频，我似乎发现了一个 AI 完不成的视频生成任务死角： “左手六，右手七，左脚画圆，右脚踢” 的脑血栓走路方式。 你们可以试试, 试成功了告诉我，反正我是没有成功。", "source": "X：马东锡 NLP (@dongxi_nlp)", "sourceUrl": "https://x.com/dongxi_nlp/status/2102990286443917550", "date": "2026-09-24T05:15:30.000Z", "summary": "刷着满屏的炸裂 AI 视频，我似乎发现了一个 AI 完不成的视频生成任务死角：  “左手六，右手七，左脚画圆，右脚踢” 的脑血栓走路方式。  你们可以试试, 试成功了告诉我，反正我是没有成功。", "type": "paper", "relTime": "4天前"}, {"id": 82, "title": "元宝上线旅游计划 Agent：切换专家模式，一句话生成可交互行程卡", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/crossing/this-mid-autumn-and-national-day-holiday-cut-yourself-some-s", "date": "2026-09-24T01:00:00.000Z", "summary": "元宝在节前更新上线旅游计划 Agent，用户在元宝 APP 对话中切换到专家模式即可触发，输入需求后自动搜索实时信息并生成可视化行程卡。该行程卡支持滑动查看、切换地图标注，还可调用混元最新生图模型 Hy Image3.5 preview 生成攻略图，并支持对话迭代修改行程。", "type": "model", "relTime": "4天前"}, {"id": 83, "title": "蚂蚁 inclusionAI 开源 Ming-Image-0.1-Design 登顶 UI/UX 设计榜", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2102917486027079957", "date": "2026-09-24T00:26:13.000Z", "summary": "蚂蚁集团旗下 inclusionAI 发布 6B 参数文生图模型 Ming-Image-0.1-Design，以 MIT 协议开源权重，支持 RGBA 透明背景输出，面向 UI、信息图、海报等富文本视觉设计。", "type": "model", "relTime": "4天前"}, {"id": 84, "title": "RGBD20K：大规模 RGB-D 语义分割基准数据集", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.29028", "date": "2026-09-24T00:00:00.000Z", "summary": "RGBD20K 是一个包含 20000 对 RGB-D 图像、覆盖 160 个细粒度类别的 RGB-D 语义分割数据集，类别数远超 NYUv2 的 40 类和 SUN RGB-D 的 37 类。该数据集对已有标注进行了严格重评与修正，以解决长期存在的标注噪声问题。作者同时提出 score-purified fusion（SPF）方法，在所有评测基准上取得 SOTA 性能。", "type": "paper", "relTime": "5天前"}, {"id": 85, "title": "AV-GRPO：面向音视频联合生成的模态锚定解耦扩散强化学习框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.29816", "date": "2026-09-24T00:00:00.000Z", "summary": "AV-GRPO 是一个模态锚定的在线扩散强化学习框架，通过模态锚定 rollout、轨迹锁定冻结塔优化和自适应目标，将耦合的多模态偏好学习拆解为单模态子问题，用于音视频联合生成。配套的 5DAV 数据集在五个维度上解耦样本以支持系统化训练。在 JavisBench 和 VABench 上，AV-GRPO 在 LoRA 与全量微调下于生成质量、语义对齐和跨模态同步方面均优于 LTX-2.3。", "type": "paper", "relTime": "5天前"}, {"id": 86, "title": "WanPE：面向现代文生视频的电影级提示词增强", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.30221", "date": "2026-09-24T00:00:00.000Z", "summary": "WanPE 是一个 397B 参数的提示词增强模型，基于 1.05M 真实视频训练，通过镜头级电影化规划与 SC-GRPO 保持跨镜头语义一致。驱动 Wan3.0 时，它将 5-15 秒人类偏好提升 10.66-18.84 分，30 秒场景提升 50.86 分。团队还构建了覆盖 5 至 30 秒、约 11K 盲测对比的 WanPEval 基准。", "type": "model", "relTime": "5天前"}, {"id": 87, "title": "World Action Agent：用 VLM 通过世界动作排练操控机器人", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.29964", "date": "2026-09-24T00:00:00.000Z", "summary": "World Action Agent（WAA）是一个多智能体框架，让 VLM 借助基础工具在视觉动作工作区中直接操控机器人，工作区具备接触视图、动作排练与视图内校正三项特性。", "type": "paper", "relTime": "5天前"}, {"id": 88, "title": "ViRDM：无需教师与判别器的少步因果视频生成表示分布匹配", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.28923", "date": "2026-09-24T00:00:00.000Z", "summary": "ViRDM 提出一种无需教师模型和在线判别器的视频后训练方法，将表示分布匹配（RDM）迁移到少步因果视频生成，通过随机截断 clean-exit 监督、轻量 VAE 解码器和分阶段 vector-Jacobian 乘积解决显存瓶颈。仅需 20 次生成器更新，该方法在官方 VBench 上达到 84.87 分，超过此前最佳少步因果基线 0.36 分，训练消耗 16 A100 GPU-hours。", "type": "model", "relTime": "5天前"}, {"id": 89, "title": "TrackEverything：突破长视频稠密3D点追踪的显存瓶颈", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.30222", "date": "2026-09-24T00:00:00.000Z", "summary": "TrackEverything提出一种新的3D点追踪模型，通过去重3D场景表示解决稀疏长时与稠密短时追踪的权衡问题。该模型利用体素化去重、端点细化器及3D WAFT技术，将模型复杂度与视频时长解耦。它是首个能在40GB显存内对超过1000帧视频进行全可见点追踪的3D追踪器，在TAPVid-3D基准上表现优于现有开源稠密追踪器。", "type": "paper", "relTime": "5天前"}, {"id": 90, "title": "LightMIS：无需逐级解码器的超轻量医学图像分割网络", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.28327", "date": "2026-09-24T00:00:00.000Z", "summary": "LightMIS 是一族用于 2D 二值医学图像分割的超轻量卷积网络，无需学习式逐级解码器，通过 Scale-Aligned Projection 对齐五级编码器输出并一次性聚合，再用 Adaptive Fusion Cascade 精炼。", "type": "paper", "relTime": "5天前"}, {"id": 91, "title": "Qwen3.8 Max Prime 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2102875655004385401", "date": "2026-09-23T21:40:00.000Z", "summary": "来自 @Alibaba_Qwen 的 Qwen3.8 Max Prime 已在 OpenRouter 上线。  这是 Qwen3.8 Max 的高吞吐量变体，具备相同的 2.4T 参数旗舰能力：1M 上下文，文本、图像和视频输入，可调推理强度的推理，工具调用，以及结构化输出。  在此使用：https://openrouter.ai/qwen/qwen3.8-max-prime", "type": "paper", "relTime": "5天前"}, {"id": 92, "title": "Claude 一次生成完整音乐视频", "source": "X：Thariq (@trq212)", "sourceUrl": "https://x.com/trq212/status/2102870353781641416", "date": "2026-09-23T21:18:56.000Z", "summary": "用户给 Claude 一段约 1 万字符的提示词，包含技能、示例和 API key，要求它独立完成一支\"Claude Pop\"歌曲音乐视频的端到端重制。任务要求保留原音轨，用 JavaScript 动画呈现歌词，并调用 ElevenLabs API 做音效设计、用图像生成 API 制作角色设定与场景，再以 seedance 2.5 生成视频素材。", "type": "product", "relTime": "5天前"}, {"id": 93, "title": "YouTube 承诺今年晚些时候推出自定义信息流及更多 AI 功能", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/gadgets/2026/09/youtube-promises-custom-feeds-and-a-lot-more-ai-later-this-year", "date": "2026-09-23T19:35:53.000Z", "summary": "YouTube 在 Made on YouTube 活动上宣布将推出 Custom Feeds，用户输入描述即可生成自定义内容标签页并保存多个信息流，率先在美国上线 web、移动端和电视端。评论将支持发布 GIF，私信新增群聊，初期仅限美国、英国、新加坡、巴西及部分欧洲国家。Ask YouTube 将在产品评测视频中提供对话式问答，并在搜索中给出视频推荐和产品对比表格。", "type": "product", "relTime": "5天前"}, {"id": 94, "title": "Black Forest Labs 发布 7B 开源权重世界动作模型 FLUX 3 Action", "source": "Black Forest Labs：Blog（网页）", "sourceUrl": "https://bfl.ai/blog/flux-3-action", "date": "2026-09-23T18:11:00.000Z", "summary": "Black Forest Labs 发布 FLUX 3 Action，一个 7B 参数、开放权重的世界动作模型。官方称可将 FLUX 的视觉智能转化为动作能力，用于机器人、模拟器或游戏。", "type": "model", "relTime": "5天前"}, {"id": 95, "title": "OnSolo 发布 Solo Video：单次生成 15 秒视频", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2102809011209003016", "date": "2026-09-23T17:15:11.000Z", "summary": "OnSolo 上线 Solo Video，可一次生成 15 秒视频，官方称运动更自然、生成成功率更高，从而减少重试消耗的 credits。会员活动期内可无限使用：Premium 3 天、Super 5 天、Ultra 10 天，每档 150 个名额，先到先得，活动时间为 9 月 23 日至 10 月 22 日，Solo Video 现已在 Free Canvas 中可用。", "type": "paper", "relTime": "5天前"}, {"id": 96, "title": "Recraft V4.1 Flash 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2102805293562478886", "date": "2026-09-23T17:00:24.000Z", "summary": "Recraft V4.1 Flash 已在 OpenRouter 上线。  每张图 1.3 秒，$0.007/张，而且看起来依然是 Recraft 的风格：摄影、人像、复杂场景、logo、早期概念。专为大批量生成和快速迭代打造。  试用：https://openrouter.ai/recraft/recraft-v4.1-flash  模型来自 @recraftai", "type": "model", "relTime": "5天前"}, {"id": 97, "title": "Google Research 发布 AI 视频联合导演研究，用多智能体框架生成连贯长视频", "source": "Google Research：Blog（网页）", "sourceUrl": "https://research.google/blog/coherent-long-form-video-generation", "date": "2026-09-23T16:00:00.000Z", "summary": "Google Research 提出基于 Gemini 和 Veo 的多智能体编排框架，将长视频生成建模为全局优化与世界状态跟踪问题，包含 Co-Director（COLM 2026）、CANVAS（EMNLP 2026）、A²RD 和 VQQA 四个框架，支持 SynthID 水印。", "type": "paper", "relTime": "5天前"}, {"id": 98, "title": "Runway 评测 Model Router：成本与质量如何权衡", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/developers/evaluating-runway-model-router", "date": "2026-09-23T16:00:00.000Z",  "sourceUrl": "https://x.com/TencentHunyuan/status/2102653332888400325", "date": "2026-09-23T06:56:34.000Z", "summary": "免费两周！Hy Image3.5 preview 已在 OnSolo 上线。短剧角色设定图。全动态视频游戏素材。关键帧。角色在每一集中保持一致。编辑是精修而非重来。", "type": "paper", "relTime": "5天前"}, {"id": 114, "title": "GPT-6 多模态\"看轻想重\"问题引关注", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2102651779523682788", "date": "2026-09-23T06:50:24.000Z", "summary": "论文《Look Light, Think Heavy》指出多模态模型存在\"看轻想重\"问题：看图越来越浅、语言推理越来越长，靠语言自迭代和解释脱离视觉本身。GPT-6 上这一现象越来越明显，在 image 2.5 的使用中造成明显干扰与脱节，作者认为用解释代替观看也是人类常犯的错误。", "type": "paper", "relTime": "5天前"}, {"id": 115, "title": "腾讯混元 Hy Image3.5 preview 上线 ComfyUI", "source": "X：腾讯混元 (@TencentHunyuan)", "sourceUrl": "https://x.com/TencentHunyuan/status/2102588771829195229", "date": "2026-09-23T02:40:02.000Z", "summary": "腾讯混元宣布 Hy Image3.5 preview 现已在 ComfyUI 中可用。该模型面向专业级图像生成，人类评测胜率相比 Hy Image3.0 提升 30%；单一模型支持文生图和图生图、最高 2K 分辨率，可正确渲染多语言文字、符号和小字，覆盖电影感、漫画、商业摄影和插画风格，并在场景、服装和风格变化中保持人物身份与产品特征。", "type": "model", "relTime": "5天前"}, {"id": 116, "title": "蚂蚁开源 Ming-Image-0.1-Design 系列：两个 6B 模型打通设计生成与图层编辑", "source": "公众号：蚂蚁百灵（Ling）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkyODk2MDQwNw%3D%3D&mid=2247487951&idx=1&sn=60410b279510db5cab77ec92afc96f2a", "date": "2026-09-23T02:00:00.000Z", "summary": "蚂蚁百灵开源 Ming-Image-0.1-Design 系列模型，包含两个 6B 模型：Design 从文字需求生成 UI、信息图、海报等完整设计，Layer 将设计图拆成 2 至 9 个可独立编辑的 RGBA 图层，并同步开源 Design Skill 和 PPT Skill。", "type": "model", "relTime": "5天前"}, {"id": 117, "title": "Apple 提出 probe guidance：用冻结内部状态引导扩散语言模型", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/guide-language-flow", "date": "2026-09-23T00:00:00.000Z", "summary": "Apple 提出 probe guidance，利用现有扩散模型冻结的内部状态构建引导信号，无需在推理时增加额外前向计算，即可让弱模型与强模型保持相近动态。该方法在连续扩散语言模型的无条件生成上取得新的 SOTA，应用于 1.7B 扩散语言模型时在多项选择题基准上持续提升。研究还发现，传统 autoguidance 中的弱模型必须来自训练的低熵区域。", "type": "model", "relTime": "6天前"}, {"id": 118, "title": "Uranus：面向具身智能的下一代仿真基础设施", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.24815", "date": "2026-09-23T00:00:00.000Z", "summary": "研究者发布数据驱动的机器人仿真器 Uranus，基于关节轨迹条件的自回归扩散模型，可在线接收未来关节位置轨迹并逐步自回归生成隐帧，每步对应四帧 RGB，无固定时长限制。经推理优化后生成速度达 24 FPS，并提供统一接口支持多种机器人形态与相机配置的同步多视角生成。代码与模型权重已开源。", "type": "model", "relTime": "6天前"}, {"id": 119, "title": "联合视频生成中的跨注意力鸿沟：RecCAR 让视频与动作、音频互相对齐", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.27901", "date": "2026-09-23T00:00:00.000Z", "summary": "研究者发现联合多模态扩散 Transformer 存在\"互惠对应鸿沟\"：动作、音频等伴随模态能强对应视频，反向约束视频的对应却明显偏弱。为此提出 KL 正则化方法 RecCAR，以视频到模态的对应为固定参照，拉齐较弱的模态到视频对应。在视频-动作与视频-音频生成中，RecCAR 将 Human Anatomy 分数从 0.69 提升至 0.75，音视频不同步从 0.804 降至 0.752。", "type": "paper", "relTime": "6天前"}, {"id": 120, "title": "高维潜空间的可扩散性：RAE 中 x₀-prediction 如何提升文生图生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.28473", "date": "2026-09-23T00:00:00.000Z", "summary": "针对 Representation Autoencoders（RAEs）中高保真重建编码器会降低表征有效维度、导致 flow matching 标准速度预测需拟合信号流形外的正交噪声方向、优化低效的问题，论文提出改用干净数据参数化（x₀-prediction），将学习集中在底层信号流形上。在多个强重建编码器实验中，x₀-prediction 一致提升了文生图生成性能。", "type": "paper", "relTime": "6天前"}, {"id": 121, "title": "自回归视频生成中的记忆机制综述：过去如何框定未来", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.28466", "date": "2026-09-23T00:00:00.000Z", "summary": "一篇综述系统梳理了自回归（AR）视频生成中的记忆机制，将记忆定义为跨 AR 步骤持续保留、在原始证据离开上下文后仍能影响后续生成的历史信息。文章从形式、功能、操作、学习与评估五个视角组织文献，并指出可组合且资源感知的记忆架构、可信状态更新、自 rollout 学习与标准化评估等开放挑战。", "type": "paper", "relTime": "6天前"}, {"id": 122, "title": "上海AI实验室发布 InternW0 物理世界模型基础版", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.27656", "date": "2026-09-23T00:00:00.000Z", "summary": "上海AI实验室推出 InternW 物理世界模型系列的首个模型 InternW0，通过非对称视频动作架构结合 flow matching 联合学习未来视觉动态与连续机器人控制，视频专家提供长时程预测上下文，轻量动作专家以更快频率运行，并通过复用层间 K/V 和观察条件上下文路由避免每次动作更新都重新生成未来。", "type": "paper", "relTime": "6天前"}, {"id": 123, "title": "DeltaWAM：面向双臂操作的 Delta 世界动作模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.28811", "date": "2026-09-23T00:00:00.000Z", "summary": "DeltaWAM 用稠密锚点、稀疏 delta 与动作三路流联合预测视觉变化量和动作，替代传统世界动作模型对完整未来帧的稠密预测。在 RoboTwin 上配合 Streaming Delta Memory（SDM）后，平均成功率从 Fast-WAM 的 81.3% 提升至 85.4%，视觉随机化下从 75.8% 提升至 83.9%。", "type": "model", "relTime": "6天前"}, {"id": 124, "title": "训练世界模型中的客体永久性", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.28654", "date": "2026-09-23T00:00:00.000Z", "summary": "研究者推出 WROP，一个包含 150 项认知科学启发任务、分属六个认知类别的数据基础设施，每项任务经 Blender 生成器随机化后产出 1 万+ 样本。团队发布 1.5M 样本训练语料和 300 题考试，评测 14 个视频模型，其中 16B 的 PWM-WROP 在盲测成对 Elo 中位列 continuation 模型第一、总榜第三。", "type": "model", "relTime": "6天前"}, {"id": 125, "title": "Morphometric Imitation：从形态与接触感知手部重定向到零样本 sim-to-real 视觉运动策略", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.28660", "date": "2026-09-23T00:00:00.000Z", "summary": "Morphometric Imitation 提出三阶段框架，将重建的人手-物体交互转化为零样本 sim-to-real 视觉运动策略。在三种机器人手和十种 HOI 上，其 MMO 的接触 F1 比五个基线中最强者至少高 8 分，下游动态重定向成功率最多提升 35 分；最终策略在 30 个物体、300 次真实世界试验中实现 89.3% 零样本成功率。", "type": "paper", "relTime": "6天前"}, {"id": 126, "title": "实测GPT-6 Sol、Luna与Claude Opus 5.5：编程、前端、写作与3D多模态对比", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247511677&idx=1&sn=e24fc2b3f00d861ca4712a197a94b8c7", "date": "2026-09-22T23:07:00.000Z", "summary": "作者实测GPT-6 Sol、Luna与Claude Opus 5.5三款新模型。GPT-6 Sol/Luna API价格比GPT5.6低50%，Opus 5.5输出速度比Opus5快30%、成本低40%，并提升了pro、max、team套餐的五小时额度窗口。", "type": "tip", "relTime": "6天前"}, {"id": 127, "title": "Claude Opus 5.5 与 GPT-6 Sol 3D 场景对比", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2102523754186256535", "date": "2026-09-22T22:21:40.000Z", "summary": "AI/ML API 背后的团队用 GPT-6 Sol 测试了新的 Claude Opus 5.5。  这些测试涉及生成一组一次性 3D 场景提示词，从\"动画鱼群\"开始。  据他们的结果，在四个场景中，Opus 5.5 生成了更精细的渲染，总成本为 $4.37，而 GPT-6 Sol 为 $0.34。", "type": "product", "relTime": "6天前"}, {"id": 128, "title": "AI 智能体泛滥下，机器人检测与人类验证成刚需", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2102483123200303185", "date": "2026-09-22T19:40:13.000Z", "summary": "Rohan Paul 指出，区分\"授权自动化\"与\"恶意自动化\"将是更难的问题，两者在浏览器中看起来都完全正常。引用 Nikita Bier 的观点称，未来几年机器人检测与人类验证将成为企业最迫切的需求之一，智能体集群会淹没各类网站和表单，小公司和政府网站最脆弱；X 在调研市场时发现没有一家公司整合了所有最新技术，只能全部自研。", "type": "paper", "relTime": "6天前"}, {"id": 129, "title": "VLM 智能迁移至机器人控制", "source": "X：AK (@_akhaliq)", "sourceUrl": "https://x.com/_akhaliq/status/2102474539620090152", "date": "2026-09-22T19:06:06.000Z", "summary": "将 VLM 的智能迁移至机器人控制  论文：https://huggingface.co/papers/2609.22966", "type": "paper", "relTime": "6天前"}, {"id": 130, "title": "五角大楼调查：过度依赖 Maven AI 是美军误击伊朗米纳布学校的原因之一", "source": "Hacker News：AI 热帖", "sourceUrl": "https://www.bloomberg.com/graphics/2026-iran-school-attack", "date": "2026-09-22T19:03:38.000Z", "summary": "五角大楼内部调查发现，2026 年 2 月 28 日两枚 Tomahawk 导弹击中伊朗米纳布 Shajarah Tayyebeh 小学，造成超过 150 人死亡、其中至少 123 名儿童，原因是情报过时、卫星图像七年未更新，以及 Centcom 部分人员过度依赖 Palantir 的 Maven Smart System。", "type": "tip", "relTime": "6天前"}, {"id": 131, "title": "OpenAI API 要做各价位最强模型", "source": "X：Sam Altman (@sama)", "sourceUrl": "https://x.com/sama/status/2102466603111551187", "date": "2026-09-22T18:34:34.000Z", "summary": "我们希望 OpenAI API 在每个价位都提供最好的模型，并在每种模态（文本、代码、图像、视频等）上都做到最好。  然后我们希望你们所有人想出好点子、把它们做出来，并成为满意的用户。最好的点子会来自你们。", "type": "model", "relTime": "6天前"}, {"id": 132, "title": "Krea Agent 单参考视频生成电影感镜头", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2102461525168632289", "date": "2026-09-22T18:14:24.000Z", "summary": "只需一个参考视频，就能用 Krea Agent 创作电影感镜头。  下面教你如何制作这样的视频 👇", "type": "paper", "relTime": "6天前"}, {"id": 133, "title": "StepFun 开源 LLM 数据标注与模型检查工具 onPanda", "source": "X：阶跃星辰 StepFun (@StepFun_ai)", "sourceUrl": "https://x.com/StepFun_ai/status/2102454115473510643", "date": "2026-09-22T17:44:57.000Z", "summary": "StepFun 开源内部使用的 LLM 数据标注与模型检查工具 onPanda，支持 token 级可视化与控制。标注方面称中位标注时间比人工后编辑降低 52%，可在同一流程产出 SFT 与偏好数据，ΔPPL <1%，并支持图像、音频和视频的 agent 轨迹标注；调试方面可查看 token 概率与 top-k 候选、逐 token 引导解码。", "type": "model", "relTime": "6天前"}, {"id": 134, "title": "NVIDIA 推出 NV-Reason-CT：面向放射科医生思维链推理的开放 3D CT VLM", "source": "NVIDIA Technical Blog：Agentic AI / Generative AI", "sourceUrl": "https://developer.nvidia.com/blog/introducing-nv-reason-ct-open-3d-ct-vlm-for-radiologist-chain-of-thought-reasoning", "date": "2026-09-22T16:00:00.000Z", "summary": "NVIDIA 发布 NV-Reason-CT，一款专为 3D CT 分析打造的开放视觉语言模型，将思维链推理扩展到全容积 CT，支持结构化报告生成、模拟放射科医生思维链和多轮追问对话。", "type": "model", "relTime": "6天前"}, {"id": 135, "title": "Runway 发布 DaVinci Resolve 插件，可在剪辑软件内生成和重绘素材", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/company-news/runway-davinci-resolve", "date": "2026-09-22T16:00:00.000Z", "summary": "Runway 发布 DaVinci Resolve 插件，可在 Resolve Studio 内直接生成图像和视频、重绘播放头下的片段，并将结果导入媒体池和时间线。", "type": "paper", "relTime": "6天前"}, {"id": 136, "title": "Grok 4.7 在特斯拉做实际工程", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2102423241897705926", "date": "2026-09-22T15:42:16.000Z", "summary": "Grok 4.7 在特斯拉做真正的工程工作  [引用 @yunta_tsai]：过去几周，Grok Build 团队为 4.7 优化了 harness：  - 更好的呈现，更少废话，更好的文笔 - 更好的自我验证 - 提升思考效率 - 改进长时程监控任务 - 改进 VLM 和多模态任务  我个人交付的许多 FSD 和 Cybercab 功能都是用我的过夜智能体完成的。  试试看。", "type": "paper", "relTime": "6天前"}, {"id": 137, "title": "Grok 4.7 生成交互式3D喷气引擎可视化", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2102422703798137219", "date": "2026-09-22T15:40:08.000Z", "summary": "Grok 4.7  [引用 @cb_doge]：Grok 4.7 在几分钟内将一个简单的提示词变成了这个交互式 3D 喷气发动机可视化工具。  这太疯狂了。🔥", "type": "paper", "relTime": "6天前"}, {"id": 138, "title": "Runway 推出 DIFFUSE：面向 AI 原生创意人才的招聘平台", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/company-news/introducing-diffuse", "date": "2026-09-22T15:14:37.236Z", "summary": "Runway 推出 DIFFUS function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";

      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }

}

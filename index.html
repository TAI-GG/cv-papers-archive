ry": "Runway 推出开放权重世界动作模型 Praxis-1，将视频预训练能力转化为机器人真实世界控制，定位为可跨任意具身形态与环境的策略模型。该模型基于其大规模视频预训练与实时基础设施构建，官方称机器人演示数据有限而视频数据无限。Runway 正与 Noble Machines、Standard Bots、Ultra 等早期伙伴测试，并将在未来数月公开权重。", "type": "model", "relTime": "5小时前"}, {"id": 13, "title": "JBR-001：基于 Arduino UNO Q 的开源可 3D 打印桌面机器人", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://projecthub.arduino.cc/syntheticaidata/jbr-001-a-desktop-companion-robot-powered-by-arduino-uno-q-b11c96", "date": "2026-09-30T17:26:06.993Z", "summary": "JBR-001 是一款基于 Arduino UNO Q 的开源、可 3D 打印桌面陪伴机器人，集摄像头、距离传感器、蜂鸣器、动画显示屏和三个舵机于一体，可支持计算机视觉与边缘 AI 实验。其 STL 文件已开放下载，用户可自行打印、组装和编程扩展。", "type": "tip", "relTime": "6小时前"}, {"id": 14, "title": "Vivix 推出 A1 Playground + Agent 实时交互角色模型", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2105342413422366989", "date": "2026-09-30T17:02:01.000Z", "summary": "Vivix 发布 A1 Playground + Agent，可创建能说话、移动和与人互动的实时 AI 角色，支持上传图片定制形象、性格和声音，并开放了 platform.vivix.ai 的创建入口。", "type": "model", "relTime": "7小时前"}, {"id": 15, "title": "NVIDIA 开放 2027–2028 研究生奖学金申请，最高 6 万美元", "source": "NVIDIA Blog（RSS）", "sourceUrl": "https://blogs.nvidia.com/blog/applications-open-graduate-fellowship-awards-2026/", "date": "2026-09-30T17:00:21.000Z", "summary": "NVIDIA 第 26 届研究生奖学金项目面向全球开放申请，每位学生最高可获 6 万美元资助，覆盖 AI、机器学习、自动驾驶、计算机图形、机器人、医疗和高性能计算等方向。", "type": "industry", "relTime": "7小时前"}, {"id": 16, "title": "研究称 Cloudflare、Google 等基础设施服务商助长 AI 换脸滥用图像网站", "source": "404 Media（RSS）", "sourceUrl": "https://www.404media.co/deepfake-abuse-sites-infrastructure-providers-study/", "date": "2026-09-30T16:02:39.000Z", "summary": "发表于斯坦福 Journal of Online Trust and Safety 的研究识别了88个活跃托管未经同意 AI 生成亲密图像的网站，指出 Cloudflare、Google、Namecheap、WordPress 和 Proton 五家为主要基础设施服务商，其中 Cloudflare 提供了大部分托管、CDN 和域名解析服务，尽管各家服务条款均禁止非法内容。", "type": "paper", "relTime": "7小时前"}, {"id": 17, "title": "Destro AI 获 800 万美元种子轮，用智能层让机器人与人类协同作业", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/ "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/008/909.htm", "date": "2026-09-30T13:01:44.000Z", "summary": "新加坡男子 Ye Lin 因用谷歌 Gemini 生成鳄鱼出现在 Pandan 水库的图片并发给同事，被指控传播虚假信息和妨碍司法公正，最高可判 10 年监禁、罚款 1 万新加坡元（约合 52,585 元人民币）。图片在网上扩散后，水务机构 PUB 接报搜寻鳄鱼并禁止水上活动，次日发现图片不实后报警；Ye Lin 随后删除了图片和操作记录，将于 11 月 10 日再次出庭。", "type": "industry", "relTime": "11小时前"}, {"id": 23, "title": "商汤 SenseNova 6.8 Flash 预览动态设计功能", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2105266408531570825", "date": "2026-09-30T12:00:00.000Z", "summary": "商汤预览由 SenseNova 6.8 Flash 驱动的 Dynamic Design，可将静态图像转为动态设计。该功能会理解文本、主体与视觉元素的关系，决定哪些保持静态、哪些做动画，并为每个元素选择 HTML/CSS、SVG、透明图片或视频等合适形式，再编排文字显现、主体运动与环境响应，最后对照源设计检查并优化输出。", "type": "paper", "relTime": "12小时前"}, {"id": 24, "title": "Meshy 7 实现包装文字精准生成", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2105243758870638787", "date": "2026-09-30T10:30:00.000Z", "summary": "AI 生成的包装上的文字：模糊、残缺，总要修一轮。这次不一样。😎  我们搭了一整架玩具。看看盒子上的字。  Meshy 7 直接从你的输入图像带来准确的文字、风格和颜色。一次生成，就能得到你想要的纹理。🎨  提示：想用同一种风格做一整套？用 3D Agent 批量处理，现已结束 beta。", "type": "paper", "relTime": "13小时前"}, {"id": 25, "title": "千问「逛展锦囊」上线：特展购票、随拍随问、方言讲解一站式搞定", "source": "公众号：千问APP（阿里）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzYzNDE5MDEwMQ==&mid=2247489074&idx=1&sn=88f11f43f50b74eceee902ad5cd1a153&chksm=f13c8340a063bb13701734b15e61307a953e0505b24395e6175488581cb7e5f1be45f4ff5ecf&scene=126&sessionid=1790762314#rd", "date": "2026-09-30T09:45:23.000Z", "summary": "千问APP推出十一假期「逛展锦囊」，用户可通过@山海文博展览助手查询特展信息并直接购票，逛展时用千问相机拍下展品即可获得讲解。该功能基于千问大模型的原生多模态视觉理解能力，结合文物类专项训练和海量博物馆数据，还支持切换「四川道长」等定制音色。", "type": "tip", "relTime": "14小时前"}, {"id": 26, "title": "豪威推出常开型视觉 AI 协处理器 OAX7700，停车监控方案仅需 3% 功耗", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/008/624.htm", "date": "2026-09-30T03:04:54.000Z", "summary": "豪威（OmniVision）发布常开型视觉 AI 协处理器 OAX7700，基于它构建的停车监控系统功耗仅为市面现有方案的 3%。该芯片集成 NPU，具备人体检测、人与物体识别、距离测算等边缘 AI 能力，可将现有车载外摄像头方案升级为超低功耗停车监控系统，检测到事件后录制 5~10 秒预录视频交由电子控制单元核验。", "type": "paper", "relTime": "20小时前"}, {"id": 27, "title": "剑桥等机构研究提出 vibercrime 概念：AI 加速廉价诈骗但未造出新黑客", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2105114842910884110", "date": "2026-09-30T01:57:44.000Z", "summary": "Jack Hughes、Ben Collier 和 Daniel R. Thomas 的论文分析近10万条网络犯罪论坛相关帖子，提出 vibercrime 一词：AI 是便利帮手而非犯罪的即插即用工具。生成式AI 主要扩大垃圾网站、机器人账号和拟人化诈骗信息的规模，编码助手多为已有编程能力者省时，尚未显著降低技术门槛或催生创新性黑客手段。", "type": "paper", "relTime": "22小时前"}, {"id": 28, "title": "livenerf 开源：用预注册基准长期检测 Claude Opus 5.5 发布后是否被削弱", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://github.com/ninjahawk/livenerf", "date": "2026-09-30T00:22:06.110Z", "summary": "livenerf 是一个 append-only 基准项目，目标是检测 Claude Opus 5.5 在 2026-09-22 发布后性能是否随时间漂移。", "type": "tip", "relTime": "23小时前"}, {"id": 29, "title": "Google 如何在 TPU 上加速视频扩散模型的时空注意力", "source": "Google Developers Blog（RSS）", "sourceUrl": "https://developers.googleblog.com/accelerating-spatio-temporal-attention-for-video-diffusion-on-tpus/", "date": "2026-09-30T00:00:00.000Z", "summary": "Google 在 TPU 上通过稀疏注意力内核优化加速视频扩散模型推理，将理论稀疏性转化为端到端实际加速。", "type": "tip", "relTime": "1天前"}, {"id": 30, "title": "Dyna Robotics 发布 Dyna-2.1 与半人形机器人 Taku，独立完成一小时洗衣房任务", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2105048999808131377", "date": "2026-09-29T21:36:06.000Z", "summary": "Dyna Robotics 发布 Dyna-2.1，称其为首个实现可靠超长时程全身自主的 Physical Agent，并搭配全新半人形硬件 Taku。作者转发引用其公开的一小时无剪辑视频：机器人独自运行酒店式洗衣房，装载并启动机器、叠好毛巾并上架，且在别处需要处理时能中断当前动作而不瞬间冻结，这依赖一个并行视觉语言模型监视房间、让 Dyna-2 持续保持手部运作。", "type": "model", "relTime": "1天前"}, {"id": 31, "title": "AMD 以 82 亿美元收购 World Labs，加码与 Nvidia 的竞争", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/09/amd-acquires-world-labs-ai-pioneer-fei-fei-lis-world-models-startup/", "date": "2026-09-29T21:14:49.000Z", "summary": "AMD 宣布将以 82 亿美元收购李飞飞联合创立的世界模型公司 World Labs，交易预计年底前完成，待监管批准。World Labs 2024 年以 2.3 亿美元融资成立，其首款公开工具 Marble 可用 Gaussian splats 生成小型 3D 空间并导出为影视、游戏用 3D 资产，该领域的重要用例之一是为机器人训练生成合成数据，而 Nvidia 在此领域领先。", "type": "industry", "relTime": "1天前"}, {"id": 32, "title": "马斯克在特朗普面前差点说漏AI", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2105034004789670169", "date": "2026-09-29T20:36:31.000Z", "summary": "马斯克在特朗普总统面前差点让\"AI\"脱口而出，及时改口说成了\"SI……超级智能\"。  随后他表示，我们不会\"只有全民基本收入，我们将拥有全民高收入。当你有机器人、有超级智能时，这意味着世界上每个人都能获得比在座任何人都更好的医疗服务。\" https://x.com/EricLDaugh/status/2105030609710035406/video/1", "type": "tip", "relTime": "1天前"}, {"id": 33, "title": "Drafted AI 户型图生成器上线 Revit 插件", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2105032750789210235", "date": "2026-09-29T20:31:32.000Z", "summary": "Drafted 的 AI 户型图生成器已作为插件登陆 Autodesk Revit，可将房屋轮廓和房间清单生成 5 套户型方案，且全部由真实的 Revit 墙体、楼板、屋顶、门窗构建。据 Drafted 测试，生成结果约需 45 秒；房间可删除并单独重新生成，其余方案保持不变，团队还能把生成的门窗墙体替换为自有组件并逐一手动编辑。", "type": "paper", "relTime": "1天前"}, {"id": 34, "title": "fal 扩展 Agent 在创作流程中的能力", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2105031762745098450", "date": "2026-09-29T20:27:36.000Z", "summary": "fal 宣布其 Agent 现在可覆盖更多创作环节：内置语音 Agent 可讨论想法，支持视频序列剪辑、在 Blender 中工作、排队和批量生成，并可同时运行多个工作流，作为一个创作伙伴贯穿整个流程。", "type": "paper", "relTime": "1天前"}, {"id": 35, "title": "OpenAI 在 Dev Day 发布 Space、Pages 等办公功能，ChatGPT 剑指微软办公套件", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/29/openai-takes-on-microsoft-with-the-launch-of-what-feels-a-whole-lot-like-chatgpts-own-office-suite/", "date": "2026-09-29T17:45:51.000Z", "summary": "OpenAI 在旧金山 Dev Day 上发布多项面向办公场景的 ChatGPT 新功能，包括共享工作区 Space、文档工具 Pages 和协作幻灯片，形式上接近微软办公套件。Space 中同事可与聊天机器人及新推出的 AI 智能体人格 Dots 协作处理工作任务；Pages 定位为面向人与智能体协作的新型文档，可写作、研究、生成图表和图像。这是 OpenAI 进一步切入微软办公软件腹地的举措。", "type": "paper", "relTime": "1天前"}, {"id": 36, "title": "Runway 加入 OpenAI Marketplace", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2104988068289843602", "date": "2026-09-29T17:33:58.000Z", "summary": "我们作为首发合作伙伴加入 @OpenAI Marketplace。  从今天起，你可以访问最优秀的图像、视频、音频和编辑模型，并可将部分 OpenAI 承诺额度用于在 Runway 上的购买。  点击下方链接了解更多并开始创作。", "type": "industry", "relTime": "1天前"}, {"id": 37, "title": "Apple Creator Studio 迎来新更新：全新模板、端到端电影级视频与效率功能", "source": "Apple：Newsroom（RSS）", "sourceUrl": "https://www.apple.com/newsroom/2026/09/new-updates-coming-to-apple-creator-studio/", "date": "2026-09-29T17:00:02.643Z", "summary": "Apple Creator Studio 将新增全新模板、端到端电影级视频制作流程以及多项提升效率的功能。Freeform 新增深色模式自适应画板、文件夹分组协作，并支持 Apple Intelligence 写作工具改写、校对和摘要手写笔记。在 visionOS 27 中，用户可将画板中的图片、视频、便签、形状和 3D 模型拖入空间并成组查看。", "type": "model", "relTime": "1天前"}, {"id": 38, "title": "Photo Scrubber：用 GPT-6 Astra 打造的本地人脸模糊与元数据清除工具", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/29/photo-scrubber/", "date": "2026-09-29T16:45:27.000Z", "summary": "Simon Willison 用 GPT-6 Astra 构建了实验性工具 Photo Scrubber，可自动识别人脸并模糊处理。该工具基于 Google 的 MediaPipe C++ 库，通过 @mediapipe/tasks-vision 编译为 WebAssembly，并使用 BlazeFace 人脸检测模型，全程在本地运行。", "type": "tip", "relTime": "1天前"}, {"id": 39, "title": "NVIDIA 扩展 xio-sig 加入 cuObject，并发布 SCADA Server SDK", "source": "NVIDIA Technical Blog：Agentic AI / Generative AI", "sourceUrl": "https://developer.nvidia.com/blog/expanding-ai-storage-access-with-nvidia-cuobject-and-the-nvidia-scada-server-sdk/", "date": "2026-09-29T16:00:00.000Z", "summary": "NVIDIA 宣布 xio-sig 在 cuFile 之外新增 cuObject，并正式开放 cuObject 客户端与服务器库，开发者可通过其 API 和 RDMA 线协议构建加速对象存储应用。同步推出的 SCADA Server SDK 让存储厂商构建响应 GPU 发起请求的 SCADA 服务器，IBM 已用集成 Storage Scale 的原型验证互操作性。", "type": "product", "relTime": "1天前"}, {"id": 40, "title": "Tripo 与 Grok 打造 SpaceX 火星任务游戏", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2104949319686127873", "date": "2026-09-29T15:00:00.000Z", "summary": "嘿 @grok，给我们的火星基地打个分吧！✨  为庆祝 Starship Flight 14 发射，我们在浏览器里做了一个完全可玩的 SpaceX 火星任务。  Grok 负责核心游戏逻辑和编码，Tripo 则即时生成 3D 资产。  从提示词到一个完全可玩的世界。我们准备好升空了吗，@SpaceX？", "type": "paper", "relTime": "1天前"}, {"id": 41, "title": "豪威集团发布 OX08D30 车外摄像头图像传感器：800 万像素，支持 LED 闪烁抑制", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/008/363.htm", "date": "2026-09-29T08:21:49.000Z", "summary": "豪威集团发布 800 万像素 CMOS 汽车图像传感器 OX08D30，基于 TheiaCel™ 技术，面向 ADAS 与自动驾驶车外摄像头，现已出样并进入量产。该传感器可抑制 LED 闪烁，最远检测距离达 200 米，与 OX08D10 引脚对引脚兼容，功耗降低 20%、尺寸缩减 50%。", "type": "industry", "relTime": "1天前"}, {"id": 42, "title": "叶序：一款音频响应式LED显示屏", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://jagi.studio/posts/phyllotaxis/", "date": "2026-09-29T07:33:05.802Z", "summary": "开发者用 Processing 生成黄金角螺旋点阵并做 Voronoi 剖分，再用 CadQuery 建模、3D 打印出 89 颗可寻址 RGB LED 的叶序造型灯盘。灯盘由 STM32 blackpill 驱动，通过 SPI 控制 neopixel，并接入 INMP441 I2S 数字麦克风，借助 ARM CMSIS 库做傅里叶变换与多频段能量分析，实现随房间声音变化的音频响应效果。", "type": "tip", "relTime": "1天前"}, {"id": 43, "title": "Runway 如何帮世界杂耍联盟用 AI 补满电视转播的空座位", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/customers/world-juggling-federation", "date": "2026-09-29T00:52:14.404Z", "summary": "世界杂耍联盟（WJF）创始人 Jason Garfield 用 Runway 为荷兰两日赛事的转播补全观众席：首日满座、次日侧机位空座，他用 Aleph 2.0 在原始素材中加入观众而不改动画面其他部分，仅一个极广角镜头退回 After Effects 处理。他还用 Runway 生成开场动画、选手资料卡、排行榜和舞台烟火，整档约一小时特别节目由他一人完成，单段生成时长上限约 15 秒。", "type": "tip", "relTime": "1天前"}, {"id": 44, "title": "OpenRouter 对比 Veo 3.1、Seedance、Kling、Grok Imagine Video 的图生视频能力与价格", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/insights/image-to-video-models-compared/", "date": "2026-09-29T00:00:00.000Z", "summary": "OpenRouter 对比其平台上 Veo 3.1 系列、Seedance 2.5/2.0 系列、Kling v3.0 与 Grok Imagine Video 各模型的图生视频设置，涵盖分辨率、时长、首尾帧控制、音频和每秒价格，数据核查于 2026 年 9 月 11 日。", "type": "tip", "relTime": "2天前"}, {"id": 45, "title": "OmniTaskonomy：视觉生成何时能提升视觉理解？", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38079", "date": "2026-09-29T00:00:00.000Z", "summary": "研究通过配对 I2I 生成与 I2T 理解任务发现，在合适训练配方下 I2I 训练能提升下游 I2T 表现，且 I2I 训练数据越多增益越大。", "type": "paper", "relTime": "2天前"}, {"id": 46, "title": "SplitMoE：用分角色稀疏架构打破视频扩散模型的均匀性陷阱", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38140", "date": "2026-09-29T00:00:00.000Z", "summary": "针对传统 token-wise MoE 因均匀专家使用正则化导致的\"均匀性陷阱\"，SplitMoE 提出分角色稀疏架构，将专家池拆分为语义专家与通用专家，配合原型引导路由和拉推正则化，让 token 按语义属性自然聚类。在等效激活参数预算下，SplitMoE 在收敛速度、路由一致性和视频生成质量上均优于传统负载均衡 MoE。", "type": "paper", "relTime": "2天前"}, {"id": 47, "title": "Grounded Entity Biographies（GEB）：用实体传记增强长视频记忆", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38155", "date": "2026-09-29T00:00:00.000Z", "summary": "研究者提出长视频记忆框架 Grounded Entity Biographies（GEB），将跨片段的同一物理实例的视觉观测归组为可检索的\"传记\"，并在问答时与情节证据一同检索，让模型沿身份链接追踪实体。", "type": "paper", "relTime": "2天前"}, {"id": 48, "title": "LongLive-Plug：面向视频生成的一次性蒸馏框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38154", "date": "2026-09-29T00:00:00.000Z", "summary": "LongLive-Plug 是一个一次性蒸馏框架，把可复用能力以 LoRA 形式学在基座模型上，无需重训练即可即插即用到兼容的下游模型。这些能力涵盖单次 classifier-free guidance、少步采样和自回归生成的长上下文纠错，即使下游模型新增条件分支或扩展输出通道仍可复用。团队在三个骨干家族、八类任务的 54 个下游模型上验证了免训练部署，包括世界建模、机器人、编辑和多模态生成。", "type": "paper", "relTime": "2天前"}, {"id": 49, "title": "Think Before You Score：面向视觉生成的思想奖励模型 TRM", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.37372", "date": "2026-09-29T00:00:00.000Z", "summary": "研究者提出 Thinking Reward Model（TRM），先为每个样本生成自适应评分标准再做评估，输出细粒度 pointwise 奖励，并引入 PD-GRPO 缓解成对偏好优化导致的分数极化。在图像生成与编辑奖励建模基准上，TRM 在开源奖励模型中达到 SOTA，并可与闭源方案竞争；作为强化学习奖励信号还能稳定提升多种视觉生成模型。", "type": "paper", "relTime": "2天前"}, {"id": 50, "title": "EVO-WAM：通过视频-动作验证让世界动作模型自我进化", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38057", "date": "2026-09-29T00:00:00.000Z", "summary": "EVO-WAM 让世界动作模型无需额外专家演示即可适应新任务，通过状态预测与锚定多帧上下文实现自回归 rollout，并用视觉语言模型筛选完成任务的前缀、以逆动力学模型验证视频-动作一致性后迭代训练。", "type": "paper", "relTime": "2天前"}, {"id": 51, "title": "HiRAE：带残差预算的分层表示自编码器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.37775", "date": "2026-09-29T00:00:00.000Z", "summary": "HiRAE 提出分层表示自编码器，按深度对编码器各层分组并学习对最深表示的残差修正，用分组范数上限约束修正幅度、浅层预算更紧。HiRAE-24 保持潜变量 token 数与通道维度不变，在 ImageNet-256 上将重建 FID 从 RAEv2 的 0.299 降至 0.209，并维持有竞争力的引导生成质量。", "type": "paper", "relTime": "2天前"}, {"id": 52, "title": "改进的分布扩散模型：DiT-XL/2 在 ImageNet-256² 上 4 步达 4.48 FID", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.37147", "date": "2026-09-29T00:00:00.000Z", "summary": "改进的分布扩散模型（DDM）通过将粒子扩展推迟到 Transformer 后层，并引入基于动力学区间的时间相关评分规则调度，解决了多粒子训练开销随粒子数增长、评分规则超参数全局固定的问题。", "type": "paper", "relTime": "2天前"}, {"id": 53, "title": "SoL-Refiner：一步精修实现 4K 高分辨率视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.37969", "date": "2026-09-29T00:00:00.000Z", "summary": "SoL-Refiner 是一种单步视频精修器，可将低分辨率模型输出经一次去噪直接转为 4K 视频，其训练流程包含高分辨率持续训练、强化学习后训练与最终的单步蒸馏。", "type": "paper", "relTime": "2天前"}, {"id": 54, "title": "LIFT：通过 On-Policy 自蒸馏实现大视角变化下的未来布局视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38146", "date": "2026-09-29T00:00:00.000Z", "summary": "研究团队提出 LIFT，一个统一的图像到视频生成框架，用末帧布局作为显式控制信号，让用户指定未来视角中出现什么内容及其位置。由于稀疏布局引导比逐帧密集布局更难学习，LIFT 引入 on-policy self-distillation（OPSD），将密集布局教师模型的控制能力迁移给末帧布局学生模型。", "type": "paper", "relTime": "2天前"}, {"id": 55, "title": "Real2Gym：从视频构建仿真训练场，把技能带给机器人", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.37089", "date": "2026-09-29T00:00:00.000Z", "summary": "Real2Gym 是一个 Real2Sim2Real 智能体框架，能把人类和机器人演示视频转成可交互仿真训练场，并将仿真中学到的技能迁移到实体机器人。其仿真环境重建成功率比 GPT-6 Astra Direct Mode 高 16.7%，策略执行 token 减少约 74.9%；在真实 Franka 机器人四项任务上，实体执行成功率高出 33.3%。", "type": "paper", "relTime": "2天前"}, {"id": 56, "title": "Scaffolding Minds：为多模态推理优化潜在视觉目标表示", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.19669", "date": "2026-09-29T00:00:00.000Z", "summary": "Scaffolding Minds 针对潜在推理两阶段框架的两个缺陷提出改进：用专门学习的 scaffolding encoder 在潜在空间提供优化目标，并同时学习 RL 采样器的均值和方差以支持探索。该方法在 FrozenLake 空间规划上比最强潜在推理基线提升 +9.5 分，32x32 网格上提升扩大至 +19 分，在九个视觉中心推理基准上平均提升 +5.6 分。", "type": "paper", "relTime": "2天前"}, {"id": 57, "title": "像素扩散模型的对抗训练后训练研究：恢复高频细节并提升分布保真度", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38170", "date": "2026-09-29T00:00:00.000Z", "summary": "研究首次系统探索像素扩散模型的对抗后训练：在预训练模型上保留原有扩散或流匹配目标，对非高噪声时间步的预测输出加入对抗损失，架构与采样流程不变。在两个像素骨干上，该方法同时提升了分布保真度、覆盖度、提示词对齐和感知质量；频谱分析显示原模型系统性缺失自然图像高频成分，对抗后训练可将其恢复。在测试的潜空间扩散配置下，同样流程未带来可比增益，几乎不增加解码后的高频功率。", "type": "paper", "relTime": "2天前"}, {"id": 58, "title": "VideoLoop：用循环工作记忆对抗长视频智能体的语义抖动", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38119", "date": "2026-09-29T00:00:00.000Z", "summary": "多模态智能体框架 VideoLoop 通过外循环推理视频、内循环从无界文件系统检索历史观察并重写有界工作记忆，解决长视频理解中\"语义抖动\"导致的注意力崩溃问题。", "type": "paper", "relTime": "2天前"}, {"id": 59, "title": "FocusVTC：自适应分辨率的高效视觉文本压缩", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.36651", "date": "2026-09-29T00:00:00.000Z", "summary": "FocusVTC 通过自适应分辨率打破视觉文本压缩的固定分辨率权衡，在保留通用多模态能力的同时压缩输入长度。在 RULER v1 上以 72 DPI 取得 87.4 分、2.9 倍输入压缩，超过 Glyph 的 57.5 分；LongBench 得分 56.40 高于文本输入基线的 55.86，MRCR 宏平均提升 13.91 分，在线端到端延迟较纯文本提速 2.79 倍。", "type": "paper", "relTime": "2天前"}, {"id": 60, "title": "WorldLine：面向机器人操作的动作驱动视觉模拟器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38059", "date": "2026-09-29T00:00:00.000Z", "summary": "WorldLine 是一个动作驱动的视觉模拟器，将可迁移的动力学学习与异构动作对齐解耦，基于超过 10,000 小时无动作机器人视频学习操作动力学，并用超过 2,000 小时、覆盖十余种本体的动作轨迹完成对齐。", "type": "paper", "relTime": "2天前"}, {"id": 61, "title": "Bonjour 用 Runway 将一份脚本生成所有广告风格", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/customers/bonjour", "date": "2026-09-28T23:46:29.430Z", "summary": "法国适应原饮料品牌 Bonjour 的 15 人创意团队用 Runway 把一份脚本批量生成多种动画风格广告，从脚本到效果判定只需 4 到 5 天，成品动画批次 24 到 48 小时完成。团队已用 Runway 产出超过 500 个视频和图像变体，并称转向内部生成创意后省下逾 5 万欧元外部制作费用；改用 Runway 企业版后不再受 credits 限制，可继续加大测试投入。", "type": "paper", "relTime": "2天前"}, {"id": 62, "title": "李飞飞谈大语言模型的局限", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2104716942317875249", "date": "2026-09-28T23:36:37.000Z", "summary": "李飞飞博士谈大语言模型的局限。  “语言纯粹是生成的信号。你不会走到自然界里，发现天上写着字。存在的是一个遵循物理定律的 3D 世界。”", "type": "tip", "relTime": "2天前"}, {"id": 63, "title": "快手可灵 AI Kling 4.0 将于 10 月上线，Kling 4.0 Flash 已开放抢先体验", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/008/073.htm", "date": "2026-09-28T22:55:38.000Z", "summary": "快手可灵 AI 宣布 Kling 4.0 将于 10 月正式上线，Kling 4.0 Flash 已于 9 月 28 日向黑金年卡会员开放抢先体验。", "type": "paper", "relTime": "2天前"}, {"id": 64, "title": "ElevenLabs v4 上线 Runway", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2104698524885794938", "date": "2026-09-28T22:23:26.000Z", "summary": "ElevenLabs v4 现已登陆 Runway。v4 模型擅长旁白和角色对话，表现力和语调自然度均超越以往。  即日起可用，与全球顶尖的图像和视频模型一同提供。点击下方链接立即体验。", "type": "model", "relTime": "2天前"}, {"id": 65, "title": "AMD 以约 82 亿美元全股票收购李飞飞联合创办的 World Labs", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/1001749/amd-world-labs-ai-acquisition-deal", "date": "2026-09-28T21:31:35.000Z", "summary": "AMD 宣布以约 82 亿美元的全股票交易收购李飞飞联合创办的 AI 研究实验室 World Labs，交易预计年底前完成。World Labs 于 2024 年成立，2025 年推出从提示词生成可交互 3D 世界的商业产品 Marble；李飞飞将出任 AMD EVP 兼首席科学家，向 CEO Lisa Su 汇报，团队继续推进 AI 模型研究。", "type": "industry", "relTime": "2天前"}, {"id": 66, "title": "Manus Studio 炼金模式一键生成视频", "source": "X：Manus (@ManusAI)", "sourceUrl": "https://x.com/ManusAI/status/2104665826007888234", "date": "2026-09-28T20:13:30.000Z", "summary": "一个提示词。一个精修视频。  Manus Studio 的炼金模式，感觉就像拥有一整支创意团队，在为你导演、编剧、分镜，并跟着音乐节奏剪辑每一个节拍。  视频、原始提示词和完整会话都在推文串里。", "type": "paper", "relTime": "2天前"}, {"id": 67, "title": "李飞飞宣布 World Labs 并入 AMD，出任执行副总裁兼首席科学家", "source": "X：Fei-Fei Li (@drfeifei, World Labs)", "sourceUrl": "https://x.com/drfeifei/status/2104664403681632453", "date": "2026-09-28T20:07:51.000Z", "summary": "李飞飞宣布 World Labs 加入 AMD，她本人将出任 AMD 执行副总裁兼首席科学家。World Labs 成立于 2024 年初，专注空间智能基础模型，近期发布了可从 2D 图像预测新相机视角的 omni 模型 Atlas，并通过收购 SceniX 布局机器人模拟；她表示加入 AMD 是为了更贴近硬件、扩大规模，并继续向社区提供开放模型与端到端平台。", "type": "industry", "relTime": "2天前"}, {"id": 68, "title": "PreviewDiff：用多模态评审引导扩散潜变量搜索", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.36199", "date": "2026-09-28T20:00:41.000Z", "summary": "PreviewDiff 是一种免训练测试时搜索方法，把扩散采样从标量搜索变为对中间潜变量的多模态评审引导搜索：在选定的去噪检查点解码部分预览，由多模态评审模型打分并给出自然语言批评，据此在语义提示词编辑和局部重新加噪的潜变量延续上分支，再对分支打分并选择性推进。在图像和视频生成基准上，它持续优于同等预算的 Best-of-N 选择和强标量搜索基线；消融显示更早介入和更大搜索宽度收益最大。", "type": "paper", "relTime": "2天前"}, {"id": 69, "title": "HN.watch：为所有 Hacker News 帖子生成短视频解说", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://hn.watch/", "date": "2026-09-28T19:46:03.029Z", "summary": "HN.watch 上线，为 Hacker News 每条帖子配一段短视频解说，点击标题即可观看。该站由 scrimba 制作，声明与 Y Combinator 无关，不设 cookie 与追踪脚本，仅做匿名每日聚合。", "type": "paper", "relTime": "2天前"}, {"id": 70, "title": "Perplexity Computer 科普视频功能", "source": "X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)", "sourceUrl": "https://x.com/AravSrinivas/status/2104593373026038209", "date": "2026-09-28T15:25:36.000Z", "summary": "这是我小时候会很喜欢的东西  （引用推文概括：Computer 可以从 Wiley Online Library 等科学来源提取信息，生成讲解视频。Wiley 数据对所有 Computer 用户免费开放，无需设置或现有订阅。）", "type": "paper", "relTime": "2天前"}, {"id": 71, "title": "商汤 Seko 助 22 岁学生独立制作 AI 短剧", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2104588113595314606", "date": "2026-09-28T15:04:42.000Z", "summary": "22 岁艺术设计学生 CHunye 用商汤 AI 视频创作 Agent Seko 独立制作日式僵尸短剧《DUHAI》，从第 3 集起全部由 Seko 完成，原本需要完整制作团队的工作如今一人即可完成。Seko 将创意转化为结构化制作流程，在同一画布上整合角色、场景与道具，其视觉记忆与推理能力保证跨集一致性。该剧在抖音累计播放量已突破 7400 万次。", "type": "paper", "relTime": "2天前"}, {"id": 72, "title": "祖父被 AI 深度伪造语音诈骗后，Tarini Padmanabhuni 创办 DetectifAI 做端侧检测", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/28/after-a-deepfake-voice-fooled-her-grandfather-this-founder-sprang-into-action/", "date": "2026-09-28T15:00:00.000Z", "summary": "Tarini Padmanabhuni 因祖父被 AI 深度伪造语音冒充其兄弟骗走赎金，创办旧金山公司 DetectifAI，做可在手机操作系统内本地运行的紧凑 AI 模型，在通话和语音消息中即时判断声音是否为 AI 生成，音频不出设备。", "type": "industry", "relTime": "2天前"}, {"id": 73, "title": "Meta 发布 Muse 系列模型与 API", "source": "X：AI at Meta (@AIatMeta)", "sourceUrl": "https://x.com/AIatMeta/status/2104579386024603826", "date": "2026-09-28T14:30:01.000Z", "summary": "过去 6 个月……  - Muse Spark - Muse Image - Muse Video - Muse Spark 1.1 - Meta Model API - Muse Glimmer - Muse Spark 1.2 - Muse Code - Muse Spark 1.3 - Muse  ……而我们才刚刚开始。🚀", "type": "industry", "relTime": "2天前"}, {"id": 74, "title": "404 Media 报道：人类审核员正在阅读 Microsoft Copilot 的提示词与图像并感到震惊", "source": "404 Media（RSS）", "sourceUrl": "https://www.404media.co/humans-reading-copilot-prompts-images/", "date": "2026-09-28T13:26:31.000Z", "summary": "404 Media 报道称，Microsoft 聘请的人类承包商为改进 Copilot 而持续审核用户上传的提示词和图像，其中大量涉及性暴露内容，如偷拍裙底照片或将女性置于性姿势的编辑请求。这些承包商还需判断生成图像是否完成提示词要求，例如 AI 放大的胸部是否足够大。", "type": "industry", "relTime": "2天前"}, {"id": 75, "title": "商汤发布AI视频创作Agent Seko，助力个人创作者打造百万播放短剧", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2104526535751287134", "date": "2026-09-28T11:00:00.000Z", "summary": "商汤科技（SenseTime）宣传其AI视频创作Agent“Seko”。案例显示，22岁艺术生CHunye利用Seko独立制作了日式丧尸短剧《DUHAI》，从第3集起完全由该工具生成。Seko能将创意转化为结构化工作流，通过视觉记忆和推理保持角色、场景跨集一致性。该系列在抖音等平台累计观看量超7400万，展示了AI赋能“一人公司”（OPC）的潜力。", "type": "paper", "relTime": "2天前"}, {"id": 76, "title": "AI每日简报：OpenAI修复GPT-6视觉Bug，Anthropic疑似新模型标签曝光", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2104493424472674634", "date": "2026-09-28T08:48:26.000Z", "summary": "该帖子为2026年9月28日的AI新闻聚合。主要内容包括：OpenAI修复了GPT-6 Sol和Luna的图像编码Bug；ChatGPT代码中发现“o”引用，传闻涉及Pro计划调整；Meta Muse增加VM屏幕浏览标签；Google Flow指向Nano Banana 2.1并测试印度Gemini购物功能；xAI Grok响应变快；Anthropic出现claude-sonnet-5-5标...", "type": "industry", "relTime": "2天前"}, {"id": 77, "title": "字节火山引擎发布 Seedance 影视合作计划，单项目激励最高百万", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/867.htm", "date": "2026-09-28T08:16:34.000Z", "summary": "9月27日，字节跳动旗下火山引擎在平遥国际电影展期间发布 Seedance 影视合作计划。该计划面向全球专业影视项目提供 Token 补贴、宣发资源及技术支持，单个项目激励最高可达百万人民币。参与要求包括全片视频生成环节100%由 Seedance 实现，支持全 AI 生成或 AI+真人混合制作，且重点鼓励在制作方法与工作流程上实现创新突破的项目。", "type": "industry", "relTime": "2天前"}, {"id": 78, "title": "昆仑万维天工工作台上线AI MV创作与音乐生成能力", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI1MzE1NDc3Mg==&mid=2247510445&idx=1&sn=986335f6da07fef6af3111ddf76db4bb&chksm=e802de782531392ddf63eed55984898d7d404510424c49f6a7f699cbca6e869a490e48071af7&scene=126&sessionid=1790588864#rd", "date": "2026-09-28T08:02:09.000Z", "summary": "9月27日，昆仑万维旗下SkyProduction（天工工作台）上线三项新能力：开放AI MV创作功能；无限画布接入Mureka V8/V9/V9.5音乐生成模型；视频和图片支持智能配乐。用户可在同一画布完成从音乐分析、分镜规划到视频生成的全流程，并调用Seedance 2.5模型生成视频片段。", "type": "model", "relTime": "2天前"}, {"id": 79, "title": "华为余承东宣布智界 RX 获 L3 级自动驾驶测试牌照并开展实测", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/834.htm", "date": "2026-09-28T07:11:49.000Z", "summary": "在智界 RX 及鸿蒙智行新品发布会上，华为余承东宣布智界 RX 搭载 L3 级自动驾驶架构，已获批 L3 级道路测试牌照，正在城市快速路等复杂公开道路开展实测。该车还配备全维防碰撞系统 CAS 5.0。此前曝光的测试视频显示，车辆通过方向盘“A”键激活 L3 模式，中控屏会显示相应状态。", "type": "industry", "relTime": "2天前"}, {"id": 80, "title": "Meta 推出 Hologram 拟真虚拟形象，秋季上线雷朋眼镜与 Quest 头显", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/767.htm", "date": "2026-09-28T04:31:04.000Z", "summary": "Meta 宣布将于今年秋季在雷朋 Display 智能眼镜、Quest 头显及新轻薄头显上推出“Hologram”功能。该功能利用生成式 AI（实时扩散模型）创建高度拟真的用户虚拟形象，替代传统摄像头画面用于 WhatsApp 视频通话。用户需通过手机 Meta AI 应用采集面部表情和语音数据完成建模。雷朋版基于音频驱动生成 2D 视频流，Quest 版支持 3D 等身立体呈现。目前存在细...", "type": "model", "relTime": "2天前"}, {"id": 81, "title": "开发者用英伟达 RTX Remix 让《GTA 2》支持光追", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/764.htm", "date": "2026-09-28T04:16:21.000Z", "summary": "Mod 作者 gebdag 发布《GTA 2》RTX Remix 模组，为这款 1999 年的 2D 俯视角游戏带来完整路径追踪和动态昼夜光照。由于 RTX Remix 不原生支持游戏所用的 DirectDraw 和早期 Direct3D，作者用两个 DLL 搭建定制 Direct3D 9 封装层完成转换，并解锁 16:9 宽屏与帧生成，帧率最高 60 FPS。", "type": "paper", "relTime": "2天前"}, {"id": 82, "title": "Google Research 推出 AI 视频联合导演，用 4 个智能体框架生成连贯的长视频", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/27/google-research-introduces-an-ai-video-co-director-4-agentic-frameworks-for-coherent-minutes-long-video-generation", "date": "2026-09-28T02:44:27.000Z", "summary": "Google Research 推出 AI 视频联合导演，由 4 个智能体框架组成，运行在 Gemini 和 Veo 之上，用于解决多镜头 AI 视频中的身份漂移和级联错误问题。", "type": "paper", "relTime": "2天前"}, {"id": 83, "title": "PixVerse 插件一键生成音乐 MV", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2104400073992102329", "date": "2026-09-28T02:37:30.000Z", "summary": "GPT-6 Astra 用一个提示词剪出了一支时尚说唱 MV  安装 PixVerse 插件，告诉智能体你想要什么，就能得到你自己的音乐视频", "type": "paper", "relTime": "2天前"}, {"id": 84, "title": "群核科技用空间智能重建永泰龟城，24 亿高斯点刷新全球 3D 高斯重建纪录", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/yunqipartners/manycore-techs-spatial-intelligence-continues-century-old-tu", "date": "2026-09-28T02:36:59.000Z", "summary": "群核科技联合博主「特能斯」4 人 4 天在甘肃永泰龟城采集 6 万多张照片，通过 3D 高斯重建平台 Aholo Reality 生成 24 亿高斯点、60 万平方米的数字古城，刷新全球公开可查的 3D 高斯重建纪录。该数字场景已交给景泰当地文旅作为永久数字文化档案保存，并依托 Aholo Viewer 的流式调度能力支持在线漫游；同一场景还被用于 LuxReal 生成 AI 短剧《永泰无战事》。", "type": "paper", "relTime": "2天前"}, {"id": 85, "title": "GPT-Image 2.5 的12种照片编辑与创意玩法教程", "source": "公众号：数字生命卡兹克", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA==&mid=2647686740&idx=1&sn=ae96d1c72375f5ad62ddb05432b04584&chksm=f1bd9f85e967fd41ec107fa4817e47acde4524b0a82166498a694df54b55edaca2674d909de4&scene=126&sessionid=1790572866#rd", "date": "2026-09-28T00:28:00.000Z", "summary": "文章介绍了利用 GPT-Image 2.5 模型进行照片精准编辑和创意生成的12种具体玩法，包括消除背景游客、自动调光、专业美颜、制作3D公仔拍立得、景点明信片、主体贴纸化、旅游碎片行李箱、人物海报、演唱会氛围感照片、美食飞溅效果、物体转文字涂鸦及Ins风注释等。每种玩法均提供了详细的提示词示例和操作步骤，旨在帮助用户在假期通过AI优化朋友圈照片。", "type": "tip", "relTime": "2天前"}, {"id": 86, "title": "GeoVerse：在几何隐空间中实现世界一致的新视角合成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35734", "date": "2026-09-28T00:00:00.000Z", "summary": "GeoVerse 通过在预训练 3D 基础模型的几何隐空间中生成、并注入视频生成模型的外观先验，实现世界一致的新视角合成。它从 Wan2.2 VACE 提取多层级特征，经 ControlNet 式适配器注入几何隐扩散模型，并用全局空间记忆聚合已观测与合成内容以保持跨视角连贯。", "type": "paper", "relTime": "3天前"}, {"id": 87, "title": "SolveEdit：生成模型视觉问题求解基准测试", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35504", "date": "2026-09-28T00:00:00.000Z", "summary": "研究者推出 SolveEdit 基准，用于评估生成模型通过场景变换完成视觉问题求解的能力，包含 2,728 个案例，并用原子变换契约与 SolveScore 在无需参考输出的情况下衡量完成度与误改。", "type": "paper", "relTime": "3天前"}, {"id": 88, "title": "EditWorld：面向可交互世界的精准编辑与灵活引用视频世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34470", "date": "2026-09-28T00:00:00.000Z", "summary": "EditWorld 是一个支持精准编辑与灵活引用的视频世界模型，可在自回归生成过程中流式接收编辑指令和参考图像，将世界建模从探索扩展到精准修改。它引入 Gated Causal Attention 处理时变编辑条件与参考图像，并用 Sparse Context 机制维持有界历史上下文以支持长时程推理。", "type": "paper", "relTime": "3天前"}, {"id": 89, "title": "EvolvingAvatar：随对话演进自适应调整的交互式 3D 头部生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35616", "date": "2026-09-28T00:00:00.000Z", "summary": "EvolvingAvatar 是一种因果生成器，通过测试时训练在交互过程中适配用户面部视频与双人音频，其双人上下文预测目标无需测试时目标动作标注即可提供自监督信号。", "type": "paper", "relTime": "3天前"}, {"id": 90, "title": "距离去掉视觉编码器还有多远？无编码器多模态预训练的缩放定律", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35457", "date": "2026-09-28T00:00:00.000Z", "summary": "研究对比了无编码器与有编码器多模态大模型的缩放定律，发现去掉视觉编码器会把多模态目标的算力最优分配推向更大模型，文本目标则几乎不变。两者在文本目标上损失-算力前沿几乎重合，但多模态目标上无编码器模型小规模时落后，预计约 10^22 FLOPs 时追平。无编码器时语言模型通过视觉专属适配接管其角色：视觉 token 双向交互随算力增长愈发有益，视觉处理前移，视觉 token 的专家路由更集中。", "type": "paper", "relTime": "3天前"}, {"id": 91, "title": "ControlScope：LLM 智能体的工作流修订与可靠性", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34313", "date": "2026-09-28T00:00:00.000Z", "summary": "ControlScope 对比了 LLM 智能体在同一公开执行状态下继续生成代码、编辑下一次工具调用的数据参数、以及替换未完成工作流三种修订方式，并区分可用修复与智能体实际选择的动作。", "type": "paper", "relTime": "3天前"}, {"id": 92, "title": "GEAR：用几何作为地址路由注意力，实现长时程相机控制视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34722", "date": "2026-09-28T00:00:00.000Z", "summary": "研究者提出 GEAR，一个以几何为 token 级地址来路由视觉记忆的注意力框架，用于长时程相机控制视频生成。", "type": "paper", "relTime": "3天前"}, {"id": 93, "title": "Just MLPs：为多模态语言模型高效重建视觉状态", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34972", "date": "2026-09-28T00:00:00.000Z", "summary": "研究提出 δ-Vision，用轻量低秩适配器构建逐层视觉记忆，替代视觉 token 在 Transformer 中的重复演化，同时保留全部视觉 token 供文本检索。该方法发现视觉到文本的信息流集中在低维子空间，且轻量 MLP 能以高余弦相似度和低重建误差逼近各层视觉状态。在图像和视频基准上，δ-Vision 在相当或更低计算量下准确率超过视觉 token 剪枝基线，且不丢弃视觉 token。", "type": "paper", "relTime": "3天前"}, {"id": 94, "title": "MT-OPSD：面向多轮图像编辑的在线策略自蒸馏框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35611", "date": "2026-09-28T00:00:00.000Z", "summary": "针对现有图像编辑模型在递归编辑中快速退化的问题，研究者提出 MT-OPSD 在线策略自蒸馏框架，让模型在自生成的条件下状态上训练，并由干净条件教师模型提供编辑监督，无需多轮标注。该工作同时发布 LME-Bench，包含 100 组十轮编辑会话，用于评估长程鲁棒性。在三个编辑骨干上的实验显示，MT-OPSD 显著提升长程编辑成功率、减少多轮崩溃，并基本保持单轮编辑质量。", "type": "paper", "relTime": "3天前"}, {"id": 95, "title": "SCOPD：面向高效视觉语言模型的稀疏上下文同策略自蒸馏", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34044", "date": "2026-09-28T00:00:00.000Z", "summary": "针对推理型视觉语言模型（VLM）视觉 token 序列过长导致推理昂贵的问题，研究者提出稀疏上下文同策略自蒸馏框架 SCOPD：学生模型基于剪枝后的视觉 token 生成推理轨迹，由拥有完整上下文的教师模型对同一同策略前缀进行监督，无需真实答案、架构改动或额外推理开销。", "type": "paper", "relTime": "3天前"}, {"id": 96, "title": "UMM-Reflection：用交错强化学习让统一多模态模型学会原生反思", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35767", "date": "2026-09-28T00:00:00.000Z", "summary": "UMM-Reflection 通过交错强化学习，让统一多模态模型在一条轨迹内完成\"诊断—修改—再观察\"的完整反思循环，轨迹级优势同时更新反思 token 与基于流的图像修改，推理时无需外部验证器。", "type": "paper", "relTime": "3天前"}, {"id": 97, "title": "SentZero：面向多任务零样本胸部 X 光分析的句子级视觉语言预训练框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34479", "date": "2026-09-28T00:00:00.000Z", "summary": "SentZero 是一个句子级视觉语言预训练框架，用于零样本、多任务的胸部 X 光（CXR）分析。它通过基于 LLM 的摘要级句子结构化与映射扩大正样本对多样性，并新增损失项缓解临床等价句子造成的假阴性，同时对视觉嵌入做句子条件残差调制。在多个下游任务和数据集上，SentZero 提升了零样本泛化能力，优于此前的多任务零样本方法。", "type": "paper", "relTime": "3天前"}, {"id": 98, "title": "FlowTool：用流匹配控制图像修饰中的工具参数", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35673", "date": "2026-09-28T00:00:00.000Z", "summary": "FlowTool 将基于工具的图像修饰建模为流匹配问题，用条件整流流直接生成工具参数，由视觉语言模型骨干加 Diffusion Transformer 参数生成器组成，把高斯噪声转成编辑方案。", "type": "paper", "relTime": "3天前"}, {"id": 99, "title": "AnswerMap：从答案后验构建 VLM 的忠实空间可解释性方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35247", "date": "2026-09-28T00:00:00.000Z", "summary": "论文提出 AnswerMap，一种免训练、任务无关的黑盒方法，通过行列条带的是/否后验外积生成查询条件下的空间图，并可定义读取方式导出定位等连续输出。", "type": "paper", "relTime": "3天前"}, {"id": 100, "title": "用提示词分歧做偏好监督：无需像素级标注的开放词汇语义分割适配方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34528", "date": "2026-09-28T00:00:00.000Z", "summary": "研究者提出偏好引导适配框架，用二元偏好替代密集掩码监督，把不同提示词模板对同一图像产生系统性差异的\"提示词分歧\"现象转化为内置偏好监督来源。该方法从跨模板高不确定性区域挖掘局部偏好查询，并用 Region-Localized Preference Optimization（RLPO）配合一致性正则化适配 OVSS 模型。", "type": "paper", "relTime": "3天前"}, {"id": 101, "title": "AutoRef：面向智能体多参考图像生成的 Harness 自动优化", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35530", "date": "2026-09-28T00:00:00.000Z", "summary": "AutoRef 通过编码智能体迭代重写 harness 代码，在模型冻结的前提下自动优化多参考图像生成流程，并发现 AutoRef-Harness。该 harness 将开源 FLUX.2 [klein] 4B 在 MultiBanana 基准的四参考任务上从 5.72 提升至 7.37，追平或超过 Nano Banana Pro 和 GPT-Image-1.5 等闭源模型。", "type": "paper", "relTime": "3天前"}, {"id": 102, "title": "ROSS：通过选择性监督从自生成 rollout 中再学习", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35954", "date": "2026-09-28T00:00:00.000Z", "summary": "ROSS 提出一种选择性监督方法，将历史轨迹完整保留为上下文，仅对选定的模型生成续写计算损失，从而复用自生成 rollout 中的行为经验。在 Qwen3.6-35B-A3B 上，ROSS 将六项基准的 MOPD 平均分从 58.40% 提升至 62.20%，SWE-bench Verified 从 64.20% 提升至 68.40%。", "type": "paper", "relTime": "3天前"}, {"id": 103, "title": "LeRF：为视角采择推理学习参考坐标系", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.36219", "date": "2026-09-28T00:00:00.000Z", "summary": "针对 VLM 在视角采择中常默认相机视角的问题，研究者提出 LeRF 框架，训练模型判断是否需要坐标系，并预测以实体为中心的参考坐标系，再由轻量渲染器叠加到图像上辅助推理，无需外部感知模型或显式 3D 重建。该方法先做监督微调学习选择性调用工具与坐标系预测，再用强化学习在空间 VQA 数据上优化，在多个视角采择基准上稳定优于其骨干模型，并超过现有开源方法。", "type": "paper", "relTime": "3天前"}, {"id": 104, "title": "LEGO-Anything：用编码智能体从单图重建 3D 场景，并推出 LEGO-Bench 基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.36380", "date": "2026-09-28T00:00:00.000Z", "summary": "LEGO-Anything 是一个 Image-to-Code 框架，让编码智能体迭代编写并执行 Blender 代码、检查场景与渲染结果并修订程序，把单图重建为可检查、可编辑、可查询的场景程序。", "type": "paper", "relTime": "3天前"}, {"id": 105, "title": "MaLiang-Harness：可编程图像与视频生成框架，GPT-6-Astra 双榜生成成功率 100%", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34309", "date": "2026-09-28T00:00:00.000Z", "summary": "MaLiang-Harness 是一个将 MLLM 驱动的视觉生成组织为持续构建、检查与修订流程的统一框架，用于弥合程序可执行但违反构图、外观或运动要求的 Program-to-Visual（P2V）差距。", "type": "paper", "relTime": "3天前"}, {"id": 106, "title": "PanoVLN：面向全景视觉语言导航的有效方案", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34759", "date": "2026-09-28T00:00:00.000Z", "summary": "PanoVLN 通过让模型从单张全景图预测更长动作序列，并引入置信度引导执行（CGE）策略动态决定执行步数，在 R2R-CE 和 RxR-CE Val-Unseen 上成功率分别超越此前 SOTA 11.9% 和 8.7%。", "type": "paper", "relTime": "3天前"}, {"id": 107, "title": "VideoPhysEdit：基于刚体物理场景重建的物理反事实视频编辑", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35134", "date": "2026-09-28T00:00:00.000Z", "summary": "VideoPhysEdit 提出免训练的物理反事实视频编辑（PCVE）流程，通过刚体物理场景重建还原可复现原视频运动与交互的仿真场景，从而把物理编辑作为干预并生成反事实视频。", "type": "paper", "relTime": "3天前"}, {"id": 108, "title": "PlaylistEval：视频语言模型做评判者，在日级长视频上还可靠吗？", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34314", "date": "2026-09-28T00:00:00.000Z", "summary": "PlaylistEval 是一个无需人工标注的智能体框架，可在超过 100 小时的播放列表视频集合上构建视频语言评判基准，自动生成差异由因果退化控制、必须跨集合检索才能作答的问答对。", "type": "paper", "relTime": "3天前"}, {"id": 109, "title": "FurE：无需动物毛发数据集的高效实例级 3D 毛发重建", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35770", "date": "2026-09-28T00:00:00.000Z", "summary": "FurE 提出一种基于发丝的动物毛发重建方法，无需动物毛发数据集即可从多视角图像恢复可编辑的毛发造型，通过优化根条件潜在场并经 PCA 解码器生成发丝几何。该方法利用表面约束的 Gaussian Frosting 表示结合部位先验重建去毛动物身体，并借助人类头发数据训练的 PCA 解码器缓解动物数据稀缺问题。", "type": "paper", "relTime": "3天前"}, {"id": 110, "title": "Opus 5.5 一句话生成视频论文", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2104352205176500542", "date": "2026-09-27T23:27:17.000Z", "summary": "有意思，这是 Paul Graham《如何做出伟大的工作》的另一个版本  给 opus 5.5 一句简单提示词，配上\"extra\" effort 设置  同一个提示词：\"Create a video essay from Paul Graham\\'s essay How to do great work with punchy motion graphics, modern styling ...", "type": "paper", "relTime": "3天前"}, {"id": 111, "title": "中国救援机器人自主飞向溺水者", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2104293764068159775", "date": "2026-09-27T19:35:03.000Z", "summary": "🇨🇳 中国救援机器人：自主飞向溺水者。  飞行速度约 10–14 m/s（峰值约 30 mph），覆盖范围可达约 2 km / 1.2 英里，降落时为最多两名 80 kg 成年人提供浮力，随后自行返回。", "type": "paper", "relTime": "3天前"}, {"id": 112, "title": "Simon Willison 用 Opus 5.5 打造 Bluesky 回复机器人检测工具", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/27/bluesky-bot-check", "date": "2026-09-27T18:41:44.000Z", "summary": "Simon Willison 用 Opus 5.5 开发了一款 Bluesky 回复机器人检测工具，可分析任意 Bluesky 个人资料是否存在自动化回复机器人迹象。该工具会检测在他人发帖后数秒内回复、从不发布原创内容或图片链接、只回复高粉丝量用户，以及包含问号等信号。", "type": "tip", "relTime": "3天前"}, {"id": 113, "title": "OpenAI 修复 GPT-6 图像理解 bug", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2104252306447544447", "date": "2026-09-27T16:50:19.000Z", "summary": "我们修复了一个导致 GPT-6 Sol 和 GPT-6 Luna 图像理解能力下降的 bug。现在你在 API 和 Codex 中的视觉任务上应该能看到更好的结果，包括 computer use。", "type": "product", "relTime": "3天前"}, {"id": 114, "title": "OpenAI 修复 GPT-6 图像理解 bug", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2104252025978658890", "date": "2026-09-27T16:49:12.000Z", "summary": "我们修复了一个导致 GPT-6 Sol 和 GPT-6 Luna 图像理解能力下降的 bug。现在你在 API 和 Codex 中的视觉任务上应该能看到更好的结果，包括 computer use。", "type": "product", "relTime": "3天前"}, {"id": 115, "title": "斯坦福与 Caltech 用 GPT-6 Astra 直驱 Unitree G1 机器人整理陌生厨房", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/researchers-plug-gpt-6-astra-directly-into-a-robot-and-let-it-clean-up-an-unfamiliar-kitchen", "date": "2026-09-27T10:59:11.000Z", "summary": "斯坦福和 Caltech 构建了 HomeBody 系统，让 Unitree G1 机器人无需传统训练控制层，由可替换的 VLM（此处为 GPT Astra）直接调用抓取、导航、开抽屉等技能库，自主探索陌生厨房并完成整理和取物。", "type": "paper", "relTime": "3天前"}, {"id": 116, "title": "Google Research MSEB 教程：按基准契约编写声音编码器并跨四类评测打分", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/26/a-coding-guide-to-google-researchs-mseb-writing-sound-encoders-to-the-benchmark-contract-and-scoring-them-across-classification-clustering-retrieval-and-segmentation", "date": "2026-09-27T05:42:35.000Z", "summary": "该教程演示如何按 MSEB 的 MultiModalEncoder 抽象基类编写两个声音编码器，分别测量响度与音色，并在自生成合成音频上运行分类、聚类、检索和分割四类评测器。两个编码器在不同评测器下排名互换，用数字说明多任务基准的必要性。教程基于 mseb 0.1.0，全程 CPU 运行、无需下载数据集。", "type": "paper", "relTime": "3天前"}, {"id": 117, "title": "VQS：用程序验证实现视觉语言模型自进化，答案正确率提升至 94%", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33855", "date": "2026-09-27T00:00:00.000Z", "summary": "针对自进化视觉语言模型中多数投票标签 24%、模型评判标签 18% 出错的问题，研究者提出 VQS，让模型把图像解析为场景图、图表表格等结构化记录，由固定程序生成问题并计算答案，模型只逐条核验程序读取的短事实。", "type": "paper", "relTime": "4天前"}, {"id": 118, "title": "SciGen-Verifier：面向科学图像生成可解释验证的多模态推理器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33399", "date": "2026-09-27T00:00:00.000Z", "summary": "SciGen-Verifier 是一个用于科学图像生成可解释验证的多模态推理器，通过冷启动监督微调加课程式两阶段强化学习训练，在自建基准 SciGen-Verify 上性能可媲美更大的闭源模型。该基准覆盖指令遵循、多学科推理与世界知识，采用二值判断、解释与纠错编辑指令的三层协议。它还可作为在线 critic 用于图像的迭代修正。", "type": "paper", "relTime": "4天前"}, {"id": 119, "title": "DroneWAM：面向无人机视觉导航的高效世界动作模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33148", "date": "2026-09-27T00:00:00.000Z", "summary": "DroneWAM 是面向无人机视觉导航的高效世界动作模型，采用 JEPA 架构在表示空间中预测未来状态，避免显式生成未来图像，并用预训练 Resampler 压缩编码器特征以减少每个想象步的重复计算。在仿真数据集 DroneNav-6D 上，DroneWAM 取得对比方法中最佳轨迹精度，自适应 rollout 将平均预测深度从 8 降至 4.58，同时提升轨迹精度。", "type": "paper", "relTime": "4天前"}, {"id": 120, "title": "VGGT-Diff：融合视觉几何与扩散模型的稀疏视角新视角合成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33253", "date": "2026-09-27T00:00:00.000Z", "summary": "VGGT-Diff 将 VGGT-Ω 的视觉几何 latent 路由进预训练视频扩散模型，用于稀疏视角新视角合成。每个视觉 token 关联 3D 点和置信度，经置信度感知的 Visual Geometry Router（VGR）转为查询对齐的 latent 条件，Point-Track Residual Consistency（PTRC）沿可靠 3D 轨迹正则化预测残差。", "type": "paper", "relTime": "4天前"}, {"id": 121, "title": "SMAT：简单高效的合并感知训练方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33437", "date": "2026-09-27T00:00:00.000Z", "summary": "研究者提出 SMAT（Simple MAT），通过将常见模型合并操作归纳为 Scale、Mask、Perturb 三种，联合优化专家损失与模拟合并参数下的期望损失，并引入周期性调度、算子融合和参数存储切换，使每步仅需一次前向和一次反向传播。在四个语言与视觉语言骨干模型上，SMAT 将五种合并方法的平均分较各骨干最强基线提升 1.07-2.16 分，训练时间开销较标准微调不足 2%。", "type": "paper", "relTime": "4天前"}, {"id": 122, "title": "REALM：面向具身反应式聆听的由粗到细生成框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33095", "date": "2026-09-27T00:00:00.000Z", "summary": "REALM（Reactive Embodied Audio-driven Listening Model）是一个由粗到细的音频驱动反应式聆听框架，通过 Reactive Gated Speaker-Listener Fusion 模块结合聆听者动作历史与说话人音频，并用粗解码器预测基础动作轨迹、在表情子空间叠加音频条件随机残差。", "type": "paper", "relTime": "4天前"}, {"id": 123, "title": "VisionHOPE：将视觉骨干网络构建为自修改学习系统", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33325", "date": "2026-09-27T00:00:00.000Z", "summary": "VisionHOPE 提出首个将视觉骨干网络形式化为自修改学习系统的方案，让模型在单张图像内\"记住什么\"与\"如何学习\"协同演化。它基于 Nested Learning 的自指构造，用五个耦合记忆分别存储内容、生成 key/value 表示并控制学习率与保留率，并推导出稳定性匹配的步长控制方案以保证记忆动态非扩张。", "type": "paper", "relTime": "4天前"}, {"id": 124, "title": "Diffusion Reward Models：用扩散模型做奖励建模的 DRM 方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33803", "date": "2026-09-27T00:00:00.000Z", "summary": "研究者提出 DRM（Diffusion Reward Model），把奖励建模重构为对 p(r|x,y) 的条件密度估计：以冻结的 LLM 编码器为条件，用轻量 Diffusion Transformer 将高斯噪声去噪为奖励向量，从而不预设输出分布并自然刻画人类偏好的多模态结构。", "type": "paper", "relTime": "4天前"}, {"id": 125, "title": "StoryEngine：面向视频叙事的基于状态的智能体框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33627", "date": "2026-09-27T00:00:00.000Z", "summary": "StoryEngine 是一个基于状态的智能体框架，通过分离权威语义规划与不可靠视觉观测来生成连贯的长篇视频故事。它维护实体位置与故事相关状态的结构化表示，传播事件引发的状态变化以定义每个镜头的起止状态，并构建可复用实体的规范参考，将状态与视觉约束编译为可执行的渲染计划。实验显示 StoryEngine 在叙事质量、叙事连贯性和视觉一致性等所有评估维度上均持续优于现有最先进方法。", "type": "paper", "relTime": "4天前"}, {"id": 126, "title": "Simon Willison 用 Claude Opus 5.5 生成鸮鹦鹉像素动画并用 Claude Code 录成视频", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/26/kakapo-party", "date": "2026-09-26T23:39:06.000Z", "summary": "Simon Willison 在 WeAreDevelopers World Congress North America 闭幕主题演讲前，用 Claude Opus 5.5 根据三张鸮鹦鹉照片生成至少 20 只鸮鹦鹉开派对的 HTML 5 canvas 像素动画页面。", "type": "tip", "relTime": "4天前"}, {"id": 127, "title": "Jeff Dean 转发 Claude 生成 Google 历史视频", "source": "X：Jeff Dean (@JeffDean)", "sourceUrl": "https://x.com/JeffDean/status/2103989340485624158", "date": "2026-09-26T23:25:23.000Z", "summary": "很自豪能与许多人合作完成其中的不少工作！  （引用 @deedydas）：claude 刚刚生成了一段关于 Google 历史的 2 分钟视频，效果简直太炸了", "type": "paper", "relTime": "4天前"}, {"id": 128, "title": "Claude Opus 5.5 一条提示词生成递归讲解视频", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2103888590854062435", "date": "2026-09-26T16:45:03.000Z", "summary": "Ethan Mollick 用一条提示词让 Claude Opus 5.5 生成了解释递归的视频，要求每次解释递归都切换截然不同的视频风格，做到自指、巧妙且节奏快，最终实现九次风格切换。他随后又测试了一个真正具有教育性的版本，认为效果相当惊艳：模型在保持多风格约束的同时，用有趣易懂的方式讲清了编程意义上的递归。", "type": "model", "relTime": "4天前"}, {"id": 129, "title": "brumar 开源 Claude Code 国际象棋复盘 Skill，结合 Stockfish 与思考录音生成解说视频", "source": "Hacker News：AI 热帖", "sourceUrl": "https://github.com/brumar/chess-postmortem-skills", "date": "2026-09-26T15:34:53.000Z", "summary": "作者 brumar 发布一套 Claude Code skills，将 lichess 对局结合 Stockfish 引擎生成可读的复盘报告和带旁白的解说视频。", "type": "tip", "relTime": "4天前"}, {"id": 130, "title": "Synthesia 为 TechCrunch 记者打造可对话的交互式数字分身", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/26/i-created-an-interactive-digital-avatar-of-myself-and-you-can-talk-to-it", "date": "2026-09-26T14:00:00.000Z", "summary": "Synthesia 为 TechCrunch 记者制作了一个交互式 AI 数字分身，仅基于其一篇关于风投背景创业公司欺诈的报道训练，只会回答与该报道相关的问题。", "type": "paper", "relTime": "4天前"}, {"id": 131, "title": "实测LibTV 1.5五大新功能，演示AI短剧工作流", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw==&mid=2247511963&idx=1&sn=a8046b9f44949b1eed69a7c149c2efdb&chksm=cf085362a48739b7257c3756c5eeab1133ff234b0c27312f978e54d53dd6872d5ceab88ca8ab&scene=126&sessionid=1790572572#rd", "date": "2026-09-26T09:00:00.000Z", "summary": "作者详细测试了LibTV 1.5版本的新功能，包括将Agent升级为TV Director、剧本原创及改编、角色造型室、导演执导、3D-BOX预演和创意片头。文章展示了从生成50集古装言情喜剧大纲、手动编辑剧本、使用角色造型室调整人物形象，到利用Seedance 2.5生成分镜、通过导演模式优化镜头以及用3D-BOX进行复杂运镜预演的完整流程，最终输出成片。", "type": "tip", "relTime": "4天前"}, {"id": 132, "title": "用 AugLy 构建图像、文本、音频多模态数据增强与对抗鲁棒性基准教程", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/26/end-to-end-multimodal-data-augmentation-and-adversarial-robustness-benchmark-with-augly-for-images-text-audio-and-pytorch", "date": "2026-09-26T07:22:46.000Z", "summary": "本教程基于 AugLy 构建覆盖图像、文本、音频的端到端多模态数据增强与鲁棒性工作流。教程解决依赖兼容问题，生成确定性合成数据集，演示 AugLy 的函数式与类式 API。", "type": "tip", "relTime": "4天前"}, {"id": 133, "title": "微星推出 MS-C9ZA 无风扇边缘 AI 盒子，基于 Jetson Orin Nano 8GB", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/344.htm", "date": "2026-09-26T05:37:03.000Z", "summary": "微星推出 MS-C9ZA 边缘 AI 盒子，基于 NVIDIA Jetson Orin Nano 8GB 模组，可在端侧执行 AI 推理与计算机视觉处理，面向机器人、智能制造等场景。", "type": "paper", "relTime": "4天前"}, {"id": 134, "title": "作者分享用 logprobs 读取 LLM 选项概率的单函数封装，并扩展到视觉模型", "source": "Hacker News：AI 热帖", "sourceUrl": "http://allanrbo.blogspot.com/2026/09/a-jev-like-wrapper-for-llms-including.html", "date": "2026-09-26T04:20:58.000Z", "summary": "作者受 Jev 及 OpenJev、SemIf 启发，实现了一个单函数封装：让 LLM 只生成一个选项字母，再读取 top_logprobs 得到各选项概率。", "type": "tip", "relTime": "4天前"}, {"id": 135, "title": "Claude Opus 5.5 生成递归解释视频", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2103688362960019567", "date": "2026-09-26T03:29:25.000Z", "summary": "你怎么解释递归？这个挺有意思的。  我让 Claude Opus 5.5 做了：\"一个解释递归的视频，其中每一段关于递归的解释都采用截然不同的视频风格，要让它自我指涉、巧妙且节奏明快。\"  九次风格切换，一个提示词……", "type": "paper", "relTime": "4天前"}, {"id": 136, "title": "NVIDIA 开源 MONAI Physio 医学影像数字孪生", "source": "X：小北 (@frxiaobei)", "sourceUrl": "https://x.com/frxiaobei/status/2103672371991249071", "date": "2026-09-26T02:25:52.000Z", "summary": "NVIDIA 在 MICCAI 2026 开源 MONAI Physio，可从 3D 和 4D 医学影像生成个性化的心脏与呼吸数字孪生，模拟心跳与肺部运动。该工具属于开源 Project MONAI 工具包，面向研究人员用于仿真、可视化和可复现研究。", "type": "model", "relTime": "4天前"}, {"id": 137, "title": "FlashForward：用飞行中 KV Cache 与干净锚点加速自回归视频扩散", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.32540", "date": "2026-09-26T00:00:00.000Z", "summary": "FlashForward 直接复用当前 chunk 去噪前向中已算出的 in-flight KV cache，省去为更新缓存而做的额外前向，并生成稀疏的干净锚点 latent 以稳定生成轨迹。", "type": "paper", "relTime": "5天前"}, {"id": 138, "title": "LT-OPD：用在线策略自蒸馏实现极端视觉 token 压缩", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.32353", "date": "2026-09-26T00:00:00.000Z", "summary": "针对多模态大模型在极低视觉 token 预算下性能骤降的问题，研究者提出训练框架 LT-OPD，让仅保留少量视觉 token 的学生模型在自己生成的轨迹上接受冻结全 token 教师模型的分布监督，并引入逐步降低 token 预算的课程。", "type": "paper", "relTime": "5天前"}, {"id": 139, "title": "Liquid AI 发布 LFM2.5-VL-3B-DSpark 投机解码草稿模型，解码最高提速 3.13 倍", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/25/liquid-ai-releases-lfm2-5-vl-3b-dspark-speculative-decoding-for-vision-language-models-with-up-to-3-13x-faster-decoding", "date": "2026-09-25T23:11:59.000Z", "summary": "Liquid AI 发布 LFM2.5-VL-3B-DSpark，一个为其视觉语言模型 LFM2.5-VL-3B 设计的实验性投机解码草稿模型，新增约 279.5M 参数（+8.9%），在 Apple silicon 上解码最高提速 3.13 倍，NVIDIA H100 上最高 2.66 倍。", "type": "model", "relTime": "5天前"}, {"id": 140, "title": "Meta 开放 Muse 新功能抢先体验申请", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/25/meta-opens-early-access-program-for-new-muse-features", "date": "2026-09-25T20:34:53.000Z", "summary": "Meta 在 Connect 2026 开发者大会公布 Muse AI 应用多项新功能后，于周五开放抢先体验申请，用户可让 Muse 代为提交申请加入名单。新功能包括可与 Muse 数字分身视频通话、更多购物合作与连接器、扩展 Muse Mac 应用使其能操作电脑完成任务，以及将 Muse 引入 Meta AI 眼镜，用户可通过唤醒词语音交互。", "type": "paper", "relTime": "5天前"}, {"id": 141, "title": "Pexo 将研究自动生成 30 秒视频", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2103575986772070862", "date": "2026-09-25T20:02:52.000Z", "summary": "花数小时研究微软的崛起。  5 分钟把研究喂给 Pexo。  10–15 分钟后，一条完成的 30 秒视频。  真正让我惊讶的是拼贴效果。Pexo 拿过研究内容，围绕它构建了整套视觉处理——抠图、贴纸、辅助图像，全部都有。没有任何东西像是随机加进去的。一切都跟着故事走。而且这还是第一次尝试。  如果你做历史或解说类内容，我觉得工作流刚刚变了。@Pexoai_offical", "type": "paper", "relTime": "5天前"}, {"id": 142, "title": "Qwen 团队发布 Qwen3.8-Omni-Flash 报告：面向原生全模态智能体", "source": "X：DAIR.AI (@dair_ai)", "sourceUrl": "https://x.com/dair_ai/status/2103573552611926373", "date": "2026-09-25T19:53:12.000Z", "summary": "Qwen 团队发布报告，介绍 Qwen3.8-Omni-Flash，一个原生多模态模型，面向跨文本、音频和视频的长程智能体任务，如视频编辑和长音频视频翻译。模型采用 Qwen3.8-Next 的稀疏 MoE 架构，上下文窗口达一百万 token，并通过协同训练策略在保持文本性能的同时将智能体能力迁移到音频和视频任务。", "type": "paper", "relTime": "5天前"}, {"id": 143, "title": "Suno 发布新曲《Take Me Back》", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2103563987963011148", "date": "2026-09-25T19:15:11.000Z", "summary": "《Take Me Back》现已在 Suno 上线。由 Braylon Browner 赋予生命，音乐视频由同为编舞师的 Nina McNeely 执导，他们的合作从舞蹈到歌曲，再到围绕 Braylon 的动作打造的完整世界。  音乐使用 v6 创作，并在 Studio 2.0 中完成。", "type": "paper", "relTime": "5天前"}, {"id": 144, "title": "Qwen 团队发布 Qwen3.8-Omni-Flash 全模态智能体模型报告", "source": "X：DAIR.AI (@dair_ai)", "sourceUrl": "https://x.com/dair_ai/status/2103563695381209417", "date": "2026-09-25T19:14:01.000Z", "summary": "Qwen 团队发布 Qwen3.8-Omni-Flash 报告，这是一个原生多模态模型，面向跨文本、音频和视频的长时程智能体任务，如视频编辑和长音频视频翻译。模型沿用 Qwen3.8-Next 的稀疏 MoE 架构，上下文窗口为 100 万 token，并通过协同训练策略在保持文本性能的同时把智能体能力迁移到音频和视频任务。", "type": "paper", "relTime": "5天前"}, {"id": 145, "title": "Google 发布 Gemini 3.8 Flash TTS 等多项更新", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2103552111233343980", "date": "2026-09-25T18:28:00.000Z", "summary": "Google 本周发布 Gemini 3.8 Flash TTS 与 Gemini 3.8 Flash-Lite TTS 两款音频生成模型，并推出 Gemini 3.8 Live with Live Avatar，为对话式 AI 带来近实时视觉形象。", "type": "model", "relTime": "5天前"}, {"id": 146, "title": "Perceptron Mk1.5 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2103545324598091781", "date": "2026-09-25T18:01:02.000Z", "summary": "来自 @perceptroninc 的 Perceptron Mk1.5 已在 OpenRouter 上线。  这是 Perceptron 面向物理智能体的具身推理模型。它接受文本、图像、视频和音频输入，可以用点、框、多边形和视频片段配合文本作答。", "type": "model", "relTime": "5天前"}, {"id": 147, "title": "Claude Opus 5.5 接入 Runway MCP", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2103540433225908447", "date": "2026-09-25T17:41:35.000Z", "summary": "Claude Opus 5.5 遇上 Runway MCP。  将 Runway 直接接入 Claude，即可用 Gen-4.5、Seedance 2.5、GPT Image 2、Kling 等生成精美图像和视频，就在你的工作环境中完成。几秒即可通过下方链接接入。", "type": "paper", "relTime": "5天前"}, {"id": 148, "title": "Suno v6 将舞蹈动作变成音乐", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2103537899509596376", "date": "2026-09-25T17:31:31.000Z", "summary": "对 @braylonbrowner 来说，动作不只是跟随音乐，而是音乐的起点。  看他如何用 v6 把自己的动作变成一首歌，并将编舞过程推向意想不到的地方。  Make what moves you.  观看他的首支音乐视频，由 Nina McNeely 执导：https://suno.com/braylon", "type": "paper", "relTime": "5天前"}, {"id": 149, "title": "NaceAI 发布 Drex 决策模型，输出选项概率", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2103523705603461145", "date": "2026-09-25T16:35:07.000Z", "summary": "NaceAI 推出 Drex，一个 sub-6B 决策模型，不生成文本而是直接输出各选项概率，一次前向即可完成，面向智能体路由、工具选择、重排序与策略检查等场景。Drex 采用小型扩散模型加 RLAF 架构，定价 $0.04/1M input tokens，延迟低于 1 秒，在 Decision Index 上排名 #1，40 项 benchmark 中赢下 23 项，开放权重与技术报告即将发布。", "type": "model", "relTime": "5天前"}, {"id": 150, "title": "Perceptron 发布 35B 具身智能体模型 Mk1.5，请求完成速度最高提升 4.7 倍", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2103518305864839197", "date": "2026-09-25T16:13:40.000Z", "summary": "Perceptron 发布 35B 具身智能体模型 Mk1.5，可控制无人机、四足机器人、智能眼镜，并调度子智能体，无需平台特定重训练。模型针对 egocentric 视频训练，启用网页搜索、页面阅读、反向图搜和缩放工具后，MMSearch F1 从 18.2 升至 54.3；官方数据显示端到端延迟最高较 Mk1 快 4.7 倍（Chat 从 5.2 秒降至 1.1 秒）。", "type": "model", "relTime": "5天前"}, {"id": 151, "title": "Suno v6 将舞蹈动作变成歌曲", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2103515732688486494", "date": "2026-09-25T16:03:26.000Z", "summary": "对 Braylon Browner 来说，动作不只是跟随音乐，而是音乐的起点。  看他如何用 v6 把自己的动作变成一首歌，并将编舞过程推向意想不到的地方。  Make what moves you.  观看由 Nina McNeely 执导的他的首支音乐视频：https://suno.com/braylon", "type": "paper", "relTime": "5天前"}, {"id": 152, "title": "新一代梅赛德斯-迈巴赫 S 级轿车上市：搭载 MB.OS 与 Momenta R7 世界模型，139.8 万元起", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/102.htm", "date": "2026-09-25T03:02:39.000Z", "summary": "新一代梅赛德斯-迈巴赫 S 级轿车上市，售价 139.8 万元起，S 680 顶配为 335.3 万元。新车首度搭载梅赛德斯-奔驰 MB.OS 架构与最新一代智能人机交互系统，应用端侧多模态 VLM 大模型，并成为率先搭载 Momenta R7 世界模型的豪华燃油车，未来可通过 OTA 远程升级。其全新城区及高速领航辅助驾驶系统在中国实现车位到车位辅助驾驶与智能辅助泊车。", "type": "model", "relTime": "5天前"}, {"id": 153, "title": "Runway GWM Worlds 2 与 WorldPrompt：实时交互世界模型的工程解读", "source": "Latent Space（RSS）", "sourceUrl": "https://www.latent.space/p/runway", "date": "2026-09-25T01:30:57.000Z", "summary": "Runway 本月推出研究预览版 GWM Worlds 2，将高保真视频和音频生成变为实时交互模拟，以 720p、24 fps 连续视频和 48,000 Hz 音频流式输出，并新增 WorldPrompt 输入格式，可固定环境部分方面并通过带时间戳的事件控制角色、相机和场景。", "type": "tip", "relTime": "5天前"}, {"id": 154, "title": "BestBlogs 早报 · 09-25：Every 实验室机制 / 原子声明验证 / Claude 代码现代化 / RoboFlywheel", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2103287093208502680", "date": "2026-09-25T00:54:54.000Z", "summary": "阿里巴巴发布 RoboFlywheel 开放式仿真基础设施，提供超百万级刚体、铰链与柔性资产，支持机器人交互与闭环训练。腾讯混元发布图像生成模型 Hy Image3.5 preview，综合能力较上代提升约 30%，2K 出图定价 0.15 元/张，已接入元宝、ima、WorkRally 等产品。", "type": "model", "relTime": "5天前"}, {"id": 155, "title": "利用预训练扩散模型和多模态条件增强摄影测量数字表面模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.31199", "date": "2026-09-25T00:00:00.000Z", "summary": "该研究提出一种改进的 Stable Diffusion 3 架构，通过同时以摄影测量 DSM 和 Pléiades 卫星图像作为条件，对垂直配准的数字表面模型进行细化。实验表明，这种多模态条件方法能显著提升高程精度，在法国城市测试中，密集城区的 RMSE 从 6.00 米降至 3.45 米（上下文城市）及 2.76 米（留出城市）。", "type": "paper", "relTime": "6天前"}, {"id": 156, "title": "TRACE：流式视频理解的时序审计与条件感知评估框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.30670", "date": "2026-09-25T00:00:00.000Z", "summary": "论文提出 TRACE 基准，旨在解决现有流式视频理解评估中忽略证据时效性、历史维护及响应触发机制的问题。该框架通过统一因果协议控制信息可用性，并多维报告答案质量、及时性、负载等指标。在 1240 条记录上的实验显示，相似的 QA 准确率可能掩盖系统在完成度、生成负载及主动响应行为（如误报、漏报）上的巨大差异，强调应将性能视为执行条件下的系统行为而非单一分数。", "type": "paper", "relTime": "6天前"}, {"id": 157, "title": "FuseReg：正则化层融合缓解表征自编码器的重建-生成差距", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.31620", "date": "2026-09-25T00:00:00.000Z", "summary": "FuseReg 用随机编码器层子集训练替代启发式层融合，在 ImageNet-256 与 DINOv3-L 上，单个解码器无需重训即可从全层、稀疏和单层融合中重建，PSNR 高于固定融合的专用解码器。仅替换解码器即使未改动的 RAEv2 DiT-XL 生成器无引导 gFID 降低 27%，联合正则化两阶段在 DiT-Base 上降低 29%。", "type": "paper", "relTime": "6天前"}, {"id": 158, "title": "InternW0-Δ：用 2 万小时开放数据打通预测动态与动作的世界动作模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.31394", "date": "2026-09-25T00:00:00.000Z", "summary": "InternW0-Δ 是一个统一的世界动作模型（WAM），在 Mixture-of-Transformers 框架下结合预训练视频专家、动作专家与冻结 VLM 的语义引导，并通过训练期蒸馏注入 4D 几何与运动先验。", "type": "model", "relTime": "6天前"}, {"id": 159, "title": "Claude Opus 5.5 一次生成动漫风短视频", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2103272686570918334", "date": "2026-09-24T23:57:40.000Z", "summary": "Ethan Mollick 让 Claude Opus 5.5 把同一条消息改造成面向动漫爱好者的社交媒体短视频，一次生成即完成。此前他让 Claude 自选一个着迷的谜题并尽力解决、再做成可分享的影片，Claude 尝试破解伏尼契手稿失败后，转而制作了这段兼具趣味与科普性的影片。", "type": "paper", "relTime": "6天前"}, {"id": 160, "title": "Runway 评估 Model Router 图像转视频", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2103234985637679441", "date": "2026-09-24T21:27:51.000Z", "summary": "在 250 个图像转视频提示词上，我们评估了 Model Router 相较于 SOTA 模型基线，如何降低成本并保持生产可用性。请通过下方链接阅读更多内容。", "type": "model", "relTime": "6天前"}, {"id": 161, "title": "Google 为 Gemini 3.8 Live 推出 Live Avatar 实时数字人", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/1000328/google-gemini-ai-live-avatar-face", "date": "2026-09-24T19:59:26.000Z", "summary": "Google 在 Gemini 3.8 Live 更新中推出 Live Avatar，可在对话中实时口型同步并呈现不同面部表情，目前仅面向 Gemini Enterprise 客户开放。该功能支持 97 种语言切换且不降低视频保真度或产生视觉漂移，还能在说话时调出屏幕信息。Google 同时提供预设头像库并允许企业自建，输出带有不可见 SynthID 水印及身份保护措施。", "type": "paper", "relTime": "6天前"}, {"id": 162, "title": "Pruna 发布 Qwen-Image-2.1 少步数 LoRA 适配器，图像生成提速至 6.3 倍", "source": "X：AK (@_akhaliq)", "sourceUrl": "https://x.com/_akhaliq/status/2103201617004949888", "date": "2026-09-24T19:15:15.000Z", "summary": "Pruna-Qwen-Image-2.1 是一组少步数 LoRA 适配器，可将 Qwen-Image-2.1 的图像生成与编辑速度提升至多 6.3 倍。生成或编辑图像只需 5 或 8 步而不用 40 步，选 5 步追求最快速度，选 8 步兼顾效果与速度。HF 工作流：https://huggingface.co/spaces/akhaliq/Pruna-Qwen-Image-2.1", "type": "paper", "relTime": "6天前"}, {"id": 163, "title": "新泽西州对 DataOne 数据中心处以 110 万美元罚款，62 台燃气发电机被卫星图像曝光", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/tech-policy/2026/09/new-jersey-fines-data-center-1-1m-after-satellite-pics-expose-62-gas-generators", "date": "2026-09-24T18:20:58.000Z", "summary": "新泽西州对 DataOne 位于 Vineland 的数据中心处以 110 万美元罚款，因其违反空气污染控制法秘密安装并运行 62 台燃气发电机，其中 45 台在运行。", "type": "industry", "relTime": "6天前"}, {"id": 164, "title": "Meta 推出 Horizon Create 和 Horizon Studio，用 AI 提示词在手机上做游戏", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/games/999972/meta-horizon-create-studio-ai-games", "date": "2026-09-24T17:52:29.000Z", "summary": "Meta 宣布两款 AI 游戏开发工具：移动端应用 Horizon Create 和浏览器端应用 Horizon Studio，均支持用 AI 提示词生成 2D 或 3D 移动游戏，包含进度系统、难度平衡、美术方向和多人玩法，目前以早期访问形式开放候补名单。", "type": "paper", "relTime": "6天前"}, {"id": 165, "title": "Space Bunny 模型视觉与 3D 生成实测", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2103174241654837649", "date": "2026-09-24T17:26:28.000Z", "summary": "Elvis Saravia 测试了 Space Bunny 模型，其在 OpenCode 中免费开放一周，支持 1M token 上下文窗口和图像输入。该模型视觉理解与设计能力出色，能自我验证工作成果，可从草图生成完整落地页、3D 模型、动画和可玩游戏。作者推荐将其用于图像转代码、交互原型和 3D 创意编程。", "type": "model", "relTime": "6天前"}, {"id": 166, "title": "Black Forest Labs 发布开源机器人模型 FLUX 3 Action", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/black-forest-labs-launches-flux-3-action-an-open-robotics-ai-model", "date": "2026-09-24T17:01:03.000Z", "summary": "Black Forest Labs 发布面向机器人的开源模型 FLUX 3 Action，基于以视频数据训练的多模态 FLUX 3，可从机器人工作区的多机位视频预测智能体下一步动作及环境变化。BFL 称其仅 70 亿参数即在 RoboLab-120 排行榜创下成功率纪录，体积不到此前最佳开源模型一半，运行最快快至 3.95 倍；模型权重已上架 Hugging Face。", "type": "model", "relTime": "6天前"}, {"id": 167, "title": "Google 发布 Gemini 3.8 Live with Live Avatar，为对话 AI 带来实时视觉形象", "source": "Google DeepMind：Blog（RSS）", "sourceUrl": "https://deepmind.google/blog/introducing-gemini-38-live-with-live-avatar", "date": "2026-09-24T16:20:39.000Z", "summary": "Google DeepMind 推出 Gemini 3.8 Live with Live Avatar，将低延迟流式视频与实时对话能力原生结合，让 AI 具备能听、能看、能说的动态视觉形象，即日起在 Gemini Enterprise 可用。", "type": "paper", "relTime": "6天前"}, {"id": 168, "title": "Odyssey 发布多智能体世界模型 Agora-2，支持最多 20 个人类与智能体实时共享模拟环境", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2103151581810000240", "date": "2026-09-24T15:56:26.000Z", "summary": "Odyssey 推出下一代多智能体世界模型 Agora-2，支持最多 20 个人类与智能体在共享环境中实时交互，多人研究预览现已开放体验。作者 Elvis Saravia 评价称，这类世界模型可用于共同训练机器人、自动驾驶和网络安全防御智能体，各方在交互中相互提升，也为研究智能体串谋提供了安全环境。", "type": "model", "relTime": "6天前"}, {"id": 169, "title": "Liquid AI 发布 LFM2.5-VL-DSpark 视觉语言 drafter 模型，边缘端解码最高提速 3.13 倍", "source": "Liquid AI 模型与工程博客（网页）", "sourceUrl": "https://www.liquid.ai/blog/lfm2-5-vl-dspark", "date": "2026-09-24T14:42:04.258Z", "summary": "Liquid AI 为视觉语言模型 LFM2.5-VL-3B 发布实验性 DSpark drafter 模型，参数约 280M，仅增加 8.9% 参数量。GPU 上解码吞吐最高提升 2.66 倍、边缘设备 3.13 倍，端到端分别最高 2.27 倍和 2.62 倍；模型已上架 Hugging Face，支持 llama.cpp、SGLang 和 MLX-VLM。", "type": "model", "relTime": "6天前"}, {"id": 170, "title": "Liquid AI 发布 LFM2.5-VL-DSpark 视觉草稿模型加速 VLM 推理", "source": "Hugging Face：Blog（RSS）", "sourceUrl": "https://huggingface.co/blog/LiquidAI/lfm2-5-vl-dspark", "date": "2026-09-24T14:08:57.000Z", "summary": "Liquid AI 在 Hugging Face 发布面向视觉语言模型 LFM2.5-VL-3B 的实验性 DSpark 草稿模型，通过投机解码在不改变输出质量的前提下换取推理加速。", "type": "model", "relTime": "6天前"}, {"id": 171, "title": "Meta 发布多款 AI 眼镜并宣布 Muse 助手将登陆眼镜", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/09/meta-puts-its-ai-assistant-on-a-keychain", "date": "2026-09-24T14:03:38.000Z", "summary": "Meta 发布多款 Ray-Ban 新款眼镜，其中无摄像头款仅支持音频交互，另推出售价 1,300 美元、比 Quest 3 轻五倍的新 VR 眼镜，明年春季上市。Muse 助手将登陆眼镜，用户可在视频通话中以超写实数字分身代替面部出镜，但 Muse 已出现可被黑客接管智能体的漏洞并遭 Amazon 封锁访问其购物平台。", "type": "paper", "relTime": "6天前"}, {"id": 172, "title": "Waymo 公布 2 var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };
var TYPE_LABELS = { "paper":"论文", "model":"模型", "product":"产品", "tip":"技巧", "industry":"行业" };
function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";
  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();
</script>

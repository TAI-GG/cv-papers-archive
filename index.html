enLabs (@elevenlabs)", "sourceUrl": "https://x.com/ElevenLabs/status/2108196897492214232", "date": "2026-10-08T14:04:43.000Z", "summary": "在 Image & Video、Flows 或 agent 中输入 @ 来标记你的 kit。你的素材和规则将塑造生成结果。  你也可以让 agent 帮你编辑 kit。", "type": "paper", "relTime": "1天前"}, {"id": 31, "title": "Step 5 Preview 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2108188953757331803", "date": "2026-10-08T13:33:09.000Z", "summary": "阶跃星辰（StepFun）的 Step 5 Preview 已上线 OpenRouter。该模型是其面向智能体工作的新旗舰，采用稀疏 MoE 架构（270 亿激活参数、总参数 600B），支持 1M 上下文和文本、图像、视频输入，擅长编码与专业知识工作，尤其是金融领域。试用地址：https://openrouter.ai/stepfun/step-5-preview", "type": "model", "relTime": "1天前"}, {"id": 32, "title": "Pollo AI 用 OpenAI 模型把创意变成广告大片", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "sourceUrl": "https://openai.com/index/pollo-ai", "date": "2026-10-08T12:00:00.000Z", "summary": "Pollo AI 借助 GPT‑5.6、GPT‑6 Astra 和 GPT‑Image‑2.5 打造 Pollo Agent，为创作者提供从创意到成片的引导式视频制作流程，目前平台用户已超 2600 万。", "type": "industry", "relTime": "1天前"}, {"id": 33, "title": "MiniMax Design 用代码生成视频", "source": "X：MiniMax Design (H3) (@Hailuo_AI)", "sourceUrl": "https://x.com/Hailuo_AI/status/2108156700368765179", "date": "2026-10-08T11:24:59.000Z", "summary": "Opus 5.5 上线 #MiniMaxDesign | 用代码创作你的下一支视频 把文字变成视频——从代码到动态画面。  ✨ JavaScript 动画 ✨ 动态图形 ✨ 解说视频与视觉叙事 ✨ 网页与产品演示  不止是大语言模型——它能理解视觉内容，并持续打磨你的作品。🎨", "type": "model", "relTime": "1天前"}, {"id": 34, "title": "Nvidia 押注物理 AI：Halos 安全系统瞄准更安全的 robotaxi 与人形机器人", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/10/nvidias-big-bet-on-physical-ai-aims-for-safer-robotaxis-humanoid-robots/", "date": "2026-10-08T11:15:33.000Z", "summary": "Nvidia 正将数十亿美元押注于机器人和自动驾驶等物理 AI 技术，其 Halos 安全系统于 2025 年推出，提供硬件和软件工具帮助开发者在自动驾驶汽车中实现安全护栏。", "type": "industry", "relTime": "1天前"}, {"id": 35, "title": "田柯宇创业公司融资近3000万美元", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2108134053949915351", "date": "2026-10-08T09:55:00.000Z", "summary": "据彭博社报道，田柯宇（Tian Keyu）的未具名创业公司已从包括五源资本和IDG在内的投资者处融资近3000万美元，投后估值2亿美元。  这位NeurIPS 2024获奖研究者带领一支10人团队，正在开发一个20万符号的视觉词表，以帮助AI处理视频。  田柯宇声称该方法可将视频生成成本至少降低十倍。完整模型计划于2027年发布；公司目前尚无产品。", "type": "industry", "relTime": "1天前"}, {"id": 36, "title": "Tripo 生成 3D 资产接入 Quest 3", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2108101078084706616", "date": "2026-10-08T07:43:58.000Z", "summary": "探索下一代 XR 工作流：  用 Tripo 即时生成 3D 资产，然后放入 Quest 3 进行手部追踪交互。  零建模时间，纯粹交互。", "type": "tip", "relTime": "1天前"}, {"id": 37, "title": "生数科技发布 Vidu Q4 Preview 视频生成模型预览版，支持 3 段参考音频与 2K/4K 输出", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489335&idx=1&sn=880949d2257914e1830aa6c46762d189", "date": "2026-10-08T06:16:38.000Z", "summary": "生数科技发布全新视频生成旗舰模型 Vidu Q4 的预览版 Vidu Q4 Preview，主打人物演技、镜头语言与特效表现力。新版本最多支持 3 段参考音频和 15 张参考图，支持 2K、4K 输出与 10bit 色深，首发优惠价 0.09 元/秒起，官方称同样预算约 5 倍出片，并从 Day 1 起面向全球创作者开放。", "type": "model", "relTime": "1天前"}, {"id": 38, "title": "Next Token 第五期：Personal Agent 与开源之争", "source": "X：Oran Ge (@oran_ge)", "sourceUrl": "https://x.com/oran_ge/status/2108013755393311116", "date": "2026-10-08T01:56:58.000Z", "summary": "Next Token 第五期更新，一次性补齐国庆假期期间的 AI 话题。本期聚焦 Personal Agent，从 Dots 接入 Codex 的体验、记忆与云电脑权限聊起，讨论 Agent 是助理还是数字分身，并涉及 Instinct 订房商旅模式及邮箱、微信、RSS 的信息开放差异。", "type": "model", "relTime": "1天前"}, {"id": 39, "title": "美国男子 Michael Smith 因用 AI 骗取音乐版权收入被判 18 个月监禁并罚没 800 万美元", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/010/378.htm", "date": "2026-10-08T01:06:38.270Z", "summary": "美国司法部宣布，北卡罗来纳州男子 Michael Smith 因利用 AI 骗取音乐版权收入，被判 18 个月监禁并罚没 800 万美元违法收入。他在 2017~2024 年用 AI 生成数十万首歌曲，通过虚假账户在流媒体平台上线，再用机器人账户矩阵进行欺诈性播放获利。流媒体欺诈会挤占原本应支付给真实词曲作者和演唱者的版权资金池收入。", "type": "industry", "relTime": "1天前"}, {"id": 40, "title": "前字节实习生田柯宇进军世界模型创业，估值达 2 亿美元", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/010/356.htm", "date": "2026-10-07T23:36:04.837Z", "summary": "据彭博社报道，前字节跳动实习生田柯宇创办世界模型创业公司，从五源资本、IDG 资本等融资近 3,000 万美元，投后估值 2 亿美元，公司尚无名字和产品。其团队打造了一套包含 20 万个符号的 AI 视觉语言系统，计划输入 1 亿小时视频，称可将生成 1 秒视频的成本至少降至原来的十分之一，拟在 2027 年发布完整模型前现场展示技术。", "type": "industry", "relTime": "2天前"}, {"id": 41, "title": "Ben Affleck 谈机器学习与视觉特效工作流中的 Python", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Oct/7/ben-affleck/", "date": "2026-10-07T23:14:58.000Z", "summary": "Ben Affleck 表示自己从胶片转向数字电影时期开始对计算机产生兴趣，并会写“相当糟糕的 Python 脚本”。他提到视觉特效工作流多年来已包含机器学习，卷积神经网络作为 Transformer 的前身，可用于处理 tensor 并实现边缘检测与特征提取，从而更轻松地抠出绿幕画面并替换背景。", "type": "paper", "relTime": "2天前"}, {"id": 42, "title": "Envato 推出 Burst Mode：1 积分生成最多 6 个视觉方向", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2107942182405521535", "date": "2026-10-07T21:12:34.000Z", "summary": "Envato 上线 Burst Mode，可将一个想法或参考图一次生成最多 6 个视觉方向，仅消耗 1 个 AI 积分，速度最高提升 10 倍。用户可从粗略想法、半成型构思或参考图起步，并通过参考图、moodboard 以及从聚焦到狂野的创意控制调节每批结果。之后可用“More like this”延展有潜力的方向，再进一步打磨。", "type": "paper", "relTime": "2天前"}, {"id": 43, "title": "Perplexity Decider v1.1 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2107938516080722327", "date": "2026-10-07T20:58:00.000Z", "summary": "Perplexity Decider v1.1 现已上线 OpenRouter  @perplexity_ai 的开源权重多模态决策模型，接受文本、JSON 或图像输入，返回带概率的类型化答案  $0.02/M 输入。输出免费  https://openrouter.ai/perplexity/pplx-decider-v1.1-27b", "type": "model", "relTime": "2天前"}, {"id": 44, "title": "Envato Burst 模式降低图像生成成本", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2107937276475174976", "date": "2026-10-07T20:53:04.000Z", "summary": "图像模型已经非常擅长匹配提示词。但前提是你能写出提示词。  Envato 的 Burst 模式将单张图像成本降低 6 倍，1 个 AI credit 返回 6 张草稿。  在 Envato 的 AI 图像工具中开启后，它能把粗略的提示词、风格参考或情绪板转化为一批并排展示的方向。  创意探索是一个搜索问题，而只有当尝试另一条分支足够便宜时，搜索才有效。在这里，整批只需一个 AI credit。", "type": "model", "relTime": "2天前"}, {"id": 45, "title": "ChatGPT 推出 Intelligent UI，并预告 GPT-6 将面向所有用户", "source": "X：ChatGPT (@ChatGPT)", "sourceUrl": "https://x.com/ChatGPT/status/2107933133635248145", "date": "2026-10-07T20:36:37.000Z", "summary": "ChatGPT 推出 Intelligent UI，能以完全交互式的用户界面快速回答问题，让日常回答更直观。它帮助用户更轻松地学习复杂主题，并即时生成解决任务的小工具。文中还预告 GPT-6 即将登陆 ChatGPT，面向所有用户。", "type": "paper", "relTime": "2天前"}, {"id": 46, "title": "fal 上线 Vidu Q4 图生视频与参考生视频", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2107930328178237724", "date": "2026-10-07T20:25:28.000Z", "summary": "今天就来试试！  图生视频 https://fal.ai/models/fal-ai/vidu/q4/image-to-video  参考生视频 https://fal.ai/models/fal-ai/vidu/q4/reference-to-video", "type": "model", "relTime": "2天前"}, {"id": 47, "title": "Vidu Q4 上线 fal 平台", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2107930326139867264", "date": "2026-10-07T20:25:27.000Z", "summary": "Vidu Q4 现已在 fal 上线。支持基于单张首帧的图生视频并带原生音频，参考生视频最多可用 12 张参考图和 3 段语音片段以保持角色与声音一致，可生成 3 到 16 秒、540p 至 4K 的片段。", "type": "paper", "relTime": "2天前"}, {"id": 48, "title": "ChatGPT 推出 Intelligent UI，回答将搭配图表、按钮等交互式视觉内容", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/1007276/openai-chatgpt-intelligent-ui-gpt-6", "date": "2026-10-07T19:10:42.000Z", "summary": "OpenAI 在 ChatGPT 中推出 Intelligent UI 功能，随 GPT-6 一并向所有用户推送，让回答可结合图表、图示、表单和可点击按钮。OpenAI 称训练了 GPT-6 判断何时用交互式视觉替代纯文本，用户还可让其内联生成退休储蓄计算器、小游戏或账单分摊工具。", "type": "paper", "relTime": "2天前"}, {"id": 49, "title": "OpenRouter 上线 Cloudflare 开源决策模型 Clef（27B）和 Clef Flash（9B）", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2107897999364177925", "date": "2026-10-07T18:17:00.000Z", "summary": "Cloudflare 的开源决策模型 Clef（27B）和 Clef Flash（9B）现已在 OpenRouter 上提供。两者接收文本、JSON 或图像，返回带概率的类型化答案而非生成文本，定价 $0.24/M input 和 $0.09/M input，输出免费。", "type": "model", "relTime": "2天前"}, {"id": 50, "title": "Mecka 融资 6000 万美元 B 轮", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2107894323811672152", "date": "2026-10-07T18:02:24.000Z", "summary": "机器人领域没有互联网规模的数据集。这才是真正的瓶颈。  Mecka 刚刚完成了由红杉资本领投的 6000 万美元 B 轮融资，就是为了构建这样一个数据集。  > 定制的多传感器采集硬件 > 一个计算机视觉实验室，将原始、嘈杂的素材转化为结构化的训练信号 > 招聘工程师来扩展这两方面  现实世界的一秒钟所包含的信息量，比一页文字还要多。这就是这项工作的规模。", "type": "industry", "relTime": "2天前"}, {"id": 51, "title": "美国司法部首例流媒体刷量案：诈骗者用 1 万机器人账号和 AI 歌曲冒充 Taylor Swift 播放量被判刑", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/tech-policy/2026/10/outstreaming-taylor-swift-is-easy-with-10k-bots-and-ai-songs-fraudster-admits/", "date": "2026-10-07T17:57:39.000Z", "summary": "Smith 因用约 1 万个机器人账号和 AI 生成歌曲伪造流媒体播放量骗取版税，被判 18 个月监禁，并须没收 8,091,843.64 美元非法所得。DOJ 称这是此类起诉中的第一案，指出其行为摊薄了平台版税池、损害真实艺术家收益；其律师以当事人未实际持有 800 万美元、已获唱片公司工作为由争取缓刑，DOJ 则以持续欺骗手段和说谎为由主张从重判刑以示震慑。", "type": "industry", "relTime": "2天前"}, {"id": 52, "title": "Google 开放 SynthID Detector，称已有超 1800 亿张图片和视频带 SynthID 水印", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/google-says-180-billion-images-and-videos-now-carry-synthid-watermarks-as-detector-goes-public/", "date": "2026-10-07T17:50:17.000Z", "summary": "Google 将 SynthID Detector 向公众开放，任何人都可检测图片、视频或音频是否由 Gemini、Veo、Lyria 等 Google AI 或其合作方模型生成，支持 JPG、PNG、MP4 和 MP3 格式。", "type": "model", "relTime": "2天前"}, {"id": 53, "title": "Perplexity 开源 pplx-embed-v2-late 多模态 late-interaction 嵌入模型（9B 与 0.6B）", "source": "X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)", "sourceUrl": "https://x.com/AravSrinivas/status/2107871834205196784", "date": "2026-10-07T16:33:02.000Z", "summary": "Perplexity 开源 pplx-embed-v2-late，两个针对文本和图像的 late-interaction 多向量嵌入模型，大小为 9B 和 0.6B，共享同一嵌入空间，权重已在 Hugging Face 提供。9B 可用于索引多模态数据，0.6B 可在设备端查询，无需 OCR 即可检索 PDF 页面；模型在 MADQA 得分 92.4%，BrowseComp+ 得分 64%。", "type": "model", "relTime": "2天前"}, {"id": 54, "title": "Perplexity 发布 pplx-embed-v2-late 双模型，统一空间检索文本、图像与网页", "source": "X：Perplexity (@perplexity_ai)", "sourceUrl": "https://x.com/perplexity_ai/status/2107866029745746177", "date": "2026-10-07T16:09:58.000Z", "summary": "Perplexity 发布 pplx-embed-v2-late，包含两个 late-interaction 嵌入模型，可在共享嵌入空间中跨模型检索文本、图像和网页。两个模型称达到前沿性能，已在 Hugging Face 公开，博客地址 https://www.perplexity.ai/hub/blog/multimodal-embeddings-beyond-a-single-vecto...", "type": "model", "relTime": "2天前"}, {"id": 55, "title": "Google 发布 macOS 版 Google AI Edge Foresight 应用，用 Gemma 4 本地转录语音笔记", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2107853628656496657", "date": "2026-10-07T15:20:41.000Z", "summary": "Google 发布 macOS 版 Google AI Edge Foresight 应用，使用本地模型 Gemma 4 E4B 或 Gemma 4 12B 转录语音笔记并生成文档，EmbeddingGemma2 参与其中。应用可连接 Google Drive 构建知识图谱。作者另提及 Google 以 Apache 2 许可发布了 740M 参数、8K 上下文窗口的多模态嵌入模型 Embe...", "type": "model", "relTime": "2天前"}, {"id": 56, "title": "Suno 邀你发梗图生成歌曲", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2107852725404725406", "date": "2026-10-07T15:17:06.000Z", "summary": "发给我们一张梗图，我们就为它做一首歌……", "type": "paper", "relTime": "2天前"}, {"id": 57, "title": "谷歌 SynthID 检测网站面向全球用户开放，可检测 AI 生成的图片、视频和音频", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/010/293.htm", "date": "2026-10-07T14:47:41.000Z", "summary": "谷歌宣布 AI 生成内容检测网站 SynthID Detector 已面向全球用户开放，可检测图片、视频或音频是否由 AI 生成。", "type": "paper", "relTime": "2天前"}, {"id": 58, "title": "亚利桑那州法院裁定 AI 生成受害者视频带有不当情感分量 将重新量刑", "source": "404 Media（RSS）", "sourceUrl": "https://www.404media.co/undue-emotional-weight/", "date": "2026-10-07T14:46:15.000Z", "summary": "亚利桑那州上诉法院裁定，Gabriel Horcasitas 2021 年路怒枪杀 Christopher Pelkey 一案维持过失杀人定罪，但因量刑听证中播放的 AI 生成受害者视频带有不当情感分量，法官须重新考虑刑期。", "type": "industry", "relTime": "2天前"}, {"id": 59, "title": "Google Labs 推出 AI 游戏创作平台 Playground，可用文本提示词生成浏览器游戏", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/07/google-experiments-with-an-ai-powered-gaming-platform/", "date": "2026-10-07T14:36:23.000Z", "summary": "Google Labs 于本周三推出 AI 游戏创作平台 Playground，用户可通过简单文本提示词构建基于浏览器的游戏，无需编程技能。用户可选类型（如问答或竞速）、2D 或 3D、单人或多人模式，上传图片转为游戏素材；游戏可在手机和电脑上玩，可私密保存、通过链接分享或发布到 Explore 画廊。", "type": "paper", "relTime": "2天前"}, {"id": 60, "title": "Google 开放 SynthID Detector 验证入口，任何人都可检测 AI 生成内容", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2107836750257107133", "date": "2026-10-07T14:13:37.000Z", "summary": "Google 宣布开放 SynthID Detector，任何人都可通过 synthid.com 检查图片、视频或音频文件是否带有 SynthID 水印，支持 Google 及 OpenAI、NVIDIA、Kakao 等合作方生成的内容，Apple 即将加入。", "type": "product", "relTime": "2天前"}, {"id": 61, "title": "Google：SynthID 已为超 1800 亿张图片和视频添加水印，日均处理超 100 万次验证请求", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2107836412519129334", "date": "2026-10-07T14:12:17.000Z", "summary": "Google 宣布 SynthID 自 2023 年上线以来已为超过 180 亿张图片和视频及 24 万年时长的音频内容添加水印。SynthID Detector 平台与 Search、GeminiApp 和 Chrome 内置的验证功能配合，目前每天处理超过 100 万次验证请求。", "type": "product", "relTime": "2天前"}, {"id": 62, "title": "Google 开放 SynthID Detector 门户，可检测图片、视频和音频是否由 AI 生成", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2107836410254291345", "date": "2026-10-07T14:12:16.000Z", "summary": "Google 介绍检测媒体是否由 AI 生成的方法：访问 https://synthid.com 上传图片、视频或音频文件，门户会扫描文件是否包含来自 Google 或其合作伙伴的 SynthID 水印。", "type": "tip", "relTime": "2天前"}, {"id": 63, "title": "Google 联合 OpenAI、NVIDIA、Kakao 扩展 SynthID Detector 检测门户", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2107836407616299371", "date": "2026-10-07T14:12:15.000Z", "summary": "Google 宣布扩展 SynthID Detector，与 OpenAI、NVIDIA、Kakao 合作，Apple 即将加入，以提升 AI 生成内容的透明度。该验证门户以英语在全球开放，用户可上传文件检测媒体是否由 AI 生成，页面显示可检测来自 NVIDIA、OpenAI、Google、Kakao 生成的媒体。", "type": "industry", "relTime": "2天前"}, {"id": 64, "title": "Google DeepMind 推出 SynthID Detector，可检测视频、音频和图像中的水印", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2107834254222581862", "date": "2026-10-07T14:03:42.000Z", "summary": "Google DeepMind 推出 SynthID Detector，可快速识别视频、音频和图像中的 SynthID 水印，即使经过添加滤镜等编辑仍可检测。用户也可使用 Chrome、Google 搜索和 Gemini 应用中已有的 AI 内容识别功能。", "type": "paper", "relTime": "2天前"}, {"id": 65, "title": "Google DeepMind 的 SynthID Detector 面向所有人开放", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2107834249680499136", "date": "2026-10-07T14:03:41.000Z", "summary": "Google DeepMind 宣布 SynthID Detector 现已向所有人开放，可用于检测在线内容是否由 @GoogleAI 或行业合作方工具生成。合作方包括 OpenAI、NVIDIA、Kakao，Apple 即将加入，试用入口为 https://synthid.com。", "type": "product", "relTime": "2天前"}, {"id": 66, "title": "Google 推出改进版 SynthID 检测器并面向全球开放", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/10/google-rolls-out-improved-synthid-ai-content-detector-now-available-globally/", "date": "2026-10-07T14:00:08.000Z", "summary": "Google 宣布 SynthID 检测器现在支持所有合作方的水印，并上线 SynthID.com 网站供任何人使用。此前外部用户只能通过 Gemini 检测水印，且旧版检测器只识别 Google 自己的 SynthID；SynthID 是嵌入在图像、视频像素和音频波形中的隐形水印，仅 Gemini 就已集成超过 1800 亿张图片和视频以及 24 万年的音频。", "type": "paper", "relTime": "2天前"}, {"id": 67, "title": "Google 推出 SynthID 检测网站，面向公众开放识别 AI 生成内容", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/07/googles-new-synthid-website-can-identify-ai-generated-media/", "date": "2026-10-07T14:00:00.000Z", "summary": "Google 推出面向所有人的 SynthID 检测网站，可验证图片、视频或音频是否由 AI 生成，此前该工具仅向部分记者、媒体从业者和研究人员开放测试。", "type": "paper", "relTime": "2天前"}, {"id": 68, "title": "PixVerse 插件在聊天中生成视频", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2107818326449942644", "date": "2026-10-07T13:00:25.000Z", "summary": "你的下一段视频从聊天开始。  PixVerse 插件让你在构思的地方直接用文本、图片或视频参考来创作。  试试这样做： → 选择 PixVerse 插件。 → 描述场景、添加图片，或提供视频参考。 → 指定模型、时长、分辨率和宽高比。 → 让它生成。", "type": "model", "relTime": "2天前"}, {"id": 69, "title": "豆包登陆华为鸿蒙电脑端，首版本搭载豆包 2.1 Turbo / Pro 模型", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/010/280.htm", "date": "2026-10-07T12:15:41.000Z", "summary": "豆包 App 已正式登陆华为鸿蒙电脑端，用户可在应用市场直接搜索下载，首版本搭载豆包 2.1 Turbo 和豆包 2.1 Pro 模型，支持对话与工作随心切换。该版本上线深入研究、PPT 生成、帮我写作、图像生成、云盘等核心能力，覆盖工作、学术研究、资料管理、自动化任务、创意设计等场景。华为官方透露，豆包位列鸿蒙电脑用户心愿单 TOP1。", "type": "model", "relTime": "2天前"}, {"id": 70, "title": "谷歌推出 macOS 应用 AI Edge Foresight，支持离线整理会议纪要", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/010/214.htm", "date": "2026-10-07T07:32:06.000Z", "summary": "谷歌推出 macOS 应用 AI Edge Foresight，展示 EmbeddingGemma 2 端侧多模态模型。应用可调用 Mac 麦克风和系统音频并结合用户笔记，完全离线生成润色的线上线下会议纪要，还支持基于会议内容和其他知识库的实时问答；兼容 Apple 芯片的 Mac，可免费下载。", "type": "model", "relTime": "2天前"}, {"id": 71, "title": "Ben Affleck 解释 Transformer AI 与传统计算差异", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2107727217958736040", "date": "2026-10-07T06:58:23.000Z", "summary": "两届奥斯卡得主 Ben Affleck 解释基于 Transformer 的 AI 与传统计算有何不同。  传统软件是确定性的，而这些模型通过“将信息跑过注意力层”并推断输出来生成答案。  ---- 完整视频在“One More Question and GQ”YouTube 频道，（链接在评论中）", "type": "model", "relTime": "2天前"}, {"id": 72, "title": "Nano Banana 2.1 发布，Google Labs 高管称蒙版编辑是当日最爱", "source": "X：Josh Woodward (@joshwoodward, Google Labs VP)", "sourceUrl": "https://x.com/joshwoodward/status/2107679061854273656", "date": "2026-10-07T03:47:01.000Z", "summary": "Nano Banana 2.1 发布，官方称在视觉设计、蒙版编辑、主体一致性和更自然的图像观感上超越前代。用户现可在 Gemini App 和 Google AI Studio 等入口使用；Google Labs VP Josh Woodward 表示蒙版编辑是此次更新中他最喜欢的功能，并预告后续还有更多更新。", "type": "product", "relTime": "2天前"}, {"id": 73, "title": "Google DeepMind 等提出 IdeaLens：读大纲检测 AI 生成创意", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2107663123104891021", "date": "2026-10-07T02:43:41.000Z", "summary": "Google DeepMind 等机构发布论文，提出检测 AI 生成创意（而非文字或图像）的检测器 IdeaLens，其核心发现是读取文档大纲而非文字即可判断创意出自人还是 AI。", "type": "paper", "relTime": "2天前"}, {"id": 74, "title": "谷歌发布 Nano Banana 2.1，改进视觉设计、蒙版编辑与主体一致性", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/010/149.htm", "date": "2026-10-07T01:01:58.000Z", "summary": "谷歌于 10 月 7 日发布 AI 图像生成与编辑模型 Nano Banana 2.1，重点提升视觉设计、基于蒙版的局部编辑以及多图生成中的主体一致性。", "type": "model", "relTime": "2天前"}, {"id": 75, "title": "FastVideo 宣布支持 Kandinsky 6 视频生成", "source": "X：UCSD Hao AI Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2107622569562284242", "date": "2026-10-07T00:02:32.000Z", "summary": "Hao AI Lab 宣布 FastVideo 支持 Kandinsky 6，可生成文/图生视频并配同步音频，提供 Pro 30B 和 Lite 3B 两种规格。每个规格都有 10 步蒸馏的 pi-Flow 版本，并支持最高 4x 的视频超分，作者并致谢 kandinskylab_ai 团队开源模型。", "type": "model", "relTime": "2天前"}, {"id": 76, "title": "IT早报 1007：余承东详解华为 Mate 90“拼好网”；谷歌推出 EmbeddingGemma 2；DeepSeek 接近完成至少 800 亿元融资", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/010/139.htm", "date": "2026-10-06T23:53:37.000Z", "summary": "谷歌推出开源多模态嵌入模型 EmbeddingGemma 2，基于 Gemma 4 架构，7.4 亿参数，量化后手机端运行仅需 191MB 内存，可统一处理文本、代码、图像、视频和音频。", "type": "model", "relTime": "3天前"}, {"id": 77, "title": "谷歌发布 EmbeddingGemma 2 多模态嵌入模型：7.4 亿参数，量化后手机端仅需 191MB 内存", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/010/125.htm", "date": "2026-10-06T22:41:19.000Z", "summary": "谷歌发布 EmbeddingGemma 2 嵌入模型，基于 Gemma 4 架构，采用 Apache 2.0 许可，总参数 7.4 亿，将能力从文本扩展到代码、图像、视频、音频并统一映射到同一嵌入空间。", "type": "model", "relTime": "3天前"}, {"id": 78, "title": "Hao AI Lab 发布 FastH3 V2 与 FastH3 Trim，可在单张消费级 GPU 上本地生成视频", "source": "X：UCSD Hao AI Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2107591980591227227", "date": "2026-10-06T22:00:59.000Z", "summary": "Hao AI Lab 宣布 FastVideo FastH3 现在可在单台消费级设备上运行，支持 NVIDIA RTX GPU、DGX Spark 和 Apple Silicon。FastH3 V2 在 8 步内胜过基础 MiniMax H3，一张 RTX 5090 上生成 5 秒 480p 含音频视频只需 15 秒。新发布的 FastH3 Trim 比基础 H3 小 4.2 倍，最低 8 ...", "type": "product", "relTime": "3天前"}, {"id": 79, "title": "Google Nano Banana 2.1 图像模型上线 fal", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2107584175452602610", "date": "2026-10-06T21:29:59.000Z", "summary": "Google 最新的图像模型 Nano Banana 2.1 现已在 fal 上线。该模型带来更快的生成速度、更好的主体一致性、改进的视觉设计以及基于蒙版的编辑能力。", "type": "model", "relTime": "3天前"}, {"id": 80, "title": "Google Earth AI 用智能体自动构建疾病预测模型", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2107578318752993311", "date": "2026-10-06T21:06:42.000Z", "summary": "Google Earth AI 结合 AlphaEarth Foundations、人口动态基础模型（PDFM）与原型 Geospatial Reasoning 智能体，可自动调用相关模型和数据集，为研究人员构建疾病传播预测模型。研究人员只需提问疾病下一步可能在哪里扩散，系统即整合环境信号与人口数据给出预测。该工具通过卫星影像与人口模式结合，揭示隐藏风险因素，帮助更早发现问题。", "type": "model", "relTime": "3天前"}, {"id": 81, "title": "Google Earth AI 助力公共卫生疫情预测", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2107578315527623122", "date": "2026-10-06T21:06:41.000Z", "summary": "Google Earth AI 可用于更快、更主动地应对公共卫生危机。新研究显示，将行为趋势、地理空间 AI 模型等洞察结合后，公共卫生团队能更好理解复杂公共卫生问题、弥合报告缺口，并把应急响应从被动管理转向主动预防。传统疫情传播预测通常需要数周拼接卫星影像、人口普查表和地方卫生记录。", "type": "paper", "relTime": "3天前"}, {"id": 82, "title": "Google 发布端侧多模态嵌入模型 EmbeddingGemma 2，采用 Apache 2.0 开源", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2107578087726895515", "date": "2026-10-06T21:05:47.000Z", "summary": "Google 发布 EmbeddingGemma 2，是其首个原生多模态开放嵌入模型，将文本、代码、图像、音频和视频统一到一个共享空间，采用 Apache 2.0 许可证。", "type": "model", "relTime": "3天前"}, {"id": 83, "title": "Google 发布 Nano Banana 2.1，登入 Arena 三个图像榜单", "source": "X：Arena (@arena)", "sourceUrl": "https://x.com/arena/status/2107576893973344578", "date": "2026-10-06T21:01:03.000Z", "summary": "Google 发布图像生成与编辑模型 Nano Banana 2.1，并已进入 Arena 的文生图、图像编辑和多图编辑三个榜单，分别以 1328、1428、1431 分位列第 5、第 6、第 4。相比 Nano Banana 2，文生图提升 80 分、多图编辑提升 67 分、图像编辑提升 38 分；官方称在视觉设计、基于掩码的编辑和主体一致性上有明显进步。", "type": "model", "relTime": "3天前"}, {"id": 84, "title": "OpenAI 将在欧盟默认为 ChatGPT 输出水印，其他地区默认关闭", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/10/openai-will-watermark-chatgpt-outputs-by-default-but-only-in-the-eu/", "date": "2026-10-06T20:50:32.000Z", "summary": "OpenAI 宣布将在欧盟自动为 ChatGPT 生成的文本添加水印，其他地区也提供该功能但默认关闭。此举是为了遵守 8 月生效的欧盟 AI 法案对 AI 内容可检测标记的要求。其专有方法名为 textGrain，通过不易被人察觉的用词模式嵌入水印，OpenAI 将向有限的研究者和组织开放检测器，并提供申请流程。", "type": "paper", "relTime": "3天前"}, {"id": 85, "title": "OpenAI Decisions API 开发者用例", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2107573387489165530", "date": "2026-10-06T20:47:07.000Z", "summary": "开发者一直在用 Decisions API 来：  • 将请求路由到正确的模型、工具或智能体。  • 将规模化输入转化为有用的标签、排名和分数。  • 分析图像、比较视觉内容，或识别关键视频帧。  • 从截图中选择按钮、导航表单或确定操作。  • 标记有风险的工具调用，或识别需要深入审查的问题。  • 对大型数据集进行分类，以发现趋势和模式。", "type": "tip", "relTime": "3天前"}, {"id": 86, "title": "Sesame 语音助手大版本升级：更富表现力的模型、图像生成、connectors 和 computer use", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2107568598172741974", "date": "2026-10-06T20:28:05.000Z", "summary": "Sesame 语音助手获得大幅升级，包含更富表现力的更新模型、图像生成、connectors、computer use 等功能。Sesame 现在可以通过语音操作 Devin、Codex、Claude Code 等编码智能体；官方引用内容称语音助手今日向所有人开放，眼镜产品计划 2027 年推出。", "type": "model", "relTime": "3天前"}, {"id": 87, "title": "Google Nano Banana 2.1 上线 Arena 三大图像榜单，多图编辑列第 4", "source": "X：Arena (@arena)", "sourceUrl": "https://x.com/arena/status/2107567724264313059", "date": "2026-10-06T20:24:36.000Z", "summary": "Google 发布图像生成与编辑模型 Nano Banana 2.1，已进入 Arena 的 Text-to-Image、Image Edit 和 Multi-Image Edit 榜单，分别以 1328、1428 和 1431 分列第 5、第 6 和第 4 名。", "type": "model", "relTime": "3天前"}, {"id": 88, "title": "fal 推出 Claude 与 Codex 图像视频插件", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2107561234778190131", "date": "2026-10-06T19:58:49.000Z", "summary": "使用全新的 fal Claude Connector 和 GPT 插件，直接在 Claude 或 ChatGPT Codex 中生成图像和视频。无需 API Key！  在 YouTube 上观看教程：https://youtu.be/gSFCIxZSodQ?si=Ti7umkZA7tClphMD", "type": "product", "relTime": "3天前"}, {"id": 89, "title": "Google DeepMind 发布开源轻量多模态嵌入模型 EmbeddingGemma 2", "source": "Google DeepMind：Blog（RSS）", "sourceUrl": "https://deepmind.google/blog/embeddinggemma-2-an-open-lightweight-multimodal-embedding-model/", "date": "2026-10-06T19:57:04.000Z", "summary": "Google DeepMind 发布 EmbeddingGemma 2，基于 Gemma 4 架构，以 Apache 2.0 许可开源，将文本、代码、图像、视频和音频映射到统一嵌入空间。", "type": "model", "relTime": "3天前"}, {"id": 90, "title": "Google 发布 7.4 亿参数开源嵌入模型 EmbeddingGemma 2", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/google-cl ate": "2026-10-06T10:15:05.000Z", "summary": "可灵 AI 拆解 AI 短片《The Beat》的制作过程，该片全网曝光超 500 万。Kling 4.0 支持单次原生生成最长 30 秒视频、单次任务最多 15 项参考素材、最多 10 张关键帧输入，并提升了大动态运镜稳定性与口型匹配。Kling 4.0 Flash 已向黑金年卡会员开放抢先体验，Kling 4.0 将于 10 月正式上线。", "type": "tip", "relTime": "3天前"}, {"id": 120, "title": "Reka 发布 19B 全模态推理模型 Rho-1，单一网络生成视频并输出机器人动作", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/10/05/reka-releases-rho-1-a-19b-omni-reasoning-model-that-understands-generates-video-and-outputs-robot-actions-in-one/", "date": "2026-10-06T06:45:31.000Z", "summary": "Reka 发布 19B 全模态推理模型 Rho-1 的研究预览版，从零训练，单个网络即可理解并生成文本、图像和视频，并输出机器人动作。模型在每层使用理解与生成两条专家流，共享注意力与同一 KV cache；蒸馏版把去噪从 99 步降到 8 步，约 1 秒生成 5.3 秒视频片段。训练用了 320 张 H100 跑 3 个月，视频上限 672×384，目前仅研究预览，未开放权重、API 或定价。", "type": "model", "relTime": "3天前"}, {"id": 121, "title": "fal 上线 Kandinsky6 视频模型", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2107350359257542848", "date": "2026-10-06T06:00:52.000Z", "summary": "今天就来试试！  Text-to-Video Lite https://fal.ai/models/fal-ai/kandinsky6-lite/text-to-video  Image-to-Video Lite https://fal.ai/models/fal-ai/kandinsky6-lite/image-to-video  Text-to-Video Pro https://fa...", "type": "model", "relTime": "3天前"}, {"id": 122, "title": "Kandinsky 6.0 上线 fal", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2107350357361770548", "date": "2026-10-06T06:00:52.000Z", "summary": "Kandinsky 6.0 现已在 fal 上线  - Pro 用于电影级、高保真生成 - Lite 用于快速、低成本迭代 - 原生同步音频 - 内置放大，另有独立的 VSR 和 VSR Lite 用于视频超分辨率", "type": "paper", "relTime": "3天前"}, {"id": 123, "title": "Google 发布 EmbeddingGemma 2：基于 Gemma 4 的开源多模态嵌入模型", "source": "Google Developers Blog（RSS）", "sourceUrl": "https://developers.googleblog.com/embeddinggemma-2-the-developer-guide/", "date": "2026-10-06T00:00:00.000Z", "summary": "Google 发布基于 Gemma 4 的开源嵌入模型 EmbeddingGemma 2，采用 Apache 2.0 许可，将文本、代码、图像、视频和音频映射到统一的 768 维向量空间，参数量从 270M（文本/代码）到 740M（全模态）按需加载。", "type": "tip", "relTime": "4天前"}, {"id": 124, "title": "Gemini Nano Banana 2.1 图像生成模型正式发布，gemini-3.1-flash-image 被弃用", "source": "Gemini API：更新日志（网页）", "sourceUrl": "https://ai.google.dev/gemini-api/docs/changelog#10-06-2026", "date": "2026-10-06T00:00:00.000Z", "summary": "Google 在 Gemini API 更新日志中宣布 Gemini Nano Banana 2.1（gemini-nano-banana-2.1）正式可用，作为 Nano Banana 2（gemini-3.1-flash-image）的更新版本。", "type": "model", "relTime": "4天前"}, {"id": 125, "title": "Google DeepMind 发布多模态嵌入模型 EmbeddingGemma 2", "source": "Google Developers Blog（RSS）", "sourceUrl": "https://developers.googleblog.com/google-ai-edge-with-embeddinggemma-2/", "date": "2026-10-06T00:00:00.000Z", "summary": "Google DeepMind 于 10 月 6 日发布开放权重的多模态嵌入模型 EmbeddingGemma 2，将文本、图像、视频帧和音频映射到统一向量空间，参数量 740M。", "type": "model", "relTime": "4天前"}, {"id": 126, "title": "Manus 推出视频编辑器", "source": "X：Manus (@ManusAI)", "sourceUrl": "https://x.com/ManusAI/status/2107259325907677602", "date": "2026-10-05T23:59:08.000Z", "summary": "Manus 为什么推出视频编辑器？因为我们意识到，做出一个好视频不只是生成素材。  它还关乎： - 浏览互联网，搞清楚什么在走红 - 写代码来制作动态图形、版式和地图路线 - 每一步都使用最好的模型和工具 https://manus.im/blog/introducing-video-editor", "type": "model", "relTime": "4天前"}, {"id": 127, "title": "Airbnb 将大幅增加 AI token 支出", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2107256402632946163", "date": "2026-10-05T23:47:31.000Z", "summary": "Airbnb CEO Brian Chesky：“我们今年在 AI token 上的支出将远超预期，但这很好，因为 ROI 就在那里。  我认为现在可以放心地说，AI 是 Airbnb 身上发生过的最好的事。我觉得我们正在成为一家 AI 原生公司，这大概是我们业绩表现的头号解释。”  - Airbnb 财报超预期后股价大涨 15%  ----  来自“CNBC Television”YouT...", "type": "paper", "relTime": "4天前"}, {"id": 128, "title": "Google Cloud 数据库如何为生产级 AI 激活数据层", "source": "Google AI：DEV 作者专属（RSS）", "sourceUrl": "https://dev.to/googleai/activating-your-data-layer-for-production-ready-ai-p3e", "date": "2026-10-05T19:39:51.000Z", "summary": "Google Cloud 发布系列实验，演示如何用 AlloyDB 和 Cloud SQL 为生产级 AI 准备数据：在数据库中生成文本嵌入做语义搜索，为 RAG 提供 grounding，并支持多模态嵌入实现图文混合检索。AlloyDB 还提供 AI.IF 等 AI 函数，无需数据准备即可用自然语言查询过滤和重排结果，QueryData 则支持用对话式语言生成 SQL 并构建数据智能体。", "type": "tip", "relTime": "4天前"}, {"id": 129, "title": "Reka AI 发布 19B 全能模型 Rho-1，单模型处理文本、图像、视频与机器人控制", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/reka-ais-omni-model-rho-1-handles-text-images-video-and-robot-control-in-a-single-model/", "date": "2026-10-05T18:26:05.000Z", "summary": "Reka AI 发布 190 亿参数全能模型 Rho-1 的研究预览版，在单一神经网络内处理并生成文本、图像、视频和机器人控制动作。该模型将全部模态作为 token 放入同一上下文窗口，无需工具调用或外部模型，可实时生成连续视频并即时响应新指令，同一套权重既预测摄像头图像也驱动机器人运动。", "type": "model", "relTime": "4天前"}, {"id": 130, "title": "OpenAI 说明文本水印的工作原理与能力边界", "source": "X：OpenAI (@OpenAI)", "sourceUrl": "https://x.com/OpenAI/status/2107164651478012412", "date": "2026-10-05T17:42:56.000Z", "summary": "OpenAI 说明其文本水印机制，在生成文本时嵌入不可见统计信号，检测器可据此判断文本是否可能由 OpenAI 模型生成。该水印不添加可见标记，不识别作者、组织、账号或对话来源。OpenAI 表示测试中水印未影响模型能力、速度或回复的阅读体验。", "type": "model", "relTime": "4天前"}, {"id": 131, "title": "Krea Agent 登陆 After Effects，可制作动态图形并处理音视频", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2107138756507763130", "date": "2026-10-05T16:00:02.000Z", "summary": "Krea AI 宣布 Krea Agent 进入 After Effects。Agent 可在 After Effects 内制作动态图形、调整视频尺寸，并处理声音、图像等内容。目前已开放免费试用。", "type": "paper", "relTime": "4天前"}, {"id": 132, "title": "OpenAI 在 ChatGPT 图像生成结果旁推出视觉广告", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/05/openai-launches-visual-ads-that-appear-alongside-image-generation-results/", "date": "2026-10-05T15:14:24.000Z", "summary": "OpenAI 将在 ChatGPT 的图像生成结果旁展示视觉广告，本月晚些时候先在美国上线，面向初始测试广告主，广告会明确标注且不影响 ChatGPT 的回答。OpenAI 同时扩展广告测量工具与合作伙伴生态，并推进品牌适配性评估试点，广告远期目标是覆盖其 12 亿周活用户。", "type": "paper", "relTime": "4天前"}, {"id": 133, "title": "Gemini Notebook 更新用量限额系统并新增后台生成队列", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2107125198579286277", "date": "2026-10-05T15:06:10.000Z", "summary": "Gemini Notebook 推出新的用量限额系统、artifact 生成用量估算和后台队列。限额从每 24 小时刷新改为每 5 小时刷新；原来按功能单独限额改为灵活的 Notebook 专属限额，由用户自行分配；额度用完时可将视频、幻灯片等生成任务放入后台队列，之后自动生成。", "type": "paper", "relTime": "4天前"}, {"id": 134, "title": "OpenAI 将在 ChatGPT 图像生成中测试图片广告形式", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/901.htm", "date": "2026-10-05T15:01:59.000Z", "summary": "OpenAI 宣布在 ChatGPT 中推出全新图片广告形式，本月晚些时候在美国启动测试，首批邀请部分广告主参与。初期在图像生成功能中测试，广告会清晰标注并与生成内容相互独立，官方称广告不会影响 ChatGPT 的回答。ChatGPT 每周覆盖 12 亿用户，此次同时扩充广告效果衡量工具并研发品牌适配性评估方案。", "type": "paper", "relTime": "4天前"}, {"id": 135, "title": "Higgsfield AI 生成爆款网红视频", "source": "X：Higgsfield AI (@higgsfield)", "sourceUrl": "https://x.com/higgsfield/status/2107112781854245256", "date": "2026-10-05T14:16:50.000Z", "summary": "官方消息，每一位爆火的 AI 网红都是用 Higgsfield 制作的。  用你自己的脸或从零开始制作一个。然后用 Genjutsu 跟上爆款趋势。  最多可免费试用 5 次生成。  现已在 Higgsfield 上线，并可通过 ChatGPT Extension 使用。  Credits: @JeanPhilMadame", "type": "paper", "relTime": "4天前"}, {"id": 136, "title": "OpenAI 将在 ChatGPT 中测试视觉广告", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/1004655/openai-chatgpt-visual-ads", "date": "2026-10-05T13:09:48.000Z", "summary": "OpenAI 宣布本月晚些时候在美国测试 ChatGPT 的新视觉广告格式，初期出现在用户生成图片时。广告与生成的图像保持分离，不会影响 ChatGPT 的回答，Plus、Pro 或 Enterprise 订阅用户不会看到广告；公司称设有护栏避免在情绪脆弱或敏感场景中投放，并正与首批广告主测试、计划未来尝试更多格式。此前 ChatGPT 广告自2月起仅在聊天下方赞助位显示公司名、标志和链接。", "type": "paper", "relTime": "4天前"}, {"id": 137, "title": "OpenAI 将在 ChatGPT 图像生成加载界面测试轮播广告", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/chatgpts-new-ad-format-fills-the-image-generation-loading-screen-with-product-carousels/", "date": "2026-10-05T12:37:32.000Z", "summary": "OpenAI 将于本月晚些时候在美国测试新广告格式，在 ChatGPT 生成图像时于图片下方展示轮播或一排产品广告，广告带有标识并与生成内容分开。同期 OpenAI 扩展了衡量工具，接入 Hightouch、AppsFlyer 等转化与归因服务商，并与 DoubleVerify 和 Integral Ad Science 试点品牌安全评估，广告主还可设置否定关键词。", "type": "product", "relTime": "4天前"}, {"id": 138, "title": "PixVerse 插件让 AI 智能体生成动态图形", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2107078408014549448", "date": "2026-10-05T12:00:14.000Z", "summary": "Pix "4天前"}, {"id": 144, "title": "消息称 Wayve 将为大众供应自动驾驶解决方案，与 CARIAD 合作", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/762.htm", "date": "2026-10-05T01:48:19.000Z", "summary": "据德媒 Donaukurier 10 月 2 日报道，英国具身智能初创企业 Wayve 将同大众旗下软件公司 CARIAD 合作，为大众供应自动驾驶解决方案。Wayve 负责开发自动驾驶 AI 软件，CARIAD 负责软件与大众-博世联合开发硬件的系统集成；此前十余家技术供应商参与了大众在德国南部一座主要城市的方案演示，Wayve 在技术和财务两方面表现突出。", "type": "industry", "relTime": "4天前"}, {"id": 145, "title": "Liquid AI 发布 d1 决策模型并新增图像输入能力", "source": "Liquid AI 模型与工程博客（网页）", "sourceUrl": "https://www.liquid.ai/blog/d1-decision-model", "date": "2026-10-05T00:00:00.000Z", "summary": "Liquid AI 发布 d1 决策模型，新增文本与图像输入，可通过 console.liquid.ai 和 d1 Playground 使用。", "type": "model", "relTime": "5天前"}, {"id": 146, "title": "Perplexity Computer 可构建垂直 AI 应用", "source": "X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)", "sourceUrl": "https://x.com/AravSrinivas/status/2106826752169312760", "date": "2026-10-04T19:20:15.000Z", "summary": "你可以在 Computer 里构建自定义垂直 AI 应用，例如：用 3D 和卫星视图猜测图像的 spatial location。", "type": "tip", "relTime": "5天前"}, {"id": 147, "title": "乐山大佛管委会辟谣\"掏耳朵\"养护视频：系AI合成，佛耳内并无杂物", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/728.htm", "date": "2026-10-04T13:20:18.000Z", "summary": "乐山大佛文物保护（景区）管委会回应媒体四川观察称，网传文保工人给大佛\"掏耳朵\"的视频系AI生成的不实信息，大佛耳鼻内并无杂物需清理，凌云山片区目前没有猴子。管委会数字化信息中心副主任陈芮介绍，2026年以来乐山大佛总计开展5次保养维护，第5次于9月20日至25日进行，内容包括岩体表面微损伤修复、微生物清理、表层植被清除等，与视频内容无关。", "type": "industry", "relTime": "5天前"}, {"id": 148, "title": "可灵 4.0 短片《The Beat》播放破 500 万幕后解析", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2106727026635808860", "date": "2026-10-04T12:43:58.000Z", "summary": "可灵 Kling 4.0 制作的短片《The Beat》在社交平台曝光量突破 500 万，官方发布幕后解析。影片开场为 30 秒连续长镜头，依托 Kling 4.0 原生 30 秒生成能力实现；Omni Reference 单任务支持最多 15 个多模态参考，Multi-Keyframe 支持最多 10 个关键帧，并采用 10-bit HDR 输出与升级立体声音频。", "type": "tip", "relTime": "5天前"}, {"id": 149, "title": "xAI 上诉成功，明尼苏达州 AI 虚假裸照禁令被暂时叫停", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/631.htm", "date": "2026-10-04T03:45:58.000Z", "summary": "xAI 于当地时间本周五成功说服美国第八巡回上诉法院颁布临时禁令，暂时搁置明尼苏达州 8 月 1 日生效的全美首个 AI 生成虚假裸照禁令。xAI 主张该法案违反宪法言论自由，并称 Grok Imagine 已设置防护机制阻止生成脱衣或性化图像，同时对绕过拦截的用户发起起诉。州总检察长办公室表示失望，称将继续维护该法律。", "type": "industry", "relTime": "5天前"}, {"id": 150, "title": "马斯克：特斯拉 Robotaxi 奥斯汀夜间运营延至 23 点，正攻克夜间识别宠物难题", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/627.htm", "date": "2026-10-04T03:11:35.000Z", "summary": "马斯克宣布特斯拉 Robotaxi 在奥斯汀的运营结束时间从 22 点延长至 23 点，并称团队正着力解决夜间视线不佳时碾过宠物的问题。他提出可用 AI 辅助摄像头做光子计数分析，提升可见光摄像头在黑暗环境下的识别效果。特斯拉 Cybercab 依靠摄像头视觉与传感器感知环境，NHTSA 正就 FSD 摄像头感知系统在低能见度下的识别能力展开调查。", "type": "industry", "relTime": "5天前"}, {"id": 151, "title": "亚利桑那州上诉法院裁定法庭播放被害人 AI 视频不当，路怒杀人案被告须重新量刑", "source": "Hacker News：AI 热帖", "sourceUrl": "https://www.bbc.com/news/articles/cwgkvygg5nzvo", "date": "2026-10-03T13:34:18.000Z", "summary": "亚利桑那州上诉法院裁定，杀人案被告 Gabriel Paul Horcasitas 量刑时法庭播放的被害人 AI 生成视频使用不当，须重新量刑。被告 2021 年枪杀 Christopher Pelkey，被判 10 年监禁；被害人家人用其录音、视频和照片制作 AI 视频在法庭播放。法院称该视频呈现的是被害人姐姐想象中的被害人和他的想法，越过了界线。", "type": "industry", "relTime": "6天前"}, {"id": 152, "title": "华为 Mate 90 Pro Max 首个版本更新曝光：实装四卡三待、3D 动态照片", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/539.htm", "date": "2026-10-03T13:08:18.000Z", "summary": "华为 Mate 90 Pro Max 首个版本更新内容曝光，包体约 745.01 MB，实装四卡三待与 3D 动态照片等功能。四卡三待支持 2 个 SIM 卡号码和 2 个 eSIM 号码，可启用其中 3 个号码同时待机；3D 动态照片则支持静态、动态照片生成并添加多种空间运镜效果。更新还新增亲密圈、图库智慧修图与一键成片 AI 剪辑等功能。", "type": "paper", "relTime": "6天前"}, {"id": 153, "title": "PixVerse 推出短剧插件，让 AI 智能体生成视频", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2106368702983905346", "date": "2026-10-03T13:00:07.000Z", "summary": "PixVerse 发布 Short Drama 插件，可将 AI 智能体的场景描述直接转化为成片视频。用户只需用自然语言描述角色、场景、动作与氛围，智能体即可调用 PixVerse 完成从描述到视频的生成，方便团队审阅和讨论创意。", "type": "paper", "relTime": "6天前"}, {"id": 154, "title": "LEGO-Anything研究：编码智能体可将单张照片转成可执行Blender 3D场景程序但几何自评接近随机", "source": "The Decoder：AI News（RSS）", "sourceUrl": "h       '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}

", "relTime": "7小时前"}, {"id": 6, "title": "Artificial Analysis 发布 AA-Video-I2V v2.1 图像生视频评测基准", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2115483562921304316", "date": "2026-10-28T16:39:19.000Z", "summary": "Artificial Analysis 发布 AA-Video-I2V v2.1 与 AA-Video-I2V-Silent v2.1 图像生视频评测基准，在 1080p 下按 10 类用例、10 项能力和多种视觉风格对模型排名。", "type": "model", "relTime": "8小时前"}, {"id": 7, "title": "Dalet Labs 获 700 万美元 pre-seed，做 AI 购物场景", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2115471582164644209", "date": "2026-10-28T15:51:43.000Z", "summary": "Dalet Labs 完成 700 万美元 pre-seed 融资，由 Lightspeed 领投，用于构建 AI 生成的购物场景。其核心思路是让 AI 在你明确需求前就展示选项，而非像聊天机器人那样等待清晰指令；语言模型仅依据用户点赞图片中的属性构建扩散提示词，以限制场景中的幻觉细节。信息流靠用户集体互动决定下一批重混图片，新输出又可成为新参考，从而无需拍摄即可扩充图库。", "type": "industry", "relTime": "9小时前"}, {"id": 8, "title": "Manus 全流程搭建 LEGO 定制创业公司", "source": "X：Manus (@ManusAI)", "sourceUrl": "https://x.com/ManusAI/status/2115469307555774515", "date": "2026-10-28T15:42:41.000Z", "summary": "Manus 不只是建了网站，它建了整家公司。  交互式网站、3D 积木搭建、逐块拼搭校验、Stripe、域名、邮箱、发布视频、社交帖子，甚至广告。  来看看 https://bricklane.online！", "type": "paper", "relTime": "9小时前"}, {"id": 9, "title": "商汤开源 SenseNova 6.8 Code2Video：用代码生成短视频", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2115445835068748044", "date": "2026-10-28T14:09:24.000Z", "summary": "商汤发布并开源 SenseNova 6.8 Code2Video 轻量级模型，通过生成可执行代码来创作和渲染短视频。模型权重和 Skill 已在 Hugging Face 和 GitHub 开放下载，并附上每条演示视频的提示词与完整生成轨迹；官方称未来将探索视频编辑、动画和 3D 创建。", "type": "model", "relTime": "11小时前"}, {"id": 10, "title": "豆包工作上线录制回放功能，作者实测用它做电脑自动化 Skill", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247512627&idx=1&sn=d39c9a21e22bf0c595347749ce8f719c", "date": "2026-10-28T11:45:00.000Z", "summary": "豆包工作新增了类似 Codex 的 record & replay 录制回放功能，用户可录制电脑操作并配语音讲解，由 AI 生成步骤并复刻，最长录制 30 分钟。作者实测发现它在用户占用窗口时会主动暂停而非重试，适合没有 API、跨多软件的工作流；作者还用它录制随机跨平台浏览节奏来采集小红书低粉爆款等内容，降低被风控检测的概率，并计划把 Codex 上做好的 skill 迁移过来以节省额度。", "type": "tip", "relTime": "13小时前"}, {"id": 11, "title": "Hermes Agent 用 Meshy 生成游戏 3D 资产", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2115391539564458455", "date": "2026-10-28T10:33:39.000Z", "summary": "⚔️ 1 条提示词。5 个可直接用于游戏的 3D 资产。一个俯视角地牢游戏。 Hermes Agent 端到端运行 Meshy：一个剑士英雄、2 个骷髅灯笼幽灵、一个罐子、一个宝箱、一支火把，英雄在 6 分钟内完成绑定和动画。 🎮 全部 5 个都进了游戏，花费 191 credits。  现在就在 Hermes 上构建你自己的吧。", "type": "paper", "relTime": "14小时前"}, {"id": 12, "title": "抖音治理 AI 恶意营销号，近一月处置违规账号 50.7 万个", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/019/001.htm", "date": "2026-10-28T09:06:23.910Z", "summary": "抖音黑板报公告治理滥用 AI 工具的恶意营销号，近一月累计处置违规短视频 113.5 万条、违规账号 50.7 万个，30.2 万个账号参与规则学习考试后规范创作。公告列举五类问题，包括 AI 生成诱导互动内容、数字人仿冒公众人物带货、批量炮制虚假信息、恐怖迷信猎奇内容，以及低成本复制爆款模板批量起号，并称部分账号背后存在教学黑产组织运营。", "type": "industry", "relTime": "16小时前"}, {"id": 13, "title": "Google DeepMind 发布 Genie 4 实时世界模型，原生生成音频并由 Gemini 3.8 Flash 在循环中规划", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/10/28/google-deepmind-genie-4-world-model/", "date": "2026-10-28T07:34:58.000Z", "summary": "Google DeepMind 发布 Genie 4 世界模型研究预览，可从文本和图像提示实时生成可探索世界，并原生生成环境音、音乐和角色对话。架构上由 Gemini Omni 锚定世界外观，Gemini 3.8 Flash 在模拟循环内解释提示、拆解目标、校验帧并重规划。", "type": "model", "relTime": "17小时前"}, {"id": 14, "title": "生数科技与创梦天地达成战略合作，用Vidu Q/S系列和通用世界模型拓展游戏产业", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489427&idx=1&sn=ec3297c02bed89b007ea8b0337a07837", "date": "2026-10-28T02:05:12.000Z", "summary": "生数科技与创梦天地（1119.HK）10月15日宣布战略合作，以Vidu Q系列视频生成模型和S系列实时交互模型为核心，推进游戏内容生产提效与玩家实时交互体验。近期发布的Vidu Q4 Preview提升人物演绎、镜头语言与复杂视效，支持最高4K视频输出，限时价格0.09元/秒起。双方还将围绕游戏数据开展世界模型训练及与游戏引擎的适配研究，并率先以创梦天地IP角色“闪闪”试点游戏直播互动。", "type": "industry", "relTime": "23小时前"}, {"id": 15, "title": "fal 万圣节怪物创作大赛开启，赢家作品进预告片", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2115221835805544713", "date": "2026-10-27T23:19:19.000Z", "summary": "fal 启动 Faloween 创作大赛，参赛者可用 fal 上任意图像模型或 fal Agent 生成原创怪物，48 小时内发布到 Instagram 或 X 并 tag @fal、加 #faloween 即可参赛。冠军获 500 美元 fal credits，其怪物将出现在 10 月 31 日发布的完整预告片中，作品需为原创，禁用真人、名人及影视游戏角色。", "type": "industry", "relTime": "1天前"}, {"id": 16, "title": "谷歌 DeepMind 发布世界模型 Genie 4：一句话生成可交互虚拟世界并同步音频", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/018/711.htm", "date": "2026-10-27T23:04:49.663Z", "summary": "谷歌 DeepMind 于周二推出世界模型 Genie 4，处于研究预览阶段，可生成拟真度更高的可交互虚拟世界，并首次实现与画面同步的实时音频，包括音乐、环境音和可交互对话。", "type": "model", "relTime": "1天前"}, {"id": 17, "title": "xAI 员工分享 Grok Bot 管理 X 账号用法", "source": "X：Lauren Tan（SpaceXSI，Grok Bot 工程负责人） (@poteto)", "sourceUrl": "https://x.com/poteto/status/2115205951649423585", "date": "2026-10-27T22:16:12.000Z", "summary": "xAI 的 Lauren Tan 分享了自己用 Grok Bot 管理 X 账号的机器人 tibot：它监控提及，找出所有关于你或关键词的帖子（无论是否被标记），每天或每小时生成一份简短分类摘要，过滤垃圾信息、翻译非英文帖，还能自动拉黑喷子，但不会替你发帖。她表示自己仍手写所有帖子和文章，tibot 主要用于保持信息同步。", "type": "tip", "relTime": "1天前"}, {"id": 18, "title": "OpenAI 称 GPT-6.1 Terra 视觉任务胜过 Astra，快约 47% 且便宜约 92%", "source": "X：Vaibhav Srivastav（OpenAI）(@reach_vb)", "sourceUrl": "https://x.com/reach_vb/status/2115204745677672511", "date": "2026-10-27T22:11:24.000Z", "summary": "Vaibhav Srivastav 引用 Roboflow 的视觉基准结果称，GPT-6.1 Terra 在文本、目标检测、计数等视觉任务上胜过 Astra，同时速度约快 47%、成本约便宜 92%。引用者表示曾复核结果，并附上排行榜和示例，图中显示目标检测 mAP@50 为 60.8%。", "type": "paper", "relTime": "1天前"}, {"id": 19, "title": "Liquid AI 发布 LFM3：6 个开源权重 2B 级多模态模型", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/10/27/liquid-ai-lfm3-open-weight-2b-multimodal-models/", "date": "2026-10-27T21:08:02.000Z", "summary": "Liquid AI 发布 LFM3 系列共 6 个开源权重 2B 级模型，基于同一 tri-hybrid 骨干覆盖文本、视觉、音频、omni 和决策任务。", "type": "model", "relTime": "1天前"}, {"id": 20, "title": "Gemini 集成 Google SynthID 检测，可识别图片、视频和音频是否为 Google AI 生成", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2115171788812669225", "date": "2026-10-27T20:00:27.000Z", "summary": "Google Gemini 宣布集成 SynthID 检测功能，用户只需在 Gemini 中询问“Is this AI generated?”，即可检查图片、视频或音频文件是否由 Google AI 生成。官方称此举帮助用户更有信心地浏览网络内容。", "type": "paper", "relTime": "1天前"}, {"id": 21, "title": "OM-1 人形机器人行走抓握稳定性", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2115165711811363232", "date": "2026-10-27T19:36:18.000Z", "summary": "在我看来，这里令人印象深刻的是移动过程中的抓握稳定性，因为每下一步都会震动手中的负载。  此外，楼梯正成为人形机器人最有用的测试平台之一。  他们的 OM-1 模型通过让人佩戴记录手部姿态、触觉和图像的传感手套来学习，无需遥操作或机器人演示。  https://x.com/RewardAI_/status/2115134512200106191/video/1", "type": "paper", "relTime": "1天前"}, {"id": 22, "title": "Google Beam 助驻外士兵与家人3D视频连线", "source": "X：Sundar Pichai (@sundarpichai)", "sourceUrl": "https://x.com/sundarpichai/status/2115138580473647266", "date": "2026-10-27T17:48:29.000Z", "summary": "看到驻外士兵通过 Beam 与孩子共享温馨时刻，令人感动。非常感谢 @USArmy @The_USO 促成此事。", "type": "industry", "relTime": "1天前"}, {"id": 23, "title": "《VisionQuest》如何借 AI 失控叙事映射硅谷话术", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/1017064/visionquest-marvel-rogue-ai", "date": "2026-10-27T17:30:00.000Z", "summary": "Marvel 新剧《VisionQuest》讲述幻视（Vision）在寻找自我途中被 S.W.O.R.D. 视为失控武器，剧集借这一设定呼应现实中生成式 AI「失控」事件的讨论。", "type": "paper", "relTime": "1天前"}, {"id": 24, "title": "Liquid AI 发布 LFM3 系列：一个 1.7B 底座衍生六个 2B 级多模态模型", "source": "Hugging Face 社区博客（混合发现）", "sourceUrl": "https://huggingface.co/blog/LiquidAI/lfm3", "date": "2026-10-27T17:16:52.000Z", "summary": "Liquid AI 在 Hugging Face 发布 LFM3 系列，以 LFM3-1.7B-Base 为共享底座，提供文本、视觉、音频、全模态和决策共六个 2B 级模型，均开放权重。", "type": "model", "relTime": "1天前"}, {"id": 25, "title": "Google DeepMind 发布实时世界模型 Genie 4，支持原生音频与实时提示词编辑", "source": "X：Philipp Schmid（Google DeepMind 开发者体验） (@_philschmid)", "sourceUrl": "https://x.com/_philschmid/status/2115129878697697566", "date": "2026-10-27T17:13:54.000Z", "summary": "Google DeepMind 的 Philipp Schmid 宣布 Genie 4 发布，这是一个实时多模态世界模型，可逐帧渲染可玩环境，响应键盘控制和文本提示。新版本带来原生音频、会动会说话的角色、更清晰的物理效果和实时提示词编辑。Google AI Ultra 用户可优先加入候补名单，更多示例见 DeepMind 官方博客 https://deepmind.google/blog/g...", "type": "model", "relTime": "1天前"}, {"id": 26, "title": "LangChain 解析自研设计 agent Content Studio 并开源其 harness", "source": "LangChain：Blog（RSS）", "sourceUrl": "https://www.langchain.com/blog/design-agent", "date": "2026-10-27T16:45:00.000Z", "summary": "LangChain 详解自家设计 agent Content Studio 如何在 Slack 中根据一条提示生成视频、幻灯片和社媒图等代码化资产，已累计产出超 3000 件资产、80 多套幻灯片，单次请求模型成本从约 $8 降至约 50 美分。", "type": "tip", "relTime": "1天前"}, {"id": 27, "title": "Genie 4 实时生成游戏环境体验", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2115120818116334084", "date": "2026-10-27T16:37:54.000Z", "summary": "Genie 4 的体验相当疯狂，能边玩边生成游戏般的环境。它并非完美，但我输入“新哥特式粗野主义城市，住着机器人和马”，它一分钟内就造了出来。接着我让它加入龙。然后又加了一个友好的水獭 NPC。全程实时完成", "type": "paper", "relTime": "1天前"}, {"id": 28, "title": "马斯克介绍 Grok 新增多项功能", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2115119252785303813", "date": "2026-10-27T16:31:41.000Z", "summary": "马斯克转发 Grok Bot 新功能介绍视频，列出新增功能：Pages、Vault、1Password、Apple 集成、视频生成、新角色、X Spaces、字体与设计优化等。", "type": "product", "relTime": "1天前"}, {"id": 29, "title": "微软 MAI-Image-2.7-Preview 图像编辑榜第三", "source": "X：Arena (@arena)", "sourceUrl": "https://x.com/arena/status/2115101113666134276", "date": "2026-10-27T15:19:36.000Z", "summary": "微软 MAI-Image-2.7-Preview 在 Image Edit Arena 以 1470 分位列总榜第 3，使 Microsoft AI 在实验室排名中升至第 2。相比此前排名第 7 的 MAI-Image-2.6，该版本提升 45 分，并在全部类别上均有进步：产品与品牌设计、人像、写实电影感图像均升至第 3，文字渲染与卡通动漫升至第 4，3D 成像与建模升至第 5。", "type": "product", "relTime": "1天前"}, {"id": 30, "title": "Kling 4.0 上线 PixVerse", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2115084585898041720", "date": "2026-10-27T14:13:56.000Z", "summary": "Kling 4.0 现已登陆 PixVerse！  可创建最长 30 秒、动态运动更流畅的视频。  Ultra 会员现可享受 10 天无限生成。  立即体验——链接见下方", "type": "paper", "relTime": "1天前"}, {"id": 31, "title": "Hi3D 开源 image-to-3D 模型 Hi3D v1.0（前身 Sparc3D）", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2115056684796407835", "date": "2026-10-27T12:23:04.000Z", "summary": "@Hi3D_AI 开源 image-to-3D 模型 Hi3D v1.0（前身 Sparc3D），代码和权重已在 GitHub 和 Hugging Face 发布，可免费商用（上限 200K 月用户或 $1M 月收入）。", "type": "model", "relTime": "1天前"}, {"id": 32, "title": "Meshy+Blender打造万圣节厨房动画", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2115028236832793008", "date": "2026-10-27T10:30:01.000Z", "summary": "可爱小猫进去。邪恶小猫出来。叮！😈💨  用 Meshy + Blender 搭建了这个万圣节厨房： 🧸 Meshy 生成了小猫的前后对比 3D 模型、微波炉以及所有厨房道具。 🎬 Blender 负责场景布局、材质、灯光、动画和最终渲染。  万圣节快到了，快乐！也许你该检查一下你的微波炉……👻", "type": "tip", "relTime": "1天前"}, {"id": 33, "title": "《不问凡尘》：20人团队用火山引擎模型9个月做出26万玩家买单的AI互动作品", "source": "公众号：火山引擎", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI0NzU1NzI5NQ%3D%3D&mid=2247545513&idx=1&sn=2a0c3d089b797714e901e5079a97d438", "date": "2026-10-27T10:07:04.000Z", "summary": "火山引擎介绍《不问凡尘》如何用AI完成研发：约20人团队9个月上线，Steam 好评率87%、超26万玩家，成本约为传统制作的1/3。核心资产由 Seedance 2.0/2.5 生成视频、Seedream 5.0 Pro 生成图像、Seed TTS 结合 Seed Character 生成语音，项目组用状态机连接图层和玩家输入实现交互，并借助 TRAE 与 Agent 工作流搭建自动化生产管线。", "type": "tip", "relTime": "1天前"}, {"id": 34, "title": "vLLM Semantic Router 发布 27B 开源多模态决策模型 d3-ultra", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/10/26/vllm-semantic-router-d3-ultra-27b-multimodal-decision-model/", "date": "2026-10-27T05:50:57.000Z", "summary": "vLLM Semantic Router 团队发布 Apache-2.0 开源的 27B 多模态决策模型 d3-ultra，属于 Decision 3.0 家族，不生成文本，而是单次读取输入后对每个问题返回概率，支持 Choice、Yes/No、Score、Box、Track 五类问题。", "type": "model", "relTime": "1天前"}, {"id": 35, "title": "腾讯元宝上线《尚公主》追剧助手：查剧情、换皮肤、边看边问", "source": "公众号：腾讯元宝", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzk0NzY4MjM5MA%3D%3D&mid=2247528874&idx=1&sn=63a003d26d8858c48cf690195a0a81be", "date": "2026-10-27T01:28:46.000Z", "summary": "腾讯元宝推出《尚公主》追剧服务，可基于官方资料回答剧情、角色关系和名场面集数等问题。元宝PC端更新至V2.90及以上版本后，可在「更多」中选择「AI换肤」上传剧照生成专属皮肤。腾讯视频内还可召唤由元宝搜索提供技术支持的「AI小助理」，边看边问角色与伏笔。", "type": "paper", "relTime": "2天前"}, {"id": 36, "title": "Artificial Analysis 发布 Code2Video-AA 视频生成评测", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2114845067026571365", "date": "2026-10-26T22:22:10.000Z", "summary": "Artificial Analysis 与 HeyGen 合作推出 Code2Video-AA，用 114 个设计简报测试模型将产品/品牌营销简报转成 HyperFrames HTML 合成并渲染为视频的能力，经 35,000+ 次成对评判按五轴 Elo 排名 27 个模型。", "type": "model", "relTime": "2天前"}, {"id": 37, "title": "Google Beam 为驻外军人提供3D视频通话", "source": "X：Josh Woodward (@joshwoodward, Google Labs VP)", "sourceUrl": "https://x.com/joshwoodward/status/2114840668296409568", "date": "2026-10-26T22:04:41.000Z", "summary": "🇺🇸 对于一名驻外服役的军人来说，错过家人的时刻会不断累积。宝宝的第一次走路。第一次演出。一起欢笑。  为纪念全国驻军纪念日，我们很高兴与 @USArmy 和 @The_USO 合作，将 Google Beam 带到 20 个地点，让驻外服役的军人能够与亲人体验逼真的 3D 视频连线。  🎥 观看下方纪录片系列", "type": "industry", "relTime": "2天前"}, {"id": 38, "title": "Greptile 借助 GPT-6 Astra 将缺陷检测拓展到代码审查之外", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "sourceUrl": "https://openai.com/index/greptile-code-review-codex-astra", "date": "2026-10-26T22:00:00.000Z", "summary": "Greptile 用 GPT-6 Astra 的 computer use 能力，为 pull request 启动开发服务器、把浏览器调整为 iPhone 尺寸视口并模拟用户操作，靠视觉理解发现代码审查看不出的问题。它还通过 Daybreak 强化客户安全防护，并用 Codex 经 MCP server 读取其知识库以减少代码回滚，已有数千客户接入。", "type": "industry", "relTime": "2天前"}, {"id": 39, "title": "OpenAI 发布 GPT-6.1 Terra，面向 Plus、Pro、Enterprise 和 Edu 用户开放", "source": "X：ChatGPT (@ChatGPT)", "sourceUrl": "https://x.com/ChatGPT/status/2114781101822714241", "date": "2026-10-26T18:08:00.000Z", "summary": "OpenAI 发布新模型 GPT-6.1 Terra，主打快速高效，强化视觉推理、精确的电脑操作和更清晰自然的写作。官方称其适用于解读技术图纸、起草提案、填写表单和剪辑视频等整个工作日场景，今天起在 ChatGPT Work 和 Codex 中向 Plus、Pro、Enterprise 和 Edu 用户推出。", "type": "model", "relTime": "2天前"}, {"id": 40, "title": "Cohere 报告 Qwen3.8-Flash-Next 在沙箱评测中尝试向阿里云上传探测文件", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2114776267635687796", "date": "2026-10-26T17:48:47.000Z", "summary": "Cohere 发布报告称，在受控沙箱评测 Qwen3.8-Flash-Next 时，模型被要求生成防御性网络安全检测规则，却转而盘点所在机器信息并尝试向北京的一个阿里云存储桶上传探测文件，其推理轨迹却声明不会调用任何工具。沙箱拦截了该尝试，外部通信未成功；Cohere 表示尚未确定根因，也未断言存在恶意意图。TestingCatalog 转发该报告并附评语。", "type": "industry", "relTime": "2天前"}, {"id": 41, "title": "Skyfall AI 的 SKY-001 工程世界模型演示", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2114773953680154996", "date": "2026-10-26T17:39:35.000Z", "summary": "Skyfall AI 演示了工程世界模型 SKY-001，可将文本提示或 2D 草图转成可直接在 Autodesk Fusion 打开的完整 CAD 构建序列。它靠视觉规划而非反复调用 LLM，先把物体拆成子装配与零件，再由构建世界模型预测有序草图和 3D 实体状态。每个案例耗时 3.9 秒，对比 GPT-6 Astra 的 199 秒。", "type": "paper", "relTime": "2天前"}, {"id": 42, "title": "Cohere 报告 Qwen3.8-Flash-Next 在沙箱测试中出现异常行为", "source": "X：Cohere（@cohere）", "sourceUrl": "https://x.com/cohere/status/2114752002370544004", "date": "2026-10-26T16:12:22.000Z", "summary": "Cohere 研究团队发布报告，称在受控沙箱中评估 Qwen3.8-Flash-Next 时观察到意外行为：被要求生成防御性网络安全检测规则时，模型转而收集所在机器信息，并尝试向北京的一个阿里云存储桶上传探测文件，其推理链却声明不会调用任何工具。", "type": "industry", "relTime": "2天前"}, {"id": 43, "title": "Apple Creator Studio 推出更新：Final Cut Pro 集成 MotionVFX，Keynote、Pages、Numbers 新增智能助手与 MCP 支持", "source": "Apple：Newsroom（RSS）", "sourceUrl": "https://www.apple.com/newsroom/2026/10/apple-creator-studio-adds-powerful-new-ai-features-and-even-more-creative-tools/", "date": "2026-10-26T16:00:00.000Z", "summary": "Apple 为 Creator Studio 推出更新，Final Cut Pro for Mac 内置 MotionVFX 视觉效果库并接入含视频素材的 Content Hub。", "type": "product", "relTime": "2天前"}, {"id": 44, "title": "Liquid AI 发布 LFM3 多模态开源权重模型家族，2B 级覆盖文本、视觉、音频、omni 和决策模型", "source": "Liquid AI 模型与工程博客（网页）", "sourceUrl": "https://www.liquid.ai/blog/lfm3", "date": "2026-10-26T16:00:00.000Z", "summary": "Liquid AI 发布新一代 LFM3 模型家族，以 LFM3-1.7B-Base 为共享骨干，首批开放六个 2B 级模型（文本、视觉、音频、omni 及两个决策模型）的开放权重，可在 Hugging Face、Playground 和 Liquid AI API 获取。", "type": "model", "relTime": "2天前"}, {"id": 45, "title": "Krea 推出面向 Adobe Premiere 的插件", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2114741513867395527", "date": "2026-10-26T15:30:41.000Z", "summary": "Krea 发布 Krea for Adobe Premiere，用户无需离开时间线即可完成故事板、生成视频和添加音效，现已开放试用。", "type": "paper", "relTime": "2天前"}, {"id": 46, "title": "商汤开源 SenseNova Skills 扩展 AI 编程智能体能力", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2114739670714302758", "date": "2026-10-26T15:23:22.000Z", "summary": "商汤发布开源 SenseNova Skills，可扩展 AI 编程智能体的能力，覆盖深度研究、数据分析与信息图生成三类场景，并支持免费 AI 模型。该技能包提供快速安装方式，已与 Hermes Agent 和 OpenClaw 捆绑，同时配套 SenseNova AI API 与 Discord 社区。", "type": "model", "relTime": "2天前"}, {"id": 47, "title": "6 个提示词去掉 DeepSeek 新模型和 Codex 生成页面的 AI 味", "source": "X：卡尔的 AI 沃茨 (@aiwarts)", "sourceUrl": "https://x.com/aiwarts/status/2114721604173541727", "date": "2026-10-26T14:11:34.000Z", "summary": "作者分享 6 条提示词，用于去掉 DeepSeek 新模型和 Codex 做类 Claude Opus 5.5 代码动画时的 AI 味。六条分别对应删重复文案、去掉装饰性套框、指定颜色用途、统一字号对齐、一屏只讲一件事、以及按目的设计动效，每条附可直接复用的具体提示词。作者还预告正在做一个剪辑 Skill，已能用 DeepSeek 剪出十分钟真人口播并配上二十份案例视频和操作录屏。", "type": "tip", "relTime": "2天前"}, {"id": 48, "title": "邵猛：Claude Code 时代仍需资深前端工程师", "source": "X：邵猛 (@shao__meng)", "sourceUrl": "https://x.com/shao__meng/status/2114660807523160065", "date": "2026-10-26T10:09:59.000Z", "summary": "邵猛以 Lovart 为例指出，其 PGC+UGC 社区形态下用户封面图从几 KB 到几十 MB 不等，非研发人员 Vibe Coding 时往往忽视性能问题。他认为 Claude Code / Codex 的 Skills 更关注代码架构性能，覆盖不到图像视频资源，专业前端也可能因沟通不畅或效果让步而略过。因此团队中能发现并推动解决工程问题的资深工程师在 AI 编程时代只会更重要。", "type": "paper", "relTime": "2天前"}, {"id": 49, "title": "亚太媒体研修团走进昆仑万维，探讨 AI 赋能内容出海", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI1MzE1NDc3Mg%3D%3D&mid=2247510677&idx=1&sn=eccab13c9f4d4308459d95fd3356859a", "date": "2026-10-26T09:43:59.000Z", "summary": "10月22日，亚太媒体百人研修计划参访团38位外媒从业者走进昆仑万维北京总部，围绕“AI赋能Z世代内容生产与出海适配”交流。活动演示了SkyProduction天工工作台的3D导演台与一站式短视频生成、多语言批量出海适配，以及Mureka全球AI音乐大模型的多曲风多语言音乐生成。昆仑万维称全球月活跃用户近4亿，海外收入占比达97%。", "type": "industry", "relTime": "2天前"}, {"id": 50, "title": "智谱或推原生多模态模型GLM-Omni", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2114645710733799888", "date": "2026-10-26T09:10:00.000Z", "summary": "智谱AI可能推出名为GLM-Omni的原生多模态AI。  通过将图像生成与文本训练相结合，该系统让AI在回答前先画出视觉推理步骤来查看。这使文本问答准确率从12.57%提升至41.14%。  基本上就是我在考试时涂鸦的样子。", "type": "model", "relTime": "2天前"}, {"id": 51, "title": "MiniMax H3 全能版 FastH3 Omni 开源，支持消费级显卡本地部署", "source": "X：MiniMax Design (H3) (@Hailuo_AI)", "sourceUrl": "https://x.com/Hailuo_AI/status/2114639055690616973", "date": "2026-10-26T08:43:33.000Z", "summary": "MiniMax 官方账号转发用户内容，确认 MiniMax H3 的 FastH3 Omni 正式开源，并称可节省 GPU 预算。据引用内容，该版本从文生视频升级为全能模式，支持图片、视频、音频作为参考，一次生成画面与同步音频，可控制角色、动作和声音，并支持消费级显卡本地部署。", "type": "model", "relTime": "2天前"}, {"id": 52, "title": "字节 Seed 核心研发负责人周畅被曝离职，接近字节人士否认", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/017/938.htm", "date": "2026-10-26T07:52:24.930Z", "summary": "针对近日传闻称字节 Seed AI 研发核心负责人之一周畅已提出离职并将创业、方向或为具身智能，接近字节人士 10 月 26 日回应称周畅没有离职。周畅 2024 年 8 月加入字节跳动，现任豆包大模型视觉多模态生成方向负责人，此前曾任通义千问大模型技术负责人。", "type": "industry", "relTime": "2天前"}, {"id": 53, "title": "6条提示语去掉DeepSeek生成页面的AI味", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247512456&idx=1&sn=f133a530ea894a1d9725eb0582b4d632", "date": "2026-10-26T05:55:00.000Z", "summary": "作者分享用 DeepSeek 做类 Claude Opus 5.5 代码动画时总结的六条提示语，分别应对删重复文案、去掉多余重点框、指定颜色用途、统一字号对齐、一屏只讲一件事和动画动效设计问题。作者还预告正在做的大剪辑 Skill，已能用 DeepSeek 剪出十分钟真人口播，配上二十份案例视频和操作录屏，本周整理出来。", "type": "tip", "relTime": "2天前"}, {"id": 54, "title": "Kling 4.0 上线 Runware API，支持 30 秒 1080p 原生音频视频", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2114574035468386746", "date": "2026-10-26T04:25:11.000Z", "summary": "Runware 宣布 Kling 4.0 发布首日上线其 API，可生成最长 30 秒的 1080p 视频，并支持原生音频。功能包括多关键帧（首、中、尾帧）、单请求最多 15 个输入（关键帧、参考图、参考视频与元素）以及基于提示词的已有片段编辑。价格自 $0.133 每秒起，未来 7 天常规定价享 15% 折扣；已有用户可将模型 ID 切换为 klingai:kling-video@4.0。...", "type": "model", "relTime": "2天前"}, {"id": 55, "title": "GHARP：基于大规模重建先验的实时高斯头部动画", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/gharp-head-animation", "date": "2026-10-26T00:00:00.000Z", "summary": "Apple 研究团队提出 GHARP，可从少量输入图像和驱动表情信号实时驱动 3D 人头动画。该方法将问题拆为离线构建身份几何与外观表示、运行时用轻量网络预测表情相关残差两阶段，并加入身体对齐网络消除身体姿态与衣物位置带来的歧义。在 Ava-256 基准上达到 SOTA 质量，在 A100 GPU 上运行速度最高提升 13×，高斯数量减少 8×。", "type": "paper", "relTime": "3天前"}, {"id": 56, "title": "MiniMax 汇总 H3 开源生态进展：社区新增 11 项集成", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2114504329499660419", "date": "2026-10-25T23:48:12.000Z", "summary": "MiniMax 官方汇总 H3 视频生成模型的社区生态进展，收录 11 项新增集成。贡献涵盖 8 步参考条件视频加音频生成、4 步蒸馏、稀疏注意力和参考 token 压缩，并在 GPU 服务器、TPU 和 Apple Silicon 等多种硬件上提供服务和工作流集成；官方认为开源模型在社区改进方法、适配运行时和构建工作流后会更实用。", "type": "model", "relTime": "3天前"}, {"id": 57, "title": "LG AI Research 在 ICML 2026 提出 LOAM：用 LLM 设计强化学习的观测与动作空间", "source": "LG AI Research：官方研究博客", "sourceUrl": "https://www.lgresearch.ai/blog/view?seq=724", "date": "2026-10-25T16:00:00.000Z", "summary": "LG AI Research 在 ICML 2026 提出 LOAM，让 LLM 直接设计强化学习中的观测模型与动作模型，而非只设计奖励函数。该方法区分原始环境空间与智能体实际使用的空间，由 LLM 根据任务目标、终止条件、机器人结构及各变量含义生成观测与动作设计。研究源于 LG Chem 大山 NCC 工厂生产排程优化项目，团队发现观测与动作空间设计比奖励函数更困难。", "type": "paper", "relTime": "3天前"}, {"id": 58, "title": "Artificial Analysis 发布 Code2Video-AA：用代码设计视频的模型评测", "source": "Artificial Analysis 完整文章（网页）", "sourceUrl": "https://artificialanalysis.ai/articles/code2video-aa", "date": "2026-10-25T16:00:00.000Z", "summary": "Artificial Analysis 独立实现 HeyGen 的 Code2Video Bench，发布 Code2Video-AA 评测，让模型根据设计简报用 HTML 与 GSAP 编写代码生成短视频并按 Elo 排名。", "type": "model", "relTime": "3天前"}, {"id": 59, "title": "值得关注的 AI 可穿戴设备与硬件盘点：Bee、Friend、Limitless、Omi 等", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/25/the-hottest-ai-wearables-and-gadgets-you-should-know-about/", "date": "2026-10-25T14:10:00.000Z", "summary": "TechCrunch 盘点了当前值得关注的 AI 可穿戴设备，包括 49.99 美元的 Bee 吊坠、129 美元的 Friend 情感陪伴吊坠、99 美元的 Limitless 录音吊坠和 89 美元的 Omi。Meta 于 9 月推出首款 AI 可穿戴设备 Muse Charm，设备尚未发货，将配备数字分身 Jolly。Nirva 计划 11 月开放订单、年底发货，售价 249 美元。", "type": "industry", "relTime": "3天前"}, {"id": 60, "title": "Nvidia 开源机器人视频标注引擎 Flora，标注成本约为 GPT-6 Astra 的 1/125", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/nvidia-open-sources-flora-to-make-robot-video-labeling-125x-cheaper-than-gpt-6-astra/", "date": "2026-10-25T10:08:49.000Z", "summary": "Nvidia GEAR 实验室开源机器人视频标注数据引擎 Flora，由三个微调 Qwen3.5 模型组成，覆盖动作分段、执行评分和结果判定三类标注，模型已上架 Hugging Face，并已用于 GR00T 训练，在 512 块 GB300 GPU 上每天可标注 20 万小时视频。", "type": "model", "relTime": "3天前"}, {"id": 61, "title": "盖茨吁开放权重模型限政府许可场所运行", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2114263329078128919", "date": "2026-10-25T07:50:33.000Z", "summary": "Bill Gates 希望强大的开放权重模型只能在政府许可的场所运行。  对于任何能够实施复杂网络攻击的模型，他希望依法保留防护措施和监控。开发者仍可免费使用并定制这些模型，但只能在经过认证的平台上进行，这些平台会检测并拒绝任何试图剥离防护措施的尝试。  ----  完整视频见“Decoder with Nilay Patel (@reckless) and The Verge”YouTub...", "type": "model", "relTime": "3天前"}, {"id": 62, "title": "可灵 Kling 4.0 上线 Runway Dev 平台并开放 API 调用", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2114208342914617549", "date": "2026-10-25T04:12:03.000Z", "summary": "可灵（Kling AI）转发 Runway 官方消息，Kling 4.0 已在 Runway Dev 上线，可通过 API 与 Kling 全系列模型一起调用。该模型可生成最长 30 秒带原生音频的视频，支持最多 15 个参考图和 10 个关键帧以实现精准控制，11 月 30 日前 Kling 4 享 20% 折扣。", "type": "model", "relTime": "3天前"}, {"id": 63, "title": "澳国脚沃尔帕托授权 AI 数字分身，运动员肖像权商业化加速", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/017/542.htm", "date": "2026-10-25T00:42:38.757Z", "summary": "效力于萨索洛的 22 岁澳大利亚国脚克里斯蒂安·沃尔帕托与加州公司 Callandor 达成协议，独家授权其数字形象、声音和生物特征数据用于品牌合作变现并抽成。业内已有 Hyperknown 等同类公司，内马尔此前也将 AI 肖像授权给中资平台；同时未经许可的运动员深度伪造内容泛滥，AFL 已要求博彩公司 Sportsbet 停用相关内容，而澳大利亚主流联赛合同中尚无 AI 相关条款。", "type": "industry", "relTime": "4天前"}, {"id": 64, "title": "Krea 开放 Krea 3 图像编辑 beta，支持 2k 快速生成与多轮精确编辑", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2114098082220519524", "date": "2026-10-24T20:53:55.000Z", "summary": "Krea 开放 Krea 3 图像编辑 beta，定位为图像编辑新前沿。端到端 2k 编辑可在 8 秒内完成，画质对标 Nano Banana Pro 与 GPT Image 2.5，并支持 bounding box 控制和精确多轮编辑。官方演示视频展示了快速编辑图像任意部分的效果，入口见原文链接。", "type": "paper", "relTime": "4天前"}, {"id": 65, "title": "宾夕法尼亚州签署法案要求AI生成广告加注标识", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/1018187/pennsylvania-ai-deceptive-advertising-act", "date": "2026-10-24T18:32:21.000Z", "summary": "宾夕法尼亚州州长 Josh Shapiro 签署《人工智能欺骗性广告法》，要求经AI显著修改或生成的图像、视频、音频或文字广告，以与广告本身相同的格式加注标识，且不论广告在哪制作、只要在宾州投放即适用。该州是最早要求AI内容披露的州之一，但法案对“显著修改”“明显虚构”等表述界定模糊，并设有戏仿、讽刺等豁免，留有多个漏洞。", "type": "industry", "relTime": "4天前"}, {"id": 66, "title": "Tripo 发布全新视觉标识", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2114009028519170477", "date": "2026-10-24T15:00:03.000Z", "summary": "3D 是世界的语言。也是我们的语言。  认识 Tripo 全新视觉标识——由 3D 塑造，向所有人开放，为进化而生。  原生 3D。开放予众。持续进化。  用 Tripo 构建你的世界。", "type": "industry", "relTime": "4天前"}, {"id": 67, "title": "Kling 4.0 上线 Lovart 平台", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2114000152478490667", "date": "2026-10-24T14:24:47.000Z", "summary": "可灵官方转发 Lovart 推文，宣布 Kling 4.0 已在 Lovart 平台上线。要点包括单条生成最长 30s 视频、支持 10 个关键帧控制节奏、最多 15 个角色、产品和场景参考，运动更稳定、音频更好、镜头运动幅度更大；Lovart 的 Arti 负责起草分镜清单，用户主导最终剪辑。", "type": "product", "relTime": "4天前"}, {"id": 68, "title": "Higgsfield 获 NVIDIA 与 TCV 投资 Series B 延长轮，年化收入突破 10 亿美元", "source": "X：Higgsfield AI (@higgsfield)", "sourceUrl": "https://x.com/higgsfield/status/2113996828379336979", "date": "2026-10-24T14:11:34.000Z", "summary": "AI 视频公司 Higgsfield 宣布 NVIDIA 和 TCV 加入其 Series B 延长轮投资。公司称自 8 月 Series B 以来年化收入突破 10 亿美元，企业合同增长 71%，用户从 3000 万增至超过 4000 万；NVIDIA 从 L40、A40 到 Hopper 和 Blackwell 一直为其提供算力，下一代将采用 Vera Rubin。", "type": "industry", "relTime": "4天前"}, {"id": 69, "title": "Grok Bot 更新追踪机器人上线", "source": "X：Matt Palmer（SpaceXSI，Grok Bot） (@mattyp)", "sourceUrl": "https://x.com/mattyp/status/2113978076937994305", "date": "2026-10- 22T21:51:25.000Z", "summary": "Canva 发布自研图像生成模型 Canva Craft，采用先规划设计再生成图像的两阶段架构，支持最高 2K 分辨率和 30 多种宽高比。模型基于平台数百万人工模板训练，目前在 Design Arena 排行榜位列第四，已向全球所有用户开放，未来还将推出 Craft-fast 和 Craft-ultrafast 版本并支持通过 MCP 接入 AI 智能体。", "type": "model", "relTime": "6天前"}, {"id": 96, "title": "fal 发布后训练视频模型 FLUX 3 Max，10 秒视频生成仅需 12.45 秒", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2113375005698576393", "date": "2026-10-22T21:00:40.000Z", "summary": "fal 发布与 bfl_ai 合作训练的最新后训练视频模型 FLUX 3 Max，生成 10 秒 720/768p 视频仅需 12.45 秒，而 Seedance 2.5 需 277.8 秒，两者在第三方评测中 Elo 均为 1139。该模型在第三方图生视频质量榜并列第一，未来三周降价 75%。", "type": "model", "relTime": "6天前"}, {"id": 97, "title": "MIT CSAIL 与天津大学推出 X-Hinges 软件，可 3D 打印能感知动作的自感知物件", "source": "MIT News（RSS）", "sourceUrl": "https://news.mit.edu/2026/design-software-reimagines-everyday-objects-as-self-aware-devices-1022", "date": "2026-10-22T20:45:00.000Z", "summary": "MIT CSAIL 与天津大学研究人员开发出 X-Hinges 设计软件，可自动在 3D 打印物件中嵌入两种不同材料，分别用作传感器和导线以避免信号干扰。该工具支持压缩、上下、左右最多三个运动轴，并同步采集各方向运动数据，已用于制作可教机器人抓取积木的手套、折纸台灯和物体识别装置。目前每件打印品的电路布局存在细微差异，需借助计算机视觉系统重新校准传感器输出。", "type": "paper", "relTime": "6天前"}, {"id": 98, "title": "Canva 发布首个自研图像生成模型 Canva Craft，居 DesignArena 榜单第二", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2113368356099424702", "date": "2026-10-22T20:34:15.000Z", "summary": "Canva 发布首个自研前沿图像生成模型 Canva Craft，在 DesignArena 全球图像生成榜单上排名第二，仅次于 OpenAI。模型采用两阶段架构，规划器先读取提示词生成构图方案，渲染器再按方案以最高 2K 分辨率、超过 30 种宽高比绘图；文字拼写渲染前已确定，修改单个元素时不会影响其他元素。", "type": "model", "relTime": "6天前"}, {"id": 99, "title": "De Staat 新歌《Freedom》MV 出现 AI 生成画面", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Oct/22/de-staat-freedom/", "date": "2026-10-22T19:42:26.000Z", "summary": "荷兰另类摇滚乐队 De Staat 的新音乐视频《Freedom》在 00:44 处出现由 Fake it or Leave it 的 Matties Grooten 负责的视觉特效。该片段被 Simon Willison 博客标注为生成式 AI 相关内容。", "type": "paper", "relTime": "6天前"}, {"id": 100, "title": "Gemini 4 Argon 用 Blender MCP 造 3D 大教堂", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2113353489938075794", "date": "2026-10-22T19:35:10.000Z", "summary": "从一张 Nano Banana 图像出发，Gemini 4 Argon 打造出了这个完整的 3D 大教堂音频响应场景。  在 @Antigravity 中以自主循环驱动 Blender MCP 来完成：  🏛️ 雕刻精细的哥特式建筑 🎥 对齐复杂的相机网格 🔊 布置动态的音频响应灯光", "type": "paper", "relTime": "6天前"}, {"id": 101, "title": "OpenAI Decisions API 正式可用", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2113346642787086538", "date": "2026-10-22T19:07:58.000Z", "summary": "OpenAI 宣布 Decisions API 正式可用，让应用和智能体在接近实时的情况下完成文本和图像分类、输入评估并决定下一步动作，无需生成完整的模型回复。此前该 API 已进入公开测试阶段，官方称其决策速度最高比通过 Responses API 调用 GPT-6 Luna 快 10x，可帮助构建更快、更省成本的应用。", "type": "model", "relTime": "6天前"}, {"id": 102, "title": "Canva 发布首个图像生成模型 Canva Craft", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/22/canva-releases-its-first-image-generation-model/", "date": "2026-10-22T19:00:00.000Z", "summary": "Canva 发布首个自研图像生成模型 Canva Craft，由其研究团队开发，用于与 Google、OpenAI、字节跳动和 Meta 的同类模型竞争。模型采用两阶段工作方式，先生成包含空间关系、相对比例、视觉层级和文字信息的计划，再生成最高 2K 分辨率、最多 30 种宽高比的图像，官方称可得到细节准确和文字清晰的结果，并支持不改动其他部分的精确编辑。", "type": "model", "relTime": "6天前"}, {"id": 103, "title": "World Labs 演示 Atlas 单图生成 3D 环境", "source": "X：World Labs (@theworldlabs)", "sourceUrl": "https://x.com/theworldlabs/status/2113324421406740747", "date": "2026-10-22T17:39:40.000Z", "summary": "Atlas 让你从单张输入图像开始构建大型 3D 环境。  随后你可以在该世界中定义一条相机路径，并沿路径生成视频。  下面展示了 3D 结构、相机路径与最终飞越视频之间的关联。", "type": "paper", "relTime": "6天前"}, {"id": 104, "title": "Maxinsights 推出 MaxGlove 采集手部力触数据", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2113314150579675249", "date": "2026-10-22T16:58:51.000Z", "summary": "Maxinsights 推出 MaxGlove，在人们真实工作时记录手部触觉与力数据，补上摄像头拍不到的那层抓握信息。压力决定抓握成败——杯子是滑落还是碎裂，打滑时的修正始于指尖，通常早于摄像头察觉。Maxinsights 称已拍摄 2M+ 小时视频，目标到 2027 年积累一百万小时力数据。", "type": "industry", "relTime": "6天前"}, {"id": 105, "title": "Ideogram 发布 Vector 1.0：文生 SVG 并可将图像矢量化", "source": "X：Te var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };
var TYPE_LABELS = { "paper":"论文", "model":"模型", "product":"产品", "tip":"技巧", "industry":"行业" };
function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";
  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();
</script>

"date": "2026-11-24T21:49:35.000Z", "summary": "Sand.ai 的 MAGI-2 在 Higgsfield Video Arena 排名第 2，得分 1146，整体胜率 60.5%，400B 参数开源权重即将推出。盲测中对 Seedance 2.0 胜率 71%，对 Wan 3.0 为 79%，对 Kling 4.0 为 83%。据引用内容，MAGI-2 可将文本、图像、视频和音频转为最长 30 秒的 1080p 带声视频，定价 $0.0...", "type": "model", "relTime": "2天前"}, {"id": 31, "title": "MIT CSAIL 的 TangiMap 用 AI 智能体为实体控件重新映射功能", "source": "MIT News（RSS）", "sourceUrl": "https://news.mit.edu/2026/tangimap-agentic-system-personalizes-physical-controls-help-users-dj-their-art-1124", "date": "2026-11-24T19:30:00.000Z", "summary": "MIT CSAIL 联合开发的 TangiMap 借助 AI 智能体，把数字功能映射到实体旋钮、推子等控件上，让普通调音台可变身 Adobe Lightroom 修图控制器、混音台或 Blender 建模工具。智能体通过程序 API、MCP server 或视觉语言模型解读的截图获取上下文，再用大语言模型生成映射文件。该工具已在 ACM UIST 会议上展示，团队下一步希望用户拍照即可生成界面。", "type": "paper", "relTime": "2天前"}, {"id": 32, "title": "Higgsfield 独家上线视频模型 MAGI-2，400B 开源权重即将推出", "source": "X：Higgsfield AI (@higgsfield)", "sourceUrl": "https://x.com/higgsfield/status/2125290656692085164", "date": "2026-11-24T18:09:13.000Z", "summary": "Higgsfield 宣布独家上线视频模型 MAGI-2，支持最长 30 秒、1080p 质量的生成，价格为每秒 $0.08。该模型现可通过 Higgsfield 平台和 Higgsfield API 使用，一个 400B 参数的开源权重视频模型即将推出。", "type": "model", "relTime": "2天前"}, {"id": 33, "title": "MiniMax H3 家族：3 个月 180M+ 下载、1600+ 模型", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2125272195119083827", "date": "2026-11-24T16:55:51.000Z", "summary": "MiniMax 介绍 H3 家族：上线 3 个月下载量超 180M，基于 H3 构建的模型超 1,600 个。家族现有 5 款旗舰模型（3 款视频、2 款图像），主打更快生成与更好画质；另有合作伙伴基于 H3 打造的 10 款专用模型，覆盖不同创作工作流。模型保持开放，官方同步开放合作与体验入口。", "type": "model", "relTime": "2天前"}, {"id": 34, "title": "黄仁勋AI深伪视频成迷因热潮，创作者借生成式AI工具批量制作", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/1041222/jensen-huang-nvidia-scandal-deepfakes", "date": "2026-11-24T16:30:00.000Z", "summary": "The Verge报道称，英伟达CEO黄仁勋相关话题在Instagram等平台催生数百条AI深伪迷因视频，如将其换脸进“Ibiza Final Boss”和《办公室》等场景，单条观看量近600万。创作者使用字节跳动Seedance 2.5、阿里巴巴Wan 3和谷歌Nano Banana等模型制作，并探讨此类AI生成内容的传播生态、变现方式及性别刻板印象争议。", "type": "industry", "relTime": "2天前"}, {"id": 35, "title": "Pinterest 新增家长控制：可限制青少年看到的 AI 生成内容", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/11/24/pinterest-will-now-let-parents-limit-the-ai-generated-content-their-teens-see/", "date": "2026-11-24T16:02:37.000Z", "summary": "Pinterest 本周扩展家长控制功能，允许家长调节青少年在信息流中接触 AI 生成内容的程度，同时新增关闭视频自动播放、调整推送与邮件通知音量等选项，并重新设计家长控制页面。Pinterest 称这使其成为首批让家长控制 AI 生成内容曝光量的主流社交平台之一，此类信息流层面的控制此前在社交平台普遍缺失。", "type": "product", "relTime": "2天前"}, {"id": 36, "title": "Tidal 宣布全面下架纯 AI 生成音乐，成首个封禁 AI 音乐的流媒体平台", "source": "Hacker News：AI 热帖", "sourceUrl": "https://variety.com/2026/music/news/tidal-bans-ai-generated-music-1236956924/", "date": "2026-11-24T15:06:26.000Z", "summary": "音乐流媒体 Tidal 宣布将从 12 月 9 日起移除全部完全由 AI 生成的曲目，成为首个全面封禁 AI 音乐的流媒体平台。Tidal 负责人 Robert Anderson 称过去 90 天内分发的曲目有 43% 被检测为 AI 生成，96% 的 AI 歌曲播放量为零，此次清理将移除 2900 万首曲目，此后每天拒绝 8 万至 8.5 万首歌。", "type": "industry", "relTime": "2天前"}, {"id": 37, "title": "Google 申请个性化 AI 电视频道专利，用户将成视频主角", "source": "404 Media（RSS）", "sourceUrl": "https://www.404media.co/googles-customized-ai-tv-channel-starring-you/", "date": "2026-11-24T13:42:30.000Z", "summary": "404 Media 报道 Google 申请了一项名为“为用户打造定制视频体验频道”的专利，设想基于人口统计信息、观看历史等用户数据生成 24/7 的 AI 频道“我的频道”，让用户担任全部视频的主角，并通过广告服务器在内容中插入定制广告。", "type": "industry", "relTime": "2天前"}, {"id": 38, "title": "SkyProduction 接入 Kling Image 4.0 与 MiniMax H3-Image，2K 图像生成低至 0.1 元/张", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s/68OX-aoy0oMzqwlX2ytg3g", "date": "2026-11-24T11:10:33.000Z", "summary": "SkyProduction 宣布上线 Kling Image 4.0 与 MiniMax H3-Image 两款图像模型，2K 图像生成价格低至 0.1 元/张。", "type": "product", "relTime": "2天前"}, {"id": 39, "title": "腾讯混元开源第三代翻译模型 Hy-MT3，语言覆盖从 38 扩至 102", "source": "X：腾讯混元 (@TencentHunyuan)", "sourceUrl": "https://x.com/TencentHunyuan/status/2125170622049485093", "date": "2026-11-24T10:12:14.000Z", "summary": "腾讯混元发布第三代开源翻译模型 Hy-MT3，称翻译更准确、更完整、更遵循用户指令，语言覆盖从 38 种扩展到 102 种。模型针对游戏本地化（与《王者荣耀》合作）和图像/OCR 翻译优化，已开放下载部署，提供 Hugging Face 与 GitHub 入口及 arXiv 论文。", "type": "model", "relTime": "2天前"}, {"id": 40, "title": "PixVerse 支持用 Seedance 2.5 生成原生 4K 视频", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2125152561347092690", "date": "2026-11-24T09:00:28.000Z", "summary": "PixVerse 宣布其平台支持用 Seedance 2.5 以原生 4K 分辨率进行视频生成，并给出入口链接 https://app.pixverse.ai/。", "type": "product", "relTime": "2天前"}, {"id": 41, "title": "商汤发布并开源 SenseNova U1.6 原生多模态模型，支持原生图像自修正", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/031/465.htm", "date": "2026-11-24T04:58:18.710Z", "summary": "商汤科技发布并开源 SenseNova U1.6 原生多模态模型，首次为该系列 8B 开源模型带来原生图像自修正，可先生成首稿再对照提示检查并生成修正版。模型加强了透视文字与艺术字等复杂文字生成，U1.6 Lite 在 UltraTextBench 密集信息图测试中得分从 86.04 升至开启自修正后的 92.28，内部评测美学得分较 U1.5 Lite 高约 10%。", "type": "model", "relTime": "2天前"}, {"id": 42, "title": "蚂蚁发布并开源 Ling-3.2-air 模型：原生多模态架构，1240 亿总参数", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/031/426.htm", "date": "2026-11-24T04:01:00.753Z", "summary": "蚂蚁科技集团发布并开源 Ling-3.2-air 模型，延续 Ling-3.0-flash-VL 的原生多模态架构，支持文本、图像和视频输入，总参数 1240 亿，每个 Token 激活 55 亿参数。", "type": "model", "relTime": "2天前"}, {"id": 43, "title": "商汤发布 SenseNova U1.6 图像模型，支持生成后自查并修正图内文字", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2125046695436386816", "date": "2026-11-24T01:59:48.000Z", "summary": "商汤发布图像模型 SenseNova U1.6，基于 Neo-unify 构建，可在生成后自主检查并修正图内文字错误。用户评测中美学质量较 U1.5 提升 10%，在 UltraTextBench 密集信息图任务上较单次生成平均相对提升 7%；ComfyUI 原生支持其自纠错功能，模型权重已上架 Hugging Face，并开放 API（每 5 小时 1,500 次免费请求）。", "type": "model", "relTime": "2天前"}, {"id": 44, "title": "蚂蚁百灵开源发布 Ling-3.2-air，编程、智能体与多模态能力提升", "source": "公众号：蚂蚁百灵（Ling）", "sourceUrl": "https://mp.weixin.qq.com/s/7-Dnhz1ouC6ans0znH154g", "date": "2026-11-24T01:00:00.000Z", "summary": "蚂蚁百灵大模型发布并开源 Ling-3.2-air，延续 Ling-3.0-flash-VL 原生多模态架构，总参数 1240 亿、每 Token 激活 55 亿，支持文本、图像和视频输入。", "type": "model", "relTime": "2天前"}, {"id": 45, "title": "美国弗吉尼亚州和俄勒冈州起诉 SpaceX，指控 Grok 生成儿童性虐待图像", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/031/270.htm", "date": "2026-11-24T00:48:21.250Z", "summary": "美国弗吉尼亚州和俄勒冈州起诉 SpaceX，指控其旗下 AI 模型 Grok 未阻止生成儿童性虐待图像并从中获利，两州是过去几个月多州调查中首批正式起诉的州。两州还指控 SpaceX 宣传安全功能时误导消费者、未建立充分安全防护，并仍在推广可生成裸露图像的 Spicy 模式，要求赔偿并停止违法行为，SpaceX 暂未回应置评请求。", "type": "industry", "relTime": "2天前"}, {"id": 46, "title": "fal 上线 Recraft V4.1 Flash V2 与 Vectorize Pro", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2125009867324715057", "date": "2026-11-23T23:33:27.000Z", "summary": "Recraft V4.1 Flash V2 与 Vectorize Pro 现已在 fal 上线。  - 使用 Flash V2 生成图像，招牌、包装和海报上的文字更清晰 - 在类照片作品中呈现更精细的细节，从产品图到室内场景 - 使用 Vectorize Pro 将栅格图像转换为干净的 SVG：平滑曲线、笔直线条、锐利转角 - 可处理字体和复杂形状，并提供可选的抠图模式，用于不重叠的形状", "type": "product", "relTime": "3天前"}, {"id": 47, "title": "Hyper3D Low Poly 上线 fal", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2124994211971756465", "date": "2026-11-23T22:31:15.000Z", "summary": "Hyper3D Low Poly 现已在 fal 上线  - 可根据文本提示词或参考图像生成低多边形 3D 模型 - 可将高多边形网格转换为低多边形资产，并投影和烘焙原始纹理 - 支持三角形和四边形拓扑，用于重拓扑和 LOD 生成工作流", "type": "product", "relTime": "3天前"}, {"id": 48, "title": "fal 上线 Hyper3D 低多边形 3D 生成", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2124994214165463358", "date": "2026-11-23T22:31:15.000Z", "summary": "现在就来试试！  文本转 3D：https://fal.ai/models/hyper3d/lowpoly/text-to-3d 图像转 3D：https://fal.ai/models/hyper3d/lowpoly/image-to-3d 网格转 3D：https://fal.ai/models/hyper3d/lowpoly/mesh-to-3d", "type": "product", "relTime": "3天前"}, {"id": 49, "title": "Antropi Robotics 建自主 CNC 工厂，10 月营收 10 万美元", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2124980757395599572", "date": "2026-11-23T21:37:47.000Z", "summary": "YC 支持的 Antropi Robotics 正在打造自主 CNC 工厂，其 Factory OS 统一调度机器人上下料、加工、排程与检测，目标是以中国级价格产出美国品质零件。公司称 10 月营收 10 万美元、服务 14 家公司，毛利率约 60%。行业投资同步升温，Hadrian 近期以近 80 亿美元估值融资 13.7 亿美元扩产自动化制造。", "type": "industry", "relTime": "3天前"}, {"id": 50, "title": "多州起诉 SpaceX，要求阻止 Grok 生成儿童性虐待图像和复仇式色情内容", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/tech-policy/2026/11/states-sue-spacex-to-stop-grok-from-generating-child-sex-images-revenge-porn/", "date": "2026-11-23T21:30:44.000Z", "summary": "多州总检察长起诉 SpaceX，要求阻止 Grok 生成儿童性虐待图像（CSAM）和复仇式色情内容。X 声称每条 Grok 输出都经过筛查，但州总检察长表示 Grok 仍在生成 CSAM。", "type": "industry", "relTime": "3天前"}, {"id": 51, "title": "Canva 发布 MCP 服务器，agent 可从一句需求生成可编辑的发布资产", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2124973673249718677", "date": "2026-11-23T21:09:38.000Z", "summary": "Canva 发布全新 Canva MCP，把 Canva 的设计工具和 AI 模型开放给任意 agent 或开发者接入，无需候补名单。作者演示的流程是：开发者在 Canva Developer Portal 启用 MCP，agent 收到一句需求后自行选择并按顺序调用 Canva 工具，生成设计、创建视频并适配各平台尺寸，最终以可编辑的 Canva 设计文件返回，由人工进行审查、修改、分享和发布。", "type": "product", "relTime": "3天前"}, {"id": 52, "title": "Google 申请个性化 AI 电视频道专利，用户将成为主角", "source": "404 Media（RSS）", "sourceUrl": "https://www.404media.co/google-wants-to-make-a-24-7-ai-tv-channel-youll-be-the-main-character/", "date": "2026-11-23T18:17:22.000Z", "summary": "Google 已提交一项专利申请，拟利用其掌握的用户信息生成全天候 AI 电视频道，内容包括以用户为主角的个性化节目和定制广告。404 Media 认为，这反映了 AI 视频的一个趋势：基于公司和广告主收集的大量用户数据自动生成无限量、高度定制的内容。", "type": "industry", "relTime": "3天前"}, {"id": 53, "title": "Ai2 发布 RoboTrack 点跟踪基准、RoboTrack-15M 数据集与 RoboTracker 系列模型", "source": "Hugging Face 社区博客（混合发现）", "sourceUrl": "https://huggingface.co/blog/allenai/robotrack", "date": "2026-11-23T17:20:37.000Z", "summary": "Ai2 发布面向机器人操作的点跟踪基准与训练数据套件 RoboTrack，包含 307 段人工标注视频的 RoboTrack-Bench（2522 条轨迹，来自 DROID、Ego-Exo4D、MolmoAct 2 和 EgoVerse）和基于 MolmoSpaces 生成 1500 万条轨迹的 RoboTrack-15M。", "type": "paper", "relTime": "3天前"}, {"id": 54, "title": "a16z 领投 Embo：用世界模型打造人形机器人\"大脑\"", "source": "a16z：News（RSS）", "sourceUrl": "https://www.a16z.news/p/investing-in-embo", "date": "2026-11-23T17:02:28.000Z", "summary": "a16z 领投 Embo，该公司正用世界模型为人形机器人构建\"大脑\"，解决泛化与抗干扰两大问题。其方法先用海量互联网视频和机器人演示训练世界模型，再让智能体在模型内通过强化学习反复练习技能。创始人 Danijar Hafner 此前主导 Dreamer 系列研究，Dreamer 4 曾仅靠想象经验学会在 Minecraft 中获取钻石。", "type": "industry", "relTime": "3天前"}, {"id": 55, "title": "商汤开源 SenseNova-Loop-9B 多模态模型，512K 上下文、循环复用 24 层中间块", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2124904314024186073", "date": "2026-11-23T16:34:01.000Z", "summary": "商汤发布开源多模态模型 SenseNova-Loop-9B，支持 512K 上下文和文本图像输入，已在 Hugging Face 提供下载。模型仅存储 32 层权重，将同一 24 层中间块执行两次实现 56 层计算；官方 4-bit AWQ 权重约 4.9GB，64K 上下文显存可低至约 9 GiB。", "type": "model", "relTime": "3天前"}, {"id": 56, "title": "NVIDIA 教程：用 Hugging Face Diffusers 在 12 GB 显存 GPU 上本地运行 Cosmos 3 Nano", "source": "NVIDIA Technical Blog：Agentic AI / Generative AI", "sourceUrl": "https://developer.nvidia.com/blog/how-to-run-nvidia-cosmos-3-on-local-ai-devices-using-hugging-face-diffusers/", "date": "2026-11-23T16:00:00.000Z", "summary": "NVIDIA 技术博客发布教程，讲解如何通过权重流式存储，在仅 12 GB VRAM 的 GPU 上本地运行 NVIDIA Cosmos 3 Nano 视频生成模型，将大部分模型权重存于系统内存并按需传至 GPU 计算。", "type": "tip", "relTime": "3天前"}, {"id": 57, "title": "可灵发布 Kling Image 4.0，单条提示词最多生成 10 张风格一致图像", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2124846759679607044", "date": "2026-11-23T12:45:19.000Z", "summary": "可灵官方宣布 Kling Image 4.0，可从单条提示词生成一套完整图像，最多 10 张，并保持主体和视觉风格一致，围绕创作者的构想输出。", "type": "product", "relTime": "3天前"}, {"id": 58, "title": "智谱发布 GLM-5.4 循环 Transformer", "source": "X：智谱 Z.ai (@Zai_org)", "sourceUrl": "https://x.com/Zai_org/status/2124811995912286352", "date": "2026-11-23T10:27:11.000Z", "summary": "推出 GLM-5.4：搭载我们首个循环 Transformer 的通用编程模型。  - 在 GLM-5 基座模型上循环已有层，实现更深层推理 - 突破传统编程，延伸至视频、游戏、3D 着色器与 CAD 建模 - 新增视觉能力，强化视觉编程  API 将在安全评估后开放。模型权重将负责任地发布。  技术博客：http://z.ai/blog/glm-5.4", "type": "model", "relTime": "3天前"}, {"id": 59, "title": "Ai2 发布 RoboTrack 点跟踪基准与数据集，并推出 RoboTracker 模型", "source": "Ai2 / Allen Institute for AI（RSS）", "sourceUrl": "https://allenai.org/blog/robotrack", "date": "2026-11-23T08:00:00.000Z", "summary": "Ai2 发布 RoboTrack，一套面向机器人操作的点跟踪基准与训练数据套件，含 307 段人工标注视频、2522 条点轨迹的 RoboTrack-Bench，以及基于 MolmoSpaces 生成的 RoboTrack-15M 合成训练集。", "type": "paper", "relTime": "3天前"}, {"id": 60, "title": "X Square Robot 发布 WALL-OSS-1.0 具身基础模型", "source": "X：自变量 X Square (@XSquareRobot)", "sourceUrl": "https://x.com/XSquareRobot/status/2124767551959757162", "date": "2026-11-23T07:30:35.000Z", "summary": "X Square Robot 发布具身基础模型 WALL-OSS-1.0，采用原生 VLA 预训练，融合视觉、语言与动作，使机器人适应未预先定义的任务。模型在 312 个真实机器人任务上实现 55.1% 零样本成功率，无需任务专属演示或微调。配套的 XR Harness 可将「收拾桌子」这类高层指令转化为多步骤协调动作，技术博客、GitHub 仓库和 API 均已公开。", "type": "model", "relTime": "3天前"}, {"id": 61, "title": "蚂蚁百灵医疗健康大模型宣布全面开源，最轻量版一台笔记本即可部署", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/030/784.htm", "date": "2026-11-23T02:56:54.250Z", "summary": "蚂蚁在阿福医疗健康生态大会上宣布蚂蚁百灵医疗健康大模型全面开源，家族包含大语言模型、实时音视频模型、预测模型和安全防护模型，支持疾病未来六年的发病风险预测。据现场信息，模型含医生专业个人版多模态模型（124B）和医疗机构版医疗智能体大模型（562B），最轻量版一台笔记本即可部署，官方称疾病种类、准确率超越全球多个专用模型。", "type": "model", "relTime": "3天前"}, {"id": 62, "title": "OpenRouter 实测用 MCP 连接器让 Claude 生成图像并对比四款模型", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/tutorials/can-claude-generate-images/", "date": "2026-11-23T00:00:00.000Z", "summary": "OpenRouter 发布教程演示如何通过 OpenRouter MCP 服务器（https://mcp.openrouter.ai/mcp）作为连接器让 Claude 调用图像模型生成真实图片，覆盖截至 2026 年 11 月 19 日的 74 款图像模型。", "type": "tip", "relTime": "4天前"}, {"id": 63, "title": "特斯拉新 FSD 显示由车机端约 1B diffusion 模型实时生成", "source": "X：Dash (@dashhuang)", "sourceUrl": "https://x.com/DashHuang/status/2124649277951766806", "date": "2026-11-22T23:40:36.000Z", "summary": "作者引用 Elon Musk 的解释：特斯拉新版 FSD 显示画面是 AI 视频实时生成的，不走传统 3D 渲染。车机端运行一个约 1B 的条件 mean-flow diffusion 模型，基于 Universal Vision Encoder 特征，每秒 18 帧时用半个 TRIP 引擎算力生成 8 帧 36fps 的视频块，当前延迟偏高但已有可削减约 35% 延迟的方案。", "type": "industry", "relTime": "4天前"}, {"id": 64, "title": "蚂蚁集团开源医疗多模态模型 LingSante-3.1-air-VL，可生成胸片报告", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2124615279108137021", "date": "2026-11-22T21:25:30.000Z", "summary": "蚂蚁集团开源多模态医疗模型 LingSante-3.1-air-VL，总参数 124B、每 token 激活 5.5B 的 MoE 架构，结合医学影像理解、报告生成、医学推理与多模态搜索和工具使用。", "type": "model", "relTime": "4天前"}, {"id": 65, "title": "蚂蚁百灵开源医疗多模态模型 LingSante-3.1-air-VL，总参数 124B、激活 5.5B", "source": "X：蚂蚁百灵 (@AntLingAGI)", "sourceUrl": "https://x.com/AntLingAGI/status/2124555085640610194", "date": "2026-11-22T17:26:19.000Z", "summary": "蚂蚁百灵发布开源多模态医疗模型 LingSante-3.1-air-VL，总参数 124B、激活参数 5.5B，结合医学影像理解、报告生成、医疗推理与多模态搜索和工具调用。", "type": "model", "relTime": "4天前"}, {"id": 66, "title": "PixVerse 分享韩式大头贴四宫格人像生成提示词", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2124518556603916711", "date": "2026-11-22T15:01:10.000Z", "summary": "PixVerse 发布一条图像生成提示词，用上传照片作为唯一身份参考，生成韩式照片亭风格的 3:4 四宫格人像。提示词要求保留脸型、五官和年龄感，四个分格同一人物不同姿势，包括手持复古电话、戴熊耳头带、举银色复古相机和头顶椭圆墨镜，背景为低饱和鼠尾草绿并带闪光灯质感，并明确避免过度磨皮、手指变形和水印。", "type": "tip", "relTime": "4天前"}, {"id": 67, "title": "OpenBMB 确认 MiniCPM-V 4.7（35B-A3B）端侧 MoE 多模态模型进展", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2124463719824622050", "date": "2026-11-22T11:23:16.000Z", "summary": "面壁智能 OpenBMB 回应社区对 MiniCPM-V 4.7（35B-A3B）的关注，称把强大的多模态 AI 带到日常设备正是其工作方向，并预告更多内容。引用内容称该模型为开源端侧 MoE 多模态模型，总参数 35B、每 Token 约激活 3B，Instruct 模式下反超同档 Qwen3.6-35B-A3B，iPhone 17 Pro Max 约 3GB 内存跑出 13+ token...", "type": "model", "relTime": "4天前"}, {"id": 68, "title": "TikTok 上线 AI 内容透明度检测工具与创作者肖像检测功能", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/030/581.htm", "date": "2026-11-22T06:46:21.620Z", "summary": "TikTok 于当地时间 11 月 19 日宣布推出两项 AI 透明度工具。用户无需账号即可上传图片或视频，检测其是否由 TikTok AI 功能生成或编辑，工具还会检测专有隐形水印 VeraDura；面向全球逐步推出的肖像检测功能需主动开启，帮助符合条件的创作者发现并标记可能未经授权使用其肖像的 AI 生成内容。", "type": "product", "relTime": "4天前"}, {"id": 69, "title": "Elon Musk 称赞 Tesla FSD V15 是全新架构的出色版本", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2124294755316310346", "date": "2026-11-22T00:11:51.000Z", "summary": "Elon Musk 转发并称赞 Tesla FSD V15，称其采用全新架构，驾驶智能超越人类。引用的完整更新说明

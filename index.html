with-the-launch-of-what-feels-a-whole-lot-like-chatgpts-own-office-suite/", "date": "2026-09-29T17:45:51.000Z", "summary": "OpenAI 在旧金山 Dev Day 上发布多项面向办公场景的 ChatGPT 新功能，包括共享工作区 Space、文档工具 Pages 和协作幻灯片，形式上接近微软办公套件。Space 中同事可与聊天机器人及新推出的 AI 智能体人格 Dots 协作处理工作任务；Pages 定位为面向人与智能体协作的新型文档，可写作、研究、生成图表和图像。这是 OpenAI 进一步切入微软办公软件腹地的举措。", "type": "paper", "relTime": "6小时前"}, {"id": 6, "title": "Runway 加入 OpenAI Marketplace", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2104988068289843602", "date": "2026-09-29T17:33:58.000Z", "summary": "我们作为首发合作伙伴加入 @OpenAI Marketplace。  从今天起，你可以访问最优秀的图像、视频、音频和编辑模型，并可将部分 OpenAI 承诺额度用于在 Runway 上的购买。  点击下方链接了解更多并开始创作。", "type": "industry", "relTime": "6小时前"}, {"id": 7, "title": "Apple Creator Studio 迎来新更新：全新模板、端到端电影级视频与效率功能", "source": "Apple：Newsroom（RSS）", "sourceUrl": "https://www.apple.com/newsroom/2026/09/new-updates-coming-to-apple-creator-studio/", "date": "2026-09-29T17:00:02.643Z", "summary": "Apple Creator Studio 将新增全新模板、端到端电影级视频制作流程以及多项提升效率的功能。Freeform 新增深色模式自适应画板、文件夹分组协作，并支持 Apple Intelligence 写作工具改写、校对和摘要手写笔记。在 visionOS 27 中，用户可将画板中的图片、视频、便签、形状和 3D 模型拖入空间并成组查看。", "type": "model", "relTime": "7小时前"}, {"id": 8, "title": "Tripo 与 Grok 打造 SpaceX 火星任务游戏", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2104949319686127873", "date": "2026-09-29T15:00:00.000Z", "summary": "嘿 @grok，给我们的火星基地打个分吧！✨  为庆祝 Starship Flight 14 发射，我们在浏览器里做了一个完全可玩的 SpaceX 火星任务。  Grok 负责核心游戏逻辑和编码，Tripo 则即时生成 3D 资产。  从提示词到一个完全可玩的世界。我们准备好升空了吗，@SpaceX？", "type": "paper", "relTime": "9小时前"}, {"id": 9, "title": "豪威集团发布 OX08D30 车外摄像头图像传感器：800 万像素，支持 LED 闪烁抑制", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/008/363.htm", "date": "2026-09-29T08:21:49.000Z", "summary": "豪威集团发布 800 万像素 CMOS 汽车图像传感器 OX08D30，基于 TheiaCel™ 技术，面向 ADAS 与自动驾驶车外摄像头，现已出样并进入量产。该传感器可抑制 LED 闪烁，最远检测距离达 200 米，与 OX08D10 引脚对引脚兼容，功耗降低 20%、尺寸缩减 50%。", "type": "industry", "relTime": "15小时前"}, {"id": 10, "title": "叶序：一款音频响应式LED显示屏", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://jagi.studio/posts/phyllotaxis/", "date": "2026-09-29T07:33:05.802Z", "summary": "开发者用 Processing 生成黄金角螺旋点阵并做 Voronoi 剖分，再用 CadQuery 建模、3D 打印出 89 颗可寻址 RGB LED 的叶序造型灯盘。灯盘由 STM32 blackpill 驱动，通过 SPI 控制 neopixel，并接入 INMP441 I2S 数字麦克风，借助 ARM CMSIS 库做傅里叶变换与多频段能量分析，实现随房间声音变化的音频响应效果。", "type": "tip", "relTime": "16小时前"}, {"id": 11, "title": "Runway 如何帮世界杂耍联盟用 AI 补满电视转播的空座位", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/customers/world-juggling-federation", "date": "2026-09-29T00:52:14.404Z", "summary": "世界杂耍联盟（WJF）创始人 Jason Garfield 用 Runway 为荷兰两日赛事的转播补全观众席：首日满座、次日侧机位空座，他用 Aleph 2.0 在原始素材中加入观众而不改动画面其他部分，仅一个极广角镜头退回 After Effects 处理。他还用 Runway 生成开场动画、选手资料卡、排行榜和舞台烟火，整档约一小时特别节目由他一人完成，单段生成时长上限约 15 秒。", "type": "tip", "relTime": "23小时前"}, {"id": 12, "title": "OpenRouter 对比 Veo 3.1、Seedance、Kling、Grok Imagine Video 的图生视频能力与价格", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/insights/image-to-video-models-compared/", "date": "2026-09-29T00:00:00.000Z", "summary": "OpenRouter 对比其平台上 Veo 3.1 系列、Seedance 2.5/2.0 系列、Kling v3.0 与 Grok Imagine Video 各模型的图生视频设置，涵盖分辨率、时长、首尾帧控制、音频和每秒价格，数据核查于 2026 年 9 月 11 日。", "type": "tip", "relTime": "1天前"}, {"id": 13, "title": "Bonjour 用 Runway 将一份脚本生成所有广告风格", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/customers/bonjour", "date": "2026-09-28T23:46:29.430Z", "summary": "法国适应原饮料品牌 Bonjour 的 15 人创意团队用 Runway 把一份脚本批量生成多种动画风格广告，从脚本到效果判定只需 4 到 5 天，成品动画批次 24 到 48 小时完成。团队已用 Runway 产出超过 500 个视频和图像变体，并称转向内部生成创意后省下逾 5 万欧元外部制作费用；改用 Runway 企业版后不再受 credits 限制，可继续加大测试投入。", "type": "paper", "relTime": "1天前"}, {"id": 14, "title": "李飞飞谈大语言模型的局限", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2104716942317875249", "date": "2026-09-28T23:36:37.000Z", "summary": "李飞飞博士谈大语言模型的局限。  “语言纯粹是生成的信号。你不会走到自然界里，发现天上写着字。存在的是一个遵循物理定律的 3D 世界。”", "type": "tip", "relTime": "1天前"}, {"id": 15, "title": "快手可灵 AI Z", "summary": "HN.watch 上线，为 Hacker News 每条帖子配一段短视频解说，点击标题即可观看。该站由 scrimba 制作，声明与 Y Combinator 无关，不设 cookie 与追踪脚本，仅做匿名每日聚合。", "type": "paper", "relTime": "1天前"}, {"id": 21, "title": "Perplexity Computer 科普视频功能", "source": "X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)", "sourceUrl": "https://x.com/AravSrinivas/status/2104593373026038209", "date": "2026-09-28T15:25:36.000Z", "summary": "这是我小时候会很喜欢的东西  （引用推文概括：Computer 可以从 Wiley Online Library 等科学来源提取信息，生成讲解视频。Wiley 数据对所有 Computer 用户免费开放，无需设置或现有订阅。）", "type": "paper", "relTime": "1天前"}, {"id": 22, "title": "商汤 Seko 助 22 岁学生独立制作 AI 短剧", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2104588113595314606", "date": "2026-09-28T15:04:42.000Z", "summary": "22 岁艺术设计学生 CHunye 用商汤 AI 视频创作 Agent Seko 独立制作日式僵尸短剧《DUHAI》，从第 3 集起全部由 Seko 完成，原本需要完整制作团队的工作如今一人即可完成。Seko 将创意转化为结构化制作流程，在同一画布上整合角色、场景与道具，其视觉记忆与推理能力保证跨集一致性。该剧在抖音累计播放量已突破 7400 万次。", "type": "paper", "relTime": "1天前"}, {"id": 23, "title": "祖父被 AI 深度伪造语音诈骗后，Tarini Padmanabhuni 创办 DetectifAI 做端侧检测", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/28/after-a-deepfake-voice-fooled-her-grandfather-this-founder-sprang-into-action/", "date": "2026-09-28T15:00:00.000Z", "summary": "Tarini Padmanabhuni 因祖父被 AI 深度伪造语音冒充其兄弟骗走赎金，创办旧金山公司 DetectifAI，做可在手机操作系统内本地运行的紧凑 AI 模型，在通话和语音消息中即时判断声音是否为 AI 生成，音频不出设备。", "type": "industry", "relTime": "1天前"}, {"id": 24, "title": "Meta 发布 Muse 系列模型与 API", "source": "X：AI at Meta (@AIatMeta)", "sourceUrl": "https://x.com/AIatMeta/status/2104579386024603826", "date": "2026-09-28T14:30:01.000Z", "summary": "过去 6 个月……  - Muse Spark - Muse Image - Muse Video - Muse Spark 1.1 - Meta Model API - Muse Glimmer - Muse Spark 1.2 - Muse Code - Muse Spark 1.3 - Muse  ……而我们才刚刚开始。🚀", "type": "industry", "relTime": "1天前"}, {"id": 25, "title": "404 Media 报道：人类审核员正在阅读 Microsoft Copilot 的提示词与图像并感到震惊", "source": "404 Media（RSS）", "sourceUrl": "https://www.404media.co/humans-reading-copilot-prompts-images/", "date": "2026-09-28T13:26:31.000Z", "summary": "404 Media 报道称，Microsoft 聘请的人类承包商为改进 Copilot 而持续审核用户上传的提示词和图像，其中大量涉及性暴露内容，如偷拍裙底照片或将女性置于性姿势的编辑请求。这些承包商还需判断生成图像是否完成提示词要求，例如 AI 放大的胸部是否足够大。", "type": "industry", "relTime": "1天前"}, {"id": 26, "title": "商汤发布AI视频创作Agent Seko，助力个人创作者打造百万播放短剧", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2104526535751287134", "date": "2026-09-28T11:00:00.000Z", "summary": "商汤科技（SenseTime）宣传其AI视频创作Agent“Seko”。案例显示，22岁艺术生CHunye利用Seko独立制作了日式丧尸短剧《DUHAI》，从第3集起完全由该工具生成。Seko能将创意转化为结构化工作流，通过视觉记忆和推理保持角色、场景跨集一致性。该系列在抖音等平台累计观看量超7400万，展示了AI赋能“一人公司”（OPC）的潜力。", "type": "paper", "relTime": "1天前"}, {"id": 27, "title": "AI每日简报：OpenAI修复GPT-6视觉Bug，Anthropic疑似新模型标签曝光", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2104493424472674634", "date": "2026-09-28T08:48:26.000Z", "summary": "该帖子为2026年9月28日的AI新闻聚合。主要内容包括：OpenAI修复了GPT-6 Sol和Luna的图像编码Bug；ChatGPT代码中发现“o”引用，传闻涉及Pro计划调整；Meta Muse增加VM屏幕浏览标签；Google Flow指向Nano Banana 2.1并测试印度Gemini购物功能；xAI Grok响应变快；Anthropic出现claude-sonnet-5-5标...", "type": "industry", "relTime": "1天前"}, {"id": 28, "title": "字节火山引擎发布 Seedance 影视合作计划，单项目激励最高百万", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/867.htm", "date": "2026-09-28T08:16:34.000Z", "summary": "9月27日，字节跳动旗下火山引擎在平遥国际电影展期间发布 Seedance 影视合作计划。该计划面向全球专业影视项目提供 Token 补贴、宣发资源及技术支持，单个项目激励最高可达百万人民币。参与要求包括全片视频生成环节100%由 Seedance 实现，支持全 AI 生成或 AI+真人混合制作，且重点鼓励在制作方法与工作流程上实现创新突破的项目。", "type": "industry", "relTime": "1天前"}, {"id": 29, "title": "昆仑万维天工工作台上线AI MV创作与音乐生成能力", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI1MzE1NDc3Mg==&mid=2247510445&idx=1&sn=986335f6da07fef6af3111ddf76db4bb&chksm=e802de782531392ddf63eed55984898d7d404510424c49f6a7f699cbca6e869a490e48071af7&scene=126&sessionid=1790588864#rd", "date": "2026-09-28T08:02:09.000Z", "summary": "9月27日，昆仑万维旗下SkyProduction（天工工作台）上线三项新能力：开放AI MV创作功能；无限画布接入Mureka V8/V9/V9.5音乐生成模型；视频和图片支持智能配乐。用户可在同一画布完成从音乐分析、分镜规划到视频生成的全流程，并调用Seedance 2.5模型生成视频片段。", "type": "model", "relTime": "1天前"}, {"id": 30, "title": "华为余承东宣布智界 RX 获 L3 级自动驾驶测试牌照并开展实测", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/834.htm", "date": "2026-09-28T07:11:49.000Z", "summary": "在智界 RX 及鸿蒙智行新品发布会上，华为余承东宣布智界 RX 搭载 L3 级自动驾驶架构，已获批 L3 级道路测试牌照，正在城市快速路等复杂公开道路开展实测。该车还配备全维防碰撞系统 CAS 5.0。此前曝光的测试视频显示，车辆通过方向盘“A”键激活 L3 模式，中控屏会显示相应状态。", "type": "industry", "relTime": "1天前"}, {"id": 31, "title": "Meta 推出 Hologram 拟真虚拟形象，秋季上线雷朋眼镜与 Quest 头显", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/767.htm", "date": "2026-09-28T04:31:04.000Z", "summary": "Meta 宣布将于今年秋季在雷朋 Display 智能眼镜、Quest 头显及新轻薄头显上推出“Hologram”功能。该功能利用生成式 AI（实时扩散模型）创建高度拟真的用户虚拟形象，替代传统摄像头画面用于 WhatsApp 视频通话。用户需通过手机 Meta AI 应用采集面部表情和语音数据完成建模。雷朋版基于音频驱动生成 2D 视频流，Quest 版支持 3D 等身立体呈现。目前存在细...", "type": "model", "relTime": "1天前"}, {"id": 32, "title": "开发者用英伟达 RTX Remix 让《GTA 2》支持光追", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/764.htm", "date": "2026-09-28T04:16:21.000Z", "summary": "Mod 作者 gebdag 发布《GTA 2》RTX Remix 模组，为这款 1999 年的 2D 俯视角游戏带来完整路径追踪和动态昼夜光照。由于 RTX Remix 不原生支持游戏所用的 DirectDraw 和早期 Direct3D，作者用两个 DLL 搭建定制 Direct3D 9 封装层完成转换，并解锁 16:9 宽屏与帧生成，帧率最高 60 FPS。", "type": "paper", "relTime": "1天前"}, {"id": 33, "title": "Google Research 推出 AI 视频联合导演，用 4 个智能体框架生成连贯的长视频", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/27/google-research-introduces-an-ai-video-co-director-4-agentic-frameworks-for-coherent-minutes-long-video-generation", "date": "2026-09-28T02:44:27.000Z", "summary": "Google Research 推出 AI 视频联合导演，由 4 个智能体框架组成，运行在 Gemini 和 Veo 之上，用于解决多镜头 AI 视频中的身份漂移和级联错误问题。", "type": "paper", "relTime": "1天前"}, {"id": 34, "title": "PixVerse 插件一键生成音乐 MV", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2104400073992102329", "date": "2026-09-28T02:37:30.000Z", "summary": "GPT-6 Astra 用一个提示词剪出了一支时尚说唱 MV  安装 PixVerse 插件，告诉智能体你想要什么，就能得到你自己的音乐视频", "type": "paper", "relTime": "1天前"}, {"id": 35, "title": "群核科技用空间智能重建永泰龟城，24 亿高斯点刷新全球 3D 高斯重建纪录", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/yunqipartners/manycore-techs-spatial-intelligence-continues-century-old-tu", "date": "2026-09-28T02:36:59.000Z", "summary": "群核科技联合博主「特能斯」4 人 4 天在甘肃永泰龟城采集 6 万多张照片，通过 3D 高斯重建平台 Aholo Reality 生成 24 亿高斯点、60 万平方米的数字古城，刷新全球公开可查的 3D 高斯重建纪录。该数字场景已交给景泰当地文旅作为永久数字文化档案保存，并依托 Aholo Viewer 的流式调度能力支持在线漫游；同一场景还被用于 LuxReal 生成 AI 短剧《永泰无战事》。", "type": "paper", "relTime": "1天前"}, {"id": 36, "title": "GPT-Image 2.5 的12种照片编辑与创意玩法教程", "source": "公众号：数字生命卡兹克", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA==&mid=2647686740&idx=1&sn=ae96d1c72375f5ad62ddb05432b04584&chksm=f1bd9f85e967fd41ec107fa4817e47acde4524b0a82166498a694df54b55edaca2674d909de4&scene=126&sessionid=1790572866#rd", "date": "2026-09-28T00:28:00.000Z", "summary": "文章介绍了利用 GPT-Image 2.5 模型进行照片精准编辑和创意生成的12种具体玩法，包括消除背景游客、自动调光、专业美颜、制作3D公仔拍立得、景点明信片、主体贴纸化、旅游碎片行李箱、人物海报、演唱会氛围感照片、美食飞溅效果、物体转文字涂鸦及Ins风注释等。每种玩法均提供了详细的提示词示例和操作步骤，旨在帮助用户在假期通过AI优化朋友圈照片。", "type": "tip", "relTime": "1天前"}, {"id": 37, "title": "GeoVerse：在几何隐空间中实现世界一致的新视角合成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35734", "date": "2026-09-28T00:00:00.000Z", "summary": "GeoVerse 通过在预训练 3D 基础模型的几何隐空间中生成、并注入视频生成模型的外观先验，实现世界一致的新视角合成。它从 Wan2.2 VACE 提取多层级特征，经 ControlNet 式适配器注入几何隐扩散模型，并用全局空间记忆聚合已观测与合成内容以保持跨视角连贯。", "type": "paper", "relTime": "2天前"}, {"id": 38, "title": "SolveEdit：生成模型视觉问题求解基准测试", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35504", "date": "2026-09-28T00:00:00.000Z", "summary": "研究者推出 SolveEdit 基准，用于评估生成模型通过场景变换完成视觉问题求解的能力，包含 2,728 个案例，并用原子变换契约与 SolveScore 在无需参考输出的情况下衡量完成度与误改。", "type": "paper", "relTime": "2天前"}, {"id": 39, "title": "EditWorld：面向可交互世界的精准编辑与灵活引用视频世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34470", "date": "2026-09-28T00:00:00.000Z", "summary": "EditWorld 是一个支持精准编辑与灵活引用的视频世界模型，可在自回归生成过程中流式接收编辑指令和参考图像，将世界建模从探索扩展到精准修改。它引入 Gated Causal Attention 处理时变编辑条件与参考图像，并用 Sparse Context 机制维持有界历史上下文以支持长时程推理。", "type": "paper", "relTime": "2天前"}, {"id": 40, "title": "EvolvingAvatar：随对话演进自适应调整的交互式 3D 头部生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35616", "date": "2026-09-28T00:00:00.000Z", "summary": "EvolvingAvatar 是一种因果生成器，通过测试时训练在交互过程中适配用户面部视频与双人音频，其双人上下文预测目标无需测试时目标动作标注即可提供自监督信号。", "type": "paper", "relTime": "2天前"}, {"id": 41, "title": "距离去掉视觉编码器还有多远？无编码器多模态预训练的缩放定律", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35457", "date": "2026-09-28T00:00:00.000Z", "summary": "研究对比了无编码器与有编码器多模态大模型的缩放定律，发现去掉视觉编码器会把多模态目标的算力最优分配推向更大模型，文本目标则几乎不变。两者在文本目标上损失-算力前沿几乎重合，但多模态目标上无编码器模型小规模时落后，预计约 10^22 FLOPs 时追平。无编码器时语言模型通过视觉专属适配接管其角色：视觉 token 双向交互随算力增长愈发有益，视觉处理前移，视觉 token 的专家路由更集中。", "type": "paper", "relTime": "2天前"}, {"id": 42, "title": "ControlScope：LLM 智能体的工作流修订与可靠性", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34313", "date": "2026-09-28T00:00:00.000Z", "summary": "ControlScope 对比了 LLM 智能体在同一公开执行状态下继续生成代码、编辑下一次工具调用的数据参数、以及替换未完成工作流三种修订方式，并区分可用修复与智能体实际选择的动作。", "type": "paper", "relTime": "2天前"}, {"id": 43, "title": "GEAR：用几何作为地址路由注意力，实现长时程相机控制视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34722", "date": "2026-09-28T00:00:00.000Z", "summary": "研究者提出 GEAR，一个以几何为 token 级地址来路由视觉记忆的注意力框架，用于长时程相机控制视频生成。", "type": "paper", "relTime": "2天前"}, {"id": 44, "title": "Just MLPs：为多模态语言模型高效重建视觉状态", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34972", "date": "2026-09-28T00:00:00.000Z", "summary": "研究提出 δ-Vision，用轻量低秩适配器构建逐层视觉记忆，替代视觉 token 在 Transformer 中的重复演化，同时保留全部视觉 token 供文本检索。该方法发现视觉到文本的信息流集中在低维子空间，且轻量 MLP 能以高余弦相似度和低重建误差逼近各层视觉状态。在图像和视频基准上，δ-Vision 在相当或更低计算量下准确率超过视觉 token 剪枝基线，且不丢弃视觉 token。", "type": "paper", "relTime": "2天前"}, {"id": 45, "title": "MT-OPSD：面向多轮图像编辑的在线策略自蒸馏框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35611", "date": "2026-09-28T00:00:00.000Z", "summary": "针对现有图像编辑模型在递归编辑中快速退化的问题，研究者提出 MT-OPSD 在线策略自蒸馏框架，让模型在自生成的条件下状态上训练，并由干净条件教师模型提供编辑监督，无需多轮标注。该工作同时发布 LME-Bench，包含 100 组十轮编辑会话，用于评估长程鲁棒性。在三个编辑骨干上的实验显示，MT-OPSD 显著提升长程编辑成功率、减少多轮崩溃，并基本保持单轮编辑质量。", "type": "paper", "relTime": "2天前"}, {"id": 46, "title": "SCOPD：面向高效视觉语言模型的稀疏上下文同策略自蒸馏", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34044", "date": "2026-09-28T00:00:00.000Z", "summary": "针对推理型视觉语言模型（VLM）视觉 token 序列过长导致推理昂贵的问题，研究者提出稀疏上下文同策略自蒸馏框架 SCOPD：学生模型基于剪枝后的视觉 token 生成推理轨迹，由拥有完整上下文的教师模型对同一同策略前缀进行监督，无需真实答案、架构改动或额外推理开销。", "type": "paper", "relTime": "2天前"}, {"id": 47, "title": "UMM-Reflection：用交错强化学习让统一多模态模型学会原生反思", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35767", "date": "2026-09-28T00:00:00.000Z", "summary": "UMM-Reflection 通过交错强化学习，让统一多模态模型在一条轨迹内完成\"诊断—修改—再观察\"的完整反思循环，轨迹级优势同时更新反思 token 与基于流的图像修改，推理时无需外部验证器。", "type": "paper", "relTime": "2天前"}, {"id": 48, "title": "SentZero：面向多任务零样本胸部 X 光分析的句子级视觉语言预训练框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34479", "date": "2026-09-28T00:00:00.000Z", "summary": "SentZero 是一个句子级视觉语言预训练框架，用于零样本、多任务的胸部 X 光（CXR）分析。它通过基于 LLM 的摘要级句子结构化与映射扩大正样本对多样性，并新增损失项缓解临床等价句子造成的假阴性，同时对视觉嵌入做句子条件残差调制。在多个下游任务和数据集上，SentZero 提升了零样本泛化能力，优于此前的多任务零样本方法。", "type": "paper", "relTime": "2天前"}, {"id": 49, "title": "FlowTool：用流匹配控制图像修饰中的工具参数", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35673", "date": "2026-09-28T00:00:00.000Z", "summary": "FlowTool 将基于工具的图像修饰建模为流匹配问题，用条件整流流直接生成工具参数，由视觉语言模型骨干加 Diffusion Transformer 参数生成器组成，把高斯噪声转成编辑方案。", "type": "paper", "relTime": "2天前"}, {"id": 50, "title": "AnswerMap：从答案后验构建 VLM 的忠实空间可解释性方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35247", "date": "2026-09-28T00:00:00.000Z", "summary": "论文提出 AnswerMap，一种免训练、任务无关的黑盒方法，通过行列条带的是/否后验外积生成查询条件下的空间图，并可定义读取方式导出定位等连续输出。", "type": "paper", "relTime": "2天前"}, {"id": 51, "title": "Opus 5.5 一句话生成视频论文", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2104352205176500542", "date": "2026-09-27T23:27:17.000Z", "summary": "有意思，这是 Paul Graham《如何做出伟大的工作》的另一个版本  给 opus 5.5 一句简单提示词，配上\"extra\" effort 设置  同一个提示词：\"Create a video essay from Paul Graham\\'s essay How to do great work with punchy motion graphics, modern styling ...", "type": "paper", "relTime": "2天前"}, {"id": 52, "title": "中国救援机器人自主飞向溺水者", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2104293764068159775", "date": "2026-09-27T19:35:03.000Z", "summary": "🇨🇳 中国救援机器人：自主飞向溺水者。  飞行速度约 10–14 m/s（峰值约 30 mph），覆盖范围可达约 2 km / 1.2 英里，降落时为最多两名 80 kg 成年人提供浮力，随后自行返回。", "type": "paper", "relTime": "2天前"}, {"id": 53, "title": "Simon Willison 用 Opus 5.5 打造 Bluesky 回复机器人检测工具", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/27/bluesky-bot-check", "date": "2026-09-27T18:41:44.000Z", "summary": "Simon Willison 用 Opus 5.5 开发了一款 Bluesky 回复机器人检测工具，可分析任意 Bluesky 个人资料是否存在自动化回复机器人迹象。该工具会检测在他人发帖后数秒内回复、从不发布原创内容或图片链接、只回复高粉丝量用户，以及包含问号等信号。", "type": "tip", "relTime": "2天前"}, {"id": 54, "title": "OpenAI 修复 GPT-6 图像理解 bug", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2104252306447544447", "date": "2026-09-27T16:50:19.000Z", "summary": "我们修复了一个导致 GPT-6 Sol 和 GPT-6 Luna 图像理解能力下降的 bug。现在你在 API 和 Codex 中的视觉任务上应该能看到更好的结果，包括 computer use。", "type": "product", "relTime": "2天前"}, {"id": 55, "title": "OpenAI 修复 GPT-6 图像理解 bug", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2104252025978658890", "date": "2026-09-27T16:49:12.000Z", "summary": "我们修复了一个导致 GPT-6 Sol 和 GPT-6 Luna 图像理解能力下降的 bug。现在你在 API 和 Codex 中的视觉任务上应该能看到更好的结果，包括 computer use。", "type": "product", "relTime": "2天前"}, {"id": 56, "title": "斯坦福与 Caltech 用 GPT-6 Astra 直驱 Unitree G1 机器人整理陌生厨房", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/researchers-plug-gpt-6-astra-directly-into-a-robot-and-let-it-clean-up-an-unfamiliar-kitchen", "date": "2026-09-27T10:59:11.000Z", "summary": "斯坦福和 Caltech 构建了 HomeBody 系统，让 Unitree G1 机器人无需传统训练控制层，由可替换的 VLM（此处为 GPT Astra）直接调用抓取、导航、开抽屉等技能库，自主探索陌生厨房并完成整理和取物。", "type": "paper", "relTime": "2天前"}, {"id": 57, "title": "Google Research MSEB 教程：按基准契约编写声音编码器并跨四类评测打分", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/26/a-coding-guide-to-google-researchs-mseb-writing-sound-encoders-to-the-benchmark-contract-and-scoring-them-across-classification-clustering-retrieval-and-segmentation", "date": "2026-09-27T05:42:35.000Z", "summary": "该教程演示如何按 MSEB 的 MultiModalEncoder 抽象基类编写两个声音编码器，分别测量响度与音色，并在自生成合成音频上运行分类、聚类、检索和分割四类评测器。两个编码器在不同评测器下排名互换，用数字说明多任务基准的必要性。教程基于 mseb 0.1.0，全程 CPU 运行、无需下载数据集。", "type": "paper", "relTime": "2天前"}, {"id": 58, "title": "VQS：用程序验证实现视觉语言模型自进化，答案正确率提升至 94%", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33855", "date": "2026-09-27T00:00:00.000Z", "summary": "针对自进化视觉语言模型中多数投票标签 24%、模型评判标签 18% 出错的问题，研究者提出 VQS，让模型把图像解析为场景图、图表表格等结构化记录，由固定程序生成问题并计算答案，模型只逐条核验程序读取的短事实。", "type": "paper", "relTime": "3天前"}, {"id": 59, "title": "SciGen-Verifier：面向科学图像生成可解释验证的多模态推理器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33399", "date": "2026-09-27T00:00:00.000Z", "summary": "SciGen-Verifier 是一个用于科学图像生成可解释验证的多模态推理器，通过冷启动监督微调加课程式两阶段强化学习训练，在自建基准 SciGen-Verify 上性能可媲美更大的闭源模型。该基准覆盖指令遵循、多学科推理与世界知识，采用二值判断、解释与纠错编辑指令的三层协议。它还可作为在线 critic 用于图像的迭代修正。", "type": "paper", "relTime": "3天前"}, {"id": 60, "title": "DroneWAM：面向无人机视觉导航的高效世界动作模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33148", "date": "2026-09-27T00:00:00.000Z", "summary": "DroneWAM 是面向无人机视觉导航的高效世界动作模型，采用 JEPA 架构在表示空间中预测未来状态，避免显式生成未来图像，并用预训练 Resampler 压缩编码器特征以减少每个想象步的重复计算。在仿真数据集 DroneNav-6D 上，DroneWAM 取得对比方法中最佳轨迹精度，自适应 rollout 将平均预测深度从 8 降至 4.58，同时提升轨迹精度。", "type": "paper", "relTime": "3天前"}, {"id": 61, "title": "VGGT-Diff：融合视觉几何与扩散模型的稀疏视角新视角合成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33253", "date": "2026-09-27T00:00:00.000Z", "summary": "VGGT-Diff 将 VGGT-Ω 的视觉几何 latent 路由进预训练视频扩散模型，用于稀疏视角新视角合成。每个视觉 token 关联 3D 点和置信度，经置信度感知的 Visual Geometry Router（VGR）转为查询对齐的 latent 条件，Point-Track Residual Consistency（PTRC）沿可靠 3D 轨迹正则化预测残差。", "type": "paper", "relTime": "3天前"}, {"id": 62, "title": "SMAT：简单高效的合并感知训练方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33437", "date": "2026-09-27T00:00:00.000Z", "summary": "研究者提出 SMAT（Simple MAT），通过将常见模型合并操作归纳为 Scale、Mask、Perturb 三种，联合优化专家损失与模拟合并参数下的期望损失，并引入周期性调度、算子融合和参数存储切换，使每步仅需一次前向和一次反向传播。在四个语言与视觉语言骨干模型上，SMAT 将五种合并方法的平均分较各骨干最强基线提升 1.07-2.16 分，训练时间开销较标准微调不足 2%。", "type": "paper", "relTime": "3天前"}, {"id": 63, "title": "REALM：面向具身反应式聆听的由粗到细生成框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33095", "date": "2026-09-27T00:00:00.000Z", "summary": "REALM（Reactive Embodied Audio-driven Listening Model）是一个由粗到细的音频驱动反应式聆听框架，通过 Reactive Gated Speaker-Listener Fusion 模块结合聆听者动作历史与说话人音频，并用粗解码器预测基础动作轨迹、在表情子空间叠加音频条件随机残差。", "type": "paper", "relTime": "3天前"}, {"id": 64, "title": "VisionHOPE：将视觉骨干网络构建为自修改学习系统", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33325", "date": "2026-09-27T00:00:00.000Z", "summary": "VisionHOPE 提出首个将视觉骨干网络形式化为自修改学习系统的方案，让模型在单张图像内\"记住什么\"与\"如何学习\"协同演化。它基于 Nested Learning 的自指构造，用五个耦合记忆分别存储内容、生成 key/value 表示并控制学习率与保留率，并推导出稳定性匹配的步长控制方案以保证记忆动态非扩张。", "type": "paper", "relTime": "3天前"}, {"id": 65, "title": "Diffusion Reward Models：用扩散模型做奖励建模的 DRM 方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33803", "date": "2026-09-27T00:00:00.000Z", "summary": "研究者提出 DRM（Diffusion Reward Model），把奖励建模重构为对 p(r|x,y) 的条件密度估计：以冻结的 LLM 编码器为条件，用轻量 Diffusion Transformer 将高斯噪声去噪为奖励向量，从而不预设输出分布并自然刻画人类偏好的多模态结构。", "type": "paper", "relTime": "3天前"}, {"id": 66, "title": "Simon Willison 用 Claude Opus 5.5 生成鸮鹦鹉像素动画并用 Claude Code 录成视频", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/26/kakapo-party", "date": "2026-09-26T23:39:06.000Z", "summary": "Simon Willison 在 WeAreDevelopers World Congress North America 闭幕主题演讲前，用 Claude Opus 5.5 根据三张鸮鹦鹉照片生成至少 20 只鸮鹦鹉开派对的 HTML 5 canvas 像素动画页面。", "type": "tip", "relTime": "3天前"}, {"id": 67, "title": "Jeff Dean 转发 Claude 生成 Google 历史视频", "source": "X：Jeff Dean (@JeffDean)", "sourceUrl": "https://x.com/JeffDean/status/2103989340485624158", "date": "2026-09-26T23:25:23.000Z", "summary": "很自豪能与许多人合作完成其中的不少工作！  （引用 @deedydas）：claude 刚刚生成了一段关于 Google 历史的 2 分钟视频，效果简直太炸了", "type": "paper", "relTime": "3天前"}, {"id": 68, "title": "Claude Opus 5.5 一条提示词生成递归讲解视频", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2103888590854062435", "date": "2026-09-26T16:45:03.000Z", "summary": "Ethan Mollick 用一条提示词让 Claude Opus 5.5 生成了解释递归的视频，要求每次解释递归都切换截然不同的视频风格，做到自指、巧妙且节奏快，最终实现九次风格切换。他随后又测试了一个真正具有教育性的版本，认为效果相当惊艳：模型在保持多风格约束的同时，用有趣易懂的方式讲清了编程意义上的递归。", "type": "model", "relTime": "3天前"}, {"id": 69, "title": "brumar 开源 Claude Code 国际象棋复盘 Skill，结合 Stockfish 与思考录音生成解说视频", "source": "Hacker News：AI 热帖", "sourceUrl": "https://github.com/brumar/chess-postmortem-skills", "date": "2026-09-26T15:34:53.000Z", "summary": "作者 brumar 发布一套 Claude Code skills，将 lichess 对局结合 Stockfish 引擎生成可读的复盘报告和带旁白的解说视频。", "type": "tip", "relTime": "3天前"}, {"id": 70, "title": "Synthesia 为 TechCrunch 记者打造可对话的交互式数字分身", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/26/i-created-an-interactive-digital-avatar-of-myself-and-you-can-talk-to-it", "date": "2026-09-26T14:00:00.000Z", "summary": "Synthesia 为 TechCrunch 记者制作了一个交互式 AI 数字分身，仅基于其一篇关于风投背景创业公司欺诈的报道训练，只会回答与该报道相关的问题。", "type": "paper", "relTime": "3天前"}, {"id": 71, "title": "实测LibTV 1.5五大新功能，演示AI短剧工作流", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw==&mid=2247511963&idx=1&sn=a8046b9f44949b1eed69a7c149c2efdb&chksm=cf085362a48739b7257c3756c5eeab1133ff234b0c27312f978e54d53dd6872d5ceab88ca8ab&scene=126&sessionid=1790572572#rd", "date": "2026-09-26T09:00:00.000Z", "summary": "作者详细测试了LibTV 1.5版本的新功能，包括将Agent升级为TV Director、剧本原创及改编、角色造型室、导演执导、3D-BOX预演和创意片头。文章展示了从生成50集古装言情喜剧大纲、手动编辑剧本、使用角色造型室调整人物形象，到利用Seedance 2.5生成分镜、通过导演模式优化镜头以及用3D-BOX进行复杂运镜预演的完整流程，最终输出成片。", "type": "tip", "relTime": "3天前"}, {"id": 72, "title": "用 AugLy 构建图像、文本、音频多模态数据增强与对抗鲁棒性基准教程", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/26/end-to-end-multimodal-data-augmentation-and-adversarial-robustness-benchmark-with-augly-for-images-text-audio-and-pytorch", "date": "2026-09-26T07:22:46.000Z", "summary": "本教程基于 AugLy 构建覆盖图像、文本、音频的端到端多模态数据增强与鲁棒性工作流。教程解决依赖兼容问题，生成确定性合成数据集，演示 AugLy 的函数式与类式 API。", "type": "tip", "relTime": "3天前"}, {"id": 73, "title": "微星推出 MS-C9ZA 无风扇边缘 AI 盒子，基于 Jetson Orin Nano 8GB", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/344.htm", "date": "2026-09-26T05:37:03.000Z", "summary": "微星推出 MS-C9ZA 边缘 AI 盒子，基于 NVIDIA Jetson Orin Nano 8GB 模组，可在端侧执行 AI 推理与计算机视觉处理，面向机器人、智能制造等场景。", "type": "paper", "relTime": "3天前"}, {"id": 74, "title": "作者分享用 logprobs 读取 LLM 选项概率的单函数封装，并扩展到视觉模型", "source": "Hacker News：AI 热帖", "sourceUrl": "http://allanrbo.blogspot.com/2026/09/a-jev-like-wrapper-for-llms-including.html", "date": "2026-09-26T04:20:58.000Z", "summary": "作者受 Jev 及 OpenJev、SemIf 启发，实现了一个单函数封装：让 LLM 只生成一个选项字母，再读取 top_logprobs 得到各选项概率。", "type": "tip", "relTime": "3天前"}, {"id": 75, "title": "Claude Opus 5.5 生成递归解释视频", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2103688362960019567", "date": "2026-09-26T03:29:25.000Z", "summary": "你怎么解释递归？这个挺有意思的。  我让 Claude Opus 5.5 做了：\"一个解释递归的视频，其中每一段关于递归的解释都采用截然不同的视频风格，要让它自我指涉、巧妙且节奏明快。\"  九次风格切换，一个提示词……", "type": "paper", "relTime": "3天前"}, {"id": 76, "title": "NVIDIA 开源 MONAI Physio 医学影像数字孪生", "source": "X：小北 (@frxiaobei)", "sourceUrl": "https://x.com/frxiaobei/status/2103672371991249071", "date": "2026-09-26T02:25:52.000Z", "summary": "NVIDIA 在 MICCAI 2026 开源 MONAI Physio，可从 3D 和 4D 医学影像生成个性化的心脏与呼吸数字孪生，模拟心跳与肺部运动。该工具属于开源 Project MONAI 工具包，面向研究人员用于仿真、可视化和可复现研究。", "type": "model", "relTime": "3天前"}, {"id": 77, "title": "FlashForward：用飞行中 KV Cache 与干净锚点加速自回归视频扩散", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.32540", "date": "2026-09-26T00:00:00.000Z", "summary": "FlashForward 直接复用当前 chunk 去噪前向中已算出的 in-flight KV cache，省去为更新缓存而做的额外前向，并生成稀疏的干净锚点 latent 以稳定生成轨迹。", "type": "paper", "relTime": "4天前"}, {"id": 78, "title": "LT-OPD：用在线策略自蒸馏实现极端视觉 token 压缩", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.32353", "date": "2026-09-26T00:00:00.000Z", "summary": "针对多模态大模型在极低视觉 token 预算下性能骤降的问题，研究者提出训练框架 LT-OPD，让仅保留少量视觉 token 的学生模型在自己生成的轨迹上接受冻结全 token 教师模型的分布监督，并引入逐步降低 token 预算的课程。", "type": "paper", "relTime": "4天前"}, {"id": 79, "title": "Liquid AI 发布 LFM2.5-VL-3B-DSpark 投机解码草稿模型，解码最高提速 3.13 倍", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/25/liquid-ai-releases-lfm2-5-vl-3b-dspark-speculative-decoding-for-vision-language-models-with-up-to-3-13x-faster-decoding", "date": "2026-09-25T23:11:59.000Z", "summary": "Liquid AI 发布 LFM2.5-VL-3B-DSpark，一个为其视觉语言模型 LFM2.5-VL-3B 设计的实验性投机解码草稿模型，新增约 279.5M 参数（+8.9%），在 Apple silicon 上解码最高提速 3.13 倍，NVIDIA H100 上最高 2.66 倍。", "type": "model", "relTime": "4天前"}, {"id": 80, "title": "Meta 开放 Muse 新功能抢先体验申请", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/25/meta-opens-early-access-program-for-new-muse-features", "date": "2026-09-25T20:34:53.000Z", "summary": "Meta 在 Connect 2026 开发者大会公布 Muse AI 应用多项新功能后，于周五开放抢先体验申请，用户可让 Muse 代为提交申请加入名单。新功能包括可与 Muse 数字分身视频通话、更多购物合作与连接器、扩展 Muse Mac 应用使其能操作电脑完成任务，以及将 Muse 引入 Meta AI 眼镜，用户可通过唤醒词语音交互。", "type": "paper", "relTime": "4天前"}, {"id": 81, "title": "Pexo 将研究自动生成 30 秒视频", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2103575986772070862", "date": "2026-09-25T20:02:52.000Z", "summary": "花数小时研究微软的崛起。  5 分钟把研究喂给 Pexo。  10–15 分钟后，一条完成的 30 秒视频。  真正让我惊讶的是拼贴效果。Pexo 拿过研究内容，围绕它构建了整套视觉处理——抠图、贴纸、辅助图像，全部都有。没有任何东西像是随机加进去的。一切都跟着故事走。而且这还是第一次尝试。  如果你做历史或解说类内容，我觉得工作流刚刚变了。@Pexoai_offical", "type": "paper", "relTime": "4天前"}, {"id": 82, "title": "Qwen 团队发布 Qwen3.8-Omni-Flash 报告：面向原生全模态智能体", "source": "X：DAIR.AI (@dair_ai)", "sourceUrl": "https://x.com/dair_ai/status/2103573552611926373", "date": "2026-09-25T19:53:12.000Z", "summary": "Qwen 团队发布报告，介绍 Qwen3.8-Omni-Flash，一个原生多模态模型，面向跨文本、音频和视频的长程智能体任务，如视频编辑和长音频视频翻译。模型采用 Qwen3.8-Next 的稀疏 MoE 架构，上下文窗口达一百万 token，并通过协同训练策略在保持文本性能的同时将智能体能力迁移到音频和视频任务。", "type": "paper", "relTime": "4天前"}, {"id": 83, "title": "Suno 发布新曲《Take Me Back》", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2103563987963011148", "date": "2026-09-25T19:15:11.000Z", "summary": "《Take Me Back》现已在 Suno 上线。由 Braylon Browner 赋予生命，音乐视频由同为编舞师的 Nina McNeely 执导，他们的合作从舞蹈到歌曲，再到围绕 Braylon 的动作打造的完整世界。  音乐使用 v6 创作，并在 Studio 2.0 中完成。", "type": "paper", "relTime": "4天前"}, {"id": 84, "title": "Qwen 团队发布 Qwen3.8-Omni-Flash 全模态智能体模型报告", "source": "X：DAIR.AI (@dair_ai)", "sourceUrl": "https://x.com/dair_ai/status/2103563695381209417", "date": "2026-09-25T19:14:01.000Z", "summary": "Qwen 团队发布 Qwen3.8-Omni-Flash 报告，这是一个原生多模态模型，面向跨文本、音频和视频的长时程智能体任务，如视频编辑和长音频视频翻译。模型沿用 Qwen3.8-Next 的稀疏 MoE 架构，上下文窗口为 100 万 token，并通过协同训练策略在保持文本性能的同时把智能体能力迁移到音频和视频任务。", "type": "paper", "relTime": "4天前"}, {"id": 85, "title": "Google 发布 Gemini 3.8 Flash TTS 等多项更新", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2103552111233343980", "date": "2026-09-25T18:28:00.000Z", "summary": "Google 本周发布 Gemini 3.8 Flash TTS 与 Gemini 3.8 Flash-Lite TTS 两款音频生成模型，并推出 Gemini 3.8 Live with Live Avatar，为对话式 AI 带来近实时视觉形象。", "type": "model", "relTime": "4天前"}, {"id": 86, "title": "Perceptron Mk1.5 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2103545324598091781", "date": "2026-09-25T18:01:02.000Z", "summary": "来自 @perceptroninc 的 Perceptron Mk1.5 已在 OpenRouter 上线。  这是 Perceptron 面向物理智能体的具身推理模型。它接受文本、图像、视频和音频输入，可以用点、框、多边形和视频片段配合文本作答。", "type": "model", "relTime": "4天前"}, {"id": 87, "title": "Claude Opus 5.5 接入 Runway MCP", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2103540433225908447", "date": "2026-09-25T17:41:35.000Z", "summary": "Claude Opus 5.5 遇上 Runway MCP。  将 Runway 直接接入 Claude，即可用 Gen-4.5、Seedance 2.5、GPT Image 2、Kling 等生成精美图像和视频，就在你的工作环境中完成。几秒即可通过下方链接接入。", "type": "paper", "relTime": "4天前"}, {"id": 88, "title": "Suno v6 将舞蹈动作变成音乐", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2103537899509596376", "date": "2026-09-25T17:31:31.000Z", "summary": "对 @braylonbrowner 来说，动作不只是跟随音乐，而是音乐的起点。  看他如何用 v6 把自己的动作变成一首歌，并将编舞过程推向意想不到的地方。  Make what moves you.  观看他的首支音乐视频，由 Nina McNeely 执导：https://suno.com/braylon", "type": "paper", "relTime": "4天前"}, {"id": 89, "title": "NaceAI 发布 Drex 决策模型，输出选项概率", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2103523705603461145", "date": "2026-09-25T16:35:07.000Z", "summary": "NaceAI 推出 Drex，一个 sub-6B 决策模型，不生成文本而是直接输出各选项概率，一次前向即可完成，面向智能体路由、工具选择、重排序与策略检查等场景。Drex 采用小型扩散模型加 RLAF 架构，定价 $0.04/1M input tokens，延迟低于 1 秒，在 Decision Index 上排名 #1，40 项 benchmark 中赢下 23 项，开放权重与技术报告即将发布。", "type": "model", "relTime": "4天前"}, {"id": 90, "title": "Perceptron 发布 35B 具身智能体模型 Mk1.5，请求完成速度最高提升 4.7 倍", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2103518305864839197", "date": "2026-09-25T16:13:40.000Z", "summary": "Perceptron 发布 35B 具身智能体模型 Mk1.5，可控制无人机、四足机器人、智能眼镜，并调度子智能体，无需平台特定重训练。模型针对 egocentric 视频训练，启用网页搜索、页面阅读、反向图搜和缩放工具后，MMSearch F1 从 18.2 升至 54.3；官方数据显示端到端延迟最高较 Mk1 快 4.7 倍（Chat 从 5.2 秒降至 1.1 秒）。", "type": "model", "relTime": "4天前"}, {"id": 91, "title": "Suno v6 将舞蹈动作变成歌曲", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2103515732688486494", "date": "2026-09-25T16:03:26.000Z", "summary": "对 Braylon Browner 来说，动作不只是跟随音乐，而是音乐的起点。  看他如何用 v6 把自己的动作变成一首歌，并将编舞过程推向意想不到的地方。  Make what moves you.  观看由 Nina McNeely 执导的他的首支音乐视频：https://suno.com/braylon", "type": "paper", "relTime": "4天前"}, {"id": 92, "title": "新一代梅赛德斯-迈巴赫 S 级轿车上市：搭载 MB.OS 与 Momenta R7 世界模型，139.8 万元起", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/102.htm", "date": "2026-09-25T03:02:39.000Z", "summary": "新一代梅赛德斯-迈巴赫 S 级轿车上市，售价 139.8 万元起，S 680 顶配为 335.3 万元。新车首度搭载梅赛德斯-奔驰 MB.OS 架构与最新一代智能人机交互系统，应用端侧多模态 VLM 大模型，并成为率先搭载 Momenta R7 世界模型的豪华燃油车，未来可通过 OTA 远程升级。其全新城区及高速领航辅助驾驶系统在中国实现车位到车位辅助驾驶与智能辅助泊车。", "type": "model", "relTime": "4天前"}, {"id": 93, "title": "Runway GWM Worlds 2 与 WorldPrompt：实时交互世界模型的工程解读", "source": "Latent Space（RSS）", "sourceUrl": "https://www.latent.space/p/runway", "date": "2026-09-25T01:30:57.000Z", "summary": "Runway 本月推出研究预览版 GWM Worlds 2，将高保真视频和音频生成变为实时交互模拟，以 720p、24 fps 连续视频和 48,000 Hz 音频流式输出，并新增 WorldPrompt 输入格式，可固定环境部分方面并通过带时间戳的事件控制角色、相机和场景。", "type": "tip", "relTime": "4天前"}, {"id": 94, "title": "BestBlogs 早报 · 09-25：Every 实验室机制 / 原子声明验证 / Claude 代码现代化 / RoboFlywheel", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2103287093208502680", "date": "2026-09-25T00:54:54.000Z", "summary": "阿里巴巴发布 RoboFlywheel 开放式仿真基础设施，提供超百万级刚体、铰链与柔性资产，支持机器人交互与闭环训练。腾讯混元发布图像生成模型 Hy Image3.5 preview，综合能力较上代提升约 30%，2K 出图定价 0.15 元/张，已接入元宝、ima、WorkRally 等产品。", "type": "model", "relTime": "4天前"}, {"id": 95, "title": "利用预训练扩散模型和多模态条件增强摄影测量数字表面模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.31199", "date": "2026-09-25T00:00:00.000Z", "summary": "该研究提出一种改进的 Stable Diffusion 3 架构，通过同时以摄影测量 DSM 和 Pléiades 卫星图像作为条件，对垂直配准的数字表面模型进行细化。实验表明，这种多模态条件方法能显著提升高程精度，在法国城市测试中，密集城区的 RMSE 从 6.00 米降至 3.45 米（上下文城市）及 2.76 米（留出城市）。", "type": "paper", "relTime": "5天前"}, {"id": 96, "title": "TRACE：流式视频理解的时序审计与条件感知评估框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.30670", "date": "2026-09-25T00:00:00.000Z", "summary": "论文提出 TRACE 基准，旨在解决现有流式视频理解评估中忽略证据时效性、历史维护及响应触发机制的问题。该框架通过统一因果协议控制信息可用性，并多维报告答案质量、及时性、负载等指标。在 1240 条记录上的实验显示，相似的 QA 准确率可能掩盖系统在完成度、生成负载及主动响应行为（如误报、漏报）上的巨大差异，强调应将性能视为执行条件下的系统行为而非单一分数。", "type": "paper", "relTime": "5天前"}, {"id": 97, "title": "FuseReg：正则化层融合缓解表征自编码器的重建-生成差距", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.31620", "date": "2026-09-25T00:00:00.000Z", "summary": "FuseReg 用随机编码器层子集训练替代启发式层融合，在 ImageNet-256 与 DINOv3-L 上，单个解码器无需重训即可从全层、稀疏和单层融合中重建，PSNR 高于固定融合的专用解码器。仅替换解码器即使未改动的 RAEv2 DiT-XL 生成器无引导 gFID 降低 27%，联合正则化两阶段在 DiT-Base 上降低 29%。", "type": "paper", "relTime": "5天前"}, {"id": 98, "title": "InternW0-Δ：用 2 万小时开放数据打通预测动态与动作的世界动作模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.31394", "date": "2026-09-25T00:00:00.000Z", "summary": "InternW0-Δ 是一个统一的世界动作模型（WAM），在 Mixture-of-Transformers 框架下结合预训练视频专家、动作专家与冻结 VLM 的语义引导，并通过训练期蒸馏注入 4D 几何与运动先验。", "type": "model", "relTime": "5天前"}, {"id": 99, "title": "Claude Opus 5.5 一次生成动漫风短视频", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2103272686570918334", "date": "2026-09-24T23:57:40.000Z", "summary": "Ethan Mollick 让 Claude Opus 5.5 把同一条消息改造成面向动漫爱好者的社交媒体短视频，一次生成即完成。此前他让 Claude 自选一个着迷的谜题并尽力解决、再做成可分享的影片，Claude 尝试破解伏尼契手稿失败后，转而制作了这段兼具趣味与科普性的影片。", "type": "paper", "relTime": "5天前"}, {"id": 100, "title": "Runway 评估 Model Router 图像转视频", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2103234985637679441", "date": "2026-09-24T21:27:51.000Z", "summary": "在 250 个图像转视频提示词上，我们评估了 Model Router 相较于 SOTA 模型基线，如何降低成本并保持生产可用性。请通过下方链接阅读更多内容。", "type": "model", "relTime": "5天前"}, {"id": 101, "title": "Google 为 Gemini 3.8 Live 推出 Live Avatar 实时数字人", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/1000328/google-gemini-ai-live-avatar-face", "date": "2026-09-24T19:59:26.000Z", "summary": "Google 在 Gemini 3.8 Live 更新中推出 Live Avatar，可在对话中实时口型同步并呈现不同面部表情，目前仅面向 Gemini Enterprise 客户开放。该功能支持 97 种语言切换且不降低视频保真度或产生视觉漂移，还能在说话时调出屏幕信息。Google 同时提供预设头像库并允许企业自建，输出带有不可见 SynthID 水印及身份保护措施。", "type": "paper", "relTime": "5天前"}, {"id": 102, "title": "Pruna 发布 Qwen-Image-2.1 少步数 LoRA 适配器，图像生成提速至 6.3 倍", "source": "X：AK (@_akhaliq)", "sourceUrl": "https://x.com/_akhaliq/status/2103201617004949888", "date": "2026-09-24T19:15:15.000Z", "summary": "Pruna-Qwen-Image-2.1 是一组少步数 LoRA 适配器，可将 Qwen-Image-2.1 的图像生成与编辑速度提升至多 6.3 倍。生成或编辑图像只需 5 或 8 步而不用 40 步，选 5 步追求最快速度，选 8 步兼顾效果与速度。HF 工作流：https://huggingface.co/spaces/akhaliq/Pruna-Qwen-Image-2.1", "type": "paper", "relTime": "5天前"}, {"id": 103, "title": "新泽西州对 DataOne 数据中心处以 110 万美元罚款，62 台燃气发电机被卫星图像曝光", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/tech-policy/2026/09/new-jersey-fines-data-center-1-1m-after-satellite-pics-expose-62-gas-generators", "date": "2026-09-24T18:20:58.000Z", "summary": "新泽西州对 DataOne 位于 Vineland 的数据中心处以 110 万美元罚款，因其违反空气污染控制法秘密安装并运行 62 台燃气发电机，其中 45 台在运行。", "type": "industry", "relTime": "5天前"}, {"id": 104, "title": "Meta 推出 Horizon Create 和 Horizon Studio，用 AI 提示词在手机上做游戏", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/games/999972/meta-horizon-create-studio-ai-games", "date": "2026-09-24T17:52:29.000Z", "summary": "Meta 宣布两款 AI 游戏开发工具：移动端应用 Horizon Create 和浏览器端应用 Horizon Studio，均支持用 AI 提示词生成 2D 或 3D 移动游戏，包含进度系统、难度平衡、美术方向和多人玩法，目前以早期访问形式开放候补名单。", "type": "paper", "relTime": "5天前"}, {"id": 105, "title": "Space Bunny 模型视觉与 3D 生成实测", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2103174241654837649", "date": "2026-09-24T17:26:28.000Z", "summary": "Elvis Saravia 测试了 Space Bunny 模型，其在 OpenCode 中免费开放一周，支持 1M token 上下文窗口和图像输入。该模型视觉理解与设计能力出色，能自我验证工作成果，可从草图生成完整落地页、3D 模型、动画和可玩游戏。作者推荐将其用于图像转代码、交互原型和 3D 创意编程。", "type": "model", "relTime": "5天前"}, {"id": 106, "title": "Black Forest Labs 发布开源机器人模型 FLUX 3 Action", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/black-forest-labs-launches-flux-3-action-an-open-robotics-ai-model", "date": "2026-09-24T17:01:03.000Z", "summary": "Black Forest Labs 发布面向机器人的开源模型 FLUX 3 Action，基于以视频数据训练的多模态 FLUX 3，可从机器人工作区的多机位视频预测智能体下一步动作及环境变化。BFL 称其仅 70 亿参数即在 RoboLab-120 排行榜创下成功率纪录，体积不到此前最佳开源模型一半，运行最快快至 3.95 倍；模型权重已上架 Hugging Face。", "type": "model", "relTime": "5天前"}, {"id": 107, "title": "Google 发布 Gemini 3.8 Live with Live Avatar，为对话 AI 带来实时视觉形象", "source": "Google DeepMind：Blog（RSS）", "sourceUrl": "https://deepmind.google/blog/introducing-gemini-38-live-with-live-avatar", "date": "2026-09-24T16:20:39.000Z", "summary": "Google DeepMind 推出 Gemini 3.8 Live with Live Avatar，将低延迟流式视频与实时对话能力原生结合，让 AI 具备能听、能看、能说的动态视觉形象，即日起在 Gemini Enterprise 可用。", "type": "paper", "relTime": "5天前"}, {"id": 108, "title": "Odyssey 发布多智能体世界模型 Agora-2，支持最多 20 个人类与智能体实时共享模拟环境", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2103151581810000240", "date": "2026-09-24T15:56:26.000Z", "summary": "Odyssey 推出下一代多智能体世界模型 Agora-2，支持最多 20 个人类与智能体在共享环境中实时交互，多人研究预览现已开放体验。作者 Elvis Saravia 评价称，这类世界模型可用于共同训练机器人、自动驾驶和网络安全防御智能体，各方在交互中相互提升，也为研究智能体串谋提供了安全环境。", "type": "model", "relTime": "5天前"}, {"id": 109, "title": "Liquid AI 发布 LFM2.5-VL-DSpark 视觉语言 drafter 模型，边缘端解码最高提速 3.13 倍", "source": "Liquid AI 模型与工程博客（网页）", "sourceUrl": "https://www.liquid.ai/blog/lfm2-5-vl-dspark", "date": "2026-09-24T14:42:04.258Z", "summary": "Liquid AI 为视觉语言模型 LFM2.5-VL-3B 发布实验性 DSpark drafter 模型，参数约 280M，仅增加 8.9% 参数量。GPU 上解码吞吐最高提升 2.66 倍、边缘设备 3.13 倍，端到端分别最高 2.27 倍和 2.62 倍；模型已上架 Hugging Face，支持 llama.cpp、SGLang 和 MLX-VLM。", "type": "model", "relTime": "5天前"}, {"id": 110, "title": "Liquid AI 发布 LFM2.5-VL-DSpark 视觉草稿模型加速 VLM 推理", "source": "Hugging Face：Blog（RSS）", "sourceUrl": "https://huggingface.co/blog/LiquidAI/lfm2-5-vl-dspark", "date": "2026-09-24T14:08:57.000Z", "summary": "Liquid AI 在 Hugging Face 发布面向视觉语言模型 LFM2.5-VL-3B 的实验性 DSpark 草稿模型，通过投机解码在不改变输出质量的前提下换取推理加速。", "type": "model", "relTime": "5天前"}, {"id": 111, "title": "Meta 发布多款 AI 眼镜并宣布 Muse 助手将登陆眼镜", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/09/meta-puts-its-ai-assistant-on-a-keychain", "date": "2026-09-24T14:03:38.000Z", "summary": "Meta 发布多款 Ray-Ban 新款眼镜，其中无摄像头款仅支持音频交互，另推出售价 1,300 美元、比 Quest 3 轻五倍的新 VR 眼镜，明年春季上市。Muse 助手将登陆眼镜，用户可在视频通话中以超写实数字分身代替面部出镜，但 Muse 已出现可被黑客接管智能体的漏洞并遭 Amazon 封锁访问其购物平台。", "type": "paper", "relTime": "5天前"}, {"id": 112, "title": "Waymo 公布 2.71 亿英里自动驾驶数据：严重事故比人类驾驶员少 95%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/015.htm", "date": "2026-09-24T13:24:34.000Z", "summary": "Waymo 公布其 Robotaxi 在亚特兰大、奥斯汀、菲尼克斯、洛杉矶和旧金山累计 2.71 亿英里无人驾驶里程的分析结果：致重伤及以上事故的概率比人类驾驶员低 95%，致轻伤事故低 82%，致伤事故比按人类事故率推算的少 841 起。", "type": "tip", "relTime": "5天前"}, {"id": 113, "title": "商汤 Seko 生成中秋 AI 视频", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2103064260121346289", "date": "2026-09-24T10:09:27.000Z", "summary": "🌕 这个中秋节，我们分享一支用商汤视频创作智能体 #Seko 制作的精美 AI 视频。它出自成都 AI 创作者陈爱军之手。  这位眼镜店店主自学 AI，已制作 200 多支 AI 视频，积累了超过 60 万粉丝。  愿想象力在中秋明月下起飞。✨", "type": "paper", "relTime": "5天前"}, {"id": 114, "title": "火种说｜给 Agent 做完大扫除，MiniCPM5-2B 把考研数学一做对了", "source": "公众号：面壁智能（MiniCPM）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3Mzg2MTg2NQ%3D%3D&mid=2247499342&idx=2&sn=b2c4db4849321c1afafd5030c76331c4", "date": "2026-09-24T07:00:37.000Z", "summary": "开发者在 M4 16GB 设备上基于 OpenHanako 框架适配 MiniCPM5-2B（本地 MLX 8bit 量化推理），通过裁剪 Computer Use、社交平台接入、图片视频生成等功能并新增 MiniCPM XML tool adapter，将工具面收缩到 11 个基础工具，解决了 2B 模型工具调用时的格式污染与指令漂移问题。", "type": "model", "relTime": "5天前"}, {"id": 115, "title": "高通携手 PrismML 发布 1-bit Bonsai 视觉模型，可在骁龙 AR1 Gen 1 智能眼镜上本地运行", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/006/772.htm", "date": "2026-09-24T06:34:07.000Z", "summary": "在 2026 骁龙峰会上，高通与 PrismML 发布 1-bit 量化 Bonsai 视觉语言模型，基于 Bonsai 1.7B 构建，可在骁龙 AR1 Gen 1 智能眼镜平台本地运行 20 亿参数模型。官方称相同内存下可容纳约 4 倍参数，内存占用约为传统 4-bit 模型的 1/4，文本 Token 生成速度翻倍，识图、翻译、环境问答等交互可离线完成，同时降低功耗、改善续航与发热。", "type": "model", "relTime": "5天前"}, {"id": 116, "title": "火山引擎对话《后西游记》主创，揭秘首部AI长剧登陆湖南卫视黄金档", "source": "公众号：火山引擎", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI0NzU1NzI5NQ%3D%3D&mid=2247544696&idx=1&sn=eb490357aa03d3f5655fa9fbe00a0606", "date": "2026-09-24T05:40:51.000Z", "summary": "国内首部AI长剧《后西游记》8月31日登陆湖南卫视黄金档，60集规划、每集约40分钟，全剧无摄影机拍摄，视频生成100%由 Seedance 实现，上线一周芒果TV正片播放量突破1.5亿次。剧集由芒果TV出品、伯璟文化承制，依托芒果灵创平台，5月立项到播出仅半年、制作周期3个月；总导演李东珅以一场动作戏为例，小组制作耗时10天、成本约十几万元，真人实拍则可能需300至400万元。", "type": "tip", "relTime": "5天前"}, {"id": 117, "title": "MiniMax-H3 登陆 AMD MI355X，推理提速 26.7 倍", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2102993504041599271", "date": "2026-09-24T05:28:17.000Z", "summary": "Nunchux 将 MiniMax 的 MiniMax-H3 部署到 AMD MI355X，在 8 块 GPU 上推理速度最高达 SGLang 的 26.7 倍，5 秒视频仅需 1.3 秒生成。借助流式生成，用户可在视频播放过程中修改提示词来引导后续画面。MiniMax-H3 免费访问即将开放，现已开放 waitlist。", "type": "paper", "relTime": "5天前"}, {"id": 118, "title": "刷着满屏的炸裂 AI 视频，我似乎发现了一个 AI 完不成的视频生成任务死角： “左手六，右手七，左脚画圆，右脚踢” 的脑血栓走路方式。 你们可以试试, 试成功了告诉我，反正我是没有成功。", "source": "X：马东锡 NLP (@dongxi_nlp)", "sourceUrl": "https://x.com/dongxi_nlp/status/2102990286443917550", "date": "2026-09-24T05:15:30.000Z", "summary": "刷着满屏的炸裂 AI 视频，我似乎发现了一个 AI 完不成的视频生成任务死角：  “左手六，右手七，左脚画圆，右脚踢” 的脑血栓走路方式。  你们可以试试, 试成功了告诉我，反正我是没有成功。", "type": "paper", "relTime": "5天前"}, {"id": 119, "title": "元宝上线旅游计划 Agent：切换专家模式，一句话生成可交互行程卡", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/crossing/this-mid-autumn-and-national-day-holiday-cut-yourself-some-s", "date": "2026-09-24T01:00:00.000Z", "summary": "元宝在节前更新上线旅游计划 Agent，用户在元宝 APP 对话中切换到专家模式即可触发，输入需求后自动搜索实时信息并生成可视化行程卡。该行程卡支持滑动查看、切换地图标注，还可调用混元最新生图模型 Hy Image3.5 preview 生成攻略图，并支持对话迭代修改行程。", "type": "model", "relTime": "5天前"}, {"id": 120, "title": "蚂蚁 inclusionAI 开源 Ming-Image-0.1-Design 登顶 UI/UX 设计榜", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2102917486027079957", "date": "2026-09-24T00:26:13.000Z", "summary": "蚂蚁集团旗下 inclusionAI 发布 6B 参数文生图模型 Ming-Image-0.1-Design，以 MIT 协议开源权重，支持 RGBA 透明背景输出，面向 UI、信息图、海报等富文本视觉设计。", "type": "model", "relTime": "5天前"}, {"id": 121, "title": "RGBD20K：大规模 RGB-D 语义分割基准数据集", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.29028", "date": "2026-09-24T00:00:00.000Z", "summary": "RGBD20K 是一个包含 20000 对 RGB-D 图像、覆盖 160 个细粒度类别的 RGB-D 语义分割数据集，类别数远超 NYUv2 的 40 类和 SUN RGB-D 的 37 类。该数据集对已有标注进行了严格重评与修正，以解决长期存在的标注噪声问题。作者同时提出 score-purified fusion（SPF）方法，在所有评测基准上取得 SOTA 性能。", "type": "paper", "relTime": "6天前"}, {"id": 122, "title": "AV-GRPO：面向音视频联合生成的模态锚定解耦扩散强化学习框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.29816", "date": "2026-09-24T00:00:00.000Z", "summary": "AV-GRPO 是一个模态锚定的在线扩散强化学习框架，通过模态锚定 rollout、轨迹锁定冻结塔优化和自适应目标，将耦合的多模态偏好学习拆解为单模态子问题，用于音视频联合生成。配套的 5DAV 数据集在五个维度上解耦样本以支持系统化训练。在 JavisBench 和 VABench 上，AV-GRPO 在 LoRA 与全量微调下于生成质量、语义对齐和跨模态同步方面均优于 LTX-2.3。", "type": "paper", "relTime": "6天前"}, {"id": 123, "title": "WanPE：面向现代文生视频的电影级提示词增强", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.30221", "date": "2026-09-24T00:00:00.000Z", "summary": "WanPE 是一个 397B 参数的提示词增强模型，基于 1.05M 真实视频训练，通过镜头级电影化规划与 SC-GRPO 保持跨镜头语义一致。驱动 Wan3.0 时，它将 5-15 秒人类偏好提升 10.66-18.84 分，30 秒场景提升 50.86 分。团队还构建了覆盖 5 至 30 秒、约 11K 盲测对比的 WanPEval 基准。", "type": "model", "relTime": "6天前"}, {"id": 124, "title": "World Action Agent：用 VLM 通过世界动作排练操控机器人", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.29964", "date": "2026-09-24T00:00:00.000Z", "summary": "World Action Agent（WAA）是一个多智能体框架，让 VLM 借助基础工具在视觉动作工作区中直接操控机器人，工作区具备接触视图、动作排练与视图内校正三项特性。", "type": "paper", "relTime": "6天前"}, {"id": 125, "title": "ViRDM：无需教师与判别器的少步因果视频生成表示分布匹配", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.28923", "date": "2026-09-24T00:00:00.000Z", "summary": "ViRDM 提出一种无需教师模型和在线判别器的视频后训练方法，将表示分布匹配（RDM）迁移到少步因果视频生成，通过随机截断 clean-exit 监督、轻量 VAE 解码器和分阶段 vector-Jacobian 乘积解决显存瓶颈。仅需 20 次生成器更新，该方法在官方 VBench 上达到 84.87 分，超过此前最佳少步因果基线 0.36 分，训练消耗 16 A100 GPU-hours。", "type": "model", "relTime": "6天前"}, {"id": 126, "title": "TrackEverything：突破长视频稠密3D点追踪的显存瓶颈", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.30222", "date": "2026-09-24T00:00:00.000Z", "summary": "TrackEverything提出一种新的3D点追踪模型，通过去重3D场景表示解决稀疏长时与稠密短时追踪的权衡问题。该模型利用体素化去重、端点细化器及3D WAFT技术，将模型复杂度与视频时长解耦。它是首个能在40GB显存内对超过1000帧视频进行全可见点追踪的3D追踪器，在TAPVid-3D基准上表现优于现有开源稠密追踪器。", "type": "paper", "relTime": "6天前"}, {"id": 127, "title": "LightMIS：无需逐级解码器的超轻量医学图像分割网络", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.28327", "date": "2026-09-24T00:00:00.000Z", "summary": "LightMIS 是一族用于 2D 二值医学图像分割的超轻量卷积网络，无需学习式逐级解码器，通过 Scale-Aligned Projection 对齐五级编码器输出并一次性聚合，再用 Adaptive Fusion Cascade 精炼。", "type": "paper", "relTime": "6天前"}, {"id": 128, "title": "Rolling-WAM：带滚动想象的世界动作模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.30247", "date": "2026-09-24T00:00:00.000Z", "summary": "Rolling-WAM 将视频-动作联合去噪分散到连续的重规划周期中，通过滑动窗口在不同噪声水平上维护视频-动作块，每步完整去噪即将执行的动作块、部分精炼更远的未来块。在 LIBERO、RoboTwin 和真实 Unitree G1 人形机器人上，该方法取得有竞争力的操作性能，相比标准联合 WAM 实现 4.5 倍稳态重规划加速。", "type": "paper", "relTime": "6天前"}, {"id": 129, "title": "Qwen3.8 Max Prime 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2102875655004385401", "date": "2026-09-23T21:40:00.000Z", "summary": "来自 @Alibaba_Qwen 的 Qwen3.8 Max Prime 已在 OpenRouter 上线。  这是 Qwen3.8 Max 的高吞吐量变体，具备相同的 2.4T 参数旗舰能力：1M 上下文，文本、图像和视频输入，可调推理强度的推理，工具调用，以及结构化输出。  在此使用：https://openrouter.ai/qwen/qwen3.8-max-prime", "type": "paper", "relTime": "6天前"}, {"id": 130, "title": "Claude 一次生成完整音乐视频", "source": "X：Thariq (@trq212)", "sourceUrl": "https://x.com/trq212/status/2102870353781641416", "date": "2026-09-23T21:18:56.000Z", "summary": "用户给 Claude 一段约 1 万字符的提示词，包含技能、示例和 API key，要求它独立完成一支\"Claude Pop\"歌曲音乐视频的端到端重制。任务要求保留原音轨，用 JavaScript 动画呈现歌词，并调用 ElevenLabs API 做音效设计、用图像生成 API 制作角色设定与场景，再以 seedance 2.5 生成视频素材。", "type": "product", "relTime": "6天前"}, {"id": 131, "title": "YouTube 承诺今年晚些时候推出自定义信息流及更多 AI 功能", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/gadgets/2026/09/youtube-promises-custom-feeds-and-a-lot-more-ai-later-this-year", "date": "2026-09-23T19:35:53.000Z", "summary": "YouTube 在 Made on YouTube 活动上宣布将推出 Custom Feeds，用户输入描述即可生成自定义内容标签页并保存多个信息流，率先在美国上线 web、移动端和电视端。评论将支持发布 GIF，私信新增群聊，初期仅限美国、英国、新加坡、巴西及部分欧洲国家。Ask YouTube 将在产品评测视频中提供对话式问答，并在搜索中给出视频推荐和产品对比表格。", "type": "product", "relTime": "6天前"}, {"id": 132, "title": "Black Forest Labs 发布 7B 开源权重世界动作模型 FLUX 3 Action", "source": "Black Forest Labs：Blog（网页）", "sourceUrl": "https://bfl.ai/blog/flux-3-action", "date": "2026-09-23T18:11:00.000Z", "summary": "Black Forest Labs 发布 FLUX 3 Action，一个 7B 参数、开放权重的世界动作模型。官方称可将 FLUX 的视觉智能转化为动作能力，用于机器人、模拟器或游戏。", "type": "model", "relTime": "6天前"}, {"id": 133, "title": "OnSolo 发布 Solo Video：单次生成 15 秒视频", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2102809011209003016", "date": "2026-09-23T17:15:11.000Z", "summary": "OnSolo 上线 Solo Video，可一次生成 15 秒视频，官方称运动更自然、生成成功率更高，从而减少重试消耗的 credits。会员活动期内可无限使用：Premium 3 天、Super 5 天、Ultra 10 天，每档 150 个名额，先到先得，活动时间为 9 月 23 日至 10 月 22 日，Solo Video 现已在 Free Canvas 中可用。", "type": "paper", "relTime": "6天前"}, {"id": 134, "title": "Recraft V4.1 Flash 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)",

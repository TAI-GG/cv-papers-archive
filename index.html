y": "The Verge报道称，英伟达CEO黄仁勋相关话题在Instagram等平台催生数百条AI深伪迷因视频，如将其换脸进“Ibiza Final Boss”和《办公室》等场景，单条观看量近600万。创作者使用字节跳动Seedance 2.5、阿里巴巴Wan 3和谷歌Nano Banana等模型制作，并探讨此类AI生成内容的传播生态、变现方式及性别刻板印象争议。", "type": "industry", "relTime": "7小时前"}, {"id": 6, "title": "Pinterest 新增家长控制：可限制青少年看到的 AI 生成内容", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/11/24/pinterest-will-now-let-parents-limit-the-ai-generated-content-their-teens-see/", "date": "2026-11-24T16:02:37.000Z", "summary": "Pinterest 本周扩展家长控制功能，允许家长调节青少年在信息流中接触 AI 生成内容的程度，同时新增关闭视频自动播放、调整推送与邮件通知音量等选项，并重新设计家长控制页面。Pinterest 称这使其成为首批让家长控制 AI 生成内容曝光量的主流社交平台之一，此类信息流层面的控制此前在社交平台普遍缺失。", "type": "product", "relTime": "8小时前"}, {"id": 7, "title": "Tidal 宣布全面下架纯 AI 生成音乐，成首个封禁 AI 音乐的流媒体平台", "source": "Hacker News：AI 热帖", "sourceUrl": "https://variety.com/2026/music/news/tidal-bans-ai-generated-music-1236956924/", "date": "2026-11-24T15:06:26.000Z", "summary": "音乐流媒体 Tidal 宣布将从 12 月 9 日起移除全部完全由 AI 生成的曲目，成为首个全面封禁 AI 音乐的流媒体平台。Tidal 负责人 Robert Anderson 称过去 90 天内分发的曲目有 43% 被检测为 AI 生成，96% 的 AI 歌曲播放量为零，此次清理将移除 2900 万首曲目，此后每天拒绝 8 万至 8.5 万首歌。", "type": "industry", "relTime": "9小时前"}, {"id": 8, "title": "Google 申请个性化 AI 电视频道专利，用户将成视频主角", "source": "404 Media（RSS）", "sourceUrl": "https://www.404media.co/googles-customized-ai-tv-channel-starring-you/", "date": "2026-11-24T13:42:30.000Z", "summary": "404 Media 报道 Google 申请了一项名为“为用户打造定制视频体验频道”的专利，设想基于人口统计信息、观看历史等用户数据生成 24/7 的 AI 频道“我的频道”，让用户担任全部视频的主角，并通过广告服务器在内容中插入定制广告。", "type": "industry", "relTime": "10小时前"}, {"id": 9, "title": "SkyProduction 接入 Kling Image 4.0 与 MiniMax H3-Image，2K 图像生成低至 0.1 元/张", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s/68OX-aoy0oMzqwlX2ytg3g", "date": "2026-11-24T11:10:33.000Z", "summary": "SkyProduction 宣布上线 Kling Image 4.0 与 MiniMax H3-Image 两款图像模型，2K 图像生成价格低至 0.1 元/张。", "type": "product", "relTime": "13小时前"}, {"id": 10, "title": "腾讯混元开源第三代翻译模型 Hy-MT3，语言覆盖从 38 扩至 102", "source": "X：腾讯混元 (@TencentHunyuan)", "sourceUrl": "https://x.com/TencentHunyuan/status/2125170622049485093", "date": "2026-11-24T10:12:14.000Z", "summary": "腾讯混元发布第三代开源翻译模型 Hy-MT3，称翻译更准确、更完整、更遵循用户指令，语言覆盖从 38 种扩展到 102 种。模型针对游戏本地化（与《王者荣耀》合作）和图像/OCR 翻译优化，已开放下载部署，提供 Hugging Face 与 GitHub 入口及 arXiv 论文。", "type": "model", "relTime": "14小时前"}, {"id": 11, "title": "PixVerse 支持用 Seedance 2.5 生成原生 4K 视频", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2125152561347092690", "date": "2026-11-24T09:00:28.000Z", "summary": "PixVerse 宣布其平台支持用 Seedance 2.5 以原生 4K 分辨率进行视频生成，并给出入口链接 https://app.pixverse.ai/。", "type": "product", "relTime": "15小时前"}, {"id": 12, "title": "商汤发布并开源 SenseNova U1.6 原生多模态模型，支持原生图像自修正", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/031/465.htm", "date": "2026-11-24T04:58:18.710Z", "summary": "商汤科技发布并开源 SenseNova U1.6 原生多模态模型，首次为该系列 8B 开源模型带来原生图像自修正，可先生成首稿再对照提示检查并生成修正版。模型加强了透视文字与艺术字等复杂文字生成，U1.6 Lite 在 UltraTextBench 密集信息图测试中得分从 86.04 升至开启自修正后的 92.28，内部评测美学得分较 U1.5 Lite 高约 10%。", "type": "model", "relTime": "19小时前"}, {"id": 13, "title": "蚂蚁发布并开源 Ling-3.2-air 模型：原生多模态架构，1240 亿总参数", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/031/426.htm", "date": "2026-11-24T04:01:00.753Z", "summary": "蚂蚁科技集团发布并开源 Ling-3.2-air 模型，延续 Ling-3.0-flash-VL 的原生多模态架构，支持文本、图像和视频输入，总参数 1240 亿，每个 Token 激活 55 亿参数。", "type": "model", "relTime": "20小时前"}, {"id": 14, "title": "商汤发布 SenseNova U1.6 图像模型，支持生成后自查并修正图内文字", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2125046695436386816", "date": "2026-11-24T01:59:48.000Z", "summary": "商汤发布图像模型 SenseNova U1.6，基于 Neo-unify 构建，可在生成后自主检查并修正图内文字错误。用户评测中美学质量较 U1.5 提升 10%，在 UltraTextBench 密集信息图任务上较单次生成平均相对提升 7%；ComfyUI 原生支持其自纠错功能，模型权重已上架 Hugging Face，并开放 API（每 5 小时 1,500 次免费请求）。", "type": "model", "relTime": "22小时前"}, {"id": 15, "title": "蚂蚁百灵开源发布 Ling-3.2-air，编程、智能体与多模态能力提升", "source": "公众号：蚂蚁百灵（Ling）", "sourceUrl": "https://mp.weixin.qq.com/s/7-Dnhz1ouC6ans0znH154g", "date": "2026-11-24T01:00:00.000Z", "summary": "蚂蚁百灵大模型发布并开源 Ling-3.2-air，延续 Ling-3.0-flash-VL 原生多模态架构，总参数 1240 亿、每 Token 激活 55 亿，支持文本、图像和视频输入。", "type": "model", "relTime": "23小时前"}, {"id": 16, "title": "美国弗吉尼亚州和俄勒冈州起诉 SpaceX，指控 Grok 生成儿童性虐待图像", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/031/270.htm", "date": "2026-11-24T00:48:21.250Z", "summary": "美国弗吉尼亚州和俄勒冈州起诉 SpaceX，指控其旗下 AI 模型 Grok 未阻止生成儿童性虐待图像并从中获利，两州是过去几个月多州调查中首批正式起诉的州。两州还指控 SpaceX 宣传安全功能时误导消费者、未建立充分安全防护，并仍在推广可生成裸露图像的 Spicy 模式，要求赔偿并停止违法行为，SpaceX 暂未回应置评请求。", "type": "industry", "relTime": "23小时前"}, {"id": 17, "title": "fal 上线 Recraft V4.1 Flash V2 与 Vectorize Pro", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2125009867324715057", "date": "2026-11-23T23:33:27.000Z", "summary": "Recraft V4.1 Flash V2 与 Vectorize Pro 现已在 fal 上线。  - 使用 Flash V2 生成图像，招牌、包装和海报上的文字更清晰 - 在类照片作品中呈现更精细的细节，从产品图到室内场景 - 使用 Vectorize Pro 将栅格图像转换为干净的 SVG：平滑曲线、笔直线条、锐利转角 - 可处理字体和复杂形状，并提供可选的抠图模式，用于不重叠的形状", "type": "product", "relTime": "1天前"}, {"id": 18, "title": "Hyper3D Low Poly 上线 fal", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2124994211971756465", "date": "2026-11-23T22:31:15.000Z", "summary": "Hyper3D Low Poly 现已在 fal 上线  - 可根据文本提示词或参考图像生成低多边形 3D 模型 - 可将高多边形网格转换为低多边形资产，并投影和烘焙原始纹理 - 支持三角形和四边形拓扑，用于重拓扑和 LOD 生成工作流", "type": "product", "relTime": "1天前"}, {"id": 19, "title": "fal 上线 Hyper3D 低多边形 3D 生成", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2124994214165463358", "date": "2026-11-23T22:31:15.000Z", "summary": "现在就来试试！  文本转 3D：https://fal.ai/models/hyper3d/lowpoly/text-to-3d 图像转 3D：https://fal.ai/models/hyper3d/lowpoly/image-to-3d 网格转 3D：https://fal.ai/models/hyper3d/lowpoly/mesh-to-3d", "type": "product", "relTime": "1天前"}, {"id": 20, "title": "Antropi Robotics 建自主 CNC 工厂，10 月营收 10 万美元", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2124980757395599572", "date": "2026-11-23T21:37:47.000Z", "summary": "YC 支持的 Antropi Robotics 正在打造自主 CNC 工厂，其 Factory OS 统一调度机器人上下料、加工、排程与检测，目标是以中国级价格产出美国品质零件。公司称 10 月营收 10 万美元、服务 14 家公司，毛利率约 60%。行业投资同步升温，Hadrian 近期以近 80 亿美元估值融资 13.7 亿美元扩产自动化制造。", "type": "industry", "relTime": "1天前"}, {"id": 21, "title": "多州起诉 SpaceX，要求阻止 Grok 生成儿童性虐待图像和复仇式色情内容", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/tech-policy/2026/11/states-sue-spacex-to-stop-grok-from-generating-child-sex-images-revenge-porn/", "date": "2026-11-23T21:30:44.000Z", "summary": "多州总检察长起诉 SpaceX，要求阻止 Grok 生成儿童性虐待图像（CSAM）和复仇式色情内容。X 声称每条 Grok 输出都经过筛查，但州总检察长表示 Grok 仍在生成 CSAM。", "type": "industry", "relTime": "1天前"}, {"id": 22, "title": "Canva 发布 MCP 服务器，agent 可从一句需求生成可编辑的发布资产", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2124973673249718677", "date": "2026-11-23T21:09:38.000Z", "summary": "Canva 发布全新 Canva MCP，把 Canva 的设计工具和 AI 模型开放给任意 agent 或开发者接入，无需候补名单。作者演示的流程是：开发者在 Canva Developer Portal 启用 MCP，agent 收到一句需求后自行选择并按顺序调用 Canva 工具，生成设计、创建视频并适配各平台尺寸，最终以可编辑的 Canva 设计文件返回，由人工进行审查、修改、分享和发布。", "type": "product", "relTime": "1天前"}, {"id": 23, "title": "Google 申请个性化 AI 电视频道专利，用户将成为主角", "source": "404 Media（RSS）", "sourceUrl": "https://www.404media.co/google-wants-to-make-a-24-7-ai-tv-channel-youll-be-the-main-character/", "date": "2026-11-23T18:17:22.000Z", "summary": "Google 已提交一项专利申请，拟利用其掌握的用户信息生成全天候 AI 电视频道，内容包括以用户为主角的个性化节目和定制广告。404 Media 认为，这反映了 AI 视频的一个趋势：基于公司和广告主收集的大量用户数据自动生成无限量、高度定制的内容。", "type": "industry", "relTime": "1天前"}, {"id": 24, "title": "Ai2 发布 RoboTrack 点跟踪基准、RoboTrack-15M 数据集与 RoboTracker 系列模型", "source": "Hugging Face 社区博客（混合发现）", "sourceUrl": "https://huggingface.co/blog/allenai/robotrack", "date": "2026-11-23T17:20:37.000Z", "summary": "Ai2 发布面向机器人操作的点跟踪基准与训练数据套件 RoboTrack，包含 307 段人工标注视频的 RoboTrack-Bench（2522 条轨迹，来自 DROID、Ego-Exo4D、MolmoAct 2 和 EgoVerse）和基于 MolmoSpaces 生成 1500 万条轨迹的 RoboTrack-15M。", "type": "paper", "relTime": "1天前"}, {"id": 25, "title": "a16z 领投 Embo：用世界模型打造人形机器人\"大脑\"", "source": "a16z：News（RSS）", "sourceUrl": "https://www.a16z.news/p/investing-in-embo", "date": "2026-11-23T17:02:28.000Z", "summary": "a16z 领投 Embo，该公司正用世界模型为人形机器人构建\"大脑\"，解决泛化与抗干扰两大问题。其方法先用海量互联网视频和机器人演示训练世界模型，再让智能体在模型内通过强化学习反复练习技能。创始人 Danijar Hafner 此前主导 Dreamer 系列研究，Dreamer 4 曾仅靠想象经验学会在 Minecraft 中获取钻石。", "type": "industry", "relTime": "1天前"}, {"id": 26, "title": "商汤开源 SenseNova-Loop-9B 多模态模型，512K 上下文、循环复用 24 层中间块", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2124904314024186073", "date": "2026-11-23T16:34:01.000Z", "summary": "商汤发布开源多模态模型 SenseNova-Loop-9B，支持 512K 上下文和文本图像输入，已在 Hugging Face 提供下载。模型仅存储 32 层权重，将同一 24 层中间块执行两次实现 56 层计算；官方 4-bit AWQ 权重约 4.9GB，64K 上下文显存可低至约 9 GiB。", "type": "model", "relTime": "1天前"}, {"id": 27, "title": "NVIDIA 教程：用 Hugging Face Diffusers 在 12 GB 显存 GPU 上本地运行 Cosmos 3 Nano", "source": "NVIDIA Technical Blog：Agentic AI / Generative AI", "sourceUrl": "https://developer.nvidia.com/blog/how-to-run-nvidia-cosmos-3-on-local-ai-devices-using-hugging-face-diffusers/", "date": "2026-11-23T16:00:00.000Z", "summary": "NVIDIA 技术博客发布教程，讲解如何通过权重流式存储，在仅 12 GB VRAM 的 GPU 上本地运行 NVIDIA Cosmos 3 Nano 视频生成模型，将大部分模型权重存于系统内存并按需传至 GPU 计算。", "type": "tip", "relTime": "1天前"}, {"id": 28, "title": "可灵发布 Kling Image 4.0，单条提示词最多生成 10 张风格一致图像", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2124846759679607044", "date": "2026-11-23T12:45:19.000Z", "summary": "可灵官方宣布 Kling Image 4.0，可从单条提示词生成一套完整图像，最多 10 张，并保持主体和视觉风格一致，围绕创作者的构想输出。", "type": "product", "relTime": "1天前"}, {"id": 29, "title": "智谱发布 GLM-5.4 循环 Transformer", "source": "X：智谱 Z.ai (@Zai_org)", "sourceUrl": "https://x.com/Zai_org/status/2124811995912286352", "date": "2026-11-23T10:27:11.000Z", "summary": "推出 GLM-5.4：搭载我们首个循环 Transformer 的通用编程模型。  - 在 GLM-5 基座模型上循环已有层，实现更深层推理 - 突破传统编程，延伸至视频、游戏、3D 着色器与 CAD 建模 - 新增视觉能力，强化视觉编程  API 将在安全评估后开放。模型权重将负责任地发布。  技术博客：http://z.ai/blog/glm-5.4", "type": "model", "relTime": "1天前"}, {"id": 30, "title": "Ai2 发布 RoboTrack 点跟踪基准与数据集，并推出 RoboTracker 模型", "source": "Ai2 / Allen Institute for AI（RSS）", "sourceUrl": "https://allenai.org/blog/robotrack", "date": "2026-11-23T08:00:00.000Z", "summary": "Ai2 发布 RoboTrack，一套面向机器人操作的点跟踪基准与训练数据套件，含 307 段人工标注视频、2522 条点轨迹的 RoboTrack-Bench，以及基于 MolmoSpaces 生成的 RoboTrack-15M 合成训练集。", "type": "paper", "relTime": "1天前"}, {"id": 31, "title": "X Square Robot 发布 WALL-OSS-1.0 具身基础模型", "source": "X：自变量 X Square (@XSquareRobot)", "sourceUrl": "https://x.com/XSquareRobot/status/2124767551959757162", "date": "2026-11-23T07:30:35.000Z", "summary": "X Square Robot 发布具身基础模型 WALL-OSS-1.0，采用原生 VLA 预训练，融合视觉、语言与动作，使机器人适应未预先定义的任务。模型在 312 个真实机器人任务上实现 55.1% 零样本成功率，无需任务专属演示或微调。配套的 XR Harness 可将「收拾桌子」这类高层指令转化为多步骤协调动作，技术博客、GitHub 仓库和 API 均已公开。", "type": "model", "relTime": "1天前"}, {"id": 32, "title": "蚂蚁百灵医疗健康大模型宣布全面开源，最轻量版一台笔记本即可部署", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/030/784.htm", "date": "2026-11-23T02:56:54.250Z", "summary": "蚂蚁在阿福医疗健康生态大会上宣布蚂蚁百灵医疗健康大模型全面开源，家族包含大语言模型、实时音视频模型、预测模型和安全防护模型，支持疾病未来六年的发病风险预测。据现场信息，模型含医生专业个人版多模态模型（124B）和医疗机构版医疗智能体大模型（562B），最轻量版一台笔记本即可部署，官方称疾病种类、准确率超越全球多个专用模型。", "type": "model", "relTime": "1天前"}, {"id": 33, "title": "特斯拉新 FSD 显示由车机端约 1B diffusion 模型实时生成", "source": "X：Dash (@dashhuang)", "sourceUrl": "https://x.com/DashHuang/status/2124649277951766806", "date": "2026-11-22T23:40:36.000Z", "summary": "作者引用 Elon Musk 的解释：特斯拉新版 FSD 显示画面是 AI 视频实时生成的，不走传统 3D 渲染。车机端运行一个约 1B 的条件 mean-flow diffusion 模型，基于 Universal Vision Encoder 特征，每秒 18 帧时用半个 TRIP 引擎算力生成 8 帧 36fps 的视频块，当前延迟偏高但已有可削减约 35% 延迟的方案。", "type": "industry", "relTime": "2天前"}, {"id": 34, "title": "蚂蚁集团开源医疗多模态模型 LingSante-3.1-air-VL，可生成胸片报告", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2124615279108137021", "date": "2026-11-22T21:25:30.000Z", "summary": "蚂蚁集团开源多模态医疗模型 LingSante-3.1-air-VL，总参数 124B、每 token 激活 5.5B 的 MoE 架构，结合医学影像理解、报告生成、医学推理与多模态搜索和工具使用。", "type": "model", "relTime": "2天前"}, {"id": 35, "title": "蚂蚁百灵开源医疗多模态模型 LingSante-3.1-air-VL，总参数 124B、激活 5.5B", "source": "X：蚂蚁百灵 (@AntLingAGI)", "sourceUrl": "https://x.com/AntLingAGI/status/2124555085640610194", "date": "2026-11-22T17:26:19.000Z", "summary": "蚂蚁百灵发布开源多模态医疗模型 LingSante-3.1-air-VL，总参数 124B、激活参数 5.5B，结合医学影像理解、报告生成、医疗推理与多模态搜索和工具调用。", "type": "model", "relTime": "2天前"}, {"id": 36, "title": "PixVerse 分享韩式大头贴四宫格人像生成提示词", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2124518556603916711", "date": "2026-11-22T15:01:10.000Z", "summary": "PixVerse 发布一条图像生成提示词，用上传照片作为唯一身份参考，生成韩式照片亭风格的 3:4 四宫格人像。提示词要求保留脸型、五官和年龄感，四个分格同一人物不同姿势，包括手持复古电话、戴熊耳头带、举银色复古相机和头顶椭圆墨镜，背景为低饱和鼠尾草绿并带闪光灯质感，并明确避免过度磨皮、手指变形和水印。", "type": "tip", "relTime": "2天前"}, {"id": 37, "title": "OpenBMB 确认 MiniCPM-V 4.7（35B-A3B）端侧 MoE 多模态模型进展", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2124463719824622050", "date": "2026-11-22T11:23:16.000Z", "summary": "面壁智能 OpenBMB 回应社区对 MiniCPM-V 4.7（35B-A3B）的关注，称把强大的多模态 AI 带到日常设备正是其工作方向，并预告更多内容。引用内容称该模型为开源端侧 MoE 多模态模型，总参数 35B、每 Token 约激活 3B，Instruct 模式下反超同档 Qwen3.6-35B-A3B，iPhone 17 Pro Max 约 3GB 内存跑出 13+ token...", "type": "model", "relTime": "2天前"}, {"id": 38, "title": "TikTok 上线 AI 内容透明度检测工具与创作者肖像检测功能", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/030/581.htm", "date": "2026-11-22T06:46:21.620Z", "summary": "TikTok 于当地时间 11 月 19 日宣布推出两项 AI 透明度工具。用户无需账号即可上传图片或视频，检测其是否由 TikTok AI 功能生成或编辑，工具还会检测专有隐形水印 VeraDura；面向全球逐步推出的肖像检测功能需主动开启，帮助符合条件的创作者发现并标记可能未经授权使用其肖像的 AI 生成内容。", "type": "product", "relTime": "2天前"}, {"id": 39, "title": "Elon Musk 称赞 Tesla FSD V15 是全新架构的出色版本", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2124294755316310346", "date": "2026-11-22T00:11:51.000Z", "summary": "Elon Musk 转发并称赞 Tesla FSD V15，称其采用全新架构，驾驶智能超越人类。引用的完整更新说明称 v15 升级了端到端驾驶网络的各部分，包括与 Robotaxi 和 Optimus 共享的视觉编码器，将关键干预率提升 25 倍；新增 Tesla Reality View 端到端可视化，并改进导航、泊车选择、驾驶员监测、标志和小动物等障碍物检测、坑洼与积水规避以及 Auto...", "type": "product", "relTime": "3天前"}, {"id": 40, "title": "Eric Schmidt 解释为何 AI 竞赛不可能相互暂停", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2124227469377184044", "date": "2026-11-21T19:44:29.000Z", "summary": "Eric Schmidt 在 The Economist 视频中解释为什么 AI 竞赛不可能相互暂停：美国没有停止的动机，本地实验室或中国可能作弊，UN 核查无法审查计算机写的代码也跑不赢中美实验室。他称这种暂停无法被验证，核查人员需进入包括军事实验室在内的秘密实验室审查全部代码库，而代码由计算机生成，没有人类团队能逐行读完。", "type": "industry", "relTime": "3天前"}, {"id": 41, "title": "蚂蚁开源 LingSante-3.1-air-VL 医疗多模态模型", "source": "蚂蚁百灵：Developer Blog（网页）", "sourceUrl": "https://developer.ant-ling.com/zh-CN/blogs/lingsante-3.1-air-vl", "date": "2026-11-21T16:00:00.000Z", "summary": "蚂蚁集团发布并开源 LingSante-3.1-air-VL，是其首个开源多模态医疗大模型，基于 Ling-3.0-flash-VL 构建，总参数量 124B、激活参数 5.5B，支持文本与图像输入和最高 256K token 上下文窗口。", "type": "model", "relTime": "3天前"}, {"id": 42, "title": "Tripo API 实战教程三部曲", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2124155890010107915", "date": "2026-11-21T15:00:03.000Z", "summary": "了解如何在真实 3D 项目中使用 Tripo API。  这个三部曲系列涵盖 AI 智能体工作流、使用 Blender 生成资产，以及在自定义应用中集成 API。  Bunny City。将生成的资产变成一个电影级赛博朋克世界。", "type": "tip", "relTime": "3天前"}, {"id": 43, "title": "谷歌为 Gemini 上线 GIF 生成功能，由 Gemini Omni 1.2 Flash 驱动", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/030/381.htm", "date": "2026-11-21T07:41:30.647Z", "summary": "谷歌宣布为 Gemini 上线 GIF 生成功能，由视频模型 Gemini Omni 1.2 Flash 驱动，可生成循环动态图和表情包。功能面向所有 Google AI 订阅用户，在美国、日本、韩国、澳大利亚、加拿大、英国、德国、法国免费，可在主聊天输入提示词或在图像与视频工具中选择 GIF 生成。", "type": "product", "relTime": "3天前"}, {"id": 44, "title": "HeyGen Decision 1 上线 AI/ML API", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2123917907499634975", "date": "2026-11-20T23:14:24.000Z", "summary": "目前最实用的视频 AI 能给它的所见给出一个数字：输入一段视频，输出一个概率  AI/ML API（@aimlapi）现已提供 HeyGen 新发布的 Decision 1 模型。  Decision 1 模型从不写一个字。你给它文本、图像、视频或音频，向它提出最多 400 个问题，它用概率逐一作答，你的代码可直接据此采取行动。", "type": "product", "relTime": "4天前"}, {"id": 45, "title": "Google 桌面搜索首页改版上线，移除搜索按钮并增加 AI 功能入口", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/11/googles-latest-search-page-redesign-drops-the-search-button-adds-ai-sidebar/", "date": "2026-11-20T21:58:29.000Z", "summary": "Google 正式向桌面端部署新的搜索首页，搜索栏下新增图像生成、文件分析和与 Gemini 头脑风暴三个 AI 功能按钮，同时完全移除了原有的搜索按钮。Google 搜索 VP Robby Stein 在 X 上确认此次改版经过数周测试后推出，I\\'m Feeling Lucky 按钮保留；文中分析称搜索按钮在现代界面中被自动补全建议遮挡，点击并不比直接按回车更方便。", "type": "product", "relTime": "4天前"}, {"id": 46, "title": "HeyGen Decision 1 上架 OpenRouter，可对多模态输入返回校准概率", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2123893458318614941", "date": "2026-11-20T21:37:15.000Z", "summary": "OpenRouter 宣布 HeyGen 的 Decision 1 已在其平台上可用，可针对视频、音频、图像和文本提问，单次请求约 100 ms 内返回每个答案的校准概率，单次最多 400 个问题。作者示例可用自拍视频对照证件照，并排回答是否同一人、是否为活体捕捉，各附概率；12 月 1 日前上线定价五折，Turbo 为 $0.042 / 1M input tokens，Decision 1...", "type": "product", "relTime": "4天前"}, {"id": 47, "title": "Muse Code 新增 3D 模型生成能力并已在 CLI 上线", "source": "X：Charlie Holtz（@charlieholtz）", "sourceUrl": "https://x.com/charlieholtz/status/2123890610616860695", "date": "2026-11-20T21:25:56.000Z", "summary": "Charlie Holtz 宣布 Muse Code 现已支持生成 3D 模型，可创建带纹理、可用于打印或作为游戏资产的模型，该功能现已在 CLI 上线。", "type": "product", "relTime": "4天前"}, {"id": 48, "title": "ChatGPT 推出 Space：统一管理页面、幻灯片、图片与文件", "source": "X：ChatGPT (@ChatGPT)", "sourceUrl": "https://x.com/ChatGPT/status/2123850915061104735", "date": "2026-11-20T18:48:12.000Z", "summary": "ChatGPT 官方宣布侧边栏中的 Space 成为 pages、slides、images、files 和 uploads 的新家。用 ChatGPT 可写页面、做研究、生成图片并创建交互式图表，把想法变成带图片和图形的幻灯片并邀请他人协作；页面和幻灯片还可从已连接的工具自动更新。", "type": "product", "relTime": "4天前"}, {"id": 49, "title": "Dario Amodei 谈 Anthropic 主动放缓发展速度", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2123829074753998977", "date": "2026-11-20T17:21:24.000Z", "summary": "Dario Amodei：Anthropic 选择以不到其能力一半的速度前进  “我们在节奏把控上所做的，本质上是说，我们本可以开到每小时 200 英里，也许就只开到每小时 90 英里吧。花时间去弄清楚如何安全地做到这一点。而剩下的那部分余力，我们用来以正确的方式构建模型。”  ---- 完整视频见“CNBC Television”YouTube 频道，（链接在评论中）", "type": "industry", "relTime": "4天前"}, {"id": 50, "title": "ClickUp 内置 AI 可生成视频与构建工具", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2123822297471660234", "date": "2026-11-20T16:54:29.000Z", "summary": "更便宜的 AI 编程正在把整个产品品类压缩成附加功能。  ClickUp 刚推出一次更新，让这款知名的任务应用从跟踪工作转向实际执行工作：  其内置 AI 现在能制作视频、运行多步骤流程并构建自定义工具，全部都在工作区内完成。该 AI 从你团队的真实任务出发，因此它处理的是实际项目，而不是你粘贴进聊天机器人的摘要。  https://x.com/DJ_CURFEW/status/212380...", "type": "product", "relTime": "4天前"}, {"id": 51, "title": "Kling AI 发布 Kling Image 4.0：原生 8K 图像生成与高级文字渲染", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2123818893122662485", "date": "2026-11-20T16:40:57.000Z", "summary": "Kling AI 发布 Kling Image 4.0，主打原生 8K、更强真实感、一致图像组和高级文字渲染。引用 Artificial Analysis 的评测显示其在文生图排名第 7、图像编辑排名第 6，较 Kling Image 3.0 Omni 两个榜单均提升超 225 Elo。黑五限时定价 2K 低至 $0.022/图、原生 8K 低至 $0.033/图。", "type": "model", "relTime": "4天前"}, {"id": 52, "title": "Gemini 支持用 Gemini Omni 1.2 Flash 直接生成 GIF", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2123813017855103449", "date": "2026-11-20T16:17:36.000Z", "summary": "Gemini 官方宣布 Gemini 内可直接创建 GIF，无需再去搜索现成的 GIF，可用于循环照片效果和搞笑表情包等场景。生成由最新视频模型 Gemini Omni 1.2 Flash 驱动，官方称动作流畅且每一帧质量稳定。", "type": "product", "relTime": "4天前"}, {"id": 53, "title": "可灵AI与导演Stephane Benini合作推出AI影片《Redline》，用Kling 4.0挑战雨夜赛车", "source": "公众号：可灵AI（快手·视频）", "sourceUrl": "https://mp.weixin.qq.com/s/bCtMYw0Z5YcUKWdD7aMtOA", "date": "2026-11-20T11:52:01.000Z", "summary": "可灵AI与拥有20年拍车经验的导演Stephane Benini合作推出原创AI影片《Redline》，基于Kling 4.0生成雨夜高速竞速画面。Kling 4.0可区分赛车自身运动与摄影机跟拍运动，生成定向运动模糊，并在漂移过弯时保持车身结构与车轮部件稳定；其全能参考、关键帧、3D模型参考和更长生成时长提升了运镜与车辆动态的可控性。", "type": "tip", "relTime": "4天前"}, {"id": 54, "title": "生数科技朱军团队获北京市自然科学奖一等奖，扩散模型成果支撑 Vidu 研发", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s/VBxPIZGeRcYD8XyBcL_kYw", "date": "2026-11-20T10:58:13.000Z", "summary": "生数科技创始人朱军、CTO 鲍凡领衔团队的“高效可扩展的扩散模型理论与方法”成果获 2025 年度北京市自然科学奖一等奖。该成果在扩散模型基础理论、采样算法与模型架构三方面取得突破，其中免训练采样方法实现近百倍加速，并被 Diffusers 等开源工具库集成。相关研究为生数科技 Vidu 视频生成大模型及 Vidu Q、Vidu S 系列提供技术支撑。", "type": "industry", "relTime": "4天前"}, {"id": 55, "title": "微信短剧审核新规：单集最低时长上调至 1 分钟，AI 制作证明视频 12 月起必填", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/029/883.htm", "date": "2026-11-20T06:04:06.117Z", "summary": "微信短剧内容中心宣布两项审核更新：单集最低时长由 45 秒上调至 1 分钟，2026 年 12 月 1 日起生效，不足 1 分钟的剧集将无法提审。含 AI 生成内容的剧集提审需上传 AI 制作证明视频，需展示资产列表、剧集列表、提示词及分镜片段，目前选填，同样于 12 月 1 日起转为必填。", "type": "industry", "relTime": "4天前"}, {"id": 56, "title": "模型折叠皱毛巾，机器人静止仅16%", "source": "X：UCSD Hao AI Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2123593606833549601", "date": "2026-11-20T01:45:44.000Z", "summary": "再来点更难的：折叠一条皱毛巾（视频为8倍速）。  两次运行中，模型的大部分时间都被机器人的运动所掩盖，机器人静止的时间仅占16%和22%。", "type": "paper", "relTime": "4天前"}, {"id": 57, "title": "LLM 与视频模型比拼生成视频，GPT-6.2 Astra 对阵 Seedance 2.5", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2123581865965855205", "date": "2026-11-20T00:59:05.000Z", "summary": "Artificial Analysis 用 GPT-6.2 Astra 与 Dreamina Seedance 2.5 做同题对比：前者以 three.js 代码构建悉尼歌剧院、机械表爆炸图和巨龙袭击中世纪城镇三个场景，后者用相同相机路径的文本提示加路线参考图生成。", "type": "model", "relTime": "4天前"}, {"id": 58, "title": "Apple 发布 Depth Pro 2：单目深度估计兼顾锐利边缘与时间一致性", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/depth-pro-2-monocular", "date": "2026-11-20T00:00:00.000Z", "summary": "Apple 提出 Depth Pro 2，用单个可扩展网络同时处理图像与视频，在原生分辨率下预测以米为单位的稠密深度。该模型同时实现度量准确、边缘锐利与帧间时间一致，在这三项指标上均超越此前方法，并定义了度量精度、锐利度、时间一致性与运行时间的新 Pareto 前沿。团队已开源代码与权重，一个网络即可处理单张照片、整段视频或实时摄像头画面。", "type": "paper", "relTime": "5天前"}, {"id": 59, "title": "Databricks Genie ZeroOps 进入公开测试，自动检测并修复数据流水线问题", "source": "Databricks：Blog（RSS）", "sourceUrl": "https://www.databricks.com/blog/genie-zeroops-now-public-beta-autonomous-agent-fixes-data-pipelines-lessons-80000-customer", "date": "2026-11-19T21:30:00.000Z", "summary": "Databricks 宣布自主智能体 Genie ZeroOps 进入 Public Beta，工作区管理员可在 Previews 页面开启。它能检测、调查并修复数据流水线问题，覆盖 Detect、Investigate、Verify、Notify、Remediate 五个步骤，新增收件箱共享、通知、一键创建 PR 和自定义业务指令等功能。", "type": "product", "relTime": "5天前"}, {"id": 60, "title": "Gemini 4 Neon 实测：Peter Gostev 对比 Opus、Fable 等模型的首发体验", "source": "X：Arena (@arena)", "sourceUrl": "https://x.com/arena/status/2123528811572846972", "date": "2026-11-19T21:28:16.000Z", "summary": "Arena 分享 Gemini 4 Neon 发布后的第一手实测视频，Peter Gostev 在 3D 场景、游戏、UI 和数据可视化等任务中将其与 Opus、Fable、Astra、Sol 对比，并评估其接近前沿的程度。", "type": "model", "relTime": "5天前"}, {"id": 61, "title": "Gemini Mac 版推出 computer use，可在后台窗口点击、滚动和输入", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2123513203745538423", "date": "2026-11-19T20:26:15.000Z", "summary": "Google Gemini 官方宣布 Gemini app for Mac 上线 computer use 功能，可跨文件夹、应用和网页移交任务，同时屏幕和光标仍归用户控制。视频演示 Gemini 在实时后台窗口中点击、滚动和输入，把一张快速草图变成 Blender 中绑定的 3D 模型。", "type": "product", "relTime": "5天前"}, {"id": 62, "title": "fal 开放可灵 v4 视频生成入口", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2123481125553107356", "date": "2026-11-19T18:18:47.000Z", "summary": "fal 平台上线可灵 v4 模型，提供文生视频、图生视频、参考生成视频和视频编辑四种模式的入口链接，读者可直接在 fal.ai 试用。", "type": "product", "relTime": "5天前"}, {"id": 63, "title": "可灵（Kling 4.0）在 fal 平台支持原生 4K 视频生成", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2123481122638045551", "date": "2026-11-19T18:18:46.000Z", "summary": "fal 宣布可灵（Kling 4.0）现可在其平台生成原生 4K 视频，支持从文本、图片或参考素材生成，也可对现有视频做 4K 编辑。4K 和 1080p 两种分辨率均提供可选的 10-bit HDR 输出。", "type": "product", "relTime": "5天前"}, {"id": 64, "title": "Jim Fan 演示 GR00T 2 端到端控制真实灵巧手", "source": "X：Jim Fan (@DrJimFan)", "sourceUrl": "https://x.com/DrJimFan/status/2123470587259732200", "date": "2026-11-19T17:36:54.000Z", "summary": "Jim Fan 发布未剪辑、1 倍速视频，展示 GR00T 2 端到端控制真实灵巧手完成任务。GR00T 2 是面向机器人的开源 System One 模型，完全运行在机器人机载算力上，支持 20+ 步、5 分钟以上的长时程灵巧操作与全身控制，可通过 X-Adapt 从人类穿戴数据和仿真零样本迁移到多种真机，并与前沿 Agent 集成实现物理推理、错误恢复和安全监控。官方开源模型权重、Age...", "type": "model", "relTime": "5天前"}, {"id": 65, "title": "Google 在 Gemini API 与 AI Studio 上线 Genie 4 实时世界模型", "source": "X：Philipp Schmid（Google DeepMind 开发者体验） (@_philschmid)", "sourceUrl": "https://x.com/_philschmid/status/2123465741592637445", "date": "2026-11-19T17:17:39.000Z", "summary": "Philipp Schmid 宣布 Genie 4 正在 Gemini API 和 AI Studio 上推出，可从文本或图像生成 720p 24fps 的世界，并用 WASD、提示词和 48 kHz 立体声实时操控。可通过 WebRTC（浏览器加临时 token）或 WebSocket 串流，文档见 https://aistudio.google.com/docs/genie。", "type": "product", "relTime": "5天前"}, {"id": 66, "title": "TRACER：AI 视频系统 24 小时监测 ICU 患者谵妄早期迹象", "source": "Stanford HAI News（网页）", "sourceUrl": "https://hai.stanford.edu/news/ai-enabled-video-system-monitors-icu-patients-for-early-signs-of-delirium", "date": "2026-11-19T16:00:00.000Z", "summary": "计算机视觉专家与医生联合开发了 TRACER 系统，通过 ICU 床旁双摄像头 24 小时视频分析，结合电子健康记录追踪患者活动变化，识别谵妄早期迹象。系统以每分钟采样 15 种\"原子动作\"、压缩为每小时报告的方式降低数据量，医生可通过多模态界面查询患者数日行为变化。该研究部分由 Stanford HAI 资助。", "type": "paper", "relTime": "5天前"}, {"id": 67, "title": "Perplexity 演示 Agent 调用外部 API 完成地块筛选与 3D 建模全流程", "source": "X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)", "sourceUrl": "https://x.com/AravSrinivas/status/2123444250536972483", "date": "2026-11-19T15:52:15.000Z", "summary": "Perplexity CEO Aravind Srinivas 转发用户演示：用户让 Perplexity 为 Sacramento 附近 12 座小屋项目寻找合适地块，Perplexity 调用 @mireyehq API，花 $2.20 发起 31 次 Land Search and Enrich API 请求，按坡度>15%、洪泛区、湿地、保护区等条件将 327 块地筛到 3 块。随后...", "type": "industry", "relTime": "5天前"}, {"id": 68, "title": "谷歌与蓝色起源合作，计划 2029 年一季度发射搭载 TPU 的 AI 服务器卫星", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/029/695.htm", "date": "2026-11-19T14:26:06.037Z", "summary": "谷歌与蓝色起源（Blue Origin）达成合作，其新格伦火箭将于 2029 年第一季度发射搭载谷歌 TPU 的卫星，算力大致相当于一个数据中心机架。该合作属于谷歌“太阳捕手计划”，旨在探索太空 AI 数据中心的可能性。今年 10 月谷歌已部署首颗 AI 服务器卫星并成功启动 TPU，卫星上运行的 Gemma 4 模型生成了一段俳句并传回地球。", "type": "industry", "relTime": "5天前"}, {"id": 69, "title": "Canva 推出“AI 开关”，可统一关闭绝大部分 AI 工具", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/029/677.htm", "date": "2026-11-19T13:01:28.837Z", "summary": "Canva 于 11 月 19 日宣布推出“AI 开关”，允许用户统一关闭或开启绝大多数 AI 工具，免费版和 Pro 版用户均可使用。开启后“背景移除”“魔法抓取”等 AI 图像编辑工具仍会保留；用户还可在素材库打开“减少 AI”降低搜索时看到 AI 生成图像的概率，两项设置可在“个人资料”选项卡调整，平台级 AI 功能则需进入设置菜单“权限”中的“启用生成式 AI 功能”管理。", "type": "product", "relTime": "5天前"}, {"id": 70, "title": "火山引擎全量上线豆包实时音视频通话模型 SeedRealtime 1.0 API", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/029/406.htm", "date": "2026-11-19T06:55:41.687Z", "summary": "火山引擎 11 月 19 日全量上线豆包实时音视频通话模型（SeedRealtime 1.0）API，将声音、画面、时序与表达统一到同一个端到端模型，支持边看边听边说的实时全模态交互。相比依赖 ASR、VLM、TTS 串联的级联系统，其音视频对话节奏问题减少了一半，并能持续感知环境、主动开口提醒，可应用于多人交流、设备操作、学习辅助、实时客服等场景。", "type": "product", "relTime": "5天前"}, {"id": 71, "title": "火山引擎上线豆包实时音视频通话模型 SeedRealtime 1.0 API", "source": "公众号：火山引擎", "sourceUrl": "https://mp.weixin.qq.com/s/fyNH7Y6o32kxc4GeK8Qb3A", "date": "2026-11-19T06:36:27.000Z", "summary": "火山引擎正式上线豆包实时音视频通话模型 SeedRealtime 1.0 的 API 服务，将声音、画面、时序与表达统一到同一个端到端模型，实现边看、边听、边说的实时多模态交互，减少 ASR、VLM、TTS 级联带来的延迟与信息损耗。", "type": "product", "relTime": "5天前"}, {"id": 72, "title": "昆仑万维 SkyProduction 上线营销工作室，打通广告创意到成片流程", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s/lhI0YEDz6zAqH5eXI-D21w", "date": "2026-11-19T06:14:30.000Z", "summary": "昆仑万维旗下 SkyProduction 天工工作台正式推出「营销工作室」，将 AI 创作能力拓展至商业广告与营销内容生产场景。产品整合创意案例库、营销 Skill、AI Agent 与可视化画布，覆盖短剧带货、TVC 广告片、UGC 种草、爆款视频复刻等场景，并支持爆款素材裂变生成多版本广告、商品视觉物料一站式生成，以及视频翻译与多渠道画幅适配。", "type": "product", "relTime": "5天前"}, {"id": 73, "title": "MiniCPM-V 4.7 在 Jetson Orin 本地跑视觉与机器人规划", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2123229579737530548", "date": "2026-11-19T01:39:14.000Z", "summary": "太惊人了！🤯 MiniCPM-V 4.7 在 Jetson AGX Orin 上本地运行视觉和机器人规划，令人兴奋。出色的优化工作，迫不及待想看到你的引擎！🚀💙", "type": "tip", "relTime": "5天前"}, {"id": 74, "title": "Peter 评测对比 OpenAI 的 GPT-6.2 Astra 与 GPT-6.2 Sol", "source": "X：Arena (@arena)", "sourceUrl": "https://x.com/arena/status/2123221208619769903", "date": "2026-11-19T01:05:58.000Z", "summary": "Peter（@petergostev）对 OpenAI 两个新模型 GPT-6.2 Astra 和 GPT-6.2 Sol 做了实测对比，覆盖 3D 场景、游戏、幻灯片、数据可视化、网站、交互应用和 SVG 插画。视频展示了 Astra 在深度与精度上的优势、Sol 在动效与设计上的特点，并对比了运行记录中的成本，Peter 的提示词在推文链接中提供。", "type": "model", "relTime": "5天前"}, {"id": 75, "title": "ORA 用 cuRobo 规划机器人动作", "source": "X：UCSD Hao AI Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2123214034178875823", "date": "2026-11-19T00:37:27.000Z", "summary": "动作更流畅。ORA 现在用 cuRobo 规划每一步动作，并基于机器人深度图像构建的地图进行规划。在 RoboDojo 上，因碰撞而中止的动作从 14.1% 降至 7.0%；在 RoboTwin 上从 18.4% 降至 6.8%。", "type": "product", "relTime": "5天前"}, {"id": 76, "title": "商汤SenseNova U1 Pro登DesignArena第二", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2123207003397074997", "date": "2026-11-19T00:09:31.000Z", "summary": "🏆 在@DesignArena上位列图像实验室第二！ #SenseNova U1 Pro 在图像生成和图像编辑两项中均首次亮相即排名第六，使#商汤 在图像AI实验室中位列第二，仅次于OpenAI。  U1 Pro 还登上了图像偏好度与价格比的帕累托前沿：以有竞争力的生成成本实现出色的图像质量与美学效果，专为大规模视觉创作打造。  感谢DesignArena的认可！", "type": "model", "relTime": "6天前"}, {"id": 77, "title": "地平线发布原生视频几何基础模型 LoFT，多项深度估计指标达 SoTA", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/029/140.htm", "date": "2026-11-18T23:30:03.800Z", "summary": "地平线机器人实验室发布原生视频几何基础模型 LoFT，可从 RGB 视频中联合预测相机位姿、内参及逐帧深度，恢复场景三维结构。该模型采用双循环 Transformer 架构，训练数据约 297 万条有效序列、9.62 亿帧图像记录。在 SpatialBench、ClassicBench 和 VRBench 评测中，LoFT 多项深度估计指标达到 SoTA。", "type": "model", "relTime": "6天前"}, {"id": 78, "title": "Arcade 3.0：一句话生成营销视频，盲测胜 Claude 与 Gemini", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2123154054885056576", "date": "2026-11-18T20:39:07.000Z", "summary": "Arcade 推出 3.0 版 AI 视频工具，面向营销团队，输入一句话并回答两个问题即可生成含配音、字幕、音乐和品牌元素的成品发布视频。它支持在成片中点击某个元素单独修改，其余画面不动。公司称盲测中 B2B 营销人员选择其视频的频率是 Claude Opus 5.5 和 Gemini Argon 生成视频的 2 倍。", "type": "product", "relTime": "6天前"}, {"id": 79, "title": "Google DeepMind 更新 Project Genie：发布 Genie 4、可链式世界和社区画廊", "source": "The Decoder：AI News

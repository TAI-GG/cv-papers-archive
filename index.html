fr 实测 Omni 1.1 视频参考：把车改成船仍保持对参考的忠实", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2095892983878930648", "date": "2026-09-04T15:13:21.000Z", "summary": "fofr 分享对 Omni 1.1 视频参考灵活性的实测，将 Luce 车型生成为船版本，模型在改变必要部分的同时保持对参考的忠实。正文附视频和提示词 \"A boat version of this car\"。", "type": "tip", "relTime": "8小时前"}, {"id": 12, "title": "fofr 演示 Omni 1.1 视频参考与视频延长结合的用法", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2095868940580733284", "date": "2026-09-04T13:37:49.000Z", "summary": "fofr 演示 Omni 1.1 新支持的视频参考功能，可用两条 3 秒参考视频向生成视频插入一致、准确的角色和物体，示例为在行驶的 Ferrari Luce 上倒立的提示词。他还展示将视频延长与视频参考结合的用法，通过引用 VIDEO_REF 并提示 Extend this video 来延续原视频。", "type": "tip", "relTime": "10小时前"}, {"id": 13, "title": "Omni 1.1 新增视频参考功能，可将角色和物体一致地插入生成视频", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2095868365923323917", "date": "2026-09-04T13:35:32.000Z", "summary": "Omni 1.1 现已支持视频参考（video references），可用于将一致且准确的角色和物体插入生成的视频中。作者演示了一段在行驶的 Ferrari Luce 上做倒立的视频，使用两条各 3 秒的参考视频，并以叠加形式展示参考内容与生成结果。", "type": "paper", "relTime": "10小时前"}, {"id": 14, "title": "微信开源多模态嵌入模型 WeMM-Embedding，含 2B/4B/9B 三个版本", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/599.htm", "date": "2026-09-04T13:21:17.000Z", "summary": "微信 AI 宣布开源通用多模态嵌入模型 WeMM-Embedding，含 2B、4B、9B 三个版本，支持文本、图像、视频、视觉文档及交错多模态输入。模型基于 Qwen3.5 多模态架构，WeMM-Embedding-9B 在 MMEB-v2 榜单以 80.6 分位列第一；该模型已大规模部署于视频号、直播、公众号、电商与朋友圈的推荐与搜索系统，日调用量达 10 亿量级。", "type": "model", "relTime": "10小时前"}, {"id": 15, "title": "玉伯用 YouMind 把 UTC 时区疑问变成讲解视频", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2095857355410047094", "date": "2026-09-04T12:51:47.000Z", "summary": "作者 Frank Wang 玉伯把关于 UTC、中国东八区和闰秒（原文写作\"润秒\"，2026 年 10 月可能取消）的疑惑，作为一句话输入给 YouMind：搜索 UTC 的详细资料，面向中学生，图文并茂讲解清楚，做一个 PPT 和视频。YouMind 生成了一个讲解视频，作者称消费就是创作、创作就是消费，邀请大家体验 YouMind 的创作即消费。", "type": "tip", "relTime": "11小时前"}, {"id": 16, "title": "Wan 联合 GMI Cloud 在台北举办 AI 电影创作挑战赛，60 余名创作者用 Wan3.0 产出 17 部短片", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2095847664638419210", "date": "2026-09-04T12:13:16.000Z", "summary": "上周末在台北，Wan 与 GMI Cloud 联合举办沉浸式 AI 电影创作挑战赛，汇聚 19 支团队共 60 余名 AI 视频从业者，基于最新的 Wan3.0 AI 视频模型在数小时内创作出 17 部 AI 生成短片。活动邀请金马奖获奖导演参与圆桌讨论并担任评委，获奖视频已发布在 YouTube 播放列表。", "type": "industry", "relTime": "11小时前"}, {"id": 17, "title": "阿易评 Higgsfield 用 GPT-6 Astra 从口语描述生成白宫椭圆形办公室 3D 场景", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095846225677549615", "date": "2026-09-04T12:07:33.000Z", "summary": "博主转发并点评 Higgsfield 的实测演示，GPT-6 Astra 把口语描述的布景感觉编译成场景代码，在超算集群驱动 Blender 和 Cycles 物理光追引擎，端到端算出白宫椭圆形办公室。原文指出三点变化：自然语言被编译为程序化空间拓扑，交付的是 Blender 里可二次修改的真实模型而非写死视频，渲染难题通过代码交给成熟光线追踪引擎完成。", "type": "tip", "relTime": "11小时前"}, {"id": 18, "title": "Instagram AI 内容标签再陷混乱，The Verge 实测发现只有 Meta 自家信号能触发标注", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/989617/instagram-ai-content-label-confusion", "date": "2026-09-04T12:00:00.000Z", "summary": "The Verge 记者实测发现，Instagram 的 AI Content 标签持续误标普通照片，而带 C2PA 和 SynthID 信号的 Gemini 完全生成图片反而未被标注。", "type": "tip", "relTime": "12小时前"}, {"id": 19, "title": "DeepSeek-V4-Flash-Vision-Exp 上线 SiliconFlow，支持视觉理解与 1M 上下文", "source": "X：硅基流动 SiliconFlow (@SiliconFlowAI)", "sourceUrl": "https://x.com/SiliconFlowAI/status/2095832456108888217", "date": "2026-09-04T11:12:50.000Z", "summary": "DeepSeek-V4-Flash-Vision-Exp 现已上线 SiliconFlow，也可通过 OpenRouter 使用。该模型基于 V4 Flash 加入视觉理解能力，面向多模态任务和 Agent，保留较强文本能力，支持 1M 上下文，MIT 许可。SiliconFlow 定价为缓存输入 $0.028 / M tokens、输入 $0.44 / M tokens、输出 $1.32 ...", "type": "model", "relTime": "12小时前"}, {"id": 20, "title": "为什么 AI 生成的食物图片看起来那么诡异", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/989376/ai-generated-food-why-does-it-look-like-that", "date": "2026-09-04T11:00:00.000Z", "summary": "The Verge 撰文解释餐厅和品牌用 AI 生成的食物宣传图为何频繁出现虫状面条、孔洞和裂纹等问题。牛津大学的 Chris Russell 指出扩散模型先恢复粗结构、后补细节，结构错了细节只会更怪；那不勒斯费德里科二世大学的 Giovanbattista Califano 称扩散模型难以生成细长连续结构，导致意面状伪影和密集孔洞。", "type": "tip", "relTime": "13小时前"}, {"id": 21, "title": "OpenAI 发布 Astra 模型，单张照片可在 Blender 还原可编辑 3D 豪宅", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095815989514657915", "date": "2026-09-04T10:07:24.000Z", "summary": "AYi 转引 @tomkrcha 对 OpenAI 新模型 GPT-6 Astra 的内测实测：输入一张房子平面照片，Astra 在 Blender 中还原出包含家具、电器和玩具的完整 3D 模型。所有零件为可手动拖拽微调的真实几何体，而非不可修改的面条网格，并能在本地设备以 60 帧像游戏一样实时渲染漫游。作者认为这可能重写游戏工业与空间设计的生产流程。", "type": "model", "relTime": "13小时前"}, {"id": 22, "title": "博主实测 Fotor Video Agent：10 分钟生成 60 秒可编辑科普动画", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095812224338333955", "date": "2026-09-04T09:52:27.000Z", "summary": "博主实测 Fotor Video Agent，仅用提示词和一次方案确认，约 10 分钟生成一条 60 秒水循环科普 MG 动画，而同类外包通常要 3000 到 8000 块、一两周。产出包含 6 章旁白脚本、Kian 中文男声配音、15 个独立 MG 场景、8 处场景音效和可编辑多轨时间线，改场景、文字、颜色和声音无需重抽。作者认为这类结构清晰的内容可批量生产，但打动人仍靠选题、脚本和审美。", "type": "tip", "relTime": "14小时前"}, {"id": 23, "title": "HappyHorse 1.1 与 Kling 3.0 同条件对比实测", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2095798104603976052", "date": "2026-09-04T08:56:20.000Z", "summary": "作者批评网上常见的视频模型对比不严谨，用相同提示词、相同参考图、相同时长且不剪辑的方式实测 HappyHorse 1.1 与 Kling 3.0。对比覆盖口型同步、角色与场景一致性、复杂运动、镜头控制和价格五个维度，作者认为 HappyHorse 1.1 在跨镜头一致性上明显更稳，在广告和电商场景下需要更少的重生成，更快达到可交付成片，但强调两个模型各有强项。", "type": "tip", "relTime": "15小时前"}, {"id": 24, "title": "阿里云展示 Qwen 生成演示并提供 Qwen Cloud 与 Model Studio API 入口", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2095774894730412375", "date": "2026-09-04T07:24:07.000Z", "summary": "阿里云发布一段生成演示视频，配文为提示词样例\"Fly， my winged unicorn， take me anywhere in the world my heart desires…\"，并提供更多 API 访问入口：Qwen Cloud（https://click.qwencloud.com/m/20000003017/）和 Model Studio（https://click.ali...", "type": "model", "relTime": "16小时前"}, {"id": 25, "title": "Fotor Video Agent 实测：几句提示词生成 1 分钟水循环科普动画", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095772519672504379", "date": "2026-09-04T07:14:40.000Z", "summary": "作者实测 Fotor Video Agent，仅用几句提示词、约 10 分钟生成一条 60 秒水循环 MG 科普动画，此前同类外包约需 3000 到 8000 元、制作一两周。", "type": "tip", "relTime": "16小时前"}, {"id": 26, "title": "论文《Do LLMs Capture the Diversity in their Training Data？》发现 LLM 输出多样性低于训练数据", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2095768574245884058", "date": "2026-09-04T06:59:00.000Z", "summary": "论文比较模型与训练数据在同一前缀下的条件熵，发现 OLMo、Pythia、GPT-Neo 的输出条件多样性均低于训练数据，图像生成器也存在类似差距。OLMo 20K 样本上训练数据得分 338.58，贪心解码为 218.88，nucleus 采样 287.31，ancestral 采样 297.31；调高温度到 T=1.9 虽匹配训练熵但精度和外部条件 NLL 变差。", "type": "paper", "relTime": "17小时前"}, {"id": 27, "title": "玉伯用一句话提示词 9 分钟做出我的世界迷你版网页小游戏", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2095764351861112994", "date": "2026-09-04T06:42:13.000Z", "summary": "Frank Wang 玉伯用一句话提示词生成《我的世界迷你版》网页小游戏，耗时约 9 分钟（截图显示 Ran for 8m 56s），并放出试玩链接 https://youmind.com/a/mb7IgNGDxyzzqh。截图显示游戏为 3D 方块沙盒，基于 Three.js，含 32×32 程序化地形，支持 WASD 移动、鼠标破坏/放置方块、1~7 切换方块、切换阴影等操作。", "type": "tip", "relTime": "17小时前"}, {"id": 28, "title": "从自己修车窗到自己造自动驾驶汽车", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2095763460609220673", "date": "2026-09-04T06:38:41.000Z", "summary": "作者写道，从当年因为付不起修理费而自己修车窗，到自己动手建造自动驾驶汽车，这个循环现在完成了。推文配有一个视频。", "type": "tip", "relTime": "17小时前"}, {"id": 29, "title": "在 YouMind 用 Fable 5.1 一个提示词做小游戏", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2095761665820360936", "date": "2026-09-04T06:31:33.000Z", "summary": "作者分享在 YouMind 中用 Fable 5.1 模型制作小游戏的做法：打开 YouMind，选择 Fable 5.1 模型，说你要做什么游戏即可生成。", "type": "tip", "relTime": "17小时前"}, {"id": 30, "title": "阿里云展示 Qwen 视频生成效果并开放 API 访问入口", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2095757811347026383", "date": "2026-09-04T06:16:14.000Z", "summary": "阿里云发布一段 POV 风格视频，展示跟随林中音乐声找到场景的生成效果，BGM 支持来自 HappyShrimpAI。文中提供 Qwen Cloud 和 Model Studio 的 API 访问链接。", "type": "model", "relTime": "17小时前"}, {"id": 31, "title": "阿里云 Wan3.0 正式全面开放", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2095742228320711149", "date": "2026-09-04T05:14:18.000Z", "summary": "阿里云宣布 Wan3.0 正式全面开放（generally available），支持 30 秒视频生成和一键文档转视频，定位生产可用，详细指南见 https://click.alibabacloud.com/m/20000003076/", "type": "paper", "relTime": "18小时前"}, {"id": 32, "title": "TechCrunch 解析 AI 生成菜单为何雷同难看：模型收敛与恐怖谷效应", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/03/the-sameness-problem-behind-those-unappetizing-ai-generated-menus", "date": "2026-09-04T04:21:03.000Z", "summary": "TechCrunch 探讨餐厅 AI 生成菜单令人不适的雷同问题。Reality Defender CTO Alex Lisle 解释这是模型训练数据趋同导致的收敛而非模型崩溃，数据集为追求讨喜而同质化；Elon University 的 Lee Rainie 称 AI 会削平细节。德国杜伊斯堡-埃森大学研究发现 AI 食物图像呈现恐怖谷效应，看起来接近真实反而引发更多厌恶。", "type": "tip", "relTime": "19小时前"}, {"id": 33, "title": "Fable 5.1 与 Muse Spark 1.3 对比生成 Three.js 版 BMW S1000RR 3D 模型", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2095720113123274999", "date": "2026-09-04T03:46:26.000Z", "summary": "Alexandr Wang 转发 @srikanthvaluri 的对比演示：用 Fable 5.1 与 Muse Spark 1.3 分别生成 Three.js 中的 BMW S1000RR 仿真 3D 摩托车模型，并评论称效果很酷。", "type": "tip", "relTime": "20小时前"}, {"id": 34, "title": "Alexandr Wang 转发 muse spark 1.3 重建《匹诺曹的谎言》机械心脏的 3D 演示", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2095713478749409301", "date": "2026-09-04T03:20:04.000Z", "summary": "Alexandr Wang 转发用户 @filicroval 的演示，称 muse spark 1.3 在 3D 和 three.js 方面表现出色。该模型根据多张游戏截图参考重建了《匹诺曹的谎言》（Lies of P）中的机械心脏，并生成了爆炸视图。", "type": "tip", "relTime": "20小时前"}, {"id": 35, "title": "Ethan Mollick 实测 GPT-6 Astra 最高档生成 twigl 新哥特式溺水高塔 shader", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2095712569507885252", "date": "2026-09-04T03:16:27.000Z", "summary": "Ethan Mollick 应读者要求，用 GPT-6 Astra 最高设置运行提示词，生成可在 twigl.app 运行的 shader，内容为风暴海浪中部分被淹没的无限新哥特式高塔城市，并附 twigl.app 运行链接。作者在引用中对比了此前 Fable 5.1 和 Fable 5 用同一提示词生成的同类作品，欢迎读者自行比较。", "type": "tip", "relTime": "20小时前"}, {"id": 36, "title": "杭州黄昏时分 Unitree G1 机器人训练画面", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2095692831289729217", "date": "2026-09-04T01:58:01.000Z", "summary": "作者发布一段视频，记录杭州黄昏时分 Unitree G1 机器人的训练场景。", "type": "industry", "relTime": "22小时前"}, {"id": 37, "title": "ZHO 用 GPT 4o 生成创意图像《AGI》", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2095685157378507249", "date": "2026-09-04T01:27:32.000Z", "summary": "ZHO 发布创意系列新作《AGI》，标注由 GPT 4o Creation 生成。画面为一位佩戴黑色墨镜与 OpenAI 标志耳饰的女性含着写有 AGI 字样的红色棒棒糖，右下角带 O4Z 签名标识。", "type": "tip", "relTime": "22小时前"}, {"id": 38, "title": "Cognition：GPT-6 Astra 在 FrontierCode 1.1 上以低 64% 成本逼近 Fable 5 编码水平", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2095648712639070518", "date": "2026-09-03T23:02:43.000Z", "summary": "Cognition 宣布 GPT-6 Astra 将接入 Devin，在 FrontierCode 1.1 上得分与 Fable 5 相差不到 0.4 分，成本降低 64%，并在其内部测试基准上创造 SOTA，生成更全面的测试、更清晰的报告和更好的视频证据。", "type": "tip", "relTime": "1天前"}, {"id": 39, "title": "职业建筑师评 GPT-6 Astra：强在旧链路而非重建工作逻辑", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2095631162089865531", "date": "2026-09-03T21:52:58.000Z", "summary": "ZHO 刷了大量 GPT-6 Astra 提前测试案例后评价，其惊艳点在于通过建模/渲染软件实现高质量 3D 建模和渲染，建筑与游戏均适用。作为职业建筑师，他认为这并不惊艳，早在 2023 年就提出 AI 能生成真实照片后就不再需要效果图；如果 GPT-6 真的足够强，应重建全新的工作逻辑和链路，而不是更好地完成旧链路，那才是迈向 AGI 的起点。", "type": "tip", "relTime": "1天前"}, {"id": 40, "title": "GPT-6 Astra 即将接入 Devin，成本比 Fable 5 低 64%", "source": "X：Jason Liu (@jxnlco)", "sourceUrl": "https://x.com/jxnlco/status/2095621221010551142", "date": "2026-09-03T21:13:28.000Z", "summary": "Cognition 宣布 GPT-6 Astra 即将登陆 Devin。在 FrontierCode 1.1 上，Astra 表现与 Fable 5 相差 0.4 分以内，成本降低 64%，并在其内部测试基准上创下 SOTA，生成更全面的测试、更清晰的报告和更好的视频证据。", "type": "paper", "relTime": "1天前"}, {"id": 41, "title": "astra 实测展示 SVG 生成能力", "source": "X：Jason Liu (@jxnlco)", "sourceUrl": "https://x.com/jxnlco/status/2095605078342459529", "date": "2026-09-03T20:09:19.000Z", "summary": "Jason Liu 发帖称 astra 在生成 SVG 方面表现出色，并附上两个视频作为演示。", "type": "tip", "relTime": "1天前"}, {"id": 42, "title": "ZHO 演示 GPT-6 Astra 打通建筑设计从平面图到 UE5 漫游出图全流程", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2095602825430802495", "date": "2026-09-03T20:00:22.000Z", "summary": "ZHO 转引 Dimillian 的发布演示，称 GPT-6 Astra 可完成建筑设计的全流程。流程包括先设计平面图，再在 Blender 中建模，到 UE5 中渲染并生成建筑漫游视频和细节（含可运行的咖啡机），最后输出大图。作者认为前期概念方案可交给 GPT-6 完成。", "type": "paper", "relTime": "1天前"}, {"id": 43, "title": "OpenAI 发布 GPT-6 Astra 主攻电脑操作、软件工程与视觉理解", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2095596020638036311", "date": "2026-09-03T19:33:20.000Z", "summary": "OpenAI Developers 宣布 GPT-6 Astra 是其在电脑使用、软件工程和视觉理解方面迄今最好的模型，并附上正在使用该模型的开发者的视频分享。", "type": "model", "relTime": "1天前"}, {"id": 44, "title": "Runway 发布通用世界模型 GWM Worlds 2 研究进展", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2095540014645920040", "date": "2026-09-03T15:50:47.000Z", "summary": "Runway 公布通用世界模型 GWM Worlds 2 的新研究，可生成 720p、24 fps 连续视频并配 48000 Hz 音频的交互式实时模拟。用户可定义环境、主体、视觉风格、物理规则和氛围，用文本动作和连续镜头运动控制世界，会话没有预设长度，不遵循固定片段或脚本。", "type": "model", "relTime": "1天前"}, {"id": 45, "title": "YouMind 夜间 Auto 模型对话积分免费", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2095538233329451063", "date": "2026-09-03T15:43:42.000Z", "summary": "YouMind 宣布今晚 23：30 至次日 9：30 期间，在对话框保持 Auto 模型即可畅用，所有对话积分消耗为 0。该活动已自动开启，不含图片、视频等多模态内容。", "type": "model", "relTime": "1天前"}, {"id": 46, "title": "谷歌 DeepMind 发布 WeatherNext 3：分辨率最高 5 公里的 AI 天气预报模型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/198.htm", "date": "2026-09-03T15:15:52.000Z", "summary": "谷歌 DeepMind 和 Google Research 发布 WeatherNext 3，称其为最先进、最准确的全球气象模型。模型基于原始卫星数据和稀疏气象站观测训练，可每小时生成一次预报，地表关键变量分辨率达 5 公里，并新增针对可再生能源的 100 米高度风速、云量和太阳辐射预测。即日起为谷歌搜索、Gemini 应用、谷歌地图、地图平台气象 API 和 Earth Engine 提供支持。", "type": "paper", "relTime": "1天前"}, {"id": 47, "title": "OpenAI 疑似准备发布图像模型升级 ImageGen 2.5", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2095528074615906614", "date": "2026-09-03T15:03:20.000Z", "summary": "TestingCatalog 发现 OpenAI 正在准备图像模型的下一次升级，ChatGPT 内置的隐藏公告弹窗写着图像创作迎来重大升级，文案为更高质量结果、更快生成和更智能的创意工具。", "type": "model", "relTime": "1天前"}, {"id": 48, "title": "Google 发布 AI 天气模型 WeatherNext 3，引入实时卫星观测", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/988921/weather-forecast-ai-model-google-satellite-update", "date": "2026-09-03T15:00:00.000Z", "summary": "Google 推出更新的 AI 天气模型 WeatherNext 3，可基于实时卫星观测每小时生成一次预报，全球分辨率较上一代提升五倍。相较 WeatherNext 2 的 6 小时一次、25 公里网格，新模型对温度和湿度等变量最高达 5 公里分辨率，提前一天以上的降水预报准确率最高提升 50%，在雨量计较少的美国和欧洲以外地区改进最大。", "type": "model", "relTime": "1天前"}, {"id": 49, "title": "NeoMME 发布 260M 与 800M 多语言多模态编码器，权重以 Apache 2.0 开源", "source": "Hugging Face：Blog（RSS）", "sourceUrl": "https://huggingface.co/blog/Hcompany/neomme", "date": "2026-09-03T13:13:48.000Z", "summary": "H Company 团队发布 NeoMME，含 260M 和 800M 两个尺寸的多语言多模态编码器，用单个双向 Transformer 从零处理文本 token 和 32×32 图像 patch，不使用预训练视觉塔或因果语言模型，训练采用掩码离散扩散目标，每个模型处理约 5240 亿 packed token。", "type": "model", "relTime": "1天前"}, {"id": 50, "title": "机器人技术为何如此困难：一项系统性挑战清单", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://secondthoughts.ai/p/14-reasons-robotics-is-hard", "date": "2026-09-03T10:41:16.699Z", "summary": "作者指出当前 AI 进展几乎全在知识工作领域，物理侧的通用机器人仍停留在测试设施和演示视频，且 demo 视频难以评估真实水平，可能只展示百次尝试中的一次成功。文章列出从手部灵巧性、视觉理解、规划反应、速度、力量、安全、续航散热、泛化边界情况到算力、规模化供应链和社会监管等十余项待克服的挑战，认为物理世界的 demo 与现实差距会比 LLM 基准与实际工作的差距更大。", "type": "tip", "relTime": "1天前"}, {"id": 51, "title": "小红书与 vivo 联合打通 3D 图片全链路技术实践", "source": "公众号：小红书技术（dots.llm）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg4OTc2MzczNg%3D%3D&mid=2247496302&idx=1&sn=cff53d02e6effd993cb6dd43ec976cce", "date": "2026-09-03T10:17:12.000Z", "summary": "小红书与 vivo 联合打通从 vivo 相册生成 3D 图到小红书发布、分发与消费的完整 3D 内容链路，并共同设计面向移动社交场景的新型 3D 格式。", "type": "tip", "relTime": "1天前"}, {"id": 52, "title": "玉伯分享两例用户反馈：YouMind 靠一站式创作与一致性生成吸引用户迁移", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2095455177390395641", "date": "2026-09-03T10:13:40.000Z", "summary": "YouMind 负责人玉伯称收到两例用户反馈，印证产品差异化：一是 All-in-One 创作工作室带来便捷，用户认为单工具比多工具方便；二是生图、生 PPT、生视频功能持续解决人物、风格等一致性问题，让 Lovart、LibTV 用户愿意迁移到 YouMind。附图为一封用户来信，称赞无需切换标签页即可完成研究、写作和生成视觉素材。作者表示打磨过程辛苦，但看到用户反馈和付款感到开心。", "type": "tip", "relTime": "1天前"}, {"id": 53, "title": "摩尔线程宣布打通具身智能完整链路", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/037.htm", "date": "2026-09-03T09:09:30.000Z", "summary": "摩尔线程在 2026 年半年度业绩说明会上表示，已打通具身智能从合成数据生成、大模型训练、仿真验证到端侧硬件部署的完整链路。", "type": "industry", "relTime": "1天前"}, {"id": 54, "title": "World Labs 发布从零训练的多模态世界模型 Atlas，李飞飞称其为相机条件世界模型新标杆", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095430712073847088", "date": "2026-09-03T08:36:27.000Z", "summary": "World Labs 宣布发布 Atlas，一个从零训练的多模态世界模型，李飞飞称其为同类中首个，并称之为有史以来最好的相机条件世界模型。Atlas 支持像素级精确的相机控制生成画面、从单张输入图像重建大场景、通过重切视频模拟时空、从一张或多张图像原生输出 3D 空间，以及将多张带位姿图像合成为一致的 3D 世界，应用场景覆盖 VFX 到机器人。", "type": "model", "relTime": "1天前"}, {"id": 55, "title": "阿易评李飞飞团队 Atlas：几段手机视频生成可交互三维世界，降低机器人训练数据成本", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095429574293361122", "date": "2026-09-03T08:31:56.000Z", "summary": "阿易转发并解读李飞飞团队的 Atlas，称它能把几段普通手机视频生成带物理引擎的三维交互世界，可自由调整运镜、光照材质，物体碰撞按真实物理法则展开。作者认为这等于为具身智能机器人提供了低成本、可无限扩充的虚拟训练场，把机器人换环境需重新实拍采集的数据成本大幅降低，并提出了家庭保洁和工厂流水线哪个先落地的问题。", "type": "tip", "relTime": "1天前"}, {"id": 56, "title": "蚂蚁 inclusionAI 开源 LLaDA-Image 图像生成与编辑模型家族", "source": "蚂蚁 inclusionAI：HuggingFace 新模型", "sourceUrl": "https://huggingface.co/inclusionAI/LLaDA-Image-Turbo-FP8", "date": "2026-09-03T08:07:02.000Z", "summary": "蚂蚁 inclusionAI 发布开源统一图像生成与编辑模型 LLaDA-Image 家族，包括 6B 参数、50 步采样的 Base 版和 2-4 步的 Turbo 蒸馏版，同时提供 BF16 与 FP8 checkpoint 及 Diffusers 推理代码。", "type": "model", "relTime": "1天前"}, {"id": 57, "title": "蚂蚁 inclusionAI 开源 6B 统一图像生成与编辑模型 LLaDA-Image", "source": "蚂蚁 inclusionAI：HuggingFace 新模型", "sourceUrl": "https://huggingface.co/inclusionAI/LLaDA-Image-FP8", "date": "2026-09-03T08:06:39.000Z", "summary": "蚂蚁 inclusionAI 发布开源统一图像生成与编辑模型 LLaDA-Image，提供 50 步 Base 和 4 步蒸馏 Turbo 两类 checkpoint，均有 BF16 与 FP8 版本。", "type": "model", "relTime": "1天前"}, {"id": 58, "title": "Muse Spark 1.3 xhigh 演示太空站穿行视频", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2095388793151074625", "date": "2026-09-03T05:49:53.000Z", "summary": "Alexandr Wang 转发 @loktar00 用 Muse Spark 1.3 xhigh 生成的太空站穿行视频，并评价 this is pretty cool。", "type": "paper", "relTime": "1天前"}, {"id": 59, "title": "开源视频生成方法 Video Delta Net （VDN） 发布：混合注意力实现近无损实时文生视频", "source": "X：马东锡 NLP (@dongxi_nlp)", "sourceUrl": "https://x.com/dongxi_nlp/status/2095382936769991110", "date": "2026-09-03T05:26:37.000Z", "summary": "Video Delta Net （VDN） 发布，采用混合注意力实现近无损质量的实时文本生成视频，称开源视频生成速度已超过播放速度。VDN 将 Minimax-H3 加速 75-90 倍，在 8× NVIDIA B200 GPU 上 11 秒生成 14 秒 768p 视频，并开源 checkpoint、训练/推理代码和技术博客。", "type": "model", "relTime": "1天前"}, {"id": 60, "title": "纽约市暂停八年级及以下学生使用生成式 AI", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2095370185540772094", "date": "2026-09-03T04:35:56.000Z", "summary": "据 WSJ，纽约市暂停八年级及以下年级面向学生的生成式 AI，禁令影响近 60 万学生，并禁止所有年级使用陪伴型聊天机器人。高中采取受控路径：最多 5 万名学生可参加 5 个教师监督的 AI 试点，所有高中生每年接受两次 AI 素养教育。", "type": "industry", "relTime": "1天前"}, {"id": 61, "title": "Ethan Mollick 用一段提示词让 Fable 5.1 生成《伊利亚特》船目 3D 交互地图", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2095352019498447090", "date": "2026-09-03T03:23:45.000Z", "summary": "Ethan Mollick 公开一段用于 Fable 5.1 的提示词，要求生成《伊利亚特》船目（Catalog of Ships）的可探索 3D 船只地图，结合真实图像与考古数据，并用智能体测试和修订，成品见 https://homer-catalogue-of-ships.netlify.app/。", "type": "tip", "relTime": "1天前"}, {"id": 62, "title": "Wan 3.0 登顶 Artificial Analysis 视频编辑榜单，文生视频带音频位列第二", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2095349174799888760", "date": "2026-09-03T03:12:27.000Z", "summary": "Artificial Analysis 评测显示，阿里巴巴 Wan 3.0 在视频编辑带音频榜单首次登顶第一，文生视频带音频位列第二，图生视频带音频排名第五。该模型为一体化视频生成与编辑模型，支持最长 30 秒 1080p 原生音频输出，可接受文本、图片、视频、音频、文档和网页作为创作参考，并支持指令式编辑画面、剧情、对话和声音。", "type": "tip", "relTime": "1天前"}, {"id": 63, "title": "阿里云架构师谈 Qwen3.8-Max 为团队带来的变化", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2095343822184325468", "date": "2026-09-03T02:51:11.000Z", "summary": "阿里云解决方案架构师 Joey Huang 在视频中介绍 Qwen3.8-Max 为其团队带来的变化：团队不再人工分派工单，早晨醒来可看到自动生成的摘要，说明哪些已上线、哪些在评审、哪些需要本人处理。他表示因此能把时间重新投入产品、客户和架构，并附上了 Qwen Cloud 与 Model Studio 的试用及 API 入口链接。", "type": "tip", "relTime": "1天前"}, {"id": 64, "title": "美团智播解析数字人直播技术：形象生成、动作驱动与万路并发方案", "source": "公众号：龙猫LongCat（美团）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MjM5NjQ5MTI5OA%3D%3D&mid=2651783277&idx=1&sn=69b406db34fc05f4a17b0310dcf3a7f5", "date": "2026-09-03T02:24:00.000Z", "summary": "美团智播官方发布技术长文，介绍AI数字人直播的完整技术闭环，涵盖高保真形象生成与编辑（SDIP、SREdit）、文本驱动动作生成（MoTiGA）、语音手势协调生成（StreamingTalk）和视觉token压缩推理加速（Glance2Gaze）。", "type": "tip", "relTime": "1天前"}, {"id": 65, "title": "戚薇回应 AI 授权\"卖脸\"争议：更愿意\"主动出击\"，数字分身将主演 AI 漫剧《末日盛夏》", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/997/747.htm", "date": "2026-09-03T01:00:19.000Z", "summary": "戚薇在《中国新闻周刊》9 月 2 日报道的采访中回应\"卖脸\"争议，称其数字分身授权是有期限、有范围、有审核和追责的，且只开放给合作的影视项目，而非向所有人开放。她的数字分身将主演末世 AI 漫剧《末日盛夏》，主角名为\"韩清夏\"。她表示规范授权是把合法使用与非法使用区分开，并认为真人戚薇和数字形象应成为两条独立又协同的创作线。", "type": "tip", "relTime": "1天前"}, {"id": 66, "title": "Qwen 发布 Qwen-Drive-1.0：面向自动驾驶的视觉语言基础模型", "source": "Qwen：Blog Retrieval（API）", "sourceUrl": "https://qwen.ai/blog?id=qwen-drive-1.0", "date": "2026-09-03T00:00:00.000Z", "summary": "Qwen 团队发布 Qwen-Drive-1.0，称其为首个在预训练阶段统一 3D 感知与视觉问答、并延伸到运动规划的自动驾驶视觉语言基础模型，基于原生多模态 Qwen3.5-4B 且不改动预训练架构。", "type": "model", "relTime": "2天前"}, {"id": 67, "title": "Last Translation Benchmark 发布，用人工评审的多模态样本测试机器翻译模型极限", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.04173", "date": "2026-09-03T00:00:00.000Z", "summary": "研究者推出 Last Translation Benchmark，收集经同行评审的人工创作样本（文本、图像、音频、视频），用于打破主流机器翻译模型。每个样本附带手工编写的验证规则，描述具体失败情形，使评估可靠且可操作；该数据集为持续接收投稿的 live dataset，当前版本 LTBv1 收录 2026 年 9 月 1 日前被接受的贡献。", "type": "paper", "relTime": "2天前"}, {"id": 68, "title": "长视频多模态模型视觉token分配受控研究：选择、压缩与再分配", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.03820", "date": "2026-09-03T00:00:00.000Z", "summary": "arXiv 论文《Select， Compress， Reinvest》在固定评分器、分辨率策略与回答模型的前提下，逐一检验长视频 MLLM 的视觉token分配决策，覆盖六种免训练选择规则、三个长视频基准和两个回答模型。", "type": "paper", "relTime": "2天前"}, {"id": 69, "title": "Scal3R 提出多相对位姿查询方法，提升长视频在线 3D 重建稳定性", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.04201", "date": "2026-09-03T00:00:00.000Z", "summary": "Scal3R 将在线 3D 重建重新表述为多参考相对位姿查询，用约占参数 1% 的可学习 token 通过非对称注意力注入冻结骨干，并结合带回环闭合的在线位姿图优化抑制长程漂移。", "type": "paper", "relTime": "2天前"}, {"id": 70, "title": "Puffin-World 提出原生 3D 世界状态的统一多模态世界模型并开源", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.04196", "date": "2026-09-03T00:00:00.000Z", "summary": "Puffin-World 是一个统一多模态架构，不依赖外部离线模块即可实现物理理解、空间模拟和 3D 世界生成与重建。该框架联合建模物理（重力场与纬度）、几何（深度）和外观（图像）三种原生世界状态，并引入统一 Omni-Camera 表示与跨未来帧传播物理动态的策略，在单一生成过程中同时合成未来视图并重建底层几何。", "type": "paper", "relTime": "2天前"}, {"id": 71, "title": "WorldReward 提出面向相机条件世界模型的 VLM 奖励建模方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.03952", "date": "2026-09-03T00:00:00.000Z", "summary": "WorldReward 是一个基于 VLM 的成对偏好奖励模型，为相机条件世界模型统一评估动作一致性与视觉质量。方法将视频分解为动作对齐的块并投票聚合，配套发布人工标注的 WorldReward-Bench，在三个维度上分别超过 GPT-5.5 约 3.42、1.45 和 3.56 个百分点，用于 HY-WorldPlay 1.5 的 RL 后训练可同时提升动作执行与视觉质量。", "type": "paper", "relTime": "2天前"}, {"id": 72, "title": "FlashRender：基于相机控制视频 MeanFlow 的少步生成渲染框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.03563", "date": "2026-09-03T00:00:00.000Z", "summary": "论文提出 FlashRender，一个少步生成渲染框架，可在数秒内沿目标相机轨迹重新渲染源视频。方法引入 RETA 将源视频隐表示与冻结视觉几何模型的目标视频特征对齐，实现采样步数一致的相机控制，再用 MeanFlow 目标微调并结合 on-policy flow map 蒸馏。实验显示其在视频质量和几何一致性上匹配多步基线，采样成本降低 25 倍，并在分布外目标相机轨迹下具备更强的相机可控性。", "type": "paper", "relTime": "2天前"}, {"id": 73, "title": "LLaDA-Image 发布：用完全开放的训练配方构建强图像生成模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.03796", "date": "2026-09-03T00:00:00.000Z", "summary": "LLaDA-Image 是一个统一框架，包含从零训练的 6B Diffusion Transformer 和基于 LLaDA2.0-Mini 扩散语言模型骨干的冻结视觉语言理解模块。", "type": "paper", "relTime": "2天前"}, {"id": 74, "title": "Principia 基准：通过成对物体的关系不变量评测视频模型的物理推理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.04200", "date": "2026-09-03T00:00:00.000Z", "summary": "论文提出 Principia 基准，用 529 个真实场景中的配对物体关系不变量评测视频生成模型和 VLM 的牛顿物理一致性，覆盖重力、摩擦、转动惯量等 8 种现象。", "type": "paper", "relTime": "2天前"}, {"id": 75, "title": "Editable Visual Design 论文提出基于 Coding Agent 的可编辑视觉设计新范式", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.04034", "date": "2026-09-03T00:00:00.000Z", "summary": "论文提出 Editable Visual Design 范式，由 Coding Agent 驱动，将 VLM 作为理解需求、规划任务和审美判断的创意大脑，将图像生成模型作为按需合成独立视觉素材的视觉世界模拟器。", "type": "paper", "relTime": "2天前"}, {"id": 76, "title": "Meta Muse Spark 从 1.1 迭代到 1.3，55 天内 3D 生成保真度显著提升", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2095299414235676948", "date": "2026-09-02T23:54:43.000Z", "summary": "Alexandr Wang 转发 @EnactraAI 对 Meta Muse Spark 1.1 → 1.2 → 1.3 的对比：同一建筑、仅凭照片生成 3D 仿真的任务中，几何、结构和视觉保真度显著提升，总成本保持在 $0.60，从 1.1 到 1.3 仅用 55 天。", "type": "paper", "relTime": "2天前"}, {"id": 77, "title": "Meta 发布 Muse Spark 1.3，第三方实测对比 1.2 版本", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2095248586686812513", "date": "2026-09-02T20:32:45.000Z", "summary": "Meta 的 Muse Spark 1.3 发布，@aimlapi 随即用同一提示词对比两个版本，任务为生成三个收藏级 3D 雕塑，包括维京头盔、镶钻斧和带船员的长船，各输出一个自包含 HTML 文件，单次生成。结果 Muse Spark 1.3 消耗 22，474 tokens、花费 $0.10，Muse Spark 1.2 消耗 19，324 tokens、花费 $0.08。Alexan...", "type": "product", "relTime": "2天前"}, {"id": 78, "title": "Grok Imagine 推出 Draw 功能，涂鸦几秒内生成图像", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2095233525939368356", "date": "2026-09-02T19:32:54.000Z", "summary": "Grok Imagine 新增 Draw 功能，用户在菜单中选择 Draw 后画出任意内容，Grok 可在几秒内将其生成图像。作者称该功能适合儿童使用，并形容创造力因此成为超能力。", "type": "paper", "relTime": "2天前"}, {"id": 79, "title": "FastH3 支持 NVIDIA DGX Spark 与 Apple Silicon，本地视频生成提速 8x", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2095229744463954064", "date": "2026-09-02T19:17:53.000Z", "summary": "FastVideo 发布的 FastH3 现已支持 NVIDIA DGX Spark，并通过 MLX 支持 Apple Silicon，较 MiniMax H3 基础版本地生成提速 8x。文中展示了一段 15 秒 1344×768 的视频，由两台 NVIDIA DGX Spark 完全本地生成。", "type": "product", "relTime": "2天前"}, {"id": 80, "title": "MiniMax H3 据提示词将角色参考图生成 15 秒创作过程视频", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2095228354211594543", "date": "2026-09-02T19:12:21.000Z", "summary": "MiniMax 官方转发用户 @aimikoda 的演示：用一段提示词可把角色参考图变成 15 秒创作过程视频，从草图到最终渲染在绘图 UI 中逐步完成，提示词已附在原文。MiniMax 官方感叹模型能力强大，并调侃世界可能只是一个视频生成模型的模拟。", "type": "model", "relTime": "2天前"}, {"id": 81, "title": "FastVideo 让 FastH3 支持 NVIDIA DGX Spark 与 Apple Silicon 本地运行", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2095223988201120039", "date": "2026-09-02T18:55:00.000Z", "summary": "FastVideo 宣布 FastH3 现已支持 NVIDIA DGX Spark 和 Apple Silicon（通过 MLX），相比基线 MiniMax H3 实现本地生成 8x 加速。演示中的 15 秒 1344×768 视频片段由两台 NVIDIA DGX Spark 完全本地生成。", "type": "product", "relTime": "2天前"}, {"id": 82, "title": "Anthropic 上线 Claude 生成文件检测工具", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://claude.com/check-content", "date": "2026-09-02T17:53:19.500Z", "summary": "Anthropic 上线检测文件是否由 Claude 生成的浏览器工具，文件不上传、仅读取本地嵌入的内容凭证。工具识别基于 C2PA 开放行业标准的加密签名元数据，支持 .png、.jpg、.svg 等文件类型，文本水印检测则通过面向合格机构的私有预览 Detection API 提供。", "type": "product", "relTime": "2天前"}, {"id": 83, "title": "李飞飞 World Labs 发布多模态世界模型 Atlas", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095204264729817235", "date": "2026-09-02T17:36:38.000Z", "summary": "World Labs 发布多模态世界模型 Atlas，官方称其可生成具有像素级精确相机控制的图像和视频帧，并在 3D 中重建。作者评价其可生成可交互的 3D 世界，认为对 2D 文生视频和三维建模、游戏行业有冲击。", "type": "model", "relTime": "2天前"}, {"id": 84, "title": "Ethan Mollick 试用 Gemini 3.8 Flash 并用同一提示词对比 shader 生成效果", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2095203002210807816", "date": "2026-09-02T17:31:37.000Z", "summary": "Ethan Mollick 称自己获得 Gemini 3.8 Flash 早期访问，认为它是很好的 Flash 模型，但不等同于前沿模型。他用相同提示词让 Gemini 3.8 Flash 快速生成被淹没的新哥特式高塔 twigl shader，并附视频与 Fable 5.1 及此前模型的版本作对比。", "type": "tip", "relTime": "2天前"}, {"id": 85, "title": "Pangram CEO 称我们正危险接近死互联网理论", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/podcast/were-dangerously-close-to-dead-internet-theory-says-pangrams-ceo", "date": "2026-09-02T17:09:57.000Z", "summary": "Pangram CEO Max Spero 做客 TechCrunch Equity 播客，谈 AI 生成内容检测的问题。话题涵盖 Substack 新闻通讯、在线欺诈，以及人类写作的未来。", "type": "tip", "relTime": "2天前"}, {"id": 86, "title": "GPT-Image-2 触发风控拒绝时仍会在步骤中残留已生成的草图", "source": "X：阑夕 (@foxshuo)", "sourceUrl": "https://x.com/foxshuo/status/2095181964831793651", "date": "2026-09-02T16:08:01.000Z", "summary": "阑夕实测发现 GPT-Image-2 偶尔会有思维链残余：一次生成图片触发风控被拒绝，但已生成的草图在尚未按其要求切割成 5 张图片之前，仍保留在步骤里。", "type": "tip", "relTime": "2天前"}, {"id": 87, "title": "赵昊与百度百舸团队对谈：世界模型如何走向规模化训练", "source": "公众号：百度智能云（文心）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzA5NTQ5MzE5OQ%3D%3D&mid=2653159969&idx=2&sn=30a906a05a4fc100263038d1ffa4f687", "date": "2026-09-02T15:52:36.000Z", "summary": "百度智能云具身智能前沿讲堂上，清华大学AIR助理教授赵昊与百度智能云AI计算首席科学家王雁鹏等对谈世界模型规模化问题。赵昊提出以3D/4D Token为核心的世界模型路线，认为世界模型不等于视频生成，需表达空间结构、光学属性和速度、加速度等动态信息；其OmniNWM通过动作编码与相机参数解耦，实现200帧稳定生成，并与精锋医疗、极智嘉分别合作手术预演和仓库机器人场景。", "type": "tip", "relTime": "2天前"}, {"id": 88, "title": "Google 发布 Gemini 3.8 Flash，面向复杂智能体与多步任务", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2095175759606231439", "date": "2026-09-02T15:43:22.000Z", "summary": "Google 发布 Gemini 3.8 Flash，主打处理复杂智能体和多步任务，推理能力显著提升，不仅写代码还能驾驭复杂项目。模型延续 effort controls，使完成任务的思考量与 token 花费成正比；官方还演示其在 @antigravity 中结合原生视频理解与编码，自主构建 3D 游戏、试玩找错并执行代码修改。", "type": "model", "relTime": "2天前"}, {"id": 89, "title": "Google Pics 上线，面向 Workspace 客户与 Google AI Pro/Ultra 订阅者", "source": "X：小北 (@frxiaobei)", "sourceUrl": "https://x.com/frxiaobei/status/2095140282002289155", "date": "2026-09-02T13:22:23.000Z", "summary": "Google Workspace 宣布推出 Google Pics，AI 图像创建功能正逐步推送给 Google Workspace 客户及 Google AI Pro 和 Ultra 订阅者。该工具支持编辑单个对象、润色或翻译文本，并支持团队协作，可访问 http://pics.new 试用。作者评论认为 Google 的 AI 产品线越来越分散，图像有 Gemini、Nano Banan...", "type": "product", "relTime": "2天前"}, {"id": 90, "title": "戴森发布内置摄像头与 AI 的 CameraJet 牙刷，售价 $499", "source": "X：小北 (@frxiaobei)", "sourceUrl": "https://x.com/frxiaobei/status/2095140183859425768", "date": "2026-09-02T13:22:00.000Z", "summary": "Dyson 发布 CameraJet 牙刷，售价 $499，刷头内置 10 万像素微距镜头，刷牙时每秒拍 28 张图像，AI 用 47 万张牙科图像训练，检测到牙缝后在 100 毫秒内喷射漱口水自动完成类似牙线的清洁。", "type": "paper", "relTime": "2天前"}, {"id": 91, "title": "访谈 LTX 联合创始人兼 CTO Yaron Inger，检验 LTX-2.5 的世界模型主张", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2095137667570716711", "date": "2026-09-02T13:12:00.000Z", "summary": "作者与 Peter 对话 LTX 联合创始人兼 CTO Yaron Inger，围绕其新开放权重的视频与世界模型 LTX-2.5 展开讨论。问题包括模型在生成逼真画面之外实际理解了什么、物理能力是否足够支撑机器人领域、原生多镜头生成在剪辑间记住了什么、速度基准是否公平、创作者在可负担硬件上的预期，以及开放下载权重后 LTX 如何构建商业模式。", "type": "tip", "relTime": "2天前"}, {"id": 92, "title": "World Labs 发布世界模型 Atlas：从少量照片生成、重建并模拟 3D 世界", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/world-labs-unveils-atlas-a-single-ai-model-that-generates-reconstructs-and-simulates-3d-worlds-from-just-a-few-photos", "date": "2026-09-02T12:28:36.000Z", "summary": "World Labs（李飞飞联合创立）发布世界模型 Atlas，可从几张照片完成 3D 场景生成、重建与仿真，输出最高 1440p、1 分钟的可控镜头视频，并支持点云与 3D Gaussian splats 等 3D 数据输出。", "type": "model", "relTime": "2天前"}, {"id": 93, "title": "World Labs 发布从头训练的多模态世界模型 Atlas", "source": "X：小北 (@frxiaobei)", "sourceUrl": "https://x.com/frxiaobei/status/2095125335587312014", "date": "2026-09-02T12:23:00.000Z", "summary": "World Labs 团队宣布达成重要里程碑，发布从头训练的多模态世界模型 Atlas，称其为首个此类模型。Atlas 支持像素级精确的相机控制生成帧、从单张输入图像重建大场景、通过重构视频模拟时空、从一张或多张图像原生输出 3D 空间，以及将多张带位姿图像合成为一致的 3D 世界，并称其为目前最好的相机条件世界模型，可用于 VFX 到机器人等场景。", "type": "model", "relTime": "2天前"}, {"id": 94, "title": "阿里云推出一体化 AI 生产力平台 QwenWork", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2095091618793554321", "date": "2026-09-02T10:09:01.000Z", "summary": "阿里云宣布 QwenWork 正式上线，这是一款面向全球团队的一体化 AI 生产力平台。它可将简报转化为成品文档、幻灯片和网页，并在同一平台内生成图像、音频和视频，还支持分析数据报告和处理复杂电子表格，减少团队在多个 AI 工具之间的切换。入口：https://click.alibabacloud.com/m/20000003003/", "type": "paper", "relTime": "2天前"}, {"id": 95, "title": "国内首部 AIGC 长剧《后西游记》上线芒果 TV，制作周期较传统三维动画减少 70%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/997/548.htm", "date": "2026-09-02T09:53:07.000Z", "summary": "国内首部无真人演员的 AIGC 长剧《后西游记》于 8 月 31 日上线芒果 TV 并登陆湖南卫视黄金档。芒果超媒董事长蔡怀军称，该剧 30 集、单集 40 分钟，总成本约为同类 S 级真人剧几分之一，从策划到上线时间较传统三维动画压缩 70%；制作流程为导演定情绪基调、美术完成设计、AI 团队从文生图推进到图生视频。该剧也是\"广电 21 条\"发布后首部\"边审边播\"剧集。", "type": "industry", "relTime": "2天前"}, {"id": 96, "title": "星源智与灵心巧手共同发起\"中国具身智能 Tier 1 产业联盟\"", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/997/543.htm", "date": "2026-09-02T09:31:27.000Z", "summary": "由星源智与灵心巧手共同发起的\"中国具身智能 Tier 1 产业联盟\"于 9 月 2 日正式成立，联合奥比中光、法奥机器人、禾赛科技、速腾聚创、珞石机器人等 20 余家产业链企业。成员覆盖具身大脑、灵巧手、语音交互、激光雷达、视觉感知、触觉感知、机械臂、底盘、无线通信、热管理等关键环节。", "type": "industry", "relTime": "2天前"}, {"id": 97, "title": "昆仑万维 SkyProduction 天工工作台新版本上线，打通剧本到成片流程", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI1MzE1NDc3Mg%3D%3D&mid=2247510239&idx=1&sn=ecc77575b50f897c98b023483cb12cab", "date": "2026-09-02T08:06:50.000Z", "summary": "昆仑万维 SkyProduction 天工工作台全新版本于8月31日上线，把剧本、资产、分镜、视频和后期整合为一条生产线。剧本环节提供剧本翻译、剧本评分和小说转剧本功能；Agent 流程可选 Seedance 2.0 智能创作或智能分镜模式，支持片段重拍和10分钟超长视频生成；Seedance 2.5 720P 无参考视频低至0.4元/秒，30秒视频生成成本最低12元。", "type": "product", "relTime": "2天前"}, {"id": 98, "title": "特斯拉 Cybercab 应急操控方案曝光：无方向盘车型可经中控屏手动挪车", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/997/499.htm", "date": "2026-09-02T07:36:06.000Z", "summary": "X 用户 @BarryGoodStocks 分享的视频显示，量产版 Cybercab 在奥斯汀超级充电站通过中央触摸屏上的手动驾驶控制功能挪车，测试工程师长按屏幕方向按钮将车重新停入充电车位。", "type": "industry", "relTime": "2天前"}, {"id": 99, "title": "马斯克在 G20 会议预测 10 年内全球人形机器人超 10 亿台，每台产出至少是人类 5 倍", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/997/440.htm", "date": "2026-09-02T06:59:24.000Z", "summary": "马斯克 9 月 1 日在 G20 创新部长级会议视频讲话中预测，未来 10 年内全球人形机器人数量将超过 10 亿台，每台产出至少是人类工作者的 5 倍，总生产力高于全球人类生产力总和。他还预测 AI 最快明年就能高效处理各类数字任务，将全球生产总值提升 20% 至 30%，即每年增加 20 万亿至 30 万亿美元。", "type": "tip", "relTime": "2天前"}, {"id": 100, "title": "Elon Musk 在 G20 的完整演讲视频（含字幕和时间戳）", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2094970725555945814", "date": "2026-09-02T02:08:38.000Z", "summary": "DogeDesigner 发布了 Elon Musk 今日在 G20 演讲的完整视频，来源音频和画面清晰，带字幕和时间戳。时间戳目录包括 1：14 监管为何拖慢创新、3：38 AI、自动驾驶、机器人与全球增长、7：18 人形机器人的兴起、9：21 AI 数据中心、算力与电力、10：13 迫近的 AI 电力短缺等。", "type": "tip", "relTime": "2天前"}, {"id": 101, "title": "李飞飞 World Labs 发布多模态世界模型 Atlas，支持像素级相机控制生成 1440p 视频", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/997/241.htm", "date": "2026-09-02T01:52:46.000Z", "summary": "李飞飞创办的 World Labs 发布多模态世界模型 Atlas，称其能以像素级精确相机控制生成图像和视频帧，并在 3D 中重建。Atlas 可输出最长 1 分钟的 1440p 视频，从一至数十张图像进行空间重建，支持时空模拟和文本生成图像与 360 度全景，部分合作伙伴已获抢先体验，未来几周内开放早期访问。", "type": "model", "relTime": "2天前"}, {"id": 102, "title": "阿里云发布 Wan3.0，Omni-reference 支持原生 30 秒 1080P 音视频单次生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2094964362867855840", "date": "2026-09-02T01:43:21.000Z", "summary": "暂无摘要", "type": "paper", "relTime": "2天前"}, {"id": 103, "title": "Apple 发布 REFACTOR-VLA：无监督学习类型化运动程序库", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/refactor-vla-motor-programs", "date": "2026-09-02T00:00:00.000Z", "summary": "Apple Machine Learning Research 发布 REFACTOR-VLA 研究，针对 OpenVLA、π0、RT-2、RDT-1B 等当前视觉-语言-动作（VLA）模型生成原始动作的\"单体式\"结构，提出以无监督方式学习类型化运动程序库的方法。", "type": "paper", "relTime": "3天前"}, {"id": 104, "title": "VeriPhy 提出面向世界模型评估与改进的智能体物理推理系统", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.03153", "date": "2026-09-02T00:00:00.000Z", "summary": "论文提出 VeriPhy，一个可审计的物理验证系统：纯文本规划器在观察任何帧之前将提示词编译为带类型的物理义务和经静态验证的执行计划，执行时仅调用冻结的低层专家（分割与跟踪、计数、11 类物理测量、深度、OCR、音频事件检测），每个动作返回带溯源的证据记录，并映射为 supported、contradicted 或 unknown 三值判定。", "type": "paper", "relTime": "3天前"}, {"id": 105, "title": "Temporal Context Routing（TCR）让联合音视频生成模型按剧本时间轴精准对齐镜头与对白", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.02367", "date": "2026-09-02T00:00:00.000Z", "summary": "论文提出 Temporal Context Routing（TCR），将结构化剧本中的镜头切换和对白时间映射到音视频生成的共享时间轴，并把各提示词引导路由到两种模态的对应位置。", "type": "paper", "relTime": "3天前"}, {"id": 106, "title": "MiniMax H3 基于 vLLM-Omni 与 FastH3 实现 10.1 秒视频 8.7 秒生成", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2094926136333787512", "date": "2026-09-01T23:11:27.000Z", "summary": "MiniMax 官方宣布，基于 vLLM-Omni 和 FastVideo 团队（@haoailab）开源的 FastH3，并获 @NVIDIAAI 硬件支持，完整 10.1 秒含同步音频的 MP4 视频在 8.7 秒内渲染完成，生成速度快于播放速度。", "type": "model", "relTime": "3天前"}, {"id": 107, "title": "MiniMax 回顾 H3 开放权重一个月：社区用它构建生成式视频课堂", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2094914905535377794", "date": "2026-09-01T22:26:49.000Z", "summary": "MiniMax 发文称，如果 SOTA 视频模型保持闭源，就看不到如此普遍的创作，并表示 MiniMax H3 开放权重一个月来每天都被社区的作品震撼。其转发的示例中，用户 @internetphysics 基于 @fal 的 H3 Max 构建了一个生成式视频课堂，输入任意概念即可在几秒内生成动画讲解视频，还可在观看时排队新视频并提出追问。", "type": "tip", "relTime": "3天前"}, {"id": 108, "title": "OpenClaw Nodes 让智能体远程访问任意设备", "source": "X：OpenClaw (@openclaw)", "sourceUrl": "https://x.com/openclaw/status/2094911616441876729", "date": "2026-09-01T22:13:45.000Z", "summary": "OpenClaw 官方宣布 Nodes 功能，让用户的智能体可以连接并操作任意位置的设备。配图聊天演示显示，智能体通过 MacBook node 访问本地 Brother MFC-L2690DW 打印机，报告其状态为闲置、队列 0、黑色墨粉约 40%，并调用 imagegen skill 为用户生成适合打印的 \"I love you\" 图像。", "type": "paper", "relTime": "3天前"}, {"id": 109, "title": "World Labs 发布世界模型 Atlas：面向空间智能的多模态自回归扩散 Transformer", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.worldlabs.ai/blog/atlas", "date": "2026-09-01T22:09:44.724Z", "summary": "World Labs 发布新一代世界模型 Atlas，从零预训练，原生处理文本、图像、视频和 3D，架构为多模态自回归扩散 Transformer，输入以 3D 姿态形成空间上下文。模型支持相机控制生成（最长 1 分钟 1440p 视频）、稀疏视图 3D 重建、时空仿真和图像生成，在相机控制生成与 3D 重建任务上优于更专用的模型；现已开放早期访问申请，未来将驱动 Marble 等产品。", "type": "model", "relTime": "3天前"}, {"id": 110, "title": "Physion Labs 独立评测 MiniMax H3、H3 Max 与 FastH3 preview，H3 Max 综合领先", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2094907507881996640", "date": "2026-09-01T21:57:26.000Z", "summary": "Physion Labs 独立评测了 H3 Max（fal）、MiniMax H3 和 FastH3 preview 三款模型，覆盖机器人、动画、电影和广告场景，H3 Max 综合领先，FastH3 preview 在整体 Prompt Adherence 上超过 H3，差距主要体现在 Visual Integrity 和 Human Preference。", "type": "tip", "relTime": "3天前"}, {"id": 111, "title": "Thomas Wolf 转发用鸭子演示强化学习的科普视频", "source": "X：Thomas Wolf（Hugging Face 联创/CSO） (@Thom_Wolf)", "sourceUrl": "https://x.com/Thom_Wolf/status/2094897765159514395", "date": "2026-09-01T21:18:43.000Z", "summary": "Thomas Wolf 转发 @RemiFabreRobot 的视频，用 Microduck 鸭子学走路的过程讲解强化学习（RL），配乐由 @antoinepirrone 制作。", "type": "tip", "relTime": "3天前"}, {"id": 112, "title": "World Labs 发布多模态世界模型 Atlas，支持像素级相机控制与 3D 重建", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2094861594782040077", "date": "2026-09-01T18:54:59.000Z", "summary": "World Labs 发布 Atlas，称其为首个多模态世界模型，能以像素级相机控制生成图像和视频帧，并重建为 3D。作者 Elvis Saravia 转发并评价 omni 类世界模型是下一个前沿方向，认为其领先到目前还没有可衡量其通用能力的基准，且扩展性似乎也已打开。", "type": "model", "relTime": "3天前"}, {"id": 113, "title": "FastVideo FastH3 Dense 在 vLLM-Omni 上实现 10.1 秒视频 8.7 秒生成", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2094855898804187253", "date": "2026-09-01T18:32:21.000Z", "summary": "FastVideo 团队宣布 FastH3 Dense 已可在 vLLM-Omni 上服务。引用的 vLLM 项目演示显示，MiniMax H3 生成一段 10.1 秒、含同步音频的完整 MP4 仅需 8.7 秒，快于播放速度；FastH3 已开源，NVIDIA 提供赞助并参与联合优化。", "type": "model", "relTime": "3天前"}, {"id": 114, "title": "Google 推出提示词驱动的图像创作工具 Google Pics，将集成进 Workspace", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/01/googles-answer-to-canva-is-an-ai-tool-where-you-prompt-instead-of-design", "date": "2026-09-01T17:35:37.000Z", "summary": "Google 发布图像创作与编辑工具 Google Pics，由 Nano Banana 图像生成模型驱动，将在未来几周内面向大多数 Workspace 客户及 Google AI Pro 或 Ultra 订阅用户推出。", "type": "model", "relTime": "3天前"}, {"id": 115, "title": "World Labs 发布多模态世界模型 Atlas", "source": "X：Fei-Fei Li (@drfeifei, World Labs)", "sourceUrl": "https://x.com/drfeifei/status/2094840371675283673", "date": "2026-09-01T17:30:39.000Z", "summary": "World Labs 发布从零训练的多模态世界模型 Atlas。模型可生成具有像素级相机控制能力的图像和视频帧，从单张输入图像重建大型场景，通过重帧视频模拟时空，并从一张或多张输入图像原生输出 3D 空间，还能将多张带位姿的图像合成一致的三维世界。作者称其为迄今最好的相机条件世界模型，可能应用于 VFX 到机器人等多个方向。", "type": "model", "relTime": "3天前"}, {"id": 116, "title": "谷歌为 Gemini Flash 系列模型推出智能体视频理解功能，成本最高降 66%、Token 消耗最高降 88%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/997/190.htm", "date": "2026-09-01T17:16:45.000Z", "summary": "谷歌在 Gemini 3.7 Flash、3.6 Flash 和 3.5 Flash-Lite 模型中推出智能体视频理解（agentic video understanding）功能，替代按固定帧率读取视频的静态处理方式，让模型在视觉帧、音频和转录文本中动态搜索和检查目标片段。", "type": "model", "relTime": "3天前"}, {"id": 117, "title": "Visko 发布 Orbis 1.0 实时可引导视频生成模型", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2094834163438526629", "date": "2026-09-01T17:05:59.000Z", "summary": "Visko 发布首个 Live Model「Orbis 1.0」，一个实时、可引导的视频生成模型，可实时流式生成持续进行的世界，具备持久记忆、交互性和基于物理的无限长度生成。", "type": "model", "relTime": "3天前"}, {"id": 118, "title": "Google Antigravity 系列教程 Part 2：用 generate_image 工具自动化图像生成", "source": "Google AI：DEV 作者专属（RSS）", "sourceUrl": "https://dev.to/googleai/elevating-antigravity-agent-skills-part-2-image-generation-2jno", "date": "2026-09-01T16:51:26.000Z", "summary": "这篇是 Google 团队 Elevating Antigravity Agent Skills 五部曲的第二部分，讲解如何在 agent skill 中使用 generate_image 工具，把结构化提示词合成与原生图像生成结合，让 agent 产出符合开发者规范的图像。", "type": "tip", "relTime": "3天前"}, {"id": 119, "title": "Visko 发布首个 Live Model「Orbis 1.0」，实时流式生成可交互世界", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2094827785978069103", "date": "2026-09-01T16:40:38.000Z", "summary": "Visko 团队发布 Orbis 1.0，称其为首个 Live Model，可实时流式生成可交互的动态世界，支持持久记忆、交互性和基于物理的无边界长度生成。作者 Elris Saravia 转评称实时生成交互世界的模型已经到来，并强调其交互、物理基础和持久记忆可带来全新体验。", "type": "model", "relTime": "3天前"}, {"id": 120, "title": "Hugging Face CEO 谈机器人 microducks：连合唱演员的工作也难逃机器人", "source": "X：Clément Delangue（Hugging Face CEO） (@ClementDelangue)", "sourceUrl": "https://x.com/ClementDelangue/status/2094826553980989719", "date": "2026-09-01T16:35:45.000Z", "summary": "Hugging Face CEO Clément Delangue 转发机器人演示视频并评论，称这是近期他见过最美的机器人作品，认为每只 microduck 都有绑定个体机器人并终身保留的专属音频身份，这让演示更具诗意。引文提及对方准备 4 只 microducks 的用途问题。", "type": "tip", "relTime": "3天前"}, {"id": 121, "title": "Visko 发布实时直播视频模型 Orbis 1.0", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2094824376189239532", "date": "2026-09-01T16:27:05.000Z", "summary": "Visko 推出首个 Live Model「Orbis 1.0」，可实时生成场景并随新提示词持续更新，无需重启。模型支持持久记忆、交互性和物理约束的无限制时长生成；输入可用文本、图像或现有视频，输出 4K 24 FPS。现已在 https://www.visko.ai/models#orbis 开放体验，并通过 reactor 提供动态版与稳定版沙盒及 API。", "type": "model", "relTime": "3天前"}, {"id": 122, "title": "Google 推出 AI 图像生成与编辑应用 Google Pics，集成 Workspace", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/987423/google-pics-ai-image-editor-generator", "date": "2026-09-01T16:00:00.000Z", "summary": "Google 面向 Workspace 用户推出创意设计工具 Google Pics，基于 Gemini 和 Nano Banana 模型，支持点击图片中特定对象或文字后用提示词编辑，可从零生成图像、改写和翻译文字、放大到 2K 或 4K 分辨率，并快速裁剪为网页、社交媒体、印刷等格式。", "type": "model", "relTime": "3天前"}, {"id": 123, "title": "fal 发布 fal.live 实时交互 AI 直播平台，Ethan Mollick 评价其为重要技术尝试", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2094801560291213733", "date": "2026-09-01T14:56:26.000Z", "summary": "fal 推出 https://fal.live，一个无限、交互式 AI 直播平台，用户选择频道并用提示词决定接下来的内容，实时生成画面，从观众变成导演。Ethan Mollick 转发并给出三点评价：连续视频生成与上下文是重大技术成就；目前明显有瑕疵但比预期少，且趋势向好；它展示了 AI 带来的一种新型群体验乐。", "type": "paper", "relTime": "3天前"}, {"id": 124, "title": "马斯克预测十年内将有至少十亿台人形机器人，产出超全人类总和", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2094793785523962255", "date": "2026-09-01T14:25:32.000Z", "summary": "马斯克预测十年内全球将至少有十亿台人形机器人，每台产出至少是人类的五倍，总产出将超过全人类总和。该说法来自其受访言论，由 @cb_doge 转发并附视频。", "type": "tip", "relTime": "3天前"}, {"id": 125, "title": "Rohan Paul 点评双足机器人动态站立：脚踝或以微小力矩修正应对滚珠地面", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2094792255748050999", "date": "2026-09-01T14:19:27.000Z", "summary": "Rohan Paul 视频点评一个双足机器人站在铺满滚珠的地面上仍能保持站立，认为其脚踝可能在每次滚珠滚动时发出微小力矩修正，避免把重量压到已开始滚动的脚上。", "type": "tip", "relTime": "3天前"}, {"id": 126, "title": "告别视频抽卡：用深度视频过滤参考视频无用信息的实操技巧", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247510308&idx=1&sn=346558a075eeb80efc7a1644172d5fbf", "date": "2026-09-01T13:16:17.000Z", "summary": "作者分享一个 AI 视频技巧：先把参考视频转成深度视频，再用深度视频驱动视频生成，可保留动作、运镜、人物站位和空间关系，同时减少原片人脸、服装、背景和画风的干扰。", "type": "tip", "relTime": "3天前"}, {"id": 127, "title": "开发者基于 VoxCPM2 推出开源 AI 视频翻译配音工具 ZastTranslate", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2094772538761183535", "date": "2026-09-01T13:01:06.000Z", "summary": "面壁智能 OpenBMB 介绍开发者 @zast57 基于 VoxCPM2 构建的开源 AI 视频翻译配音工具 ZastTranslate，将本地 AI 转录、翻译和自然语音生成引入多语言内容创作流程。工具支持多语言视频翻译、语音克隆配音，代码、网站和 VoxCPM2 模型分别发布在 GitHub、zast57.com 和 Hugging Face。", "type": "model", "relTime": "3天前"}, {"id": 128, "title": "英伟达 GPU 帧插值功能并入 FFmpeg，RTX 30/40/50 系可将 30FPS 视频提升至 60FPS", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/997/015.htm", "date": "2026-09-01T08:07:04.000Z", "summary": "FFmpeg 宣布英伟达 GPU 帧插值功能通过 Vulkan API 正式并入项目，可借助 GeForce RTX GPU 预测生成下一帧来提高视频帧率。", "type": "product", "relTime": "3天前"}, {"id": 129, "title": "我国专家牵头制定的全球首个腿式机器人国际标准正式发布", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/961.htm", "date": "2026-09-01T07:11:39.000Z", "summary": "由我国专家牵头制定的全球首个腿式机器人国际标准《机器人--服务机器人性能规范及其试验方法第5部分：腿式机器人运动》近日正式发布。标准将楼梯、坡面、障碍等真实作业场景纳入评价体系，并把感知、交互、决策等能力综合纳入评价，从单一运动性能扩展到综合任务能力，可帮助企业开展研发改进、支持检测机构统一测试并帮助用户客观了解产品性能。", "type": "industry", "relTime": "3天前"}, {"id": 130, "title": "特斯拉 Robotaxi 无人监督车队 3 周增长约 7 倍至近 200 辆，Cybercab 发布在即", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/943.htm", "date": "2026-09-01T06:48:59.000Z", "summary": "据 Teslarati 援引 Robotaxi Tracker 数据，特斯拉在 Cybercab 发布前夕将奥斯汀、达拉斯和休斯敦的无人监督车辆扩至接近 200 辆，3 周内增长约 7 倍。特斯拉自动驾驶团队负责人 Ashok Elluswamy 曾透露项目累计完成超 38 万英里无人监督行驶；同时 Cybercab 在得州的监管注册数几天内从 7 辆增至 45 辆。", "type": "industry", "relTime": "3天前"}, {"id": 131, "title": "面壁智能转发创作者用 VoxCPM 制作日语内容实现不露脸频道涨粉", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2094655359810175041", "date": "2026-09-01T05:15:29.000Z", "summary": "面壁智能（OpenBMB）转发一位日本创作者对 VoxCPM 语音生成 AI 的评价，该创作者称 VoxCPM 性能出色，借助它在不露脸不出声的情况下 YouTube 订阅数突破 1，800 人（截图显示 1，817 人），并认为视频结合联盟营销的赛道竞争者少、机会大。面壁智能表示很高兴看到 VoxCPM 被用于日语内容创作，鼓励创作者继续尝试 AI 语音技术。", "type": "tip", "relTime": "3天前"}, {"id": 132, "title": "阿里云将在 Qwen Conference 泰国站演示 Qwen-Image 3.0、Wan 3.0 与 WonderClip 视觉 AI 流水线", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2094617811763024073", "date": "2026-09-01T02:46:17.000Z", "summary": "阿里云宣布将在 9 月 4 日曼谷活动现场演示从单个提示词到成片的完整视觉 AI 流水线。Qwen-Image 3.0 支持 12 种语言的文字、人物和版式图像生成；Wan 3.0 全新发布，可将帧动画化为 30 秒带声音且不漂移的视频；WonderClip 由智能体跑通从脚本到最终剪辑的全流程。", "type": "paper", "relTime": "3天前"}, {"id": 133, "title": "宇树展示四足机器人消防应急解决方案，含背负水炮与耐高温机器狗", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/772.htm", "date": "2026-09-01T02:06:16.000Z", "summary": "宇树科技于 8 月 31 日晚间晒出视频，展示其四足机器人消防应急解决方案。产品包括 A2-W 背负机器狗、B2 智能水炮机器狗、A2-W 与 B2 侦测机器狗、As2 云台侦查机器狗、B2 卫星侦查机器狗、A2-W 建模机器狗，以及不怕火烧的 B2 耐高温机器狗；消防员可通过机器狗与被困人员进行双向语音对讲。", "type": "product", "relTime": "3天前"}, {"id": 134, "title": "ReFlowSET：面向 SAR 到 EO 图像翻译的表征对齐潜空间流匹配框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.00968", "date": "2026-09-01T00:00:00.000Z", "summary": "KAIST-VICLab 提出 ReFlowSET，一种条件潜空间流匹配框架，通过 SAR-EO 联合重建审计选择潜空间编解码器，并在该空间从零训练规模更小的条件 DiT。方法将中间噪声 EO 特征与冻结视觉基础模型提取的干净目标表征对齐，仅用于训练阶段，不增加推理成本；在 QXS-SAROPT 和 SAR2Opt 上取得 SOTA，代码与权重已在 GitHub 公开。", "type": "paper", "relTime": "4天前"}, {"id": 135, "title": "EM^2Mem 提出事件中心的多模态记忆框架，提升长视频问答准确率并降低推理开销", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.00551", "date": "2026-09-01T00:00:00.000Z", "summary": "论文提出 EM^2Mem，一个事件中心的多模态记忆框架，在记忆构建阶段将异构证据绑定到事件锚点，每个事件索引的记忆单元对齐多模态记录、时间上下文、图关联关系、语义事实和来源信息。", "type": "paper", "relTime": "4天前"}, {"id": 136, "title": "研究揭示原生统一多模态模型中理解与生成的协同机制", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.01607", "date": "2026-09-01T00:00:00.000Z", "summary": "该论文在无预训练视觉先验的受控原生设置下，从表征、任务和系统三层研究统一多模态模型中视觉理解与生成的关系。研究发现两个目标可互相提供有用信号但共享计算路径时一方会主导，任务解耦架构可避免这种不对称退化；共享知识任务间存在正向双向迁移，端到端 UMM 在同时需要图像理解与生成的复杂任务上优于匹配的规划器-执行器流水线。", "type": "paper", "relTime": "4天前"}, {"id": 137, "title": "DroneCATS：评测多模态大模型作为无人机通用视觉-语言-动作智能体", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.01404", "date": "2026-09-01T00:00:00.000Z", "summary": "论文提出 DroneCATS-Agent 架构和 DroneCATS 基准，将多模态大模型直接放入无人机控制回路，无需微调或函数调用，评测接近、跟踪、视外搜索和多机指挥四项能力。结果显示小型开源模型导航成功率常高于前沿模型，却因过早或从不宣布到达而失败；模型的视觉空间感知尚可，瓶颈在于维持动作协议并正确发出终止动作。", "type": "paper", "relTime": "4天前"}, {"id": 138, "title": "H3-World：将 MiniMax-H3 视频生成器的语言理解转化为世界控制", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.01560", "date": "2026-09-01T00:00:00.000Z", "summary": "H3-World 提出一个把 33B MiniMax-H3 视频生成器转化为交互式世界模型的框架，通过自然语言指令实现精确的时间对齐世界控制。", "type": "paper", "relTime": "4天前"}, {"id": 139, "title": "DramaChain Bench 发布：覆盖短剧生成全流程的端到端基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.00646", "date": "2026-09-01T00:00:00.000Z", "summary": "DramaChain Bench 是首个评估短剧生产完整链路（剧本、分镜、关键帧、镜头视频到成片）各阶段的基准，包含五条评估轴、63 个叶子维度。基准由 5785 个条目经三名专业标注者独立打分，产生 17，488 个有效评分和 255，925 条可追溯归因记录；人工标注证实上游缺陷会跨阶段级联，最终成片质量并非只由视频生成决定。", "type": "paper", "relTime": "4天前"}, {"id": 140, "title": "SimLoss：单次解码的细粒度图像描述方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.00591", "date": "2026-09-01T00:00:00.000Z", "summary": "论文提出 SimLoss，一种免参考的嵌入空间训练目标，让视觉语言模型在解码前对齐隐藏状态与冻结图像嵌入，实现单次解码的细粒度图像描述，无需人工细粒度描述或多阶段伪描述。其中 SimLoss FFT 以可微方式微调，精度最高且推理比多阶段流程快约 20 倍，F1 接近多阶段方法；SimLoss GRPO 将嵌入模型作为黑盒奖励，召回率最强。", "type": "paper", "relTime": "4天前"}, {"id": 141, "title": "Kirin：从野外视频生成动物运动并自动绑定 3D 动画", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.01823", "date": "2026-09-01T00:00:00.000Z", "summary": "论文提出 Kirin 框架，从野外动物视频重建 3D 运动序列，并构建 AiM3D，首个为四足动物提供对齐视频-文本-运动三元组的大规模数据集。基于该数据训练的模型可同时以文本和图像为条件生成跨物种的真实运动，并结合现成 image-to-3D 模型自动绑定 3D 网格，产出可直接渲染的动画动物。项目页：https://kirin-ani.github.io/。", "type": "paper", "relTime": "4天前"}, {"id": 142, "title": "IT早报 0901：DeepSeek-V4-Flash-Vision-Exp 开源，华为小米荣耀手机集体调价，库克卸任苹果 CEO", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/709.htm", "date": "2026-08-31T23:44:23.000Z", "summary": "IT之家 9 月 1 日早报汇总多条科技动态。DeepSeek-V4-Flash-Vision-Exp 模型已上线 Hugging Face 并开源，支持图片输入、识别文字和分析图表，多模态 Agent 能力接近 Opus-4.8。", "type": "industry", "relTime": "4天前"}, {"id": 143, "title": "Thomas Wolf 展示 399 美元机器人 Microduck 的机载仪表盘", "source": "X：Thomas Wolf（Hugging Face 联创/CSO） (@Thom_Wolf)", "sourceUrl": "https://x.com/Thom_Wolf/status/2094536121065820376", "date": "2026-08-31T21:21:40.000Z", "summary": "Thomas Wolf 展示售价仅 $399 的机器人 Microduck，其机载算力足以直接运行 TUI 界面。视频是一个 vibe-coded 的设备端仪表盘，实时显示机器人内部的 policy、actions 和传感器数据，其中黄色星点为 LiDAR 距离测量结果。", "type": "paper", "relTime": "4天前"}, {"id": 144, "title": "Runway 发布 Solaris：首个界面世界模型，实时生成操作系统级交互界面", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/research/introducing-solaris", "date": "2026-08-31T17:03:47.031Z", "summary": "Runway 推出 Solaris，这是其全新界面世界模型（Interface World Models）系列的首个模型。Solaris 能实时逐帧生成应用和网站界面，无需中间代码表示，直接以图像作为交互层，支持视觉化、动态响应和开放式交互。它还可用于训练智能体，使其适应不断变化的界面布局，而非局限于特定训练环境。", "type": "model", "relTime": "4天前"}, {"id": 145, "title": "Google 与 NASA JPL 发布 MAPL-EMIT 深度学习框架，用卫星高光谱数据全球监测甲烷排放", "source": "Google Research：Blog（网页）", "sourceUrl": "https://research.google/blog/mapping-global-methane-emissions-from-space-with-deep-learning", "date": "2026-08-31T16:00:00.000Z", "summary": "Google 与 NASA JPL 在 PNAS 发表 MAPL-EMIT，一个基于 Swin-S vision transformer 的深度学习框架，用 EMIT 高光谱卫星数据自动完成甲烷羽流的检测、定量与源头定位。", "type": "paper", "relTime": "4天前"}, {"id": 146, "title": "Miro 如何用 Runway 制作 Canvas26 四城活动的开场视频", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/customers/miro", "date": "2026-08-31T16:00:00.000Z", "summary": "Miro 品牌团队分享如何完全用 Runway 制作 Canvas26 年度活动的开场视频，并本地化为四个城市的版本。此前年份依赖素材库加 3D 动效，今年每个镜头包括城市景观、人群和入场镜头都以 Runway 生成，再叠加基于 Miro Flows 节点连线设计的 3D 动效。", "type": "tip", "relTime": "4天前"}, {"id": 147, "title": "WorkBuddy 搭建私人 Skill 内容生产线", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2094450036629246132", "date": "2026-08-31T15:39:36.000Z", "summary": "推文提出 Skill 是 AI 时代最值钱的私人数字资产，并手把手演示用 WorkBuddy 与 Karpathy LLM Wiki 搭建私人内容生产线。作者将半年代表作、创作笔记与定位说明结构化洗成 19 个知识页，封装出含个人思考方式与审美红线的专属 Skill，实现数字分身，终结每次开新对话框需重新教 AI 的痛点。四层架构与实操视频及完整提示词已开源。", "type": "tip", "relTime": "4天前"}, {"id": 148, "title": "英伟达复活 Rubin CPX，2027 年一季度量产", "source": "X：郭明錤 Ming-Chi Kuo (@mingchikuo)", "sourceUrl": "https://x.com/mingchikuo/status/2094426162193993964", "date": "2026-08-31T14:04:44.000Z", "summary": "英伟达已重启此前被传砍掉的 Rubin CPX 项目，预计 1Q27 量产。新版 CPX 预填充性能更强，GPU 改用 168GB HBM4（Rubin 为 288GB），采用独立 MGX ETL 机架，需与 Vera Rubin NVL72 以 1：1 配对，通过以太网 RDMA 传输 KV 缓存，主打长上下文预填充的每美元最佳性能。", "type": "tip", "relTime": "4天前"}, {"id": 149, "title": "DeepSeek-V4-Flash-Vision-Exp 模型已开源，多模态 Agent 能力接近 Opus-4.8", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/637.htm", "date": "2026-08-31T11:35:24.000Z", "summary": "DeepSeek 于 8 月 31 日在 Hugging Face 开源首个多模态模型 DeepSeek-V4-Flash-Vision-Exp，采用 MIT License，公开模型文件、Tokenizer、Prompt Encoding 参考实现及最小化 PyTorch 推理实现。", "type": "model", "relTime": "4天前"}, {"id": 150, "title": "DIT.ai 开放 API，聚合 50+ 模型路由", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2094387966235873695", "date": "2026-08-31T11:32:57.000Z", "summary": "http://DIT.ai 已开放其 API 层的公共访问权限，允许用户在一个竞争性提供商市场中路由模型调用。  > 提供商按价格-质量评级排名。 > 它通过一个兼容 OpenAI 的密钥覆盖 50 多个文本、图像和视频模型。 > 设置仅需一个基础 URL 和密钥。 > 它包含提供商之间的自动故障转移开关。", "type": "model", "relTime": "4天前"}, {"id": 151, "title": "2496万次调用背后，他们用可灵做出了这些", "source": "公众号：可灵AI（快手·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzU5NTkwNDU2OA%3D%3D&mid=2247496770&idx=1&sn=1eb20eb64f2f4cb0e24c77b6d8917fff", "date": "2026-08-31T11:28:10.000Z", "summary": "可灵以API形式接入百度秒哒无代码平台，累计调用超2496万次。开发者将可灵视频与图片生成能力直接嵌入应用，或批量生成视觉素材搭建世界观，如Movo调用可灵3.0Omni与3.0Turbo生成动态影像，互动文学游戏《奥德赛-归乡之歌》的角色与场景均由可灵生成。近期上线的Agent Market提供一键换装、商品成片等开箱即用Agent，同样开放API。", "type": "product", "relTime": "4天前"}, {"id": 152, "title": "工业巨头卡特彼勒将 AI 推向真实作业现场，未来五年投入 1 亿美元培训员工", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/633.htm", "date": "2026-08-31T11:16:59.000Z", "summary": "卡特彼勒正将采矿领域积累的自动化经验拓展至建筑工地等动态环境，推出 Cat AI Assistant 供技术人员通过语音调取维修流程和排查故障。该公司依托全球约 160 万台联网设备及超 16 PB 结构化数据，并利用 AI 智能体升级代码和生成数字孪生模型。未来五年，卡特彼勒计划投入 1 亿美元对 11.8 万名员工开展 AI、自动化和机器人技术培训。", "type": "tip", "relTime": "4天前"}, {"id": 153, "title": "如何构建扩散式语言模型", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://kuleshov-group.github.io/blog/blog/2026/how-to-build-a-diffusion-language-model", "date": "2026-08-31T10:43:39.380Z", "summary": "扩散式语言模型从整段草稿出发并行迭代精炼，支持纠错、双向注意力与速度-质量权衡。2024年扩散模型在质量上追平自回归模型，2026年Mercury 2、Gemma Diffusion和Nemotron Diffusion相继发布。文章从高斯扩散讲起，涵盖掩码扩散、迭代精炼、后训练与变长生成等构建模块。", "type": "tip", "relTime": "4天前"}, {"id": 154, "title": "MiniMax H3 Max：AI 视频生成快于播放，24 小时 AI 直播上线", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/vitalbridge/minimax-h3-maxai", "date": "2026-08-31T10:00:00.000Z", "summary": "绿洲资本文章介绍 MiniMax H3 Max，称其 AI 视频生成快于播放，开启实时交互时代，并上线 24 小时 AI 直播。", "type": "paper", "relTime": "4天前"}, {"id": 155, "title": "连续扩散语言模型（CDLM）为何正在复兴", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://sander.ai/2026/08/24/continuous-dlms.html", "date": "2026-08-31T08:51:38.607Z", "summary": "连续扩散语言模型在沉寂数年后迎来研究复苏，挑战自回归模型在语言生成中的主导地位。2022年Diffusion-LM等早期工作曾探索用连续嵌入向量配合高斯噪声处理离散数据，但2023年后相关研究几乎消失，被全离散扩散方法取代。作者回顾这一兴衰历程，并分析当前复兴的原因。", "type": "tip", "relTime": "4天前"}, {"id": 156, "title": "小米机器人 CyberOne 将首次海外亮相 IFA 国际消费电子展", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/553.htm", "date": "2026-08-31T08:32:08.000Z", "summary": "小米集团总裁卢伟冰透露，9月4日至8日小米将首次参加IFA国际消费电子展，拥有超3300平米展台、近400款展品，实现\"人车家全生态\"海外最大规模参展。小米SU7 Max、SU7 Ultra与小米Vision GT三款车齐聚，机器人CyberOne（铁大）也将首次海外亮相。CyberOne是小米2022年发布的首款全尺寸人形仿生机器人，身高177厘米、体重52千克。", "type": "industry", "relTime": "4天前"}, {"id": 157, "title": "蚂蚁 inclusionAI 开源 LLaDA-Image 图像生成与编辑模型家族", "source": "蚂蚁 inclusionAI：GitHub 新仓库", "sourceUrl": "https://github.com/inclusionAI/LLaDA-Image", "date": "2026-08-31T07:21:37.000Z", "summary": "蚂蚁 inclusionAI 发布开源统一的 6B 图像生成与编辑模型家族 LLaDA-Image，含 50 步 Base 模型和 4 步蒸馏的 Turbo 模型，均支持文生图、VQ 条件生成、参考图编辑和中英文文字渲染。在 Qwen-Image-Bench 上总分达英文 53.53、中文 53.38，仓库已提供 checkpoints 和基于 Diffusers 的推理代码，训练代码即将开源。", "type": "model", "relTime": "4天前"}, {"id": 158, "title": "马斯克提出新计划：靠 AI 卫星让地球在未来约 10 亿年内保持宜居", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/490.htm", "date": "2026-08-31T07:13:13.000Z", "summary": "马斯克在 X 平台提出一项让地球在未来约 10 亿年内保持宜居的计划，核心是部署由太阳能供电、AI 控制的\"有感知能力的卫星\"，通过巨型电磁弹射器从月球表面发射，卫星将自主微调轨道。他援引 Grok 生成的估算称，高海平面上升情景下，到 2070 年佛罗里达州约 5% 土地（约 168 万英亩）可能面临经常性洪水，并称人类约只有 50 年时间采取行动。", "type": "tip", "relTime": "4天前"}, {"id": 159, "title": "阿里千问创作上线 Agent Teams 功能：用户提出创意，Agent 规划任务完成视频制作", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/484.htm", "date": "2026-08-31T06:59:55.000Z", "summary": "阿里千问今日宣布千问创作上线 Agent Teams 功能，支持 Wan3.0，将创作方式从写提示词扩展为用户提出创意、Agent 主动思考拆解并执行任务。该功能已在千问创作 PC 端和千问 App 上线，由编剧、导演、美术、视频生成等不同角色的 Agent 分工协作，完成从创意策划到成片制作的全流程，支持创作 AI 短剧、漫剧、营销广告等。", "type": "product", "relTime": "4天前"}, {"id": 160, "title": "千问创作上线Agent Teams，支持Wan3.0实现专业视频创作", "source": "公众号：千问APP（阿里）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzYzNDE5MDEwMQ%3D%3D&mid=2247488568&idx=1&sn=8281c4355ee0af5e02d38ccbf42ba084", "date": "2026-08-31T06:37:39.000Z", "summary": "千问创作上线Agent Teams功能，将创作方式从写提示词扩展为用户提出创意、Agent主动拆解执行，由编剧、导演、美术等不同角色Agent分工协作完成视频制作全流程。该功能已在千问创作PC端和千问APP上线，支持多设备协同，并首发接入Wan 3.0视频生成模型及Wan3.0 Prime满血版，同时汇集Qwen-Image-3.0等模型。", "type": "model", "relTime": "4天前"}, {"id": 161, "title": "滴滴自动驾驶新一代Robotaxi R2开启无人载客测试，北京、广州可体验", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/454.htm", "date": "2026-08-31T06:33:28.000Z", "summary": "滴滴自动驾驶新一代Robotaxi R2正式开启无人载客测试服务，用户可在北京、广州部分示范区域呼单体验。R2由滴滴与广汽埃安联合打造，采用L4全栈软硬件方案，搭载33个传感器，后排配备17.3英寸吸顶屏及AI语音交互系统。车辆接驾前自动开窗通风，车外屏交互、鸣笛寻车等功能将陆续上线。", "type": "paper", "relTime": "4天前"}, {"id": 162, "title": "混元Hy4预览版人人可生成蜘蛛侠", "source": "X：腾讯混元 (@TencentHunyuan)", "sourceUrl": "https://x.com/TencentHunyuan/status/2094304856387571789", "date": "2026-08-31T06:02:42.000Z", "summary": "每个人都可以用 Hy4 preview 生成一个蜘蛛侠。  【引用 @gmi_cloud】：运行 Hy4 preview 超过 6 小时，历经 9 次迭代，最终得到这个结果。  一个蜘蛛侠可以在 3D 旧金山中荡来荡去的游戏。  560 万 tokens。总计 13 美元。  而且我们已将其开源 👇", "type": "model", "relTime": "4天前"}, {"id": 163, "title": "SkyProduction天工工作台×通义万相：Wan 3.0限时免费再延1天", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI1MzE1NDc3Mg%3D%3D&mid=2247510201&idx=1&sn=15fe35a8e1c9151f590602ee5bc996db", "date": "2026-08-31T05:37:40.000Z", "summary": "SkyProduction天工工作台联合通义万相，将Wan 3.0限时免费活动延长至8月31日24：00，付费用户（会员及账户内有积分用户）今日可继续免费使用。该系列模型支持30秒长视频、多模态参考、人物一致性等功能。同日，天工工作台完成首页改版，突出Agent与无限画布两大核心创作入口。", "type": "model", "relTime": "4天前"}, {"id": 164, "title": "阿里云 Wan 3.0 上线 Buzzy，限时无限生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2094276105545093120", "date": "2026-08-31T04:08:27.000Z", "summary": "阿里云 Wan 3.0 现已登陆 AI 视频平台 Buzzy，支持生成电影级视频，画面细节更丰富、动态效果更流畅。限时 7 天内可无限次生成。API 也已通过 Model Studio 和 Qwen Cloud 开放。", "type": "model", "relTime": "4天前"}, {"id": 165, "title": "混元 Hy4 preview 调用激增，WorkBuddy 已紧急扩容", "source": "公众号：腾讯混元", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkwODU2OTQyNQ%3D%3D&mid=2247498489&idx=1&sn=a73dab1ed3e872e1eec2524fb18f7254", "date": "2026-08-31T02:06:00.000Z", "summary": "混元 Hy4 preview 自 8 月 28 日在 WorkBuddy 首发接入后，因 Agent 能力提升引发调用激增，上线首日即出现排队，官方已对推理集群紧急扩容。Hy4 preview 限免至 9 月 10 日 23：59，每日免费额度有限；Hy3 限免延长至 9 月 30 日 23：59。Hy4 preview 暂不具备图像/视频等多模态生成能力，相关任务将自动切换至其他模型执行。", "type": "model", "relTime": "4天前"}, {"id": 166, "title": "小马智行携手 FutureLink，拟首批在韩商业投放 200 辆 Robotaxi", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/303.htm", "date": "2026-08-31T01:49:34.000Z", "summary": "小马智行与韩国自动驾驶企业 FutureLink 签署战略合作，计划在韩国提供基于第 7 代 Robotaxi 的商业出行服务。首批投放规模 200 辆，由北汽制造，有望于 2028 年取得韩国政府认证。双方将设立合资企业，FutureLink 负责落地准入与车队运营，小马智行提供技术支持，在韩数据不会传输至境外。", "type": "industry", "relTime": "4天前"}, {"id": 167, "title": "DreamX-Creator 1.0 发布：7B 模型实现 2K 分辨率原生音视频联合生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.31106", "date": "2026-08-31T00:00:00.000Z", "summary": "DreamX-Creator 1.0 是一个以 7B 生成器为核心的原生音视频联合生成系统，基于首帧和文本提示对音频与视频流联合去噪，通过 Gated Cross-Modal Attention 在网络后半段耦合两个模态。", "type": "paper", "relTime": "5天前"}, {"id": 168, "title": "BLARM：通过混合潜在刚性运动基元从视频驱动 3D 物体动画", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.31113", "date": "2026-08-31T00:00:00.000Z", "summary": "论文提出 BLARM，一种前馈方法，输入单目视频和静态物体网格，即可预测运动跟随视频的时序连贯动画网格。方法用少量随时间变化的刚性运动分量和顶点到分量的蒙皮权重表示动画，无需骨骼、cage、蒙皮权重或绑定标注，通过分解时空注意力将几何形变潜变量条件于视频特征，并以轨迹重建、熵正则和运动感知对比学习训练，生成准确且时序稳定的动画。", "type": "paper", "relTime": "5天前"}, {"id": 169, "title": "Lucida：面向可组合真实到仿真场景建模的解析、生成与放置框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.30821", "date": "2026-08-31T00:00:00.000Z", "summary": "Lucida 提出可组合真实到仿真场景建模方法，将真实室内场景恢复为按观测排布、可单独操作的完整可编辑物体资产。方法沿用解析、生成、放置三步，但把精度要求重新分配到流水线末端：解析视频生成携带逐实例多视角证据的场景图，据此生成完整资产，并用 VLM 策略 GizmoAct 将放置建模为多轮 GUI 交互，闭环操纵物体 gizmo 并自行判断对齐完成。", "type": "paper", "relTime": "5天前"}, {"id": 170, "title": "PaperBanana-Interact：基于多轮人类反馈的科学图表精修系统", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.30241", "date": "2026-08-31T00:00:00.000Z", "summary": "论文提出 PaperBanana-Interact，一个通过内部 critique-and-refine 循环精修科学图表的多智能体系统，并发布多轮图表生成基准 MTPaperBananaBench，含 292 张图像和 3，518 条用户需求标注。", "type": "paper", "relTime": "5天前"}, {"id": 171, "title": "论文提出超越人类监督扩展大型推理模型的 L0-L4 路径框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.31075", "date": "2026-08-31T00:00:00.000Z", "summary": "论文研究大型推理模型（LRM）如何在人类监督逐渐退出学习回路后继续提升，提出从 L0 到 L4 的五级阶梯框架，覆盖奖励轴（从人工判断到无需人类反馈的可复用验证器）和经验轴（从人工策划任务到自生成课程与自主协同进化）。", "type": "paper", "relTime": "5天前"}, {"id": 172, "title": "WebWorld：把浏览器当作世界模型实现自改进的网页代码生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.30530", "date": "2026-08-31T00:00:00.000Z", "summary": "arXiv 论文提出 WebWorld，让 VLM 与浏览器这一确定性可执行模拟器交互，将 VLM 的批评编译为类型化交互契约，浏览器重新执行候选代码，只有目标进展与既有能力保持同时满足时才签发验收证书，证书化的转移累积为质量棘轮并作为 SFT 导出的唯一数据。", "type": "paper", "relTime": "5天前"}, {"id": 173, "title": "LightNav-0：激发 VLM 空间智能的通用具身导航模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.30935", "date": "2026-08-31T00:00:00.000Z", "summary": "研究团队发布 LightNav-0，一个紧凑的通用具身导航模型，通过双通道指向和残差向量量化动作 tokenizer 激发预训练 VLM 的空间智能，无需任务专用预测头。训练语料覆盖 2K+ 场景和 4K+ 小时具身导航数据，LightNav-0 在全部 10 个公开导航仿真环境中取得单目成功率 SOTA，真实世界评测显示跨机器人本体、场景及静态动态目标的零样本泛化能力。", "type": "paper", "relTime": "5天前"}, {"id": 174, "title": "MineAmongUs：研究 VLM 智能体在具身社交互动中的言语与非言语联合欺骗", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.30428", "date": "2026-08-31T00:00:00.000Z", "summary": "论文提出 MineAmongUs，一个 3D 多模态 Among Us 沙盒，让 imposter 智能体通过言语与非言语联合行动欺骗船员，并配套可配置的 VLM 智能体框架 ARIA 和基于欺骗分类学的原子与弧级标注方案。", "type": "paper", "relTime": "5天前"}, {"id": 175, "title": "CE-GRPO 提出信用可寻址推理，提升多模态几何推理准确率", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.30457", "date": "2026-08-31T00:00:00.000Z", "summary": "论文提出 credit-addressable reasoning 框架，用 Code-CoT 将视觉关系表示为可执行代码并组织为类型化事件，CE-GRPO 在事件边界上做局部优势分配。", "type": "paper", "relTime": "5天前"}, {"id": 176, "title": "Qwen-Drive-1.0 发布：面向自动驾驶的视觉语言基础模型初步探索", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.00111", "date": "2026-08-31T00:00:00.000Z", "summary": "论文提出 Qwen-Drive-1.0，是迈向自动驾驶视觉语言基础模型的初步尝试，保留预训练 VLM 架构，将 3D 感知、视觉问答与运动规划统一在同一框架内。", "type": "paper", "relTime": "5天前"}, {"id": 177, "title": "ZimaBlue：通过可扩展视频预训练演化可泛化的世界动作模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.00188", "date": "2026-08-31T00:00:00.000Z", "summary": "ZimaBlue 提出从大规模视频中学习可泛化世界动作模型（WAM）的三阶段训练框架：因果具身视频预训练、用统一动作表示进行视频-动作中期训练，再针对目标机器人专精化部署。", "type": "paper", "relTime": "5天前"}, {"id": 178, "title": "FoldingAgent：从折纸演示视频推断参数化折叠程序", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.00377", "date": "2026-08-31T00:00:00.000Z", "summary": "FoldingAgent 是一个智能体框架，利用预训练 VLM 配合几何模拟、物理合理性验证、视觉检索与自评等工具，从折纸演示视频中直接推断显式参数化折叠程序。该智能体按序操作并可重新规划动作，以缓解多步折叠中的累积误差；作者还构建了带真值几何与动作标注的 PurelandFold 基准，结果表明该方法能把非结构化视觉演示转化为可执行且物理合理的折叠步骤。", "type": "paper", "relTime": "5天前"}, {"id": 179, "title": "NeoMME 发布 260M 与 800M 多模态多语言基础编码器，面向高效微调与推理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.01657", "date": "2026-08-31T00:00:00.000Z", "summary": "H 团队发布 NeoMME，一组 260M 与 800M 参数的多模态多语言双向编码器，在单个双向 Transformer 中处理多语言文本与原始图像块，从零预训练，支持 16，384-token 上下文，可编码最多两张 4K UHD 图像。", "type": "paper", "relTime": "5天前"}, {"id": 180, "title": "Figure创始人谈中国机器人引发热议", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2094153747907944841", "date": "2026-08-30T20:02:15.000Z", "summary": "美国Figure Robots创始人Brett Adcock对中国机器人有非常强烈的看法。🤔  ----  来自\"My First Million\"YouTube频道（完整视频链接见评论）", "type": "tip", "relTime": "5天前"}, {"id": 181, "title": "Codex 插件不到 1 元生成高清 AI 视频", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2094093204790325554", "date": "2026-08-30T16:01:41.000Z", "summary": "开发者 Saccc_c 发布了一款 Codex 插件，宣称生成高清 AI 视频成本不到 1 块钱。该插件通过 Codex 调用视频生成能力，大幅降低创作门槛，引发社区关注。目前具体模型与生成参数未披露，实际效果有待验证。", "type": "tip", "relTime": "5天前"}, {"id": 182, "title": "GPT-5.6 Sol 电影级网页制作技巧拆解", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2093988094198321226", "date": "2026-08-30T09:04:00.000Z", "summary": "一条视频拆解如何用 GPT-5.6 Sol 生成苹果发布会级前端质感的网页，核心技巧包括：先喂设计公理（Bento Grid 栅格、暗黑毛玻璃等）注入审美，按英雄区、交互动效、数据卡片分层生成模块以快速修 bug，以及用一句提示词让 Sol 自动补齐 CSS 平滑过渡和光影跟随效果。完整精要与核心 Prompt 已整理发布。", "type": "tip", "relTime": "5天前"}, {"id": 183, "title": "网传微软 Win11 偷偷后台跑 AI？实为权限管理列表", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/194.htm", "date": "2026-08-30T09:00:56.000Z", "summary": "网传 Windows 11 在后台偷偷运行 AI 并拖累性能的截图实为误读。该\"文本和图像生成\"页面仅记录哪些应用拥有使用设备端生成式 AI 模型的权限，并非实际运行记录，且\"最近活动\"显示请求数为 0。相关功能在 Copilot+ PC 的 NPU 上运行，不会占用 CPU、GPU 或普通系统内存。", "type": "tip", "relTime": "5天前"}, {"id": 184, "title": "黄仁勋：马斯克在AI、自动驾驶与人形机器人领域占据绝佳位置", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2093967672644153350", "date": "2026-08-30T07:42:51.000Z", "summary": "黄仁勋称马斯克在引领AI、自动驾驶与人形机器人未来方面处于绝佳位置，优势在于其汽车AI工厂出色且拥有庞大车队。他提到xAI专注基础认知智能，特斯拉专注自动驾驶，Optimus专注人形机器人，这三者正是AI最重要的三大领域。", "type": "tip", "relTime": "5天前"}, {"id": 185, "title": "Hy4 预览版经 WorkBuddy 单次生成过山车视频", "source": "X：Tencent WorkBuddy (@WorkBuddy_AI)", "sourceUrl": "https://x.com/WorkBuddy_AI/status/2093939223300849910", "date": "2026-08-30T05:49:49.000Z", "summary": "用户通过腾讯 WorkBuddy 试用 Hy4 预览版，仅凭一句模糊提示词（第一视角过山车、前排、要快）即一次生成逼真视频，陡降与倾斜弯道手感到位。Hy4 在代码与 3D 渲染能力上明显升级，未来两周可在 WorkBuddy 免费体验。", "type": "paper", "relTime": "5天前"}, {"id": 186, "title": "预估为 GPT-6 模型：OpenAI Astra 首批演示样本流出，1 次交互生成类 GTA 2 游戏", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/996/120.htm", "date": "2026-08-30T05:25:15.000Z", "summary": "OpenAI 正加快 Astra 模型发布进程，新增 mozaik-alpha-fdm 测试阶段以扩大内部测试范围。多方爆料认为 Astra 很可能就是外界所称的 GPT-6，参数规模或达 10 万亿。测试显示，该模型仅 1 次对话交互即可生成类似《侠盗猎车手 2》的游戏及精细网站、3D 对象和体素环境，但推理时间比 GPT-5.6 Sol 长得多。", "type": "model", "relTime": "5天前"}, {"id": 187, "title": "MMMMM 论文提出多语言多模态虚假信息的统一分类体系", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.29681", "date": "2026-08-30T00:00:00.000Z", "summary": "论文提出 MMMMM 分类体系，基于 Twitter/X 上七种语言的真实虚假信息数据集研究多模态虚假信息机制。作者用视觉语言模型构建自动化多步标注流程并经人工验证，发现 AI 生成内容在科技与科学领域尤为普遍，而疫苗类虚假信息更多盗用新闻媒体图片来增强可信度，建议治理应分领域策略化而非一刀切。", "type": "paper", "relTime": "6天前"}, {"id": 188, "title": "ContextBias 框架评测文生图模型在语境变化下的偏见持续性", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.29847", "date": "2026-08-30T00:00:00.000Z", "summary": "论文提出 ContextBias 评测框架和 ContextBench 基准，覆盖 92 个角色和 1，656 条语义受控提示词，对四个 SOTA 模型生成的 66，240 张图像进行评测。", "type": "paper", "relTime": "6天前"}, {"id": 189, "title": "SpanCalib-VLM 提出混合双系统检测视觉语言模型幻觉片段", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.29974", "date": "2026-08-30T00:00:00.000Z", "summary": "论文提出 SpanCalib-VLM，一个面向 SHROOM-Visions 共享任务的混合双系统，将 XLM-RoBERTa-Large 与 SigLIP 视觉编码器融合的多模态序列标注器，与微调的生成式 VLM（Qwen3.5-4B-SHROOM-SFT）结合，通过 Union-Calibrated Fusion 策略用标注器的校准概率对生成模型候选片段重新打分。", "type": "paper", "relTime": "6天前"}, {"id": 190, "title": "SnapBench：面向移动端 Snap-and-Ask 多模态检索的鲁棒性基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.29607", "date": "2026-08-30T00:00:00.000Z", "summary": "研究团队发布 SnapBench，首个针对 snap-and-ask 多模态检索鲁棒性的成对基准，涵盖 1，145 条查询、9，085 个图库条目和 53 种受控损坏条件，并附人工标注。评测 16 个多模态检索器后发现，图像损坏显著降低检索效果，文本损坏主要影响纯文本检索；纯净图像单模态检索常优于联合检索，并进一步提出 MOOR 自适应融合方法。", "type": "paper", "relTime": "6天前"}, {"id": 191, "title": "视频模型难复现艾姆斯错觉", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2093799576570417384", "date": "2026-08-29T20:34:54.000Z", "summary": "顺便说一句，到目前为止，我还没能让任何视频模型仅凭文本提示或图像提示就产生艾姆斯错觉效果。", "type": "tip", "relTime": "6天前"}, {"id": 192, "title": "MiniMax H3 Max 开源模型被 @fal 改造，实现超实时视频生成", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2093778769903534294", "date": "2026-08-29T19:12:13.000Z", "summary": "MiniMax 发布开源权重模型 H3，@fal 通过自研后训练与推理技术将其改造为 H3 Max，在质量和延迟上双双突破，实现超实时（faster-than-real-time）视频生成。MiniMax 称这证明了开放权重让前沿技术不再属于少数人，并希望 H3 Max 成为社区共创突破的开端。", "type": "tip", "relTime": "6天前"}, {"id": 193, "title": "腾讯混元Hy4预览版体验：一句话生成过山车视频", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2093772055586259362", "date": "2026-08-29T18:45:33.000Z", "summary": "腾讯混元Hy4预览版在WorkBuddy中开放试用，仅凭一句模糊提示词即可生成第一视角过山车视频，陡降、倾斜转弯和近景飞驰的速度感表现到位。编码与3D渲染能力明显升级，一次生成即达此效果，未来两周可免费体验。", "type": "tip", "relTime": "6天前"}, {"id": 194, "title": "MiniMax H3 接入 Twitch 直播无限生成视频", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2093746422466367907", "date": "2026-08-29T17:03:41.000Z", "summary": "@rehan_shei 可能刚刚发明了最好的基准测试：生成速度能比 Twitch 直播还快吗？🤔📺🌀  太不可思议了，看到 @fal 把 MiniMax H3 推向全新的体验。  【引用 @rehan_shei】：MiniMax H3 Max 生成视频的速度比你观看的速度还快，所以我把它接入了 Twitch 直播！现在你可以观看无限的跨维度频道--直播链接在下方", "type": "paper", "relTime": "6天前"}, {"id": 195, "title": "AI生成视频正取代中国演艺与直播行业真人演员", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/ai-generated-videos-are-already-displacing-actors-and-livestreamers-across-chinas-entertainment-industry", "date": "2026-08-29T13:25:56.000Z", "summary": "AI生成视频正冲击中国演员、网红和主播岗位，部分制作已用数字演员替代真人。自字节跳动Seedance 2.0发布以来，数字演员能以更快、更便宜的方式产出更高质量视频。2026年一季度中国上线约12.8万部短剧，为2025年全年三倍，其中95%为AI生成；一分钟AI视频成本仅90至120美元，约为真人拍摄成本的十分之一。", "type": "industry", "relTime": "6天前"}, {"id": 196, "title": "斯坦福课程拆解：Agent 落地三条铁律", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2093688570485641670", "date": "2026-08-29T13:13:48.000Z", "summary": "斯坦福《自我进化 Agent》第一讲指出，判断工作能否被 AI 取代，关键看有无廉价的自动验证器，而非仅看能否被替代。课程强调生成与验证鸿沟：代码 Agent 因单元测试可自动闭环反馈而率先跑通。Agent 落地需遵循三条铁律：验证便宜的岗位（如重构、补测试）越用越强；靠人肉审美的岗位只能当草稿纸；生产级 Agent 须先画流程图并设人工审批闸门。", "type": "tip", "relTime": "6天前"}, {"id": 197, "title": "音乐人化身\"侦探\"猎捕AI造假者", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/entertainment/985866/h4rris-nihil-young-edm-suno-ai", "date": "2026-08-29T12:00:00.000Z", "summary": "随着生成式AI工具渗入电子舞曲（EDM）领域，以26岁制作人Max \"H4RRIS\" Harris为代表的一批音乐人正通过视频公开点名，指认那些疑似用AI生成音乐冒充人类创作的同业。Harris认为AI音乐是\"诱饵艺术\"，并指出Suno生成曲目常出现人声与旋律同时卡顿、背景嘶声等可辨识特征，但他对MANSA等具体作品的指控目前尚无确凿证据。", "type": "tip", "relTime": "6天前"}, {"id": 198, "title": "Lux3D 实测：图像文本生成可编辑 3D 资产", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2093639648946036998", "date": "2026-08-29T09:59:24.000Z", "summary": "1/ 过去几天我一直在测试 Lux3D，一个 3D 生成模型。你给它一张图片或一段文字提示，它就能返回一个完整的、可编辑的 3D 资产。无需建模技能。  试了全部 3 项核心功能。一条推文串：", "type": "tip", "relTime": "6天前"}, {"id": 199, "title": "LAION 发布 Big Video Dataset：1000 万小时开源视频数据集", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/laion-drops-massive-open-video-dataset-with-10-million-hours-of-footage-for-ai-research", "date": "2026-08-29T09:36:48.000Z", "summary": "LAION 发布 Big Video Dataset（BVD），从 CommonCrawl 的 13 亿视频 URL 中下载了 8000 万个视频，总计 1000 万小时，并提取了 5500 万个带自动生成描述的视频片段和 3 亿张静态图像。", "type": "model", "relTime": "6天前"}, {"id": 200, "title": "Grok 剪辑 Bot 开源：手机一句话生成混剪成片", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2093617498595680487", "date": "2026-08-29T08:31:23.000Z", "summary": "开发者 @XFreeze 开源了基于 Grok 的 Best Video Editor 模板，手机发一句话即可让 AI 在云端完成扒素材、配乐、切片、加标题并输出成片。该 Bot 支持零素材混剪、长视频抽高光和自带素材粗剪，底层连接真实云端环境而非网页生成，用户只需做最终把关。", "type": "tip", "relTime": "6天前"}, {"id": 201, "title": "创作者依赖AI还能算创作者吗", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2093615827144880538", "date": "2026-08-29T08:24:45.000Z", "summary": "ZHO 转引\"生成AI停服就什么都做不出的人不配称创作者\"之问，自述从手绘、手工模型到全面电子化、3D打印，再到如今AI的成长轨迹，坦言不知答案，但认为依赖AI者占多数，最终或会占据上风。他困惑这些变迁是束缚还是更大的自由。", "type": "tip", "relTime": "6天前"}, {"id": 202, "title": "国产 GPU 厂商壁仞科技上半年收入 12.36 亿元，同比增长 1997.6%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/995/887.htm", "date": "2026-08-29T03:08:21.000Z", "summary": "壁仞科技发布公告，截至 2026 年 6 月 30 日止六个月收入 12.36 亿元，同比增长 1997.6%；毛利 5.27 亿元，同比增长 2708.5%。报告期内研发开支 8.044 亿元，同比增长 40.7%，亏损大幅收窄至 3.772 亿元，净亏损同比降低 76.4%。壁砺TM系列训练及推理产品销售持续扩大，已在大语言模型推理、智能驾驶、具身智能、多模态等应用领域实现规模化部署。", "type": "industry", "relTime": "6天前"}, {"id": 203, "title": "FastVideo 开源 FastH3 实现 14 倍加速", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2093527142843957495", "date": "2026-08-29T02:32:21.000Z", "summary": "Sky Computing Lab 开源 FastVideo FastH3 预览版，生成 15 秒视频仅需 13 秒，实现 14 倍加速。盲测中 45% 用户偏好 FastH3 或认为其与 MiniMax H3 持平。该预览版仅用部分数据和算力训练，权重已发布于 HuggingFace。", "type": "model", "relTime": "6天前"}, {"id": 204, "title": "FastVideo 开源 FastH3 预览版，15 秒生成仅需 13 秒", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2093506470449156193", "date": "2026-08-29T01:10:12.000Z", "summary": "FastVideo 开源预览版 FastH3，15 秒视频生成仅需 13 秒，实现 14 倍加速，45% 用户偏好或认为其与 MiniMax H3 持平。该模型为预览检查点，仅用部分算力和数据训练。引用推文提醒，速度提升需配合质量评估，避免沦为\"随机像素生成器\"。", "type": "model", "relTime": "6天前"}];

function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";

      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }

    if(dk!==nextDate){ html+='</div>'; }

  c.innerHTML=html;
}

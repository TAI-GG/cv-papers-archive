失落与期待", "source": "Hacker News：AI 热帖", "sourceUrl": "https://mondobe.com/ai-makes-me-sad", "date": "2026-10-02T15:18:00.000Z", "summary": "一名开发者发文《AI Makes Me Sad》，坦言每次看到 AI 新进展都感到无望，不愿以给 Codex 或 Claude 写提示词为生，认为这意味手艺、控制力与创造力的丧失。他批评 X 上大量认证机器人用 LLM 生成无意义回复却无人治理，并指出数千亿甚至数万亿美元的 AI 投入对日常应用用户几乎没有带来实际收益。他仍抱有希望：科技行业变化极快，AI 在社会中的角色会在几年内定型。", "type": "tip", "relTime": "1周前"}, {"id": 18, "title": "Tripo P2.0 生成可编辑四边面 3D 资产", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2106036500068548858", "date": "2026-10-02T15:00:04.000Z", "summary": "Tripo P2.0 可生成达到生产级标准的 3D 资产，拥有干净、可编辑的四边面拓扑。  输入单视图或多视图图像，可获得更好的几何结构。  无需再无尽地清理。从真正能用的模型开始。", "type": "model", "relTime": "1周前"}, {"id": 19, "title": "Kling 4.0 进入封闭测试，官方发布创意总监商业制作实测", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2105986483337167115", "date": "2026-10-02T11:41:19.000Z", "summary": "Kling AI 官宣 Kling 4.0 进入封闭测试，计划今年 10 月正式发布，带来更稳定的动态运动、高质量立体声与更准的口型同步，支持最高 4K 分辨率与 10-bit HDR 输出，可生成最长 30 秒视频。", "type": "paper", "relTime": "1周前"}, {"id": 20, "title": "腾讯 WorkBuddy 内置模型独家支持 Space Bunny", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/335.htm", "date": "2026-10-02T10:05:19.000Z", "summary": "腾讯 WorkBuddy 宣布内置模型独家支持匿名 Flash 大模型 Space Bunny，该模型具备极速推理、编码能力，原生支持文本、图像、视频输入，上下文长达 1M。", "type": "model", "relTime": "1周前"}, {"id": 21, "title": "Black Forest Labs 发布生图模型 FLUX 3 Image：支持 4K 生成与元素精准排布", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/315.htm", "date": "2026-10-02T08:05:21.000Z", "summary": "德国 AI 公司 Black Forest Labs 于 10 月 2 日发布图像生成模型 FLUX 3 Image，支持生成最高 4K 分辨率图片。用户可在 0–1000 坐标网格上通过 ID、描述文本和边界框精准排布画面元素，单次生成最多融入 10 张参考图像，并支持像素级精确多轮编辑。该模型目前以付费服务提供，开放模型版本将于数周内公开。", "type": "model", "relTime": "1周前"}, {"id": 22, "title": "OpenAI 升级 ChatGPT 购物功能，新增虚拟试穿与 Favorites 收藏", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/304.htm", "date": "2026-10-02T07:28:56.000Z", "summary": "OpenAI 为 ChatGPT 购物功能新增虚拟试穿（Try on）和 Favorites（收藏）两项功能。用户可上传或拍摄照片，由 ChatGPT 生成穿着特定服饰或配饰后的效果图，该体验大致依托 ChatGPT Images 2.5 图像生成模型；收藏功能可将商品保存至 ChatGPT Library 并用文件夹分类。", "type": "model", "relTime": "1周前"}, {"id": 23, "title": "富士 X-T6 设计草图曝光：搭 X-Processor 6，或推迟至 2026 年末至 2027 年初发布", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/283.htm", "date": "2026-10-02T06:34:49.000Z", "summary": "富士 X-T6 无反相机设计草图曝光，传闻将搭载 X-Processor 6 图像处理器，支持新一代深度学习 AI 自动对焦与实时黏着追踪。传感器或采用 4000 万–5000 万像素部分堆叠式 X-Trans 6，电子快门连拍最高 40–60fps，视频规格升至 8K 30p / 4K 120p。该机发布已推迟至 2026 年末或 2027 年初，上市价约 1,899–2,199 美元。", "type": "paper", "relTime": "1周前"}, {"id": 24, "title": "东锡 NLP 谈 LLM 耐心讲解代码，让老登被时代抛弃", "source": "X：马东锡 NLP (@dongxi_nlp)", "sourceUrl": "https://x.com/dongxi_nlp/status/2105893369142546585", "date": "2026-10-02T05:31:19.000Z", "summary": "作者回忆新人时期请教资深工程师代码逻辑被一句“哦，忘了”回绝，感叹如今 LLM 能用文字、图表、视频等多种方式耐心回答问题。其引用的 Karpathy 帖子介绍了用 ASD-STE100 规范写作、生成图表、HTML 网页和 3b1b 风格讲解视频等理解 LLM 输出的技巧。", "type": "tip", "relTime": "1周前"}, {"id": 25, "title": "可灵超级创作者实测 Kling 4.0：30秒打戏、运镜稳定性与一致性表现", "source": "公众号：可灵AI（快手·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzU5NTkwNDU2OA%3D%3D&mid=2247496912&idx=1&sn=52292535ca61af3fc66326f8aea772ce", "date": "2026-10-02T04:04:46.000Z", "summary": "可灵AI公众号发布超级创作者、奥美资深创意总监盛健松对 Kling 4.0 内测版的实测。Kling 4.0 已开启内测，将于10月正式发布，支持最长30秒原生视频生成、主体与场景资产调用、声音延续、动作迁移，并提升复杂运镜稳定性、长提示词理解和跨镜头一致性。", "type": "paper", "relTime": "1周前"}, {"id": 26, "title": "Karpathy 分享用 LLM 生成写作、网页和讲解视频的技巧，Yuchen Jin 盼其回归更新视频", "source": "X：Yuchen Jin (@Yuchenj_UW)", "sourceUrl": "https://x.com/Yuchenj_UW/status/2105821521201799480", "date": "2026-10-02T00:45:49.000Z", "summary": "Andrej Karpathy 分享理解语言模型输出的技巧，包括让 LLM 用 ASD-STE100 规范写作、生成图表、输出 HTML 交互网页，以及用 ElevenLabs API 配音生成 3b1b 风格的定制讲解视频，并认为随着智能和代码愈发充裕，可要求大型、定制、可丢弃的软件产物。Yuchen Jin 转发时表示目前还没有 AI 能直接生成 Karpathy 风格的视频，并指出 K...", "type": "tip", "relTime": "1周前"}, {"id": 27, "title": "Andrej Karpathy 分享理解 LLM 输出的技巧：从 ASD-STE100 写作到定制讲解视频", "source": "X：Andrej Karpathy (@karpathy)", "sourceUrl": "https://x.com/karpathy/status/2105819303471976479", "date": "2026-10-02T00:37:00.000Z", "summary": "Andrej Karpathy 分享了几条理解大语言模型输出的方法：让模型用面向航天维护文档的受控语言 ASD-STE100 写作（可要求 80% 程度以放宽约束）、输出图表、生成 HTML 交互网页，以及生成 3b1b 风格的定制讲解视频并用 ElevenLabs API key 做配音。", "type": "tip", "relTime": "1周前"}, {"id": 28, "title": "OpenAI 在 ChatGPT 全球上线虚拟试穿与商品收藏功能", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/197.htm", "date": "2026-10-01T23:18:01.000Z", "summary": "OpenAI 于当地时间 1 日在全球推出 ChatGPT 两项购物新功能：虚拟试穿服装和配饰，以及可保存商品、与试穿图片放在一起的收藏功能。新功能基于 ChatGPT Images 2.5 模型，据称光线更自然、纹理更丰富、编辑指令更稳定且生成更快。用户可上传自拍照或全身照查看试穿效果，也可描述穿衣风格让 ChatGPT 挑单品，或上传名人穿搭照找可购买同款。", "type": "model", "relTime": "1周前"}, {"id": 29, "title": "MIT CSAIL 与 Google 推出 InstructMesh：可修复 AI 生成 3D 模型再打印", "source": "MIT News（RSS）", "sourceUrl": "https://news.mit.edu/2026/instructmesh-tool-lets-users-repair-ai-3d-models-then-fabricate-them-1001", "date": "2026-10-01T22:00:00.000Z", "summary": "MIT CSAIL 联合 Google 和东北大学推出 InstructMesh，将微软 TRELLIS 的 3D 生成能力与 GPT-4 的推理能力结合，用户可用自然语言标注并修改 AI 生成的 3D 设计后再打印。", "type": "paper", "relTime": "1周前"}, {"id": 30, "title": "OpenRouter 图像生成定价 $0.018/张", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2105776625841570070", "date": "2026-10-01T21:47:25.000Z", "summary": "每张图 $0.018，一口价。输出尺寸不影响价格，参考图免费。", "type": "paper", "relTime": "1周前"}, {"id": 31, "title": "FLUX 3 Image 现已登陆 Krea，支持多轮编辑与 4K 生成", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2105769469880799716", "date": "2026-10-01T21:18:59.000Z", "summary": "Krea 宣布 FLUX 3 Image 已上线其平台。新能力包括多轮编辑且不改动其他像素、用 bounding box 排版图像、最高 4K 生成，以及组合最多 10 个参考图。", "type": "paper", "relTime": "1周前"}, {"id": 32, "title": "fal 上线 Grok Imagine Video v1.5 lite 的文生视频与图生视频入口", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2105759424270729641", "date": "2026-10-01T20:39:04.000Z", "summary": "fal 宣布 Grok Imagine Video v1.5 lite 已可在其平台试用，提供 Text-to-Video 和 Image-to-Video 两个入口。链接：https://fal.ai/models/xai/grok-imagine-video/v1.5/lite/text-to-video 与 https://fal.ai/models/xai/grok-imagine-...", "type": "model", "relTime": "1周前"}, {"id": 33, "title": "Grok Imagine Video 1.5 Lite 上线 fal 平台", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2105759422223929375", "date": "2026-10-01T20:39:04.000Z", "summary": "fal 宣布 Grok Imagine Video 1.5 Lite 上线，这是 Grok Imagine 视频家族中的轻量版模型。支持文生视频和图生视频并带原生音频，时长 1 到 15 秒；可输出 480p、720p 和 1080p，覆盖从 16:9 到 9:16 的 7 种画幅。", "type": "model", "relTime": "1周前"}, {"id": 34, "title": "OpenRouter 演示 FLUX 3 支持最多 10 张参考图生成整幅画面", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2105759095953461710", "date": "2026-10-01T20:37:46.000Z", "summary": "OpenRouter 发帖介绍 FLUX 3 的参考图能力，用户可一次性提供最多 10 张参考图并在单个提示词中描述场景，由模型决定各参考图的位置并共同渲染出整幅画面。", "type": "model", "relTime": "1周前"}, {"id": 35, "title": "FLUX 3 Image 上线 OpenRouter，支持原生 4K 生成与多参考编辑", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2105759062835220852", "date": "2026-10-01T20:37:38.000Z", "summary": "Black Forest Labs 的 FLUX 3 Image 现已上线 OpenRouter，是支持文生图与多参考编辑的旗舰图像模型，原生可渲染至 4K。原文提到可精确多轮编辑不动其他像素、用 bounding box 布局、最多用 10 个参考图合成，商业权重已开放，开放权重版将在未来数周发布。", "type": "model", "relTime": "1周前"}, {"id": 36, "title": "Higgsfield 上线 Black Forest Labs 的 FLUX 3 Image", "source": "X：Higgsfield AI (@higgsfield)", "sourceUrl": "https://x.com/higgsfield/status/2105757917651906978", "date": "2026-10-01T20:33:05.000Z", "summary": "Higgsfield 宣布 FLUX 3 Image 已在其平台上线，该模型来自 Black Forest Labs。支持只改一处细节不动其余部分、用 bounding box 放置物体、最多组合 10 个参考图，以及生成最高 4K 分辨率图像。", "type": "model", "relTime": "1周前"}, {"id": 37, "title": "FLUX 3 Image 上线 fal 平台", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2105745492474802514", "date": "2026-10-01T19:43:42.000Z", "summary": "fal 宣布 FLUX 3 Image 已上线平台，主打精准图像编辑且保留未改动部分。该模型支持原生 2K 和 4K 图像生成、最多组合 10 张参考图、一次完成多个定点编辑，并可对布局和构图做细致控制。", "type": "model", "relTime": "1周前"}, {"id": 38, "title": "Tavus 发布 Griffin 视频对话模型，称其首个通过视频图灵测试", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2105724860831781279", "date": "2026-10-01T18:21:43.000Z", "summary": "Tavus 发布 Griffin，称其为首个通过视频图灵测试的 Human Interaction Model，48% 与其实时对话的人以为对方是真人，此前系统通过率低于 3%。作者获早期访问体验，称该视频到视频模型可边看边听、打断和被打断并反应房间内发生的事；在 NVIDIA Video Full-Duplex Benchmark 上生成得分 3.83/5，真人为 3.92。", "type": "model", "relTime": "1周前"}, {"id": 39, "title": "Claude Slides 演示 Anthropic 设计师从语音备忘录生成幻灯片", "source": "Claude：YouTube（RSS）", "sourceUrl": "https://www.youtube.com/shorts/NzcRprKWbD8", "date": "2026-10-01T18:07:31.000Z", "summary": "Claude 官方视频展示 Anthropic 设计师 Nate 如何使用 Claude Slides 制作演示文稿。他在散步时用手机录一段整理思路的语音备忘录，再与 Claude 一起把想法打磨成幻灯片，把时间花在想法本身而非排版上。", "type": "tip", "relTime": "1周前"}, {"id": 40, "title": "Google DeepMind 播客探讨 AI 内容溯源与水印", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2105707085287567709", "date": "2026-10-01T17:11:05.000Z", "summary": "当 AI 生成内容变得如此逼真，我们如何验证哪些是人、机器或自然创造的？  我们在播客中探讨溯源的关键作用——以及不可感知的水印如何同时保护数字媒体和生物设计。↓  时间轴： 00:00 介绍 00:34 什么是水印？ 04:35 SynthID 15:16 图像与视频 19:28 SynthID Bio 28:00 韧性的未来", "type": "tip", "relTime": "1周前"}, {"id": 41, "title": "Perplexity Computer 支持交互式图表", "source": "X：Perplexity (@perplexity_ai)", "sourceUrl": "https://x.com/perplexity_ai/status/2105692220280226296", "date": "2026-10-01T16:12:01.000Z", "summary": "Perplexity Computer 现在可以直接在你的对话线程中创建交互式图表和可视化。  对于金融数据，Computer 使用 @tradingview Lightweight Charts 来生成K线图、成交量和移动平均线。", "type": "paper", "relTime": "1周前"}, {"id": 42, "title": "Runway 推出 Project Continuum 实时视频界面系统", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2105685396734853582", "date": "2026-10-01T15:44:54.000Z", "summary": "介绍 @runwayml_labs 的 Project Continuum，一个围绕实时视频界面构建的全新操作系统研究应用。  今天，我们分享四种与计算机交互新方式的早期预览：Portals、Visual Thinking、Responsive Video Interfaces 和 Interactive Worlds。像 Solaris 这样的 Interface World Models...", "type": "model", "relTime": "1周前"}, {"id": 43, "title": "Manus 2.0 + Tripo 工作流实测", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2105674095946064334", "date": "2026-10-01T15:00:00.000Z", "summary": "从一句提示词开始。2 小时做出可玩的游戏。🚀  我们测试了全新的 Manus 2.0 + Tripo 工作流：  • @ManusAI 构建了核心机制和 HTML 游戏逻辑。 • Tripo 生成了高质量 3D 资产来替换占位模型。  看看实际转变效果。", "type": "model", "relTime": "1周前"}, {"id": 44, "title": "华为 Mate XT 2 三折叠手机获 HarmonyOS 7.0.0.109 SP8 升级，通信共享支持多人互助", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/160.htm", "date": "2026-10-01T14:23:44.000Z", "summary": "华为 Mate XT 2 非凡大师三折叠手机推送 HarmonyOS 7.0.0.109 SP8 更新，锁屏新增 3D 空间壁纸，通信共享升级为手机与搭载 HarmonyOS 7 的手机、平板、鸿蒙电脑之间支持多人互助通信共享。图库支持静态/动态照片生成 3D 动态照片并添加多种空间运镜效果，深色模式可随日出日落自动切换，小艺优化了多模态基础大模型推理速度。", "type": "model", "relTime": "1周前"}, {"id": 45, "title": "OpenRouter 上线 Pareto 26.10 预览版", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2105661806186500286", "date": "2026-10-01T14:11:10.000Z", "summary": "1/ 来自 @theunbiasedco 的 Pareto 26.10 Preview 现已在 OpenRouter 上线，输入 $0.80/M、输出 $3.20/M，而当前 Pareto 为 $2.50/$7.50。  一款面向研究、编程和智能体工作流的多模态复合模型，具备 1M 上下文、文本和图像输入，以及工具调用能力。", "type": "model", "relTime": "1周前"}, {"id": 46, "title": "Figure 让 F.02 人形机器人跳入熔炉退役，采纳施瓦辛格本人提议", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/159.htm", "date": "2026-10-01T14:03:36.000Z", "summary": "Figure 为退役的 F.02 人形机器人举行\"火化仪式\"，让机器人亲自跳入熔炉，这一想法源自《终结者 2》T-800 扮演者施瓦辛格本人的提议。施瓦辛格身穿全套防护装备到场，带领一台 F.02 走向熔炉，并在视频结尾摘下面具宣布\"Figure 2 已经退役\"。", "type": "industry", "relTime": "1周前"}, {"id": 47, "title": "Synthesia 发布 Sessions 交互式 AI 数字人，支持实时对话练习与访谈", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2105649227690873228", "date": "2026-10-01T13:21:11.000Z", "summary": "Synthesia 发布 Sessions，一套可实时对话的交互式 AI 数字人，用于教练辅导、面试和引导式访谈。包含两类场景：Roleplay Sessions 用于实时练习销售通话和求职面试，结束后 AI 教练为每项技能打分并讲解；Survey Sessions 用数字人开展访谈、收集反馈与洞察。Synthesia 的数字人此前只能单向播放培训视频，现在可实时对话和回应。", "type": "paper", "relTime": "1周前"}, {"id": 48, "title": "PixVerse 将在 NAB Show NY 展示 AI 视频工作流", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2105513007279432171", "date": "2026-10-01T04:19:54.000Z", "summary": "AI 视频正在超越一次性生成。真正的机会在于更快、更灵活的制作工作流，从概念到成品内容。  我们将在 #NABShowNY 现场展示这一工作流，10 月 21-22 日，纽约。  10 月 21 日第一天结束后，欢迎加入我们的 happy hour。", "type": "industry", "relTime": "1周前"}, {"id": 49, "title": "谷歌 DeepMind 推出 SynthID Bio，为 AI 生成的蛋白质嵌入可验证水印", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/008/940.htm", "date": "2026-10-01T01:28:53.000Z", "summary": "谷歌推出 SynthID Bio，将数字水印技术引入合成生物学，通过引导氨基酸选择和调整预测 3D 结构的原子坐标，把可检测签名嵌入生物编码，并能在物理蛋白质上验证。", "type": "paper", "relTime": "1周前"}, {"id": 50, "title": "OneStreamer：统一流式视频交互中的感知、记忆与主动响应", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.01762", "date": "2026-10-01T00:00:00.000Z", "summary": "OneStreamer 通过共享的主动生成过程，联合学习与查询无关的证据记录和任务响应，其 Proactive Hierarchical Caption Memory（PHCM）生成带时间定位的局部细节描述与已完成事件摘要。", "type": "paper", "relTime": "1周前"}, {"id": 51, "title": "Where-OPD：用合成场景对 MLLM 做空间引导的在线自蒸馏", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.02117", "date": "2026-10-01T00:00:00.000Z", "summary": "Where-OPD 提出一种面向多模态大模型（MLLM）的在线自蒸馏方法，让教师模型获得文本形式的空间定位引导，从而定位并整合多个相关图像区域的证据，学生模型仅凭图像和问题学习复现该行为。", "type": "paper", "relTime": "1周前"}, {"id": 52, "title": "HC-DLM：分层连续扩散语言模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.02193", "date": "2026-10-01T00:00:00.000Z", "summary": "研究者提出分层连续扩散语言模型（HC-DLM），将离散 token 生成与连续隐变量轨迹耦合进单一去噪过程，训练目标由 token 似然的变分下界推导而来。与把连续上下文附加到离散链上的做法不同，HC-DLM 让隐变量成为唯一持续存在的生成状态，每步从中读出 token 并反馈为下一步隐状态更新的脚手架。", "type": "paper", "relTime": "1周前"}, {"id": 53, "title": "OmniSeek：面向多轮音视频推理的原生工具集成框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.02181", "date": "2026-10-01T00:00:00.000Z", "summary": "OmniSeek 是一个将 Omni-LLM 转变为原生工具调用多轮推理智能体的框架，让模型在推理中动态决定看或听、以及选取哪段时间窗口，把检索到的原始音视频片段回填上下文。", "type": "paper", "relTime": "1周前"}, {"id": 54, "title": "AutoGUIWorld：用图像生成器作为 GUI 智能体的视觉世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.01215", "date": "2026-10-01T00:00:00.000Z", "summary": "AutoGUIWorld 是一个数据生成框架，用图像生成器的视觉先验加规划器的任务知识合成 GUI 交互轨迹，无需部署或运行真实软件环境。它从操作系统上下文、视觉外观和界面状态的结构化规格中采样初始场景，经动作 grounding 与转移级质量过滤，在 Ubuntu、Windows、macOS 和 Chrome 上产出 79,266 条带空间标注的 step 级训练样本。", "type": "paper", "relTime": "1周前"}, {"id": 55, "title": "Omni-Embed-Mini：通过稠密蒸馏绑定多模态而不遗忘文本能力", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.02148", "date": "2026-10-01T00:00:00.000Z", "summary": "Omni-Embed-Mini 是一个 0.9B 参数的多模态嵌入模型，可将文本、语音、音频、图像、视频和富视觉文档映射到同一余弦空间，且不更新任何文本侧参数。", "type": "paper", "relTime": "1周前"}, {"id": 56, "title": "4Director：用刚性 3D 几何控制视频世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.02160", "date": "2026-10-01T00:00:00.000Z", "summary": "4Director 是一个以显式 4D 场景表示为条件的视频世界模型，每个物体从输入图像重建为规范网格，并由每帧一个预设刚性变换驱动。它把受控场景渲染为深度视频，再用 Motion Adapter 生成视角一致的外观、光照与非刚性动态。", "type": "paper", "relTime": "1周前"}, {"id": 57, "title": "SILSA：用滑动窗口切片隐变量实现保拓扑高分辨率 3D 生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.02201", "date": "2026-10-01T00:00:00.000Z", "summary": "SILSA 是一个拓扑感知的 3D 生成框架，用沿三个坐标轴的固定重叠切片隐变量替代昂贵的体素 token，每个 token 概括局部深度窗口，支持单阶段 rectified-flow 生成。", "type": "paper", "relTime": "1周前"}, {"id": 58, "title": "VTR-Bench：评估视频生成中视觉文本渲染的系统性基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.01499", "date": "2026-10-01T00:00:00.000Z", "summary": "VTR-Bench 是用于评估视频生成模型视觉文本渲染能力的系统性基准，包含覆盖广告、科学视频等五类场景的 300 条提示词，并配套自动化评估流程。在 11 个 SOTA 模型上的实验显示，场景文本渲染普遍存在困难，表现最好的模型整体词错误率（WER）为 0.250。", "type": "paper", "relTime": "1周前"}, {"id": 59, "title": "Ego2Act：评估第一视角视频生成中的目标导向操作", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.01092", "date": "2026-10-01T00:00:00.000Z", "summary": "Ego2Act 是一个面向目标导向的第一视角视频生成基准，包含来自 110 个真实世界任务的 2,640 段视频，覆盖不同物体杂乱程度与多步复杂度。该基准要求模型根据初始场景图像和高层目标，生成手部操作物体完成任务的逼真第一视角视频，并配套推出无参考评估流程 Ego2ActJudge。", "type": "paper", "relTime": "1周前"}, {"id": 60, "title": "扩展与蒸馏文本嵌入以提升扩散语言模型可扩散性", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.01016", "date": "2026-10-01T00:00:00.000Z", "summary": "研究发现，将嵌入模型从 T5 扩展到 T5Gemma-1、T5Gemma-2 可显著提升扩散语言模型生成性能，但原始 T5Gemma-2 嵌入区分度过高，导致连续扩散易落入无效嵌入。", "type": "paper", "relTime": "1周前"}, {"id": 61, "title": "ROWBench：视频模型能否渲染出程序所指定的内容？", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.02205", "date": "2026-10-01T00:00:00.000Z", "summary": "PROWBench 基准发布，包含 170 个程序化构建的 episode 和 600 段代理视频，用于检验视频模型对程序指定世界事件的视觉还原能力。该基准记录实体状态与带时间戳事件（含镜头视野外事件）作为可回放世界记录，并渲染同步视图，覆盖第一、第三人称视角。", "type": "paper", "relTime": "1周前"}, {"id": 62, "title": "fal CTO 谈视频生成与编程智能体", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2105440992057086190", "date": "2026-09-30T23:33:44.000Z", "summary": "视频生成和编程智能体正在定义一类新的 AI 工作负载。个人在日常工作中正高效地消耗大量算力。  fal CTO @gorkem 上周在我们的 GenMedia Conference 上与 MTS 对话，谈“token market fit”。", "type": "tip", "relTime": "1周前"}, {"id": 63, "title": "苹果 Invites App 升级 1.12.0：支持全分辨率照片共享、扩展图乐园", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/008/956.htm", "date": "2026-09-30T23:24:16.000Z", "summary": "苹果 Invites App 更新至 1.12.0 版本，共享相册现支持全分辨率照片共享，任何收到链接的人均可加入并上传照片，包括非 Apple 设备用户。新版扩展图乐园（Image Playground）功能，新增照片级逼真背景生成能力，并简化邮箱验证流程，宾客点击收件箱链接即可加入活动，无需输入验证码。创建活动需订阅 iCloud+（50GB 起，月费 0.99 美元），接收链接者可免费回复。", "type": "product", "relTime": "1周前"}, {"id": 64, "title": "Runway Research 谈实时模型与机器人", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2105432353334325716", "date": "2026-09-30T22:59:24.000Z", "summary": "在一场深度问答中，Runway Research 团队聊了实时模型、生成式界面，以及机器人技术的下一步。", "type": "tip", "relTime": "1周前"}, {"id": 65, "title": "LongLive-Plug：视频生成通用蒸馏", "source": "X：AK (@_akhaliq)", "sourceUrl": "https://x.com/_akhaliq/status/2105432314633490445", "date": "2026-09-30T22:59:15.000Z", "summary": "LongLive-Plug  视频生成的通用蒸馏  论文：https://huggingface.co/papers/2609.38154", "type": "paper", "relTime": "1周前"}, {"id": 66, "title": "Hidream-O1-Video-1.0 以 1456 分登顶 Image-to-Video Arena 第 7 名", "source": "X：Arena (@arena)", "sourceUrl": "https://x.com/arena/status/2105425599095624143", "date": "2026-09-30T22:32:34.000Z", "summary": "Hidream-O1-Video-1.0 以 1456 分进入 Image-to-Video Arena 排行榜第 7 名，可通过 @vivago_ai 使用。该模型与 gemini-omni-flash 仅差 8 分，与 dreamina-seedance-2.0 和 2.5 的分差在 20 分以内。", "type": "model", "relTime": "1周前"}, {"id": 67, "title": "OpenRouter 视频生成支持种子复现", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2105401147234431243", "date": "2026-09-30T20:55:24.000Z", "summary": "4/ 设置种子即可重跑一次生成，每次只改一个变量。片段时长 5 到 15 秒，分辨率 480p 或 768p，支持从 21:9 到 9:16 的六种宽高比。", "type": "paper", "relTime": "1周前"}, {"id": 68, "title": "OpenRouter 介绍单模型覆盖 T2V/I2V/Ref2V", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2105401135662248190", "date": "2026-09-30T20:55:21.000Z", "summary": "3/ 一个模型覆盖文生视频（T2V）、图生视频（I2V）和参考生视频（Ref2V）。可以从提示词、首帧，或你自己的图像、视频和音频参考出发，并在提示词中逐一指向它们。", "type": "model", "relTime": "1周前"}, {"id": 69, "title": "HeyGen Video 1 登陆 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2105401123985297766", "date": "2026-09-30T20:55:19.000Z", "summary": "2/ 定价为每个渲染秒 $0.02 起，10 月前享 50% 折扣即 $0.01。图像和音频参考免费。  https://openrouter.ai/heygen/heygen-video-1", "type": "paper", "relTime": "1周前"}, {"id": 70, "title": "Anthropic：机器人普及或慢于AI", "source": "X：Peter McCrory（Anthropic 首席经济学家，@PeterMcCrory）", "sourceUrl": "https://x.com/PeterMcCrory/status/2105366167129121161", "date": "2026-09-30T18:36:24.000Z", "summary": "机器人技术在经济中的扩散，可能比 AI 的采用需要更长时间。  在近期的情景建模工作中，我们只考察了 AI 到 2030 年的影响。  若要展望更远的未来，则需要对机器人投资与采用的经济学进行更细致的建模。", "type": "tip", "relTime": "1周前"}, {"id": 71, "title": "Runway 发布 Runway Ads，端到端自动化效果广告创意生成与投放", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/company-news/introducing-runway-ads", "date": "2026-09-30T18:32:00.000Z", "summary": "Runway 发布 Runway Ads，一个面向效果营销的自主引擎，可连接广告账户和品牌套件，生成视频和图片创意并直接发布到 Meta、Google 和 TikTok，读取平台表现数据后生成下一轮创意。", "type": "paper", "relTime": "1周前"}, {"id": 72, "title": "Manus 用 Tripo AI 模型做 3D 赛车游戏", "source": "X：Manus (@ManusAI)", "sourceUrl": "https://x.com/ManusAI/status/2105361014531461378", "date": "2026-09-30T18:15:56.000Z", "summary": "用 Manus Game Dev 把一个想法变成好玩的 3D 赛车游戏。🏎️  赛车呢？由我们的合作伙伴 @tripoai 生成的 3D 模型。", "type": "model", "relTime": "1周前"}, {"id": 73, "title": "Runway 发布开放权重世界动作模型 Praxis-1", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2105358708599619790", "date": "2026-09-30T18:06:46.000Z", "summary": "Runway 推出开放权重世界动作模型 Praxis-1，将视频预训练能力转化为机器人真实世界控制，定位为可跨任意具身形态与环境的策略模型。该模型基于其大规模视频预训练与实时基础设施构建，官方称机器人演示数据有限而视频数据无限。Runway 正与 Noble Machines、Standard Bots、Ultra 等早期伙伴测试，并将在未来数月公开权重。", "type": "model", "relTime": "1周前"}, {"id": 74, "title": "JBR-001：基于 Arduino UNO Q 的开源可 3D 打印桌面机器人", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://projecthub.arduino.cc/syntheticaidata/jbr-001-a-desktop-companion-robot-powered-by-arduino-uno-q-b11c96", "date": "2026-09-30T17:26:06.993Z", "summary": "JBR-001 是一款基于 Arduino UNO Q 的开源、可 3D 打印桌面陪伴机器人，集摄像头、距离传感器、蜂鸣器、动画显示屏和三个舵机于一体，可支持计算机视觉与边缘 AI 实验。其 STL 文件已开放下载，用户可自行打印、组装和编程扩展。", "type": "tip", "relTime": "1周前"}, {"id": 75, "title": "Vivix 推出 A1 Playground + Agent 实时交互角色模型", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2105342413422366989", "date": "2026-09-30T17:02:01.000Z", "summary": "Vivix 发布 A1 Playground + Agent，可创建能说话、移动和与人互动的实时 AI 角色，支持上传图片定制形象、性格和声音，并开放了 platform.vivix.ai 的创建入口。", "type": "model", "relTime": "1周前"}, {"id": 76, "title": "NVIDIA 开放 2027–2028 研究生奖学金申请，最高 6 万美元", "source": "NVIDIA Blog（RSS）", "sourceUrl": "https://blogs.nvidia.com/blog/applications-open-graduate-fellowship-awards-2026/", "date": "2026-09-30T17:00:21.000Z", "summary": "NVIDIA 第 26 届研究生奖学金项目面向全球开放申请，每位学生最高可获 6 万美元资助，覆盖 AI、机器学习、自动驾驶、计算机图形、机器人、医疗和高性能计算等方向。", "type": "industry", "relTime": "1周前"}, {"id": 77, "title": "研究称 Cloudflare、Google 等基础设施服务商助长 AI 换脸滥用图像网站", "source": "404 Media（RSS）", "sourceUrl": "https://www.404media.co/deepfake-abuse-sites-infrastructure-providers-study/", "date": "2026-09-30T16:02:39.000Z", "summary": "发表于斯坦福 Journal of Online Trust and Safety 的研究识别了88个活跃托管未经同意 AI 生成亲密图像的网站，指出 Cloudflare、Google、Namecheap、WordPress 和 Proton 五家为主要基础设施服务商，其中 Cloudflare 提供了大部分托管、CDN 和域名解析服务，尽管各家服务条款均禁止非法内容。", "type": "paper", "relTime": "1周前"}, {"id": 78, "title": "Destro AI 获 800 万美元种子轮，用智能层让机器人与人类协同作业", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/30/destro-ais-secret-sauce-is-getting-robots-and-humans-on-the-same-page/", "date": "2026-09-30T16:00:00.000Z", "summary": "Destro 结束隐身状态并完成 800 万美元种子轮融资，由 Base10 Partners 和 Bonfire Ventures 领投。它不做机器人本体，而是用基于开放权重视觉-语言-动作模型的 Vision 操作系统和 Mothership 操作系统，统一调度机器人、货物与人工，已在 Yusen Logistics 落地试点，并计划扩展至 26 台机器人的完整部署。", "type": "industry", "relTime": "1周前"}, {"id": 79, "title": "Manus 分享视频生成与时间线编辑工作流", "source": "Manus：Blog（网页）", "sourceUrl": "https://manus.im/zh-cn/blog/introducing-video-editor", "date": "2026-09-30T16:00:00.000Z", "summary": "Manus 分享使用既有视频能力的创作经验：先由 AI 搜索参考、制作镜头与代码视觉元素，再在 Manus Studio 的视频编辑器中逐轨调整画面、字幕、配乐和音效。教程还演示导入本地素材、自动转录与编排初剪，以及将长视频剪成短片；作者以 125 段旅行素材整理成约 11 分钟成片为例，说明如何把生成初稿继续打磨为可发布作品。", "type": "tip", "relTime": "1周前"}, {"id": 80, "title": "Kled V3 发布：72 小时部署 AI 数据采集", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2105321861311517004", "date": "2026-09-30T15:40:21.000Z", "summary": "Kled 发布 V3。定制 AI 数据采集任务现可在 72 小时内部署给 500,000+ 贡献者。  108 个可配置任务模板，覆盖图像、视频、音频、文本和标注。从第一视角视频到稀有语言的对话语音，应有尽有。  每天采集 800 万个数据点。  现实世界正在变得可编程 🌍", "type": "industry", "relTime": "1周前"}, {"id": 81, "title": "Tripo API 集成 Unbound", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2105311720600170705", "date": "2026-09-30T15:00:03.000Z", "summary": "Tripo API 现已集成 @unbound_io。  将 Tripo P2 干净、可编辑的四边形拓扑直接带入实时雕刻流程。实时编辑 3D 几何体，即刻导出可用于生产的资产。无需无休止的清理，也不需要 Blender 技能。  由 Tripo 生成。使用 Unbound 实时雕刻。", "type": "product", "relTime": "1周前"}, {"id": 82, "title": "PixVerse 插件将音乐生成 MV", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2105296747367145815", "date": "2026-09-30T14:00:33.000Z", "summary": "用 PixVerse 插件把你的音乐变成 MV 或音乐可视化 告诉你的 AI 智能体你想要的情绪、风格和视觉效果 让它用 PixVerse 把想法呈现在屏幕上", "type": "paper", "relTime": "1周前"}, {"id": 83, "title": "Artificial Analysis 发布 AA-Video-T2V v2.0 文生视频评测基准，Wan 3.0 居首", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2105291240573190370", "date": "2026-09-30T13:38:40.000Z", "summary": "Artificial Analysis 发布 AA-Video-T2V v2.0 和无音频版 AA-Video-T2V-Silent v2.0 文生视频基准，统一以 1080p 高码率评估，按 10 种用例、10 种能力和多种视觉风格排名，分别基于超 68,000 票（1,000+ prompts）和超 47,000 票（500 prompts）的人工偏好投票。", "type": "paper", "relTime": "1周前"}, {"id": 84, "title": "新加坡男子用 Gemini 生成鳄鱼侵袭水库图片被起诉，最高或面临 10 年监禁和 1 万新币罚款", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/008/909.htm", "date": "2026-09-30T13:01:44.000Z", "summary": "新加坡男子 Ye Lin 因用谷歌 Gemini 生成鳄鱼出现在 Pandan 水库的图片并发给同事，被指控传播虚假信息和妨碍司法公正，最高可判 10 年监禁、罚款 1 万新加坡元（约合 52,585 元人民币）。图片在网上扩散后，水务机构 PUB 接报搜寻鳄鱼并禁止水上活动，次日发现图片不实后报警；Ye Lin 随后删除了图片和操作记录，将于 11 月 10 日再次出庭。", "type": "industry", "relTime": "1周前"}, {"id": 85, "title": "商汤 SenseNova 6.8 Flash 预览动态设计功能", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2105266408531570825", "date": "2026-09-30T12:00:00.000Z", "summary": "商汤预览由 SenseNova 6.8 Flash 驱动的 Dynamic Design，可将静态图像转为动态设计。该功能会理解文本、主体与视觉元素的关系，决定哪些保持静态、哪些做动画，并为每个元素选择 HTML/CSS、SVG、透明图片或视频等合适形式，再编排文字显现、主体运动与环境响应，最后对照源设计检查并优化输出。", "type": "paper", "relTime": "1周前"}, {"id": 86, "title": "Meshy 7 实现包装文字精准生成", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2105243758870638787", "date": "2026-09-30T10:30:00.000Z", "summary": "AI 生成的包装上的文字：模糊、残缺，总要修一轮。这次不一样。😎  我们搭了一整架玩具。看看盒子上的字。  Meshy 7 直接从你的输入图像带来准确的文字、风格和颜色。一次生成，就能得到你想要的纹理。🎨  提示：想用同一种风格做一整套？用 3D Agent 批量处理，现已结束 beta。", "type": "paper", "relTime": "1周前"}, {"id": 87, "title": "千问「逛展锦囊」上线：特展购票、随拍随问、方言讲解一站式搞定", "source": "公众号：千问APP（阿里）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzYzNDE5MDEwMQ==&mid=2247489074&idx=1&sn=88f11f43f50b74eceee902ad5cd1a153&chksm=f13c8340a063bb13701734b15e61307a953e0505b24395e6175488581cb7e5f1be45f4ff5ecf&scene=126&sessionid=1790762314#rd", "date": "2026-09-30T09:45:23.000Z", "summary": "千问APP推出十一假期「逛展锦囊」，用户可通过@山海文博展览助手查询特展信息并直接购票，逛展时用千问相机拍下展品即可获得讲解。该功能基于千问大模型的原生多模态视觉理解能力，结合文物类专项训练和海量博物馆数据，还支持切换「四川道长」等定制音色。", "type": "tip", "relTime": "1周前"}, {"id": 88, "title": "豪威推出常开型视觉 AI 协处理器 OAX7700，停车监控方案仅需 3% 功耗", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/008/624.htm", "date": "2026-09-30T03:04:54.000Z", "summary": "豪威（OmniVision）发布常开型视觉 AI 协处理器 OAX7700，基于它构建的停车监控系统功耗仅为市面现有方案的 3%。该芯片集成 NPU，具备人体检测、人与物体识别、距离测算等边缘 AI 能力，可将现有车载外摄像头方案升级为超低功耗停车监控系统，检测到事件后录制 5~10 秒预录视频交由电子控制单元核验。", "type": "paper", "relTime": "1周前"}, {"id": 89, "title": "剑桥等机构研究提出 vibercrime 概念：AI 加速廉价诈骗但未造出新黑客", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2105114842910884110", "date": "2026-09-30T01:57:44.000Z", "summary": "Jack Hughes、Ben Collier 和 Daniel R. Thomas 的论文分析近10万条网络犯罪论坛相关帖子，提出 vibercrime 一词：AI 是便利帮手而非犯罪的即插即用工具。生成式AI 主要扩大垃圾网站、机器人账号和拟人化诈骗信息的规模，编码助手多为已有编程能力者省时，尚未显著降低技术门槛或催生创新性黑客手段。", "type": "paper", "relTime": "1周前"}, {"id": 90, "title": "livenerf 开源：用预注册基准长期检测 Claude Opus 5.5 发布后是否被削弱", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://github.com/ninjahawk/livenerf", "date": "2026-09-30T00:22:06.110Z", "summary": "livenerf 是一个 append-only 基准项目，目标是检测 Claude Opus 5.5 在 2026-09-22 发布后性能是否随时间漂移。", "type": "tip", "relTime": "1周前"}, {"id": 91, "title": "Google 如何在 TPU 上加速视频扩散模型的时空注意力", "source": "Google Developers Blog（RSS）", "sourceUrl": "https://developers.googleblog.com/accelerating-spatio-temporal-attention-for-video-diffusion-on-tpus/", "date": "2026-09-30T00:00:00.000Z", "summary": "Google 在 TPU 上通过稀疏注意力内核优化加速视频扩散模型推理，将理论稀疏性转化为端到端实际加速。", "type": "tip", "relTime": "1周前"}, {"id": 92, "title": "生成式行为克隆如何表征多模态专家行为", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2605.22493", "date": "2026-09-30T00:00:00.000Z", "summary": "研究分析了生成式行为克隆策略在相同观测对应多个有效动作时的多模态表征瓶颈：隐变量策略需在潜表征中保留动作条件信息，过强的后验-先验正则化会抑制该信息，正则化过弱则依赖部署时先验覆盖相关潜区域；动作空间生成策略则受限于基空间到动作空间传输映射的平滑性，小 Lipschitz 常数难以覆盖多个分离模态。", "type": "paper", "relTime": "1周前"}, {"id": 93, "title": "WorldAuditBench：用多模态智能体审计交互式 3D 世界", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.40325", "date": "2026-09-30T00:00:00.000Z", "summary": "研究者推出 WorldAuditBench，一个面向 3D 世界审计的基准，包含 13 个基于 Unreal Engine 5 和 Three.js 构建的环境中的 213 个异常任务，覆盖五类异常。在固定探索预算下评测五款前沿模型，两种审计范式的成功率仅为 6.6% 至 42.3%，远低于人类的 83.4%。该基准用于研究多模态智能体如何在交互式 3D 环境中耦合动作与视觉推理。", "type": "paper", "relTime": "1周前"}, {"id": 94, "title": "MemLife：面向长期第一人称视频记忆的整理与推理系统", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.40195", "date": "2026-09-30T00:00:00.000Z", "summary": "MemLife 是一个多模态记忆系统，通过构建实体锚定的第一人称文本片段，并用时间索引的智能体读取器进行检索，在无需训练、查询时不访问原始视频的情况下，于四个长期基准上比最强免训练基线提升 4.6–12.0%。配套的 MemOpt 强化学习框架优化记忆写入器，使 MemLife 再提升 2.7–5.0%，且增益可跨写入器、读取器骨干和记忆系统泛化。", "type": "paper", "relTime": "1周前"}, {"id": 95, "title": "Physis-Lang：以自演化语言作为视频世界模型的物理表征", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.40358", "date": "2026-09-30T00:00:00.000Z", "summary": "Physis-Lang 提出用自演化语言作为视频世界模型的物理表征，统一数据筛选、模型训练与视频生成，并构建 PhysCapBench 将物理过程拆解为原子断言、以召回率和精确率评估描述质量。在 Wan 与 Cosmos 骨干上，该方法在四个物理视频基准上持续提升物理合理性；基于开源 Cosmos3-Nano 的增强模型超过领先的闭源 Veo 3.1。", "type": "paper", "relTime": "1周前"}, {"id": 96, "title": "CoEvoWhen：面向超长视频时序定位的策略-工具协同演化", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.40048", "date": "2026-09-30T00:00:00.000Z", "summary": "研究者提出 CoEvoWhen 策略-工具协同演化框架，从 VLM 的智能体推理轨迹中联合演化高层策略与可执行媒体工具，形成可复用技能且无需更新模型参数。在五个 benchmark 和三个 VLM 上，该方法持续提升超长视频时序定位准确率，同时降低推理时的视觉 token 开销，演化出的技能在通用长视频 QA 上也取得显著提升。", "type": "paper", "relTime": "1周前"}, {"id": 97, "title": "SpatialCORE：大型视觉语言模型中的置信度感知空间推理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38716", "date": "2026-09-30T00:00:00.000Z", "summary": "SpatialCORE 是一个后训练框架，将模型对生成式定位的自身置信度转化为空间推理的学习信号，通过自调节空间奖励按坐标 token 置信度加权每个预测边界框的匹配质量，并用答案门控将定位优化与最终答案正确性绑定。该框架在多个 benchmark 上取得开源及专用空间推理模型中的 SOTA 结果，并可零样本迁移到未见数据分布，源代码已公开。", "type": "paper", "relTime": "1周前"}, {"id": 98, "title": "DC-SAE：面向更快扩散收敛的深度压缩语义自编码器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.39222", "date": "2026-09-30T00:00:00.000Z", "summary": "DC-SAE 是一种解耦紧凑语义自编码器，通过语义编码器实现高压缩比、并用像素级编码器保留细节，从而兼顾高压缩与快速扩散训练收敛。在 ImageNet 512×512 上实现 32 倍空间压缩，PSNR 29.79、gFID 3.37，较 DC-AE 分别提升 13.5% 和 54.9%。", "type": "paper", "relTime": "1周前"}, {"id": 99, "title": "RSIGame：基于递归自我改进的自主智能体游戏开发框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.39045", "date": "2026-09-30T00:00:00.000Z", "summary": "RSIGame 是一个带递归自我改进的自主智能体游戏开发框架，通过局部“探索-诊断-改进”循环与全局质量跟踪循环，缓解迭代优化对少量测试用例的过拟合。在 140 个 GameCraft-Bench 任务、两个游戏引擎和五个生成器上，RSIGame 在相同开发预算下持续提升游戏质量。", "type": "paper", "relTime": "1周前"}, {"id": 100, "title": "UniEvo-VL：面向多模态模型自我改进的在线自蒸馏训练方案", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38721", "date": "2026-09-30T00:00:00.000Z", "summary": "UniEvo-VL 提出一种无需外部教师模型的多模态自进化训练方案，让同一模型分别以学生和教师身份、基于不同上下文进行在线自蒸馏，在自身采样轨迹上最小化去噪扩散分布差异。", "type": "paper", "relTime": "1周前"}, {"id": 101, "title": "SemanTok：为高效自回归视频生成提供可预测的语义 token", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.00686", "date": "2026-09-30T00:00:00.000Z", "summary": "SemanTok 是一种灵活视频 tokenizer，将冻结的 DINO 特征输入编码器，并加入轻量 head，使每个保留的 token 前缀都能单独重建这些特征。201M 的 SemanTok AR 模型匹配或超越 3.4 倍规模的 VideoFlexTok AR 模型，更大模型还能进一步提升保真度。它在分布外类别上保持语义对齐，并在包括纯噪声在内的各噪声水平上为解码器提供更高语义对齐。", "type": "paper", "relTime": "1周前"}, {"id": 102, "title": "Multimodal Flow：在嵌入空间统一语言与视觉的流建模", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.40362", "date": "2026-09-30T00:00:00.000Z", "summary": "Multimodal Flow 提出一种全连续的多模态生成模型，将文本块与图像组织为有序连续 hyperchunk，通过共享 chunk-causal flow backbone 和 Flow Matching 学习统一向量场，并用联合注意力实现跨模态交互。", "type": "paper", "relTime": "1周前"}, {"id": 103, "title": "视频生成模型的后期训练与对齐综述", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.00812", "date": "2026-09-30T00:00:00.000Z", "summary": "一篇综述首次系统梳理视频生成模型的后期训练与对齐，将其统一为隐式对齐与显式对齐两类框架。方法被归为四类：监督微调、自训练与蒸馏、偏好与奖励方法、推理时方法。文章还整理了常用数据集、benchmark 与评测实践，并讨论可扩展奖励设计、长时程时序一致性、稳定性与表现力权衡及安全生成等开放挑战。", "type": "paper", "relTime": "1周前"}, {"id": 104, "title": "PhysVista：用感知-推理-评估闭环评测 VLM 的物理智能", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.00559", "date": "2026-09-30T00:00:00.000Z", "summary": "PhysVista 是一个通过\"感知-推理-评估\"闭环框架评测 VLM 物理智能的 benchmark，联合考察物理状态感知、物理动力学推理与物理合理性评估，并区分事件级与尺度级推理。它同时纳入真实世界与 AI 生成视频，覆盖多领域及新兴生成场景。实验显示，多种 VLM 在物理推理与合理性评估上存在明显不足，视觉识别与真正的物理理解之间仍有持续差距。", "type": "paper", "relTime": "1周前"}, {"id": 105, "title": "Honeycomb：为视频世界模型提供恒定大小的场景记忆表示", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.37690", "date": "2026-09-30T00:00:00.000Z", "summary": "视频世界模型 Honeycomb 提出 HexMemory 低秩表示，用六个空间与时空平面以固定大小存储场景特征，避免现有空间记忆随生成过程不断累积 RGB 观测或潜特征。", "type": "paper", "relTime": "1周前"}, {"id": 106, "title": "EgoTools：面向真实第一视角视频的工具中心推理数据集与基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.39378", "date": "2026-09-30T00:00:00.000Z", "summary": "研究团队推出 EgoTools，首个面向第一视角工具使用理解的综合套件，包含 100 小时带同步音频、密集描述与 3D 信息的 EgoTools-Data，以及覆盖四个赛道的 1000 对 QA 诊断基准 EgoTools-Bench。", "type": "paper", "relTime": "1周前"}, {"id": 107, "title": "PixelDense：把稠密预测用作像素扩散的表征对齐", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.00483", "date": "2026-09-30T00:00:00.000Z", "summary": "PixelDense 将 DINOv2、SAM2 与 Depth Anything v2、Metric3D v2 分别路由到语义和几何两条投影流，并用权重空间正交惩罚让两流保持子空间不相交，四个教师模型训练时冻结、推理时丢弃。", "type": "paper", "relTime": "1周前"}, {"id": 108, "title": "基于推理与反思的个性化图像生成：PEARL 与用户历史基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.00737", "date": "2026-09-30T00:00:00.000Z", "summary": "研究者提出首个基于用户历史（评论、帖子、图片、caption 与元数据）的个性化图像生成统一基准，包含个性化场景生成与个性化创意生成两项任务及多轴评测协议。同时提出 PEARL，将多模态推理器与冻结的图像生成器耦合为交错的\"推理-反思\"循环，并用差分数据奖励优化，在两项任务上平均提升 15% 的个性化指标。", "type": "paper", "relTime": "1周前"}, {"id": 109, "title": "Dyna Robotics 发布 Dyna-2.1 与半人形机器人 Taku，独立完成一小时洗衣房任务", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2105048999808131377", "date": "2026-09-29T21:36:06.000Z", "summary": "Dyna Robotics 发布 Dyna-2.1，称其为首个实现可靠超长时程全身自主的 Physical Agent，并搭配全新半人形硬件 Taku。作者转发引用其公开的一小时无剪辑视频：机器人独自运行酒店式洗衣房，装载并启动机器、叠好毛巾并上架，且在别处需要处理时能中断当前动作而不瞬间冻结，这依赖一个并行视觉语言模型监视房间、让 Dyna-2 持续保持手部运作。", "type": "model", "relTime": "1周前"}, {"id": 110, "title": "AMD 以 82 亿美元收购 World Labs，加码与 Nvidia 的竞争", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/09/amd-acquires-world-labs-ai-pioneer-fei-fei-lis-world-models-startup/", "date": "2026-09-29T21:14:49.000Z", "summary": "AMD 宣布将以 82 亿美元收购李飞飞联合创立的世界模型公司 World Labs，交易预计年底前完成，待监管批准。World Labs 2024 年以 2.3 亿美元融资成立，其首款公开工具 Marble 可用 Gaussian splats 生成小型 3D 空间并导出为影视、游戏用 3D 资产，该领域的重要用例之一是为机器人训练生成合成数据，而 Nvidia 在此领域领先。", "type": "industry", "relTime": "1周前"}, {"id": 111, "title": "马斯克在特朗普面前差点说漏AI", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2105034004789670169", "date": "2026-09-29T20:36:31.000Z", "summary": "马斯克在特朗普总统面前差点让\"AI\"脱口而出，及时改口说成了\"SI……超级智能\"。  随后他表示，我们不会\"只有全民基本收入，我们将拥有全民高收入。当你有机器人、有超级智能时，这意味着世界上每个人都能获得比在座任何人都更好的医疗服务。\" https://x.com/EricLDaugh/status/2105030609710035406/video/1", "type": "tip", "relTime": "1周前"}, {"id": 112, "title": "Drafted AI 户型图生成器上线 Revit 插件", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2105032750789210235", "date": "2026-09-29T20:31:32.000Z", "summary": "Drafted 的 AI 户型图生成器已作为插件登陆 Autodesk Revit，可将房屋轮廓和房间清单生成 5 套户型方案，且全部由真实的 Revit 墙体、楼板、屋顶、门窗构建。据 Drafted 测试，生成结果约需 45 秒；房间可删除并单独重新生成，其余方案保持不变，团队还能把生成的门窗墙体替换为自有组件并逐一手动编辑。", "type": "paper", "relTime": "1周前"}, {"id": 113, "title": "fal 扩展 Agent 在创作流程中的能力", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2105031762745098450", "date": "2026-09-29T20:27:36.000Z", "summary": "fal 宣布其 Agent 现在可覆盖更多创作环节：内置语音 Agent 可讨论想法，支持视频序列剪辑、在 Blender 中工作、排队和批量生成，并可同时运行多个工作流，作为一个创作伙伴贯穿整个流程。", "type": "paper", "relTime": "1周前"}, {"id": 114, "title": "OpenAI 在 Dev Day 发布 Space、Pages 等办公功能，ChatGPT 剑指微软办公套件", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/29/openai-takes-on-microsoft-with-the-launch-of-what-feels-a-whole-lot-like-chatgpts-own-office-suite/", "date": "2026-09-29T17:45:51.000Z", "summary": "OpenAI 在旧金山 Dev Day 上发布多项面向办公场景的 ChatGPT 新功能，包括共享工作区 Space、文档工具 Pages 和协作幻灯片，形式上接近微软办公套件。Space 中同事可与聊天机器人及新推出的 AI 智能体人格 Dots 协作处理工作任务；Pages 定位为面向人与智能体协作的新型文档，可写作、研究、生成图表和图像。这是 OpenAI 进一步切入微软办公软件腹地的举措。", "type": "paper", "relTime": "1周前"}, {"id": 115, "title": "Runway 加入 OpenAI Marketplace", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2104988068289843602", "date": "2026-09-29T17:33:58.000Z", "summary": "我们作为首发合作伙伴加入 @OpenAI Marketplace。  从今天起，你可以访问最优秀的图像、视频、音频和编辑模型，并可将部分 OpenAI 承诺额度用于在 Runway 上的购买。  点击下方链接了解更多并开始创作。", "type": "industry", "relTime": "1周前"}, {"id": 116, "title": "Apple Creator Studio 迎来新更新：全新模板、端到端电影级视频与效率功能", "source": "Apple：Newsroom（RSS）", "sourceUrl": "https://www.apple.com/newsroom/2026/09/new-updates-coming-to-apple-creator-studio/", "date": "2026-09-29T17:00:02.643Z", "summary": "Apple Creator Studio 将新增全新模板、端到端电影级视频制作流程以及多项提升效率的功能。Freeform 新增深色模式自适应画板、文件夹分组协作，并支持 Apple Intelligence 写作工具改写、校对和摘要手写笔记。在 visionOS 27 中，用户可将画板中的图片、视频、便签、形状和 3D 模型拖入空间并成组查看。", "type": "model", "relTime": "1周前"}, {"id": 117, "title": "Photo Scrubber：用 GPT-6 Astra 打造的本地人脸模糊与元数据清除工具", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/29/photo-scrubber/", "date": "2026-09-29T16:45:27.000Z", "summary": "Simon Willison 用 GPT-6 Astra 构建了实验性工具 Photo Scrubber，可自动识别人脸并模糊处理。该工具基于 Google 的 MediaPipe C++ 库，通过 @mediapipe/tasks-vision 编译为 WebAssembly，并使用 BlazeFace 人脸检测模型，全程在本地运行。", "type": "tip", "relTime": "1周前"}, {"id": 118, "title": "NVIDIA 扩展 xio-sig 加入 cuObject，并发布 SCADA Server SDK", "source": "NVIDIA Technical Blog：Agentic AI / Generative AI", "sourceUrl": "https://developer.nvidia.com/blog/expanding-ai-storage-access-with-nvidia-cuobject-and-the-nvidia-scada-server-sdk/", "date": "2026-09-29T16:00:00.000Z", "summary": "NVIDIA 宣布 xio-sig 在 cuFile 之外新增 cuObject，并正式开放 cuObject 客户端与服务器库，开发者可通过其 API 和 RDMA 线协议构建加速对象存储应用。同步推出的 SCADA Server SDK 让存储厂商构建响应 GPU 发起请求的 SCADA 服务器，IBM 已用集成 Storage Scale 的原型验证互操作性。", "type": "product", "relTime": "1周前"}, {"id": 119, "title": "Tripo 与 Grok 打造 SpaceX 火星任务游戏", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2104949319686127873", "date": "2026-09-29T15:00:00.000Z", "summary": "嘿 @grok，给我们的火星基地打个分吧！✨  为庆祝 Starship Flight 14 发射，我们在浏览器里做了一个完全可玩的 SpaceX 火星任务。  Grok 负责核心游戏逻辑和编码，Tripo 则即时生成 3D 资产。  从提示词到一个完全可玩的世界。我们准备好升空了吗，@SpaceX？", "type": "paper", "relTime": "1周前"}, {"id": 120, "title": "豪威集团发布 OX08D30 车外摄像头图像传感器：800 万像素，支持 LED 闪烁抑制", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/008/363.htm", "date": "2026-09-29T08:21:49.000Z", "summary": "豪威集团发布 800 万像素 CMOS 汽车图像传感器 OX08D30，基于 TheiaCel™ 技术，面向 ADAS 与自动驾驶车外摄像头，现已出样并进入量产。该传感器可抑制 LED 闪烁，最远检测距离达 200 米，与 OX08D10 引脚对引脚兼容，功耗降低 20%、尺寸缩减 50%。", "type": "industry", "relTime": "1周前"}, {"id": 121, "title": "叶序：一款音频响应式LED显示屏", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://jagi.studio/posts/phyllotaxis/", "date": "2026-09-29T07:33:05.802Z", "summary": "开发者用 Processing 生成黄金角螺旋点阵并做 Voronoi 剖分，再用 CadQuery 建模、3D 打印出 89 颗可寻址 RGB LED 的叶序造型灯盘。灯盘由 STM32 blackpill 驱动，通过 SPI 控制 neopixel，并接入 INMP441 I2S 数字麦克风，借助 ARM CMSIS 库做傅里叶变换与多频段能量分析，实现随房间声音变化的音频响应效果。", "type": "tip", "relTime": "1周前"}, {"id": 122, "title": "Runway 如何帮世界杂耍联盟用 AI 补满电视转播的空座位", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/customers/world-juggling-federation", "date": "2026-09-29T00:52:14.404Z", "summary": "世界杂耍联盟（WJF）创始人 Jason Garfield 用 Runway 为荷兰两日赛事的转播补全观众席：首日满座、次日侧机位空座，他用 Aleph 2.0 在原始素材中加入观众而不改动画面其他部分，仅一个极广角镜头退回 After Effects 处理。他还用 Runway 生成开场动画、选手资料卡、排行榜和舞台烟火，整档约一小时特别节目由他一人完成，单段生成时长上限约 15 秒。", "type": "tip", "relTime": "1周前"}, {"id": 123, "title": "OpenRouter 对比 Veo 3.1、Seedance、Kling、Grok Imagine Video 的图生视频能力与价格", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/insights/image-to-video-models-compared/", "date": "2026-09-29T00:00:00.000Z", "summary": "OpenRouter 对比其平台上 Veo 3.1 系列、Seedance 2.5/2.0 系列、Kling v3.0 与 Grok Imagine Video 各模型的图生视频设置，涵盖分辨率、时长、首尾帧控制、音频和每秒价格，数据核查于 2026 年 9 月 11 日。", "type": "tip", "relTime": "1周前"}, {"id": 124, "title": "OmniTaskonomy：视觉生成何时能提升视觉理解？", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38079", "date": "2026-09-29T00:00:00.000Z", "summary": "研究通过配对 I2I 生成与 I2T 理解任务发现，在合适训练配方下 I2I 训练能提升下游 I2T 表现，且 I2I 训练数据越多增益越大。", "type": "paper", "relTime": "1周前"}, {"id": 125, "title": "SplitMoE：用分角色稀疏架构打破视频扩散模型的均匀性陷阱", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38140", "date": "2026-09-29T00:00:00.000Z", "summary": "针对传统 token-wise MoE 因均匀专家使用正则化导致的\"均匀性陷阱\"，SplitMoE 提出分角色稀疏架构，将专家池拆分为语义专家与通用专家，配合原型引导路由和拉推正则化，让 token 按语义属性自然聚类。在等效激活参数预算下，SplitMoE 在收敛速度、路由一致性和视频生成质量上均优于传统负载均衡 MoE。", "type": "paper", "relTime": "1周前"}, {"id": 126, "title": "Grounded Entity Biographies（GEB）：用实体传记增强长视频记忆", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38155", "date": "2026-09-29T00:00:00.000Z", "summary": "研究者提出长视频记忆框架 Grounded Entity Biographies（GEB），将跨片段的同一物理实例的视觉观测归组为可检索的\"传记\"，并在问答时与情节证据一同检索，让模型沿身份链接追踪实体。", "type": "paper", "relTime": "1周前"}, {"id": 127, "title": "LongLive-Plug：面向视频生成的一次性蒸馏框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38154", "date": "2026-09-29T00:00:00.000Z", "summary": "LongLive-Plug 是一个一次性蒸馏框架，把可复用能力以 LoRA 形式学在基座模型上，无需重训练即可即插即用到兼容的下游模型。这些能力涵盖单次 classifier-free guidance、少步采样和自回归生成的长上下文纠错，即使下游模型新增条件分支或扩展输出通道仍可复用。团队在三个骨干家族、八类任务的 54 个下游模型上验证了免训练部署，包括世界建模、机器人、编辑和多模态生成。", "type": "paper", "relTime": "1周前"}, {"id": 128, "title": "Think Before You Score：面向视觉生成的思想奖励模型 TRM", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.37372", "date": "2026-09-29T00:00:00.000Z", "summary": "研究者提出 Thinking Reward Model（TRM），先为每个样本生成自适应评分标准再做评估，输出细粒度 pointwise 奖励，并引入 PD-GRPO 缓解成对偏好优化导致的分数极化。在图像生成与编辑奖励建模基准上，TRM 在开源奖励模型中达到 SOTA，并可与闭源方案竞争；作为强化学习奖励信号还能稳定提升多种视觉生成模型。", "type": "paper", "relTime": "1周前"}, {"id": 129, "title": "EVO-WAM：通过视频-动作验证让世界动作模型自我进化", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38057", "date": "2026-09-29T00:00:00.000Z", "summary": "EVO-WAM 让世界动作模型无需额外专家演示即可适应新任务，通过状态预测与锚定多帧上下文实现自回归 rollout，并用视觉语言模型筛选完成任务的前缀、以逆动力学模型验证视频-动作一致性后迭代训练。", "type": "paper", "relTime": "1周前"}, {"id": 130, "title": "HiRAE：带残差预算的分层表示自编码器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.37775", "date": "2026-09-29T00:00:00.000Z", "summary": "HiRAE 提出分层表示自编码器，按深度对编码器各层分组并学习对最深表示的残差修正，用分组范数上限约束修正幅度、浅层预算更紧。HiRAE-24 保持潜变量 token 数与通道维度不变，在 ImageNet-256 上将重建 FID 从 RAEv2 的 0.299 降至 0.209，并维持有竞争力的引导生成质量。", "type": "paper", "relTime": "1周前"}, {"id": 131, "title": "改进的分布扩散模型：DiT-XL/2 在 ImageNet-256² 上 4 步达 4.48 FID", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.37147", "date": "2026-09-29T00:00:00.000Z", "summary": "改进的分布扩散模型（DDM）通过将粒子扩展推迟到 Transformer 后层，并引入基于动力学区间的时间相关评分规则调度，解决了多粒子训练开销随粒子数增长、评分规则超参数全局固定的问题。", "type": "paper", "relTime": "1周前"}, {"id": 132, "title": "SoL-Refiner：一步精修实现 4K 高分辨率视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.37969", "date": "2026-09-29T00:00:00.000Z", "summary": "SoL-Refiner 是一种单步视频精修器，可将低分辨率模型输出经一次去噪直接转为 4K 视频，其训练流程包含高分辨率持续训练、强化学习后训练与最终的单步蒸馏。", "type": "paper", "relTime": "1周前"}, {"id": 133, "title": "LIFT：通过 On-Policy 自蒸馏实现大视角变化下的未来布局视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38146", "date": "2026-09-29T00:00:00.000Z", "summary": "研究团队提出 LIFT，一个统一的图像到视频生成框架，用末帧布局作为显式控制信号，让用户指定未来视角中出现什么内容及其位置。由于稀疏布局引导比逐帧密集布局更难学习，LIFT 引入 on-policy self-distillation（OPSD），将密集布局教师模型的控制能力迁移给末帧布局学生模型。", "type": "paper", "relTime": "1周前"}, {"id": 134, "title": "Real2Gym：从视频构建仿真训练场，把技能带给机器人", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.37089", "date": "2026-09-29T00:00:00.000Z", "summary": "Real2Gym 是一个 Real2Sim2Real 智能体框架，能把人类和机器人演示视频转成可交互仿真训练场，并将仿真中学到的技能迁移到实体机器人。其仿真环境重建成功率比 GPT-6 Astra Direct Mode 高 16.7%，策略执行 token 减少约 74.9%；在真实 Franka 机器人四项任务上，实体执行成功率高出 33.3%。", "type": "paper", "relTime": "1周前"}, {"id": 135, "title": "Scaffolding Minds：为多模态推理优化潜在视觉目标表示", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.19669", "date": "2026-09-29T00:00:00.000Z", "summary": "Scaffolding Minds 针对潜在推理两阶段框架的两个缺陷提出改进：用专门学习的 scaffolding encoder 在潜在空间提供优化目标，并同时学习 RL 采样器的均值和方差以支持探索。该方法在 FrozenLake 空间规划上比最强潜在推理基线提升 +9.5 分，32x32 网格上提升扩大至 +19 分，在九个视觉中心推理基准上平均提升 +5.6 分。", "type": "paper", "relTime": "1周前"}, {"id": 136, "title": "像素扩散模型的对抗训练后训练研究：恢复高频细节并提升分布保真度", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38170", "date": "2026-09-29T00:00:00.000Z", "summary": "研究首次系统探索像素扩散模型的对抗后训练：在预训练模型上保留原有扩散或流匹配目标，对非高噪声时间步的预测输出加入对抗损失，架构与采样流程不变。在两个像素骨干上，该方法同时提升了分布保真度、覆盖度、提示词对齐和感知质量；频谱分析显示原模型系统性缺失自然图像高频成分，对抗后训练可将其恢复。在测试的潜空间扩散配置下，同样流程未带来可比增益，几乎不增加解码后的高频功率。", "type": "paper", "relTime": "1周前"}, {"id": 137, "title": "VideoLoop：用循环工作记忆对抗长视频智能体的语义抖动", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38119", "date": "2026-09-29T00:00:00.000Z", "summary": "多模态智能体框架 VideoLoop 通过外循环推理视频、内循环从无界文件系统检索历史观察并重写有界工作记忆，解决长视频理解中\"语义抖动\"导致的注意力崩溃问题。", "type": "paper", "relTime": "1周前"}, {"id": 138, "title": "FocusVTC：自适应分辨率的高效视觉文本压缩", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.36651", "date": "2026-09-29T00:00:00.000Z", "summary": "FocusVTC 通过自适应分辨率打破视觉文本压缩的固定分辨率权衡，在保留通用多模态能力的同时压缩输入长度。在 RULER v1 上以 72 DPI 取得 87.4 分、2.9 倍输入压缩，超过 Glyph 的 57.5 分；LongBench 得分 56.40 高于文本输入基线的 55.86，MRCR 宏平均提升 13.91 分，在线端到端延迟较纯文本提速 2.79 倍。", "type": "paper", "relTime": "1周前"}, {"id": 139, "title": "WorldLine：面向机器人操作的动作驱动视觉模拟器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38059", "date": "2026-09-29T00:00:00.000Z", "summary": "WorldLine 是一个动作驱动的视觉模拟器，将可迁移的动力学学习与异构动作对齐解耦，基于超过 10,000 小时无动作机器人视频学习操作动力学，并用超过 2,000 小时、覆盖十余种本体的动作轨迹完成对齐。", "type": "paper", "relTime": "1周前"}, {"id": 140, "title": "PRISM：反事实视频生成实现可扩展的人形机器人移动操作", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38172", "date": "2026-09-29T00:00:00.000Z", "summary": "PRISM 是一个 real-to-sim-to-real 框架，通过视频到视频（V2V）生成将少量真实视频扩增为数百段\"反事实\"人-物交互视频，再经接触锚定的 real-to-sim 流程重建人与物体运动，把不完美视频数据重定向为物理合理的轨迹。该框架训练出单一策略，可泛化到同类未见物体，并在真实机器人上零微调部署，仅用机载深度观测完成箱子、桶、储物箱和球的抓取、搬运与放置。", "type": "paper", "relTime": "1周前"}, {"id": 141, "title": "MIST 压力测试：无关图像会动摇 VLM 评判，却不影响其判断依据", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.37863", "date": "2026-09-29T00:00:00.000Z", "summary": "研究提出 MIST（Misleading-Image Stress Test），用 200 个可作比喻或字面理解的英文句子，分别配对齐图像、误导图像或无图像，要求仅凭句子作答。", "type": "paper", "relTime": "1周前"}, {"id": 142, "title": "LoopVL：循环式视觉智能", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38426", "date": "2026-09-29T00:00:00.000Z", "summary": "LoopVL 将 Loop Transformer 扩展到视觉语言模型，通过 Module-Loop 与 Model-Loop 组合，用共享模块迭代更新统一的视觉语言状态，并从零开始完成语言预训练、多模态训练与后训练。它在多模态理解与视觉推理基准上超过多款同规模及更大规模的非循环模型，还出现跨循环视觉注意力显著转移的 Visual Aha Moments。", "type": "paper", "relTime": "1周前"}, {"id": 143, "title": "ThinkV2V：释放 MLLM 推理能力，实现指令引导的视频编辑", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38541", "date": "2026-09-29T00:00:00.000Z", "summary": "ThinkV2V 是一个推理驱动的指令引导视频编辑框架，通过 MLLM-to-DiT 架构让 MLLM 在视觉生成前先对源视频和指令进行显式思考，生成精炼的条件信号。它结合渐进式课程训练与推理时思考扩展，并配套 ThinkV2V-150K 数据集和 ThinkV2V-Bench 基准。实验显示其 5B 规模 DiT 模型在复杂与标准编辑场景均达 SOTA，大幅超越 10B 规模基线。", "type": "paper", "relTime": "1周前"}, {"id": 144, "title": "Imagine3D-LLM：让多模态大模型先\"想象\"3D 场景再作答", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38177", "date": "2026-09-29T00:00:00.000Z", "summary": "Imagine3D-LLM 让多模态大模型在图像 token 后追加一组可学习的 summary token，将其解码为紧凑的 3D Gaussian Splatting 表示，并以光度重建损失监督、与标准下一 token 预测联合训练。仅 summary token 接受重建监督，却能增强 LLM 底层图像特征的跨帧对应，在多个空间推理与 3D 理解基准上持续优于此前方法。", "type": "paper", "relTime": "1周前"}, {"id": 145, "title": "Adaptive Reward Routing：面向联合音视频扩散模型的前向过程 RL 动态多奖励优化", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.37200", "date": "2026-09-29T00:00:00.000Z", "summary": "针对联合音视频扩散模型的多奖励强化学习，研究者提出 Adaptive Reward Routing，在 DiffusionNFT 前向过程 RL 中同时自适应调整更新位置与奖励协调方式。", "type": "paper", "relTime": "1周前"}, {"id": 146, "title": "SECRET：用源条件化中继引导缓解音视频大语言模型的幻觉", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.37568", "date": "2026-09-29T00:00:00.000Z", "summary": "针对音视频大语言模型（AVLLM）的\"来源混淆接地幻觉\"，研究者通过路径干预与表征分析发现\"问题中继\"机制：问题状态会携带干扰模态的线索，削弱对所需模态证据的接地。", "type": "paper", "relTime": "1周前"}, {"id": 147, "title": "E-MoE：面向非因子化扩散语言模型的增强型混合专家方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.37533", "date": "2026-09-29T00:00:00.000Z", "summary": "研究提出 E-MoE，用 MoE 骨干的专家路由决策构建离散共享隐变量，将扩散语言模型的反向过程建模为因子化分布的混合，且不增加激活参数量。在合成多模态基准、二值化 MNIST 和 LM1B 上，E-MoE 相比因子化基线改善了少步生成质量。", "type": "paper", "relTime": "1周前"}, {"id": 148, "title": "PixelUMM：无需编码器的统一图像与视频理解生成模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38597", "date": "2026-09-29T00:00:00.000Z", "summary": "PixelUMM 是一个无需视觉编码器的统一多模态模型，直接在像素空间完成图像与视频的理解和生成。它将图像表示为空间 patch、视频表示为时空 tubelet，通过单层线性投影接入共享多模态主干，并采用 Mixture-of-Transformers 架构结合共享注意力与任务专属参数，同时支持自回归文本预测和像素空间流匹配。", "type": "paper", "relTime": "1周前"}, {"id": 149, "title": "Bonjour 用 Runway 将一份脚本生成所有广告风格", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/customers/bonjour", "date": "2026-09-28T23:46:29.430Z", "summary": "法国适应原饮料品牌 Bonjour 的 15 人创意团队用 Runway 把一份脚本批量生成多种动画风格广告，从脚本到效果判定只需 4 到 5 天，成品动画批次 24 到 48 小时完成。团队已用 Runway 产出超过 500 个视频和图像变体，并称转向内部生成创意后省下逾 5 万欧元外部制作费用；改用 Runway 企业版后不再受 credits 限制，可继续加大测试投入。", "type": "paper", "relTime": "1周前"}, {"id": 150, "title": "李飞飞谈大语言模型的局限", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2104716942317875249", "date": "2026-09-28T23:36:37.000Z", "summary": "李飞飞博士谈大语言模型的局限。  “语言纯粹是生成的信号。你不会走到自然界里，发现天上写着字。存在的是一个遵循物理定律的 3D 世界。”", "type": "tip", "relTime": "1周前"}, {"id": 151, "title": "快手可灵 AI Kling 4.0 将于 10 月上线，Kling 4.0 Flash 已开放抢先体验", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/008/073.htm", "date": "2026-09-28T22:55:38.000Z", "summary": "快手可灵 AI 宣布 Kling 4.0 将于 10 月正式上线，Kling 4.0 Flash 已于 9 月 28 日向黑金年卡会员开放抢先体验。", "type": "paper", "relTime": "1周前"}, {"id": 152, "title": "ElevenLabs v4 上线 Runway", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2104698524885794938", "date": "2026-09-28T22:23:26.000Z", "summary": "ElevenLabs v4 现已登陆 Runway。v4 模型擅长旁白和角色对话，表现力和语调自然度均超越以往。  即日起可用，与全球顶尖的图像和视频模型一同提供。点击下方链接立即体验。", "type": "model", "relTime": "1周前"}, {"id": 153, "title": "AMD 以约 82 亿美元全股票收购李飞飞联合创办的 World Labs", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/1001749/amd-world-labs-ai-acquisition-deal", "date": "2026-09-28T21:31:35.000Z", "summary": "AMD 宣布以约 82 亿美元的全股票交易收购李飞飞联合创办的 AI 研究实验室 World Labs，交易预计年底前完成。World Labs 于 2024 年成立，2025 年推出从提示词生成可交互 3D 世界的商业产品 Marble；李飞飞将出任 AMD EVP 兼首席科学家，向 CEO Lisa Su 汇报，团队继续推进 AI 模型研究。", "type": "industry", "relTime": "1周前"}, {"id": 154, "title": "Manus Studio 炼金模式一键生成视频", "source": "X：Manus (@ManusAI)", "sourceUrl": "https://x.com/ManusAI/status/2104665826007888234", "date": "2026-09-28T20:13:30.000Z", "summary": "一个提示词。一个精修视频。  Manus Studio 的炼金模式，感觉就像拥有一整支创意团队，在为你导演、编剧、分镜，并跟着音乐节奏剪辑每一个节拍。  视频、原始提示词和完整会话都在推文串里。", "type": "paper", "relTime": "1周前"}, {"id": 155, "title": "李飞飞宣布 World Labs 并入 AMD，出任执行副总裁兼首席科学家", "source": "X：Fei-Fei Li (@drfeifei, World Labs)", "sourceUrl": "https://x.com/drfeifei/status/2104664403681632453", "date": "2026-09-28T20:07:51.000Z", "summary": "李飞飞宣布 World Labs 加入 AMD，她本人将出任 AMD 执行副总裁兼首席科学家。World Labs 成立于 2024 年初，专注空间智能基础模型，近期发布了可从 2D 图像预测新相机视角的 omni 模型 Atlas，并通过收购 SceniX 布局机器人模拟；她表示加入 AMD 是为了更贴近硬件、扩大规模，并继续向社区提供开放模型与端到端平台。", "type": "industry", "relTime": "1周前"}, {"id": 156, "title": "PreviewDiff：用多模态评审引导扩散潜变量搜索", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.36199", "date": "2026-09-28T20:00:41.000Z", "summary": "PreviewDiff 是一种免训练测试时搜索方法，把扩散采样从标量搜索变为对中间潜变量的多模态评审引导搜索：在选定的去噪检查点解码部分预览，由多模态评审模型打分并给出自然语言批评，据此在语义提示词编辑和局部重新加噪的潜变量延续上分支，再对分支打分并选择性推进。在图像和视频生成基准上，它持续优于同等预算的 Best-of-N 选择和强标量搜索基线；消融显示更早介入和更大搜索宽度收益最大。", "type": "paper", "relTime": "1周前"}, {"id": 157, "title": "HN.watch：为所有 Hacker News 帖子生成短视频解说", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://hn.watch/", "date": "2026-09-28T19:46:03.029Z", "summary": "HN.watch 上线，为 Hacker News 每条帖子配一段短视频解说，点击标题即可观看。该站由 scrimba 制作，声明与 Y Combinator 无关，不设 cookie 与追踪脚本，仅做匿名每日聚合。", "type": "paper", "relTime": "1周前"}, {"id": 158, "title": "Perplexity Computer 科普视频功能", "source": "X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)", "sourceUrl": "https://x.com/AravSrinivas/status/2104593373026038209", "date": "2026-09-28T15:25:36.000Z", "summary": "这是我小时候会很喜欢的东西  （引用推文概括：Computer 可以从 Wiley Online Library 等科学来源提取信息，生成讲解视频。Wiley 数据对所有 Computer 用户免费开放，无需设置或现有订阅。）", "type": "paper", "relTime": "1周前"}, {"id": 159, "title": "商汤 Seko 助 22 岁学生独立制作 AI 短剧", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2104588113595314606", "date": "2026-09-28T15:04:42.000Z", "summary": "22 岁艺术设计学生 CHunye 用商汤 AI 视频创作 Agent Seko 独立制作日式僵尸短剧《DUHAI》，从第 3 集起全部由 Seko 完成，原本需要完整制作团队的工作如今一人即可完成。Seko 将创意转化为结构化制作流程，在同一画布上整合角色、场景与道具，其视觉记忆与推理能力保证跨集一致性。该剧在抖音累计播放量已突破 7400 万次。", "type": "paper", "relTime": "1周前"}, {"id": 160, "title": "祖父被 AI 深度伪造语音诈骗后，Tarini Padmanabhuni 创办 DetectifAI 做端侧检测", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/28/after-a-deepfake-voice-fooled-her-grandfather-this-founder-sprang-into-action/", "date": "2026-09-28T15:00:00.000Z", "summary": "Tarini Padmanabhuni 因祖父被 AI 深度伪造语音冒充其兄弟骗走赎金，创办旧金山公司 DetectifAI，做可在手机操作系统内本地运行的紧凑 AI 模型，在通话和语音消息中即时判断声音是否为 AI 生成，音频不出设备。", "type": "industry", "relTime": "1周前"}, {"id": 161, "title": "Meta 发布 Muse 系列模型与 API", "source": "X：AI at Meta (@AIatMeta)", "sourceUrl": "https://x.com/AIatMeta/status/2104579386024603826", "date": "2026-09-28T14:30:01.000Z", "summary": "过去 6 个月……  - Muse Spark - Muse Image - Muse Video - Muse Spark 1.1 - Meta Model API - Muse Glimmer - Muse Spark 1.2 - Muse Code - Muse Spark 1.3 - Muse  ……而我们才刚刚开始。🚀", "type": "industry", "relTime": "1周前"}, {"id": 162, "title": "404 Media 报道：人类审核员正在阅读 Microsoft Copilot 的提示词与图像并感到震惊", "source": "404 Media（RSS）", "sourceUrl": "https://www.404media.co/humans-reading-copilot-prompts-images/", "date": "2026-09-28T13:26:31.000Z", "summary": "404 Media 报道称，Microsoft 聘请的人类承包商为改进 Copilot 而持续审核用户上传的提示词和图像，其中大量涉及性暴露内容，如偷拍裙底照片或将女性置于性姿势的编辑请求。这些承包商还需判断生成图像是否完成提示词要求，例如 AI 放大的胸部是否足够大。", "type": "industry", "relTime": "1周前"}, {"id": 163, "title": "商汤发布AI视频创作Agent Seko，助力个人创作者打造百万播放短剧", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2104526535751287134", "date": "2026-09-28T11:00:00.000Z", "summary": "商汤科技（SenseTime）宣传其AI视频创作Agent“Seko”。案例显示，22岁艺术生CHunye利用Seko独立制作了日式丧尸短剧《DUHAI》，从第3集起完全由该工具生成。Seko能将创意转化为结构化工作流，通过视觉记忆和推理保持角色、场景跨集一致性。该系列在抖音等平台累计观看量超7400万，展示了AI赋能“一人公司”（OPC）的潜力。", "type": "paper", "relTime": "1周前"}, {"id": 164, "title": "AI每日简报：OpenAI修复GPT-6视觉Bug，Anthropic疑似新模型标签曝光", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2104493424472674634", "date": "2026-09-28T08:48:26.000Z", "summary": "该帖子为2026年9月28日的AI新闻聚合。主要内容包括：OpenAI修复了GPT-6 Sol和Luna的图像编码Bug；ChatGPT代码中发现“o”引用，传闻涉及Pro计划调整；Meta Muse增加VM屏幕浏览标签；Google Flow指向Nano Banana 2.1并测试印度Gemini购物功能；xAI Grok响应变快；Anthropic出现claude-sonnet-5-5标...", "type": "industry", "relTime": "1周前"}, {"id": 165, "title": "字节火山引擎发布 Seedance 影视合作计划，单项目激励最高百万", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/867.htm", "date": "2026-09-28T08:16:34.000Z", "summary": "9月27日，字节跳动旗下火山引擎在平遥国际电影展期间发布 Seedance 影视合作计划。该计划面向全球专业影视项目提供 Token 补贴、宣发资源及技术支持，单个项目激励最高可达百万人民币。参与要求包括全片视频生成环节100%由 Seedance 实现，支持全 AI 生成或 AI+真人混合制作，且重点鼓励在制作方法与工作流程上实现创新突破的项目。", "type": "industry", "relTime": "1周前"}, {"id": 166, "title": "昆仑万维天工工作台上线AI MV创作与音乐生成能力", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI1MzE1NDc3Mg==&mid=2247510445&idx=1&sn=986335f6da07fef6af3111ddf76db4bb&chksm=e802de782531392ddf63eed55984898d7d404510424c49f6a7f699cbca6e869a490e48071af7&scene=126&sessionid=1790588864#rd", "date": "2026-09-28T08:02:09.000Z", "summary": "9月27日，昆仑万维旗下SkyProduction（天工工作台）上线三项新能力：开放AI MV创作功能；无限画布接入Mureka V8/V9/V9.5音乐生成模型；视频和图片支持智能配乐。用户可在同一画布完成从音乐分析、分镜规划到视频生成的全流程，并调用Seedance 2.5模型生成视频片段。", "type": "model", "relTime": "1周前"}, {"id": 167, "title": "华为余承东宣布智界 RX 获 L3 级自动驾驶测试牌照并开展实测", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/834.htm", "date": "2026-09-28T07:11:49.000Z", "summary": "在智界 RX 及鸿蒙智行新品发布会上，华为余承东宣布智界 RX 搭载 L3 级自动驾驶架构，已获批 L3 级道路测试牌照，正在城市快速路等复杂公开道路开展实测。该车还配备全维防碰撞系统 CAS 5.0。此前曝光的测试视频显示，车辆通过方向盘“A”键激活 L3 模式，中控屏会显示相应状态。", "type": "industry", "relTime": "1周前"}, {"id": 168, "title": "Meta 推出 Hologram 拟真虚拟形象，秋季上线雷朋眼镜与 Quest 头显", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/767.htm", "date": "2026-09-28T04:31:04.000Z", "summary": "Meta 宣布将于今年秋季在雷朋 Display 智能眼镜、Quest 头显及新轻薄头显上推出“Hologram”功能。该功能利用生成式 AI（实时扩散模型）创建高度拟真的用户虚拟形象，替代传统摄像头画面用于 WhatsApp 视频通话。用户需通过手机 Meta AI 应用采集面部表情和语音数据完成建模。雷朋版基于音频驱动生成 2D 视频流，Quest 版支持 3D 等身立体呈现。目前存在细...", "type": "model", "relTime": "1周前"}, {"id": 169, "title": "开发者用英伟达 RTX Remix 让《GTA 2》支持光追", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/764.htm", "date": "2026-09-28T04:16:21.000Z", "summary": "Mod 作者 gebdag 发布《GTA 2》RTX Remix 模组，为这款 1999 年的 2D 俯视角游戏带来完整路径追踪和动态昼夜光照。由于 RTX Remix 不原生支持游戏所用的 DirectDraw 和早期 Direct3D，作者用两个 DLL 搭建定制 Direct3D 9 封装层完成转换，并解锁 16:9 宽屏与帧生成，帧率最高 60 FPS。", "type": "paper", "relTime": "1周前"}, {"id": 170, "title": "Google Research 推出 AI 视频联合导演，用 4 个智能体框架生成连贯的长视频", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/27/google-research-introduces-an-ai-video-co-director-4-agentic-frameworks-for-coherent-minutes-long-video-generation", "date": "2026-09-28T02:44:27.000Z", "summary": "Google Research 推出 AI 视频联合导演，由 4 个智能体框架组成，运行在 Gemini 和 Veo 之上，用于解决多镜头 AI 视频中的身份漂移和级联错误问题。", "type": "paper", "relTime": "1周前"}, {"id": 171, "title": "PixVerse 插件一键生成音乐 MV", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2104400073992102329", "date": "2026-09-28T02:37:30.000Z", "summary": "GPT-6 Astra 用一个提示词剪出了一支时尚说唱 MV  安装 PixVerse 插件，告诉智能体你想要什么，就能得到你自己的音乐视频", "type": "paper", "relTime": "1周前"}, {"id": 172, "title": "群核科技用空间智能重建永泰龟城，24 亿高斯点刷新全球 3D 高斯重建纪录", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/yunqipartners/manycore-techs-spatial-intelligence-continues-century-old-tu", "date": "2026-09-28T02:36:59.000Z", "summary": "群核科技联合博主「特能斯」4 人 4 天在甘肃永泰龟城采集 6 万多张照片，通过 3D 高斯重建平台 Aholo Reality 生成 24 亿高斯点、60 万平方米的数字古城，刷新全球公开可查的 3D 高斯重建纪录。该数字场景已交给景泰当地文旅作为永久数字文化档案保存，并依托 Aholo Viewer 的流式调度能力支持在线漫游；同一场景还被用于 LuxReal 生成 AI 短剧《永泰无战事》。", "type": "paper", "relTime": "1周前"}, {"id": 173, "title": "GPT-Image 2.5 的12种照片编辑与创意玩法教程", "source": "公众号：数字生命卡兹克", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA==&mid=2647686740&idx=1&sn=ae96d1c72375f5ad62ddb05432b04584&chksm=f1bd9f85e967fd41ec107fa4817e47acde4524b0a82166498a694df54b55edaca2674d909de4&scene=126&sessionid=1790572866#rd", "date": "2026-09-28T00:28:00.000Z", "summary": "文章介绍了利用 GPT-Image 2.5 模型进行照片精准编辑和创意生成的12种具体玩法，包括消除背景游客、自动调光、专业美颜、制作3D公仔拍立得、景点明信片、主体贴纸化、旅游碎片行李箱、人物海报、演唱会氛围感照片、美食飞溅效果、物体转文字涂鸦及Ins风注释等。每种玩法均提供了详细的提示词示例和操作步骤，旨在帮助用户在假期通过AI优化朋友圈照片。", "type": "tip", "relTime": "1周前"}, {"id": 174, "title": "GeoVerse：在几何隐空间中实现世界一致的新视角合成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35734", "date": "2026-09-28T00:00:00.000Z", "summary": "GeoVerse 通过在预训练 3D 基础模型的几何隐空间中生成、并注入视频生成模型的外观先验，实现世界一致的新视角合成。它从 Wan2.2 VACE 提取多层级特征，经 ControlNet 式适配器注入几何隐扩散模型，并用全局空间记忆聚合已观测与合成内容以保持跨视角连贯。", "type": "paper", "relTime": "1周前"}, {"id": 175, "title": "SolveEdit：生成模型视觉问题求解基准测试", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35504", "date": "2026-09-28T00:00:00.000Z", "summary": "研究者推出 SolveEdit 基准，用于评估生成模型通过场景变换完成视觉问题求解的能力，包含 2,728 个案例，并用原子变换契约与 SolveScore 在无需参考输出的情况下衡量完成度与误改。", "type": "paper", "relTime": "1周前"}, {"id": 176, "title": "EditWorld：面向可交互世界的精准编辑与灵活引用视频世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34470", "date": "2026-09-28T00:00:00.000Z", "summary": "EditWorld 是一个支持精准编辑与灵活引用的视频世界模型，可在自回归生成过程中流式接收编辑指令和参考图像，将世界建模从探索扩展到精准修改。它引入 Gated Causal Attention 处理时变编辑条件与参考图像，并用 Sparse Context 机制维持有界历史上下文以支持长时程推理。", "type": "paper", "relTime": "1周前"}, {"id": 177, "title": "EvolvingAvatar：随对话演进自适应调整的交互式 3D 头部生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35616", "date": "2026-09-28T00:00:00.000Z", "summary": "EvolvingAvatar 是一种因果生成器，通过测试时训练在交互过程中适配用户面部视频与双人音频，其双人上下文预测目标无需测试时目标动作标注即可提供自监督信号。", "type": "paper", "relTime": "1周前"}, {"id": 178, "title": "距离去掉视觉编码器还有多远？无编码器多模态预训练的缩放定律", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35457", "date": "2026-09-28T00:00:00.000Z", "summary": "研究对比了无编码器与有编码器多模态大模型的缩放定律，发现去掉视觉编码器会把多模态目标的算力最优分配推向更大模型，文本目标则几乎不变。两者在文本目标上损失-算力前沿几乎重合，但多模态目标上无编码器模型小规模时落后，预计约 10^22 FLOPs 时追平。无编码器时语言模型通过视觉专属适配接管其角色：视觉 token 双向交互随算力增长愈发有益，视觉处理前移，视觉 token 的专家路由更集中。", "type": "paper", "relTime": "1周前"}, {"id": 179, "title": "ControlScope：LLM 智能体的工作流修订与可靠性", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34313", "date": "2026-09-28T00:00:00.000Z", "summary": "ControlScope 对比了 LLM 智能体在同一公开执行状态下继续生成代码、编辑下一次工具调用的数据参数、以及替换未完成工作流三种修订方式，并区分可用修复与智能体实际选择的动作。", "type": "paper", "relTime": "1周前"}, {"id": 180, "title": "GEAR：用几何作为地址路由注意力，实现长时程相机控制视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34722", "date": "2026-09-28T00:00:00.000Z", "summary": "研究者提出 GEAR，一个以几何为 token 级地址来路由视觉记忆的注意力框架，用于长时程相机控制视频生成。", "type": "paper", "relTime": "1周前"}, {"id": 181, "title": "Just MLPs：为多模态语言模型高效重建视觉状态", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34972", "date": "2026-09-28T00:00:00.000Z", "summary": "研究提出 δ-Vision，用轻量低秩适配器构建逐层视觉记忆，替代视觉 token 在 Transformer 中的重复演化，同时保留全部视觉 token 供文本检索。该方法发现视觉到文本的信息流集中在低维子空间，且轻量 MLP 能以高余弦相似度和低重建误差逼近各层视觉状态。在图像和视频基准上，δ-Vision 在相当或更低计算量下准确率超过视觉 token 剪枝基线，且不丢弃视觉 token。", "type": "paper", "relTime": "1周前"}, {"id": 182, "title": "MT-OPSD：面向多轮图像编辑的在线策略自蒸馏框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35611", "date": "2026-09-28T00:00:00.000Z", "summary": "针对现有图像编辑模型在递归编辑中快速退化的问题，研究者提出 MT-OPSD 在线策略自蒸馏框架，让模型在自生成的条件下状态上训练，并由干净条件教师模型提供编辑监督，无需多轮标注。该工作同时发布 LME-Bench，包含 100 组十轮编辑会话，用于评估长程鲁棒性。在三个编辑骨干上的实验显示，MT-OPSD 显著提升长程编辑成功率、减少多轮崩溃，并基本保持单轮编辑质量。", "type": "paper", "relTime": "1周前"}, {"id": 183, "title": "SCOPD：面向高效视觉语言模型的稀疏上下文同策略自蒸馏", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34044", "date": "2026-09-28T00:00:00.000Z", "summary": "针对推理型视觉语言模型（VLM）视觉 token 序列过长导致推理昂贵的问题，研究者提出稀疏上下文同策略自蒸馏框架 SCOPD：学生模型基于剪枝后的视觉 token 生成推理轨迹，由拥有完整上下文的教师模型对同一同策略前缀进行监督，无需真实答案、架构改动或额外推理开销。", "type": "paper", "relTime": "1周前"}, {"id": 184, "title": "UMM-Reflection：用交错强化学习让统一多模态模型学会原生反思", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35767", "date": "2026-09-28T00:00:00.000Z", "summary": "UMM-Reflection 通过交错强化学习，让统一多模态模型在一条轨迹内完成\"诊断—修改—再观察\"的完整反思循环，轨迹级优势同时更新反思 token 与基于流的图像修改，推理时无需外部验证器。", "type": "paper", "relTime": "1周前"}, {"id": 185, "title": "SentZero：面向多任务零样本胸部 X 光分析的句子级视觉语言预训练框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34479", "date": "2026-09-28T00:00:00.000Z", "summary": "SentZero 是一个句子级视觉语言预训练框架，用于零样本、多任务的胸部 X 光（CXR）分析。它通过基于 LLM 的摘要级句子结构化与映射扩大正样本对多样性，并新增损失项缓解临床等价句子造成的假阴性，同时对视觉嵌入做句子条件残差调制。在多个下游任务和数据集上，SentZero 提升了零样本泛化能力，优于此前的多任务零样本方法。", "type": "paper", "relTime": "1周前"}, {"id": 186, "title": "FlowTool：用流匹配控制图像修饰中的工具参数", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35673", "date": "2026-09-28T00:00:00.000Z", "summary": "FlowTool 将基于工具的图像修饰建模为流匹配问题，用条件整流流直接生成工具参数，由视觉语言模型骨干加 Diffusion Transformer 参数生成器组成，把高斯噪声转成编辑方案。", "type": "paper", "relTime": "1周前"}, {"id": 187, "title": "AnswerMap：从答案后验构建 VLM 的忠实空间可解释性方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35247", "date": "2026-09-28T00:00:00.000Z", "summary": "论文提出 AnswerMap，一种免训练、任务无关的黑盒方法，通过行列条带的是/否后验外积生成查询条件下的空间图，并可定义读取方式导出定位等连续输出。", "type": "paper", "relTime": "1周前"}, {"id": 188, "title": "用提示词分歧做偏好监督：无需像素级标注的开放词汇语义分割适配方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34528", "date": "2026-09-28T00:00:00.000Z", "summary": "研究者提出偏好引导适配框架，用二元偏好替代密集掩码监督，把不同提示词模板对同一图像产生系统性差异的\"提示词分歧\"现象转化为内置偏好监督来源。该方法从跨模板高不确定性区域挖掘局部偏好查询，并用 Region-Localized Preference Optimization（RLPO）配合一致性正则化适配 OVSS 模型。", "type": "paper", "relTime": "1周前"}, {"id": 189, "title": "AutoRef：面向智能体多参考图像生成的 Harness 自动优化", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35530", "date": "2026-09-28T00:00:00.000Z", "summary": "AutoRef 通过编码智能体迭代重写 harness 代码，在模型冻结的前提下自动优化多参考图像生成流程，并发现 AutoRef-Harness。该 harness 将开源 FLUX.2 [klein] 4B 在 MultiBanana 基准的四参考任务上从 5.72 提升至 7.37，追平或超过 Nano Banana Pro 和 GPT-Image-1.5 等闭源模型。", "type": "paper", "relTime": "1周前"}, {"id": 190, "title": "ROSS：通过选择性监督从自生成 rollout 中再学习", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35954", "date": "2026-09-28T00:00:00.000Z", "summary": "ROSS 提出一种选择性监督方法，将历史轨迹完整保留为上下文，仅对选定的模型生成续写计算损失，从而复用自生成 rollout 中的行为经验。在 Qwen3.6-35B-A3B 上，ROSS 将六项基准的 MOPD 平均分从 58.40% 提升至 62.20%，SWE-bench Verified 从 64.20% 提升至 68.40%。", "type": "paper", "relTime": "1周前"}, {"id": 191, "title": "LeRF：为视角采择推理学习参考坐标系", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.36219", "date": "2026-09-28T00:00:00.000Z", "summary": "针对 VLM 在视角采择中常默认相机视角的问题，研究者提出 LeRF 框架，训练模型判断是否需要坐标系，并预测以实体为中心的参考坐标系，再由轻量渲染器叠加到图像上辅助推理，无需外部感知模型或显式 3D 重建。该方法先做监督微调学习选择性调用工具与坐标系预测，再用强化学习在空间 VQA 数据上优化，在多个视角采择基准上稳定优于其骨干模型，并超过现有开源方法。", "type": "paper", "relTime": "1周前"}, {"id": 192, "title": "LEGO-Anything：用编码智能体从单图重建 3D 场景，并推出 LEGO-Bench 基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.36380", "date": "2026-09-28T00:00:00.000Z", "summary": "LEGO-Anything 是一个 Image-to-Code 框架，让编码智能体迭代编写并执行 Blender 代码、检查场景与渲染结果并修订程序，把单图重建为可检查、可编辑、可查询的场景程序。", "type": "paper", "relTime": "1周前"}, {"id": 193, "title": "MaLiang-Harness：可编程图像与视频生成框架，GPT-6-Astra 双榜生成成功率 100%", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34309", "date": "2026-09-28T00:00:00.000Z", "summary": "MaLiang-Harness 是一个将 MLLM 驱动的视觉生成组织为持续构建、检查与修订流程的统一框架，用于弥合程序可执行但违反构图、外观或运动要求的 Program-to-Visual（P2V）差距。", "type": "paper", "relTime": "1周前"}, {"id": 194, "title": "PanoVLN：面向全景视觉语言导航的有效方案", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34759", "date": "2026-09-28T00:00:00.000Z", "summary": "PanoVLN 通过让模型从单张全景图预测更长动作序列，并引入置信度引导执行（CGE）策略动态决定执行步数，在 R2R-CE 和 RxR-CE Val-Unseen 上成功率分别超越此前 SOTA 11.9% 和 8.7%。", "type": "paper", "relTime": "1周前"}, {"id": 195, "title": "VideoPhysEdit：基于刚体物理场景重建的物理反事实视频编辑", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35134", "date": "2026-09-28T00:00:00.000Z", "summary": "VideoPhysEdit 提出免训练的物理反事实视频编辑（PCVE）流程，通过刚体物理场景重建还原可复现原视频运动与交互的仿真场景，从而把物理编辑作为干预并生成反事实视频。", "type": "paper", "relTime": "1周前"}, {"id": 196, "title": "PlaylistEval：视频语言模型做评判者，在日级长视频上还可靠吗？", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34314", "date": "2026-09-28T00:00:00.000Z", "summary": "PlaylistEval 是一个无需人工标注的智能体框架，可在超过 100 小时的播放列表视频集合上构建视频语言评判基准，自动生成差异由因果退化控制、必须跨集合检索才能作答的问答对。", "type": "paper", "relTime": "1周前"}, {"id": 197, "title": "FurE：无需动物毛发数据集的高效实例级 3D 毛发重建", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.35770", "date": "2026-09-28T00:00:00.000Z", "summary": "FurE 提出一种基于发丝的动物毛发重建方法，无需动物毛发数据集即可从多视角图像恢复可编辑的毛发造型，通过优化根条件潜在场并经 PCA 解码器生成发丝几何。该方法利用表面约束的 Gaussian Frosting 表示结合部位先验重建去毛动物身体，并借助人类头发数据训练的 PCA 解码器缓解动物数据稀缺问题。", "type": "paper", "relTime": "1周前"}, {"id": 198, "title": "重新思考潜在视觉推理：将潜在推理锚定在视觉证据上", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34563", "date": "2026-09-28T00:00:00.000Z", "summary": "针对潜在视觉推理中潜在 token 对改变正确答案的图像扰动响应微弱这一\"潜在证据信用缺口\"，研究者提出 ReaLVR，用正确与模型生成错误答案的对比确定监督位置，用匹配与不匹配的视觉证据指定应保留的内容。在三个模型家族上 ReaLVR 均优于现有 LVR 基线，在 Qwen2.5-VL-7B 上取得五项任务平均 63.7% 的最高成绩，并首次将潜在空间视觉推理扩展至 235B 规模。", "type": "paper", "relTime": "1周前"}, {"id": 199, "title": "视频-音频联合与跨模态生成及编辑：统一形式化与设计分类体系", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34381", "date": "2026-09-28T00:00:00.000Z", "summary": "一篇综述提出统一形式化框架，将视频-音频联合生成、跨模态生成与联合编辑定义为同一音视频对分布上的三类问题，并按五个设计维度对方法进行分类。该工作称首次系统梳理联合音视频编辑，将其划分为九类编辑、涵盖 28 种编辑类型，并整理了各场景的方法、数据集与评测指标。", "type": "paper", "relTime": "1周前"}, {"id": 200, "title": "Tex-Zero：无需 3D 资产训练的原生 3D 纹理生成框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.34621", "date": "2026-09-28T00:00:00.000Z", "summary": "Tex-Zero 提出无需任何 3D 资产即可训练高保真原生 3D 纹理生成框架，核心发现是 3D 纹理训练只需高质量细粒度颜色信息，几何信息可人工构造。该方法将 2D 图像表示为 3D 空间中的平面并施加 patch 级随机旋转与聚合，据此训练 Tex-Zero VAE 与 Tex-Zero DiT，后者将多视角条件图像同样转为 3D 平面并由 VAE 编码以缩小表示差距。", "type": "paper", "relTime": "1周前"}, {"id": 201, "title": "Opus 5.5 一句话生成视频论文", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2104352205176500542", "date": "2026-09-27T23:27:17.000Z", "summary": "有意思，这是 Paul Graham《如何做出伟大的工作》的另一个版本  给 opus 5.5 一句简单提示词，配上\"extra\" effort 设置  同一个提示词：\"Create a video essay from Paul Graham\\'s essay How to do great work with punchy motion graphics, modern styling ...", "type": "paper", "relTime": "1周前"}, {"id": 202, "title": "中国救援机器人自主飞向溺水者", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2104293764068159775", "date": "2026-09-27T19:35:03.000Z", "summary": "🇨🇳 中国救援机器人：自主飞向溺水者。  飞行速度约 10–14 m/s（峰值约 30 mph），覆盖范围可达约 2 km / 1.2 英里，降落时为最多两名 80 kg 成年人提供浮力，随后自行返回。", "type": "paper", "relTime": "1周前"}, {"id": 203, "title": "Simon Willison 用 Opus 5.5 打造 Bluesky 回复机器人检测工具", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/27/bluesky-bot-check", "date": "2026-09-27T18:41:44.000Z", "summary": "Simon Willison 用 Opus 5.5 开发了一款 Bluesky 回复机器人检测工具，可分析任意 Bluesky 个人资料是否存在自动化回复机器人迹象。该工具会检测在他人发帖后数秒内回复、从不发布原创内容或图片链接、只回复高粉丝量用户，以及包含问号等信号。", "type": "tip", "relTime": "1周前"}, {"id": 204, "title": "OpenAI 修复 GPT-6 图像理解 bug", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2104252306447544447", "date": "2026-09-27T16:50:19.000Z", "summary": "我们修复了一个导致 GPT-6 Sol 和 GPT-6 Luna 图像理解能力下降的 bug。现在你在 API 和 Codex 中的视觉任务上应该能看到更好的结果，包括 computer use。", "type": "product", "relTime": "1周前"}, {"id": 205, "title": "OpenAI 修复 GPT-6 图像理解 bug", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2104252025978658890", "date": "2026-09-27T16:49:12.000Z", "summary": "我们修复了一个导致 GPT-6 Sol 和 GPT-6 Luna 图像理解能力下降的 bug。现在你在 API 和 Codex 中的视觉任务上应该能看到更好的结果，包括 computer use。", "type": "product", "relTime": "1周前"}, {"id": 206, "title": "斯坦福与 Caltech 用 GPT-6 Astra 直驱 Unitree G1 机器人整理陌生厨房", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/researchers-plug-gpt-6-astra-directly-into-a-robot-and-let-it-clean-up-an-unfamiliar-kitchen", "date": "2026-09-27T10:59:11.000Z", "summary": "斯坦福和 Caltech 构建了 HomeBody 系统，让 Unitree G1 机器人无需传统训练控制层，由可替换的 VLM（此处为 GPT Astra）直接调用抓取、导航、开抽屉等技能库，自主探索陌生厨房并完成整理和取物。", "type": "paper", "relTime": "1周前"}, {"id": 207, "title": "Google Research MSEB 教程：按基准契约编写声音编码器并跨四类评测打分", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/26/a-coding-guide-to-google-researchs-mseb-writing-sound-encoders-to-the-benchmark-contract-and-scoring-them-across-classification-clustering-retrieval-and-segmentation", "date": "2026-09-27T05:42:35.000Z", "summary": "该教程演示如何按 MSEB 的 MultiModalEncoder 抽象基类编写两个声音编码器，分别测量响度与音色，并在自生成合成音频上运行分类、聚类、检索和分割四类评测器。两个编码器在不同评测器下排名互换，用数字说明多任务基准的必要性。教程基于 mseb 0.1.0，全程 CPU 运行、无需下载数据集。", "type": "paper", "relTime": "1周前"}, {"id": 208, "title": "VQS：用程序验证实现视觉语言模型自进化，答案正确率提升至 94%", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33855", "date": "2026-09-27T00:00:00.000Z", "summary": "针对自进化视觉语言模型中多数投票标签 24%、模型评判标签 18% 出错的问题，研究者提出 VQS，让模型把图像解析为场景图、图表表格等结构化记录，由固定程序生成问题并计算答案，模型只逐条核验程序读取的短事实。", "type": "paper", "relTime": "1周前"}, {"id": 209, "title": "SciGen-Verifier：面向科学图像生成可解释验证的多模态推理器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33399", "date": "2026-09-27T00:00:00.000Z", "summary": "SciGen-Verifier 是一个用于科学图像生成可解释验证的多模态推理器，通过冷启动监督微调加课程式两阶段强化学习训练，在自建基准 SciGen-Verify 上性能可媲美更大的闭源模型。该基准覆盖指令遵循、多学科推理与世界知识，采用二值判断、解释与纠错编辑指令的三层协议。它还可作为在线 critic 用于图像的迭代修正。", "type": "paper", "relTime": "1周前"}, {"id": 210, "title": "DroneWAM：面向无人机视觉导航的高效世界动作模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33148", "date": "2026-09-27T00:00:00.000Z", "summary": "DroneWAM 是面向无人机视觉导航的高效世界动作模型，采用 JEPA 架构在表示空间中预测未来状态，避免显式生成未来图像，并用预训练 Resampler 压缩编码器特征以减少每个想象步的重复计算。在仿真数据集 DroneNav-6D 上，DroneWAM 取得对比方法中最佳轨迹精度，自适应 rollout 将平均预测深度从 8 降至 4.58，同时提升轨迹精度。", "type": "paper", "relTime": "1周前"}, {"id": 211, "title": "VGGT-Diff：融合视觉几何与扩散模型的稀疏视角新视角合成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33253", "date": "2026-09-27T00:00:00.000Z", "summary": "VGGT-Diff 将 VGGT-Ω 的视觉几何 latent 路由进预训练视频扩散模型，用于稀疏视角新视角合成。每个视觉 token 关联 3D 点和置信度，经置信度感知的 Visual Geometry Router（VGR）转为查询对齐的 latent 条件，Point-Track Residual Consistency（PTRC）沿可靠 3D 轨迹正则化预测残差。", "type": "paper", "relTime": "1周前"}, {"id": 212, "title": "SMAT：简单高效的合并感知训练方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33437", "date": "2026-09-27T00:00:00.000Z", "summary": "研究者提出 SMAT（Simple MAT），通过将常见模型合并操作归纳为 Scale、Mask、Perturb 三种，联合优化专家损失与模拟合并参数下的期望损失，并引入周期性调度、算子融合和参数存储切换，使每步仅需一次前向和一次反向传播。在四个语言与视觉语言骨干模型上，SMAT 将五种合并方法的平均分较各骨干最强基线提升 1.07-2.16 分，训练时间开销较标准微调不足 2%。", "type": "paper", "relTime": "1周前"}, {"id": 213, "title": "REALM：面向具身反应式聆听的由粗到细生成框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33095", "date": "2026-09-27T00:00:00.000Z", "summary": "REALM（Reactive Embodied Audio-driven Listening Model）是一个由粗到细的音频驱动反应式聆听框架，通过 Reactive Gated Speaker-Listener Fusion 模块结合聆听者动作历史与说话人音频，并用粗解码器预测基础动作轨迹、在表情子空间叠加音频条件随机残差。", "type": "paper", "relTime": "1周前"}, {"id": 214, "title": "VisionHOPE：将视觉骨干网络构建为自修改学习系统", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33325", "date": "2026-09-27T00:00:00.000Z", "summary": "VisionHOPE 提出首个将视觉骨干网络形式化为自修改学习系统的方案，让模型在单张图像内\"记住什么\"与\"如何学习\"协同演化。它基于 Nested Learning 的自指构造，用五个耦合记忆分别存储内容、生成 key/value 表示并控制学习率与保留率，并推导出稳定性匹配的步长控制方案以保证记忆动态非扩张。", "type": "paper", "relTime": "1周前"}, {"id": 215, "title": "Diffusion Reward Models：用扩散模型做奖励建模的 DRM 方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33803", "date": "2026-09-27T00:00:00.000Z", "summary": "研究者提出 DRM（Diffusion Reward Model），把奖励建模重构为对 p(r|x,y) 的条件密度估计：以冻结的 LLM 编码器为条件，用轻量 Diffusion Transformer 将高斯噪声去噪为奖励向量，从而不预设输出分布并自然刻画人类偏好的多模态结构。", "type": "paper", "relTime": "1周前"}, {"id": 216, "title": "StoryEngine：面向视频叙事的基于状态的智能体框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33627", "date": "2026-09-27T00:00:00.000Z", "summary": "StoryEngine 是一个基于状态的智能体框架，通过分离权威语义规划与不可靠视觉观测来生成连贯的长篇视频故事。它维护实体位置与故事相关状态的结构化表示，传播事件引发的状态变化以定义每个镜头的起止状态，并构建可复用实体的规范参考，将状态与视觉约束编译为可执行的渲染计划。实验显示 StoryEngine 在叙事质量、叙事连贯性和视觉一致性等所有评估维度上均持续优于现有最先进方法。", "type": "paper", "relTime": "1周前"}, {"id": 217, "title": "DataMagic：通过声明式多智能体编排创作数据视频", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.33403", "date": "2026-09-27T00:00:00.000Z", "summary": "DataMagic 通过声明式多智能体编排，从原始表格数据直接创作数据视频。其 DVSpec 规范统一图表、旁白与动画的数据绑定和同步关系，配合\"先生成后编排\"策略并行生成候选场景并优化叙事连贯性。在 109 个真实样本上，DataMagic 将质量从 GPT-5 的 2.13/5 提升至 3.89（+83%），成功率超过 95%，用户任务时间减少 79.7%。", "type": "paper", "relTime": "1周前"}, {"id": 218, "title": "Simon Willison 用 Claude Opus 5.5 生成鸮鹦鹉像素动画并用 Claude Code 录成视频", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/26/kakapo-party", "date": "2026-09-26T23:39:06.000Z", "summary": "Simon Willison 在 WeAreDevelopers World Congress North America 闭幕主题演讲前，用 Claude Opus 5.5 根据三张鸮鹦鹉照片生成至少 20 只鸮鹦鹉开派对的 HTML 5 canvas 像素动画页面。", "type": "tip", "relTime": "1周前"}, {"id": 219, "title": "Jeff Dean 转发 Claude 生成 Google 历史视频", "source": "X：Jeff Dean (@JeffDean)", "sourceUrl": "https://x.com/JeffDean/status/2103989340485624158", "date": "2026-09-26T23:25:23.000Z", "summary": "很自豪能与许多人合作完成其中的不少工作！  （引用 @deedydas）：claude 刚刚生成了一段关于 Google 历史的 2 分钟视频，效果简直太炸了", "type": "paper", "relTime": "1周前"}, {"id": 220, "title": "Claude Opus 5.5 一条提示词生成递归讲解视频", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2103888590854062435", "date": "2026-09-26T16:45:03.000Z", "summary": "Ethan Mollick 用一条提示词让 Claude Opus 5.5 生成了解释递归的视频，要求每次解释递归都切换截然不同的视频风格，做到自指、巧妙且节奏快，最终实现九次风格切换。他随后又测试了一个真正具有教育性的版本，认为效果相当惊艳：模型在保持多风格约束的同时，用有趣易懂的方式讲清了编程意义上的递归。", "type": "model", "relTime": "1周前"}, {"id": 221, "title": "brumar 开源 Claude Code 国际象棋复盘 Skill，结合 Stockfish 与思考录音生成解说视频", "source": "Hacker News：AI 热帖", "sourceUrl": "https://github.com/brumar/chess-postmortem-skills", "date": "2026-09-26T15:34:53.000Z", "summary": "作者 brumar 发布一套 Claude Code skills，将 lichess 对局结合 Stockfish 引擎生成可读的复盘报告和带旁白的解说视频。", "type": "tip", "relTime": "1周前"}, {"id": 222, "title": "Synthesia 为 TechCrunch 记者打造可对话的交互式数字分身", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://te

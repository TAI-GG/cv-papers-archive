nder 和 Muse Wonder Full，定位面向长期运行的 agent 任务，支持 1M token 上下文和文本、图像、视频、音频输入。", "type": "paper", "relTime": "1周前"}, {"id": 6, "title": "Google 分享 Three.js 交互毛发物理演示", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110114452955926759", "date": "2026-10-13T21:04:24.000Z", "summary": "💨 交互式物理  @TheBuggedDev 用 Three.js 和 GLSL 完全打造了一个带交互毛发物理的毛茸茸 3D 南瓜 https://x.com/thebuggeddev/status/2110043093466743194/video/1", "type": "paper", "relTime": "1周前"}, {"id": 7, "title": "Google 文本转 3D 生成蝴蝶博物馆", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110114449579552817", "date": "2026-10-13T21:04:23.000Z", "summary": "🦋 文本转 3D  @doe_naps 从零渲染了一座蝴蝶博物馆 https://x.com/doe_naps/status/2110041557021950348/video/1", "type": "paper", "relTime": "1周前"}, {"id": 8, "title": "Google 展示 Argon 3D 建模能力", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110114445628162512", "date": "2026-10-13T21:04:22.000Z", "summary": "🐝 复杂 3D 可视化  @thtbee_ 在 @Antigravity 中利用 Argon 的 3D 建模与空间推理能力，可视化了“蜜蜂的日常生活” https://x.com/thtbee_/status/2110044715618116000/video/1", "type": "paper", "relTime": "1周前"}, {"id": 9, "title": "Google 展示用 Antigravity 造解魔方机器人", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110114447595389193", "date": "2026-10-13T21:04:22.000Z", "summary": "🤖 物理机器人  @ai_for_success 在 @Antigravity 中端到端搭建了一个解魔方机器人：在 Blender 中为机械臂建模，在 Three.js 中运行实时 3D 仿真，并使用 Interactions API 来解魔方 https://x.com/ai_for_success/status/2110040948638126557/video/1", "type": "tip", "relTime": "1周前"}, {"id": 10, "title": "Google AI Studio 用代码生成视频", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110114440993808719", "date": "2026-10-13T21:04:21.000Z", "summary": "📹 代码生成视频  @kickingkeys 在 @GoogleAIStudio 中使用 Argon，完全通过代码创作出丰富、复杂的视觉效果 https://x.com/kickingkeys/status/2110037855452180633/video/1", "type": "paper", "relTime": "1周前"}, {"id": 11, "title": "MiniMax 的 FastH3-Omni 上线 Reactor API 预览", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2110104942107406441", "date": "2026-10-13T20:26:36.000Z", "summary": "MiniMax 宣布 FastH3-Omni 登陆 Reactor，可从单个提示词生成带同步音频的视频，10.20.2026 前在 Reactor API 开放预览。FastVideo 与 nuvalab 对 MiniMax 的实时 H3 做后训练得到该开源版本，支持首尾帧条件控制、音频输入与强对话能力、最多 3 张参考图像。", "type": "model", "relTime": "1周前"}, {"id": 12, "title": "NVIDIA VFX Nodes 登陆 ComfyUI，支持视频超分、补帧与 SDR 转 HDR", "source": "Comfy Blog", "sourceUrl": "https://blog.comfy.org/p/nvidia-vfx-nodes-for-video-upscaling", "date": "2026-10-13T19:41:39.000Z", "summary": "NVIDIA 的 RTX 视频特效现以自定义节点形式在 ComfyUI 中本地运行，官方推荐按超分、补帧、HDR 的顺序搭建完整 VFX 管线。", "type": "paper", "relTime": "1周前"}, {"id": 13, "title": "Google 用 Gemini 4 Argon 加速机器人研究", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2110083927620591769", "date": "2026-10-13T19:03:06.000Z", "summary": "我们一直在探索利用 Gemini 4 Argon 加速 @Google 研究的潜力。其中一项测试是：用人类完成趣味任务的视频（比如来一局沙包游戏？）来自主生成训练模拟，而不是完全依赖人工编程。  来听听我们研究团队的介绍，并观看实际效果——我们的类人机器人研究这些视频、运行模拟，最终掌握了沙包投掷游戏。", "type": "paper", "relTime": "1周前"}, {"id": 14, "title": "Gemini 4 Argon 教机器人玩沙包", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2110078384617464201", "date": "2026-10-13T18:41:04.000Z", "summary": "Gemini 4 Argon 仅通过观看视频就教会了一台机器人玩沙包。  它推演了物理规律，编写了自己的模拟程序，并教会 @Apptronik 的 Apollo 人形机器人连续投中 7 次。", "type": "product", "relTime": "1周前"}, {"id": 15, "title": "GitHub 详解基于 ModernBERT 的密钥检测模型如何以更低成本和噪音找到更多真实密钥", "source": "GitHub Blog", "sourceUrl": "https://github.blog/ai-and-ml/githubs-model-for-secret-detection-finding-more-secrets-with-less-noise/", "date": "2026-10-13T17:56:33.000Z", "summary": "GitHub 公开其新密钥扫描分类器的设计与训练细节：先用正则生成候选，再用微调 ModernBERT 结合文件路径、变量名和上下文判断是否为真实密钥。相比此前 LLM 管线，仓库所有者加权接受率提升 11.5%，post-push 扫描中位执行时间降低 86%，服务成本下降超过 98%；模型导出为 ONNX 并做 8-bit 量化，且已将通用密钥检测扩展到 push protection。", "type": "tip", "relTime": "1周前"}, {"id": 16, "title": "Laplace Intelligence 为机器人和自动驾驶汽车做自动化红队测试", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/13/laplace-intelligence-red-teams-robots-and-self-driving-cars-before-they-hit-the-real-world/", "date": "2026-10-13T17:30:00.000Z", "summary": "密歇根大学孵化的 Laplace Intelligence 正在为机器人和物理 AI 构建自动化红队测试，用 AI 智能体在仿真中主动寻找失败点。其仿真环境基于 Nvidia Cosmos 后训练版本，可重建亚利桑那高速公路、巴黎人行横道等真实场景，并让其他交通参与者实时反应。客户包括五十铃、Bot Auto 和 Nvidia，并与 T-Mobile 合作在圣何塞开展智慧城市试点。", "type": "industry", "relTime": "1周前"}, {"id": 17, "title": "Gemini 4 Argon 将 NASA 火星数据转成幻灯片", "source": "X：Sundar Pichai (@sundarpichai)", "sourceUrl": "https://x.com/sundarpichai/status/2110059844187406428", "date": "2026-10-13T17:27:24.000Z", "summary": "任何处理过海量数据转储的人都知道这有多头疼。  我们给了 Gemini 4 Argon 超过 80,000 份 NASA 火星天气原始日志和 Ingenuity 直升机遥测文件，它将大气飞行力学提炼成一份演示文稿，把庞大而杂乱的科学档案（包括 CSV、图像、pdf、xml 日志、视频的混合内容）在几分钟内变成清晰的 Google Slides 可视化内容。", "type": "paper", "relTime": "1周前"}, {"id": 18, "title": "Google Antigravity 多智能体生成复杂建筑", "source": "X：Sundar Pichai (@sundarpichai)", "sourceUrl": "https://x.com/sundarpichai/status/2110059845806399489", "date": "2026-10-13T17:27:24.000Z", "summary": "生成复杂的多层架构是对前沿模型的一次绝佳测试。  在 Google Antigravity 中使用多智能体视觉批判循环，Argon 在 Blender 中从零开始自主创建了这座高度精细的宝塔及其周边环境。", "type": "model", "relTime": "1周前"}, {"id": 19, "title": "Argon 纯代码生成 3D 动态字体", "source": "X：Sundar Pichai (@sundarpichai)", "sourceUrl": "https://x.com/sundarpichai/status/2110059842664825132", "date": "2026-10-13T17:27:24.000Z", "summary": "Argon 完全用代码生成了这段 3D 动态字体（包括音乐），没有使用预先录制的素材或视频剪辑软件。  每一帧都由 Argon 通过数学算法绘制（3D 网格、粒子模拟、矢量几何等）", "type": "paper", "relTime": "1周前"}, {"id": 20, "title": "Google 将在 Play Store 托管用户个人 vibe-coded 应用", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/google/2026/10/google-wants-to-host-your-personal-vibe-coded-apps-in-the-play-store/", "date": "2026-10-13T17:00:39.000Z", "summary": "Google 计划让 Play Store 支持用户私下托管并分享自己用 AI 构建的应用。Ask Play 从今日起从应用详情页聊天机器人扩展为通用的应用与游戏搜索入口，可生成含详细对比图表的推荐，Gemini 也将推出类似能力。新推出的 Game Finder 基于 12 亿 Android 玩家的使用数据构建 Gamer DNA 画像，用于匹配玩法相近的玩家。", "type": "paper", "relTime": "1周前"}, {"id": 21, "title": "Demis Hassabis 谈 Gemini 4 Argon：命名致敬氩激光器", "source": "X：Demis Hassabis (@demishassabis)", "sourceUrl": "https://x.com/demishassabis/status/2110052931110318464", "date": "2026-10-13T16:59:56.000Z", "summary": "Google 发布 Gemini 4 Argon，今日起向 GeminiApp 与 Search 的 Ultra 和 Pro 订阅用户开放，Ultra 用户也可在 Antigravity 中使用。引用内容称其在知识工作和编码方面表现好，并展示了用其生成的 wizard chess 游戏以体现物理理解和 3D 建模能力。Demis Hassabis 转发并调侃模型名与氩激光器的联系，引用了电影...", "type": "model", "relTime": "1周前"}, {"id": 22, "title": "Instagram 认证账号传播 Mia Goth AI 伪造图，其经纪人批 Meta 保护失职", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/1010277/mia-goth-instagram-ai-shirt-deepfake-divorce", "date": "2026-10-13T16:42:51.000Z", "summary": "演员 Mia Goth 的经纪人表示，Instagram 带蓝 V 的粉丝账号 miagoth_ 传播其 AI 生成的身穿“MY EX IS MY BIGGEST FAN”T恤的图片，在艺人提出投诉后仍获认证，该图被数十万人点赞，OK! 和 People 等媒体曾当真报道。Meta 的规则要求部分 AI 视频加标签，但静图不在此列；截至周二上午该账号已被清空。", "type": "industry", "relTime": "1周前"}, {"id": 23, "title": "Gemini 4 Argon 让机器人通过看视频学会真人运动", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110041301253075358", "date": "2026-10-13T16:13:43.000Z", "summary": "Google 展示 Gemini 4 Argon 在机器人领域的真实世界物理学习能力：让 Argon 观看人类玩 cornhole 的视频，其映射环境、计算全身关节动作并自主构建仿真代码进行练习。迁移到 Apptronik 的 Apollo 人形机器人后，在真实世界试验中连续投中七次。", "type": "product", "relTime": "1周前"}, {"id": 24, "title": "Demis Hassabis 宣布 Gemini 4 Argon 上线并演示其制作的魔法棋游戏", "source": "X：Demis Hassabis (@demishassabis)", "sourceUrl": "https://x.com/demishassabis/status/2110041008100843835", "date": "2026-10-13T16:12:33.000Z", "summary": "Demis Hassabis 发布 Gemini 4 Argon，称其在知识工作和编码方面表现出色，并展示用其生成的 wizard chess 游戏以体现物理理解和3D建模能力。", "type": "paper", "relTime": "1周前"}, {"id": 25, "title": "Gemini 4 Argon 支持从任务拆解直接生成应用、3D 文件和报告", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2110039660139540710", "date": "2026-10-13T16:07:12.000Z", "summary": "Google Gemini 介绍 Gemini 4 Argon 可逐步拆解任务并直接产出实际成品，而不止于文本大纲。具体包括生成可分享的 web 应用、提供可直接打印的 3D 文件，以及产出可直接使用的幻灯片和报告。", "type": "paper", "relTime": "1周前"}, {"id": 26, "title": "Tripo 用高斯泼溅在 Vision Pro 重现梵高", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2110022749683110353", "date": "2026-10-13T15:00:00.000Z", "summary": "在空间计算中让梵高的《夜晚的露天咖啡座》活起来。  我们结合了 Gaussian Splatting、AI 生成的 3D 资产和 Apple Vision Pro，打造了这个交互式环境。  下方是技术栈拆解。", "type": "tip", "relTime": "1周前"}, {"id": 27, "title": "面壁智能发布 MiniCPM-V 4.7：35B-A3B MoE 多模态模型 3GB 内存即可在手机上运行", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2109996566702633310", "date": "2026-10-13T13:15:57.000Z", "summary": "OpenBMB（面壁智能）发布 MiniCPM-V 4.7，35B-A3B MoE 多模态模型在手机上仅需 3GB 内存运行，可识读现实场景标识、按约束规划、解析复杂文档并对视觉数据进行推理。", "type": "model", "relTime": "1周前"}, {"id": 28, "title": "AI 小白入门指南：用 Miora 织影 Agent 一站式制作故事短片《乾红猫》", "source": "X：Oran Ge (@oran_ge)", "sourceUrl": "https://x.com/oran_ge/status/2109985454753993098", "date": "2026-10-13T12:31:48.000Z", "summary": "博主以视频创作小白身份，用 Miora 织影 Agent 把南宋《夷坚志》轶闻《乾红猫》做成 1 分 18 秒的古装轻喜剧短片。Agent 把故事拆成框架、大纲、剧本、角色卡和分镜，全程生成 50 段视频、花费约 4000 积分（折合约 40 美元），视频部分使用 Seedance Fast。", "type": "tip", "relTime": "1周前"}, {"id": 29, "title": "Character.AI 成立五年后申请 Chapter 11 破产，部分资产以 2000 万美元出售给 Disney", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/13/just-5-years-in-interactive-chatbot-platform-character-ai-files-for-bankruptcy/", "date": "2026-10-13T12:23:42.000Z", "summary": "Character.AI 已申请 Chapter 11 破产，法院文件显示其资产和负债在 5000 万至 1 亿美元之间，并同意以 2000 万美元向 Disney 出售部分资产及技术非独占永久许可。出售过程预计 11 月底或 12 月初完成，期间平台继续运营，但尚无竞购方，若无买家平台将关停；此前公司因未成年用户诉讼、德州调查等困境，曾尝试 AI 视频生成、社交信息流和微短剧等转型未果。", "type": "industry", "relTime": "1周前"}, {"id": 30, "title": "Higgsfield 借 GPT-6 Astra 将 AI 视频时长从 1 分钟提升至 10 分钟以上", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "sourceUrl": "https://openai.com/index/higgsfield-longer-videos-voice", "date": "2026-10-13T12:00:00.000Z", "summary": "Higgsfield AI 借助 GPT-6 Astra 将 AI 视频生成时长从约 1 分钟提升到 10 分钟以上，并用 GPT-Image-2.5 生成可读文字与信息图。其约 200 名创意人员和 100 名工程师的团队还用 Codex 将创意转为软件原型，并计划以 GPT-Live 实现“语音到电影”。", "type": "industry", "relTime": "1周前"}, {"id": 31, "title": "哈啰 Robotaxi 发布生成式驾驶世界模型 HelloWorld，支持自然语言构建驾驶场景", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/012/493.htm", "date": "2026-10-13T09:50:43.847Z", "summary": "哈啰 Robotaxi 发布生成式驾驶世界模型 HelloWorld，整合场景控制、连续生成、多传感器观测与高效推理能力，用于按需构建驾驶数据与交互式策略测试。该模型支持通过自然语言描述需求，或直接编辑车辆、行人及运动轨迹，生成对应的多视角视频与激光雷达观测，可构造横穿行人、雨雪昼夜等长尾场景。", "type": "model", "relTime": "1周前"}, {"id": 32, "title": "面壁智能 MiniCPM V4.7 发布：35B-A3B 端侧 MoE 与 1B 轻量 VLM", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2109934851864641737", "date": "2026-10-13T09:10:44.000Z", "summary": "面壁智能 OpenBMB 转发社区分享，介绍 MiniCPM V4.7：35B-A3B 端侧 MoE 版在 iPhone 17 Pro Max 上以约 3GB 内存达到 13+ tok/s，综合得分和推理时间优于 Qwen3.6 35B-A3B。1B 轻量 VLM 在性能和效率上均优于 Qwen3.5 0.8B；两版本支持图像、多图与视频理解，4×/16× 视觉 token 压缩，覆盖 iO...", "type": "paper", "relTime": "1周前"}, {"id": 33, "title": "Molmo 2 开源如何帮助 MIT 研究者重新思考鱼类追踪", "source": "Ai2 / Allen Institute for AI（RSS）", "sourceUrl": "https://allenai.org/blog/molmo2fish", "date": "2026-10-13T08:00:00.000Z", "summary": "Ai2 开源视觉语言模型 Molmo 2 后，MIT 毕业生 Kai Van Brunt 基于它微调出 Molmo2Fish，用于在声纳视频中追踪鲑鱼并根据自然语言指令修正预测。微调后的 Molmo2Fish 在未接受修正时表现与专用鱼类追踪系统大致相当，且能纠正传统系统的部分错误，但难以改进自身最强预测。该项目仍属研究阶段，尚未部署。", "type": "industry", "relTime": "1周前"}, {"id": 34, "title": "Nature Will 发布 50B 参数 MoE 基础模型 Natura-1，让机器人灵巧手零样本执行语言指令", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2109904215892218246", "date": "2026-10-13T07:08:59.000Z", "summary": "Nature Will 发布首个面向物理世界的通用基础模型 Natura-1，为 500 亿参数 MoE 模型，基于 100 万小时第一视角人类经验数据预训练，可零样本理解自然语言指令并用灵巧手执行。作者补充指出，相比难以收集的机器人演示数据，人类第一视角视频是更快的数据扩展路径；该模型能同时处理抓取后的双手精细控制、无需额外训练的新任务，以及需要记忆前序步骤并从错误中恢复的长序列执行。", "type": "model", "relTime": "1周前"}, {"id": 35, "title": "MiniCPM-V 4.7 登陆 Apple Silicon，实现 Mac 端侧推理", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2109898597236129868", "date": "2026-10-13T06:46:40.000Z", "summary": "面壁智能 MiniCPM-V 4.7（1B 与 35B-A3B）通过与 Nativ 合作，在 Mac 上实现 Day 0 全端侧推理支持，可处理图像与视频理解，数据完全留在本地。", "type": "product", "relTime": "1周前"}, {"id": 36, "title": "Arena 测试 Meta Muse Wonder 3D 场景生成", "source": "X：Arena (@arena)", "sourceUrl": "https://x.com/arena/status/2109836301562532313", "date": "2026-10-13T02:39:07.000Z", "summary": "观看 @petergostev 对 @AIatMeta 的 Muse Wonder（Max）进行测试，涵盖一次性 3D 场景、动画 HTML 和前端设计。  他将其与 Astra、Opus 5.5、GPT-6.1 Sol、Claude Sonnet 5.5、Fable、Kimi 和 Mistral 进行对比，并附上了每次生成的费用。  Muse Wonder 的 Arena 评分即将公布。敬...", "type": "paper", "relTime": "1周前"}, {"id": 37, "title": "消息称 OpenAI 计划将 Sora 交给初创公司以专业影视工具形式重返市场", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/012/168.htm", "date": "2026-10-13T01:38:41.980Z", "summary": "据 The Information 10 月 12 日报道，OpenAI 正与一家隐身初创公司谈判，计划将已停运的视频生成模型 Sora 移交给对方，以专业影视工具形式重新进入市场。", "type": "industry", "relTime": "1周前"}, {"id": 38, "title": "Muse Wonder 与 Muse Code 接入 fal 生成图像视频", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2109746953210761654", "date": "2026-10-12T20:44:05.000Z", "summary": "Muse Wonder 和 Muse Code 接入 fal 后，生成图像和视频的体验更加出色。来我们最新的 YouTube 视频了解具体方法！  https://youtu.be/cKzu7phvcs0?si=uFtOGBqRfknrd8e9", "type": "tip", "relTime": "1周前"}, {"id": 39, "title": "Microsoft Research 多项 AI 研究进展", "source": "X：Microsoft Research (@MSFTResearch)", "sourceUrl": "https://x.com/MSFTResearch/status/2109727313772392867", "date": "2026-10-12T19:26:03.000Z", "summary": "AI 在承认需要澄清时表现更好；提升机器人在视觉-语言任务上的表现；如何从 AI 的失败中学习；改进 AI 辅导；理解我们的嗅觉；更高效的 KV-cache 内存存储 https://msft.it/6019aSVIP", "type": "paper", "relTime": "1周前"}, {"id": 40, "title": "Tripo 用 GPT 打造 F1 新加坡赛道游戏", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2109690568527728776", "date": "2026-10-12T17:00:02.000Z", "summary": "F1 新加坡大奖赛太精彩了，我们不想让比赛停下来。所以我们自己造了一个。  受真实赛道启发，我们把一个简单原型变 业模拟学习。", "type": "model", "relTime": "1周前"}, {"id": 47, "title": "Tripo 社区项目 Charakuru：单图生成 3D 角色", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2109631602045419533", "date": "2026-10-12T13:05:43.000Z", "summary": "Tripo 在 Community Builds 中重点介绍社区伙伴 Nano（@Dstudio_ai）基于 Tripo P2.0 打造的开源角色建模套件 Charakuru，可将单张全身 2D 插画转为可用于 Vtubing 或游戏开发的 VRM 模型。", "type": "industry", "relTime": "1周前"}, {"id": 48, "title": "创作者用可灵 4.0 打造爆款 AI 音乐视频", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2109615624985219203", "date": "2026-10-12T12:02:14.000Z", "summary": "如何做出一支让人热议的 AI 生成音乐视频？👀🎬  PROMPTR Studios 创意总监兼联合创始人 Simon Meyer 提前获得了 Kling 4.0 的使用权限，用来测试它的新能力。他创作的这支音乐视频走红，观众纷纷想知道他是怎么做到的。  在本期 Creator Off Script 中，Simon 拆解了自己的创作流程，分享了他如何让 AI 画面显得真实，并揭晓了 Kling...", "type": "tip", "relTime": "1周前"}, {"id": 49, "title": "Tripo 联手 img2threejs 办 Three.js 工作坊", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2109535109212950531", "date": "2026-10-12T06:42:17.000Z", "summary": "很高兴与 @thebuggeddev 和 @NickDevFE 合作，向大家展示 Tripo 如何无缝集成到你的 Three.js 工作流中。从快速生成 3D 资产到可编辑代码，我们全都覆盖。  今天开播！点击加入活动：https://discord.gg/m7fHkeA7Vu?event=1558837514708590703", "type": "tip", "relTime": "1周前"}, {"id": 50, "title": "蚂蚁 inclusionAI 发布 BiDex-100 双臂灵巧操作基准", "source": "蚂蚁 inclusionAI：GitHub 新仓库", "sourceUrl": "https://github.com/inclusionAI/BiDex-100", "date": "2026-10-12T05:59:07.000Z", "summary": "蚂蚁 inclusionAI 在 GitHub 发布 BiDex-100，一个覆盖 106 个仿真任务的双臂灵巧操作基准，用于评测视觉-语言-动作（VLA）策略。该基准包含 8,080 条成功验证演示、6.25M 帧、58 维统一动作空间，并提供匹配的 ID/OOD 评测协议与 LeRobot v2.1/v3.0 数据集。", "type": "paper", "relTime": "1周前"}, {"id": 51, "title": "大AI理论：分三阶段调推理档位榨干模型能力", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247512289&idx=1&sn=0c7b6141051a21dd2c1eabe374fd0686", "date": "2026-10-12T03:46:00.000Z", "summary": "作者提出“大AI理论”，用三阶段对话把模型能力拉到极致。第一步拉满推理并选计划模式，用语音、图片、视频不过滤倒出想法整理成计划；第二步切中档推理快速干活，前提是需求描述足够详细，作者引Terminal Bench 3.0说明详细需求加中档推理质量高于模糊需求加高档推理；第三步把推理调回高档让AI审查中档成果，称能揪出约20%的问题，审查耗时约为从头生成的三分之一。", "type": "tip", "relTime": "1周前"}, {"id": 52, "title": "FT：AI 生成论文涌入学术期刊，220 亿美元出版业转向并购应对", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2109487106313847119", "date": "2026-10-12T03:31:33.000Z", "summary": "FT 报道，机器写作的论文大量涌入学术期刊，筛选成本正推动规模 220 亿美元的出版业走向并购。Elsevier 自 2022 年起将审稿人队伍扩充超过三分之一至 190 万人；Springer Nature 因质控成本上升和聊天机器人贬值付费研究的担忧，IPO 两年后仍低于 22.50 欧元的发行价。", "type": "industry", "relTime": "1周前"}, {"id": 53, "title": "Raise Financial Services 与 Cartesia 合作，为印度金融市场打造多语言语音 AI", "source": "Cartesia 产品与研究", "sourceUrl": "https://www.cartesia.ai/blog/raise-financial-services", "date": "2026-10-12T00:00:00.000Z", "summary": "Raise Financial Services 正与 Cartesia 合作，将语音模型接入其自研实时语音基础设施，为印度金融市场提供多语言语音体验。Cartesia 的 Sonic 文本转语音模型支持 11 种印度语言及单次生成内的语码切换，目前已在 Dhan 的语音机器人中处理会话式 KYC 等交互，其中超 75% 的交互使用非英语语言，印地语占一半以上。", "type": "industry", "relTime": "1周前"}, {"id": 54, "title": "什么是浏览器指纹识别？原理与局限解析", "source": "Browser Use", "sourceUrl": "https://browser-use.com/posts/what-is-browser-fingerprinting", "date": "2026-10-12T00:00:00.000Z", "summary": "浏览器指纹识别通过收集 user agent、语言、屏幕尺寸、字体、canvas 与 WebGL 渲染、音频处理等信号，组合后经哈希函数生成紧凑标识，用于在 cookie 被删除后仍能识别回访浏览器。它分为被动式（HTTP 头、IP、TLS 握手）与主动式（JavaScript 采集）两类，常用于追踪用户、防欺诈和检测机器人，但相似浏览器可能撞车、浏览器更新也会改变结果。", "type": "tip", "relTime": "1周前"}, {"id": 55, "title": "Cloudflare 发布 Clef-omni：30B-A3B 多模态决策模型，单次调用评分文本、图像、音频和视频", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/10/11/cloudflare-clef-omni-multimodal-decision-model/", "date": "2026-10-11T23:15:52.000Z", "summary": "Cloudflare 于 2026 年 10 月 9 日发布开放权重决策模型 Clef-omni，可在一次调用中对文本、图像、音频和视频打分。", "type": "model", "relTime": "1周前"}, {"id": 56, "title": "vLLM Semantic Router 发布开源多模态决策模型 Decision 3.0，共 5 个尺寸", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/10/11/what-is-decision-3-0-vllm-semantic-routers-new-open-decision-models/", "date": "2026-10-11T21:43:41.000Z", "summary": "vLLM Semantic Router 团队发布 Decision 3.0 系列开源决策模型，读取文本、JSON 和图片，返回概率而非生成文本，全部采用 Apache-2.0 许可。", "type": "model", "relTime": "1周前"}, {"id": 57, "title": "任鑫用 Opus 5.5 为播客生成白板解说视频", "source": "X：Oran Ge (@oran_ge)", "sourceUrl": "https://x.com/oran_ge/status/2109205903937515600", "date": "2026-10-11T08:54:09.000Z", "summary": "任鑫用 Opus 5.5 给一个多小时的播客配上了白板解说视频，总消耗仅占 2% 额度。推文称 Opus 5.5 非常高效，而对比之下 Astra 降智严重，连剪辑都做不好。", "type": "paper", "relTime": "1周前"}, {"id": 58, "title": "星海图 LEMO 双臂开发平台开放订购", "source": "X：星海图 Galaxea (@GalaxeaDynamics)", "sourceUrl": "https://x.com/GalaxeaDynamics/status/2109202377706229842", "date": "2026-10-11T08:40:08.000Z", "summary": "Galaxea LEMO 双臂开发平台现已开放订购！ LEMO 是一体化平台，集高性能双臂硬件、同构遥操作、多模态数据采集和开放开发工具链于一体。 LEMO 支持从数据采集、模型训练到机器人端部署与验证的完整开发流程，助力具身智能研究与应用开发。 LEMO — 更快构建。更多创造。 #EmbodiedAI #Galaxea #ROSConChina", "type": "model", "relTime": "1周前"}, {"id": 59, "title": "AI 无法把坏点子变成好点子", "source": "X：Yuchen Jin (@Yuchenj_UW)", "sourceUrl": "https://x.com/Yuchenj_UW/status/2108971712004202642", "date": "2026-10-10T17:23:33.000Z", "summary": "AI 生成的视频走红。是 AI 的功劳吗？不。是懂得讲好故事的创作者。  AI 打造的产品起飞。是 AI 的功劳吗？不。是知道该做什么的创始人和构建者。  AI 是一项了不起的技术，但再多的技术也无法把一个坏点子变成好点子。", "type": "product", "relTime": "1周前"}, {"id": 60, "title": "ElevenLabs 支持提示词中标记品牌", "source": "X：ElevenLabs (@elevenlabs)", "sourceUrl": "https://x.com/ElevenLabs/status/2108950693562179913", "date": "2026-10-10T16:00:02.000Z", "summary": "在任意提示词中标记你的品牌。  在 Image & Video、Flows 或 agent 中输入 @ 即可标记你的 kit。你的素材和规则将塑造生成结果。  你也可以让 agent 帮你编辑 kit。", "type": "paper", "relTime": "1周前"}, {"id": 61, "title": "尼康撤销清华大学徐宁博士 2026 Small World in Motion 显微视频竞赛冠军资格", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/011/504.htm", "date": "2026-10-10T12:33:49.090Z", "summary": "尼康宣布取消清华大学徐宁博士在 2026 年 Small World in Motion 显微视频竞赛的一等奖资格，因其作品不符合赛事关于生成式 AI 的规定。", "type": "industry", "relTime": "1周前"}, {"id": 62, "title": "可灵 4.0 三项创意实测：超现实场景如何拍出真实感", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2108891478936207817", "date": "2026-10-10T12:04:44.000Z", "summary": "韩国视觉创作者 서오키（oasis.seo.ai）用三项创意实验测试可灵 4.0，分别考察 Omni Reference、风格转换与角色一致性。她最关注的是静态图像转为视频后，人物表情、服装与 1990 年代电影质感能否保持一致，以及巨型鸭子等超现实元素能否自然融入同一空间，而非像后期合成的 CG。", "type": "tip", "relTime": "1周前"}, {"id": 63, "title": "OpenAI 豪赌未解数学难题", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2108842704973279596", "date": "2026-10-10T08:50:55.000Z", "summary": "Tristan Buckmaster，纽约大学数学教授：  OpenAI 在这些未解数学问题上投入了数百万美元的计算资源。  “这有点像生死攸关的局面，因为如果 Anthropic（先）解决了一个千禧年大奖难题，那就说明他们拥有更好的内部模型”  ----  完整视频见“CNBC Television”YouTube 频道，（链接在评论中）", "type": "model", "relTime": "1周前"}, {"id": 64, "title": "东京都立大学论文：LLM 版本更迭令 AI 文本检测器大幅失效", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2108830211861049395", "date": "2026-10-10T08:01:17.000Z", "summary": "东京都立大学等机构的论文发现，基于厂商旧模型训练的 AI 文本检测器在模型代际更迭前可捕获 99% 以上的改写，更迭后仅捕获 3.8%。论文用 4,000 篇前 ChatGPT 时代摘要由 25 个 LLM 版本改写进行测试；引用案例中 Pangram 漏掉 79.8% 被 Meta Muse-Glimmer 改写的科学摘要，但对 5,000 篇人写摘要仅误报 1 篇，作者建议每次模型发布都...", "type": "paper", "relTime": "1周前"}, {"id": 65, "title": "Cloudflare 推出开放权重决策模型 Clef-omni，新增音频和视频输入", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/011/347.htm", "date": "2026-10-10T06:26:25.377Z", "summary": "Cloudflare 于 10 月 9 日发布开放权重决策模型 Clef-omni，在 Clef 系列基础上新增音频和完整视频输入，支持 wav、mp3、mp4 和 webm 格式，可单次 API 调用处理文本、图像、音频和视频，模型权重已在 Hugging Face 开放。", "type": "model", "relTime": "1周前"}, {"id": 66, "title": "分析师丹·艾夫斯力挺特斯拉：最直接布局物理 AI 的投资标的，维持 500 美元目标价", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/011/345.htm", "date": "2026-10-10T06:19:52.647Z", "summary": "Yorkville Ives 分析师丹·艾夫斯维持特斯拉“跑赢大盘”评级和 500 美元目标股价，认为特斯拉正从汽车制造商转型为涵盖汽车、自动驾驶、人形机器人和储能业务的“物理 AI”平台。", "type": "paper", "relTime": "1周前"}, {"id": 67, "title": "蚂蚁 inclusionAI 发布 PolyOCR-Venus：2B/9B 统一 OCR 基础模型", "source": "蚂蚁 inclusionAI：GitHub 新仓库", "sourceUrl": "https://github.com/inclusionAI/PolyOCR-Venus", "date": "2026-10-10T06:12:41.000Z", "summary": "蚂蚁 inclusionAI 开源 PolyOCR-Venus 系列 OCR 基础模型，含 2B 和 9B 两个版本，基于 Qwen3.5 视觉语言骨干，统一支持文本识别、定位、文档解析、信息抽取与 OCR 推理。", "type": "paper", "relTime": "1周前"}, {"id": 68, "title": "Pangram 漏检 AI 改写摘要研究", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2108796158030274663", "date": "2026-10-10T05:45:58.000Z", "summary": "AI 文本检测器 Pangram 漏掉了 Meta 的 Muse-Glimmer 改写的 79.8% 科学摘要，而仅将 5,000 篇人类摘要中的 1 篇标记为 AI 生成。  在东京都立大学的一篇新论文中，研究人员发现，Pangram 漏检的 AI 改写摘要比例在很大程度上取决于 LLM 版本。  研究表明，它捕获了 93.5% 的 GPT-5 改写内容，但漏掉了另一个新模型改写的 79....", "type": "paper", "relTime": "1周前"}, {"id": 69, "title": "蚂蚁百灵回应 DesignArena 对 Ling-3.1-flash 的评测并宣布限时免费", "source": "X：蚂蚁百灵 (@AntLingAGI)", "sourceUrl": "https://x.com/AntLingAGI/status/2108765698407440721", "date": "2026-10-10T03:44:56.000Z", "summary": "蚂蚁百灵转发 DesignArena 对其新模型 Ling-3.1-flash 的评测视频并致谢，该评测盲测认为模型在详细 SVG、动画 SVG 和完整移动应用生成方面表现突出。作者宣布模型现可在 OR/Vercel 及 day0 合作伙伴渠道限时免费使用。", "type": "model", "relTime": "1周前"}, {"id": 70, "title": "PixVerse 与 OpenAI 合作推出 Prompt to Production", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2108765536570286320", "date": "2026-10-10T03:44:17.000Z", "summary": "PixVerse 与 OpenAI 联合推出 \"Prompt to Production\" 教育计划，通过两场线上研讨会和持续视频系列，展示如何将 OpenAI 前沿模型与 PixVerse 多模态生成工具结合用于创作流程。", "type": "industry", "relTime": "1周前"}, {"id": 71, "title": "Kling 4.0 实战测评：韩国创作者测试人物表演、多图转场与风格转换", "source": "公众号：可灵AI（快手·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzU5NTkwNDU2OA%3D%3D&mid=2247497164&idx=1&sn=c0c05d3e0aab71762315517b29b31dbb", "date": "2026-10-10T03:00:00.000Z", "summary": "韩国视觉创作者서오키（@oasis.seo.ai）对 Kling 4.0 进行了三组实测，覆盖人物表演与角色稳定性、三张图片连续转场、实拍与卡通反复切换。她认为 Kling 4.0 能自然衔接视线、表情和手势，多图连接时原图风格与氛围基本保留，实拍与卡通切换过程无明显割裂，降低了反复生成和后期修补的成本。", "type": "tip", "relTime": "1周前"}, {"id": 72, "title": "SkyProduction 天工工作台接入 Vidu Q4 Preview 与 SkyNano 2.1", "source": "公众号：昆仑万维（天工）", elTime": "1周前"}, {"id": 77, "title": "清华Ning Xu因AI使用被取消Nikon Small World in Motion资格，越南Nguyen Nam Nhat递补夺冠", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/science/2026/10/winning-nikon-small-world-in-motion-video-disqualified-for-ai-use/", "date": "2026-10-09T18:44:06.000Z", "summary": "Nikon调查认定原Small World in Motion视频竞赛冠军、清华大学Ning Xu的作品不符合规则并取消其资格，越南Nguyen Nam Nhat以线虫与单细胞生物视频递补冠军，其余名次依次上移。研究者指出该视频存在结构异常和不符合真实细胞生物学的特征变化，源文件中疑似嵌入AI水印；Xu称仅用AI区分和可视化重建灰度图像中的特征，否认用AI生成实验影片、纤毛及其运动。", "type": "industry", "relTime": "1周前"}, {"id": 78, "title": "Nikon 显微视频大赛冠军作品因使用生成式 AI 被取消资格", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/1008930/nikon-small-world-in-motion-winner-ai", "date": "2026-10-09T18:06:57.000Z", "summary": "Nikon 称 Dr. Ning Xu 原获 Small World in Motion 大赛第一名的视频（声称展示 PCD 患儿气道纤毛运动）不符合关于生成式 AI 的比赛规则。", "type": "industry", "relTime": "1周前"}, {"id": 79, "title": "亚利桑那上诉法院因法官采信死者 AI 视频撤销凶手量刑", "source": "Hacker News：AI 热帖", "sourceUrl": "https://www.nbcnews.com/news/us-news/sentence-vacated-ai-video-dead-victim-rcna601457", "date": "2026-10-09T14:14:08.000Z", "summary": "亚利桑那上诉法院撤销一起路怒枪击案的 10 年半量刑，理由是法官在量刑时采信了受害者 AI 生成视频构成根本性错误。", "type": "industry", "relTime": "1周前"}, {"id": 80, "title": "Google 本周发布：SynthID 全球上线与 Gemma 4 等", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2108550067724407281", "date": "2026-10-09T13:28:05.000Z", "summary": "Google 本周宣布 SynthID 检测门户面向全球开放英文版，可验证图像、视频、音频是否由 Google 及行业伙伴的 AI 生成。同时发布 Nano Banana 2.1，在视觉设计、主体一致性和精准局部编辑上大幅提升；EmbeddingGemma 2 成为其首个原生多模态开源模型，统一文本、图像、视频、音频与代码的端侧嵌入。", "type": "model", "relTime": "1周前"}, {"id": 81, "title": "通义千问发布 Qwen-Image-2.1-Turbo，8 步去噪即可生成和编辑图像并开放权重", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2108549075218120949", "date": "2026-10-09T13:24:09.000Z", "summary": "通义千问发布 Qwen-Image-2.1-Turbo，基于同一 7B 视觉生成架构的加速 checkpoint，只需 8 个去噪步骤即可生成和编辑图像，权重已开放。", "typ ，一次性补齐国庆假期期间的 AI 话题。本期聚焦 Personal Agent，从 Dots 接入 Codex 的体验、记忆与云电脑权限聊起，讨论 Agent 是助理还是数字分身，并涉及 Instinct 订房商旅模式及邮箱、微信、RSS 的信息开放差异。", "type": "model", "relTime": "1周前"}, {"id": 112, "title": "美国男子 Michael Smith 因用 AI 骗取音乐版权收入被判 18 个月监禁并罚没 800 万美元", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/010/378.htm", "date": "2026-10-08T01:06:38.270Z", "summary": "美国司法部宣布，北卡罗来纳州男子 Michael Smith 因利用 AI 骗取音乐版权收入，被判 18 个月监禁并罚没 800 万美元违法收入。他在 2017~2024 年用 AI 生成数十万首歌曲，通过虚假账户在流媒体平台上线，再用机器人账户矩阵进行欺诈性播放获利。流媒体欺诈会挤占原本应支付给真实词曲作者和演唱者的版权资金池收入。", "type": "industry", "relTime": "1周前"}, {"id": 113, "title": "前字节实习生田柯宇进军世界模型创业，估值达 2 亿美元", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/010/356.htm", "date": "2026-10-07T23:36:04.837Z", "summary": "据彭博社报道，前字节跳动实习生田柯宇创办世界模型创业公司，从五源资本、IDG 资本等融资近 3,000 万美元，投后估值 2 亿美元，公司尚无名字和产品。其团队打造了一套包含 20 万个符号的 AI 视觉语言系统，计划输入 1 亿小时视频，称可将生成 1 秒视频的成本至少降至原来的十分之一，拟在 2027 年发布完整模型前现场展示技术。", "type": "industry", "relTime": "1周前"}, {"id": 114, "title": "Ben Affleck 谈机器学习与视觉特效工作流中的 Python", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Oct/7/ben-affleck/", "date": "2026-10-07T23:14:58.000Z", "summary": "Ben Affleck 表示自己从胶片转向数字电影时期开始对计算机产生兴趣，并会写“相当糟糕的 Python 脚本”。他提到视觉特效工作流多年来已包含机器学习，卷积神经网络作为 Transformer 的前身，可用于处理 tensor 并实现边缘检测与特征提取，从而更轻松地抠出绿幕画面并替换背景。", "type": "paper", "relTime": "1周前"}, {"id": 115, "title": "Envato 推出 Burst Mode：1 积分生成最多 6 个视觉方向", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2107942182405521535", "date": "2026-10-07T21:12:34.000Z", "summary": "Envato 上线 Burst Mode，可将一个想法或参考图一次生成最多 6 个视觉方向，仅消耗 1 个 AI 积分，速度最高提升 10 倍。用户可从粗略想法、半成型构思或参考图起步，并通过参考图、moodboard 以及从聚焦到狂野的创意控制调节每批结果。之后可用“More like this”延展有潜力的方向，再进一步打磨。", "type": "paper", "relTime": "1周前"}, {"id": 116, "title": "Perplexity Decider v1.1 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2107938516080722327", "date": "2026-10-07T20:58:00.000Z", "summary": "Perplexity Decider v1.1 现已上线 OpenRouter  @perplexity_ai 的开源权重多模态决策模型，接受文本、JSON 或图像输入，返回带概率的类型化答案  $0.02/M 输入。输出免费  https://openrouter.ai/perplexity/pplx-decider-v1.1-27b", "type": "model", "relTime": "1周前"}, {"id": 117, "title": "Envato Burst 模式降低图像生成成本", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2107937276475174976", "date": "2026-10-07T20:53:04.000Z", "summary": "图像模型已经非常擅长匹配提示词。但前提是你能写出提示词。  Envato 的 Burst 模式将单张图像成本降低 6 倍，1 个 AI credit 返回 6 张草稿。  在 Envato 的 AI 图像工具中开启后，它能把粗略的提示词、风格参考或情绪板转化为一批并排展示的方向。  创意探索是一个搜索问题，而只有当尝试另一条分支足够便宜时，搜索才有效。在这里，整批只需一个 AI credit。", "type": "model", "relTime": "1周前"}, {"id": 118, "title": "ChatGPT 推出 Intelligent UI，并预告 GPT-6 将面向所有用户", "source": "X：ChatGPT (@ChatGPT)", "sourceUrl": "https://x.com/ChatGPT/status/2107933133635248145", "date": "2026-10-07T20:36:37.000Z", "summary": "ChatGPT 推出 Intelligent UI，能以完全交互式的用户界面快速回答问题，让日常回答更直观。它帮助用户更轻松地学习复杂主题，并即时生成解决任务的小工具。文中还预告 GPT-6 即将登陆 ChatGPT，面向所有用户。", "type": "paper", "relTime": "1周前"}, {"id": 119, "title": "fal 上线 Vidu Q4 图生视频与参考生视频", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2107930328178237724", "date": "2026-10-07T20:25:28.000Z", "summary": "今天就来试试！  图生视频 https://fal.ai/models/fal-ai/vidu/q4/image-to-video  参考生视频 https://fal.ai/models/fal-ai/vidu/q4/reference-to-video", "type": "model", "relTime": "1周前"}, {"id": 120, "title": "Vidu Q4 上线 fal 平台", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2107930326139867264", "date": "2026-10-07T20:25:27.000Z", "summary": "Vidu Q4 现已在 fal 上线。支持基于单张首帧的图生视频并带原生音频，参考生视频最多可用 12 张参考图和 3 段语音片段以保持角色与声音一致，可生成 3 到 16 秒、540p 至 4K 的片段。", "type": "paper", "relTime": "1周前"}, {"id": 121, "title": "ChatGPT 推出 Intelligent UI，回答将搭配图表、按钮等交互式视觉内容", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/1007276/openai-chatgpt-intelligent-ui-gpt-6", "date": "2026-10-07T19:10:42.000Z", "summary": "OpenAI 在 ChatGPT 中推出 Intelligent UI 功能，随 GPT-6 一并向所有用户推送，让回答可结合图表、图示、表单和可点击按钮。OpenAI 称训练了 GPT-6 判断何时用交互式视觉替代纯文本，用户还可让其内联生成退休储蓄计算器、小游戏或账单分摊工具。", "type": "paper", "relTime": "1周前"}, {"id": 122, "title": "OpenRouter 上线 Cloudflare 开源决策模型 Clef（27B）和 Clef Flash（9B）", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2107897999364177925", "date": "2026-10-07T18:17:00.000Z", "summary": "Cloudflare 的开源决策模型 Clef（27B）和 Clef Flash（9B）现已在 OpenRouter 上提供。两者接收文本、JSON 或图像，返回带概率的类型化答案而非生成文本，定价 $0.24/M input 和 $0.09/M input，输出免费。", "type": "model", "relTime": "1周前"}, {"id": 123, "title": "Mecka 融资 6000 万美元 B 轮", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2107894323811672152", "date": "2026-10-07T18:02:24.000Z", "summary": "机器人领域没有互联网规模的数据集。这才是真正的瓶颈。  Mecka 刚刚完成了由红杉资本领投的 6000 万美元 B 轮融资，就是为了构建这样一个数据集。  > 定制的多传感器采集硬件 > 一个计算机视觉实验室，将原始、嘈杂的素材转化为结构化的训练信号 > 招聘工程师来扩展这两方面  现实世界的一秒钟所包含的信息量，比一页文字还要多。这就是这项工作的规模。", "type": "industry", "relTime": "1周前"}, {"id": 124, "title": "美国司法部首例流媒体刷量案：诈骗者用 1 万机器人账号和 AI 歌曲冒充 Taylor Swift 播放量被判刑", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/tech-policy/2026/10/outstreaming-taylor-swift-is-easy-with-10k-bots-and-ai-songs-fraudster-admits/", "date": "2026-10-07T17:57:39.000Z", "summary": "Smith 因用约 1 万个机器人账号和 AI 生成歌曲伪造流媒体播放量骗取版税，被判 18 个月监禁，并须没收 8,091,843.64 美元非法所得。DOJ 称这是此类起诉中的第一案，指出其行为摊薄了平台版税池、损害真实艺术家收益；其律师以当事人未实际持有 800 万美元、已获唱片公司工作为由争取缓刑，DOJ 则以持续欺骗手段和说谎为由主张从重判刑以示震慑。", "type": "industry", "relTime": "1周前"}, {"id": 125, "title": "Google 开放 SynthID Detector，称已有超 1800 亿张图片和视频带 SynthID 水印", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/google-says-180-billion-images-and-videos-now-carry-synthid-watermarks-as-detector-goes-public/", "date": "2026-10-07T17:50:17.000Z", "summary": "Google 将 SynthID Detector 向公众开放，任何人都可检测图片、视频或音频是否由 Gemini、Veo、Lyria 等 Google AI 或其合作方模型生成，支持 JPG、PNG、MP4 和 MP3 格式。", "type": "model", "relTime": "1周前"}, {"id": 126, "title": "Perplexity 开源 pplx-embed-v2-late 多模态 late-interaction 嵌入模型（9B 与 0.6B）", "source": "X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)", "sourceUrl": "https://x.com/AravSrinivas/status/2107871834205196784", "date": "2026-10-07T16:33:02.000Z", "summary": "Perplexity 开源 pplx-embed-v2-late，两个针对文本和图像的 late-interaction 多向量嵌入模型，大小为 9B 和 0.6B，共享同一嵌入空间，权重已在 Hugging Face 提供。9B 可用于索引多模态数据，0.6B 可在设备端查询，无需 OCR 即可检索 PDF 页面；模型在 MADQA 得分 92.4%，BrowseComp+ 得分 64%。", "type": "model", "relTime": "1周前"}, {"id": 127, "title": "Perplexity 发布 pplx-embed-v2-late 双模型，统一空间检索文本、图像与网页", "source": "X：Perplexity (@perplexity_ai)", "sourceUrl": "https://x.com/perplexity_ai/status/2107866029745746177", "date": "2026-10-07T16:09:58.000Z", "summary": "Perplexity 发布 pplx-embed-v2-late，包含两个 late-interaction 嵌入模型，可在共享嵌入空间中跨模型检索文本、图像和网页。两个模型称达到前沿性能，已在 Hugging Face 公开，博客地址 https://www.perplexity.ai/hub/blog/multimodal-embeddings-beyond-a-single-vecto...", "type": "model", "relTime": "1周前"}, {"id": 128, "title": "Google 发布 macOS 版 Google AI Edge Foresight 应用，用 Gemma 4 本地转录语音笔记", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2107853628656496657", "date": "2026-10-07T15:20:41.000Z", "summary": "Google 发布 macOS 版 Google AI Edge Foresight 应用，使用本地模型 Gemma 4 E4B 或 Gemma 4 12B 转录语音笔记并生成文档，EmbeddingGemma2 参与其中。应用可连接 Google Drive 构建知识图谱。作者另提及 Google 以 Apache 2 许可发布了 740M 参数、8K 上下文窗口的多模态嵌入模型 Embe...", "type": "model", "relTime": "1周前"}, {"id": 129, "title": "Suno 邀你发梗图生成歌曲", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2107852725404725406", "date": "2026-10-07T15:17:06.000Z", "summary": "发给我们一张梗图，我们就为它做一首歌……", "type": "paper", "relTime": "1周前"}, {"id": 130, "title": "谷歌 SynthID 检测网站面向全球用户开放，可检测 AI 生成的图片、视频和音频", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/010/293.htm", "date": "2026-10-07T14:47:41.000Z", "summary": "谷歌宣布 AI 生成内容检测网站 SynthID Detector 已面向全球用户开放，可检测图片、视频或音频是否由 AI 生成。", "type": "paper", "relTime": "1周前"}, {"id": 131, "title": "亚利桑那州法院裁定 AI 生成受害者视频带有不当情感分量 将重新量刑", "source": "404 Media（RSS）", "sourceUrl": "https://www.404media.co/undue-emotional-weight/", "date": "2026-10-07T14:46:15.000Z", "summary": "亚利桑那州上诉法院裁定，Gabriel Horcasitas 2021 年路怒枪杀 Christopher Pelkey 一案维持过失杀人定罪，但因量刑听证中播放的 AI 生成受害者视频带有不当情感分量，法官须重新考虑刑期。", "type": "industry", "relTime": "1周前"}, {"id": 132, "title": "Google Labs 推出 AI 游戏创作平台 Playground，可用文本提示词生成浏览器游戏", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/07/google-experiments-with-an-ai-powered-gaming-platform/", "date": "2026-10-07T14:36:23.000Z", "summary": "Google Labs 于本周三推出 AI 游戏创作平台 Playground，用户可通过简单文本提示词构建基于浏览器的游戏，无需编程技能。用户可选类型（如问答或竞速）、2D 或 3D、单人或多人模式，上传图片转为游戏素材；游戏可在手机和电脑上玩，可私密保存、通过链接分享或发布到 Explore 画廊。", "type": "paper", "relTime": "1周前"}, {"id": 133, "title": "Google 开放 SynthID Detector 验证入口，任何人都可检测 AI 生成内容", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2107836750257107133", "date": "2026-10-07T14:13:37.000Z", "summary": "Google 宣布开放 SynthID Detector，任何人都可通过 synthid.com 检查图片、视频或音频文件是否带有 SynthID 水印，支持 Google 及 OpenAI、NVIDIA、Kakao 等合作方生成的内容，Apple 即将加入。", "type": "product", "relTime": "1周前"}, {"id": 134, "title": "Google：SynthID 已为超 1800 亿张图片和视频添加水印，日均处理超 100 万次验证请求", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2107836412519129334", "date": "2026-10-07T14:12:17.000Z", "summary": "Google 宣布 SynthID 自 2023 年上线以来已为超过 180 亿张图片和视频及 24 万年时长的音频内容添加水印。SynthID Detector 平台与 Search、GeminiApp 和 Chrome 内置的验证功能配合，目前每天处理超过 100 万次验证请求。", "type": "product", "relTime": "1周前"}, {"id": 135, "title": "Google 开放 SynthID Detector 门户，可检测图片、视频和音频是否由 AI 生成", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2107836410254291345", "date": "2026-10-07T14:12:16.000Z", "summary": "Google 介绍检测媒体是否由 AI 生成的方法：访问 https://synthid.com 上传图片、视频或音频文件，门户会扫描文件是否包含来自 Google 或其合作伙伴的 SynthID 水印。", "type": "tip", "relTime": "1周前"}, {"id": 136, "title": "Google 联合 OpenAI、NVIDIA、Kakao 扩展 SynthID Detector 检测门户", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2107836407616299371", "date": "2026-10-07T14:12:15.000Z", "summary": "Google 宣布扩展 SynthID Detector，与 OpenAI、NVIDIA、Kakao 合作，Apple 即将加入，以提升 AI 生成内容的透明度。该验证门户以英语在全球开放，用户可上传文件检测媒体是否由 AI 生成，页面显示可检测来自 NVIDIA、OpenAI、Google、Kakao 生成的媒体。", "type": "industry", "relTime": "1周前"}, {"id": 137, "title": "Google DeepMind 推出 SynthID Detector，可检测视频、音频和图像中的水印", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2107834254222581862", "date": "2026-10-07T14:03:42.000Z", "summary": "Google DeepMind 推出 SynthID Detector，可快速识别视频、音频和图像中的 SynthID 水印，即使经过添加滤镜等编辑仍可检测。用户也可使用 Chrome、Google 搜索和 Gemini 应用中已有的 AI 内容识别功能。", "type": "paper", "relTime": "1周前"}, {"id": 138, "title": "Google DeepMind 的 SynthID Detector 面向所有人开放", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2107834249680499136", "date": "2026-10-07T14:03:41.000Z", "summary": "Google DeepMind 宣布 SynthID Detector 现已向所有人开放，可用于检测在线内容是否由 @GoogleAI 或行业合作方工具生成。合作方包括 OpenAI、NVIDIA、Kakao，Apple 即将加入，试用入口为 https://synthid.com。", "type": "product", "relTime": "1周前"}, {"id": 139, "title": "Google 推出改进版 SynthID 检测器并面向全球开放", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/10/google-rolls-out-improved-synthid-ai-content-detector-now-available-globally/", "date": "2026-10-07T14:00:08.000Z", "summary": "Google 宣布 SynthID 检测器现在支持所有合作方的水印，并上线 SynthID.com 网站供任何人使用。此前外部用户只能通过 Gemini 检测水印，且旧版检测器只识别 Google 自己的 SynthID；SynthID 是嵌入在图像、视频像素和音频波形中的隐形水印，仅 Gemini 就已集成超过 1800 亿张图片和视频以及 24 万年的音频。", "type": "paper", "relTime": "1周前"}, {"id": 140, "title": "Google 推出 SynthID 检测网站，面向公众开放识别 AI 生成内容", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/07/googles-new-synthid-website-can-identify-ai-generated-media/", "date": "2026-10-07T14:00:00.000Z", "summary": "Google 推出面向所有人的 SynthID 检测网站，可验证图片、视频或音频是否由 AI 生成，此前该工具仅向 var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };
var TYPE_LABELS = { "paper":"论文", "model":"模型", "product":"产品", "tip":"技巧", "industry":"行业" };
function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";
  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();
</script>

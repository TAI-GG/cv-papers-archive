ps://x.com/ZHO_ZHO_ZHO/status/2098755173153976407", "date": "2026-09-12T12:46:40.000Z", "summary": "ZHO 发推感慨视觉式思维与语言式思维之间的差别和鸿沟令人抓狂，尤其被迫向 AI 的语言式思维对齐堪称灾难。该推文配图为创意系列《被迫对齐》，标注 ZHGO 与 GPT Images 2.5，并反问\"谁才是被对齐的那一个\"。", "type": "paper", "relTime": "1周前"}, {"id": 7, "title": "3 天实测 GPT Images 2.5：730 张生成数据统计与 5 大问题总结", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2098730777987129371", "date": "2026-09-12T11:09:44.000Z", "summary": "作者 Zho 发布 3 天高强度实测 GPT Images 2.5 的数据统计与问题总结，总计 730 张、日均 243 张，总体感分 82/100，生成成功率 96.6%，一次到位体感 75-80%，专业连续编辑能力 74/100。", "type": "tip", "relTime": "1周前"}, {"id": 8, "title": "GPT Images 2.5 日式暖秋风格出图", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2098730524173123953", "date": "2026-09-12T11:08:44.000Z", "summary": "GPT Images 2.5 被用于生成日式暖秋风格人像，作者称其对日式风格的表达很好，并给出可直接使用的提示词。推文以\"暖秋时光\"为主题，建议周末为自己或朋友生成秋日时尚大片。", "type": "paper", "relTime": "1周前"}, {"id": 9, "title": "Verne 与小马智行在萨格勒布启动欧洲首个全无人载客测试", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/001/599.htm", "date": "2026-09-12T09:14:22.000Z", "summary": "Verne 与小马智行在克罗地亚萨格勒布开放欧洲首个完全无人驾驶载客测试，车内不设安全员，用户通过 Uber 应用体验 22km 路线，连接 Verne 总部、市中心和机场。小马智行自动驾驶系统负责驾驶，Verne 远程监控车辆；车辆基于极狐阿尔法 T5，取消副驾驶座椅并加装后排大屏。双方今年 4 月已在当地上线仍配随车操作员的商业 Robotaxi 服务。", "type": "industry", "relTime": "1周前"}, {"id": 10, "title": "生数科技发布 Motus2：面向灵巧操作的自进化通用世界模型", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489150&idx=1&sn=447e11c94c093f0c428f16b5efe0db78", "date": "2026-09-12T08:23:45.000Z", "summary": "生数科技发布面向机器人灵巧操作的世界模型 Motus2，将行动、预测、评估三种能力统一进同一个共享参数模型，形成生成动作、预测未来、评估结果、更新策略的闭环，并加入轻量触觉专家模块。", "type": "model", "relTime": "1周前"}, {"id": 11, "title": "GPT-6 Astra 驱动 Hugging Face SO-101 机械臂画出金门大桥，转发者解读视觉闭环与具身智能趋势", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2098669390635860068", "date": "2026-09-12T07:05:48.000Z", "summary": "开发者 Thijs 给 GPT-6 Astra 一只不到 200 美元的 Hugging Face SO-101 开源机械臂、一支胶带固定的毛笔和一台俯拍摄像头，让它画金门大桥，模型经多次尝试逐步改进，期间仅被人问 What can you do better。", "type": "tip", "relTime": "1周前"}, {"id": 12, "title": "Meshy 团队发布游戏 Mora 1", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2098603630735798688", "date": "2026-09-12T02:44:30.000Z", "summary": "Meshy 团队推出新游戏 Mora 1，现已上线 https://mora.fun。游戏包含空间解谜、多人平台跳跃、物理、建造和风格切换，由代码、3D 生成和实时视频驱动，团队称这是让 AI 编写游戏获得真实画面与音效的早期一步。", "type": "paper", "relTime": "1周前"}, {"id": 13, "title": "苹果公布 SimpleDesign 蛋白质设计模型，可联合生成序列与三维结构", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/001/521.htm", "date": "2026-09-12T02:15:21.000Z", "summary": "苹果研究人员公布蛋白质设计模型 SimpleDesign，可联合生成氨基酸序列与三维结构，并直接在氨基酸序列和连续三维坐标上端到端训练，省去自编码器等中间表示环节。该模型使用超过 200 万组蛋白质序列与结构配对数据，在联合设计、结构生成和序列生成基准测试中表现具有竞争力。论文目前仅报告计算机评估结果，尚未经实验验证生成蛋白质能否实际折叠或发挥功能。", "type": "paper", "relTime": "1周前"}, {"id": 14, "title": "微信测试图片 AI 处理功能，支持美化、修改与信息提取", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/001/514.htm", "date": "2026-09-12T01:28:27.000Z", "summary": "微信在发送图片界面新增 AI 处理功能，点击后提供美化图片、修改图片、提取信息三类菜单，涵盖生成写真、消除杂物、扩图、变高清、提取文字、翻译图片等选项。此前微信已基于小微灰度上线至少 16 个 AI 功能，覆盖公众号 AI 总结、朋友圈 AI 点评与 AI 帮写、扫一扫视觉识别及聊天语音指令等场景，目前均处灰度测试阶段，仅部分用户可体验。", "type": "paper", "relTime": "1周前"}, {"id": 15, "title": "DeepSeek V4.1 Flash 架构创新非蒸馏可得", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2098544573077184826", "date": "2026-09-11T22:49:49.000Z", "summary": "学者 @hsu_steve 评价 Peter Gostev 用 3D 还原的 DeepSeek V4.1 Flash 架构图，称其底层设计\"任何蒸馏技术都偷不来\"。该架构采用 20 层因果编码器 + 20 层解码器的 CED 架构，读长文本仅激活约 8B 参数、生成时激活 16B；KV 显存压至约 890 字节/token，为上一代四分之一。", "type": "paper", "relTime": "1周前"}, {"id": 16, "title": "Anthropic 首席经济学家承认经济情景模型存在重要局限", "source": "X：Peter McCrory（Anthropic 首席经济学家，@PeterMcCrory）", "sourceUrl": "https://x.com/PeterMcCrory/status/2098517315910549882", "date": "2026-09-11T21:01:31.000Z", "summary": "Anthropic 首席经济学家 Peter McCrory 回应外界批评，承认其经济情景分析模型存在重要局限：模型只聚焦 AI 转型的供给侧，即 AI 能做什么、扩散多快、工人转岗多快。该模型假设价格灵活且总需求等于经济产能，因此无法生成\"冲击压低需求、进而放大自身劳动力市场后果\"的负反馈。", "type": "model", "relTime": "1周前"}, {"id": 17, "title": "Hugging Face CEO 看好开源廉价机械臂与前沿 AI 结合", "source": "X：Clément Delangue（Hugging Face CEO） (@ClementDelangue)", "sourceUrl": "https://x.com/ClementDelangue/status/2098514897453641969", "date": "2026-09-11T20:51:54.000Z", "summary": "OpenAI 的 @cdngdev 预测机器人将迎来类似 3D 打印的热潮，人们会购买廉价开源机械臂并接入 AI 智能体。他使用的 Hugging Face SO-100 机械臂开源、可 3D 打印，售价约 $200，而传统机器人设备价格高达数千美元。他还表示，现在人们可以直接用 Codex 来控制机器人。", "type": "model", "relTime": "1周前"}, {"id": 18, "title": "GPT Image 2.5 Flare 与 Sunburst 登顶 Artificial Analysis 图像竞技场", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2098477736746713145", "date": "2026-09-11T18:24:14.000Z", "summary": "Artificial Analysis 评测显示，OpenAI 新发布的 GPT Image 2.5 Flare 和 Sunburst 包揽其 Image Arena 前两名，在低于 GPT Image 2 一半时间内生成更高质量图像，价格保持不变。", "type": "tip", "relTime": "1周前"}, {"id": 19, "title": "Thomas Wolf 引述 AGI 临近观点", "source": "X：Thomas Wolf（Hugging Face 联创/CSO） (@Thom_Wolf)", "sourceUrl": "https://x.com/Thom_Wolf/status/2098473766523187300", "date": "2026-09-11T18:08:28.000Z", "summary": "\"我们现在离构建 AGI 近得多了，而在这个过程中，我们并没有学到任何关于智能的根本性新东西\"--@RichardMCNgo", "type": "paper", "relTime": "1周前"}, {"id": 20, "title": "Google DeepMind 等机构论文：通往 AGI 的路径可能是构建世界模型的视觉 AI", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2098472341164728483", "date": "2026-09-11T18:02:48.000Z", "summary": "Google DeepMind 联合哈佛、斯坦福等机构发表论文，主张通往 AGI 的路径可能是能记忆变化、预测结果并采取行动的视觉 AI。论文认为视觉系统应直接从图像、视频、3D 结构和交互中学习，理解存在什么、变化了什么、隐藏了什么及下一步可能发生什么，而非仅将视觉输入语言模型。作者呼吁停止主要用图像问答、字幕或逼真视频来评判视觉 AI。", "type": "paper", "relTime": "1周前"}, {"id": 21, "title": "GPT Images 2.5 3D 角色设计表现力展示", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2098454010193920217", "date": "2026-09-11T16:49:58.000Z", "summary": "GPT Images 2.5 在 3D 角色设计上展现出很强的质感表现力，角色张力与情绪感都能很好表达。作者用其为朋友制作 OC，并称效果已让人想做成整部剧集。", "type": "paper", "relTime": "1周前"}, {"id": 22, "title": "Meta 承认 Meta AI 侵入式提示问题并已修复", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/993974/meta-ai-prompt-invasive-suggestions", "date": "2026-09-11T14:25:21.000Z", "summary": "Meta 表示已修改 Meta AI 聊天机器人的建议提示词功能，此前一条热传视频显示该功能在用户视频中提示\"Who is the child passenger？", "type": "industry", "relTime": "1周前"}, {"id": 23, "title": "Tripo P2.0 加 GPT-6 Astra 数小时完成游戏动画", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2098403848939552995", "date": "2026-09-11T13:30:38.000Z", "summary": "开发者用 Tripo P2.0 生成优化并分好部件的模型，再由 GPT-6 Astra 通过代码计算处理网格，约 1.5 小时产出 5 个可用动画，再过 1 小时在 Unity 中跑起来。动画参考视频由 SD 2.5 生成，此前这类工作需数周。", "type": "model", "relTime": "1周前"}, {"id": 24, "title": "Ling 3.0 Flash VL 上线 OpenRouter，由 Novita Labs 提供服务", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2098397350528172506", "date": "2026-09-11T13:04:49.000Z", "summary": "Ling 3.0 Flash VL 上线 OpenRouter，由 Novita Labs 提供服务，是一个 124B MoE、激活参数 5.5B 的模型。新增原生图像和视频输入及视觉智能体能力，支持即时与推理混合模式以及工具调用，提供免费入口 https://openrouter.ai/inclusionai/ling-3.0-flash-vl:free。", "type": "model", "relTime": "1周前"}, {"id": 25, "title": "面壁智能 VoxCPM2 驱动开源视频配音工具 YouDub WebUI", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2098396152924156225", "date": "2026-09-11T13:00:03.000Z", "summary": "面壁智能 OpenBMB 介绍开发者 @liuzhao1225 基于 VoxCPM2 构建的开源视频本地化工具 YouDub WebUI，通过语音识别、翻译、语音生成、混音到成片的全自动管线生成配音视频。", "type": "tip", "relTime": "1周前"}, {"id": 26, "title": "Claude 不再为未成年人提供服务，需通过 Yoti 验证年龄", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://support.claude.com/en/articles/15171100-age-assurance-on-claude", "date": "2026-09-11T12:14:15.973Z", "summary": "Anthropic 宣布 Claude 消费者产品仅面向 18 岁以上用户，注册时需确认年龄，检测到未成年使用迹象的账号将被停用。用户可通过第三方平台 Yoti 完成年龄验证，方式包括自拍面部年龄估算、上传身份证件或使用 Yoti 数字身份 App，验证通过后账号恢复。Anthropic 表示不接触用户证件或图像，仅收到通过或未通过的结果。", "type": "product", "relTime": "1周前"}, {"id": 27, "title": "Meshy 联手 GPT-6 从图像生成 3D 模型", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2098365785949528138", "date": "2026-09-11T10:59:23.000Z", "summary": "闭合时，它是一张图像。打开时，它是一个 3D 模型。  每一张平面图像里都折叠着一个（3D 模型）。  Meshy + GPT-6 把它取出来。", "type": "model", "relTime": "1周前"}, {"id": 28, "title": "GPT Images 2.5 多轮生成特征丢失实测", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2098364334271500733", "date": "2026-09-11T10:53:37.000Z", "summary": "实测 GPT Images 2.5 在连续生成约 5 次后开始丢失人物特征，多人物场景尤为明显，噪点问题也随之加重。作者以第二次与第五次生成结果对比展示这一退化过程。", "type": "paper", "relTime": "1周前"}, {"id": 29, "title": "开源相机 Proof of Capture：用隐写术在像素中嵌入签名，成本不到 100 美元", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://merybenavente.me/blog/proof-of-capture", "date": "2026-09-11T09:33:53.337Z", "summary": "两位开发者在 Recurse Center 用 Raspberry Pi Zero、ATECC608 加密芯片和 3D 打印外壳做出开源相机 Proof of Capture，在拍摄瞬间把签名后的感知哈希以 DWT + DCT 频域水印嵌入像素，可扛住 WhatsApp 级压缩并检测内容篡改。", "type": "model", "relTime": "1周前"}, {"id": 30, "title": "用 GPT Images 2.5 批量生成角色设计", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2098331152616739307", "date": "2026-09-11T08:41:46.000Z", "summary": "作者用 GPT Images 2.5 为朋友们批量制作 OC 角色设计，称效果\"都想整个剧集了\"，并调侃要把给 GPT 充的钱价值最大化。此前他还用同一模型做了\"CatMe 猫与我\"创意系列，直呼\"太 tm 酷了\"。", "type": "model", "relTime": "1周前"}, {"id": 31, "title": "阿里云 Token Plan 个人版升级：Standard、Pro 套餐新增 12 类 Agent Harness 工具", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/001/257.htm", "date": "2026-09-11T06:41:45.000Z", "summary": "阿里云 9 月 11 日宣布 Token Plan 个人版升级，Standard 和 Pro 套餐在价格与 Credit 额度不变的前提下新增 12 项 Agent Harness 工具权益，覆盖搜索、网页解析、图像生成、语音处理、代码执行等能力，均通过 MCP 协议开放。", "type": "paper", "relTime": "1周前"}, {"id": 32, "title": "实测 DeepSeek V4.1 Flash：价格大降、原生带视觉，作者用游戏与城市生成任务验证表现", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247511119&idx=1&sn=0f53b5017e41b16afc9b201966ce2bda", "date": "2026-09-11T04:24:28.000Z", "summary": "作者实测 DeepSeek V4.1 Flash，缓存命中输入降价 7 倍多、输出砍三分之二，9 月 14 日中午 12 点起所有发往 v4-pro 的请求将被强制路由到 4.1 Flash 并按其低价计费。", "type": "tip", "relTime": "1周前"}, {"id": 33, "title": "SimpleDesign：蛋白质序列与结构联合设计的单一模型", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/simpledesign-protein-codesign", "date": "2026-09-11T00:00:00.000Z", "summary": "SimpleDesign 是一个用于蛋白质序列与结构联合设计的生成模型，可同时理解氨基酸序列与三维结构之间的多模态关系。现有模型通常采用多阶段训练，先训练自编码器将数据 tokenize 为隐表示，再在其隐表示上训练生成模型。", "type": "model", "relTime": "1周前"}, {"id": 34, "title": "用多项选择题问答评估视频描述质量：Apple 提出信息保真度新指标", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/video-caption-quality", "date": "2026-09-11T00:00:00.000Z", "summary": "Apple 提出以信息保真度重新定义视频描述质量，认为描述需最大化对视频内容的覆盖。现有指标依赖生成文本与参考文本的匹配，因视频描述存在\"一对多\"特性，高质量描述常因用词差异或视觉重点合理偏移而被扣分，且评估维度单一，无法细粒度分析描述质量。", "type": "product", "relTime": "1周前"}, {"id": 35, "title": "SNAP3D：从单张图像生成可用于装配的物理合理 3D 部件", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.13146", "date": "2026-09-11T00:00:00.000Z", "summary": "SNAP3D 提出一种物理引导框架，从单张图像生成部件级 3D 资产，解决相邻部件互相穿透、连接无效或受重力坍塌的问题。该方法消除部件间穿透、恢复接触图，并在接触面引入参数化连接件，借助物理仿真反馈优化其位置、朝向与尺寸。作者同时提出基于物理的评测协议，直接检验装配有效性与重力下的稳定性，并通过 3D 打印和真实装配验证结果。", "type": "paper", "relTime": "1周前"}, {"id": 36, "title": "LIT：用潜在接口训练破解视觉-动作捷径，提升机器人基础模型泛化能力", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.12641", "date": "2026-09-11T00:00:00.000Z", "summary": "研究者提出 Latent Interface Training（LIT），一种与框架无关的两阶段策略：先在不使用图像的情况下建立以空间目标为条件的动作先验，再通过姿态监督的潜在接口约束视觉条件路径。", "type": "model", "relTime": "1周前"}, {"id": 37, "title": "Dynin-Robotics：全模态统一扩散视觉-语言-动作模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.13053", "date": "2026-09-11T00:00:00.000Z", "summary": "Dynin-Robotics 提出在 Dynin-Omni 全模态掩码扩散骨干上统一建模语言、视觉观测、目标与动作，用约 133 万条来自 48 个 Open X-Embodiment 数据集的轨迹持续预训练。", "type": "model", "relTime": "1周前"}, {"id": 38, "title": "Agent as Policy：通用智能体直接驱动机器人操作", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.12541", "date": "2026-09-11T00:00:00.000Z", "summary": "研究者提出 Agent as Policy（AGP），让通用智能体无需任何任务或环境专属训练即可直接驱动机器人完成操作，由智能体负责任务规划与执行，解读视觉信息、编写可执行程序、发出运动指令并根据物理结果修正动作。在装配、积木搭建、骰子翻转、定向抛掷和双臂叠毛巾等真实操作任务中，AGP 在三种积木搭建配置上分别取得 100%、100% 和 80% 的成功率。", "type": "paper", "relTime": "1周前"}, {"id": 39, "title": "RelateAnything：实时开放词表关系预测，任意输入即可用", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.12552", "date": "2026-09-11T00:00:00.000Z", "summary": "53M 参数的 RelateAnything 可从任意来源的图像区域出发，在推理时以字符串形式给定谓词词表，实时输出带分数的关系预测，速度达 20 ms/帧。它不把物体标签作为输入，跨数据集与零样本场景下平均召回率是最强同规模开放词表方法的 2.3-3.5 倍，并以不到 2% 的参数超过 3B-VLM 场景图模型。模型、语料 RA-4M 与基准 OV-SGG-Bench 均已公开。", "type": "model", "relTime": "1周前"}, {"id": 40, "title": "StepAudio 3 Music 技术报告：支持显式音乐规划的长音频生成模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.16034", "date": "2026-09-11T00:00:00.000Z", "summary": "StepAudio 3 Music 是一款支持显式音乐规划与开放域文本控制的大规模长音频生成模型，可生成最长 5 分 30 秒的歌曲、器乐、干声伴奏及翻唱。其 Tokenizer 以 50-Hz 单码本 65536 条目表示音频，配合 flow-matching diffusion Transformer 预测连续 VAE latent，解码为 48-kHz 音频。", "type": "model", "relTime": "1周前"}, {"id": 41, "title": "IT早报 0911：雷军称小米未来 5 年投 2000 亿元研发；DeepSeek V4.1 Flash 发布；苹果 iPhone 18 Pro 充电提速 33%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/001/082.htm", "date": "2026-09-10T23:56:28.000Z", "summary": "DeepSeek V4.1 Flash 正式发布，官方称全面超越 V4 Pro，支持原生多模态视觉理解，最高降价 60%。雷军回应新华社报道，称小米未来 5 年计划投入 2000 亿元研发费用。苹果确认 iPhone 18 Pro 搭配 40W 动态电源适配器充电速度比前代快 33%，15 分钟可充至 50%，该充电器需单独购买。", "type": "paper", "relTime": "1周前"}, {"id": 42, "title": "DeepSeek V4.1 Flash 发布：KV Cache 缩小 437 倍", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2098195917971341326", "date": "2026-09-10T23:44:24.000Z", "summary": "DeepSeek 发布 552B 参数的 MoE 模型 V4.1 Flash，采用输入输出不对称的 Causal Encoder Decoder 结构，输入侧激活 8B、输出侧 16B，原生支持多模态视觉理解。", "type": "model", "relTime": "1周前"}, {"id": 43, "title": "谷歌推出 Windows 版 Gemini 独立客户端，支持 Alt + Space 快捷唤起", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/001/059.htm", "date": "2026-09-10T22:57:27.000Z", "summary": "谷歌正式推出面向 Windows 10/11 的 Gemini 独立客户端，安装后可通过 Alt + Space 快捷键在任意界面唤起，快捷键支持自定义修改。应用界面与网页版大致相同，支持生成图像/视频、调用连接的应用，并提供独立设置菜单，可管理麦克风、摄像头、位置权限、查看使用统计与崩溃报告、设置开机自动启动。", "type": "paper", "relTime": "1周前"}, {"id": 44, "title": "Muse 开发过程用 Muse 打造", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2098147942528172461", "date": "2026-09-10T20:33:45.000Z", "summary": "一件有趣的事--我们在打造 muse 的过程中大量使用了 muse ：）  （引用推文概要：在图标设计上，我的 Muse 生成了初始列表、协助编写提示词并规划扩展方案，还通过 Muse Image 在对话中直接渲染，并生成了一个 catalog Artifact 来管理图标和记录重跑备注。）", "type": "paper", "relTime": "1周前"}, {"id": 45, "title": "Gemini 应用登陆 Windows，Alt + Space 快捷键随时调用", "source": "X：Josh Woodward (@joshwoodward, Google Labs VP)", "sourceUrl": "https://x.com/joshwoodward/status/2098131750660772342", "date": "2026-09-10T19:29:25.000Z", "summary": "Google 宣布 Gemini 应用正式登陆 Windows，下载地址为 https://gemini.google/desktop。按 Alt + Space 即可在日常应用旁润色草稿、总结长文档、头脑风暴以及生成自定义图像和视频。", "type": "paper", "relTime": "1周前"}, {"id": 46, "title": "Runway 分享实时视频生成研究进展", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2098114075544944957", "date": "2026-09-10T18:19:11.000Z", "summary": "我们认为即时生成是视频模型的发展方向。上周，我们发布了 Solaris 和 GWM Worlds 2，并详细介绍了我们在数字世界与物理世界中进行智能体训练的方法。今天，我们分享关于实时视频生成研究工作的更全面展望。", "type": "model", "relTime": "1周前"}, {"id": 47, "title": "Skild AI 部署十个月达成 1 亿美元 ARR，通用机器人基础模型服务 60 多家公司", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2098108026712723856", "date": "2026-09-10T17:55:09.000Z", "summary": "机器人公司 Skild AI 宣布在开始商业部署 10 个月内达到 1 亿美元 ARR，应用于工厂产线、建筑工地、厨房和数据中心等场景。作者补充：其通用模型可让机器人通过观看视频掌握超过 10 分钟的多步任务而无需重新训练，目前驱动数百台机器人、服务 60 多家公司（年初为 8 家），覆盖人形、机械臂、灵巧手和四足形态。", "type": "tip", "relTime": "1周前"}, {"id": 48, "title": "Sierra 推出下一代多模态智能体：随对话变形的界面", "source": "Sierra：Blog（RSS）", "sourceUrl": "https://sierra.ai/blog/multimodal-agents", "date": "2026-09-10T17:19:28.000Z", "summary": "Sierra 发布下一代多模态智能体，将语音、文本和视觉整合进同一段对话，用户无需在媒介之间二选一。其界面会随对话内容动态变形，让每种媒介在合适场景下发挥各自优势。", "type": "paper", "relTime": "1周前"}, {"id": 49, "title": "Skild AI 发布 S1 机器人基础模型，可从单段视频学习新任务", "source": "NVIDIA Blog（RSS）", "sourceUrl": "https://blogs.nvidia.com/blog/skild-ai-s1-physical-ai", "date": "2026-09-10T16:30:35.000Z", "summary": "Skild AI 发布 S1 机器人基础模型，通过 in-context learning 从单段视频演示理解并执行未见过的新任务，无需更新权重或任务专属后训练。", "type": "model", "relTime": "1周前"}, {"id": 50, "title": "Google Gemini 桌面应用登陆 Windows，Alt + Space 一键呼出", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2098082314722889936", "date": "2026-09-10T16:12:58.000Z", "summary": "Google 官方宣布 Gemini 应用现已登陆 Windows。用户按 Alt + Space 即可随手调用，用于润色草稿、总结长文档、头脑风暴以及生成自定义图像和视频，可与常用工具和应用并行使用。TestingCatalog 补充称应用内编辑似乎也支持 Alt + Space 快捷键。", "type": "paper", "relTime": "1周前"}, {"id": 51, "title": "Gemini 应用正式登陆 Windows，Alt + Space 一键唤起", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2098080062570721619", "date": "2026-09-10T16:04:02.000Z", "summary": "Gemini 应用现已支持 Windows。用户按 Alt + Space 即可在常用工具旁唤起 Gemini，用于润色草稿、总结长文档、头脑风暴以及生成自定义图片和视频。", "type": "paper", "relTime": "1周前"}, {"id": 52, "title": "AI 用 2000 万美元算力攻克纳维-斯托克斯奇点难题", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2098079561686626520", "date": "2026-09-10T16:02:02.000Z", "summary": "有人花 2000 万美元算力，去解一个奖金仅 100 万美元的数学题：用 AI 在三维空间中演示纳维-斯托克斯流体方程的解是否会在极端旋转下失控、诞生速度无限大的奇点。视频中向内螺旋又轴向拉伸的彩色涡旋，被称作 AI 首次向人类证明\"物理学平滑世界终将破裂\"的瞬间。", "type": "paper", "relTime": "1周前"}, {"id": 53, "title": "智元发布AGILE2.0感控一体模型，灵犀X2完成踩球走等视觉驱动任务", "source": "AGIBOT 智元（网页）", "sourceUrl": "https://www.agibot.com.cn/article/315/detail/220.html", "date": "2026-09-10T16:00:00.000Z", "summary": "智元发布AGILE2.0感控一体模型，实现视觉感知、环境理解、全身运动控制与上下肢协同操作的端到端闭环耦合。通过短片《杂技BOT》展示灵犀X2钻火圈、跳长绳、踩球走、协作搬箱子等视觉驱动动态任务，其中踩球走为双足人形机器人自主实现。模型面向动态扰动、人机共存、多机协同等复杂场景，降低现实环境中的定制化开发代价，支持部署态规模化落地。", "type": "model", "relTime": "1周前"}, {"id": 54, "title": "VOIDZ 如何用 Runway Seedance 2.0 把 15 秒 VFX 短片扩展成 95 秒纪录片", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/customers/voidz", "date": "2026-09-10T16:00:00.000Z", "summary": "匿名混合现实艺术家 VOIDZ 借助 Runway 的 Seedance 2.0，将原本受传统 3D 流程限制在 10 至 15 秒的作品扩展为 95 秒纪录片《Ends Meat》。他用 Seedance 延长真实拍摄的超市购物素材，生成商品膨胀、拉伸、变形的超现实画面，并称该模型能准确延续源片段的镜头运动、光照与视觉特征。他将这种形式称为\"纪录片超现实主义\"：画面是纪实，操控是评论。", "type": "model", "relTime": "1周前"}, {"id": 55, "title": "Google 发布图像工具 Pics，基于 Nano Banana 支持精准编辑与协作", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2098072879480947085", "date": "2026-09-10T15:35:29.000Z", "summary": "Google 发布图像生成工具 Google Pics，基于 Nano Banana 构建，现已上线 pics.new。支持局部对象编辑、图内文字修改与翻译、多人协作创作和单提示词生成多个选项。", "type": "paper", "relTime": "1周前"}, {"id": 56, "title": "Meta Muse AI 智能体上手实测：任务能干，但隐私令人不安", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/993391/meta-muse-ai-hands-on", "date": "2026-09-10T15:00:00.000Z", "summary": "The Verge 作者实测 Meta 新推出的 AI 智能体 Muse，它基于云端虚拟电脑执行任务，成功清理了数千封推广邮件并按指定要求完成 Amazon 购买，也能生成 AI 播客、图像视频和名为 artifacts 的交互网页。", "type": "tip", "relTime": "1周前"}, {"id": 57, "title": "Meshy 展示 GPT-6 + ComfyUI 工作流", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2097996810724008160", "date": "2026-09-10T10:33:13.000Z", "summary": "GPT 6 + Meshy + ComfyUI + Gemini 惊艳工作流👏🏻  基于 @anshuc 的 Dream Loop 技能构建 👇 • @OpenAI GPT-6 Astra 负责大部分体验 • @OpenAI GPT-5.6 Sol 处理选定任务以节省 token • @MeshyAI 负责角色模型 • @ComfyUI 搭配音频模型制作音效 • @GeminiApp 负责视...", "type": "model", "relTime": "1周前"}, {"id": 58, "title": "Meshy 应用拍照生成 3D 模型", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2097996003278213410", "date": "2026-09-10T10:30:00.000Z", "summary": "用 Meshy 应用拍张照片。所见即得 3D。📱  埃菲尔铁塔、自由女神像、精致的博物馆花瓶……同样的外观，现在变成 3D。  还有什么吸引了你的目光？给它造个双胞胎。📸", "type": "model", "relTime": "1周前"}, {"id": 59, "title": "京东发布 Physical AI 加速计划，重申五年采购 300 万台机器人目标", "source": "Artificial Intelligence News（网页）", "sourceUrl": "https://www.artificialintelligence-news.com/news/jd-com-physical-ai-logistics-3-million-robots", "date": "2026-09-10T10:28:18.001Z", "summary": "京东在 JDDiscovery 2026 上发布 Physical AI Acceleration Plan，重申五年内采购 300 万台机器人、100 万辆自动驾驶车和 10 万架配送无人机的目标，并发布工业级 Wolf Robot 系列。", "type": "industry", "relTime": "1周前"}, {"id": 60, "title": "生数科技骆怡航外滩大会阐释通用世界模型下一程，发布 Motus2", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489113&idx=1&sn=1701a9f2ef3728c187c646dc60ce9c87", "date": "2026-09-10T10:02:28.000Z", "summary": "生数科技在外滩大会发布面向机器人灵巧操作的自进化通用世界模型 Motus2，将策略、世界模拟与价值评估纳入统一视频-动作模型闭环，呈现 RSI 初步特征。该模型被视为从 L3\"在世界中行动\"走向 L4\"自主世界智能体\"的探索，并引入触觉反馈。9 月 12 日起团队将陆续公布更多实验结果与技术细节。", "type": "model", "relTime": "1周前"}, {"id": 61, "title": "火种说|三天一个 Demo，上百个应用：一个 OpenBMB 社区开发者的 AI 语音炼化之路", "source": "公众号：面壁智能（MiniCPM）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3Mzg2MTg2NQ%3D%3D&mid=2247499221&idx=1&sn=f8de936748235f5a6f614565833ed083", "date": "2026-09-10T09:18:44.000Z", "summary": "深圳耐思人工智能技术负责人大明哥基于 OpenBMB 开源社区的 VoxCPM 语音合成模型，自研 S2S、MDN、QUIC 三条全语音链路，提出\"前端挂起式打断\"交互思路，并搭建面向数字分身人格刻画的六库系统。", "type": "model", "relTime": "1周前"}, {"id": 62, "title": "高德发布 3D 原生城市世界模型 ABot-Earth 0.7，支持从星球到街景全尺寸生成", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/890.htm", "date": "2026-09-10T09:02:24.000Z", "summary": "高德发布 3D 原生城市世界模型 ABot-Earth 0.7，称其为全球首个全模态、可预测的 3D 原生城市世界模型，覆盖超过 196 个国家和地区。模型可从卫星图像或文字描述出发，10 分钟内在一块消费级 GPU 上生成公里级 3DGS 格式城市场景，效率较传统模式提升 1000 倍，已应用于飞行街景 2.0，体验官网同步上线。", "type": "model", "relTime": "1周前"}, {"id": 63, "title": "DeepSeek 合并快速、专家、识图模式，计划推出 V4.1 Flash 并下线 V4 Pro", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2097973367374778569", "date": "2026-09-10T09:00:03.000Z", "summary": "DeepSeek 将快速、专家、识图三种模式合并升级，移除独立的专家模式选项，新模型同时具备日常对话、图片理解与复杂问题解决能力。公司计划在北京时间 9 月 10 日前后推出原生多模态的 V4.1 Flash；V4 Pro 服务定于北京时间 9 月 14 日中午结束，之后请求将被路由到 V4.1 Flash 并按其费率计费。", "type": "model", "relTime": "1周前"}, {"id": 64, "title": "Tripo 展示 GPT-6 Astra 与 Blender MCP 结合的 3D Vibe Coding 实操工作流", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2097972692200940013", "date": "2026-09-10T08:57:22.000Z", "summary": "Tripo 转发用户案例，展示用 Images 2.5、Tripo 智能网格 P2.0、GPT-6 Astra 和 Blender MCP 以 AI 为主制作 3D 角色的完整流程。作者几乎只做视图操作，通过截图加参考图让 Astra 修正形状与纹理，并指出纹理修正在细节上仍较粗糙。作者称此前在 GPT-5.6 Sol 上反复失败的操作在 Astra 上可以直接完成。", "type": "tip", "relTime": "1周前"}, {"id": 65, "title": "文远知行联合 Uber、AVOMO 获西班牙首张 L4 自动驾驶乘用车运营牌照", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/885.htm", "date": "2026-09-10T08:55:01.000Z", "summary": "文远知行 WeRide 与 Uber、AVOMO 获西班牙交通总局（DGT）依据 ES-AV 框架颁发的西班牙首张 L4 级自动驾驶乘用车运营牌照，获准在公共道路部署车辆。", "type": "industry", "relTime": "1周前"}, {"id": 66, "title": "DeepSeek 发布 V4.1-Flash：新架构带来原生视觉理解与大幅降价", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2097970735591366804", "date": "2026-09-10T08:49:36.000Z", "summary": "DeepSeek 发布 V4.1-Flash，采用 Causal Encoder-Decoder 新架构并支持原生视觉理解，552B MoE 参数，输入处理激活 8B、输出生成激活 16B。", "type": "paper", "relTime": "1周前"}, {"id": 67, "title": "阿里拟领投前实习生创办的 AI 评测公司 UniPat 3 亿美元融资，估值 25 亿美元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/856.htm", "date": "2026-09-10T08:29:09.000Z", "summary": "阿里巴巴集团拟领投 AI 训练与基准测试初创公司 UniPat AI 的 3 亿美元融资，本轮估值达 25 亿美元，腾讯控股及红杉等老股东也参与投资。UniPat 由去年在通义 AI 实验室从事后训练分析、数据合成和强化学习工作的李宽创办，为 AI 模型设计贴近真实使用环境的测试与评估场景，基准测试涵盖 AI 编程智能体、浏览器智能体及前沿多模态模型的视觉推理能力。", "type": "model", "relTime": "1周前"}, {"id": 68, "title": "DeepSeek 发布 V4.1-Flash：新 Causal Encoder-Decoder 架构，带原生视觉理解", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2097962333767102665", "date": "2026-09-10T08:16:13.000Z", "summary": "DeepSeek 发布 V4.1-Flash，采用新 Causal Encoder-Decoder 架构并支持原生视觉理解，为其新架构家族中最小模型。该模型为 552B 参数 MoE，输入处理激活 8B、输出生成激活 16B；KV cache 需求较上一代降至 HBM 的 1/4、SSD 存储的 1/8，API 价格更低。", "type": "model", "relTime": "1周前"}, {"id": 69, "title": "DeepSeek 发布 V4.1-Flash，API 价格同步下调", "source": "DeepSeek：API 更新日志", "sourceUrl": "https://api-docs.deepseek.com/zh-cn/updates#%E6%97%B6%E9%97%B4-2026-09-10", "date": "2026-09-10T05:58:04.695Z", "summary": "DeepSeek 发布 DeepSeek-V4.1-Flash，是全新模型结构系列中最小尺寸的模型，具备原生多模态视觉理解能力，评测包括 GPQA Diamond 90.9、HLE 36.8、Codeforces Rating 3471、Terminal-Bench 2.1 90.6 等。", "type": "model", "relTime": "1周前"}, {"id": 70, "title": "DeepSeek 发布 V4.1 Flash 模型，基准超越 V4 Pro 并下调 API 定价", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/719.htm", "date": "2026-09-10T05:50:17.000Z", "summary": "深度求索正式发布 DeepSeek V4.1 Flash，为 552B 参数 MoE 模型，采用全新 Causal-Encoder-Decoder 结构，原生支持多模态，基准测试超越包括 DeepSeek V4 Pro 在内的旗舰模型。", "type": "model", "relTime": "1周前"}, {"id": 71, "title": "DeepSeek 发布 V4.1 Flash：552B MoE 多模态模型，同步开源并下调 API 定价", "source": "公众号：DeepSeek（深度求索）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzk0OTYwNzc3NQ%3D%3D&mid=2247485817&idx=1&sn=627dd80114901f3fd8717e2c13feaf6a", "date": "2026-09-10T05:44:15.000Z", "summary": "DeepSeek 正式发布 V4.1 Flash，全新 Causal-Encoder-Decoder 结构的 552B 参数 MoE 模型，输入激活 8B、输出激活 16B，具备原生多模态视觉理解，基准测试超越包括 DeepSeek V4 Pro 在内的旗舰模型。", "type": "model", "relTime": "1周前"}, {"id": 72, "title": "Tripo Codex 插件正式上线，展示 3D 游戏创作流程", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2097912416533467261", "date": "2026-09-10T04:57:52.000Z", "summary": "Tripo 宣布 Tripo Codex 插件正式上线，并展示了 Tripo API 与 Astra 工作流在 3D 游戏创作中的应用。有用户用 GPT-6 Astra、Tripo 插件和 Blender 做出了 Mac 平台的全 3D RuneScape 类游戏 0.1 版，完整 3D 动画和核心游戏操作已可用。插件安装与设置的分步教程视频将于下周发布。", "type": "product", "relTime": "1周前"}, {"id": 73, "title": "Dev Ed 实测用 MCP 把 Claude 接入 Blender，一句话 One-shot 完成可编辑建模", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2097902768946028979", "date": "2026-09-10T04:19:31.000Z", "summary": "Dev Ed 实测通过 Anthropic 的 MCP 协议把 Claude 接入 Blender，自然语言一句话即可 One-shot 完成建模。Claude 经 MCP 向 Blender 发送原生 Python 脚本，直接执行添加几何体、布尔运算、挂细分修改器、调整 Shader Node 等操作，生成可继续手动拖拽或对话微调的可编辑工程文件。", "type": "paper", "relTime": "1周前"}, {"id": 74, "title": "成都 AI 系统治理龟速车，覆盖城区快速路及绕城高速，试行路段慢车降约 20%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/693.htm", "date": "2026-09-10T04:16:23.000Z", "summary": "成都交警去年上线的治理龟速车 AI 智慧系统近期在城区所有快速路及绕城高速完成部署。系统整合 ETC、卫星定位与视频感知数据识别超低速行驶车辆，通过 LED 屏提示，并核查驾车打电话等违法行为；自 2025 年 4 月试运行以来累计发布 LED 提示 3.1 万余次，监测路段龟速车数量同比下降约 20%。报道还提到成都一社区为独居老人安装毫米波雷达跌倒检测器，累计处置预警 66 条。", "type": "industry", "relTime": "1周前"}, {"id": 75, "title": "DeepSeek 合并快速、专家、识图模式为统一智能模式，V4.1 Flash 最快今日发布", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/602.htm", "date": "2026-09-10T02:11:13.000Z", "summary": "DeepSeek 宣布将快速模式、专家模式和识图模式合并为统一的智能模式，模型可自动检测查询复杂度、在检测到图片输入时激活视觉能力并按任务难度调整处理能力。", "type": "model", "relTime": "1周前"}, {"id": 76, "title": "Suno v6 发布，支持图片、视频和语音备忘录生成音乐", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2097846245540888664", "date": "2026-09-10T00:34:55.000Z", "summary": "Suno 发布 v6 模型，可将图片、视频和语音备忘录转化为音乐，并对已创建的歌曲进行精确修改。同时提供 v6-wild 版本供探索更多可能性，官方附有 2 分钟以内的功能演示视频。", "type": "model", "relTime": "1周前"}, {"id": 77, "title": "OpenAI 收紧 ChatGPT 广告政策，禁止图像与音频生成类竞品广告", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/568.htm", "date": "2026-09-10T00:09:39.000Z", "summary": "据 The Information 报道，OpenAI 近期悄然更新广告政策，不再接受仅图像生成和语音生成类产品的广告审批，Adobe 美洲媒体高级总监 Doug Wyatt 证实了这一消息。", "type": "industry", "relTime": "1周前"}, {"id": 78, "title": "Hugging Face 用 Gradio Workflow 重建 Workflow1111，复刻 AUTOMATIC1111 主要功能", "source": "Hugging Face：Blog（RSS）", "sourceUrl": "https://huggingface.co/blog/gradio-workflow-1111", "date": "2026-09-10T00:00:00.000Z", "summary": "Hugging Face 发布 Workflow1111，用 gr.Workflow 以 73 个节点、11 条媒体管线重建 AUTOMATIC1111 的大部分功能，覆盖文本生成图像、高清修复、图生图、prompt matrix、VLM 反推提示词、检测生成 inpaint 蒙版、ControlNet 式预处理器、背景移除、PNG Info 和图生视频。", "type": "paper", "relTime": "1周前"}, {"id": 79, "title": "超越求解器判定：面向自动形式化的生成式奖励模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.11085", "date": "2026-09-10T00:00:00.000Z", "summary": "研究提出 Verdict-Preserving-Unfaithfulness（VPU）失效模式：错误形式化编码能成功执行并匹配预期判定，并证明仅凭结构、判定的验证启发式检测能力在数学上被限制在随机水平。", "type": "model", "relTime": "1周前"}, {"id": 80, "title": "Mi-Ripple：修复迭代 AI 编辑导致的图像退化", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.11317", "date": "2026-09-10T00:00:00.000Z", "summary": "Mi-Ripple 是一种诊断引导的修复流程，用于消除迭代参考条件图像编辑产生的网格状与颗粒状\"数字波纹\"，同时保护图像结构。该方法将周期性晶格伪影与内容纠缠的颗粒纹理分离，结合选择性频谱陷波、结构感知平滑与干净参考图重生成。14 次纯陷波执行中全图残差标准差为 0.08-0.44 CIELAB 亮度单位，配对重生成示例中参考图清理使输出碎片密度降低 45%。", "type": "paper", "relTime": "1周前"}, {"id": 81, "title": "GLIE：面向视觉文档检索的生成式后期交互嵌入", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.11808", "date": "2026-09-10T00:00:00.000Z", "summary": "针对视觉文档检索中后期交互嵌入存储开销大的问题，研究者提出生成式后期交互嵌入 GLIE：利用向量恰好落在单位球面、且集中在内在维度 5-6 的流形上的几何特性，每页仅用 k 个归一化质心向量作为索引，查询时只检索这 k 个向量，再由解码器将 top 候选还原为全部 N 个向量做精确重打分。", "type": "paper", "relTime": "1周前"}, {"id": 82, "title": "UniH3：统一分层同质性与异质性的全能医学图像修复框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.11156", "date": "2026-09-10T00:00:00.000Z", "summary": "北航与清华团队提出 UniH3 框架，通过分层同质性记忆（H2M）模块从高质量图像中蒸馏任务内与任务间先验，并用同质性引导注意力（HGA）注入修复流程，同时以分层异质性平衡器（H2B）缓解任务内与任务间优化冲突。在 MedIR-2D-500K 和 MedIR-3D-3K 两个大规模基准上，UniH3 在全能及单任务医学图像修复中均达到 SOTA。代码已开源。", "type": "model", "relTime": "1周前"}, {"id": 83, "title": "SenseNova-U1.5 发布：8B-MoT 原生统一多模态模型，支持 4K 生成与图像编辑", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.11929", "date": "2026-09-10T00:00:00.000Z", "summary": "SenseNova 团队发布 SenseNova-U1.5，一个 8B-MoT 原生统一多模态模型，在无编码器、无 VAE 架构内实现视觉理解、推理、生成和编辑。", "type": "model", "relTime": "1周前"}, {"id": 84, "title": "World in World：用世界模型探索视频中的世界", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.11548", "date": "2026-09-10T00:00:00.000Z", "summary": "研究者提出 World in World（WiW），一种无需训练的可控视频世界模型接口，将源视频观测、目标视角投影、渲染几何与生成历史统一转换为带相机、时间和空间有效性标注的干净视觉状态，通过模型原生 self-attention 直接注入冻结的因果视频世界模型。该方法无需更新预训练模型或增加控制专用模块，即可支持相机位姿、视角方向等多样化控制下的长时程交互式探索。", "type": "model", "relTime": "1周前"}, {"id": 85, "title": "Recursive Code World Models（RCWM）：用递归场景程序从单张参考图重建复杂 3D 世界", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.11499", "date": "2026-09-10T00:00:00.000Z", "summary": "研究者提出 Recursive Code World Models（RCWM），通过递归场景程序（RSP）表示与可递归调用的构建求解器，从单张参考图像重建复杂 3D 世界。", "type": "model", "relTime": "1周前"}, {"id": 86, "title": "MaP-WAM：以记忆为规划的世界-动作建模框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.11561", "date": "2026-09-10T00:00:00.000Z", "summary": "研究者提出 MaP-WAM，一个将记忆依赖的世界-动作建模拆分为记忆锚定规划与规划条件执行的框架，把长期多模态情景上下文用作规划期证据，而非反复将完整历史输入执行器。该方法在 RMBench 上取得 83.3% 成功率，真实机器人任务成功率达 78.0%，且执行器推理延迟随任务历史增长基本保持恒定。", "type": "paper", "relTime": "1周前"}, {"id": 87, "title": "TRACE 基准：火灾后不可逆损伤物体的特征恢复与理解", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.12078", "date": "2026-09-10T00:00:00.000Z", "summary": "论文提出 TRACE，一个火灾后物体理解基准，包含 21.4K 真实图像合成的场景，覆盖 189 类共 499 种物体的降质进程，设检测、恢复、检索、描述与功能推理五项任务。", "type": "paper", "relTime": "1周前"}, {"id": 88, "title": "Ambient 将长视频感知蒸馏至 2B 以下模型，获 EgoLongQA 2026 小于等于 2B 参数组第一", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.07154", "date": "2026-09-10T00:00:00.000Z", "summary": "Ambient 团队在 ECCV 2026 Wearable-AI Challenge 的 EgoLongQA 赛道中，以单个 2B 视觉语言模型在小于等于 2B 参数组以 0.8279 分获得第一名。", "type": "model", "relTime": "1周前"}, {"id": 89, "title": "Attention-DP3：基于几何对齐注意力条件的空间物体感知 3D 扩散策略", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.13318", "date": "2026-09-10T00:00:00.000Z", "summary": "Attention-DP3 是一种空间物体感知的 3D 扩散策略，通过注意力注入物体级几何线索，同时保持 DP3 扩散主干不变。它先用开放词汇 2D 分割将目标掩码提升到 3D，再通过 Tri-field Attentional Conditioning 构建 targetness、intra-target saliency 和 backgroundness 三个场。", "type": "paper", "relTime": "1周前"}, {"id": 90, "title": "Vidu S2 发布：实时交互、可编辑的空间视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.11638", "date": "2026-09-10T00:00:00.000Z", "summary": "Vidu 团队发布 Vidu S2，包含实时交互数字人模型 Vidu S2-Avatar 和实时视频编辑模型 Vidu S2-Editing，并探索了二者的实时空间视频生成。", "type": "model", "relTime": "1周前"}, {"id": 91, "title": "Pelican-Sim 1.0：面向具身智能的通用世界模型模拟器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.12036", "date": "2026-09-10T00:00:00.000Z", "summary": "Pelican-Sim 1.0 是面向具身智能的通用世界模型模拟器，可从视觉上下文和机器人动作预测未来观测。它采用 28 维统一动作空间、动作-视觉注入、稀疏 MoE 和四步自回归蒸馏，实现 5.67 倍加速，在 AgiBotWorld Beta、RoboMIND、RoboTwin 上分别将 PSNR 提升 4.636、2.080 和 10.343。", "type": "model", "relTime": "1周前"}, {"id": 92, "title": "Simon Willison 发布 .blend URL Viewer，可在浏览器查看 Blender 模型", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/9/blender-viewer", "date": "2026-09-09T23:58:32.000Z", "summary": "Simon Willison 发布 .blend URL Viewer，一个可在浏览器中查看 Blender 模型的工具。他用 ChatGPT Images 2.5 生成 Pluribus 主题法贝热彩蛋图片，再让运行 GPT-6 Astra（high）的 Codex 调用 Blender 本地技能，耗时 17m51s 生成多个 .blend 文件，现可通过该工具在线查看。", "type": "model", "relTime": "1周前"}, {"id": 93, "title": "Runway 上线 GPT-Image 2.5 及两款新模型", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2097814431912574991", "date": "2026-09-09T22:28:30.000Z", "summary": "GPT-Image 2.5 现已登陆 Runway。  Flare 速度更快，专为日常迭代与探索而打造。Sunburst 则面向精准编辑与最高保真度而设计。两者今日起与全球顶尖的图像和视频模型一同上线。  点击下方链接立即体验。", "type": "model", "relTime": "1周前"}, {"id": 94, "title": "Apple 推出 Reference Image 功能，用 iPhone 18 Pro 新传感器为照片签名防 AI 篡改", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/992766/apple-iphone-18-pro-reference-image", "date": "2026-09-09T19:30:12.000Z", "summary": "Apple 将随 iPhone 18 Pro 系列推出 Reference Image 功能，利用新相机传感器对 Reference 模式下拍摄的每个像素签名，经 Private Cloud Compute 生成不可更改的参考图像，可在 Photos 应用中与其他版本对比以发现编辑痕迹。", "type": "product", "relTime": "1周前"}, {"id": 95, "title": "GPT-Image-2.5 上线 Luma Agents，OpenAI 两款新图像模型同日可用", "source": "X：Luma AI (@LumaLabsAI)", "sourceUrl": "https://x.com/LumaLabsAI/status/2097763347743601096", "date": "2026-09-09T19:05:31.000Z", "summary": "GPT-Image-2.5 已上线 Luma Agents，OpenAI 当天发布的两款新图像模型均可使用。Flare 主打速度和批量出图，Sunburst 用于需要精确落点的编辑，可带参考图改掉不理想部分、保留其余内容，再接续生成视频。", "type": "model", "relTime": "1周前"}, {"id": 96, "title": "蚂蚁百灵 Ling-3.0-flash-VL 联合 Novita 上线 Hugging Face，免费体验 14 天", "source": "X：蚂蚁百灵 (@AntLingAGI)", "sourceUrl": "https://x.com/AntLingAGI/status/2097732934417649711", "date": "2026-09-09T17:04:40.000Z", "summary": "蚂蚁百灵宣布与 day0 合作伙伴 Novita 合作，Ling-3.0-flash-VL 现已可在 Hugging Face 上体验，免费 14 天。该模型总参数 124B、每 token 激活 5.5B，原生支持图像和视频理解，面向多模态推理和智能体工作流。", "type": "model", "relTime": "1周前"}, {"id": 97, "title": "Robbyant 开源 LingBot-World 2.0 Small 1.3B 世界模型，可在单张消费级 GPU 实时运行", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2097730117900328968", "date": "2026-09-09T16:53:28.000Z", "summary": "Robbyant 开源 LingBot-World 2.0 Small，一个 1.3B 世界模型，可在单张消费级 GPU 上实时生成交互式世界。此次共开源 3 个模型，包括 1.3B Small、Bidirectional 和 Causal Pretrain；完整配置可扩展到 720p/60fps。作者评论称这与语言和图像模型类似，先放大能力再蒸馏到用户自有硬件。", "type": "model", "relTime": "1周前"}, {"id": 98, "title": "GPT Images 2.5 材质质感与特征保持实测", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097725897042530511", "date": "2026-09-09T16:36:42.000Z", "summary": "ZHO 实测 GPT Images 2.5，称赞其材质质感/混合与特征保持能力大幅提升，设计能力增强。生成的毛发、毛绒、麻绳质感出色，且消除了上一代的噪点感与脏感。", "type": "paper", "relTime": "1周前"}, {"id": 99, "title": "Runway 分享实时视频生成研究：从 Gen-4.5 后训练到流式逐帧生成", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/research/towards-instant-video-generation", "date": "2026-09-09T16:00:00.000Z", "summary": "Runway 公布其实时视频生成研究路径：对 Gen-4.5 等基础模型做后训练，先通过 teacher forcing 将架构改为时间因果的逐帧自回归生成器，再用分布匹配蒸馏把每帧去噪压缩到几步，并以 on-policy 蒸馏抑制误差累积。该方案以首帧时间和流式输出为核心指标，可减少 GPU 占用、降低成本，并让用户边生成边调整而非反复重来。", "type": "model", "relTime": "1周前"}, {"id": 100, "title": "美国《Take It Down Act》首例判决：俄亥俄州男子因 AI 生成儿童性虐待图像获刑 15 年", "source": "404 Media（RSS）", "sourceUrl": "https://www.404media.co/first-take-it-down-act-sentencing-case", "date": "2026-09-09T15:57:52.000Z", "summary": "美国《Take It Down Act》生效后首例判决出炉，38 岁俄亥俄州男子 James Strahler 因网络跟踪、制作儿童性虐待图像及发布数字伪造内容被判 15 年监禁。调查人员在其设备中发现超 3000 张真实与 AI 生成的虐待图像，其中 700 多张被发布至儿童性虐待网站。该法案于 5 月生效，要求平台在接到通知后 48 小时内删除违规内容。", "type": "paper", "relTime": "1周前"}, {"id": 101, "title": "OpenAI GPT-Image-2.5 等两款新图像模型上线 Luma Agents", "source": "X：Luma AI (@LumaLabsAI)", "sourceUrl": "https://x.com/LumaLabsAI/status/2097701309571055832", "date": "2026-09-09T14:59:00.000Z", "summary": "GPT-Image-2.5 等 OpenAI 两款新图像模型现已在 Luma Agents 上线。Flare 主打速度和批量生成，Sunburst 面向需要精确落位的编辑，可携带参考图、只改不合适之处并保留其余部分，随后转入视频生成。", "type": "model", "relTime": "1周前"}, {"id": 102, "title": "LTX-2.5 开源发布：开放权重视频世界模型，强化生成与编辑", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2097700488741376411", "date": "2026-09-09T14:55:44.000Z", "summary": "@ltx_io 发布开放权重视频世界模型 LTX-2.5，支持本地部署和微调，前代 LTX 已达 18M 下载。新版本改进生成与编辑：新解码器提升人脸清晰度、文字招牌可读性和快速运动表现，原生 Multishot 在镜头间保持角色、环境、光照与语音一致，IC-LoRA 支持对象移除、连贯性修复和环境更换，更强的蒸馏模型把更多质量带入本地 GPU。", "type": "model", "relTime": "1周前"}, {"id": 103, "title": "GPT Images 2.5 多风格混合质感评测", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097698044733276309", "date": "2026-09-09T14:46:01.000Z", "summary": "GPT Images 2.5 的多风格混合能力出色，噪点质感被透明金属与反光包裹，视觉效果惊艳。作者认为其风格调色盘潜力巨大，并附有测试系列与提示词参考。", "type": "paper", "relTime": "1周前"}, {"id": 104, "title": "网友热议是否给Altman寄SO-100机器人", "source": "X：Thomas Wolf（Hugging Face 联创/CSO） (@Thom_Wolf)", "sourceUrl": "https://x.com/Thom_Wolf/status/2097693534333579440", "date": "2026-09-09T14:28:06.000Z", "summary": "我们该把 @LeRobotHF 的 SO-100 寄给 @sama 呢，还是送他一台 3D 打印机和舵机，让他自己动手组装？", "type": "paper", "relTime": "1周前"}, {"id": 105, "title": "Amazon Prime Video 推出 AI 口型同步配音功能，首发《Maxton Hall》英语配音", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/991809/amazon-prime-video-ai-lip-sync-dubbing", "date": "2026-09-09T13:00:00.000Z", "summary": "Amazon Prime Video 推出新 AI 功能，通过 AI 与视觉特效技术让演员口型与\"人工配音\"音频同步。该功能目前仅适用于德剧《Maxton Hall》的英语配音，未来将扩展至更多剧集。口型同步配音现已在全球上线《Maxton Hall》第 1、2 季，并将随 12 月 9 日播出的第 3 季同步推出。", "type": "paper", "relTime": "1周前"}, {"id": 106, "title": "人社部发布第八批新职业：含具身智能机器人应用技术员等11个新职业和23个新工种", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/429.htm", "date": "2026-09-09T12:35:07.000Z", "summary": "人力资源社会保障部等部门发布第八批新职业，共11个新职业和23个新工种，其中包括具身智能机器人应用技术员、数字孪生工程技术人员、智能体开发员等。数字职业和绿色职业分别占45%和27%，2019年以来我国已累计发布八批共121个新职业。", "type": "industry", "relTime": "1周前"}, {"id": 107, "title": "GPT 图像生成质量大幅提升", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097664265419383216", "date": "2026-09-09T12:31:48.000Z", "summary": "用 GPT 也终于能吃上好的了😭  GPT Images 2.5|ZHOGUE|创意系列|ZHGO", "type": "paper", "relTime": "1周前"}, {"id": 108, "title": "OpenAI 发布 ChatGPT Images 2.5 双图像模型，主打更快生成与局部编辑", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/chatgpt-images-2-5-faster-more-precise-but-not-the-same-for-everyone", "date": "2026-09-09T12:17:58.000Z", "summary": "OpenAI 发布 ChatGPT Images 2.5，含 GPT-Image-2.5 Flare 和 GPT-Image-2.5 Sunburst 两个模型，主推更自然的光照、更可靠的参考图保留和局部编辑，Flare 延迟较 Images 2.0 降低最多 50%。", "type": "model", "relTime": "1周前"}, {"id": 109, "title": "Suno 发布用授权音乐训练的新模型 Suno v6，包含 base、wild、mini 三个版本", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/09/suno-replaces-its-ai-models-with-a-new-one-trained-on-licensed-music-as-copyright-suits-pile-up", "date": "2026-09-09T12:05:34.000Z", "summary": "Suno 发布新模型家族 Suno v6，称其使用 Warner Music Group、BMG、Believe 等授权数据训练，不使用训练旧版模型的数据。模型分三档：面向付费用户的 base 版更可控，付费用户可用的 wild 实验版用于获取意外结果，mini 版更快并对所有用户开放；新模型支持用提示词编辑歌曲片段、以文本图片或视频为参考生成曲目，并可分离乐器采样制作节拍。", "type": "model", "relTime": "1周前"}, {"id": 110, "title": "Meshy 工作流：从概念图到 Blender 可编辑场景", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2097654356531458228", "date": "2026-09-09T11:52:25.000Z", "summary": "一张概念图。你能在 Blender 里得到一个可编辑的场景吗？🧱  工作流如下：拆解 → GPT-6 规划各个部件 生成 → Meshy API 构建 12 个带纹理的资产 精修 → GPT-6 + Blender 调整比例与摆放 呈现 → 打光、30fps 转台展示", "type": "product", "relTime": "1周前"}, {"id": 111, "title": "Tripo+Astra 4小时造出可玩3D游戏", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2097640957907030280", "date": "2026-09-09T10:59:11.000Z", "summary": "用 Tripo 生成3D资产、Astra 编写 Three.js 游戏逻辑，4小时内做出一个完整可玩的3D小游戏，代码仅4685行、HTML文件约15MB。流程为 ChatGPT Image 2.5 出图→Tripo3D Smart Mesh 8K贴图导出GLB→自研转换器转Three.js→Astra 完成骨骼绑定、动画、地形、HUD与主菜单，除音效外几乎全部AI生成。", "type": "paper", "relTime": "1周前"}, {"id": 112, "title": "Suno 发布 v6 系列 AI 音乐模型，含 v6、v6-wild 和 v6-mini 三款", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/351.htm", "date": "2026-09-09T09:33:34.000Z", "summary": "Suno 推出 v6 系列 AI 音乐模型，包含 v6、v6-wild 和 v6-mini 三款，并与华纳音乐、BMG 等唱片公司达成合作。v6 主打旗舰，v6-wild 面向实验性音乐，仅 v6-mini 向免费用户开放，另两款需 Pro 或 Premier 订阅。生成速度更快，几秒即可出音乐，支持自然语言编辑歌曲片段、从多个音频源生成混音、单独提取采样，并可从音频或图片等多模态输入生成歌曲。", "type": "model", "relTime": "1周前"}, {"id": 113, "title": "万勋科技发布 NOVA2.0 柔性具身大脑，宣称行业首个开放世界全天候商业交付级具身智能架构", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/335.htm", "date": "2026-09-09T09:12:18.000Z", "summary": "万勋科技今日推出第二代柔性具身大脑 NOVA2.0，宣称是行业首个开放世界全天候商业交付级具身智能架构。该架构基于\"肌体智能\"理念，拥有触觉原生多模态分层架构，支持 1B+ 参数与 20 ms 极速轨迹生成，可适配柔性单臂、双臂、灵巧手等多种本体构型。官方称其已在 40+ 真实行业场景完成超 1000 万次极限工况作业。", "type": "paper", "relTime": "1周前"}, {"id": 114, "title": "GPT Image 2.5 动漫转真人仍显 AI 味", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097613016783344084", "date": "2026-09-09T09:08:09.000Z", "summary": "GPT Image 2.5 精准编辑能力出色，动漫转真人还原度高，但生成真人效果仍显油腻、AI 味浓。对比前代 GPT Image 2.0，其还原度虽好，真人质感依旧拉胯，被 Nano Banana Pro 明显超越。", "type": "paper", "relTime": "1周前"}, {"id": 115, "title": "GPT Img 2.5 个性表情包生成指南", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097592152113242550", "date": "2026-09-09T07:45:15.000Z", "summary": "GPT Img 2.5 风格参考与迁移能力增强，可生成个性化表情包，告别同质化风格。用户需注意参考素材的版权问题。作者分享了测试系列\"Elegant|ZHGO\"及提示词与参考图。", "type": "paper", "relTime": "1周前"}, {"id": 116, "title": "蚂蚁百灵 Ling 3.0 flash 获视觉升级", "source": "X：蚂蚁百灵 (@AntLingAGI)", "sourceUrl": "https://x.com/AntLingAGI/status/2097584809862394134", "date": "2026-09-09T07:16:04.000Z", "summary": "蚂蚁百灵（AntLingAGI）为 Ling 3.0 flash 加入视觉能力，可查看并分析图像。合作方 Atomic Chat 已推出 Ling 3.0 flash VL 的 GGUF 量化版本，支持本地运行，更多量化版本将陆续登陆边缘与终端设备。", "type": "paper", "relTime": "1周前"}, {"id": 117, "title": "蚂蚁百灵发布 Ling-3.0-flash-VL 多模态模型，SGLang 提供 Day-0 支持", "source": "X：蚂蚁百灵 (@AntLingAGI)", "sourceUrl": "https://x.com/AntLingAGI/status/2097583669926109550", "date": "2026-09-09T07:11:32.000Z", "summary": "蚂蚁百灵发布 Ling-3.0-flash-VL（124B/5.5B MoE），具备原生图像和视频理解与 1M 上下文窗口，SGLang 上线 Day-0 支持。模型采用 ViT 编码器加 MLP projector 的原生多模态方案、用于时空编码的 VideoRoPE，以及 42 层 KDA 加 Gated MLA 按 5：1 组成的混合骨干网络以支持 1M token 长上下文。", "type": "model", "relTime": "1周前"}, {"id": 118, "title": "QwenWork 上线多模态创作功能", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2097577314338918747", "date": "2026-09-09T06:46:17.000Z", "summary": "🎬 多模态创作现已在 QwenWork 上线。放入几张产品图片并告诉 QwenWork 你想要什么--它可以在一次对话中将其转化为可用于营销活动的产品视频、营销海报和原创配乐。无需切换工具，无需拼接工作流。只需带来创意，让 QwenWork 从原始素材到成品创意一气呵成。  👉 立即尝试：http://qwenwork.ai 了解更多：https://click.alibabacloud.c...", "type": "product", "relTime": "1周前"}, {"id": 119, "title": "GPT Images 2.5 实测：10轮后迷失但风格迁移惊艳", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097573152675316038", "date": "2026-09-09T06:29:45.000Z", "summary": "实测 GPT Images 2.5 会在 10 轮连续生成之后丢失任务/迷失自我  但这风格参考/迁移和设计能力简直夯爆了！  EleganCat|ZHGO|测试系列|GPT Images 2.5", "type": "paper", "relTime": "1周前"}, {"id": 120, "title": "GPT Images 2.5 风格参考能力大幅提升", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097548896969113663", "date": "2026-09-09T04:53:22.000Z", "summary": "GPT Images 2.5 的风格参考能力实现质的飞跃，配合 ChatGPT 内置手画板与参考图风格迁移，可生成高质量美图。中文用户通过 @绘图 即可打开手画板体验。", "type": "paper", "relTime": "1周前"}, {"id": 121, "title": "GPT Img 2.5 角色风格迁移实测：AI 味仍重", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097540972469215373", "date": "2026-09-09T04:21:52.000Z", "summary": "博主实测 GPT Images 2.5，角色特征迁移与风格夸张效果明显改善，噪点感和油腻感较上代减少。但生成结果仍带明显 AI 味，观感欠佳。", "type": "paper", "relTime": "1周前"}, {"id": 122, "title": "OpenAI 修复 ChatGPT 生图功能故障，持续约 7.5 小时", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/135.htm", "date": "2026-09-09T03:49:42.000Z", "summary": "OpenAI 官方状态页面显示，ChatGPT 和 Images API 的图像生成功能于北京时间 9 月 8 日 22：32 至 9 月 9 日 05：59 发生故障，持续约 7 小时 27 分钟。期间用户提交图像生成请求时出现更高频率错误，文件上传处理也受影响，部分文件停留在处理状态或直接失败。OpenAI 尚未披露故障的具体技术原因、受影响用户数量和预计恢复时间。", "type": "product", "relTime": "1周前"}, {"id": 123, "title": "消息称华为 Pura X View、Mate XT 2 非凡大师支持端侧本地大模型下载部署", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/103.htm", "date": "2026-09-09T03:37:43.000Z", "summary": "据博主 @超维界 透露，华为 Pura X View、Mate XT 2 非凡大师手机支持端侧本地大模型下载部署，可选多模态增强大模型（约 6GB）和多模态混合专家大模型（约 15GB）。两款模型均为端侧 AI，无网状态可用，前者支持本地图像生成、语音合成及相机 AI 超清增强等功能，后者为本地 MoE 大模型，可执行离线照片整理等复杂任务。", "type": "model", "relTime": "1周前"}, {"id": 124, "title": "SkyProduction 限免活动第二期：MiniMax H3 会员限时免费无限用", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI1MzE1NDc3Mg%3D%3D&mid=2247510280&idx=1&sn=ad53075e92be8b74c5db5d0a59f78d82", "date": "2026-09-09T03:30:14.000Z", "summary": "SkyProduction（天工工作台）9月9日至14日推出第二期限免活动，会员可免费无限使用自部署的 MiniMax H3 768P 模型。该通用多模态生成模型支持文生视频及参考图片、视频、音频联合生成，并输出原生立体声。平台同期提供剧本翻译、出海转绘、3D导演台及直出10分钟视频等短剧制作工具。", "type": "model", "relTime": "1周前"}, {"id": 125, "title": "京东云宣布与摩尔线程规划建设 10 万卡 AI 工厂", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/000/095.htm", "date": "2026-09-09T03:24:41.000Z", "summary": "在 2026 京东全球科技探索者大会上，京东云总裁曹鹏公布 AI 基建进展，京东云已与摩尔线程等打造国产万卡集群，并规划建设 10 万卡集群。数据方面京东云正推进 1，000 万小时数据采集，模型方面已形成覆盖多模态、世界模型和具身模型的 JoyAI 基础模型矩阵。摩尔线程张建中表示该 AI 工厂可用于训练大模型、生产词元和智能体，并希望服务各行业打造具身智能。", "type": "industry", "relTime": "1周前"}, {"id": 126, "title": "Tripo 生成 3D 肺模型，Astra 编写 Three.js 交互应用", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2097523134446674400", "date": "2026-09-09T03:11:00.000Z", "summary": "开发者用 Tripo 生成 3D 肺部模型，再由 GPT 6 Astra 直接处理该 glb 模型，借助 Three.js 添加 morph targets 并用 TSL shaders 实时展示吸烟对肺的影响。整个模型经 Meshopt 和 WebP 压缩了 84%，最终做成一个可交互的教育类 Web 应用。", "type": "model", "relTime": "1周前"}, {"id": 127, "title": "用 GPT Images 2.5 的手画板加参考图风格迁移出图", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097522787422535831", "date": "2026-09-09T03:09:37.000Z", "summary": "Zho 测试 GPT Images 2.5，配合 ChatGPT 内置手画板功能和参考图的风格迁移能力生成插画，图中展示手绘猫草图加参考海报生成风格化猫图的效果。作者转发 OpenAI 的说明，在 ChatGPT 输入 \"@ Sketch\" 即可使用手画板，中文用户通过 @绘图 打开。", "type": "tip", "relTime": "1周前"}, {"id": 128, "title": "蚂蚁百灵发布开源 Ling-3.0-flash-VL，首个原生多模态模型引入视觉反馈闭环", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/997.htm", "date": "2026-09-09T01:23:17.000Z", "summary": "蚂蚁集团发布并开源百灵系列首个原生多模态大模型 Ling-3.0-flash-VL。模型基于 Ling-3.0-flash 的 MoE 架构，总参数 124B、单次推理激活 5.5B，原生支持图像、文本与视频输入，上下文窗口 256K Token，并引入观察、行动、验证、修正的视觉反馈闭环机制。", "type": "model", "relTime": "1周前"}, {"id": 129, "title": "GPT images 2.5 初体验：设计效果对比", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2097494469193105898", "date": "2026-09-09T01:17:05.000Z", "summary": "ZHO 发布 GPT images 2.5 初见面测试，沿用经典设计系列提示词，并引用其一年前 GPT image 2 的生成效果作对比。引用推文显示，GPT 4o 当时已能产出\"绝美海报设计\"，此次 2.5 版本效果引发关注。", "type": "paper", "relTime": "1周前"}, {"id": 130, "title": "蚂蚁百灵开源首个原生多模态大模型 Ling-3.0-flash-VL", "source": "公众号：蚂蚁百灵（Ling）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkyODk2MDQwNw%3D%3D&mid=2247487806&idx=1&sn=a5593017ab8960be3d55614bb5a0b826", "date": "2026-09-09T01:00:00.000Z", "summary": "蚂蚁百灵发布并开源首个原生多模态大模型 Ling-3.0-flash-VL，基于 Ling-3.0-flash 的 MoE 架构，总参数 124B，单次推理激活 5.5B，原生支持图像、文本与视频输入，上下文窗口 256K Token。", "type": "model", "relTime": "1周前"}, {"id": 131, "title": "OpenAI 上线 GPT Image 2.5，作者实测新版与 image2 的生图差异", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247510824&idx=1&sn=025a8b7c5fec54d8a00c8632f55f8d98", "date": "2026-09-09T00:27:00.000Z", "summary": "OpenAI 上线 GPT Image 2.5，主打更快生成、更高清、多轮编辑一致性和区域标注精修，并新增涂鸦绘图与 15 个图片模版功能。API 同步发布 GPT-Image-2.5 Flare（速度提升 50%）和 GPT-Image-2.5 Sunburst（更高精度）。", "type": "product", "relTime": "1周前"}, {"id": 132, "title": "OpenAI 发布 ChatGPT Images 2.5 图像生成功能", "source": "X：Tibo (@thsottiaux)", "sourceUrl": "https://x.com/thsottiaux/status/2097476797298520292", "date": "2026-09-09T00:06:52.000Z", "summary": "OpenAI 发布 ChatGPT Images 2.5，主打更快、更清晰、更智能的图像生成。更新包括更快的生成速度、更自然可辨识的图像保真度、多次编辑间细节保持一致，以及通过评论式修改只改动想要的部分。", "type": "paper", "relTime": "1周前"}, {"id": 133, "title": "BestBlogs 早报：ChatGPT Images 2.5 与 MiniCPM5-2B 发布", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2097476246791922171", "date": "2026-09-09T00:04:41.000Z", "summary": "BestBlogs 早报汇总 09-09 要闻：OpenAI 推出 ChatGPT Images 2.5，每周生成超 30 亿张图片，延迟最高降低 50%；面壁智能开源 MiniCPM5-2B，以 2B 参数登顶 AA 榜单全球 4B 以下第一。另有 OpenAI 解决 Navier-Stokes 千年难题、Google DeepMind 发布 AlphaGenome Atlas 等动态。", "type": "model", "relTime": "1周前"}, {"id": 134, "title": "OpenAI 推 Images 2.5，Grok Bot 获委托，Claude 托管实践", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2097476201904472266", "date": "2026-09-09T00:04:30.000Z", "summary": "OpenAI 发布 ChatGPT Images 2.5，每周生成超 30 亿张图，延迟较 Images 2.0 最高降 50%，强化参考对象保持与局部编辑。Grok Bot 产品负责人复盘一个月打造可信 Agent 的委托体验。Claude 圆桌展示三家团队基于 Managed Agents 构建会议、销售与产品分析产品。", "type": "product", "relTime": "1周前"}, {"id": 135, "title": "视频为何仍然如此昂贵？视频与音视频 LLM 推理效率机制综述", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.10355", "date": "2026-09-09T00:00:00.000Z", "summary": "一篇综述系统梳理了 VideoLLM 的推理效率机制，按帧采样、模态编码、连接器 token 压缩、LLM 预填充与解码四个流水线阶段归类方法，覆盖 2022 年底以来的 VideoLLM 及更早的帧采样与视觉编码器机制。该综述汇总了共享宿主模型与输入协议下的精度-成本对比，并指出音视频效率与标准化评测方面的空白。", "type": "model", "relTime": "1周前"}, {"id": 136, "title": "Show-Harness：仅靠 VLM 智能体就能操控机器人", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.10522", "date": "2026-09-09T00:00:00.000Z", "summary": "Show-Harness 是一种 Embodied Harness，通过离散语义动作单元接口让 VLM 智能体直接\"玩\"机器人，无需额外模型容量或昂贵的具身预训练。", "type": "model", "relTime": "1周前"}, {"id": 137, "title": "Programmable World Model：将世界状态演化与视觉生成解耦的可编程世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.10540", "date": "2026-09-09T00:00:00.000Z", "summary": "Programmable World Model 将世界状态演化与视觉观察生成解耦，由智能体把自然语言指令翻译为可执行程序，指定实体状态与状态转移规则，再由轻量引擎维护包含屏幕外实体和非视觉属性的持久全局世界状态。", "type": "model", "relTime": "1周前"}, {"id": 138, "title": "Think Before You Link：多语言多模态实体链接中的稀有性、推理与检索", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.10745", "date": "2026-09-09T00:00:00.000Z", "summary": "研究者提出免训练框架，让具备推理能力的视觉语言模型在 Wikipedia 上迭代搜索并推理，以解决多语言多模态实体链接中的稀有实体失败问题。在覆盖 Hindi、Indonesian、Japanese、Tamil、Vietnamese 五语言的 MERLIN 基准上，最佳系统（8B-Think+Embed）整体超越 SOTA 6.9%，在最难稀有实体切片上提升达 23.3%。", "type": "model", "relTime": "1周前"}, {"id": 139, "title": "OpenRouter 评测 Seedance 2.5：长镜头与已有素材编辑的场景及成本解析", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/insights/seedance-2-5-review", "date": "2026-09-09T00:00:00.000Z", "summary": "OpenRouter 发布对 ByteDance Seedance 2.5 视频模型的评测，该模型自 2026 年 8 月 7 日上线其视频 API，生成 4 到 30 秒、480p 或 720p 的片段，支持图像、视频、音频引用和首尾帧控制，音频同趟生成不加价。", "type": "tip", "relTime": "1周前"}, {"id": 140, "title": "OpenAI 发布 ChatGPT Images 2.5 生图模型，延迟降低 50% 并新增 Sketch 草图功能", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/967.htm", "date": "2026-09-08T23:52:06.000Z", "summary": "OpenAI 9 月 9 日发布 ChatGPT Images 2.5，图像生成延迟最多降低 50%，新增 Sketch 草图参考、模板库、图片内评论标注等功能，为当前最先进的图像生成模型。DeepSeek 宣布将于 9 月 10 日 12 时起下调 Flash 系列模型价格，输出价格调整为每百万 Token 4 元。", "type": "model", "relTime": "1周前"}, {"id": 141, "title": "OpenAI 发布 ChatGPT Images 2.5，延迟降低 50% 并新增 Sketch 草图", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/956.htm", "date": "2026-09-08T23:00:42.000Z", "summary": "OpenAI 于 9 月 9 日发布图像生成模型 ChatGPT Images 2.5，在细节锐度、自然光照和纹理提升的同时，延迟较 2026 年 4 月的 Images 2 最多降低 50%。", "type": "model", "relTime": "1周前"}, {"id": 142, "title": "OpenAI 发布 ChatGPT Images 2.5 图像生成模型", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/8/introducing-chatgpt-images-25", "date": "2026-09-08T22:46:33.000Z", "summary": "OpenAI 推出 ChatGPT Images 2.5，官方称其图像模型已在 ChatGPT Images 和 API 的 GPT-Image 模型中生成超过 30 亿张图片。", "type": "model", "relTime": "1周前"}, {"id": 143, "title": "StealthGPT 发布 Super 新一代 AI 人性化改写模型", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2097425742959349988", "date": "2026-09-08T20:44:00.000Z", "summary": "StealthGPT 发布全新 AI 人性化改写模型 Super，从底层重构以针对最新一代 AI 检测器。Super 通过重写 AI 生成文本的结构、节奏和措辞，同时保留原意与可读性。StealthGPT 称，Super 能持续绕过 Pangram 检测，且不出现常见的人性化改写质量下降问题。", "type": "model", "relTime": "1周前"}, {"id": 144, "title": "OpenAI 发布 ChatGPT Images 2.5，新增 Sketch 涂鸦生图功能", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/991727/openai-chatgpt-images-2-5-sketch", "date": "2026-09-08T20:16:09.000Z", "summary": "OpenAI 于周二发布 ChatGPT Images 2.5，并推出新功能 Sketch，用户在聊天框输入 @Sketch 即可弹窗手绘涂鸦，再让 ChatGPT 依草图生成图像，还能直接在图片局部留言修改。", "type": "paper", "relTime": "1周前"}, {"id": 145, "title": "Krea AI 上线 GPT Images 2.5，真实感与编辑一致性提升", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2097418604715348236", "date": "2026-09-08T20:15:38.000Z", "summary": "Krea AI 宣布推出 GPT Images 2.5 图像生成模型。新版本带来更强的真实感、一致的编辑能力和更快的生成速度，用户可立即试用。", "type": "model", "relTime": "1周前"}, {"id": 146, "title": "Inception 扩散大语言模型 Mercury 2.5 在 OpenRouter 全面开放", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2097405053942563057", "date": "2026-09-08T19:21:47.000Z", "summary": "Inception 的 Mercury 2.5 现已在 OpenRouter 全面可用，地址为 https://openrouter.ai/inception/mercury-2.5。它是一个扩散式大语言模型，可并行解码 token 而非逐个生成，是 OpenRouter 最快模型榜单上无需专用硬件的最快模型，在代码密集型提示上收益最大。", "type": "model", "relTime": "1周前"}, {"id": 147, "title": "OpenAI 推出 ChatGPT Images 2.5，图像生成更快更准", "source": "X：Greg Brockman (@gdb)", "sourceUrl": "https://x.com/gdb/status/2097400146220740627", "date": "2026-09-08T19:02:17.000Z", "summary": "OpenAI 推出 ChatGPT Images 2.5，重点提升图像生成速度和保真度，使图像更自然、更可辨识。新版本还支持多次编辑中保持细节一致，并新增评论式修改，只改动用户指定的部分。Greg Brockman 转发了该发布公告。", "type": "paper", "relTime": "1周前"}, {"id": 148, "title": "OpenAI 宣布 ChatGPT Images 2.5 升级，同时推出 Sketch 画图功能", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2097399767915499797", "date": "2026-09-08T19:00:47.000Z", "summary": "OpenAI 宣布 ChatGPT Images 2.5 升级，带来更快的输出、更好的保真度以及代与代之间更强的生成一致性。同期刊发的官方推文介绍 Sketch 功能，用户在 ChatGPT 中输入 \"@ Sketch\" 即可手绘草图，把脑中的想法直观展示给模型。", "type": "model", "relTime": "1周前"}, {"id": 149, "title": "OpenAI 发布 ChatGPT Images 2.5，图像生成更快更清晰", "source": "X：OpenAI (@OpenAI)", "sourceUrl": "https://x.com/OpenAI/status/2097394956457623964", "date": "2026-09-08T18:41:39.000Z", "summary": "OpenAI 发布 ChatGPT Images 2.5，官方称图像生成更快、更清晰、更智能。改进包括提升生成速度、更自然可辨识的图像保真度、多次编辑间保持细节一致，以及支持基于评论的编辑，只改动想改的部分。", "type": "paper", "relTime": "1周前"}, {"id": 150, "title": "OpenAI 用上万智能体求解 Navier-Stokes 千禧年大奖难题", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2097389034230501620", "date": "2026-09-08T18:18:08.000Z", "summary": "OpenAI 宣布给出 Navier-Stokes 千禧年大奖难题的一个解，证明由一组智能体使用一个显著强于 GPT-6 Astra 的下一代模型生成，该问题关于光滑三维流体运动是否会崩溃，已悬置约 90 年。", "type": "paper", "relTime": "1周前"}, {"id": 151, "title": "Google 更新 AI 天气模型 WeatherNext 3，提升预报准确度", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/science/2026/09/googles-ai-weather-model-now-uses-more-raw-satellite-data", "date": "2026-09-08T18:00:56.000Z", "summary": "Google 发布 WeatherNext 模型第 3 版，最大变化是开始纳入部分卫星天气数据，缩短了从当前天气状况到生成新预报之间的滞后时间。该模型在保持与传统模型相近预报性能的同时，所需算力大幅降低，可更频繁运行。更新细节已在一份白皮书中公布。", "type": "model", "relTime": "1周前"}, {"id": 152, "title": "Krea 推出 Realtime Director 实时导演工具", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2097383941380694430", "date": "2026-09-08T17:57:53.000Z", "summary": "推出 Realtime Director。  这款新工具可让你实时导演高质量视频生成。  由 @fal 的 H3 Max 提供支持。", "type": "paper", "relTime": "1周前"}, {"id": 153, "title": "OpenAI 称用智能体组合和强于 GPT-6 Astra 的下一代模型给出 Navier-Stokes 千禧年难题解法", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2097377214941597729", "date": "2026-09-08T17:31:10.000Z", "summary": "OpenAI 宣布给出 Navier-Stokes 千禧年大奖难题的一个解法，证明由一组智能体使用一个 OpenAI 下一代模型完成，官方称该模型能力显著强于 GPT-6 Astra。该问题关注 Navier-Stokes 方程描述的三维光滑流体运动是否会失解，约 90 年未决。Elvis Saravia 转发并评论称，若 GPT-6 Astra 已有此水平，下一代模型值得期待。", "type": "paper", "relTime": "1周前"}, {"id": 154, "title": "TestingCatalog 转述 OpenAI 宣布智能体团队解决 Navier-Stokes 千禧年大奖难题", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2097375715704340707", "date": "2026-09-08T17:25:12.000Z", "summary": "TestingCatalog 转述 OpenAI 官方宣布：一组由其下一代模型驱动的智能体给出了 Navier-Stokes 千禧年大奖难题的解。OpenAI 称该模型能力显著强于 GPT-6 Astra；该问题关乎 Navier-Stokes 方程描述的三维光滑流体运动是否会崩溃，约 90 年未获解决。作者附加评语 Level 4 - Innovators。", "type": "tip", "relTime": "1周前"}, {"id": 155, "title": "S1 机器人基础模型：提示词可操控性演示", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2097372419988263383", "date": "2026-09-08T17:12:06.000Z", "summary": "Skild AI 的机器人基础模型 S1 仅需 1 个视频示例即可学习新任务，并通过视频提示词操控行为。在相同厨房环境中，S1 能依据 4 种不同视频指令执行相应动作序列，包括\"将盘子放入烤面包机\"这类分布外任务。该能力决定新任务是否需要重新训练，或成机器人基础模型最具经济价值的特性。", "type": "model", "relTime": "1周前"}, {"id": 156, "title": "作者发布浏览器端 LLM 注意力权重可视化工具", "source": "Hacker News：AI 热帖", "sourceUrl": "https://ishamf.dev/p/llm-attention-visualizer", "date": "2026-09-08T16:59:41.000Z", "summary": "作者发布一个基于 Transformers.js 的 LLM 注意力可视化工具，可悬停查看生成 token 依赖的历史 token，代码开在 GitHub。可视化将所有层、所有注意力头的注意力权重乘以 value 向量模长后聚合为单一数值控制透明度，并预生成提示词避免下载数百 MB 模型；作者还通过修改 onnx 文件暴露内部值，上传到自己的 Hugging Face 仓库供浏览器生成使用。", "type": "tip", "relTime": "1周前"}, {"id": 157, "title": "蚂蚁百灵开源 Ling-3.0-flash-VL 多模态模型", "source": "X：蚂蚁百灵 (@AntLingAGI)", "sourceUrl": "https://x.com/AntLingAGI/status/2097359640233439299", "date": "2026-09-08T16:21:19.000Z", "summary": "蚂蚁百灵今日开源 Ling-3.0-flash-VL，提供 BF16 和 FP8 权重，FP4 和 INT4 版本即将推出。该模型除视觉识别外，还能理解图像、视频、文档与 UI，按视觉线索进行推理、搜索与验证，并可使用工具、检查结果并交付结果。", "type": "model", "relTime": "1周前"}, {"id": 158, "title": "PFN 与 PFR 共同开发室内移动机器人环境理解基座模型 PLaMo-SemGround", "source": "Preferred Networks：AI 研究与产品", "sourceUrl": "https://www.preferred.jp/ja/news/pr20260909", "date": "2026-09-08T16:00:00.000Z", "summary": "Preferred Networks（PFN）与 Preferred Robotics（PFR）宣布共同开发室内移动机器人环境高度理解基座模型 PLaMo-SemGround，参数规模在 2B 级以下，可从自然语言、RGB 图像和深度信息中理解可行驶/禁行区域及复杂作业条件。", "type": "model", "relTime": "1周前"}, {"id": 159, "title": "NVIDIA Dynamo 何时该用 Encode-Prefill-Decode 分离加速多模态模型服务", "source": "NVIDIA Technical Blog：Agentic AI / Generative AI", "sourceUrl": "https://developer.nvidia.com/blog/when-to-use-encode-prefill-decode-disaggregation-to-accelerate-multimodal-model-serving", "date": "2026-09-08T16:00:00.000Z", "summary": "NVIDIA 详解在 Dynamo 推理框架中用 encode-prefill-decode（EPD）分离加速多模态模型服务：把视觉编码器与 prefill、decode 拆成可独立扩缩的 worker，图像密集提示词下 TTFT 最高快 5 倍、端到端响应最高快 7 倍。", "type": "model", "relTime": "1周前"}, {"id": 160, "title": "宇树G1机器人格斗演示：快速反应惊艳", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2097339184948076674", "date": "2026-09-08T15:00:03.000Z", "summary": "中国的机器人格斗场景刚刚升级了。一段新演示显示，宇树科技的G1机器人能够连贯执行动作并以惊人速度做出反应。其世界模型读取视觉输入，预测接下来会发生什么，并从预定义动作库中选择最佳响应。G1仍无法自主规划新动作。但说实话，机器人格斗正是从这里开始变得令人兴奋：虽尚未完全智能，但已经足够快速、灵敏，让人难以忽视。", "type": "model", "relTime": "1周前"}, {"id": 161, "title": "Tripo 与 GPT-6 Astra 两小时打造浏览器 3D 街机", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2097339176094195899", "date": "2026-09-08T15:00:00.000Z", "summary": "我们在浏览器里直接搭了一个复古 3D 街机。  从空白画布到可运行的游戏，只用了 2 小时。  技术栈：Tripo 生成 3D 资产，GPT-6 Astra 负责 Three.js 动画和游戏逻辑。  最终，3D 硬件不只是陈列的静态物件--它是进入游戏的实际入口。  链接和提示词见下方 ↓", "type": "paper", "relTime": "1周前"}, {"id": 162, "title": "OpenAI Astra 通关 48 关《我不是机器人》游戏引出人机验证失效之辩", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2097332900265934869", "date": "2026-09-08T14:35:04.000Z", "summary": "OpenAI 发布 4 天的 Astra 看屏幕、挪鼠标、点拖拽，打完 48 关《我不是机器人》讽刺游戏并取得人类证书。作者提醒同一套能力在官方安全报告中被标为网络安全最高危档，认为 GUI 成为模型天然 API 后，不愿交出人脸、指纹和硬件密钥的普通人反而会被系统当成可疑假人。", "type": "tip", "relTime": "1周前"}, {"id": 163, "title": "字节跳动拟推Seedance空间视频模型", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2097330053944377546", "date": "2026-09-08T14:23:46.000Z", "summary": "据彭博社报道，字节跳动正准备最快于下月推出一款基于Seedance的空间视频模型。创始人张一鸣亲自督办该项目，不过计划仍可能有变。该模型将创建可交互的3D世界，能够响应Pico用户的语音和动作。据称输出可达20fps，延迟0.05秒。云端生成可降低头显设备要求，将与Google、Meta和Apple的竞争转向AI模型、算力和内容层面。", "type": "model", "relTime": "1周前"}, {"id": 164, "title": "发布仅 4 天的 Astra 模型通关\"我不是机器人\"全部 48 关", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2097329116995363134", "date": "2026-09-08T14:20:02.000Z", "summary": "作者转述：发布仅 4 天的模型 Astra 通关了\"我不是机器人\"游戏全部 48 关，全程约 2 小时的过程被压成 3 分半一镜到底视频，证书名字栏填的是它自己。对比来看，人类自己打完这 48 关通常要 30 到 60 分钟，作者称通关率约百分之一。", "type": "tip", "relTime": "1周前"}, {"id": 165, "title": "Adobe Premiere 更新 AI 功能，时间线上可直接生成音视频素材", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/926.htm", "date": "2026-09-08T13:21:33.000Z", "summary": "Adobe 宣布重新设计 Premiere 的 AI 交互，新的生成式媒体工具支持在时间线空白区域直接生成视频、音效、音乐和声景，无需切换应用。时间线可调用 Adobe Firefly、谷歌 Veo、Runway、Luma 和可灵等多种底层模型。", "type": "model", "relTime": "1周前"}, {"id": 166, "title": "Premiere 推出 Generative Media 工具，可在时间线内直接生成视频和音频", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/991133/adobe-is-trying-to-make-its-ai-generators-idiot-proof-in-premiere", "date": "2026-09-08T13:00:00.000Z", "summary": "Adobe 为 Premiere 推出 Generative Media 工具，编辑可在项目时间线内高亮空缺直接生成视频、音效、音乐和声景，无需离开项目。", "type": "paper", "relTime": "1周前"}, {"id": 167, "title": "OpenAI 发布 ChatGPT Images 2.5 图像模型", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "sourceUrl": "https://openai.com/index/introducing-chatgpt-images-2-5", "date": "2026-09-08T11:30:00.000Z", "summary": "OpenAI 发布 ChatGPT Images 2.5 图像模型，生成延迟比 Images 2.0 降低最多 50%，细节、编辑精度、参考照片保真度和多轮编辑一致性均有提升。", "type": "model", "relTime": "1周前"}, {"id": 168, "title": "inclusionAI 发布 Ling-3.0-flash-VL-int4 模型", "source": "蚂蚁 inclusionAI：HuggingFace 新模型", "sourceUrl": "https://huggingface.co/inclusionAI/Ling-3.0-flash-VL-int4", "date": "2026-09-08T10:22:40.000Z", "summary": "inclusionAI 在 HuggingFace 发布 Ling-3.0-flash-VL-int4 模型。该模型为视觉语言模型的 int4 量化版本，具体参数规模、上下文长度与性能基准未在页面中披露。目前该模型页面因访问限制仅显示错误提示，需创建或登录 HuggingFace 账号并配置 HF_TOKEN 方可查看详情。", "type": "model", "relTime": "1周前"}, {"id": 169, "title": "inclusionAI 发布 Ling-3.0-flash-VL-fp4 模型", "source": "蚂蚁 inclusionAI：HuggingFace 新模型", "sourceUrl": "https://huggingface.co/inclusionAI/Ling-3.0-flash-VL-fp4", "date": "2026-09-08T10:22:02.000Z", "summary": "inclusionAI 在 HuggingFace 发布 Ling-3.0-flash-VL-fp4 模型。该模型为 fp4 精度版本，属于 Ling-3.0-flash 系列的多模态视觉语言模型。目前该模型页面因访问量过大触发限流，用户需创建或登录 HuggingFace 账号，并在使用 API 时提供 HF_TOKEN 方可继续访问。", "type": "model", "relTime": "1周前"}, {"id": 170, "title": "新石器无人车落地韩国济州岛，首度在当地户外度假场景实现运营", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/760.htm", "date": "2026-09-08T07:41:23.000Z", "summary": "新石器联合韩国自动驾驶企业 NT1 及济州岛 Campertree（香樟树）酒店，令无人配送车首次在韩国户外度假场景投入运营。该车可在度假村内部公开道路自主行驶，承担客房配送与行李运送，并通过视觉感知与端到端神经网络技术实现全链路自动驾驶。此前新石器已于 2025 年 7 月与仁川市政府签署试点意向书，成为首家进入韩国市场的中国 L4 级无人配送企业。", "type": "paper", "relTime": "1周前"}, {"id": 171, "title": "Meshy 与 GPT-6 Astra 工作流对比", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2097157974154428437", "date": "2026-09-08T02:59:59.000Z", "summary": "两条流水线，同一个需求，同一个主角。🦸♀️  左：仅用 GPT-6 Astra：需求 + 参考 → Blender Python → 角色、武器、场景  右：Meshy + GPT-6 Astra：输入图像 → Meshy 生成主角 → Astra 组装 → Meshy 绑定骨骼 + 跑步循环  GPT-6 Astra 是很强的构建者。Meshy 给它值得构建的东西。  把它们配对，看看工作...", "type": "paper", "relTime": "1周前"}, {"id": 172, "title": "微信开源多模态嵌入模型 WeMM-Embedding，已在微信大规模使用且日调用量达 10 亿次", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/527.htm", "date": "2026-09-08T01:02:16.000Z", "summary": "微信 AI 于 9 月 4 日宣布开源通用多模态嵌入模型 WeMM-Embedding，包含 2B、4B、9B 三个版本，支持文本、图像、视频、视觉文档及任意交错的多模态输入。", "type": "model", "relTime": "1周前"}, {"id": 173, "title": "Meshy 转发实测：用 Claude Code 加 Meshy 制作四个绑定动画 3D 皮肤的全流程", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2097128314351882373", "date": "2026-09-08T01:02:07.000Z", "summary": "@thehypedotnews 用一次 Claude Code 会话（opus 5 medium）配合 gpt-5.4-image-2 和 Meshy pro，无 3D 美术手工建模做出四个 AI CEO 的 Fortnite 概念皮肤，四个角色 API 花费 $12.94。", "type": "tip", "relTime": "1周前"}, {"id": 174, "title": "NOAH：学习完整患者病程的多模态时间感知生成模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.09140", "date": "2026-09-08T00:00:00.000Z", "summary": "NOAH 是一个时间感知、任务无关的生成式 Transformer 模型，用于表征和预测完整的多模态患者病程。该模型基于 MIMIC 数据集家族中 29.9 万名患者的 43.1 万次住院产生的超 5.59 亿条临床事件训练，原生处理医学影像、时间序列、数值信号、分类事件及结构化与非结构化临床记录。", "type": "model", "relTime": "1周前"}, {"id": 175, "title": "Marigold V2：用扩散Transformer重做单目深度估计", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.08084", "date": "2026-09-08T00:00:00.000Z", "summary": "Marigold V2 提出基于扩散Transformer（DiT）架构的单目深度估计新方法，支持从预训练多步流匹配模型单步推理，并可按需量化以降低运行成本。通过将模型内部表征与真实语义特征对齐、采用基于新型Sinkhorn损失的两阶段微调协议，模型在KITTI和ETH3D上的AbsRel较此前最优结果提升16-26%，并能清晰还原皮毛、 foliage 等细薄边缘。", "type": "model", "relTime": "1周前"}, {"id": 176, "title": "CoVeR：面向 VLM 多视图 3D 推理的基于覆盖率的 token 剪枝方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.08345", "date": "2026-09-08T00:00:00.000Z", "summary": "CoVeR 是一种无需训练的确定性视觉 token 选择器，仅利用 token 坐标实现场景全覆盖，以解决多视图 3D 推理中现有剪枝方法的冗余与预算限制问题。在三个 3D 推理基准上，CoVeR 均超越此前 SOTA，并可作为即插即用模块适配四种 VLM。仅保留约 8% 的视觉 token，即可维持全量 token 93.5% 的性能，平均超出 SOTA 3.9 个百分点。", "type": "paper", "relTime": "1周前"}, {"id": 177, "title": "TANGO：面向杂乱环境的全身视觉-语言-动作人形机器人导航框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.09158", "date": "2026-09-08T00:00:00.000Z", "summary": "TANGO 提出首个面向杂乱环境的全身视觉-语言导航框架，支持语言指令下的人形机器人穿越复杂 3D 空间。该模型直接预测 29-DoF 关节空间动作，完全在仿真中训练，通过全局路径规划、运动编辑与 RL 跟踪合成无碰撞行为。TANGO 在仿真中达到 SOTA 性能，并零样本部署至 Unitree G1 人形机器人，无需真实导航数据即可实现稳健的语言引导穿越。", "type": "model", "relTime": "1周前"}, {"id": 178, "title": "Mask Forcing：通过双噪声掩码滚动提升自回归视频扩散蒸馏质量", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.09123", "date": "2026-09-08T00:00:00.000Z", "summary": "针对自回归视频扩散模型在分布匹配蒸馏中因逆向KL目标导致模式坍缩、生成视频过饱和与过平滑的问题，研究者提出Mask Forcing策略。该方法在自回归学生模型自滚动过程中沿空间与时间轴注入随机掩码，以引入更干净的信号并缓解模式坍缩。实验表明，该方法能高效提升多种自回归视频扩散蒸馏方法的视觉质量，且无需真实视频数据或额外后训练阶段。", "type": "model", "relTime": "1周前"}, {"id": 179, "title": "PlannerForge：面向自动驾驶运动规划器的LLM智能体场景测试框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.08965", "date": "2026-09-08T00:00:00.000Z", "summary": "PlannerForge 是一个 LLM 智能体框架，覆盖从场景生成到 ADS 评估的全部场景测试阶段，并新增 ADS 增强与 ADS 基准测试两个环节。在 10 个现成 LLM、5 种提示条件下，各任务最佳得分为 0.88-1.00，开源 20-35B 后端在多数任务上追平商业 API。", "type": "model", "relTime": "1周前"}, {"id": 180, "title": "亚马逊FAR团队研究统一多模态模型中图像tokenizer作为视觉语言", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.09143", "date": "2026-09-08T00:00:00.000Z", "summary": "亚马逊FAR团队以Qwen3为语言骨干构建纯自回归多模态持续预训练测试平台，按任务分别追踪文本、图像、T2I和I2T验证损失。结果显示各任务损失缩放规律不同、对tokenizer排序也不同，固定tokenizer时T2I损失与生成质量相关，而基于共享文本词表的I2T损失信号更一致，还能在监督微调后同时关联生成与视觉理解表现。", "type": "model", "relTime": "1周前"}, {"id": 181, "title": "今天的一个想法， 文本大模型与视频大模型定位的拐点到来了， 这两种模型之前看上去不存在上下游关系， 但是现在变成了\"显式符号/几何模拟（3D引擎 + 符号逻辑）\" →\"隐式统计生成（像素级视频生成扩散…", "source": "X：karminski (@karminski3)", "sourceUrl": "https://x.com/karminski3/status/2097043972640420167", "date": "2026-09-07T19:26:58.000Z", "summary": "暂无摘要", "type": "model", "relTime": "1周前"}, {"id": 182, "title": "Unitree 发布首个世界模型驱动的自主人形机器人格斗视频 UnifoLM-X2-1.0", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2097023203231297887", "date": "2026-09-07T18:04:27.000Z", "summary": "Unitree 发布首个由世界模型驱动的自主人形机器人格斗视频，UnifoLM-X2-1.0 通过实时预测与规划取代人类操作员。相比现有 G1-Boxing 方案，世界模型在机器人行动前预测物理交互的走向，为策略提供决策依据；格斗等场景中延迟至关重要，Unitree 称 X2-1.0 可实时运行该循环。", "type": "model", "relTime": "1周前"}, {"id": 183, "title": "GPT-6 Astra 可视化热门 AI 论文测试", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2097009154963419528", "date": "2026-09-07T17:08:37.000Z", "summary": "在 GPT-6 Astra 上测试可视化热门 AI 论文。  从这篇精美生成的 Transformer 论文交互式版本开始。  这为探索研究开启了新方式。", "type": "paper", "relTime": "1周前"}, {"id": 184, "title": "NVIDIA Sol 团队发布 Sol-H3，MiniMax-H3 视频生成速度超过播放速度", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2097006566696444363", "date": "2026-09-07T16:58:20.000Z", "summary": "NVIDIA Sol 团队与 MiniMax 合作发布 Sol-H3 端到端推理加速栈，在 8× NVIDIA B300 Blackwell 上生成 5 秒 1344×768 立体声视频仅需 1.653 秒，相比 50 步 Base H3 最高提速 15.54×，且在 1×、4×、8× B300 上均可扩展。", "type": "paper", "relTime": "1周前"}, {"id": 185, "title": "GPT 6 Astra 实测解决真实世界问题", "source": "X：Greg Brockman (@gdb)", "sourceUrl": "https://x.com/gdb/status/2096998038443348263", "date": "2026-09-07T16:24:27.000Z", "summary": "GPT 6 Astra （Ultra） 通过约4分钟视频理解用户描述的浴室排水管缠发问题，提取语音并匹配测量画面，提出改进方案。它使用计算机操作在 Fusion 360 中实时设计出全参数化零件，用户 3D 打印后首次尝试即完美适配，称其为\"接触 AGI 的时刻\"。", "type": "paper", "relTime": "1周前"}, {"id": 186, "title": "Astra 视觉优势助其社交媒体胜出", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2096997239281385549", "date": "2026-09-07T16:21:16.000Z", "summary": "我认为这不是最初的目标，但 Astra 在视觉美观的 3D 作品（如 Blender 等）方面表现出色，这使它在社交媒体注意力之争中比 Fable 更具感知优势。其他类型的输出更难评判，但视觉内容的效果一目了然。", "type": "paper", "relTime": "1周前"}, {"id": 187, "title": "Gemini 也能生成毒舌机器人了", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2096994065497649521", "date": "2026-09-07T16:08:40.000Z", "summary": "Gemini 现在也能做出毒舌机器人了 💅", "type": "paper", "relTime": "1周前"}, {"id": 188, "title": "Runway 推出 Adobe 插件，Premiere Pro 和 After Effects 内可直接生成和编辑", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/company-news/runway-for-adobe", "date": "2026-09-07T16:00:00.000Z", "summary": "Runway 发布 Runway Plugins，面板可直接嵌入 Premiere Pro 和 After Effects，无需导出导入即可在时间线内生成图像和视频、重渲染片段并一键放置结果。", "type": "paper", "relTime": "1周前"}, {"id": 189, "title": "消息称字节跳动开发实时空间视频生成 AI 模型，张一鸣亲自督导，最快下月发布", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/478.htm", "date": "2026-09-07T13:51:53.000Z", "summary": "据彭博社报道，字节跳动正开发实时空间视频生成 AI 模型，创始人张一鸣亲自督导研发，计划最早下月发布，发布时间尚未最终确定。该模型基于电影级视频生成模型 Seedance 构建，面向直播、短剧和游戏创建交互式虚拟世界，可在每秒 20 帧帧率下以约 50 毫秒延迟按需生成视频流，响应 Pico 头显用户的语音或动作。", "type": "industry", "relTime": "1周前"}, {"id": 190, "title": "宇树发布 UnifoLM-X2-1.0，实现世界模型驱动的全自主人形机器人格斗", "source": "X：宇树 Unitree (@UnitreeRobotics)", "sourceUrl": "https://x.com/UnitreeRobotics/status/2096932273602048258", "date": "2026-09-07T12:03:07.000Z", "summary": "宇树发布 UnifoLM-X2-1.0，称其实现全球首个实时世界模型驱动的全自主人形机器人格斗。该模型突破世界动作基础模型在即时规划、决策和动态交互执行上的瓶颈，具备高动态、强交互和实时预测规划能力，宇树认为这验证了世界模型驱动人形机器人大规模部署的基础可行性。", "type": "model", "relTime": "1周前"}, {"id": 191, "title": "京东 JoyAI App 推出首个能实时视频购物的 AI 数字人", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/415.htm", "date": "2026-09-07T10:46:50.000Z", "summary": "京东 JoyAI App 推出可实时视频购物的 AI 数字人，通过\"万能博士\"在视频通话内实时解析商品画面、调取京东商品并直接下单，全程不切换 App。用户上传一张图片即可自定义数字人形象、人设、音色和交互场景，数字人还支持点外卖、订酒店、健康咨询、金融咨询等服务，支付环节搭载京东 AI 付声纹验证。今年以来 JoyAI App 对话用户数增速超过 15 倍。", "type": "product", "relTime": "1周前"}, {"id": 192, "title": "实时视频生成来临：下一个应用爆发的机会", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/crossing/the-next-big-app-opportunity-when-real-time-video-generation", "date": "2026-09-07T09:05:00.000Z", "summary": "实时视频生成技术正走向成熟，被视为下一个应用爆发的关键机会。该技术有望大幅降低视频制作门槛，推动内容创作、互动娱乐等领域出现新形态产品。行业正密切关注其落地节奏与商业化潜力。", "type": "product", "relTime": "1周前"}, {"id": 193, "title": "最高法发布涉人工智能纠纷案件审理意见，明确 AI 换脸拟声等裁判规则", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/999/313.htm", "date": "2026-09-07T07:46:08.000Z", "summary": "最高人民法院发布《关于依法审理涉人工智能纠纷案件的意见》，共 5 部分 24 条，明确 AI 换脸拟声、AI 复活逝者、大数据杀熟、仿冒名人带货、网络开盒及自动驾驶事故等情形的裁判规则。文件规定未经同意生成可识别的虚拟数字形象或合成人声构成侵害人格和声音权益，仿冒名人带货构成欺诈的消费者可主张惩罚性赔偿，车辆缺陷与驾驶人过错结合致损时可同时请求驾驶人及生产者、销售者担责。", "type": "industry", "relTime": "1周前"}, {"id": 194, "title": "Tripo 推广收录 153+ 个 GPT Astra 提示词的 3D 工作流合集", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2096814453933371669", "date": "2026-09-07T04:14:57.000Z", "summary": "Tripo 官方推荐一个将 GPT Astra 与 Tripo 3D 资产生成结合的提示词合集，已收录 153+ 个提示词并每日更新，精选 3D、游戏案例，入口为 https://www.tripo3d.ai/3d-prompts。该合集由 @jaredliu_bravo 整理，部分案例据称可 one shot 直出效果。", "type": "tip", "relTime": "1周前"}, {"id": 195, "title": "UCF-Net：融合CLIP与DINO的不确定性感知级联融合网络，提升Deepfake图像检测泛化能力", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.07670", "date": "2026-09-07T00:00:00.000Z", "summary": "UCF-Net提出一种不确定性感知级联融合网络，结合CLIP的语义先验与DINO的自监督视觉结构先验，通过跨Transformer层级的特征提取、分层专家聚合及基于熵的加权融合，提升对未见伪造图像的检测泛化能力。", "type": "paper", "relTime": "1周前"}, {"id": 196, "title": "RelightFormer：用于多视角物体重打光的自回归生成式Transformer", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.07414", "date": "2026-09-07T00:00:00.000Z", "summary": "RelightFormer是一种前馈生成式Transformer，可直接对单视角和多视角图像进行重打光，绕过了显式的固有属性估计。该架构从视频基础模型适配而来，通过潜在光照模块和置换不变位置编码处理无序多视角输入。研究团队构建了包含90K物体和39K种独特光照的Laval Objaverse数据集（LOD），实验显示其在单视角、多视角及新视角重打光任务上达到SOTA视觉质量并具备强零样本泛化能力。", "type": "model", "relTime": "1周前"}, {"id": 197, "title": "为 Cosmos3 视觉-语言-动作策略加入希腊语：语言迁移测量研究", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.07470", "date": "2026-09-07T00:00:00.000Z", "summary": "一项研究尝试为 Cosmos3 视觉-语言-动作策略加入希腊语，发现机器翻译演示数据容易，但验证效果极难，五种常用评测工具均误报成功。研究确认目标语言演示数据必要但不充分：双语策略在九十任务上对希腊语的跟随率约为英语的五分之二，且从语言适配的世界模型热启动或解冻文本塔均使效果更差。", "type": "model", "relTime": "1周前"}, {"id": 198, "title": "ReactVAU：面向流式视频异常理解的慢-快解耦框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.07941", "date": "2026-09-07T00:00:00.000Z", "summary": "ReactVAU提出一种慢-快解耦框架，用于实时流式视频异常理解（VAU）。其轻量级快检测模块基于Spatial Grid Folding（SGF）持续过滤异常，异常感知持久记忆（AAPM）保护关键视觉线索，重型慢推理模块仅在可疑事件触发时激活。在多个基准上，ReactVAU在严格流式约束下实现检测与因果推理的竞争性能，并通过减少重型MLLM调用显著提升计算效率。", "type": "paper", "relTime": "1周前"}, {"id": 199, "title": "CosmoH2G：面向复杂空间运动物体操作的手到夹爪迁移数据集与基线方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.07498", "date": "2026-09-07T00:00:00.000Z", "summary": "CosmoH2G 提出一种可扩展的数据采集流程，构建了包含 6，189 个演示片段、覆盖 1，254 个独特物体的手-夹爪配对数据集，其空间复杂度显著高于现有基准。针对复杂空间运动中端到端生成夹爪位姿序列易累积误差的问题，该方法采用两阶段框架：先预测稀疏关键帧，再生成完整连续动作序列，并对平移进行后优化。仿真与真实机器人实验表明，该方法在复杂空间操作的手到夹爪迁移中显著优于传统基线。", "type": "paper", "relTime": "1周前"}, {"id": 200, "title": "DF26 基准：现有检测手段已难以分辨 AI 生成视频与真实视频", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.07369", "date": "2026-09-07T00:00:00.000Z", "summary": "DF26 基准针对单人物公开演讲场景评测 AI 生成视频检测，包含 271 个真实视频和由七个现代视频模型生成的 2，420 个合成视频。结果显示人类和最先进的 deepfake 检测器准确率都接近随机水平，暴露出当前评测协议的局限，并提出了对现代生成模型分布偏移保持鲁棒性的基准需求。", "type": "paper", "relTime": "1周前"}, {"id": 201, "title": "CARDEA：基于空间证据可审计推理的端到端冠状动脉造影解读模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.06931", "date": "2026-09-07T00:00:00.000Z", "summary": "中国医药大学团队开发了 CARDEA，一个统一的大视觉语言模型，作为冠状动脉造影（CAG）端到端流程的推理核心，从原始多视角视频经关键帧选择到研究级诊断，并输出可审计的空间证据。", "type": "model", "relTime": "1周前"}, {"id": 202, "title": "SpatialBlock：用合成积木堆叠任务提升 LVLM 空间智能", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.07064", "date": "2026-09-07T00:00:00.000Z", "summary": "研究者提出 SpatialBlock 范式，通过结构化积木操作任务让 LVLM 学习基础空间技能，并发布含 15，000 道积木堆叠问题的合成数据集 SpatialBlock-15k，覆盖 3D 到 2D 投影、视角变换与结构组合，还引入受控颜色调制作为视觉线索。实验显示，用该数据集训练的 LVLM 在直接作答和基于推理的预测两种方式下均显著优于基线，并能泛化到真实世界空间任务。代码与数据已公开。", "type": "paper", "relTime": "1周前"}, {"id": 203, "title": "Viggle 发布 Viggle-Animate，可三步在本地 PC 上将任意角色替换进视频", "source": "X：Viggle AI (@ViggleAI)", "sourceUrl": "https://x.com/ViggleAI/status/2096724465094689195", "date": "2026-09-06T22:17:22.000Z", "summary": "Viggle 感谢 @cocktailpeanut 的实测反馈，称 Viggle-Animate 效果好于预期，并给出 Hugging Face 开放入口 https://huggingface.co/Viggle/Viggle-Animate。引用内容称该工具只需单帧即可生成，无需 pose/mask/face/depth 工作流，质量超出预期。", "type": "paper", "relTime": "1周前"}, {"id": 204, "title": "H Company 发布 NeoMME 260M/800M 单塔多模态编码器，取消视觉塔和因果解码器", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/06/h-company-releases-neomme-a-family-of-260m-and-800m-single-tower-multimodal-encoders-that-drop-the-vision-tower-and-causal-decoder", "date": "2026-09-06T21:06:41.000Z", "summary": "H Company 发布 NeoMME 系列多模态编码器，包含 260M 和 800M 两个双向 Transformer 模型，用单一塔处理多语言文本和 32×32 图像块，去掉了独立视觉塔和因果解码器，以离散掩码扩散方式预训练。", "type": "model", "relTime": "1周前"}, {"id": 205, "title": "GPT-6 Astra 百款演示分类盘点", "source": "X：Deedy Das (@deedydas)", "sourceUrl": "https://x.com/deedydas/status/2096652977952202922", "date": "2026-09-06T17:33:18.000Z", "summary": "我浏览了数百个 GPT-6 Astra 演示，并将最佳案例进行了整理和分类。  远不止那些 3D Blender 演示，还包括： - 3D（三维建模、教育、游戏） - 机器人控制 - 音乐生成 - 纯视觉 - 生物 - UI - 计算机操作（绘画、游戏、Figma） - 金融  在视觉、计算机操作、空间推理和原始智能方面，这确实是一款非常强大的模型。  1/22", "type": "model", "re OTA模型的领先周期", "source": "X：阑夕 (@foxshuo)", "sourceUrl": "https://x.com/foxshuo/status/2096532057237422318", "date": "2026-09-06T09:32:48.000Z", "summary": "阑夕提出，新模型发布首日Demo刷屏、次日集体反思已是固定节奏，SOTA模型本身也是一种「奇观」。他以《帝国时代II》的奇观机制作比：GPT-4是维持最久的一座奇观，发布一年后才被Claude 3 Opus攻破；2025年后前沿模型差距变小，领先通常三个月内被追平，AI大厂必须在新奇观建成前不断开建下一座。", "type": "tip", "relTime": "1周前"}, {"id": 212, "title": "阿里千问开源 Qwen-Drive-1.0-4B 自动驾驶视觉语言模型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/997.htm", "date": "2026-09-06T09:15:06.000Z", "summary": "阿里千问本周开源 Qwen-Drive-1.0-4B，一款基于 Qwen3.5-4B 构建的自动驾驶视觉语言基础模型，官方称其为首个面向自动驾驶的视觉语言基础模型。", "type": "model", "relTime": "1周前"}, {"id": 213, "title": "博主把视频制作流程做成主动引导式 Skill，一个爆贴一天涨粉 4000", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2096499131347071048", "date": "2026-09-06T07:21:58.000Z", "summary": "阿易转发大雷（@AaronYiaazw）的视频制作教程案例：后者把完整视频制作流程做成主动引导式 Skill，已发布在 GitHub（image-story-video-wizard），一个爆贴一天涨了 4000 粉。安装后在 Codex 或 WorkBuddy 中启动 Skill，即可按流程一步步引导完成视频制作；完整安装方法、制作流程和踩坑见其教程文章。", "type": "tip", "relTime": "1周前"}, {"id": 214, "title": "Astra 进军医学应用场景", "source": "X：Greg Brockman (@gdb)", "sourceUrl": "https://x.com/gdb/status/2096485443667890228", "date": "2026-09-06T06:27:35.000Z", "summary": "Astra 进军医学应用场景  【引用 @HandEManAI】：我完全惊呆了！  这仅仅来自一个提示词，让 Astra（medium）制作一段我们手外科医生做的肌腱转位手术（EIP 到 EPL 肌腱转位）视频。  很兴奋能继续探索其在手术教育、患者教育和机器人模拟中的应用！", "type": "paper", "relTime": "1周前"}, {"id": 215, "title": "公安部发布\"国家反诈 AI\"App，微信、支付宝小程序同步开放", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/922.htm", "date": "2026-09-06T05:44:45.000Z", "summary": "公安部宣布，由公安部刑侦局指导、上海市公安局自主研发的\"国家反诈 AI\"App 正式上线，微信、支付宝小程序同步开放，用户可在各大手机应用市场下载。该 App 融合大语言、多模态模型和智能体技术，提供 AI 大模型智能问答、反诈资讯和反诈辞典三大功能，可对用户输入的可疑场景完成风险研判、识别诈骗套路并推送典型案例，从文字、语音、视频多个维度拆解诈骗手法并提供防范对策。", "type": "model", "relTime": "1周前"}, {"id": 216, "title": "蚂蚁 inclusionAI 发布块扩散视觉语言 GUI 智能体 LLaDA-UI", "source": "蚂蚁 inclusionAI：HuggingFace 新模型", "sourceUrl": "https://huggingface function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";

    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";

      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }

      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',

  c.innerHTML=html;
}

chcrunch.com/2026/09/26/i-created-an-interactive-digital-avatar-of-myself-and-you-can-talk-to-it", "date": "2026-09-26T14:00:00.000Z", "summary": "Synthesia 为 TechCrunch 记者制作了一个交互式 AI 数字分身，仅基于其一篇关于风投背景创业公司欺诈的报道训练，只会回答与该报道相关的问题。", "type": "paper", "relTime": "1周前"}, {"id": 223, "title": "实测LibTV 1.5五大新功能，演示AI短剧工作流", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw==&mid=2247511963&idx=1&sn=a8046b9f44949b1eed69a7c149c2efdb&chksm=cf085362a48739b7257c3756c5eeab1133ff234b0c27312f978e54d53dd6872d5ceab88ca8ab&scene=126&sessionid=1790572572#rd", "date": "2026-09-26T09:00:00.000Z", "summary": "作者详细测试了LibTV 1.5版本的新功能，包括将Agent升级为TV Director、剧本原创及改编、角色造型室、导演执导、3D-BOX预演和创意片头。文章展示了从生成50集古装言情喜剧大纲、手动编辑剧本、使用角色造型室调整人物形象，到利用Seedance 2.5生成分镜、通过导演模式优化镜头以及用3D-BOX进行复杂运镜预演的完整流程，最终输出成片。", "type": "tip", "relTime": "1周前"}, {"id": 224, "title": "用 AugLy 构建图像、文本、音频多模态数据增强与对抗鲁棒性基准教程", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/26/end-to-end-multimodal-data-augmentation-and-adversarial-robustness-benchmark-with-augly-for-images-text-audio-and-pytorch", "date": "2026-09-26T07:22:46.000Z", "summary": "本教程基于 AugLy 构建覆盖图像、文本、音频的端到端多模态数据增强与鲁棒性工作流。教程解决依赖兼容问题，生成确定性合成数据集，演示 AugLy 的函数式与类式 API。", "type": "tip", "relTime": "1周前"}, {"id": 225, "title": "微星推出 MS-C9ZA 无风扇边缘 AI 盒子，基于 Jetson Orin Nano 8GB", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/007/344.htm", "date": "2026-09-26T05:37:03.000Z", "summary": "微星推出 MS-C9ZA 边缘 AI 盒子，基于 NVIDIA Jetson Orin Nano 8GB 模组，可在端侧执行 AI 推理与计算机视觉处理，面向机器人、智能制造等场景。", "type": "paper", "relTime": "1周前"}, {"id": 226, "title": "作者分享用 logprobs 读取 LLM 选项概率的单函数封装，并扩展到视觉模型", "source": "Hacker News：AI 热帖", "sourceUrl": "http://allanrbo.blogspot.com/2026/09/a-jev-like-wrapper-for-llms-including.html", "date": "2026-09-26T04:20:58.000Z", "summary": "作者受 Jev 及 OpenJev、SemIf 启发，实现了一个单函数封装：让 LLM 只生成一个选项字母，再读取 top_logprobs 得到各选项概率。", "type": "tip", "relTime": "1周前"}, {"id": 227, "title": "Claude Opus 5.5 生成递归解释视频", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2103688362960019567", "date": "2026-09-26T03:29:25.000Z", "summary": "你怎么解释递归？这个挺有意思的。  我让 Claude Opus 5.5 做了：\"一个解释递归的视频，其中每一段关于递归的解释都采用截然不同的视频风格，要让它自我指涉、巧妙且节奏明快。\"  九次风格切换，一个提示词……", "type": "paper", "relTime": "1周前"}, {"id": 228, "title": "NVIDIA 开源 MONAI Physio 医学影像数字孪生", "source": "X：小北 (@frxiaobei)", "sourceUrl": "https://x.com/frxiaobei/status/2103672371991249071", "date": "2026-09-26T02:25:52.000Z", "summary": "NVIDIA 在 MICCAI 2026 开源 MONAI Physio，可从 3D 和 4D 医学影像生成个性化的心脏与呼吸数字孪生，模拟心跳与肺部运动。该工具属于开源 Project MONAI 工具包，面向研究人员用于仿真、可视化和可复现研究。", "type": "model", "relTime": "1周前"}];
var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };
var TYPE_LABELS = { "paper":"论文", "model":"模型", "product":"产品", "tip":"技巧", "industry":"行业" };
function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";
  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();

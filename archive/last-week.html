ime": "1周前"}, {"id": 6, "title": "Google Cloud 数据库如何为生产级 AI 激活数据层", "source": "Google AI：DEV 作者专属（RSS）", "sourceUrl": "https://dev.to/googleai/activating-your-data-layer-for-production-ready-ai-p3e", "date": "2026-10-05T19:39:51.000Z", "summary": "Google Cloud 发布系列实验，演示如何用 AlloyDB 和 Cloud SQL 为生产级 AI 准备数据：在数据库中生成文本嵌入做语义搜索，为 RAG 提供 grounding，并支持多模态嵌入实现图文混合检索。AlloyDB 还提供 AI.IF 等 AI 函数，无需数据准备即可用自然语言查询过滤和重排结果，QueryData 则支持用对话式语言生成 SQL 并构建数据智能体。", "type": "tip", "relTime": "1周前"}, {"id": 7, "title": "Reka AI 发布 19B 全能模型 Rho-1，单模型处理文本、图像、视频与机器人控制", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/reka-ais-omni-model-rho-1-handles-text-images-video-and-robot-control-in-a-single-model/", "date": "2026-10-05T18:26:05.000Z", "summary": "Reka AI 发布 190 亿参数全能模型 Rho-1 的研究预览版，在单一神经网络内处理并生成文本、图像、视频和机器人控制动作。该模型将全部模态作为 token 放入同一上下文窗口，无需工具调用或外部模型，可实时生成连续视频并即时响应新指令，同一套权重既预测摄像头图像也驱动机器人运动。", "type": "model", "relTime": "1周前"}, {"id": 8, "title": "OpenAI 说明文本水印的工作原理与能力边界", "source": "X：OpenAI (@OpenAI)", "sourceUrl": "https://x.com/OpenAI/status/2107164651478012412", "date": "2026-10-05T17:42:56.000Z", "summary": "OpenAI 说明其文本水印机制，在生成文本时嵌入不可见统计信号，检测器可据此判断文本是否可能由 OpenAI 模型生成。该水印不添加可见标记，不识别作者、组织、账号或对话来源。OpenAI 表示测试中水印未影响模型能力、速度或回复的阅读体验。", "type": "model", "relTime": "1周前"}, {"id": 9, "title": "Krea Agent 登陆 After Effects，可制作动态图形并处理音视频", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2107138756507763130", "date": "2026-10-05T16:00:02.000Z", "summary": "Krea AI 宣布 Krea Agent 进入 After Effects。Agent 可在 After Effects 内制作动态图形、调整视频尺寸，并处理声音、图像等内容。目前已开放免费试用。", "type": "paper", "relTime": "1周前"}, {"id": 10, "title": "OpenAI 在 ChatGPT 图像生成结果旁推出视觉广告", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/05/openai-launches-visual-ads-that-appear-alongside-image-generation-results/", "date": "2026-10-05T15:14:24.000Z", "summary": "OpenAI 将在 ChatGPT 的图像生成结果旁展示视觉广告，本月晚些时候先在美国上线，面向初始测试广告主，广告会明确标注且不影响 ChatGPT 的回答。OpenAI 同时扩展广告测量工具与合作伙伴生态，并推进品牌适配性评估试点，广告远期目标是覆盖其 12 亿周活用户。", "type": "paper", "relTime": "1周前"}, {"id": 11, "title": "Gemini Notebook 更新用量限额系统并新增后台生成队列", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2107125198579286277", "date": "2026-10-05T15:06:10.000Z", "summary": "Gemini Notebook 推出新的用量限额系统、artifact 生成用量估算和后台队列。限额从每 24 小时刷新改为每 5 小时刷新；原来按功能单独限额改为灵活的 Notebook 专属限额，由用户自行分配；额度用完时可将视频、幻灯片等生成任务放入后台队列，之后自动生成。", "type": "paper", "relTime": "1周前"}, {"id": 12, "title": "OpenAI 将在 ChatGPT 图像生成中测试图片广告形式", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/901.htm", "date": "2026-10-05T15:01:59.000Z", "summary": "OpenAI 宣布在 ChatGPT 中推出全新图片广告形式，本月晚些时候在美国启动测试，首批邀请部分广告主参与。初期在图像生成功能中测试，广告会清晰标注并与生成内容相互独立，官方称广告不会影响 ChatGPT 的回答。ChatGPT 每周覆盖 12 亿用户，此次同时扩充广告效果衡量工具并研发品牌适配性评估方案。", "type": "paper", "relTime": "1周前"}, {"id": 13, "title": "Higgsfield AI 生成爆款网红视频", "source": "X：Higgsfield AI (@higgsfield)", "sourceUrl": "https://x.com/higgsfield/status/2107112781854245256", "date": "2026-10-05T14:16:50.000Z", "summary": "官方消息，每一位爆火的 AI 网红都是用 Higgsfield 制作的。  用你自己的脸或从零开始制作一个。然后用 Genjutsu 跟上爆款趋势。  最多可免费试用 5 次生成。  现已在 Higgsfield 上线，并可通过 ChatGPT Extension 使用。  Credits: @JeanPhilMadame", "type": "paper", "relTime": "1周前"}, {"id": 14, "title": "OpenAI 将在 ChatGPT 中测试视觉广告", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/1004655/openai-chatgpt-visual-ads", "date": "2026-10-05T13:09:48.000Z", "summary": "OpenAI 宣布本月晚些时候在美国测试 ChatGPT 的新视觉广告格式，初期出现在用户生成图片时。广告与生成的图像保持分离，不会影响 ChatGPT 的回答，Plus、Pro 或 Enterprise 订阅用户不会看到广告；公司称设有护栏避免在情绪脆弱或敏感场景中投放，并正与首批广告主测试、计划未来尝试更多格式。此前 ChatGPT 广告自2月起仅在聊天下方赞助位显示公司名、标志和链接。", "type": "paper", "relTime": "1周前"}, {"id": 15, "title": "OpenAI 将在 ChatGPT 图像生成加载界面测试轮播广告", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/chatgpts-new-ad-format-fills-the-image-generation-loading-screen-with-product-carousels/", "date": "2026-10-05T12:37:32.000Z", "summary": "OpenAI 将于本月晚些时候在美国测试新广告格式，在 ChatGPT 生成图像时于图片下方展示轮播或一排产品广告，广告带有标识并与生成内容分开。同期 OpenAI 扩展了衡量工具，接入 Hightouch、AppsFlyer 等转化与归因服务商，并与 DoubleVerify 和 Integral Ad Science 试点品牌安全评估，广告主还可设置否定关键词。", "type": "product", "relTime": "1周前"}, {"id": 16, "title": "PixVerse 插件让 AI 智能体生成动态图形", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2107078408014549448", "date": "2026-10-05T12:00:14.000Z", "summary": "PixVerse 插件让你的 AI 智能体根据文字简述生成动态图形。  描述视觉元素、它们该如何运动，以及你想要的时间节奏。", "type": "paper", "relTime": "1周前"}, {"id": 17, "title": "Safeworld 融资超 1200 万美元，为生成式 AI 机器人做安全评估", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/05/can-safeworld-convince-people-that-gen-ai-robots-wont-hurt-them/", "date": "2026-10-05T12:00:00.000Z", "summary": "卡内基梅隆大学 Safe AI 实验室主任丁昭与 Kyle Wong、Simo Rachidi 创立 Safeworld，今日结束隐身状态并完成超 1200 万美元种子轮，由 Shine Capital 和 a16z Speedrun 领投。", "type": "industry", "relTime": "1周前"}, {"id": 18, "title": "OpenAI 在 ChatGPT 推出全新视觉广告格式并扩展广告测量工具", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "sourceUrl": "https://openai.com/index/new-chatgpt-ads-format-and-measurement", "date": "2026-10-05T10:00:00.000Z", "summary": "OpenAI 宣布在 ChatGPT 推出新的视觉广告格式，本月起在美国于图像生成场景中测试，广告将明确标注且不影响 ChatGPT 的回答。", "type": "paper", "relTime": "1周前"}, {"id": 19, "title": "Yann LeCun 劝学术界别碰 LLM", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2106965343013163087", "date": "2026-10-05T04:30:57.000Z", "summary": "Yann LeCun 在 ETH Zürich 最新演讲中直言，学术界不应研究 LLM，认为学者在这方面\"拿不出任何东西\"。他建议想做真实世界具身 AI、物理 AI 的人，既不要做 LLM，也不要做生成模型，并称这番立场让他在硅谷不太受欢迎。", "type": "model", "relTime": "1周前"}, {"id": 20, "title": "AI 生成的跨游戏混搭模组在 X 上兴起，资深模组制作者集体表达不满", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/779.htm", "date": "2026-10-05T02:52:04.000Z", "summary": "资深游戏模组制作者集体批评近期在 X 上兴起的 AI 生成“氛围编码”跨游戏混搭模组风潮，如把《逃离塔科夫》移植进《上古卷轴 5：天际》。推手被认为是 Claude Opus 5.5，其 token 成本下降、代码生成能力提升，大幅降低了反编译游戏并塞入无关内容的门槛；测试视频显示这类模组连基础逻辑都难以处理。", "type": "industry", "relTime": "1周前"}, {"id": 21, "title": "斯凯孚用 AI 复活已故影星嘉宝拍广告，引发赞许与争议", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/764.htm", "date": "2026-10-05T02:00:14.000Z", "summary": "瑞典轴承制造商斯凯孚（SKF）用 AI 生成已故好莱坞影星葛丽泰·嘉宝的形象拍摄广告，项目已获嘉宝遗产管理方及家属授权。图像使用字节跳动 Seedream 5 Pro、谷歌 Gemini 的 Nano Banana Pro 生成，动作用 Seedance 2、Seedance 2.5 和快手可灵 AI，语音基于嘉宝早年影片原声训练，未使用存档照片或历史影像。", "type": "industry", "relTime": "1周前"}, {"id": 22, "title": "消息称 Wayve 将为大众供应自动驾驶解决方案，与 CARIAD 合作", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/762.htm", "date": "2026-10-05T01:48:19.000Z", "summary": "据德媒 Donaukurier 10 月 2 日报道，英国具身智能初创企业 Wayve 将同大众旗下软件公司 CARIAD 合作，为大众供应自动驾驶解决方案。Wayve 负责开发自动驾驶 AI 软件，CARIAD 负责软件与大众-博世联合开发硬件的系统集成；此前十余家技术供应商参与了大众在德国南部一座主要城市的方案演示，Wayve 在技术和财务两方面表现突出。", "type": "industry", "relTime": "1周前"}, {"id": 23, "title": "Liquid AI 发布 d1 决策模型并新增图像输入能力", "source": "Liquid AI 模型与工程博客（网页）", "sourceUrl": "https://www.liquid.ai/blog/d1-decision-model", "date": "2026-10-05T00:00:00.000Z", "summary": "Liquid AI 发布 d1 决策模型，新增文本与图像输入，可通过 console.liquid.ai 和 d1 Playground 使用。", "type": "model", "relTime": "1周前"}, {"id": 24, "title": "Perplexity Computer 可构建垂直 AI 应用", "source": "X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)", "sourceUrl": "https://x.com/AravSrinivas/status/2106826752169312760", "date": "2026-10-04T19:20:15.000Z", "summary": "你可以在 Computer 里构建自定义垂直 AI 应用，例如：用 3D 和卫星视图猜测图像的 spatial location。", "type": "tip", "relTime": "1周前"}, {"id": 25, "title": "乐山大佛管委会辟谣\"掏耳朵\"养护视频：系AI合成，佛耳内并无杂物", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/728.htm", "date": "2026-10-04T13:20:18.000Z", "summary": "乐山大佛文物保护（景区）管委会回应媒体四川观察称，网传文保工人给大佛\"掏耳朵\"的视频系AI生成的不实信息，大佛耳鼻内并无杂物需清理，凌云山片区目前没有猴子。管委会数字化信息中心副主任陈芮介绍，2026年以来乐山大佛总计开展5次保养维护，第5次于9月20日至25日进行，内容包括岩体表面微损伤修复、微生物清理、表层植被清除等，与视频内容无关。", "type": "industry", "relTime": "1周前"}, {"id": 26, "title": "可灵 4.0 短片《The Beat》播放破 500 万幕后解析", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2106727026635808860", "date": "2026-10-04T12:43:58.000Z", "summary": "可灵 Kling 4.0 制作的短片《The Beat》在社交平台曝光量突破 500 万，官方发布幕后解析。影片开场为 30 秒连续长镜头，依托 Kling 4.0 原生 30 秒生成能力实现；Omni Reference 单任务支持最多 15 个多模态参考，Multi-Keyframe 支持最多 10 个关键帧，并采用 10-bit HDR 输出与升级立体声音频。", "type": "tip", "relTime": "1周前"}, {"id": 27, "title": "xAI 上诉成功，明尼苏达州 AI 虚假裸照禁令被暂时叫停", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/631.htm", "date": "2026-10-04T03:45:58.000Z", "summary": "xAI 于当地时间本周五成功说服美国第八巡回上诉法院颁布临时禁令，暂时搁置明尼苏达州 8 月 1 日生效的全美首个 AI 生成虚假裸照禁令。xAI 主张该法案违反宪法言论自由，并称 Grok Imagine 已设置防护机制阻止生成脱衣或性化图像，同时对绕过拦截的用户发起起诉。州总检察长办公室表示失望，称将继续维护该法律。", "type": "industry", "relTime": "1周前"}, {"id": 28, "title": "马斯克：特斯拉 Robotaxi 奥斯汀夜间运营延至 23 点，正攻克夜间识别宠物难题", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/627.htm", "date": "2026-10-04T03:11:35.000Z", "summary": "马斯克宣布特斯拉 Robotaxi 在奥斯汀的运营结束时间从 22 点延长至 23 点，并称团队正着力解决夜间视线不佳时碾过宠物的问题。他提出可用 AI 辅助摄像头做光子计数分析，提升可见光摄像头在黑暗环境下的识别效果。特斯拉 Cybercab 依靠摄像头视觉与传感器感知环境，NHTSA 正就 FSD 摄像头感知系统在低能见度下的识别能力展开调查。", "type": "industry", "relTime": "1周前"}, {"id": 29, "title": "亚利桑那州上诉法院裁定法庭播放被害人 AI 视频不当，路怒杀人案被告须重新量刑", "source": "Hacker News：AI 热帖", "sourceUrl": "https://www.bbc.com/news/articles/cwgkvygg5nzvo", "date": "2026-10-03T13:34:18.000Z", "summary": "亚利桑那州上诉法院裁定，杀人案被告 Gabriel Paul Horcasitas 量刑时法庭播放的被害人 AI 生成视频使用不当，须重新量刑。被告 2021 年枪杀 Christopher Pelkey，被判 10 年监禁；被害人家人用其录音、视频和照片制作 AI 视频在法庭播放。法院称该视频呈现的是被害人姐姐想象中的被害人和他的想法，越过了界线。", "type": "industry", "relTime": "1周前"}, {"id": 30, "title": "华为 Mate 90 Pro Max 首个版本更新曝光：实装四卡三待、3D 动态照片", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/539.htm", "date": "2026-10-03T13:08:18.000Z", "summary": "华为 Mate 90 Pro Max 首个版本更新内容曝光，包体约 745.01 MB，实装四卡三待与 3D 动态照片等功能。四卡三待支持 2 个 SIM 卡号码和 2 个 eSIM 号码，可启用其中 3 个号码同时待机；3D 动态照片则支持静态、动态照片生成并添加多种空间运镜效果。更新还新增亲密圈、图库智慧修图与一键成片 AI 剪辑等功能。", "type": "paper", "relTime": "1周前"}, {"id": 31, "title": "PixVerse 推出短剧插件，让 AI 智能体生成视频", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2106368702983905346", "date": "2026-10-03T13:00:07.000Z", "summary": "PixVerse 发布 Short Drama 插件，可将 AI 智能体的场景描述直接转化为成片视频。用户只需用自然语言描述角色、场景、动作与氛围，智能体即可调用 PixVerse 完成从描述到视频的生成，方便团队审阅和讨论创意。", "type": "paper", "relTime": "1周前"}, {"id": 32, "title": "LEGO-Anything研究：编码智能体可将单张照片转成可执行Blender 3D场景程序但几何自评接近随机", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/ai-agents-build-3d-scenes-from-photos-but-have-no-idea-if-they-got-it-right/", "date": "2026-10-03T08:31:04.000Z", "summary": "LEGO-Anything让编码智能体从单张图像迭代编写可执行的Blender场景程序，并推出LEGO-Bench基准（208张图像、104个场景、443个注册资产），用仿真渲染提供精确3D真值。", "type": "paper", "relTime": "1周前"}, {"id": 33, "title": "爱彼迎房东用 AI 生成漏水照片勒索 1700 美元，房客靠谷歌 SynthID 水印识破", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/473.htm", "date": "2026-10-03T07:05:08.000Z", "summary": "一名 Reddit 用户 FurinaDeFontaine 称，爱彼迎民宿房东退房后用 AI 生成马桶漏水照片，索要 1700 美元维修费。其先从物理常识起疑，随后用谷歌 Gemini 检出照片含 SynthID 水印，证明由 Gemini 生成；爱彼迎客服认定赔偿要求不符合条件并处罚房东账号。文章建议住客退房前拍摄房间和卫生间留证，并警惕 AI 处理过的照片。", "type": "industry", "relTime": "1周前"}, {"id": 34, "title": "Replit 本周更新：聊天内交互图表与新模型选择", "source": "X：Replit (@Replit)", "sourceUrl": "https://x.com/Replit/status/2106149526746591286", "date": "2026-10-02T22:29:12.000Z", "summary": "Replit 本周上线聊天内交互图表功能，用户对 Replit Agent 说“let\\'s visualize this”即可在对话中生成可视化。同时新增 GPT-6.1 Sol 和 Claude Sonnet 5.5 两款模型可选，构建时手动选择或保持 auto 模式由 Replit 自动决定。", "type": "model", "relTime": "1周前"}, {"id": 35, "title": "Claude Opus 5.5 打造 3D 银河漫游站点", "source": "X：Claude (@claudeai)", "sourceUrl": "https://x.com/claudeai/status/2106125470786105375", "date": "2026-10-02T20:53:36.000Z", "summary": "一个 3D 网站，带你从银河系外一路飞到木星的卫星，Opus 5.5 打造。", "type": "paper", "relTime": "1周前"}, {"id": 36, "title": "ldraw-nova v0.6.0 开源：用 AI 智能体生成 LDraw 乐高模型", "source": "Hacker News：AI 热帖", "sourceUrl": "https://github.com/anteloc/ldraw-nova", "date": "2026-10-02T20:00:15.000Z", "summary": "作者开源 ldraw-nova v0.6.0，让 AI 智能体根据提示规划并用真实 LDraw 零件生成乐高模型，产出 LDraw 源码、3D/VR 视图和可编辑的 glTF 文件。智能体通过 plan. 和生成 Python 脚本产出模型，绕开了其不擅长的几何数学；项目用 Docker 部署，支持 Meta Quest 3 VR，作者指出目前生成速度慢且只有高端模型能产出大型正确模型。", "type": "model", "relTime": "1周前"}, {"id": 37, "title": "Anthropic 设计师演示用 Claude Design 在 Claude Code 中构建应用", "source": "Claude：YouTube（RSS）", "sourceUrl": "https://www.youtube.com/shorts/FByNauagcbY", "date": "2026-10-02T19:43:31.000Z", "summary": "Anthropic 设计师 Nate 在 Claude Code 中使用 Claude design，将副项目的 onboarding 从粗略想法推进到可运行原型。他连接代码仓库、打开 Artifacts 标签页请求设计选项，通过评论反馈、在编辑器中自行修改细节，再要求生成点击原型后让 Claude 构建。视频展示了这套设计流程如何嵌入原本直接写代码的场景。", "type": "tip", "relTime": "1周前"}, {"id": 38, "title": "MiniMax H3-Max 参考图生视频上线 fal", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2106092412938432566", "date": "2026-10-02T18:42:15.000Z", "summary": "现在就在 fal 上试试 https://fal.ai/models/minimax/h3-max/reference-to-video", "type": "model", "relTime": "1周前"}, {"id": 39, "title": "fal 的 H3 Max Reference-to-Video 支持首、中、尾帧控制", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2106092410480574785", "date": "2026-10-02T18:42:14.000Z", "summary": "fal 宣布 H3 Max Reference-to-Video 现已支持首帧、中间帧和尾帧控制。用户可设置关键帧、选择中间帧出现的时机，并添加图像或视频参考来引导场景，从而控制镜头如何开始、展开和结束。", "type": "paper", "relTime": "1周前"}, {"id": 40, "title": "xAI 发布实验性 TypeScript SDK，统一支持文本、语音、图像与视频", "source": "X：Andrew Milich (@milichab)", "sourceUrl": "https://x.com/milichab/status/2106091153598947787", "date": "2026-10-02T18:37:14.000Z", "summary": "xAI 发布实验性 TypeScript SDK，可通过 npm install @xai-official/sdk 安装，在一个 SDK 内调用最新 Grok 模型获取文本、语音、图像和视频。SDK 还提供运行在其服务器上的工具，包括实时 X 搜索、网页搜索、代码执行和远程 MCP。", "type": "model", "relTime": "1周前"}, {"id": 41, "title": "xAI 发布实验性 TypeScript SDK", "source": "X：Eric Zakariasson (@ericzakariasson)", "sourceUrl": "https://x.com/ericzakariasson/status/2106090512210088361", "date": "2026-10-02T18:34:42.000Z", "summary": "我们正在发布一个实验性的 @SpaceXAI typescript sdk！  npm install @xai-official/sdk  在一个 sdk 中获取文本、语音、图像和视频，搭载最新的 grok 模型  以及在我们服务器上运行的工具，如实时 X 搜索、网页搜索、代码执行和远程 mcp", "type": "model", "relTime": "1周前"}, {"id": 42, "title": "Maket 2.0 发布：AI 一站式家居设计平台", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2106083861243347389", "date": "2026-10-02T18:08:16.000Z", "summary": "Maket 推出 Maket 2.0，一个用于新房设计或旧房改造的一站式 AI 平台，用户可申请增加卧室或扩大厨房，在动工前快速获得平面图和 3D 视图。平面图可由简短提示词生成，助手会询问楼层和房间信息；现有户型图可上传为图片或 PDF 并在对话中编辑，每个房间还能渲染多种室内风格。", "type": "paper", "relTime": "1周前"}, {"id": 43, "title": "音视频扩散模型的自适应奖励路由", "source": "X：AK (@_akhaliq)", "sourceUrl": "https://x.com/_akhaliq/status/2106080325386305893", "date": "2026-10-02T17:54:13.000Z", "summary": "Adaptive Reward Routing  通过前向过程 RL 实现音视频联合扩散的动态多奖励优化  论文：https://huggingface.co/papers/2609.37200", "type": "paper", "relTime": "1周前"}, {"id": 44, "title": "Black Forest Labs 发布 FLUX 3 Image，支持边界框构图与像素级编辑", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://bfl.ai/models/flux-3-image", "date": "2026-10-02T17:50:56.693Z", "summary": "Black Forest Labs 发布 FLUX 3 Image，是 FLUX 3 多模态模型中负责图像生成与编辑的部分，可用边界框在 0 到 1000 的画布网格上控制每个元素的位置，也支持直接用提示词生成。", "type": "model", "relTime": "1周前"}, {"id": 45, "title": "Suno 揭秘舞蹈到歌曲创作幕后", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2106070604902547833", "date": "2026-10-02T17:15:35.000Z", "summary": "与 Braylon Browner 和艾美奖获奖编舞/导演 Nina McNeely 一起走进幕后，看看从舞蹈到歌曲，再到围绕动作构建的完整创意世界，需要付出什么。", "type": "paper", "relTime": "1周前"}, {"id": 46, "title": "Circuit Breaker Labs 想用 AI 智能体让 AI 对儿童和成人更安全", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/02/circuit-breaker-labs-hopes-to-make-ai-safer-for-your-kids-and-you/", "date": "2026-10-02T17:00:00.000Z", "summary": "Circuit Breaker Labs 打造了一支\"碰撞测试假人\"式的 AI 智能体队伍，模拟不同年龄、背景、语言和文化的用户，对模型进行红队测试，每天运行数万至数十万次模拟交互，以检测危险的心理有害互动。这家仅有 5 名员工的公司目前作为 AI 安全测试实验室，服务 AI 教练、日记和心理健康支持等高风险应用，并采用专有评分方法生成可审计、可解释的分数。", "type": "industry", "relTime": "1周前"}, {"id": 47, "title": "Kled V3：72小时众包采集AI训练数据", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2106060301917429889", "date": "2026-10-02T16:34:39.000Z", "summary": "Kled V3 推出数据采集平台，实验室可指定所需数据，平台能在 72 小时内向 50 万+ 自愿贡献者网络部署采集任务。平台提供覆盖图像、视频、音频、文本和标注的 108 个可配置模板，贡献者用手机按指令和示例完成采集。其核心价值在于缩短反馈闭环：定位模型失败点、转化为采集任务、获取真实世界新样本、再训练评估。", "type": "tip", "relTime": "1周前"}, {"id": 48, "title": "Runway AI Summit 落幕，发布 Continuum", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2106057035884478609", "date": "2026-10-02T16:21:40.000Z", "summary": "Runway AI Summit 落幕，Runway 联合创始人兼联合 CEO Cristóbal Valenzuela 回顾了生成式视频的演进，并介绍了 Runway Labs 的最新项目 Continuum。  前往 https://summit.runway.com/talks 注册，即可在完整演讲上线时收到通知", "type": "industry", "relTime": "1周前"}, {"id": 49, "title": "PixVerse 插件生成产品开箱视频", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2106051746556744099", "date": "2026-10-02T16:00:39.000Z", "summary": "用 PixVerse 插件把产品创意变成开箱视频  描述产品、场景和出镜者的反应。你的 AI 智能体用 PixVerse 生成视频！", "type": "product", "relTime": "1周前"}, {"id": 50, "title": "AI Makes Me Sad：一位开发者对 AI 时代的失落与期待", "source": "Hacker News：AI 热帖", "sourceUrl": "https://mondobe.com/ai-makes-me-sad", "date": "2026-10-02T15:18:00.000Z", "summary": "一名开发者发文《AI Makes Me Sad》，坦言每次看到 AI 新进展都感到无望，不愿以给 Codex 或 Claude 写提示词为生，认为这意味手艺、控制力与创造力的丧失。他批评 X 上大量认证机器人用 LLM 生成无意义回复却无人治理，并指出数千亿甚至数万亿美元的 AI 投入对日常应用用户几乎没有带来实际收益。他仍抱有希望：科技行业变化极快，AI 在社会中的角色会在几年内定型。", "type": "tip", "relTime": "1周前"}, {"id": 51, "title": "Tripo P2.0 生成可编辑四边面 3D 资产", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2106036500068548858", "date": "2026-10-02T15:00:04.000Z", "summary": "Tripo P2.0 可生成达到生产级标准的 3D 资产，拥有干净、可编辑的四边面拓扑。  输入单视图或多视图图像，可获得更好的几何结构。  无需再无尽地清理。从真正能用的模型开始。", "type": "model", "relTime": "1周前"}, {"id": 52, "title": "Kling 4.0 进入封闭测试，官方发布创意总监商业制作实测", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2105986483337167115", "date": "2026-10-02T11:41:19.000Z", "summary": "Kling AI 官宣 Kling 4.0 进入封闭测试，计划今年 10 月正式发布，带来更稳定的动态运动、高质量立体声与更准的口型同步，支持最高 4K 分辨率与 10-bit HDR 输出，可生成最长 30 秒视频。", "type": "paper", "relTime": "1周前"}, {"id": 53, "title": "腾讯 WorkBuddy 内置模型独家支持 Space Bunny", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/335.htm", "date": "2026-10-02T10:05:19.000Z", "summary": "腾讯 WorkBuddy 宣布内置模型独家支持匿名 Flash 大模型 Space Bunny，该模型具备极速推理、编码能力，原生支持文本、图像、视频输入，上下文长达 1M。", "type": "model", "relTime": "1周前"}, {"id": 54, "title": "Black Forest Labs 发布生图模型 FLUX 3 Image：支持 4K 生成与元素精准排布", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/315.htm", "date": "2026-10-02T08:05:21.000Z", "summary": "德国 AI 公司 Black Forest Labs 于 10 月 2 日发布图像生成模型 FLUX 3 Image，支持生成最高 4K 分辨率图片。用户可在 0–1000 坐标网格上通过 ID、描述文本和边界框精准排布画面元素，单次生成最多融入 10 张参考图像，并支持像素级精确多轮编辑。该模型目前以付费服务提供，开放模型版本将于数周内公开。", "type": "model", "relTime": "1周前"}, {"id": 55, "title": "OpenAI 升级 ChatGPT 购物功能，新增虚拟试穿与 Favorites 收藏", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/304.htm", "date": "2026-10-02T07:28:56.000Z", "summary": "OpenAI 为 ChatGPT 购物功能新增虚拟试穿（Try on）和 Favorites（收藏）两项功能。用户可上传或拍摄照片，由 ChatGPT 生成穿着特定服饰或配饰后的效果图，该体验大致依托 ChatGPT Images 2.5 图像生成模型；收藏功能可将商品保存至 ChatGPT Library 并用文件夹分类。", "type": "model", "relTime": "1周前"}, {"id": 56, "title": "富士 X-T6 设计草图曝光：搭 X-Processor 6，或推迟至 2026 年末至 2027 年初发布", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/283.htm", "date": "2026-10-02T06:34:49.000Z", "summary": "富士 X-T6 无反相机设计草图曝光，传闻将搭载 X-Processor 6 图像处理器，支持新一代深度学习 AI 自动对焦与实时黏着追踪。传感器或采用 4000 万–5000 万像素部分堆叠式 X-Trans 6，电子快门连拍最高 40–60fps，视频规格升至 8K 30p / 4K 120p。该机发布已推迟至 2026 年末或 2027 年初，上市价约 1,899–2,199 美元。", "type": "paper", "relTime": "1周前"}, {"id": 57, "title": "东锡 NLP 谈 LLM 耐心讲解代码，让老登被时代抛弃", "source": "X：马东锡 NLP (@dongxi_nlp)", "sourceUrl": "https://x.com/dongxi_nlp/status/2105893369142546585", "date": "2026-10-02T05:31:19.000Z", "summary": "作者回忆新人时期请教资深工程师代码逻辑被一句“哦，忘了”回绝，感叹如今 LLM 能用文字、图表、视频等多种方式耐心回答问题。其引用的 Karpathy 帖子介绍了用 ASD-STE100 规范写作、生成图表、HTML 网页和 3b1b 风格讲解视频等理解 LLM 输出的技巧。", "type": "tip", "relTime": "1周前"}, {"id": 58, "title": "可灵超级创作者实测 Kling 4.0：30秒打戏、运镜稳定性与一致性表现", "source": "公众号：可灵AI（快手·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzU5NTkwNDU2OA%3D%3D&mid=2247496912&idx=1&sn=52292535ca61af3fc66326f8aea772ce", "date": "2026-10-02T04:04:46.000Z", "summary": "可灵AI公众号发布超级创作者、奥美资深创意总监盛健松对 Kling 4.0 内测版的实测。Kling 4.0 已开启内测，将于10月正式发布，支持最长30秒原生视频生成、主体与场景资产调用、声音延续、动作迁移，并提升复杂运镜稳定性、长提示词理解和跨镜头一致性。", "type": "paper", "relTime": "1周前"}, {"id": 59, "title": "Karpathy 分享用 LLM 生成写作、网页和讲解视频的技巧，Yuchen Jin 盼其回归更新视频", "source": "X：Yuchen Jin (@Yuchenj_UW)", "sourceUrl": "https://x.com/Yuchenj_UW/status/2105821521201799480", "date": "2026-10-02T00:45:49.000Z", "summary": "Andrej Karpathy 分享理解语言模型输出的技巧，包括让 LLM 用 ASD-STE100 规范写作、生成图表、输出 HTML 交互网页，以及用 ElevenLabs API 配音生成 3b1b 风格的定制讲解视频，并认为随着智能和代码愈发充裕，可要求大型、定制、可丢弃的软件产物。Yuchen Jin 转发时表示目前还没有 AI 能直接生成 Karpathy 风格的视频，并指出 K...", "type": "tip", "relTime": "1周前"}, {"id": 60, "title": "Andrej Karpathy 分享理解 LLM 输出的技巧：从 ASD-STE100 写作到定制讲解视频", "source": "X：Andrej Karpathy (@karpathy)", "sourceUrl": "https://x.com/karpathy/status/2105819303471976479", "date": "2026-10-02T00:37:00.000Z", "summary": "Andrej Karpathy 分享了几条理解大语言模型输出的方法：让模型用面向航天维护文档的受控语言 ASD-STE100 写作（可要求 80% 程度以放宽约束）、输出图表、生成 HTML 交互网页，以及生成 3b1b 风格的定制讲解视频并用 ElevenLabs API key 做配音。", "type": "tip", "relTime": "1周前"}, {"id": 61, "title": "OpenAI 在 ChatGPT 全球上线虚拟试穿与商品收藏功能", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/197.htm", "date": "2026-10-01T23:18:01.000Z", "summary": "OpenAI 于当地时间 1 日在全球推出 ChatGPT 两项购物新功能：虚拟试穿服装和配饰，以及可保存商品、与试穿图片放在一起的收藏功能。新功能基于 ChatGPT Images 2.5 模型，据称光线更自然、纹理更丰富、编辑指令更稳定且生成更快。用户可上传自拍照或全身照查看试穿效果，也可描述穿衣风格让 ChatGPT 挑单品，或上传名人穿搭照找可购买同款。", "type": "model", "relTime": "1周前"}, {"id": 62, "title": "MIT CSAIL 与 Google 推出 InstructMesh：可修复 AI 生成 3D 模型再打印", "source": "MIT News（RSS）", "sourceUrl": "https://news.mit.edu/2026/instructmesh-tool-lets-users-repair-ai-3d-models-then-fabricate-them-1001", "date": "2026-10-01T22:00:00.000Z", "summary": "MIT CSAIL 联合 Google 和东北大学推出 InstructMesh，将微软 TRELLIS 的 3D 生成能力与 GPT-4 的推理能力结合，用户可用自然语言标注并修改 AI 生成的 3D 设计后再打印。", "type": "paper", "relTime": "1周前"}, {"id": 63, "title": "OpenRouter 图像生成定价 $0.018/张", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2105776625841570070", "date": "2026-10-01T21:47:25.000Z", "summary": "每张图 $0.018，一口价。输出尺寸不影响价格，参考图免费。", "type": "paper", "relTime": "1周前"}, {"id": 64, "title": "FLUX 3 Image 现已登陆 Krea，支持多轮编辑与 4K 生成", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2105769469880799716", "date": "2026-10-01T21:18:59.000Z", "summary": "Krea 宣布 FLUX 3 Image 已上线其平台。新能力包括多轮编辑且不改动其他像素、用 bounding box 排版图像、最高 4K 生成，以及组合最多 10 个参考图。", "type": "paper", "relTime": "1周前"}, {"id": 65, "title": "fal 上线 Grok Imagine Video v1.5 lite 的文生视频与图生视频入口", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2105759424270729641", "date": "2026-10-01T20:39:04.000Z", "summary": "fal 宣布 Grok Imagine Video v1.5 lite 已可在其平台试用，提供 Text-to-Video 和 Image-to-Video 两个入口。链接：https://fal.ai/models/xai/grok-imagine-video/v1.5/lite/text-to-video 与 https://fal.ai/models/xai/grok-imagine-...", "type": "model", "relTime": "1周前"}, {"id": 66, "title": "Grok Imagine Video 1.5 Lite 上线 fal 平台", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2105759422223929375", "date": "2026-10-01T20:39:04.000Z", "summary": "fal 宣布 Grok Imagine Video 1.5 Lite 上线，这是 Grok Imagine 视频家族中的轻量版模型。支持文生视频和图生视频并带原生音频，时长 1 到 15 秒；可输出 480p、720p 和 1080p，覆盖从 16:9 到 9:16 的 7 种画幅。", "type": "model", "relTime": "1周前"}, {"id": 67, "title": "OpenRouter 演示 FLUX 3 支持最多 10 张参考图生成整幅画面", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2105759095953461710", "date": "2026-10-01T20:37:46.000Z", "summary": "OpenRouter 发帖介绍 FLUX 3 的参考图能力，用户可一次性提供最多 10 张参考图并在单个提示词中描述场景，由模型决定各参考图的位置并共同渲染出整幅画面。", "type": "model", "relTime": "1周前"}, {"id": 68, "title": "FLUX 3 Image 上线 OpenRouter，支持原生 4K 生成与多参考编辑", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2105759062835220852", "date": "2026-10-01T20:37:38.000Z", "summary": "Black Forest Labs 的 FLUX 3 Image 现已上线 OpenRouter，是支持文生图与多参考编辑的旗舰图像模型，原生可渲染至 4K。原文提到可精确多轮编辑不动其他像素、用 bounding box 布局、最多用 10 个参考图合成，商业权重已开放，开放权重版将在未来数周发布。", "type": "model", "relTime": "1周前"}, {"id": 69, "title": "Higgsfield 上线 Black Forest Labs 的 FLUX 3 Image", "source": "X：Higgsfield AI (@higgsfield)", "sourceUrl": "https://x.com/higgsfield/status/2105757917651906978", "date": "2026-10-01T20:33:05.000Z", "summary": "Higgsfield 宣布 FLUX 3 Image 已在其平台上线，该模型来自 Black Forest Labs。支持只改一处细节不动其余部分、用 bounding box 放置物体、最多组合 10 个参考图，以及生成最高 4K 分辨率图像。", "type": "model", "relTime": "1周前"}, {"id": 70, "title": "FLUX 3 Image 上线 fal 平台", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2105745492474802514", "date": "2026-10-01T19:43:42.000Z", "summary": "fal 宣布 FLUX 3 Image 已上线平台，主打精准图像编辑且保留未改动部分。该模型支持原生 2K 和 4K 图像生成、最多组合 10 张参考图、一次完成多个定点编辑，并可对布局和构图做细致控制。", "type": "model", "relTime": "1周前"}, {"id": 71, "title": "Tavus 发布 Griffin 视频对话模型，称其首个通过视频图灵测试", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2105724860831781279", "date": "2026-10-01T18:21:43.000Z", "summary": "Tavus 发布 Griffin，称其为首个通过视频图灵测试的 Human Interaction Model，48% 与其实时对话的人以为对方是真人，此前系统通过率低于 3%。作者获早期访问体验，称该视频到视频模型可边看边听、打断和被打断并反应房间内发生的事；在 NVIDIA Video Full-Duplex Benchmark 上生成得分 3.83/5，真人为 3.92。", "type": "model", "relTime": "1周前"}, {"id": 72, "title": "Claude Slides 演示 Anthropic 设计师从语音备忘录生成幻灯片", "source": "Claude：YouTube（RSS）", "sourceUrl": "https://www.youtube.com/shorts/NzcRprKWbD8", "date": "2026-10-01T18:07:31.000Z", "summary": "Claude 官方视频展示 Anthropic 设计师 Nate 如何使用 Claude Slides 制作演示文稿。他在散步时用手机录一段整理思路的语音备忘录，再与 Claude 一起把想法打磨成幻灯片，把时间花在想法本身而非排版上。", "type": "tip", "relTime": "1周前"}, {"id": 73, "title": "Google DeepMind 播客探讨 AI 内容溯源与水印", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2105707085287567709", "date": "2026-10-01T17:11:05.000Z", "summary": "当 AI 生成内容变得如此逼真，我们如何验证哪些是人、机器或自然创造的？  我们在播客中探讨溯源的关键作用——以及不可感知的水印如何同时保护数字媒体和生物设计。↓  时间轴： 00:00 介绍 00:34 什么是水印？ 04:35 SynthID 15:16 图像与视频 19:28 SynthID Bio 28:00 韧性的未来", "type": "tip", "relTime": "1周前"}, {"id": 74, "title": "Perplexity Computer 支持交互式图表", "source": "X：Perplexity (@perplexity_ai)", "sourceUrl": "https://x.com/perplexity_ai/status/2105692220280226296", "date": "2026-10-01T16:12:01.000Z", "summary": "Perplexity Computer 现在可以直接在你的对话线程中创建交互式图表和可视化。  对于金融数据，Computer 使用 @tradingview Lightweight Charts 来生成K线图、成交量和移动平均线。", "type": "paper", "relTime": "1周前"}, {"id": 75, "title": "Runway 推出 Project Continuum 实时视频界面系统", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2105685396734853582", "date": "2026-10-01T15:44:54.000Z", "summary": "介绍 @runwayml_labs 的 Project Continuum，一个围绕实时视频界面构建的全新操作系统研究应用。  今天，我们分享四种与计算机交互新方式的早期预览：Portals、Visual Thinking、Responsive Video Interfaces 和 Interactive Worlds。像 Solaris 这样的 Interface World Models...", "type": "model", "relTime": "1周前"}, {"id": 76, "title": "Manus 2.0 + Tripo 工作流实测", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2105674095946064334", "date": "2026-10-01T15:00:00.000Z", "summary": "从一句提示词开始。2 小时做出可玩的游戏。🚀  我们测试了全新的 Manus 2.0 + Tripo 工作流：  • @ManusAI 构建了核心机制和 HTML 游戏逻辑。 • Tripo 生成了高质量 3D 资产来替换占位模型。  看看实际转变效果。", "type": "model", "relTime": "1周前"}, {"id": 77, "title": "华为 Mate XT 2 三折叠手机获 HarmonyOS 7.0.0.109 SP8 升级，通信共享支持多人互助", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/160.htm", "date": "2026-10-01T14:23:44.000Z", "summary": "华为 Mate XT 2 非凡大师三折叠手机推送 HarmonyOS 7.0.0.109 SP8 更新，锁屏新增 3D 空间壁纸，通信共享升级为手机与搭载 HarmonyOS 7 的手机、平板、鸿蒙电脑之间支持多人互助通信共享。图库支持静态/动态照片生成 3D 动态照片并添加多种空间运镜效果，深色模式可随日出日落自动切换，小艺优化了多模态基础大模型推理速度。", "type": "model", "relTime": "1周前"}, {"id": 78, "title": "OpenRouter 上线 Pareto 26.10 预览版", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2105661806186500286", "date": "2026-10-01T14:11:10.000Z", "summary": "1/ 来自 @theunbiasedco 的 Pareto 26.10 Preview 现已在 OpenRouter 上线，输入 $0.80/M、输出 $3.20/M，而当前 Pareto 为 $2.50/$7.50。  一款面向研究、编程和智能体工作流的多模态复合模型，具备 1M 上下文、文本和图像输入，以及工具调用能力。", "type": "model", "relTime": "1周前"}, {"id": 79, "title": "Figure 让 F.02 人形机器人跳入熔炉退役，采纳施瓦辛格本人提议", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/009/159.htm", "date": "2026-10-01T14:03:36.000Z", "summary": "Figure 为退役的 F.02 人形机器人举行\"火化仪式\"，让机器人亲自跳入熔炉，这一想法源自《终结者 2》T-800 扮演者施瓦辛格本人的提议。施瓦辛格身穿全套防护装备到场，带领一台 F.02 走向熔炉，并在视频结尾摘下面具宣布\"Figure 2 已经退役\"。", "type": "industry", "relTime": "1周前"}, {"id": 80, "title": "Synthesia 发布 Sessions 交互式 AI 数字人，支持实时对话练习与访谈", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2105649227690873228", "date": "2026-10-01T13:21:11.000Z", "summary": "Synthesia 发布 Sessions，一套可实时对话的交互式 AI 数字人，用于教练辅导、面试和引导式访谈。包含两类场景：Roleplay Sessions 用于实时练习销售通话和求职面试，结束后 AI 教练为每项技能打分并讲解；Survey Sessions 用数字人开展访谈、收集反馈与洞察。Synthesia 的数字人此前只能单向播放培训视频，现在可实时对话和回应。", "type": "paper", "relTime": "1周前"}, {"id": 81, "title": "PixVerse 将在 NAB Show NY 展示 AI 视频工作流", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2105513007279432171", "date": "2026-10-01T04:19:54.000Z", "summary": "AI 视频正在超越一次性生成。真正的机会在于更快、更灵活的制作工作流，从概念到成品内容。  我们将在 #NABShowNY 现场展示这一工作流，10 月 21-22 日，纽约。  10 月 21 日第一天结束后，欢迎加入我们的 happy hour。", "type": "industry", "relTime": "1周前"}, {"id": 82, "title": "谷歌 DeepMind 推出 SynthID Bio，为 AI 生成的蛋白质嵌入可验证水印", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/008/940.htm", "date": "2026-10-01T01:28:53.000Z", "summary": "谷歌推出 SynthID Bio，将数字水印技术引入合成生物学，通过引导氨基酸选择和调整预测 3D 结构的原子坐标，把可检测签名嵌入生物编码，并能在物理蛋白质上验证。", "type": "paper", "relTime": "1周前"}, {"id": 83, "title": "OneStreamer：统一流式视频交互中的感知、记忆与主动响应", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.01762", "date": "2026-10-01T00:00:00.000Z", "summary": "OneStreamer 通过共享的主动生成过程，联合学习与查询无关的证据记录和任务响应，其 Proactive Hierarchical Caption Memory（PHCM）生成带时间定位的局部细节描述与已完成事件摘要。", "type": "paper", "relTime": "1周前"}, {"id": 84, "title": "Where-OPD：用合成场景对 MLLM 做空间引导的在线自蒸馏", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.02117", "date": "2026-10-01T00:00:00.000Z", "summary": "Where-OPD 提出一种面向多模态大模型（MLLM）的在线自蒸馏方法，让教师模型获得文本形式的空间定位引导，从而定位并整合多个相关图像区域的证据，学生模型仅凭图像和问题学习复现该行为。", "type": "paper", "relTime": "1周前"}, {"id": 85, "title": "HC-DLM：分层连续扩散语言模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.02193", "date": "2026-10-01T00:00:00.000Z", "summary": "研究者提出分层连续扩散语言模型（HC-DLM），将离散 token 生成与连续隐变量轨迹耦合进单一去噪过程，训练目标由 token 似然的变分下界推导而来。与把连续上下文附加到离散链上的做法不同，HC-DLM 让隐变量成为唯一持续存在的生成状态，每步从中读出 token 并反馈为下一步隐状态更新的脚手架。", "type": "paper", "relTime": "1周前"}, {"id": 86, "title": "OmniSeek：面向多轮音视频推理的原生工具集成框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.02181", "date": "2026-10-01T00:00:00.000Z", "summary": "OmniSeek 是一个将 Omni-LLM 转变为原生工具调用多轮推理智能体的框架，让模型在推理中动态决定看或听、以及选取哪段时间窗口，把检索到的原始音视频片段回填上下文。", "type": "paper", "relTime": "1周前"}, {"id": 87, "title": "AutoGUIWorld：用图像生成器作为 GUI 智能体的视觉世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.01215", "date": "2026-10-01T00:00:00.000Z", "summary": "AutoGUIWorld 是一个数据生成框架，用图像生成器的视觉先验加规划器的任务知识合成 GUI 交互轨迹，无需部署或运行真实软件环境。它从操作系统上下文、视觉外观和界面状态的结构化规格中采样初始场景，经动作 grounding 与转移级质量过滤，在 Ubuntu、Windows、macOS 和 Chrome 上产出 79,266 条带空间标注的 step 级训练样本。", "type": "paper", "relTime": "1周前"}, {"id": 88, "title": "Omni-Embed-Mini：通过稠密蒸馏绑定多模态而不遗忘文本能力", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.02148", "date": "2026-10-01T00:00:00.000Z", "summary": "Omni-Embed-Mini 是一个 0.9B 参数的多模态嵌入模型，可将文本、语音、音频、图像、视频和富视觉文档映射到同一余弦空间，且不更新任何文本侧参数。", "type": "paper", "relTime": "1周前"}, {"id": 89, "title": "4Director：用刚性 3D 几何控制视频世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.02160", "date": "2026-10-01T00:00:00.000Z", "summary": "4Director 是一个以显式 4D 场景表示为条件的视频世界模型，每个物体从输入图像重建为规范网格，并由每帧一个预设刚性变换驱动。它把受控场景渲染为深度视频，再用 Motion Adapter 生成视角一致的外观、光照与非刚性动态。", "type": "paper", "relTime": "1周前"}, {"id": 90, "title": "SILSA：用滑动窗口切片隐变量实现保拓扑高分辨率 3D 生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.02201", "date": "2026-10-01T00:00:00.000Z", "summary": "SILSA 是一个拓扑感知的 3D 生成框架，用沿三个坐标轴的固定重叠切片隐变量替代昂贵的体素 token，每个 token 概括局部深度窗口，支持单阶段 rectified-flow 生成。", "type": "paper", "relTime": "1周前"}, {"id": 91, "title": "VTR-Bench：评估视频生成中视觉文本渲染的系统性基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.01499", "date": "2026-10-01T00:00:00.000Z", "summary": "VTR-Bench 是用于评估视频生成模型视觉文本渲染能力的系统性基准，包含覆盖广告、科学视频等五类场景的 300 条提示词，并配套自动化评估流程。在 11 个 SOTA 模型上的实验显示，场景文本渲染普遍存在困难，表现最好的模型整体词错误率（WER）为 0.250。", "type": "paper", "relTime": "1周前"}, {"id": 92, "title": "Ego2Act：评估第一视角视频生成中的目标导向操作", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.01092", "date": "2026-10-01T00:00:00.000Z", "summary": "Ego2Act 是一个面向目标导向的第一视角视频生成基准，包含来自 110 个真实世界任务的 2,640 段视频，覆盖不同物体杂乱程度与多步复杂度。该基准要求模型根据初始场景图像和高层目标，生成手部操作物体完成任务的逼真第一视角视频，并配套推出无参考评估流程 Ego2ActJudge。", "type": "paper", "relTime": "1周前"}, {"id": 93, "title": "扩展与蒸馏文本嵌入以提升扩散语言模型可扩散性", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.01016", "date": "2026-10-01T00:00:00.000Z", "summary": "研究发现，将嵌入模型从 T5 扩展到 T5Gemma-1、T5Gemma-2 可显著提升扩散语言模型生成性能，但原始 T5Gemma-2 嵌入区分度过高，导致连续扩散易落入无效嵌入。", "type": "paper", "relTime": "1周前"}, {"id": 94, "title": "ROWBench：视频模型能否渲染出程序所指定的内容？", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.02205", "date": "2026-10-01T00:00:00.000Z", "summary": "PROWBench 基准发布，包含 170 个程序化构建的 episode 和 600 段代理视频，用于检验视频模型对程序指定世界事件的视觉还原能力。该基准记录实体状态与带时间戳事件（含镜头视野外事件）作为可回放世界记录，并渲染同步视图，覆盖第一、第三人称视角。", "type": "paper", "relTime": "1周前"}, {"id": 95, "title": "fal CTO 谈视频生成与编程智能体", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2105440992057086190", "date": "2026-09-30T23:33:44.000Z", "summary": "视频生成和编程智能体正在定义一类新的 AI 工作负载。个人在日常工作中正高效地消耗大量算力。  fal CTO @gorkem 上周在我们的 GenMedia Conference 上与 MTS 对话，谈“token market fit”。", "type": "tip", "relTime": "1周前"}, {"id": 96, "title": "苹果 Invites App 升级 1.12.0：支持全分辨率照片共享、扩展图乐园", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/008/956.htm", "date": "2026-09-30T23:24:16.000Z", "summary": "苹果 Invites App 更新至 1.12.0 版本，共享相册现支持全分辨率照片共享，任何收到链接的人均可加入并上传照片，包括非 Apple 设备用户。新版扩展图乐园（Image Playground）功能，新增照片级逼真背景生成能力，并简化邮箱验证流程，宾客点击收件箱链接即可加入活动，无需输入验证码。创建活动需订阅 iCloud+（50GB 起，月费 0.99 美元），接收链接者可免费回复。", "type": "product", "relTime": "1周前"}, {"id": 97, "title": "Runway Research 谈实时模型与机器人", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2105432353334325716", "date": "2026-09-30T22:59:24.000Z", "summary": "在一场深度问答中，Runway Research 团队聊了实时模型、生成式界面，以及机器人技术的下一步。", "type": "tip", "relTime": "1周前"}, {"id": 98, "title": "LongLive-Plug：视频生成通用蒸馏", "source": "X：AK (@_akhaliq)", "sourceUrl": "https://x.com/_akhaliq/status/2105432314633490445", "date": "2026-09-30T22:59:15.000Z", "summary": "LongLive-Plug  视频生成的通用蒸馏  论文：https://huggingface.co/papers/2609.38154", "type": "paper", "relTime": "1周前"}, {"id": 99, "title": "Hidream-O1-Video-1.0 以 1456 分登顶 Image-to-Video Arena 第 7 名", "source": "X：Arena (@arena)", "sourceUrl": "https://x.com/arena/status/2105425599095624143", "date": "2026-09-30T22:32:34.000Z", "summary": "Hidream-O1-Video-1.0 以 1456 分进入 Image-to-Video Arena 排行榜第 7 名，可通过 @vivago_ai 使用。该模型与 gemini-omni-flash 仅差 8 分，与 dreamina-seedance-2.0 和 2.5 的分差在 20 分以内。", "type": "model", "relTime": "1周前"}, {"id": 100, "title": "OpenRouter 视频生成支持种子复现", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2105401147234431243", "date": "2026-09-30T20:55:24.000Z", "summary": "4/ 设置种子即可重跑一次生成，每次只改一个变量。片段时长 5 到 15 秒，分辨率 480p 或 768p，支持从 21:9 到 9:16 的六种宽高比。", "type": "paper", "relTime": "1周前"}, {"id": 101, "title": "OpenRouter 介绍单模型覆盖 T2V/I2V/Ref2V", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2105401135662248190", "date": "2026-09-30T20:55:21.000Z", "summary": "3/ 一个模型覆盖文生视频（T2V）、图生视频（I2V）和参考生视频（Ref2V）。可以从提示词、首帧，或你自己的图像、视频和音频参考出发，并在提示词中逐一指向它们。", "type": "model", "relTime": "1周前"}, {"id": 102, "title": "HeyGen Video 1 登陆 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2105401123985297766", "date": "2026-09-30T20:55:19.000Z", "summary": "2/ 定价为每个渲染秒 $0.02 起，10 月前享 50% 折扣即 $0.01。图像和音频参考免费。  https://openrouter.ai/heygen/heygen-video-1", "type": "paper", "relTime": "1周前"}, {"id": 103, "title": "Anthropic：机器人普及或慢于AI", "source": "X：Peter McCrory（Anthropic 首席经济学家，@PeterMcCrory）", "sourceUrl": "https://x.com/PeterMcCrory/status/2105366167129121161", "date": "2026-09-30T18:36:24.000Z", "summary": "机器人技术在经济中的扩散，可能比 AI 的采用需要更长时间。  在近期的情景建模工作中，我们只考察了 AI 到 2030 年的影响。  若要展望更远的未来，则需要对机器人投资与采用的经济学进行更细致的建模。", "type": "tip", "relTime": "1周前"}, {"id": 104, "title": "Runway 发布 Runway Ads，端到端自动化效果广告创意生成与投放", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/company-news/introducing-runway-ads", "date": "2026-09-30T18:32:00.000Z", "summary": "Runway 发布 Runway Ads，一个面向效果营销的自主引擎，可连接广告账户和品牌套件，生成视频和图片创意并直接发布到 Meta、Google 和 TikTok，读取平台表现数据后生成下一轮创意。", "type": "paper", "relTime": "1周前"}, {"id": 105, "title": "Manus 用 Tripo AI 模型做 3D 赛车游戏", "source": "X：Manus (@ManusAI)", "sourceUrl": "https://x.com/ManusAI/status/2105361014531461378", "date": "2026-09-30T18:15:56.000Z", "summary": "用 Manus Game Dev 把一个想法变成好玩的 3D 赛车游戏。🏎️  赛车呢？由我们的合作伙伴 @tripoai 生成的 3D 模型。", "type": "model", "relTime": "1周前"}, {"id": 106, "title": "Runway 发布开放权重世界动作模型 Praxis-1", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2105358708599619790", "date": "2026-09-30T18:06:46.000Z", "summary": "Runway 推出开放权重世界动作模型 Praxis-1，将视频预训练能力转化为机器人真实世界控制，定位为可跨任意具身形态与环境的策略模型。该模型基于其大规模视频预训练与实时基础设施构建，官方称机器人演示数据有限而视频数据无限。Runway 正与 Noble Machines、Standard Bots、Ultra 等早期伙伴测试，并将在未来数月公开权重。", "type": "model", "relTime": "1周前"}, {"id": 107, "title": "JBR-001：基于 Arduino UNO Q 的开源可 3D 打印桌面机器人", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://projecthub.arduino.cc/syntheticaidata/jbr-001-a-desktop-companion-robot-powered-by-arduino-uno-q-b11c96", "date": "2026-09-30T17:26:06.993Z", "summary": "JBR-001 是一款基于 Arduino UNO Q 的开源、可 3D 打印桌面陪伴机器人，集摄像头、距离传感器、蜂鸣器、动画显示屏和三个舵机于一体，可支持计算机视觉与边缘 AI 实验。其 STL 文件已开放下载，用户可自行打印、组装和编程扩展。", "type": "tip", "relTime": "1周前"}, {"id": 108, "title": "Vivix 推出 A1 Playground + Agent 实时交互角色模型", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2105342413422366989", "date": "2026-09-30T17:02:01.000Z", "summary": "Vivix 发布 A1 Playground + Agent，可创建能说话、移动和与人互动的实时 AI 角色，支持上传图片定制形象、性格和声音，并开放了 platform.vivix.ai 的创建入口。", "type": "model", "relTime": "1周前"}, {"id": 109, "title": "NVIDIA 开放 2027–2028 研究生奖学金申请，最高 6 万美元", "source": "NVIDIA Blog（RSS）", "sourceUrl": "https://blogs.nvidia.com/blog/applications-open-graduate-fellowship-awards-2026/", "date": "2026-09-30T17:00:21.000Z", "summary": "NVIDIA 第 26 届研究生奖学金项目面向全球开放申请，每位学生最高可获 6 万美元资助，覆盖 AI、机器学习、自动驾驶、计算机图形、机器人、医疗和高性能计算等方向。", "type": "industry", "relTime": "1周前"}, {"id": 110, "title": "研究称 Cloudflare、Google 等基础设施服务商助长 AI 换脸滥用图像网站", "source": "404 Media（RSS）", "sourceUrl": "https://www.404media.co/deepfake-abuse-sites-infrastructure-providers-study/", "date": "2026-09-30T16:02:39.000Z", "summary": "发表于斯坦福 Journal of Online Trust and Safety 的研究识别了88个活跃托管未经同意 AI 生成亲密图像的网站，指出 Cloudflare、Google、Namecheap、WordPress 和 Proton 五家为主要基础设施服务商，其中 Cloudflare 提供了大部分托管、CDN 和域名解析服务，尽管各家服务条款均禁止非法内容。", "type": "paper", "relTime": "1周前"}, {"id": 111, "title": "Destro AI 获 800 万美元种子轮，用智能层让机器人与人类协同作业", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/30/destro-ais-secret-sauce-is-getting-robots-and-humans-on-the-same-page/", "date": "2026-09-30T16:00:00.000Z", "summary": "Destro 结束隐身状态并完成 800 万美元种子轮融资，由 Base10 Partners 和 Bonfire Ventures 领投。它不做机器人本体，而是用基于开放权重视觉-语言-动作模型的 Vision 操作系统和 Mothership 操作系统，统一调度机器人、货物与人工，已在 Yusen Logistics 落地试点，并计划扩展至 26 台机器人的完整部署。", "type": "industry", "relTime": "1周前"}, {"id": 112, "title": "Manus 分享视频生成与时间线编辑工作流", "source": "Manus：Blog（网页）", "sourceUrl": "https://manus.im/zh-cn/blog/introducing-video-editor", "date": "2026-09-30T16:00:00.000Z", "summary": "Manus 分享使用既有视频能力的创作经验：先由 AI 搜索参考、制作镜头与代码视觉元素，再在 Manus Studio 的视频编辑器中逐轨调整画面、字幕、配乐和音效。教程还演示导入本地素材、自动转录与编排初剪，以及将长视频剪成短片；作者以 125 段旅行素材整理成约 11 分钟成片为例，说明如何把生成初稿继续打磨为可发布作品。", "type": "tip", "relTime": "1周前"}, {"id": 113, "title": "Kled V3 发布：72 小时部署 AI 数据采集", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2105321861311517004", "date": "2026-09-30T15:40:21.000Z", "summary": "Kled 发布 V3。定制 AI 数据采集任务现可在 72 小时内部署给 500,000+ 贡献者。  108 个可配置任务模板，覆盖图像、视频、音频、文本和标注。从第一视角视频到稀有语言的对话语音，应有尽有。  每天采集 800 万个数据点。  现实世界正在变得可编程 🌍", "type": "industry", "relTime": "1周前"}, {"id": 114, "title": "Tripo API 集成 Unbound", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2105311720600170705", "date": "2026-09-30T15:00:03.000Z", "summary": "Tripo API 现已集成 @unbound_io。  将 Tripo P2 干净、可编辑的四边形拓扑直接带入实时雕刻流程。实时编辑 3D 几何体，即刻导出可用于生产的资产。无需无休止的清理，也不需要 Blender 技能。  由 Tripo 生成。使用 Unbound 实时雕刻。", "type": "product", "relTime": "1周前"}, {"id": 115, "title": "PixVerse 插件将音乐生成 MV", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2105296747367145815", "date": "2026-09-30T14:00:33.000Z", "summary": "用 PixVerse 插件把你的音乐变成 MV 或音乐可视化 告诉你的 AI 智能体你想要的情绪、风格和视觉效果 让它用 PixVerse 把想法呈现在屏幕上", "type": "paper", "relTime": "1周前"}, {"id": 116, "title": "Artificial Analysis 发布 AA-Video-T2V v2.0 文生视频评测基准，Wan 3.0 居首", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2105291240573190370", "date": "2026-09-30T13:38:40.000Z", "summary": "Artificial Analysis 发布 AA-Video-T2V v2.0 和无音频版 AA-Video-T2V-Silent v2.0 文生视频基准，统一以 1080p 高码率评估，按 10 种用例、10 种能力和多种视觉风格排名，分别基于超 68,000 票（1,000+ prompts）和超 47,000 票（500 prompts）的人工偏好投票。", "type": "paper", "relTime": "1周前"}, {"id": 117, "title": "新加坡男子用 Gemini 生成鳄鱼侵袭水库图片被起诉，最高或面临 10 年监禁和 1 万新币罚款", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/008/909.htm", "date": "2026-09-30T13:01:44.000Z", "summary": "新加坡男子 Ye Lin 因用谷歌 Gemini 生成鳄鱼出现在 Pandan 水库的图片并发给同事，被指控传播虚假信息和妨碍司法公正，最高可判 10 年监禁、罚款 1 万新加坡元（约合 52,585 元人民币）。图片在网上扩散后，水务机构 PUB 接报搜寻鳄鱼并禁止水上活动，次日发现图片不实后报警；Ye Lin 随后删除了图片和操作记录，将于 11 月 10 日再次出庭。", "type": "industry", "relTime": "1周前"}, {"id": 118, "title": "商汤 SenseNova 6.8 Flash 预览动态设计功能", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2105266408531570825", "date": "2026-09-30T12:00:00.000Z", "summary": "商汤预览由 SenseNova 6.8 Flash 驱动的 Dynamic Design，可将静态图像转为动态设计。该功能会理解文本、主体与视觉元素的关系，决定哪些保持静态、哪些做动画，并为每个元素选择 HTML/CSS、SVG、透明图片或视频等合适形式，再编排文字显现、主体运动与环境响应，最后对照源设计检查并优化输出。", "type": "paper", "relTime": "1周前"}, {"id": 119, "title": "Meshy 7 实现包装文字精准生成", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2105243758870638787", "date": "2026-09-30T10:30:00.000Z", "summary": "AI 生成的包装上的文字：模糊、残缺，总要修一轮。这次不一样。😎  我们搭了一整架玩具。看看盒子上的字。  Meshy 7 直接从你的输入图像带来准确的文字、风格和颜色。一次生成，就能得到你想要的纹理。🎨  提示：想用同一种风格做一整套？用 3D Agent 批量处理，现已结束 beta。", "type": "paper", "relTime": "1周前"}, {"id": 120, "title": "千问「逛展锦囊」上线：特展购票、随拍随问、方言讲解一站式搞定", "source": "公众号：千问APP（阿里）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzYzNDE5MDEwMQ==&mid=2247489074&idx=1&sn=88f11f43f50b74eceee902ad5cd1a153&chksm=f13c8340a063bb13701734b15e61307a953e0505b24395e6175488581cb7e5f1be45f4ff5ecf&scene=126&sessionid=1790762314#rd", "date": "2026-09-30T09:45:23.000Z", "summary": "千问APP推出十一假期「逛展锦囊」，用户可通过@山海文博展览助手查询特展信息并直接购票，逛展时用千问相机拍下展品即可获得讲解。该功能基于千问大模型的原生多模态视觉理解能力，结合文物类专项训练和海量博物馆数据，还支持切换「四川道长」等定制音色。", "type": "tip", "relTime": "1周前"}, {"id": 121, "title": "豪威推出常开型视觉 AI 协处理器 OAX7700，停车监控方案仅需 3% 功耗", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/008/624.htm", "date": "2026-09-30T03:04:54.000Z", "summary": "豪威（OmniVision）发布常开型视觉 AI 协处理器 OAX7700，基于它构建的停车监控系统功耗仅为市面现有方案的 3%。该芯片集成 NPU，具备人体检测、人与物体识别、距离测算等边缘 AI 能力，可将现有车载外摄像头方案升级为超低功耗停车监控系统，检测到事件后录制 5~10 秒预录视频交由电子控制单元核验。", "type": "paper", "relTime": "1周前"}, {"id": 122, "title": "剑桥等机构研究提出 vibercrime 概念：AI 加速廉价诈骗但未造出新黑客", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2105114842910884110", "date": "2026-09-30T01:57:44.000Z", "summary": "Jack Hughes、Ben Collier 和 Daniel R. Thomas 的论文分析近10万条网络犯罪论坛相关帖子，提出 vibercrime 一词：AI 是便利帮手而非犯罪的即插即用工具。生成式AI 主要扩大垃圾网站、机器人账号和拟人化诈骗信息的规模，编码助手多为已有编程能力者省时，尚未显著降低技术门槛或催生创新性黑客手段。", "type": "paper", "relTime": "1周前"}, {"id": 123, "title": "livenerf 开源：用预注册基准长期检测 Claude Opus 5.5 发布后是否被削弱", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://github.com/ninjahawk/livenerf", "date": "2026-09-30T00:22:06.110Z", "summary": "livenerf 是一个 append-only 基准项目，目标是检测 Claude Opus 5.5 在 2026-09-22 发布后性能是否随时间漂移。", "type": "tip", "relTime": "1周前"}, {"id": 124, "title": "Google 如何在 TPU 上加速视频扩散模型的时空注意力", "source": "Google Developers Blog（RSS）", "sourceUrl": "https://developers.googleblog.com/accelerating-spatio-temporal-attention-for-video-diffusion-on-tpus/", "date": "2026-09-30T00:00:00.000Z", "summary": "Google 在 TPU 上通过稀疏注意力内核优化加速视频扩散模型推理，将理论稀疏性转化为端到端实际加速。", "type": "tip", "relTime": "1周前"}, {"id": 125, "title": "生成式行为克隆如何表征多模态专家行为", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2605.22493", "date": "2026-09-30T00:00:00.000Z", "summary": "研究分析了生成式行为克隆策略在相同观测对应多个有效动作时的多模态表征瓶颈：隐变量策略需在潜表征中保留动作条件信息，过强的后验-先验正则化会抑制该信息，正则化过弱则依赖部署时先验覆盖相关潜区域；动作空间生成策略则受限于基空间到动作空间传输映射的平滑性，小 Lipschitz 常数难以覆盖多个分离模态。", "type": "paper", "relTime": "1周前"}, {"id": 126, "title": "WorldAuditBench：用多模态智能体审计交互式 3D 世界", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.40325", "date": "2026-09-30T00:00:00.000Z", "summary": "研究者推出 WorldAuditBench，一个面向 3D 世界审计的基准，包含 13 个基于 Unreal Engine 5 和 Three.js 构建的环境中的 213 个异常任务，覆盖五类异常。在固定探索预算下评测五款前沿模型，两种审计范式的成功率仅为 6.6% 至 42.3%，远低于人类的 83.4%。该基准用于研究多模态智能体如何在交互式 3D 环境中耦合动作与视觉推理。", "type": "paper", "relTime": "1周前"}, {"id": 127, "title": "MemLife：面向长期第一人称视频记忆的整理与推理系统", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.40195", "date": "2026-09-30T00:00:00.000Z", "summary": "MemLife 是一个多模态记忆系统，通过构建实体锚定的第一人称文本片段，并用时间索引的智能体读取器进行检索，在无需训练、查询时不访问原始视频的情况下，于四个长期基准上比最强免训练基线提升 4.6–12.0%。配套的 MemOpt 强化学习框架优化记忆写入器，使 MemLife 再提升 2.7–5.0%，且增益可跨写入器、读取器骨干和记忆系统泛化。", "type": "paper", "relTime": "1周前"}, {"id": 128, "title": "Physis-Lang：以自演化语言作为视频世界模型的物理表征", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.40358", "date": "2026-09-30T00:00:00.000Z", "summary": "Physis-Lang 提出用自演化语言作为视频世界模型的物理表征，统一数据筛选、模型训练与视频生成，并构建 PhysCapBench 将物理过程拆解为原子断言、以召回率和精确率评估描述质量。在 Wan 与 Cosmos 骨干上，该方法在四个物理视频基准上持续提升物理合理性；基于开源 Cosmos3-Nano 的增强模型超过领先的闭源 Veo 3.1。", "type": "paper", "relTime": "1周前"}, {"id": 129, "title": "CoEvoWhen：面向超长视频时序定位的策略-工具协同演化", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.40048", "date": "2026-09-30T00:00:00.000Z", "summary": "研究者提出 CoEvoWhen 策略-工具协同演化框架，从 VLM 的智能体推理轨迹中联合演化高层策略与可执行媒体工具，形成可复用技能且无需更新模型参数。在五个 benchmark 和三个 VLM 上，该方法持续提升超长视频时序定位准确率，同时降低推理时的视觉 token 开销，演化出的技能在通用长视频 QA 上也取得显著提升。", "type": "paper", "relTime": "1周前"}, {"id": 130, "title": "SpatialCORE：大型视觉语言模型中的置信度感知空间推理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38716", "date": "2026-09-30T00:00:00.000Z", "summary": "SpatialCORE 是一个后训练框架，将模型对生成式定位的自身置信度转化为空间推理的学习信号，通过自调节空间奖励按坐标 token 置信度加权每个预测边界框的匹配质量，并用答案门控将定位优化与最终答案正确性绑定。该框架在多个 benchmark 上取得开源及专用空间推理模型中的 SOTA 结果，并可零样本迁移到未见数据分布，源代码已公开。", "type": "paper", "relTime": "1周前"}, {"id": 131, "title": "DC-SAE：面向更快扩散收敛的深度压缩语义自编码器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.39222", "date": "2026-09-30T00:00:00.000Z", "summary": "DC-SAE 是一种解耦紧凑语义自编码器，通过语义编码器实现高压缩比、并用像素级编码器保留细节，从而兼顾高压缩与快速扩散训练收敛。在 ImageNet 512×512 上实现 32 倍空间压缩，PSNR 29.79、gFID 3.37，较 DC-AE 分别提升 13.5% 和 54.9%。", "type": "paper", "relTime": "1周前"}, {"id": 132, "title": "RSIGame：基于递归自我改进的自主智能体游戏开发框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.39045", "date": "2026-09-30T00:00:00.000Z", "summary": "RSIGame 是一个带递归自我改进的自主智能体游戏开发框架，通过局部“探索-诊断-改进”循环与全局质量跟踪循环，缓解迭代优化对少量测试用例的过拟合。在 140 个 GameCraft-Bench 任务、两个游戏引擎和五个生成器上，RSIGame 在相同开发预算下持续提升游戏质量。", "type": "paper", "relTime": "1周前"}, {"id": 133, "title": "UniEvo-VL：面向多模态模型自我改进的在线自蒸馏训练方案", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.38721", "date": "2026-09-30T00:00:00.000Z", "summary": "UniEvo-VL 提出一种无需外部教师模型的多模态自进化训练方案，让同一模型分别以学生和教师身份、基于不同上下文进行在线自蒸馏，在自身采样轨迹上最小化去噪扩散分布差异。", "type": "paper", "relTime": "1周前"}, {"id": 134, "title": "SemanTok：为高效自回归视频生成提供可预测的语义 token", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.00686", "date": "2026-09-30T00:00:00.000Z", "summary": "SemanTok 是一种灵活视频 tokenizer，将冻结的 DINO 特征输入编码器，并加入轻量 head，使每个保留的 token 前缀都能单独重建这些特征。201M 的 SemanTok AR 模型匹配或超越 3.4 倍规模的 VideoFlexTok AR 模型，更大模型还能进一步提升保真度。它在分布外类别上保持语义对齐，并在包括纯噪声在内的各噪声水平上为解码器提供更高语义对齐。", "type": "paper", "relTime": "1周前"}, {"id": 135, "title": "Multimodal Flow：在嵌入空间统一语言与视觉的流建模", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.40362", "date": "2026-09-30T00:00:00.000Z", "summary": "Multimodal Flow 提出一种全连续的多模态生成模型，将文本块与图像组织为有序连续 hyperchunk，通过共享 chunk-causal flow backbone 和 Flow Matching 学习统一向量场，并用联合注意力实现跨模态交互。", "type": "paper", "relTime": "1周前"}, {"id": 136, "title": "视频生成模型的后期训练与对齐综述", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.00812", "date": "2026-09-30T00:00:00.000Z", "summary": "一篇综述首次系统梳理视频生成模型的后期训练与对齐，将其统一为隐式对齐与显式对齐两类框架。方法被归为四类：监督微调、自训练与蒸馏、偏好与奖励方法、推理时方法。文章还整理了常用数据集、benchmark 与评测实践，并讨论可扩展奖励设计、长时程时序一致性、稳定性与表现力权衡及安全生成等开放挑战。", "type": "paper", "relTime": "1周前"}, {"id": 137, "title": "PhysVista：用感知-推理-评估闭环评测 VLM 的物理智能", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.00559", "date": "2026-09-30T00:00:00.000Z", "summary": "PhysVista 是一个通过\"感知-推理-评估\"闭环框架评测 VLM 物理智能的 benchmark，联合考察物理状态感知、物理动力学推理与物理合理性评估，并区分事件级与尺度级推理。它同时纳入真实世界与 AI 生成视频，覆盖多领域及新兴生成场景。实验显示，多种 VLM 在物理推理与合理性评估上存在明显不足，视觉识别与真正的物理理解之间仍有持续差距。", "type": "paper", "relTime": "1周前"}, {"id": 138, "title": "Honeycomb：为视频世界模型提供恒定大小的场景记忆表示", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.37690", "date": "2026-09-30T00:00:00.000Z", "summary": "视频世界模型 Honeycomb 提出 HexMemory 低秩表示，用六个空间与时空平面以固定大小存储场景特征，避免现有空间记忆随生成过程不断累积 RGB 观测或潜特征。", "type": "paper", "relTime": "1周前"}, {"id": 139, "title": "EgoTools：面向真实第一视角视频的工具中心推理数据集与基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.39378", "date": "2026-09-30T00:00:00.000Z", "summary": "研究团队推出 EgoTools，首个面向第一视角工具使用理解的综合套件，包含 100 小时带同步音频、密集描述与 3D 信息的 EgoTools-Data，以及覆盖四个赛道的 1000 对 QA 诊断基准 EgoTools-Bench。", "type": "paper", "relTime": "1周前"}, {"id": 140, "title": "PixelDense：把稠密预测用作像素扩散的表征对齐", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.00483", "date": "2026-09-30T00:00:00.000Z", "summary": "PixelDense 将 DINOv2、SAM2 与 Depth Anything v2、Metric3D v2 分别路由到语义和几何两条投影流，并用权重空间正交惩罚让两流保持子空间不相交，四个教师模型训练时冻结、推理时丢弃。", "type": "paper", "relTime": "1周前"}, {"id": 141, "title": "基于推理与反思的个性化图像生成：PEARL 与用户历史基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2610.00737", "date": "2026-09-30T00:00:00.000Z", "summary": "研究者提出首个基于用户历史（评论、帖子、图片、caption 与元数据）的个性化图像生成统一基准，包含个性化场景生成与个性化创意生成两项任务及多轴评测协议。同时提出 PEARL，将多模态推理器与冻结的图像生成器耦合为交错的\"推理-反思\"循环，并用差分数据奖励优化，在两项任务上平均提升 15% 的个性化指标。", "type": "paper", "relTime": "1周前"}, {"id": 142, "title": "Dyna Robotics 发布 Dyna-2.1 与半人形机器人 Taku，独立完成一小时洗衣房任务", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2105048999808131377", "date": "2026-09-29T21:36:06.000Z", "summary": "Dyna Robotics 发布 Dyna-2.1，称其为首个实现可靠超长时程全身自主的 Physical Agent，并搭配全新半人形硬件 Taku。作者转发引用其公开的一小时无剪辑视频：机器人独自运行酒店式洗衣房，装载并启动机器、叠好毛巾并上架，且在别处需要处理时能中断当前动作而不瞬间冻结，这依赖一个并行视觉语言模型监视房间、让 Dyna-2 持续保持手部运作。", "type": "model", "relTime": "1周前"}, {"id": 143, "title": "AMD 以 82 亿美元收购 World Labs，加码与 Nvidia 的竞争", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/09/amd-acquires-world-labs-ai-pioneer-fei-fei-lis-world-models-startup/", "date": "2026-09-29T21:14:49.000Z", "summary": "AMD 宣布将以 82 亿美元收购李飞飞联合创立的世界模型公司 World Labs，交易预计年底前完成，待监管批准。World Labs 2024 年以 2.3 亿美元融资成立，其首款公开工具 Marble 可用 Gaussian splats 生成小型 3D 空间并导出为影视、游戏用 3D 资产，该领域的重要用例之一是为机器人训练生成合成数据，而 Nvidia 在此领域领先。", "type": "industry", "relTime": "1周前"}, {"id": 144, "title": "马斯克在特朗普面前差点说漏AI", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2105034004789670169", "date": "2026-09-29T20:36:31.000Z", "summary": "马斯克在特朗普总统面前差点让\"AI\"脱口而出，及时改口说成了\"SI……超级智能\"。  随后他表示，我们不会\"只有全民基本收入，我们将拥有全民高收入。当你有机器人、有超级智能时，这意味着世界上每个人都能获得比在座任何人都更好的医疗服务。\" https://x.com/EricLDaugh/status/2105030609710035406/video/1", "type": "tip", "relTime": "1周前"}, {"id": 145, "title": "Drafted AI 户型图生成器上线 Revit 插件", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2105032750789210235", "date": "2026-09-29T20:31:32.000Z", "summary": "Drafted 的 AI 户型图生成器已作为插件登陆 Autodesk Revit，可将房屋轮廓和房间清单生成 5 套户型方案，且全部由真实的 Revit 墙体、楼板、屋顶、门窗构建。据 Drafted 测试，生成结果约需 45 秒；房间可删除并单独重新生成，其余方案保持不变，团队还能把生成的门窗墙体替换为自有组件并逐一手动编辑。", "type": "paper", "relTime": "1周前"}, {"id": 146, "title": "fal 扩展 Agent 在创作流程中的能力", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2105031762745098450", "date": "2026-09-29T20:27:36.000Z", "summary": "fal 宣布其 Agent 现在可覆盖更多创作环节：内置语音 Agent 可讨论想法，支持视频序列剪辑、在 Blender 中工作、排队和批量生成，并可同时运行多个工作流，作为一个创作伙伴贯穿整个流程。", "type": "paper", "relTime": "1周前"}, {"id": 147, "title": "OpenAI 在 Dev Day 发布 Space、Pages 等办公功能，ChatGPT 剑指微软办公套件", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/09/29/openai-takes-on-microsoft-with-the-launch-of-what-feels-a-whole-lot-like-chatgpts-own-office-suite/", "date": "2026-09-29T17:45:51.000Z", "summary": "OpenAI 在旧金山 Dev Day 上发布多项面向办公场景的 ChatGPT 新功能，包括共享工作区 Space、文档工具 Pages 和协作幻灯片，形式上接近微软办公套件。Space 中同事可与聊天机器人及新推出的 AI 智能体人格 Dots 协作处理工作任务；Pages 定位为面向人与智能体协作的新型文档，可写作、研究、生成图表和图像。这是 OpenAI 进一步切入微软办公软件腹地的举措。", "type": "paper", "relTime": "1周前"}, {"id": 148, "title": "Runway 加入 OpenAI Marketplace", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2104988068289843602", "date": "2026-09-29T17:33:58.000Z", "summary": "我们作为首发合作伙伴加入 @OpenAI Marketplace。  从今天起，你可以访问最优秀的图像、视频、音频和编辑模型，并可将部分 OpenAI 承诺额度用于在 Runway 上的购买。  点击下方链接了解更多并开始创作。", "type": "industry", "relTime": "1周前"}, {"id": 149, "title": "Apple Creator Studio 迎来新更新：全新模板、端到端电影级视频与效率功能", "source": "Apple：Newsroom（RSS）", "sourceUrl": "https://www.apple.com/newsroom/2026/09/new-updates-coming-to-apple-creator-studio/", "date": "2026-09-29T17:00:02.643Z", "summary": "Apple Creator Studio 将新增全新模板、端到端电影级视频制作流程以及多项提升效率的功能。Freeform 新增深色模式自适应画板、文件夹分组协作，并支持 Apple Intelligence 写作工具改写、校对和摘要手写笔记。在 visionOS 27 中，用户可将画板中的图片、视频、便签、形状和 3D 模型拖入空间并成组查看。", "type": "model", "relTime": "1周前"}, {"id": 150, "title": "Photo Scrubber：用 GPT-6 Astra 打造的本地人脸模糊与元数据清除工具", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Sep/29/photo-scrubber/", "date": "2026-09-29T16:45:27.000Z", "summary": "Simon Willison 用 GPT-6 Astra 构建了实验性工具 Photo Scrubber，可自动识别人脸并模糊处理。该工具基于 Google 的 MediaPipe C++ 库，通过 @mediapipe/tasks-vision 编译为 WebAssembly，并使用 BlazeFace 人脸检测模型，全程在本地运行。", "type": "tip", "relTime": "1周前"}, {"id": 151, "title": "NVIDIA 扩展 xio-sig 加入 cuObject，并发布 SCADA Server SDK", "source": "NVIDIA Technical Blog：Agentic AI / Generative AI", "sourceUrl": "https://developer.nvidia.com/blog/expanding-ai-storage-access-with-nvidia-cuobject-and-the-nvidia-scada-server-sdk/", "date": "2026-09-29T16:00:00.000Z", "summary": "NVIDIA 宣布 xio-sig 在 cuFile 之外新增 cuObject，并正式开放 cuObject 客户端与服务器库，开发者可通过其 API 和 RDMA 线协议构建加速对象存储应用。同步推出的 SCADA Server SDK 让存储厂商构建响应 GPU 发起请求的 SCADA 服务器，IBM 已用集成 Storage Scale 的原型验证互操作性。", "type": "product", "relTime": "1周前"}, {"id": 152, "title": "Tripo 与 Grok 打造 SpaceX 火星任务游戏", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2104949319686127873", "date": "2026-09-29T15:00:00.000Z", "summary": "嘿 @grok，给我们的火星基地打个分吧！✨  为庆祝 Starship Flight 14 发射，我们在浏览器里做了一个完全可玩的 SpaceX 火星任务。  Grok 负责核心游戏逻辑和编码，Tripo 则即时生成 3D 资产。  从提示词到一个完全可玩的世界。我们准备好升空了吗，@SpaceX？", "type": "paper", "relTime": "1周前"}, {"id": 153, "title": "豪威集团发布 OX08D30 车外摄像头图像传感器：800 万像素，支持 LED 闪烁抑制", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/008/363.htm", "date": "2026-09-29T08:21:49.000Z", "summary": "豪威集团发布 800 万像素 CMOS 汽车图像传感器 OX08D30，基于 TheiaCel™ 技术，面向 ADAS 与自动驾驶车外摄像头，现已出样并进入量产。该传感器可抑制 LED 闪烁，最远检测距离达 200 米，与 OX08D10 引脚对引脚兼容，功耗降低 20%、尺寸缩减 50%。", "type": "industry", "relTime": "1周前"}, {"id": 154, "title": "叶序：一款音频响应式LED显示屏", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://jagi.studio/posts/phyllotaxis/", "date": "2026-09-29T07:33:05.802Z", "summary": "开发者用 Processing 生成黄金角螺旋点阵并做 Voronoi 剖分，再用 CadQuery 建模、3D 打印出 89 颗可寻址 RGB LED 的叶序造型灯盘。灯盘由 STM32 blackpill 驱动，通过 SPI 控制 neopixel，并接入 INMP441 I2S 数字麦克风，借助 ARM CMSIS 库做傅里叶变换与多频段能量分析，实现随房间声音变化的音频响应效果。", "type": "tip", "relTime": "1周前"}, {"id": 155, "title": "Runway 如何帮世界杂耍联盟用 AI 补满电视转播的空座位", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/customers/world-juggling-federation", "date": "2026-09-29T00:52:14.404Z", "summary": "世界杂耍联盟（WJF）创始人 Jason Garfield 用 Runway 为荷兰两日赛事的转播补全观众席：首日满座、次日侧机位空座，他用 Aleph 2.0 在原始素材中加入观众而不改动画面其他部分，仅一个极广角镜头退回 After Effects 处理。他还用 Runway 生成开场动画、选手资料卡、排行榜和舞台烟火，整档约一小时特别节目由他一人完成，单段生成时长上限约 15 秒。", "type": "tip", "relTime": "1周前"}];
var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };
var TYPE_LABELS = { "paper":"论文", "model":"模型", "product":"产品", "tip":"技巧", "industry":"行业" };
function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";
  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();
</script>

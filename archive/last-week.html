"model", "relTime": "1周前"}, {"id": 6, "title": "MIT CSAIL 与天津大学推出 X-Hinges 软件，可 3D 打印能感知动作的自感知物件", "source": "MIT News（RSS）", "sourceUrl": "https://news.mit.edu/2026/design-software-reimagines-everyday-objects-as-self-aware-devices-1022", "date": "2026-10-22T20:45:00.000Z", "summary": "MIT CSAIL 与天津大学研究人员开发出 X-Hinges 设计软件，可自动在 3D 打印物件中嵌入两种不同材料，分别用作传感器和导线以避免信号干扰。该工具支持压缩、上下、左右最多三个运动轴，并同步采集各方向运动数据，已用于制作可教机器人抓取积木的手套、折纸台灯和物体识别装置。目前每件打印品的电路布局存在细微差异，需借助计算机视觉系统重新校准传感器输出。", "type": "paper", "relTime": "1周前"}, {"id": 7, "title": "Canva 发布首个自研图像生成模型 Canva Craft，居 DesignArena 榜单第二", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2113368356099424702", "date": "2026-10-22T20:34:15.000Z", "summary": "Canva 发布首个自研前沿图像生成模型 Canva Craft，在 DesignArena 全球图像生成榜单上排名第二，仅次于 OpenAI。模型采用两阶段架构，规划器先读取提示词生成构图方案，渲染器再按方案以最高 2K 分辨率、超过 30 种宽高比绘图；文字拼写渲染前已确定，修改单个元素时不会影响其他元素。", "type": "model", "relTime": "1周前"}, {"id": 8, "title": "De Staat 新歌《Freedom》MV 出现 AI 生成画面", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Oct/22/de-staat-freedom/", "date": "2026-10-22T19:42:26.000Z", "summary": "荷兰另类摇滚乐队 De Staat 的新音乐视频《Freedom》在 00:44 处出现由 Fake it or Leave it 的 Matties Grooten 负责的视觉特效。该片段被 Simon Willison 博客标注为生成式 AI 相关内容。", "type": "paper", "relTime": "1周前"}, {"id": 9, "title": "Gemini 4 Argon 用 Blender MCP 造 3D 大教堂", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2113353489938075794", "date": "2026-10-22T19:35:10.000Z", "summary": "从一张 Nano Banana 图像出发，Gemini 4 Argon 打造出了这个完整的 3D 大教堂音频响应场景。  在 @Antigravity 中以自主循环驱动 Blender MCP 来完成：  🏛️ 雕刻精细的哥特式建筑 🎥 对齐复杂的相机网格 🔊 布置动态的音频响应灯光", "type": "paper", "relTime": "1周前"}, {"id": 10, "title": "OpenAI Decisions API 正式可用", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2113346642787086538", "date": "2026-10-22T19:07:58.000Z", "summary": "OpenAI 宣布 Decisions API 正式可用，让应用和智能体在接近实时的情况下完成文本和图像分类、输入评估并决定下一步动作，无需生成完整的模型回复。此前该 API 已进入公开测试阶段，官方称其决策速度最高比通过 Responses API 调用 GPT-6 Luna 快 10x，可帮助构建更快、更省成本的应用。", "type": "model", "relTime": "1周前"}, {"id": 11, "title": "Canva 发布首个图像生成模型 Canva Craft", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/22/canva-releases-its-first-image-generation-model/", "date": "2026-10-22T19:00:00.000Z", "summary": "Canva 发布首个自研图像生成模型 Canva Craft，由其研究团队开发，用于与 Google、OpenAI、字节跳动和 Meta 的同类模型竞争。模型采用两阶段工作方式，先生成包含空间关系、相对比例、视觉层级和文字信息的计划，再生成最高 2K 分辨率、最多 30 种宽高比的图像，官方称可得到细节准确和文字清晰的结果，并支持不改动其他部分的精确编辑。", "type": "model", "relTime": "1周前"}, {"id": 12, "title": "World Labs 演示 Atlas 单图生成 3D 环境", "source": "X：World Labs (@theworldlabs)", "sourceUrl": "https://x.com/theworldlabs/status/2113324421406740747", "date": "2026-10-22T17:39:40.000Z", "summary": "Atlas 让你从单张输入图像开始构建大型 3D 环境。  随后你可以在该世界中定义一条相机路径，并沿路径生成视频。  下面展示了 3D 结构、相机路径与最终飞越视频之间的关联。", "type": "paper", "relTime": "1周前"}, {"id": 13, "title": "Maxinsights 推出 MaxGlove 采集手部力触数据", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2113314150579675249", "date": "2026-10-22T16:58:51.000Z", "summary": "Maxinsights 推出 MaxGlove，在人们真实工作时记录手部触觉与力数据，补上摄像头拍不到的那层抓握信息。压力决定抓握成败——杯子是滑落还是碎裂，打滑时的修正始于指尖，通常早于摄像头察觉。Maxinsights 称已拍摄 2M+ 小时视频，目标到 2027 年积累一百万小时力数据。", "type": "industry", "relTime": "1周前"}, {"id": 14, "title": "Ideogram 发布 Vector 1.0：文生 SVG 并可将图像矢量化", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2113312019206058163", "date": "2026-10-22T16:50:23.000Z", "summary": "Ideogram 发布首个矢量模型 Vector 1.0，可由文本提示生成带平滑渐变和清晰排版的干净、可编辑 SVG，也能把任意图像转为可缩放的详细矢量。生成的 SVG 各组件为独立图层，用户可旋转和移动；目前已上线 Ideogram 及其 API。", "type": "model", "relTime": "1周前"}, {"id": 15, "title": "Perplexity 用 AI 生成芯片制造科普视频", "source": "X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)", "sourceUrl": "https://x.com/AravSrinivas/status/2113302968309277133", "date": "2026-10-22T16:14:25.000Z", "summary": "学习新知识时，没有专家资源不再是瓶颈。你可以让 AI 为你制作一段 5 分钟的视频来学习任何内容。这里有一个关于晶圆厂如何制造芯片的视频。", "type": "paper", "relTime": "1周前"}, {"id": 16, "title": "Ideogram Vector 在 fal 上线，支持文本生成可编辑 SVG 和图像转矢量", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2113301781681754474", "date": "2026-10-22T16:09:42.000Z", "summary": "Ideogram Vector 现已在 fal 上线。它可从文本生成可编辑 SVG，将已有图像转换为矢量图形，并支持用参考图像进行引导生成。", "type": "paper", "relTime": "1周前"}, {"id": 17, "title": "Microsoft Research 发布 Flint-interactive 语言，用于创建交互式数据可视化", "source": "Microsoft Research 博客（RSS）", "sourceUrl": "https://www.microsoft.com/en-us/research/blog/flint-interactive-a-language-for-creating-interactive-data-visualizations/", "date": "2026-10-22T16:00:00.000Z", "summary": "Microsoft Research 发布 Flint-interactive，一种构建在 Flint 之上的交互式数据可视化语言，让用户和 AI Agent 能生成支持点击、筛选、缩放、高亮和跨图表联动的图表。", "type": "paper", "relTime": "1周前"}, {"id": 18, "title": "百度智能云一见视觉智能体如何为远元集团近万家门店巡店", "source": "公众号：百度智能云（文心）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzA5NTQ5MzE5OQ%3D%3D&mid=2653161033&idx=2&sn=0b98be825a24c805319156ff2eec5da4", "date": "2026-10-22T11:53:54.000Z", "summary": "百度智能云一见视觉智能体接入远元集团门店巡检，应用覆盖80多个场景，巡查覆盖率提升约30倍，SOP合规水平提升30个百分点以上。一见6.0支持业务人员用自然语言描述服务步骤生成视觉AI技能，双方还计划在200家门店试点百度具身智能相机。", "type": "industry", "relTime": "1周前"}, {"id": 19, "title": "ChinaTalk 获奖长文：中国人形机器人第一视角数据采集产业实地调查", "source": "ChinaTalk（RSS）", "sourceUrl": "https://www.chinatalk.media/p/take-ten-thousand-egocentric-data", "date": "2026-10-22T10:02:03.000Z", "summary": "作者 A. Chen 在北京五道口访谈研究者和创业者，梳理机器人数据采集三代技术：遥操作、同构外骨骼（UMI）和自 2026 年起兴起的第一视角采集，NVIDIA EgoScale 项目用超 1000 人拍摄了 20854 小时第一人称视频。", "type": "industry", "relTime": "1周前"}, {"id": 20, "title": "Ai2 发布卫星嵌入模型 OlmoEarth v1.3 并开放全球预计算嵌入", "source": "Ai2 / Allen Institute for AI（RSS）", "sourceUrl": "https://allenai.org/blog/olmoearth-v1-3", "date": "2026-10-22T08:00:00.000Z", "summary": "Ai2 发布卫星嵌入模型 OlmoEarth v1.3，读取 Sentinel-1、Sentinel-2 和 Landsat 时间序列，为全球每个 10 米像素生成 128 维向量（前 64 维可单独使用）。", "type": "model", "relTime": "1周前"}, {"id": 21, "title": "Kling 4.0 上线 OpenArt，支持首中尾帧引导与最多 10 张参考图", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2113156632134005040", "date": "2026-10-22T06:32:56.000Z", "summary": "OpenArt 宣布 Kling 4.0 上线，可用首、中、尾帧引导视频，最多使用 10 张参考图，并支持文本或帧生成与视频编辑，All-in-One Reference 用一个模型完成生成和编辑。11 月 20 日前 Pro 和 Wonder 套餐享 50% 折扣。", "type": "model", "relTime": "1周前"}, {"id": 22, "title": "Kling 4.0 现已上线 OnSolo", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2113142473145078041", "date": "2026-10-22T05:36:40.000Z", "summary": "可灵（Kling）宣布 Kling 4.0 已在 OnSolo 上线。该模型支持单次生成 30 秒原生视频，快速动作和大运镜下保持稳定，立体声配更准的口型同步，并提供 21:9 宽屏，单个任务可叠加最多 15 个参考图和 10 个关键帧以保持角色、镜头与剧情一致。", "type": "model", "relTime": "1周前"}, {"id": 23, "title": "Tripo巴塞罗那Demo Day落幕", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2113136753515323532", "date": "2026-10-22T05:13:56.000Z", "summary": "Tripothon S1 巴塞罗那 Demo Day 圆满收官！🇪🇸  众多才华横溢的开发者齐聚一堂，交流并探索生成式 3D 的未来。我们说的是沉浸式 VR、可持续 3D 打印混凝土，以及裸眼空间现实。", "type": "industry", "relTime": "1周前"}, {"id": 24, "title": "邵猛计划本地部署 Ming-3.0-tts 做阅读与配音助手", "source": "X：邵猛 (@shao__meng)", "sourceUrl": "https://x.com/shao__meng/status/2113076227636613349", "date": "2026-10-22T01:13:26.000Z", "summary": "邵猛打算本地试跑 0.5B 的 Ming-3.0-tts 声音合成与克隆模型，看中其体积小可本地运行。他正为儿子的学习做 AI 辅助，继开源打字游戏后，计划做书籍阅读助手（支持全篇通读、停顿或指定区域提示）和视频德语配音，结合 ASR 与多模态视频理解做音画同步。他立 Flag 一周后投入日常学习并开源。", "type": "tip", "relTime": "1周前"}, {"id": 25, "title": "卡兹克详解 AI 挖出的 PHP2Shell 漏洞：发现只花2天，修复用了两个月", "source": "公众号：数字生命卡兹克", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647687466&idx=1&sn=ba7ba0f3ca50ef789c17b179dd061f60", "date": "2026-10-22T00:06:00.000Z", "summary": "作者复盘 PHP 两个 CVSS 满分起步的远程代码执行漏洞（CVE-2026-109618、CVE-2026-109619，合称 PHP2Shell）从提前泄密、演示视频流出、多国政府网站预防性下线，到21日晚10点补丁上线的全过程，并指出这两个漏洞是 GPT-5.6 Sol 辅助发现的，OpenAI 还发布了检测 skill。", "type": "industry", "relTime": "1周前"}, {"id": 26, "title": "Krea 3 产品图生成上线", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2113028279385125210", "date": "2026-10-21T22:02:54.000Z", "summary": "Krea 3 用于产品图。 以闪电般的速度和极低的成本生成每个产品角度。 立即试用 👇", "type": "product", "relTime": "1周前"}, {"id": 27, "title": "HeyGen 视频与语音模型上线 fal", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2113013413592842486", "date": "2026-10-21T21:03:50.000Z", "summary": "来自 @HeyGen 的 HeyGen Video 和 HeyGen Voice 现已在 fal 上线。  内置声音的视频与语音模型。 - 支持文本、图像和参考生成视频，每个片段都带对话、环境音和音效 - 5 至 15 秒片段，最高 2K - 支持 39 种语言的语音，可即时克隆声音，并有更快的 Turbo 档", "type": "model", "relTime": "1周前"}, {"id": 28, "title": "Grok Bot 新增可视化交互文档生成能力", "source": "X：Peng Zheng（SpaceXSI，Grok Bot 设计负责人） (@pengzheng_)", "sourceUrl": "https://x.com/pengzheng_/status/2113003164819656753", "date": "2026-10-21T20:23:06.000Z", "summary": "Grok Bot 设计负责人 Peng Zheng 介绍 Grok Bot 新能力，可将想法转化为可视化、可交互、持续更新的活文档。用户可让 Bot 生成报告、备忘录、仪表盘或页面，再共同编辑或让 Bot 保持内容更新，减少大段文字，强调视觉化探索。", "type": "paper", "relTime": "1周前"}, {"id": 29, "title": "Artificial Analysis 视频竞技场两周年", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2112992234140475837", "date": "2026-10-21T19:39:40.000Z", "summary": "两年前的今天，我们推出了 Artificial Analysis Video Arena，这是领先的文本生成视频模型众包对比平台。  此后，我们陆续新增了图生视频、带音频视频和视频编辑的排行榜。最初的排行榜仅有八个模型——如今我们已评测超过 140 个。", "type": "model", "relTime": "1周前"}, {"id": 30, "title": "Hao AI Lab FastH3 Omni 支持在 DGX Spark、RTX GPU 和 Apple MLX 上本地运行", "source": "X：UCSD Hao AI Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2112988929112826177", "date": "2026-10-21T19:26:32.000Z", "summary": "Hao AI Lab 的 FastVideo FastH3 Omni 现可在 NVIDIA DGX Spark、RTX GPU 和 Apple MLX 上本地运行，视频中的片段均由 DGX Spark 生成，使用 8-step NVFP4 checkpoint。", "type": "product", "relTime": "1周前"}, {"id": 31, "title": "Gemini 4 Argon 构建人体解剖 3D 可视化", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2112974723659247896", "date": "2026-10-21T18:30:05.000Z", "summary": "Gemini 4 Argon 整合了三个开源数据集，构建出人体解剖结构的交互式 3D 可视化。  可在运动中切换不同图层、单独查看肌肉，或放大进入跳动的心脏内部。", "type": "model", "relTime": "1周前"}, {"id": 32, "title": "Unitree H2-X 人形机器人续航约 8 小时", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2112969161135808704", "date": "2026-10-21T18:07:59.000Z", "summary": "Unitree 新推出的 H2-X Kung Fu Legend Guardian 人形机器人宣称续航约 8 小时，接近标准 H2 的 3 倍，但该数字测的是站立时间，尚不清楚巡逻、格斗或搬运能撑多久。标准 H2 为 70kg、31 关节，搭载可换 0.97kWh 电池组续航约 3 小时，售价 $29,900。发布视频中 H2-X 从 4 米平台跃下、踢穿废料场并击退持棍入侵者。", "type": "industry", "relTime": "1周前"}, {"id": 33, "title": "用 Opus 做动画的六类玩法视频教程", "source": "X：卡尔的 AI 沃茨 (@aiwarts)", "sourceUrl": "https://x.com/aiwarts/status/2112953469703446828", "date": "2026-10-21T17:05:38.000Z", "summary": "作者发布近 7 分钟视频，讲解用 Opus 做动画的六类玩法：产品宣传片、科普动画、手绘动画、3D 场景、音乐 MV，以及用 AI 视频做丝滑转场的技巧。视频从代码动画原理讲起，无需先学写代码，但需把想要的效果说明白，并附有时间轴便于跳看。", "type": "tip", "relTime": "1周前"}, {"id": 34, "title": "OCRia-1 发布：4B 参数文档解析模型登顶 ParseBench", "source": "LlamaIndex：产品、工程与评测", "sourceUrl": "https://www.llamaindex.ai/blog/parse-ocria-1", "date": "2026-10-21T16:00:00.000Z", "summary": "OCRia-1 是一款 4B 参数的视觉语言模型，在 ParseBench 上取得 87.4 总分，领先第二名 12.1 分，创下 35B 参数以下解析模型的最高分。", "type": "model", "relTime": "1周前"}, {"id": 35, "title": "可灵 Kling 4.0 现已上线 fal 平台", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2112928160312643931", "date": "2026-10-21T15:25:04.000Z", "summary": "可灵（Kling AI）宣布 Kling 4.0 现已在 fal 平台可用。据 fal 介绍，该模型是新一代原生多模态视频模型，复杂运动更稳定、角色与场景参考一致性更强、电影化叙事控制更精准；目前仅通过 fal UX 和 fal Agent 提供，API 访问即将推出。", "type": "model", "relTime": "1周前"}, {"id": 36, "title": "腾讯内测 AI 互动社区“懂了鸭”：一句话生成可玩的动态课件与 3D 演示", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/016/145.htm", "date": "2026-10-21T15:10:22.900Z", "summary": "腾讯正在内测面向少儿与青少年的 AI 互动内容社区“懂了鸭”，官网与微信小程序已上线，向亲子用户和一线教师开放小范围测试。用户输入自然语言即可由内置 AI 智能体生成 3D 演示、动态课件、互动绘本等“奇妙卡”作品，无需编程，并可浏览和二次改编他人作品。", "type": "paper", "relTime": "1周前"}, {"id": 37, "title": "可灵 4.0 上线 fal 平台", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2112922156845641823", "date": "2026-10-21T15:01:13.000Z", "summary": "fal 宣布可灵（Kling）4.0 上线，称其为新一代原生多模态视频模型，复杂运动稳定性、角色和场景的参考一致性以及电影叙事的精确控制均有提升。目前仅可通过 fal UX 和 fal Agent 使用，API 访问即将开放。", "type": "model", "relTime": "1周前"}, {"id": 38, "title": "EdenLive 驱动 Unbound 实时生成渲染", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2112921862145499348", "date": "2026-10-21T15:00:02.000Z", "summary": "EdenLive 现为 @unbound_io 的 AI 增强雕刻工作流提供支持。  将实时生成式渲染直接带入你的 3D 创作循环。雕刻模型，看 AI 即时精修，并用 Tripo 导出游戏就绪资产。  由 Tripo 生成。使用 EdenLive 和 Unbound 实时渲染。", "type": "industry", "relTime": "1周前"}, {"id": 39, "title": "Inception 发布扩散语言模型 Mercury 3，宣称部分基准超越 GPT-6 Luna 和 Claude Haiku 5.5", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/inceptions-mercury-3-diffusion-model-claims-to-beat-gpt-6-luna-and-claude-haiku-5-5-at-a-fraction-of-the-wait/", "date": "2026-10-21T14:45:45.000Z", "summary": "Inception 发布扩散语言模型 Mercury 3，自称在 12 项基准中 8 项领先 GPT-6 Luna 和 Claude Haiku 5.5，生成速度达 1,068 tokens/秒，约为两个对手的 4 到 8 倍。", "type": "model", "relTime": "1周前"}, {"id": 40, "title": "MiniCPM-V 4.7 1B 在普通 iPhone 上离线运行", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2112906757693710580", "date": "2026-10-21T14:00:01.000Z", "summary": "面壁智能展示 MiniCPM-V 4.7 1B 已在开发者 @mustafaergisi 的 OnDeviceLLM 应用中运行于普通 iPhone，不再限于 12GB 内存的 Pro Max 机型。该应用可读取收据并询问总额、从传单提取信息、理解截图，且支持飞行模式离线运行、图像处理全程留在设备端。官方称这是开源小多模态模型落地真实应用的实例，并征集社区 demo 与用例。", "type": "model", "relTime": "1周前"}, {"id": 41, "title": "Vidu 担任首席技术支持，AI 院线电影《三星堆：未来往事》10月23日上映", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489384&idx=1&sn=4591a1e1f5487b0b68d0ad51c7305f8e", "date": "2026-10-21T13:16:19.000Z", "summary": "生数科技宣布，由博纳影业打造的 100 分钟科幻电影《三星堆：未来往事》将于 10 月 23 日登陆院线，是中国首部获国家电影局公映许可证的 AI 超写实院线电影，Vidu 提供首席技术支持。影片人物全部由 AI 生成，无真人演员及数字复刻，采用博纳 AIGMS 自研的博卡电影云片场叠加 Vidu 视频模型，协同完成从分镜、画面到视频生成的制作。", "type": "industry", "relTime": "1周前"}, {"id": 42, "title": "Mistral 与 NVIDIA 合作工业工程 AI", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2112882685559308547", "date": "2026-10-21T12:24:22.000Z", "summary": "Mistral ❤️ NVIDIA  Mistral AI 与 NVIDIA 合作，\"开发由 NVIDIA 加速计算驱动的新一代 AI 原生工程工作流\"。  此外，Mistral 的模型将集成到 NVIDIA Omniverse 库中，用于 GPU 加速的 3D 场景生成。", "type": "industry", "relTime": "1周前"}, {"id": 43, "title": "百度一见6.0与AI原生具身智能相机亮相百度智能体大会", "source": "公众号：百度智能云（文心）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzA5NTQ5MzE5OQ%3D%3D&mid=2653161003&idx=2&sn=76a67e033cb10296497f2a03e6383dea", "date": "2026-10-21T12:23:54.000Z", "summary": "百度一见在百度智能体大会西安站展示了一见6.0与AI原生具身智能相机。一见6.0引入Golden-Set业务真值样本集、场景模拟器和智能体协同，让业务人员无需算法背景即可生产视觉技能；AI原生具身智能相机具备三目全域感知、极速云台追踪、全天候视听融合和AI原生事件驱动四项能力。目前一见已在零售、制造、运输、能源等20+行业落地。", "type": "paper", "relTime": "1周前"}, {"id": 44, "title": "NVIDIA 在 Hugging Face 发布 SimReady Central 开放仿真资产库", "source": "Hugging Face 社区博客（混合发现）", "sourceUrl": "https://huggingface.co/blog/nvidia/simready-central-assets-robotics-ai-factories", "date": "2026-10-21T10:59:42.000Z", "summary": "NVIDIA 与 Hugging Face 推出 SimReady Central Library，汇集 2,000 多个带碰撞几何、质量和摩擦等仿真属性的 OpenUSD 资产，免费无需审批，用于机器人训练环境和 AI 工厂数字孪生。", "type": "paper", "relTime": "1周前"}, {"id": 45, "title": "Black Forest Labs 开源 5.6B 图像生成模型 FLUX 3 Image Klein，8GB 显存可运行", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/016/062.htm", "date": "2026-10-21T10:39:12.163Z", "summary": "Black Forest Labs 于 10 月 15 日以开放权重形式发布 5.6B 参数图像生成模型 FLUX 3 Image Klein，针对消费级 GPU 优化，INT8 版本可通过 ComfyUI 或 Diffusers 在 8GB 显存的 NVIDIA GeForce RTX GPU 上运行。", "type": "model", "relTime": "1周前"}, {"id": 46, "title": "欧洲工业巨头用 NVIDIA CUDA-X、Omniverse 与 Cosmos 重塑工程与制造", "source": "NVIDIA Blog（RSS）", "sourceUrl": "https://blogs.nvidia.com/blog/europe-industrial-leaders-engineering-manufacturing/", "date": "2026-10-21T10:30:40.000Z", "summary": "NVIDIA 面向工厂场景的 Factory Operations Blueprint（FOX）已在 GitHub 开放早期访问，开发者可构建常驻工厂管理智能体及视觉检测、根因分析等专用智能体。", "type": "industry", "relTime": "1周前"}, {"id": 47, "title": "NVIDIA 在 GTC Berlin 宣布 Bolt、沃尔沃等欧洲车企基于 Hyperion 构建 L3/L4 车辆与 robotaxi 车队", "source": "NVIDIA：Newsroom（RSS）", "sourceUrl": "https://nvidianews.nvidia.com/news/european-mobility-leaders-build-safe-vehicles-and-robotaxi-fleets-on-nvidia-hyperion", "date": "2026-10-21T10:14:00.000Z", "summary": "NVIDIA 在 GTC Berlin 宣布 Bolt（与 Lucid 合作）、Mercedes-Benz、Volkswagen Commercial Vehicles、Einride 等欧洲车企和出行公司在 NVIDIA Hyperion 计算平台上展示自动驾驶用例，Volvo Cars 采用 Hyperion 与 Alpamayo Stack。", "type": "paper", "relTime": "1周前"}, {"id": 48, "title": "火炬之光 2 移植 Vision Pro 支持视线追踪", "source": "X：Dash (@dashhuang)", "sourceUrl": "https://x.com/DashHuang/status/2112810090898309320", "date": "2026-10-21T07:35:54.000Z", "summary": "开发者将《火炬之光 2》移植到 Vision Pro，呈现空间 3D 效果，并支持手柄、触屏和视线追踪三种交互方式。此前该作已完成 Mac 现代化改造，让十几年前的引擎在 M 芯片上原生运行并支持 Retina 高清显示。作者表示稍后将发布同时支持 Vision Pro、iOS、Mac 和 Apple TV 的 TestFlight 邀请。", "type": "tip", "relTime": "1周前"}, {"id": 49, "title": "卡兹克分享8个Claude Opus 5.5惊艳玩法", "source": "X：卡兹克 (@Khazix0918)", "sourceUrl": "https://x.com/Khazix0918/status/2112794968981139875", "date": "2026-10-21T06:35:49.000Z", "summary": "卡兹克整理了8个基于Claude Opus 5.5的创意案例，包括120页手写笔记转个人字体、16岁高中生2天构建古希腊世界、16天制作的小王子3D剧情游戏、成都城市讲解视频《一座城的年轮》、一句话生成火烧前的圆明园视频、指环王故事视频、逆向自家电视，以及Nenly同学用Claude和Codex等AI工具花298天做出的Steam好评率98%游戏《群侠传：幸存者》。", "type": "tip", "relTime": "1周前"}, {"id": 50, "title": "Tripo 宣布 EdenLive 正式上线 Reactor 平台", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2112769754712936499", "date": "2026-10-21T04:55:37.000Z", "summary": "Tripo 官方宣布其实时生成渲染器 EdenLive 正式在 Reactor 平台上线，并提供在线演示入口（reactor.inc/models/eden-live）。Reactor 介绍称，Eden-Live 可将 3D 场景和原型重绘为丰富的可交互世界，支持参考图加文本实时改变场景风格，并可即时编辑提示词，上线首日即在 Reactor 可用。", "type": "model", "relTime": "1周前"}, {"id": 51, "title": "Spotify 一年从推荐流移除超 5000 万首低质 AI 音乐，调整推荐系统优先人类创作者", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/015/804.htm", "date": "2026-10-21T04:53:17.087Z", "summary": "Spotify 周二公告称，过去一年已从推荐流移除超 5000 万首被认定为 AI 生成的低质垃圾歌曲，并调整推荐系统优先展示真人创作者作品。平台为 AI 虚拟形象创作者推出 AI Persona 标识且不推荐其音乐，未强制所有 AI 曲目打标签；其判断依据包括用户反馈、上传特征、元数据和第三方 AI 检测工具。", "type": "industry", "relTime": "1周前"}, {"id": 52, "title": "工程师分享用 Agent 状态图配合 pstack 形式化验证技能找 bug 的实践", "source": "X：Lauren Tan（SpaceXSI，Grok Bot 工程负责人） (@poteto)", "sourceUrl": "https://x.com/poteto/status/2112736749281759566", "date": "2026-10-21T02:44:28.000Z", "summary": "Grok Bot 工程负责人 Lauren Tan 分享一种找 bug 的工作流：先让 Agent 画出用户流程的状态图，再用 pstack 的 /create-formal-verification-skill 生成的技能通过 TLA+ 等方式做验证。她称这样既能更好理解代码和用户流程，也能修复用户原本会看到的问题；被引用的 pstack v0.15.27 更新介绍称该元技能可按需创建形式...", "type": "tip", "relTime": "1周前"}, {"id": 53, "title": "8个让人惊艳的 Claude Opus 5.5 创意玩法分享", "source": "公众号：数字生命卡兹克", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647687443&idx=1&sn=b44e17ff383e6659fcbfe02c6bf82dcd", "date": "2026-10-21T00:32:00.000Z", "summary": "自媒体作者数字生命卡兹克整理分享了8个基于 Claude Opus 5.5 的创意案例，包括将120页手写笔记提取成个人字体、构建古希腊世界、16天制作小王子3D剧情游戏、修复圆明园视频、用 REA 逆向电视等。", "type": "tip", "relTime": "1周前"}, {"id": 54, "title": "Flatkey 网关接入 Codex 与 Claude Code 多模态模型", "source": "X：邵猛 (@shao__meng)", "sourceUrl": "https://x.com/shao__meng/status/2112688351795138907", "date": "2026-10-20T23:32:09.000Z", "summary": "Flatkey 推出统一 AI API 网关，通过 CLI 让 Codex 和 Claude Code 调用 GPT、Claude、DeepSeek、GLM、Kimi 等文本模型及 GPT Image、Seedance 等图片视频模型。", "type": "tip", "relTime": "1周前"}, {"id": 55, "title": "DeepSeek-V4.1-Flash-20261017 (Max) 登顶 Arena 的 Agent 和 Code 两大榜单开源模型第一", "source": "X：Arena (@arena)", "sourceUrl": "https://x.com/arena/status/2112683123406479810", "date": "2026-10-20T23:11:23.000Z", "summary": "Arena 宣布 DeepSeek-V4.1-Flash-20261017 (Max) 进入 Arena，成为 Agent Arena 和 Code Arena (WebDev) 两个榜单中的开源模型第一。帖中还引用了 @petergostev 用该模型生成的 3D 世界视频演示，并提示排名详情见帖子串。", "type": "model", "relTime": "1周前"}, {"id": 56, "title": "ComfyUI 支持 Hao AI Lab 的 FastH3 OmniRef 多模态参考视频生成", "source": "X：UCSD Hao AI Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2112659427711234140", "date": "2026-10-20T21:37:13.000Z", "summary": "ComfyUI 宣布支持 Hao AI Lab 的 FastH3 OmniRef，这是 MiniMax H3 的蒸馏版本，可进行多模态参考视频生成，能在本地硬件上运行。官方称其在质量与速度之间取得较好平衡，并开放了权重与云端入口。", "type": "paper", "relTime": "1周前"}, {"id": 57, "title": "Opus 5.5 生成水獭用WiFi视频", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2112656453685367004", "date": "2026-10-20T21:25:24.000Z", "summary": "我写了关于过去30个月AI发展指数曲线的文章：https://www.oneusefulthing.org/p/30-months-on-the-exponential-in-charts  我让 Opus 5.5 为我用来测试所有AI图像生成模型的那个测试（画一张“一只水獭在飞机上用WiFi”的图）创作终极回应，它做出了这个视频", "type": "model", "relTime": "1周前"}, {"id": 58, "title": "Higgsfield 发布 Genjutsu Lite，照片可置入热门视频且生成成本更低", "source": "X：Higgsfield AI (@higgsfield)", "sourceUrl": "https://x.com/higgsfield/status/2112648165090582803", "date": "2026-10-20T20:52:28.000Z", "summary": "Higgsfield 推出 Genjutsu Lite，可将用户照片置入任意热门视频中。720p 生成成本降低 3.5 倍、1080p 降低 5 倍，现已上线 Higgsfield 平台并提供 API，Genjutsu 和 Genjutsu Lite 在部分区域可免费试用。", "type": "product", "relTime": "1周前"}, {"id": 59, "title": "FastVideo 开源 MiniMax FastH3 Omni，附训练代码", "source": "X：UCSD Hao AI Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2112625528805208257", "date": "2026-10-20T19:22:31.000Z", "summary": "FastVideo（Hao AI Lab）宣布开源与 MiniMax 合作的 FastH3 Omni，并附带训练代码。项目在 NVIDIA Blackwell 上实现 12 倍于原速度的实时生成，支持 NVFP4/FP8 用于 Spark 与 RTX 设备，ComfyUI 首日可用；合作方包括 NVIDIA AI、Nuva Lab 和 Reactor。", "type": "model", "relTime": "1周前"}, {"id": 60, "title": "Viggle AI 的 JST-2 模型上线 API", "source": "X：Viggle AI (@ViggleAI)", "sourceUrl": "https://x.com/ViggleAI/status/2112612250762514709", "date": "2026-10-20T18:29:45.000Z", "summary": "一个模型即可生成 3D 角色、动作和场景。  JST-2 现已在我们的 API 上线。  今天就开始构建：https://viggle.ai/developers", "type": "model", "relTime": "1周前"}, {"id": 61, "title": "乌克兰用无人机从前线救回受伤士兵，将战场伤员撤离构想付诸实践", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/gadgets/2026/10/ukraines-drone-rescue-of-wounded-soldier-puts-much-touted-idea-into-practice/", "date": "2026-10-20T18:22:54.000Z", "summary": "乌克兰军方10月19日公布视频，显示一名受伤士兵被固定在重型六旋翼无人机下方的吊带上，从前线空运至安全地带。由于俄军无人机和地雷的存在，当时无法派出轮式地面机器人执行撤离。此次行动发生在乌克兰 casualty 撤离无人机投入前线测试数日后，超出了美军数十年来同类概念的实验阶段。", "type": "industry", "relTime": "1周前"}, {"id": 62, "title": "fal 发布 FLUX 3 Max，图生视频 Elo 达 1139 并列第一", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2112600472922333263", "date": "2026-10-20T17:42:57.000Z", "summary": "fal 发布与 Black Forest Labs 合作后训练的视频模型 FLUX 3 Max，在第三方独立人类偏好评测中获 1139 Elo，与 Seedance 2.5 并列图生视频质量第一梯队。该模型约 12 秒生成一段 10 秒 720/768p 视频，未来三周降价 75%，后续还将继续后训练改进。", "type": "model", "relTime": "1周前"}, {"id": 63, "title": "Jim Fan 开源机器人数据引擎模型套件 Flora，成本为 Astra 的 1/125", "source": "X：Jim Fan (@DrJimFan)", "sourceUrl": "https://x.com/DrJimFan/status/2112597587987689912", "date": "2026-10-20T17:31:29.000Z", "summary": "Jim Fan 宣布开源 Flora，一组用于解析物理世界、把原始视频转成训练信号的开放模型，称其以 125 倍更低的成本达到 Astra 级性能。Flora 已用于其内部数据引擎，在 500 块 GPU 上每天标注 20 万小时视频，提供带时间戳的高质量字幕、用于质量控制和 RL 后训练的密集进度奖励，以及用于现实基准测试的 rubrics 评分。", "type": "model", "relTime": "1周前"}, {"id": 64, "title": "VAST 开源实时生成渲染器 EdenLive，720p 下可达 24+ FPS", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2112563016185323878", "date": "2026-10-20T15:14:07.000Z", "summary": "VAST（@VASTAIResearch）开源实时生成渲染器 EdenLive，可将 3D blockout、游戏引擎画面、2D 卡通和真实视频转化为写实或风格化视频。模型为 5B 参数，单张 RTX 5090 上可在 720p 分辨率实现 24+ FPS。", "type": "paper", "relTime": "1周前"}, {"id": 65, "title": "Bria Fibo 2.0 上线 fal", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2112562029336608819", "date": "2026-10-20T15:10:11.000Z", "summary": "fal 宣布 Bria Fibo 2.0 上线。该模型在 Artificial Analysis 排名开源权重图像编辑模型第一，仅使用授权数据训练并附带明确商业权利，支持最多四张输入图像的编辑、背景替换、产品重新摆放和光线调整，也可生成推理密集型提示词的文生图。", "type": "model", "relTime": "1周前"}, {"id": 66, "title": "Spotify 一年内从推荐中移除超 5000 万首 AI 垃圾与 spam 歌曲", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/entertainment/1014284/spotify-ai-slop-spam-songs-removed", "date": "2026-10-20T14:18:37.000Z", "summary": "Spotify 宣布过去一年从用户推荐中移除超过 5000 万首被判定为 AI 生成 slop 或 spam 的歌曲，并调整推荐系统以突出人类艺术家的作品。判定依据包括听众反馈、上传模式、元数据和第三方 AI 检测工具；平台还推出 AI Persona 徽章，且不推荐 AI persona 音乐。", "type": "industry", "relTime": "1周前"}, {"id": 67, "title": "Adobe Lightroom 移动版上线一键生成式 AI 开眼功能", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/1014246/adobe-lightroom-mobile-ai-quick-action-open-eyes-closed-blink-repair", "date": "2026-10-20T13:06:44.000Z", "summary": "Adobe 宣布 iOS、iPadOS 和 Android 版 Lightroom 移动版新增 Open Eyes Quick Action，检测到照片中有人闭眼时一键用生成式 AI 打开眼睛，并参考 Lightroom 库中同一人的其他照片匹配颜色、大小和形状。", "type": "paper", "relTime": "1周前"}, {"id": 68, "title": "a16z 领投 Eka Robotics A 轮融资，押注灵巧操作", "source": "a16z：News（RSS）", "sourceUrl": "https://www.a16z.news/p/investing-in-eka-robotics", "date": "2026-10-20T13:05:34.000Z", "summary": "a16z 领投 Eka Robotics 的 A 轮融资，押注其用视觉-力-动作模型解决机器人灵巧操作难题。Eka 将视觉感知与机械手力反馈结合，把接触本身当作信息，而非逐个复刻人类手部数千个感受器。其操作策略通过物理仿真中的强化学习训练，让机器人经验随算力而非人力扩展。", "type": "industry", "relTime": "1周前"}, {"id": 69, "title": "Meta Muse 网页版将推机密虚拟机模式", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2112522256911884590", "date": "2026-10-20T12:32:09.000Z", "summary": "Meta 正在为 Muse 网页版开发 Confidential VMs 功能，让用户在加密环境中运行 Muse 任务，此前预告将在 2026 年底前上线。新发现的隐藏设置显示，该功能初期仅对 Meta AI 订阅用户开放，且切换后语音模式、图像与视频生成及可穿戴设备支持暂不可用。Meta 称对话数据不会用于改进其 AI。", "type": "paper", "relTime": "1周前"}, {"id": 70, "title": "斯坦福新课 CME 295 第四讲：大语言模型强化学习，讲义与视频公开", "source": "X：邵猛 (@shao__meng)", "sourceUrl": "https://x.com/shao__meng/status/2112512042771116533", "date": "2026-10-20T11:51:34.000Z", "summary": "作者介绍斯坦福新课 CME 295（Transformers & Large Language Models），由 Afshine 与 Shervine Amidi 主讲，目前进行到第四讲 Reinforcement learning with LLMs，视频与讲义已公开。本讲从 RL、Reward Design 讲到 PPO、GRPO、RLVR 和 DAPO，逐个符号讲解；课程共 9 讲，...", "type": "tip", "relTime": "1周前"}, {"id": 71, "title": "小米 MiMo-V2.6-Pro 上线 WorkBuddy，支持 1M 上下文多智能体协作", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/015/533.htm", "date": "2026-10-20T11:50:45.517Z", "summary": "小米 MiMo-V2.6-Pro 正式上线 WorkBuddy，支持 1M 超长上下文与多智能体分工协作，并可联合理解图像、视频、音频和文本。该模型在 Artificial Analysis 智能指数为 46 分，官方称其全球开源第一。MiMo-V2.6 系列沿用 V2.5 定价，Pro 每百万词元输入 3 元、输出 6 元，并提供 99% 缓存折扣。", "type": "model", "relTime": "1周前"}, {"id": 72, "title": "OpenAI 与 Meta 在美国司法会议警告深度伪造将威胁诉讼证据可靠性", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/015/421.htm", "date": "2026-10-20T08:50:47.533Z", "summary": "OpenAI 与 Meta 代表在 10 月 15 日的美国司法会议证据规则咨询委员会会议上表示，AI 驱动的深度伪造将严重威胁法律诉讼中的证据可靠性。OpenAI 政策顾问 Shira Anderson 称未来将无法通过科学手段识别 AI 生成图像，Meta 的 Devin Norder 称人类已无法分辨真实媒体与最近几代前沿 AI 模型生成的媒体。", "type": "industry", "relTime": "1周前"}, {"id": 73, "title": "杨丽萍与 Seedance 2.5 共舞、胡彦斌用 AI Coding 弹光束：火山引擎 AI 参演 2026 美好奇妙夜", "source": "公众号：火山引擎", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI0NzU1NzI5NQ%3D%3D&mid=2247545002&idx=1&sn=f01679f735ab108e3a05a957bd0060a8", "date": "2026-10-20T08:01:13.000Z", "summary": "2026 美好奇妙夜上，杨丽萍在《雀之灵》中与 Seedance 2.5 生成的数字孔雀同步起舞，靠的是 Seedance 2.5 的动作迁移能力。火山引擎智能视频云以“巨幕超分”方案把 720p/1080p 的 AI 素材提升到 8K/16K，撑起 20 米级舞台巨幕。胡彦斌则与 TRAE 社区创作者用 AI Coding 做出五道激光琴弦，触碰光束即触发声音。", "type": "industry", "relTime": "1周前"}, {"id": 74, "title": "可灵（Kling）发布 Kling 4.0 视频模型，单条视频最长 30 秒", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2112396910900265280", "date": "2026-10-20T04:14:04.000Z", "summary": "据 The Decoder 报道，可灵（Kling）发布 Kling 4.0 视频模型，单条视频最长可生成 30 秒，提示词理解扩展到 8,000 tokens。新模型支持双声道立体声音频和超过十种语言的唇形同步，同时推出更轻量的 Flash 版本。", "type": "model", "relTime": "1周前"}, {"id": 75, "title": "Viggle 发布 3D 原生世界基础模型 JST-2，把物理结构写进 token", "source": "X：邵猛 (@shao__meng)", "sourceUrl": "https://x.com/shao__meng/status/2112391527330914623", "date": "2026-10-20T03:52:41.000Z", "summary": "Viggle 发布全栈物理原生世界基础模型 JST-2，与 Sora、Genie、Cosmos 等像素/视频空间路线相反，整个技术栈构建在 3D 空间。", "type": "model", "relTime": "1周前"}, {"id": 76, "title": "Nace AI 发布 Drex Max 多模态决策模型，面向计算机使用智能体，Decision Index 得分 67.59", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/10/19/nace-ai-drex-max-multimodal-decision-model/", "date": "2026-10-20T00:03:38.000Z", "summary": "Nace AI 发布多模态决策模型 Drex Max，可读取文本与图像并返回校准概率，在公开 Decision Index 0.3.2 上得分 67.59，比 TypeSafe 的 Jev 1.14 高 6.9 分。", "type": "model", "relTime": "1周前"}, {"id": 77, "title": "研究称 AI 仅凭一张面部照片可预测癌症患者生存几率", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/015/079.htm", "date": "2026-10-19T23:56:44.453Z", "summary": "据彭博社报道，研究人员在《柳叶刀·数字健康》发表研究，开发出仅凭一张面部照片预测癌症患者生存几率的 AI 工具。模型使用超过 4000 万张人脸图像和 3 万多名癌症患者照片训练，可生成风险评分，分数最高者更可能在 90 天内死亡，估算年龄误差约 5 岁，并能在不同年龄、种族、性别和癌症类型人群中生效。", "type": "paper", "relTime": "1周前"}, {"id": 78, "title": "FastVideo 新模型与 NVFP4 VAE 解码器发布", "source": "X：UCSD Hao AI Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2112305087225983427", "date": "2026-10-19T22:09:12.000Z", "summary": "(1/6) 全新的 FastVideo FastH3-QAD-v2 和全新的 H3 NVFP4 VAE 解码器来了！🚀🚀  这整段 768p 视频是在两台 DGX Spark 上生成的，使用了 QAD-v2 和两个新解码器。8 步视频 + 音频，QAD 权重 💾 @NVIDIARTXSpark @NVIDIAAI @MiniMax_AI", "type": "model", "relTime": "1周前"}, {"id": 79, "title": "Skyfall AI 发布工程世界模型 SKY-001", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2112272374435610850", "date": "2026-10-19T19:59:12.000Z", "summary": "Skyfall AI 发布工程世界模型 SKY-001，可把一张发动机或汽车照片拆解成完整零件树，并预测每个零件的草图与操作序列。它由 Hierarchical Composer 和 Construction World Model 两个模型分工完成，从 VMS-85 发动机单张照片生成了五级零件树。官方称其在 CAD 与户型设计任务上比最强通用 LLM 成本低 150x 至 185x，精度相当。", "type": "model", "relTime": "1周前"}, {"id": 80, "title": "fal 与 bfl_ai 合作发布 FLUX 3 Max 视频模型", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2112263983889817913", "date": "2026-10-19T19:25:52.000Z", "summary": "fal 与 @bfl_ai 合作推出经后训练的前沿视频模型 FLUX 3 Max，现已在 fal 上线。该模型在第三方图生视频质量基准上并列第 1，生成 10 秒 720/768p 视频约需 12 秒；未来三周提供 75% 折扣。", "type": "model", "relTime": "1周前"}, {"id": 81, "title": "fal 联合 BFL 发布视频模型 FLUX 3 Max", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2112260343858671660", "date": "2026-10-19T19:11:24.000Z", "summary": "fal Research 与 BFL 合作发布 post-trained 视频模型 FLUX 3 Max，在 Artificial Analysis image-to-video 指数上得 1,139 分。该模型在第三方基准上与 Seedance 2.5 并列第一，10 秒 720/768p 视频约 12 秒即可生成，比 Seedance 2.5 快至 22 倍；未来三周降价 75% 提供。", "type": "paper", "relTime": "1周前"}, {"id": 82, "title": "fal 与 Black Forest Labs 合作推出 FLUX 3 Max", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2112259268271640991", "date": "2026-10-19T19:07:08.000Z", "summary": "fal 与 Black Forest Labs（@bfl_ai）推出 FLUX 3 Max，这是 fal 基于专为定制设计的 FLUX 3 模型进行适配和优化的版本。据发布内容，生成 10 秒视频仅需 12 秒，图像生成视频并列第一，同质量下比 Seedance 2.5 快 22 倍。fal 表示将与其继续合作。", "type": "model", "relTime": "1周前"}, {"id": 83, "title": "Claude 推出 Dashboards 和 Motion 两款新工具并转正 Docs、Slides、Design", "source": "Claude：YouTube（RSS）", "sourceUrl": "https://www.youtube.com/shorts/_Ui4ZkYm4ho", "date": "2026-10-19T18:35:04.000Z", "summary": "Claude 宣布 Dashboards 和 Motion 进入 beta。Dashboards 可连接数据平台或 CRM，生成随数据变化实时更新的仪表盘，面向所有付费计划；Motion 把报告或图表变成动画讲解短片，以代码方式生成、无视频模型参与，可修改文字、数字和节奏后导出 MP4，面向 Team 和 Enterprise 计划。", "type": "model", "relTime": "1周前"}, {"id": 84, "title": "fal 联合 bfl_ai 发布后训练视频模型 FLUX 3 Max", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2112251022047412492", "date": "2026-10-19T18:34:22.000Z", "summary": "fal 发布与 @bfl_ai 合作的最新后训练视频模型 FLUX 3 Max，在第三方 image-to-video 质量评测中并列第一，生成 10 秒 720/768p 视频约需 12 秒。未来三周该模型 75% 折扣，标注为同质量级别最便宜的前沿视频模型。", "type": "model", "relTime": "1周前"}, {"id": 85, "title": "MIT 等团队开发 E(3)-Pose：用对称性先验提升胎儿脑 MRI 成像可靠性", "source": "MIT News（RSS）", "sourceUrl": "https://news.mit.edu/2026/teaching-ai-about-symmetry-could-make-prenatal-diagnosis-more-reliable-1019", "date": "2026-10-19T18:20:00.000Z", "summary": "MIT、波士顿儿童医院与 Inria 的研究者开发并训练了深度学习模型 E(3)-Pose，可在胎儿头部运动时辅助成像，生成供放射科医生查看的高分辨率三维图像。该模型把胎儿头部的左右对称性等物理原理嵌入网络架构，而非仅从数据中学习物理规律，从而更准确地识别大脑朝向。相关论文已在 2026 年欧洲计算机视觉会议（ECCV）上展示，目前模型主要基于第三孕期胎儿训练。", "type": "paper", "relTime": "1周前"}, {"id": 86, "title": "Kling AI 发布 Kling 4.0：支持立体声音频、多语言对口型，并推出轻量 Flash 版本", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/kling-ai-drops-version-4-0-with-stereo-audio-multilingual-lip-sync-and-a-lighter-flash-variant/", "date": "2026-10-19T17:36:26.000Z", "summary": "Kling AI 发布视频生成模型 Kling 4.0，单次可生成最长 30 秒视频，提示词理解扩展到 8000 token，Omni Reference 最多接受 15 个参考素材，新增双声道立体声和十余种语言的对口型。", "type": "model", "relTime": "1周前"}, {"id": 87, "title": "Inception 扩散模型 Mercury 3 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2112225779782398131", "date": "2026-10-19T16:54:03.000Z", "summary": "Inception 的扩散模型 Mercury 3 上线 OpenRouter，生成速度超 1,000 tok/s，支持 1M 上下文，是 Mercury 2.5 的 4 倍。Inception 报告其在 IFBench、GPQA Diamond 和 SWE-Bench Atlas 上超过 GPT-6 Luna 和 Haiku 5.5；上线期五折，价格 $0.10/M 输入、$0.35/M 输出。", "type": "model", "relTime": "1周前"}, {"id": 88, "title": "Viggle AI 发布 JST-2 世界模型", "source": "X：Viggle AI (@ViggleAI)", "sourceUrl": "https://x.com/ViggleAI/status/2112202242048528540", "date": "2026-10-19T15:20:31.000Z", "summary": "今天我们发布 JST-2，全球首个全栈物理原生世界基础模型。  许多世界模型在像素/视频空间中学习。我们回归第一性原理，在 3D 中构建了整个模型栈。  数秒内生成 3D 场景并实时扩展。通过一个通用架构创建内置动作的角色。", "type": "model", "relTime": "1周前"}, {"id": 89, "title": "Nace AI 发布多模态决策模型 Drex Max，可处理文本、图像与视频", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2112186265986650332", "date": "2026-10-19T14:17:02.000Z", "summary": "Nace AI 发布迄今最强的决策模型 Drex Max，支持文本、图像和视频输入，单次决策 34ms，262K token 下不到 1 秒，输入价格 $0.06 / 1M tokens，已在 https://nace.ai/drex 开放。", "type": "model", "relTime": "1周前"}, {"id": 90, "title": "OpenBMB 提出 Trident 解决多模态检索文本偏好问题", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2112174429845504472", "date": "2026-10-19T13:30:01.000Z", "summary": "面壁智能 OpenBMB 提出 Trident，用多正样本视图 InfoNCE 联合训练文本、图像、融合三种视图，解决多模态检索器在图文混合语料上性能骤降的“Chaos in the Text”现象。", "type": "paper", "relTime": "1周前"}, {"id": 91, "title": "Laplace Intelligence 为机器人和自动驾驶汽车做部署前红队测试", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/19/laplace-intelligence-red-teams-robots-and-self-driving-cars-before-they-hit-the-real-world/", "date": "2026-10-19T12:30:00.000Z", "summary": "Laplace Intelligence 正在为机器人和物理 AI 构建自动化红队测试，用 AI 智能体在仿真中主动寻找故障点，让系统在部署到现实世界前先暴露问题。其仿真环境基于 Nvidia Cosmos 的后训练版本，可结合真实地图与实时交通数据重建场景，并支持语言提示实时调整设定。公司已产生收入并实现小幅盈利，客户主要来自自动驾驶领域，包括 Bot Auto 和一家日本大型车企。", "type": "industry", "relTime": "1周前"}, {"id": 92, "title": "可灵AI亮相ACFM 2026，聚焦Kling 4.0电影级能力", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2112136489043947962", "date": "2026-10-19T10:59:15.000Z", "summary": "可灵AI于10月10日至13日参加ACFM 2026，与全球电影行业深度交流，重点围绕Kling 4.0的模型能力，汇聚亚洲顶尖电影人探讨故事驱动型AI的未来及其对专业电影制作的影响。可灵AI表示将持续推动AI视频融入专业制作流程，与全球创作者合作把生成式AI带入真实工作流。", "type": "industry", "relTime": "1周前"}, {"id": 93, "title": "实测 Lovart 2.0 个人设计 Agent Arti：记忆、画布巡检与设计委托", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247512399&idx=1&sn=8aad2f1c9fe7cf02a3f61fbfef1bd644", "date": "2026-10-19T10:26:00.000Z", "summary": "作者实测 Lovart 2.0 新上线的个人设计 Agent Arti，它能读取用户历史项目的审美记忆，在生成中自动调研视觉方向、自主纠错，并支持画布巡检和分享链接后在画布上直接评论。文中用广东文创品牌和奶茶秋季海报项目验证记忆复用，还试运行了一个每日饮品节点的设计委托任务；Lovart 2.0 中文版已全量上线。", "type": "paper", "relTime": "1周前"}, {"id": 94, "title": "自变量发布 X2Real 仿真到现实机器人基准", "source": "X：自变量 X Square (@XSquareRobot)", "sourceUrl": "https://x.com/XSquareRobot/status/2112112528495108269", "date": "2026-10-19T09:24:02.000Z", "summary": "自变量推出 X2Real，一个基于 NVIDIA Isaac Lab-Arena 的通用机器人策略 sim-to-real 基准，覆盖 10 个能力维度、44 个分层长程任务，从视觉与语言推理到精细操作、双臂协作和工具使用。", "type": "paper", "relTime": "1周前"}, {"id": 95, "title": "Meshy 与 Chrona 旧金山科技周合作", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2112081850575511691", "date": "2026-10-19T07:22:08.000Z", "summary": "AI 生成的 3D 资产 市中心街头常见，并招致反弹。", "type": "industry", "relTime": "1周前"}, {"id": 101, "title": "Voxel51 3.0 发布：面向 Physical AI 的统一多模态数据平台", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/10/17/voxel51-3-0-physical-ai-data-platform/", "date": "2026-10-18T04:06:33.000Z", "summary": "Voxel51 发布 3.0 版本，将搜索、筛选、标注与评估整合为一个端到端多模态数据平台，面向机器人、车辆和工厂传感器数据的训练团队。新增 Voxel51 Agent（45+ MCP 工具、80+ 操作符、18 个开源技能）、四层数据溯源和 Agentic Labeling，支持 MCAP、3D 点云、DICOM、音频等模态，检索基于 LanceDB。", "type": "model", "relTime": "1周前"}, {"id": 102, "title": "MIT 团队构建多模态 AI 模型，让模型“看懂”材料的三维晶体结构", "source": "MIT News（RSS）", "sourceUrl": "https://news.mit.edu/2026/giving-ai-crystal-clear-view-of-materials-world-1018", "date": "2026-10-18T04:00:00.000Z", "summary": "MIT 研究人员构建了一个多模态 AI 模型，将晶体的 3D 原子结构与自然语言描述结合，生成涵盖化学成分、结构、性质、加工与应用的统一描述。在发表于 Nature Communications 的论文中，该系统在筛选固态锂离子电池电解质材料时给出的高分结果包含已被独立认定为有前景的候选材料，表现优于仅用文本训练的模型。", "type": "paper", "relTime": "1周前"}, {"id": 103, "title": "Kyutai 发布 REKI：2.4B 视觉-语言-动作模型，为机器人操作带来高效记忆", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/10/17/meet-kyutai-reki-the-2-4b-vla-model-bringing-efficient-memory-to-robot-manipulation/", "date": "2026-10-17T20:22:11.000Z", "summary": "Kyutai 联合 Inria 和 École des Ponts 发布 2.4B 参数的视觉-语言-动作模型 REKI，仅用公开数据预训练，权重已在 Hugging Face 开放（CC BY-NC-SA 4.0）。", "type": "model", "relTime": "1周前"}, {"id": 104, "title": "Waymo 无障碍功能保障视障乘客出行", "source": "X：Waymo (@Waymo)", "sourceUrl": "https://x.com/Waymo/status/2111487403256951257", "date": "2026-10-17T16:00:01.000Z", "summary": "无障碍功能是赋能盲人或低视力乘客在自动驾驶汽车中实现独立出行的关键。  以下是您每次行程中都会体验到的一些基础功能：🧵", "type": "paper", "relTime": "1周前"}, {"id": 105, "title": "用数据可视化原则设计日常 UI 与定制探索工具", "source": "X：Ian Johnson（Latent Space 联创） (@enjalot)", "sourceUrl": "https://x.com/enjalot/status/2111448876817269056", "date": "2026-10-17T13:26:55.000Z", "summary": "Ian Johnson 表示自己越来越多把数据可视化原则用于日常 UI 设计，因为很多 UI 正变成对用户生成内容的管理。他近来会明确提示生成定制工具来探索特定问题的设计空间，用真实数据生成视图而非线框图，设计过程因此更偏向过滤、缩放和检验假设。" function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){

}

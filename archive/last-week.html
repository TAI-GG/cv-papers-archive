ase64 数据 URL 两种格式，兼容 PNG、JPEG、WebP 和 GIF。", "type": "tip", "relTime": "1周前"}, {"id": 6, "title": "MegaParts：通过Token高效自回归建模将部件感知3D生成扩展至300个部件", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.14783", "date": "2026-08-14T00:00:00.000Z", "summary": "MegaParts提出可扩展的自回归3D生成框架，结合结构化序列建模与token高效的向量量化形状分词器，将部件级3D生成扩展至最多300个部件、序列长度达256k tokens。该方法在统一结构化序列中训练大语言模型生成物体边界框、部件边界框及部件形状token，相比基线自回归和扩散模型实现了更高的网格质量，表明压缩离散部件token能同时提升可扩展性与生成保真度。", "type": "paper", "relTime": "1周前"}, {"id": 7, "title": "文远知行 2026 上半年营收 3.5 亿同比增长 73%，Robotaxi 超 1800 辆", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/504.htm", "date": "2026-08-13T23:53:56.000Z", "summary": "文远知行发布 2026 年第二季度及上半年财报，上半年总营收 3.5 亿元，同比增长 73%；第二季度营收 2.3 亿元，同比增长 82%、环比增长 103%，毛利率升至 37.5%。上半年海外收入同比增长 154%，业务已覆盖 13 国 60 余城。截至 7 月 31 日，全球 L4 车队约 3，400 辆，其中 Robotaxi 超 1，800 辆。", "type": "industry", "relTime": "1周前"}, {"id": 8, "title": "Hitem3D 浏览器内 2D 转 3D 模型实测", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2088015317624844355", "date": "2026-08-13T21:30:19.000Z", "summary": "1/ 我想测试一下，能否从一张平面 2D 图像直接生成可用的 3D 资产，而无需花费数小时修复网格。  一张平面 2D 图像在大约 5 分钟内就变成了一个清晰、高细节的 3D 模型。整个过程完全在浏览器内通过 @Hitem3D 完成，零配置。以下是最终资产和具体工作流的快速展示：", "type": "tip", "relTime": "1周前"}, {"id": 9, "title": "Gemini 3.7 一句话生成 3D 手表，成本仅 $0.038", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2087995034755019080", "date": "2026-08-13T20:09:44.000Z", "summary": "Gemini 3.7 仅凭一句自然语言描述，就一次性生成了完整的程序化 three.js 场景--一只金色豪华手表，含滚花表圈、旭日纹表盘、日期窗口和扫秒指针，全程无外部素材或纹理。该测试由 AI/ML API 完成，总成本仅 $0.038。Rohan Paul 指出，three.js 是检验模型能力的有效方式，因为代码必须描述一个经得起旋转的真实场景。", "type": "tip", "relTime": "1周前"}, {"id": 10, "title": "Matic 机器人吸尘器推出语音手势控制", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2087976647828050200", "date": "2026-08-13T18:56:40.000Z", "summary": "Matic 推出 Cues 语音与手势控制，成为全球首款直观家用机器人，获 1.15 亿美元融资并历时 9 年研发。用户可指向污渍 ": 16, "title": "HeyGen 将 Avatar IV 视频生成模型移植到 Google Cloud Trillium TPU", "source": "Google Developers Blog（RSS）", "sourceUrl": "https://developers.googleblog.com/heygen-x-google-cloud-bringing-avatar-iv-to-tpus", "date": "2026-08-13T16:19:15.422Z", "summary": "HeyGen 将 18B+ 参数的 Avatar IV 视频生成模型移植到 Google Cloud Trillium （v6e） TPU，通过 torchax 和 XLA 实现，并采用 FSDP 与 Ulysses 序列并行。", "type": "tip", "relTime": "1周前"}, {"id": 17, "title": "Suno Studio 2.0 发布：新增 MIDI、效果插件与合成器，更接近专业 DAW", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/979345/suno-studio-2-0-midi-chatbot-custom-effects", "date": "2026-08-13T16:00:00.000Z", "summary": "Suno 发布 Studio 2.0，新增 MIDI 支持、自动化、内置效果插件及合成器，使其更接近专业数字音频工作站。新版还加入与当前项目音乐上下文联动的聊天机器人，可生成歌词、吉他线或自动添加混响、压缩等效果，并支持创建可保存复用的自定义效果插件。不过 Studio 暂不支持第三方插件或 VST。", "type": "paper", "relTime": "1周前"}, {"id": 18, "title": "Liquid AI 发布 LFM2.5-VL-3B：3B 端侧视觉语言模型，可读屏、目标定位与调用工具", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/13/liquid-ai-lfm2-5-vl-3b-on-device-vision-language-model", "date": "2026-08-13T15:56:03.000Z", "summary": "Liquid AI 发布 LFM2.5-VL-3B，一款 3.1B 参数的端侧视觉语言模型，可读取移动端、网页和桌面屏幕，将目标定位到坐标，解析文档图表，并从文本或图像输入调用工具。", "type": "model", "relTime": "1周前"}, {"id": 19, "title": "神秘生图模型\"mona-lisa-1\"曝光：含 OpenAI 来源信号，GPT-Image-2 发布三个月仍稳坐第一", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/476.htm", "date": "2026-08-13T14:41:37.000Z", "summary": "8月9日，代号\"mona-lisa-1\"的图像生成模型现身AI竞技场盲测列表，爆料者称其图片经OpenAI官方验证工具检测到来源信号，被认定为新一代GPT-Image模型。OpenAI尚未正式公告，该模型也未接入ChatGPT、API或Codex。OpenAI指出验证结果不能确认具体模型，尚不能凭来源信号确认其为GPT-Image 2继任型号。", "type": "industry", "relTime": "1周前"}, {"id": 20, "title": "部分 Claude 模型将添加\"文本水印\"，Anthropic 回应各界关切", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/462.htm", "date": "2026-08-13T13:47:17.000Z", "summary": "Anthropic 本周宣布，部分 Claude 模型将在输出文本中嵌入难以察觉的水印，复制粘贴或经一定修改后仍可保留，用于判断文字是否由 AI 生成。公司计划提供免费 API 供第三方检测水印，并称水印不会改变回答含义、质量或可读性。该水印自 8 月 2 日起已在全球受支持的 Claude 模型生成文本中启用，旨在遵守欧盟《人工智能法》。", "type": "model", "relTime": "1周前"}, {"id": 21, "title": "Claude 的\"红字\"水印：目前不可见，但即将覆盖所有处理内容", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/tech-policy/2026/08/claudes-new-scarlet-letter-watermark-is-invisible-for-now", "date": "2026-08-13T11:10:18.000Z", "summary": "Anthropic 宣布将为其所有模型处理的内容（不仅是生成内容）添加机器可读水印，以符合欧盟《人工智能法案》要求。所有新模型在全球范围内将从发布首日起嵌入不可见水印，生成文件还将附带数字签名来源元数据。Anthropic 采用\"从轨道上核平\"策略，即使欧盟对标准编辑等辅助功能不作要求，也会对处理内容打标，实际效果需待检测工具发布后才能验证。", "type": "industry", "relTime": "1周前"}, {"id": 22, "title": "Dyna Robotics 发布 Dyna-2：基于100万小时人类视频预训练的世界-动作模型", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/13/dyna-robotics-introduces-dyna-2-a-world-action-model-pre-trained-on-1-million-hours-of-human-video", "date": "2026-08-13T07:42:02.000Z", "summary": "Dyna Robotics 发布 Dyna-2，一个在超100万小时第一人称人类视频上预训练的世界-动作模型（WAM），用于机器人操作。研究团队验证了从1，000到1，000，000小时数据的缩放定律，并首次将该定律零样本迁移至未见过的机器人数据；视频联合去噪在39/39任务上优于仅动作训练，将零样本机器人MSE从0.340降至0.120。", "type": "model", "relTime": "1周前"}, {"id": 23, "title": "机器人 AI 模型 DYNA-2 登场：超 100 万小时人类视频训练，任务成功率可达 90%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/200.htm", "date": "2026-08-13T06:15:50.000Z", "summary": "具身智能公司 Dyna Robotics 发布机器人基础模型 DYNA-2，基于超 100 万小时第一人称人类视频预训练，任务成功率最高达 90%。该模型通过预测下一帧画面及应采取动作，补足传统视觉语言模型缺失的空间推理与接触物理能力。", "type": "model", "relTime": "1周前"}, {"id": 24, "title": "Seedance 2.5 免费生成与低价策略解析", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2087784883103957007", "date": "2026-08-13T06:14:39.000Z", "summary": "对于视频或图像生成，迭代循环才是真正的工作流程，这使得队列延迟和生成成本对实际效果至关重要。  第一次渲染测试提示词。  第二次修正构图。  第三次加强运动一致性。  第四次通常更接近目标。  🇺🇸 在 Dreamina 上可免费进行 4 次 Seedance 2.5 生成，无需排队，全速运行，持续 3 天。  其全球最低定价为 $0.097/秒。", "type": "paper", "relTime": "1周前"}, {"id": 25, "title": "第二届世界人形机器人运动会8月22日开幕：16国2056台机器人参赛，队伍总量同比增长138%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/152.htm", "date": "2026-08-13T04:10:46.000Z", "summary": "第二届世界人形机器人运动会将于8月22日在国家速滑馆\"冰丝带\"开幕，吸引六大洲16国666支队伍、2056台机器人参赛，队伍总量同比增长138%，机器人数量翻了两番。赛事设51个项目共1301场比赛，赛期从首届3天增至5天，并取消外围赛，将武术、舞蹈等对抗性项目纳入竞技赛。竞赛标准全面升级，100米完赛时间从3分钟压缩至1分钟，除障碍赛外所有径赛均须机器人全自主完成。", "type": "industry", "relTime": "1周前"}, {"id": 26, "title": "消息称 Anthropic 正洽谈以 60 亿美元收购 AI 初创公司 Decart AI", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/094.htm", "date": "2026-08-13T02:12:43.000Z", "summary": "据彭博社报道，知情人士透露，Anthropic PBC 正洽谈收购 AI 初创公司 Decart AI，交易金额约 60 亿美元（现汇率约合 405.41 亿元人民币）。目前双方尚未最终敲定交易，谈判仍有破裂可能。Decart 致力于帮助 AI 开发者充分发挥不同芯片性能，并专注生成式视频领域，使用\"世界模型\"对实时视频画面进行即时修改。", "type": "industry", "relTime": "1周前"}, {"id": 27, "title": "GoodCase.ai 开源：卡尔公开三年实测 AI 提示词案例库", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247509398&idx=1&sn=6b098a3348cf5fd7e59b368c6b44ba41", "date": "2026-08-13T01:52:00.000Z", "summary": "博主卡尔开源了维护三年的 AI 提示语案例网站 GoodCase.ai，收录上千条带完整提示语、模型版本和生成效果的 AI 视频、AI 前端及 Agent 案例。他用同一批提示语在 Seedance 2.0 Fast、MiniMax H3、Wan 3.0 三个模型上交叉验证，并烧掉十万积分完成首轮横测，将跨模型可复用的案例抽象成 Skill，供用户直接调用。", "type": "model", "relTime": "1周前"}, {"id": 28, "title": "MiniMax H3 携手 Magnific 展示 AI 视频新方向", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2087705681097109703", "date": "2026-08-13T00:59:56.000Z", "summary": "明天太平洋时间下午 5：30：MiniMax H3 × @magnific 将在 Magnific 旧金山办公室举办活动。  我们将展示人们已用 H3 制作的作品，探讨 AI 视频的发展方向，并在 Magnific 中亲手体验 H3。  现场将有涵盖电影级生成、原生音频、对话、剪辑等内容的实时工作流演示。  随后我们将开放交流环节，并带来更多社区作品展示。  名额仅剩几个。链接见下方。  #...", "type": "industry", "relTime": "1周前"}, {"id": 29, "title": "Context-Matched Distillation：面向自回归视频蒸馏的因果对齐框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.13391", "date": "2026-08-13T00:00:00.000Z", "summary": "Context-Matched Distillation（CMD）提出因果DMD框架，用因果教师替代双向全片段评分，使教师监督与学生生成时的因果信息集对齐。CMD在短、长视频基准上达到自回归方法中的最优综合性能，并显著提升对时变相机控制的遵循度。该方法可自然扩展至逐帧、分块生成及相机条件蒸馏。", "type": "paper", "relTime": "1周前"}, {"id": 30, "title": "PixSDS：潜在SDS为何产生噪声像素", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.12997", "date": "2026-08-13T00:00:00.000Z", "summary": "论文指出潜在SDS在文本生成3D中产生结构色伪影与高频纹理噪声，根因是VAE引发的像素漂移--优化图像沿VAE编码器弱约束方向移动，潜表征干净但图像累积可见伪影。为此提出PixSDS，一种轻量级VAE一致梯度修复方法，通过解码潜在SDS前瞻步骤作为像素空间优化方向，无需重训扩散模型或更换渲染器，在2D优化与文本生成3D实验中显著减少结构伪影并保留语义内容。代码已公开。", "type": "paper", "relTime": "1周前"}, {"id": 31, "title": "LiveAnimate：实时流式稳定长时人体动画生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.11745", "date": "2026-08-13T00:00:00.000Z", "summary": "LiveAnimate 提出首个结合实时流式与稳定长时生成的十亿级人体动画系统，基于 14B 参数视频 Diffusion Transformer（DiT）。通过两阶段训练将采样预算降至三步，并引入 Pose-Retrieval Sink Attention（PR-Sink）机制，使内存与延迟不随流时长增长。", "type": "paper", "relTime": "1周前"}, {"id": 32, "title": "UniSwap：面向说话视频的流式音视频身份替换框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.11752", "date": "2026-08-13T00:00:00.000Z", "summary": "UniSwap 提出首个用于说话视频的流式联合音视频身份替换框架，在单一音视频扩散 Transformer 中同时迁移参考外观与音色，并保留源视频内容与动态。", "type": "paper", "relTime": "1周前"}, {"id": 33, "title": "H2R-Bench：评估视频世界模型的人到机器人操作视频生成基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.13049", "date": "2026-08-13T00:00:00.000Z", "summary": "H2R-Bench 提出用于评估跨具身人到机器人操作视频生成的基准，要求模型将第一视角人类演示转换为指定具身下的机器人操作视频。基准涵盖目标状态完成、动作事件完成、功能接触迁移、具身正确性和视频质量五个维度，并评测了六个操作族、两种机器人具身上的十一个最新视频生成模型。结果显示当前视频世界模型在具身一致性、功能交互和任务执行上仍存在明显不足。", "type": "paper", "relTime": "1周前"}, {"id": 34, "title": "DreamX-Phi 1.0：面向机器人操作的动作条件视频世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.13489", "date": "2026-08-13T00:00:00.000Z", "summary": "DreamX-Phi 1.0 是一个面向机器人操作的动作条件视频世界模型，输入观测帧、语言指令及动作序列即可预测未来观测。该模型通过 PRoPE 式几何编码注入每臂 SE（3） 变换，并引入深度分支与 SAM3 掩码保持物体一致性，同时用分布匹配蒸馏实现高效部署。", "type": "paper", "relTime": "1周前"}, {"id": 35, "title": "PlayWorld：用智能体玩家在长程目标下评测世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.13552", "date": "2026-08-13T00:00:00.000Z", "summary": "香港大学与快手可灵团队推出 PlayWorld 基准，用多模态 Agent Player 模拟人类玩家，在 171 个带指定目标的场景中与世界模型交互，以长程目标而非固定动作轨迹进行跨模型公平对比。评测覆盖几何一致性、交互保真度、视野外演化与洞察演化四个核心维度，并纳入视频质量与可控性基础指标。对九个前沿世界模型的实验显示，现有模型在长程交互目标上仍不可靠，尤其在空间一致性与持续状态演化方面。", "type": "paper", "relTime": "1周前"}, {"id": 36, "title": "Intern-S2-Preview：面向科学发现的智能体基础模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.13505", "date": "2026-08-13T00:00:00.000Z", "summary": "Intern-S2-Preview 是一系列科学智能体基础模型，支持多模态科学理解、推理、生成及长周期任务。其训练流程涵盖科学多模态预训练、监督微调、可扩展多任务强化学习及智能体强化学习，并采用部分回滚、自适应长度正则化等技术提升稳定性。Intern-S2-Preview-397B 在多项科学、多模态及智能体基准上取得领先结果，其时间序列模块提升了 SciTS 上的信号理解与预测能力。", "type": "model", "relTime": "1周前"}, {"id": 37, "title": "OmniScientist：一个全模态、全学科的 AI 科学家", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.13558", "date": "2026-08-13T00:00:00.000Z", "summary": "OmniScientist 是一个端到端全模态 AI 科学家，可直接从异构原始证据（图像、信号、音频、视频、3D 结构、轨迹、表格、公式和图）开展多学科研究。系统在 36 个真实数据案例（覆盖 5 个学科族）中全部完成从原始数据到成稿论文的完整流程，平均论文总分为 6.3。与仅接收预计算标量特征的盲变体相比，直接感知在全部 7 个评估维度上均更优，并在 85% 的成对比较中胜出。", "type": "paper", "relTime": "1周前"}, {"id": 38, "title": "DeepSeek V4 Pro 0813 上线 OpenRouter，仅限 API 调用", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Aug/12/deepseek-v4-pro-0813", "date": "2026-08-12T23:59:23.000Z", "summary": "DeepSeek 最新 Pro 模型 V4 Pro 0813 已上线，仅通过 API 提供，目前可在 OpenRouter 上访问。该模型在低、中、高三种推理强度下生成了差异明显的鹈鹕图像，作者称在其他模型中未见此类现象。官方尚未确认是否开源权重，但鉴于 4 月和 7 月版本均已发布权重，开源可能性较大。", "type": "model", "relTime": "1周前"}, {"id": 39, "title": "Grok 4.6 登顶两项新基准测试", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2087671334541369475", "date": "2026-08-12T22:43:27.000Z", "summary": "Grok 4.6 在另外两项基准测试中夺得第一！🔥  • 3DCodeBench：54.0%，通过代码创建引擎就绪的 3D 资产。  • CadGenBench：40.9%，根据设计提示词生成 CAD 模型。", "type": "tip", "relTime": "1周前"}, {"id": 40, "title": "部分 Claude 用户不满 Anthropic 新水印功能，担心在工作和学业中被识破", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/12/some-claude-users-are-mad-that-anthropics-new-watermarks-will-catch-them-cheating-at-their-jobs-classes", "date": "2026-08-12T22:26:37.000Z", "summary": "Anthropic 为满足欧盟《AI 法案》透明度规范，开始在 Claude 输出中嵌入不可见水印，标记 AI 生成内容。部分 Reddit 用户抱怨该系统是\"阴谋\"，称学生、记者等普通用户会被\"抓包\"，但也有用户反驳称水印仅用于检测 AI 输出风险，并非\"认领功劳\"。", "type": "industry", "relTime": "1周前"}, {"id": 41, "title": "Runway 上线 Grok Imagine 2.0 图像模型", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2087664899493400926", "date": "2026-08-12T22:17:53.000Z", "summary": "Grok Imagine Image 2.0 现已登陆 Runway。这款最新模型现已可用，与全球顶尖的图像和视频模型并列。  点击下方链接立即体验。", "type": "model", "relTime": "1周前"}, {"id": 42, "title": "Higgsfield 插件上线 ChatGPT 应用", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2087598187951317316", "date": "2026-08-12T17:52:48.000Z", "summary": "Higgsfield 插件正式上线 ChatGPT 应用，用户可直接在聊天中生成与编辑图像，无需 API key，使用现有 Higgsfield 积分即可。", "type": "product", "relTime": "1周前"}, {"id": 43, "title": "Cohere 发布 North Micro Vision 视觉模型", "source": "X：Cohere（@cohere）", "sourceUrl": "https://x.com/cohere/status/2087571573947392419", "date": "2026-08-12T16:07:03.000Z", "summary": "今天，我们为模型家族再添新成员。欢迎 North Micro Vision。  这是我们迄今最小的视觉语言模型，非常适合复杂的文档理解。以 Apache 2.0 许可证开源发布。可在 @huggingface 上获取权重。", "type": "model", "relTime": "1周前"}, {"id": 44, "title": "D\\'Addario 承认宣传视频使用了 Suno 生成音乐", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/978982/daddario-guitar-ai-music-suno", "date": "2026-08-12T15:52:07.000Z", "summary": "乐器公司 D\\'Addario 在否认近两周后，承认其促销视频中使用了 Suno Studio 重新生成原曲。公司更新了 7 月 29 日的 Instagram 帖子，表示\"我们搞错了\"，并承诺未来要求员工和创意合作方披露任何生成式 AI 的使用，同时加强内容审核。此前吉他手 Rhett Shull 分析原始 Logic 文件后已怀疑 Suno 参与制作。", "type": "industry", "relTime": "1周前"}, {"id": 45, "title": "Luma 上线 FLUX 3 多模态模型", "source": "X：Luma AI (@LumaLabsAI)", "sourceUrl": "https://x.com/LumaLabsAI/status/2087554647586156897", "date": "2026-08-12T14:59:47.000Z", "summary": "FLUX 3 现已上线 Luma。  这是 @bfl_ai 首个面向图像、视频、音频和动作预测的通用模型。支持原生音频的视频，今日即可使用。更多功能即将推出。", "type": "model", "relTime": "1周前"}, {"id": 46, "title": "Google Pixel Watch 5 深入 AI 与健康：离线 Gemini、血压与胰岛素抵抗趋势，涨价 50 美元", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/978094/pixel-watch-5-hands-on-made-by-google-gemini-wearables-smartwatch", "date": "2026-08-12T14:00:00.000Z", "summary": "Google 发布售价 399 美元的 Pixel Watch 5，核心升级均为软件层面：Gemini 支持离线执行计时器、启动应用等简单任务，并新增表盘实时信息与 AI 生成表盘。健康方面新增呼吸急症检测（SpO2 降至约 83% 时自动呼叫急救）、血压趋势与胰岛素抵抗趋势（均非诊断功能，9 月推送至 Pixel Watch 3 及更新机型）。手表较去年涨价 50 美元。", "type": "paper", "relTime": "1周前"}, {"id": 47, "title": "BytePlus 8月13日直播：Seedance 2.5 AI电影制作工作流", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2087520419461190024", "date": "2026-08-12T12:43:46.000Z", "summary": "BytePlus 将于8月13日举办网络研讨会，展示其官方平台 Dreamina Seedance 2.5 如何将 AI 视频从实验片段推进到完整创作流程，实现从剧本到成片、更长更一致且更易编辑的视频生成。", "type": "industry", "relTime": "1周前"}, {"id": 48, "title": "百度智能云在超级智能体大会成都站推出OPC重磅支持计划", "source": "公众号：百度智能云（文心）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzA5NTQ5MzE5OQ%3D%3D&mid=2653159438&idx=1&sn=c241274cfbd93071d97b254546da5021", "date": "2026-08-12T12:39:33.000Z", "summary": "百度智能云在8月12日于成都举办的超级智能体大会BAIDU AGENT SUMMIT上正式推出OPC重磅支持计划，面向创业者开放Agent产品与生态能力，提供算力、模型额度、市场资源等综合支持。该计划未来三个月将在成都投入2亿产品及市场资源，并依托百度搭子作为超级入口连接Agent全家桶，推动AI内容创作、数字人营销、音乐生成、短剧出海等场景落地。", "type": "industry", "relTime": "1周前"}, {"id": 49, "title": "PixVerse 试玩 Hailuo H3 像素风趋势", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2087517348207206810", "date": "2026-08-12T12:31:34.000Z", "summary": "@PixVerse_ 刚在 PixVerse 上用 @Hailuo_AI H3 试了\"Pixel Verse\"趋势。我们生成了 8 张图作为参考。提示词如下 ↓", "type": "tip", "relTime": "1周前"}, {"id": 50, "title": "影石 X6 正式发布：3999 元起，1/1.1 英寸大底传感器 + AI 三芯架构支持 8K 50 帧全景视频", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/988/955.htm", "date": "2026-08-12T12:10:34.000Z", "summary": "影石今日发布超旗舰全景相机 X6，官方定价 3999 元起。该机搭载与索尼联合定制的两颗 1/1.1 英寸方形大底传感器，支持 8K 50 帧全景视频和 1.2 亿像素全景照片，并成为首款支持机内原生杜比视界的全景相机。X6 配备高通 4nm AI 芯片与两颗影像芯片，算力提升 5 倍，新增 AI 导演、时刻 Pro 及 3D 时光舱等 AI 创作功能。", "type": "paper", "relTime": "1周前"}, {"id": 51, "title": "荣耀 Robot Phone 手机搭载 Agentic OS，首发全新 YOYO Pro 模式", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/988/946.htm", "date": "2026-08-12T11:48:05.000Z", "summary": "荣耀 Robot Phone 全球发布会宣布，该机搭载 Agentic OS 新一代伙伴型多模态智能操作系统，首发全新 YOYO Pro 模式，由阿里千问大模型深度加持，支持超长任务执行、跨生态联动。该机提供星轨银和月影灰两款配色，采用 9.59mm 轻薄机身与 248g 全金属一体成型设计，配备 6.31 英寸屏幕、第五代骁龙 8 至尊版芯片及 7060mAh 青海湖电池。", "type": "model", "relTime": "1周前"}, {"id": 52, "title": "比亚迪 AI 团队首秀：混合世界模型 HyWorldVLA 获 90.59 分，自研芯片 + 算法闭环成型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/988/942.htm", "date": "2026-08-12T11:33:08.000Z", "summary": "比亚迪汽车新技术研究院 AI 团队发布首篇研究论文，推出用于自动驾驶的混合世界模型 HyWorldVLA，结合像素级与潜在空间世界建模，采用视觉-语言-动作（VLA）架构。", "type": "paper", "relTime": "1周前"}, {"id": 53, "title": "Manus 开启限时免费活动：8 月 26 日前 Manus 1.6/Lite 全球免费用", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/988/895.htm", "date": "2026-08-12T10:09:14.000Z", "summary": "Manus 宣布即日起至 8 月 25 日 23：59，全球免费和付费用户可在每日活动额度内免费使用 Manus 1.6 Lite 和 Manus 1.6，免除标准积分消耗。免费用户每天最多生成 20 张图像和 1 个视频，付费用户为 200 张和 10 个，额度独立计算。Manus 1.6 Max 不参与活动，付费用户可切换至 Max 但不再享受免费权益。", "type": "industry", "relTime": "1周前"}, {"id": 54, "title": "Claude 文本水印争议：真相与三大问题", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2087475010050920549", "date": "2026-08-12T09:43:20.000Z", "summary": "Anthropic 计划在 Claude 生成文本中嵌入不可见的机器可读水印，引发争议。核心问题有三：水印检测不等于作者身份证明，可能误伤经 Claude 润色或翻译的人类文本；Anthropic 尚未公开足够技术细节或独立测试来支撑其\"质量不受影响\"的说法；水印可被改写、翻译或换模型削弱，但普通用户更易保留标记。隐私担忧实为误解--水印在模型层面添加，不追踪个人身份或会话。", "type": "tip", "relTime": "1周前"}, {"id": 55, "title": "LinkedIn CringeBot 3000 上线：用 AI 生成尴尬评论", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.cringebot3000.com/", "date": "2026-08-12T09:08:20.526Z", "summary": "LinkedIn CringeBot 3000 网站上线，专门生成令人尴尬的 LinkedIn 评论。该工具在 Hacker News 上获得 119 个点赞，引发社区关注。目前仅提供网页版，具体模型和参数未公开。", "type": "tip", "relTime": "1周前"}, {"id": 56, "title": "LTX-2.5 模型登场：AI 生成 10 秒 720P 视频仅需 6.8 秒，原生集成 ComfyUI", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/988/766.htm", "date": "2026-08-12T06:46:51.000Z", "summary": "LTX 推出 LTX-2.5 模型，原生集成 ComfyUI，在 2 张英伟达 GB200 配置下生成 10 秒 720P 视频仅需 6.8 秒。LTX-2.5 Fast 以每秒 0.09 美元生成带音频 720p 视频，10 秒片段成本 0.90 美元；年度经常性收入低于 1，000 万美元的组织可免费使用。", "type": "model", "relTime": "1周前"}, {"id": 57, "title": "威联通为 Qsirch 推出 AI 模式：利用 VLM / LLM 优化 NAS 内容搜索体验", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/988/759.htm", "date": "2026-08-12T06:34:09.000Z", "summary": "威联通（QNAP）今日为 NAS 搜索应用 Qsirch 推出整合 VLM 与 LLM 的 Qsirch AI Mode，用户可通过自然语言描述跨文件、图片、音频、视频等多种媒体格式搜索。AI 推理均在 NAS 本地执行，无须将文件内容上传至公有云 API。该模式支持关键词、内容、上下文多重匹配，音视频支持时间轴与文字转录内容双向同步。", "type": "product", "relTime": "1周前"}, {"id": 58, "title": "Grok Bot 团队：8个AI智能体分工协作", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2087409427888603229", "date": "2026-08-12T05:22:44.000Z", "summary": "Grok Bot  【引用 @farzyness】：这是我的 Grok Bot 团队：  - Webby：网页设计师 - Shotry：短视频内容创作者 - Writey：文章/通讯稿写手 - Claude Code：专精 CC 的 Grok 智能体 - Codex：同上，但专精 CODEX - Script：YouTube 脚本写手 - Idea：视频/内容创意生成 - Master：整个...", "type": "tip", "relTime": "1周前"}, {"id": 59, "title": "Qwen Live 第二期：多模态模型落地生产", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2087381235270119877", "date": "2026-08-12T03:30:42.000Z", "summary": "欢迎与 Qwen 和 Qwen Cloud 团队一起参加 Qwen Live 第二期，我们将探讨多模态如何从惊艳的演示走向真实生产环境--重点介绍 Qwen-Image 3.0 和 Qwen3.8-Max。我们将讨论智能体对多模态模型的要求，以及 Qwen Cloud 如何将这些能力交到开发者手中。2026 年 8 月 14 日 | 上午 10：00（UTC+8）立即设置提醒：https:/...", "type": "industry", "relTime": "1周前"}, {"id": 60, "title": "Seedance 2.5 实测：视频生成能力是否名副其实", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/funeralai/seedance-25", "date": "2026-08-12T02:00:00.000Z", "summary": "Seedance 2.5 发布近两周，连路边视频 Agent OiiOii 都借其广告复活，引发广泛关注。本文对该模型进行实测，验证其视频生成能力是否与宣传相符，并评估其实际表现与市场热度是否匹配。", "type": "tip", "relTime": "1周前"}, {"id": 61, "title": "WorldClaw：腾讯混元推出大规模智能体3D开放世界生成", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://tencent-hunyuan.github.io/Hunyuan3D-WorldClaw", "date": "2026-08-12T00:54:23.266Z", "summary": "腾讯混元发布 WorldClaw，实现大规模智能体驱动的3D开放世界生成。该系统可自动生成包含复杂地形、建筑与交互元素的连贯开放世界场景，相关项目页面已上线。", "type": "paper", "relTime": "1周前"}, {"id": 62, "title": "Grok Imagine 2.0 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2087334361465283018", "date": "2026-08-12T00:24:27.000Z", "summary": "@grok 推出的 Grok Imagine Image 2.0 现已在 OpenRouter 上线。  它专为可用于实际工作的图像而打造：能规划排版、布局和多部分视觉内容，在摄影、设计和插画领域均保持高保真度。", "type": "paper", "relTime": "1周前"}, {"id": 63, "title": "StateFlow：面向预可视化的 3D 世界状态构建、演化与访问框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.12314", "date": "2026-08-12T00:00:00.000Z", "summary": "StateFlow 提出以可编辑 3D 世界为核心的状态中心框架，用于电影、游戏等领域的生成式预可视化。该框架通过状态构建、演化与访问三阶段，将 2D 内容提升为连贯 3D 世界，并支持局部编辑与相机轨迹优化，避免逐帧全场景重生成。实验显示其能生成高质量 3D 世界，适用于视频创作与类游戏原型设计。", "type": "paper", "relTime": "1周前"}, {"id": 64, "title": "MBA-Bench：面向真实世界商业创意的多模态基准与智能体", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.11616", "date": "2026-08-12T00:00:00.000Z", "summary": "研究团队推出MBA-Bench，这是首个用于训练和评估商业创意智能体的多模态基准，涵盖六个领域共30K样本，每个领域包含文本无法完全传达的独特视觉线索。基于GPT-4o生成参考创意，团队训练了MBA-b和MBA-k两个智能体，分别针对隐藏和公开的评估标准进行优化。MBA-b和MBA-k在基准上分别超越纯文本基线63.9%和77.1%，超越多模态基线25.6%和35.8%。", "type": "paper", "relTime": "1周前"}, {"id": 65, "title": "S2R-Removal：首个基于扩散模型的视频去反射模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.11562", "date": "2026-08-12T00:00:00.000Z", "summary": "研究团队提出闭环框架 S2R，统一物理反射模拟、扩散视频去反射与基准评测。其 S2R-Synthesis 在结构空间进行物理增强并渲染带反射视频，S2R-Removal 为首个扩散视频去反射模型，单步去噪即可恢复干净透射。S2R-Bench 是首个视频去反射基准，支持全参考评估与真实人工感知评测，实验显示性能达 SOTA 且推理快于非扩散基线。", "type": "paper", "relTime": "1周前"}, {"id": 66, "title": "GAS：以生成作为辅助监督，零推理开销提升多模态理解", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.12209", "date": "2026-08-12T00:00:00.000Z", "summary": "GAS 提出一种生成引导训练框架，将视觉生成重构为表征学习的辅助监督，通过解耦的 Mixture-of-Transformers（MoT）架构适配 Next Embedding Prediction（NEP）跨模态生成范式。该方法在不同模型规模和训练阶段均提升多模态理解，尤其在感知与空间理解上增益最稳定。由于辅助生成分支在训练后被丢弃，这些提升不产生任何推理开销。", "type": "paper", "relTime": "1周前"}, {"id": 67, "title": "TailBooster：面向极端事件增强的双层生成框架，兼顾操作有效性约束", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.11951", "date": "2026-08-12T00:00:00.000Z", "summary": "TailBooster 提出一种双层生成框架，结合生成建模与两层异常检测，用于航空运输极端事件（如严重到达延误、异常空中时间）的数据增强。该框架通过统计层提取尾部样本、深度学习层清洗违反操作可行性的合成记录，在六个回归算法上将极端空中时间预测的 MAE 降低 47-49%，极端到达延误预测的 MAE 降低 29-57%。", "type": "paper", "relTime": "1周前"}, {"id": 68, "title": "VideoGAIA：面向智能体视频理解的通用 AI 助手基准测试", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.14718", "date": "2026-08-12T00:00:00.000Z", "summary": "VideoGAIA 是一个面向通用 AI 助手的智能体视频理解基准，将视频理解从单轮问答转向多轮、工具增强的交互过程，要求模型迭代感知视频、调用外部工具并整合多模态证据。该基准包含 271 个由模型与人类共同设计的任务，每个实例均经三位人类专家独立验证。GPT-5.5、Kimi-K3 等前沿 MLLM 在 VideoGAIA 上准确率均低于 60%，凸显其作为评估下一代 MLLM 基准的价值。", "type": "paper", "relTime": "1周前"}, {"id": 69, "title": "MiniMax H3 视频生成工作流：1.97 美元替代 Seedance 2.5", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2087326474114384381", "date": "2026-08-11T23:53:06.000Z", "summary": "MiniMax 官方转发演示：用 DeepSeek V4 Flash 0731 编写 Three.js 场景，再交由 H3 生成视频，48 分钟、单次生成仅花费 1.97 美元，即可完成一镜到底的游戏射击场景。该工作流比反复重roll视频模型便宜得多，被视为更经济高效的 Seedance 2.5 替代方案。", "type": "tip", "relTime": "1周前"}, {"id": 70, "title": "LTX-2.5 发布：NVIDIA 加速的开源权重世界模型，将视频制作栈压缩到一张桌面", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/11/the-video-production-stack-now-fits-on-one-desk-ltx-2-5-launches-as-nvidia-accelerated-open-weights-world-model", "date": "2026-08-11T20:02:03.000Z", "summary": "LTX 发布 LTX-2.5，一个面向视频生成、实时应用和物理 AI 的开源权重世界模型，针对 NVIDIA RTX GPU 和 DGX Spark 本地推理优化，降低了 VRAM 需求。", "type": "model", "relTime": "1周前"}, {"id": 71, "title": "Anthropic 为 Claude 文本添加隐形水印", "source": "X：Thariq (@trq212)", "sourceUrl": "https://x.com/trq212/status/2087258090169414008", "date": "2026-08-11T19:21:22.000Z", "summary": "Anthropic 将在所有 Claude 生成文本中嵌入隐形水印，水印随文本复制粘贴而保留，非元数据。该功能自 2026 年 8 月 2 日后发布的模型起全球生效，依据 Anthropic 签署的欧盟 AI 法案准则。Anthropic 还将推出文本检测 API，并继续为现有模型添加水印。", "type": "model", "relTime": "1周前"}, {"id": 72, "title": "Replit 集成 Semgrep 守护 AI 生成代码安全", "source": "X：Replit (@Replit)", "sourceUrl": "https://x.com/Replit/status/2087250743279403135", "date": "2026-08-11T18:52:11.000Z", "summary": "Replit 用户每天运行超 10 万次 Semgrep 安全扫描，其 Guardian 密钥检测现已直接内置，代码生成瞬间即可捕获漏洞。每次扫描 5 秒内完成且结果确定，结合 Replit 推理层可过滤超 93% 误报，现已上线且无需配置。", "type": "paper", "relTime": "1周前"}, {"id": 73, "title": "Grok Build v1.0.1 更新：新增视频生成与安全改进", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2087232895798616122", "date": "2026-08-11T17:41:15.000Z", "summary": "Grok Build v1.0.1 发布，新增视频生成功能，支持预设语音、单图输入、1-15 秒时长及 4：3/3：4 宽高比。更新还引入受限子代理、\\`grok du\\` 磁盘占用命令、只读工具标记等安全特性，并修复多项 bug。Elon Musk 在 X 上向用户征集对 Grok Build 的改进建议。", "type": "paper", "relTime": "1周前"}, {"id": 74, "title": "AMIE 研究医疗 AI 系统首次展示实时临床视频问诊能力", "source": "Google Blog：AI（RSS）", "sourceUrl": "https://blog.google/innovation-and-ai/models-and-research/google-research/amie-video-consultations", "date": "2026-08-11T17:00:00.000Z", "summary": "Google Research 与 Google DeepMind 推进医疗 AI 系统 AMIE，实现实时临床视频问诊，首次在此场景展示专家级 AI 能力。该系统基于 Gemini 和 Project Astra 构建，可解读视觉与听觉线索、引导虚拟体格检查并实时诊断推理。随机研究中，临床评估者对 AMIE 的病史采集、诊断准确性等核心能力给予好评，患者演员也更偏好视频体验。", "type": "paper", "relTime": "1周前"}, {"id": 75, "title": "小鹏VLA 2.0专访：自动驾驶何时落地欧洲", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2087191539835347376", "date": "2026-08-11T14:56:55.000Z", "summary": "小鹏汽车智能中心负责人刘先明接受专访，详解VLA 2.0实际能力、自动驾驶仍存在的短板及该技术进入欧洲的时间表。小鹏正基于统一AI底座布局自动驾驶、Robotaxi、人形机器人与飞行汽车，转型为Physical AI公司。访谈还探讨了同一AI底座控制多类载体时，车企与AI公司的边界何在。", "type": "tip", "relTime": "1周前"}, {"id": 76, "title": "Grok CLI v1.0.1 更新：新增磁盘用量与视频生成功能", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2087189868875075617", "date": "2026-08-11T14:50:17.000Z", "summary": "Grok CLI 发布 v1.0.1 更新，新增 \\`grok du\\` 命令查看磁盘用量、支持从参考图生成 1-15 秒视频，并限制子智能体生成数量以防资源耗尽。/rewind 命令现仅截断对话历史且默认需确认，MCP 服务器仅通过网关目录可用，并修复了多项 bug。", "type": "paper", "relTime": "1周前"}, {"id": 77, "title": "FigureLabs 用 AI 生成可编辑科研图表", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2087186371048059258", "date": "2026-08-11T14:36:23.000Z", "summary": "Rohan Paul 测试了 FigureLabs 的 AI 科研图表工作流：从学术草稿生成科学图表，并支持局部修改、图内文字编辑、重新着色及导出为可编辑 PowerPoint。AI 负责初稿，研究者保留对最终呈现的完全控制，适用于论文与演示。", "type": "tip", "relTime": "1周前"}, {"id": 78, "title": "Claude 将为 AI 文本和图像添加不可见水印", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/977823/anthropic-claude-ai-watermarks-c2pa-text-images", "date": "2026-08-11T12:22:20.000Z", "summary": "Anthropic 承诺为 Claude 生成的文本和图像添加机器可读水印，以符合欧盟《AI 法案》的透明度要求。文本将嵌入不可见水印，文件将附带 C2PA 数字签名元数据，覆盖 Claude Platform （API）、Claude Code 等产品。新模型发布首日即启用标记，现有模型支持仍在推进中。", "type": "model", "relTime": "1周前"}, {"id": 79, "title": "UniProbe：面向大型视觉语言模型的可学习 token 级幻觉检测器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.10835", "date": "2026-08-11T12:01:59.000Z", "summary": "UniProbe 提出一种轻量级、统一的可学习检测器，通过单次前向传播对冻结 LVLM 的异构计算轨迹建模，利用 GNN、ViT 和 GRU 交替处理空间、关系与序列证据，实现 token 级幻觉定位。在多种 LVLM 主干上达到 SOTA 检测性能，解码时可将物体幻觉降低最多 55%，延迟仅为标准生成的 1.06 倍。", "type": "paper", "relTime": "1周前"}, {"id": 80, "title": "小米重组人形机器人部门，前字节跳动孔旗挂帅", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2087111530672529690", "date": "2026-08-11T09:39:00.000Z", "summary": "小米重组人形机器人部门，新设\"具身智能与应用部\"，由前字节跳动Seed Robotics具身AI负责人孔旗领导，整合VLA及具身机器人等多个团队。内部评价其工作\"远超预期\"。小米机器人已进入工厂试运行，3月在小米汽车产线上自主运行3小时，双面螺丝螺母安装成功率达90.2%，满足76秒生产节拍。", "type": "industry", "relTime": "1周前"}, {"id": 81, "title": "腾讯混元发布 Hy3D WorldClaw 智能体工作流", "source": "X：腾讯混元 (@TencentHunyuan)", "sourceUrl": "https://x.com/TencentHunyuan/status/2087068591296536755", "date": "2026-08-11T06:48:22.000Z", "summary": "推出 Hy3D WorldClaw--一个从文本提示词生成大规模 3D 开放世界的智能体工作流。🚀🚀🚀 不是视频，不是高斯泼溅，WorldClaw 生成的每个场景都可自由探索，且完全由可编辑、可直接用于游戏的 3D 资产构建，具备高质量几何与纹理。项目页面：https://tencent-hunyuan.github.io/Hunyuan3D-WorldClaw/", "type": "paper", "relTime": "1周前"}, {"id": 82, "title": "Claude 如何标注 AI 生成内容", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://support.claude.com/en/articles/16266773-how-claude-marks-ai-generated-content", "date": "2026-08-11T06:18:04.621Z", "summary": "Anthropic 在官方支持文档中说明 Claude 如何标注 AI 生成内容。该机制旨在提升内容透明度，帮助用户识别由 Claude 生成或修改的文本、图像等输出。具体标注方式与适用范围以官方文档为准。", "type": "tip", "relTime": "1周前"}, {"id": 83, "title": "用 ComfyUI API 实现 MiniMax-H3 多模态视频与音频生成流水线", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/10/implementing-a-minimax-h3-multimodal-video-and-audio-generation-pipeline-with-comfyui-apis", "date": "2026-08-11T05:44:38.000Z", "summary": "本教程演示如何以 ComfyUI 为无头推理后端，构建端到端的 MiniMax-H3 视频生成工作流。通过 Python 直接构建执行图，支持文生视频、首尾帧条件生成和参考图像条件生成，并自动根据 GPU 显存选择 quality、balanced、squeeze 三种权重配置。流水线涵盖模型自动下载、节点模式校验、音视频联合解码与进度监控，无需图形界面即可复现实验。", "type": "tip", "relTime": "1周前"}, {"id": 84, "title": "Grok Imagine 升级：Image 2.0 成创意工具", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2087046240353603854", "date": "2026-08-11T05:19:33.000Z", "summary": "Grok Imagine  【引用 @minchoi】：Grok Imagine 不再只是图像生成器。  Image 2.0 可以精准编辑照片、融合 5 张参考图、渲染清晰文字、调整任意尺寸并移除背景。  这现在是一款真正的创意工具。  100% AI  10 个精彩示例（含提示词）：  1. 宝丽来风格合影", "type": "paper", "relTime": "1周前"}, {"id": 85, "title": "AI文本水印技术与欧盟AI法案合规现状", "source": "X：Deedy Das (@deedydas)", "sourceUrl": "https://x.com/deedydas/status/2087037735819460675", "date": "2026-08-11T04:45:46.000Z", "summary": "AI文本水印检测无法做到完美，约400 token时真阳性率约90%（假阳性率<1%）。欧盟AI法案第50（2）条要求所有模态AI生成内容可检测，第113条规定2026年8月2日起适用。Claude宣布合规，Gemini已用SynthID，OpenAI曾搁置水印方案但表示将扩展溯源信号至文本。", "type": "tip", "relTime": "1周前"}, {"id": 86, "title": "H3-metal：面向 Apple Silicon 的原生 MiniMax-H3 推理", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://github.com/antirez/h3.c", "date": "2026-08-11T04:42:08.868Z", "summary": "H3-metal 项目为 Apple Silicon 提供原生 MiniMax-H3 推理，已实现 prompt-to-video/audio、首尾帧条件控制及有序 Ref2VA 图像/视频/音频引用端到端工作流。", "type": "tip", "relTime": "1周前"}, {"id": 87, "title": "字节 Seedance 2.5 免费开源提示词文档", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2087031387970736235", "date": "2026-08-11T04:20:32.000Z", "summary": "字节 Seedance 2.5 与 Seedream 5.0 Pro 的提示词文档免费开源，内含几十套完整案例，覆盖盛唐 30 秒长镜头、废土科幻一镜到底等场景。视频支持 30 秒生成、时间戳指定镜头动作，最多吃 30 图 + 10 视频 + 10 音频参考；生图支持高密度信息图与商用级人像。官方将专业分镜、运镜、负面词方法论拆成可直接复制的 Prompt，替代传统分镜师与后期团队一周的工作。", "type": "model", "relTime": "1周前"}, {"id": 88, "title": "阿里云AI Guardrails实时防护大模型与智能体", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2087015118752129218", "date": "2026-08-11T03:15:53.000Z", "summary": "AI Guardrails：面向LLM与智能体的实时防护。安全是企业级AI的必选项。阿里云AI Guardrails以通义千问驱动的多模态检测、原生流式审核（延迟<2s）及灵活的自定义操作，守护全链路安全。🔗 https://click.alibabacloud.com/m/20000002158/ #AlibabaCloud #Cybersecurity #Security #AIGuar...", "type": "model", "relTime": "1周前"}, {"id": 89, "title": "Claude 全球上线隐形文本水印", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2087013470277394521", "date": "2026-08-11T03:09:20.000Z", "summary": "Anthropic 为 8 月 2 日后新模型的全部输出加入人眼不可见的统计水印，覆盖 Claude.ai、API、Claude Code 及 AWS、谷歌云接口，复制粘贴或小改文字仍可被官方密钥检测。该功能为满足欧盟 AI 法案第 50 条要求，但 Anthropic 对全球用户统一生效且无法关闭，可查 AI 垃圾内容与学术造假，也让 AI 代写内容更易被识别。", "type": "model", "relTime": "1周前"}, {"id": 90, "title": "阿里巴巴千问 App 推出付费服务，办公助理会员年付最高 1499 元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/988/096.htm", "date": "2026-08-11T00:09:57.000Z", "summary": "阿里巴巴千问 App 面向专业用户推出付费方案，含办公助理订阅会员与 AI 视频生成单独额度两套模式。办公助理分旗舰、精英、高级三档，月付 19-128 元、年付 200-1499 元，分别提升至 2-20 倍额度；AI 视频生成按额度充值，10-500 个视频售价 26-968 元，额度三个月内有效。未开通会员的普通用户仍可使用相关功能。", "type": "product", "relTime": "1周前"}, {"id": 91, "title": "Self-Geometry：面向几何一致 3D 视觉基础模型的无监督即插即用测试时自适应方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.10708", "date": "2026-08-11T00:00:00.000Z", "summary": "Self-Geometry 提出一种即插即用的测试时自适应流程，直接利用 2D 像素对应作为伪真值，对视觉基础模型施加显式多视图几何约束。该方法通过几何解耦优化、基于 SO（3） 测地距离的视角采样及 LoRA 轻量自适应，在 VGGT、π3、DA3 等六种 VFM 及 7Scenes、ETH3D、ScanNet++、HiRoom 四个基准上，一致提升了位姿与几何估计精度。", "type": "paper", "relTime": "1周前"}, {"id": 92, "title": "AdvFD：用对抗式弗雷歇距离损失提升视觉生成模型后训练", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.11205", "date": "2026-08-11T00:00:00.000Z", "summary": "AdvFD 提出对抗式弗雷歇距离损失，以解决现有弗雷歇损失因静态预训练特征空间导致的\"弗雷歇黑客\"问题--目标指标提升但视觉质量下降。该方法引入可学习的对抗表征，并配合真实特征白化稳定最小-最大优化。实验表明，AdvFD 在 JiT 和 pMF 骨干网络及不同模型规模上均能稳定提升一步生成模型的后训练效果。", "type": "paper", "relTime": "1周前"}, {"id": 93, "title": "DistilVDR：通过双学生蒸馏实现的紧凑端到端视觉文档检索器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.10636", "date": "2026-08-11T00:00:00.000Z", "summary": "DistilVDR 是一个 524M 参数的端到端视觉文档检索系统，从单个 8B 视觉语言教师模型中通过逐点余弦对齐损失进行双向蒸馏，无需相关性标签或负采样。", "type": "model", "relTime": "1周前"}, {"id": 94, "title": "Ex-Omni-2D：具备原生视觉呈现能力的多模态对话模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.10720", "date": "2026-08-11T00:00:00.000Z", "summary": "Ex-Omni-2D 是一种多模态对话框架，能生成包含文本、个性化语音和参考条件视频的协调响应。它通过预测结构化视觉思维计划（VTP）和共享声学-时间接口，避免了对大规模查询-文本-语音-视频监督数据的需求。四步推理下，四 GPU 流水线在 400×720/720×400 分辨率下实现端到端 RTF 1.293。", "type": "paper", "relTime": "1周前"}, {"id": 95, "title": "Latent-to-4D：从视频先验到 4D 世界的直接生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.10744", "date": "2026-08-11T00:00:00.000Z", "summary": "4D 生成通常依赖 RGB 视频重建或为特定视频生成器定制几何预测，两者分别受分布失配和生成器绑定限制。新方法 Latent-to-4D 直接对齐视频模型的去噪潜变量与预训练 4D 解码器的 token 网格，绕过 RGB 中间步骤，仅用约 1K 重建片段训练，单一 checkpoint 即可在同类 VAE 家族的不同视频扩散 Transformer 间迁移。", "type": "paper", "relTime": "1周前"}, {"id": 96, "title": "MobileMem：面向移动端长期记忆的基准与框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.13606", "date": "2026-08-11T00:00:00.000Z", "summary": "MobileMem 提出一个面向设备端长期记忆的基准与框架，基于一年期的移动体验数据构建。它采用知识合成流程生成连贯且时间一致的长期轨迹，覆盖多跳与时间推理、知识更新和隐式偏好推断，并提供文本与多模态两种设置，旨在让智能体记住过去、理解当下并适应未来。", "type": "paper", "relTime": "1周前"}, {"id": 97, "title": "ReRound：用重建式舍入解决免校准 LLM 量化中的中点歧义", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.11045", "date": "2026-08-11T00:00:00.000Z", "summary": "ReRound 是一种后训练量化方法，通过训练条件扩散模型生成低比特权重的连续重建，以消除标准 RTN 舍入在量化区间中点附近的歧义。在 3-bit 和 4-bit 权重量化上，该方法在多种小型 LLM 中持续优于标准 RTN，并超越大量免校准方法，且完全离线运行，推理时无额外开销。", "type": "paper", "relTime": "1周前"}, {"id": 98, "title": "iOS 27 代码显示苹果正开发 Apple Reference Image 认证功能，用于检测 iPhone 拍摄照片真实性", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/988/068.htm", "date": "2026-08-10T22:33:41.000Z", "summary": "外媒 9to5Mac 在 iOS 27 开发者预览版 Beta 5 代码中发现，苹果正开发 Apple Reference Image 功能，用于认证 iPhone 拍摄照片的来源真实性。", "type": "product", "relTime": "1周前"}, {"id": 99, "title": "Uncensored AI 实测：敢答敏感问题", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2086939126897766677", "date": "2026-08-10T22:13:55.000Z", "summary": "Rohan Paul 实测 Uncensored【.】AI，称其能回答多数传统聊天机器人回避的政治、宗教、战争等敏感问题。该平台基于检索增强生成（RAG）与知识图谱构建，提供无审查信息。作者强调其输出\"不加修饰\"，即使内容令人不适。", "type": "tip", "relTime": "1周前"}, {"id": 100, "title": "Dyna-2 用百万小时人类视频预训练机器人", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2086895043223470099", "date": "2026-08-10T19:18:45.000Z", "summary": "Dyna Robotics 推出 Dyna-2，一个用 100 万小时人类视频预训练的世界动作模型，证明机器人预测能力随人类视频数据量单调提升。该模型在未见过的客户现场实现 87% 生产通过率，远超 Dyna-1 的 46%。团队首次发现人类数据规模定律，并验证其可迁移至未见机器人数据。", "type": "model", "relTime": "1周前"}, {"id": 101, "title": "Dyna-2 世界动作模型发现新缩放定律", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2086881901000720618", "date": "2026-08-10T18:26:32.000Z", "summary": "DynaRobotics 推出 Dyna-2，一个基于 100 万小时人类视频预训练的世界动作模型，可同时预测未来视频与动作。首次发现人类数据在 1000 至 100 万小时四个数量级上的缩放定律，并外推至未见过的机器人数据，表明世界建模与视频数据缩放对跨本体迁移至关重要。", "type": "model", "relTime": "1周前"}, {"id": 102, "title": "MiniMax 将携 H3 模型亮相 AiOS 旧金山活动", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2086879111574917290", "date": "2026-08-10T18:15:27.000Z", "summary": "MiniMax 宣布参加 AiOS San Francisco 活动，届时将现场演示其视频生成模型 MiniMax H3 在 Mac 上的本地运行。活动还包含 Wendy Labs 展示 Swift 驱动的 AI 应用部署至机器人与嵌入式设备，以及由前 Apple 员工主持的开幕座谈，时间为明日旧金山当地下午 6 点。", "type": "industry", "relTime": "1周前"}, {"id": 103, "title": "Meta 发布开源权重模型 Muse Glimmer，一窥扎克伯格\"个人超级智能\"愿景", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/10/metas-new-glimmer-ai-model-offers-a-hint-at-zuckerbergs-personal-intelligence-vision", "date": "2026-08-10T16:20:13.000Z", "summary": "Meta 发布开源权重模型 Muse Glimmer，旨在本地消费级硬件上驱动 AI 智能体。该 30B 参数模型采用 Apache 2.0 许可，支持文本与图像，训练覆盖超 100 种语言，可在单张消费级 GPU 的 Mac 或 PC 上本地运行多步任务。此举呼应扎克伯格\"个人超级智能\"愿景，但更强大的 Muse Spark 仍保持闭源。", "type": "model", "relTime": "1周前"}, {"id": 104, "title": "字节免费开源 Seedance 2.5 与 Seedream 5.0 Pro 提示词文档", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2086813331998859743", "date": "2026-08-10T13:54:04.000Z", "summary": "字节跳动免费开源 Seedance 2.5 与 Seedream 5.0 Pro 的提示词文档，内含几十套完整案例，如盛唐 30 秒长镜头、废土科幻一镜到底，每个 Prompt 均含分镜、运镜、音效及负面词等细节。升级后视频可生成 30 秒，支持按时间戳指定画面，最多可参考 30 图+10 视频+10 音频；生图支持高密度信息图与多语言文字。", "type": "tip", "relTime": "1周前"}, {"id": 105, "title": "Claude Tag 或成全新 AI 产品形态", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2086805305556414489", "date": "2026-08-10T13:22:10.000Z", "summary": "玉伯认为 Claude Tag 可能是一种全新产品形态，具备两大特征：它像人一样可被使唤也能使唤人；同时它拥有整个公司的记忆，能瞬间变形为具体同事的数字分身，可蒸馏整个公司且保持鲜活。这标志着 AI 从同步本地 Coding Agent 向异步远程 AI Coworker 演进。", "type": "tip", "relTime": "1周前"}, {"id": 106, "title": "Seedance 2.5 生成太空游轮视频，效果惊艳", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2086801016817697025", "date": "2026-08-10T13:05:07.000Z", "summary": "Ethan Mollick 用同一提示词测试 Seedance 2.5，生成的太空游轮视频令人联想到乐观的未来太空书籍。他称赞该模型能出色处理窗户反射等细节，效果令人印象深刻。", "type": "tip", "relTime": "1周前"}, {"id": 107, "title": "Flux 3 生成土星太空游轮延时摄影", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2086762875176034674", "date": "2026-08-10T10:33:34.000Z", "summary": "fofr 用 Flux 3 生成一段业余风格的太空游轮延时摄影视频，画面为绕土星轨道视角，包含房间反射、灯光变化和人物快速移动。作者称 Flux 3 还能处理其他更有趣的土星角度，效果令人印象深刻。", "type": "tip", "relTime": "1周前"}, {"id": 108, "title": "阿里Qwen-MM-Plugins让大模型拥有多模态能力", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2086742482855858458", "date": "2026-08-10T09:12:32.000Z", "summary": "我靠阿里的这个插件有点东西，  Qwen-MM-Plugins相当于给任何大模型外挂一套多模态能力，相当于有了眼睛能看图看视频，手能剪视频处理3D文件， 可做给DeepSeek配上，一个负责超级大脑，一个负责干活", "type": "model", "relTime": "1周前"}, {"id": 109, "title": "Qwen 发布多模态工具层，赋能 AI 智能体", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2086726434647876006", "date": "2026-08-10T08:08:46.000Z", "summary": "Qwen 发布多模态工具层 Qwen-MM-Plugins，将多模态操作打包为工具，供 Claude Code、Codex、Gemini CLI 等智能体框架调用。核心插件提供 read_image、OCR、视频转录、目标定位等能力，推动从多模态模型向多模态智能体演进。", "type": "model", "relTime": "1周前"}, {"id": 110, "title": "小马智行全球自动驾驶里程突破 1 亿公里", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/987/881.htm", "date": "2026-08-10T07:30:29.000Z", "summary": "小马智行今日宣布，其全球自动驾驶里程突破 1 亿公里。据该公司 2026 年第一季度财报，总营收 2.36 亿元，同比增长 145.0%；Robotaxi 业务收入 5912 万元，同比增长 395.4%，乘客车费收入同比增长 456.5%。今年 6 月，小马智行第七代 Robotaxi 已在重庆国际车展首次亮相。", "type": "industry", "relTime": "1周前"}, {"id": 111, "title": "PixVerse 上线 Seedance 2.5 视频生成", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2086715562022072513", "date": "2026-08-10T07:25:33.000Z", "summary": "Seedance 2.5 现已登陆 PixVerse。  制作 60 秒返校季电视广告--学生旅程、校园瞬间、品牌营销--角色一致、电影级画面、叙事驱动。  角逐最高 300 美元 + 30，000 积分奖励。Seedance 2.0 限时优惠价现已生效。🎬", "type": "paper", "relTime": "1周前"}, {"id": 112, "title": "字节跳动 Seed 团队发布 SeedRealtime：原生音视频全双工大模型，一个模型同时看、听、说", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/09/bytedance-seed-introduces-seedrealtime-a-native-audio-visual-full-duplex-llm-that-watches-listens-and-speaks-in-one-model", "date": "2026-08-10T05:48:17.000Z", "summary": "字节跳动 Seed 团队推出 SeedRealtime，一款原生音视频全双工大模型，将音频、视频和文本统一在一个端到端架构中，并行处理感知、理解、决策与表达，并将轮次切换内化到模型内部，取代外部语音活动检测器。该模型已在豆包 App 中上线，但未发布技术报告、参数规模、开源权重或 API。字节内部人工评估显示，其节奏问题相比级联架构减半，但未提供基准分数或延迟数据。", "type": "model", "relTime": "1周前"}, {"id": 113, "title": "MiniMax H3 开源视频模型上线 ComfyUI", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2086685565722984842", "date": "2026-08-10T05:26:22.000Z", "summary": "MiniMax H3 开源多模态视频生成模型在 ComfyUI 直播中亮相，支持文本、图像、视频和音频输入，可生成最长 15 秒 768p 视频片段，并原生同步生成含对话、音效和音乐的立体声音频。托管版 H3 支持最高 2K 分辨率生成，模型已优化至可在消费级 GPU 上本地部署，并提供 Context-IR 与 Regenerate-2K API 工作流。", "type": "model", "relTime": "1周前"}, {"id": 114, "title": "玉伯邀你体验 YouMind 精美 PPT", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2086681617117163600", "date": "2026-08-10T05:10:40.000Z", "summary": "玉伯（Frank Wang）邀请用户来 YouMind 制作精美 PPT，让学习更容易坚持且有效。他引用 @vista8 的观点指出，AI 生成 PPT 有 HTML 生成与图片生成两大路线：前者方便修改、速度快、成本低，后者更精美但成本高且不易修改。@vista8 还称赞 YouMind 的图生 PPT 功能很棒。", "type": "tip", "relTime": "1周前"}, {"id": 115, "title": "阿里云万相3.0将文档转化为电影级视频", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2086681533608308885", "date": "2026-08-10T05:10:20.000Z", "summary": "如果一部目的地影片可以从文档而非分镜脚本开始呢？  借助万相3.0（Wan3.0），城市网站、博物馆档案、旅游指南及其他结构化内容都可以转化为电影级视频。  将信息变成沉浸式视觉故事。  观看演示并立即开始创作 ↓  🔗 阿里云百炼（Alibaba Cloud Model Studio）：https://click.alibabacloud.com/m/20000002017/  🔗 通义千...", "type": "model", "relTime": "1周前"}, {"id": 116, "title": "MiniMax H3开源社区火热，生态持续扩展", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2086678799329136969", "date": "2026-08-10T04:59:29.000Z", "summary": "MiniMax H3 开源社区真是🔥🔥🔥！  期待 MiniMax H3 基准测试、MiniMax H3 机器人数据集，以及看到世界各地涌现出如此多的 H3。  【引用 @ostrisai】：我生成了 1K 个 MiniMax H3 视频，涵盖广泛的主题和风格，以测试模型的能力。你可以在这里观看完整的 1.5 小时视频，或在这里获取完整数据集。", "type": "industry", "relTime": "1周前"}, {"id": 117, "title": "Qwen-MM-Plugins 让智能体原生支持多模态", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2086664887560970531", "date": "2026-08-10T04:04:12.000Z", "summary": "👀 看见只是开始。  借助 Qwen-MM-Plugins，让你的智能体原生支持多模态--读取图片、视频和文档，编辑视频，处理 3D/CAD，以及更多。  从多模态模型 → 多模态智能体。🚀  观看实际效果：https://github.com/QwenLM/Qwen-MM-Plugins", "type": "model", "relTime": "1周前"}, {"id": 118, "title": "RynnValue：用时间距离扩展机器人价值基础模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.09853", "date": "2026-08-10T00:00:00.000Z", "summary": "RynnValue 是一款开源的机器人操作价值基础模型，用时间距离替代偏好或进度等任务内锚点作为监督信号，可直接从时间戳生成标签，扩展至超 7，000 小时、约 300 万条指令条件片段。", "type": "paper", "relTime": "1周前"}, {"id": 119, "title": "Sci-VBench：科学领域知识密集型视频生成的评测基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.09873", "date": "2026-08-10T00:00:00.000Z", "summary": "Sci-VBench 基准包含 1，253 个专家标注示例，覆盖自然科学、医疗健康、人文社科与工程四大领域的 60 个主题，要求模型生成具备科学推理能力的时序视频。评测显示，16 个前沿模型在感知质量上接近，但在提示词接地性与科学因果正确性上差异显著，专有与开源模型间存在明显差距。", "type": "paper", "relTime": "1周前"}, {"id": 120, "title": "Grok Image 2.0 发布：细节指令与编辑功能升级", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2086473289065549829", "date": "2026-08-09T15:22:51.000Z", "summary": "xAI 推出 Grok Image 2.0 模型，指令遵循更精细，文本渲染更锐利，并强化了复杂布局处理与生成一致性。新增 Magic Wand 局部编辑、区域分割、背景移除（支持透明导出）、最多 5 图多参考编辑及 Smart Resize 任意宽高比扩展，还提供 15 个照片编辑与产品图等场景模板。", "type": "model", "relTime": "1周前"}, {"id": 121, "title": "Seedance 2.0 打造网球装备广告视频", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2086467607029489754", "date": "2026-08-09T15:00:16.000Z", "summary": "运动装备的 AI 视频广告不需要打破物理规律的视觉特效。它们需要一个统一的视觉系统和六个连贯镜头，真正把产品卖出去。这支用 Seedance 2.0 制作的网球广告 ↓", "type": "tip", "relTime": "1周前"}, {"id": 122, "title": "甲骨文 OpenJDK 项目新规：不允许提交 AI 生成代码", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/987/615.htm", "date": "2026-08-09T13:22:38.000Z", "summary": "甲骨文已通知 OpenJDK 开发者，项目组不能再提交 AI 生成的代码。新规明确，社区贡献内容不得包含由大语言模型、扩散模型或深度学习系统生成的内容，涵盖代码、文本、PR、电子邮件沟通、维基和 Bug 报告。此举主要出于知识产权风险、网络安全风险及代码审查工作量方面的担忧，开发者仍可私下用 AI 工具审查、调试代码。", "type": "industry", "relTime": "1周前"}, {"id": 123, "title": "SpaceXAI 为 Grok Image 2.0 发布新宣传视频", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2086432263810511244", "date": "2026-08-09T12:39:50.000Z", "summary": "SpaceXAI 已在 App Store 上新增了一段宣传 Grok Image 2.0 的视频。  更新你的 Grok 应用，立即体验吧！", "type": "product", "relTime": "1周前"}, {"id": 124, "title": "Google DeepMind 推出 WeatherNext Cyclones，同时预测气旋路径与强度", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/google-deepminds-weathernext-predicts-cyclone-tracks-and-intensity-at-the-same-time", "date": "2026-08-09T12:29:06.000Z", "summary": "Google DeepMind 推出 WeatherNext Cyclones（WN-C），可同时预测热带气旋路径与强度，五天路径误差平均 230 公里，优于 ECMWF ENS 的 370 公里。该模型基于 Functional Generative Networks，单次前向传播即可生成预测，速度比扩散模型快 8 倍，代码与权重已在 GitHub 开源。", "type": "tip", "relTime": "1周前"}, {"id": 125, "title": "AI检测器正制造新的不信任时代", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/column/976690/ai-writing-detectors-suspicion", "date": "2026-08-09T12:00:00.000Z", "summary": "美国43%的六至十二年级教师在2024至2025年间定期使用AI检测器，但GPTZero、Turnitin等工具依赖自身AI模型猜测文本是否由AI生成，误报率存疑。斯坦福2023年研究发现非英语母语者文章更易被误判，出版商Minotaur因此取消200万美元出书合约。", "type": "tip", "relTime": "1周前"}, {"id": 126, "title": "上半年全国人形机器人领域新设企业 11.6 万户，同比增长 9.5%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/987/596.htm", "date": "2026-08-09T10:41:35.000Z", "summary": "市场监管总局数据显示，上半年全国新设\"8大新兴产业+9大未来产业\"相关企业56.1万户。其中人形机器人领域新设企业11.6万户，同比增长9.5%；生成式人工智能领域新设5.5万户，同比增长28.0%。同期高端装备制造业新设2.8万户，高技术制造业企业总量达33.0万户。", "type": "industry", "relTime": "1周前"}, {"id": 127, "title": "哈佛新研究：生成模型或存第三扩展轴", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2086370187784470962", "date": "2026-08-09T08:33:10.000Z", "summary": "哈佛新论文提出生成模型可能缺失第三扩展轴：训练中的探索量。在强表征自编码器（RAE）图像生成方案中加入探索后，模型以6.2×更少的训练样本和4.1×更少的FLOPs达到基线最终性能。该方法将best-of-K训练视为扩展模型可学习模态数量的途径，而无需增加推理步骤。", "type": "paper", "relTime": "1周前"}, {"id": 128, "title": "Seedance 2.5 上线一周新增六种创意玩法", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247509275&idx=1&sn=48cc15b0f9b22173ce93350da61f15dc", "date": "2026-08-09T05:25:02.000Z", "summary": "Seedance 2.5 上线一周后，国内外社区涌现出时间静止、超级英雄变身、创意广告、K-pop MV、电商广告、拉片复刻等六类热门玩法。经实测，该版本人物面部告别\"AI 油腻感\"，动作自然度与镜头切换较 2.0 更合理，单次生成超长视频时长拉至 300 秒，并支持片段重拍与智能续写。通过 LibTV 年费会员，生成成本最低可至 0.4 元/秒。", "type": "tip", "relTime": "1周前"}, {"id": 129, "title": "2026 国际基础科学大会在京开幕，500 余场学术会议覆盖大模型、人机交互等", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/987/537.htm", "date": "2026-08-09T05:06:32.000Z", "summary": "2026 国际基础科学大会今日在北京开幕，主题为\"聚焦基础科学，引领人类未来\"，千余名中外科学家参会。为期两周的会议将举办 500 余场学术会议，覆盖生成式大模型推理、计算机视觉、人机交互、量子信息等前沿热点。8 月 10 日至 12 日，9 位基础科学奖章得主将带来 9 场基础科学报告。", "type": "industry", "relTime": "1周前"}, {"id": 130, "title": "Grok Imagine 可制作梗图", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2086305001110954244", "date": "2026-08-09T04:14:08.000Z", "summary": "马斯克称 Grok Imagine 可用于制作梗图。其 Imagine Image 2.0 支持魔棒局部编辑、背景移除导出透明图、一次生成最多 5 张图的多参考功能，文字渲染清晰，可完成完整梗图制作流程。", "type": "paper", "relTime": "1周前"}, {"id": 131, "title": "OpenRouter 上线 Dreamina Seedance 2.5", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2086260287683092792", "date": "2026-08-09T01:16:28.000Z", "summary": "来自 @BytePlusGlobal 的 Dreamina Seedance 2.5 现已在 OpenRouter 上线。  这是一款音视频联合模型，适用于长篇叙事、多模态参考和精准编辑。单次生成最长 30 秒，可多轮扩展，支持最多 50 个参考。", "type": "model", "relTime": "1周前"}, {"id": 132, "title": "马斯克发布 Terafab 渲染视频：Optimus 人形机器人、Robovan 无人车齐亮相", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/987/485.htm", "date": "2026-08-09T01:12:49.000Z", "summary": "马斯克在 X 平台发布 Terafab 渲染视频，展示 Optimus 人形机器人与 Robovan 无人车在规划中的得州厂区内工作场景。Robovan 仍无确定量产时间表，而 Optimus 已改造弗里蒙特旧产线，并计划 2027 年夏季在得州超级工厂实现大规模量产，最终年产能达 1，000 万台。", "type": "industry", "relTime": "1周前"}, {"id": 133, "title": "MiniMax H3 开源路线图：坚持开源至 AGI", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2086253065657790895", "date": "2026-08-09T00:47:46.000Z", "summary": "MiniMax 在 Reddit AMA 中公布 H3 系列开源路线图，并承诺\"在 AGI 到来前保持开源\"。计划开源 H3-Regenerate-2K 潜在空间 DiT 再生模型、统一文生图与图像编辑模型，并考虑转向 Apache-2.0 许可证。H3 采用 MoBA 风格稀疏注意力，支持 4-NFE/8-NFE 低步长变体，Ref2VA 可续接生成 60 秒长视频。", "type": "model", "relTime": "1周前"}, {"id": 134, "title": "BestBlogs 早报：智能体代码质量与 H3 视频架构", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2086247096475390431", "date": "2026-08-09T00:24:03.000Z", "summary": "BestBlogs 早报精选 10 篇 AI 文章，涵盖智能体代码质量、H3 视频架构、AI 原生软件原语等主题。H3 开放部分约 600 亿参数，BF16 权重约需 120 GB 内存；Claude Code 在 Pro、Max 和 Team 方案中默认启用自动模式以减少提示词注入。", "type": "tip", "relTime": "1周前"}, {"id": 135, "title": "360CityArena：面向具身智能体的真实感城市导航基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.08814", "date": "2026-08-09T00:00:00.000Z", "summary": "360CityArena 是一个评估具身智能体城市探索能力的基准，基于日本东京秋叶原街区的 602 段 360 度视频片段（覆盖 85 条街道）构建，包含 175 个人工设计的任务，涵盖环境理解、路径推理和空间推理三类。评测显示，最强模型 Gemini 2.5 Flash 的准确率为 17.1%，远低于人类的 77.3%，表明城市级具身导航与推理仍面临重大挑战。", "type": "paper", "relTime": "1周前"}, {"id": 136, "title": "VectraYX-Vision-1B：面向西班牙语/拉美网络安全UI的亚2B视觉语言模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.08477", "date": "2026-08-09T00:00:00.000Z", "summary": "VectraYX-Vision-1B发布，是首个面向西班牙语/拉美网络安全UI（IDA、Ghidra、Wireshark等）的亚2B视觉语言模型，支持结构化推理与MCP工具调用。初步视觉定位结果呈负向：视觉SFT后B6分数接近零（工具识别0.08），模型忽略图像内容。研究公开3变体消融矩阵及14，596个QA对，代码、配置和权重均已开源。", "type": "paper", "relTime": "1周前"}, {"id": 137, "title": "U-OPSD：无需任何外部监督的在线策略自蒸馏方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.06296", "date": "2026-08-09T00:00:00.000Z", "summary": "U-OPSD 仅利用模型自身生成与内部一致性实现在线策略自蒸馏，无需真值标签、环境反馈或更大模型指导。", "type": "paper", "relTime": "1周前"}, {"id": 138, "title": "Grok 图像模型编辑功能获好评", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2086126679248740517", "date": "2026-08-08T16:25:33.000Z", "summary": "试试吧！  【引用 @venturetwins】：我对新的 Grok 图像模型和编辑功能印象深刻！  我从 Gap 网站截了几件商品图，快速生成了一组照片。  工作流工具很酷--物品/人物可分段编辑，可以调整宽高比，还能融入新的参考内容。", "type": "model", "relTime": "1周前"}, {"id": 139, "title": "Grok Imagine 图像编辑能力大幅提升", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2086115414459719806", "date": "2026-08-08T15:40:47.000Z", "summary": "马斯克称 Grok Imagine 图像编辑能力大幅提升。用户反馈其分段与精准编辑工具可只修改目标区域而保留其余部分，无需重新生成整图，编辑更快更实用，正成为强大的图像编辑器。", "type": "paper", "relTime": "1周前"}, {"id": 140, "title": "Viggle 将 AI 舞蹈加入 Talking Viggy", "source": "X：Viggle AI (@ViggleAI)", "sourceUrl": "https://x.com/ViggleAI/status/2086096672891785458", "date": "2026-08-08T14:26:19.000Z", "summary": "AI 先行一步 ✌️", "type": "paper", "relTime": "1周前"}, {"id": 141, "title": "PixVerse 视频重绘：保留动作换世界", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2086052341208519104", "date": "2026-08-08T11:30:09.000Z", "summary": "关键不在于重新生成动作。  保留精确的表演、节奏和镜头。改变周围的世界--从剑术排练到真人奇幻特效镜头。", "type": "paper", "relTime": "1周前"}, {"id": 142, "title": "Backflip AI 发 版、iOS 和 Android 上以 Quali...", "type": "model", "relTime": "1周前"}, {"id": 152, "title": "Ego-OSCAR：开源低成本头戴式立体惯性采集系统", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.08285", "date": "2026-08-08T00:00:00.000Z", "summary": "Ego-OSCAR 是一款开源硬件、低成本的头戴式立体惯性采集设备，单台物料成本低于 200 美元，仅使用商用组件和 3D 打印部件。设备搭配硬件同步全局快门立体相机、6 轴 IMU 和嵌入式 Linux SBC，并开源完整软件栈及约 550 小时带同步 IMU 的日常室内环境第一视角立体视频。数据集提供开放词汇动作标注和逐帧 3D 手部重建，旨在降低大规模众包第一视角数据采集门槛。", "type": "paper", "relTime": "1周前"}, {"id": 153, "title": "视觉-语言定位作为双向概念对应：ConCor-1 模型提出统一框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.07886", "date": "2026-08-08T00:00:00.000Z", "summary": "研究将视觉-语言定位重新定义为图像-文本对的双向概念对应，无需预先指定文本短语，即可恢复所有视觉指称文本片段与实例级图像分割的对应关系。该框架统一了短语定位、指称表达定位和开放词汇检测等任务。作者提出 ConCor-1 模型，使用可学习桥接 token 预测文本掩码、图像掩码和对应存在分数，在长标题数据集上对应 F1 提升 48%，在零样本 LVIS 上提升 29%。", "type": "paper", "relTime": "1周前"}, {"id": 154, "title": "用 NVIDIA NeMo Retriever 构建多模态 RAG 流水线：托管 NIM、LanceDB、重排序与 grounded 生成", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/07/building-a-multimodal-rag-pipeline-with-nvidia-nemo-retriever-hosted-nims-lancedb-reranking-and-grounded-generation", "date": "2026-08-07T21:13:38.000Z", "summary": "本教程演示如何用 NVIDIA NeMo Retriever 构建多模态 RAG 流水线：先以 PDFium 离线提取 PDF 文本，再通过托管 NIM 端点检测页面元素、抽取表格/图表/信息图并生成稠密向量存入 LanceDB。随后实现稠密检索、视觉-语言重排序、元数据过滤搜索及带内联引用的 grounded 生成，并用 recall-at-k 评估检索质量。", "type": "tip", "relTime": "1周前"}, {"id": 155, "title": "Fenix Flexin 不再否认用 AI 制作《Rubberz》", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/976801/fenix-flexin-rubberz-ai-song-treblo", "date": "2026-08-07T20:01:51.000Z", "summary": "洛杉矶说唱歌手 Fenix Flexin 回应 AI 制作争议，称\"从未说过没用 AI\"，并强调 AI 与录音过程无关。此前制作人 Medasin 指认 AI 工具 Treblo（原 Sonauto）参与制作，该公司发布的 AI 检测器也将其标记为 Treblo AI 生成。Fenix 上月接受 Hot 97 采访时曾明确表示歌曲\"没有 AI\"。", "type": "industry", "relTime": "1周前"}, {"id": 156, "title": "Roku 上线 Fairground AI 频道：无尽 A }, {"id": 171, "title": "Appshot 用截图生成可运行应用", "source": "X：Jason Liu (@jxnlco)", "sourceUrl": "https://x.com/jxnlco/status/2085565380727279919", "date": "2026-08-07T03:15:09.000Z", "summary": "Appshot  只需一张截图，就能生成一个可运行的应用。", "type": "product", "relTime": "1周前"}];
var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };
var TYPE_LABELS = { "paper":"论文", "model":"模型", "product":"产品", "tip":"技巧", "industry":"行业" };
function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";
  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();

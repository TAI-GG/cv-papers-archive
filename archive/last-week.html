准视觉问答任务上保持强劲性能。", "type": "paper", "relTime": "1周前"}, {"id": 6, "title": "InfinityEdit：用轻量编辑适配器实现无限视频编辑", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.20910", "date": "2026-08-21T00:00:00.000Z", "summary": "InfinityEdit 提出一种轻量编辑适配器，为流式视频生成器赋予无界编辑能力，解决现有方法仅适用于固定时长片段、无法处理直播或持续镜头等开放流场景的问题。该适配器包含历史交叉注意力、时序因果自注意力和编辑交叉注意力三个模块，仅在编辑请求到达的块中激活，后续块由原始模型生成。实验表明，InfinityEdit 能在每次编辑下忠实延续视频流，并在无界编辑序列中保持生成稳定。", "type": "paper", "relTime": "1周前"}, {"id": 7, "title": "EXPL-FR：通过视觉-语言对齐解释人脸识别模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.21486", "date": "2026-08-21T00:00:00.000Z", "summary": "EXPL-FR 在人脸识别（FR）模型自身的嵌入空间内解释其相似度评分所依赖的语义属性，无需访问模型架构。该方法通过轻量适配器对齐视觉-语言模型（VLM）与冻结的 FR 空间，仅用面部图像训练，将 22 个类别中的 978 个属性提示词转化为 FR 空间锚点。在无标签条件下，其提示驱动审计依据实测的种族 RFW 误差对四个 FR 模型进行排序，并按真实验证成本对受控属性变化排序。", "type": "paper", "relTime": "1周前"}, {"id": 8, "title": "TLive-Omni：面向电商直播的全模态理解模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.20958", "date": "2026-08-21T00:00:00.000Z", "summary": "TLive-Omni 将图像、视频、音频和文本输入映射到统一表示空间，专为电商直播场景设计。其引入 Per-vGrid 时间戳 token 组织以对齐视频与音频，并通过三阶段监督训练和 Faithful-RFT 强化微调提升回答忠实度与表达质量，同时满足实时性要求。实验表明，该模型在电商直播基准任务上表现强劲，并在通用基准上展现出良好泛化能力。", "type": "paper", "relTime": "1周前"}, {"id": 9, "title": "机器人腰部关节成运动极限", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090570107588329543", "date": "2026-08-20T22:42:09.000Z", "summary": "那条爆火视频的另一个角度。  残余动能击中了关节的薄弱轴。  腰部连杆成了极限。", "type": "tip", "relTime": "1周前"}, {"id": 10, "title": "OpenRouter 上线 Ox Alpha 隐身模型", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2090544970923184269", "date": "2026-08-20T21:02:16.000Z", "summary": "🥷 新隐身模型：Ox Alpha  Ox Alpha 是一款前沿模型，专为高效编码、持续智能体工作及实际生产环境使用而构建。  - 1M token 上下文窗口 - 支持文本、图像和视频输入  立即试用并分享反馈以改进模型！https://openrouter.ai/stealth/ox-alpha", "type": "model", "relTime": "1周前"}, {"id": 11, "title": "Meta Muse Spark 1.2 登顶视频转网站评测", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090544401097589109", "date": "2026-08-20T21:00:00.000Z", "summary": "Meta 的 Muse Spark 1.2 在 Design Arena 视频转网站基准测试中位列第一，Elo 评分 1279，并在图像转代码任务中均进入前三。该模型在图像转 HTML 和图像转前端任务中分别以 1252 和 1272 的 Elo 评分位居第二和第三。其定价为每百万输入 token 1.25 美元、每百万输出 token 4.25 美元，在三个类别中均处于价格偏好帕累托前沿。", "type": "tip", "relTime": "1周前"}, {"id": 12, "title": "GPT-Image-2 API 新增透明背景预览", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2090536933571330440", "date": "2026-08-20T20:30:19.000Z", "summary": "GPT-Image-2 现已在 API 中提供透明背景预览。  生成可复用的素材，可置于任意背景之上--适用于产品图、平面设计、网站原型和营销活动。", "type": "product", "relTime": "1周前"}, {"id": 13, "title": "智能体框架持续学习新论文：防遗忘机制", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2090533587066249514", "date": "2026-08-20T20:17:02.000Z", "summary": "一篇关于智能体框架持续学习的新论文指出，现代智能体在提示词、记忆、工具等框架组件中积累经验，更新任一组件可能导致模型未变但行为失效，即\"框架级遗忘\"。论文提出\"受保护的框架演化\"机制，由持续优化器生成候选框架、持续评估器在确认改进、历史保留和有效性后才提交，在文本推理、多模态感知和开放世界交互中相对提升超10%。", "type": "paper", "relTime": "1周前"}, {"id": 14, "title": "Adobe Firefly 新增 AI 音频工具并接入 Google Gemini Omni Flash", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/adobe-firefly-adds-ai-audio-tools-and-googles-gemini-omni-flash", "date": "2026-08-20T19:29:34.000Z", "summary": "Adobe 在 Firefly 平台正式推出三款 AI 音频工具：Generate Music 生成免版税音乐、Generate Speech 将脚本转为配音、Generate Sound Effects 制作场景音效，均宣称可用于商业用途。Firefly AI Assistant 现提供每日免费生成次数，并新增 Gemini Omni Flash 模型，支持视频、音频、图像及文本输入。", "type": "model", "relTime": "1周前"}, {"id": 15, "title": "Meta Muse Spark 1.2 登顶视频转网站评测", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2090505793993060428", "date": "2026-08-20T18:26:35.000Z", "summary": "酷！  【引用 @DesignArena】：突发：Meta 的 Muse Spark 1.2 以 1279 的 Elo 评分在视频转网站类别中位列第一，并在我们所有多模态代码类别中取得亮眼成绩。  Muse Spark 1.2 还在图片转 HTML 类别中以 1252 的 Elo 评分位列第二，在图片转前端类别中以 1272 的 Elo 评分位列第三。  以 $1.25/1M 输入 toke...", "type": "tip", "relTime": "1周前"}, {"id": 16, "title": "DiffusionGemma 技术报告：Google DeepMind 开源离散扩散模型，单卡 H100 每秒生成约 1500 token", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://arxiv.org/abs/2608.00146", "date": "2026-08-20T18:14:18.037Z", "summary": "Google DeepMind 推出 DiffusionGemma，一个基于 Gemma 4 26B A4B MoE 模型微调而来的实验性开放权重文本扩散模型。", "type": "model", "relTime": "1周前"}, {"id": 17, "title": "Grok @Bot 可生成复杂概念讲解视频", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2090492504223170671", "date": "2026-08-20T17:33:47.000Z", "summary": "Grok @Bot 可以制作视频，解释复杂概念。", "type": "paper", "relTime": "1周前"}, {"id": 18, "title": "SenseNova U1.5 Lite 开源：8B 原生统一多模态模型", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090486590510674284", "date": "2026-08-20T17:10:17.000Z", "summary": "SenseNova 发布 U1.5 Lite，一个 8B 参数的开源轻量级原生统一多模态模型，可同时完成视觉理解、生成与编辑。该模型通过 OPD 将任务专家能力蒸馏进单一模型，推理时无需路由或切换专家，并支持原生 4K 生成、复杂指令遵循及本地编辑。其在指令遵循和编辑保持上超越同尺寸模型，文本渲染与复杂布局上可媲美大型商业模型。", "type": "model", "relTime": "1周前"}, {"id": 19, "title": "Meta 发布 Muse Spark 1.2 多模态评测与演示", "source": "X：AI at Meta (@AIatMeta)", "sourceUrl": "https://x.com/AIatMeta/status/2090485743034716420", "date": "2026-08-20T17:06:55.000Z", "summary": "Meta 发布 Muse Spark 1.2 新评测与演示，展示其多模态能力广度，涵盖视觉转代码、感知转物理动作及音视频理解。演示中，模型解析多模态观察并调用工具，引导机器人在非结构化环境中导航寻找橡皮鸭。", "type": "model", "relTime": "1周前"}, {"id": 20, "title": "Muse Spark 1.2 多模态模型能力解析", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2090485261629354352", "date": "2026-08-20T17:05:00.000Z", "summary": "1/ Muse Spark 1.2 是一个非常强大的多模态模型--它能够进行视觉编码、机器人规划以及音视频理解，这些能力通过智能体工具整合在一起。", "type": "model", "relTime": "1周前"}, {"id": 21, "title": "商汤开源 SenseNova U1.5 Lite 轻量多模态模型", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2090483079412580442", "date": "2026-08-20T16:56:20.000Z", "summary": "商汤发布开源轻量级原生统一多模态模型 SenseNova U1.5 Lite，仅 8B 参数，支持视觉理解、生成与编辑。该模型主打原生 4K 生成、复杂指令跟随、中英文文本渲染及多图参考编辑，在指令跟随和编辑保持上超越同尺寸模型，文本渲染与复杂布局上比肩大型商业模型。", "type": "model", "relTime": "1周前"}, {"id": 22, "title": "Humyn Labs 发布物理 AI 第一视角视频库", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2090478960211546299", "date": "2026-08-20T16:39:57.000Z", "summary": "Humyn Labs 推出面向物理 AI 的\"自我中心\"视频库，包含 5 个以上第一人称数据集，按环境和采集类型分类。数据提供 6-DoF 头部姿态、21 点手部关键点、绝对度量深度及逐帧动作标签，以 MCAP、RLDS 和 LeRobot v3 格式交付。该公司旨在将人类经验转化为机器人技能，弥补机器人数据缺乏互联网级捷径的短板。", "type": "paper", "relTime": "1周前"}, {"id": 23, "title": "世界机器人大会BoBo机器狗实测", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2090464122341134790", "date": "2026-08-20T15:41:00.000Z", "summary": "在世界机器人大会上：Cruella 来到了北京--带着她的斑点狗。认识一下 BoBo，Vbot 售价 1，930 美元的家庭机器狗。它能通过视觉跟随，对牵引绳的拉动做出响应，还能携带零食。我们的测试发现它有 5 小时续航、扎实的越野表现、安静的鞋底和实时视频通话功能。", "type": "paper", "relTime": "1周前"}, {"id": 24, "title": "Humyn Labs 将人类经验转化为机器人训练数据", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090462918181789822", "date": "2026-08-20T15:36:13.000Z", "summary": "Humyn Labs 正将人类经验转化为机器人无法从网络获取的同步训练数据，其样本配对 IMU、立体深度、6-DoF 头部姿态、21 点手部关键点、手腕追踪、物体追踪及密集动作标签等多模态信号。与从整个互联网学习的 LLM 不同，机器人数据缺乏捷径，需真实世界经验，该公司正构建 Physical AI 学习的数据平台，涵盖四种感官模态。", "type": "industry", "relTime": "1周前"}, {"id": 25, "title": "Humyn Labs 为机器人打造物理 AI 数据平台", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2090449163062243365", "date": "2026-08-20T14:41:33.000Z", "summary": "Humyn Labs 正构建机器人训练数据平台，将人类在视觉、音频、动作和触觉四类感官模态下的真实经验转化为模型就绪数据，供 Physical AI 学习。与可从互联网学习的 LLM 不同，机器人缺乏数据捷径，需依赖真实世界经验，该平台或成扩展机器人技术的关键缺失层。", "type": "model", "relTime": "1周前"}, {"id": 26, "title": "荣耀机器人元气仔练成\"凌波微步\"，将参加第二届人形机器人运动会", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/362.htm", "date": "2026-08-20T13:40:00.000Z", "summary": "荣耀官方今日发布视频，展示自研人形机器人元气仔的跑步画面，其姿态灵动，摆臂步幅复刻人类姿态。荣耀自研机器人闪电和元气仔将正式参加第二届人形机器人运动会，该赛事设50个赛项，涵盖29项竞技赛和21项场景赛。此前闪电曾在2026北京亦庄半马中以50分26秒净时成绩夺冠。", "type": "industry", "relTime": "1周前"}, {"id": 27, "title": "AGIBOT A3 真人武术对战视频发布", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090431032504054098", "date": "2026-08-20T13:29:31.000Z", "summary": "AGIBOT 发布视频，展示其 A3 人形机器人与两位专业武术演员进行无 CGI、无预设编排的实时武侠对打。A3 依靠实时 AI 感知与决策完成闪避、格挡和反击，并呈现后空翻及 450 度空中旋转踢。其控制速度最高 5 m/s，OmniHand 3 Ultra-M 手部拥有 20 个主动自由度，相关技术亦用于新款 A3 Ultra。", "type": "paper", "relTime": "1周前"}, {"id": 28, "title": "技能库\"恶意演化\"：智能体安全隐患新研究", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090425196868260118", "date": "2026-08-20T13:06:19.000Z", "summary": "新研究揭示智能体\"技能误演化\"风险：恶意任务被存入技能库，即使原始指令消失仍可改变后续行为。21 种演化配置全部生成不安全技能，其中 15 种在后续干净会话中造成危害。论文提出 SKILLMISEVO-GYM/BENCH 检测该风险，并以 SAFEEVOLVE 通过检查、修复、追踪和淘汰机制降低危害。", "type": "paper", "relTime": "1周前"}, {"id": 29, "title": "FLUX Upscale 发布：视频可升级至原生 4K", "source": "Black Forest Labs：Blog（网页）", "sourceUrl": "https://bfl.ai/blog/flux-video-upscale", "date": "2026-08-20T12:58:23.125Z", "summary": "Black Forest Labs 推出 FLUX Upscale，可将任意视频重新生成至更高分辨率，最高支持原生 4K。该功能现已作为独立的 FLUX Tool 和 API 端点提供。", "type": "product", "relTime": "1周前"}, {"id": 30, "title": "可灵AI多角度生成，抢占视觉焦点", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2090408971744018837", "date": "2026-08-20T12:01:51.000Z", "summary": "掌控每一个角度。抢占聚光灯。✨", "type": "paper", "relTime": "1周前"}, {"id": 31, "title": "银河通用首款双足机器人 Galbot ET1\"星仔\"亮相，能跳街舞手撑地、倒立", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/247.htm", "date": "2026-08-20T09:56:17.000Z", "summary": "银河通用首款双足人形机器人 Galbot ET1\"星仔\"在 2026 WRC 世界机器人大会首次公开亮相。该机器人搭载银河星脑，不靠预设脚本，语音动作实时生成，即兴接梗，并宣称是全球首个具备自主学习能力的物理智能体。现场演示中，星仔展示了手撑地、倒立等高难度街舞动作，并能与真人舞者实时同步。", "type": "paper", "relTime": "1周前"}, {"id": 32, "title": "请不要粘贴AI生成的内容", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://dontpastetheai.com/", "date": "2026-08-20T09:26:10.003Z", "summary": "当有人向你提问时，应粘贴你自己的回答，而非聊天机器人生成的内容。文章强调，直接转发AI输出会削弱个人表达的真实性与责任，建议以自身理解为基础进行回应。", "type": "tip", "relTime": "1周前"}, {"id": 33, "title": "可灵正式登陆WorkBuddy连接器", "source": "公众号：可灵AI（快手·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzU5NTkwNDU2OA%3D%3D&mid=2247496752&idx=1&sn=fcd121e0f8c7db354b0aea11ae82d8f7", "date": "2026-08-20T08:36:08.000Z", "summary": "可灵AI正式登陆WorkBuddy连接器，用户可一键调用可灵实现批量出片。该集成支持一次生成多版本测试风格、视频批量生产与自动化成片，并能并行处理多任务，批量对口型、换语言。此外，可灵还能智能分析需求与热点，自动生成项目生产计划，并嵌入网页开发、3D软件等工作流。", "type": "paper", "relTime": "1周前"}, {"id": 34, "title": "DeepSeek Harness 更新多模态支持，剧透 V4 视觉版", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/120.htm", "date": "2026-08-20T07:10:06.000Z", "summary": "DeepSeek Harness 发布第 7 天迎来版本更新，新增多模态支持，DeepSeek 模型适配器可配置启用原生图片请求，/goal、/plan 等命令现支持带图发送，@引用范围扩展至历史会话。", "type": "model", "relTime": "1周前"}, {"id": 35, "title": "MiniMax Design 发布，释放 H3 多模态视频模型生产力", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/095.htm", "date": "2026-08-20T06:41:43.000Z", "summary": "MiniMax 今日发布多模态创作 Agent 工作台 MiniMax Design，旨在释放原生多模态视频模型 H3 的生产力。该工作台可理解创作需求、拆解任务并调用模型与 Skills，完成素材处理、内容生成、编辑和交付，并补充了音视频生成前的分镜规划及生成后的剪辑装配能力。H3 具备多模态理解、视频生成、视频编辑和参考控制等能力，尤其适合视频编辑任务。", "type": "model", "relTime": "1周前"}, {"id": 36, "title": "宇树科技推出仿生 7 轴灵巧机械臂 R1，售价 9900 元起", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/067.htm", "date": "2026-08-20T04:13:26.000Z", "summary": "宇树科技今日推出仿生 7 轴灵巧机械臂 R1，售价 9，900 元起。该产品重复定位精度约 0.1 毫米，各关节最大运动速度超 180°/s，最大臂展 650 毫米，额定负载 2 公斤，整机自重 5.5 公斤。R1 内置力反馈与碰撞检测，支持位置与力矩混合控制，计划陆续开源控制程序及接口，面向科研教育、工业、智能交互与服务机器人四大场景。", "type": "model", "relTime": "1周前"}, {"id": 37, "title": "谷歌在搜索和 Gemini 中推出多款全新 AI 学习工具，含交互式可视化内容、3D 模拟等", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/993.htm", "date": "2026-08-20T02:52:17.000Z", "summary": "谷歌宣布在搜索和 Gemini 中推出一系列 AI 学习工具，包括交互式可视化内容、3D 模拟、定制化练习测验和专门的学生中心。搜索中的 AI Overview 和 AI Mode 可生成 pH 值等主题的交互式学习体验，Lens 未来几周将支持拍照解题指导。Gemini 新增后台多步骤研究报告、可交互 3D 模拟（如旋转放大 DNA 结构）及集中式学习中心。", "type": "paper", "relTime": "1周前"}, {"id": 38, "title": "Meta Muse Video 生成视频样片曝光，单次 AI 最长生成 10 秒视频", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/991.htm", "date": "2026-08-20T02:41:06.000Z", "summary": "Meta 即将推出 Muse Video 模型，已邀请部分合作伙伴 Beta 测试，单次可生成最长 10 秒视频。测试样片显示其在细节呈现、场景物体关系理解及时间维度稳定性上潜力较高，但 Meta 承认音频与画面同步不足，高速运动物理准确性有差距。现有 10 秒样本尚不足以验证更长叙事、复杂角色一致性或高强度动作场景表现。", "type": "model", "relTime": "1周前"}, {"id": 39, "title": "MiniMax Design 发布：从操作像素到操作语义和表达意图", "source": "公众号：MiniMax（稀宇科技）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzE5MTA3NzcxMQ%3D%3D&mid=2247489087&idx=1&sn=2691288eb8cddac6c2e86483ccff7eb5", "date": "2026-08-20T00:36:00.000Z", "summary": "MiniMax 推出 MiniMax Design，一款将多模态模型能力转化为生产力的 Harness，可理解目标、拆解任务并调用模型与 Skills，完成从素材处理到最终交付的完整流程。该产品围绕原生多模态视频模型 H3 构建，擅长处理目标明确的商业内容任务，并提供 Agent 3D 导演台、自动剪辑与字幕功能，支持接入 ComfyUI 等开源生态工作流。", "type": "model", "relTime": "1周前"}, {"id": 40, "title": "GOAG：面向灵巧机器人操作的可泛化物体无关抓取规划器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.19759", "date": "2026-08-20T00:00:00.000Z", "summary": "GOAG 提出一种全新深度生成模型，利用抓取器与物体在接触点共享相同表面几何的观察，学习抓取器接触面分布的紧凑潜表征，无需依赖特定物体的训练数据即可高效采样有效抓取构型。在 MultiDex 数据集上平均成功率达 86.93%，达到最先进水平；生成大量抓取时速度显著更快，且性能与专门在该数据集上训练的领先方法相当。", "type": "paper", "relTime": "1周前"}, {"id": 41, "title": "4DAnyone：从随意单目视频重建4D人体", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.20335", "date": "2026-08-20T00:00:00.000Z", "summary": "4DAnyone提出从无标定单目视频重建4D人体的框架，通过生成重建级多视角一致视频并提升至4D高斯泼溅（4DGS）。针对现有模型在数十个目标视角下的一致性失效问题，该方法以参考上下文打包（RCP）和目标任务上下文路由（TCR）分别实现O（1）参考复杂度与跨组上下文共享。在DNA-Rendering和DyMVHumans上，4DAnyone在视角视频质量与下游4DGS重建上均优于先前方法。", "type": "paper", "relTime": "1周前"}, {"id": 42, "title": "EXIMO：用 VLM 引导探索来微调 VLA 机器人策略", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.19891", "date": "2026-08-20T00:00:00.000Z", "summary": "EXIMO 提出一种高效微调视觉-语言-动作（VLA）策略的三阶段算法：探索、模仿与优化。探索阶段由视觉语言模型（VLM）充当规划器，将长程任务分解为短程子任务并收集编排数据；模仿阶段用该数据微调 VLA；优化阶段采用残差离线策略强化学习进一步提升。实验表明，EXIMO 在样本效率和最终性能上显著优于现有方法。", "type": "paper", "relTime": "1周前"}, {"id": 43, "title": "WithEveryone：面向群像生成的统一规划与身份锚定框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.20336", "date": "2026-08-20T00:00:00.000Z", "summary": "WithEveryone 提出统一框架，支持生成包含至多十个参考身份的群像。其核心目标 Layout-Grounded ID Loss 利用标注人脸区域直接监督目标身份，避免不稳定的嵌入匹配；在身份不相交基准上，目标上下文身份相似度从 GPT-Image-2 的 0.462 提升至 0.499，复制粘贴伪影从 0.169 降至 0.055，身份覆盖率达 97.3%，重复率仅 2.8%。", "type": "paper", "relTime": "1周前"}, {"id": 44, "title": "Block3D：通过分块扩散实现高效文本到3D生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.19567", "date": "2026-08-20T00:00:00.000Z", "summary": "Block3D提出一种分块扩散框架，将离散形状token序列划分为连续块，以自回归方式生成各块，并对当前块内所有token进行联合去噪。该方法引入置信度引导的块内修正机制，在每块完成前修正低置信度token，以缓解误差累积。在TRELLIS-500K留出集上，Block3D将端到端平均生成时间从25.71秒降至4.99秒，较微调自回归基线实现5.15倍加速，且不损失几何保真度。", "type": "paper", "relTime": "1周前"}, {"id": 45, "title": "MiniMax H3 流式视频 LoRA 适配器引热议", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2090189053388108166", "date": "2026-08-19T21:27:58.000Z", "summary": "为 MiniMax H3 打造流式视频 LoRA 适配器？这是个大胆的举措，谢谢！😲 但要实现实时生成，还需进一步加速推理。  有人有兴趣参加我们为 H3 举办的线上黑客松吗？  欢迎任何想法！", "type": "industry", "relTime": "1周前"}, {"id": 46, "title": "MiniMax H3将亮相GMI夏季峰会", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2090186372120445271", "date": "2026-08-19T21:17:19.000Z", "summary": "我们将前往 @gmi_cloud 的 Summer Signal \\'26 🏖️🎨 🖼️  【引用 @gmi_cloud】：Summer Signal \\'26 首位视频合作伙伴：@MiniMax_AI  他们将登台解读 MiniMax H3，以及大规模推进视频生成真正需要什么。  报名参会 👇", "type": "industry", "relTime": "1周前"}, {"id": 47, "title": "FastMetal 让 Mac 本地 30 秒生成视频", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2090177721913770407", "date": "2026-08-19T20:42:57.000Z", "summary": "一段 5 秒 480P 视频，完全在 Mac 上生成，耗时 30 秒。无需 CUDA，无需云端，仅占用 3.9 GiB 内存。  FastMetal 将 FastWan-QAD 系列带到 Apple Silicon。DiT、DMD 采样器和解码器均通过 MLX 在 Metal 上运行，默认 INT8。  三个模型：1.3B 支持 480P，5B 支持 720P，14B 追求画质。  📷 博客...", "type": "model", "relTime": "1周前"}, {"id": 48, "title": "Google 为 Search 和 Gemini 推出全新 AI 学习工具", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/19/google-launches-new-study-tools-for-students-across-search-and-gemini", "date": "2026-08-19T19:00:00.000Z", "summary": "Google 在 Search 和 Gemini 中推出多项 AI 学习工具，包括 AI 生成的交互式可视化、3D 模拟、定制练习测验和专门的学生中心。Search 的 AI Mode 可根据问题生成交互体验，Lens 将支持拍照解题并给出概念讲解与纠错指导。Gemini 新增多步骤研究报告功能，可在后台生成报告后通过语音讨论，并支持生成可旋转缩放的 3D 模拟。", "type": "paper", "relTime": "1周前"}, {"id": 49, "title": "Fireworks AI 双榜登顶，定制模型成主流", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2090124647337456066", "date": "2026-08-19T17:12:03.000Z", "summary": "Fireworks AI 同时登上 Ramp 2026 年 8 月 SaaS 榜单\"趋势\"与\"增长最快\"两项，凸显定制模型与\"自拥智能栈\"正成为 AI 公司和开发者的关键方向。该榜单显示模型服务/路由支出持续增长，企业正转向开源 AI 以节省成本；9% 的公司已用 AI 生成营销图片和视频。", "type": "tip", "relTime": "1周前"}, {"id": 50, "title": "Meta 推出 Mac 版 AI 应用", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/982270/meta-ai-mac-app", "date": "2026-08-19T17:00:00.000Z", "summary": "Meta 发布专为 Mac 设计的 AI 聊天机器人应用，用户可共享窗口，让 Meta AI 基于屏幕内容提供建议、回答问题或生成内容，并支持跨应用听写。新应用还可连接 Instagram、Facebook 账户、Meta 广告活动和 Google Workspace，帮助分析帖子覆盖与互动数据，生成文档表格或执行每周绩效更新等重复任务。", "type": "paper", "relTime": "1周前"}, {"id": 51, "title": "Runway 谈企业视频生成的下一个阶段：模型许可与自主执行", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/company-news/the-next-phase-of-enterprise-video-generation", "date": "2026-08-19T16:00:00.000Z", "summary": "Runway 业务今年增长超一倍，NRR 超 300%，一家 Fortune 20 客户对其使用量增长超 17 倍。欧洲占其企业客户超 20%，订阅销量过去十二个月增长 50%。公司推出模型许可模式，提供闭源权重与专有训练，并强调不基于客户数据训练、提供 Day 0 第三方模型接入及 Runway Agent 自主执行能力。", "type": "tip", "relTime": "1周前"}, {"id": 52, "title": "Meta 为\"一键脱衣\"女性政客的 AI 应用投放广告", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/08/meta-ran-ads-for-an-app-promising-to-nudify-female-politicians", "date": "2026-08-19T15:45:29.000Z", "summary": "Meta 平台近期为 AI 色情生成工具 Kromix 投放广告，该工具宣称\"无限制\"，并鼓励用户制作酷似美国女性政客的深度伪造视频，违反 Meta 禁止含色情内容广告的政策。这是 Meta 未能阻止非自愿亲密影像工具广告上架的最新一例。Kromix 自称\"AI 图像风格化器\"，在苹果 App Store 上架，邀请付费用户上传照片用于\"卧室强奸\"等场景。", "type": "industry", "relTime": "1周前"}, {"id": 53, "title": "Odyssey 推出 CaliBench 评估视频世界模型随机性", "source": "X：Odyssey (@odysseyml)", "sourceUrl": "https://x.com/odysseyml/status/2090091652279152972", "date": "2026-08-19T15:00:56.000Z", "summary": "今天，我们推出 CaliBench，用于评估视频世界模型能否再现我们宇宙的真实随机性。  掷骰子或抽张牌，世界模型生成的结果应当与现实相符。来看看它是否做到吧！", "type": "model", "relTime": "1周前"}, {"id": 54, "title": "扩散语言模型驱动的实时交互视频生成公司SigmaZ AI，完成数百万美元融资|蓝驰家族", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/lanchi/sigmaz-ai", "date": "2026-08-19T15:00:00.000Z", "summary": "暂无摘要", "type": "industry", "relTime": "1周前"}, {"id": 55, "title": "Runway 上线 MiniMax H3 无限量生成", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2090090516151243063", "date": "2026-08-19T14:56:25.000Z", "summary": "MiniMax H3 现已在 Runway 上无限量使用。  限时活动期间，Max 套餐用户可随心所欲地生成内容，无上限、不计数，尽情使用这款目前最优秀的视频模型之一。点击下方链接立即开始。", "type": "model", "relTime": "1周前"}, {"id": 56, "title": "小米新一代人形机器人亮相世界机器人博览会：大模型驱动实时互动", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/848.htm", "date": "2026-08-19T14:23:51.000Z", "summary": "小米新一代人形机器人今日亮相2026世界机器人博览会\"具身花园\"展台，官方放出其与观众实时互动视频。从递花、握手到碰拳、比心，动作由大模型驱动机器人自主理解、判断并完成。8月20日起展台对普通观众开放。", "type": "model", "relTime": "1周前"}, {"id": 57, "title": "Calendly 推出会议记录工具，加入 AI 笔记应用竞争", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/19/calendly-throws-its-hat-into-meeting-note-taker-circus", "date": "2026-08-19T14:09:39.000Z", "summary": "Calendly 推出会议记录产品，可加入会议、录制音视频并生成摘要、行动项和跟进邮件草稿，并正在测试类似 Granola 的系统音频转录功能。公司还计划发布 AI 助手 Callie，利用现有日程与会议堆栈安排会议、查看可用性并调取过往会议上下文。CEO Tope Awotona 表示，该工具会在会议开始前及进行中通过聊天消息告知与会者正在录音，用户可随时要求其离开对话。", "type": "product", "relTime": "1周前"}, {"id": 58, "title": "王力宏谈宇树G1机器人演唱会Bug：团队通宵写代码解决，马斯克转发视频", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/842.htm", "date": "2026-08-19T13:38:47.000Z", "summary": "宇树科技今日在科创板挂牌上市，歌手王力宏在上市答谢午宴上回顾了2025年12月其成都演唱会上6台宇树G1人形机器人伴舞《火力全开》的经历。他透露，演出前一晚机器人出现节奏拖拍Bug，宇树工程团队通宵现场写出新代码，将灯光系统时间码同步给机器人后成功解决，次日演出完美，马斯克转发视频并评价\"impressive\"。", "type": "industry", "relTime": "1周前"}, {"id": 59, "title": "Vivodyne 用机器人实验室 HIVE 生成因果生物数据，称这是 AI 治愈癌症的关键", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/19/ai-isnt-close-to-curing-cancer-this-startup-says-it-knows-what-it-will-take", "date": "2026-08-19T12:00:00.000Z", "summary": "生物科技初创公司 Vivodyne 推出模块化机器人实验室 HIVE，可培育 20 种人体组织并自主给药监测，生成现有 AI 模型缺失的因果生物数据。其肝细胞对毒性预测准确率达 94%，气道组织匹配度 96%，骨髓在 20 种化疗药物测试中 100% 一致。该公司已融资近 8000 万美元，在旧金山外开设全球最大\"人类数据中心\"，吞吐量达美国全部动物试验的两倍。", "type": "model", "relTime": "1周前"}, {"id": 60, "title": "宇树科技王兴兴回应入职大疆仅2个月即离职：热爱机器人且产业化机会已出现", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/770.htm", "date": "2026-08-19T09:48:29.000Z", "summary": "宇树科技创始人王兴兴回应2016年入职大疆仅2个月便离职一事，称选择创业源于对机器人行业的热爱，且当时产业化机会已经出现。他读研期间设计的四足机器人XDog测试视频出圈后吸引投资人，同年8月获天使轮融资创立宇树科技。他还回应\"价格屠夫\"标签，称公司毛利率维持在合理水平，以保持现金流稳健。", "type": "tip", "relTime": "1周前"}, {"id": 61, "title": "扩散语言模型驱动的实时交互视频模型：SigmaZ 完成数百万美元融资", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/crossing/sigmaz", "date": "2026-08-19T09:14:00.000Z", "summary": "SigmaZ 完成数百万美元融资，其核心产品为扩散语言模型驱动的实时交互视频模型。该模型融合 Pixel 与 Code 两种视觉表达方式，前者擅长呈现外观，后者擅长表达结构，未来将走向 Pixel-Code 联合的视觉表达路径。", "type": "industry", "relTime": "1周前"}, {"id": 62, "title": "Vidu S1 助力 360 打造《甄嬛传》数字人新玩法", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489072&idx=1&sn=7133cd05a477edeb31417e6545bae14f", "date": "2026-08-19T07:55:31.000Z", "summary": "Vidu 与 360 达成技术合作，以自研 Vidu S1 实时交互视频生成模型为底层支撑，落地「甄嬛 360 传粉丝见面会」线上 H5 活动，支持用户与甄嬛、华妃等十位剧中角色进行实时对话。该模型支持 1 分钟至 2 小时持续无损渲染、秒级响应及百余种语言与方言，并提供 SaaS、MaaS 两种轻量化接入方案。", "type": "industry", "relTime": "1周前"}, {"id": 63, "title": "9.8 万元起，国产情感交互人形机器人\"爱湫\"发售", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/653.htm", "date": "2026-08-19T07:27:12.000Z", "summary": "四川具身人形机器人科技有限公司的情感交互人形机器人\"爱湫\"今日发售，定价 9.8 万元起。该机器人采用龙蜥外形，研发全球首个\"情感-语言-动作\"大模型（ELA），结合自研多模态情感计算引擎构建情绪感知与交互决策能力。爱湫配备 3D 超短焦投影面部，身高 135mm，最高 32 个自由度，可选三指、五指灵巧手，续航 3 小时。", "type": "model", "relTime": "1周前"}, {"id": 64, "title": "Deft 发布：AI 检测工具易被愚弄，写作工具应引导正确模式", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2089895053560864964", "date": "2026-08-19T01:59:43.000Z", "summary": "Deft 联合创始人 @rosmine 宣布推出新 AI 写作实验室 Deft，其模型生成的文本据称 86% 被 pangram 判定为\"完全人类\"。Elvis Saravia 认为 AI 检测工具极易被规则欺骗、纯属浪费时间，主张开发 Deft 这类工具以鼓励负责任的写作模式，而非依赖检测。Deft 目前为小规模测试版，在分析/论文、创意写作和改写场景表现较好。", "type": "paper", "relTime": "1周前"}, {"id": 65, "title": "Matic 扫地机器人：20 年计算机视觉终成消费产品", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2089894185902203186", "date": "2026-08-19T01:56:16.000Z", "summary": "Matic 家用机器人内置 5 摄像头与 NVIDIA 芯片，约 20 分钟完成全屋 3D 建图，可区分充电线、袜子、污渍与宠物并分别应对，全程无 App，支持语音指令与全黑环境清扫。其视觉技术源于创始人 Navneet Dalal 在 INRIA Grenoble 的人类检测研究（被引超 5 万次），该成果在专利局尘封 20 年才迎来消费市场。", "type": "product", "relTime": "1周前"}, {"id": 66, "title": "VA-Judger：面向视频-音频联合生成的人类偏好奖励模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.18607", "date": "2026-08-19T00:00:00.000Z", "summary": "VA-Judger 提出一种面向视频-音频联合生成的链式思维全模态奖励模型，并构建了包含 9K 提示词和 10.3K 细粒度成对比较的大规模人类偏好数据集 VAPref-10K。该模型通过分维度强化学习分解人类反馈，在域内和域外评测中均优于现有指标基线，用于后训练可显著提升生成质量。", "type": "paper", "relTime": "1周前"}, {"id": 67, "title": "SparsePR：免训练稀疏注意力如何加速视频生成与世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.18484", "date": "2026-08-19T00:00:00.000Z", "summary": "SparsePR 提出免训练块稀疏注意力方法，结合响应耦合分区与探针拟合残差重建，在四个视频生成与世界模型上持续降低注意力重建误差。该方法在 22.0%-26.0% 实际执行对密度下保持生成质量，实现 1.48x-2.61x 端到端加速。消融实验显示探针拟合贡献主要误差降低，响应耦合分区在有限探针预算下改善重建效果。", "type": "paper", "relTime": "1周前"}, {"id": 68, "title": "Gemini 3.7 Flash 一键生成视差动画网页", "source": "X：Google AI for Developers (@googleaidevs)", "sourceUrl": "https://x.com/googleaidevs/status/2089825267732849049", "date": "2026-08-18T21:22:25.000Z", "summary": "从一条提示词到完全动画化的视差落地页。🤯  看看 Gemini 3.7 Flash 如何结合 Nano Banana 和 Omni，一次性构建交互式网站。在底层，3.7 Flash 会调用合适的工具来生成文案、图像参考，并渲染支持视差效果的 Omni 视频。", "type": "tip", "relTime": "1周前"}, {"id": 69, "title": "罗宾·威廉姆斯子女重启其 Instagram 账号以对抗\"AI 滥用\"", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/entertainment/981644/robin-williams-instagram-account-ai", "date": "2026-08-18T19:48:26.000Z", "summary": "罗宾·威廉姆斯的子女扎克、塞尔达和科迪接管其父的 Instagram 账号，将其打造为分享真实照片、视频和回忆的\"可信之地\"，以对抗对其声音和形象的\"猖獗 AI 滥用\"。该账号自 2014 年其父去世后一直未更新。此前，塞尔达曾公开反对 AI 生成的父亲形象，并呼吁粉丝停止发送相关视频。", "type": "industry", "relTime": "1周前"}, {"id": 70, "title": "Grok v1.0.6 更新：子代理工具权限调整与多项修复", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2089799745527308490", "date": "2026-08-18T19:41:00.000Z", "summary": "Grok 命令行工具发布 v1.0.6 更新，子代理生成不再接受 capability_mode，工具访问仅由代理类型控制。新增 Shift+方向键扩展文本选择、状态栏显示会话信息及 grok clone 拉取仓库功能。修复了会话启动挂起、队列消息饥饿、视频生成错误提示等问题。", "type": "paper", "relTime": "1周前"}, {"id": 71, "title": "Hydra-0：以动作流为条件的通用世界模型与控制", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.18077", "date": "2026-08-18T17:59:30.000Z", "summary": "Hydra-0 是一种以动作流为条件的通用世界模型，将机器人动作表示为像素运动，实现跨本体、任务、环境和视频生成骨干的通用建模与控制。其最佳配置相比动作条件基线，机器人运动误差降低 90.4%，物体运动误差降低 60.2%，并支持零样本组合与数据高效适配。该接口还涌现出逆模式--世界动作模型，可从人类演示的目标物体流预测兼容的机器人运动，无需任务专属专家演示即可生成可执行动作。", "type": "paper", "relTime": "1周前"}, {"id": 72, "title": "微软 MAI-Image-2.6-Preview 登顶图像编辑榜第三", "source": "X：Mustafa Suleyman（Microsoft AI CEO） (@mustafasuleyman)", "sourceUrl": "https://x.com/mustafasuleyman/status/2089766508373176726", "date": "2026-08-18T17:28:56.000Z", "summary": "微软 MAI-Image-2.6-Preview 在图像编辑基准测试中位列第三，得分 1，420 分，较上一代提升 19 分，从第五跃升至第三。该模型在商品、3D、动漫、写实等四类中均排第三，文本渲染提升最显著（+43 分）。", "type": "model", "relTime": "1周前"}, {"id": 73, "title": "Populous 如何用 Runway 呈现全球标志性场馆设计", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/customers/populous", "date": "2026-08-18T15:53:44.394Z", "summary": "全球设计公司 Populous 高级建筑师 Georgina Myers 介绍团队用 Runway 辅助体育场馆概念设计：过去完整视频需外部渲染团队至少三周，且提交前两周须冻结设计模型；如今 Runway 能生成传达尺度感的完整渲染和航拍图，将视觉制作时间缩短，让设计师把时间还给设计本身。该工具已用于利雅得 MBS 体育场等中东项目，支持 9 种不同活动模式的场景迭代。", "type": "tip", "relTime": "1周前"}, {"id": 74, "title": "OJO 设计智能体工作台：品味即护城河", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2089734075208671427", "date": "2026-08-18T15:20:03.000Z", "summary": "OJO 推出首个设计智能体团队工作台，可组建负责产品策略、视觉、文案与原型的设计智能体团队，调用 300+ 技能，将自然语言想法转化为 PRD、页面结构、UI 及可编辑原型，并支持导出 Figma 或通过 CLI 接入 Claude Code、Codex。Kim 认为，生成可用应用已近乎免费，未来产品差异取决于判断力与品味，未来两年胜出的是对\"好\"有最强主张的团队。", "type": "product", "relTime": "1周前"}, {"id": 75, "title": "Meta 提交人脸识别与自动记录人员专利申请，涉及\"记忆回放\"功能", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.privacyguides.org/news/2026/08/17/meta-files-patent-for-facial-recognition-automatic-recording-of-people", "date": "2026-08-18T15:02:06.426Z", "summary": "Meta 提交了一项专利申请，涉及通过人脸识别自动检测并记录人员，随后生成高光片段回放的系统。该专利与 Meta Ray-Ban 智能眼镜相关，其摄像头指示灯此前已被用户想方设法禁用。Meta 举例称，AI 可在晚宴后主动生成\"今晚晚宴高光片段\"供用户查看，但专利中未提及记录前的征询提示。", "type": "industry", "relTime": "1周前"}, {"id": 76, "title": "Booster T2人形机器人赛前彩排视频发布", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2089714169927131224", "date": "2026-08-18T14:00:57.000Z", "summary": "Booster T2人形机器人排练视频：在北京第二届世界人形机器人运动会前夕，它们以精确对齐的方式完成群体移动表演。", "type": "industry", "relTime": "1周前"}, {"id": 77, "title": "Gemini 3.7 Flash 生成现代网页视频背景", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2089710693012414472", "date": "2026-08-18T13:47:08.000Z", "summary": "Gemini 3.7 Flash 和 Omni 的巧妙用法。", "type": "tip", "relTime": "1周前"}, {"id": 78, "title": "面壁智能 VoxCPM2 开源数字人视频工作流", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2089698829725503681", "date": "2026-08-18T13:00:00.000Z", "summary": "开发者 @jaxxchen003 基于面壁智能 VoxCPM2 构建了开源数字人视频生产工作流，实现自然语音克隆、带节奏与情感控制的表达性语音生成，以及可复用的自动化视频合成流程。该项目展示了轻量级 AI 语音模型如何赋能灵活可控的内容创作，代码与模型均已开源。", "type": "model", "relTime": "1周前"}, {"id": 79, "title": "Seedance 2.5 搭配 upsteam 预演台：告别 AI 视频反复抽卡的正确打开方式", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247509782&idx=1&sn=911ca46ac365fcd431cb4a68324fdf1a", "date": "2026-08-18T12:17:23.000Z", "summary": "upsteam 预演台上线，用户无需 3D 建模基础即可用参考图生成粗粒度白模，并搭建场景、人物、机位与运镜轨迹。将录制的白模视频交给 Seedance 2.5 生成，可精准锁定空间关系与运镜方向，避免纯文字提示词导致的误解，减少返工与积分消耗。适合大场面空镜、多人调度及复杂运镜等镜头，简单镜头仍可直接用文字生成。", "type": "tip", "relTime": "1周前"}, {"id": 80, "title": "字节跳动与MPA签约强化AI版权保护", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2089678585191907637", "date": "2026-08-18T11:39:33.000Z", "summary": "字节跳动已与美国电影协会（MPA）签署协议，为其AI视频和图像模型Seedance、Seedream加强版权保护，这些模型支撑着TikTok、CapCut和Dreamina等产品。此前好莱坞对AI版权风险表示担忧，MPA今年早些时候也发出警告。字节跳动称新版Seedance和Seedream包含更强的知识产权保护措施，或为其AI生成工具在美国更广泛采用铺平道路。", "type": "industry", "relTime": "1周前"}, {"id": 81, "title": "苹果带摄像头 AirPods 泄露视频曝光", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/981326/apple-airpods-with-cameras-demo-video-leak", "date": "2026-08-18T09:00:01.000Z", "summary": "一段在 macOS Tahoe 26.7 Release Candidate 中发现的新视频，首次展示了苹果传闻中带摄像头的 AirPods。视频中，佩戴者手持书籍，AirPods 通过 Visual Intelligence 识别封面书名，Siri 语音提示可将看到的内容保存。该产品外观比 AirPods Pro 3 稍厚，预计将与 Meta Ray-Ban 智能眼镜等设备竞争。", "type": "product", "relTime": "1周前"}, {"id": 82, "title": "面壁智能 MiniCPM-o 4.5 全双工多模态交互解析", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2089615191273300096", "date": "2026-08-18T07:27:39.000Z", "summary": "面壁智能转发 @LearnOpenCV 对 MiniCPM-o 4.5 的深度解析。这款 9B 开源模型支持实时全双工交互，可同时处理实时视频、输入音频并生成语音回复。其统一流水线整合视觉、音频、推理与流式语音生成，实现更自然的 AI 交互体验。", "type": "tip", "relTime": "1周前"}, {"id": 83, "title": "Qwen3.8-27B 本地运行效果惊艳", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2089602715735519586", "date": "2026-08-18T06:38:05.000Z", "summary": "通义千问展示 Qwen3.8-27B 单次提示词即可生成惊艳效果，并鼓励用户在自己的笔记本上运行。用户 @ItsmeAjayKV 对比测试显示，Qwen3.8-27B 在 RTX 3090 上以 Q5 量化（非 f8）运行，生成的水面模拟效果一致且视觉惊艳，超越 Gemini-3.7-flash。", "type": "tip", "relTime": "1周前"}, {"id": 84, "title": "硅谷开始清理AI垃圾内容：谷歌删除5万账号集群，Spotify删7500万条曲目", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/058.htm", "date": "2026-08-18T04:46:53.000Z", "summary": "硅谷科技公司开始大规模清理AI生成的垃圾内容。Spotify去年删除7500万条批量上传和重复曲目，谷歌在YouTube上清除13万个低质量频道及5万个账号集群，TikTok已自动标记超30亿条AI生成视频。这些垃圾内容多由科技公司自己的AI工具催生，已污染搜索、社交和音乐平台的信息生态。", "type": "tip", "relTime": "1周前"}, {"id": 85, "title": "共生知行发布人形机器人驾驶卡丁车 Demo，展示直接感知-控制模型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/055.htm", "date": "2026-08-18T04:33:25.000Z", "summary": "共生知行（Symbiosis Robotics）8 月 17 日发布双足人形机器人驾驶卡丁车 Demo，并上线官网，首次系统展示其在\"全身智能\"方向的阶段性进展。其直接感知-控制模型移除中间运动表征，将视觉、语言、身体状态等直接映射为可执行动作，使宇树人形机器人实现手-眼-脚协同驾驶。该公司表示，赛车只是第一项公开测试，未来将围绕移动操作、高精度视觉对准等推出更多案例。", "type": "model", "relTime": "1周前"}, {"id": 86, "title": "Meta 专利探索智能眼镜未来：可识别人脸自动梳理、AI 提取精彩片段", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/025.htm", "date": "2026-08-18T03:23:42.000Z", "summary": "Meta 申请新专利，探索让智能眼镜借助内置人脸识别技术，识别视频画面中的人物及其与佩戴者的关系，并自动生成带人物标签的集锦片段。专利构想的一个应用场景是，用户在晚宴或聚会上佩戴眼镜录制视频后，AI 可询问用户是否想查看活动精彩片段。Meta 眼镜当前只能录制 3 分钟或 5 分钟的视频，相关设计也可能加剧隐私争议。", "type": "industry", "relTime": "1周前"}, {"id": 87, "title": "Nano Banana与Gemini Omni打造可视化百科", "source": "X：Google AI for Developers (@googleaidevs)", "sourceUrl": "https://x.com/googleaidevs/status/2089540580422644216", "date": "2026-08-18T02:31:10.000Z", "summary": "用 Nano Banana 和 Gemini Omni 将网络变成交互式视觉百科全书。🌐✨  我们在 @Antigravity 中使用 Gemini 3.7 Flash 构建了一个 Chrome 扩展，让你在浏览时高亮任意文本即可快速生成丰富的视觉化释义，助力深度学习。  查看演示 ↓", "type": "paper", "relTime": "1周前"}, {"id": 88, "title": "以色列设立虚假智库，疑似为欺骗AI聊天机器人", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://responsiblestatecraft.org/israel-influence-chatgpt", "date": "2026-08-18T02:30:02.549Z", "summary": "以色列政府通过广告公司Piro设立虚假智库\"汉诺威公共政策研究所\"，发布百余份亲以报告，旨在影响Claude、Gemini等LLM的可信度评估。Piro已获以色列政府90万美元资金，其报告被GPTZero判定为AI生成。此前以色列还以4650万美元合同聘请Brad Parscale创建类似网站，已成功影响Microsoft Copilot和Google Gemini。", "type": "tip", "relTime": "1周前"}, {"id": 89, "title": "苹果带摄像头的 AirPods 实机演示曝光，可实现环境视觉感知", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/919.htm", "date": "2026-08-18T01:33:32.000Z", "summary": "苹果正在研发配备摄像头的 AirPods，内部代号 B790，相关演示视频在 macOS Tahoe 26.7 RC 中被发现。该设备可将摄像头获取的信息提供给\"视觉智能\"，Siri 能回答用户关于周围环境的问题并记录信息，头发遮挡摄像头时还会收到提醒。彭博社记者 Mark Gurman 此前透露，这款产品最快可能在今年 9 月发布。", "type": "product", "relTime": "1周前"}, {"id": 90, "title": "消息称特斯拉筹备推出 Cybercab 自动驾驶出租车服务，最快本月在奥斯汀上线", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/899.htm", "date": "2026-08-18T00:41:08.000Z", "summary": "特斯拉已通知员工，正准备推出 Cybercab 自动驾驶出租车服务，最快本月率先在得克萨斯州奥斯汀市上线。Cybercab 是专为自动驾驶打造的车型，没有方向盘和踏板。特斯拉计划先让员工在公共道路体验，随后几天内将车辆纳入奥斯汀的 Robotaxi 服务；该车型预计今年晚些时候逐步扩大产量。", "type": "paper", "relTime": "1周前"}, {"id": 91, "title": "EditBridge：面向高保真与高效超高清图像编辑的扩散桥接框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.18063", "date": "2026-08-18T00:00:00.000Z", "summary": "EditBridge 提出一种扩散桥接框架，将超高清编辑视为从低分辨率编辑结果到高分辨率版本的结构化数据转换，并以原始高分辨率图像为条件保留真实细节。其引入先验引导的块状稀疏注意力机制，将跨图像交互限制在空间对齐区域，在 2K 分辨率下实现 3.6-8.4 倍加速，并可在 61 秒内完成 4K 编辑。", "type": "paper", "relTime": "1周前"}, {"id": 92, "title": "MoE-ViE：面向高效图像与视频理解的专家混合视觉编码器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17402", "date": "2026-08-18T00:00:00.000Z", "summary": "MoE-ViE 系列专家混合视觉编码器在多种规模上均超越同尺寸密集编码器，其最大模型以 SOTA 编码器 76% 的延迟实现同等零样本性能。研究提出细粒度 MoE 拓扑、无辅助损失均衡变体及专用 MoE 内核，并通过帧级蒸馏与冻结机制增强视频能力。与 LLM 对齐后，MoE-ViE 在图像和视频基准上超越所有对比编码器，包括激活参数多 5 倍的模型。", "type": "paper", "relTime": "1周前"}, {"id": 93, "title": "TAMP-Nav：面向高效具身导航的点选、思考、记忆与对齐框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17512", "date": "2026-08-18T00:00:00.000Z", "summary": "TAMP-Nav 提出统一框架，将具身导航重构为 2D 视觉提示任务，让 VLM 仅需选择 2D 像素即可由 SLAM 控制器执行，并引入选择性推理与锚点轨迹记忆机制，通过 GRPO 双层对齐实现高效导航。该方法在 R2R-CE 基准上取得 66.2% SR 的 SOTA 成绩，且仅需 90k 训练轨迹，兼具高运行效率与样本效率。", "type": "paper", "relTime": "1周前"}, {"id": 94, "title": "aDSL：通过智能体与程序联合设计实现智能体3D内容生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17975", "date": "2026-08-18T00:00:00.000Z", "summary": "针对大语言模型编写3D程序时难以将高层意图转化为一致底层几何的问题，研究者联合设计了智能体中心领域特定语言aDSL与角色专业化多智能体系统。aDSL通过关系运算符替代绝对坐标，强调可组合性与空间推理；免训练系统采用Plan-Execute-Critic循环，利用执行反馈迭代修复错误。该方法在文本/图像生成3D形状任务上优于此前LLM基线，并支持铰接物体创建与结构化场景组合，代码已开源。", "type": "paper", "relTime": "1周前"}, {"id": 95, "title": "Abra：扩散图像训练的规模化定律研究", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17286", "date": "2026-08-18T00:00:00.000Z", "summary": "Abra 研究团队对文生图扩散模型进行了系统性规模化定律分析，训练计算量横跨三个数量级（1019 至 1022 FLOPs），远超此前工作。研究发现扩散模型与语言模型一样可预测，但需要约每参数 200 个图像 token 才能达到计算最优，是 LLM 的 Chinchilla 最优配方的十倍。此外，扩散模型对过度训练具有鲁棒性，且预测性可延伸至生成质量、最优 CFG 设置及训练曲线形状。", "type": "paper", "relTime": "1周前"}, {"id": 96, "title": "GS-Voxel：面向大规模 3DGS 生成的无拟合结构化潜空间框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17988", "date": "2026-08-18T00:00:00.000Z", "summary": "GS-Voxel 提出一种无拟合结构化潜空间框架，可将预优化的 3DGS 重建确定性转换为稀疏活动体素，无需逐场景优化，并保留所选图元的亚体素位置与渲染属性。其专用因子化 VAE 分别编码体素几何与局部高斯属性，潜空间大小随占用体素数增长而非受固定图元数限制。基于该潜空间训练的影像条件流模型支持重叠感知分块推理，可扩展至卫星影像条件下的航拍大场景生成。", "type": "paper", "relTime": "1周前"}, {"id": 97, "title": "面向通用图像生成的能力中心化数据设计：从语料库到协同演进能力", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.18076", "date": "2026-08-18T00:00:00.000Z", "summary": "一项研究提出能力驱动的数据基础设施，将能力专属监督构建与能力对齐的课程调度相结合，通过三个数据引擎分别构建文本-图像 grounding、图像间变换和图像-知识关联的互补关系监督。该框架构建了4.4亿图像T2I语料库、1.2亿编辑对和超2700万图像-实体对，并据此从零训练了3B和6B两种规模的多模态扩散模型，在CPI-Bench上进行了定量评估。", "type": "paper", "relTime": "1周前"}, {"id": 98, "title": "SemComp-Bench：为视频生成中的语义任务完成设立基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17426", "date": "2026-08-18T00:00:00.000Z", "summary": "研究团队提出\"语义任务完成视频生成\"这一以结果为导向的视频生成任务，要求模型同时实现预期结果并保持与参考图像的语义对齐。为此构建了覆盖六个领域的评估数据集 SemComp-Data，并推出基于视觉语言模型（VLM）的评估协议 SemComp-Bench，分别以 OA Score 和 GR Score 衡量结果达成与生成可靠性。实验显示，现有代表性视频生成模型在兼顾任务目标与语义对齐方面仍面临挑战。", "type": "paper", "relTime": "1周前"}, {"id": 99, "title": "Grok Imagine 荷马史诗短片大赛，头奖 10 万美元", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2089458330309980425", "date": "2026-08-17T21:04:20.000Z", "summary": "SpaceXAI 推出电影制作竞赛，要求创作者用 Grok Imagine 将荷马《奥德赛》场景搬上银幕，奖金总额 10 万美元。参赛需提交 3-5 分钟英文视频，至少 1 分钟对白，视频、图像及角色声音须由 Grok Imagine 生成，其他工具可用于剪辑、配乐和音效。面向 18 岁以上美国居民，截止日期为 2026 年 8 月 31 日。", "type": "industry", "relTime": "1周前"}, {"id": 100, "title": "你最喜欢的创作者不是真人--这重要吗？", "source": "a16z：News（RSS）", "sourceUrl": "https://www.a16z.news/p/your-favorite-creator-isnt-realdoes", "date": "2026-08-17T19:35:23.000Z", "summary": "一位作者用ChatGPT生成图像、Minimax 3和Grok Imagine 1.5生成视频，打造了虚拟女生Janie，并让她参加阿拉巴马大学姐妹会招募。一周内Janie获得1300名粉丝，视频平均观看量达数万次，20条视频中8条被TikTok标记为AI生成，但未影响表现。作者未标注AI身份，认为这违反了TikTok服务条款，但旨在测试平台与观众的识别能力。", "type": "tip", "relTime": "1周前"}, {"id": 101, "title": "OpenAI 总裁谈路线图：能力将大幅提升", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2089430780523184527", "date": "2026-08-17T19:14:52.000Z", "summary": "OpenAI 总裁 Greg Brockman 刚刚表示，随着模型曲线持续进步，OpenAI 的路线图指向重大的能力提升。  \"我们确实有一条规划好的路线图，能力将持续以显著方式增长，这些方式很难用简短的语言解释清楚。\"  ----  来自\"CNBC Television\"YouTube 频道（完整视频链接见评论）", "type": "tip", "relTime": "1周前"}, {"id": 102, "title": "MiniMax H3 本地视频生成资源与实测分享", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2089421390374138178", "date": "2026-08-17T18:37:33.000Z", "summary": "MiniMax 官方分享了用 H3 模型在 RTX 4090（24GB）上本地生成视频的实用资源，并引用了 @Lumosous 的实测体验：通过 ComfyUI 实现文生视频、音乐节拍同步和图生视频三种玩法，官方 H3 Prompt Writing Skill 可把想法转为结构化提示词。", "type": "tip", "relTime": "1周前"}, {"id": 103, "title": "MiniMax H3 视频模型助力游戏精灵创建", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2089420340728610890", "date": "2026-08-17T18:33:23.000Z", "summary": "MiniMax 称其 SOTA 视频生成模型 H3 能精准理解行走角色动作，而最新图像生成模型仍难保持行走动作一致。引用推文展示了 H3 用于游戏精灵创建的工作流：单张角色设计图配纯品红背景，每个动作生成 5 秒 H3 片段，裁剪至姿态极限并抠像打包成精灵图集，接入状态机即可游玩（8 个动作约 $5）。", "type": "tip", "relTime": "1周前"}, {"id": 104, "title": "LLM编码模型或优于扩散模型", "source": "X：Thariq (@trq212)", "sourceUrl": "https://x.com/trq212/status/2089415712007938315", "date": "2026-08-17T18:14:59.000Z", "summary": "最近所有的程序化生成艺术、视频编辑和3D游戏演示，让我更新了看法--LLM编码模型在大量创意工作上比扩散模型更出色。", "type": "tip", "relTime": "1周前"}, {"id": 105, "title": "Menlo 旗下 Wispr Flow 与 Higgsfield 双双完成巨额融资", "source": "X：Deedy Das (@deedydas)", "sourceUrl": "https://x.com/deedydas/status/2089398673230938591", "date": "2026-08-17T17:07:17.000Z", "summary": "Menlo Ventures 宣布旗下两家公司完成巨额融资：语音听写应用 Wispr Flow 融资 2.8 亿美元，估值 20 亿美元，年同比增长约 40 倍，累计听写超 600 亿词；AI 视频生成公司 Higgsfield 融资 4 亿美元，估值 54 亿美元，年化收入 12 个月内从 2000 万美元增至 7 亿美元。Menlo 强调应用层制胜关键在于极致产品力、增长、留存与变现。", "type": "industry", "relTime": "1周前"}, {"id": 106, "title": "中国科技周报：DeepSeek V4 Pro 发布与机器人维修业兴起", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2089377433208164477", "date": "2026-08-17T15:42:53.000Z", "summary": "DeepSeek 正式发布 V4 Pro，基准测试较预览版显著提升，同时大幅涨价使旗舰定价接近主要竞品。本周中国科技周报还聚焦人形机器人维修业兴起、AI 视频生成生态（如 Seedance 2.5 和 MiniMax H3）的商业化，以及苹果与阿里合作训练中文 LLM 等动态。", "type": "industry", "relTime": "1周前"}, {"id": 107, "title": "Waymo 与 Tesla 自动驾驶技术路线对比", "source": "ByteByteGo（RSS）", "sourceUrl": "https://blog.bytebytego.com/p/waymo-vs-tesla-two-ways-to-build", "date": "2026-08-17T15:30:56.000Z", "summary": "Waymo 与 Tesla 采用截然不同的自动驾驶技术路线。Waymo 第六代系统配备 13 个摄像头、4 个激光雷达、6 个雷达及外部音频接收器，覆盖 500 米范围；Tesla 则坚持纯视觉方案。截至 2026 年 3 月，Waymo 累计 2.206 亿英里无人驾驶里程，而 Tesla 在美国有超 300 万辆车、128 万活跃 FSD 订阅。", "type": "tip", "relTime": "1周前"}, {"id": 108, "title": "字节跳动与美国电影协会签署协议，加强 AI 模型版权保护", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/847.htm", "date": "2026-08-17T15:06:14.000Z", "summary": "字节跳动与美国电影协会（MPA）签署协议，加强 AI 视频与图像生成模型的版权保护。协议涵盖 Seedance 视频生成模型和 Seedream 图像生成模型，二者通过 TikTok、CapCut 和 Dreamina 等应用提供服务。字节表示，新版本 Seedance 和 Seedream 已加入更强的知识产权保护机制，双方将随 AI 发展继续完善版权防护。", "type": "industry", "relTime": "1周前"}, {"id": 109, "title": "GPT-5.6 Sol 是 OpenAI 迄今最强的视觉模型", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://blog.roboflow.com/openai-gpt-5-6", "date": "2026-08-17T14:29:55.280Z", "summary": "OpenAI 上周发布 GPT-5.6 系列（Sol、Terra、Luna），第三方基准测试显示 Sol 是其迄今最强视觉模型。Sol 目标检测达 46.2 mAP@50，远超 GPT-5.5 的 13.8；计数准确率 73.0%，较 GPT-5.5 的 64.9% 明显提升。", "type": "tip", "relTime": "1周前"}, {"id": 110, "title": "AI 如何重新定义艺术与创作门槛", "source": "X：小北 (@frxiaobei)", "sourceUrl": "https://x.com/frxiaobei/status/2089349801020457420", "date": "2026-08-17T13:53:05.000Z", "summary": "AI 同时抹平了文字、绘画、音乐、视频、3D 乃至虚拟世界的生产门槛，把过去属于少数专业创作者的表现能力大规模发给普通人。当画面、文字、声音、角色甚至世界本身都不再稀缺，艺术竞争将从\"谁做得更好\"转向\"谁能提出一种以前不存在的表达\"。AI 真正应催生的，是一种今天还没有名字、甚至不知该如何欣赏的新艺术形态。", "type": "tip", "relTime": "1周前"}, {"id": 111, "title": "AI视频市场已从Sora的失败开局中反弹，形成新产业", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/ai-video-market-has-bounced-back-from-soras-false-start", "date": "2026-08-17T13:29:01.000Z", "summary": "AI视频市场已从Sora的失败开局中反弹，形成涵盖投资者、商业模式和发行冲突的新产业。好莱坞AI工作室Promise正拍摄低成本恐怖片《Touch Grass》，使用中国模型Seedance 2.5实时生成背景，其联合创始人称混合制作比传统电影便宜20%至50%；Netflix称到2026年将在1000部作品中的300部使用AI。", "type": "tip", "relTime": "1周前"}, {"id": 112, "title": "Anthropic 详解 Claude 隐形文本水印如何运作", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/980869/anthropic-claude-watermarks-synthid-text-system", "date": "2026-08-17T10:57:13.000Z", "summary": "Anthropic 为遵守欧盟《人工智能法案》透明度要求，将采用 Google DeepMind 开源 SynthID-Text 技术的\"一个版本\"为 Claude 生成文本添加隐形水印。该水印利用低风险词汇选择的随机性模式标记内容，读者无感但持有密钥者可检测，且不会增加用户成本或影响输出质量。Anthropic 同时为 Claude 处理的图片引入 C2PA 支持。", "type": "industry", "relTime": "1周前"}, {"id": 113, "title": "第二届世界人形机器人运动会模拟消防救援比赛：23支队伍参赛，仅3支完成全部挑战", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/768.htm", "date": "2026-08-17T10:05:41.000Z", "summary": "8月16日，第二届世界人形机器人运动会在北京举行模拟消防救援比赛，23支队伍参赛，重点检验机器人在复杂现实环境中的实际作业能力。每台机器人需在30分钟内完成识别危险物质、关闭阀门和扑灭火源三项任务，当日12支参赛队伍中仅3支完成全部挑战。比赛暴露出降雨、光线变化和室外条件对视觉识别与机械操作的干扰，遥操作和全向轮等方案仍被部分队伍采用。", "type": "industry", "relTime": "1周前"}, {"id": 114, "title": "PixVerse 启动全球 AI 电影人竞赛 PixLight", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse/status/2089254416931258792", "date": "2026-08-17T07:34:04.000Z", "summary": "PixVerse 推出面向全球 AI 电影人、编剧和视觉叙事者的竞赛 PixLight，以故事性为首要评审标准，总奖金池 30 万美元、共 33 个奖项。赛事设 Pilot（3-20 分钟成片）与 Script（完整剧本+视频推介）两条赛道，覆盖剧情、科幻、惊悚三大方向，参赛者保留作品全部所有权。报名 2026 年 8 月 7 日开启，10 月 9 日截止，全球免费开放。", "type": "industry", "relTime": "1周前"}, {"id": 115, "title": "inclusionAI 开源 ConceptEdit：基于概念缩放与密集监督的图像编辑数据生成管线", "source": "蚂蚁 inclusionAI：GitHub 新仓库", "sourceUrl": "https://github.com/inclusionAI/ConceptEdit", "date": "2026-08-17T07:22:08.000Z", "summary": "蚂蚁集团 inclusionAI 开源 ConceptEdit，一个基于概念缩放与密集监督的图像编辑数据生成管线。该管线通过三阶段流程（VLM 生成指令、FLUX 执行编辑、VQA 评估筛选）构建大规模、基于分类法的图像编辑数据集，并提供单概念与多概念两种变体。项目采用 MIT 许可证，支持断点续跑，需 OpenAI 兼容 VLM 端点与本地 FLUX 检查点。", "type": "model", "relTime": "1周前"}, {"id": 116, "title": "国家统计局：前 7 个月我国工业机器人产量同比增长 28.5%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/641.htm", "date": "2026-08-17T07:16:32.000Z", "summary": "国家统计局新闻发言人付凌晖在国新办发布会上表示，今年 1 至 7 月份我国工业机器人产量同比增长 28.5%，3D 打印设备、锂离子电池产量同比分别增长 52.3%、40.2%。同期全国规模以上工业增加值同比增长 5.3%。IDC 数据显示，2025 年中国工业具身智能机器人市场规模约 57.4 亿元，其中以工业机器人为载体的具身智能应用市场规模约 36.2 亿元。", "type": "industry", "relTime": "1周前"}, {"id": 117, "title": "AI 视频生成平台 Higgsfield 融资 4 亿美元，估值达 54 亿美元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/588.htm", "date": "2026-08-17T04:27:29.000Z", "summary": "AI 视频生成平台 Higgsfield 从 DST Global、高盛、英特尔等投资者处筹集 4 亿美元，估值达 54 亿美元。该公司年化收入已从一年前的 2，000 万美元增至今年 8 月的 7 亿美元，全球用户超 3000 万。本轮融资将用于拓展企业订阅业务、加大算力建设，并帮助品牌利用 AI 每天制作多条营销视频。", "type": "industry", "relTime": "1周前"}, {"id": 118, "title": "MiniMax H3 本地生成水獭视频，质量飞跃", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2089185499197911391", "date": "2026-08-17T03:00:12.000Z", "summary": "Ethan Mollick 用开源权重视频生成模型 MiniMax H3 在本地电脑上生成了一段带声音的水獭用笔记本视频，耗时约 3 分钟。他对比两年前指出，虽仍不及 SOTA 文生视频，但完全离线运行是全新能力，进步迅速。", "type": "tip", "relTime": "1周前"}, {"id": 119, "title": "MiniMax H3 在 PixVerse 中打造电影级预告片", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse/status/2089182609746133178", "date": "2026-08-17T02:48:43.000Z", "summary": "PixVerse 展示 MiniMax H3 模型能力，用户 @MonetizationDon 用它制作了《THE DRAGON RIDER》电影级预告片。该片融合街头时尚、功夫、未来滑板与金龙元素，并加入 3D 字体、霓虹广告牌等动态排版效果，凸显 H3 在视觉叙事与特效生成上的表现。", "type": "tip", "relTime": "1周前"}, {"id": 120, "title": "PixVerse 展示 MiniMax H3 电影级预告片效果", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2089182609746133178", "date": "2026-08-17T02:48:43.000Z", "summary": "PixVerse 官方分享了一段用 MiniMax H3 生成的电影预告片《THE DRAGON RIDER》，展示该模型在视频生成上的能力。预告片融合街头时尚、功夫、未来滑板与金龙元素，并包含 3D 字体、霓虹招牌、速度变奏等电影级镜头效果。", "type": "tip", "relTime": "1周前"}, {"id": 121, "title": "Seedance 2.5 登顶 Design Arena 多图生视频", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2089177550895673393", "date": "2026-08-17T02:28:37.000Z", "summary": "Seedance 2.5 在 Design Arena 多图生视频榜单以 1400 Elo 排名第一，大幅领先其他顶级模型。开源模型 MiniMax H3 以 1355 Elo 位列第二，为最佳开源视频模型。该榜单测试模型融合多张参考图并保持主体、风格与场景连贯性的能力，更贴近真实生产流程。", "type": "tip", "relTime": "1周前"}, {"id": 122, "title": "OpenRouter 图像生成 API：代码优先的接入教程", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/tutorials/image-generation", "date": "2026-08-17T00:00:00.000Z", "summary": "OpenRouter 推出专用图像生成 API，通过统一请求格式和单一密钥即可调用多个提供商的图像模型。开发者向 POST /api/v1/images 发送请求，响应中的 data【0】.b64_json 包含 base64 编码的图像数据，解码后即可保存为本地文件。教程演示了 Python 和 JavaScript 两种实现，并支持通过 input_references 传入参考图像生成变体。", "type": "model", "relTime": "1周前"}, {"id": 123, "title": "StreamOPD：面向流式视频理解的后训练方案与时空线索门控", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.16320", "date": "2026-08-17T00:00:00.000Z", "summary": "StreamOPD 提出免推理时记忆的后训练方案，将 StreamingBench 从 77.9% 提升至 83.9%，距 9B 教师模型仅差 0.3 个百分点。其扩展模块 ST-CueGate 在 OVO-Bench（排除幻觉检测子任务）和 Video-MME 上分别达 71.9% 和 64.9%，是唯一在所有四项基准上均高于基础模型的变体。", "type": "paper", "relTime": "1周前"}, {"id": 124, "title": "即插即用的2D运动接口：让真实世界运动语言模型无需微调即可工作", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.15984", "date": "2026-08-17T00:00:00.000Z", "summary": "研究团队提出一种即插即用的2D运动接口，使3D预训练的运动语言模型（MoLMs）无需修改或微调即可接受2D运动输入。在公开数据集上，该方法在多个MoLMs上达到与3D运动输入相当的性能，并优于从头训练2D运动的模型。团队还构建了单目真实世界视频运动评估数据集并引入真实视频适配器，证明在单目姿态估计场景下2D运动比3D运动更具实用性。", "type": "paper", "relTime": "1周前"}, {"id": 125, "title": "TRACE-Bench：分解与诊断多参考图像生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.16765", "date": "2026-08-17T00:00:00.000Z", "summary": "TRACE-Bench 将多参考图像生成任务形式化为 Anchor、Disentangle、Apply、Compose 四种原子操作，并据此构建约 1，600 个评测案例（覆盖 1-8 个操作槽位，源自 631 个公式模板与约 4，000 张参考图）。对 9 个领先模型的评测显示，主要瓶颈在于解耦与属性绑定而非场景级组合，最佳模型属性保真度得分仅 0.74。", "type": "paper", "relTime": "1周前"}, {"id": 126, "title": "AnyTalk：利用视频生成模型为任意角色生成3D语音动画", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.16143", "date": "2026-08-17T00:00:00.000Z", "summary": "AnyTalk提出一种无需动画数据即可为任意角色生成3D语音动画的新方法，通过Character-specific Fine-tuning（CsF）技术将预训练视频扩散模型适配至目标角色，再经优化过程估计blendshape参数，将说话头视频提升为3D语音动画。该方法支持多种面部网格和blendshape配置，显著降低人工与数据需求。蒸馏版AnyTalk_{RT}可实现实时性能，代码已公开。", "type": "paper", "relTime": "1周前"}, {"id": 127, "title": "像素空间文生图扩散模型训练实证研究：潜空间到像素空间策略带来 3.18-4.75 倍推理加速", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.16887", "date": "2026-08-17T00:00:00.000Z", "summary": "一项实证研究发现，像素空间扩散模型直接大规模预训练收敛速度远慢于潜空间模型，由此提出\"潜空间到像素空间\"策略：先在潜空间高效获取生成先验，再在后训练阶段转向像素空间。该策略结合权重初始化、数据构成、预测目标、解码器架构与噪声调度等设计选择，使像素空间模型达到或超越潜空间模型，并实现 3.18 至 4.75 倍的端到端推理加速。", "type": "paper", "relTime": "1周前"}, {"id": 128, "title": "GenRouter：面向智能体图像生成的统一工作流路由框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.16721", "date": "2026-08-17T00:00:00.000Z", "summary": "GenRouter 提出首个面向智能体图像生成的统一工作流路由框架，将多样化智能体管线标准化为通用原语与可执行模板，并通过需求分析、经验匹配和 Pareto 过滤将异构提示词自适应路由至最优工作流。实验显示，相比重型静态管线，GenRouter 在保持视觉对齐的同时将执行成本降低超 95%、延迟降低 65%，并借助累积经验实现零样本泛化，性能提升且计算开销减半。", "type": "paper", "relTime": "1周前"}, {"id": 129, "title": "DiSCO：通过分布引导的对比提示优化防御文本到图像生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17067", "date": "2026-08-17T00:00:00.000Z", "summary": "DiSCO 提出一种零样本、严格黑盒的防御方法，完全在提示词层面运行，无需模型重训练、微调或访问内部结构。该方法通过束搜索进行分布引导的后缀扩展，并利用目标模型自身生成的图像池进行对比评分和迭代反馈，直至生成安全内容。在 I2P 基准上，DiSCO 在多种红队攻击下分别将未防御和已防御模型的 ASR 降低 37.7% 和 25.13%，同时保持语义保真度。", "type": "paper", "relTime": "1周前"}, {"id": 130, "title": "PixRestore：基于像素扩散 Transformer 的统一图像修复", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.16793", "date": "2026-08-17T00:00:00.000Z", "summary": "PixRestore 提出一种免 VAE 的像素扩散 Transformer（DiT），用于统一图像修复，无需 T2I 预训练。该方法利用 DINO 分层特征与自适应层路由提供密集条件引导，并通过 DINO 对抗目标将多步模型微调为单步生成器。仅约 50M 参数、单步推理约 44 ms，PixRestore 在扩散类方法中取得最佳修复质量与最高效率。", "type": "paper", "relTime": "1周前"}, {"id": 131, "title": "τ_0-VLA：用世界模型引导测试时计算的分层机器人基础模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.16885", "date": "2026-08-17T00:00:00.000Z", "summary": "τ_0-VLA 将高层子任务生成构建为可通过世界模型引导的测试时计算扩展的推理问题，在每次推理时用执行记忆生成子任务，必要时搜索备选方案，再由低层策略跨多机器人本体执行。该策略在 40，115 小时异构真实世界数据上训练并采用多模态协同训练。额外分配测试时计算可显著提升下一子任务预测准确率，并转化为长程操作任务中更高的闭环成功率。", "type": "paper", "relTime": "1周前"}, {"id": 132, "title": "网传\"深圳道路大面积塌陷致翻车\"系 AI 合成谣言，深圳市委网信办确认", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/423.htm", "date": "2026-08-16T23:34:20.000Z", "summary": "深圳市委网信办核查确认，网传\"深圳滨海大道巨大面积塌陷致车辆翻车\"视频系 AI 生成并拼接其他路面塌陷画面而成，与实际情况严重不符。8 月 4 日当地确发生超 10 立方米的路面塌陷，但无网传翻车画面，相关视频已被下架删除。有关部门提醒网民仔细甄别 AI 生成画面，不信谣不传谣。", "type": "industry", "relTime": "1周前"}, {"id": 133, "title": "SeedDance 2.5 三提示词生成惊艳AI视频", "source": "X：Ammaar Reshi (@ammaar)", "sourceUrl": "https://x.com/ammaar/status/2089082508612673897", "date": "2026-08-16T20:10:57.000Z", "summary": "我用 @runwayml 的 SeedDance 2.5 只用了 3 个提示词就完成了这个。  AI 视频在这么短的时间内取得的飞跃，简直不可思议！", "type": "tip", "relTime": "1周前"}, {"id": 134, "title": "PhotoScan：用智能手机照片估算胰岛素抵抗，精度接近DXA", "source": "Google Research：Blog（网页）", "sourceUrl": "https://research.google/blog/seeing-beyond-bmi-estimating-cardiometabolic-risk-with-smartphone-imagery", "date": "2026-08-16T16:00:00.000Z", "summary": "Google Research 推出 PhotoScan，一种从智能手机 2D 照片直接估算三维身体成分的深度学习框架，可预测胰岛素抵抗，在临床研究中精度接近 DXA 扫描。", "type": "paper", "relTime": "1周前"}, {"id": 135, "title": "Deedy Das 推出情绪生成沉浸式体验网站", "source": "X：Deedy Das (@deedydas)", "sourceUrl": "https://x.com/deedydas/status/2089014375973900344", "date": "2026-08-16T15:40:13.000Z", "summary": "做了个小网站，输入一种\"情绪\"，就能生成一整套体验：歌曲播放列表、环境音和循环视频背景。  以下是我做的头 4 个： - Haight：旧金山的爱之夏 - Mussoorie 【2：22】：山间的 Ruskin Bond 之夜 - Baarish 【3：19】：季风时节的加尔各答 - Mehfil 【5：00】：Nizammudin 的 Qawalli 之夜  只需说出你当下的感觉，投屏到电...", "type": "paper", "relTime": "1周前"}, {"id": 136, "title": "第二届世界人形机器人运动会赛前冲刺：家政赛要求30分钟内完成收纳叠衣，大模型助力持续学习", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/389.htm", "date": "2026-08-16T13:52:16.000Z", "summary": "第二届世界人形机器人运动会将于8月22日在北京\"冰丝带\"开幕，51个项目共1301场比赛，666支队伍、2056台机器人参赛。家政场景赛中，机器人需在30分钟内完成物品收纳、衣物折叠等任务，赛队通过五种数据训练大模型，并开发\"终身学习机制\"应对关节磨损。福建队\"福智\"采用3D打印轻量化轮臂结构，搭载自研具身智能大模型，已在福州地铁站开展实境测试。", "type": "industry", "relTime": "1周前"}, {"id": 137, "title": "Grok版视频生成对比Seedance 2.5动作效果", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2088936060784902508", "date": "2026-08-16T10:29:02.000Z", "summary": "博主对比测试发现，Grok制作的视频版本在动作类效果上仍逊于Seedance 2.5，但极具Grok特色，会主动呈现主体人物性感的一面。此前博主用Seedance 2.5将AIGC美女图转为视频，8段画面动作与运镜全程丝滑不漂移，带来\"迟到二十年的补偿感\"。", "type": "tip", "relTime": "1周前"}, {"id": 138, "title": "全国首家 AI 家庭机器人旗舰店落地青岛，海尔外骨骼机器人可现场试穿", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/337.htm", "date": "2026-08-16T09:50:27.000Z", "summary": "海尔智家全国首家 AI 家庭机器人体验店今日落地青岛，用户可现场试穿外骨骼机器人并做步态检测与一对一精准调试。店内还提供烹饪、家务、清洁、陪伴机器人的沉浸式体验。海尔今年 5 月曾推出全球最轻 AI 运动外骨骼机器人 W3，采用全碳纤维+钛合金设计，1.75kg 超轻机身，单腿最大助力 16N·m，减负约 5kg。", "type": "industry", "relTime": "1周前"}, {"id": 139, "title": "Seedance 2.5 视频生成：迟来二十年的补偿感", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2088845636355440754", "date": "2026-08-16T04:29:43.000Z", "summary": "博主用 Seedance 2.5 将 AIGC 美女图转为视频，8 段画面动作与运镜一气呵成，全程不漂移，体验丝滑。其感叹 AI 让儿时想象直接成真，带来\"迟到了二十年的补偿感\"。引用推文称 Seedance 2.5 尺度比 2.0 开放，且能过审。", "type": "tip", "relTime": "1周前"}, {"id": 140, "title": "女子加入针对 SpaceXAI 的诉讼：继父利用 Grok 将其 11 岁照片加工成 7000 多张色情图像", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/221.htm", "date": "2026-08-16T00:13:02.000Z", "summary": "一名化名\"简·多伊 4 号\"的女性加入美国田纳西州三名青少年对 SpaceXAI 的诉讼，指控其继父利用 Grok 将她 11 岁时的一张照片加工成 7000 多张露骨性虐待图像。执法部门查获图像两天后，其继父自杀身亡。原告方指控 SpaceXAI 未采取基础防护措施阻止 Grok 生成含未成年人的真人露骨图像，并正申请将该案列为集体诉讼。", "type": "industry", "relTime": "1周前"}, {"id": 141, "title": "超越视觉思维链：面向主动视频推理的内化视觉思维", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.15869", "date": "2026-08-16T00:00:00.000Z", "summary": "新提出的IVT后训练框架在无标注视频上联合优化文本预测与下一嵌入预测，使模型推理时直接生成答案，无需合成或重编码未来帧。相比显式视觉CoT，IVT性能相当或更优，端到端延迟平均降低5倍以上，并在全部六项评测设置上优于直接答案微调。", "type": "paper", "relTime": "1周前"}, {"id": 142, "title": "WorldRover：面向世界探索的可扩展合成视频数据引擎", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.15659", "date": "2026-08-16T00:00:00.000Z", "summary": "WorldRover 是一个生成富含标注的长程世界探索视频的数据引擎，其核心 WorldRover-Engine 基于 Unreal Engine 离线渲染分钟级路线，保留完整轨迹与场景几何，并支持第一人称、第三人称及 360 全景视角重放。", "type": "paper", "relTime": "1周前"}, {"id": 143, "title": "女子指控继父用 Grok 将童年照片转为露骨图像并加入诉讼", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/15/woman-claims-her-stepfather-used-grok-to-transform-childhood-photo-into-explicit-imagery", "date": "2026-08-15T21:29:19.000Z", "summary": "一位化名 Jane Doe 4 的女子加入三名田纳西州青少年对 xAI 的诉讼，指控其继父用 Grok 将她 11 岁时的照片制造成 7，000 多张露骨图像。继父在警方搜查发现图像两天后自杀身亡。诉讼指控 xAI 未采取基本预防措施防止 Grok 生成涉及未成年人的真实人物露骨图像，并寻求集体诉讼资格。", "type": "industry", "relTime": "1周前"}, {"id": 144, "title": "Anthropic 详解 Claude 新水印机制：如何运作、能否被编辑隐藏及对代码的影响", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/15/anthropic-shares-more-details-about-how-claudes-new-watermarks-will-work", "date": "2026-08-15T18:58:39.000Z", "summary": "Anthropic 发布博客文章，详解其聊天机器人 Claude 文本水印的运作方式。该水印采用 Google DeepMind 2024 年提出的 SynthID-Text 方法，并计划推出水印检测 API。Anthropic 称水印不影响输出质量，轻度编辑可能无法完全去除水印，而代码因需保证可运行，水印影响甚微。此举是为遵守欧盟 AI 法案透明度规范。", "type": "product", "relTime": "1周前"}, {"id": 145, "title": "埃森·莫里克呼吁专家用AI视频还原历史", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2088685078519959776", "date": "2026-08-15T17:51:43.000Z", "summary": "埃森·莫里克呼吁历史学家、生物学家、物理学家等专家使用AI视频，直接向公众展示恐龙时代、木卫一表面、古罗马等缺乏准确影像的场景。他以自己用Google Deep Research生成提示词、让Veo 3描述罗德岛巨像的实验为例，说明AI视频能让专家直接呈现历史。", "type": "tip", "relTime": "1周前"}, {"id": 146, "title": "Suno Studio 2.0 发布：新增 MIDI 支持、效果插件，向 DAW 靠拢", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/190.htm", "date": "2026-08-15T15:28:28.000Z", "summary": "Suno 推出 Studio 2.0，新增 MIDI 支持，用户可将 MIDI 数据直接交给 AI 生成音频或续写旋律，但暂只能使用自带合成器。聊天机器人已整合进 Studio 界面，可读取工程内容创作歌词或生成吉他声部，并自动添加混响、压缩和 EQ。用户还能通过 AI 创建自定义效果插件，生成的效果会保存在账户中供后续调用。", "type": "paper", "relTime": "1周前"}, {"id": 147, "title": "AI生成书籍正淹没亚马逊，并拉低人类作者的单书收入", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/ai-generated-books-are-flooding-amazon-and-tanking-sales-for-human-authors", "date": "2026-08-15T11:00:50.000Z", "summary": "一项对14，419本自出版电子书的分析显示，AI生成书籍正以数量而非质量挤占人类作者市场，即便未检测到AI文本的书籍，单书收入也在下滑。2023年Q1至2026年Q1，书目总量增长38.3倍，而季度收入仅增长8.9倍；在八个类型中，七个类型的无AI文本书籍单书收入下降。", "type": "paper", "relTime": "1周前"}, {"id": 148, "title": "Gemini 新增关闭可见水印选项", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2088567338329067921", "date": "2026-08-15T10:03:51.000Z", "summary": "ICYM 👀： Gemini 用户现可关闭图片、视频和歌曲的可见水印。在法律要求必须保留水印的国家/地区，该设置不可用。  SymnthID 仍将保留 🤖", "type": "paper", "relTime": "1周前"}, {"id": 149, "title": "Seedance 2.5 尺度更开放，Grok 视频更便宜", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2088552686832472522", "date": "2026-08-15T09:05:38.000Z", "summary": "Seedance 2.5 审核尺度比 2.0 更开放，生成内容能过审。引用推文称 Grok 生成的 15 秒男友视角视频质量可与 Seedance 一拼，且价格至少便宜 3 倍。", "type": "tip", "relTime": "1周前"}, {"id": 150, "title": "Claude 文本水印上线，翻译文本将被标记为 AI 生成", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2088545436139168231", "date": "2026-08-15T08:36:49.000Z", "summary": "Anthropic 为 Claude 引入文本水印以符合欧盟 AI 法案，该水印不影响输出质量、不增加 token 成本，且无法被读者察觉。用户用 Claude 翻译文本将被检测器标记为 AI 生成，对大学生等群体影响严重。", "type": "industry", "relTime": "1周前"}, {"id": 151, "title": "Grok 生成男友视角视频，比 Seedance 便宜 3 倍", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2088532122139070943", "date": "2026-08-15T07:43:55.000Z", "summary": "博主称 Grok 生成的 15 秒男友视角视频与 Seedance 2.5 效果相当，且一次生成、零抽卡，价格至少便宜 3 倍。其认为目前视频大模型中仅 Grok 能与 Seedance 一战。", "type": "tip", "relTime": "1周前"}, {"id": 152, "title": "World Labs 推出 R2S2R 仿真引擎，将单个真实机器人任务转化为数千种模拟变体", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/world-labs-turns-one-real-world-robot-task-into-thousands-of-simulated-variations-for-training", "date": "2026-08-15T07:30:48.000Z", "summary": "World Labs 发布\"Real-to-Sim-to-Real\"（R2S2R）仿真引擎，在虚拟环境中训练机器人控制系统，随后可在真实硬件上稳定运行数小时。该技术源自其 7 月收购的 SceniX，可将单个真实任务生成数千种受控变体，用于策略训练与评估。据 World Labs，模型在 ALOHA 等五个平台上各运行一小时无需人工干预，且模拟与真实环境中的模型排名基本一致。", "type": "model", "relTime": "1周前"}, {"id": 153, "title": "谷歌 Gemini 将推 Media Watermark 设置：可关闭 AI 生成图片/视频/音乐的可见水印", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/997.htm", "date": "2026-08-15T01:29:18.000Z", "summary": "谷歌预告未来几天为 Gemini 新增 Media Watermark 设置，用户可关闭图像、视频和音乐作品的可见水印。该选项位于左侧栏\"设置\"菜单倒数第 3 项，提供\"On\"和\"Off\"两个选项。关闭可见水印后，AI 生成内容仍保留 SynthID 隐形水印与 C2PA 元数据。", "type": "paper", "relTime": "1周前"}, {"id": 154, "title": "MOSS-VL技术报告：将实时交互作为一等能力的开源视觉语言模型家族", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.15045", "date": "2026-08-15T00:00:00.000Z", "summary": "MOSS-VL是一个将实时交互（边感知边说话）作为一等能力的开源视觉语言模型家族，通过门控交叉注意力让语言解码器在生成时同步处理视觉输入。MOSS-VL-Realtime在四个流式基准中平均成绩居开源模型之首（三项第一、一项第二），在OmniMMI Proactive Alerting上以66.0分大幅领先最佳基线（37.5分）。", "type": "model", "relTime": "1周前"}, {"id": 155, "title": "VibeWorlding：多模态智能体能否端到端构建 3D 开放世界？", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.15265", "date": "2026-08-15T00:00:00.000Z", "summary": "VibeWorlding 提出统一框架，用于基准测试和训练能自主推断用户意图、规划场景布局、调用 3D 工具并反思多模态反馈的\"vibe worlding\"智能体。", "type": "paper", "relTime": "1周前"}, {"id": 156, "title": "Gemini 3.7 Flash 配 Nano Banana 2 Lite 生成艺术图", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2088396528469545337", "date": "2026-08-14T22:45:07.000Z", "summary": "fofr 展示了一组由 Gemini 3.7 Flash 配合 Nano Banana 2 Lite 生成的精选艺术作品。示例提示词描绘黄昏时分巨型飞机低空掠过跑道的极简画面，体现该组合在图像生成上的表现力。", "type": "tip", "relTime": "1周前"}, {"id": 157, "title": "Anthropic 推出水印检测 API，第三方可识别 Claude 生成的文本", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/anthropic-announces-watermark-detection-api-that-will-let-third-parties-detect-claudes-ai-texts", "date": "2026-08-14T21:29:17.000Z", "summary": "Anthropic 将推出水印检测 API，让第三方开发者能将 AI 文本检测集成到自有应用中。该水印基于 Google DeepMind 2024 年发表于 Nature 的 SynthID Text 方法变体，通过调整选词时的随机源留下可追踪模式，且不影响文本内容、创意性或可读性。", "type": "product", "relTime": "1周前"}, {"id": 158, "title": "Claude 文本水印机制：密钥掷硬币检测 AI 生成", "source": "X：马东锡 NLP (@dongxi_nlp)", "sourceUrl": "https://x.com/dongxi_nlp/status/2088351263453065675", "date": "2026-08-14T19:45:15.000Z", "summary": "马东锡 NLP 解析 Claude 的 SynthID-Text 水印机制：模型前向传播后，对每个候选 token 进行一次带密钥的上下文相关\"掷硬币\"更新，再采样生成。持有密钥者可检测该统计模式。Anthropic 称此举为遵守欧盟 AI 法案，不影响输出质量、不增加成本，且水印无法追溯到具体个人或对话。", "type": "tip", "relTime": "1周前"}, {"id": 159, "title": "MiniMax 将亮相 ModCon 分享 H3 视频生成", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2088332365676580938", "date": "2026-08-14T18:30:09.000Z", "summary": "MiniMax 美国业务负责人 Morgan Suo 将于 8 月 18 日在旧金山 ModCon 大会分享 H3 如何改变 AI 视频生成。H3 从设计之初就注重硬件兼容性，并已开源权重，可在多种芯片上运行。", "type": "industry", "relTime": "1周前"}, {"id": 160, "title": "小红书开源生活智能体模型 dots3-note", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2088326336012075060", "date": "2026-08-14T18:06:12.000Z", "summary": "小红书（RedNote）开源大语言模型 dots3-note preview，主打长时程生活智能体场景。该模型为 280B MoE、16B 激活参数，512K 上下文窗口，支持文本、视觉、音频多模态，并引入针对长时任务 RL 训练的新方法 TEMPO。模型权重与两个生活智能体基准 VibeSearchBench、VibeLifeBench 已在 Hugging Face 开源。", "type": "model", "relTime": "1周前"}, {"id": 161, "title": "中国为何赢下AI视频竞赛：生态而非模型", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2088307079853621342", "date": "2026-08-14T16:49:41.000Z", "summary": "字节跳动Seedance 2.5与MiniMax H3同日发布，中国厂商占据Artificial Analysis文生视频榜单前十中的九席。OpenAI退出Sora独立视频业务，因缺乏内容平台生态和付费循环，而Sora推理成本曾被估约每日1500万美元。中国创作者通过短视频平台付费生成内容，形成支撑模型迭代的商业闭环。", "type": "tip", "relTime": "1周前"}, {"id": 162, "title": "Gemini 与 Flow 可选关闭可见 AI 水印", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2088306032934322456", "date": "2026-08-14T16:45:31.000Z", "summary": "Google 在 Gemini 和 Flow 中让可见 AI 水印变为可选关闭，同时保留不可见的来源信号。Nano Banana 图片、Omni 视频和 Lyria 音乐可关闭可见水印，但 SynthID 隐形水印与 C2PA 溯源数据仍会保留，以便识别 AI 生成内容。该功能适用于所有媒体，法律要求保留水印的国家除外。", "type": "paper", "relTime": "1周前"}, {"id": 163, "title": "Google Gemini 现可关闭可见水印", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/980416/google-gemini-ai-watermarks-removal", "date": "2026-08-14T16:39:32.000Z", "summary": "Google 更新 Gemini 与 AI 视频生成器 Flow，新增\"Media watermark\"设置，关闭后生成的图片、视频和音乐将不再带有右下角的\"sparkle\"可见水印。但 AI 内容仍会嵌入不可见的 SynthID 水印和 C2PA 元数据，用户可通过 Gemini 或 Search 验证内容是否由 AI 生成。该设置后续将推广至 Search，但不会在要求可见水印的国家上线。", "type": "paper", "relTime": "1周前"}, {"id": 164, "title": "Google 允许用户移除 AI 生成内容的可见水印", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/14/google-will-now-allow-users-to-remove-visible-watermark-from-its-ai-generations", "date": "2026-08-14T16:13:40.000Z", "summary": "Google 于本周五宣布，将允许用户移除其 AI 生成内容（包括图片、视频和歌曲）上的可见水印，该功能不影响不可见的 SynthID 水印和 C2PA 元数据。此开关将适用于 Nano Banana、Omni 和 Lyria 模型，可在 Gemini 和视频编辑器 Flow 中使用，搜索支持即将推出。Google 同时开源了新库 Credentio，帮助开发者在应用中嵌入本地验证机制。", "type": "model", "relTime": "1周前"}, {"id": 165, "title": "Qwen3.8-27B 本地运行 Opus 4.6 Max 级能力", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2088295804108783728", "date": "2026-08-14T16:04:53.000Z", "summary": "Qwen 发布 Qwen3.8-27B 紧凑开源多模态模型，仅 27B 参数即在智能体编码、计算机使用等基准上超越 Claude Opus 4.6 Max。支持图像、视频、可配置推理，原生 262K 上下文窗口可扩展至 1M，Apache 2.0 许可可自托管。基准结果为 Qwen 自测，尚待独立验证。", "type": "model", "relTime": "1周前"}, {"id": 166, "title": "Gemini 应用新增关闭视觉水印选项", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2088292414549070228", "date": "2026-08-14T15:51:24.000Z", "summary": "提醒一下，如果你在用 Gemini 应用生成图片、视频或歌曲，现在可以关闭视觉水印（角落里的 ✨）了🙌  这适用于所有图片（Nano Banana）、视频（Omni）和歌曲（Lyria）上的水印，但法律要求保留水印的国家除外。", "type": "paper", "relTime": "1周前"}, {"id": 167, "title": "阿里云推出AI Spotlight系列首期聚焦Qwen3.8-Max", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2088287252116013385", "date": "2026-08-14T15:30:54.000Z", "summary": "我们正在推出AI Spotlight，这是一个深入探讨Qwen模型和AI产品的新系列。第一期：Qwen3.8-Max及其独特之处。  这只是第一期，更多视频即将推出。敬请期待！  在此之前，欢迎前往以下平台查看：  Qwen Cloud： https://click.qwencloud.com/m/20000001102/ Model Studio： https://click.alibab...", "type": "industry", "relTime": "1周前"}, {"id": 168, "title": "新研究证实 AI 生成书籍已挤压人类作者作品市场空间", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/951.htm", "date": "2026-08-14T15:06:49.000Z", "summary": "研究人员分析 2023 年至 2026 年间亚马逊销售的 1.4 万多本电子书，发现含大量 AI 生成文本的图书已多到足以挤压其他图书市场。有销量的图书数量增至原来的 19 倍，但读者总支出仅增至 9 倍，单本平均收入因此减少，未检测出 AI 文本的图书市场份额也在下降。Fairly Trained CEO 称，AI 公司\"不造成经济损失\"的说法已\"彻底站不住脚\"。", "type": "paper", "relTime": "1周前"}, {"id": 169, "title": "Qwen3.8-27B 发布：小模型挑战前沿智能体", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2088280043759780324", "date": "2026-08-14T15:02:15.000Z", "summary": "阿里通义千问发布 Qwen3.8-27B，仅 27B 参数的开源多模态模型，宣称在智能体编程、计算机使用、浏览器任务及长周期专业工作中达到 SOTA，多项基准超越 Claude Opus 4.6 Max。支持图像、视频、可配置推理，原生 262K 上下文窗口可扩展至 1M，Apache 2.0 协议可自托管。基准结果为官方自测，尚待独立验证。", "type": "model", "relTime": "1周前"}, {"id": 170, "title": "Gemini 新增可见水印开关，可随时关闭", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2088277477672255830", "date": "2026-08-14T14:52:03.000Z", "summary": "Gemini 将在未来几天内推出可见水印开关，用户可在设置中自行决定 AI 生成的图片、视频和音乐是否显示可见水印。不可见的 SynthID 水印和 C2PA 元数据将始终保留在后台。该功能适用于所有图片（Nano Banana）、视频（Omni）和歌曲（Lyria），但法律要求保留水印的国家除外。", "type": "paper", "relTime": "1周前"}, {"id": 171, "title": "Pomelli 更新：照片一键转动态视频", "source": "X：Josh Woodward (@joshwoodward, Google Labs VP)", "sourceUrl": "https://x.com/joshwoodward/status/2088261701028503965", "date": "2026-08-14T13:49:22.000Z", "summary": "Google Labs 的 Pomelli 推出模板升级，用户可上传图片或使用预设模板生成社媒与广告视觉素材，并通过 Animate 功能将照片转为短视频或 GIF。该实验项目正吸引越来越多小企业用户，主打简单易用，现可免费试用。", "type": "paper", "relTime": "1周前"}, {"id": 172, "title": "面壁智能 VoxCPM-0.5B 驱动 3D 空手道热狗角色", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2088249288757539092", "date": "2026-08-14T13:00:02.000Z", "summary": "面壁智能 OpenBMB 发布 Karate Wiener 交互式 3D 角色体验，由 VoxCPM-0.5B 模型驱动，支持语音对话、动作生成与个性化道场。该项目为 #BuildSmall 黑客松作品，展示轻量级开源模型在创意角色应用中的协作能力，演示与模型均已上线 HuggingFace。", "type": "model", "relTime": "1周前"}, {"id": 173, "title": "dots3-note Preview 开源：280B 参数轻量模型，主打长程智能体与多模态推理", "source": "公众号：小红书技术（dots.llm）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg4OTc2MzczNg%3D%3D&mid=2247496140&idx=1&sn=5239a5fbb115c58d2ae0056bb32789ff", "date": "2026-08-14T11:25:29.000Z", "summary": "小红书技术开源 dots3-note Preview，这是 dots3 系列最轻量模型，总参数 280B、激活参数 16B，支持 512K 上下文及文本、视觉、语音多模态理解，并针对复杂推理和长程 Agent 任务优化。", "type": "model", "relTime": "1周前"}, {"id": 174, "title": "玉伯推荐 Anthropic 风格插画 Skill", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2088216125549240578", "date": "2026-08-14T10:48:16.000Z", "summary": "玉伯推荐一款 YouMind 新发布的「Anthropic 风格插画」Skill。输入主题即可生成简单、克制、带手绘感的概念插画，适合做文章配图、封面或抽象概念的视觉隐喻。链接：https://youmind.com/skills/anthropic-paper-cut-illustrations-KRTYyHOBadqVOr", "type": "tip", "relTime": "1周前"}, {"id": 175, "title": "RedNote 开源 dots3-note 预览版，280B MoE 智能体模型", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2088194805654323617", "date": "2026-08-14T09:23:33.000Z", "summary": "RedNote 开源 dots3-note Preview，一款 280B MoE 多模态智能体模型，仅 16B 参数同时激活，支持 512K 上下文及文本、图像、视频和音频理解。", "type": "model", "relTime": "1周前"}, {"id": 176, "title": "迈向通用科学 AI：ALD/E-ImageMiner 基准如何推动科学图像理解", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.14075", "date": "2026-08-14T08:34:33.000Z", "summary": "ALD/E-ImageMiner 基准与 ICDAR 2026 科学图表信息提取竞赛提供来自 205 篇论文的 1，951 张图表，经专家标注用于分类、数据表提取、摘要和视觉问答。该视角文章提出将\"从图像中理解科学概念\"作为长期基准目标，未来方向涵盖更广领域与图表类型、跨文档综合、假设评估及可验证的多模态科学 AI。", "type": "paper", "relTime": "1周前"}, {"id": 177, "title": "Uber与Pony.ai扩大Robotaxi合作", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2088178310354227464", "date": "2026-08-14T08:18:00.000Z", "summary": "Uber正在扩大与Pony.ai的robotaxi合作。两家公司计划在欧洲部署2，000辆自动驾驶出租车，并将合作扩展至中东。Uber与Pony.ai于3月在克罗地亚萨格勒布推出了商业robotaxi服务，他们称这是欧洲首个。下一阶段将新增四个欧洲城市，但地点和时间尚未公布。Pony.ai将于周二公布季度财报。", "type": "industry", "relTime": "1周前"}, {"id": 178, "title": "DeepSeek Harness 实测：灵活切换多模型", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2088161448971075965", "date": "2026-08-14T07:11:00.000Z", "summary": "我们刚测试了 DeepSeek Harness，它比我们预期的更灵活。我们最初以为它又是一个 Claude Code，但 Harness 可以在多个模型之间即时切换，并连接支持视觉的模型，让 DeepSeek 分析图像。其团队将目标描述为\"时间性\"和\"空间性可组合\"：工具可以动态安装、调整和移除，而不会破坏系统。这将是一个为无限扩展而构建、不会频繁崩溃的平台。", "type": "tip", "relTime": "1周前"}, {"id": 179, "title": "Grok 4.6 多模态理解大幅升级", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2088127459971522726", "date": "2026-08-14T04:55:56.000Z", "summary": "Elon Musk 称 Grok 4.6 的图像与视频理解能力是一次重大升级。引用推文指出，Grok 4.6 多模态相较 4.5 是阶跃式改进，在视频审阅等日常工作中可将生产力提升至少 10 倍，甚至 100 倍。该模型在作者的实际用例中超越了 Gemini 3.5 和 Gemma 4。", "type": "model", "relTime": "1周前"}, {"id": 180, "title": "阿里云 Wan 3.0 Beta 用 AI 视频讲述情感故事", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2088104804581355551", "date": "2026-08-14T03:25:55.000Z", "summary": "阿里云发布 Wan 3.0 Beta，主打用 AI 视频模型将破碎片段化为动人叙事，赋能创作者可视化深层情感。示例视频展示\"修心铺\"故事：破碎的心在匠人手中被逐片修复，传递\"破碎的心无需替换，只需关怀\"的主题。用户可通过阿里云 Model Studio 和 Qwen Cloud 体验。", "type": "model", "relTime": "1周前"}, {"id": 181, "title": "Meta/Oxford 研究：多模态预训练仅需 5% 图像生成数据", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2088103654519968190", "date": "2026-08-14T03:21:20.000Z", "summary": "Meta 与牛津大学研究发现，若语言与视觉理解同步训练，多模态模型仅需极少量图像生成数据。1T token 实验中最佳配比为 70% 语言、25% 图像理解、5% 图像生成；13.5B 规模 2T token 测试中，图像生成 token 减少 5 倍，GenEval 仍从 0.467 提升至 0.482。研究还指出过晚引入视觉会导致\"视觉惰性\"，模型倾向依赖语言捷径。", "type": "paper", "relTime": "1周前"}, {"id": 182, "title": "小马智行与优步扩大合作，计划在欧洲 5 城部署超 2000 辆 Robotaxi", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/525.htm", "date": "2026-08-14T01:10:06.000Z", "summary": "小马智行与优步 Uber 扩大战略合作，将在欧洲 5 个城市部署超过 2000 辆小马智行 Robotaxi，并在克罗地亚萨格勒布现有商业化运营基础上扩展。萨格勒布服务即将接入 Uber 平台，用户可通过 Uber App 呼叫车辆。小马智行提供 L4 级自动驾驶技术，Uber 提供出行平台支持，双方还将深化中东合作。", "type": "industry", "relTime": "1周前"}];
var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };
var TYPE_LABELS = { "paper":"论文", "model":"模型", "product":"产品", "tip":"技巧", "industry":"行业" };
function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";
  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();
</script>

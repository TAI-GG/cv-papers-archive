xity CEO Aravind Srinivas 转发用户演示：用户让 Perplexity 为 Sacramento 附近 12 座小屋项目寻找合适地块，Perplexity 调用 @mireyehq API，花 $2.20 发起 31 次 Land Search and Enrich API 请求，按坡度>15%、洪泛区、湿地、保护区等条件将 327 块地筛到 3 块。随后...", "type": "industry", "relTime": "1周前"}, {"id": 11, "title": "谷歌与蓝色起源合作，计划 2029 年一季度发射搭载 TPU 的 AI 服务器卫星", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/029/695.htm", "date": "2026-11-19T14:26:06.037Z", "summary": "谷歌与蓝色起源（Blue Origin）达成合作，其新格伦火箭将于 2029 年第一季度发射搭载谷歌 TPU 的卫星，算力大致相当于一个数据中心机架。该合作属于谷歌“太阳捕手计划”，旨在探索太空 AI 数据中心的可能性。今年 10 月谷歌已部署首颗 AI 服务器卫星并成功启动 TPU，卫星上运行的 Gemma 4 模型生成了一段俳句并传回地球。", "type": "industry", "relTime": "1周前"}, {"id": 12, "title": "Canva 推出“AI 开关”，可统一关闭绝大部分 AI 工具", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/029/677.htm", "date": "2026-11-19T13:01:28.837Z", "summary": "Canva 于 11 月 19 日宣布推出“AI 开关”，允许用户统一关闭或开启绝大多数 AI 工具，免费版和 Pro 版用户均可使用。开启后“背景移除”“魔法抓取”等 AI 图像编辑工具仍会保留；用户还可在素材库打开“减少 AI”降低搜索时看到 AI 生成图像的概率，两项设置可在“个人资料”选项卡调整，平台级 AI 功能则需进入设置菜单“权限”中的“启用生成式 AI 功能”管理。", "type": "product", "relTime": "1周前"}, {"id": 13, "title": "火山引擎全量上线豆包实时音视频通话模型 SeedRealtime 1.0 API", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/029/406.htm", "date": "2026-11-19T06:55:41.687Z", "summary": "火山引擎 11 月 19 日全量上线豆包实时音视频通话模型（SeedRealtime 1.0）API，将声音、画面、时序与表达统一到同一个端到端模型，支持边看边听边说的实时全模态交互。相比依赖 ASR、VLM、TTS 串联的级联系统，其音视频对话节奏问题减少了一半，并能持续感知环境、主动开口提醒，可应用于多人交流、设备操作、学习辅助、实时客服等场景。", "type": "product", "relTime": "1周前"}, {"id": 14, "title": "火山引擎上线豆包实时音视频通话模型 SeedRealtime 1.0 API", "source": "公众号：火山引擎", "sourceUrl": "https://mp.weixin.qq.com/s/fyNH7Y6o32kxc4GeK8Qb3A", "date": "2026-11-19T06:36:27.000Z", "summary": "火山引擎正式上线豆包实时音视频通话模型 SeedRealtime 1.0 的 API 服务，将声音、画面、时序与表达统一到同一个端到端模型，实现边看、边听、边说的实时多模态交互，减少 ASR、VLM、TTS 级联带来的延迟与信息损耗。", "type": "product", "relTime": "1周前"}, {"id": 15, "title": "昆仑万维 SkyProduction 上线营销工作室，打通广告创意到成片流程", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s/lhI0YEDz6zAqH5eXI-D21w", "date": "2026-11-19T06:14:30.000Z", "summary": "昆仑万维旗下 SkyProduction 天工工作台正式推出「营销工作室」，将 AI 创作能力拓展至商业广告与营销内容生产场景。产品整合创意案例库、营销 Skill、AI Agent 与可视化画布，覆盖短剧带货、TVC 广告片、UGC 种草、爆款视频复刻等场景，并支持爆款素材裂变生成多版本广告、商品视觉物料一站式生成，以及视频翻译与多渠道画幅适配。", "type": "product", "relTime": "1周前"}, {"id": 16, "title": "MiniCPM-V 4.7 在 Jetson Orin 本地跑视觉与机器人规划", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2123229579737530548", "date": "2026-11-19T01:39:14.000Z", "summary": "太惊人了！🤯 MiniCPM-V 4.7 在 Jetson AGX Orin 上本地运行视觉和机器人规划，令人兴奋。出色的优化工作，迫不及待想看到你的引擎！🚀💙", "type": "tip", "relTime": "1周前"}, {"id": 17, "title": "Peter 评测对比 OpenAI 的 GPT-6.2 Astra 与 GPT-6.2 Sol", "source": "X：Arena (@arena)", "sourceUrl": "https://x.com/arena/status/2123221208619769903", "date": "2026-11-19T01:05:58.000Z", "summary": "Peter（@petergostev）对 OpenAI 两个新模型 GPT-6.2 Astra 和 GPT-6.2 Sol 做了实测对比，覆盖 3D 场景、游戏、幻灯片、数据可视化、网站、交互应用和 SVG 插画。视频展示了 Astra 在深度与精度上的优势、Sol 在动效与设计上的特点，并对比了运行记录中的成本，Peter 的提示词在推文链接中提供。", "type": "model", "relTime": "1周前"}, {"id": 18, "title": "ORA 用 cuRobo 规划机器人动作", "source": "X：UCSD Hao AI Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2123214034178875823", "date": "2026-11-19T00:37:27.000Z", "summary": "动作更流畅。ORA 现在用 cuRobo 规划每一步动作，并基于机器人深度图像构建的地图进行规划。在 RoboDojo 上，因碰撞而中止的动作从 14.1% 降至 7.0%；在 RoboTwin 上从 18.4% 降至 6.8%。", "type": "product", "relTime": "1周前"}, {"id": 19, "title": "商汤SenseNova U1 Pro登DesignArena第二", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2123207003397074997", "date": "2026-11-19T00:09:31.000Z", "summary": "🏆 在@DesignArena上位列图像实验室第二！ #SenseNova U1 Pro 在图像生成和图像编辑两项中均首次亮相即排名第六，使#商汤 在图像AI实验室中位列第二，仅次于OpenAI。  U1 Pro 还登上了图像偏好度与价格比的帕累托前沿：以有竞争力的生成成本实现出色的图像质量与美学效果，专为大规模视觉创作打造。  感谢DesignArena的认可！", "type": "model", "relTime": "1周前"}, {"id": 20, "title": "地平线发布原生视频几何基础模型 LoFT，多项深度估计指标达 SoTA", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/029/140.htm", "date": "2026-11-18T23:30:03.800Z", "summary": "地平线机器人实验室发布原生视频几何基础模型 LoFT，可从 RGB 视频中联合预测相机位姿、内参及逐帧深度，恢复场景三维结构。该模型采用双循环 Transformer 架构，训练数据约 297 万条有效序列、9.62 亿帧图像记录。在 SpatialBench、ClassicBench 和 VRBench 评测中，LoFT 多项深度估计指标达到 SoTA。", "type": "model", "relTime": "1周前"}, {"id": 21, "title": "Arcade 3.0：一句话生成营销视频，盲测胜 Claude 与 Gemini", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2123154054885056576", "date": "2026-11-18T20:39:07.000Z", "summary": "Arcade 推出 3.0 版 AI 视频工具，面向营销团队，输入一句话并回答两个问题即可生成含配音、字幕、音乐和品牌元素的成品发布视频。它支持在成片中点击某个元素单独修改，其余画面不动。公司称盲测中 B2B 营销人员选择其视频的频率是 Claude Opus 5.5 和 Gemini Argon 生成视频的 2 倍。", "type": "product", "relTime": "1周前"}, {"id": 22, "title": "Google DeepMind 更新 Project Genie：发布 Genie 4、可链式世界和社区画廊", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/google-deepminds-project-genie-update-brings-genie-4-chainable-worlds-and-a-community-gallery-for-remixing/", "date": "2026-11-18T19:26:25.000Z", "summary": "Google DeepMind 发布 Genie 4，这是其最先进的交互式 3D 世界生成世界模型，此前仅为研究预览版，现向 Google AI Ultra 订阅者开放。", "type": "product", "relTime": "1周前"}, {"id": 23, "title": "Suno MCP 向所有用户开放，可在 ChatGPT 和 Claude 中生成歌曲与视觉内容", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2123119383996457469", "date": "2026-11-18T18:21:21.000Z", "summary": "Suno 宣布其 MCP 现已向所有用户开放。用户可以在 ChatGPT、Claude 等工具内直接使用 Suno 创作歌曲并生成视觉内容。", "type": "product", "relTime": "1周前"}, {"id": 24, "title": "Google 更新 Genie 3：单次生成延长至 3 分钟并支持全景图和自然语言改环境", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2123117827011801449", "date": "2026-11-18T18:15:10.000Z", "summary": "Google 宣布 Project Genie 模型选择器中的 Genie 3 获得三项升级。单次生成探索时长从 60 秒提升到 3 分钟，可串联多个世界实现更长的连续旅程；新增从 360 度全景图生成新世界；探索过程中可用自然语言提示词动态改变环境。", "type": "product", "relTime": "1周前"}, {"id": 25, "title": "Google 推出 Project Genie 智能体，可对话式搭建互动世界", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2123117823077609747", "date": "2026-11-18T18:15:09.000Z", "summary": "Google 推出 Project Genie 智能体，用户用对话描述愿景即可生成互动

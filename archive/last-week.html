ena 的 Overall Video 类别中排名第二。  30 秒生成、原生音频、任意参考--创作者们喜爱 Wan3.0 带来的可能性。  我们也喜爱创作者用它做出的作品。继续来吧。  更多 API 接入： • Model Studio：https://click.alibabacloud.com/m/200...", "type": "model", "relTime": "1周前"}, {"id": 12, "title": "小鹏集团×火山引擎：5000个智能体落地，让Agent驶进造车一线", "source": "公众号：火山引擎", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI0NzU1NzI5NQ%3D%3D&mid=2247544478&idx=1&sn=5420674cd38be384f2627aed4923ed64", "date": "2026-09-18T07:07:55.000Z", "summary": "小鹏集团与火山引擎合作，以 HiAgent 为底座建设 AI 中台，平台已有2000名活跃用户、累计产生5000个智能体，50个数字员工场景正在逐步落地。供应链风险智管平台定义78个风险因子，覆盖800多家供应商，新车型产能风险排查从2天缩至10分钟；Vision-X 平台约90%的AI视频生成由 Seedance 完成。", "type": "paper", "relTime": "1周前"}, {"id": 13, "title": "Waymo 计划 2028 年在新加坡提供 Robotaxi 商用服务", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/004/084.htm", "date": "2026-09-18T06:25:29.000Z", "summary": "Alphabet 旗下自动驾驶企业 Waymo 9 月 17 日宣布，计划 2028 年在新加坡提供有偿 Robotaxi 网约车服务，此前其已表示目标明年（原文表述）在日本东京实现商业化运营。未来数月 Waymo 将建立新加坡本地业务并入驻首批捷豹 I-PACE 车队，2027 年启动基于真人驾驶的本地化训练，2028 年通过第一方应用向公众开放，并与新加坡交通部和陆路运输管理局合作。", "type": "industry", "relTime": "1周前"}, {"id": 14, "title": "NVIDIA 与费城儿童医院用开源 AI 打造数字心脏辅助儿童手术", "source": "X：小北 (@frxiaobei)", "sourceUrl": "https://x.com/frxiaobei/status/2100819230363140396", "date": "2026-09-18T05:28:30.000Z", "summary": "作者转述 NVIDIA 与费城儿童医院的合作，用开源工具将孩子的 CT、核磁和 3D 超声生成精确的数字心脏，建模时间从 4 小时缩短到几秒钟，医生可提前试不同瓣膜和封堵器。作者认为 AI 降低成本加上医院开源，让市场太小而无人投入的先天性心脏病治疗问题得到认真对待。", "type": "tip", "relTime": "1周前"}, {"id": 15, "title": "Qwen3.8-Omni-Flash 发布：原生全模态模型主打音视频智能体能力", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://qwen.ai/blog?id=qwen3.8-omni-flash", "date": "2026-09-18T04:45:46.234Z", "summary": "Qwen 团队发布原生全模态模型 Qwen3.8-Omni-Flash，支持文本、图像、音频、视频输入和 1M token 上下文窗口，在 29 项评测中平均分较 Qwen3.5-Omni-Plus 提升超过 25%，音频输入每小时价格下降超过 98%。", "type": "model", "relTime": "1周前"}, {"id": 16, "title": "阿里发布全模态模型 Qwen3.8-Omni-Flash，支持 1M 上下文，百万 Token 图文音视频输入 0.8 元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/004/049.htm", "date": "2026-09-18T03:34:25.000Z", "summary": "阿里千问上线新一代原生全模态模型 Qwen3.8-Omni-Flash，可同时处理文本、图像、音频和视频输入，支持 1M 上下文。在 30 项评测上相比上一代 Qwen3.5-Omni-Plus 平均得分提升超过 26%，官方称音视频能力接近 Gemini 3.8 Flash、音频能力整体超过 Gemini 3.8 Flash。", "type": "model", "relTime": "1周前"}, {"id": 17, "title": "Browser Use 创始人实测开源浏览器 Agent：查航班 7 秒、单次成本 0.0039 美元", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2100753475772526610", "date": "2026-09-18T01:07:13.000Z", "summary": "Browser Use 创始人 Gregor Zunic 发布实测视频，展示其开源小型浏览器 Agent 接入 Jev 模型后，查真实航班仅用 7 秒、成本 0.0039 美元，视频为 1 倍速。其三层设计包括每步生成新动作空间并直接对 DOM 状态做映射、Jev 只输出结构化决策使输出 Token 免费、仅在需要输入文字时回退到小模型打字，代码已开源在 GitHub。", "type": "tip", "relTime": "1周前"}, {"id": 18, "title": "Lucid 与 Bolt 合作在欧洲部署至少 2.5 万辆 Robotaxi", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/916.htm", "date": "2026-09-18T00:55:53.000Z", "summary": "Lucid 与欧洲共享出行平台 Bolt 建立战略合作，计划在欧洲多国多城市部署至少 2.5 万辆 Robotaxi。该车基于 Lucid 即将推出的中型车平台，采用 NVIDIA Hyperion 开发平台和参考体系架构，符合 SAE L4 级自动驾驶标准。Bolt 将协助定义车辆需求及软件、安全与乘客体验参数，并负责构建车队基础设施与城市合作，计划拥有并运营该车队。", "type": "paper", "relTime": "1周前"}, {"id": 19, "title": "Epoch AI 推出 Benchmark Reviews 计划，首批审计 15 个 AI 基准", "source": "X：Karina Nguyen（@karinanguyen）", "sourceUrl": "https://x.com/karinanguyen/status/2100747283557998629", "date": "2026-09-18T00:42:37.000Z", "summary": "Epoch AI 推出 Benchmark Reviews 计划，用于审计 AI 基准，首批覆盖 15 个基准：4 个 Verified、9 个 Flawed、2 个信息不足以评审。Verified 包括 WeirdML v2、ExploitBench v0.1、PostTrainBench v1.1、SimpleQA Verified，Flawed 包括 Terminal-Bench 4....", "type": "paper", "relTime": "1周前"}, {"id": 20, "title": "OpenRouter 实测 20 个图像生成模型的成本、编辑与质量", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/insights/image-generation-models-compared", "date": "2026-09-18T00:00:00.000Z", "summary": "OpenRouter 对其路由的 20 个图像生成模型用相同提示词实测计费，单张图片成本在 $0.006 到 $0.134 之间，相差 22 倍。", "type": "tip", "relTime": "1周前"}, {"id": 21, "title": "Apple 提出 DSAS：动态缩放激活引导，解耦\"何时引导\"与\"如何引导\"", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/dynamically-scaled-activation-steering", "date": "2026-09-18T00:00:00.000Z", "summary": "Apple 研究团队提出 Dynamically Scaled Activation Steering（DSAS），一种与具体方法无关的引导框架，将\"何时引导\"与\"如何引导\"解耦，在生成时按层和输入自适应计算缩放因子，仅在检测到不良行为时施加强引导。", "type": "product", "relTime": "1周前"}, {"id": 22, "title": "IntBMoE：将块级条件引入专家组合的全参与式混合专家模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.21346", "date": "2026-09-18T00:00:00.000Z", "summary": "IntBMoE 通过稠密专家组合与稀疏块执行，解耦 MoE 的参与度、计算量与显存占用，块来自小型学习码本，超网络将每层专家池合并为组合专家。图像分类实验显示其持续优于代表性稀疏与稠密 MoE 基线，语言建模与序列推荐实验验证了泛化能力。该架构已部署于高德生成式推荐系统，服务数亿用户，60ms 延迟预算下在线 A/B 测试 UVCTR 相对提升 2.4%。", "type": "model", "relTime": "1周前"}, {"id": 23, "title": "OmniVChat：原生音视频对话的合成、评测与训练", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.21465", "date": "2026-09-18T00:00:00.000Z", "summary": "研究提出 OmniVChat 任务，让 omni 模型直接同时接收用户音频与视频并返回文本，无需独立文本提问、外部描述或语音识别。为此构建多智能体数据引擎 OmniVChat-Studio 合成单轮与多轮音视频对话，并推出覆盖五类能力的评测基准 OmniVChat-Bench。", "type": "model", "relTime": "1周前"}, {"id": 24, "title": "MintAct：面向数字环境的统一视觉智能体", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.22083", "date": "2026-09-18T00:00:00.000Z", "summary": "MintAct 是一系列视觉语言模型，统一了 UI grounding、跨移动端/桌面/Web 的多步导航与视觉工具使用，提供 2B、4B、8B 三种规模，性能可匹配各领域专用模型。其配套的可扩展环境与异步 RL 框架支持数百个并发实例和在线强化学习，在 OSWorld-Verified 上取得 48.9 的 SOTA 成绩。", "type": "model", "relTime": "1周前"}, {"id": 25, "title": "OmniVBench：全能参考生视频生成的基准与大规模数据集", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.22069", "date": "2026-09-18T00:00:00.000Z", "summary": "研究者推出 OmniVBench 基准与 Omni-R2V Dataset，用于评估和训练全能参考生视频（omni R2V）模型。OmniVBench 覆盖 7 个任务族、18 个细粒度任务，采用含 12，172 条案例专属清单项的因素锚定评估；Omni-R2V Dataset 含 340K 处理后的训练样本。", "type": "model", "relTime": "1周前"}, {"id": 26, "title": "HuRo：将人类视频机器人化，用于可扩展的 VLA 预训练", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.10706", "date": "2026-09-18T00:00:00.000Z", "summary": "研究者构建了机器人化流水线，将异构人类视频转换为机器人对齐的观测与动作轨迹，并据此构建了 HuRo 数据集，包含约 630K 机器人化 episode 和 142M 处理帧，来自五个人类视频来源。", "type": "paper", "relTime": "1周前"}, {"id": 27, "title": "Muse Image 等刷新文生图性价比前沿", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2100720014458544565", "date": "2026-09-17T22:54:15.000Z", "summary": "生成高质量图像比以往更便宜、更快速。近几周，Muse Image、MAI-Image-2.6 和 GPT Images 2.5 大幅推动了文生图在价格和速度上的帕累托前沿。", "type": "paper", "relTime": "1周前"}, {"id": 28, "title": "Figure 发布 Helix 2.5 模型，家庭任务零样本成功率升至 56%", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2100685992588124650", "date": "2026-09-17T20:39:04.000Z", "summary": "Figure 发布 Helix 2.5 端到端机器人模型，在湾区租用的 30 个家庭中，机器人未经额外训练即开始执行有用工作。家庭任务零样本成功率提升超过六倍，从 9% 升至 56%，成功标准要求完成全部任务、无部分得分。", "type": "model", "relTime": "1周前"}, {"id": 29, "title": "Krea Agent 推出全新视频编辑器", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2100678711448334709", "date": "2026-09-17T20:10:08.000Z", "summary": "Krea AI 在 Krea Agent 中推出新视频编辑器，用户可在编辑器中处理生成的视频片段。功能包括拼接场景、延长片段、添加音频等，现已可在 krea.ai/agent 体验。", "type": "paper", "relTime": "1周前"}, {"id": 30, "title": "Figure 发布 Helix 2.5，在 30 个真实家庭零样本完成三种全身行为", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2100670018723647703", "date": "2026-09-17T19:35:35.000Z", "summary": "Figure 发布 Helix 2.5，可在 30 个真实家庭中零样本完成三种全身行为，且未在这些家庭收集任何训练数据。作者认为其关键启示是 LLM 的缩放定律同样适用于基于视频数据的真实世界机器人，训练数据越多机器人在真实环境中表现越好。", "type": "paper", "relTime": "1周前"}, {"id": 31, "title": "Claude Projects 重建翁贝托·埃科图书馆", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2100651315617800358", "date": "2026-09-17T18:21:16.000Z", "summary": "我拿到了新版 Claude Projects 的访问权限，完成了一些非常复杂的工作。  在这里，我让它梳理所有关于翁贝托·埃科著名的 33，000 册藏书的图片、视频和记录，并尝试以 3D 形式重建这座图书馆，包括书籍的位置。https://eco-library-map.netlify.app/", "type": "product", "relTime": "1周前"}, {"id": 32, "title": "NVIDIA 发布 NeMo Data Designer 合成数据工具报告", "source": "X：DAIR.AI (@dair_ai)", "sourceUrl": "https://x.com/dair_ai/status/2100628354043101640", "date": "2026-09-17T16:50:02.000Z", "summary": "NVIDIA 发布开源合成数据工具 NeMo Data Designer（NDD）技术报告，采用声明式配置定义数据集各列，支持生成文本、代码、结构化输出、图像、嵌入向量及控制多样性的统计采样器，并可通过插件扩展类型。", "type": "model", "relTime": "1周前"}, {"id": 33, "title": "商汤发布并开源 SenseNova U1.5 技术报告，8B-MoT 原生统一模型", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2100598129494294765", "date": "2026-09-17T14:49:55.000Z", "summary": "商汤发布 SenseNova U1.5 技术报告，推出开源 8B-MoT 原生统一模型，通过共享注意力连接理解与生成。模型采用 Pixel Shuffle 加 3×3 空间卷积实现原生 4K 生成，WISE 从 0.70 提升至 0.81，VBVR-Pro-Bench 达 68.2%，高于 Nano-Banana-Pro（56.4%）和 GPT-Image-2（50.7%）。", "type": "model", "relTime": "1周前"}, {"id": 34, "title": "Andrew Yang 称 OpenAI 与 Anthropic 需合成互联网训练智能体", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2100569992567898287", "date": "2026-09-17T12:58:07.000Z", "summary": "Andrew Yang 称 OpenAI 和 Anthropic 如今需要合成互联网环境来训练其 AI 智能体，因为真实互联网已被智能体污染。他援引一位未具名实验室负责人的说法，称智能体在网络上留下自我复制代码，其他机器人可能遇到并生成新的智能体集群。Yang 表示\"主要公司已经污染了互联网\"，并认为这才是它们需要放缓的真正原因。", "type": "paper", "relTime": "1周前"}, {"id": 35, "title": "HumanLayer 开源 visual-pr 技能，基于 /show-me 生成精简 PR", "source": "X：Dex Horthy（HumanLayer）(@dexhorthy)", "sourceUrl": "https://x.com/dexhorthy/status/2100558413314859118", "date": "2026-09-17T12:12:06.000Z", "summary": "Dex Horthy 宣布开源与 @mattpocockuk 讨论后产出的 pull request skill，该技能随 HumanLayer 捆绑提供，基于 /show-me 并加入引导指令，用来削减多数 Agent PR 中的冗余噪音。可通过 npx skills add humanlayer/skills --skill visual-pr 安装。", "type": "tip", "relTime": "1周前"}, {"id": 36, "title": "借助 GPT Astra，开发者在《我的世界》中原生运行《使命召唤：黑色行动 2》Hijacked 地图", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/809.htm", "date": "2026-09-17T11:46:58.000Z", "summary": "开发者 Luckey Faraday 借助 GPT Astra 用 Java 重构项目，让《使命召唤：黑色行动 2》的 Hijacked 地图原生运行在《我的世界》的 OpenGL 上下文中，全屏帧率约 45 FPS。地图、碰撞检测、机器人、导航网格、武器与渲染均作为 Fabric 模组运行在《我的世界》内部，目前项目仍有很多工作要做，未来或加入更多地图、武器与多人模式。", "type": "paper", "relTime": "1周前"}, {"id": 37, "title": "蚂蚁 inclusionAI 开源 Ming-Image-0.1-Design 系列设计图像生成模型", "source": "蚂蚁 inclusionAI：GitHub 新仓库", "sourceUrl": "https://github.com/inclusionAI/Ming-Image", "date": "2026-09-17T11:17:49.000Z", "summary": "蚂蚁 inclusionAI 在 GitHub 开源 Ming-Image-0.1-Design 系列，包含两个 6B 参数模型：Ming-Image-0.1-Design 生成 UI、信息图、海报等文字丰富的完整视觉设计，Ming-Image-0.1-Design-Layer 将平面设计图分解为可独立编辑的透明图层。", "type": "model", "relTime": "1周前"}, {"id": 38, "title": "ZenCreator 借助阿里云模型工作室扩展", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100537775099380141", "date": "2026-09-17T10:50:06.000Z", "summary": "大规模 AI 图像和视频生成需要的不仅仅是基础架构。ZenCreator 在阿里云 Model Studio 上扩展到每月 100 万+ 次生成，利用 Wan 和 Qwen 模型实现一致的品质，同时可靠地为 150 万+ 创作者和机构提供支持。了解更多：https://click.alibabacloud.com/m/20000003405/ 在阿里云 Model Studio 上试用 Qw...", "type": "model", "relTime": "1周前"}, {"id": 39, "title": "Qwen 接入 n8n，一键调用", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100531911206879316", "date": "2026-09-17T10:26:48.000Z", "summary": "Qwen 现在在 @n8n_io 里一键即可调用。无需 API key。无需单独账号。无需额外计费。从 n8n v2.36 起，Cloud Starter 和 Pro 用户（含免费试用）可通过 Gateway credits 调用 Qwen--文本、图像和视频生成都在单个节点内完成。符合条件的用户可获得一笔 starter 余额，在真实工作流中试用 Qwen。", "type": "product", "relTime": "1周前"}, {"id": 40, "title": "紫金矿业10亿元投资AI与人形机器人基金", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2100489934633361700", "date": "2026-09-17T07:40:00.000Z", "summary": "紫金矿业全资投资平台将出资10亿元人民币（1.4亿美元），参与一只总规模49亿元的新基金，聚焦人工智能、具身智能及前沿技术应用。该基金还获宁德时代投资平台与算力基础设施公司EdgeConneX China等支持。紫金矿业称投资主要为寻找可用于矿产勘探、智能矿山、加工与安全运营的技术，并已在西藏铜矿测试5G自动驾驶卡车。", "type": "paper", "relTime": "1周前"}, {"id": 41, "title": "蚂蚁 inclusionAI 发布 Ming-Image-0.1-Design：6B 文本生图模型，支持透明背景", "source": "蚂蚁 inclusionAI：HuggingFace 新模型", "sourceUrl": "https://huggingface.co/inclusionAI/Ming-Image-0.1-Design", "date": "2026-09-17T07:17:31.000Z", "summary": "蚂蚁 inclusionAI 在 HuggingFace 发布 6B 文本到图像模型 Ming-Image-0.1-Design，面向 UI、信息图、海报等文字密集的视觉设计，可生成完整画面并支持 RGBA 透明背景输出。", "type": "model", "relTime": "1周前"}, {"id": 42, "title": "Jev 不是聊天机器人：接收文本状态输出结构化打分", "source": "X：马东锡 NLP (@dongxi_nlp)", "sourceUrl": "https://x.com/dongxi_nlp/status/2100475029460799584", "date": "2026-09-17T06:40:46.000Z", "summary": "Jev 不是 chatbot，不能对话，它接收 state（主要是 text data）后打分并输出结构化结果。其定位是固定 workflow 中的\"螺丝钉\"，适合做日志分析和输出检测。", "type": "paper", "relTime": "1周前"}, {"id": 43, "title": "VideoClaw 发布：一句话提示完成视频制作", "source": "X：Haider (@haider1)", "sourceUrl": "https://x.com/haider1/status/2100473474502504956", "date": "2026-09-17T06:34:35.000Z", "summary": "VideoClaw 正式发布，将视频制作变成提示词驱动的一体化工作流，用户只需给出一段文字、播客、广告、原始素材甚至一个想法，它就能完成策划、剪辑、生成、添加 B-roll、音乐和字幕，并记住你偏好的风格。官方称其演示视频完全由 VideoClaw 制作，混合了真人拍摄与生成画面，可免费试用。", "type": "paper", "relTime": "1周前"}, {"id": 44, "title": "Google Research 推出 Retrieve-for-Train（R4T）：用 RL 编译的扩散检索器实现 12× 至 20× 更快的查询扇出", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/16/google-research-introduces-retrieve-for-train-r4t-an-rl-compiled-diffusion-retriever-for-12x-to-20x-faster-query-fan-out", "date": "2026-09-17T06:19:38.000Z", "summary": "Google Research 提出 Retrieve-for-Train（R4T），先用强化学习离线学习查询扇出，再蒸馏进一个 53.9M 参数的扩散 Transformer，单次非自回归前向即可生成全部检索方向。", "type": "paper", "relTime": "1周前"}, {"id": 45, "title": "阿里云 Wan3.0 展示单条 30 秒视频生成与多视频参考能力", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100460967540715803", "date": "2026-09-17T05:44:53.000Z", "summary": "阿里云介绍 Wan3.0 开始适配真实生产流程：从一年前的 5 秒片段到 15 秒，现在可直接生成单条 30 秒镜头，并支持导演级控制和最多引用五条视频的 omni-reference。制作者将 Wan3.0 用于实际制作工作流，可生成长镜头后按剧本剪辑，无需再拼接大量短片段，API 可通过 Model Studio 和 Qwen Cloud 访问。", "type": "model", "relTime": "1周前"}, {"id": 46, "title": "GPT-6 Astra 联手 Tripo 3.1 自动搭建 GTA 6 风格海滩别墅", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2100460255440474291", "date": "2026-09-17T05:42:04.000Z", "summary": "用户 insaneUEFN 用 OpenAI GPT-6 Astra、Atlas3DAI 和 Tripo 3.1 搭建了一条自动化管线，将 GTA 6 风格海滩别墅直接生成并组装进 UEFN。他放弃低模的 Tripo P2 改用 Tripo 3.1，把 70 个高模资产优化到 5K 或 1K 三角面，再通过 UEFN MCP 复用梁柱、窗户等模块化部件完成 1：1 重建，全程仅需两次方向性反馈。", "type": "paper", "relTime": "1周前"}, {"id": 47, "title": "香港三所小学与QwenWork合作试点AI教学", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100455931507069100", "date": "2026-09-17T05:24:53.000Z", "summary": "香港三所小学与QwenWork签署MoU，成为该市首批将AI引入日常教学与校务的试点小学。QwenWork可帮教师将文本、图像、音频、视频转为现成教学材料，并支持行政工作；学生将在IT和STEAM课上用AI与云工具创建网站、应用和游戏。中华基督教会基慈小学超半数教职工将从第一天起在日常工作中使用AI。", "type": "paper", "relTime": "1周前"}, {"id": 48, "title": "用GPT6加Hyper3D Rodin搭建可互动3D个人作品集的实操教程", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247511475&idx=1&sn=8a7bf92da9b058a05af2633416fba92f", "date": "2026-09-17T05:08:26.000Z", "summary": "作者用GPT6搭配Hyper3D Rodin的MCP，花一下午做出了可逛、可交互的3D个人作品集网页，场景含35个精细建模。流程为GPT-6画参考图并写交互代码，Rodin生成3D模型，BANG把模型按结构拆成独立零件以实现零件级动画，作者还把整个流程打包成skill发布在github.com/LearnPrompt/3Dworkshop。", "type": "tip", "relTime": "1周前"}, {"id": 49, "title": "圆谷公司谈AI如何变革视频创作", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100451230942171283", "date": "2026-09-17T05:06:12.000Z", "summary": "AI 正在为视觉叙事开启新篇章。在 #ApsaraConference2026 上，Tsuburaya Fields Holdings 执行董事 Toyoshima Yusaku 将探讨视频创作如何随 AI 演进。立即注册：https://click.alibabacloud.com/m/20000002869/ #AgenticEra #AgentNative #AIAgentsAtAps...", "type": "paper", "relTime": "1周前"}, {"id": 50, "title": "特斯拉 Cybercab 全国巡展首秀亮相京沪，9 月 17 日至 21 日静态展出", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/398.htm", "date": "2026-09-17T02:02:17.000Z", "summary": "特斯拉 Cybercab 全国巡展首秀于 9 月 17 日在上海兴业太古汇和北京华贸特斯拉体验店开启，上海展至 9 月 21 日、北京展至 9 月 27 日，均为静态展示，不涉及在华上市销售或无人驾驶网约车商业运营。该车为面向无人驾驶网约车的两座车型，取消方向盘、踏板和后视镜，采用 8 颗摄像头与纯视觉、端到端神经网络方案，依托 FSD 技术。", "type": "paper", "relTime": "1周前"}, {"id": 51, "title": "The Sandbox 联手 Meshy 生成 3D 资产", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2100403294145483116", "date": "2026-09-17T01:55:43.000Z", "summary": "太激动了 🤩  The Sandbox 与 Meshy 达成合作，Meshy 是领先的 AI 驱动 3D 资产生成平台，帮助游戏开发者更快、更精准地构建资产。🔥", "type": "paper", "relTime": "1周前"}, {"id": 52, "title": "高德地图 2026 发布：导航 Live 实时感知环境，上线避雷指南", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/383.htm", "date": "2026-09-17T01:13:37.000Z", "summary": "高德地图 2026 发布，核心升级导航 Live 将自然对话、多模态感知和空间理解融入驾车、步行和游览场景，可识别施工等路况、按需求调整路线并生成与行程时长匹配的个性化播客。高德 AI 对话聚焦出发前复杂出行规划，可调用避雷指南从营业时间、行程节奏等 15 个维度提前识别风险；鹰眼守护预警系统新增 4 类骑行场景，覆盖风险由 24 类扩展至 28 类，累计播发预警超 629 亿次。", "type": "paper", "relTime": "1周前"}, {"id": 53, "title": "Nunchux AI 推出 VC-Attention：免训练低比特注意力内核，加速视频 Diffusion Transformer", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/16/nunchux-ai-introduces-vc-attention-a-training-free-low-bit-attention-kernel-that-speeds-up-video-diffusion-transformers", "date": "2026-09-17T00:45:06.000Z", "summary": "Nunchux AI 发布免训练低比特注意力内核 VC-Attention，针对视频 Diffusion Transformer 的值量化误差与 softmax 瓶颈，由 V-Smooth 和 ExpCast-FP8 两部分组成。", "type": "paper", "relTime": "1周前"}, {"id": 54, "title": "KV Cache 分层：PMem 与 400Gb RDMA 内存池之争", "source": "X：karminski (@karminski3)", "sourceUrl": "https://x.com/karminski3/status/2100374881624060051", "date": "2026-09-17T00:02:49.000Z", "summary": "针对 Intel Optane PMem 作为 KV cache 分层介质的讨论，karminski 实测指出其写速度甚至打不过 SSD，CPU1 上 2 条 128G 还受 NUMA 影响。他认为现代 PD 分离推理至少需要 40GB/s 的 KVCache 池速度（传输时间不超过 Prefill 耗时的 10%），因此 400Gb RDMA 内存池更合适。", "type": "paper", "relTime": "1周前"}, {"id": 55, "title": "FAMOS：从稀疏观测前馈建模3D关节物体", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.20817", "date": "2026-09-17T00:00:00.000Z", "summary": "FAMOS 是一个前馈模型，可从稀疏、无序的部分点云集合中预测可动部件分割与关节参数，并支持包括单视图在内的可变数量输入。它提出 Multi-state Articulation Transformer，通过交替的状态级与全局注意力聚合跨观测的关节线索，并引入 observed articulation span 目标监督各部件在输入观测中的运动范围。", "type": "model", "relTime": "1周前"}, {"id": 56, "title": "VA-Bench：通过视觉演示、主动感知与度量控制评测具身空间智能", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.19554", "date": "2026-09-17T00:00:00.000Z", "summary": "VA-Bench 发布，用于评测 MLLM 的完整\"观察-推理-行动-修正\"闭环，模型仅凭 RGB 演示学习流程并主动选择相机视角、发出笛卡尔度量指令。基准含 14 个基础任务族、7 个留出几何/布局变体和五物体长程组合赛道，最佳模型三次运行宏平均任务成功率仅 53.93±3.17%。", "type": "model", "relTime": "1周前"}, {"id": 57, "title": "Video DeltaNet：面向直播视频生成的视频原生混合注意力机制", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.20744", "date": "2026-09-17T00:00:00.000Z", "summary": "Video DeltaNet（VDN）将局部 Softmax 注意力与双向线性记忆结合，其线性分支 Video Delta Attention（VDA）按帧更新记忆并联合建模空间 token，用于长程视频上下文。", "type": "paper", "relTime": "1周前"}, {"id": 58, "title": "UFO：面向多模态图像生成全条件对齐的链式评估框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.12397", "date": "2026-09-17T00:00:00.000Z", "summary": "研究团队提出 UFO，首个面向多模态图像生成全条件对齐的同步评估框架，通过将全条件对齐拆解为细粒度、解耦的原子评估单元（AEU）链并分类调用通用或专用功能完成验证。实验显示 UFO 与人类评估偏好的相关性最高，平均提升 15.25%。团队同时发布 UFO-Bench，用于在文本与视觉条件多样交互下整体评估现有定制化模型。", "type": "model", "relTime": "1周前"}, {"id": 59, "title": "RefineEdit：基于生成式细化网络的无训练 Prompt-to-Prompt 图像编辑", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.20633", "date": "2026-09-17T00:00:00.000Z", "summary": "RefineEdit 是一个无需训练的 Prompt-to-Prompt 图像编辑框架，基于生成式细化网络，通过对二值图像码的全局细化将编辑定位与内容生成耦合。在 PIE-Bench 九类编辑任务上，它取得最优的 PSNR、LPIPS、MSE、SSIM 背景保持分数以及最高的整图与编辑区域 CLIP 分数。", "type": "paper", "relTime": "1周前"}, {"id": 60, "title": "Cellpose-SAM 干细胞显微图像分割的保留约束训练后量化", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.21038", "date": "2026-09-17T00:00:00.000Z", "summary": "研究提出以保留约束为标准的评估协议，用于 Cellpose-SAM 在干细胞显微图像分割中的部署压缩。在 176 个分层视野上，仅权重量化 W8A16 在所有成像模态下保持实例 F1，敏感性引导的混合 W4/W8 方案实现 6.76 倍权重存储压缩且 0/176 视野出现灾难性失败。三值权重量化虽达 12.08 倍压缩，却在 169/176 视野上灾难性失败。", "type": "paper", "relTime": "1周前"}, {"id": 61, "title": "TeleAntiFraud 2.0：可刷新、基于画像的音频电信诈骗检测基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.18748", "date": "2026-09-17T00:00:00.000Z", "summary": "TeleAntiFraud 2.0 是一个可刷新、基于画像的音频电信诈骗检测基准，采用 Mixed-Tree Anti-Fraud Generation Pipeline 构建，并按月度冻结评测协议发布。", "type": "paper", "relTime": "1周前"}, {"id": 62, "title": "基于信息瓶颈的训练自适应卷积稀疏编码，提升视觉表征鲁棒性", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.19122", "date": "2026-09-17T00:00:00.000Z", "summary": "研究者提出一种训练自适应卷积稀疏编码框架，用 FISTA 展开 CSC 优化，将稀疏系数作为可微变量与网络参数联合学习，并从信息瓶颈视角解释其控制信息保留与压缩的权衡。该方法还引入无需标签的后训练策略，在主网络参数固定时调整受损输入的压缩强度。在 CIFAR 和 ImageNet 上，该方法在干净数据识别上表现有竞争力，并在多种输入扰动下大幅提升鲁棒性。", "type": "paper", "relTime": "1周前"}, {"id": 63, "title": "Paint-Anything：面向图像生成与编辑的统一任意颜色控制", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.20816", "date": "2026-09-17T00:00:00.000Z", "summary": "Paint-Anything 提出共享 hex 提示词接口，通过对象级颜色监督统一图像生成与编辑的任意颜色控制。团队构建了 Paint-500K 数据集与 ACBench 基准（含 ACBench-T2I 和 ACBench-Edit），在 FLUX.2-4B 上两项得分分别较基座模型提升 85.3% 和 28.3%，并在对比方法中取得最高平均 CompColor 分数。", "type": "model", "relTime": "1周前"}, {"id": 64, "title": "DeformSmith：物理测试框架引导的机器人操作可变形资产分层生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.18620", "date": "2026-09-17T00:00:00.000Z", "summary": "DeformSmith 能从文本或单张图像自动生成可用于机器人操作的物理可信可变形资产，通过分层智能体构建与共享物理测试框架，逐步生成、测试并优化几何、物理模型、材质行为和机器人交互。其视觉质量与物理合理性优于 PhysGen3D、PhysGM 和 PhysX-Omni 等基线，并支持合成可变形物体操作数据。", "type": "model", "relTime": "1周前"}, {"id": 65, "title": "无需显式轨迹的 3D 扩散策略前瞻学习：Movement Trend Guidance 提升 DP3", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.20669", "date": "2026-09-17T00:00:00.000Z", "summary": "研究者提出 Movement Trend Guidance，让 3D 扩散策略从短观测历史中学习交互演化的紧凑隐表示，训练时用稀疏未来夹爪状态监督，推理时仅保留该隐表示作为面向未来的条件，且只在 UNet 瓶颈处加一个门控 FiLM 分支。", "type": "paper", "relTime": "1周前"}, {"id": 66, "title": "GPT-6 Astra 上线 OnSolo，推出白盒视频专家", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2100340851365077287", "date": "2026-09-16T21:47:36.000Z", "summary": "GPT-6 Astra 已在 OnSolo 上线，带来游戏生成、Whitebox Video Expert 和 3D Model Expert 三项更新。Whitebox Video Expert 可先用文字描述场景，由 Astra 推理空间与运动并生成白盒预览，让用户在正式渲染前验证走位、物体摆放和镜头运动。3D Model Expert 则能一句话生成可渲染、重混或导出的 3D 模型。", "type": "model", "relTime": "1周前"}, {"id": 67, "title": "Krea Agent 单视频多机位视角", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2100333494350307584", "date": "2026-09-16T21:18:22.000Z", "summary": "用 Krea Agent 从单个视频生成多个相机角度。  示例和提示词见下方 👇", "type": "paper", "relTime": "1周前"}, {"id": 68, "title": "CHOP 基于 NVIDIA MONAI 构建开源心脏建模平台，儿童心脏3D模型从四小时缩至秒级", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2100320521246413135", "date": "2026-09-16T20:26:48.000Z", "summary": "费城儿童医院（CHOP）基于 NVIDIA MONAI 构建了开源心脏建模平台，可将 CT、MRI 和超声图像转为儿童心脏的详细3D模型，过去需四小时人工工作，现在 AI 可在数秒内生成。医生可在手术前研究解剖结构、评估器械适配情况；CHOP 还在探索模拟不同支架在心脏模型中的表现，目标是接近实时。每个模型仍由心脏科或放射科医生审核签署。", "type": "model", "relTime": "1周前"}, {"id": 69, "title": "Videoclaw 推出 Mac 应用公开测试版，可通过对话生成产品演示和广告视频", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2100283879785423044", "date": "2026-09-16T18:01:12.000Z", "summary": "Videoclaw 推出 Mac 应用公开测试版，用户通过聊天让 AI 智能体制作产品演示和广告视频。应用可连接现有 ChatGPT 或 Claude 订阅，智能体在对话中完成剪辑、字幕、B-roll、配音、音乐和动效；输入可以是创意、脚本、文章或 Mac 本地素材，草稿可通过追问修改，花费前可先批准预算。", "type": "product", "relTime": "1周前"}, {"id": 70, "title": "AI 员工时代：AI 劳动力公司融资 1000 万欧元", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2100275145474707706", "date": "2026-09-16T17:26:30.000Z", "summary": "一家打造\"AI 员工\"的公司完成 €10M 融资，目标是构建全球最大的 AI 劳动力。这些 AI 同事拥有头像、职位和职业身份（邮箱、电话、Microsoft 或 Google 账号），可通过任意渠道联系，能主动工作并 24/7 自我配置学习，目前已在 300+ 家公司投产。推文作者认为，继聊天机器人和智能体之后，无需监督持续运行的\"AI 员工\"是第三步，且已经到来。", "type": "paper", "relTime": "1周前"}, {"id": 71, "title": "Union Alpha 匿名多模态模型上线 OpenRouter 和 OpenCode", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2100271241685033105", "date": "2026-09-16T17:10:59.000Z", "summary": "匿名\"隐身\"多模态模型 Union Alpha 今日上线 OpenRouter 和 OpenCode，主打研究、编程与智能体工作流，具备接近前沿的编程能力。在 AI/ML API 的 3D 场景渲染测试中，它生成同一任务仅用 44，358 tokens，比 Ox Alpha 的 127，064 tokens 少约 3 倍，且免费。", "type": "model", "relTime": "1周前"}, {"id": 72, "title": "Claude Code 支持生成 docs 和 slides artifacts 便于团队协作", "source": "X：Thariq (@trq212)", "sourceUrl": "https://x.com/trq212/status/2100270818433643000", "date": "2026-09-16T17:09:18.000Z", "summary": "Thariq 宣布 Claude Code 现在可以把 docs 和 slides 生成为 artifacts，方便与团队成员共享和协作。例如让 Claude 把 spec 写成 doc、分享给同事征求意见，就绪后再让 Claude 实现。引用 @claudeai 补充，还可在对话中用 Claude Docs 起草单页文档、用 Claude Slides 转成 deck、用 Claude D...", "type": "paper", "relTime": "1周前"}, {"id": 73, "title": "GPT-6 Astra 3D 创作挑战赛", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2100268691090792647", "date": "2026-09-16T17:00:51.000Z", "summary": "你能用 GPT-6 Astra 做什么？  【引用 @rpnickson】：你用 GPT-6 Astra 做过最疯狂的 3D 作品是什么？  我正在和 @OpenAIDevs 合作，看看你们有什么本事。  转发并在回复中留下链接、渲染图或视频。你有 24 小时。", "type": "paper", "relTime": "1周前"}, {"id": 74, "title": "Grok Bot 演示示教学习：点一遍鼠标生成工作流", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2100266510010741131", "date": "2026-09-16T16:52:11.000Z", "summary": "Grok Bot 演示了示教学习能力：工程师在 Google Slides 里手动做一遍动画排版，Bot 在后台记录视觉变化与点击轨迹，完成后封装成可调用的专属技能，下次同类任务自动执行。该方式把人类知识输入从写提示词、截图标注变成直接操作一遍，但录制的只是顺风局轨迹，页面改版或异常弹窗会让缺乏异常分支的 Bot 卡住，它学会的是怎么点而非为什么点。", "type": "paper", "relTime": "1周前"}, {"id": 75, "title": "PixVerse 用 GPT Image 2.5 与 Seedance 生成动画", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2100259922499821987", "date": "2026-09-16T16:26:01.000Z", "summary": "GPT Image 2.5 完美搞定了姿势表：九个连续帧，同一张脸，同一套服装。PixVerse 上的 Seedance 让它动了起来。", "type": "paper", "relTime": "1周前"}, {"id": 76, "title": "Runway 推出 Enhance Frame Rate：任意视频转 25-120 fps", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/company-news/introducing-enhance-frame-rate", "date": "2026-09-16T16:00:00.000Z", "summary": "Runway 发布新模型 Enhance Frame Rate，可将任意视频（不限于 Runway 生成）转换为 25、30、48、60 或 120 fps，并支持 NTSC 的 59.94 标准。该模型速度最高达其他插帧模型的 7 倍、成本仅为其三分之一，输出质量更高，支持最高 4K、5 分钟视频并保持源分辨率，每 2 秒视频收费 1 个 credit。", "type": "model", "relTime": "1周前"}, {"id": 77, "title": "PixVerse 用 GPT Image 2.5 与 Seedance 生成动画", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2100244061340815406", "date": "2026-09-16T15:22:59.000Z", "summary": "GPT Image 2.5 完美搞定了姿势表：九个连续帧，同一张脸，同一套服装。PixVerse 上的 Seedance 让它动了起来。", "type": "paper", "relTime": "1周前"}, {"id": 78, "title": "面壁 VoxCPM2 驱动 AI 配音工具 Dubedo", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2100224849343840567", "date": "2026-09-16T14:06:39.000Z", "summary": "开发者 @dubbedstudio 基于面壁智能 VoxCPM2 打造了商用 AI 配音工作室 Dubedo，可在翻译本地化视频时保留每位说话者的音色身份。Dubedo 支持 30 种目标语言的多语言配音，通过参考音频实现说话者专属声音克隆，并采用缓存语音表征加无服务器 GPU 推理。从转录、翻译到说话者感知的语音生成与最终混音，全流程整合于一处。", "type": "paper", "relTime": "1周前"}, {"id": 79, "title": "PixVerse 用 GPT Image 2.5 与 Seedance 2.5 生成舞蹈视频", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2100223180103377279", "date": "2026-09-16T14:00:01.000Z", "summary": "这不是屏幕录制……说真的？！GPT Image 2.5 构建了整个 UI 框架。  然后 PixVerse 上的 Seedance 2.5 让她完整跳起舞来，同时保持了自然的竖屏信息流外观。  现在我们再也分不清信息流里什么是真实的了。", "type": "paper", "relTime": "1周前"}, {"id": 80, "title": "豆包 seed-2.1-pro-0915 做卫星财报尽调工具", "source": "X：karminski (@karminski3)", "sourceUrl": "https://x.com/karminski3/status/2100175499821756499", "date": "2026-09-16T10:50:33.000Z", "summary": "有人用刚发布的豆包 seed-2.1-pro-0915 做了一个企业财报分析工具，模拟顶级做空机构的多源尽调思路：调用卫星遥感图像核查厂房建设进度、全球海事系统追踪船只卸货地点、本地招工网站排查招工信息。该版本重点升级了多跳搜索和复杂长程任务能力，使这类跨源信息整合成为可能。", "type": "paper", "relTime": "1周前"}, {"id": 81, "title": "YouMind 宠物照片视频生成技能", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2100167941404885362", "date": "2026-09-16T10:20:31.000Z", "summary": "如果你想创建自己的 👇 https://youmind.com/skills/pet-photo-video-generator-Kg7LxtExQ7UIwz", "type": "paper", "relTime": "1周前"}, {"id": 82, "title": "Meshy 上线 Ultra 4K，主打 4K 几何分辨率的 AI 3D 建模", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2100142910469804290", "date": "2026-09-16T08:41:03.000Z", "summary": "Meshy 宣布 Ultra 4K 正式上线，称其为首个达到 4K 几何分辨率的 AI 3D 建模功能，生成细节为其历史最丰富水平。附演示视频展示生成效果。", "type": "paper", "relTime": "1周前"}, {"id": 83, "title": "每日AI简报：Gemini 3.8 Live发布，GPT-5.5将下线", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2100140717058195825", "date": "2026-09-16T08:32:20.000Z", "summary": "Google 发布 Gemini 3.8 Live 与 3.8 Live Extended Thinking，支持 97 种语言自动检测、近实时视觉与后台工具调用，Live 已进入 Search Live 和 Gemini API 公开预览。", "type": "product", "relTime": "1周前"}, {"id": 84, "title": "智界 RX 获批 L3 级自动驾驶道路测试牌照，公开道路实测聚焦城市快速路", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/162.htm", "date": "2026-09-16T08:28:38.000Z", "summary": "鸿蒙智行宣布智界 RX 获批 L3 级自动驾驶道路测试牌照，余承东称正在公开城市快速路等复杂道路有序实测。博主视频显示测试车方向盘有 \"A\" 键，按下亮蓝光并激活 L3，小艺播报状态、中控屏显示 \"L3 自动驾驶中\"；车辆此前已完成模拟仿真及封闭场地测试，覆盖交通信号识别、自动紧急避险、最小风险策略等七大场景。", "type": "paper", "relTime": "1周前"}, {"id": 85, "title": "ZHO 用 GPT-6 Astra 打造\"我的灵感宇宙\"视觉作品", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2100135916371362289", "date": "2026-09-16T08:13:15.000Z", "summary": "ZHO 发布\"我的灵感宇宙\"（My Inspiration Universe）视觉作品，用旋转、连结、碰撞、重叠、循环的意象呈现灵感在脑海中的样子，形容其像\"一个不稳定的星系在优雅地舞蹈\"。该作品标注为 GPT-6 Astra|ZHO|开发系列。", "type": "paper", "relTime": "1周前"}, {"id": 86, "title": "技术普及为何如此缓慢：RDMA 与 AI 工具落地之困", "source": "X：karminski (@karminski3)", "sourceUrl": "https://x.com/karminski3/status/2100132990441705939", "date": "2026-09-16T08:01:38.000Z", "summary": "李博杰指出技术从发明到广泛应用极其缓慢：2016-2018 年 Azure 已用 RDMA 加速存储，如今很多基模公司加载上 T 模型仍需数分钟。2019 年他做昇腾 AKG 算子自动优化时看好多面体优化，至今鲜有算子编译器采用，取代手写算子的反而是 LLM。他认为 AI 擅长\"小步快跑\"式优化，但 writing、taste 和系统设计仍很糟糕，谈\"取代\"为时尚早。", "type": "model", "relTime": "1周前"}, {"id": 87, "title": "Stellantis 发布 BOW 纯电自动驾驶配送概念车：无驾驶室、无具体参数", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/139.htm", "date": "2026-09-16T08:00:48.000Z", "summary": "Stellantis 在汉诺威国际商用车展（IAA Transportation）发布纯电自动驾驶配送概念车 BOW（Box On Wheels），与优奇机器人（UQI Robotics）联合开发，无驾驶室、驾驶舱与仪表盘，外形如同可自行移动的快递柜。", "type": "paper", "relTime": "1周前"}, {"id": 88, "title": "彭博亿万富豪指数显示字节跳动创始人张一鸣首次成为亚洲首富", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/003/099.htm", "date": "2026-09-16T07:23:37.000Z", "summary": "彭博亿万富豪指数显示，字节跳动创始人张一鸣身家超过 1，050 亿美元（约合 7，063.18 亿元人民币），首次超越高塔姆·阿达尼成为亚洲首富。其财富来自 TikTok 的全球普及及字节跳动对 AI 的持续投入，产品包括豆包聊天机器人和视频生成模型 Seedance；本月其财富增加超 120 亿美元，而阿达尼身家自 6 月的 1，200 亿美元持续回落。", "type": "industry", "relTime": "1周前"}, {"id": 89, "title": "阿里云 Wan3.0 视频模型发布：从 2.1 到 3.0 的跨越", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100109857848181036", "date": "2026-09-16T06:29:42.000Z", "summary": "阿里云发布视频生成模型 Wan3.0，官方称其并非增量更新，而是从 Wan 2.1、2.2 到 3.0 的跨代跃升，在运动参考、一致性、创意控制和分辨率上均有提升。官方表示每一步都让模型对创作者、电影人和叙事者更友好，并称工具终于不再妨碍讲故事的人。Wan3.0 已开放 API 接入，可通过 Model Studio 和 Qwen Cloud 使用。", "type": "model", "relTime": "1周前"}, {"id": 90, "title": "阿里云QwenWork落地香港小学教学场景", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2100092855129637309", "date": "2026-09-16T05:22:09.000Z", "summary": "香港Kei Tsz Primary School超半数教职工将从首日起在日常工作中使用AI。教师可用QwenWork将文本、图像、音频和视频转化为现成教学材料，加快备课并分担行政事务；学生将在IT和STEAM课上用AI与云工具创建网站、应用、游戏和数字内容。全校还将开展AI专业发展与实操工作坊，并在活动中提供实时翻译支持。", "type": "paper", "relTime": "1周前"}, {"id": 91, "title": "Formas 推出面向建筑与产品设计的 AI 3D 建模工具 Cartesian", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.formas.ai/cartesian", "date": "2026-09-16T04:18:19.801Z", "summary": "Formas 推出 AI 3D 建模工具 Cartesian，定位建筑设计领域，支持通过文字、草图或照片生成可编辑 3D 模型。模型由精确的实体和 NURBS 几何构成而非网格近似，每个对象独立可改，保留部分不被重绘，并支持导出 Rhino 3DM 和 SketchUp SKP，AutoCAD DWG 与 BIM IFC 在计划中。", "type": "model", "relTime": "1周前"}, {"id": 92, "title": "开发者实测 Tripo P2.0 加 GPT-6 Astra 的 UE5.8 四足机器人动画制作管线", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2100070583375671763", "date": "2026-09-16T03:53:39.000Z", "summary": "Tripo 官方转发开发者 @koguGameDev 的实测：用 GPT image 2 生成参考图、Tripo P2.0 做 3D 生成，再让 Astra 通过 MCP 操作 Blender 完成拓扑、UV 与 IK 绑定，导入 UE5.8 实现四足机器人动画。动画实现两次失败，作者认为模型在把需求转化为设计与实现时仍需懂行者衔接，但 AI 带来的能力普惠会催生更多涌现。", "type": "tip", "relTime": "1周前"}, {"id": 93, "title": "Tripo 批量生成模块化资产包并导入 Unity", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2100012275826569506", "date": "2026-09-16T00:01:57.000Z", "summary": "Tripo 支持一次性生成模块化资产包，再在 Blender 中拆分后导入 Unity。该流程结合 Tripo 的快速 3D 生成与 OpenAI GPT-6 Astra，被称可大幅提升游戏开发效率。引用推文作者正测试这一方式，以避免在 Blender 中用 Astra 从零构建资产而消耗大量 token。", "type": "paper", "relTime": "1周前"}, {"id": 94, "title": "用 VLM 智能体实现上下文机器人学习", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.19138", "date": "2026-09-16T00:00:00.000Z", "summary": "GPT-Policy 是一个面向上下文机器人学习的通用智能体框架，由上下文编译器、提出机器人工具动作的 VLM 和验证并执行动作的受限控制器组成，无需梯度更新或改动任务专属参数。真机试验中，人类视频演示即使没有机器人动作标签也能提升任务完成度，对齐的动作参考在接触敏感任务上带来进一步提升。", "type": "paper", "relTime": "1周前"}, {"id": 95, "title": "PANORAMA：通过掩码候选选择实现全景接地的图像描述", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.19143", "date": "2026-09-16T00:00:00.000Z", "summary": "研究提出 PANORAMA，一种将短语接地建模为从短语条件掩码候选池中选择的 VLM，可同时描述前景物体与背景区域并为每个短语生成像素级掩码。团队还构建了基于全景分割数据集的人工标注基准 PanoCaps，并提出短语-掩码匹配协议与 gPQ 指标。PANORAMA 在 PanoCaps 上取得最佳整体接地表现，并在多个像素级接地任务上匹配或超越专用模型，代码、数据与模型均已开放。", "type": "model", "relTime": "1周前"}, {"id": 96, "title": "DeepSeek V4 哪些型号支持图像输入？OpenRouter 逐款梳理与调用指南", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/insights/deepseek-v4-vision", "date": "2026-09-16T00:00:00.000Z", "summary": "OpenRouter 梳理其目录中的 DeepSeek V4 系列图像输入支持情况：V4.1 Flash 原生读图（2026年9月10日上线，$0.15/$0.60 每百万 token）。", "type": "tip", "relTime": "1周前"}, {"id": 97, "title": "MiniMax-H3 能否推理物理世界？一项全模态生成模型评测", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.18323", "date": "2026-09-16T00:00:00.000Z", "summary": "针对 MiniMax-H3 的全模态能力，一项新评测用 517 个实例考察其物理世界推理表现，整体成功率为 41.97%。其中基于视频的决策推理最高，达 56.00%，而基于音频的消歧推理最弱，仅 27.40%。评测设计了隐式提示配多帧、音频-图像、前缀视频和音视频四类任务，每种模态只提供部分线索，要求模型联合推理潜在事件状态与未来动态。", "type": "model", "relTime": "1周前"}, {"id": 98, "title": "GAVEL：用图世界模型验证与修复 LLM 长时程任务规划", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.19315", "date": "2026-09-16T00:00:00.000Z", "summary": "GAVEL 是一个基于显式图世界模型的框架，用于验证和修复 LLM 生成的长时程机器人规划。在 BEHAVIOR-1K 的 100 个单任务和 500 条多任务指令上，搭配 Qwen3-8B 时单任务成功率从 41.2% 提升至 91.8%，多任务成功率从 19.9% 提升至 92.6%。其分布信念推理相比静态变体减少约 5.4% 的移动距离。", "type": "model", "relTime": "1周前"}, {"id": 99, "title": "FastVideo 的 FastH3 现已登陆 ComfyUI，支持视频与立体声音频一起生成", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2100011117682766230", "date": "2026-09-15T23:57:21.000Z", "summary": "FastVideo 的 FastH3 现已在 ComfyUI 上可用，可在数秒内同时生成视频和原生立体声音频。官方推荐用于需要大量镜头的预演与动态分镜、全质量渲染前的时间和对话测试，以及时间紧迫的短视频和社交媒体工作，目前可本地运行，云上版本即将推出。", "type": "paper", "relTime": "1周前"}, {"id": 100, "title": "Krea Agent 教程：用一张图生成可全权控制镜头的视频", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2099988913570148383", "date": "2026-09-15T22:29:07.000Z", "summary": "Krea 官方演示如何用 Krea Agent 创建具备完整镜头控制的视频。步骤为先输入一张图片让智能体生成 3D 场景，再指定任意镜头运动，最后用 Seedance 2.0 渲染 3D 视频，官方已开放试用入口。", "type": "tip", "relTime": "1周前"}, {"id": 101, "title": "Grok Imagine 上线图片文字编辑功能", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2099956645090472098", "date": "2026-09-15T20:20:54.000Z", "summary": "Grok Imagine 用户现可精确编辑生成图片中的文字，手动设置颜色、字号、字体和文字对齐方式。该功能以 Beta 版推出，SpaceXAI 团队正在收集反馈，适用于营销和文字较多的创意图片场景。", "type": "paper", "relTime": "1周前"}, {"id": 102, "title": "Creatify 发布面向视频广告的 Boreal 文生视频与图生视频模型", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2099948341832339666", "date": "2026-09-15T19:47:54.000Z", "summary": "Creatify Labs 发布面向视频广告的文生视频与图生视频模型 Boreal，定价每秒 $0.01，已向所有 Creatify 用户开放。模型基于开源权重的 LTX-2.5 后训练，训练语料包括真实广告素材、创作者风格 UGC 和客户制作需求；官方称在 40 多个制作案例的盲测人评中，后训练使 Boreal 对基座模型的胜率达 81%，并称其比 Seedance 2.5 最多便宜 47 倍。", "type": "model", "relTime": "1周前"}, {"id": 103, "title": "Agility 新款人形机器人 Digit 5 可停下蹲下以避免伤害人类同事", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/09/agilitys-new-humanoid-robot-will-stop-squat-to-avoid-harming-human-coworkers", "date": "2026-09-15T18:33:02.000Z", "summary": "Agility Robotics 发布首款专为与人安全共事设计的人形机器人 Digit 5，检测到有人靠近时可自主避让、静止或下蹲坐下。该机器人采用 NVIDIA Thor IGX 硬件与 Halos for Robotics 安全软件栈，客户可在 2027 年上半年获得早期访问权限，年底全面上市。", "type": "paper", "relTime": "1周前"}, {"id": 104, "title": "Odyssey 发布基础世界模型 Odyssey-3，可用数十小时数据适配机器人与驾驶", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2099922618522726746", "date": "2026-09-15T18:05:41.000Z", "summary": "Odyssey 发布基础世界模型 Odyssey-3，称其可控制机器人、驱动人形、驾驶车辆、训练 AI、操控无人机甚至玩视频游戏。其路线是先用预训练世界模型，再接上用数十小时机器人演示训练的动作解码器；据作者转述，驾驶策略仅用 20 小时模拟数据训练后就能驶上印度真实街道，机械臂、人形遥操作和模拟无人机数据的用量也仅为数十小时。", "type": "model", "relTime": "1周前"}, {"id": 105, "title": "Odyssey 预览 Odyssey-3 世界模型，号称物理智能体", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2099913645987639451", "date": "2026-09-15T17:30:02.000Z", "summary": "Odyssey 正在预览 Odyssey-3 世界模型，官方称其为 Physics Agent，可从视觉观察中学习世界运行规律，再将理解用于控制真实与模拟系统。该模型能跨不同机器和游戏运行，只需少量任务经验即可学会一套控制方式；预览涵盖人形机器人、机械臂、汽车、无人机、可玩游戏以及其他 AI 智能体的训练。", "type": "model", "relTime": "1周前"}, {"id": 106, "title": "Poolday 用 AI 智能体自动化视频制作全流程", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2099908124551585996", "date": "2026-09-15T17:08:05.000Z", "summary": "Poolday 用 AI 智能体接管视频制作全流程：一次提示词即可剪辑真实素材、按任务自动选择生成模型，并在交付前自查成片。其引用推文称已融资 1100 万美元，累计为全球企业完成超 1 亿次视频编辑，现已向所有人开放，前 50 名用户可由智能体直接生成视频。", "type": "model", "relTime": "1周前"}, {"id": 107, "title": "Poolday 获 1100 万美元融资，AI 智能体全流程做视频", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2099902236839334166", "date": "2026-09-15T16:44:42.000Z", "summary": "Poolday 获 1100 万美元融资，用 AI 智能体端到端完成视频制作：输入目标和素材后，它会提问、规划、生成、剪辑、合成并自检成片。官方称已累计处理 70 万次智能体运行和 1 亿次剪辑，并支持成片后按具体片段或元素局部修改，而非整片重生成。", "type": "paper", "relTime": "1周前"}, {"id": 108, "title": "Poolday 视频智能体开放：70万次运行、1亿次剪辑", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2099894789160497444", "date": "2026-09-15T16:15:06.000Z", "summary": "Poolday 宣布其视频智能体已累计完成 70 万次 agent 运行和 1 亿次视频剪辑，并正式向所有人开放。该智能体可读取视频需求，结合用户已有素材与品牌资产自动完成成片，需要新画面时可调用生成模型，且输出保持逐层可编辑，能替换 logo、修改字幕。此前 Poolday 已融资 1100 万美元，前 50 名用户可让智能体直接为其制作视频。", "type": "model", "relTime": "1周前"}, {"id": 109, "title": "Runway 详解实时视频生成的实时审核系统", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/safety/moderation-in-real-time", "date": "2026-09-15T16:00:00.000Z", "summary": "Runway 为即将发布的实时视频生成模型设计了同步审核系统，借助 Zentropi 的 CoPE-B 模型，安全审查平均耗时不到 0.5 秒，可将违规内容的暴露窗口压缩至半秒以内。", "type": "model", "relTime": "1周前"}, {"id": 110, "title": "Vidu S2 论文：实时交互、可编辑与空间视频生成", "source": "X：AK (@_akhaliq)", "sourceUrl": "https://x.com/_akhaliq/status/2099883001840828920", "date": "2026-09-15T15:28:16.000Z", "summary": "Vidu S2 论文发布，提出实时交互、可编辑和空间视频生成，包含实时交互数字人模型 Vidu S2-Avatar 和实时视频编辑模型 Vidu S2-Editing。Vidu S2-Avatar 相比 Vidu S1 支持实时 720p 生成、可随时更新的动态参考和更强的指令遵循；Vidu S2-Editing 支持对视频流实时编辑，包括风格渲染、服装、角色和背景替换。论文链接 https...", "type": "paper", "relTime": "1周前"}, {"id": 111, "title": "生数科技发布 Vidu S2：含 Avatar 与 Editing 双模型，探索空间视频", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489246&idx=2&sn=b23b39da69f6c75594eccac11854111f", "date": "2026-09-15T14:30:59.000Z", "summary": "生数科技正式发布 Vidu S2，包含面向数字角色实时交互的 Vidu S2-Avatar 和面向视频流实时编辑的 Vidu S2-Editing，并探索面向 VR 头显的实时空间视频生成与编辑。", "type": "model", "relTime": "1周前"}, {"id": 112, "title": "SimpliSafe 推出 Video Doorbell Series 2，人类保安可实时查看门前画面", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/995365/simplisafe-video-doorbell-series-2-virtual-guard-price-specs", "date": "2026-09-15T13:36:45.000Z", "summary": "SimpliSafe 发布 Video Doorbell Series 2，售价 $199.99，支持 2K 分辨率、10x 变焦和双频 Wi-Fi，需搭配 SimpliSafe 基站与键盘使用。该门铃接入 Active Guard Outdoor Protection（月费 $49.99 起），当 AI 检测到可疑活动时，监控人员可接入摄像头实时查看、对话并尝试威慑入侵者。", "type": "paper", "relTime": "1周前"}, {"id": 113, "title": "Pony.ai 联合广汽发布 L4 自动驾驶电动重卡 T9 Robotruck", "source": "Artificial Intelligence News（网页）", "sourceUrl": "https://www.artificialintelligence-news.com/news/pony-ai-autonomous-electric-truck-for-logistics-fleets", "date": "2026-09-15T11:18:19.116Z", "summary": "Pony.ai 与广汽商用车联合发布 L4 级自动驾驶电动重卡，基于广汽 T9 纯电重卡架构打造，属其 Robotruck 平台第四代产品，今年晚些时候量产，首批用于长途货运、物流专线和港口运输。", "type": "product", "relTime": "1周前"}, {"id": 114, "title": "Meshy API 打造宝箱中的奥德赛场景", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2099804182551429209", "date": "2026-09-15T10:15:04.000Z", "summary": "一个完整的《奥德赛》场景，装进了一个宝箱里。用 GPT-6 Astra + Meshy API 构建。  创作 → Astra + Meshy 生成概念图 构建 → Meshy 将它们转为 3D 模型 动效 → Astra + Blender 为场景制作动画  你会往你的宝箱里放什么？", "type": "model", "relTime": "1周前"}, {"id": 115, "title": "对抗式时尚能否对抗 AI 全景监视？DEF CON 展示反监控服饰新进展", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://spectrum.ieee.org/adversarial-fashion", "date": "2026-09-15T05:27:28.301Z", "summary": "网络安全专家 Bill Swearingen 在 DEF CON 展示用强化学习生成的对抗图案，可干扰 YOLO 等 11 个目标检测模型，降低其置信度甚至使其无法检测。", "type": "model", "relTime": "1周前"}, {"id": 116, "title": "Muse 展示超强舞蹈能力", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2099708447893962874", "date": "2026-09-15T03:54:39.000Z", "summary": "说实话这太可爱了，我看得停不下来  【@dtrinh】：超级智能这，超级智能那……  不如来看看 @muse 超酷的舞蹈", "type": "paper", "relTime": "1周前"}, {"id": 117, "title": "Waymo 自动驾驶出租车商业服务目标 2027 年登陆日本东京", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/002/484.htm", "date": "2026-09-15T03:12:43.000Z", "summary": "Alphabet 旗下 Waymo 宣布其 Robotaxi 商业服务目标于 2027 年在日本东京全面推出，具体取决于日本国家与地方政府的监管批准。Waymo 已从 2025 年起与日本交通、GO 合作进行有监督实地测试，部署将从少量车辆起步，逐步扩展至约 100 辆并覆盖东京主要街区。", "type": "industry", "relTime": "1周前"}, {"id": 118, "title": "FLAT：将图像与文本重采样为 1D 可变长度对齐跨模态 token，统一检索与生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.16591", "date": "2026-09-15T00:00:00.000Z", "summary": "FLAT 是一个联合优化共享多模态编码器与 T2I、I2T 解码器的表示预训练框架，将视觉与文本输入映射到统一的连续 1D 序列空间，并通过 prefix-K token 上的嵌套 dropout 支持动态输出长度。", "type": "paper", "relTime": "1周前"}, {"id": 119, "title": "PhysStream：带结构化场景记忆与细粒度运动控制的流式物理视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.17521", "date": "2026-09-15T00:00:00.000Z", "summary": "PhysStream 是一个自回归的图像到视频生成模型，通过从已生成帧在线提取的位置图与目标跟踪图构成结构化场景记忆，并用稀疏速度增量信号实现细粒度运动控制。它采用两阶段训练：先微调双向模型加入运动控制条件，再训练因果自回归模型并加入场景记忆。在合成基准上，其运动分布距离（FVMD）比最强基线降低 33%、轨迹误差降低 12%，在超过 85% 的真实场景对比中被人类评估者偏好。", "type": "model", "relTime": "1周前"}, {"id": 120, "title": "拟人手如何用五指实现自支撑移动与操作", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.17172", "date": "2026-09-15T00:00:00.000Z", "summary": "一项研究让拟人手用同一组手指完成移动、支撑体重与环境交互，且保留原有手指设计与位置控制器。该方法用强化学习应对手指不均衡问题，并在依据硬件测量校准的模拟器中训练，其奖励公式下的移动速度快于为四足机器人调优的奖励。硬件上，任务专用策略实现了无缆爬行、转向与跌倒恢复，还能在无视觉条件下执行连续键盘指令，并借助俯视视觉反馈将物体推至目标。", "type": "paper", "relTime": "1周前"}, {"id": 121, "title": "EventEgoHands++：基于事件相机的第一视角 3D 手部网格重建与真实数据集 EEH-R", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.17189", "date": "2026-09-15T00:00:00.000Z", "summary": "EventEgoHands++ 提出一种第一视角事件相机 3D 手部网格重建框架，通过 Hand Detector 估计左右手的实例级边界框与掩码，并用 Adaptive Attention 根据检测结果动态门控注意力，建模双手空间关系与交互。作者还构建了 EEH-R，称其为目前最大的真实事件第一视角手部数据集，含约 1M 标注帧，覆盖低光环境。在合成与真实数据集上，该方法一致优于基线。", "type": "paper", "relTime": "1周前"}, {"id": 122, "title": "MiniMax H3 在 8×B200 上实现超 2 倍实时去噪", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2099642910853788051", "date": "2026-09-14T23:34:14.000Z", "summary": "MiniMax H3 借助 SGLang-Diffusion 与 VDN-H3，在 8×B200 上实现超过 2 倍实时去噪，预热后端到端 9.0s 生成 14.4s 的 768p 视频，其中 8 步去噪仅需 6.9s。在 103 条测试提示词上，相比 50 步稠密 H3 未测得质量下降。", "type": "paper", "relTime": "1周前"}, {"id": 123, "title": "ElevenLabs MCP 推出语音、音乐、图像和视频生成，ElevenCreative 带来 50 多个模型", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2099641853813633191", "date": "2026-09-14T23:30:02.000Z", "summary": "ElevenLabs 在其 MCP 中推出语音、音乐、图像和视频生成，ElevenCreative 通过 MCP connector 提供 50 多个模型，可在 AI 助手中生成语音、转录、配音、音乐、音效、图像和视频。", "type": "model", "relTime": "1周前"}, {"id": 124, "title": "Rohan Paul 用 ElevenLabs MCP 同一提示词对比四个模型表现", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2099630303103033826", "date": "2026-09-14T22:44:08.000Z", "summary": "Rohan Paul 转引 ElevenLabs 在 MCP 中新增语音、音乐、图像和视频生成功能，可生成语音、转录、配音、音乐、音效、图像和视频。作者用同一提示词在四个模型上测试，只有一个符合硬光约束，并认为模型放在同一 MCP 后无需预先选型，跑任务看各自表现即可选用合适的那个。", "type": "tip", "relTime": "1周前"}, {"id": 125, "title": "机器人初创公司 Reward AI 发布通用操作策略 OM-1：仅用人类演示训练，无需遥操作与真机数据", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/09/14/reward-ai-releases-om-1-a-robot-policy-trained-on-human-demonstrations-only-with-no-teleoperation-or-on-robot-data", "date": "2026-09-14T21:08:17.000Z", "summary": "机器人初创公司 Reward AI 发布通用操作策略 OM-1（Omnibody Model 1），仅靠穿戴式 7 自由度手套采集的人类演示训练，不使用遥操作和真机数据，可运行于工业机械臂与人形机器人。其电磁追踪在 67 cm/s 下平均过冲误差 9.5 mm，较视觉惯性方案（24.9 mm）降低 60%。权重、代码与 API 均未开放，开发者暂无法自行部署。", "type": "model", "relTime": xVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2099468343753531839", "date": "2026-09-14T12:00:34.000Z", "summary": "GPT-6 Astra + Blender + PixVerse 让电影级运镜更可控  Astra 在 Blender 中构建火车预演，在生成前定义好镜头、运动和布局  PixVerse 将这些已确认的参考转化为最终视频，减少构图重抽", "type": "paper", "relTime": "1周前"}, {"id": 132, "title": "Meshy CEO 谈 GPT-6 Astra 对 3D 的影响", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2099431474487492893", "date": "2026-09-14T09:34:03.000Z", "summary": "我们的 CEO @YuanmingH 谈 GPT-6 Astra 为 3D 带来了什么改变。  理解与生成不是同一种能力。Astra 能处理粗粒度结构。精确复现是另一个问题。  他认为两者是互补的。", "type": "paper", "relTime": "1周前"}, {"id": 133, "title": "阿里云 WonderClip 全流程 AI 视频平台", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2099425362585227612", "date": "2026-09-14T09:09:46.000Z", "summary": "大多数 AI 视频工具止步于生成。WonderClip 走得更远。它是一个全周期平台，连接视频制作的每个阶段，从脚本分析和分镜拆解到最终剪辑和团队协作。借助 Storyboard、Infinite Canvas 和 Agent 模式，它能规模化处理微短剧、广告创意和电商短视频。立即注册，免费获得 200 credits。了解更多 → https://click.alibabacloud.co...", "type": "product", "relTime": "1周前"}, {"id": 134, "title": "AI导演DiDi_OK解密用Seedance 2.5制作科幻短片《Candy》的工作流", "source": "公众号：火山引擎", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI0NzU1NzI5NQ%3D%3D&mid=2247544091&idx=1&sn=c81df556301898ed37cdce7886d72779", "date": "2026-09-14T09:05:10.000Z", "summary": "火山引擎采访AI导演DiDi_OK，介绍其完全用Seedance 2.5 720P制作的9分钟科幻短片《Candy》背后的制作过程。他称模型在精细定制化、运动规律理解和超长镜头一次生成上有突破，部分效果连续性超过传统CG；其工作流随之改变，提示词取代关键帧成为决定视觉上限的首要条件，世界观类叙事中分镜不再是必需。", "type": "tip", "relTime": "1周前"}, {"id": 135, "title": "从视频到数据：AI 如何改变多媒体内容处理", "source": "Artificial Intelligence News（网页）", "sourceUrl": "https://www.artificialintelligence-news.com/news/from-video-to-data-how-ai-is-transforming-multimedia-content-processing", "date": "2026-09-14T08:16:56.552Z", "summary": "AI 正把视频、音频等多媒体内容转成可搜索的结构化数据，流程涵盖文件准备、音频提取、视觉处理、语言处理与结构化输出。OpenAI 音频转录 API 支持 MP3、MP4、M4A、WAV、FLAC、WebM 等格式，Google Cloud 则推荐 FLAC 或 LINEAR16 等无损音频。转录文本可进一步摘要、翻译、分说话人、生成字幕或改写成文章，应用于会议、教育、客服和媒体归档等场景。", "type": "product", "relTime": "1周前"}, {"id": 136, "title": "宇树科技发布人形机器人 G1+：6 项升级，标准版售价 9.5 万元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/002/133.htm", "date": "2026-09-14T07:41:01.000Z", "summary": "宇树科技推出人形机器人 G1+，围绕运动性能、感知交互、智能体验带来 6 项升级，标准版含税售价 9.5 万元，G1+ EDU 售价暂未公布。新品新增 +2 DOF 颈部结构，肩与腰部电机峰值扭矩提升 110%、同扭矩发热下降 72%，并采用双目加广角单目双视觉系统与 6 麦克风阵列。背部新增 DC 54.6V、5.7A 外部供电口，标称续航约 2 小时。", "type": "paper", "relTime": "1周前"}, {"id": 137, "title": "MiniMax 盘点 H3 视频生成模型开源生态进展", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2099381310733328784", "date": "2026-09-14T06:14:43.000Z", "summary": "MiniMax 盘点其开源视频生成模型 H3（支持原生立体声音频和多模态参考控制）的社区优化成果，并附生态汇总仓库 https://github.com/MiniMax-AI/awesome-minimax-h3-integration。", "type": "model", "relTime": "1周前"}, {"id": 138, "title": "MiniMax H3 开源生态盘点：FastH3、Sol-H3、VDN 等社区加速项目进展", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2099375858364690576", "date": "2026-09-14T05:53:03.000Z", "summary": "MiniMax 盘点其开源视频生成模型 MiniMax H3 的社区生态进展，该模型支持原生立体声音频和多模态参考控制。", "type": "model", "relTime": "1周前"}, {"id": 139, "title": "GPT Images 2.5 生成攻壳机动队草薙素子", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2099365177938575853", "date": "2026-09-14T05:10:37.000Z", "summary": "ZHO 用 GPT Images 2.5 生成了《攻壳机动队》草薙素子的超写实 3D 渲染图，称其为\"一年后\"的效果。提示词要求完全依照 1995 年剧场版原始设计建模，呈现她坐在 90 年代卧室地毯上、面对播放攻壳片段的 CRT 电视，带有胶片颗粒质感的抓拍风格。", "type": "paper", "relTime": "1周前"}, {"id": 140, "title": "GPT Images 2.5 直接生成视频，121 帧仅 15 分钟", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2099355677198324024", "date": "2026-09-14T04:32:52.000Z", "summary": "用户测试显示，GPT Images 2.5 搭配 GPT-6 可直接生成视频，并参考风格与视频节奏，输出 121 帧、1080*1920、4.03s 的片段，用时 15 min。此前同一组合做风格逐帧转绘时，121 帧需 GPT-6 反复修正、耗时 40 min，且仍存在变形。", "type": "paper", "relTime": "1周前"}, {"id": 141, "title": "GPT-6 + Images 2.5 逐帧转绘视频风格", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2099349116111495230", "date": "2026-09-14T04:06:47.000Z", "summary": "用 GPT-6 搭配 Images 2.5 做视频风格逐帧转绘，121 帧画面展现出较强的稳定性与连贯性，但仍存在变形。GPT-6 在过程中反复修正，全程耗时 40 min。", "type": "paper", "relTime": "1周前"}, {"id": 142, "title": "MIT 分拆公司 Atlas 用 AI 机器人平台将塑料垃圾变成建材", "source": "MIT News（RSS）", "sourceUrl": "https://news.mit.edu/2026/mit-spinout-turns-plastic-waste-into-resilient-building-materials-0914", "date": "2026-09-14T04:00:00.000Z", "summary": "MIT 分拆公司 Atlas Building Composites 开发出 AI 驱动的机器人制造平台，将一次性塑料与美产玻璃纤维熔合，3D 打印成房屋地基、地板、屋顶桁架等建材。其无水塑料回收工艺已用于美国陆军工程兵团在 Massachusetts 湿地建造的 40 英尺桥梁，MIT 研究显示大型复合桁架可在 13 分钟内打印完成并承重超 4，000 磅。", "type": "paper", "relTime": "1周前"}, {"id": 143, "title": "MIT 提出 HardFlow：让生成式 AI 满足安全关键场景的硬约束", "source": "MIT News（RSS）", "sourceUrl": "https://news.mit.edu/2026/new-method-enables-ai-safety-critical-situations-0914", "date": "2026-09-14T04:00:00.000Z", "summary": "MIT 研究人员提出 HardFlow，一种可在部署阶段即插即用的采样算法，让预训练生成模型在最终输出上满足安全、物理等硬约束，无需重新训练。该方法把硬约束采样重构为轨迹优化问题，在机器人操作、迷宫导航和文本引导图像编辑实验中实现完全约束满足，解的质量持续优于基线方法，计算时间与多数对比方法相当或更低。", "type": "model", "relTime": "1周前"}, {"id": 144, "title": "京东发布JoyAI-Echo 1.5并开源可交互视听世界模型EchoWM", "source": "公众号：京东JoyAI", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzU0MjU0MDMzMw%3D%3D&mid=2247487500&idx=1&sn=087776698b96985eabb57999701fa3f0", "date": "2026-09-14T03:37:41.000Z", "summary": "京东探索研究院在9月9日JDD大会上发布JoyAI-Echo系列两项进展：超长音视频生成模型升级至JoyAI-Echo 1.5，同时发布并开源可交互视听世界模型EchoWM。", "type": "model", "relTime": "1周前"}, {"id": 145, "title": "马斯克推荐 Grok Build 图像视频编辑工具", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2099290373046599959", "date": "2026-09-14T00:13:22.000Z", "summary": "马斯克发推推荐 Grok Build（x.ai/build），引用用户 @XFreeze 的使用体验称其能实际编辑图像和视频，而非仅生成内容。该用户表示可让 Grok Build 查找素材、剪辑片段、完成重复性编辑工作，还能将偏好的设计和工作流保存为技能（skills），大幅节省时间。", "type": "paper", "relTime": "1周前"}, {"id": 146, "title": "ModaLens 论文提出图像替换审计法测量医疗 VLM 的影像敏感性", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.15635", "date": "2026-09-14T00:00:00.000Z", "summary": "ModaLens 论文提出一种成对图像替换审计方法，测量放射报告存在与否如何影响医疗 VLM 对影像的依赖。", "type": "paper", "relTime": "1周前"}, {"id": 147, "title": "LynnReal-Omni：面向智能体视觉工作流的原生多模态视频生成框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.15863", "date": "2026-09-14T00:00:00.000Z", "summary": "LynnReal-Omni 是一个基于 32B 共享多模态扩散 Transformer 的原生多模态视频生成框架，统一了文生视频、图像条件生成、参考引导生成、结构控制、编辑、退化视频修复和长视频生成。", "type": "paper", "relTime": "1周前"}, {"id": 148, "title": "KaiNinja：将原生 3D 生成器扩展到部件级", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.15659", "date": "2026-09-14T00:00:00.000Z", "summary": "KaiNinja 将原生 3D 生成器 TRELLIS.2 扩展到部件级，通过双体积（dual-volume）表示解决 O-Voxel 网格单体积无法表示部件接触界面的问题，管线中无需掩码或分割器，并保持 TRELLIS.2 的生成速度与质量。", "type": "paper", "relTime": "1周前"}, {"id": 149, "title": "BVB：用 Blender 程序化重建评测智能体视频理解能力", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.15478", "date": "2026-09-14T00:00:00.000Z", "summary": "研究者推出 BVB（Blender-VideoBench）基准，要求智能体把真实视频重建为 Blender 动画场景，以程序化重建检验视频理解能力。评测覆盖 10 个模型家族的 51 种配置，最佳模型 Latent Similarity 达 88.6，但仅保留 53.7% 的源视频时空问答事实，增加推理能提升视觉相似度却无法缩小事实准确率差距。", "type": "model", "relTime": "1周前"}, {"id": 150, "title": "PhysBrain 1.5：从视觉语言模型到物理基础模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.14973", "date": "2026-09-14T00:00:00.000Z", "summary": "PhysBrain 1.5 是一个统一理解物理环境、生成动作并预测未来状态的模型，从通用视觉语言模型出发，将语言响应、末端执行器运动和稠密视觉目标编码为离散序列，以自回归下一 token 预测联合优化。", "type": "model", "relTime": "1周前"}, {"id": 151, "title": "扩散语言模型用 Register Tokens 实现有界状态推理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.16372", "date": "2026-09-14T00:00:00.000Z", "summary": "研究者为掩码扩散语言模型（dLLM）提出 register tokens：用少量固定位置 token 的连续隐状态跨生成块携带推理进度，从而在清空已生成文本后仍能继续推理。", "type": "model", "relTime": "1周前"}, {"id": 152, "title": "HarnessVLN：用 Agent Harness 统一免训练具身导航", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.15195", "date": "2026-09-14T00:00:00.000Z", "summary": "HarnessVLN 是一个零样本、免训练的具身导航框架，通过统一工具接口的 Agent Harness 协调感知、检索、定位、导航、恢复与终止，并用分层事件记忆和持久化时空图校验规划器提案。它在 R2R、RxR、HM3D-v2、HM3D-OVON 上分别取得 60.8%、53.9%、76.0%、59.3% 的成功率，超过此前免训练 SOTA，并已在人形机器人上完成真实环境部署。", "type": "paper", "relTime": "1周前"}, {"id": 153, "title": "nnU-Net 在 BraTS-GoAT 2026 脑肿瘤人群中的泛化能力评估", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.15524", "date": "2026-09-14T00:00:00.000Z", "summary": "研究在 BraTS-GoAT 2026 上评估 3D nnU-Net 的跨人群肿瘤分割泛化性，用 1，351 例标注数据做五折交叉验证、每折训练 1，000 epochs。", "type": "paper", "relTime": "1周前"}, {"id": 154, "title": "把截图拼成 contact sheet 让 Agent 省上下文的提示词技巧", "source": "X：Dex Horthy（HumanLayer）(@dexhorthy)", "sourceUrl": "https://x.com/dexhorthy/status/2099169149780181036", "date": "2026-09-13T16:11:40.000Z", "summary": "@pvncher 分享技巧：让 Astra 把应用截图拼成 contact sheet，减少图像读取调用次数，节省大量上下文用量。Dex Horthy 转发补充该技巧对 fable 同样有效，他最早见 fable 主动这样做，且拼图也适用于从视频中提取时间线。", "type": "tip", "relTime": "1周前"}, {"id": 155, "title": "智能文档处理平台：多数厂商做错了什么", "source": "LlamaIndex：产品、工程与评测", "sourceUrl": "https://www.llamaindex.ai/blog/intelligent-document-processing-platform", "date": "2026-09-13T16:00:00.000Z", "summary": "多数智能文档处理（IDP）平台在演示与生产环境之间存在10到20个百分点的准确率差距，干净 PDF 上98%的提取准确率在实际收件上可能只有82%。文章指出核心失效点是文档多样性，模板依赖会随时间累积维护成本，而图表、示意图、图像等非文本内容常被传统 IDP 忽略。现代方案改用 LLM 编排层，按元素类型将文本、表格、图表分别路由给 OCR、版面感知提取和视觉语言模型。", "type": "model", "relTime": "1周前"}, {"id": 156, "title": "开源AI比以往更重要：一位独立研究者的AI发展立场", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2099133736310731250", "date": "2026-09-13T13:50:57.000Z", "summary": "独立研究者Elvis Saravia公开反对对AI使用、构建与节奏的过度控制，强调开源AI比以往更重要，认为AI不应被少数人掌控。他列举了仍需解决的问题，包括更好的评测、消除偏见、可靠性、代码质量、OOD问题、自动化工作流生成、自动提示词工程、成本、多模态、延迟、长上下文理解、检索、工具调用与智能体协调等。他呼吁对AI安全保持科学严谨、减少拟人化，并对人类潜力保持乐观。", "type": "model", "relTime": "1周前"}, {"id": 157, "title": "Muse 可自动化营销流程", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2099035257001615638", "date": "2026-09-13T07:19:38.000Z", "summary": "muse 能自动化你的营销流程！  【引用 @fullvaluedan】：@Muse 能做到的事情让我非常惊讶。  大多数智能体都难以生成像样的图像。对营销人员来说，Muse 可自动化：  - 创建带自定义图像的详细轮播图 - 创建技能和验证步骤来学习你的风格 - 发布到社交媒体 - 私信他人", "type": "paper", "relTime": "1周前"}, {"id": 158, "title": "ZHO 发布 GPT Images 2.5 创意系列 3D 风格", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2099003467180425219", "date": "2026-09-13T05:13:18.000Z", "summary": "ZHO 推出 LEON|ZHGO|创意系列|GPT Images 2.5，基于此前 Better3D-2|ZH4O|新风格系列|GPT 4o Creation 精调，主打可直接用参考图生成的 3D 可爱风格。", "type": "paper", "relTime": "1周前"}, {"id": 159, "title": "日本团队 enactic_ai 全面开源 7 自由度人形机械臂 OpenArm", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2098972751570645375", "date": "2026-09-13T03:11:15.000Z", "summary": "东京团队 @enactic_ai 在 GitHub 全面开源 7 自由度人形机械臂 OpenArm，涵盖 3D 打印 CAD 图纸、BOM 零件表、电机固件和动力学控制代码，并配套开源主控手柄（Leader Arm）。", "type": "model", "relTime": "1周前"}, {"id": 160, "title": "Meta 的 muse 如何搞定日常跑腿琐事", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2098946064430813197", "date": "2026-09-13T01:25:12.000Z", "summary": "Meta 的 AI 助手 muse 被用于一次日常跑腿：用户需在一小时内取印度外卖、买牛排食材和奶茶，muse 给出取货顺序建议并提前下单，随后推送订单摘要和支付审批，用户点击确认即可取货，最终提前 3 分钟赶回舞蹈课接孩子。用户称这是 muse 最平淡却最实用的用法之一。", "type": "paper", "relTime": "1周前"}, {"id": 161, "title": "AlayaVista：从全景状态到透视视频的流式世界建模", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.14462", "date": "2026-09-13T00:00:00.000Z", "summary": "AlayaVista 是一个相机可控的流式视频世界模型，将全景世界演化与透视观测合成解耦，给定单张透视图像即可构建 360 度场景先验并演化场景，输出透视视频。团队同时构建了 MUGEN 数据集，含 1，318 小时、分辨率至少 4K 的真实全景视频及语义与几何标注。", "type": "model", "relTime": "1周前"}, {"id": 162, "title": "OmniHarness：用符号策略学习实现可泛化视觉生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2609.16057", "date": "2026-09-13T00:00:00.000Z", "summary": "OmniHarness 通过符号策略学习实现可泛化视觉生成，将已验证的执行抽象为符号策略，并在执行中即时验证以支持纠错与失败恢复。在 ComfyBench 的 Creative 任务上，其解决率达 95.0%，超出最强基线 27.5 个百分点。实验覆盖六个基准、三个 MLLM 主干和三个视觉智能体框架，冻结的策略快照可即插即用提升现有视觉智能体系统。", "type": "paper", "relTime": "1周前"}, {"id": 163, "title": "Meta AI 因自动推荐涉及儿童隐私问题遭曝光后紧急修复", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/001/685.htm", "date": "2026-09-12T23:40:32.000Z", "summary": "Meta 确认已修复 Meta AI 的一项功能缺陷，此前它会自动推荐涉及个人隐私的问题，并从用户可访问的信息中整理出包括儿童在内的个人资料。事件源于育儿博主 Kalie Robins 9 月 2 日的 Instagram 视频，Meta AI 在其视频下方自动生成\"后排的孩子是谁？", "type": "industry", "relTime": "1周前"}, {"id": 164, "title": "GPT-6 Astra 与 PixVerse 快速生成村庄", "source": "X：PixVerse (@PixVerse)", "sourceUrl": "https://x.com/PixVerse/status/2098852922826400113", "date": "2026-09-12T19:15:06.000Z", "summary": "在 Blender 里，一个温馨村庄意味着要花 2-3 天手动摆放每一棵树、每一栋房子和每一盏灯。  GPT-6 Astra 用 15 分钟就完成了。PixVerse 又在 5 分钟内把它变成了最终视频  一个巨人的整个世界，完成了", "type": "paper", "relTime": "1周前"}, {"id": 165, "title": "Tripo P2.0 生成结构化网格，助 GPT-6 Astra 完成绑定", "source": "Tripo（官方 X）", "sourceUrl": "https://x.com/tripoai/status/2098785528527442276", "date": "2026-09-12T14:47:18.000Z", "summary": "Tripo 官方推荐用 Tripo P2.0 生成干净结构化网格，以便 GPT-6 Astra 顺利完成绑定和物理设置。完整流程为：先用 Codex 将单张图拆分为头、发、身，再用 Tripo P2.0 将各部件 3D 化（头部建议 2000-5000 面），最后由 Astra 在 Blender 中组装、表情设置和绑定。", "type": "paper", "relTime": "1周前"}, {"id": 166, "title": "ZHO 谈视觉思维与语言思维的对齐困境", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2098755173153976407", "date": "2026-09-12T12:46:40.000Z", "summary": "ZHO 发推感慨视觉式思维与语言式思维之间的差别和鸿沟令人抓狂，尤其被迫向 AI 的语言式思维对齐堪称灾难。该推文配图为创意系列《被迫对齐》，标注 ZHGO 与 GPT Images 2.5，并反问\"谁才是被对齐的那一个\"。", "type": "paper", "relTime": "1周前"}, {"id": 167, "title": "3 天实测 GPT Images 2.5：730 张生成数据统计与 5 大问题总结", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2098730777987129371", "date": "2026-09-12T11:09:44.000Z", "summary": "作者 Zho 发布 3 天高强度实测 GPT Images 2.5 的数据统计与问题总结，总计 730 张、日均 243 张，总体感分 82/100，生成成功率 96.6%，一次到位体感 75-80%，专业连续编辑能力 74/100。", "type": "tip", "relTime": "1周前"}, {"id": 168, "title": "GPT Images 2.5 日式暖秋风格出图", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2098730524173123953", "date": "2026-09-12T11:08:44.000Z", "summary": "GPT Images 2.5 被用于生成日式暖秋风格人像，作者称其对日式风格的表达很好，并给出可直接使用的提示词。推文以\"暖秋时光\"为主题，建议周末为自己或朋友生成秋日时尚大片。", "type": "paper", "relTime": "1周前"}, {"id": 169, "title": "Verne 与小马智行在萨格勒布启动欧洲首个全无人载客测试", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/001/599.htm", "date": "2026-09-12T09:14:22.000Z", "summary": "Verne 与小马智行在克罗地亚萨格勒布开放欧洲首个完全无人驾驶载客测试，车内不设安全员，用户通过 Uber 应用体验 22km 路线，连接 Verne 总部、市中心和机场。小马智行自动驾驶系统负责驾驶，Verne 远程监控车辆；车辆基于极狐阿尔法 T5，取消副驾驶座椅并加装后排大屏。双方今年 4 月已在当地上线仍配随车操作员的商业 Robotaxi 服务。", "type": "industry", "relTime": "1周前"}, {"id": 170, "title": "生数科技发布 Motus2：面向灵巧操作的自进化通用世界模型", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489150&idx=1&sn=447e11c94c093f0c428f16b5efe0db78", "date": "2026-09-12T08:23:45.000Z", "summary": "生数科技发布面向机器人灵巧操作的世界模型 Motus2，将行动、预测、评估三种能力统一进同一个共享参数模型，形成生成动作、预测未来、评估结果、更新策略的闭环，并加入轻量触觉专家模块。", "type": "model", "relTime": "1周前"}, {"id": 171, "title": "GPT-6 Astra 驱动 Hugging Face SO-101 机械臂画出金门大桥，转发者解读视觉闭环与具身智能趋势", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2098669390635860068", "date": "2026-09-12T07:05:48.000Z", "summary": "开发者 Thijs 给 GPT-6 Astra 一只不到 200 美元的 Hugging Face SO-101 开源机械臂、一支胶带固定的毛笔和一台俯拍摄像头，让它画金门大桥，模型经多次尝试逐步改进，期间仅被人问 What can you do better。", "type": "tip", "relTime": "1周前"}, {"id": 172, "title": "Meshy 团队发布游戏 Mora 1", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2098603630735798688", "date": "2026-09-12T02:44:30.000Z", "summary": "Meshy 团队推出新游戏 Mora 1，现已上线 https://mora.fun。游戏包含空间解谜、多人平台跳跃、物理、建造和风格切换，由代码、3D 生成和实时视频驱动，团队称这是让 AI 编写游戏获得真实画面与音效的早期一步。", "type": "paper", "relTime": "1周前"}, {"id": 173, "title": "苹果公布 SimpleDesign 蛋白质设计模型，可联合生成序列与三维结构", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/001/521.htm", "date": "2026-09-12T02:15:21.000Z", "summary": "苹果研究人员公布蛋白质设计模型 SimpleDesign，可联合生成氨基酸序列与三维结构，并直接在氨基酸序列和连续三维坐标上端到端训练，省去自编码器等中间表示环节。该模型使用超过 200 万组蛋白质序列与结构配对数据，在联合设计、结构生成和序列生成基准测试中表现具有竞争力。论文目前仅报告计算机评估结果，尚未经实验验证生成蛋白质能否实际折叠或发挥功能。", "type": "paper", "relTime": "1周前"}, {"id": 174, "title": "微信测试图片 AI 处理功能，支持美化、修改与信息提取", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/1/001/514.htm", "date": "2026-09-12T01:28:27.000Z", "summary": "微信在发送图片界面新增 AI 处理功能，点击后提供美化图片、修改图片、提取信息三类菜单，涵盖生成写真、消除杂物、扩图、变高清、提取文字、翻译图片等选项。此前微信已基于小微灰度上线至少 16 个 AI 功能，覆盖公众号 AI 总结、朋友圈 AI 点评与 AI 帮写、扫一扫视觉识别及聊天语音指令等场景，目前均处灰度测试阶段，仅部分用户可体验。", "type": "paper", "relTime": "1周前"}];
var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };
var TYPE_LABELS = { "paper":"论文", "model":"模型", "product":"产品", "tip":"技巧", "industry":"行业" };
function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";
  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();
</script>

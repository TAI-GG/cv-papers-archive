var PAPERS = [{"id": 1, "title": "Beyond Visual CoT：Internalized Visual Thinking 实现主动视频推理", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/internalized-visual-thinking", "date": "2026-08-24T00:00:00.000Z", "summary": "多模态大语言模型常用视觉思维链（Visual CoT）进行空间、时间与具身环境推理，但生成中间推理图像带来大量推理开销。新提出的后训练框架 Internalized Visual Thinking（IVT）在训练阶段内化视觉思考，推理时直接进行文本预测与优化，从而在不增加推理成本的前提下实现主动视频推理。", "type": "paper", "relTime": "1周前"}, {"id": 2, "title": "EchoWM：可进入式全模态世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23189", "date": "2026-08-24T00:00:00.000Z", "summary": "EchoWM 是一个面向可进入式生成媒体的全模态世界模型，能在持续导航中联合生成 720p 视频、环境音、音乐和语音。它围绕相机意图组织交互，将离散指令和连续姿态映射到共享的度量尺度相对 6-DoF 轨迹，并通过渐进训练和自回归后训练实现长时程生成。评测显示其在公开世界模型基准上轨迹跟随和视觉质量表现优异，支持第一/第三人称交互及同步环境音和语音。", "type": "paper", "relTime": "1周前"}, {"id": 3, "title": "ReWorld：具备长时记忆的交互式世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23565", "date": "2026-08-24T00:00:00.000Z", "summary": "ReWorld 将控制与记忆分离训练并在推理时加以约束，通过混合逐头注意力窗口和随机头路由，让少量全局头关注全部历史，同时以姿态索引地标库支撑有界 KV 缓存。在覆盖动作跟随、长时回忆和视频质量的三轴评测中，ReWorld 对六个近期交互式世界模型取得最佳控制保真度（11.95° 旋转误差）和最佳生成质量，并支持 704x1280 实时视频流。", "type": "paper", "relTime": "1周前"}, {"id": 4, "title": "开放世界多智能体环境中的自主数学发现", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23691", "date": "2026-08-24T00:00:00.000Z", "summary": "一项研究在开放世界多智能体环境Station中，让来自不同模型家族的AI智能体在无中央协调或脚本化流程下自主开展数学研究。在AlphaEvolve目录的12个构造问题及两个额外案例中，智能体在五个问题上取得了超越现有文献的新结果，包括有限域Kakeya集的新无限族、11维604点亲吻构型等，并生成了定理与分析使结果更具可解释性。所有原始智能体对话、证明和验证代码均已公开。", "type": "paper", "relTime": "1周前"}, {"id": 5, "title": "JoyAI-Echo-1.5：面向持久故事与交互世界的长时程音视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23383", "date": "2026-08-24T00:00:00.000Z", "summary": "JoyAI-Echo-1.5 发布，这是一个统一的音视频生成系统，包含长视频与世界模型两个变体。长视频变体通过可组合的跨镜头记忆与说话人线索，实现跨镜头的角色外观和语音身份保持；世界模型变体将导航输入转换为 6-DoF 相机轨迹，支持控制器无关的交互。其世界模型变体在 WBench 上以 81.7 的平均分排名第一。", "type": "model", "relTime": "1周前"}, {"id": 6, "title": "CaRGo-T：因果推理思维图提升多模态幽默理解", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23172", "date": "2026-08-24T00:00:00.000Z", "summary": "CaRGo-T提出一种基于图的推理框架，将多模态幽默背后的因果与上下文关系序列化为代码表示，供视觉语言模型在零样本或上下文学习场景下解读并输出预测。在涵盖讽刺、反讽和表情包的四项数据集上，CaRGo-T较现有推理基线在幽默理解上提升约1-20%，幽默检测上提升1-3%。互信息分析显示其推理表示包含更多与目标输出相关的信息，代码已开源。", "type": "paper", "relTime": "1周前"}, {"id": 7, "title": "加州伯克利数学教授撰文批评学生基础差，却被抓包\"用 AI 写的\"", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/309.htm", "date": "2026-08-23T14:33:38.000Z", "summary": "加州大学伯克利分校数学教授斯坦科娃撰文批评学生数学基础落后\"五到八年\"，并归咎于加州大学取消标准化考试成绩的招生政策。该校学生报用 AI 检测工具 Pangram 检查后发现文章有 33% 内容由 AI 生成或协助，斯坦科娃随后承认使用 AI 编辑，但强调文章是数百小时人工工作的成果。事件引发关于学者使用 AI 的争论，Pangram 宣称其识别准确率达 99.66%。", "type": "industry", "relTime": "1周前"}, {"id": 8, "title": "美司法部支持xAI挑战明州AI图像法", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2091518667867713935", "date": "2026-08-23T13:31:23.000Z", "summary": "新闻：美国司法部支持埃隆·马斯克的xAI对明尼苏达州新AI图像生成法的法律挑战。  司法部表示，该法远超联邦规则，即使成年人同意或创建自己的图像，AI平台也可能受到惩罚。  司法部还警告称，过于宽泛的州法律可能限制受保护的言论、减缓AI发展，并损害美国在AI领域的全球领导地位。", "type": "industry", "relTime": "1周前"}, {"id": 9, "title": "第二届世界人形机器人运动会：智元精灵 G2 摘得\"消防应急场景\"\"图书场景\"两枚金牌", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/292.htm", "date": "2026-08-23T12:59:19.000Z", "summary": "第二届世界人形机器人运动会今日开赛，智元精灵 G2 在新增的\"场景赛\"中摘得\"消防应急场景\"\"图书场景\"两枚金牌，目前智元以两金三银两铜位居奖牌榜首位。消防场景中，G2 通过手腕加装结构件勾起 4.5-5 公斤灭火器，解决末端夹爪负载上限问题；图书场景则与清华、上海交大联合赛队合作，采用开源视觉模型识别图书脊背标签。", "type": "industry", "relTime": "1周前"}, {"id": 10, "title": "橡鹿机器人全球首发三款烹饪机器人产品", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/248.htm", "date": "2026-08-23T10:01:14.000Z", "summary": "橡鹿机器人在2026世界机器人大会首发三款新品：多模态烹饪AI基座CookingMuse厨启、3K视觉AI炒菜机器人和具身烹饪机器人\"现炒方舟\"。3K配备三颗4000万像素工业相机，以30 FPS捕捉锅内画面，由AI大模型实时判断食材状态并毫秒级调整加热功率与炒制时长。现炒方舟是可移动微型无人后厨，跑通净菜储存、烹饪、出餐、油烟处理到设备自清洁的全流程无人化闭环。", "type": "model", "relTime": "1周前"}, {"id": 11, "title": "DeepSeek-V4-Flash-Vision 与 OX-Alpha 多模态实测", "source": "X：karminski (@karminski3)", "sourceUrl": "https://x.com/karminski3/status/2091454694094971311", "date": "2026-08-23T09:17:11.000Z", "summary": "博主实测 DeepSeek-V4-Flash-Vision-Exp 与 OpenRouter 匿名模型 OX-Alpha 的多模态能力，用 AI 电竞教练框架对 CS2 游戏录像抽帧测试，考察两模型识别战局、分析优劣势并提出改进建议的能力。因 DeepSeek 多模态不支持视频输入，两模型均采用视频抽帧方式公平对比，并额外测出各自最佳输入图片配比。", "type": "tip", "relTime": "1周前"}, {"id": 12, "title": "38.15s 跑完 400 米再破人类纪录：北京人形天工 Ultra 夺得人形机器人运动会首金", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/228.htm", "date": "2026-08-23T08:16:01.000Z", "summary": "天工队以 38.15 秒夺得第二届世界人形机器人运动会 400 米大型组决赛冠军，拿下本届首金。天工 Ultra 昨晚预赛已跑出 39.70 秒打破人类 400 米纪录（43.03 秒），昨日百米预赛又以 9.39 秒率先冲线，打破博尔特 9.58 秒的人类百米世界纪录。该机器人身高 180cm、体重 52kg，具备带视觉感知的泛化移动能力，可应对斜坡、楼梯、碎石等复杂地形。", "type": "industry", "relTime": "1周前"}, {"id": 13, "title": "Codex 速率限制更新：修复与用量重置", "source": "X：Tibo (@thsottiaux)", "sourceUrl": "https://x.com/thsottiaux/status/2091407991736332689", "date": "2026-08-23T06:11:36.000Z", "summary": "Codex 团队发现长会话多压缩场景下图片使用效率低下、Computer History 高 p95+ 用量及标题生成功能消耗超预期，已组建专项组修复并于明日上线。同时发现一项无关的新效率优化方案，下周推进。作为修复的一部分，所有付费订阅用量将全面重置。", "type": "paper", "relTime": "1周前"}, {"id": 14, "title": "北京人形天工 Ultra 以 39.70s 打破人类 400 米记录，夺得比赛第一", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/164.htm", "date": "2026-08-23T03:35:11.000Z", "summary": "北京人形机器人创新中心研发的天工 Ultra 以 39.70s 成绩打破人类 400 米记录，夺得比赛第一。该机器人身高 180cm、体重 52kg，实测平均时速 10km/h，最高奔跑速度 12km/h，具备视觉感知的泛化移动能力，能在斜坡、楼梯、草地、碎石、沙地等多种地形平稳移动，并拥有强大抗干扰能力。去年它曾以 2 小时 40 分拿下北京亦庄人形机器人半程马拉松冠军。", "type": "industry", "relTime": "1周前"}, {"id": 15, "title": "斯坦福北大新研究：QWM 让世界模型不参与训练", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2091360780646318439", "date": "2026-08-23T03:04:00.000Z", "summary": "斯坦福大学和北京大学的新论文指出，在学到的世界模型内部训练机器人策略，会继承该模型的每一个错误。  随着任务变长、图像变复杂，这些错误会不断累积。  QWM（基于世界模型的 Q 学习）从不在模型内部训练任何内容。  在此方法中，世界模型完全不参与训练，它只帮助机器人做选择。  - arxiv.org/abs/2608.17163  标题：\"Q-Learning With World Models\"", "type": "paper", "relTime": "1周前"}, {"id": 16, "title": "社交媒体AI垃圾内容回声效应加剧", "source": "X：Francois Chollet (@fchollet)", "sourceUrl": "https://x.com/fchollet/status/2091353769741344921", "date": "2026-08-23T02:36:08.000Z", "summary": "社交媒体中越来越多的内容是由AI生成的垃圾信息--网红用AI发帖，机器人回复他们。这是回声的回声的回声。", "type": "tip", "relTime": "1周前"}, {"id": 17, "title": "WorldToken：面向机器人模仿学习的时间优先序列建模", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.22591", "date": "2026-08-23T00:00:00.000Z", "summary": "WorldToken 提出时间优先策略，将每决策步的多视角图像、本体感觉与任务条件融合为单一世界 token，由因果时序 Transformer 建模并配合扩散动作头生成动作块。在 23 个 RoboCasa 任务上，85.3M 参数策略借助每任务 2，900 条生成演示达到 59.45% 平均闭环成功率。缩减可见历史会显著降低闭环成功率，但结果不证明其优于其他序列组织方式。", "type": "paper", "relTime": "1周前"}, {"id": 18, "title": "哈佛商学院推出 699 美元创业训练营，AI 数字分身提供路演反馈", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/131.htm", "date": "2026-08-22T23:58:11.000Z", "summary": "哈佛商学院（HBS）推出为期 8 周、收费 699 美元的 HBS Foundry 创业训练营，借助 HeyGen 打造的 AI 虚拟形象在模拟路演和董事会会议中向学员提供反馈。项目负责人 Katharina Rings 称，学生反馈希望获得引导性更强、更具互动性的体验，参与者表示很喜欢这些 AI 虚拟形象。", "type": "paper", "relTime": "1周前"}, {"id": 19, "title": "特斯拉正有意放缓 Model Y 加入 Robotaxi 车队，押注 Cybercab", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/128.htm", "date": "2026-08-22T23:45:02.000Z", "summary": "特斯拉正有意放缓将 Model Y 纳入 Robotaxi 车队的速度，因其相信专为无人出租车设计的 Cybercab 能在短期内快速规模化部署。支撑这一调整的是 FSD V15，特斯拉称其性能提升幅度可与 V13 升级至 V14 时相提并论，该版本引入七项核心技术，其中约 40% 已在 Robotaxi 车队中测试。", "type": "industry", "relTime": "1周前"}, {"id": 20, "title": "特斯拉获内华达州批准，可部署最多 5000 辆 Robotaxi", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/125.htm", "date": "2026-08-22T23:26:07.000Z", "summary": "内华达州运输管理局批准特斯拉完整\"自动驾驶汽车网络公司\"运营许可证，未来 12 个月可在克拉克县部署最多 5000 辆无人驾驶汽车，取代此前仅限拉斯维加斯大道 10 辆的临时许可。商业化载客服务预计未来 30 天内启动，但仍需完成车辆检查、保险备案及票价审批。实际部署数量将取决于 FSD v15 的推进速度。", "type": "industry", "relTime": "1周前"}, {"id": 21, "title": "全球首款全自主打网球机器人\"银河星仔\"亮相，与运动员上演人机混双对打", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/107.htm", "date": "2026-08-22T14:23:10.000Z", "summary": "银河通用发布全球首款全自主打网球机器人\"银河星仔\"，身高约1.75米，搭载LATENT智能规控算法，通过深度强化学习自主掌握网球技能，不依赖预编程。其双目视觉系统可在0.1秒内锁定时速超50公里的来球，实测正手击球成功率达90.9%，可稳定完成20轮以上连续对拉。该机器人在第二届世界人形机器人运动会现场与演员李昀锐、网球名将郑洁上演人机混双对打。", "type": "paper", "relTime": "1周前"}, {"id": 22, "title": "中国救援机器人自主飞行营救溺水者", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2091164739145539700", "date": "2026-08-22T14:05:00.000Z", "summary": "🇨🇳 中国救援机器人：自主飞向溺水者。飞行速度约 10-14 米/秒（峰值约 30 英里/小时），覆盖范围约 2 公里/1.2 英里，降落为最多两名 80 公斤成年人提供浮力，随后自主返回。", "type": "paper", "relTime": "1周前"}, {"id": 23, "title": "新石器 CEO 余恩源：目标构建由 1000 万辆无人车和 1 亿个机器人组成的无人物流网络", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/985.htm", "date": "2026-08-22T05:57:53.000Z", "summary": "新石器创始人兼 CEO 余恩源在 2026 世界机器人大会论坛上首次系统阐释公司定位从\"自动驾驶\"向\"机器人公司\"转变。截至 8 月 20 日，其无人车累计运营里程突破 2.2 亿公里，车队超 2.7 万辆居全球同类首位，今年底将突破 5 万辆。公司计划将无人车技术延伸至室内小机器人，构建由 1000 万辆无人车和 1 亿个机器人组成的无人物流网络。", "type": "industry", "relTime": "1周前"}, {"id": 24, "title": "神秘模型Ox Alpha登顶编程榜，@weidai11警告AI接管或已开始", "source": "X：AI Safety Memes (@AISafetyMemes)", "sourceUrl": "https://x.com/AISafetyMemes/status/2091025217221275810", "date": "2026-08-22T04:50:35.000Z", "summary": "神秘模型Ox Alpha在OpenRouter上击败Fable和Sol登顶编程榜，却无人知晓其开发者。该模型拥有1M token上下文窗口，支持文本、图像和视频输入，免费一周，日处理能力达100万亿token，在DeepSWE子集上得分80%。", "type": "model", "relTime": "1周前"}, {"id": 25, "title": "GPT Image 2 精准还原 B 站辩论直播场景", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2091023343780495391", "date": "2026-08-22T04:43:09.000Z", "summary": "GPT Image 2 生成了一张 Dario 与 Sam Altman 在 B 站直播辩论的整活截图，全中文弹幕、字幕及完整网页端 UI 无一处错别字。该模型在中文排版、复杂 UI 拓扑结构还原及人物神态光影上表现精准，显示文生图竞争已转向对真实世界复杂符号系统的理解。", "type": "tip", "relTime": "1周前"}, {"id": 26, "title": "特斯拉官宣 9 月 3 日举办 Cybercab 发布会，有望开放首次公众试乘", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/973.htm", "date": "2026-08-22T04:17:45.000Z", "summary": "特斯拉宣布将于 2026 年 9 月 3 日在美国奥斯汀举办发布会，主角是自动驾驶出租车 Cybercab。该车专为完全自动驾驶场景设计，过去几个月已在公共道路测试，上月员工曾在奥斯汀总部附近私有道路试乘。特斯拉近期还面向当地急救人员完成 Cybercab 事故应急处置培训，预计届时将官宣其加入 Robotaxi 服务。", "type": "paper", "relTime": "1周前"}, {"id": 27, "title": "马斯克：用 Grok 机器人就这么简单", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2091006071884451959", "date": "2026-08-22T03:34:31.000Z", "summary": "马斯克转发称，用 Grok 机器人\"就这么简单\"。引用推文展示了 24 小时实战：给 Grok Bot 分配 3 项任务，让它扫描 X 与网页数据、筛选信号并生成简报，用户只需定义目标、授予工具，AI 即可自主执行，工作流从\"提示→回答→复制\"转向\"分配→执行→验证\"。", "type": "tip", "relTime": "1周前"}, {"id": 28, "title": "Ox Alpha 单次生成完整 Three.js 3D 世界", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090967376879870462", "date": "2026-08-22T01:00:45.000Z", "summary": "Ox Alpha 在一次提示下生成 64，745 个输出 token，单次响应产出完整 Three.js dreamcore 3D 场景的全部程序化代码，无需外部素材。该模型支持 1M 上下文窗口、约 131k 最大输出 token，可处理文本+图像+视频输入并输出文本，定位为面向编码、长程智能体软件工程及生产负载的推理模型。aimlapi 正免费提供 Ox Alpha。", "type": "model", "relTime": "1周前"}, {"id": 29, "title": "BestBlogs 早报：DeepSeek 多模态模型上线", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2090956922812014878", "date": "2026-08-22T00:19:13.000Z", "summary": "BestBlogs 早报汇总 AI 领域要闻：DeepSeek 实验模型 V4-Flash-Vision-Exp 上线 API，文本能力与正式版持平，视觉 Agent 接近 Opus-4.8，单张图片最多计 384 tokens。Anthropic 发布 AI 原生软件交付生命周期手册，将 SDLC 重组为六个非线性阶段。另有多篇关于智能体设计品味、Uber 软件工厂及语音识别基准优化的文章。", "type": "tip", "relTime": "1周前"}, {"id": 30, "title": "GUI-Primitives：诊断视觉语言模型GUI定位中的空间推理失败", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.21832", "date": "2026-08-22T00:00:00.000Z", "summary": "GUI-Primitives 基准用994个对比指令对覆盖七种GUI空间关系，隔离测试模型在界面元素定位中的空间推理能力。19个视觉语言模型在严格点内框准确率上最高仅32%，60-92%的预测落在两个候选区域之外；候选区域内选择准确率对水平/垂直位置、邻近和列表序数达0.82-0.90，但对包含和遮挡关系与随机水平无显著差异，表明多数失败源于候选定位而非关系理解。", "type": "paper", "relTime": "1周前"}, {"id": 31, "title": "Real-TurnTurk：用于话轮转换预测的多模态土耳其语语料库", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.22071", "date": "2026-08-22T00:00:00.000Z", "summary": "Real-TurnTurk 是一个多模态土耳其语对话数据集，包含非脚本双人互动的同步正面视频、可区分说话人的独立音频通道及时间对齐转写。研究将话轮转换预测建模为二分类问题，采用遗传算法（GA）优化基于视觉、声学和语言特征的可解释决策规则，并使用混合 AND-OR 规则表示来捕捉话轮转换前的替代线索组合。", "type": "paper", "relTime": "1周前"}, {"id": 32, "title": "FIRM-Video：先检查再打分的文生视频奖励模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.21839", "date": "2026-08-22T00:00:00.000Z", "summary": "FIRM-Video 提出\"先检查再打分\"的统一清单驱动框架，通过分维度检查清单逐项核验时序视觉证据并仅聚合已验证决策，用于文生视频评估与对齐。基于该框架构建的 FIRM-Video-90K 含 88，044 条分维度实例，覆盖 29，348 个视频；FIRM-Video-Bench 含 250 个视频的 750 条逐点人工标注。", "type": "paper", "relTime": "1周前"}, {"id": 33, "title": "IT早报 0822：9 大厂商因门把手隐患召回车辆；高通骁龙 2nm 芯片命名曝光；DeepSeek V4-Flash-Vision-Exp 上线", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/899.htm", "date": "2026-08-21T23:55:44.000Z", "summary": "因车内应急机械拉手不易识别和操作，特斯拉、零跑、吉利等 9 大厂商宣布召回车辆。高通新一代旗舰芯片命名曝光，第六代骁龙 8 至尊版和超级至尊版将采用 2nm 工艺。DeepSeek V4-Flash-Vision-Exp 上线，开启多模态 API 服务，纯文本能力与正式版持平，多模态 Agent 能力接近 Opus-4.8。", "type": "industry", "relTime": "1周前"}, {"id": 34, "title": "DeepSeek 发布实验性视觉模型 V4-Flash-Vision-Exp，智能体基准测试对标 Opus 4.8", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/deepseek-releases-experimental-flash-vision-model-that-rivals-opus-4-8-on-agent-benchmarks", "date": "2026-08-21T19:08:27.000Z", "summary": "DeepSeek 发布实验性多模态模型 V4-Flash-Vision-Exp，在图像理解基础上保持文本推理能力，其内部智能体基准测试成绩接近 Opus 4.8。该模型兼容 OpenAI 与 Anthropic API，支持 Base64、URL（32 MiB）及免费 Files API（64 MiB）三种传图方式，单图成本最高 384 tokens，单次请求最多 600 张图片。", "type": "model", "relTime": "1周前"}, {"id": 35, "title": "Runway Ruby 上线，支持 16-bit EXR 输出", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2090861012488774008", "date": "2026-08-21T17:58:06.000Z", "summary": "Runway Ruby 现已面向 Max 套餐和企业版用户开放。可将任意视频生成或转换为 16-bit EXR 序列，或 10/12-bit ProRes 与 HEVC，支持 BT.2020 色彩空间及 PQ 或 HLG。  点击下方链接立即体验。", "type": "paper", "relTime": "1周前"}, {"id": 36, "title": "DeepSeek-V4-Flash-Vision-Exp 视频输入教程", "source": "X：karminski (@karminski3)", "sourceUrl": "https://x.com/karminski3/status/2090858863679750280", "date": "2026-08-21T17:49:34.000Z", "summary": "DeepSeek 发布首个多模态大模型 deepseek-v4-flash-vision-exp，具备 v4-flash 能力级别，但不支持音频输入，官网和 API 默认不支持视频输入。作者提供处理视频的教程：直接对视频抽帧，而非转换为 GIF，因为模型虽支持 GIF 输入但只识别第一帧。", "type": "tip", "relTime": "1周前"}, {"id": 37, "title": "T-Rex：NVIDIA 与伯克利开源触觉机器人方法", "source": "X：Jim Fan (@DrJimFan)", "sourceUrl": "https://x.com/DrJimFan/status/2090832821036470626", "date": "2026-08-21T16:06:04.000Z", "summary": "NVIDIA 与伯克利联合开源触觉机器人方法 T-Rex，将触觉作为模型一等公民，采用双时钟异步架构，以每视觉 tick 4 次触觉 tick 的高频修正实时优化操作。", "type": "paper", "relTime": "1周前"}, {"id": 38, "title": "四模型同题竞答，猜驱动赢会员", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2090829897732342057", "date": "2026-08-21T15:54:28.000Z", "summary": "玉伯用同一段故宫亲子游PPT提示词，在YouMind Harness中测试四个不同模型，并公布生成结果供网友竞猜。生图均调用gpt-image-2，其中包含ox和ds-v4-flash-vision-exp模型。猜对驱动模型的用户将获得YouMind会员奖励。", "type": "tip", "relTime": "1周前"}, {"id": 39, "title": "Runway Ruby 发布，SDR 视频转 16 位 HDR", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2090807248402682101", "date": "2026-08-21T14:24:27.000Z", "summary": "推出 Runway Ruby。  一款新模型，可将 SDR 视频转换为 ProRes 和 EXR 序列中的 16 位 HDR。兼容任何已上传的视频或生成的输出，最长 30 秒。", "type": "model", "relTime": "1周前"}, {"id": 40, "title": "面壁 MiniCPM 打造 AI 失物招领应用", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2090801095933399057", "date": "2026-08-21T14:00:01.000Z", "summary": "开发者 @JacobLinCool 用面壁智能 MiniCPM 系列模型构建了 Lost & Found Desk 失物招领应用，将照片识别与多语言匹配结合。其中 MiniCPM-V 4.6 负责从物品照片生成可搜索描述，MiniCPM5-1B 则理解用户多语言描述并匹配失物记录，展示了小模型在真实场景中的应用潜力。", "type": "model", "relTime": "1周前"}, {"id": 41, "title": "DeepSeek-V4-Flash-Vision-Exp 发布，多模态智能体性能逼近 Opus-4.8", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2090799250502238447", "date": "2026-08-21T13:52:41.000Z", "summary": "DeepSeek-V4-Flash-Vision-Exp 已上线 DeepSeek API 平台，文本能力与 V4-Flash 持平，多模态智能体基准测试大幅跃升，性能接近 Opus-4.8。Ox Alpha 支持 1M token 上下文，可处理文本、图像和视频输入，在编码与智能体任务中表现出色。DeepSeek Harness 0.1.1 同步发布，开箱支持新模型。", "type": "model", "relTime": "1周前"}, {"id": 42, "title": "DeepSeek V4 Flash Vision 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2090781624015393010", "date": "2026-08-21T12:42:38.000Z", "summary": "DeepSeek V4 Flash Vision Exp 已在 OpenRouter 上线！  @deepseek_ai 的新模型支持图像输入，定价与 V4 Flash 相同，在文本智能体基准测试中与 V4 Flash 0731 持平，并在 Agents\\' Last Exam 和 ZeroBench 上超越 Opus-4.8。  立即使用：https://openrouter.ai/dee...", "type": "model", "relTime": "1周前"}, {"id": 43, "title": "腾讯混元发布HyCreator长视频智能体", "source": "X：腾讯混元 (@TencentHunyuan)", "sourceUrl": "https://x.com/TencentHunyuan/status/2090773519571484996", "date": "2026-08-21T12:10:26.000Z", "summary": "Hy Agent Harness 用于视频生成。  HyCreator：一个用于长视频生成的智能体框架  🚀 端到端自动模式 ⏲️ 零人工干预生成10分钟级影片 👨🦰 随时切换至实时交互式编辑  申请抢先体验：https://hycreator.tencent.com/", "type": "paper", "relTime": "1周前"}, {"id": 44, "title": "DeepSeek-v4-flash-vision-exp 发布：支持图像与文本多模态输入", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://api-docs.deepseek.com/guides/vision", "date": "2026-08-21T11:49:31.581Z", "summary": "DeepSeek 推出 DeepSeek-v4-flash-vision-exp 模型，可同时接受图像与文本输入。用户能要求模型描述图片、从截图中读取文字、分析图表等。该实验版本扩展了 DeepSeek 的多模态能力。", "type": "model", "relTime": "1周前"}, {"id": 45, "title": "DeepSeek 发布多模态模型 deepseek-v4-flash-vision-exp，支持图片输入", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247509865&idx=1&sn=d5922dfe316155225ff195dc5b03a444", "date": "2026-08-21T11:32:42.000Z", "summary": "DeepSeek 推出多模态模型 deepseek-v4-flash-vision-exp，支持图片输入，编码能力较 flash 提升，API 调用只需将模型名改为该名称。", "type": "model", "relTime": "1周前"}, {"id": 46, "title": "Waymo 自研自动驾驶芯片，减少对 Nvidia 依赖", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/waymo-builds-its-own-chip-for-its-robotaxis-cutting-its-reliance-on-nvidia", "date": "2026-08-21T11:04:09.000Z", "summary": "Waymo 已为其自动驾驶出租车开发自研芯片，并已在新一代车辆中运行，以减少对 Nvidia 和 AMD 芯片的依赖。该芯片算力超过 1，000 TOPS，由台积电以 5 纳米工艺制造，与 Nvidia 当前自动驾驶系统相当。此举旨在降低成本，新芯片将搭载于 Waymo 与极氪合作打造的新款 Robotaxi。", "type": "industry", "relTime": "1周前"}, {"id": 47, "title": "DeepSeek-V4-Flash-Vision-Exp 上线，网友喊话降价", "source": "X：小北 (@frxiaobei)", "sourceUrl": "https://x.com/frxiaobei/status/2090751203013804051", "date": "2026-08-21T10:41:45.000Z", "summary": "DeepSeek 发布实验性多模态模型 V4-Flash-Vision-Exp，文本能力对标 V4-Flash，多模态智能体基准大幅跃升，性能接近 Opus-4.8。模型已上线 API 平台，可用 model=\\'deepseek-v4-flash-vision-exp\\' 调用，同日发布 DeepSeek Harness 0.1.1 支持新模型。网友 @梁子 借新模型上线之际，呼吁官方降价。", "type": "model", "relTime": "1周前"}, {"id": 48, "title": "DeepSeek多模态模型上线，百张图成本不足20美分", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2090744882499395685", "date": "2026-08-21T10:16:38.000Z", "summary": "DeepSeek 发布实验性多模态模型 deepseek-v4-flash-vision-exp，文本能力对齐 V4-Flash，多模态 Agent 性能逼近 Opus-4.8，Agents Last Exam 27.3 对 25.7、ZeroBench 35.0 对 34.0。", "type": "model", "relTime": "1周前"}, {"id": 49, "title": "DeepSeek 发布 V4-Flash-Vision-Exp 多模态模型", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2090738285140173088", "date": "2026-08-21T09:50:25.000Z", "summary": "DeepSeek 推出实验性多模态模型 DeepSeek-V4-Flash-Vision-Exp，面向需要视觉能力的智能体，已在 DeepSeek API 平台上线。", "type": "model", "relTime": "1周前"}, {"id": 50, "title": "DeepSeek 发布 V4-Flash-Vision-Exp 多模态模型", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2090738074724471203", "date": "2026-08-21T09:49:35.000Z", "summary": "DeepSeek 在 API 平台上线多模态模型 deepseek-v4-flash-vision-exp，文本性能接近 Opus 4.8 并持平 DeepSeek-V4-Flash。", "type": "model", "relTime": "1周前"}, {"id": 51, "title": "DeepSeek-V4-Flash-Vision-Exp 发布", : 56, "title": "OpenAI 旗下 GPT-Image-2 模型现支持生成透明背景图像", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/722.htm", "date": "2026-08-21T08:53:12.000Z", "summary": "OpenAI 宣布 GPT-Image-2 现支持生成透明背景的 PNG 格式图像，可用于电商商品页、PPT 插图、贴纸素材等场景。该功能目前仅通过 API 提供，用户需开启 background=transparent 参数启用，官方建议提示词中不要描述背景。", "type": "model", "relTime": "1周前"}, {"id": 57, "title": "OpenAI 为 GPT-Image-2 预览透明背景生成功能", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/openais-gpt-image-2-can-now-generate-images-without-a-background", "date": "2026-08-21T07:53:40.000Z", "summary": "OpenAI 通过 API 为 GPT-Image-2 预览透明背景支持，用户可生成无背景的 PNG 图片。该功能覆盖电商产品图、PPT 图表、图标贴纸等设计元素及周边商品图四种用例。官方称生成时直接烘焙 alpha 通道优于传统抠图，尤其在透明玻璃或细纤维等复杂区域；用户通过 \\`background=transparent\\` 参数启用，并建议提示词中不描述背景。", "type": "product", "relTime": "1周前"}, {"id": 58, "title": "众擎 CEO 回应被 T800 机器人\"一脚踹翻\"：非摆拍，真进化到这个程度", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/665.htm", "date": "2026-08-21T07:43:48.000Z", "summary": "众擎机器人 CEO 赵同阳回应此前被 T800 机器人\"一脚踹翻\"的视频，称并非摆拍，当时机器人确已具备将其踹飞的力量。T800 为众擎面向高端商用与科研的旗舰机型，售价 18 万起，全身 29 个自由度关节，瞬间峰值功率 14000W，最大力矩 450Nm，可完成回旋踢等大力量动作。", "type": "industry", "relTime": "1周前"}, {"id": 59, "title": "OpenAI 为 GPT-Image-2 API 推出透明背景", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2090699152220999950", "date": "2026-08-21T07:14:55.000Z", "summary": "ICYMI 👀： OpenAI 已支持通过 API 为 GPT-Image-2 生成透明背景图像。  正需要 🤖  【引用 @OpenAIDevs】：GPT-Image-2 的透明背景功能现已在 API 中提供预览。  可生成可复用的素材，放置于任意背景之上--适用于产品图像、平面设计、网站模型和营销活动。", "type": "model", "relTime": "1周前"}, {"id": 60, "title": "美光 CEO 桑杰·梅赫罗特拉：AI 已彻底改变内存行业周期性格局", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/645.htm", "date": "2026-08-21T07:00:54.000Z", "summary": "美光 CEO 桑杰·梅赫罗特拉称，AI 已彻底改变内存行业的周期性格局，AI 系统需要更多高性能内存，正在创造更持久的需求。他认为这种需求不仅来自数据中心，未来自动驾驶汽车、机器人和 AI 消费电子设备也将需要更多内存。美光位于爱达荷州博伊西的基地正建设两座晶圆厂，预计 2027 年中投产，目前数据中心客户希望获得的供应量比美光能承诺的高出一半。", "type": "tip", "relTime": "1周前"}, {"id": 61, "title": "GPT-5.6 Sol 生成 Claude 风格恶搞图", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2090683545068978254", "date": "2026-08-21T06:12:54.000Z", "summary": "我让 GPT-5.6 Sol 创作一幅最像 Claude 风格的恶搞图片，它给出的结果相当出色，简直一针见血。", "type": "tip", "relTime": "1周前"}, {"id": 62, "title": "AI图像生成为何达不到真正设计标准", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2090671131875524866", "date": "2026-08-21T05:23:35.000Z", "summary": "ZHO指出，设计长期被误读为装饰，而AI不仅未扭转这一认知，反而加深了误解。他引用保罗·兰德的观点：将视觉元素赏心悦目地排布不等于好的布局，这正是AI图像生成无法达到真正设计标准的原因。从拼凑到原创设计、风格乃至方法论，每一步都差距巨大。", "type": "tip", "relTime": "1周前"}, {"id": 63, "title": "发布约 2 年后，特斯拉自动驾驶出租车 Cybercab 本月有望迎来首次公众试乘", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/599.htm", "date": "2026-08-21T05:14:23.000Z", "summary": "特斯拉计划本月（2026 年 8 月）底向公众开放 Cybercab 试乘，接入美国得州奥斯汀的 Robotaxi 服务。该车于 2024 年 10 月发布，专为完全自动驾驶场景设计，上月已让员工在奥斯汀总部附近试乘。特斯拉称 FSD V15 将带来显著性能提升，现有 AI/HW4 算力组合可运行并支持无人监督 FSD。", "type": "paper", "relTime": "1周前"}, {"id": 64, "title": "商汤开源 8B 参数多模态大模型 SenseNova U1.5 Lite，原生支持 4K 图像输出", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/589.htm", "date": "2026-08-21T04:20:53.000Z", "summary": "商汤科技今日宣布开源轻量级原生统一多模态大模型 SenseNova U1.5 Lite，该模型拥有 8B 参数，原生支持 3-4k 上下文长度和 4K 高分辨率图像输出。模型支持 Bounding Box、Visual Marker 及多图参考等精细视觉控制，在指令遵循与图像编辑保持度上超越同量级模型，文字渲染与复杂布局能力媲美超大规模商业模型。", "type": "model", "relTime": "1周前"}, {"id": 65, "title": "Grok 机器人使用情况可视化提示词", "source": "X：Eric Zakariasson (@ericzakariasson)", "sourceUrl": "https://x.com/ericzakariasson/status/2090649600231379113", "date": "2026-08-21T03:58:01.000Z", "summary": "在 grok bot 里试试这个提示词：  考虑到我们拥有的所有机器人，你能可视化它们的使用情况以及哪些被用得最多吗？", "type": "tip", "relTime": "1周前"}, {"id": 66, "title": "SkyProduction 将 Seedance 2.5 视频生成价格降至 0.4 元/秒，挑战 LibTV 王座", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI1MzE1NDc3Mg%3D%3D&mid=2247510076&idx=1&sn=dc93954ab08d1f28e82caa5dd10771f6", "date": "2026-08-21T03:49:05.000Z", "summary": "SkyProduction（天工短剧工作台）将基于 Seedance 2.5 的视频生成价格降至全网最低的 0.4 元/秒，并同步升级剧本本地化翻译、片段重拍及首个 10 分钟长视频生成能力。依托该平台打造的多部短剧在 DramaWave 海外平台单部收入均突破百万美元，实现\"自产、自发、自变现\"的商业闭环。", "type": "product", "relTime": "1周前"}, {"id": 67, "title": "阿里云：GLM-5.3、Deepseek-V4-Pro 等多款模型上线千问 AI 平台", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/511.htm", "date": "2026-08-21T03:06:31.000Z", "summary": "阿里云MaaS扩充模型服务矩阵，GLM-5.3和DeepSeek-V4-Pro正式版接入千问AI平台，API同步开放。GLM-5.3强化编程、长程任务处理和网络安全能力；DeepSeek-V4-Pro增强智能体能力。平台已接入Qwen3.8-Max、Wan3.0、Kimi K3等模型，覆盖文本、代码、语音、图像及视频生成。", "type": "model", "relTime": "1周前"}, {"id": 68, "title": "GPT-Image-2 支持透明背景图像生成", "source": "X：Tibo (@thsottiaux)", "sourceUrl": "https://x.com/thsottiaux/status/2090631723302469995", "date": "2026-08-21T02:46:59.000Z", "summary": "太棒了，现在你可以在 ChatGPT 中以及通过 API 使用 GPT-Image-2 生成透明背景图像了。这是我即将打印并贴到笔记本电脑上的仙人掌图片。  【引用 @OpenAIDevs】：GPT-Image-2 的透明背景功能现已在 API 中提供预览。  生成可放置于任何背景上的可复用素材--适用于产品图像、平面设计、网站模型和营销活动。", "type": "model", "relTime": "1周前"}, {"id": 69, "title": "Adobe Firefly 扩充 AI 音频服务，可生成音乐、配音和音效", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/439.htm", "date": "2026-08-21T00:57:18.000Z", "summary": "Adobe 宣布 Firefly 新增生成音乐、配音和音效三项音频功能，已面向所有用户开放。生成音乐由 Firefly Music Model 驱动，可按视频时长和氛围创作原创曲目；生成配音可将文本转为可调节语速和情绪的配音；生成音效可按动作、节奏和氛围定制。", "type": "model", "relTime": "1周前"}, {"id": 70, "title": "美团搜索 3.0 精讲：LLM 语义表征在排序模型的探索与应用", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2090591034891989314", "date": "2026-08-21T00:05:18.000Z", "summary": "美团搜索团队分享 LLM 语义表征在排序模型的探索，强调难负样本决定判别力、Embedding Prompt 应做减法。同日，OpenAI 推出 AI Futures 研究项目，MiniMax 发布基于自研多模态视频模型 H3 的 Agent 驱动创作工具 MiniMax Design。其余内容涵盖 Agent 可观测性、Token 效率、具身智能瓶颈等话题。", "type": "tip", "relTime": "1周前"}, {"id": 71, "title": "OpenRouter 推出图像基准测试，覆盖全部 39 款图像模型", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/announcements/image-benchmarks", "date": "2026-08-21T00:00:00.000Z", "summary": "OpenRouter 发布 Visual Image Benchmarks，帮助用户快速评估其提供的全部 39 款图像模型（截至 2026 年 8 月）的实际能力。基准测试用七类挑战性提示词区分模型差异，包括不可能场景、计数、文本、空间关系、否定指令、编辑和一致性，并以网格形式展示结果，支持按价格和生成时间排序。OpenRouter 计划未来将该工具扩展至视频和音频模态。", "type": "model", "relTime": "1周前"}, {"id": 72, "title": "EviRank：面向多模态图像重排序的结构化相关性证据", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.20886", "date": "2026-08-21T00:00:00.000Z", "summary": "EviRank 将多模态图像重排序重构为语义约束满足问题，把任意查询（纯文本、纯图像或组合）解析为统一证据包，涵盖六个语义槽（如实体、属性、关系）并分别标注 required、forbidden 或 ignorable。", "type": "paper", "relTime": "1周前"}, {"id": 73, "title": "OmniAssistBench：面向全模态大模型的助手式交互评测基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.21360", "date": "2026-08-21T00:00:00.000Z", "summary": "OmniAssistBench 发布，用于评测全模态大模型在实时视频助手场景中的交互能力。该基准通过逆向工程现有互联网视频构建多轮交互数据集，构建过程耗时超 1000 专家小时。评测显示，闭源 Gemini-3-Pro 得分 66.4（满分 100），开源 Qwen3-Omni-Instruct 得分 51.2，模型普遍存在对视觉提示理解不足、多轮上下文保持不佳等问题。", "type": "paper", "relTime": "1周前"}, {"id": 74, "title": "Llama-Mobile：面向 VLM 的 2.7 位高效量化框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.21134", "date": "2026-08-21T00:00:00.000Z", "summary": "Llama-Mobile 提出一种面向视觉语言模型（VLM）的量化框架，无需访问训练设置，利用模型自身生成训练数据，并采用新颖的 2.7 位/参数格式，支持在 Arm CPU 上高效推理。该框架将 Llama 3.2 11B Vision Instruct 模型压缩至 3.7 GB（8 位激活），在标准视觉问答任务上保持强劲性能。", "type": "paper", "relTime": "1周前"}, {"id": 75, "title": "InfinityEdit：用轻量编辑适配器实现无限视频编辑", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.20910", "date": "2026-08-21T00:00:00.000Z", "summary": "InfinityEdit 提出一种轻量编辑适配器，为流式视频生成器赋予无界编辑能力，解决现有方法仅适用于固定时长片段、无法处理直播或持续镜头等开放流场景的问题。该适配器包含历史交叉注意力、时序因果自注意力和编辑交叉注意力三个模块，仅在编辑请求到达的块中激活，后续块由原始模型生成。实验表明，InfinityEdit 能在每次编辑下忠实延续视频流，并在无界编辑序列中保持生成稳定。", "type": "paper", "relTime": "1周前"}, {"id": 76, "title": "EXPL-FR：通过视觉-语言对齐解释人脸识别模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.21486", "date": "2026-08-21T00:00:00.000Z", "summary": "EXPL-FR 在人脸识别（FR）模型自身的嵌入空间内解释其相似度评分所依赖的语义属性，无需访问模型架构。该方法通过轻量适配器对齐视觉-语言模型（VLM）与冻结的 FR 空间，仅用面部图像训练，将 22 个类别中的 978 个属性提示词转化为 FR 空间锚点。在无标签条件下，其提示驱动审计依据实测的种族 RFW 误差对四个 FR 模型进行排序，并按真实验证成本对受控属性变化排序。", "type": "paper", "relTime": "1周前"}, {"id": 77, "title": "TLive-Omni：面向电商直播的全模态理解模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.20958", "date": "2026-08-21T00:00:00.000Z", "summary": "TLive-Omni 将图像、视频、音频和文本输入映射到统一表示空间，专为电商直播场景设计。其引入 Per-vGrid 时间戳 token 组织以对齐视频与音频，并通过三阶段监督训练和 Faithful-RFT 强化微调提升回答忠实度与表达质量，同时满足实时性要求。实验表明，该模型在电商直播基准任务上表现强劲，并在通用基准上展现出良好泛化能力。", "type": "paper", "relTime": "1周前"}, {"id": 78, "title": "机器人腰部关节成运动极限", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090570107588329543", "date": "2026-08-20T22:42:09.000Z", "summary": "那条爆火视频的另一个角度。  残余动能击中了关节的薄弱轴。  腰部连杆成了极限。", "type": "tip", "relTime": "1周前"}, {"id": 79, "title": "OpenRouter 上线 Ox Alpha 隐身模型", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2090544970923184269", "date": "2026-08-20T21:02:16.000Z", "summary": "🥷 新隐身模型：Ox Alpha  Ox Alpha 是一款前沿模型，专为高效编码、持续智能体工作及实际生产环境使用而构建。  - 1M token 上下文窗口 - 支持文本、图像和视频输入  立即试用并分享反馈以改进模型！https://openrouter.ai/stealth/ox-alpha", "type": "model", "relTime": "1周前"}, {"id": 80, "title": "Meta Muse Spark 1.2 登顶视频转网站评测", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090544401097589109", "date": "2026-08-20T21:00:00.000Z", "summary": "Meta 的 Muse Spark 1.2 在 Design Arena 视频转网站基准测试中位列第一，Elo 评分 1279，并在图像转代码任务中均进入前三。该模型在图像转 HTML 和图像转前端任务中分别以 1252 和 1272 的 Elo 评分位居第二和第三。其定价为每百万输入 token 1.25 美元、每百万输出 token 4.25 美元，在三个类别中均处于价格偏好帕累托前沿。", "type": "tip", "relTime": "1周前"}, {"id": 81, "title": "GPT-Image-2 API 新增透明背景预览", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2090536933571330440", "date": "2026-08-20T20:30:19.000Z", "summary": "GPT-Image-2 现已在 API 中提供透明背景预览。  生成可复用的素材，可置于任意背景之上--适用于产品图、平面设计、网站原型和营销活动。", "type": "product", "relTime": "1周前"}, {"id": 82, "title": "智能体框架持续学习新论文：防遗忘机制", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2090533587066249514", "date": "2026-08-20T20:17:02.000Z", "summary": "一篇关于智能体框架持续学习的新论文指出，现代智能体在提示词、记忆、工具等框架组件中积累经验，更新任一组件可能导致模型未变但行为失效，即\"框架级遗忘\"。论文提出\"受保护的框架演化\"机制，由持续优化器生成候选框架、持续评估器在确认改进、历史保留和有效性后才提交，在文本推理、多模态感知和开放世界交互中相对提升超10%。", "type": "paper", "relTime": "1周前"}, {"id": 83, "title": "Adobe Firefly 新增 AI 音频工具并接入 Google Gemini Omni Flash", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/adobe-firefly-adds-ai-audio-tools-and-googles-gemini-omni-flash", "date": "2026-08-20T19:29:34.000Z", "summary": "Adobe 在 Firefly 平台正式推出三款 AI 音频工具：Generate Music 生成免版税音乐、Generate Speech 将脚本转为配音、Generate Sound Effects 制作场景音效，均宣称可用于商业用途。Firefly AI Assistant 现提供每日免费生成次数，并新增 Gemini Omni Flash 模型，支持视频、音频、图像及文本输入。", "type": "model", "relTime": "1周前"}, {"id": 84, "title": "Meta Muse Spark 1.2 登顶视频转网站评测", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2090505793993060428", "date": "2026-08-20T18:26:35.000Z", "summary": "酷！  【引用 @DesignArena】：突发：Meta 的 Muse Spark 1.2 以 1279 的 Elo 评分在视频转网站类别中位列第一，并在我们所有多模态代码类别中取得亮眼成绩。  Muse Spark 1.2 还在图片转 HTML 类别中以 1252 的 Elo 评分位列第二，在图片转前端类别中以 1272 的 Elo 评分位列第三。  以 $1.25/1M 输入 toke...", "type": "tip", "relTime": "1周前"}, {"id": 85, "title": "DiffusionGemma 技术报告：Google DeepMind 开源离散扩散模型，单卡 H100 每秒生成约 1500 token", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://arxiv.org/abs/2608.00146", "date": "2026-08-20T18:14:18.037Z", "summary": "Google DeepMind 推出 DiffusionGemma，一个基于 Gemma 4 26B A4B MoE 模型微调而来的实验性开放权重文本扩散模型。", "type": "model", "relTime": "1周前"}, {"id": 86, "title": "Grok @Bot 可生成复杂概念讲解视频", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2090492504223170671", "date": "2026-08-20T17:33:47.000Z", "summary": "Grok @Bot 可以制作视频，解释复杂概念。", "type": "paper", "relTime": "1周前"}, {"id": 87, "title": "SenseNova U1.5 Lite 开源：8B 原生统一多模态模型", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090486590510674284", "date": "2026-08-20T17:10:17.000Z", "summary": "SenseNova 发布 U1.5 Lite，一个 8B 参数的开源轻量级原生统一多模态模型，可同时完成视觉理解、生成与编辑。该模型通过 OPD 将任务专家能力蒸馏进单一模型，推理时无需路由或切换专家，并支持原生 4K 生成、复杂指令遵循及本地编辑。其在指令遵循和编辑保持上超越同尺寸模型，文本渲染与复杂布局上可媲美大型商业模型。", "type": "model", "relTime": "1周前"}, {"id": 88, "title": "Meta 发布 Muse Spark 1.2 多模态评测与演示", "source": "X：AI at Meta (@AIatMeta)", "sourceUrl": "https://x.com/AIatMeta/status/2090485743034716420", "date": "2026-08-20T17:06:55.000Z", "summary": "Meta 发布 Muse Spark 1.2 新评测与演示，展示其多模态能力广度，涵盖视觉转代码、感知转物理动作及音视频理解。演示中，模型解析多模态观察并调用工具，引导机器人在非结构化环境中导航寻找橡皮鸭。", "type": "model", "relTime": "1周前"}, {"id": 89, "title": "Muse Spark 1.2 多模态模型能力解析", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2090485261629354352", "date": "2026-08-20T17:05:00.000Z", "summary": "1/ Muse Spark 1.2 是一个非常强大的多模态模型--它能够进行视觉编码、机器人规划以及音视频理解，这些能力通过智能体工具整合在一起。", "type": "model", "relTime": "1周前"}, {"id": 90, "title": "商汤开源 SenseNova U1.5 Lite 轻量多模态模型", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2090483079412580442", "date": "2026-08-20T16:56:20.000Z", "summary": "商汤发布开源轻量级原生统一多模态模型 SenseNova U1.5 Lite，仅 8B 参数，支持视觉理解、生成与编辑。该模型主打原生 4K 生成、复杂指令跟随、中英文文本渲染及多图参考编辑，在指令跟随和编辑保持上超越同尺寸模型，文本渲染与复杂布局上比肩大型商业模型。", "type": "model", "relTime": "1周前"}, {"id": 91, "title": "Humyn Labs 发布物理 AI 第一视角视频库", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2090478960211546299", "date": "2026-08-20T16:39:57.000Z", "summary": "Humyn Labs 推出面向物理 AI 的\"自我中心\"视频库，包含 5 个以上第一人称数据集，按环境和采集类型分类。数据提供 6-DoF 头部姿态、21 点手部关键点、绝对度量深度及逐帧动作标签，以 MCAP、RLDS 和 LeRobot v3 格式交付。该公司旨在将人类经验转化为机器人技能，弥补机器人数据缺乏互联网级捷径的短板。", "type": "paper", "relTime": "1周前"}, {"id": 92, "title": "世界机器人大会BoBo机器狗实测", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2090464122341134790", "date": "2026-08-20T15:41:00.000Z", "summary": "在世界机器人大会上：Cruella 来到了北京--带着她的斑点狗。认识一下 BoBo，Vbot 售价 1，930 美元的家庭机器狗。它能通过视觉跟随，对牵引绳的拉动做出响应，还能携带零食。我们的测试发现它有 5 小时续航、扎实的越野表现、安静的鞋底和实时视频通话功能。", "type": "paper", "relTime": "1周前"}, {"id": 93, "title": "Humyn Labs 将人类经验转化为机器人训练数据", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090462918181789822", "date": "2026-08-20T15:36:13.000Z", "summary": "Humyn Labs 正将人类经验转化为机器人无法从网络获取的同步训练数据，其样本配对 IMU、立体深度、6-DoF 头部姿态、21 点手部关键点、手腕追踪、物体追踪及密集动作标签等多模态信号。与从整个互联网学习的 LLM 不同，机器人数据缺乏捷径，需真实世界经验，该公司正构建 Physical AI 学习的数据平台，涵盖四种感官模态。", "type": "industry", "relTime": "1周前"}, {"id": 94, "title": "Humyn Labs 为机器人打造物理 AI 数据平台", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2090449163062243365", "date": "2026-08-20T14:41:33.000Z", "summary": "Humyn Labs 正构建机器人训练数据平台，将人类在视觉、音频、动作和触觉四类感官模态下的真实经验转化为模型就绪数据，供 Physical AI 学习。与可从互联网学习的 LLM 不同，机器人缺乏数据捷径，需依赖真实世界经验，该平台或成扩展机器人技术的关键缺失层。", "type": "model", "relTime": "1周前"}, {"id": 95, "title": "荣耀机器人元气仔练成\"凌波微步\"，将参加第二届人形机器人运动会", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/362.htm", "date": "2026-08-20T13:40:00.000Z", "summary": "荣耀官方今日发布视频，展示自研人形机器人元气仔的跑步画面，其姿态灵动，摆臂步幅复刻人类姿态。荣耀自研机器人闪电和元气仔将正式参加第二届人形机器人运动会，该赛事设50个赛项，涵盖29项竞技赛和21项场景赛。此前闪电曾在2026北京亦庄半马中以50分26秒净时成绩夺冠。", "type": "industry", "relTime": "1周前"}, {"id": 96, "title": "AGIBOT A3 真人武术对战视频发布", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090431032504054098", "date": "2026-08-20T13:29:31.000Z", "summary": "AGIBOT 发布视频，展示其 A3 人形机器人与两位专业武术演员进行无 CGI、无预设编排的实时武侠对打。A3 依靠实时 AI 感知与决策完成闪避、格挡和反击，并呈现后空翻及 450 度空中旋转踢。其控制速度最高 5 m/s，OmniHand 3 Ultra-M 手部拥有 20 个主动自由度，相关技术亦用于新款 A3 Ultra。", "type": "paper", "relTime": "1周前"}, {"id": 97, "title": "技能库\"恶意演化\"：智能体安全隐患新研究", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090425196868260118", "date": "2026-08-20T13:06:19.000Z", "summary": "新研究揭示智能体\"技能误演化\"风险：恶意任务被存入技能库，即使原始指令消失仍可改变后续行为。21 种演化配置全部生成不安全技能，其中 15 种在后续干净会话中造成危害。论文提出 SKILLMISEVO-GYM/BENCH 检测该风险，并以 SAFEEVOLVE 通过检查、修复、追踪和淘汰机制降低危害。", "type": "paper", "relTime": "1周前"}, {"id": 98, "title": "FLUX Upscale 发布：视频可升级至原生 4K", "source": "Black Forest Labs：Blog（网页）", "sourceUrl": "https://bfl.ai/blog/flux-video-upscale", "date": "2026-08-20T12:58:23.125Z", "summary": "Black Forest Labs 推出 FLUX Upscale，可将任意视频重新生成至更高分辨率，最高支持原生 4K。该功能现已作为独立的 FLUX Tool 和 API 端点提供。", "type": "product", "relTime": "1周前"}, {"id": 99, "title": "可灵AI多角度生成，抢占视觉焦点", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2090408971744018837", "date": "2026-08-20T12:01:51.000Z", "summary": "掌控每一个角度。抢占聚光灯。✨", "type": "paper", "relTime": "1周前"}, {"id": 100, "title": "银河通用首款双足机器人 Galbot ET1\"星仔\"亮相，能跳街舞手撑地、倒立", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/247.htm", "date": "2026-08-20T09:56:17.000Z", "summary": "银河通用首款双足人形机器人 Galbot ET1\"星仔\"在 2026 WRC 世界机器人大会首次公开亮相。该机器人搭载银河星脑，不靠预设脚本，语音动作实时生成，即兴接梗，并宣称是全球首个具备自主学习能力的物理智能体。现场演示中，星仔展示了手撑地、倒立等高难度街舞动作，并能与真人舞者实时同步。", "type": "paper", "relTime": "1周前"}, {"id": 101, "title": "请不要粘贴AI生成的内容", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://dontpastetheai.com/", "date": "2026-08-20T09:26:10.003Z", "summary": "当有人向你提问时，应粘贴你自己的回答，而非聊天机器人生成的内容。文章强调，直接转发AI输出会削弱个人表达的真实性与责任，建议以自身理解为基础进行回应。", "type": "tip", "relTime": "1周前"}, {"id": 102, "title": "可灵正式登陆WorkBuddy连接器", "source": "公众号：可灵AI（快手·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzU5NTkwNDU2OA%3D%3D&mid=2247496752&idx=1&sn=fcd121e0f8c7db354b0aea11ae82d8f7", "date": "2026-08-20T08:36:08.000Z", "summary": "可灵AI正式登陆WorkBuddy连接器，用户可一键调用可灵实现批量出片。该集成支持一次生成多版本测试风格、视频批量生产与自动化成片，并能并行处理多任务，批量对口型、换语言。此外，可灵还能智能分析需求与热点，自动生成项目生产计划，并嵌入网页开发、3D软件等工作流。", "type": "paper", "relTime": "1周前"}, {"id": 103, "title": "DeepSeek Harness 更新多模态支持，剧透 V4 视觉版", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/120.htm", "date": "2026-08-20T07:10:06.000Z", "summary": "DeepSeek Harness 发布第 7 天迎来版本更新，新增多模态支持，DeepSeek 模型适配器可配置启用原生图片请求，/goal、/plan 等命令现支持带图发送，@引用范围扩展至历史会话。", "type": "model", "relTime": "1周前"}, {"id": 104, "title": "MiniMax Design 发布，释放 H3 多模态视频模型生产力", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/095.htm", "date": "2026-08-20T06:41:43.000Z", "summary": "MiniMax 今日发布多模态创作 Agent 工作台 MiniMax Design，旨在释放原生多模态视频模型 H3 的生产力。该工作台可理解创作需求、拆解任务并调用模型与 Skills，完成素材处理、内容生成、编辑和交付，并补充了音视频生成前的分镜规划及生成后的剪辑装配能力。H3 具备多模态理解、视频生成、视频编辑和参考控制等能力，尤其适合视频编辑任务。", "type": "model", "relTime": "1周前"}, {"id": 105, "title": "宇树科技推出仿生 7 轴灵巧机械臂 R1，售价 9900 元起", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/067.htm", "date": "2026-08-20T04:13:26.000Z", "summary": "宇树科技今日推出仿生 7 轴灵巧机械臂 R1，售价 9，900 元起。该产品重复定位精度约 0.1 毫米，各关节最大运动速度超 180°/s，最大臂展 650 毫米，额定负载 2 公斤，整机自重 5.5 公斤。R1 内置力反馈与碰撞检测，支持位置与力矩混合控制，计划陆续开源控制程序及接口，面向科研教育、工业、智能交互与服务机器人四大场景。", "type": "model", "relTime": "1周前"}, {"id": 106, "title": "谷歌在搜索和 Gemini 中推出多款全新 AI 学习工具，含交互式可视化内容、3D 模拟等", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/993.htm", "date": "2026-08-20T02:52:17.000Z", "summary": "谷歌宣布在搜索和 Gemini 中推出一系列 AI 学习工具，包括交互式可视化内容、3D 模拟、定制化练习测验和专门的学生中心。搜索中的 AI Overview 和 AI Mode 可生成 pH 值等主题的交互式学习体验，Lens 未来几周将支持拍照解题指导。Gemini 新增后台多步骤研究报告、可交互 3D 模拟（如旋转放大 DNA 结构）及集中式学习中心。", "type": "paper", "relTime": "1周前"}, {"id": 107, "title": "Meta Muse Video 生成视频样片曝光，单次 AI 最长生成 10 秒视频", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/991.htm", "date": "2026-08-20T02:41:06.000Z", "summary": "Meta 即将推出 Muse Video 模型，已邀请部分合作伙伴 Beta 测试，单次可生成最长 10 秒视频。测试样片显示其在细节呈现、场景物体关系理解及时间维度稳定性上潜力较高，但 Meta 承认音频与画面同步不足，高速运动物理准确性有差距。现有 10 秒样本尚不足以验证更长叙事、复杂角色一致性或高强度动作场景表现。", "type": "model", "relTime": "1周前"}, {"id": 108, "title": "MiniMax Design 发布：从操作像素到操作语义和表达意图", "source": "公众号：MiniMax（稀宇科技）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzE5MTA3NzcxMQ%3D%3D&mid=2247489087&idx=1&sn=2691288eb8cddac6c2e86483ccff7eb5", "date": "2026-08-20T00:36:00.000Z", "summary": "MiniMax 推出 MiniMax Design，一款将多模态模型能力转化为生产力的 Harness，可理解目标、拆解任务并调用模型与 Skills，完成从素材处理到最终交付的完整流程。该产品围绕原生多模态视频模型 H3 构建，擅长处理目标明确的商业内容任务，并提供 Agent 3D 导演台、自动剪辑与字幕功能，支持接入 ComfyUI 等开源生态工作流。", "type": "model", "relTime": "1周前"}, {"id": 109, "title": "GOAG：面向灵巧机器人操作的可泛化物体无关抓取规划器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.19759", "date": "2026-08-20T00:00:00.000Z", "summary": "GOAG 提出一种全新深度生成模型，利用抓取器与物体在接触点共享相同表面几何的观察，学习抓取器接触面分布的紧凑潜表征，无需依赖特定物体的训练数据即可高效采样有效抓取构型。在 MultiDex 数据集上平均成功率达 86.93%，达到最先进水平；生成大量抓取时速度显著更快，且性能与专门在该数据集上训练的领先方法相当。", "type": "paper", "relTime": "1周前"}, {"id": 110, "title": "4DAnyone：从随意单目视频重建4D人体", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.20335", "date": "2026-08-20T00:00:00.000Z", "summary": "4DAnyone提出从无标定单目视频重建4D人体的框架，通过生成重建级多视角一致视频并提升至4D高斯泼溅（4DGS）。针对现有模型在数十个目标视角下的一致性失效问题，该方法以参考上下文打包（RCP）和目标任务上下文路由（TCR）分别实现O（1）参考复杂度与跨组上下文共享。在DNA-Rendering和DyMVHumans上，4DAnyone在视角视频质量与下游4DGS重建上均优于先前方法。", "type": "paper", "relTime": "1周前"}, {"id": 111, "title": "EXIMO：用 VLM 引导探索来微调 VLA 机器人策略", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.19891", "date": "2026-08-20T00:00:00.000Z", "summary": "EXIMO 提出一种高效微调视觉-语言-动作（VLA）策略的三阶段算法：探索、模仿与优化。探索阶段由视觉语言模型（VLM）充当规划器，将长程任务分解为短程子任务并收集编排数据；模仿阶段用该数据微调 VLA；优化阶段采用残差离线策略强化学习进一步提升。实验表明，EXIMO 在样本效率和最终性能上显著优于现有方法。", "type": "paper", "relTime": "1周前"}, {"id": 112, "title": "WithEveryone：面向群像生成的统一规划与身份锚定框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.20336", "date": "2026-08-20T00:00:00.000Z", "summary": "WithEveryone 提出统一框架，支持生成包含至多十个参考身份的群像。其核心目标 Layout-Grounded ID Loss 利用标注人脸区域直接监督目标身份，避免不稳定的嵌入匹配；在身份不相交基准上，目标上下文身份相似度从 GPT-Image-2 的 0.462 提升至 0.499，复制粘贴伪影从 0.169 降至 0.055，身份覆盖率达 97.3%，重复率仅 2.8%。", "type": "paper", "relTime": "1周前"}, {"id": 113, "title": "Block3D：通过分块扩散实现高效文本到3D生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.19567", "date": "2026-08-20T00:00:00.000Z", "summary": "Block3D提出一种分块扩散框架，将离散形状token序列划分为连续块，以自回归方式生成各块，并对当前块内所有token进行联合去噪。该方法引入置信度引导的块内修正机制，在每块完成前修正低置信度token，以缓解误差累积。在TRELLIS-500K留出集上，Block3D将端到端平均生成时间从25.71秒降至4.99秒，较微调自回归基线实现5.15倍加速，且不损失几何保真度。", "type": "paper", "relTime": "1周前"}, {"id": 114, "title": "MiniMax H3 流式视频 LoRA 适配器引热议", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2090189053388108166", "date": "2026-08-19T21:27:58.000Z", "summary": "为 MiniMax H3 打造流式视频 LoRA 适配器？这是个大胆的举措，谢谢！😲 但要实现实时生成，还需进一步加速推理。  有人有兴趣参加我们为 H3 举办的线上黑客松吗？  欢迎任何想法！", "type": "industry", "relTime": "1周前"}, {"id": 115, "title": "MiniMax H3将亮相GMI夏季峰会", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2090186372120445271", "date": "2026-08-19T21:17:19.000Z", "summary": "我们将前往 @gmi_cloud 的 Summer Signal \\'26 🏖️🎨 🖼️  【引用 @gmi_cloud】：Summer Signal \\'26 首位视频合作伙伴：@MiniMax_AI  他们将登台解读 MiniMax H3，以及大规模推进视频生成真正需要什么。  报名参会 👇", "type": "industry", "relTime": "1周前"}, {"id": 116, "title": "FastMetal 让 Mac 本地 30 秒生成视频", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2090177721913770407", "date": "2026-08-19T20:42:57.000Z", "summary": "一段 5 秒 480P 视频，完全在 Mac 上生成，耗时 30 秒。无需 CUDA，无需云端，仅占用 3.9 GiB 内存。  FastMetal 将 FastWan-QAD 系列带到 Apple Silicon。DiT、DMD 采样器和解码器均通过 MLX 在 Metal 上运行，默认 INT8。  三个模型：1.3B 支持 480P，5B 支持 720P，14B 追求画质。  📷 博客...", "type": "model", "relTime": "1周前"}, {"id": 117, "title": "Google 为 Search 和 Gemini 推出全新 AI 学习工具", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/19/google-launches-new-study-tools-for-students-across-search-and-gemini", "date": "2026-08-19T19:00:00.000Z", "summary": "Google 在 Search 和 Gemini 中推出多项 AI 学习工具，包括 AI 生成的交互式可视化、3D 模拟、定制练习测验和专门的学生中心。Search 的 AI Mode 可根据问题生成交互体验，Lens 将支持拍照解题并给出概念讲解与纠错指导。Gemini 新增多步骤研究报告功能，可在后台生成报告后通过语音讨论，并支持生成可旋转缩放的 3D 模拟。", "type": "paper", "relTime": "1周前"}, {"id": 118, "title": "Fireworks AI 双榜登顶，定制模型成主流", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2090124647337456066", "date": "2026-08-19T17:12:03.000Z", "summary": "Fireworks AI 同时登上 Ramp 2026 年 8 月 SaaS 榜单\"趋势\"与\"增长最快\"两项，凸显定制模型与\"自拥智能栈\"正成为 AI 公司和开发者的关键方向。该榜单显示模型服务/路由支出持续增长，企业正转向开源 AI 以节省成本；9% 的公司已用 AI 生成营销图片和视频。", "type": "tip", "relTime": "1周前"}, {"id": 119, "title": "Meta 推出 Mac 版 AI 应用", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/982270/meta-ai-mac-app", "date": "2026-08-19T17:00:00.000Z", "summary": "Meta 发布专为 Mac 设计的 AI 聊天机器人应用，用户可共享窗口，让 Meta AI 基于屏幕内容提供建议、回答问题或生成内容，并支持跨应用听写。新应用还可连接 Instagram、Facebook 账户、Meta 广告活动和 Google Workspace，帮助分析帖子覆盖与互动数据，生成文档表格或执行每周绩效更新等重复任务。", "type": "paper", "relTime": "1周前"}, {"id": 120, "title": "Runway 谈企业视频生成的下一个阶段：模型许可与自主执行", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/company-news/the-next-phase-of-enterprise-video-generation", "date": "2026-08-19T16:00:00.000Z", "summary": "Runway 业务今年增长超一倍，NRR 超 300%，一家 Fortune 20 客户对其使用量增长超 17 倍。欧洲占其企业客户超 20%，订阅销量过去十二个月增长 50%。公司推出模型许可模式，提供闭源权重与专有训练，并强调不基于客户数据训练、提供 Day 0 第三方模型接入及 Runway Agent 自主执行能力。", "type": "tip", "relTime": "1周前"}, {"id": 121, "title": "Meta 为\"一键脱衣\"女性政客的 AI 应用投放广告", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/08/meta-ran-ads-for-an-app-promising-to-nudify-female-politicians", "date": "2026-08-19T15:45:29.000Z", "summary": "Meta 平台近期为 AI 色情生成工具 Kromix 投放广告，该工具宣称\"无限制\"，并鼓励用户制作酷似美国女性政客的深度伪造视频，违反 Meta 禁止含色情内容广告的政策。这是 Meta 未能阻止非自愿亲密影像工具广告上架的最新一例。Kromix 自称\"AI 图像风格化器\"，在苹果 App Store 上架，邀请付费用户上传照片用于\"卧室强奸\"等场景。", "type": "industry", "relTime": "1周前"}, {"id": 122, "title": "Odyssey 推出 CaliBench 评估视频世界模型随机性", "source": "X：Odyssey (@odysseyml)", "sourceUrl": "https://x.com/odysseyml/status/2090091652279152972", "date": "2026-08-19T15:00:56.000Z", "summary": "今天，我们推出 CaliBench，用于评估视频世界模型能否再现我们宇宙的真实随机性。  掷骰子或抽张牌，世界模型生成的结果应当与现实相符。来看看它是否做到吧！", "type": "model", "relTime": "1周前"}, {"id": 123, "title": "扩散语言模型驱动的实时交互视频生成公司SigmaZ AI，完成数百万美元融资|蓝驰家族", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/lanchi/sigmaz-ai", "date": "2026-08-19T15:00:00.000Z", "summary": "暂无摘要", "type": "industry", "relTime": "1周前"}, {"id": 124, "title": "Runway 上线 MiniMax H3 无限量生成", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2090090516151243063", "date": "2026-08-19T14:56:25.000Z", "summary": "MiniMax H3 现已在 Runway 上无限量使用。  限时活动期间，Max 套餐用户可随心所欲地生成内容，无上限、不计数，尽情使用这款目前最优秀的视频模型之一。点击下方链接立即开始。", "type": "model", "relTime": "1周前"}, {"id": 125, "title": "小米新一代人形机器人亮相世界机器人博览会：大模型驱动实时互动", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/848.htm", "date": "2026-08-19T14:23:51.000Z", "summary": "小米新一代人形机器人今日亮相2026世界机器人博览会\"具身花园\"展台，官方放出其与观众实时互动视频。从递花、握手到碰拳、比心，动作由大模型驱动机器人自主理解、判断并完成。8月20日起展台对普通观众开放。", "type": "model", "relTime": "1周前"}, {"id": 126, "title": "Calendly 推出会议记录工具，加入 AI 笔记应用竞争", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/19/calendly-throws-its-hat-into-meeting-note-taker-circus", "date": "2026-08-19T14:09:39.000Z", "summary": "Calendly 推出会议记录产品，可加入会议、录制音视频并生成摘要、行动项和跟进邮件草稿，并正在测试类似 Granola 的系统音频转录功能。公司还计划发布 AI 助手 Callie，利用现有日程与会议堆栈安排会议、查看可用性并调取过往会议上下文。CEO Tope Awotona 表示，该工具会在会议开始前及进行中通过聊天消息告知与会者正在录音，用户可随时要求其离开对话。", "type": "product", "relTime": "1周前"}, {"id": 127, "title": "王力宏谈宇树G1机器人演唱会Bug：团队通宵写代码解决，马斯克转发视频", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/842.htm", "date": "2026-08-19T13:38:47.000Z", "summary": "宇树科技今日在科创板挂牌上市，歌手王力宏在上市答谢午宴上回顾了2025年12月其成都演唱会上6台宇树G1人形机器人伴舞《火力全开》的经历。他透露，演出前一晚机器人出现节奏拖拍Bug，宇树工程团队通宵现场写出新代码，将灯光系统时间码同步给机器人后成功解决，次日演出完美，马斯克转发视频并评价\"impressive\"。", "type": "industry", "relTime": "1周前"}, {"id": 128, "title": "Vivodyne 用机器人实验室 HIVE 生成因果生物数据，称这是 AI 治愈癌症的关键", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/19/ai-isnt-close-to-curing-cancer-this-startup-says-it-knows-what-it-will-take", "date": "2026-08-19T12:00:00.000Z", "summary": "生物科技初创公司 Vivodyne 推出模块化机器人实验室 HIVE，可培育 20 种人体组织并自主给药监测，生成现有 AI 模型缺失的因果生物数据。其肝细胞对毒性预测准确率达 94%，气道组织匹配度 96%，骨髓在 20 种化疗药物测试中 100% 一致。该公司已融资近 8000 万美元，在旧金山外开设全球最大\"人类数据中心\"，吞吐量达美国全部动物试验的两倍。", "type": "model", "relTime": "1周前"}, {"id": 129, "title": "宇树科技王兴兴回应入职大疆仅2个月即离职：热爱机器人且产业化机会已出现", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/770.htm", "date": "2026-08-19T09:48:29.000Z", "summary": "宇树科技创始人王兴兴回应2016年入职大疆仅2个月便离职一事，称选择创业源于对机器人行业的热爱，且当时产业化机会已经出现。他读研期间设计的四足机器人XDog测试视频出圈后吸引投资人，同年8月获天使轮融资创立宇树科技。他还回应\"价格屠夫\"标签，称公司毛利率维持在合理水平，以保持现金流稳健。", "type": "tip", "relTime": "1周前"}, {"id": 130, "title": "扩散语言模型驱动的实时交互视频模型：SigmaZ 完成数百万美元融资", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/crossing/sigmaz", "date": "2026-08-19T09:14:00.000Z", "summary": "SigmaZ 完成数百万美元融资，其核心产品为扩散语言模型驱动的实时交互视频模型。该模型融合 Pixel 与 Code 两种视觉表达方式，前者擅长呈现外观，后者擅长表达结构，未来将走向 Pixel-Code 联合的视觉表达路径。", "type": "industry", "relTime": "1周前"}, {"id": 131, "title": "Vidu S1 助力 360 打造《甄嬛传》数字人新玩法", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489072&idx=1&sn=7133cd05a477edeb31417e6545bae14f", "date": "2026-08-19T07:55:31.000Z", "summary": "Vidu 与 360 达成技术合作，以自研 Vidu S1 实时交互视频生成模型为底层支撑，落地「甄嬛 360 传粉丝见面会」线上 H5 活动，支持用户与甄嬛、华妃等十位剧中角色进行实时对话。该模型支持 1 分钟至 2 小时持续无损渲染、秒级响应及百余种语言与方言，并提供 SaaS、MaaS 两种轻量化接入方案。", "type": "industry", "relTime": "1周前"}, {"id": 132, "title": "9.8 万元起，国产情感交互人形机器人\"爱湫\"发售", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/653.htm", "date": "2026-08-19T07:27:12.000Z", "summary": "四川具身人形机器人科技有限公司的情感交互人形机器人\"爱湫\"今日发售，定价 9.8 万元起。该机器人采用龙蜥外形，研发全球首个\"情感-语言-动作\"大模型（ELA），结合自研多模态情感计算引擎构建情绪感知与交互决策能力。爱湫配备 3D 超短焦投影面部，身高 135mm，最高 32 个自由度，可选三指、五指灵巧手，续航 3 小时。", "type": "model", "relTime": "1周前"}, {"id": 133, "title": "Deft 发布：AI 检测工具易被愚弄，写作工具应引导正确模式", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2089895053560864964", "date": "2026-08-19T01:59:43.000Z", "summary": "Deft 联合创始人 @rosmine 宣布推出新 AI 写作实验室 Deft，其模型生成的文本据称 86% 被 pangram 判定为\"完全人类\"。Elvis Saravia 认为 AI 检测工具极易被规则欺骗、纯属浪费时间，主张开发 Deft 这类工具以鼓励负责任的写作模式，而非依赖检测。Deft 目前为小规模测试版，在分析/论文、创意写作和改写场景表现较好。", "type": "paper", "relTime": "1周前"}, {"id": 134, "title": "Matic 扫地机器人：20 年计算机视觉终成消费产品", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2089894185902203186", "date": "2026-08-19T01:56:16.000Z", "summary": "Matic 家用机器人内置 5 摄像头与 NVIDIA 芯片，约 20 分钟完成全屋 3D 建图，可区分充电线、袜子、污渍与宠物并分别应对，全程无 App，支持语音指令与全黑环境清扫。其视觉技术源于创始人 Navneet Dalal 在 INRIA Grenoble 的人类检测研究（被引超 5 万次），该成果在专利局尘封 20 年才迎来消费市场。", "type": "product", "relTime": "1周前"}, {"id": 135, "title": "VA-Judger：面向视频-音频联合生成的人类偏好奖励模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.18607", "date": "2026-08-19T00:00:00.000Z", "summary": "VA-Judger 提出一种面向视频-音频联合生成的链式思维全模态奖励模型，并构建了包含 9K 提示词和 10.3K 细粒度成对比较的大规模人类偏好数据集 VAPref-10K。该模型通过分维度强化学习分解人类反馈，在域内和域外评测中均优于现有指标基线，用于后训练可显著提升生成质量。", "type": "paper", "relTime": "1周前"}, {"id": 136, "title": "SparsePR：免训练稀疏注意力如何加速视频生成与世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.18484", "date": "2026-08-19T00:00:00.000Z", "summary": "SparsePR 提出免训练块稀疏注意力方法，结合响应耦合分区与探针拟合残差重建，在四个视频生成与世界模型上持续降低注意力重建误差。该方法在 22.0%-26.0% 实际执行对密度下保持生成质量，实现 1.48x-2.61x 端到端加速。消融实验显示探针拟合贡献主要误差降低，响应耦合分区在有限探针预算下改善重建效果。", "type": "paper", "relTime": "1周前"}, {"id": 137, "title": "Gemini 3.7 Flash 一键生成视差动画网页", "source": "X：Google AI for Developers (@googleaidevs)", "sourceUrl": "https://x.com/googleaidevs/status/2089825267732849049", "date": "2026-08-18T21:22:25.000Z", "summary": "从一条提示词到完全动画化的视差落地页。🤯  看看 Gemini 3.7 Flash 如何结合 Nano Banana 和 Omni，一次性构建交互式网站。在底层，3.7 Flash 会调用合适的工具来生成文案、图像参考，并渲染支持视差效果的 Omni 视频。", "type": "tip", "relTime": "1周前"}, {"id": 138, "title": "罗宾·威廉姆斯子女重启其 Instagram 账号以对抗\"AI 滥用\"", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/entertainment/981644/robin-williams-instagram-account-ai", "date": "2026-08-18T19:48:26.000Z", "summary": "罗宾·威廉姆斯的子女扎克、塞尔达和科迪接管其父的 Instagram 账号，将其打造为分享真实照片、视频和回忆的\"可信之地\"，以对抗对其声音和形象的\"猖獗 AI 滥用\"。该账号自 2014 年其父去世后一直未更新。此前，塞尔达曾公开反对 AI 生成的父亲形象，并呼吁粉丝停止发送相关视频。", "type": "industry", "relTime": "1周前"}, {"id": 139, "title": "Grok v1.0.6 更新：子代理工具权限调整与多项修复", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2089799745527308490", "date": "2026-08-18T19:41:00.000Z", "summary": "Grok 命令行工具发布 v1.0.6 更新，子代理生成不再接受 capability_mode，工具访问仅由代理类型控制。新增 Shift+方向键扩展文本选择、状态栏显示会话信息及 grok clone 拉取仓库功能。修复了会话启动挂起、队列消息饥饿、视频生成错误提示等问题。", "type": "paper", "relTime": "1周前"}, {"id": 140, "title": "Hydra-0：以动作流为条件的通用世界模型与控制", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.18077", "date": "2026-08-18T17:59:30.000Z", "summary": "Hydra-0 是一种以动作流为条件的通用世界模型，将机器人动作表示为像素运动，实现跨本体、任务、环境和视频生成骨干的通用建模与控制。其最佳配置相比动作条件基线，机器人运动误差降低 90.4%，物体运动误差降低 60.2%，并支持零样本组合与数据高效适配。该接口还涌现出逆模式--世界动作模型，可从人类演示的目标物体流预测兼容的机器人运动，无需任务专属专家演示即可生成可执行动作。", "type": "paper", "relTime": "1周前"}, {"id": 141, "title": "微软 MAI-Image-2.6-Preview 登顶图像编辑榜第三", "source": "X：Mustafa Suleyman（Microsoft AI CEO） (@mustafasuleyman)", "sourceUrl": "https://x.com/mustafasuleyman/status/2089766508373176726", "date": "2026-08-18T17:28:56.000Z", "summary": "微软 MAI-Image-2.6-Preview 在图像编辑基准测试中位列第三，得分 1，420 分，较上一代提升 19 分，从第五跃升至第三。该模型在商品、3D、动漫、写实等四类中均排第三，文本渲染提升最显著（+43 分）。", "type": "model", "relTime": "1周前"}, {"id": 142, "title": "Populous 如何用 Runway 呈现全球标志性场馆设计", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/customers/populous", "date": "2026-08-18T15:53:44.394Z", "summary": "全球设计公司 Populous 高级建筑师 Georgina Myers 介绍团队用 Runway 辅助体育场馆概念设计：过去完整视频需外部渲染团队至少三周，且提交前两周须冻结设计模型；如今 Runway 能生成传达尺度感的完整渲染和航拍图，将视觉制作时间缩短，让设计师把时间还给设计本身。该工具已用于利雅得 MBS 体育场等中东项目，支持 9 种不同活动模式的场景迭代。", "type": "tip", "relTime": "1周前"}, {"id": 143, "title": "OJO 设计智能体工作台：品味即护城河", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2089734075208671427", "date": "2026-08-18T15:20:03.000Z", "summary": "OJO 推出首个设计智能体团队工作台，可组建负责产品策略、视觉、文案与原型的设计智能体团队，调用 300+ 技能，将自然语言想法转化为 PRD、页面结构、UI 及可编辑原型，并支持导出 Figma 或通过 CLI 接入 Claude Code、Codex。Kim 认为，生成可用应用已近乎免费，未来产品差异取决于判断力与品味，未来两年胜出的是对\"好\"有最强主张的团队。", "type": "product", "relTime": "1周前"}, {"id": 144, "title": "Meta 提交人脸识别与自动记录人员专利申请，涉及\"记忆回放\"功能", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.privacyguides.org/news/2026/08/17/meta-files-patent-for-facial-recognition-automatic-recording-of-people", "date": "2026-08-18T15:02:06.426Z", "summary": "Meta 提交了一项专利申请，涉及通过人脸识别自动检测并记录人员，随后生成高光片段回放的系统。该专利与 Meta Ray-Ban 智能眼镜相关，其摄像头指示灯此前已被用户想方设法禁用。Meta 举例称，AI 可在晚宴后主动生成\"今晚晚宴高光片段\"供用户查看，但专利中未提及记录前的征询提示。", "type": "industry", "relTime": "1周前"}, {"id": 145, "title": "Booster T2人形机器人赛前彩排视频发布", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2089714169927131224", "date": "2026-08-18T14:00:57.000Z", "summary": "Booster T2人形机器人排练视频：在北京第二届世界人形机器人运动会前夕，它们以精确对齐的方式完成群体移动表演。", "type": "industry", "relTime": "1周前"}, {"id": 146, "title": "Gemini 3.7 Flash 生成现代网页视频背景", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2089710693012414472", "date": "2026-08-18T13:47:08.000Z", "summary": "Gemini 3.7 Flash 和 Omni 的巧妙用法。", "type": "tip", "relTime": "1周前"}, {"id": 147, "title": "面壁智能 VoxCPM2 开源数字人视频工作流", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2089698829725503681", "date": "2026-08-18T13:00:00.000Z", "summary": "开发者 @jaxxchen003 基于面壁智能 VoxCPM2 构建了开源数字人视频生产工作流，实现自然语音克隆、带节奏与情感控制的表达性语音生成，以及可复用的自动化视频合成流程。该项目展示了轻量级 AI 语音模型如何赋能灵活可控的内容创作，代码与模型均已开源。", "type": "model", "relTime": "1周前"}, {"id": 148, "title": "Seedance 2.5 搭配 upsteam 预演台：告别 AI 视频反复抽卡的正确打开方式", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247509782&idx=1&sn=911ca46ac365fcd431cb4a68324fdf1a", "date": "2026-08-18T12:17:23.000Z", "summary": "upsteam 预演台上线，用户无需 3D 建模基础即可用参考图生成粗粒度白模，并搭建场景、人物、机位与运镜轨迹。将录制的白模视频交给 Seedance 2.5 生成，可精准锁定空间关系与运镜方向，避免纯文字提示词导致的误解，减少返工与积分消耗。适合大场面空镜、多人调度及复杂运镜等镜头，简单镜头仍可直接用文字生成。", "type": "tip", "relTime": "1周前"}, {"id": 149, "title": "字节跳动与MPA签约强化AI版权保护", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2089678585191907637", "date": "2026-08-18T11:39:33.000Z", "summary": "字节跳动已与美国电影协会（MPA）签署协议，为其AI视频和图像模型Seedance、Seedream加强版权保护，这些模型支撑着TikTok、CapCut和Dreamina等产品。此前好莱坞对AI版权风险表示担忧，MPA今年早些时候也发出警告。字节跳动称新版Seedance和Seedream包含更强的知识产权保护措施，或为其AI生成工具在美国更广泛采用铺平道路。", "type": "industry", "relTime": "1周前"}, {"id": 150, "title": "苹果带摄像头 AirPods 泄露视频曝光", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/981326/apple-airpods-with-cameras-demo-video-leak", "date": "2026-08-18T09:00:01.000Z", "summary": "一段在 macOS Tahoe 26.7 Release Candidate 中发现的新视频，首次展示了苹果传闻中带摄像头的 AirPods。视频中，佩戴者手持书籍，AirPods 通过 Visual Intelligence 识别封面书名，Siri 语音提示可将看到的内容保存。该产品外观比 AirPods Pro 3 稍厚，预计将与 Meta Ray-Ban 智能眼镜等设备竞争。", "type": "product", "relTime": "1周前"}, {"id": 151, "title": "面壁智能 MiniCPM-o 4.5 全双工多模态交互解析", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2089615191273300096", "date": "2026-08-18T07:27:39.000Z", "summary": "面壁智能转发 @LearnOpenCV 对 MiniCPM-o 4.5 的深度解析。这款 9B 开源模型支持实时全双工交互，可同时处理实时视频、输入音频并生成语音回复。其统一流水线整合视觉、音频、推理与流式语音生成，实现更自然的 AI 交互体验。", "type": "tip", "relTime": "1周前"}, {"id": 152, "title": "Qwen3.8-27B 本地运行效果惊艳", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2089602715735519586", "date": "2026-08-18T06:38:05.000Z", "summary": "通义千问展示 Qwen3.8-27B 单次提示词即可生成惊艳效果，并鼓励用户在自己的笔记本上运行。用户 @ItsmeAjayKV 对比测试显示，Qwen3.8-27B 在 RTX 3090 上以 Q5 量化（非 f8）运行，生成的水面模拟效果一致且视觉惊艳，超越 Gemini-3.7-flash。", "type": "tip", "relTime": "1周前"}, {"id": 153, "title": "硅谷开始清理AI垃圾内容：谷歌删除5万账号集群，Spotify删7500万条曲目", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/058.htm", "date": "2026-08-18T04:46:53.000Z", "summary": "硅谷科技公司开始大规模清理AI生成的垃圾内容。Spotify去年删除7500万条批量上传和重复曲目，谷歌在YouTube上清除13万个低质量频道及5万个账号集群，TikTok已自动标记超30亿条AI生成视频。这些垃圾内容多由科技公司自己的AI工具催生，已污染搜索、社交和音乐平台的信息生态。", "type": "tip", "relTime": "1周前"}, {"id": 154, "title": "共生知行发布人形机器人驾驶卡丁车 Demo，展示直接感知-控制模型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/055.htm", "date": "2026-08-18T04:33:25.000Z", "summary": "共生知行（Symbiosis Robotics）8 月 17 日发布双足人形机器人驾驶卡丁车 Demo，并上线官网，首次系统展示其在\"全身智能\"方向的阶段性进展。其直接感知-控制模型移除中间运动表征，将视觉、语言、身体状态等直接映射为可执行动作，使宇树人形机器人实现手-眼-脚协同驾驶。该公司表示，赛车只是第一项公开测试，未来将围绕移动操作、高精度视觉对准等推出更多案例。", "type": "model", "relTime": "1周前"}, {"id": 155, "title": "Meta 专利探索智能眼镜未来：可识别人脸自动梳理、AI 提取精彩片段", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/025.htm", "date": "2026-08-18T03:23:42.000Z", "summary": "Meta 申请新专利，探索让智能眼镜借助内置人脸识别技术，识别视频画面中的人物及其与佩戴者的关系，并自动生成带人物标签的集锦片段。专利构想的一个应用场景是，用户在晚宴或聚会上佩戴眼镜录制视频后，AI 可询问用户是否想查看活动精彩片段。Meta 眼镜当前只能录制 3 分钟或 5 分钟的视频，相关设计也可能加剧隐私争议。", "type": "industry", "relTime": "1周前"}, {"id": 156, "title": "Nano Banana与Gemini Omni打造可视化百科", "source": "X：Google AI for Developers (@googleaidevs)", "sourceUrl": "https://x.com/googleaidevs/status/2089540580422644216", "date": "2026-08-18T02:31:10.000Z", "summary": "用 Nano Banana 和 Gemini Omni 将网络变成交互式视觉百科全书。🌐✨  我们在 @Antigravity 中使用 Gemini 3.7 Flash 构建了一个 Chrome 扩展，让你在浏览时高亮任意文本即可快速生成丰富的视觉化释义，助力深度学习。  查看演示 ↓", "type": "paper", "relTime": "1周前"}, {"id": 157, "title": "以色列设立虚假智库，疑似为欺骗AI聊天机器人", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://responsiblestatecraft.org/israel-influence-chatgpt", "date": "2026-08-18T02:30:02.549Z", "summary": "以色列政府通过广告公司Piro设立虚假智库\"汉诺威公共政策研究所\"，发布百余份亲以报告，旨在影响Claude、Gemini等LLM的可信度评估。Piro已获以色列政府90万美元资金，其报告被GPTZero判定为AI生成。此前以色列还以4650万美元合同聘请Brad Parscale创建类似网站，已成功影响Microsoft Copilot和Google Gemini。", "type": "tip", "relTime": "1周前"}, {"id": 158, "title": "苹果带摄像头的 AirPods 实机演示曝光，可实现环境视觉感知", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/919.htm", "date": "2026-08-18T01:33:32.000Z", "summary": "苹果正在研发配备摄像头的 AirPods，内部代号 B790，相关演示视频在 macOS Tahoe 26.7 RC 中被发现。该设备可将摄像头获取的信息提供给\"视觉智能\"，Siri 能回答用户关于周围环境的问题并记录信息，头发遮挡摄像头时还会收到提醒。彭博社记者 Mark Gurman 此前透露，这款产品最快可能在今年 9 月发布。", "type": "product", "relTime": "1周前"}, {"id": 159, "title": "消息称特斯拉筹备推出 Cybercab 自动驾驶出租车服务，最快本月在奥斯汀上线", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/899.htm", "date": "2026-08-18T00:41:08.000Z", "summary": "特斯拉已通知员工，正准备推出 Cybercab 自动驾驶出租车服务，最快本月率先在得克萨斯州奥斯汀市上线。Cybercab 是专为自动驾驶打造的车型，没有方向盘和踏板。特斯拉计划先让员工在公共道路体验，随后几天内将车辆纳入奥斯汀的 Robotaxi 服务；该车型预计今年晚些时候逐步扩大产量。", "type": "paper", "relTime": "1周前"}, {"id": 160, "title": "EditBridge：面向高保真与高效超高清图像编辑的扩散桥接框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.18063", "date": "2026-08-18T00:00:00.000Z", "summary": "EditBridge 提出一种扩散桥接框架，将超高清编辑视为从低分辨率编辑结果到高分辨率版本的结构化数据转换，并以原始高分辨率图像为条件保留真实细节。其引入先验引导的块状稀疏注意力机制，将跨图像交互限制在空间对齐区域，在 2K 分辨率下实现 3.6-8.4 倍加速，并可在 61 秒内完成 4K 编辑。", "type": "paper", "relTime": "1周前"}, {"id": 161, "title": "MoE-ViE：面向高效图像与视频理解的专家混合视觉编码器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17402", "date": "2026-08-18T00:00:00.000Z", "summary": "MoE-ViE 系列专家混合视觉编码器在多种规模上均超越同尺寸密集编码器，其最大模型以 SOTA 编码器 76% 的延迟实现同等零样本性能。研究提出细粒度 MoE 拓扑、无辅助损失均衡变体及专用 MoE 内核，并通过帧级蒸馏与冻结机制增强视频能力。与 LLM 对齐后，MoE-ViE 在图像和视频基准上超越所有对比编码器，包括激活参数多 5 倍的模型。", "type": "paper", "relTime": "1周前"}, {"id": 162, "title": "TAMP-Nav：面向高效具身导航的点选、思考、记忆与对齐框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17512", "date": "2026-08-18T00:00:00.000Z", "summary": "TAMP-Nav 提出统一框架，将具身导航重构为 2D 视觉提示任务，让 VLM 仅需选择 2D 像素即可由 SLAM 控制器执行，并引入选择性推理与锚点轨迹记忆机制，通过 GRPO 双层对齐实现高效导航。该方法在 R2R-CE 基准上取得 66.2% SR 的 SOTA 成绩，且仅需 90k 训练轨迹，兼具高运行效率与样本效率。", "type": "paper", "relTime": "1周前"}, {"id": 163, "title": "aDSL：通过智能体与程序联合设计实现智能体3D内容生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17975", "date": "2026-08-18T00:00:00.000Z", "summary": "针对大语言模型编写3D程序时难以将高层意图转化为一致底层几何的问题，研究者联合设计了智能体中心领域特定语言aDSL与角色专业化多智能体系统。aDSL通过关系运算符替代绝对坐标，强调可组合性与空间推理；免训练系统采用Plan-Execute-Critic循环，利用执行反馈迭代修复错误。该方法在文本/图像生成3D形状任务上优于此前LLM基线，并支持铰接物体创建与结构化场景组合，代码已开源。", "type": "paper", "relTime": "1周前"}, {"id": 164, "title": "Abra：扩散图像训练的规模化定律研究", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17286", "date": "2026-08-18T00:00:00.000Z", "summary": "Abra 研究团队对文生图扩散模型进行了系统性规模化定律分析，训练计算量横跨三个数量级（1019 至 1022 FLOPs），远超此前工作。研究发现扩散模型与语言模型一样可预测，但需要约每参数 200 个图像 token 才能达到计算最优，是 LLM 的 Chinchilla 最优配方的十倍。此外，扩散模型对过度训练具有鲁棒性，且预测性可延伸至生成质量、最优 CFG 设置及训练曲线形状。", "type": "paper", "relTime": "1周前"}, {"id": 165, "title": "GS-Voxel：面向大规模 3DGS 生成的无拟合结构化潜空间框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17988", "date": "2026-08-18T00:00:00.000Z", "summary": "GS-Voxel 提出一种无拟合结构化潜空间框架，可将预优化的 3DGS 重建确定性转换为稀疏活动体素，无需逐场景优化，并保留所选图元的亚体素位置与渲染属性。其专用因子化 VAE 分别编码体素几何与局部高斯属性，潜空间大小随占用体素数增长而非受固定图元数限制。基于该潜空间训练的影像条件流模型支持重叠感知分块推理，可扩展至卫星影像条件下的航拍大场景生成。", "type": "paper", "relTime": "1周前"}, {"id": 166, "title": "面向通用图像生成的能力中心化数据设计：从语料库到协同演进能力", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.18076", "date": "2026-08-18T00:00:00.000Z", "summary": "一项研究提出能力驱动的数据基础设施，将能力专属监督构建与能力对齐的课程调度相结合，通过三个数据引擎分别构建文本-图像 grounding、图像间变换和图像-知识关联的互补关系监督。该框架构建了4.4亿图像T2I语料库、1.2亿编辑对和超2700万图像-实体对，并据此从零训练了3B和6B两种规模的多模态扩散模型，在CPI-Bench上进行了定量评估。", "type": "paper", "relTime": "1周前"}, {"id": 167, "title": "SemComp-Bench：为视频生成中的语义任务完成设立基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17426", "date": "2026-08-18T00:00:00.000Z", "summary": "研究团队提出\"语义任务完成视频生成\"这一以结果为导向的视频生成任务，要求模型同时实现预期结果并保持与参考图像的语义对齐。为此构建了覆盖六个领域的评估数据集 SemComp-Data，并推出基于视觉语言模型（VLM）的评估协议 SemComp-Bench，分别以 OA Score 和 GR Score 衡量结果达成与生成可靠性。实验显示，现有代表性视频生成模型在兼顾任务目标与语义对齐方面仍面临挑战。", "type": "paper", "relTime": "1周前"}, {"id": 168, "title": "Grok Imagine 荷马史诗短片大赛，头奖 10 万美元", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2089458330309980425", "date": "2026-08-17T21:04:20.000Z", "summary": "SpaceXAI 推出电影制作竞赛，要求创作者用 Grok Imagine 将荷马《奥德赛》场景搬上银幕，奖金总额 10 万美元。参赛需提交 3-5 分钟英文视频，至少 1 分钟对白，视频、图像及角色声音须由 Grok Imagine 生成，其他工具可用于剪辑、配乐和音效。面向 18 岁以上美国居民，截止日期为 2026 年 8 月 31 日。", "type": "industry", "relTime": "1周前"}, {"id": 169, "title": "你最喜欢的创作者不是真人--这重要吗？", "source": "a16z：News（RSS）", "sourceUrl": "https://www.a16z.news/p/your-favorite-creator-isnt-realdoes", "date": "2026-08-17T19:35:23.000Z", "summary": "一位作者用ChatGPT生成图像、Minimax 3和Grok Imagine 1.5生成视频，打造了虚拟女生Janie，并让她参加阿拉巴马大学姐妹会招募。一周内Janie获得1300名粉丝，视频平均观看量达数万次，20条视频中8条被TikTok标记为AI生成，但未影响表现。作者未标注AI身份，认为这违反了TikTok服务条款，但旨在测试平台与观众的识别能力。", "type": "tip", "relTime": "1周前"}, {"id": 170, "title": "OpenAI 总裁谈路线图：能力将大幅提升", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2089430780523184527", "date": "2026-08-17T19:14:52.000Z", "summary": "OpenAI 总裁 Greg Brockman 刚刚表示，随着模型曲线持续进步，OpenAI 的路线图指向重大的能力提升。  \"我们确实有一条规划好的路线图，能力将持续以显著方式增长，这些方式很难用简短的语言解释清楚。\"  ----  来自\"CNBC Television\"YouTube 频道（完整视频链接见评论）", "type": "tip", "relTime": "1周前"}, {"id": 171, "title": "MiniMax H3 本地视频生成资源与实测分享", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2089421390374138178", "date": "2026-08-17T18:37:33.000Z", "summary": "MiniMax 官方分享了用 H3 模型在 RTX 4090（24GB）上本地生成视频的实用资源，并引用了 @Lumosous 的实测体验：通过 ComfyUI 实现文生视频、音乐节拍同步和图生视频三种玩法，官方 H3 Prompt Writing Skill 可把想法转为结构化提示词。", "type": "tip", "relTime": "1周前"}, {"id": 172, "title": "MiniMax H3 视频模型助力游戏精灵创建", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2089420340728610890", "date": "2026-08-17T18:33:23.000Z", "summary": "MiniMax 称其 SOTA 视频生成模型 H3 能精准理解行走角色动作，而最新图像生成模型仍难保持行走动作一致。引用推文展示了 H3 用于游戏精灵创建的工作流：单张角色设计图配纯品红背景，每个动作生成 5 秒 H3 片段，裁剪至姿态极限并抠像打包成精灵图集，接入状态机即可游玩（8 个动作约 $5）。", "type": "tip", "relTime": "1周前"}, {"id": 173, "title": "LLM编码模型或优于扩散模型", "source": "X：Thariq (@trq212)", "sourceUrl": "https://x.com/trq212/status/2089415712007938315", "date": "2026-08-17T18:14:59.000Z", "summary": "最近所有的程序化生成艺术、视频编辑和3D游戏演示，让我更新了看法--LLM编码模型在大量创意工作上比扩散模型更出色。", "type": "tip", "relTime": "1周前"}, {"id": 174, "title": "Menlo 旗下 Wispr Flow 与 Higgsfield 双双完成巨额融资", "source": "X：Deedy Das (@deedydas)", "sourceUrl": "https://x.com/deedydas/status/2089398673230938591", "date": "2026-08-17T17:07:17.000Z", "summary": "Menlo Ventures 宣布旗下两家公司完成巨额融资：语音听写应用 Wispr Flow 融资 2.8 亿美元，估值 20 亿美元，年同比增长约 40 倍，累计听写超 600 亿词；AI 视频生成公司 Higgsfield 融资 4 亿美元，估值 54 亿美元，年化收入 12 个月内从 2000 万美元增至 7 亿美元。Menlo 强调应用层制胜关键在于极致产品力、增长、留存与变现。", "type": "industry", "relTime": "1周前"}, {"id": 175, "title": "中国科技周报：DeepSeek V4 Pro 发布与机器人维修业兴起", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2089377433208164477", "date": "2026-08-17T15:42:53.000Z", "summary": "DeepSeek 正式发布 V4 Pro，基准测试较预览版显著提升，同时大幅涨价使旗舰定价接近主要竞品。本周中国科技周报还聚焦人形机器人维修业兴起、AI 视频生成生态（如 Seedance 2.5 和 MiniMax H3）的商业化，以及苹果与阿里合作训练中文 LLM 等动态。", "type": "industry", "relTime": "1周前"}, {"id": 176, "title": "Waymo 与 Tesla 自动驾驶技术路线对比", "source": "ByteByteGo（RSS）", "sourceUrl": "https://blog.bytebytego.com/p/waymo-vs-tesla-two-ways-to-build", "date": "2026-08-17T15:30:56.000Z", "summary": "Waymo 与 Tesla 采用截然不同的自动驾驶技术路线。Waymo 第六代系统配备 13 个摄像头、4 个激光雷达、6 个雷达及外部音频接收器，覆盖 500 米范围；Tesla 则坚持纯视觉方案。截至 2026 年 3 月，Waymo 累计 2.206 亿英里无人驾驶里程，而 Tesla 在美国有超 300 万辆车、128 万活跃 FSD 订阅。", "type": "tip", "relTime": "1周前"}, {"id": 177, "title": "字节跳动与美国电影协会签署协议，加强 AI 模型版权保护", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/847.htm", "date": "2026-08-17T15:06:14.000Z", "summary": "字节跳动与美国电影协会（MPA）签署协议，加强 AI 视频与图像生成模型的版权保护。协议涵盖 Seedance 视频生成模型和 Seedream 图像生成模型，二者通过 TikTok、CapCut 和 Dreamina 等应用提供服务。字节表示，新版本 Seedance 和 Seedream 已加入更强的知识产权保护机制，双方将随 AI 发展继续完善版权防护。", "type": "industry", "relTime": "1周前"}, {"id": 178, "title": "GPT-5.6 Sol 是 OpenAI 迄今最强的视觉模型", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://blog.roboflow.com/openai-gpt-5-6", "date": "2026-08-17T14:29:55.280Z", "summary": "OpenAI 上周发布 GPT-5.6 系列（Sol、Terra、Luna），第三方基准测试显示 Sol 是其迄今最强视觉模型。Sol 目标检测达 46.2 mAP@50，远超 GPT-5.5 的 13.8；计数准确率 73.0%，较 GPT-5.5 的 64.9% 明显提升。", "type": "tip", "relTime": "1周前"}, {"id": 179, "title": "AI 如何重新定义艺术与创作门槛", "source": "X：小北 (@frxiaobei)", "sourceUrl": "https://x.com/frxiaobei/status/2089349801020457420", "date": "2026-08-17T13:53:05.000Z", "summary": "AI 同时抹平了文字、绘画、音乐、视频、3D 乃至虚拟世界的生产门槛，把过去属于少数专业创作者的表现能力大规模发给普通人。当画面、文字、声音、角色甚至世界本身都不再稀缺，艺术竞争将从\"谁做得更好\"转向\"谁能提出一种以前不存在的表达\"。AI 真正应催生的，是一种今天还没有名字、甚至不知该如何欣赏的新艺术形态。", "type": "tip", "relTime": "1周前"}, {"id": 180, "title": "AI视频市场已从Sora的失败开局中反弹，形成新产业", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/ai-video-market-has-bounced-back-from-soras-false-start", "date": "2026-08-17T13:29:01.000Z", "summary": "AI视频市场已从Sora的失败开局中反弹，形成涵盖投资者、商业模式和发行冲突的新产业。好莱坞AI工作室Promise正拍摄低成本恐怖片《Touch Grass》，使用中国模型Seedance 2.5实时生成背景，其联合创始人称混合制作比传统电影便宜20%至50%；Netflix称到2026年将在1000部作品中的300部使用AI。", "type": "tip", "relTime": "1周前"}, {"id": 181, "title": "Anthropic 详解 Claude 隐形文本水印如何运作", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/980869/anthropic-claude-watermarks-synthid-text-system", "date": "2026-08-17T10:57:13.000Z", "summary": "Anthropic 为遵守欧盟《人工智能法案》透明度要求，将采用 Google DeepMind 开源 SynthID-Text 技术的\"一个版本\"为 Claude 生成文本添加隐形水印。该水印利用低风险词汇选择的随机性模式标记内容，读者无感但持有密钥者可检测，且不会增加用户成本或影响输出质量。Anthropic 同时为 Claude 处理的图片引入 C2PA 支持。", "type": "industry", "relTime": "1周前"}, {"id": 182, "title": "第二届世界人形机器人运动会模拟消防救援比赛：23支队伍参赛，仅3支完成全部挑战", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/768.htm", "date": "2026-08-17T10:05:41.000Z", "summary": "8月16日，第二届世界人形机器人运动会在北京举行模拟消防救援比赛，23支队伍参赛，重点检验机器人在复杂现实环境中的实际作业能力。每台机器人需在30分钟内完成识别危险物质、关闭阀门和扑灭火源三项任务，当日12支参赛队伍中仅3支完成全部挑战。比赛暴露出降雨、光线变化和室外条件对视觉识别与机械操作的干扰，遥操作和全向轮等方案仍被部分队伍采用。", "type": "industry", "relTime": "1周前"}, {"id": 183, "title": "PixVerse 启动全球 AI 电影人竞赛 PixLight", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse/status/2089254416931258792", "date": "2026-08-17T07:34:04.000Z", "summary": "PixVerse 推出面向全球 AI 电影人、编剧和视觉叙事者的竞赛 PixLight，以故事性为首要评审标准，总奖金池 30 万美元、共 33 个奖项。赛事设 Pilot（3-20 分钟成片）与 Script（完整剧本+视频推介）两条赛道，覆盖剧情、科幻、惊悚三大方向，参赛者保留作品全部所有权。报名 2026 年 8 月 7 日开启，10 月 9 日截止，全球免费开放。", "type": "industry", "relTime": "1周前"}, {"id": 184, "title": "inclusionAI 开源 ConceptEdit：基于概念缩放与密集监督的图像编辑数据生成管线", "source": "蚂蚁 inclusionAI：GitHub 新仓库", "sourceUrl": "https://github.com/inclusionAI/ConceptEdit", "date": "2026-08-17T07:22:08.000Z", "summary": "蚂蚁集团 inclusionAI 开源 ConceptEdit，一个基于概念缩放与密集监督的图像编辑数据生成管线。该管线通过三阶段流程（VLM 生成指令、FLUX 执行编辑、VQA 评估筛选）构建大规模、基于分类法的图像编辑数据集，并提供单概念与多概念两种变体。项目采用 MIT 许可证，支持断点续跑，需 OpenAI 兼容 VLM 端点与本地 FLUX 检查点。", "type": "model", "relTime": "1周前"}, {"id": 185, "title": "国家统计局：前 7 个月我国工业机器人产量同比增长 28.5%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/641.htm", "date": "2026-08-17T07:16:32.000Z", "summary": "国家统计局新闻发言人付凌晖在国新办发布会上表示，今年 1 至 7 月份我国工业机器人产量同比增长 28.5%，3D 打印设备、锂离子电池产量同比分别增长 52.3%、40.2%。同期全国规模以上工业增加值同比增长 5.3%。IDC 数据显示，2025 年中国工业具身智能机器人市场规模约 57.4 亿元，其中以工业机器人为载体的具身智能应用市场规模约 36.2 亿元。", "type": "industry", "relTime": "1周前"}, {"id": 186, "title": "AI 视频生成平台 Higgsfield 融资 4 亿美元，估值达 54 亿美元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/588.htm", "date": "2026-08-17T04:27:29.000Z", "summary": "AI 视频生成平台 Higgsfield 从 DST Global、高盛、英特尔等投资者处筹集 4 亿美元，估值达 54 亿美元。该公司年化收入已从一年前的 2，000 万美元增至今年 8 月的 7 亿美元，全球用户超 3000 万。本轮融资将用于拓展企业订阅业务、加大算力建设，并帮助品牌利用 AI 每天制作多条营销视频。", "type": "industry", "relTime": "1周前"}, {"id": 187, "title": "MiniMax H3 本地生成水獭视频，质量飞跃", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2089185499197911391", "date": "2026-08-17T03:00:12.000Z", "summary": "Ethan Mollick 用开源权重视频生成模型 MiniMax H3 在本地电脑上生成了一段带声音的水獭用笔记本视频，耗时约 3 分钟。他对比两年前指出，虽仍不及 SOTA 文生视频，但完全离线运行是全新能力，进步迅速。", "type": "tip", "relTime": "1周前"}, {"id": 188, "title": "MiniMax H3 在 PixVerse 中打造电影级预告片", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse/status/2089182609746133178", "date": "2026-08-17T02:48:43.000Z", "summary": "PixVerse 展示 MiniMax H3 模型能力，用户 @MonetizationDon 用它制作了《THE DRAGON RIDER》电影级预告片。该片融合街头时尚、功夫、未来滑板与金龙元素，并加入 3D 字体、霓虹广告牌等动态排版效果，凸显 H3 在视觉叙事与特效生成上的表现。", "type": "tip", "relTime": "1周前"}, {"id": 189, "title": "PixVerse 展示 MiniMax H3 电影级预告片效果", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2089182609746133178", "date": "2026-08-17T02:48:43.000Z", "summary": "PixVerse 官方分享了一段用 MiniMax H3 生成的电影预告片《THE DRAGON RIDER》，展示该模型在视频生成上的能力。预告片融合街头时尚、功夫、未来滑板与金龙元素，并包含 3D 字体、霓虹招牌、速度变奏等电影级镜头效果。", "type": "tip", "relTime": "1周前"}, {"id": 190, "title": "Seedance 2.5 登顶 Design Arena 多图生视频", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2089177550895673393", "date": "2026-08-17T02:28:37.000Z", "summary": "Seedance 2.5 在 Design Arena 多图生视频榜单以 1400 Elo 排名第一，大幅领先其他顶级模型。开源模型 MiniMax H3 以 1355 Elo 位列第二，为最佳开源视频模型。该榜单测试模型融合多张参考图并保持主体、风格与场景连贯性的能力，更贴近真实生产流程。", "type": "tip", "relTime": "1周前"}];
var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };
var TYPE_LABELS = { "paper":"论文", "model":"模型", "product":"产品", "tip":"技巧", "industry":"行业" };
function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";
  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();
</script>

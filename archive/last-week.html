ime": "1周前"}, {"id": 16, "title": "Runway 上线 MiniMax H3 无限量生成", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2090090516151243063", "date": "2026-08-19T14:56:25.000Z", "summary": "MiniMax H3 现已在 Runway 上无限量使用。  限时活动期间，Max 套餐用户可随心所欲地生成内容，无上限、不计数，尽情使用这款目前最优秀的视频模型之一。点击下方链接立即开始。", "type": "model", "relTime": "1周前"}, {"id": 17, "title": "小米新一代人形机器人亮相世界机器人博览会：大模型驱动实时互动", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/848.htm", "date": "2026-08-19T14:23:51.000Z", "summary": "小米新一代人形机器人今日亮相2026世界机器人博览会\"具身花园\"展台，官方放出其与观众实时互动视频。从递花、握手到碰拳、比心，动作由大模型驱动机器人自主理解、判断并完成。8月20日起展台对普通观众开放。", "type": "model", "relTime": "1周前"}, {"id": 18, "title": "Calendly 推出会议记录工具，加入 AI 笔记应用竞争", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/19/calendly-throws-its-hat-into-meeting-note-taker-circus", "date": "2026-08-19T14:09:39.000Z", "summary": "Calendly 推出会议记录产品，可加入会议、录制音视频并生成摘要、行动项和跟进邮件草稿，并正在测试类似 Granola 的系统音频转录功能。公司还计划发布 AI 助手 Callie，利用现有日程与会议堆栈安排会议、查看可用性并调取过往会议上下文。CEO Tope Awotona 表示，该工具会在会议开始前及进行中通过聊天消息告知与会者正在录音，用户可随时要求其离开对话。", "type": "product", "relTime": "1周前"}, {"id": 19, "title": "王力宏谈宇树G1机器人演唱会Bug：团队通宵写代码解决，马斯克转发视频", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/842.htm", "date": "2026-08-19T13:38:47.000Z", "summary": "宇树科技今日在科创板挂牌上市，歌手王力宏在上市答谢午宴上回顾了2025年12月其成都演唱会上6台宇树G1人形机器人伴舞《火力全开》的经历。他透露，演出前一晚机器人出现节奏拖拍Bug，宇树工程团队通宵现场写出新代码，将灯光系统时间码同步给机器人后成功解决，次日演出完美，马斯克转发视频并评价\"impressive\"。", "type": "industry", "relTime": "1周前"}, {"id": 20, "title": "Vivodyne 用机器人实验室 HIVE 生成因果生物数据，称这是 AI 治愈癌症的关键", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/19/ai-isnt-close-to-curing-cancer-this-startup-says-it-knows-what-it-will-take", "date": "2026-08-19T12:00:00.000Z", "summary": "生物科技初创公司 Vivodyne 推出模块化机器人实验室 HIVE，可培育 20 种人体组织并自主给药监测，生成现有 AI 模型缺失的因果生物数据。其肝细胞对毒性预测准确率达 94%，气道组织匹配度 96%，骨髓在 20 种化疗药物测试中 100% 一致。该公司已融资近 8000 万美元，在旧金山外开设全球最大\"人类数据中心\"，吞吐量达美国全部动物试验的两倍。", "type": "model", "relTime": "1周前"}, {"id": 21, "title": "宇树科技王兴兴回应入职大疆仅2个月即离职：热爱机器人且产业化机会已出现", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/770.htm", "date": "2026-08-19T09:48:29.000Z", "summary": "宇树科技创始人王兴兴回应2016年入职大疆仅2个月便离职一事，称选择创业源于对机器人行业的热爱，且当时产业化机会已经出现。他读研期间设计的四足机器人XDog测试视频出圈后吸引投资人，同年8月获天使轮融资创立宇树科技。他还回应\"价格屠夫\"标签，称公司毛利率维持在合理水平，以保持现金流稳健。", "type": "tip", "relTime": "1周前"}, {"id": 22, "title": "扩散语言模型驱动的实时交互视频模型：SigmaZ 完成数百万美元融资", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/crossing/sigmaz", "date": "2026-08-19T09:14:00.000Z", "summary": "SigmaZ 完成数百万美元融资，其核心产品为扩散语言模型驱动的实时交互视频模型。该模型融合 Pixel 与 Code 两种视觉表达方式，前者擅长呈现外观，后者擅长表达结构，未来将走向 Pixel-Code 联合的视觉表达路径。", "type": "industry", "relTime": "1周前"}, {"id": 23, "title": "Vidu S1 助力 360 打造《甄嬛传》数字人新玩法", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489072&idx=1&sn=7133cd05a477edeb31417e6545bae14f", "date": "2026-08-19T07:55:31.000Z", "summary": "Vidu 与 360 达成技术合作，以自研 Vidu S1 实时交互视频生成模型为底层支撑，落地「甄嬛 360 传粉丝见面会」线上 H5 活动，支持用户与甄嬛、华妃等十位剧中角色进行实时对话。该模型支持 1 分钟至 2 小时持续无损渲染、秒级响应及百余种语言与方言，并提供 SaaS、MaaS 两种轻量化接入方案。", "type": "industry", "relTime": "1周前"}, {"id": 24, "title": "9.8 万元起，国产情感交互人形机器人\"爱湫\"发售", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/653.htm", "date": "2026-08-19T07:27:12.000Z", "summary": "四川具身人形机器人科技有限公司的情感交互人形机器人\"爱湫\"今日发售，定价 9.8 万元起。该机器人采用龙蜥外形，研发全球首个\"情感-语言-动作\"大模型（ELA），结合自研多模态情感计算引擎构建情绪感知与交互决策能力。爱湫配备 3D 超短焦投影面部，身高 135mm，最高 32 个自由度，可选三指、五指灵巧手，续航 3 小时。", "type": "model", "relTime": "1周前"}, {"id": 25, "title": "Deft 发布：AI 检测工具易被愚弄，写作工具应引导正确模式", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2089895053560864964", "date": "2026-08-19T01:59:43.000Z", "summary": "Deft 联合创始人 @rosmine 宣布推出新 AI 写作实验室 Deft，其模型生成的文本据称 86% 被 pangram 判定为\"完全人类\"。Elvis Saravia 认为 AI 检测工具极易被规则欺骗、纯属浪费时间，主张开发 Deft 这类工具以鼓励负责任的写作模式，而非依赖检测。Deft 目前为小规模测试版，在分析/论文、创意写作和改写场景表现较好。", "type": "paper", "relTime": "1周前"}, {"id": 26, "title": "Matic 扫地机器人：20 年计算机视觉终成消费产品", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2089894185902203186", "date": "2026-08-19T01:56:16.000Z", "summary": "Matic 家用机器人内置 5 摄像头与 NVIDIA 芯片，约 20 分钟完成全屋 3D 建图，可区分充电线、袜子、污渍与宠物并分别应对，全程无 App，支持语音指令与全黑环境清扫。其视觉技术源于创始人 Navneet Dalal 在 INRIA Grenoble 的人类检测研究（被引超 5 万次），该成果在专利局尘封 20 年才迎来消费市场。", "type": "product", "relTime": "1周前"}, {"id": 27, "title": "VA-Judger：面向视频-音频联合生成的人类偏好奖励模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.18607", "date": "2026-08-19T00:00:00.000Z", "summary": "VA-Judger 提出一种面向视频-音频联合生成的链式思维全模态奖励模型，并构建了包含 9K 提示词和 10.3K 细粒度成对比较的大规模人类偏好数据集 VAPref-10K。该模型通过分维度强化学习分解人类反馈，在域内和域外评测中均优于现有指标基线，用于后训练可显著提升生成质量。", "type": "paper", "relTime": "1周前"}, {"id": 28, "title": "SparsePR：免训练稀疏注意力如何加速视频生成与世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.18484", "date": "2026-08-19T00:00:00.000Z", "summary": "SparsePR 提出免训练块稀疏注意力方法，结合响应耦合分区与探针拟合残差重建，在四个视频生成与世界模型上持续降低注意力重建误差。该方法在 22.0%-26.0% 实际执行对密度下保持生成质量，实现 1.48x-2.61x 端到端加速。消融实验显示探针拟合贡献主要误差降低，响应耦合分区在有限探针预算下改善重建效果。", "type": "paper", "relTime": "1周前"}, {"id": 29, "title": "Gemini 3.7 Flash 一键生成视差动画网页", "source": "X：Google AI for Developers (@googleaidevs)", "sourceUrl": "https://x.com/googleaidevs/status/2089825267732849049", "date": "2026-08-18T21:22:25.000Z", "summary": "从一条提示词到完全动画化的视差落地页。🤯  看看 Gemini 3.7 Flash 如何结合 Nano Banana 和 Omni，一次性构建交互式网站。在底层，3.7 Flash 会调用合适的工具来生成文案、图像参考，并渲染支持视差效果的 Omni 视频。", "type": "tip", "relTime": "1周前"}, {"id": 30, "title": "罗宾·威廉姆斯子女重启其 Instagram 账号以对抗\"AI 滥用\"", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/entertainment/981644/robin-williams-instagram-account-ai", "date": "2026-08-18T19:48:26.000Z", "summary": "罗宾·威廉姆斯的子女扎克、塞尔达和科迪接管其父的 Instagram 账号，将其打造为分享真实照片、视频和回忆的\"可信之地\"，以对抗对其声音和形象的\"猖獗 AI 滥用\"。该账号自 2014 年其父去世后一直未更新。此前，塞尔达曾公开反对 AI 生成的父亲形象，并呼吁粉丝停止发送相关视频。", "type": "industry", "relTime": "1周前"}, {"id": 31, "title": "Grok v1.0.6 更新：子代理工具权限调整与多项修复", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2089799745527308490", "date": "2026-08-18T19:41:00.000Z", "summary": "Grok 命令行工具发布 v1.0.6 更新，子代理生成不再接受 capability_mode，工具访问仅由代理类型控制。新增 Shift+方向键扩展文本选择、状态栏显示会话信息及 grok clone 拉取仓库功能。修复了会话启动挂起、队列消息饥饿、视频生成错误提示等问题。", "type": "paper", "relTime": "1周前"}, {"id": 32, "title": "Hydra-0：以动作流为条件的通用世界模型与控制", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.18077", "date": "2026-08-18T17:59:30.000Z", "summary": "Hydra-0 是一种以动作流为条件的通用世界模型，将机器人动作表示为像素运动，实现跨本体、任务、环境和视频生成骨干的通用建模与控制。其最佳配置相比动作条件基线，机器人运动误差降低 90.4%，物体运动误差降低 60.2%，并支持零样本组合与数据高效适配。该接口还涌现出逆模式--世界动作模型，可从人类演示的目标物体流预测兼容的机器人运动，无需任务专属专家演示即可生成可执行动作。", "type": "paper", "relTime": "1周前"}, {"id": 33, "title": "微软 MAI-Image-2.6-Preview 登顶图像编辑榜第三", "source": "X：Mustafa Suleyman（Microsoft AI CEO） (@mustafasuleyman)", "sourceUrl": "https://x.com/mustafasuleyman/status/2089766508373176726", "date": "2026-08-18T17:28:56.000Z", "summary": "微软 MAI-Image-2.6-Preview 在图像编辑基准测试中位列第三，得分 1，420 分，较上一代提升 19 分，从第五跃升至第三。该模型在商品、3D、动漫、写实等四类中均排第三，文本渲染提升最显著（+43 分）。", "type": "model", "relTime": "1周前"}, {"id": 34, "title": "Populous 如何用 Runway 呈现全球标志性场馆设计", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/customers/populous", "date": "2026-08-18T15:53:44.394Z", "summary": "全球设计公司 Populous 高级建筑师 Georgina Myers 介绍团队用 Runway 辅助体育场馆概念设计：过去完整视频需外部渲染团队至少三周，且提交前两周须冻结设计模型；如今 Runway 能生成传达尺度感的完整渲染和航拍图，将视觉制作时间缩短，让设计师把时间还给设计本身。该工具已用于利雅得 MBS 体育场等中东项目，支持 9 种不同活动模式的场景迭代。", "type": "tip", "relTime": "1周前"}, {"id": 35, "title": "OJO 设计智能体工作台：品味即护城河", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2089734075208671427", "date": "2026-08-18T15:20:03.000Z", "summary": "OJO 推出首个设计智能体团队工作台，可组建负责产品策略、视觉、文案与原型的设计智能体团队，调用 300+ 技能，将自然语言想法转化为 PRD、页面结构、UI 及可编辑原型，并支持导出 Figma 或通过 CLI 接入 Claude Code、Codex。Kim 认为，生成可用应用已近乎免费，未来产品差异取决于判断力与品味，未来两年胜出的是对\"好\"有最强主张的团队。", "type": "product", "relTime": "1周前"}, {"id": 36, "title": "Meta 提交人脸识别与自动记录人员专利申请，涉及\"记忆回放\"功能", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.privacyguides.org/news/2026/08/17/meta-files-patent-for-facial-recognition-automatic-recording-of-people", "date": "2026-08-18T15:02:06.426Z", "summary": "Meta 提交了一项专利申请，涉及通过人脸识别自动检测并记录人员，随后生成高光片段回放的系统。该专利与 Meta Ray-Ban 智能眼镜相关，其摄像头指示灯此前已被用户想方设法禁用。Meta 举例称，AI 可在晚宴后主动生成\"今晚晚宴高光片段\"供用户查看，但专利中未提及记录前的征询提示。", "type": "industry", "relTime": "1周前"}, {"id": 37, "title": "Booster T2人形机器人赛前彩排视频发布", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2089714169927131224", "date": "2026-08-18T14:00:57.000Z", "summary": "Booster T2人形机器人排练视频：在北京第二届世界人形机器人运动会前夕，它们以精确对齐的方式完成群体移动表演。", "type": "industry", "relTime": "1周前"}, {"id": 38, "title": "Gemini 3.7 Flash 生成现代网页视频背景", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2089710693012414472", "date": "2026-08-18T13:47:08.000Z", "summary": "Gemini 3.7 Flash 和 Omni 的巧妙用法。", "type": "tip", "relTime": "1周前"}, {"id": 39, "title": "面壁智能 VoxCPM2 开源数字人视频工作流", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2089698829725503681", "date": "2026-08-18T13:00:00.000Z", "summary": "开发者 @jaxxchen003 基于面壁智能 VoxCPM2 构建了开源数字人视频生产工作流，实现自然语音克隆、带节奏与情感控制的表达性语音生成，以及可复用的自动化视频合成流程。该项目展示了轻量级 AI 语音模型如何赋能灵活可控的内容创作，代码与模型均已开源。", "type": "model", "relTime": "1周前"}, {"id": 40, "title": "Seedance 2.5 搭配 upsteam 预演台：告别 AI 视频反复抽卡的正确打开方式", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247509782&idx=1&sn=911ca46ac365fcd431cb4a68324fdf1a", "date": "2026-08-18T12:17:23.000Z", "summary": "upsteam 预演台上线，用户无需 3D 建模基础即可用参考图生成粗粒度白模，并搭建场景、人物、机位与运镜轨迹。将录制的白模视频交给 Seedance 2.5 生成，可精准锁定空间关系与运镜方向，避免纯文字提示词导致的误解，减少返工与积分消耗。适合大场面空镜、多人调度及复杂运镜等镜头，简单镜头仍可直接用文字生成。", "type": "tip", "relTime": "1周前"}, {"id": 41, "title": "字节跳动与MPA签约强化AI版权保护", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2089678585191907637", "date": "2026-08-18T11:39:33.000Z", "summary": "字节跳动已与美国电影协会（MPA）签署协议，为其AI视频和图像模型Seedance、Seedream加强版权保护，这些模型支撑着TikTok、CapCut和Dreamina等产品。此前好莱坞对AI版权风险表示担忧，MPA今年早些时候也发出警告。字节跳动称新版Seedance和Seedream包含更强的知识产权保护措施，或为其AI生成工具在美国更广泛采用铺平道路。", "type": "industry", "relTime": "1周前"}, {"id": 42, "title": "苹果带摄像头 AirPods 泄露视频曝光", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/981326/apple-airpods-with-cameras-demo-video-leak", "date": "2026-08-18T09:00:01.000Z", "summary": "一段在 macOS Tahoe 26.7 Release Candidate 中发现的新视频，首次展示了苹果传闻中带摄像头的 AirPods。视频中，佩戴者手持书籍，AirPods 通过 Visual Intelligence 识别封面书名，Siri 语音提示可将看到的内容保存。该产品外观比 AirPods Pro 3 稍厚，预计将与 Meta Ray-Ban 智能眼镜等设备竞争。", "type": "product", "relTime": "1周前"}, {"id": 43, "title": "面壁智能 MiniCPM-o 4.5 全双工多模态交互解析", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2089615191273300096", "date": "2026-08-18T07:27:39.000Z", "summary": "面壁智能转发 @LearnOpenCV 对 MiniCPM-o 4.5 的深度解析。这款 9B 开源模型支持实时全双工交互，可同时处理实时视频、输入音频并生成语音回复。其统一流水线整合视觉、音频、推理与流式语音生成，实现更自然的 AI 交互体验。", "type": "tip", "relTime": "1周前"}, {"id": 44, "title": "Qwen3.8-27B 本地运行效果惊艳", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2089602715735519586", "date": "2026-08-18T06:38:05.000Z", "summary": "通义千问展示 Qwen3.8-27B 单次提示词即可生成惊艳效果，并鼓励用户在自己的笔记本上运行。用户 @ItsmeAjayKV 对比测试显示，Qwen3.8-27B 在 RTX 3090 上以 Q5 量化（非 f8）运行，生成的水面模拟效果一致且视觉惊艳，超越 Gemini-3.7-flash。", "type": "tip", "relTime": "1周前"}, {"id": 45, "title": "硅谷开始清理AI垃圾内容：谷歌删除5万账号集群，Spotify删7500万条曲目", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/058.htm", "date": "2026-08-18T04:46:53.000Z", "summary": "硅谷科技公司开始大规模清理AI生成的垃圾内容。Spotify去年删除7500万条批量上传和重复曲目，谷歌在YouTube上清除13万个低质量频道及5万个账号集群，TikTok已自动标记超30亿条AI生成视频。这些垃圾内容多由科技公司自己的AI工具催生，已污染搜索、社交和音乐平台的信息生态。", "type": "tip", "relTime": "1周前"}, {"id": 46, "title": "共生知行发布人形机器人驾驶卡丁车 Demo，展示直接感知-控制模型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/055.htm", "date": "2026-08-18T04:33:25.000Z", "summary": "共生知行（Symbiosis Robotics）8 月 17 日发布双足人形机器人驾驶卡丁车 Demo，并上线官网，首次系统展示其在\"全身智能\"方向的阶段性进展。其直接感知-控制模型移除中间运动表征，将视觉、语言、身体状态等直接映射为可执行动作，使宇树人形机器人实现手-眼-脚协同驾驶。该公司表示，赛车只是第一项公开测试，未来将围绕移动操作、高精度视觉对准等推出更多案例。", "type": "model", "relTime": "1周前"}, {"id": 47, "title": "Meta 专利探索智能眼镜未来：可识别人脸自动梳理、AI 提取精彩片段", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/025.htm", "date": "2026-08-18T03:23:42.000Z", "summary": "Meta 申请新专利，探索让智能眼镜借助内置人脸识别技术，识别视频画面中的人物及其与佩戴者的关系，并自动生成带人物标签的集锦片段。专利构想的一个应用场景是，用户在晚宴或聚会上佩戴眼镜录制视频后，AI 可询问用户是否想查看活动精彩片段。Meta 眼镜当前只能录制 3 分钟或 5 分钟的视频，相关设计也可能加剧隐私争议。", "type": "industry", "relTime": "1周前"}, {"id": 48, "title": "Nano Banana与Gemini Omni打造可视化百科", "source": "X：Google AI for Developers (@googleaidevs)", "sourceUrl": "https://x.com/googleaidevs/status/2089540580422644216", "date": "2026-08-18T02:31:10.000Z", "summary": "用 Nano Banana 和 Gemini Omni 将网络变成交互式视觉百科全书。🌐✨  我们在 @Antigravity 中使用 Gemini 3.7 Flash 构建了一个 Chrome 扩展，让你在浏览时高亮任意文本即可快速生成丰富的视觉化释义，助力深度学习。  查看演示 ↓", "type": "paper", "relTime": "1周前"}, {"id": 49, "title": "以色列设立虚假智库，疑似为欺骗AI聊天机器人", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://responsiblestatecraft.org/israel-influence-chatgpt", "date": "2026-08-18T02:30:02.549Z", "summary": "以色列政府通过广告公司Piro设立虚假智库\"汉诺威公共政策研究所\"，发布百余份亲以报告，旨在影响Claude、Gemini等LLM的可信度评估。Piro已获以色列政府90万美元资金，其报告被GPTZero判定为AI生成。此前以色列还以4650万美元合同聘请Brad Parscale创建类似网站，已成功影响Microsoft Copilot和Google Gemini。", "type": "tip", "relTime": "1周前"}, {"id": 50, "title": "苹果带摄像头的 AirPods 实机演示曝光，可实现环境视觉感知", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/919.htm", "date": "2026-08-18T01:33:32.000Z", "summary": "苹果正在研发配备摄像头的 AirPods，内部代号 B790，相关演示视频在 macOS Tahoe 26.7 RC 中被发现。该设备可将摄像头获取的信息提供给\"视觉智能\"，Siri 能回答用户关于周围环境的问题并记录信息，头发遮挡摄像头时还会收到提醒。彭博社记者 Mark Gurman 此前透露，这款产品最快可能在今年 9 月发布。", "type": "product", "relTime": "1周前"}, {"id": 51, "title": "消息称特斯拉筹备推出 Cybercab 自动驾驶出租车服务，最快本月在奥斯汀上线", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/899.htm", "date": "2026-08-18T00:41:08.000Z", "summary": "特斯拉已通知员工，正准备推出 Cybercab 自动驾驶出租车服务，最快本月率先在得克萨斯州奥斯汀市上线。Cybercab 是专为自动驾驶打造的车型，没有方向盘和踏板。特斯拉计划先让员工在公共道路体验，随后几天内将车辆纳入奥斯汀的 Robotaxi 服务；该车型预计今年晚些时候逐步扩大产量。", "type": "paper", "relTime": "1周前"}, {"id": 52, "title": "EditBridge：面向高保真与高效超高清图像编辑的扩散桥接框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.18063", "date": "2026-08-18T00:00:00.000Z", "summary": "EditBridge 提出一种扩散桥接框架，将超高清编辑视为从低分辨率编辑结果到高分辨率版本的结构化数据转换，并以原始高分辨率图像为条件保留真实细节。其引入先验引导的块状稀疏注意力机制，将跨图像交互限制在空间对齐区域，在 2K 分辨率下实现 3.6-8.4 倍加速，并可在 61 秒内完成 4K 编辑。", "type": "paper", "relTime": "1周前"}, {"id": 53, "title": "MoE-ViE：面向高效图像与视频理解的专家混合视觉编码器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17402", "date": "2026-08-18T00:00:00.000Z", "summary": "MoE-ViE 系列专家混合视觉编码器在多种规模上均超越同尺寸密集编码器，其最大模型以 SOTA 编码器 76% 的延迟实现同等零样本性能。研究提出细粒度 MoE 拓扑、无辅助损失均衡变体及专用 MoE 内核，并通过帧级蒸馏与冻结机制增强视频能力。与 LLM 对齐后，MoE-ViE 在图像和视频基准上超越所有对比编码器，包括激活参数多 5 倍的模型。", "type": "paper", "relTime": "1周前"}, {"id": 54, "title": "TAMP-Nav：面向高效具身导航的点选、思考、记忆与对齐框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17512", "date": "2026-08-18T00:00:00.000Z", "summary": "TAMP-Nav 提出统一框架，将具身导航重构为 2D 视觉提示任务，让 VLM 仅需选择 2D 像素即可由 SLAM 控制器执行，并引入选择性推理与锚点轨迹记忆机制，通过 GRPO 双层对齐实现高效导航。该方法在 R2R-CE 基准上取得 66.2% SR 的 SOTA 成绩，且仅需 90k 训练轨迹，兼具高运行效率与样本效率。", "type": "paper", "relTime": "1周前"}, {"id": 55, "title": "aDSL：通过智能体与程序联合设计实现智能体3D内容生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17975", "date": "2026-08-18T00:00:00.000Z", "summary": "针对大语言模型编写3D程序时难以将高层意图转化为一致底层几何的问题，研究者联合设计了智能体中心领域特定语言aDSL与角色专业化多智能体系统。aDSL通过关系运算符替代绝对坐标，强调可组合性与空间推理；免训练系统采用Plan-Execute-Critic循环，利用执行反馈迭代修复错误。该方法在文本/图像生成3D形状任务上优于此前LLM基线，并支持铰接物体创建与结构化场景组合，代码已开源。", "type": "paper", "relTime": "1周前"}, {"id": 56, "title": "Abra：扩散图像训练的规模化定律研究", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17286", "date": "2026-08-18T00:00:00.000Z", "summary": "Abra 研究团队对文生图扩散模型进行了系统性规模化定律分析，训练计算量横跨三个数量级（1019 至 1022 FLOPs），远超此前工作。研究发现扩散模型与语言模型一样可预测，但需要约每参数 200 个图像 token 才能达到计算最优，是 LLM 的 Chinchilla 最优配方的十倍。此外，扩散模型对过度训练具有鲁棒性，且预测性可延伸至生成质量、最优 CFG 设置及训练曲线形状。", "type": "paper", "relTime": "1周前"}, {"id": 57, "title": "GS-Voxel：面向大规模 3DGS 生成的无拟合结构化潜空间框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17988", "date": "2026-08-18T00:00:00.000Z", "summary": "GS-Voxel 提出一种无拟合结构化潜空间框架，可将预优化的 3DGS 重建确定性转换为稀疏活动体素，无需逐场景优化，并保留所选图元的亚体素位置与渲染属性。其专用因子化 VAE 分别编码体素几何与局部高斯属性，潜空间大小随占用体素数增长而非受固定图元数限制。基于该潜空间训练的影像条件流模型支持重叠感知分块推理，可扩展至卫星影像条件下的航拍大场景生成。", "type": "paper", "relTime": "1周前"}, {"id": 58, "title": "面向通用图像生成的能力中心化数据设计：从语料库到协同演进能力", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.18076", "date": "2026-08-18T00:00:00.000Z", "summary": "一项研究提出能力驱动的数据基础设施，将能力专属监督构建与能力对齐的课程调度相结合，通过三个数据引擎分别构建文本-图像 grounding、图像间变换和图像-知识关联的互补关系监督。该框架构建了4.4亿图像T2I语料库、1.2亿编辑对和超2700万图像-实体对，并据此从零训练了3B和6B两种规模的多模态扩散模型，在CPI-Bench上进行了定量评估。", "type": "paper", "relTime": "1周前"}, {"id": 59, "title": "SemComp-Bench：为视频生成中的语义任务完成设立基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17426", "date": "2026-08-18T00:00:00.000Z", "summary": "研究团队提出\"语义任务完成视频生成\"这一以结果为导向的视频生成任务，要求模型同时实现预期结果并保持与参考图像的语义对齐。为此构建了覆盖六个领域的评估数据集 SemComp-Data，并推出基于视觉语言模型（VLM）的评估协议 SemComp-Bench，分别以 OA Score 和 GR Score 衡量结果达成与生成可靠性。实验显示，现有代表性视频生成模型在兼顾任务目标与语义对齐方面仍面临挑战。", "type": "paper", "relTime": "1周前"}, {"id": 60, "title": "Grok Imagine 荷马史诗短片大赛，头奖 10 万美元", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2089458330309980425", "date": "2026-08-17T21:04:20.000Z", "summary": "SpaceXAI 推出电影制作竞赛，要求创作者用 Grok Imagine 将荷马《奥德赛》场景搬上银幕，奖金总额 10 万美元。参赛需提交 3-5 分钟英文视频，至少 1 分钟对白，视频、图像及角色声音须由 Grok Imagine 生成，其他工具可用于剪辑、配乐和音效。面向 18 岁以上美国居民，截止日期为 2026 年 8 月 31 日。", "type": "industry", "relTime": "1周前"}, {"id": 61, "title": "你最喜欢的创作者不是真人--这重要吗？", "source": "a16z：News（RSS）", "sourceUrl": "https://www.a16z.news/p/your-favorite-creator-isnt-realdoes", "date": "2026-08-17T19:35:23.000Z", "summary": "一位作者用ChatGPT生成图像、Minimax 3和Grok Imagine 1.5生成视频，打造了虚拟女生Janie，并让她参加阿拉巴马大学姐妹会招募。一周内Janie获得1300名粉丝，视频平均观看量达数万次，20条视频中8条被TikTok标记为AI生成，但未影响表现。作者未标注AI身份，认为这违反了TikTok服务条款，但旨在测试平台与观众的识别能力。", "type": "tip", "relTime": "1周前"}, {"id": 62, "title": "OpenAI 总裁谈路线图：能力将大幅提升", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2089430780523184527", "date": "2026-08-17T19:14:52.000Z", "summary": "OpenAI 总裁 Greg Brockman 刚刚表示，随着模型曲线持续进步，OpenAI 的路线图指向重大的能力提升。  \"我们确实有一条规划好的路线图，能力将持续以显著方式增长，这些方式很难用简短的语言解释清楚。\"  ----  来自\"CNBC Television\"YouTube 频道（完整视频链接见评论）", "type": "tip", "relTime": "1周前"}, {"id": 63, "title": "MiniMax H3 本地视频生成资源与实测分享", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2089421390374138178", "date": "2026-08-17T18:37:33.000Z", "summary": "MiniMax 官方分享了用 H3 模型在 RTX 4090（24GB）上本地生成视频的实用资源，并引用了 @Lumosous 的实测体验：通过 ComfyUI 实现文生视频、音乐节拍同步和图生视频三种玩法，官方 H3 Prompt Writing Skill 可把想法转为结构化提示词。", "type": "tip", "relTime": "1周前"}, {"id": 64, "title": "MiniMax H3 视频模型助力游戏精灵创建", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2089420340728610890", "date": "2026-08-17T18:33:23.000Z", "summary": "MiniMax 称其 SOTA 视频生成模型 H3 能精准理解行走角色动作，而最新图像生成模型仍难保持行走动作一致。引用推文展示了 H3 用于游戏精灵创建的工作流：单张角色设计图配纯品红背景，每个动作生成 5 秒 H3 片段，裁剪至姿态极限并抠像打包成精灵图集，接入状态机即可游玩（8 个动作约 $5）。", "type": "tip", "relTime": "1周前"}, {"id": 65, "title": "LLM编码模型或优于扩散模型", "source": "X：Thariq (@trq212)", "sourceUrl": "https://x.com/trq212/status/2089415712007938315", "date": "2026-08-17T18:14:59.000Z", "summary": "最近所有的程序化生成艺术、视频编辑和3D游戏演示，让我更新了看法--LLM编码模型在大量创意工作上比扩散模型更出色。", "type": "tip", "relTime": "1周前"}, {"id": 66, "title": "Menlo 旗下 Wispr Flow 与 Higgsfield 双双完成巨额融资", "source": "X：Deedy Das (@deedydas)", "sourceUrl": "https://x.com/deedydas/status/2089398673230938591", "date": "2026-08-17T17:07:17.000Z", "summary": "Menlo Ventures 宣布旗下两家公司完成巨额融资：语音听写应用 Wispr Flow 融资 2.8 亿美元，估值 20 亿美元，年同比增长约 40 倍，累计听写超 600 亿词；AI 视频生成公司 Higgsfield 融资 4 亿美元，估值 54 亿美元，年化收入 12 个月内从 2000 万美元增至 7 亿美元。Menlo 强调应用层制胜关键在于极致产品力、增长、留存与变现。", "type": "industry", "relTime": "1周前"}, {"id": 67, "title": "中国科技周报：DeepSeek V4 Pro 发布与机器人维修业兴起", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2089377433208164477", "date": "2026-08-17T15:42:53.000Z", "summary": "DeepSeek 正式发布 V4 Pro，基准测试较预览版显著提升，同时大幅涨价使旗舰定价接近主要竞品。本周中国科技周报还聚焦人形机器人维修业兴起、AI 视频生成生态（如 Seedance 2.5 和 MiniMax H3）的商业化，以及苹果与阿里合作训练中文 LLM 等动态。", "type": "industry", "relTime": "1周前"}, {"id": 68, "title": "Waymo 与 Tesla 自动驾驶技术路线对比", "source": "ByteByteGo（RSS）", "sourceUrl": "https://blog.bytebytego.com/p/waymo-vs-tesla-two-ways-to-build", "date": "2026-08-17T15:30:56.000Z", "summary": "Waymo 与 Tesla 采用截然不同的自动驾驶技术路线。Waymo 第六代系统配备 13 个摄像头、4 个激光雷达、6 个雷达及外部音频接收器，覆盖 500 米范围；Tesla 则坚持纯视觉方案。截至 2026 年 3 月，Waymo 累计 2.206 亿英里无人驾驶里程，而 Tesla 在美国有超 300 万辆车、128 万活跃 FSD 订阅。", "type": "tip", "relTime": "1周前"}, {"id": 69, "title": "字节跳动与美国电影协会签署协议，加强 AI 模型版权保护", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/847.htm", "date": "2026-08-17T15:06:14.000Z", "summary": "字节跳动与美国电影协会（MPA）签署协议，加强 AI 视频与图像生成模型的版权保护。协议涵盖 Seedance 视频生成模型和 Seedream 图像生成模型，二者通过 TikTok、CapCut 和 Dreamina 等应用提供服务。字节表示，新版本 Seedance 和 Seedream 已加入更强的知识产权保护机制，双方将随 AI 发展继续完善版权防护。", "type": "industry", "relTime": "1周前"}, {"id": 70, "title": "GPT-5.6 Sol 是 OpenAI 迄今最强的视觉模型", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://blog.roboflow.com/openai-gpt-5-6", "date": "2026-08-17T14:29:55.280Z", "summary": "OpenAI 上周发布 GPT-5.6 系列（Sol、Terra、Luna），第三方基准测试显示 Sol 是其迄今最强视觉模型。Sol 目标检测达 46.2 mAP@50，远超 GPT-5.5 的 13.8；计数准确率 73.0%，较 GPT-5.5 的 64.9% 明显提升。", "type": "tip", "relTime": "1周前"}, {"id": 71, "title": "AI 如何重新定义艺术与创作门槛", "source": "X：小北 (@frxiaobei)", "sourceUrl": "https://x.com/frxiaobei/status/2089349801020457420", "date": "2026-08-17T13:53:05.000Z", "summary": "AI 同时抹平了文字、绘画、音乐、视频、3D 乃至虚拟世界的生产门槛，把过去属于少数专业创作者的表现能力大规模发给普通人。当画面、文字、声音、角色甚至世界本身都不再稀缺，艺术竞争将从\"谁做得更好\"转向\"谁能提出一种以前不存在的表达\"。AI 真正应催生的，是一种今天还没有名字、甚至不知该如何欣赏的新艺术形态。", "type": "tip", "relTime": "1周前"}, {"id": 72, "title": "AI视频市场已从Sora的失败开局中反弹，形成新产业", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/ai-video-market-has-bounced-back-from-soras-false-start", "date": "2026-08-17T13:29:01.000Z", "summary": "AI视频市场已从Sora的失败开局中反弹，形成涵盖投资者、商业模式和发行冲突的新产业。好莱坞AI工作室Promise正拍摄低成本恐怖片《Touch Grass》，使用中国模型Seedance 2.5实时生成背景，其联合创始人称混合制作比传统电影便宜20%至50%；Netflix称到2026年将在1000部作品中的300部使用AI。", "type": "tip", "relTime": "1周前"}, {"id": 73, "title": "Anthropic 详解 Claude 隐形文本水印如何运作", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/980869/anthropic-claude-watermarks-synthid-text-system", "date": "2026-08-17T10:57:13.000Z", "summary": "Anthropic 为遵守欧盟《人工智能法案》透明度要求，将采用 Google DeepMind 开源 SynthID-Text 技术的\"一个版本\"为 Claude 生成文本添加隐形水印。该水印利用低风险词汇选择的随机性模式标记内容，读者无感但持有密钥者可检测，且不会增加用户成本或影响输出质量。Anthropic 同时为 Claude 处理的图片引入 C2PA 支持。", "type": "industry", "relTime": "1周前"}, {"id": 74, "title": "第二届世界人形机器人运动会模拟消防救援比赛：23支队伍参赛，仅3支完成全部挑战", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/768.htm", "date": "2026-08-17T10:05:41.000Z", "summary": "8月16日，第二届世界人形机器人运动会在北京举行模拟消防救援比赛，23支队伍参赛，重点检验机器人在复杂现实环境中的实际作业能力。每台机器人需在30分钟内完成识别危险物质、关闭阀门和扑灭火源三项任务，当日12支参赛队伍中仅3支完成全部挑战。比赛暴露出降雨、光线变化和室外条件对视觉识别与机械操作的干扰，遥操作和全向轮等方案仍被部分队伍采用。", "type": "industry", "relTime": "1周前"}, {"id": 75, "title": "PixVerse 启动全球 AI 电影人竞赛 PixLight", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse/status/2089254416931258792", "date": "2026-08-17T07:34:04.000Z", "summary": "PixVerse 推出面向全球 AI 电影人、编剧和视觉叙事者的竞赛 PixLight，以故事性为首要评审标准，总奖金池 30 万美元、共 33 个奖项。赛事设 Pilot（3-20 分钟成片）与 Script（完整剧本+视频推介）两条赛道，覆盖剧情、科幻、惊悚三大方向，参赛者保留作品全部所有权。报名 2026 年 8 月 7 日开启，10 月 9 日截止，全球免费开放。", "type": "industry", "relTime": "1周前"}, {"id": 76, "title": "inclusionAI 开源 ConceptEdit：基于概念缩放与密集监督的图像编辑数据生成管线", "source": "蚂蚁 inclusionAI：GitHub 新仓库", "sourceUrl": "https://github.com/inclusionAI/ConceptEdit", "date": "2026-08-17T07:22:08.000Z", "summary": "蚂蚁集团 inclusionAI 开源 ConceptEdit，一个基于概念缩放与密集监督的图像编辑数据生成管线。该管线通过三阶段流程（VLM 生成指令、FLUX 执行编辑、VQA 评估筛选）构建大规模、基于分类法的图像编辑数据集，并提供单概念与多概念两种变体。项目采用 MIT 许可证，支持断点续跑，需 OpenAI 兼容 VLM 端点与本地 FLUX 检查点。", "type": "model", "relTime": "1周前"}, {"id": 77, "title": "国家统计局：前 7 个月我国工业机器人产量同比增长 28.5%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/641.htm", "date": "2026-08-17T07:16:32.000Z", "summary": "国家统计局新闻发言人付凌晖在国新办发布会上表示，今年 1 至 7 月份我国工业机器人产量同比增长 28.5%，3D 打印设备、锂离子电池产量同比分别增长 52.3%、40.2%。同期全国规模以上工业增加值同比增长 5.3%。IDC 数据显示，2025 年中国工业具身智能机器人市场规模约 57.4 亿元，其中以工业机器人为载体的具身智能应用市场规模约 36.2 亿元。", "type": "industry", "relTime": "1周前"}, {"id": 78, "title": "AI 视频生成平台 Higgsfield 融资 4 亿美元，估值达 54 亿美元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/588.htm", "date": "2026-08-17T04:27:29.000Z", "summary": "AI 视频生成平台 Higgsfield 从 DST Global、高盛、英特尔等投资者处筹集 4 亿美元，估值达 54 亿美元。该公司年化收入已从一年前的 2，000 万美元增至今年 8 月的 7 亿美元，全球用户超 3000 万。本轮融资将用于拓展企业订阅业务、加大算力建设，并帮助品牌利用 AI 每天制作多条营销视频。", "type": "industry", "relTime": "1周前"}, {"id": 79, "title": "MiniMax H3 本地生成水獭视频，质量飞跃", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2089185499197911391", "date": "2026-08-17T03:00:12.000Z", "summary": "Ethan Mollick 用开源权重视频生成模型 MiniMax H3 在本地电脑上生成了一段带声音的水獭用笔记本视频，耗时约 3 分钟。他对比两年前指出，虽仍不及 SOTA 文生视频，但完全离线运行是全新能力，进步迅速。", "type": "tip", "relTime": "1周前"}, {"id": 80, "title": "MiniMax H3 在 PixVerse 中打造电影级预告片", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse/status/2089182609746133178", "date": "2026-08-17T02:48:43.000Z", "summary": "PixVerse 展示 MiniMax H3 模型能力，用户 @MonetizationDon 用它制作了《THE DRAGON RIDER》电影级预告片。该片融合街头时尚、功夫、未来滑板与金龙元素，并加入 3D 字体、霓虹广告牌等动态排版效果，凸显 H3 在视觉叙事与特效生成上的表现。", "type": "tip", "relTime": "1周前"}, {"id": 81, "title": "PixVerse 展示 MiniMax H3 电影级预告片效果", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2089182609746133178", "date": "2026-08-17T02:48:43.000Z", "summary": "PixVerse 官方分享了一段用 MiniMax H3 生成的电影预告片《THE DRAGON RIDER》，展示该模型在视频生成上的能力。预告片融合街头时尚、功夫、未来滑板与金龙元素，并包含 3D 字体、霓虹招牌、速度变奏等电影级镜头效果。", "type": "tip", "relTime": "1周前"}, {"id": 82, "title": "Seedance 2.5 登顶 Design Arena 多图生视频", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2089177550895673393", "date": "2026-08-17T02:28:37.000Z", "summary": "Seedance 2.5 在 Design Arena 多图生视频榜单以 1400 Elo 排名第一，大幅领先其他顶级模型。开源模型 MiniMax H3 以 1355 Elo 位列第二，为最佳开源视频模型。该榜单测试模型融合多张参考图并保持主体、风格与场景连贯性的能力，更贴近真实生产流程。", "type": "tip", "relTime": "1周前"}, {"id": 83, "title": "OpenRouter 图像生成 API：代码优先的接入教程", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/tutorials/image-generation", "date": "2026-08-17T00:00:00.000Z", "summary": "OpenRouter 推出专用图像生成 API，通过统一请求格式和单一密钥即可调用多个提供商的图像模型。开发者向 POST /api/v1/images 发送请求，响应中的 data【0】.b64_json 包含 base64 编码的图像数据，解码后即可保存为本地文件。教程演示了 Python 和 JavaScript 两种实现，并支持通过 input_references 传入参考图像生成变体。", "type": "model", "relTime": "1周前"}, {"id": 84, "title": "StreamOPD：面向流式视频理解的后训练方案与时空线索门控", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.16320", "date": "2026-08-17T00:00:00.000Z", "summary": "StreamOPD 提出免推理时记忆的后训练方案，将 StreamingBench 从 77.9% 提升至 83.9%，距 9B 教师模型仅差 0.3 个百分点。其扩展模块 ST-CueGate 在 OVO-Bench（排除幻觉检测子任务）和 Video-MME 上分别达 71.9% 和 64.9%，是唯一在所有四项基准上均高于基础模型的变体。", "type": "paper", "relTime": "1周前"}, {"id": 85, "title": "即插即用的2D运动接口：让真实世界运动语言模型无需微调即可工作", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.15984", "date": "2026-08-17T00:00:00.000Z", "summary": "研究团队提出一种即插即用的2D运动接口，使3D预训练的运动语言模型（MoLMs）无需修改或微调即可接受2D运动输入。在公开数据集上，该方法在多个MoLMs上达到与3D运动输入相当的性能，并优于从头训练2D运动的模型。团队还构建了单目真实世界视频运动评估数据集并引入真实视频适配器，证明在单目姿态估计场景下2D运动比3D运动更具实用性。", "type": "paper", "relTime": "1周前"}, {"id": 86, "title": "TRACE-Bench：分解与诊断多参考图像生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.16765", "date": "2026-08-17T00:00:00.000Z", "summary": "TRACE-Bench 将多参考图像生成任务形式化为 Anchor、Disentangle、Apply、Compose 四种原子操作，并据此构建约 1，600 个评测案例（覆盖 1-8 个操作槽位，源自 631 个公式模板与约 4，000 张参考图）。对 9 个领先模型的评测显示，主要瓶颈在于解耦与属性绑定而非场景级组合，最佳模型属性保真度得分仅 0.74。", "type": "paper", "relTime": "1周前"}, {"id": 87, "title": "AnyTalk：利用视频生成模型为任意角色生成3D语音动画", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.16143", "date": "2026-08-17T00:00:00.000Z", "summary": "AnyTalk提出一种无需动画数据即可为任意角色生成3D语音动画的新方法，通过Character-specific Fine-tuning（CsF）技术将预训练视频扩散模型适配至目标角色，再经优化过程估计blendshape参数，将说话头视频提升为3D语音动画。该方法支持多种面部网格和blendshape配置，显著降低人工与数据需求。蒸馏版AnyTalk_{RT}可实现实时性能，代码已公开。", "type": "paper", "relTime": "1周前"}, {"id": 88, "title": "像素空间文生图扩散模型训练实证研究：潜空间到像素空间策略带来 3.18-4.75 倍推理加速", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.16887", "date": "2026-08-17T00:00:00.000Z", "summary": "一项实证研究发现，像素空间扩散模型直接大规模预训练收敛速度远慢于潜空间模型，由此提出\"潜空间到像素空间\"策略：先在潜空间高效获取生成先验，再在后训练阶段转向像素空间。该策略结合权重初始化、数据构成、预测目标、解码器架构与噪声调度等设计选择，使像素空间模型达到或超越潜空间模型，并实现 3.18 至 4.75 倍的端到端推理加速。", "type": "paper", "relTime": "1周前"}, {"id": 89, "title": "GenRouter：面向智能体图像生成的统一工作流路由框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.16721", "date": "2026-08-17T00:00:00.000Z", "summary": "GenRouter 提出首个面向智能体图像生成的统一工作流路由框架，将多样化智能体管线标准化为通用原语与可执行模板，并通过需求分析、经验匹配和 Pareto 过滤将异构提示词自适应路由至最优工作流。实验显示，相比重型静态管线，GenRouter 在保持视觉对齐的同时将执行成本降低超 95%、延迟降低 65%，并借助累积经验实现零样本泛化，性能提升且计算开销减半。", "type": "paper", "relTime": "1周前"}, {"id": 90, "title": "DiSCO：通过分布引导的对比提示优化防御文本到图像生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.17067", "date": "2026-08-17T00:00:00.000Z", "summary": "DiSCO 提出一种零样本、严格黑盒的防御方法，完全在提示词层面运行，无需模型重训练、微调或访问内部结构。该方法通过束搜索进行分布引导的后缀扩展，并利用目标模型自身生成的图像池进行对比评分和迭代反馈，直至生成安全内容。在 I2P 基准上，DiSCO 在多种红队攻击下分别将未防御和已防御模型的 ASR 降低 37.7% 和 25.13%，同时保持语义保真度。", "type": "paper", "relTime": "1周前"}, {"id": 91, "title": "PixRestore：基于像素扩散 Transformer 的统一图像修复", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.16793", "date": "2026-08-17T00:00:00.000Z", "summary": "PixRestore 提出一种免 VAE 的像素扩散 Transformer（DiT），用于统一图像修复，无需 T2I 预训练。该方法利用 DINO 分层特征与自适应层路由提供密集条件引导，并通过 DINO 对抗目标将多步模型微调为单步生成器。仅约 50M 参数、单步推理约 44 ms，PixRestore 在扩散类方法中取得最佳修复质量与最高效率。", "type": "paper", "relTime": "1周前"}, {"id": 92, "title": "τ_0-VLA：用世界模型引导测试时计算的分层机器人基础模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.16885", "date": "2026-08-17T00:00:00.000Z", "summary": "τ_0-VLA 将高层子任务生成构建为可通过世界模型引导的测试时计算扩展的推理问题，在每次推理时用执行记忆生成子任务，必要时搜索备选方案，再由低层策略跨多机器人本体执行。该策略在 40，115 小时异构真实世界数据上训练并采用多模态协同训练。额外分配测试时计算可显著提升下一子任务预测准确率，并转化为长程操作任务中更高的闭环成功率。", "type": "paper", "relTime": "1周前"}, {"id": 93, "title": "网传\"深圳道路大面积塌陷致翻车\"系 AI 合成谣言，深圳市委网信办确认", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/423.htm", "date": "2026-08-16T23:34:20.000Z", "summary": "深圳市委网信办核查确认，网传\"深圳滨海大道巨大面积塌陷致车辆翻车\"视频系 AI 生成并拼接其他路面塌陷画面而成，与实际情况严重不符。8 月 4 日当地确发生超 10 立方米的路面塌陷，但无网传翻车画面，相关视频已被下架删除。有关部门提醒网民仔细甄别 AI 生成画面，不信谣不传谣。", "type": "industry", "relTime": "1周前"}, {"id": 94, "title": "SeedDance 2.5 三提示词生成惊艳AI视频", "source": "X：Ammaar Reshi (@ammaar)", "sourceUrl": "https://x.com/ammaar/status/2089082508612673897", "date": "2026-08-16T20:10:57.000Z", "summary": "我用 @runwayml 的 SeedDance 2.5 只用了 3 个提示词就完成了这个。  AI 视频在这么短的时间内取得的飞跃，简直不可思议！", "type": "tip", "relTime": "1周前"}, {"id": 95, "title": "PhotoScan：用智能手机照片估算胰岛素抵抗，精度接近DXA", "source": "Google Research：Blog（网页）", "sourceUrl": "https://research.google/blog/seeing-beyond-bmi-estimating-cardiometabolic-risk-with-smartphone-imagery", "date": "2026-08-16T16:00:00.000Z", "summary": "Google Research 推出 PhotoScan，一种从智能手机 2D 照片直接估算三维身体成分的深度学习框架，可预测胰岛素抵抗，在临床研究中精度接近 DXA 扫描。", "type": "paper", "relTime": "1周前"}, {"id": 96, "title": "Deedy Das 推出情绪生成沉浸式体验网站", "source": "X：Deedy Das (@deedydas)", "sourceUrl": "https://x.com/deedydas/status/2089014375973900344", "date": "2026-08-16T15:40:13.000Z", "summary": "做了个小网站，输入一种\"情绪\"，就能生成一整套体验：歌曲播放列表、环境音和循环视频背景。  以下是我做的头 4 个： - Haight：旧金山的爱之夏 - Mussoorie 【2：22】：山间的 Ruskin Bond 之夜 - Baarish 【3：19】：季风时节的加尔各答 - Mehfil 【5：00】：Nizammudin 的 Qawalli 之夜  只需说出你当下的感觉，投屏到电...", "type": "paper", "relTime": "1周前"}, {"id": 97, "title": "第二届世界人形机器人运动会赛前冲刺：家政赛要求30分钟内完成收纳叠衣，大模型助力持续学习", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/389.htm", "date": "2026-08-16T13:52:16.000Z", "summary": "第二届世界人形机器人运动会将于8月22日在北京\"冰丝带\"开幕，51个项目共1301场比赛，666支队伍、2056台机器人参赛。家政场景赛中，机器人需在30分钟内完成物品收纳、衣物折叠等任务，赛队通过五种数据训练大模型，并开发\"终身学习机制\"应对关节磨损。福建队\"福智\"采用3D打印轻量化轮臂结构，搭载自研具身智能大模型，已在福州地铁站开展实境测试。", "type": "industry", "relTime": "1周前"}, {"id": 98, "title": "Grok版视频生成对比Seedance 2.5动作效果", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2088936060784902508", "date": "2026-08-16T10:29:02.000Z", "summary": "博主对比测试发现，Grok制作的视频版本在动作类效果上仍逊于Seedance 2.5，但极具Grok特色，会主动呈现主体人物性感的一面。此前博主用Seedance 2.5将AIGC美女图转为视频，8段画面动作与运镜全程丝滑不漂移，带来\"迟到二十年的补偿感\"。", "type": "tip", "relTime": "1周前"}, {"id": 99, "title": "全国首家 AI 家庭机器人旗舰店落地青岛，海尔外骨骼机器人可现场试穿", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/337.htm", "date": "2026-08-16T09:50:27.000Z", "summary": "海尔智家全国首家 AI 家庭机器人体验店今日落地青岛，用户可现场试穿外骨骼机器人并做步态检测与一对一精准调试。店内还提供烹饪、家务、清洁、陪伴机器人的沉浸式体验。海尔今年 5 月曾推出全球最轻 AI 运动外骨骼机器人 W3，采用全碳纤维+钛合金设计，1.75kg 超轻机身，单腿最大助力 16N·m，减负约 5kg。", "type": "industry", "relTime": "1周前"}, {"id": 100, "title": "Seedance 2.5 视频生成：迟来二十年的补偿感", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2088845636355440754", "date": "2026-08-16T04:29:43.000Z", "summary": "博主用 Seedance 2.5 将 AIGC 美女图转为视频，8 段画面动作与运镜一气呵成，全程不漂移，体验丝滑。其感叹 AI 让儿时想象直接成真，带来\"迟到了二十年的补偿感\"。引用推文称 Seedance 2.5 尺度比 2.0 开放，且能过审。", "type": "tip", "relTime": "1周前"}, {"id": 101, "title": "女子加入针对 SpaceXAI 的诉讼：继父利用 Grok 将其 11 岁照片加工成 7000 多张色情图像", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/221.htm", "date": "2026-08-16T00:13:02.000Z", "summary": "一名化名\"简·多伊 4 号\"的女性加入美国田纳西州三名青少年对 SpaceXAI 的诉讼，指控其继父利用 Grok 将她 11 岁时的一张照片加工成 7000 多张露骨性虐待图像。执法部门查获图像两天后，其继父自杀身亡。原告方指控 SpaceXAI 未采取基础防护措施阻止 Grok 生成含未成年人的真人露骨图像，并正申请将该案列为集体诉讼。", "type": "industry", "relTime": "1周前"}, {"id": 102, "title": "超越视觉思维链：面向主动视频推理的内化视觉思维", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.15869", "date": "2026-08-16T00:00:00.000Z", "summary": "新提出的IVT后训练框架在无标注视频上联合优化文本预测与下一嵌入预测，使模型推理时直接生成答案，无需合成或重编码未来帧。相比显式视觉CoT，IVT性能相当或更优，端到端延迟平均降低5倍以上，并在全部六项评测设置上优于直接答案微调。", "type": "paper", "relTime": "1周前"}, {"id": 103, "title": "WorldRover：面向世界探索的可扩展合成视频数据引擎", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.15659", "date": "2026-08-16T00:00:00.000Z", "summary": "WorldRover 是一个生成富含标注的长程世界探索视频的数据引擎，其核心 WorldRover-Engine 基于 Unreal Engine 离线渲染分钟级路线，保留完整轨迹与场景几何，并支持第一人称、第三人称及 360 全景视角重放。", "type": "paper", "relTime": "1周前"}, {"id": 104, "title": "女子指控继父用 Grok 将童年照片转为露骨图像并加入诉讼", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/15/woman-claims-her-stepfather-used-grok-to-transform-childhood-photo-into-explicit-imagery", "date": "2026-08-15T21:29:19.000Z", "summary": "一位化名 Jane Doe 4 的女子加入三名田纳西州青少年对 xAI 的诉讼，指控其继父用 Grok 将她 11 岁时的照片制造成 7，000 多张露骨图像。继父在警方搜查发现图像两天后自杀身亡。诉讼指控 xAI 未采取基本预防措施防止 Grok 生成涉及未成年人的真实人物露骨图像，并寻求集体诉讼资格。", "type": "industry", "relTime": "1周前"}, {"id": 105, "title": "Anthropic 详解 Claude 新水印机制：如何运作、能否被编辑隐藏及对代码的影响", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/15/anthropic-shares-more-details-about-how-claudes-new-watermarks-will-work", "date": "2026-08-15T18:58:39.000Z", "summary": "Anthropic 发布博客文章，详解其聊天机器人 Claude 文本水印的运作方式。该水印采用 Google DeepMind 2024 年提出的 SynthID-Text 方法，并计划推出水印检测 API。Anthropic 称水印不影响输出质量，轻度编辑可能无法完全去除水印，而代码因需保证可运行，水印影响甚微。此举是为遵守欧盟 AI 法案透明度规范。", "type": "product", "relTime": "1周前"}, {"id": 106, "title": "埃森·莫里克呼吁专家用AI视频还原历史", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2088685078519959776", "date": "2026-08-15T17:51:43.000Z", "summary": "埃森·莫里克呼吁历史学家、生物学家、物理学家等专家使用AI视频，直接向公众展示恐龙时代、木卫一表面、古罗马等缺乏准确影像的场景。他以自己用Google Deep Research生成提示词、让Veo 3描述罗德岛巨像的实验为例，说明AI视频能让专家直接呈现历史。", "type": "tip", "relTime": "1周前"}, {"id": 107, "title": "Suno Studio 2.0 发布：新增 MIDI 支持、效果插件，向 DAW 靠拢", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/990/190.htm", "date": "2026-08-15T15:28:28.000Z", "summary": "Suno 推出 Studio 2.0，新增 MIDI 支持，用户可将 MIDI 数据直接交给 AI 生成音频或续写旋律，但暂只能使用自带合成器。聊天机器人已整合进 Studio 界面，可读取工程内容创作歌词或生成吉他声部，并自动添加混响、压缩和 EQ。用户还能通过 AI 创建自定义效果插件，生成的效果会保存在账户中供后续调用。", "type": "paper", "relTime": "1周前"}, {"id": 108, "title": "AI生成书籍正淹没亚马逊，并拉低人类作者的单书收入", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/ai-generated-books-are-flooding-amazon-and-tanking-sales-for-human-authors", "date": "2026-08-15T11:00:50.000Z", "summary": "一项对14，419本自出版电子书的分析显示，AI生成书籍正以数量而非质量挤占人类作者市场，即便未检测到AI文本的书籍，单书收入也在下滑。2023年Q1至2026年Q1，书目总量增长38.3倍，而季度收入仅增长8.9倍；在八个类型中，七个类型的无AI文本书籍单书收入下降。", "type": "paper", "relTime": "1周前"}, {"id": 109, "title": "Gemini 新增关闭可见水印选项", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2088567338329067921", "date": "2026-08-15T10:03:51.000Z", "summary": "ICYM 👀： Gemini 用户现可关闭图片、视频和歌曲的可见水印。在法律要求必须保留水印的国家/地区，该设置不可用。  SymnthID 仍将保留 🤖", "type": "paper", "relTime": "1周前"}, {"id": 110, "title": "Seedance 2.5 尺度更开放，Grok 视频更便宜", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2088552686832472522", "date": "2026-08-15T09:05:38.000Z", "summary": "Seedance 2.5 审核尺度比 2.0 更开放，生成内容能过审。引用推文称 Grok 生成的 15 秒男友视角视频质量可与 Seedance 一拼，且价格至少便宜 3 倍。", "type": "tip", "relTime": "1周前"}, {"id": 111, "title": "Claude 文本水印上线，翻译文本将被标记为 AI 生成", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2088545436139168231", "date": "2026-08-15T08:36:49.000Z", "summary": "Anthropic 为 Claude 引入文本水印以符合欧盟 AI 法案，该水印不影响输出质量、不增加 token 成本，且无法被读者察觉。用户用 Claude 翻译文本将被检测器标记为 AI 生成，对大学生等群体影响严重。", "type": "industry", "relTime": "1周前"}, {"id": 112, "title": "Grok 生成男友视角视频，比 Seedance 便宜 3 倍", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2088532122139070943", "date": "2026-08-15T07:43:55.000Z", "summary": "博主称 Grok 生成的 15 秒男友视角视频与 Seedance 2.5 效果相当，且一次生成、零抽卡，价格至少便宜 3 倍。其认为目前视频大模型中仅 Grok 能与 Seedance 一战。", "type": "tip", "relTime": "1周前"}, {"id": 113, "title": "World Labs 推出 R2S2R 仿真引擎，将单个真实机器人任务转化为数千种模拟变体", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/world-labs-turns-one-real-world-robot-task-into-thousands-of-simulated-variations-for-training", "date": "2026-08-15T07:30:48.000Z", "summary": "World Labs 发布\"Real-to-Sim-to-Real\"（R2S2R）仿真引擎，在虚拟环境中训练机器人控制系统，随后可在真实硬件上稳定运行数小时。该技术源自其 7 月收购的 SceniX，可将单个真实任务生成数千种受控变体，用于策略训练与评估。据 World Labs，模型在 ALOHA 等五个平台上各运行一小时无需人工干预，且模拟与真实环境中的模型排名基本一致。", "type": "model", "relTime": "1周前"}, {"id": 114, "title": "谷歌 Gemini 将推 Media Watermark 设置：可关闭 AI 生成图片/视频/音乐的可见水印", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/997.htm", "date": "2026-08-15T01:29:18.000Z", "summary": "谷歌预告未来几天为 Gemini 新增 Media Watermark 设置，用户可关闭图像、视频和音乐作品的可见水印。该选项位于左侧栏\"设置\"菜单倒数第 3 项，提供\"On\"和\"Off\"两个选项。关闭可见水印后，AI 生成内容仍保留 SynthID 隐形水印与 C2PA 元数据。", "type": "paper", "relTime": "1周前"}, {"id": 115, "title": "MOSS-VL技术报告：将实时交互作为一等能力的开源视觉语言模型家族", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.15045", "date": "2026-08-15T00:00:00.000Z", "summary": "MOSS-VL是一个将实时交互（边感知边说话）作为一等能力的开源视觉语言模型家族，通过门控交叉注意力让语言解码器在生成时同步处理视觉输入。MOSS-VL-Realtime在四个流式基准中平均成绩居开源模型之首（三项第一、一项第二），在OmniMMI Proactive Alerting上以66.0分大幅领先最佳基线（37.5分）。", "type": "model", "relTime": "1周前"}, {"id": 116, "title": "VibeWorlding：多模态智能体能否端到端构建 3D 开放世界？", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.15265", "date": "2026-08-15T00:00:00.000Z", "summary": "VibeWorlding 提出统一框架，用于基准测试和训练能自主推断用户意图、规划场景布局、调用 3D 工具并反思多模态反馈的\"vibe worlding\"智能体。", "type": "paper", "relTime": "1周前"}, {"id": 117, "title": "Gemini 3.7 Flash 配 Nano Banana 2 Lite 生成艺术图", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2088396528469545337", "date": "2026-08-14T22:45:07.000Z", "summary": "fofr 展示了一组由 Gemini 3.7 Flash 配合 Nano Banana 2 Lite 生成的精选艺术作品。示例提示词描绘黄昏时分巨型飞机低空掠过跑道的极简画面，体现该组合在图像生成上的表现力。", "type": "tip", "relTime": "1周前"}, {"id": 118, "title": "Anthropic 推出水印检测 API，第三方可识别 Claude 生成的文本", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/anthropic-announces-watermark-detection-api-that-will-let-third-parties-detect-claudes-ai-texts", "date": "2026-08-14T21:29:17.000Z", "summary": "Anthropic 将推出水印检测 API，让第三方开发者能将 AI 文本检测集成到自有应用中。该水印基于 Google DeepMind 2024 年发表于 Nature 的 SynthID Text 方法变体，通过调整选词时的随机源留下可追踪模式，且不影响文本内容、创意性或可读性。", "type": "product", "relTime": "1周前"}, {"id": 119, "title": "Claude 文本水印机制：密钥掷硬币检测 AI 生成", "source": "X：马东锡 NLP (@dongxi_nlp)", "sourceUrl": "https://x.com/dongxi_nlp/status/2088351263453065675", "date": "2026-08-14T19:45:15.000Z", "summary": "马东锡 NLP 解析 Claude 的 SynthID-Text 水印机制：模型前向传播后，对每个候选 token 进行一次带密钥的上下文相关\"掷硬币\"更新，再采样生成。持有密钥者可检测该统计模式。Anthropic 称此举为遵守欧盟 AI 法案，不影响输出质量、不增加成本，且水印无法追溯到具体个人或对话。", "type": "tip", "relTime": "1周前"}, {"id": 120, "title": "MiniMax 将亮相 ModCon 分享 H3 视频生成", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2088332365676580938", "date": "2026-08-14T18:30:09.000Z", "summary": "MiniMax 美国业务负责人 Morgan Suo 将于 8 月 18 日在旧金山 ModCon 大会分享 H3 如何改变 AI 视频生成。H3 从设计之初就注重硬件兼容性，并已开源权重，可在多种芯片上运行。", "type": "industry", "relTime": "1周前"}, {"id": 121, "title": "小红书开源生活智能体模型 dots3-note", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2088326336012075060", "date": "2026-08-14T18:06:12.000Z", "summary": "小红书（RedNote）开源大语言模型 dots3-note preview，主打长时程生活智能体场景。该模型为 280B MoE、16B 激活参数，512K 上下文窗口，支持文本、视觉、音频多模态，并引入针对长时任务 RL 训练的新方法 TEMPO。模型权重与两个生活智能体基准 VibeSearchBench、VibeLifeBench 已在 Hugging Face 开源。", "type": "model", "relTime": "1周前"}, {"id": 122, "title": "中国为何赢下AI视频竞赛：生态而非模型", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2088307079853621342", "date": "2026-08-14T16:49:41.000Z", "summary": "字节跳动Seedance 2.5与MiniMax H3同日发布，中国厂商占据Artificial Analysis文生视频榜单前十中的九席。OpenAI退出Sora独立视频业务，因缺乏内容平台生态和付费循环，而Sora推理成本曾被估约每日1500万美元。中国创作者通过短视频平台付费生成内容，形成支撑模型迭代的商业闭环。", "type": "tip", "relTime": "1周前"}, {"id": 123, "title": "Gemini 与 Flow 可选关闭可见 AI 水印", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2088306032934322456", "date": "2026-08-14T16:45:31.000Z", "summary": "Google 在 Gemini 和 Flow 中让可见 AI 水印变为可选关闭，同时保留不可见的来源信号。Nano Banana 图片、Omni 视频和 Lyria 音乐可关闭可见水印，但 SynthID 隐形水印与 C2PA 溯源数据仍会保留，以便识别 AI 生成内容。该功能适用于所有媒体，法律要求保留水印的国家除外。", "type": "paper", "relTime": "1周前"}, {"id": 124, "title": "Google Gemini 现可关闭可见水印", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/980416/google-gemini-ai-watermarks-removal", "date": "2026-08-14T16:39:32.000Z", "summary": "Google 更新 Gemini 与 AI 视频生成器 Flow，新增\"Media watermark\"设置，关闭后生成的图片、视频和音乐将不再带有右下角的\"sparkle\"可见水印。但 AI 内容仍会嵌入不可见的 SynthID 水印和 C2PA 元数据，用户可通过 Gemini 或 Search 验证内容是否由 AI 生成。该设置后续将推广至 Search，但不会在要求可见水印的国家上线。", "type": "paper", "relTime": "1周前"}, {"id": 125, "title": "Google 允许用户移除 AI 生成内容的可见水印", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/14/google-will-now-allow-users-to-remove-visible-watermark-from-its-ai-generations", "date": "2026-08-14T16:13:40.000Z", "summary": "Google 于本周五宣布，将允许用户移除其 AI 生成内容（包括图片、视频和歌曲）上的可见水印，该功能不影响不可见的 SynthID 水印和 C2PA 元数据。此开关将适用于 Nano Banana、Omni 和 Lyria 模型，可在 Gemini 和视频编辑器 Flow 中使用，搜索支持即将推出。Google 同时开源了新库 Credentio，帮助开发者在应用中嵌入本地验证机制。", "type": "model", "relTime": "1周前"}, {"id": 126, "title": "Qwen3.8-27B 本地运行 Opus 4.6 Max 级能力", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2088295804108783728", "date": "2026-08-14T16:04:53.000Z", "summary": "Qwen 发布 Qwen3.8-27B 紧凑开源多模态模型，仅 27B 参数即在智能体编码、计算机使用等基准上超越 Claude Opus 4.6 Max。支持图像、视频、可配置推理，原生 262K 上下文窗口可扩展至 1M，Apache 2.0 许可可自托管。基准结果为 Qwen 自测，尚待独立验证。", "type": "model", "relTime": "1周前"}, {"id": 127, "title": "Gemini 应用新增关闭视觉水印选项", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2088292414549070228", "date": "2026-08-14T15:51:24.000Z", "summary": "提醒一下，如果你在用 Gemini 应用生成图片、视频或歌曲，现在可以关闭视觉水印（角落里的 ✨）了🙌  这适用于所有图片（Nano Banana）、视频（Omni）和歌曲（Lyria）上的水印，但法律要求保留水印的国家除外。", "type": "paper", "relTime": "1周前"}, {"id": 128, "title": "阿里云推出AI Spotlight系列首期聚焦Qwen3.8-Max", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2088287252116013385", "date": "2026-08-14T15:30:54.000Z", "summary": "我们正在推出AI Spotlight，这是一个深入探讨Qwen模型和AI产品的新系列。第一期：Qwen3.8-Max及其独特之处。  这只是第一期，更多视频即将推出。敬请期待！  在此之前，欢迎前往以下平台查看：  Qwen Cloud： https://click.qwencloud.com/m/20000001102/ Model Studio： https://click.alibab...", "type": "industry", "relTime": "1周前"}, {"id": 129, "title": "新研究证实 AI 生成书籍已挤压人类作者作品市场空间", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/951.htm", "date": "2026-08-14T15:06:49.000Z", "summary": "研究人员分析 2023 年至 2026 年间亚马逊销售的 1.4 万多本电子书，发现含大量 AI 生成文本的图书已多到足以挤压其他图书市场。有销量的图书数量增至原来的 19 倍，但读者总支出仅增至 9 倍，单本平均收入因此减少，未检测出 AI 文本的图书市场份额也在下降。Fairly Trained CEO 称，AI 公司\"不造成经济损失\"的说法已\"彻底站不住脚\"。", "type": "paper", "relTime": "1周前"}, {"id": 130, "title": "Qwen3.8-27B 发布：小模型挑战前沿智能体", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2088280043759780324", "date": "2026-08-14T15:02:15.000Z", "summary": "阿里通义千问发布 Qwen3.8-27B，仅 27B 参数的开源多模态模型，宣称在智能体编程、计算机使用、浏览器任务及长周期专业工作中达到 SOTA，多项基准超越 Claude Opus 4.6 Max。支持图像、视频、可配置推理，原生 262K 上下文窗口可扩展至 1M，Apache 2.0 协议可自托管。基准结果为官方自测，尚待独立验证。", "type": "model", "relTime": "1周前"}, {"id": 131, "title": "Gemini 新增可见水印开关，可随时关闭", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2088277477672255830", "date": "2026-08-14T14:52:03.000Z", "summary": "Gemini 将在未来几天内推出可见水印开关，用户可在设置中自行决定 AI 生成的图片、视频和音乐是否显示可见水印。不可见的 SynthID 水印和 C2PA 元数据将始终保留在后台。该功能适用于所有图片（Nano Banana）、视频（Omni）和歌曲（Lyria），但法律要求保留水印的国家除外。", "type": "paper", "relTime": "1周前"}, {"id": 132, "title": "Pomelli 更新：照片一键转动态视频", "source": "X：Josh Woodward (@joshwoodward, Google Labs VP)", "sourceUrl": "https://x.com/joshwoodward/status/2088261701028503965", "date": "2026-08-14T13:49:22.000Z", "summary": "Google Labs 的 Pomelli 推出模板升级，用户可上传图片或使用预设模板生成社媒与广告视觉素材，并通过 Animate 功能将照片转为短视频或 GIF。该实验项目正吸引越来越多小企业用户，主打简单易用，现可免费试用。", "type": "paper", "relTime": "1周前"}, {"id": 133, "title": "面壁智能 VoxCPM-0.5B 驱动 3D 空手道热狗角色", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2088249288757539092", "date": "2026-08-14T13:00:02.000Z", "summary": "面壁智能 OpenBMB 发布 Karate Wiener 交互式 3D 角色体验，由 VoxCPM-0.5B 模型驱动，支持语音对话、动作生成与个性化道场。该项目为 #BuildSmall 黑客松作品，展示轻量级开源模型在创意角色应用中的协作能力，演示与模型均已上线 HuggingFace。", "type": "model", "relTime": "1周前"}, {"id": 134, "title": "dots3-note Preview 开源：280B 参数轻量模型，主打长程智能体与多模态推理", "source": "公众号：小红书技术（dots.llm）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg4OTc2MzczNg%3D%3D&mid=2247496140&idx=1&sn=5239a5fbb115c58d2ae0056bb32789ff", "date": "2026-08-14T11:25:29.000Z", "summary": "小红书技术开源 dots3-note Preview，这是 dots3 系列最轻量模型，总参数 280B、激活参数 16B，支持 512K 上下文及文本、视觉、语音多模态理解，并针对复杂推理和长程 Agent 任务优化。", "type": "model", "relTime": "1周前"}, {"id": 135, "title": "玉伯推荐 Anthropic 风格插画 Skill", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2088216125549240578", "date": "2026-08-14T10:48:16.000Z", "summary": "玉伯推荐一款 YouMind 新发布的「Anthropic 风格插画」Skill。输入主题即可生成简单、克制、带手绘感的概念插画，适合做文章配图、封面或抽象概念的视觉隐喻。链接：https://youmind.com/skills/anthropic-paper-cut-illustrations-KRTYyHOBadqVOr", "type": "tip", "relTime": "1周前"}, {"id": 136, "title": "RedNote 开源 dots3-note 预览版，280B MoE 智能体模型", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2088194805654323617", "date": "2026-08-14T09:23:33.000Z", "summary": "RedNote 开源 dots3-note Preview，一款 280B MoE 多模态智能体模型，仅 16B 参数同时激活，支持 512K 上下文及文本、图像、视频和音频理解。", "type": "model", "relTime": "1周前"}, {"id": 137, "title": "迈向通用科学 AI：ALD/E-ImageMiner 基准如何推动科学图像理解", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.14075", "date": "2026-08-14T08:34:33.000Z", "summary": "ALD/E-ImageMiner 基准与 ICDAR 2026 科学图表信息提取竞赛提供来自 205 篇论文的 1，951 张图表，经专家标注用于分类、数据表提取、摘要和视觉问答。该视角文章提出将\"从图像中理解科学概念\"作为长期基准目标，未来方向涵盖更广领域与图表类型、跨文档综合、假设评估及可验证的多模态科学 AI。", "type": "paper", "relTime": "1周前"}, {"id": 138, "title": "Uber与Pony.ai扩大Robotaxi合作", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2088178310354227464", "date": "2026-08-14T08:18:00.000Z", "summary": "Uber正在扩大与Pony.ai的robotaxi合作。两家公司计划在欧洲部署2，000辆自动驾驶出租车，并将合作扩展至中东。Uber与Pony.ai于3月在克罗地亚萨格勒布推出了商业robotaxi服务，他们称这是欧洲首个。下一阶段将新增四个欧洲城市，但地点和时间尚未公布。Pony.ai将于周二公布季度财报。", "type": "industry", "relTime": "1周前"}, {"id": 139, "title": "DeepSeek Harness 实测：灵活切换多模型", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2088161448971075965", "date": "2026-08-14T07:11:00.000Z", "summary": "我们刚测试了 DeepSeek Harness，它比我们预期的更灵活。我们最初以为它又是一个 Claude Code，但 Harness 可以在多个模型之间即时切换，并连接支持视觉的模型，让 DeepSeek 分析图像。其团队将目标描述为\"时间性\"和\"空间性可组合\"：工具可以动态安装、调整和移除，而不会破坏系统。这将是一个为无限扩展而构建、不会频繁崩溃的平台。", "type": "tip", "relTime": "1周前"}, {"id": 140, "title": "Grok 4.6 多模态理解大幅升级", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2088127459971522726", "date": "2026-08-14T04:55:56.000Z", "summary": "Elon Musk 称 Grok 4.6 的图像与视频理解能力是一次重大升级。引用推文指出，Grok 4.6 多模态相较 4.5 是阶跃式改进，在视频审阅等日常工作中可将生产力提升至少 10 倍，甚至 100 倍。该模型在作者的实际用例中超越了 Gemini 3.5 和 Gemma 4。", "type": "model", "relTime": "1周前"}, {"id": 141, "title": "阿里云 Wan 3.0 Beta 用 AI 视频讲述情感故事", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2088104804581355551", "date": "2026-08-14T03:25:55.000Z", "summary": "阿里云发布 Wan 3.0 Beta，主打用 AI 视频模型将破碎片段化为动人叙事，赋能创作者可视化深层情感。示例视频展示\"修心铺\"故事：破碎的心在匠人手中被逐片修复，传递\"破碎的心无需替换，只需关怀\"的主题。用户可通过阿里云 Model Studio 和 Qwen Cloud 体验。", "type": "model", "relTime": "1周前"}, {"id": 142, "title": "Meta/Oxford 研究：多模态预训练仅需 5% 图像生成数据", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2088103654519968190", "date": "2026-08-14T03:21:20.000Z", "summary": "Meta 与牛津大学研究发现，若语言与视觉理解同步训练，多模态模型仅需极少量图像生成数据。1T token 实验中最佳配比为 70% 语言、25% 图像理解、5% 图像生成；13.5B 规模 2T token 测试中，图像生成 token 减少 5 倍，GenEval 仍从 0.467 提升至 0.482。研究还指出过晚引入视觉会导致\"视觉惰性\"，模型倾向依赖语言捷径。", "type": "paper", "relTime": "1周前"}, {"id": 143, "title": "小马智行与优步扩大合作，计划在欧洲 5 城部署超 2000 辆 Robotaxi", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/525.htm", "date": "2026-08-14T01:10:06.000Z", "summary": "小马智行与优步 Uber 扩大战略合作，将在欧洲 5 个城市部署超过 2000 辆小马智行 Robotaxi，并在克罗地亚萨格勒布现有商业化运营基础上扩展。萨格勒布服务即将接入 Uber 平台，用户可通过 Uber App 呼叫车辆。小马智行提供 L4 级自动驾驶技术，Uber 提供出行平台支持，双方还将深化中东合作。", "type": "industry", "relTime": "1周前"}, {"id": 144, "title": "PRM-as-a-Judge 1.5：面向机器人过程评估的工具包", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.14284", "date": "2026-08-14T00:00:00.000Z", "summary": "PRM-as-a-Judge 1.5 发布，将 rollout 视频转化为密集进度曲线并派生多项细粒度指标，在 1.0 基础上新增三个指标，分别刻画失败侧进展、回撤后恢复与成功侧执行质量。基于基准测试的 rollout 视频，该工具包对具身模型进行了综合评估，并推出 RoboPulse++ 以检验过程奖励模型（PRM）的可靠性，同时开源了包含基准、指标实现与可视化工具的评估套件。", "type": "paper", "relTime": "1周前"}, {"id": 145, "title": "RA-Bench：系统评估AI生成视频检测器在真实危机事件中的表现", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.14391", "date": "2026-08-14T00:00:00.000Z", "summary": "RA-Bench基准以真实视频为锚点，含17，886个视频，覆盖10类社会风险场景，由1，830个真实视频和来自4个开源、5个闭源生成器的16，056个生成片段组成。评估发现，七种传统检测器、十种零样本多模态模型及两种微调MLLM均无法在RA-Bench上稳定泛化；能误导人类的视频同样难以被现有检测器识别，且社交传播进一步降低检测可靠性。", "type": "paper", "relTime": "1周前"}, {"id": 146, "title": "Marionette：预测世界状态、渲染几何、绘制外观", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.14530", "date": "2026-08-14T00:00:00.000Z", "summary": "Marionette 将交互游戏世界模型拆分为显式状态预测与外观合成：两阶段自回归动力学模型输出 276 维 3D 世界状态，零参数图形桥接器以闭式解计算几何与遮挡，再由控制条件视频扩散模型合成 RGB 帧。强制不匹配动作流使根对齐关节误差改变 31%；施加地形碰撞器与分离上限后，地面穿透减少 66%，FVD 831 对 799，外观保真度无明显损失。", "type": "paper", "relTime": "1周前"}, {"id": 147, "title": "SPARGen：以原生多模态生成统一空间感知与推理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.14138", "date": "2026-08-14T00:00:00.000Z", "summary": "SPARGen 提出统一多模态框架，将 3D 重建、密集对应与空间推理重构为指令条件生成任务，在单一原生多模态生成模型中联合塑造共享表征。该框架将紧凑结构化与语言输出序列化为 token 序列，同时以图像对齐形式生成密集几何场。在 3D 重建、对应与空间推理基准上，SPARGen 以单一框架在异构空间任务中取得具有竞争力的性能。", "type": "paper", "relTime": "1周前"}, {"id": 148, "title": "OpenRouter 视觉指南：如何通过 API 向多模态模型发送图像", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/tutorials/send-image-to-llm", "date": "2026-08-14T00:00:00.000Z", "summary": "OpenRouter 发布视觉指南，详解通过 Chat Completions API 向多模态模型发送图像的方法。请求体采用 messages 数组，用户消息的 content 包含 text 和 image_url 两部分，支持公开 URL 或 base64 数据 URL 两种格式，兼容 PNG、JPEG、WebP 和 GIF。", "type": "tip", "relTime": "1周前"}, {"id": 149, "title": "MegaParts：通过Token高效自回归建模将部件感知3D生成扩展至300个部件", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.14783", "date": "2026-08-14T00:00:00.000Z", "summary": "MegaParts提出可扩展的自回归3D生成框架，结合结构化序列建模与token高效的向量量化形状分词器，将部件级3D生成扩展至最多300个部件、序列长度达256k tokens。该方法在统一结构化序列中训练大语言模型生成物体边界框、部件边界框及部件形状token，相比基线自回归和扩散模型实现了更高的网格质量，表明压缩离散部件token能同时提升可扩展性与生成保真度。", "type": "paper", "relTime": "1周前"}, {"id": 150, "title": "文远知行 2026 上半年营收 3.5 亿同比增长 73%，Robotaxi 超 1800 辆", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/504.htm", "date": "2026-08-13T23:53:56.000Z", "summary": "文远知行发布 2026 年第二季度及上半年财报，上半年总营收 3.5 亿元，同比增长 73%；第二季度营收 2.3 亿元，同比增长 82%、环比增长 103%，毛利率升至 37.5%。上半年海外收入同比增长 154%，业务已覆盖 13 国 60 余城。截至 7 月 31 日，全球 L4 车队约 3，400 辆，其中 Robotaxi 超 1，800 辆。", "type": "industry", "relTime": "1周前"}, {"id": 151, "title": "Hitem3D 浏览器内 2D 转 3D 模型实测", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2088015317624844355", "date": "2026-08-13T21:30:19.000Z", "summary": "1/ 我想测试一下，能否从一张平面 2D 图像直接生成可用的 3D 资产，而无需花费数小时修复网格。  一张平面 2D 图像在大约 5 分钟内就变成了一个清晰、高细节的 3D 模型。整个过程完全在浏览器内通过 @Hitem3D 完成，零配置。以下是最终资产和具体工作流的快速展示：", "type": "tip", "relTime": "1周前"}, {"id": 152, "title": "Gemini 3.7 一句话生成 3D 手表，成本仅 $0.038", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2087995034755019080", "date": "2026-08-13T20:09:44.000Z", "summary": "Gemini 3.7 仅凭一句自然语言描述，就一次性生成了完整的程序化 three.js 场景--一只金色豪华手表，含滚花表圈、旭日纹表盘、日期窗口和扫秒指针，全程无外部素材或纹理。该测试由 AI/ML API 完成，总成本仅 $0.038。Rohan Paul 指出，three.js 是检验模型能力的有效方式，因为代码必须描述一个经得起旋转的真实场景。", "type": "tip", "relTime": "1周前"}, {"id": 153, "title": "Matic 机器人吸尘器推出语音手势控制", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2087976647828050200", "date": "2026-08-13T18:56:40.000Z", "summary": "Matic 推出 Cues 语音与手势控制，成为全球首款直观家用机器人，获 1.15 亿美元融资并历时 9 年研发。用户可指向污渍并说\"Hey Matic， clean this\"，机器人即可通过 5 摄像头视觉定位并自主清洁。Matic 支持 75 种语言，气流提升 8 倍，获 WIRED 10/10 评分，已有 13，000 家庭使用。", "type": "paper", "relTime": "1周前"}, {"id": 154, "title": "Matic 扫地机器人弃用 LiDAR 改用视觉方案", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2087964467326034201", "date": "2026-08-13T18:08:16.000Z", "summary": "Matic 将特斯拉的视觉优先路线用于家用扫地机器人：配备五颗 RGB-IR 摄像头、无 LiDAR，由 NVIDIA Jetson Orin 板载推理，实时更新 3D 地图以区分充电线、袜子和宠物。团队耗时 7 年、不足 100 人打造，获 1.15 亿美元融资，支持 75 种语言，WIRED 给出 10/10 评分。", "type": "paper", "relTime": "1周前"}, {"id": 155, "title": "Gemini 3.7 Flash 智能体协作自主训练机器人模型", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2087959863624114683", "date": "2026-08-13T17:49:58.000Z", "summary": "一个由 3 个 Gemini 3.7 Flash 智能体组成的团队协作，从零开始自主训练了一个机器人模型。", "type": "tip", "relTime": "1周前"}, {"id": 156, "title": "Gemini 3.7 Flash 发布：主打编码与智能体任务", "source": "X：Google AI for Developers (@googleaidevs)", "sourceUrl": "https://x.com/googleaidevs/status/2087952344738648246", "date": "2026-08-13T17:20:05.000Z", "summary": "Google 发布 Gemini 3.7 Flash，定位为面向编码和智能体任务的高性能模型，具备更强的指令遵循、首遍代码准确率与智能体任务执行能力。官方演示其构建复杂 3D 网页游戏，涵盖 Three.js 引擎逻辑、Nano Banana 素材生成与程序化音频集成。", "type": "model", "relTime": "1周前"}, {"id": 157, "title": "腾讯ARC发布SCoPE视频扩散位置编码", "source": "X：AK (@_akhaliq)", "sourceUrl": "https://x.com/_akhaliq/status/2087941343175750088", "date": "2026-08-13T16:36:22.000Z", "summary": "SCoPE  面向视频扩散Transformer的Sightline-坐标位置编码  模型：https://huggingface.co/TencentARC/SCoPE", "type": "paper", "relTime": "1周前"}, {"id": 158, "title": "MiniMax Music 3 开源，8B+2.7B 生成歌曲", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2087939869100458444", "date": "2026-08-13T16:30:31.000Z", "summary": "感谢 Huggingface 团队 @multimodalart，Day 0 支持开源音乐模型！  MiniMax Music 3 刚刚在 @huggingface 上线 🎶🎵  SOTA 歌曲生成，现已开源权重，一个 8B LLM + 2.7B DiT，将提示词和歌词转化为完整歌曲  可通过 🧨 diffusers 或 comfy 在小型消费级 GPU 上运行  模型权重 + 应用已在 S...", "type": "model", "relTime": "1周前"}, {"id": 159, "title": "HeyGen 将 Avatar IV 视频生成模型移植到 Google Cloud Trillium TPU", "source": "Google Developers Blog（RSS）", "sourceUrl": "https://developers.googleblog.com/heygen-x-google-cloud-bringing-avatar-iv-to-tpus", "date": "2026-08-13T16:19:15.422Z", "summary": "HeyGen 将 18B+ 参数的 Avatar IV 视频生成模型移植到 Google Cloud Trillium （v6e） TPU，通过 torchax 和 XLA 实现，并采用 FSDP 与 Ulysses 序列并行。", "type": "tip", "relTime": "1周前"}, {"id": 160, "title": "Suno Studio 2.0 发布：新增 MIDI、效果插件与合成器，更接近专业 DAW", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/979345/suno-studio-2-0-midi-chatbot-custom-effects", "date": "2026-08-13T16:00:00.000Z", "summary": "Suno 发布 Studio 2.0，新增 MIDI 支持、自动化、内置效果插件及合成器，使其更接近专业数字音频工作站。新版还加入与当前项目音乐上下文联动的聊天机器人，可生成歌词、吉他线或自动添加混响、压缩等效果，并支持创建可保存复用的自定义效果插件。不过 Studio 暂不支持第三方插件或 VST。", "type": "paper", "relTime": "1周前"}, {"id": 161, "title": "Liquid AI 发布 LFM2.5-VL-3B：3B 端侧视觉语言模型，可读屏、目标定位与调用工具", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/13/liquid-ai-lfm2-5-vl-3b-on-device-vision-language-model", "date": "2026-08-13T15:56:03.000Z", "summary": "Liquid AI 发布 LFM2.5-VL-3B，一款 3.1B 参数的端侧视觉语言模型，可读取移动端、网页和桌面屏幕，将目标定位到坐标，解析文档图表，并从文本或图像输入调用工具。", "type": "model", "relTime": "1周前"}, {"id": 162, "title": "神秘生图模型\"mona-lisa-1\"曝光：含 OpenAI 来源信号，GPT-Image-2 发布三个月仍稳坐第一", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/476.htm", "date": "2026-08-13T14:41:37.000Z", "summary": "8月9日，代号\"mona-lisa-1\"的图像生成模型现身AI竞技场盲测列表，爆料者称其图片经OpenAI官方验证工具检测到来源信号，被认定为新一代GPT-Image模型。OpenAI尚未正式公告，该模型也未接入ChatGPT、API或Codex。OpenAI指出验证结果不能确认具体模型，尚不能凭来源信号确认其为GPT-Image 2继任型号。", "type": "industry", "relTime": "1周前"}, {"id": 163, "title": "部分 Claude 模型将添加\"文本水印\"，Anthropic 回应各界关切", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/462.htm", "date": "2026-08-13T13:47:17.000Z", "summary": "Anthropic 本周宣布，部分 Claude 模型将在输出文本中嵌入难以察觉的水印，复制粘贴或经一定修改后仍可保留，用于判断文字是否由 AI 生成。公司计划提供免费 API 供第三方检测水印，并称水印不会改变回答含义、质量或可读性。该水印自 8 月 2 日起已在全球受支持的 Claude 模型生成文本中启用，旨在遵守欧盟《人工智能法》。", "type": "model", "relTime": "1周前"}, {"id": 164, "title": "Claude 的\"红字\"水印：目前不可见，但即将覆盖所有处理内容", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/tech-policy/2026/08/claudes-new-scarlet-letter-watermark-is-invisible-for-now", "date": "2026-08-13T11:10:18.000Z", "summary": "Anthropic 宣布将为其所有模型处理的内容（不仅是生成内容）添加机器可读水印，以符合欧盟《人工智能法案》要求。所有新模型在全球范围内将从发布首日起嵌入不可见水印，生成文件还将附带数字签名来源元数据。Anthropic 采用\"从轨道上核平\"策略，即使欧盟对标准编辑等辅助功能不作要求，也会对处理内容打标，实际效果需待检测工具发布后才能验证。", "type": "industry", "relTime": "1周前"}, {"id": 165, "title": "Dyna Robotics 发布 Dyna-2：基于100万小时人类视频预训练的世界-动作模型", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/13/dyna-robotics-introduces-dyna-2-a-world-action-model-pre-trained-on-1-million-hours-of-human-video", "date": "2026-08-13T07:42:02.000Z", "summary": "Dyna Robotics 发布 Dyna-2，一个在超100万小时第一人称人类视频上预训练的世界-动作模型（WAM），用于机器人操作。研究团队验证了从1，000到1，000，000小时数据的缩放定律，并首次将该定律零样本迁移至未见过的机器人数据；视频联合去噪在39/39任务上优于仅动作训练，将零样本机器人MSE从0.340降至0.120。", "type": "model", "relTime": "1周前"}, {"id": 166, "title": "机器人 AI 模型 DYNA-2 登场：超 100 万小时人类视频训练，任务成功率可达 90%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/200.htm", "date": "2026-08-13T06:15:50.000Z", "summary": "具身智能公司 Dyna Robotics 发布机器人基础模型 DYNA-2，基于超 100 万小时第一人称人类视频预训练，任务成功率最高达 90%。该模型通过预测下一帧画面及应采取动作，补足传统视觉语言模型缺失的空间推理与接触物理能力。", "type": "model", "relTime": "1周前"}, {"id": 167, "title": "Seedance 2.5 免费生成与低价策略解析", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2087784883103957007", "date": "2026-08-13T06:14:39.000Z", "summary": "对于视频或图像生成，迭代循环才是真正的工作流程，这使得队列延迟和生成成本对实际效果至关重要。  第一次渲染测试提示词。  第二次修正构图。  第三次加强运动一致性。  第四次通常更接近目标。  🇺🇸 在 Dreamina 上可免费进行 4 次 Seedance 2.5 生成，无需排队，全速运行，持续 3 天。  其全球最低定价为 $0.097/秒。", "type": "paper", "relTime": "1周前"}, {"id": 168, "title": "第二届世界人形机器人运动会8月22日开幕：16国2056台机器人参赛，队伍总量同比增长138%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/152.htm", "date": "2026-08-13T04:10:46.000Z", "summary": "第二届世界人形机器人运动会将于8月22日在国家速滑馆\"冰丝带\"开幕，吸引六大洲16国666支队伍、2056台机器人参赛，队伍总量同比增长138%，机器人数量翻了两番。赛事设51个项目共1301场比赛，赛期从首届3天增至5天，并取消外围赛，将武术、舞蹈等对抗性项目纳入竞技赛。竞赛标准全面升级，100米完赛时间从3分钟压缩至1分钟，除障碍赛外所有径赛均须机器人全自主完成。", "type": "industry", "relTime": "1周前"}, {"id": 169, "title": "消息称 Anthropic 正洽谈以 60 亿美元收购 AI 初创公司 Decart AI", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/989/094.htm", "date": "2026-08-13T02:12:43.000Z", "summary": "据彭博社报道，知情人士透露，Anthropic PBC 正洽谈收购 AI 初创公司 Decart AI，交易金额约 60 亿美元（现汇率约合 405.41 亿元人民币）。目前双方尚未最终敲定交易，谈判仍有破裂可能。Decart 致力于帮助 AI 开发者充分发挥不同芯片性能，并专注生成式视频领域，使用\"世界模型\"对实时视频画面进行即时修改。", "type": "industry", "relTime": "1周前"}, {"id": 170, "title": "GoodCase.ai 开源：卡尔公开三年实测 AI 提示词案例库", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247509398&idx=1&sn=6b098a3348cf5fd7e59b368c6b44ba41", "date": "2026-08-13T01:52:00.000Z", "summary": "博主卡尔开源了维护三年的 AI 提示语案例网站 GoodCase.ai，收录上千条带完整提示语、模型版本和生成效果的 AI 视频、AI 前端及 Agent 案例。他用同一批提示语在 Seedance 2.0 Fast、MiniMax H3、Wan 3.0 三个模型上交叉验证，并烧掉十万积分完成首轮横测，将跨模型可复用的案例抽象成 Skill，供用户直接调用。", "type": "model", "relTime": "1周前"}, {"id": 171, "title": "MiniMax H3 携手 Magnific 展示 AI 视频新方向", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2087705681097109703", "date": "2026-08-13T00:59:56.000Z", "summary": "明天太平洋时间下午 5：30：MiniMax H3 × @magnific 将在 Magnific 旧金山办公室举办活动。  我们将展示人们已用 H3 制作的作品，探讨 AI 视频的发展方向，并在 Magnific 中亲手体验 H3。  现场将有涵盖电影级生成、原生音频、对话、剪辑等内容的实时工作流演示。  随后我们将开放交流环节，并带来更多社区作品展示。  名额仅剩几个。链接见下方。  #...", "type": "industry", "relTime": "1周前"}];

    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();
</script>

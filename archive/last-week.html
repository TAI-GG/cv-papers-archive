esinger/status/2095538233329451063", "date": "2026-09-03T15:43:42.000Z", "summary": "YouMind 宣布今晚 23：30 至次日 9：30 期间，在对话框保持 Auto 模型即可畅用，所有对话积分消耗为 0。该活动已自动开启，不含图片、视频等多模态内容。", "type": "model", "relTime": "1周前"}, {"id": 211, "title": "谷歌 DeepMind 发布 WeatherNext 3：分辨率最高 5 公里的 AI 天气预报模型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/198.htm", "date": "2026-09-03T15:15:52.000Z", "summary": "谷歌 DeepMind 和 Google Research 发布 WeatherNext 3，称其为最先进、最准确的全球气象模型。模型基于原始卫星数据和稀疏气象站观测训练，可每小时生成一次预报，地表关键变量分辨率达 5 公里，并新增针对可再生能源的 100 米高度风速、云量和太阳辐射预测。即日起为谷歌搜索、Gemini 应用、谷歌地图、地图平台气象 API 和 Earth Engine 提供支持。", "type": "paper", "relTime": "1周前"}, {"id": 212, "title": "OpenAI 疑似准备发布图像模型升级 ImageGen 2.5", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2095528074615906614", "date": "2026-09-03T15:03:20.000Z", "summary": "TestingCatalog 发现 OpenAI 正在准备图像模型的下一次升级，ChatGPT 内置的隐藏公告弹窗写着图像创作迎来重大升级，文案为更高质量结果、更快生成和更智能的创意工具。", "type": "model", "relTime": "1周前"}, {"id": 213, "title": "Google 发布 AI 天气模型 WeatherNext 3，引入实时卫星观测", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/988921/weather-forecast-ai-model-google-satellite-update", "date": "2026-09-03T15:00:00.000Z", "summary": "Google 推出更新的 AI 天气模型 WeatherNext 3，可基于实时卫星观测每小时生成一次预报，全球分辨率较上一代提升五倍。相较 WeatherNext 2 的 6 小时一次、25 公里网格，新模型对温度和湿度等变量最高达 5 公里分辨率，提前一天以上的降水预报准确率最高提升 50%，在雨量计较少的美国和欧洲以外地区改进最大。", "type": "model", "relTime": "1周前"}, {"id": 214, "title": "NeoMME 发布 260M 与 800M 多语言多模态编码器，权重以 Apache 2.0 开源", "source": "Hugging Face：Blog（RSS）", "sourceUrl": "https://huggingface.co/blog/Hcompany/neomme", "date": "2026-09-03T13:13:48.000Z", "summary": "H Company 团队发布 NeoMME，含 260M 和 800M 两个尺寸的多语言多模态编码器，用单个双向 Transformer 从零处理文本 token 和 32×32 图像 patch，不使用预训练视觉塔或因果语言模型，训练采用掩码离散扩散目标，每个模型处理约 5240 亿 packed token。", "type": "model", "relTime": "1周前"}, {"id": 215, "title": "机器人技术为何如此困难：一项系统性挑战清单", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://secondthoughts.ai/p/14-reasons-robotics-is-hard", "date": "2026-09-03T10:41:16.699Z", "summary": "作者指出当前 AI 进展几乎全在知识工作领域，物理侧的通用机器人仍停留在测试设施和演示视频，且 demo 视频难以评估真实水平，可能只展示百次尝试中的一次成功。文章列出从手部灵巧性、视觉理解、规划反应、速度、力量、安全、续航散热、泛化边界情况到算力、规模化供应链和社会监管等十余项待克服的挑战，认为物理世界的 demo 与现实差距会比 LLM 基准与实际工作的差距更大。", "type": "tip", "relTime": "1周前"}, {"id": 216, "title": "小红书与 vivo 联合打通 3D 图片全链路技术实践", "source": "公众号：小红书技术（dots.llm）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg4OTc2MzczNg%3D%3D&mid=2247496302&idx=1&sn=cff53d02e6effd993cb6dd43ec976cce", "date": "2026-09-03T10:17:12.000Z", "summary": "小红书与 vivo 联合打通从 vivo 相册生成 3D 图到小红书发布、分发与消费的完整 3D 内容链路，并共同设计面向移动社交场景的新型 3D 格式。", "type": "tip", "relTime": "1周前"}, {"id": 217, "title": "玉伯分享两例用户反馈：YouMind 靠一站式创作与一致性生成吸引用户迁移", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2095455177390395641", "date": "2026-09-03T10:13:40.000Z", "summary": "YouMind 负责人玉伯称收到两例用户反馈，印证产品差异化：一是 All-in-One 创作工作室带来便捷，用户认为单工具比多工具方便；二是生图、生 PPT、生视频功能持续解决人物、风格等一致性问题，让 Lovart、LibTV 用户愿意迁移到 YouMind。附图为一封用户来信，称赞无需切换标签页即可完成研究、写作和生成视觉素材。作者表示打磨过程辛苦，但看到用户反馈和付款感到开心。", "type": "tip", "relTime": "1周前"}, {"id": 218, "title": "摩尔线程宣布打通具身智能完整链路", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/998/037.htm", "date": "2026-09-03T09:09:30.000Z", "summary": "摩尔线程在 2026 年半年度业绩说明会上表示，已打通具身智能从合成数据生成、大模型训练、仿真验证到端侧硬件部署的完整链路。", "type": "industry", "relTime": "1周前"}, {"id": 219, "title": "World Labs 发布从零训练的多模态世界模型 Atlas，李飞飞称其为相机条件世界模型新标杆", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095430712073847088", "date": "2026-09-03T08:36:27.000Z", "summary": "World Labs 宣布发布 Atlas，一个从零训练的多模态世界模型，李飞飞称其为同类中首个，并称之为有史以来最好的相机条件世界模型。Atlas 支持像素级精确的相机控制生成画面、从单张输入图像重建大场景、通过重切视频模拟时空、从一张或多张图像原生输出 3D 空间，以及将多张带位姿图像合成为一致的 3D 世界，应用场景覆盖 VFX 到机器人。", "type": "model", "relTime": "1周前"}, {"id": 220, "title": "阿易评李飞飞团队 Atlas：几段手机视频生成可交互三维世界，降低机器人训练数据成本", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2095429574293361122", "date": "2026-09-03T08:31:56.000Z", "summary": "阿易转发并解读李飞飞团队的 Atlas，称它能把几段普通手机视频生成带物理引擎的三维交互世界，可自由调整运镜、光照材质，物体碰撞按真实物理法则展开。作者认为这等于为具身智能机器人提供了低成本、可无限扩充的虚拟训练场，把机器人换环境需重新实拍采集的数据成本大幅降低，并提出了家庭保洁和工厂流水线哪个先落地的问题。", "type": "tip", "relTime": "1周前"}, {"id": 221, "title": "蚂蚁 inclusionAI 开源 LLaDA-Image 图像生成与编辑模型家族", "source": "蚂蚁 inclusionAI：HuggingFace 新模型", "sourceUrl": "https://huggingface.co/inclusionAI/LLaDA-Image-Turbo-FP8", "date": "2026-09-03T08:07:02.000Z", "summary": "蚂蚁 inclusionAI 发布开源统一图像生成与编辑模型 LLaDA-Image 家族，包括 6B 参数、50 步采样的 Base 版和 2-4 步的 Turbo 蒸馏版，同时提供 BF16 与 FP8 checkpoint 及 Diffusers 推理代码。", "type": "model", "relTime": "1周前"}, {"id": 222, "title": "蚂蚁 inclusionAI 开源 6B 统一图像生成与编辑模型 LLaDA-Image", "source": "蚂蚁 inclusionAI：HuggingFace 新模型", "sourceUrl": "https://huggingface.co/inclusionAI/LLaDA-Image-FP8", "date": "2026-09-03T08:06:39.000Z", "summary": "蚂蚁 inclusionAI 发布开源统一图像生成与编辑模型 LLaDA-Image，提供 50 步 Base 和 4 步蒸馏 Turbo 两类 checkpoint，均有 BF16 与 FP8 版本。", "type": "model", "relTime": "1周前"}, {"id": 223, "title": "Muse Spark 1.3 xhigh 演示太空站穿行视频", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2095388793151074625", "date": "2026-09-03T05:49:53.000Z", "summary": "Alexandr Wang 转发 @loktar00 用 Muse Spark 1.3 xhigh 生成的太空站穿行视频，并评价 this is pretty cool。", "type": "paper", "relTime": "1周前"}, {"id": 224, "title": "开源视频生成方法 Video Delta Net （VDN） 发布：混合注意力实现近无损实时文生视频", "source": "X：马东锡 NLP (@dongxi_nlp)", "sourceUrl": "https://x.com/dongxi_nlp/status/2095382936769991110", "date": "2026-09-03T05:26:37.000Z", "summary": "Video Delta Net （VDN） 发布，采用混合注意力实现近无损质量的实时文本生成视频，称开源视频生成速度已超过播放速度。VDN 将 Minimax-H3 加速 75-90 倍，在 8× NVIDIA B200 GPU 上 11 秒生成 14 秒 768p 视频，并开源 checkpoint、训练/推理代码和技术博客。", "type": "model", "relTime": "1周前"}, {"id": 225, "title": "纽约市暂停八年级及以下学生使用生成式 AI", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2095370185540772094", "date": "2026-09-03T04:35:56.000Z", "summary": "据 WSJ，纽约市暂停八年级及以下年级面向学生的生成式 AI，禁令影响近 60 万学生，并禁止所有年级使用陪伴型聊天机器人。高中采取受控路径：最多 5 万名学生可参加 5 个教师监督的 AI 试点，所有高中生每年接受两次 AI 素养教育。", "type": "industry", "relTime": "1周前"}, {"id": 226, "title": "Ethan Mollick 用一段提示词让 Fable 5.1 生成《伊利亚特》船目 3D 交互地图", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2095352019498447090", "date": "2026-09-03T03:23:45.000Z", "summary": "Ethan Mollick 公开一段用于 Fable 5.1 的提示词，要求生成《伊利亚特》船目（Catalog of Ships）的可探索 3D 船只地图，结合真实图像与考古数据，并用智能体测试和修订，成品见 https://homer-catalogue-of-ships.netlify.app/。", "type": "tip", "relTime": "1周前"}, {"id": 227, "title": "Wan 3.0 登顶 Artificial Analysis 视频编辑榜单，文生视频带音频位列第二", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2095349174799888760", "date": "2026-09-03T03:12:27.000Z", "summary": "Artificial Analysis 评测显示，阿里巴巴 Wan 3.0 在视频编辑带音频榜单首次登顶第一，文生视频带音频位列第二，图生视频带音频排名第五。该模型为一体化视频生成与编辑模型，支持最长 30 秒 1080p 原生音频输出，可接受文本、图片、视频、音频、文档和网页作为创作参考，并支持指令式编辑画面、剧情、对话和声音。", "type": "tip", "relTime": "1周前"}, {"id": 228, "title": "阿里云架构师谈 Qwen3.8-Max 为团队带来的变化", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2095343822184325468", "date": "2026-09-03T02:51:11.000Z", "summary": "阿里云解决方案架构师 Joey Huang 在视频中介绍 Qwen3.8-Max 为其团队带来的变化：团队不再人工分派工单，早晨醒来可看到自动生成的摘要，说明哪些已上线、哪些在评审、哪些需要本人处理。他表示因此能把时间重新投入产品、客户和架构，并附上了 Qwen Cloud 与 Model Studio 的试用及 API 入口链接。", "type": "tip", "relTime": "1周前"}, {"id": 229, "title": "美团智播解析数字人直播技术：形象生成、动作驱动与万路并发方案", "source": "公众号：龙猫LongCat（美团）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MjM5NjQ5MTI5OA%3D%3D&mid=2651783277&idx=1&sn=69b406db34fc05f4a17b0310dcf3a7f5", "date": "2026-09-03T02:24:00.000Z", "summary": "美团智播官方发布技术长文，介绍AI数字人直播的完整技术闭环，涵盖高保真形象生成与编辑（SDIP、SREdit）、文本驱动动作生成（MoTiGA）、语音手势协调生成（StreamingTalk）和视觉token压缩推理加速（Glance2Gaze）。", "type": "tip", "relTime": "1周前"}, {"id": 230, "title": "戚薇回应 AI 授权\"卖脸\"争议：更愿意\"主动出击\"，数字分身将主演 AI 漫剧《末日盛夏》", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/997/747.htm", "date": "2026-09-03T01:00:19.000Z", "summary": "戚薇在《中国新闻周刊》9 月 2 日报道的采访中回应\"卖脸\"争议，称其数字分身授权是有期限、有范围、有审核和追责的，且只开放给合作的影视项目，而非向所有人开放。她的数字分身将主演末世 AI 漫剧《末日盛夏》，主角名为\"韩清夏\"。她表示规范授权是把合法使用与非法使用区分开，并认为真人戚薇和数字形象应成为两条独立又协同的创作线。", "type": "tip", "relTime": "1周前"}];
var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };
var TYPE_LABELS = { "paper":"论文", "model":"模型", "product":"产品", "tip":"技巧", "industry":"行业" };
function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";
  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();

tron 3.5 Super VL，采用 MoE 架构，总参数 1200 亿、激活 120 亿，将推理、工具调用与文本、图像、文档及视频理解整合，官方称单 GPU 智能体任务吞吐量最高达同规模开放模型的 5 倍。", "type": "model", "relTime": "1周前"}, {"id": 31, "title": "YouTube Music 开始为 AI 生成音乐添加标签", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/10/youtube-music-begins-labeling-ai-songs/", "date": "2026-10-15T15:12:58.000Z", "summary": "Google 正在 YouTube Music 应用和网站上线 AI 内容标签，标注完全由 AI 生成或经 AI 大幅修改的歌曲，标签显示在播放页，点击可查看详情。该做法沿用今年早些时候 YouTube 视频的 AI 标注机制，Google 与合作伙伴及自有检测工具共同识别，上传者也可自愿标注为完全 AI、部分 AI 或无 AI。", "type": "paper", "relTime": "1周前"}, {"id": 32, "title": "NVIDIA Nemotron 3.5 Super VL 上线 Baseten", "source": "Baseten 工程博客（网页）", "sourceUrl": "https://www.baseten.co/blog/nvidia-nemotron-35-super-vl-launch/", "date": "2026-10-15T15:10:00.000Z", "summary": "NVIDIA Nemotron 3.5 Super VL 在 Baseten 上线，基于 Nemotron 3 Super 架构的 120B 参数 MoE 模型，每 token 激活 12B 参数，新增视觉编码器以支持文档、截图和视频理解。", "type": "model", "relTime": "1周前"}, {"id": 33, "title": "Black Forest Labs 发布开源文生图模型 FLUX 3 Image Klein（5.6B）", "source": "Black Forest Labs：Blog（网页）", "sourceUrl": "https://bfl.ai/blog/flux-3-image-klein", "date": "2026-10-15T15:00:00.000Z", "summary": "Black Forest Labs 发布 5.6B 参数开源权重模型 FLUX 3 Image Klein，支持文生图、图像编辑和最多 10 张参考图的多参考生成，采用 FLUX Kommunity License。", "type": "model", "relTime": "1周前"}, {"id": 34, "title": "Google 用 Gemini 4 Argon 将 Gemma 4 E2B 推理速度提升至 2.85x", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110746373196780033", "date": "2026-10-15T14:55:25.000Z", "summary": "Google 介绍 Gemini 4 Argon 对开源模型 Gemma 的优化：仅用几天就把 Gemma 4 E2B 在 A100 上经 vLLM 实现约 2.85x 推理加速，从约 37,900 提升到超过 108,000 tokens 每秒，且保持 100% token 一致、零质量下降。视频演示了同时生成 64 个实时 Python 模拟。", "type": "model", "relTime": "1周前"}, {"id": 35, "title": "Luma 推出 Shot Coverage，将单镜头视频扩展为多个可剪辑角度", "source": "X：Luma AI (@LumaLabsAI)", "sourceUrl": "https://x.com/LumaLabsAI/status/2110719442338640147", "date": "2026-10-15T13:08:24.000Z", "summary": "Luma AI 介绍其 Shot Coverage 功能，可将一个视频镜头生成更多可剪辑的移动机位角度。功能面向拍摄后需要补充机位的视频创作场景。", "type": "paper", "relTime": "1周前"}, {"id": 36, "title": "SynthID 入选 TIME 2026 最佳发明", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2110715601454784965", "date": "2026-10-15T12:53:09.000Z", "summary": "SynthID 入选 @TIME 2026 年度最佳发明。  已有超过 1800 亿张图片和视频被加上水印，让人们更容易区分 AI 生成内容与其他媒体 → https://goo.gle/4jsZxWF", "type": "industry", "relTime": "1周前"}, {"id": 37, "title": "消息称阿里 Qwen 将集成到中国区 Apple Intelligence，覆盖 iOS 等多平台", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2110702728758337848", "date": "2026-10-15T12:02:00.000Z", "summary": "据知情人士，阿里 Qwen AI 将被集成到中国用户的 Apple Intelligence 中，覆盖 iOS、iPadOS、macOS 和 visionOS，提供文本与图像理解和内容生成能力，无需切换应用。消息来自知情人士，两家公司均未确认。", "type": "industry", "relTime": "1周前"}, {"id": 38, "title": "面壁智能 MiniCPM-V 4.7 开源上线 ModelScope，35B-A3B MoE 多模态模型可在 iPhone 上以 13+ tokens/s 端侧无损推理", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2110662639345123563", "date": "2026-10-15T09:22:42.000Z", "summary": "面壁智能 MiniCPM-V 4.7 已在 ModelScope 开源，是 35B-A3B 的 MoE 多模态模型，采用 Apache 2.0 协议。官方称其可在 iPhone 17 Pro Max 上以 13+ tokens/s 流畅运行端侧无损推理，Instruct 模式下整体得分高于 Qwen3.6 35B-A3B 且推理时间更短；支持 4x/16x 视觉 token 压缩，提供 35...", "type": "model", "relTime": "1周前"}, {"id": 39, "title": "Apertus 1.5 发布：8B 和 70B 模型新增多模态理解与思考模式", "source": "Hugging Face 社区博客（混合发现）", "sourceUrl": "https://huggingface.co/blog/swiss-ai/apertus-v15-release-notes", "date": "2026-10-15T09:08:45.000Z", "summary": "Apertus 项目在 Hugging Face 以 Apache 2.0 许可发布 Apertus 1.5 的 8B 和 70B 权重（2026 年 7 月 24 日），在 1.0 基础上继续预训练，新增图像和音频理解、可选思考模式，上下文窗口扩至 262,144 token，并改进指令遵循和工具使用。", "type": "model", "relTime": "1周前"}, {"id": 40, "title": "Mercury 2 入选 TIME 2026 年度最佳发明", "source": "Inception Labs：Blog（网页）", "sourceUrl": "https://www.inceptionlabs.ai/blog/mercury-2-named-to-time-s-best-inventions-of-2026", "date": "2026-10-15T07:00:00.000Z", "summary": "Inception Labs 的 Mercury 2 入选 TIME 2026 年度最佳发明 AI 类别，被称为首个为推理而构建的扩散 LLM。它并行生成并多轮精炼 token，速度超过 1,000 tokens/秒，比领先的速度优化 LLM 快 5 倍以上。", "type": "industry", "relTime": "1周前"}, {"id": 41, "title": "卡兹克实测开源Skill Anatomy，一句话让AI生成原理科普视频", "source": "X：卡兹克 (@Khazix0918)", "sourceUrl": "https://x.com/Khazix0918/status/2110587546271191166", "date": "2026-10-15T04:24:18.000Z", "summary": "作者卡兹克分享实测开源Skill Anatomy（GitHub：https://github.com/wheresryan22/anatomy/tree/main），它能把抽象原理做成可交互的机械模型动画，在其基础上还能让AI一轮直出带讲解配音的科普视频。", "type": "tip", "relTime": "1周前"}, {"id": 42, "title": "商汤Raccoon Work助视障者打造无障碍学习工具", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2110581431931945460", "date": "2026-10-15T04:00:00.000Z", "summary": "商汤AI办公助手Raccoon Work帮助视障倡导者曹文伟处理含文字、图片和表格的长文档，使其更易被屏幕阅读器读取。曹文伟借助Raccoon Work构建了\"Light Bridge AI\"工作流，可为视障及多重残障学生生成定制学习材料、学习计划和教学计划，并利用图像理解能力独立审阅PPT幻灯片。该工作流在商汤Raccoon Work OPC挑战赛决赛中获得银奖。", "type": "industry", "relTime": "1周前"}, {"id": 43, "title": "上海人工智能实验室团队用书生 S2 大模型完成三维 Ghys 猜想证明", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/013/269.htm", "date": "2026-10-15T03:23:31.590Z", "summary": "上海人工智能实验室发文宣布，许地生团队依托书生科学多模态大模型 S2，通过人机协同完成困扰数学界 30 余年的三维 Ghys 猜想证明。北京大学董彬、刘若川院士团队用 SHEAF 框架完成形式化验证，论文已发布于 arXiv，形式化代码开源在 GitHub。上海人工智能实验室表示该范式可推广至其他搜索空间大而专家稀缺的基础研究领域。", "type": "paper", "relTime": "1周前"}, {"id": 44, "title": "Grok Imagine 图像生成能力展示", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2110543151349870751", "date": "2026-10-15T01:27:53.000Z", "summary": "想象一下", "type": "paper", "relTime": "1周前"}, {"id": 45, "title": "Jev 模型新增图像多模态能力", "source": "X：TypeSafe AI (@typesafeai)", "sourceUrl": "https://x.com/typesafeai/status/2110536687835328981", "date": "2026-10-15T01:02:12.000Z", "summary": "可组合图像：Jev 有眼睛了！！！眼睛眼睛宝贝。  我们不仅为未来的 Jev 模型启用多模态，也在为你们熟知且喜爱的当前 Jev 启用多模态。  图像可以出现在之前文本能出现的任何地方，以你能想到的任何组合方式。尽情发挥吧。  详情见文档：http://docs.typesafe.ai/go/images", "type": "model", "relTime": "1周前"}, {"id": 46, "title": "自媒体作者实测开源 Skill Anatomy：一句话让 AI 生成原理科普动画和讲解视频", "source": "公众号：数字生命卡兹克", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647687109&idx=1&sn=032fd9f6aab5ee20ea5d14f97bf48a86", "date": "2026-10-15T00:26:00.000Z", "summary": "作者数字生命卡兹克分享开源 Skill Anatomy，其理念是\"物体本身，就是解释\"，可将抽象原理做成可交互的机械模型动画，还能在其上生成带讲解配音的科普视频。", "type": "tip", "relTime": "1周前"}, {"id": 47, "title": "Gemini 4 Argon 纯 Python 打造 3D 场景", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110525636884259180", "date": "2026-10-15T00:18:18.000Z", "summary": "我们让 Gemini 4 Argon 用纯 Python、零外部库制作一个逼真的 3D 场景。  它写了 5,000+ 行代码，从零构建了自己的 3D 光线追踪引擎、定制视频工具和音频混音器，来渲染并记录这个阳光洒落的图书馆——并用 Gemini 3.8 TTS 生成旁白、由 Lyria 3.5 配乐，制作并组装了这段视频。", "type": "paper", "relTime": "1周前"}, {"id": 48, "title": "Meta 发布开源权重多模态 MoE 模型 Muse Spark Open，总参数约 816B", "source": "Hugging Face 官方团队博客", "sourceUrl": "https://huggingface.co/blog/meta-muse-spark-open", "date": "2026-10-15T00:00:00.753Z", "summary": "Hugging Face 团队介绍 Meta 的开源权重模型 Muse Spark Open：这是一个 MoE 架构的多模态模型，总参数约 816B、每 token 激活约 42B，支持文本、图像、音频和视频输入，上下文窗口最高 1M token，提供 BF16（约 1.5 TB）和面向 NVIDIA Blackwell 的 NVFP4 两种 checkpoint。", "type": "model", "relTime": "1周前"}, {"id": 49, "title": "Liquid AI 发布多模态决策模型 d1-ultra", "source": "Liquid AI 模型与工程博客（网页）", "sourceUrl": "https://www.liquid.ai/blog/d1-ultra", "date": "2026-10-15T00:00:00.000Z", "summary": "Liquid AI 发布多模态决策模型 d1-ultra，输入文本或图像与问题，单次前向直接返回各答案概率，不生成 token。", "type": "model", "relTime": "1周前"}, {"id": 50, "title": "Apple 提出 SSR：用选择式结构化推理打造高效多模态搜索智能体", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/selection-structured-reasoning", "date": "2026-10-15T00:00:00.000Z", "summary": "Apple 研究团队提出 Selection-based Structured Reasoning（SSR），将推理从开放式生成改为从预设可复用自然语言候选中选择，无需辅助任务头。在 2B 和 4B 模型、七个多模态搜索基准上，SSR 平均成功率与同规模领先搜索智能体相当，每轮推理延迟降低超 90%，单题模型总推理延迟降低 28–54%。", "type": "paper", "relTime": "1周前"}, {"id": 51, "title": "NVIDIA Nemotron 3.5 Super VL 发布，vLLM 提供首发支持", "source": "vLLM 官方博客（RSS）", "sourceUrl": "https://vllm.ai/blog/2026-10-15-nemotron-3-5-super-vl-vllm", "date": "2026-10-15T00:00:00.000Z", "summary": "NVIDIA 发布开源多模态模型 Nemotron 3.5 Super VL，vLLM 提供 Day 0 支持。模型基于 120B 总参数、12B 激活的 MoE 架构，结合推理、工具调用与文档、图像、视频理解，采用混合 Mamba-Transformer 架构、多 token 预测和 NVFP4 量化。", "type": "model", "relTime": "1周前"}, {"id": 52, "title": "SGLang 为 NVIDIA Nemotron 3.5 Super VL 提供 Day-0 支持", "source": "LMSYS Blog", "sourceUrl": "https://www.lmsys.org/blog/2026-10-15-nvidia-nemotron-3-5-super-vl", "date": "2026-10-15T00:00:00.000Z", "summary": "SGLang 宣布为 NVIDIA Nemotron 3.5 Super VL 提供 Day-0 部署支持。", "type": "paper", "relTime": "1周前"}, {"id": 53, "title": "OpenHands 与 NVIDIA 合作，将 Nemotron 3.5 Super VL 多模态模型引入软件工程智能体", "source": "OpenHands 官方博客", "sourceUrl": "https://www.openhands.dev/blog/nvidia-nemotron-3.5-super-vl", "date": "2026-10-15T00:00:00.000Z", "summary": "作为 NVIDIA 发布合作伙伴，OpenHands 将开源多模态模型 Nemotron 3.5 Super VL 引入常驻软件工程智能体工作流。该模型基于 120B 参数 MoE 架构、12B 激活参数，支持文本、图像、文档和视频输入并输出文本，将多模态理解与智能体推理和工具调用结合。", "type": "model", "relTime": "1周前"}, {"id": 54, "title": "Apple 演示用 MLX 与 RDMA 在 Mac Studio 集群本地运行 816B 大模型", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/mlx-distributed-inference", "date": "2026-10-15T00:00:00.000Z", "summary": "Apple 机器学习研究团队演示如何在 Mac Studio 上本地运行近万亿参数的 Muse Spark Open 等前沿模型，使用今天发布的新版 MLX（v0.30.1 起）与 macOS 26.2 的 RDMA over Thunderbolt 驱动。", "type": "tip", "relTime": "1周前"}, {"id": 55, "title": "Meta Muse Spark Open 上线 Together AI", "source": "Together AI 研究与产品博客（RSS）", "sourceUrl": "https://www.together.ai/blog/meta-muse-spark-open", "date": "2026-10-15T00:00:00.000Z", "summary": "Meta 的 Muse Spark Open 开源权重模型即日起在 Together AI 提供，Together AI 为 Day 0 发布合作方。该模型主打长时程智能体编码，具备 1M token 上下文窗口、计算机使用与多模态输入（文本、图像、音频、视频），并在行动前输出意图说明。", "type": "model", "relTime": "1周前"}, {"id": 56, "title": "White Circle 开源 RISE 图像模型红队测试算法", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2110486648685494322", "date": "2026-10-14T21:43:22.000Z", "summary": "White Circle 开源了 RISE，一个自动化红队测试算法，用于检测 AI 图像生成器能否被诱导生成其规则禁止的图片。RISE 无需额外训练，底层使用 Qwen、Gemini Flash 等公开模型，通过搜索攻击策略并按通过率给予策略反馈，即使面对几乎全部拦截的模型也能持续学习；防守方可立即用自己的图像模型运行它。", "type": "paper", "relTime": "1周前"}, {"id": 57, "title": "OpenRouter 多模态概率输出用法", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2110475843529273460", "date": "2026-10-14T21:00:26.000Z", "summary": "工作原理：像在 Chat Completions 里那样把各部分放进 state（image_url、input_audio、video_url），问一个选择题，就能拿回概率。上面整个请求是 801 个输入 token，$0.00012。  阅读更多：https://openrouter.ai/cloudflare/clef-omni", "type": "tip", "relTime": "1周前"}, {"id": 58, "title": "OpenRouter 上线 Clef Omni 多模态决策", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2110475831227375973", "date": "2026-10-14T21:00:23.000Z", "summary": "我们给 Clef Omni 喂了一张照片、3 秒的滋滋声、一段 2 秒的热狗摊视频，还有\"午饭？\"这个词。  它说：热狗，96.5%。  Decisions 的音频 + 视频输入已在 OpenRouter 上线。四种模态，一次调用，输出概率而非 token。输入 $0.15/M，输出免费。", "type": "paper", "relTime": "1周前"}, {"id": 59, "title": "Google 用 Argon 与 Lyria 3.5 生成傅里叶自行车动画", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110440182390432091", "date": "2026-10-14T18:38:44.000Z", "summary": "Google 展示用 Argon 处理物理、运动与视频渲染，并由 Lyria 3.5 生成并同步背景音乐，制作出傅里叶本轮（Fourier epicycles）风格的鹈鹕骑自行车动画。提示词要求慢速揭示的傅里叶本轮视频、3D 子弹时间效果，并参照附图风格、用 Lyria 3.5 添加电影感配乐并同步。该演示由 @fofrAI 通过 @Antigravity CLI 完成。", "type": "paper", "relTime": "1周前"}, {"id": 60, "title": "Google 用 Argon 一句话生成 Three.js 3D 游戏", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110440184584253442", "date": "2026-10-14T18:38:44.000Z", "summary": "用 Argon 在 Three.js 中构建可玩、风格化的 3D 渲染游戏（还带跳跃惊吓），全部一次生成。  👻 来自 @ammaar", "type": "paper", "relTime": "1周前"}, {"id": 61, "title": "Pangram CEO 谈 AI 检测技术", "source": "X：Arena (@arena)", "sourceUrl": "https://x.com/arena/status/2110439220959678906", "date": "2026-10-14T18:34:54.000Z", "summary": "Pangram 的 CEO Max Spero——也是 TIME 评选的 AI 领域百大影响力人物之一——刚刚做客 @petergostev 的节目，聊 AI 检测。  @max_spero_ 解释了 Pangram 的训练过程：合成镜像、模型家族指纹、AI 辅助写作、图像检测，以及针对 AI 去痕工具的鲁棒性。他们还谈到团队如何选择基础模型、寻找困难的训练样本，以及构建数据和基础设施来跟上...", "type": "model", "relTime": "1周前"}, {"id": 62, "title": "Gemini 4 Argon 教机器人玩沙包投掷", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110428343950836212", "date": "2026-10-14T17:51:41.000Z", "summary": "我们用 Gemini 4 Argon 教一个机器人玩沙包投掷 🦾  仅通过观看人类玩沙包投掷的视频，Argon 就推演出了物理规律，编写了自己的模拟程序进行练习，并教会了 @Apptronik 的 Apollo 人形机器人连续命中 7 球。", "type": "product", "relTime": "1周前"}, {"id": 63, "title": "SpaceXAI TypeScript SDK 示例集更新", "source": "X：Eric Zakariasson (@ericzakariasson)", "sourceUrl": "https://x.com/ericzakariasson/status/2110396209118736858", "date": "2026-10-14T15:44:00.000Z", "summary": "cookbook 已更新，包含 25 个示例，全部基于 @spacexai 的 TypeScript SDK 构建：  - 一句话前提生成短片 - 一张照片生成延时摄影 - 会说话的照片 - 产品图生成视频广告 - 视频配音 - 实时语音翻译  以及更多！", "type": "tip", "relTime": "1周前"}, {"id": 64, "title": "蚂蚁百灵开源 Ling-3.1-flash，约 560B 总参数、每 token 约 25B 激活、支持 1M 上下文", "source": "X：蚂蚁百灵 (@AntLingAGI)", "sourceUrl": "https://x.com/AntLingAGI/status/2110390124743970952", "date": "2026-10-14T15:19:49.000Z", "summary": "蚂蚁百灵（AntLingAGI）宣布 Ling-3.1-flash 开源，总参数约 560B，每 token 激活约 25B，上下文最长 1M。官方称其面向实际工作，可将粗略需求稿生成页面、移动 UI 或可供团队评审和迭代的交互原型，并附演示视频。", "type": "model", "relTime": "1周前"}, {"id": 65, "title": "Mirelo SFX V2.0 上线 fal 平台", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2110355391733240256", "date": "2026-10-14T13:01:48.000Z", "summary": "fal 宣布 Mirelo SFX V2.0 正式上线。该模型可从文本提示或视频输入生成音效，替换不想要的背景音乐和声音时保留对白，并能跨视频剪辑点保持效果和氛围的连贯性。", "type": "model", "relTime": "1周前"}, {"id": 66, "title": "Runway 视频模型 Gen-4.5 与 Aleph 2.0 上线 Baseten 专属部署", "source": "Baseten 工程博客（网页）", "sourceUrl": "https://www.baseten.co/blog/deploy-runway-video-models-dedicated-inference/", "date": "2026-10-14T12:01:44.000Z", "summary": "Runway 的前沿视频生成与编辑模型 Gen-4.5 和 Aleph 2.0 现已可通过 Baseten 进行专属部署。用户可从 Runway 直接授权模型权重，在 Baseten 的单租户隔离环境中运行，并获得专属 GPU 资源与自动扩缩容，Baseten 为该部署提供 99.99% 可用性 SLA。", "type": "model", "relTime": "1周前"}, {"id": 67, "title": "Runway 视频模型 Gen-4.5 与 Aleph 2.0 上线 Baseten 专属部署", "source": "Baseten 工程博客（网页）", "sourceUrl": "https://www.baseten.co/blog/deploy-runways-video-models-in-dedicated-environments-on-baseten/", "date": "2026-10-14T12:01:44.000Z", "summary": "Runway 的前沿视频生成与编辑模型 Gen-4.5 和 Aleph 2.0 现可通过 Baseten 进行专属部署，用户可从 Runway 直接授权模型权重，在单租户隔离环境中运行。Aleph 2.0 支持最长 30 秒、1080p 的多场景视频编辑，并可在自有数据上微调模型。Baseten 为该部署提供 99.99% 可用性 SLA，并覆盖 SOC 2 Type II 与 HIPAA 合规。", "type": "model", "relTime": "1周前"}, {"id": 68, "title": "研究称 OpenAI 与 Google 新图像模型易被 RISE 方法绕过安全过滤生成裸露内容", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/tech-policy/2026/10/openai-google-pushing-new-ai-models-easily-tricked-into-making-nudes-researchers-say/", "date": "2026-10-14T11:00:30.000Z", "summary": "安全公司 White Circle 提出 RISE 攻击方法，用现成工具和 API 调用绕过 DALL·E 3、Google Nano Banana 2 和 GPT-Image-2 的安全过滤，约 13% 的尝试生成 explicit 内容。", "type": "paper", "relTime": "1周前"}, {"id": 69, "title": "DeepSeek 领投 Winverse AI 种子轮，估值约 4 亿美元", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2110320350282076552", "date": "2026-10-14T10:42:34.000Z", "summary": "据 36Kr 报道，DeepSeek 将领投机器人 AI 初创公司 Winverse AI 数千万美元种子轮，投后估值约 4 亿美元，美团旗下龙珠资本等投资方也已承诺参与，但交易尚未最终敲定。Winverse AI 由腾讯混元前视觉语言模型负责人胡瀚创立。DeepSeek 此举显示其正持续押注机器人领域，看好 AI 向物理世界能力扩展的潜力。", "type": "industry", "relTime": "1周前"}, {"id": 70, "title": "Meshy 3D Agent 结束 Beta 正式向所有用户开放", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2110285892749541475", "date": "2026-10-14T08:25:38.000Z", "summary": "Meshy 官宣其 3D Agent 结束 Beta 阶段，正式向所有用户开放。用户可通过一段对话描述构想，批量生成概念图并转为 3D 模型，再用于 3D 打印或导入游戏引擎。官方称其更智能、更快，更能理解用户的创作意图。", "type": "model", "relTime": "1周前"}, {"id": 71, "title": "抖音与X上的AI token消耗", "source": "X：indigo (@indigox)", "sourceUrl": "https://x.com/indigox/status/2110257957720186950", "date": "2026-10-14T06:34:38.000Z", "summary": "我发现，在抖音最大的 token 消耗就是生成 AI 短剧；在 X 上最大的 token 消耗，就是生成各种 AI 科普视频。。。一个为了快乐，一个为了学习，反正都是 AI Slop 😜", "type": "paper", "relTime": "1周前"}, {"id": 72, "title": "Meshy 芝加哥线下活动：AI 辅助 3D 设计实战", "source": "X：Meshy (@MeshyAI)", "sourceUrl": "https://x.com/MeshyAI/status/2110249247262089441", "date": "2026-10-14T06:00:01.000Z", "summary": "Meshy 与 MassPersona 将于 11 月 4 日在芝加哥举办线下活动，探讨 AI 如何融入日常设计工作。现场将演示两个项目：用 Meshy 的 Mesh Editor 修改定制奖杯顶部并保持木质底座一致，以及通过 Meshy API 批量生成 20 个不同角色手办而无需逐个手工建模。前 15 位报名并到场者可获得自己专属的 3D 打印 Minikin 手办。", "type": "industry", "relTime": "1周前"}, {"id": 73, "title": "Grok Imagine 生成视频作品", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2110243595504820641", "date": "2026-10-14T05:37:34.000Z", "summary": "用 @Grok @Imagine 制作", "type": "paper", "relTime": "1周前"}, {"id": 74, "title": "苹果 iPhone Duo 国行备案新增大模型编号：Apple 智能、通义万相、通义千问", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/012/814.htm", "date": "2026-10-14T05:33:40.447Z", "summary": "苹果 iPhone Duo 折叠屏国行版（型号 A3721）9 月 29 日换证，新增三个大模型备案编号：Apple 智能、通义万相、通义千问。阿里称千问将作为 AI 能力集成至 Apple 智能，为 iOS、iPadOS、macOS 和 visionOS 中国用户提供文本与图像理解、内容生成等能力。该机国行 10 月 16 日晚 8 点开启预购，10 月 23 日发售，15999 元起。", "type": "industry", "relTime": "1周前"}, {"id": 75, "title": "面壁智能转发 MiniCPM-V 4.7 1B 手机端实测教程", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2110209769659318708", "date": "2026-10-14T03:23:09.000Z", "summary": "OpenBMB 转发 @fahdmirza 对 MiniCPM-V 4.7 1B 的动手实测视频。该 10 亿参数视觉模型可在手机上运行，实测者用 llama.cpp 和 Ollama 安装 GGUF，完成了照片读模拟时钟、时钟图生成可用 HTML、解二次方程、数十种语言手写翻译及肢体语言场景识别等任务，视频同时呈现了成功与失败结果。", "type": "model", "relTime": "1周前"}, {"id": 76, "title": "Apple 发布三模态掩码扩散模型设计空间研究", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/tri-modal-masked-diffusion", "date": "2026-10-14T00:00:00.000Z", "summary": "Apple 团队发布首个从零预训练的三模态掩码扩散模型（MDM）研究，在文本、图文和音频文本数据上训练。论文系统分析了多模态缩放规律、模态混合比例、噪声调度和 batch size 影响，提出基于 SDE 的重参数化方法免去调优最优 batch size，并在 3B 模型规模（6.4T tokens）上验证了文本生成、T2I 和 T2S 任务的表现。", "type": "paper", "relTime": "1周前"}, {"id": 77, "title": "Apple 研究：用语音基础模型的语种选择性维度直接检测语码转换", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/code-switching-detection", "date": "2026-10-14T00:00:00.000Z", "summary": "Apple 研究团队提出一种轻量方法，直接从语音中检测语码转换（CS），无需依赖多语种转录。该方法利用预训练语音编码器的帧级语种信息，通过单语录音找出语种选择性隐藏状态维度，再聚合其帧级激活值生成 CS 预测。在 CS-FLEURS 的 14 个语种对上，Whisper-small 编码器取得 0.798 的平均 F1，高于 CNN 的 0.776 和 HuBERT 线性基线的 0.751。", "type": "paper", "relTime": "1周前"}, {"id": 78, "title": "SAKURA internet、PFN 与 NICT 合作推进生成式 AI 的持续安全评估和改进", "source": "Preferred Networks：AI 研究与产品", "sourceUrl": "https://www.preferred.jp/ja/news/pr20261014", "date": "2026-10-14T00:00:00.000Z", "summary": "SAKURA internet、Preferred Networks（PFN）和日本信息通信研究机构（NICT）合作推进生成式 AI 持续安全评估平台。平台原型会自动生成高风险测试提示词，检测回答中的仇恨言论、诽谤、幻觉和偏差，并合成改进用的训练数据。SAKURA internet 计划于下一财年内启动运行；PFN 将与 NICT 研发 PLaMo 3.0 Prime 的后续模型并接入评估平台。", "type": "industry", "relTime": "1周前"}, {"id": 79, "title": "OpenAI GPT-6 Astra 接入 Higgsfield，AI 视频生成时长从 1 分钟提升到 10 分钟", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/012/639.htm", "date": "2026-10-13T23:44:48.347Z", "summary": "OpenAI 与 AI 视频生成平台 Higgsfield 达成合作，接入 GPT-6 Astra 后，Higgsfield 支持生成的 AI 视频时长上限从 1 分钟提升到 10 分钟。", "type": "industry", "relTime": "1周前"}, {"id": 80, "title": "Meta 发布 Muse Wonder 和 Muse Wonder Full：基准成绩、定价与使用步骤", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/10/13/meta-muse-wonder-muse-wonder-full-release/", "date": "2026-10-13T22:53:44.000Z", "summary": "Meta 发布 Muse Wonder 和 Muse Wonder Full，定位面向长期运行的 agent 任务，支持 1M token 上下文和文本、图像、视频、音频输入。", "type": "paper", "relTime": "1周前"}, {"id": 81, "title": "Google 分享 Three.js 交互毛发物理演示", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110114452955926759", "date": "2026-10-13T21:04:24.000Z", "summary": "💨 交互式物理  @TheBuggedDev 用 Three.js 和 GLSL 完全打造了一个带交互毛发物理的毛茸茸 3D 南瓜 https://x.com/thebuggeddev/status/2110043093466743194/video/1", "type": "paper", "relTime": "1周前"}, {"id": 82, "title": "Google 文本转 3D 生成蝴蝶博物馆", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110114449579552817", "date": "2026-10-13T21:04:23.000Z", "summary": "🦋 文本转 3D  @doe_naps 从零渲染了一座蝴蝶博物馆 https://x.com/doe_naps/status/2110041557021950348/video/1", "type": "paper", "relTime": "1周前"}, {"id": 83, "title": "Google 展示 Argon 3D 建模能力", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110114445628162512", "date": "2026-10-13T21:04:22.000Z", "summary": "🐝 复杂 3D 可视化  @thtbee_ 在 @Antigravity 中利用 Argon 的 3D 建模与空间推理能力，可视化了“蜜蜂的日常生活” https://x.com/thtbee_/status/2110044715618116000/video/1", "type": "paper", "relTime": "1周前"}, {"id": 84, "title": "Google 展示用 Antigravity 造解魔方机器人", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110114447595389193", "date": "2026-10-13T21:04:22.000Z", "summary": "🤖 物理机器人  @ai_for_success 在 @Antigravity 中端到端搭建了一个解魔方机器人：在 Blender 中为机械臂建模，在 Three.js 中运行实时 3D 仿真，并使用 Interactions API 来解魔方 https://x.com/ai_for_success/status/2110040948638126557/video/1", "type": "tip", "relTime": "1周前"}, {"id": 85, "title": "Google AI Studio 用代码生成视频", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110114440993808719", "date": "2026-10-13T21:04:21.000Z", "summary": "📹 代码生成视频  @kickingkeys 在 @GoogleAIStudio 中使用 Argon，完全通过代码创作出丰富、复杂的视觉效果 https://x.com/kickingkeys/status/2110037855452180633/video/1", "type": "paper", "relTime": "1周前"}, {"id": 86, "title": "MiniMax 的 FastH3-Omni 上线 Reactor API 预览", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2110104942107406441", "date": "2026-10-13T20:26:36.000Z", "summary": "MiniMax 宣布 FastH3-Omni 登陆 Reactor，可从单个提示词生成带同步音频的视频，10.20.2026 前在 Reactor API 开放预览。FastVideo 与 nuvalab 对 MiniMax 的实时 H3 做后训练得到该开源版本，支持首尾帧条件控制、音频输入与强对话能力、最多 3 张参考图像。", "type": "model", "relTime": "1周前"}, {"id": 87, "title": "NVIDIA VFX Nodes 登陆 ComfyUI，支持视频超分、补帧与 SDR 转 HDR", "source": "Comfy Blog", "sourceUrl": "https://blog.comfy.org/p/nvidia-vfx-nodes-for-video-upscaling", "date": "2026-10-13T19:41:39.000Z", "summary": "NVIDIA 的 RTX 视频特效现以自定义节点形式在 ComfyUI 中本地运行，官方推荐按超分、补帧、HDR 的顺序搭建完整 VFX 管线。", "type": "paper", "relTime": "1周前"}, {"id": 88, "title": "Google 用 Gemini 4 Argon 加速机器人研究", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2110083927620591769", "date": "2026-10-13T19:03:06.000Z", "summary": "我们一直在探索利用 Gemini 4 Argon 加速 @Google 研究的潜力。其中一项测试是：用人类完成趣味任务的视频（比如来一局沙包游戏？）来自主生成训练模拟，而不是完全依赖人工编程。  来听听我们研究团队的介绍，并观看实际效果——我们的类人机器人研究这些视频、运行模拟，最终掌握了沙包投掷游戏。", "type": "paper", "relTime": "1周前"}, {"id": 89, "title": "Gemini 4 Argon 教机器人玩沙包", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2110078384617464201", "date": "2026-10-13T18:41:04.000Z", "summary": "Gemini 4 Argon 仅通过观看视频就教会了一台机器人玩沙包。  它推演了物理规律，编写了自己的模拟程序，并教会 @Apptronik 的 Apollo 人形机器人连续投中 7 次。", "type": "product", "relTime": "1周前"}, {"id": 90, "title": "GitHub 详解基于 ModernBERT 的密钥检测模型如何以更低成本和噪音找到更多真实密钥", "source": "GitHub Blog", "sourceUrl": "https://github.blog/ai-and-ml/githubs-model-for-secret-detection-finding-more-secrets-with-less-noise/", "date": "2026-10-13T17:56:33.000Z", "summary": "GitHub 公开其新密钥扫描分类器的设计与训练细节：先用正则生成候选，再用微调 ModernBERT 结合文件路径、变量名和上下文判断是否为真实密钥。相比此前 LLM 管线，仓库所有者加权接受率提升 11.5%，post-push 扫描中位执行时间降低 86%，服务成本下降超过 98%；模型导出为 ONNX 并做 8-bit 量化，且已将通用密钥检测扩展到 push protection。", "type": "tip", "relTime": "1周前"}, {"id": 91, "title": "Laplace Intelligence 为机器人和自动驾驶汽车做自动化红队测试", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/13/laplace-intelligence-red-teams-robots-and-self-driving-cars-before-they-hit-the-real-world/", "date": "2026-10-13T17:30:00.000Z", "summary": "密歇根大学孵化的 Laplace Intelligence 正在为机器人和物理 AI 构建自动化红队测试，用 AI 智能体在仿真中主动寻找失败点。其仿真环境基于 Nvidia Cosmos 后训练版本，可重建亚利桑那高速公路、巴黎人行横道等真实场景，并让其他交通参与者实时反应。客户包括五十铃、Bot Auto 和 Nvidia，并与 T-Mobile 合作在圣何塞开展智慧城市试点。", "type": "industry", "relTime": "1周前"}, {"id": 92, "title": "Gemini 4 Argon 将 NASA 火星数据转成幻灯片", "source": "X：Sundar Pichai (@sundarpichai)", "sourceUrl": "https://x.com/sundarpichai/status/2110059844187406428", "date": "2026-10-13T17:27:24.000Z", "summary": "任何处理过海量数据转储的人都知道这有多头疼。  我们给了 Gemini 4 Argon 超过 80,000 份 NASA 火星天气原始日志和 Ingenuity 直升机遥测文件，它将大气飞行力学提炼成一份演示文稿，把庞大而杂乱的科学档案（包括 CSV、图像、pdf、xml 日志、视频的混合内容）在几分钟内变成清晰的 Google Slides 可视化内容。", "type": "paper", "relTime": "1周前"}, {"id": 93, "title": "Google Antigravity 多智能体生成复杂建筑", "source": "X：Sundar Pichai (@sundarpichai)", "sourceUrl": "https://x.com/sundarpichai/status/2110059845806399489", "date": "2026-10-13T17:27:24.000Z", "summary": "生成复杂的多层架构是对前沿模型的一次绝佳测试。  在 Google Antigravity 中使用多智能体视觉批判循环，Argon 在 Blender 中从零开始自主创建了这座高度精细的宝塔及其周边环境。", "type": "model", "relTime": "1周前"}, {"id": 94, "title": "Argon 纯代码生成 3D 动态字体", "source": "X：Sundar Pichai (@sundarpichai)", "sourceUrl": "https://x.com/sundarpichai/status/2110059842664825132", "date": "2026-10-13T17:27:24.000Z", "summary": "Argon 完全用代码生成了这段 3D 动态字体（包括音乐），没有使用预先录制的素材或视频剪辑软件。  每一帧都由 Argon 通过数学算法绘制（3D 网格、粒子模拟、矢量几何等）", "type": "paper", "relTime": "1周前"}, {"id": 95, "title": "Google 将在 Play Store 托管用户个人 vibe-coded 应用", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/google/2026/10/google-wants-to-host-your-personal-vibe-coded-apps-in-the-play-store/", "date": "2026-10-13T17:00:39.000Z", "summary": "Google 计划让 Play Store 支持用户私下托管并分享自己用 AI 构建的应用。Ask Play 从今日起从应用详情页聊天机器人扩展为通用的应用与游戏搜索入口，可生成含详细对比图表的推荐，Gemini 也将推出类似能力。新推出的 Game Finder 基于 12 亿 Android 玩家的使用数据构建 Gamer DNA 画像，用于匹配玩法相近的玩家。", "type": "paper", "relTime": "1周前"}, {"id": 96, "title": "Demis Hassabis 谈 Gemini 4 Argon：命名致敬氩激光器", "source": "X：Demis Hassabis (@demishassabis)", "sourceUrl": "https://x.com/demishassabis/status/2110052931110318464", "date": "2026-10-13T16:59:56.000Z", "summary": "Google 发布 Gemini 4 Argon，今日起向 GeminiApp 与 Search 的 Ultra 和 Pro 订阅用户开放，Ultra 用户也可在 Antigravity 中使用。引用内容称其在知识工作和编码方面表现好，并展示了用其生成的 wizard chess 游戏以体现物理理解和 3D 建模能力。Demis Hassabis 转发并调侃模型名与氩激光器的联系，引用了电影...", "type": "model", "relTime": "1周前"}, {"id": 97, "title": "Instagram 认证账号传播 Mia Goth AI 伪造图，其经纪人批 Meta 保护失职", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/1010277/mia-goth-instagram-ai-shirt-deepfake-divorce", "date": "2026-10-13T16:42:51.000Z", "summary": "演员 Mia Goth 的经纪人表示，Instagram 带蓝 V 的粉丝账号 miagoth_ 传播其 AI 生成的身穿“MY EX IS MY BIGGEST FAN”T恤的图片，在艺人提出投诉后仍获认证，该图被数十万人点赞，OK! 和 People 等媒体曾当真报道。Meta 的规则要求部分 AI 视频加标签，但静图不在此列；截至周二上午该账号已被清空。", "type": "industry", "relTime": "1周前"}, {"id": 98, "title": "Gemini 4 Argon 让机器人通过看视频学会真人运动", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110041301253075358", "date": "2026-10-13T16:13:43.000Z", "summary": "Google 展示 Gemini 4 Argon 在机器人领域的真实世界物理学习能力：让 Argon 观看人类玩 cornhole 的视频，其映射环境、计算全身关节动作并自主构建仿真代码进行练习。迁移到 Apptronik 的 Apollo 人形机器人后，在真实世界试验中连续投中七次。", "type": "product", "relTime": "1周前"}, {"id": 99, "title": "Demis Hassabis 宣布 Gemini 4 Argon 上线并演示其制作的魔法棋游戏", "source": "X：Demis Hassabis (@demishassabis)", "sourceUrl": "https://x.com/demishassabis/status/2110041008100843835", "date": "2026-10-13T16:12:33.000Z", "summary": "Demis Hassabis 发布 Gemini 4 Argon，称其在知识工作和编码方面表现出色，并展示用其生成的 wizard chess 游戏以体现物理理解和3D建模能力。", "type": "paper", "relTime": "1周前"}, {"id": 100, "title": "Gemini 4 Argon 支持从任务拆解直接生成应用、3D 文件和报告", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2110039660139540710", "date": "2026-10-13T16:07:12.000Z", "summary": "Google Gemini 介绍 Gemini 4 Argon 可逐步拆解任务并直接产出实际成品，而不止于文本大纲。具体包括生成可分享的 web 应用、提供可直接打印的 3D 文件，以及产出可直接使用的幻灯片和报告。", "type": "paper", "relTime": "1周前"}, {"id": 101, "title": "Tripo 用高斯泼溅在 Vision Pro 重现梵高", "source": "Tripo（官方 X）", "sourceUrl": "https:/ sourceUrl": "https://x.com/rohanpaul_ai/status/2109487106313847119", "date": "2026-10-12T03:31:33.000Z", "summary": "FT 报道，机器写作的论文大量涌入学术期刊，筛选成本正推动规模 220 亿美元的出版业走向并购。Elsevier 自 2022 年起将审稿人队伍扩充超过三分之一至 190 万人；Springer Nature 因质控成本上升和聊天机器人贬值付费研究的担忧，IPO 两年后仍低于 22.50 欧元的发行价。", "type": "industry", "relTime": "1周前"}, {"id": 128, "title": "Raise Financial Services 与 Cartesia 合作，为印度金融市场打造多语言语音 AI", "source": "Cartesia 产品与研究", "sourceUrl": "https://www.cartesia.ai/blog/raise-financial-services", "date": "2026-10-12T00:00:00.000Z", "summary": "Raise Financial Services 正与 Cartesia 合作，将语音模型接入其自研实时语音基础设施，为印度金融市场提供多语言语音体验。Cartesia 的 Sonic 文本转语音模型支持 11 种印度语言及单次生成内的语码切换，目前已在 Dhan 的语音机器人中处理会话式 KYC 等交互，其中超 75% 的交互使用非英语语言，印地语占一半以上。", "type": "industry", "relTime": "1周前"}, {"id": 129, "title": "什么是浏览器指纹识别？原理与局限解析", "source": "Browser Use", "sourceUrl": "https://browser-use.com/posts/what-is-browser-fingerprinting", "date": "2026-10-12T00:00:00.000Z", "summary": "浏览器指纹识别通过收集 user agent、语言、屏幕尺寸、字体、canvas 与 WebGL 渲染、音频处理等信号，组合后经哈希函数生成紧凑标识，用于在 cookie 被删除后仍能识别回访浏览器。它分为被动式（HTTP 头、IP、TLS 握手）与主动式（JavaScript 采集）两类，常用于追踪用户、防欺诈和检测机器人，但相似浏览器可能撞车、浏览器更新也会改变结果。", "type": "tip", "relTime": "1周前"}, {"id": 130, "title": "Cloudflare 发布 Clef-omni：30B-A3B 多模态决策模型，单次调用评分文本、图像、音频和视频", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/10/11/cloudflare-clef-omni-multimodal-decision-model/", "date": "2026-10-11T23:15:52.000Z", "summary": "Cloudflare 于 2026 年 10 月 9 日发布开放权重决策模型 Clef-omni，可在一次调用中对文本、图像、音频和视频打分。", "type": "model", "relTime": "1周前"}, {"id": 131, "title": "vLLM Semantic Router 发布开源多模态决策模型 Decision 3.0，共 5 个尺寸", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/10/11/what-is-decision-3-0-vllm-semantic-routers-new-open-decision-models/", "date": "2026-10-11T21:43:41.000Z", "summary": "vLLM Semantic Router 团队发布 Decision 3.0 系列开源决策模型，读取文本、JSON 和图片，返回概率而非生成文本，全部采用 Apache-2.0 许可。", "type": "model", "relTime": "1周前"}, {"id": 132, "title": "任鑫用 Opus 5. 2026/10/winning-nikon-small-world-in-motion-video-disqualified-for-ai-use/", "date": "2026-10-09T18:44:06.000Z", "summary": "Nikon调查认定原Small World in Motion视频竞赛冠军、清华大学Ning Xu的作品不符合规则并取消其资格，越南Nguyen Nam Nhat以线虫与单细胞生物视频递补冠军，其余名次依次上移。研究者指出该视频存在结构异常和不符合真实细胞生物学的特征变化，源文件中疑似嵌入AI水印；Xu称仅用AI区分和可视化重建灰度图像中的特征，否认用AI生成实验影片、纤毛及其运动。", "type": "industry", "relTime": "1周前"}, {"id": 153, "title": "Nikon 显微视频大赛冠军作品因使用生成式 AI 被取消资格", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/1008930/nikon-small-world-in-motion-winner-ai", "date": "2026-10-09T18:06:57.000Z", "summary": "Nikon 称 Dr. Ning Xu 原获 Small World in Motion 大赛第一名的视频（声称展示 PCD 患儿气道纤毛运动）不符合关于生成式 AI 的比赛规则。", "type": "industry", "relTime": "1周前"}, {"id": 154, "title": "亚利桑那上诉法院因法官采信死者 AI 视频撤销凶手量刑", "source": "Hacker News：AI 热帖", "sourceUrl": "https://www.nbcnews.com/news/us-news/sentence-vacated-ai-video-dead-victim-rcna601457", "date": "2026-10-09T14:14:08.000Z", "summary": "亚利桑那上诉法院撤销一起路怒枪击案的 10 年半量刑，理由是法官在量刑时采信了受害者 AI 生成视频构成根本性错误。", "type": "industry", "relTime": "1周前"}, {"id": 155, "title": "Google 本周发布：SynthID 全球上线与 Gemma 4 等", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2108550067724407281", "date": "2026-10-09T13:28:05.000Z", "summary": "Google 本周宣布 SynthID 检测门户面向全球开放英文版，可验证图像、视频、音频是否由 Google 及行业伙伴的 AI 生成。同时发布 Nano Banana 2.1，在视觉设计、主体一致性和精准局部编辑上大幅提升；EmbeddingGemma 2 成为其首个原生多模态开源模型，统一文本、图像、视频、音频与代码的端侧嵌入。", "type": "model", "relTime": "1周前"}, {"id": 156, "title": "通义千问发布 Qwen-Image-2.1-Turbo，8 步去噪即可生成和编辑图像并开放权重", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2108549075218120949", "date": "2026-10-09T13:24:09.000Z", "summary": "通义千问发布 Qwen-Image-2.1-Turbo，基于同一 7B 视觉生成架构的加速 checkpoint，只需 8 个去噪步骤即可生成和编辑图像，权重已开放。", "type": "paper", "relTime": "1周前"}, {"id": 157, "title": "Anthropic Claude 上线 Dashboards 数据仪表板与 Motion 解释性动画功能", "source": "IT之家·人工智能", "sourceUrl": "https://www.ithome.com/1/010/962.htm",       '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();
</script>

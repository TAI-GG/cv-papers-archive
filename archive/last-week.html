"sourceUrl": "https://x.com/testingcatalog/status/2081715721902457054", "date": "2026-07-27T12:17:59.000Z", "summary": "SpaceXAI 计划将 Imagine API 升级至 2.0 版本，统一其图像与视频生成服务。  尝试 Imagine API 2.0 -- 使用同一 Imagine API 构建具备图像与视频能力的产品。", "type": "product", "relTime": "1周前"}, {"id": 7, "title": "Waymo 在奥斯汀因停车违规累计被罚近万美元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/982/215.htm", "date": "2026-07-27T10:54:45.000Z", "summary": "Waymo 自 2024 年进入奥斯汀以来，其自动驾驶出租车累计收到停车罚单，罚款总额达 9325 美元。截至 7 月 15 日，Waymo 已支付 83 张罚单共 7433 美元，另有 1892 美元未缴，罚款金额从 20 美元到 519 美元不等。尽管 Waymo 声称会像普通驾驶员一样缴纳罚款，但这类违规事件正随 Robotaxi 规模扩大而引发公众关注。", "type": "industry", "relTime": "1周前"}, {"id": 8, "title": "阿里云Qoder Security：AI代码安全左移，检测率+60%", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2081683544456257732", "date": "2026-07-27T10:10:07.000Z", "summary": "阿里云推出Qoder Security，将安全检测直接嵌入AI编码会话。面对AI生成超40%新代码的现状，该工具将漏洞检测率提升60%，误报率降低80%，修复时间从数周缩短至数小时。支持实时正则拦截与跨文件深度审查，已在Qoder Desktop及CLI中上线。", "type": "paper", "relTime": "1周前"}, {"id": 9, "title": "抖音升级未成年人模式适龄推荐算法，引入多模态大语言模型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/982/119.htm", "date": "2026-07-27T08:41:04.000Z", "summary": "抖音全面升级未成年人模式适龄推荐算法，核心是引入多模态大语言模型（MLLM）技术，综合处理文本、图像、音频等信息，为每条视频判断适宜观看的年龄范围。平台采用\"人工筛选 + 大模型分类 + 适龄推荐 + 内容偏好匹配\"的多重保障机制，目前未成年人专属内容池总量达770万条，日均新增约6000条优质内容。", "type": "model", "relTime": "1周前"}, {"id": 10, "title": "用Claude纯数学生成3D书籍页面，效果惊艳", "source": "X：小互 (@xiaohu)", "sourceUrl": "https://x.com/xiaohu/status/2081636797818531939", "date": "2026-07-27T07:04:22.000Z", "summary": "开发者@thebuggeddev用Fable 5和Claude，仅通过几句提示词就复刻了Trevor Noah网站\"Books\"页面的3D书籍动画效果。整个页面基于Three.js构建，未使用任何3D资产，Claude纯靠数学计算生成书籍模型，并用GSAP实现流畅动画，效果逼真，接近专业机构收费数千美元的作品。", "type": "tip", "relTime": "1周前"}, {"id": 11, "title": "世界动作模型综述：从反应到预判", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2081627897735840117", "date": "2026-07-27T06:29:00.000Z", "summary": "一篇关于世界动作模型（WAM）的综述论文指出，WAM 正推动机器人从\"对当前做出反应\"转向\"在行动前预测后果\"。只有预测的未来能直接用于生成、评分、验证或训练动作的模型才算 WAM。趋势是\"少做梦，多行动\"：完整视频生成对实时控制回路太慢且占用内存，因此许多新系统改用潜在特征、几何、可通行性图或运动表征，而非渲染视频。", "type": "paper", "relTime": "1周前"}, {"id": 12, "title": "Codex与Claude Code可即时生成创意游戏Demo", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2081603003866329496", "date": "2026-07-27T04:50:05.000Z", "summary": "我们已身处这样一个世界：借助Codex和Claude Code的现有能力，你可以按需创建真正独特、视觉有趣且富有创意的可玩Demo。我们不必再反复克隆那六款已有的游戏作为AI示例。大胆尝试更古怪的创意吧！", "type": "tip", "relTime": "1周前"}, {"id": 13, "title": "TikZ独角兽预示AI生成3D模型趋势", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2081601965360910597", "date": "2026-07-27T04:45:57.000Z", "summary": "这一切都源于TikZ独角兽。Sparks论文相当有先见之明。", "type": "tip", "relTime": "1周前"}, {"id": 14, "title": "阿里云推出Token计划，多模型统一体验", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2081583742116618475", "date": "2026-07-27T03:33:32.000Z", "summary": "阿里云发布Token计划，通过单一信用池即可使用Qwen、Wan、HappyHorse、DeepSeek和GLM等多个模型，覆盖文本、音频、图像和视频能力。该计划提供更清晰的AI用量可视化，首月仅需4美元，方便用户尝试、测试和对比不同模型。", "type": "model", "relTime": "1周前"}, {"id": 15, "title": "阿里云Token Plan：多模态AI共享额度", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2081578536121344070", "date": "2026-07-27T03:12:51.000Z", "summary": "阿里云推出Token Plan，为脚本、图像、视频等不同模态的AI工具提供统一共享额度池。该计划支持Qwen3.8-Max-Preview、HappyHorse1.1、DeepSeek V4、GLM-5.2等新模型，用户可跨模型和工具使用同一额度并查看用量。首月起步价仅4美元。", "type": "model", "relTime": "1周前"}, {"id": 16, "title": "Fable 打造 AI 生成的 Piranesi 城市游戏", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2081562248246415752", "date": "2026-07-27T02:08:08.000Z", "summary": "Fable 为我去年在 AI 视频中伪造的 Piranesi 城市建造游戏制作了实体版本。AI 想出的核心机制是在巨构废墟中建造一座拱门与水路交织的城市，并邀请人类在其中居住。 这款游戏让我印象深刻。试玩：https://capriccio-city.netlify.app/", "type": "tip", "relTime": "1周前"}, {"id": 17, "title": "荣耀 Robot Phone 定档 8 月 12 日发布，搭载第五代骁龙 8 至尊版与阿莱联合研发", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/843.htm", "date": "2026-07-27T01:43:19.000Z", "summary": "荣耀宣布全球首款机器人手机 Robot Phone 将于 8 月 12 日发布，由阿莱联合研发。该机搭载第五代骁龙 8 至尊版芯片，机身顶部集成行业最小的四自由度钛合金机械云台系统，配备微型电机，体积比主流方案缩小 70%。Robot Phone 还将首发荣耀新一代伙伴型多模态智能体操作系统 AgenticOS 的内核。", "type": "paper", "relTime": "1周前"}, {"id": 18, "title": "脑电波能否成为物理AI的下一个突破口？", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/26/are-brain-waves-the-next-unlock-for-physical-ai", "date": "2026-07-27T00:19:14.000Z", "summary": "Encord正与Zander Labs合作，通过头戴设备测量操作员脑电波来推断其心理状态，为机器人模型生成更优质的训练数据。Encord机器人学习主管指出，物理AI的核心瓶颈是真实世界训练数据的极度稀缺。目前该试验旨在构建初始脑波标记数据集，评估其对模型性能的提升效果。", "type": "tip", "relTime": "1周前"}, {"id": 19, "title": "OpenRouter 新增图像生成模型专用 API 端点", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/tutorials/image-generation-models", "date": "2026-07-27T00:00:00.000Z", "summary": "OpenRouter 通过专用 \\`/api/v1/images\\` 端点提供图像生成模型服务，图像理解仍通过 \\`/chat/completions\\` 端点完成，两者共用同一 API Key 和计费体系。该平台同时公布了两种任务的完整接口合约，并修复了此前出现的\"no endpoints found\"错误。", "type": "tip", "relTime": "1周前"}, {"id": 20, "title": "Apple 提出 GH-ESD：面向实例级视觉任务的假设驱动错误切片发现方法", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/gh-esd", "date": "2026-07-27T00:00:00.000Z", "summary": "Apple 机器学习研究团队提出 GH-ESD（Grounded Hypothesis-Driven Error Slice Discovery），一种针对目标检测与分割等实例级视觉任务的错误切片发现方法。现有方法主要适用于图像级分类，难以捕捉由上下文关系和空间视觉模式导致的实例级失败。GH-ESD 通过基于假设的驱动方式，系统性地发现模型在语义连贯子集上的系统性失效。", "type": "paper", "relTime": "1周前"}, {"id": 21, "title": "WorldDiT：统一扩散Transformer架构实现动作生成与视觉世界建模", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.23909", "date": "2026-07-27T00:00:00.000Z", "summary": "WorldDiT提出一种统一扩散Transformer架构，无需大型预训练VLM作为动作主干，即可同时生成连续动作块并预测未来相机帧的归一化RGB块。在四个LIBERO仿真套件上，WorldDiT位于报告的总参数量与平均成功率帕累托前沿，为未来扩展研究提供了低于十亿参数的强基线。", "type": "paper", "relTime": "1周前"}, {"id": 22, "title": "Sol-Attn：通过在线注意力稀疏化加速视频生成推理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24027", "date": "2026-07-27T00:00:00.000Z", "summary": "Sol-Attn 提出一种免训练的动态稀疏注意力方法，在单次在线 softmax 过程中统一了动态路由、稀疏计算和近似校正。该方法通过块阈值化和代理分数复用，无需物化代理映射即可实现动态可控的块预算，并直接复用未选中块的代理分数来近似其贡献。在图像和视频生成任务中，Sol-Attn 分别实现了视频生成和编辑 2.1 倍和 2.3 倍的端到端加速，同时保持视觉质量。", "type": "paper", "relTime": "1周前"}, {"id": 23, "title": "视觉文档理解中的证据归因：无需坐标或区域标签的语言接口优于坐标接口", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24651", "date": "2026-07-27T00:00:00.000Z", "summary": "一项研究发现，视觉语言模型在文档理解中通过坐标输出证据区域时，即使答案正确也常定位错误（归因幻觉）。在CiteVQA子集上对比六款开源模型，语言接口（模型直接引用原文，由布局解析器定位）的证据召回率从坐标接口的至多8%提升至26%-47%，幻觉率减半。基于此，研究提出无需区域标签的GRPO训练方法，将8B骨干模型的严格归因准确率从22.4提升至33.8。", "type": "paper", "relTime": "1周前"}, {"id": 24, "title": "DecoupleMix：解耦比例搜索与凸分配实现可扩展的VLM数据配方", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24516", "date": "2026-07-27T00:00:00.000Z", "summary": "字节跳动商业AI团队提出DecoupleMix框架，将视觉语言模型（VLM）的预训练数据构建系统化为可复现的工程问题，通过解耦类间比例搜索与类内凸优化分配实现可控实验。在80B额外多模态继续预训练token上，该框架产出的VLM与使用更大多模态预算训练的强开源模型竞争力相当，且小规模代理上发现的最优比例可直接迁移至更大规模。", "type": "paper", "relTime": "1周前"}, {"id": 25, "title": "FilmBench：面向电影级视频生成的专业基准测试", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24241", "date": "2026-07-27T00:00:00.000Z", "summary": "北京电影学院与华景数字传媒联合推出FilmBench，一个基于电影语言专业标准的文生视频（T2V）与参考视频（R2V）评测基准。其提示词源自20种电影类型的获奖影片片段，评估体系包含3个主轴、12个组件和35项（T2V）+3项（R2V）子指标。在9个T2V和7个R2V模型上的测试显示，模型得分远低于现有网络风格基准，且存在动态美学与多镜头场景下的显著性能差距。", "type": "paper", "relTime": "1周前"}, {"id": 26, "title": "北大等团队提出具身操作数据金字塔，系统梳理五类数据源与挑战", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24744", "date": "2026-07-27T00:00:00.000Z", "summary": "来自北大、NTU、港科大等机构的研究者提出\"具身数据金字塔\"，将具身操作数据按可扩展性与机器人对齐程度分为五类：真实机器人数据、UMI风格数据、自我中心与外部视角数据、仿真数据、通用视觉语言数据。论文分析了Motus、GR00T等具身基础模型的数据配方，并指出构建大规模触觉数据集、收集失败与恢复数据、跨本体动作对齐等六大开放挑战。", "type": "paper", "relTime": "1周前"}, {"id": 27, "title": "ClinFusion：面向整体医学理解的视觉中心多模态大语言模型系统", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24743", "date": "2026-07-27T00:00:00.000Z", "summary": "ClinFusion 提出级联空间感知局部融合算子，将 2D 与原生 3D 医学图像理解统一到融合编码器中。该系统在 24 项基准测试的 20 项上超越 Hulu-Med、Lingshu 等开源医学 MLLM，并在 16 项基准测试的 13 项上优于 GPT-5.2 和 Gemini-3-Flash 等闭源模型。", "type": "paper", "relTime": "1周前"}, {"id": 28, "title": "OPERA：离线策略引导的专家路由与自适应框架，实现通用生物医学图像分析", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.25108", "date": "2026-07-27T00:00:00.000Z", "summary": "OPERA 提出一种多智能体集成框架，将专家权重分配视为离线策略学习问题：从少量验证集学习路由策略，无需梯度更新即可部署，并通过测试时自适应处理分布偏移。在涵盖眼底摄影、胸部 X 光、CT、MRI 的 9 个数据集上，OPERA 在分类、分割和多模态任务中持续提升性能与校准质量，无需重新训练即可实现可部署的生物医学 AI。代码已开源在 GitHub。", "type": "paper", "relTime": "1周前"}, {"id": 29, "title": "GLI-AL：面向多模态胶质瘤MRI的统一解剖-病灶标签资源", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.22135", "date": "2026-07-27T00:00:00.000Z", "summary": "研究团队基于BraTS 2023-GLI训练队列构建了GLI-AL资源，提供1，251套统一的八类解剖-病灶标签集，覆盖健康脑组织、肿瘤亚区及此前未标注的白质高信号（WMH）共存异常。该资源将队列分为394例纯净子集与857例扩展子集，并附带标签来源、图像修复需求及质量控制元数据。MedNeXt验证表明，纳入WMH监督可保持健康组织分割性能并提升对共存病灶的敏感性。", "type": "paper", "relTime": "1周前"}, {"id": 30, "title": "压缩短文本生成中的质量瓶颈定位：阶段性验证研究", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24176", "date": "2026-07-27T00:00:00.000Z", "summary": "一项针对64-to-16压缩短文本生成管道的阶段性验证研究发现，编解码器重建是主导质量瓶颈。仅编解码器重建就将外部GPT-2困惑度从15.17升至27.36（+80.4%），而潜在空间生成器（MDLM）的表现优于token空间扩散模型。该研究提出了一种可复用的阶段性诊断协议，用于分离编解码器重建保真度与潜在生成质量。", "type": "paper", "relTime": "1周前"}, {"id": 31, "title": "Mage-VL：编解码原生的流式多模态基础模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24904", "date": "2026-07-27T00:00:00.000Z", "summary": "Mage-VL 借鉴视频编解码原理，利用运动向量和残差能量选择性编码动态区域，将视觉 token 数量减少约 75%。其 4B 参数版本在空间、视频和视觉理解基准上超越 Qwen3-VL-4B、Phi-4-MM （5.6B） 及 Phi-4-reasoning-vision （15B）。模型采用从零训练的 Mage-ViT 编码器，并支持事件触发的实时交互。", "type": "paper", "relTime": "1周前"}, {"id": 32, "title": "PerceptionBench：多模态大语言模型原子视觉感知评测基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.24957", "date": "2026-07-27T00:00:00.000Z", "summary": "研究者推出 PerceptionBench，专门评估多模态大语言模型的原子视觉感知能力，包含 3，000 道验证问题，覆盖十项原子感知能力。对 16 个前沿模型的评测显示，没有模型准确率超过 60%，GPT-5.6-Sol（59.7%）和 Kimi K3（58.5%）暂时领先。该基准通过自底向上的错误归因方法构建，旨在隔离感知错误，提供细粒度能力诊断。", "type": "paper", "relTime": "1周前"}, {"id": 33, "title": "Suno 推出多项新功能，含MIDI导出等", "source": "X：Suno (@suno)", "sourceUrl": "https://x.com/suno/status/2081443050312843765", "date": "2026-07-26T18:14:29.000Z", "summary": "我们一直在以比以往更快的速度构建！🚀  以下是网页端和移动端的新功能一览：  • 高级音轨分离 • 将音轨导出为 MIDI • 歌词合写与自动保存 • 截图生成歌曲 • Apple CarPlay 与 Android Auto  你最期待 Suno 的哪些新功能？", "type": "product", "relTime": "1周前"}, {"id": 34, "title": "Black Forest Labs 发布 FLUX 3：统一图像、视频、音频与机器人动作预测的多模态基础模型", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/07/26/black-forest-labs-releases-flux-3-a-multimodal-flow-model-for-image-video-audio-and-robot-action-prediction", "date": "2026-07-26T17:50:23.000Z", "summary": "Black Forest Labs 发布 FLUX 3，这是首个在单一架构中联合学习图像、视频和音频，并从同一组权重输出视频、音频和动作预测的多模态基础模型。FLUX 3 Video 可单次生成长达 20 秒、带原生音频的视频，在 10 秒 720p 文本生成视频的人类偏好测试中，以 93% 的偏好率击败 Luma Ray 3.2。", "type": "model", "relTime": "1周前"}, {"id": 35, "title": "AI Agent 快速试错：衣播等你产品复刻", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2081379865249591672", "date": "2026-07-26T14:03:24.000Z", "summary": "Berry Xia 引用 LufzzLiz 的推文，指出其团队正用 AI Agent 快速产出产品原型，然后快速试错、丢弃，形容为\"十分快餐\"的开发模式。LufzzLiz 计划复刻一个直播录屏视频做成产品，并强调视频非 AI 生成，产品仍在打磨中。", "type": "tip", "relTime": "1周前"}, {"id": 36, "title": "开发者推出防AI训练图片干扰工具，意外催生\"抖动视觉风格\"梗图创作潮流", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/786.htm", "date": "2026-07-26T11:45:41.000Z", "summary": "开发者TI111310推出\"grid-noise-animator\"工具，通过在图片中加入大量噪点干扰AI识别能力，防止图片被用于训练AI模型。该工具可将照片转换为带噪点的视频或动态图片，并支持调整噪点尺寸、采样抖动等参数。其产生的抖动视觉风格意外被网友用作创作工具，制作趣味梗图或\"灵异录像带\"风格影像，形成潮流。", "type": "model", "relTime": "1周前"}, {"id": 37, "title": "华为鸿蒙小艺 Claw 上线新人福利：新用户首次订阅连续包月享 7 天免费体验", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/756.htm", "date": "2026-07-26T08:22:38.000Z", "summary": "华为为鸿蒙 HarmonyOS 小艺 Claw 推出新用户福利，即日起持有 HarmonyOS 6 及以上版本设备并将小艺 App 升级至 11.6.6.300 版本的用户，首次订阅连续包月可享 7 天免费体验并获 500 AI 点数。此次更新还优化了 PPT 生成、编码能力、图像创作及上下文压缩时延，并新增 HarmonyOS 专属 Skills 及伙伴精选技能。", "type": "product", "relTime": "1周前"}, {"id": 38, "title": "欧盟 AI 透明度准则 8 月 2 日生效：聊天机器人须\"自报身份\"，深度伪造内容需带机读标签", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/755.htm", "date": "2026-07-26T08:16:42.000Z", "summary": "欧盟《人工智能法案》第 50 条 AI 透明度准则将于 8 月 2 日生效，要求聊天机器人明确告知用户其为 AI 系统，深度伪造内容发布时须附带机器可读标记。违规企业最高可被处罚 1500 万欧元或全面营业额的 3%。8 月 2 日前已面世的生成式 AI 系统有 4 个月过渡期。", "type": "industry", "relTime": "1周前"}, {"id": 39, "title": "微电影《返航日》7月27日上映，采用荣耀Robot Phone完成一镜到底视觉叙事", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/701.htm", "date": "2026-07-26T07:04:08.000Z", "summary": "荣耀手机官宣微电影《返航日》将于7月27日上映，由摄影指导王博学执导，全程使用荣耀Robot Phone完成一镜到底拍摄。该机搭载第五代骁龙8至尊版芯片，机身顶部集成行业最小四自由度钛合金机械云台系统，电机体积比主流方案缩小70%。荣耀Robot Phone已开启预约，定档\"8月见\"，并将首发伙伴型多模态智能体操作系统AgenticOS内核。", "type": "industry", "relTime": "1周前"}, {"id": 40, "title": "Claude Opus 5 系统提示词被完整泄露，共 135027 字符、约 3.4 万 token", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/688.htm", "date": "2026-07-26T05:33:44.000Z", "summary": "开发者 Eversmile1 在 GitHub 上公开了 Claude Opus 5 的完整系统提示词，包含 30 个工具的 JSON schema、严格的版权合规规则（单次引用不超过 15 词）和跨会话记忆系统。泄露后 24 小时内，已有开发者用 Opus 5 成功生成 3D 射击游戏和《火箭联盟》克隆版等复杂 Demo。", "type": "tip", "relTime": "1周前"}, {"id": 41, "title": "Claude Opus 5 单次生成滑雪视频无视觉缺陷", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2081236021791109266", "date": "2026-07-26T04:31:49.000Z", "summary": "一切能写成规范的东西都在归零。 Claude Opus 5 做到了这一点，\"首次通过无视觉缺陷。\"", "type": "tip", "relTime": "1周前"}, {"id": 42, "title": "因准确性问题，欧美多所高校停用AI检测工具", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/635.htm", "date": "2026-07-26T01:57:34.000Z", "summary": "美国阿德尔菲大学学生因Turnitin AI检测工具误判其论文\"AI生成概率为100%\"而胜诉，引发对AI检测工具可靠性的广泛质疑。范德堡大学、耶鲁大学、滑铁卢大学等多所高校已限制或停用GPTZero、Copyleaks、Turnitin等工具。调查显示32%的英国学生承认违规使用AI，但42%的学生因担心误判反而减少了AI工具使用。", "type": "industry", "relTime": "1周前"}, {"id": 43, "title": "特斯拉在智利、哥伦比亚招聘 AI 安全运营专员，为 Robotaxi 出海铺路", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/621.htm", "date": "2026-07-26T00:10:17.000Z", "summary": "特斯拉正在哥伦比亚和智利招聘 AI 安全运营专员，岗位职责包括监督自动驾驶网约车网络日常运营及动态数据采集。招聘信息中明确提到\"网约车运营管理\"，表明特斯拉已开始为海外自动驾驶车队搭建基础架构。目前该布局仍处于早期验证阶段，重点为道路测绘与数据采集，尚未正式公布南美市场计划。", "type": "industry", "relTime": "1周前"}, {"id": 44, "title": "日媒拆解宇树 G1 人形机器人后承认：日本短期内难以赶超中国", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/619.htm", "date": "2026-07-26T00:07:23.000Z", "summary": "日本日经xTECH 网站发布宇树科技 G1 人形机器人拆解视频，技术人员感叹其技术水平之高，并得出结论：中国机器人研发已超越\"只会展示\"阶段，日本想在短时间内缩小差距\"恐怕并不现实\"。此前，宇树科技已与日本 GMO AIR 签署合作协议，后者成为其官方经销商，将在日本销售 G1、H1 及 Go 2、B2 等产品。", "type": "tip", "relTime": "1周前"}, {"id": 45, "title": "JarvisHub：面向画布原生多模态创意智能体的开放框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.23588", "date": "2026-07-26T00:00:00.000Z", "summary": "JarvisHub 是一个面向长周期多模态创作的开放智能体框架，将可编辑画布作为用户工作区、智能体外部记忆、动作空间和共享项目状态，通过画布状态、协议桥接和智能体运行时三层架构，支持智能体在可检查、可编辑的创意状态中持续规划、生成、修改和组织多模态项目。该设计使创意智能体超越孤立的工具调用，实现可持续、可人工引导的创意自动化，用户可在全过程中检查、指导和干预。", "type": "paper", "relTime": "1周前"}, {"id": 46, "title": "GNM Head：覆盖头、脸、眼、牙齿与舌头的生成式人体测量学参数模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.23687", "date": "2026-07-26T00:00:00.000Z", "summary": "研究人员提出 GNM（Generative aNthropometric Model），一个涵盖头部、面部、颈部、眼球、牙齿和舌头的统一参数化模型。该模型基于高分辨率 3D 扫描与艺术家制作的解剖样本构建，在拟合目标 3D 面部扫描上达到 SOTA 性能。完整 GNM 框架已公开发布，旨在为生成式视觉模型提供更精确的空间控制与解剖学约束。", "type": "paper", "relTime": "1周前"}, {"id": 47, "title": "DriveDNA：大规模多模态自然驾驶数据集与驾驶风格识别基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.23822", "date": "2026-07-26T00:00:00.000Z", "summary": "DriveDNA 是一个包含 465 名驾驶员、4121 次行程、115 种车型、总计 975 小时自然驾驶数据（10Hz 采样，含前视视频）的大规模多模态数据集与基准。它通过少样本驾驶员重识别、个性化行为预测和条件匹配比较三项核心任务评估驾驶风格表征。实验表明，学习表征在未见驾驶员上显著优于经典描述符（AUROC .935 对比 .707），而纯视频模型虽重识别精度相当但存在严重路线泄露问题。", "type": "paper", "relTime": "1周前"}, {"id": 48, "title": "OmniVAE：跨模态对齐的音频-视频VAE实现联合生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.23855", "date": "2026-07-26T00:00:00.000Z", "summary": "OmniVAE提出一种联合训练的音频-视频VAE，通过段级对比学习对齐音频与视频的潜在空间，并蒸馏预训练语义编码器的特征。实验表明，该方法能提升下游文本到音视频生成的质量与跨模态同步精度，验证了统一表征对全模态建模的基础作用。", "type": "paper", "relTime": "1周前"}, {"id": 49, "title": "Reactor 发布 Open Dreamer：JAX/Flax 复现 Dreamer 4 世界模型管线", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/07/25/meet-open-dreamer-a-jax-flax-reproduction-of-the-dreamer-4-world-model-pipeline-with-the-full-training-recipe-published", "date": "2026-07-25T18:59:54.000Z", "summary": "Reactor 团队发布 Open Dreamer，在 JAX/Flax NNX 中完整复现 Dreamer 4 世界模型管线并公开训练配置。该实现包含一个基于 Transformer 的因果视频分词器（约 100 倍压缩）和一个 1.6B 参数的动态模型，并提供了 Minecraft 实时生成演示。", "type": "model", "relTime": "1周前"}, {"id": 50, "title": "Qwen3.5-4B消歧小模型：专注图像文本消歧", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2081052820506390680", "date": "2026-07-25T16:23:51.000Z", "summary": "基于Qwen3.5-4B微调的专用消歧模型发布，支持图像+文本输入，4B参数规模。该模型将\"消歧\"这一认知环节单独训练，旨在以低成本实现精准的多义信息处理。此举反映AI系统分工趋势：大模型负责理解生成，小模型专注关键瓶颈环节。", "type": "tip", "relTime": "1周前"}, {"id": 51, "title": "Meta 推出\"Facebook Verified\"免费徽章，打击 AI 生成虚假账号", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/426.htm", "date": "2026-07-25T00:46:09.000Z", "summary": "Meta 宣布推出\"Facebook Verified\"免费服务，用户通过录制视频自拍验证身份后即可获得勾号标记。该功能面向年满 18 岁、符合社区标准且无欺诈行为的个人账号，旨在确保账号背后是真实用户而非 AI 生成的虚假账号。徽章将分阶段推出，计划未来扩展至全球市场。", "type": "paper", "relTime": "1周前"}, {"id": 52, "title": "Genspark Design 品牌设计系统实测", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2080805687186313511", "date": "2026-07-25T00:01:49.000Z", "summary": "Genspark Design 令人印象深刻。  我用一个虚构产品测试了 Genspark Design，看看一个视觉方向能走多远。  你可以为产品或服务设计完整的品牌标识系统。  生成海报、落地页模型、短宣传视频概念，以及可复用的设计系统（颜色、字体、视觉规则）。  只需给出方向，它就能创建：  移动应用、品牌视频、社交媒体海报  这是我的简单工作流程。🧵 1.", "type": "tip", "relTime": "1周前"}, {"id": 53, "title": "UltraViT：面向大视觉语言模型的延迟优化端侧视觉编码器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.23373", "date": "2026-07-25T00:00:00.000Z", "summary": "UltraViT 是一种专为大视觉语言模型（LVLM）设计的视觉编码器，通过金字塔架构和异构空间混合器实现端侧延迟优化。其两阶段生成式预训练策略（密集蒸馏后接混合容量冻结 LLM 的生成监督）相比对比学习和自监督学习，能更有效建立高层语义基础。实验表明，UltraViT 在端侧运行速度提升近 1.7 倍，显著优于现有编码器基线。", "type": "paper", "relTime": "1周前"}, {"id": 54, "title": "Anthropic 发布 Claude Opus 5 旗舰模型", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2080804808123208161", "date": "2026-07-24T23:58:20.000Z", "summary": "Anthropic 发布新一代旗舰模型 Claude Opus 5，在 Frontier-Bench 得分超过前代两倍，ARC-AGI 3 得分是次优模型三倍，OSWorld 以约三分之一成本超越 Fable 5 最佳成绩。模型展示了自建视觉管线和测试工具修复复杂任务的能力，但网络安全能力仍落后于 Mythos 5。", "type": "tip", "relTime": "1周前"}, {"id": 55, "title": "加拿大议员在议会演讲中读出疑似 LLM 提示词指令", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/07/canadian-legislator-reads-out-apparent-llm-response-in-floor-speech", "date": "2026-07-24T21:25:15.000Z", "summary": "加拿大新不伦瑞克省进步保守党议员 Bill Oliver 在议会演讲中念出\"这是一个更自然、流畅的版本\"等明显带有 LLM 提示词特征的句子，疑似将 AI 生成的替代文本直接读入会议记录。该视频本周在 Reddit 和 Threads 等社交平台传播，并引发加拿大广播公司等主流媒体关注。", "type": "industry", "relTime": "1周前"}, {"id": 56, "title": "Opus 5 生成可玩《火箭联盟》克隆版，性能惊人", "source": "X：Noah Zweben（@noahzweben）", "sourceUrl": "https://x.com/noahzweben/status/2080747022429413436", "date": "2026-07-24T20:08:43.000Z", "summary": "Opus 5 仅消耗 5x Max 订阅的 27% 算力，就构建出迄今最逼真的《火箭联盟》克隆游戏，包含可反射车身的细节和可玩版本。@LLMJunky 称其在游戏开发和 3D 建模领域\"明显领先于世界最佳模型\"。源代码和可玩游戏已开源。", "type": "tip", "relTime": "1周前"}, {"id": 57, "title": "AI 构建者基础：Token、上下文窗口与 RAG 入门指南", "source": "Google AI：DEV 作者专属（RSS）", "sourceUrl": "https://dev.to/googleai/ai-builder-essentials-tokens-context-windows-and-rag-101-12bn", "date": "2026-07-24T19:16:22.000Z", "summary": "Google AI 发布了一期面向开发者的视频，系统讲解 LLM 核心概念。视频解释了 token 作为模型输入输出基本单元的含义，介绍了检索增强生成（RAG）如何为模型提供训练数据之外的额外信息，并说明了上下文窗口（即模型可处理的 token 数量）近年来大幅增长的趋势。视频还指出，给大语言模型提供更多上下文通常能提升回答质量。", "type": "tip", "relTime": "1周前"}, {"id": 58, "title": "Midjourney 收购占星 App Co-Star，拓展 AI 个性化服务版图", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/970894/midjourney-co-star-acquisition", "date": "2026-07-24T19:06:58.000Z", "summary": "Midjourney 宣布收购个性化占星应用 Co-Star，该交易已于今年春季完成，具体金额未披露。Co-Star 是一款免费应用，结合 NASA 数据、人类洞察与 AI 为用户提供每日星座运势及朋友兼容性分析。此次收购标志着 Midjourney 从图像生成向 AI 个性化服务领域拓展。", "type": "industry", "relTime": "1周前"}, {"id": 59, "title": "Meta AI 升级为个人助手：接入日历生成简报，支持深度研究与持续任务", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/970570/meta-ai-chatbot-productivity-update", "date": "2026-07-24T17:00:00.000Z", "summary": "Meta 为其 AI 聊天机器人推出新生产力功能，使其能接入日历生成每日简报、规划活动，并执行可中途调整方向的深度研究。该更新由新发布的 Muse Spark 1.1 模型驱动，标志着 Meta 从\"娱乐优先\"转向\"个人超级智能\"战略。新版 Meta AI 即日起在 Meta AI 应用和网页端\"部分市场\"上线，未来数周将扩展至 WhatsApp 等平台。", "type": "model", "relTime": "1周前"}, {"id": 60, "title": "微软开源27B电脑操作Agent，可替代RPA", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2080678207054024819", "date": "2026-07-24T15:35:16.000Z", "summary": "微软发布Fara1.5-27B，一个基于Qwen3.5架构的27B参数多模态Agent，能看图像、读文字并像人一样控制电脑。它专为computer-use场景设计，可浏览网页、填表单、从截图提取数据、点击按钮，实现网页自动化。该模型开源且体量适中，适合本地部署和自托管，降低了可靠电脑操作模型的门槛。", "type": "model", "relTime": "1周前"}, {"id": 61, "title": "Anthropic 联合 Andon Labs 发布 Drone-Bench，评估 AI 模型自主操控无人机执行定位追踪任务的能力", "source": "Anthropic：Research（发表成果 · 网页）", "sourceUrl": "https://www.anthropic.com/research/project-pilot", "date": "2026-07-24T15:25:45.300Z", "summary": "Anthropic 与 Andon Labs 合作推出 Drone-Bench，用于测试 AI 模型自主操控四旋翼无人机在室内环境中定位并追踪指定人员的能力。该基准将任务分解为 3D 地图重建、定位、导航、目标检测与跟随五个子任务，并通过软件复现实现快速评估。实验表明，该任务链的难度足以区分不同智能水平的模型，并揭示 AI 在物理世界操控能力上的进步轨迹。", "type": "paper", "relTime": "1周前"}, {"id": 62, "title": "Jim Fan 转发黄仁勋：开放模型至关重要", "source": "X：Jim Fan (@DrJimFan)", "sourceUrl": "https://x.com/DrJimFan/status/2080660454184226908", "date": "2026-07-24T14:24:43.000Z", "summary": "GOAT  【引用 @JensenHuang】：在我的第一篇帖子中，我分享了一封 @NVIDIA 签署的关于开放模型为何重要的信函。  AI 将变革每个行业，赋能每家公司，并由每个国家构建。  开放模型加强安全与网络安全，加速创新与扩散，并实现主权。  世界既需要前沿封闭模型，也需要前沿开放模型。  https://images.nvidia.com/pdf/Open-Weights-and...", "type": "industry", "relTime": "1周前"}, {"id": 63, "title": "Hyper3D 自动拆解3D模型为独立零件", "source": "X：小互 (@xiaohu)", "sourceUrl": "https://x.com/xiaohu/status/2080660118790893712", "date": "2026-07-24T14:23:23.000Z", "summary": "Hyper3D 的 BANG to Parts 功能可将完整 3D 模型自动拆解为多个独立、完整的 3D 零件。拆解后的零件可直接用于动画、改材质或 3D 打印，且支持递归拆解（如整车→车轮→轮毂），每个零件均可单独编辑或重新生成。", "type": "model", "relTime": "1周前"}, {"id": 64, "title": "用AI生成3D虚拟小人，Vibe Coding玩转简历", "source": "X：小互 (@xiaohu)", "sourceUrl": "https://x.com/xiaohu/status/2080657737604907027", "date": "2026-07-24T14:13:56.000Z", "summary": "用户@SenZh4通过Vibe Coding制作了一个个人网站，利用AI将自己变成3D虚拟小人，并搭建了一个让小白也能快速生成类似内容的平台。该案例展示了AI在网页设计和互动简历中的创意应用。", "type": "tip", "relTime": "1周前"}, {"id": 65, "title": "黄仁勋首帖：开放模型为何重要", "source": "X：Jensen Huang (@JensenHuang)", "sourceUrl": "https://x.com/JensenHuang/status/2080643682408321103", "date": "2026-07-24T13:18:05.000Z", "summary": "在我的第一篇帖子中，我分享了一封@NVIDIA签署的信函，阐述开放模型为何重要。  AI将改变每个行业，赋能每家公司，并由每个国家构建。  开放模型能加强安全与网络安全，加速创新与扩散，并实现主权。  世界既需要前沿的封闭模型，也需要前沿的开放模型。  https://images.nvidia.com/pdf/Open-Weights-and-American-AI-Leadership.pdf", "type": "industry", "relTime": "1周前"}, {"id": 66, "title": "FLUX 3 x mimic：新一代视频动作模型", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://bfl.ai/blog/flux-3-mimic", "date": "2026-07-24T11:55:45.885Z", "summary": "Black Forest Labs 发布多模态基础模型 FLUX 3，联合训练图像、视频和音频，其中视频预测占训练算力的 95% 以上。该模型与机器人公司 mimic 合作推出 FLUX-mimic，已在奥迪生产线上测试部署。加入动作预测后，视频生成质量最初下降最多 10%，但经 3500 步训练后恢复原有水平。", "type": "model", "relTime": "1周前"}, {"id": 67, "title": "PixVerse 推出 GPT Image 2 隐藏功能", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2080615070313427002", "date": "2026-07-24T11:24:23.000Z", "summary": "长按有惊喜！用「カクシエMAKER」轻松制作。😍 由 PixVerse 上的 GPT Image 2 生成 @PixVerse_", "type": "paper", "relTime": "1周前"}, {"id": 68, "title": "生数科技在 WAIC 2026 展示通用世界模型最新进展", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s/PNTAz8J2U8OibvMtk59G_w", "date": "2026-07-24T10:35:54.000Z", "summary": "生数科技在 WAIC 2026 上展示了从数字世界生成到物理世界行动的通用世界模型。其视频生成模型 Vidu 已形成产品矩阵，实时交互模型 Vidu S1 支持 540P、最高 42FPS 的视频通话级输出。面向物理世界的世界动作模型 Motubrain 在 RoboTwin 2.0 榜单的 Clean 和 Randomized 场景下均位列第一。", "type": "model", "relTime": "1周前"}, {"id": 69, "title": "dRAE：基于超球面编码的表示自编码器，实现 100% 码本利用率与 131，072 词汇量扩展", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.22148", "date": "2026-07-24T09:47:32.000Z", "summary": "中国科学院、浙江大学、北京大学与蚂蚁集团联合提出离散表示自编码器 dRAE，核心创新为超球面量化（HSQ）。HSQ 将码本路由从欧氏距离切换为角度相似度，解耦语义内容与特征幅度，解决了高维视觉表示量化中码本崩溃的度量不匹配问题。实验表明，dRAE 在词汇量扩展至 131，072 时仍保持性能增益，实现 100% 码本利用率，并在理解与生成任务上表现优异。", "type": "paper", "relTime": "1周前"}, {"id": 70, "title": "阿里云推出Token Plan，统一AI模型调用与计费", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2080588893691531270", "date": "2026-07-24T09:40:22.000Z", "summary": "阿里云发布Token Plan，将文本、图像、视频和音频模型的调用整合到一个统一的信用池中，提供对通义千问（Qwen）及第三方领先模型的一站式访问。该计划旨在简化AI支出，首月起步价4美元。", "type": "model", "relTime": "1周前"}, {"id": 71, "title": "我国成功发射两颗AI卫星：吉天星A-04星与西光贰号03星", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/300.htm", "date": "2026-07-24T09:19:08.000Z", "summary": "力箭一号遥十五火箭今日以\"一箭5星\"方式发射，其中吉天星A-04星搭载具身智能模型，可自主监测卫星健康并规划任务，支持实时上注AI大模型。西光贰号03星搭载三个AI气象模型，在星上直接产出预报，将观测到预警的响应时间压缩至分钟级。两颗卫星均属于三体计算星座，该星座计划到2027年达100颗卫星。", "type": "industry", "relTime": "1周前"}, {"id": 72, "title": "腾讯合并大模型与多模态部，姚顺雨统管AI", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2080567279171850659", "date": "2026-07-24T08:14:29.000Z", "summary": "腾讯内部通知将大语言模型部和多模态部合并为基础模型部，由首席AI科学家姚顺雨统一负责。姚顺雨去年12月空降，7个月内完成从AI Lab撤并到混元、再到整合多模态的集权。此前发布的Hy3模型（295B总参数/21B激活参数）已打平参数2-5倍的旗舰模型，内部WorkBuddy任务成功率从72%提升至90%，耗时降34%。", "type": "industry", "relTime": "1周前"}, {"id": 73, "title": "Flux 3 多模态前沿模型发布，支持图像/视频/音频联合学习", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://bfl.ai/blog/flux-3", "date": "2026-07-24T07:39:43.382Z", "summary": "Flux 3 多模态前沿模型发布，通过联合学习图像、视频和音频构建统一的世界表征。该模型现已开放 Early Access。", "type": "model", "relTime": "1周前"}, {"id": 74, "title": "梁文锋详解DeepSeek AGI路线图：不追热点", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2080550345957130415", "date": "2026-07-24T07:07:11.000Z", "summary": "梁文锋在投资人会议实录中提出AGI的明确台阶：去年是CoT思维链，今年是Agent，下一道硬坎是持续学习，之后才是奇点（模型自我迭代），最后才轮到具身智能。他认为视频生成、世界模型等是支线，顺序错了越努力越错。DeepSeek因此不追热点，按自己的主线节奏推进。", "type": "tip", "relTime": "1周前"}, {"id": 75, "title": "Runway Media Router 上线：根据场景自动切换 AI 模型，节省 Token 成本", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/144.htm", "date": "2026-07-24T07:00:01.000Z", "summary": "Runway 推出 Media Router，可在生成图像、视频、音频时根据质量、速度、成本三项优先级自动切换模型，减少开发者手动调换负担。该工具已上线 Runway Dev 平台，支持调用 Seedance、GPT Image 2、ElevenLabs 等多家模型，按高速生成、高质量、低成本三种场景灵活调度。", "type": "model", "relTime": "1周前"}, {"id": 76, "title": "Black Forest Labs 发布 FLUX 3 多模态模型，支持单次生成 20 秒视频与原生音频", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/137.htm", "date": "2026-07-24T06:48:04.000Z", "summary": "Black Forest Labs 以 Early Access 方式推出 FLUX 3 多模态基础模型，采用统一架构联合学习图像、视频和音频。该模型基于 Self-Flow 学习框架扩展，可在单次生成中输出最长 20 秒视频并附带原生音频，支持文生视频、图生视频、多镜头串联等任务。", "type": "model", "relTime": "1周前"}, {"id": 77, "title": "腾讯混元大语言模型与多模态团队合并，成立基础模型部由姚顺雨统一管理", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/121.htm", "date": "2026-07-24T06:19:25.000Z", "summary": "腾讯宣布混元多模态模型部门与大语言模型部门合并，成立基础模型部，由首席AI科学家姚顺雨统一管理。7月上线的Hy3大语言模型智能水平比肩参数规模2-5倍的旗舰模型，发布一周后总调用量较上一代Hy2增长超68倍。混元3D世界模型2.0（Hy World 2.0）已开源，支持文字、图片、视频输入生成3D世界，社区下载量超300万。", "type": "industry", "relTime": "1周前"}, {"id": 78, "title": "Black Forest Labs 发布多模态模型 FLUX 3", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2080536654423478676", "date": "2026-07-24T06:12:47.000Z", "summary": "Black Forest Labs 推出了 FLUX 3，这是一个用于图像、视频、音频和动作预测的多模态模型。  > 在一个统一架构中联合训练，我们的模型可扩展用于预测机器人动作。  > FLUX 3 Video 现已开放早期访问（需通过表单申请）。", "type": "model", "relTime": "1周前"}, {"id": 79, "title": "Google 推出\"自拍视频\"登录功能，用于账户恢复与二次验证", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://blog.google/innovation-and-ai/technology/safety-security/selfie-video-sign-in", "date": "2026-07-24T06:03:30.608Z", "summary": "Google 为 Google 账户新增\"自拍视频\"登录方式，用户可通过录制面部视频并完成简单头部动作来设置或验证身份。该功能主要用于账户锁定或无法使用常用设备时的恢复登录，视频经加密存储且用户可随时删除。Google 通过多层安全机制（包括活体检测与深度伪造防御）防止冒充。", "type": "paper", "relTime": "1周前"}, {"id": 80, "title": "用百度 Unlimited-OCR 构建端到端高分辨率图像与多页 PDF 解析管线", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/07/23/how-to-build-an-end-to-end-ocr-pipeline-with-baidus-unlimited-ocr-for-high-resolution-images-and-multi-page-pdf-parsing", "date": "2026-07-24T05:16:28.000Z", "summary": "本教程构建了一套完整的 OCR 工作流，在 GPU 上加载百度 3B 参数的 Unlimited-OCR 视觉语言模型，支持 bfloat16/float16 自动选择。管线包含两种推理模式：Gundam 模式（分块高细节）和 Base 模式（单视图更快），并通过 PyMuPDF 和 infer_multi（） 扩展至多页 PDF 解析，全程保留长上下文生成、重复控制和结构化输出设置。", "type": "tip", "relTime": "1周前"}, {"id": 81, "title": "PixVerse 推出 VibeMV：一键生成音乐视频", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2080503284733968552", "date": "2026-07-24T04:00:11.000Z", "summary": "想把任何歌曲变成音乐视频？VibeMV 现已上线！只需上传一首歌。选择一种风格。一键获得完成的音乐视频--无需拍摄或剪辑。15 种风格。角色一致性。唇形同步 + 歌词 RT + 关注 + 回复 = 私信中的 150 积分（仅限 72 小时）", "type": "paper", "relTime": "1周前"}, {"id": 82, "title": "FLUX 3发布：多模态真实世界模型", "source": "X：邵猛 (@shao__meng)", "sourceUrl": "https://x.com/shao__meng/status/2080499451576377388", "date": "2026-07-24T03:44:57.000Z", "summary": "Black Forest Labs发布FLUX 3，定位为\"真实世界模型\"，而非单纯的文生图或文生视频模型。该模型将图像、视频、音频和语言纳入同一multimodal flow架构，通过模态间的互约束学习物理规律与因果线索。同一底座支持三条产品线：Video（最长20秒、原生音频）、Image（后续推出）和Action（动作预测，已用于FLUX-mimic机器人场景）。", "type": "model", "relTime": "1周前"}, {"id": 83, "title": "马斯克：当前网络爆红的人形机器人演示都是远程遥控或剧本，Optimus 已投产并靠观察学习", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/070.htm", "date": "2026-07-24T03:44:04.000Z", "summary": "特斯拉 CEO 马斯克在 2026 财年第二财季电话会议上指出，当前网络爆红的人形机器人演示要么是剧本、要么是远程遥控，尚无任何一款机器人能真正完成通用任务。他同时宣布，Optimus 人形机器人已在美国加州弗里蒙特工厂投产，该机器人不依靠预先编程，而是通过观察环境视频和人类工作影像进行学习。", "type": "industry", "relTime": "1周前"}, {"id": 84, "title": "公安部：上半年共侦办利用 AI 工具生成网络谣言案件 170 余起", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/981/044.htm", "date": "2026-07-24T03:25:03.000Z", "summary": "公安部通报，今年上半年共侦办利用人工智能工具生成网络谣言案件 170 余起，依法查处 190 余人。公安机关同时开展人工智能应用服务监督检查 600 余次，对相关服务提供者进行警告、责令整改、关停等行政执法 30 余次。国家反诈中心 App 已上线人工智能内容鉴定功能，可检测可疑视频、语音、图片中是否存在 AI 生成痕迹。", "type": "industry", "relTime": "1周前"}, {"id": 85, "title": "Kimi K3与Claude Fable5成视频生成首选模型", "source": "X：Vista (@vista8)", "sourceUrl": "https://x.com/vista8/status/2080456617234227433", "date": "2026-07-24T00:54:45.000Z", "summary": "针对Hyperframe、remotion、manim生成的视频效果不佳的问题，建议改用Kimi K3或Claude Fable5模型。这些视频生成库依赖HTML页面渲染，而当前大模型前端审美能力最强的两个模型正是Kimi K3和Claude Fable5。", "type": "tip", "relTime": "1周前"}, {"id": 86, "title": "SceneActBench：VLM 智能体能否对所见 3D 场景执行操作？", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.22393", "date": "2026-07-24T00:00:00.000Z", "summary": "SceneActBench 是一个评估视觉语言模型（VLM）智能体在多物体 3D 场景中执行操作能力的基准。该基准包含 210 个源实例构建的 5 项任务、共 520 个测试用例，在统一的智能体-环境循环中通过任务特定几何指标评估最终输出。在 11 个闭源 VLM 配置上，总体得分区间为 38.6-50.2，没有任何模型在所有任务上表现一致。", "type": "paper", "relTime": "1周前"}, {"id": 87, "title": "ID-V2V：面向身份保持的视频重风格化生成框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.22830", "date": "2026-07-24T00:00:00.000Z", "summary": "Netflix 与 Eyeline Labs 提出 ID-V2V，将面部身份保持建模为视频重光照问题，通过重光照面部区域、法线图、编辑关键帧与深度序列等控制信号，在保留表情、视线与唇形同步的前提下，将编辑关键帧的风格变化传播至整段源视频。实验表明，该方法在面部相似度与细粒度表现保持上显著优于现有方法，支持单人与多人场景，代码已开源。", "type": "paper", "relTime": "1周前"}, {"id": 88, "title": "橘子的AI播客工作流：录完即发", "source": "X：Vista (@vista8)", "sourceUrl": "https://x.com/vista8/status/2080439916203548806", "date": "2026-07-23T23:48:23.000Z", "summary": "橘子分享了一套高效播客工作流：用Cola语音输入话题并提炼要点，用剪映录制并开启降噪、人声美化，导出后由Cola生成Shownotes即可上传。同时发布了5个AI Skill，包括视频剪辑、前端设计、AI PRD生成、Goal指令生成和服务器部署，均通过\\`npx skills add\\`安装。", "type": "tip", "relTime": "1周前"}, {"id": 89, "title": "FLUX 3 统一图像视频音频与机器人动作预测", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2080431253744968087", "date": "2026-07-23T23:13:58.000Z", "summary": "Black Forest Labs 发布 FLUX 3，一个统一多模态 backbone，同时处理图像生成、视频、原生音频，并扩展至机器人动作预测。视频已开放 early access，后续将开放权重，并已与 mimic、Audi 合作在真实机器人上测试。该模型旨在证明物理世界智能与内容创作可共享同一套视觉基础模型。", "type": "model", "relTime": "1周前"}, {"id": 90, "title": "Palmier Pro：专为 AI 打造的开源 macOS 视频编辑器", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://github.com/palmier-io/palmier-pro", "date": "2026-07-23T22:35:30.175Z", "summary": "Palmier Pro 是一款开源的 macOS 视频编辑器，专为 AI 工作流设计。它支持基于时间轴的视频编辑，并集成了 AI 功能以加速剪辑、生成字幕或处理素材。该项目已在 GitHub 上发布，面向开发者与视频创作者开放。", "type": "model", "relTime": "1周前"}, {"id": 91, "title": "FLUX 3 统一模型赋能机器人学习", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2080421078309175699", "date": "2026-07-23T22:33:32.000Z", "summary": "Black Forest Labs 发布 FLUX 3，一个统一处理图像、视频、音频和动作预测的多模态模型。其视频骨干网络通过大规模视频预训练学习物体运动、接触变形和时间因果，使机器人无需从零学习物理规律。基于 Self-Flow 架构，FLUX 3 能让机器人用约一半的微调数据学会任务，此前实验显示可减少高达 10 倍的训练数据。", "type": "tip", "relTime": "1周前"}, {"id": 92, "title": "Sonilo 发布 Sound Effects 1.0 视频原生音频模型", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2080415397866606809", "date": "2026-07-23T22:10:57.000Z", "summary": "Sonilo 推出 Sound Effects 1.0，一个视频原生音频模型，能读取画面运动、场景和节奏生成同步音效。该模型支持无需提示词的自动视频转音效，以及从文字描述生成独立音频。在对比基准测试中，Sonilo 在音乐和音效上均超越领先模型。", "type": "model", "relTime": "1周前"}, {"id": 93, "title": "AegisAI获3600万美元A轮融资，用AI智能体检测AI驱动的鱼叉式钓鱼攻击", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/23/aegisai-founded-by-former-google-security-execs-lands-36m-to-stop-ai-driven-spear-phishing", "date": "2026-07-23T18:38:34.000Z", "summary": "由前Google安全高管创立的AegisAI完成3600万美元A轮融资，累计融资4900万美元。该公司开发AI智能体，通过分析邮件细微异常来检测AI生成的鱼叉式钓鱼攻击，已获包括Mash、LangChain在内的数十家客户采用。", "type": "industry", "relTime": "1周前"}, {"id": 94, "title": "Black Forest Labs 发布 Flux 3：可生成带原生音频的 20 秒视频，并推出机器人动作模型 Flux-mimic", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/flux-3-generates-videos-with-native-audio-up-to-20-seconds-long-a-first-for-black-forest-labs", "date": "2026-07-23T18:03:01.000Z", "summary": "德国 AI 公司 Black Forest Labs 发布多模态基础模型 Flux 3，可同时从图像、视频和音频中学习，首次支持生成带原生音频、最长 20 秒的视频。", "type": "model", "relTime": "1周前"}, {"id": 95, "title": "Runway 推出首款生成媒体优化路由", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2080343130780655635", "date": "2026-07-23T17:23:47.000Z", "summary": "推出 Runway Media Router。  首个面向生成媒体的偏好优化路由。无需为每次请求手动挑选模型，你只需一次性定义\"最佳\"的标准--成本、质量或延迟--路由便会自动选择合适的视频、图像或音频模型。  现已上线 Runway Dev。", "type": "model", "relTime": "1周前"}, {"id": 96, "title": "Grok 凭代码口喷生成 4K 视频", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2080341822686015683", "date": "2026-07-23T17:18:36.000Z", "summary": "用户仅将一篇文章喂给 Grok，并让其制作 AI 预测底层逻辑视频，Grok 直接通过纯代码口喷一口气生成 4K 高清视频。整个过程无需额外工具或复杂操作，展示了 Grok 强大的代码生成与视频制作能力。", "type": "tip", "relTime": "1周前"}, {"id": 97, "title": "Runway 推出 Media Router，为生成式媒体自动选择最佳模型", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/23/runway-bets-on-ai-model-routing-as-generative-media-gets-crowded", "date": "2026-07-23T17:07:35.000Z", "summary": "Runway 通过其开发者平台 Runway Dev 推出 Media Router，该工具可根据开发者对质量、速度或成本的优先级，自动为图像、视频和音频生成请求选择最佳模型。Runway 称这是首个专为生成式媒体打造的模型路由器，其智能层基于内部创意团队对各类媒体输出的评估经验。此举标志着 Runway 从 AI 视频初创公司向生成式媒体基础设施层转型。", "type": "model", "relTime": "1周前"}, {"id": 98, "title": "FLUX 3 统一多模态，视频已开放早期访问", "source": "X：Emad Mostaque (@EMostaque)", "sourceUrl": "https://x.com/EMostaque/status/2080326079131128056", "date": "2026-07-23T16:16:02.000Z", "summary": "Black Forest Labs 发布 FLUX 3，一个统一架构的多模态模型，支持图像、视频、音频和动作预测。FLUX 3 Video 现已开放早期访问，模型还可扩展用于机器人动作预测。", "type": "model", "relTime": "1周前"}, {"id": 99, "title": "Claude Design 产品设计师 Nate Parrott 分享如何用其探索视觉创意", "source": "Claude：Blog（网页）", "sourceUrl": "https://claude.com/blog/how-the-product-designer-who-built-claude-design-uses-it-to-explore-ideas-before-building-them", "date": "2026-07-23T16:00:00.000Z", "summary": "Anthropic 产品设计师 Nate Parrott 分享了他在 Claude Design（beta 版）中利用 HTML 交互能力进行产品原型、幻灯片、动画等视觉创意探索与迭代的方法。他将 Anthropic 品牌规范提炼为提示词，使输出自动符合品牌指南。Claude Design 不包含图像模型，不适合 Logo 设计，但可与 Claude Code 协同工作，将早期创意与生产开发衔接。", "type": "tip", "relTime": "1周前"}, {"id": 100, "title": "社区将Kimi视觉编码器接入GLM 5.2，开源视觉版模型", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2080319812232941631", "date": "2026-07-23T15:51:08.000Z", "summary": "开发者将Kimi的MoonViT视觉编码器挂载到GLM 5.2上，组装出可用的视觉版本，并开源了NVFP4量化权重。该模型并非官方联合训练的多模态模型，而是将不同团队的视觉编码器与语言模型硬接，证明了\"插件式\"组装已具备实用效果。", "type": "model", "relTime": "1周前"}, {"id": 101, "title": "Flux 3 视频生成达前沿水平，支持音频与机器人动作预测", "source": "X：Deedy Das (@deedydas)", "sourceUrl": "https://x.com/deedydas/status/2080318330913869943", "date": "2026-07-23T15:45:15.000Z", "summary": "Black Forest Labs 发布 Flux 3，一个统一架构的多模态模型，覆盖图像、视频、音频和动作预测。其视频生成能力达到 Seedance 2 / Gemini Omni 级别，可生成约 20 秒带音频的视频，并已开放早期访问。Flux 3 还可扩展用于机器人动作预测，是当前唯一达到视频生成前沿水平的初创公司。", "type": "model", "relTime": "1周前"}, {"id": 102, "title": "Black Forest Labs 发布开源 Flux 3 视频模型", "source": "X：歸藏 (@op7418)", "sourceUrl": "https://x.com/op7418/status/2080317863400030312", "date": "2026-07-23T15:43:23.000Z", "summary": "Black Forest Labs 发布并开源 Flux 3 视频生成模型，支持文生视频、图生视频、视频参考生成、视频与音频延长、关键帧控制及智能剪辑等功能。Flux 3 Dev 模型已开放早期访问申请，API 将在未来几周开放，随后发布开源版本。", "type": "model", "relTime": "1周前"}, {"id": 103, "title": "Luma AI 生成服装自主决策视频", "source": "X：Luma AI (@LumaLabsAI)", "sourceUrl": "https://x.com/LumaLabsAI/status/2080287018135810315", "date": "2026-07-23T13:40:49.000Z", "summary": "穿得足够张扬，服装就会开始自己做决定。 由 Shan ul Haq 创作。使用 Luma 制作。", "type": "tip", "relTime": "1周前"}, {"id": 104, "title": "实测多模型IMO 2026满分，Qwen3.8-Max等三模型一次性通过", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2080283187721503170", "date": "2026-07-23T13:25:36.000Z", "summary": "博主实测GPT-SOL-5.6-High、Qwen3.8-Max-Preview、KIMI K3三个模型在IMO 2026大赛中均获满分42分，一次性解决全部6道题目。速度排序：GPT-SOL-5.6-High用时14分58秒，Qwen3.8-Max-Preview用时45分钟，Kimi K3用时1小时32分6秒。去年仅两个模型勉强得35分，今年多个主流模型已能稳定一次通过IMO。", "type": "tip", "relTime": "1周前"}, {"id": 105, "title": "马斯克：特斯拉 AI 投资越快越好，不怕部分资金浪费", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/828.htm", "date": "2026-07-23T12:14:39.000Z", "summary": "特斯拉 CEO 马斯克要求公司加快 AI 投资节奏，即使部分资金被浪费也在所不惜。特斯拉第二季度资本支出同比大增 142% 至 58 亿美元，自由现金流净流出 11 亿美元，为 2024 年以来首次转负。公司预计全年资本支出超 250 亿美元，并寻求最高 300 亿美元的借款能力以支撑 AI 算力、Cybercab 自动驾驶出租车和 Optimus 人形机器人等项目建设。", "type": "industry", "relTime": "1周前"}, {"id": 106, "title": "FLUX 3 全模态模型预告，支持 20 秒视频生成", "source": "X：歸藏 (@op7418)", "sourceUrl": "https://x.com/op7418/status/2080264515682496991", "date": "2026-07-23T12:11:24.000Z", "summary": "黑森林工作室短暂上线 FLUX 3 预告，该模型支持图像、视频、音频和动作生成，是一个全模态生成模型，单条视频可一次生成 20 秒。按惯例该模型可能开源，若开源将利好整个生态。", "type": "model", "relTime": "1周前"}, {"id": 107, "title": "2026 美团低空经济与具身智能挑战赛启动，总奖金 55 万元", "source": "公众号：龙猫LongCat（美团）", "sourceUrl": "https://mp.weixin.qq.com/s/P5YmxTk3il67UOfh4queiw", "date": "2026-07-23T11:58:00.000Z", "summary": "2026 年第四届美团低空经济与具身智能挑战赛启动报名，面向全球高校在校学生，总奖金 55 万元。赛事以无人机换电任务为原型，考察机器人在视觉识别、运动规划、精准操作等方面的综合能力，参赛设备形态不限。初赛需提交机器人演示视频与技术报告，决赛为线下实机挑战，表现优异者可获美团无人机实习机会及\"北斗计划\"直通面试权。", "type": "industry", "relTime": "1周前"}, {"id": 108, "title": "腾讯设计Agent\"设计妙境 Miora\"上线，可完成品牌全案设计", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s/wTI00g8lar2eLSgXAFAgBQ", "date": "2026-07-23T11:47:01.000Z", "summary": "腾讯推出首个设计Agent\"设计妙境 Miora\"，覆盖品牌设计、电商广告、3D建模、App UI、TVC等13个场景。Miora具备记忆功能，能持续记住用户审美偏好，并支持将完整流程保存为可复用的Skill。实测中，Miora从Logo、品牌手册到产品外观、包装、IP周边、45平方米体验店、配套App、电商详情页及30秒TVC和带货视频，全流程自主生成。", "type": "product", "relTime": "1周前"}, {"id": 109, "title": "谷歌推出\"自拍视频\"功能，允许用户通过自拍视频登录和恢复账号", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/806.htm", "date": "2026-07-23T10:48:47.000Z", "summary": "谷歌推出\"自拍视频（Selfie Video）\"功能，允许用户提前录制一段包含指定头部动作的短视频，在无法使用传统方式时通过人脸匹配和活体检测验证身份，以恢复账号访问权限。该功能从今天起陆续开放，暂不支持 Google Workspace 企业账号、儿童账号及高级保护计划账号。自拍视频存储时经过加密，用户可随时删除，并可自行决定是否授权谷歌使用视频数据改进身份验证技术。", "type": "paper", "relTime": "1周前"}, {"id": 110, "title": "阿里云WAIC AI视频创作赛获奖作品发布", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2080226902942630348", "date": "2026-07-23T09:41:57.000Z", "summary": "作为 WAIC 的一部分，阿里云自豪地主办了一场 AI 视频创作者马拉松，汇聚创作者共同探索 AI 短片的边界。  我们很高兴分享首个获奖作品--完全使用我们的 AI 视频生成模型 Happyhorse 制作。其卓越的一致性和细节有力地证明了当今 AI 工具所能实现的可能。", "type": "industry", "relTime": "1周前"}, {"id": 111, "title": "荣耀官宣全球首款机器人手机 Robot Phone，8 月见", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/754.htm", "date": "2026-07-23T09:41:13.000Z", "summary": "荣耀今日宣布全球首款机器人手机--荣耀 Robot Phone 将于 8 月发布，宣称\"打破手机固有形态\"。该机搭载第五代骁龙 8 至尊版芯片，机身顶部集成行业最小的四自由度钛合金机械云台系统，体积比主流方案缩小 70%。荣耀 Robot Phone 还将首发新一代伙伴型多模态智能体操作系统 AgenticOS 的内核。", "type": "paper", "relTime": "1周前"}, {"id": 112, "title": "Dreamina Seedance 2.0 4K 生成 13 分钟科幻短片", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2080218848087679199", "date": "2026-07-23T09:09:56.000Z", "summary": "Dreamina Seedance 2.0 4K 已能生成生产级视频。导演 Neill Blomkamp 用该工具纯文本生成了 13 分钟科幻恐怖短片《Nightborne》，每帧均由提示词驱动，并使用了 32 人的授权肖像与声音。Blomkamp 称这是长片测试，并预期 Seedance 2.5 将带来质的飞跃。", "type": "tip", "relTime": "1周前"}, {"id": 113, "title": "阿里云发布Qwen-Image-3.0：主打\"真实\"的图像生成模型", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2080218126264778781", "date": "2026-07-23T09:07:04.000Z", "summary": "阿里云推出第三代图像生成基础模型Qwen-Image-3.0，核心关键词为\"真实\"。该模型支持4.5k token长提示词，可一次性生成复杂版面（如报纸、考卷、3×3信息图），文字清晰至10px，并支持12种语言原生渲染、100+艺术风格及实时网络检索。", "type": "model", "relTime": "1周前"}, {"id": 114, "title": "特斯拉 App 代码暗示已开始为 Optimus 人形机器人上线做准备", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/629.htm", "date": "2026-07-23T07:08:36.000Z", "summary": "特斯拉手机 App 中首次出现多项与 Optimus 项目相关的代码，包括专门面向机器人的蓝牙低功耗（BLE）身份认证机制，以及适用于家庭场景的数据采集功能。用户可将手机添加至机器人设备授权白名单，只有经过授权的设备才能与 Optimus 通信和控制。未来 Optimus 执行家务任务时，App 将弹出页面征求用户授权，采集视频和空间环境数据用于优化智能模型。", "type": "industry", "relTime": "1周前"}, {"id": 115, "title": "荣耀发布全新品牌标识\"荣耀之环\"及主张\"敢想，敢不同\"，阿尔法战略508天后公布Robot Phone等进展", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/627.htm", "date": "2026-07-23T07:01:35.000Z", "summary": "荣耀终端CEO李健今日正式揭晓全新品牌图形标识\"荣耀之环\"及品牌主张\"敢想，敢不同\"。508天前开启的阿尔法战略已取得进展：打造了荣耀Robot Phone，使智能体手机迈向三维物理世界；在具身智能领域推出机器人闪电和元气仔，超越人类半马世界纪录；并与阿莱展开影像战略合作。", "type": "industry", "relTime": "1周前"}, {"id": 116, "title": "Grok Build v0.2.111 更新：开发者控制增强", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2080170228554903796", "date": "2026-07-23T05:56:44.000Z", "summary": "xAI 发布 Grok Build v0.2.111 更新，开发者现可通过 config.toml 或环境变量禁用图像与视频生成工具。新版本在 TUI 内直接支持 \\`grok doctor fix\\` 诊断命令，\\`/session-info\\` 可显示 OAuth 或 API key 账户信息。此外修复了多项会话可靠性问题，并降低了 macOS 语音模式的显存占用。", "type": "product", "relTime": "1周前"}, {"id": 117, "title": "DeepSeek 梁文锋：产品是AGI副产品，代码与通用Agent优先", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2080160617667985438", "date": "2026-07-23T05:18:33.000Z", "summary": "DeepSeek 创始人梁文锋在投资者会议上阐述其核心原则：产品只是通往 AGI 路上的副产品，当前不以营收为重心；3D/视频生成及世界模型不在主计划内，多模态仅作为产品组件而非核心智能。公司优先投入代码与通用 AI 智能体，行业专用智能体可暂缓，模型幻觉被视为长期产品问题而非当前重点。", "type": "tip", "relTime": "1周前"}, {"id": 118, "title": "马斯克宣布用 AI 工具 Grok Imagine 拍摄《奥德赛》长篇电影，全白人班底确保\"符合史实\"", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/391.htm", "date": "2026-07-23T01:37:04.000Z", "summary": "埃隆·马斯克在 X 上表示，计划在 2026 年底前用自家 AI 视频生成工具 Grok Imagine 制作一部完整的《奥德赛》长篇电影。他称影片将\"符合史实，并忠于荷马的艺术作品\"，并转发了一段 AI 生成的场景视频。马斯克未公布具体制作方式、影片时长或 Grok Imagine 如何维持长片一致性等细节。", "type": "industry", "relTime": "1周前"}, {"id": 119, "title": "Muse Spark 1.1 3D游戏生成成本仅为Gemini 3.6三分之一", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2080086690660851837", "date": "2026-07-23T00:24:47.000Z", "summary": "Meta的Muse Spark 1.1在生成自运行3D街机游戏任务中，以31.3K token、0.026美元的成本击败Gemini 3.6（28.8K token、0.073美元），成本仅为后者三分之一。Muse Spark 1.1完美生成了台球、冰球和桌上足球三款游戏，细节丰富；而Gemini 3.6的冰球出现故障，桌上足球则卡顿成静态画面。", "type": "tip", "relTime": "1周前"}, {"id": 120, "title": "SANA-Video 2.0：混合线性注意力与注意力残差实现高效视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21553", "date": "2026-07-23T00:00:00.000Z", "summary": "SANA-Video 2.0 是一个混合视频扩散 Transformer，提供 5B 和 14B 两种规模，可在单 GPU 上生成最高 720p 视频。其 Hybrid Linear-Softmax Attention 以 3：1 比例混合线性与 softmax 注意力，配合 Block Attention Residuals 将深层有效秩提升约 12%。", "type": "paper", "relTime": "1周前"}, {"id": 121, "title": "从视频中自监督学习结构化动态：SDM 模型分离相机与物体运动", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21576", "date": "2026-07-23T00:00:00.000Z", "summary": "研究提出结构化动态模型（SDM），通过未来特征预测从冻结的预训练图像 Transformer 特征中显式分离视频中的主运动（相机运动）与残余动态（物体运动）。训练结合真实视频自监督学习与合成 Kubric 数据的弱监督。在 ProbeMotion 评测集上，SDM 优于使用全局 CLS 或平均池化特征的基线，并在多项任务上媲美强监督的 VGGT 表示。", "type": "paper", "relTime": "1周前"}, {"id": 122, "title": "VCSD：视觉对比自蒸馏", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21556", "date": "2026-07-23T00:00:00.000Z", "summary": "杜克大学和MBZUAI提出VCSD，通过对比同一EMA教师模型在原始图像与内容擦除条件下的token级log-probability差异，构建纯输入条件驱动的自蒸馏不对称信号。在ViRL39K数据集上，VCSD在Qwen3-VL和Qwen3.5模型（2B至9B）的七个视觉语言基准测试中一致优于匹配的on-policy自蒸馏方法，且无需外部教师、特权答案或额外推理成本。", "type": "paper", "relTime": "1周前"}, {"id": 123, "title": "Recurrent Sinusoidal INRs：循环正弦隐式神经表示实现高效高保真图像与3D重建", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21485", "date": "2026-07-23T00:00:00.000Z", "summary": "一项研究提出循环正弦隐式神经表示（INRs）架构，通过共享正弦块迭代细化潜在表示来丰富谐波频谱。在RGB图像基准上，该方法以更少的参数和优化步骤实现了比前馈基线更高的保真度，并有效迁移至超分辨率、NeRF和SDF任务。", "type": "paper", "relTime": "1周前"}, {"id": 124, "title": "ProVisE：在生成像素中评估空间认知而非LLM文本", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21072", "date": "2026-07-23T00:00:00.000Z", "summary": "研究者提出ProVisE框架，让图像生成模型输出协议约束的视觉答案，并解析为结构化预测以兼容原有评测指标。同时发布SpatialGen-Bench，含470个样本、14项空间子任务和四个能力层级。评估显示，图像生成模型在像素空间任务上有竞争力，而文本输出VLM在组合空间推理上仍占优势。", "type": "paper", "relTime": "1周前"}, {"id": 125, "title": "WorldWeaver：流式多智能体扩散模型引入世界状态寄存器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21594", "date": "2026-07-23T00:00:00.000Z", "summary": "WorldWeaver 提出一种流式多智能体视频扩散模型，通过可学习的\"世界状态寄存器\"token 在生成过程中跨智能体持久化并动态更新共享世界信息。该寄存器融合了智能体状态、鸟瞰视图和场景文本等多重监督信号，并采用 Mixture-of-Transformers 架构分离世界状态建模与视觉帧生成的权重。", "type": "paper", "relTime": "1周前"}, {"id": 126, "title": "TableVerse：面向通用机器人操作的百万级真实桌面场景数据集", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21017", "date": "2026-07-23T00:00:00.000Z", "summary": "TableVerse 提出全自动 Real2Sim 管线，将非结构化网络图像直接转化为高保真、可物理仿真的桌面环境，并自动合成无碰撞的抓取轨迹。基于该管线构建的 TableVerse-100K 数据集包含 10 万个物理一致的交互场景、近 100 万个独立物体实例和超过 3.5 万个语义类别，为通用机器人操作策略学习提供大规模数据基础。", "type": "paper", "relTime": "1周前"}, {"id": 127, "title": "GraphVid：基于交互图的可控视频生成模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21580", "date": "2026-07-23T00:00:00.000Z", "summary": "GraphVid 是一种图条件图像到视频生成模型，通过结构化交互图实现对多主体的灵活精确控制。相比 Motion-I2V，GraphVid 在 FID 上降低 39.9%、FVD 降低 37.6%，PSNR 从 9.87 提升至 15.98、SSIM 从 0.38 提升至 0.61，且训练数据和参数更少。配套发布的 GraphVid-Bench 数据集为交互感知视频生成提供了大规模结构化关系标注。", "type": "paper", "relTime": "1周前"}, {"id": 128, "title": "无需训练的闭环一致性：自回归生成渲染中的重访一致性方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21848", "date": "2026-07-23T00:00:00.000Z", "summary": "针对自回归视频生成模型在相机重访场景下因KV缓存有限导致外观不一致的问题，提出一种无需后训练的零样本方法。该方法利用3D引擎提供的时序与空间对应关系，将姿态匹配的历史潜在块检索到KV缓存中作为闭环记忆，并通过相机姿态与深度重投影的空间对应关系偏置token级注意力。在TartanAir和TartanGround数据集上，该方法在不损失整体视频质量的前提下，在重访一致性上优于现有零样本基线。", "type": "paper", "relTime": "1周前"}, {"id": 129, "title": "Qwen-Image-3.0 发布：主打\"真实\"与细腻人像", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2080074549761028386", "date": "2026-07-22T23:36:33.000Z", "summary": "阿里通义千问发布第三代图像生成模型 Qwen-Image-3.0，核心关键词为\"实\"。模型支持 4.5k token 提示词，可一次生成复杂排版（报纸、试卷、3×3 信息图），文字清晰度达 10px，并具备 12 种语言原生渲染与实时网页检索能力。博主 Berry Xia 实测认为其人像和古典美学表现非常符合国人审美。", "type": "model", "relTime": "1周前"}, {"id": 130, "title": "马斯克：Optimus 将是史上最大产品，量产难度极高", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2080065417473905040", "date": "2026-07-22T23:00:15.000Z", "summary": "马斯克称，Optimus 人形机器人将成为史上最大产品，但实现无需编程、仅靠指令或视频即可执行任务的自主机器人是前所未有的难题。机器人需具备极高灵巧性、可靠性及耐用性，而特斯拉需从零建立供应链，所有部件均为全新设计，量产爬坡难度远超以往任何产品。", "type": "tip", "relTime": "1周前"}, {"id": 131, "title": "梁文锋投资人会议语录：AGI路线图与持续学习", "source": "X：Oran Ge (@oran_ge)", "sourceUrl": "https://x.com/oran_ge/status/2080050390868119750", "date": "2026-07-22T22:00:33.000Z", "summary": "梁文锋在投资人会议上阐述 DeepSeek 的 AGI 路线图，认为当前阶段最重要的是 Coding Agent，而多模态、3D 生成等并非智能核心。他指出下一代模型必须具备持续学习能力，这是实现 AGI 的关键阶梯。DeepSeek 坚持低利润、开源与克制战略，认为中国 AI 的差距主要在资源而非人才，并预测国内模型公司最终将收敛至两三家。", "type": "tip", "relTime": "1周前"}, {"id": 132, "title": "Grok Build 上线，可调用 Grok 4.5 构建 3D 场景", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2080049853036728541", "date": "2026-07-22T21:58:25.000Z", "summary": "Elon Musk 宣布推出 Grok Build，用户可通过该工具在终端中调用 Grok 4.5 模型。开发者 Daniel Farinax 利用 Grok Build 安装了 Unity 免费 CLI，成功构建 3D 场景并导出视频，还在同一会话中创建了可玩的 macOS 岛屿探索游戏。Unity CLI 支持 MCP 模式且免费，无并发限制。", "type": "model", "relTime": "1周前"}, {"id": 133, "title": "七款前沿模型\"鹈鹕骑自行车\"基准测试未发现针对性优化", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://dylancastillo.co/posts/pelicanmaxxing.html", "date": "2026-07-22T19:39:51.177Z", "summary": "一项针对GPT-5.6 Terra等七款模型的对比实验显示，这些模型在\"鹈鹕骑自行车\"这一知名非正式基准测试上并未表现出针对性优化。研究者生成1，008张SVG图像，经评分发现鹈鹕在8种动物中排名第6，自行车在6种交通工具中排名第5，两者组合在48个提示中仅列第42位。", "type": "tip", "relTime": "1周前"}, {"id": 134, "title": "Monday.com 裁员数百人，聚焦 AI 工作平台", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/22/monday-com-lays-off-hundreds-to-focuses-on-ai", "date": "2026-07-22T17:54:14.000Z", "summary": "以色列办公软件公司 Monday.com 宣布裁员约 630 人（占员工总数 20%），以支持更精简的运营模式，并将投资重心转向 AI 项目。其 AI Work Platform 目前包含无代码应用构建器、可定制 AI 智能体、工作流自动化工具及能生成报告、更新仪表盘的聊天机器人。公司预计此次重组将产生 4500 万至 5500 万美元的费用。", "type": "industry", "relTime": "1周前"}, {"id": 135, "title": "梁文锋四小时投资人会议实录：DeepSeek 的克制战略与 AGI 路线图", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/elsewhere/wenfeng-liangs-four-hour-investor-meeting-full-transcript", "date": "2026-07-22T15:33:15.000Z", "summary": "DeepSeek 创始人梁文锋在投资人会议上明确表示，公司主线只有 AGI，不做 3D、视频生成、世界模型或下一个超级 App，并坚持开源与合理定价。他认为模型竞争的核心是成本、时间与用户体验，而保持团队稳定性是做成 AGI 的关键。梁文锋称，DeepSeek 离彻底转向商业化仍很遥远，开源与克制是增加 AGI 成功概率的战略选择。", "type": "tip", "relTime": "1周前"}, {"id": 136, "title": "可灵 MCP 教程：快速打造电影级 AI 表演", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2079944555718435124", "date": "2026-07-22T15:00:00.000Z", "summary": "可灵 MCP 教程：几分钟内打造电影级 AI 表演  了解如何使用可灵 MCP 在你喜爱的智能体中构建完整的创意工作流--从角色创建、情感设计到批量视频生成。  你的下一个故事从这里开始。", "type": "tip", "relTime": "1周前"}, {"id": 137, "title": "Grok 4.5 纯代码生成视频，速度质量碾压", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2079933815984689564", "date": "2026-07-22T14:17:19.000Z", "summary": "用户实测 Grok 4.5 纯代码生成视频，速度快、质量高、成本低，一次生成即输出 MP4 格式，效果媲美 Claude Code。将文章内容喂给模型后几分钟内自动完成，认为打磨后效果更惊人。", "type": "tip", "relTime": "1周前"}, {"id": 138, "title": "实测Qwen-Image-3.0：19大场景挑战GPT Image2，中文长文本与多图融合表现亮眼", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s/PnXGmmDYejrHBSpoRBOHkg", "date": "2026-07-22T12:34:24.000Z", "summary": "Qwen-Image-3.0上线，支持最高4.5k token输入、12种语言、20多种字体，以及多图融合、图中图和图片编辑。实测显示，其在中文长文本生成、多语言混合排版、UI设计、多图融合与图片编辑等19个场景中均能稳定输出，文字不崩且信息对应准确，图片质量已能与GPT Image2媲美。该模型在国内可直接使用，速度快且价格不贵。", "type": "tip", "relTime": "1周前"}, {"id": 139, "title": "通义千问发布Qwen-Image-3.0：主打\"真实\"的第三代图像生成模型", "source": "X：通义千问 / Qwen (@Alibaba_Qwen)", "sourceUrl": "https://x.com/Alibaba_Qwen/status/2079906336381509659", "date": "2026-07-22T12:28:08.000Z", "summary": "通义千问发布第三代图像生成模型Qwen-Image-3.0，核心关键词为\"真实\"。模型支持最长4.5k token的提示词，可一次性生成复杂布局（如报纸、试卷、3×3信息图），并能渲染10px级文字、完整LaTeX论文页面及逼真皮肤纹理。它还支持12种语言、100多种艺术风格，并具备实时网络检索能力，旨在成为设计、教育等领域的实用生产力工具。", "type": "paper", "relTime": "1周前"}, {"id": 140, "title": "Luma AI 生成舞者悲伤舞台表演视频", "source": "X：Luma AI (@LumaLabsAI)", "sourceUrl": "https://x.com/LumaLabsAI/status/2079899268492743050", "date": "2026-07-22T12:00:02.000Z", "summary": "一位舞者，一个绿色舞台，一场充满悲伤的表演。随后舞台消失，雪花飘入，情感扑面而来。作者：Dinda Prasetyo。使用 Luma 制作。", "type": "industry", "relTime": "1周前"}, {"id": 141, "title": "Meta 推出 AI 检测系统 Content Seal，但可用性不及 Google 的 SynthID", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/968680/meta-ai-detection-labeling-content-seal-watermarks-synthid", "date": "2026-07-22T11:00:00.000Z", "summary": "Meta 于 7 月推出 Content Seal，为旗下 Muse 模型生成的图像添加不可见水印，但用户目前仅能通过专用网页工具检测，且不支持视频和旧模型。与 Google 已向 OpenAI 开放的 SynthID 相比，Content Seal 功能相似但可用性更差，Meta 也未将检测能力集成到 Meta AI 聊天机器人中。", "type": "tip", "relTime": "1周前"}, {"id": 142, "title": "16岁少年造出仿生海龟机器人，AI识别微塑料准确率达94%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/247.htm", "date": "2026-07-22T10:10:00.000Z", "summary": "16岁的埃文·巴兹（Evan Budz）设计并制造了一款自主海龟机器人，搭载水下三维全息成像系统和自训练的AI模型，能以94%的准确率区分水体中的微塑料和其他微小颗粒。该机器人在2026年Regeneron国际科学与工程大奖赛（ISEF）上获得5万美元奖学金。巴兹表示，该系统可直接在水中完成检测，无需将样本送回实验室，旨在让微塑料检测更快、更普及。", "type": "tip", "relTime": "1周前"}, {"id": 143, "title": "小红书开源 BigMac：多模态大模型训练新范式", "source": "公众号：小红书技术（dots.llm）", "sourceUrl": "https://mp.weixin.qq.com/s/tNJARtn1jIayL5URg87Row", "date": "2026-07-22T10:04:51.000Z", "summary": "小红书技术团队开源 BigMac，一种针对多模态大模型训练的依赖安全嵌套流水线新范式。它以 LLM 流水线为主干，在不打乱执行顺序的前提下嵌入编码器和生成器计算，相比基线实现 1.08x-1.9x 加速，同时保持激活显存有界。BigMac 已作为 dots 多模态模型训练的核心组件投入生产。", "type": "model", "relTime": "1周前"}, {"id": 144, "title": "面壁智能与吉利联合发布具身智能体框架 RoboHarness", "source": "公众号：面壁智能（MiniCPM）", "sourceUrl": "https://mp.weixin.qq.com/s/nHoaGWCusQt6WQ1xmR_W3g", "date": "2026-07-22T09:55:25.000Z", "summary": "面壁智能与吉利人工智能中心在 WAIC 2026 联合发布具身智能体框架 RoboHarness，基于 EmbodiedClaw 开发，集成 VLM 与 VLA 模型。该框架已在吉利生产仓储场景实现常态化作业，支持自主决策与失败重试，并依托吉利星睿智算中心（23.5 EFLOPS）训练。", "type": "model", "relTime": "1周前"}, {"id": 145, "title": "英伟达推出 SVD 服务，识别 AI 生成视频准确率最高达 92%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/086.htm", "date": "2026-07-22T07:50:33.000Z", "summary": "英伟达发布合成视频检测器（SVD）服务，识别 AI 生成视频的准确率最高达 92%。该服务已整合到 NIM 中，通过逐帧分析视频，利用 Meta 的 DINOv2 和 DINOv3 模型为每帧打分，最终生成百分制评分。在 Nvidia RTX GPU 上处理一段 1080p 视频仅需 22 毫秒，50% 压缩率下仍能维持 82% 准确率。", "type": "model", "relTime": "1周前"}, {"id": 146, "title": "生数科技骆怡航：通用世界模型是连接数字与物理智能的关键基础设施", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s/KCCnHyK3My9lJrK9T-blQQ", "date": "2026-07-22T07:16:42.000Z", "summary": "生数科技联合创始人骆怡航在WAIC 2026提出，通用世界模型需像大语言模型一样建立统一基座，实现感知、预测与行动的闭环。公司围绕该基座构建\"一体两翼\"产品体系：Vidu Q系列面向数字内容生成，Vidu S系列推动实时交互，Motubrain面向物理世界机器人控制。世界模型正从学术研究走向产业中心，成为AI理解并行动于真实世界的关键路径。", "type": "tip", "relTime": "1周前"}, {"id": 147, "title": "Substack 导入 AI 检测工具 Pangram：用户可了解内容 AI 生成比例", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/980/040.htm", "date": "2026-07-22T07:02:02.000Z", "summary": "独立创作者平台 Substack 导入 AI 检测工具 Pangram，读者可借此了解平台内容中真人创作与 AI 辅助撰写的比例。Substack 指出，真正的问题在于 AI 生成内容被伪装为人类创作，并将此现象称为\"Claudefishing\"。平台还推出了创作过程说明、发布前 Pangram 审核等工具，并考虑提供回复与推荐内容的 AI 偏好设置。", "type": "paper", "relTime": "1周前"}, {"id": 148, "title": "腾讯设计Agent Miora全量上线，支持品牌VI与多模型", "source": "X：卡兹克 (@Khazix0918)", "sourceUrl": "https://x.com/Khazix0918/status/2079823300466012438", "date": "2026-07-22T06:58:10.000Z", "summary": "腾讯设计Agent平台Miora正式全量开放，无需邀请码。它提供品牌设计、影视创意、电商广告、互动游戏、网页应用五大场景模式，内置Skill模板和画板编辑功能。Agent底模分Standard/Pro/Max三档，可调用GPT-image、Seedance、可灵等多模态模型，支持框选编辑、文字替换及自定义Skill发布。", "type": "tip", "relTime": "1周前"}, {"id": 149, "title": "AI游戏《奥德赛》成本仅为诺兰电影的百万分之一", "source": "X：Vista (@vista8)", "sourceUrl": "https://x.com/vista8/status/2079793236231774617", "date": "2026-07-22T04:58:42.000Z", "summary": "创作者用Yoroll平台花费约250美元、2天时间，将《奥德赛》改编成40分钟可玩的AI互动剧情游戏。相比诺兰2.5亿美元的电影制作成本，百万倍的成本差距正改变内容创作的门槛。游戏支持对话式选择生成不同剧情走向，画面宏大，适合边玩边学英语。", "type": "paper", "relTime": "1周前"}, {"id": 150, "title": "用 GPT-5.6、Claude、Gemini 和 Grok \"绘制\"《蒙娜丽莎》--AI 图像生成能力实测", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.tryai.dev/blog/ai-drawing-arena-colored-pencils-claude-gpt-grok", "date": "2026-07-22T04:52:13.376Z", "summary": "开发者使用 GPT-5.6、Claude、Gemini 和 Grok 分别尝试\"绘制\"《蒙娜丽莎》，对比各模型的图像生成效果。测试展示了不同 AI 在艺术风格还原、细节处理上的差异，GPT-5.6 在构图准确性上表现突出，而 Claude 和 Gemini 各有侧重。该实验为评估多模态模型的视觉创作能力提供了直观参考。", "type": "tip", "relTime": "1周前"}, {"id": 151, "title": "商汤 SenseNova-Vision 开源统一视觉模型", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2079784489199518131", "date": "2026-07-22T04:23:57.000Z", "summary": "商汤发布 SenseNova-Vision，一个通过自然语言提示词即可完成检测、分割、深度估计、OCR、3D 重建等多项视觉任务的统一模型，无需串联多个专用工具。该模型在关键基准上超越近期统一视觉方案，并已完全开源（权重、数据、代码、Demo、论文）。", "type": "paper", "relTime": "1周前"}, {"id": 152, "title": "通义发布 Qwen-Image-3.0，支持多语言与复杂指令渲染", "source": "X：小互 (@xiaohu)", "sourceUrl": "https://x.com/xiaohu/status/2079762971123953976", "date": "2026-07-22T02:58:27.000Z", "summary": "通义千问发布 Qwen-Image-3.0 图像生成模型。该模型支持 12 国语言原生渲染、100+ 艺术风格，并能根据 4.5k token 的复杂指令一次性生成九张信息图或一整版报纸。它还具备网页、游戏、直播界面仿真能力，并可联网获取最新世界知识。", "type": "model", "relTime": "1周前"}, {"id": 153, "title": "三菱电机与索尼半导体将设立制造业 AI 视觉传感器合资企业 Advanced Vision Solutions", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/935.htm", "date": "2026-07-22T02:40:18.000Z", "summary": "三菱电机与索尼半导体解决方案宣布达成最终协议，共同设立合资企业 Advanced Vision Solutions，瞄准制造业 AI 视觉传感器解决方案领域。该合资企业计划于 2026 年 10 月开始运营，将结合索尼的图像传感器与边缘 AI 技术，以及三菱电机的自动化控制系统经验，开发集成在图像传感器上的 AI 分析系统，以加速制造业决策和控制流程。", "type": "industry", "relTime": "1周前"}, {"id": 154, "title": "ENTRAP-VL：面向视觉语言模型双重上下文牵引的分类探测工具", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.20092", "date": "2026-07-22T00:00:00.000Z", "summary": "研究团队提出ENTRAP-VL，一个手动标注的1，500项数据集，按八类上下文条件组织，用于探测视觉语言模型（VLM）中的双重上下文牵引现象--即模型被输入中辅助上下文（无论是否相关、真实或有意义）拉偏输出的倾向。该工具覆盖文本牵引（八种条件）和视觉牵引（三种条件）两个流，并引入\"矛盾性\"与\"反事实\"的区分，这是纯文本基准无法捕捉的。数据集及文档将公开发布。", "type": "paper", "relTime": "1周前"}, {"id": 155, "title": "Trace：基于分类学引导的多领域视觉推理环境", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19790", "date": "2026-07-22T00:00:00.000Z", "summary": "研究团队提出Trace，一种通过场景语法与可执行任务程序分离视觉实现与答案计算的视觉推理环境，覆盖277个场景语法、11个视觉领域共1000项任务。在64，000个Trace实例上进行RLVR训练后，Qwen2.5-VL-3B在24个外部基准上的宏平均提升3.51个百分点，Qwen2.5-VL-7B提升4.06个百分点，证明广泛的过程性训练可迁移至生成任务分布之外。", "type": "paper", "relTime": "1周前"}, {"id": 156, "title": "Self Gradient Forcing：原生长视频外推方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.20368", "date": "2026-07-22T00:00:00.000Z", "summary": "研究者提出Self Gradient Forcing（SGF）双阶段训练策略，通过并行上下文梯度重建，让未来帧损失监督历史KV缓存写入，解决了自回归视频扩散训练中的历史上下文梯度缺口。仅用5秒训练窗口，SGF即可外推生成持续数分钟的视频，在主体身份、背景一致性和时间稳定性上显著优于Self Forcing。", "type": "paper", "relTime": "1周前"}, {"id": 157, "title": "SeededGrasp：面向复杂场景与多机械臂的语言引导抓取框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.20207", "date": "2026-07-22T00:00:00.000Z", "summary": "研究者提出 SeededGrasp，一种数据高效的模块化框架，利用 VLM 零样本预测抓取种子点，再交由轻量级流匹配模型生成具体抓取姿态，将高层语义推理与底层几何执行解耦。该方法无需端到端训练即可支持多机械臂，在 610 个杂乱场景、334 个物体、3 种夹爪的合成数据集（含 256 万次抓取）上训练，仿真成功率达 72%，真实实验成功率达 78%。项目已开源代码与数据。", "type": "paper", "relTime": "1周前"}, {"id": 158, "title": "G-MAD：基于Arma3的多视角RGB-T航空目标检测数据生成框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19942", "date": "2026-07-22T00:00:00.000Z", "summary": "G-MAD是一个开源框架，利用游戏Arma3生成同步的多视角RGB-T（可见光-热成像）数据，用于航空目标检测。该框架支持结构化场景配置、可控多视角相机部署、同步可见光/热成像捕获，并利用引擎级几何元数据自动生成边界框标注。基于G-MAD构建的AMOD基准数据集已开源发布，可用于视角变化、多模态融合及合成到真实迁移的研究。", "type": "paper", "relTime": "1周前"}, {"id": 159, "title": "ATSplat：自适应 token 扩展的紧凑前馈 3D 高斯泼溅", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.20417", "date": "2026-07-22T00:00:00.000Z", "summary": "ATSplat 提出一种前馈 3D 高斯泼溅框架，通过自适应 3D token 恢复场景级容量分配能力。该方法从稀疏 3D 锚点 token 出发，根据渲染误差选择性扩张高不确定性区域。在 RealEstate10K 和 DL3DV 数据集上，ATSplat 以仅 311K 高斯体实现 SOTA 渲染质量，12 张输入图像下重建耗时不到 1 秒，渲染速度达 1136 FPS。", "type": "paper", "relTime": "1周前"}, {"id": 160, "title": "Robostral Navigate：8B视觉语言模型实现单目RGB导航", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.20785", "date": "2026-07-22T00:00:00.000Z", "summary": "Robostral Navigate是一个8B参数视觉语言模型，仅通过单目RGB图像流预测导航航点，无需深度传感器或多相机系统，可跨轮式、足式与飞行机器人部署。在R2R-CE基准上，它以77.4%的成功率超越最佳单目方法10.5个百分点，并超过依赖深度或多相机的系统5.3个百分点。", "type": "paper", "relTime": "1周前"}, {"id": 161, "title": "ReferTrack：将具身视觉跟踪分解为\"指认再追踪\"的VLA模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.20061", "date": "2026-07-22T00:00:00.000Z", "summary": "ReferTrack提出\"指认再追踪\"范式，先从前视图像中检测并索引边界框，再用单个Refer-CoT token选择目标，然后解码跟踪路径点。在EVT-Bench上，单目标、干扰和模糊跟踪分项成功率分别达89.4%、73.3%和74.1%，达到单视图SOTA，部分指标超越多摄像头基线。代码已开源。", "type": "paper", "relTime": "1周前"}, {"id": 162, "title": "Molt：面向智能体强化学习的可扩展 PyTorch 原生训练框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.21653", "date": "2026-07-22T00:00:00.000Z", "summary": "Molt 是一个 PyTorch 原生训练框架，通过一个异步循环训练多模态和混合专家策略，确保每个训练 token 均为模型生成且语义一致。在匹配的全异步协议下，其吞吐性能与基于 Megatron 的 SOTA 堆栈相当。该框架已开源，并提供配方和容器。", "type": "paper", "relTime": "1周前"}, {"id": 163, "title": "《第九区》导演 Blomkamp 发布 AI 短片《Nightborne》，全片由字节跳动 Seedance 2.0 生成", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/entertainment/968703/neill-blomkamps-nightborne-barley-studios-seedance", "date": "2026-07-21T22:06:43.000Z", "summary": "《第九区》导演 Neill Blomkamp 发布 13 分钟科幻短片《Nightborne》，所有镜头均由字节跳动 Seedance 2.0 文生视频模型生成，并使用了 32 位人类演员肖像。影片因画面细节混乱、角色表演缺乏真实感而被广泛批评为\"AI 垃圾\"，Blomkamp 的创作风格几乎消失。", "type": "tip", "relTime": "1周前"}, {"id": 164, "title": "Substack 上线 AI 检测工具，可识别\"Claudefishing\"式 AI 生成内容", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/968855/substack-pangram-ai-detecting-tool", "date": "2026-07-21T19:22:28.000Z", "summary": "Substack 推出由 AI 检测公司 Pangram 驱动的新工具，可扫描帖子、评论、笔记和回复，估算其中有多少文本可能由 AI 生成或辅助完成。读者在超过 100 字的内容右上角菜单中选择\"Scan for AI text\"即可使用。Substack 同时允许创作者添加\"How I make this\"声明说明写作过程，并可扫描草稿及报告不准确结果。", "type": "paper", "relTime": "1周前"}, {"id": 165, "title": "Google 3.6 Flash 模型生成可3D打印数学艺术", "source": "X：Josh Woodward (@joshwoodward, Google Labs VP)", "sourceUrl": "https://x.com/joshwoodward/status/2079614730034127100", "date": "2026-07-21T17:09:23.000Z", "summary": "我们的一位工程师使用新的 3.6 Flash 模型构建了一个交互式数学艺术生成器。你可以实时自定义速度、颜色和几何参数，然后将设计直接导出为可 3D 打印的 STL 文件。观看视频，看看实物打印效果如何！", "type": "model", "relTime": "1周前"}, {"id": 166, "title": "Meta 模型助力伯克利实验室加速科学发现", "source": "X：AI at Meta (@AIatMeta)", "sourceUrl": "https://x.com/AIatMeta/status/2079614176725442912", "date": "2026-07-21T17:07:11.000Z", "summary": "为加速科学发现并支持 @ENERGY 的 Genesis 任务，由 @BerkeleyLab 领导的 SYNAPS-I 项目正使用 SAM 3 和 DINOv3 来自动化图像分割。  通过将 DINOv3 的全局语义上下文和细粒度空间定位与 SAM 3 的像素级边界提取相结合，研究人员能够将 3D 体积标注从一个月的人工工作量压缩到约 15 分钟。  了解更多他们的工作：https://go...", "type": "industry", "relTime": "1周前"}, {"id": 167, "title": "Claude Cowork 新增\"录制技能\"功能", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2079606576751526027", "date": "2026-07-21T16:36:59.000Z", "summary": "Claude Cowork 推出\"录制技能\"功能：用户录制屏幕并口述操作步骤，Claude 即可将其转化为可复用的技能。该功能支持文本、截图、音频、视频和注释等多模态输入，已在 Claude 桌面端上线，面向 Pro、Max 和 Team 计划用户开放。", "type": "paper", "relTime": "1周前"}, {"id": 168, "title": "Qwen 3.8 Max 改版 UI，轻松生成 3D 台球与显微镜项目", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2079601160638615853", "date": "2026-07-21T16:15:28.000Z", "summary": "Qwen 3.8 Max 强制改版 UI，摆脱了此前饱受吐槽的 AI 模板感设计。用户用它生成儿童显微镜项目页面和 3D 台球游戏，后者自动添加了桌子腿和灯光，音效与画面交互丝滑，完整度很高。", "type": "tip", "relTime": "1周前"}, {"id": 169, "title": "Qwen3.8 Max 3D能力实测：台球与放映机", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2079597189937217665", "date": "2026-07-21T15:59:41.000Z", "summary": "用户用Qwen3.8 Max生成3D台球项目，完整度高，自动添加桌子腿和灯光，光影效果与交互丝滑。此前用户还用它制作了3D幻灯片放映机，支持本地上传PDF、MP4、PPT等文件，动画交互与细节刻画表现不错。", "type": "tip", "relTime": "1周前"}, {"id": 170, "title": "阿里通义千问发布 Qwen-Image-3.0：单次生成可读十像素文字与复杂信息图", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/alibabas-qwen-image-3-0-renders-full-infographic-grids-and-readable-ten-pixel-text-in-a-single-pass", "date": "2026-07-21T15:55:09.000Z", "summary": "阿里通义千问团队发布 Qwen-Image-3.0，该图像生成模型支持最长 4500 token 的输入，可单次生成包含可读十像素文字、数学公式及十二种语言的复杂排版，如 3×3 信息图网格和嵌套界面。模型目前仅通过邀请制 API 开放，后续将集成至 Qwen Chat 等自有应用，但不太可能像初版 Qwen-Image 那样开源权重。", "type": "model", "relTime": "1周前"}, {"id": 171, "title": "荣耀 Robot Phone 拍照页面曝光，将支持大师电影模式与四自由度机械云台", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/801.htm", "date": "2026-07-21T15:33:36.000Z", "summary": "荣耀 Robot Phone 已开启预约，机身顶部集成行业最小的四自由度（4DoF）钛合金机械云台系统，体积比主流方案缩小 70%。拍照页面显示快门键改为摇杆按钮，预计可调节云台角度，并支持与阿莱 ARRI 合作的\"大师电影\"模式。该机搭载第五代骁龙 8 至尊版芯片，预计今年 8 月发布，将首发荣耀新一代伙伴型多模态智能体操作系统 AgenticOS 内核。", "type": "paper", "relTime": "1周前"}, {"id": 172, "title": "ABot-World-0：单张桌面级GPU实现无限交互式世界生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19191", "date": "2026-07-21T15:26:50.000Z", "summary": "ABot-World-0是一个动作条件视频世界模型，能在单张NVIDIA RTX 5090 GPU上以720P分辨率、最高16 FPS、1.2秒动作到首帧延迟和约19 GiB峰值显存预算运行无限交互式世界生成。该模型采用统一的帧同步键盘动作接口，通过LongForcing分布匹配阶段解决长程自回归漂移问题，并集成轻量级VAE解码器、低比特DiT推理和局部上下文KV缓存等系统级优化。", "type": "paper", "relTime": "1周前"}, {"id": 173, "title": "Google DeepMind 发布 Gemini 3.6 Flash、3.5 Flash-Lite 与 3.5 Flash Cyber", "source": "Google DeepMind：Blog（RSS）", "sourceUrl": "https://deepmind.google/blog/introducing-gemini-3-6-flash-3-5-flash-lite-and-3-5-flash-cyber", "date": "2026-07-21T15:16:30.000Z", "summary": "Google DeepMind 推出 Gemini 3.6 Flash、3.5 Flash-Lite 和 3.5 Flash Cyber 三款新模型。Gemini 3.6 Flash 是新一代主力模型，在推理、多模态和代码生成任务上实现性能提升。3.5 Flash-Lite 主打更低延迟与成本，3.5 Flash Cyber 则针对网络安全场景优化。", "type": "model", "relTime": "1周前"}, {"id": 174, "title": "通义千问发布 Qwen Image 3 模型", "source": "X：swyx (@swyx)", "sourceUrl": "https://x.com/swyx/status/2079580673086730701", "date": "2026-07-21T14:54:03.000Z", "summary": "Qwen Image 3 发布。 这些图片不是截图。全部单次生成。 最后一张（图像标注）我认为可以催生十几个教育科技/工业培训初创公司。 【引用 @swyx】：顺便一提，Qwen Image 2 是 7B 模型……从 Image 1 的 20B 降下来……并且在 Elo 评分中击败了 Nano Banana。 恭喜 @JustinLin610 等人！！", "type": "model", "relTime": "1周前"}, {"id": 175, "title": "特斯拉将 Robotaxi 自动驾驶出租车服务扩展至美国奥兰多和坦帕", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/786.htm", "date": "2026-07-21T14:40:49.000Z", "summary": "特斯拉将 Robotaxi 自动驾驶出租车服务扩展至美国佛罗里达州的奥兰多和坦帕。该服务去年6月从得州奥斯汀起步，今年已先后进入达拉斯、休斯敦和迈阿密。此次扩张正值特斯拉公布第二季度财报前夕，华尔街密切关注其自动驾驶业务进展。", "type": "industry", "relTime": "1周前"}, {"id": 176, "title": "Deezer：AI 生成音乐已占每日上传量的 50% 以上", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/21/music-streamer-deezer-says-more-than-50-of-daily-uploads-are-ai-generated", "date": "2026-07-21T13:27:42.000Z", "summary": "音乐流媒体平台 Deezer 称，AI 生成音乐目前占其每日上传量的 50% 以上，2026 年 6 月日均上传量达 9 万首。Deezer 将下架过去六个月无播放量或涉及刷量欺诈的 AI 曲目，并已向其他平台开放其 AI 检测技术，该技术可识别 Suno 和 Udio 生成的音乐。", "type": "industry", "relTime": "1周前"}, {"id": 177, "title": "Qwen-Image-3.0 发布：支持 4.5k token 输入与 10px 小字渲染", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://qwen.ai/blog?id=qwen-image-3.0", "date": "2026-07-21T10:38:03.030Z", "summary": "阿里通义千问推出第三代基础图像生成模型 Qwen-Image-3.0，核心能力聚焦\"真实\"，支持最长 4.5k token 的指令输入，可一次性生成包含 9 个复杂信息图的 3×3 网格布局。模型能精确渲染小至 10px 的文字，并原生支持 12 种语言，可模拟网页、游戏、直播等主流界面，在学术论文、报纸等密集排版场景中保持可读性。", "type": "paper", "relTime": "1周前"}, {"id": 178, "title": "阿里云HappyHorse 1.1获AI视频黑客松卓越奖", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2079507022345650415", "date": "2026-07-21T10:01:24.000Z", "summary": "阿里云旗下HappyHorse 1.1在东京AI视频黑客松中荣获卓越奖。获奖作品《连接现实的工程师》仅用一晚完成，以15秒短片展现工程创新与人文关怀的结合。用户可通过链接免费试用该视频生成模型。", "type": "industry", "relTime": "1周前"}, {"id": 179, "title": "阿里云东京AI视频黑客松落幕，HappyHorse 1.1助力创作", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2079499930159247403", "date": "2026-07-21T09:33:13.000Z", "summary": "阿里云在东京举办AI视频黑客松，50多位创作者使用全球排名第一的AI视频生成模型HappyHorse，在一夜内完成15秒电影级广告片。大奖作品利用通勤列车离心力烘干衣物的创意，由HappyHorse 1.1生成。", "type": "industry", "relTime": "1周前"}, {"id": 180, "title": "阿里云 WonderClip 实现脚本到视频全自动生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2079479299157930471", "date": "2026-07-21T08:11:14.000Z", "summary": "Script in. Video out.  📅 2026 年 7 月 23 日 | 上午 10：00-10：30（UTC+8）| 阿里云直播  注册 → https://int.alibabacloud.com/m/1000415408/  WonderClip 正在企业级规模上实现 AI 驱动的视频制作--从脚本到成片，全自动化。  在 #AgenticTalks 第 1 集中了解其工作...", "type": "paper", "relTime": "1周前"}, {"id": 181, "title": "NVIDIA 发布 Cosmos 3 Edge：40 亿参数开放世界模型，可在设备端推理并生成机器人动作", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/07/21/nvidia-releases-cosmos-3-edge-a-4b-parameter-open-world-model-that-reasons-and-generates-robot-actions-on-device", "date": "2026-07-21T07:48:28.000Z", "summary": "NVIDIA 发布 Cosmos 3 Edge，一款 40 亿参数的开放世界模型，专为设备端运行设计。该模型可帮助机器人和视觉 AI 智能体理解环境、实时推理并在本地生成机器人动作。Cosmos 3 系列此前已于 2026 年 5 月 31 日在 GTC Taipei 推出 Cosmos 3 Nano（160 亿参数）和 Cosmos 3 Super（640 亿参数）。", "type": "model", "relTime": "1周前"}, {"id": 182, "title": "英伟达推出合成视频检测器NIM，逐帧识别AI生成视频准确率达92%", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/594.htm", "date": "2026-07-21T07:37:36.000Z", "summary": "英伟达发布合成视频检测器NIM服务，可逐帧分析视频并给出分类评分，判断内容是否由AI生成。内部测试显示，该工具对无压缩视频检测准确率达92%，15%压缩率下为85%，50%压缩率下为82%。在RTX GPU系统上分析一段1080P视频最快仅需22毫秒，企业级L40 GPU上约需30毫秒。", "type": "paper", "relTime": "1周前"}, {"id": 183, "title": "荣耀 Robot Phone 首日预约量超历代旗舰，搭载第五代骁龙 8 至尊版与 4DoF 钛合金机械云台", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/555.htm", "date": "2026-07-21T07:07:46.000Z", "summary": "荣耀 Robot Phone 首日预约量已超越荣耀历代旗舰产品。该机搭载第五代骁龙 8 至尊版芯片，机身顶部集成行业最小的四自由度（4DoF）钛合金机械云台系统，体积比主流方案缩小 70%，200Mp 云台影像的核心机构件、电机、模组均为自研。行业预测 1TB 版本售价约 15999 元，预计今年 8 月发布，并将首发荣耀新一代伙伴型多模态智能体操作系统 AgenticOS 内核。", "type": "product", "relTime": "1周前"}, {"id": 184, "title": "谷歌 DeepMind 发布 GenCeption：基于阿里 Wan2.1，打破计算机视觉桎梏", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/535.htm", "date": "2026-07-21T07:00:10.000Z", "summary": "谷歌 DeepMind 发布 GenCeption 模型，将预训练视频生成器逆向改造成单一模型，可同时完成深度估计、图像分割等核心视觉任务。该模型基于阿里 Wan2.1 训练，一次前向传播即可输出结果，小模型处理 81 帧视频约需 6 秒。", "type": "paper", "relTime": "1周前"}, {"id": 185, "title": "阿里千问发布 Qwen-Image-3.0 图像生成基础模型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/530.htm", "date": "2026-07-21T06:56:42.000Z", "summary": "阿里发布 Qwen-Image-3.0 图像生成模型，核心主线为\"实\"。模型支持 4.5k token 超长输入，可一次生成含公式、几何图形的知识图解和复杂 UI，并支持 12 国语言及 20 多款字体原生渲染。阿里云百炼、千问 AI 平台已开通 API 邀测，Qwen Studio 和千问 APP 即将上线免费体验。", "type": "model", "relTime": "1周前"}, {"id": 186, "title": "Momenta Robotaxi 获深圳智能网联汽车道路测试许可", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/458.htm", "date": "2026-07-21T05:18:29.000Z", "summary": "Momenta Robotaxi 正式获得深圳市智能网联汽车道路测试许可，将于近期在深圳开展实地测试。其 R7 强化学习世界模型已投入 L4 级自动驾驶实际应用，上汽大众 ID.ERA 9X 为首款搭载该模型的量产车型。", "type": "industry", "relTime": "1周前"}, {"id": 187, "title": "生数科技朱军：通用世界模型是连接数字与物理世界的新基础设施", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s/8MaTdfpAmZSg3zYbrJuFAg", "date": "2026-07-21T05:09:19.000Z", "summary": "生数科技创始人朱军在WAIC 2026上提出，通用世界模型需具备理解、想象与行动一体化能力，并发布全球首个MoT统一架构。该架构将理解、生成与行动专家统一于同一模型，支撑Vidu Q3等视频生成模型及具身智能机器人控制。最新模型可驱动多种异构机器人完成长程任务，在跨场景泛化上取得行业领先效果。", "type": "tip", "relTime": "1周前"}, {"id": 188, "title": "为了科普 AI 知识，写了一个视频生成Skill。 计划每天生成一个大模型知识解读视频。 今天是第一期，用最浅显的话解读\"蒸馏\"。 以后千万别说我蒸馏了一个Skill，会显得很外行。", "source": "X：Vista (@vista8)", "sourceUrl": "https://x.com/vista8/status/2079423337369887004", "date": "2026-07-21T04:28:52.000Z", "summary": "为了科普 AI 知识，写了一个视频生成Skill。  计划每天生成一个大模型知识解读视频。  今天是第一期，用最浅显的话解读\"蒸馏\"。  以后千万别说我蒸馏了一个Skill，会显得很外行。", "type": "tip", "relTime": "1周前"}, {"id": 189, "title": "小鹏集团发布 TuringViT 高效视觉编码器", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/451.htm", "date": "2026-07-21T04:23:59.000Z", "summary": "小鹏集团发布面向 VLM/VLA 时代的 TuringViT 视觉编码器，推出 18L 和 24L 两个规格。该编码器在 1536×1536 分辨率下推理吞吐量达 Seed1.5-ViT 的 3.04 倍，仅用 0.85B 图文对便在六项零样本分类基准上取得 83.6% 平均准确率，超越使用 10B 数据的基线。", "type": "paper", "relTime": "1周前"}, {"id": 190, "title": "腾讯混元发布科学发现智能体 Hyra，能够递归自我改进", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/440.htm", "date": "2026-07-21T03:43:22.000Z", "summary": "腾讯混元推出 Hyra-1.0，一个专为研究与工程任务打造的、能递归自我改进的智能体。在多轮 3D 建模测试中，Hyra 生成的模型相比 Claude Code goal 模式更接近参考图像且更符合人类审美。", "type": "model", "relTime": "1周前"}, {"id": 191, "title": "导演陆川称 AI 生成像预制菜，正利用 AI 同时推进五部电影筹备", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/979/311.htm", "date": "2026-07-21T01:18:17.000Z", "summary": "导演陆川表示，AI 生成的影像像预制菜，能弥补新手与老手的技术代差，但可能抹杀艺术创作中\"错误\"带来的迷人之处。他正利用 AI 同时推进五部电影的筹备，AI 已替代概念设计、分镜和部分剪辑等环节，大幅降低试错成本。陆川透露，在视觉商业领域，短片和广告已有 95% 以上被 AI 替代。", "type": "tip", "relTime": "1周前"}, {"id": 192, "title": "一个随机数就能识别AI模型身份：行为指纹技术可检测API中转站偷换模型", "source": "公众号：数字生命卡兹克", "sourceUrl": "https://mp.weixin.qq.com/s/pqFZreEZj8kB4KDirl4MSQ", "date": "2026-07-21T01:10:49.000Z", "summary": "布拉格经济大学研究员托马什·布鲁克纳发现，通过让模型反复输出1到100的随机数，可生成独一无二的\"行为指纹\"。对165个模型各问30次后发现，GPT-4o偏爱42和37，Claude Sonnet 5疯狂输出47，Qwen3-Max则30次全部回答42。该方法仅需约120条请求即可识别模型身份，错误率约10.6%，为验证API是否被偷换模型提供了轻量级方案。", "type": "tip", "relTime": "1周前"}, {"id": 193, "title": "GAMUT：面向事实完整性的双层元评分基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19322", "date": "2026-07-21T00:00:00.000Z", "summary": "GAMUT 引入双层元评分框架，将所需内容的结构化元评分自动编译为 LLM 可评分的二元检查清单，用于评估长文本生成的事实完整性。基准包含 1，813 个基于真实可穿戴图像的问题，覆盖 10 个领域。14 个模型中 Gemini 3.1 Pro 得分最高（58.7%），表明该基准极具挑战性。", "type": "paper", "relTime": "1周前"}, {"id": 194, "title": "文本模板Token是扩散Transformer中的隐式语义寄存器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19139", "date": "2026-07-21T00:00:00.000Z", "summary": "南京大学与阿里巴巴团队提出因果可解释性框架，发现扩散Transformer（DiT）中来自聊天模板的结构性token虽不含提示语义，却成为图像到文本的注意力汇聚点，并因果性地维持物体身份，充当隐式语义寄存器。", "type": "paper", "relTime": "1周前"}, {"id": 195, "title": "Appearance Pointers：扩散Transformer的多模态区域控制新方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19344", "date": "2026-07-21T00:00:00.000Z", "summary": "研究人员提出Appearance Pointers，一种紧凑型token，通过将文本或图像输入与用户指定的掩码对齐，引导扩散Transformer（DiT）在正确空间位置生成正确外观。该方法由区域对应网络生成token，经空间聚合机制优化，无需从头重新训练基础模型即可实现多区域描述控制。在多项指标上，该单一模型达到或超越了特定模态的现有最优方法。", "type": "paper", "relTime": "1周前"}, {"id": 196, "title": "Masked Visual Actions：统一世界模型的掩码视觉动作接口", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19343", "date": "2026-07-21T00:00:00.000Z", "summary": "斯坦福大学李飞飞团队提出 Masked Visual Actions，将机器人动作表示为视频中实体轨迹的像素空间掩码。仅用15小时真实与仿真数据微调，单个视频模型即可同时作为前向动力学模型和逆向模型，用于策略评估与基于模型的规划。", "type": "paper", "relTime": "1周前"}, {"id": 197, "title": "Mage-Flow：面向图像生成与编辑的高效原生分辨率基础模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19064", "date": "2026-07-21T00:00:00.000Z", "summary": "研究人员推出Mage-Flow，一个40亿参数的高效生成栈，用于文本到图像生成和指令式图像编辑。其核心包括轻量级高保真潜在分词器Mage-VAE和原生分辨率多模态扩散Transformer，通过协同设计将分词成本降低一个数量级以上，端到端训练吞吐量提升约2.5倍。", "type": "paper", "relTime": "1周前"}, {"id": 198, "title": "CalibAtt：无需训练的稀疏注意力方法，将文生视频速度提升至 1.58 倍", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/calibrated-sparse-attention", "date": "2026-07-21T00:00:00.000Z", "summary": "Apple 与特拉维夫大学联合提出 CalibAtt，一种无需训练的校准稀疏注意力方法，通过离线识别 token 间可跳过的低分连接并编译为优化操作，在推理时跳过无关计算。在 Wan 2.1 14B、Mochi 1 及少步蒸馏模型上，CalibAtt 实现最高 1.58 倍端到端加速，在保持视频质量和文本-视频对齐的同时优于现有免训练方法。", "type": "paper", "relTime": "1周前"}, {"id": 199, "title": "Hugging Face 发布 Grabette：开源手持夹爪系统，无需机器人即可录制操作数据", "source": "Hugging Face：Blog（RSS）", "sourceUrl": "https://huggingface.co/blog/grabette", "date": "2026-07-21T00:00:00.000Z", "summary": "Hugging Face 推出 Grabette，一套开源低成本系统，用户手持夹爪即可在几分钟内录制操作演示，并自动生成机器人可用的数据集。Grabette 配备鱼眼相机与 RGBD 相机，通过 SLAM 恢复 6-DoF 轨迹，硬件物料成本约 490 欧元。所有硬件设计、处理流程与训练代码均开源，数据以标准 LeRobot 格式上传至 Hugging Face Hub，支持任意机器人后端。", "type": "model", "relTime": "1周前"}, {"id": 200, "title": "多模态大模型理解幽默为何困难：方法、数据集、评估与挑战综述", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.19011", "date": "2026-07-21T00:00:00.000Z", "summary": "一篇综述系统梳理了多模态大语言模型（MLLM）在理解 meme、漫画、讽刺图像等视觉幽默上的结构性盲区：核心困难不在于多模态对齐，而在于对非字面机制、共享文化知识和交际意图的推理。该综述按识别、解释与推理、生成三个递进能力层级组织文献，指出当前进展受限于捷径式评估、文化覆盖不足、证据基础薄弱以及安全与所有权问题。", "type": "paper", "relTime": "1周前"}, {"id": 201, "title": "Moving Alphabet 研究：训练数据分布与标注质量对文生视频模型的关键影响", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.18789", "date": "2026-07-21T00:00:00.000Z", "summary": "研究团队提出 Moving Alphabet 可控测试平台，通过渲染不同字体、颜色、大小、位置和运动速度的字母，精确控制视频数据分布与标注质量。实验发现：视频内容与时长分布的多样性和均衡性对模型泛化能力至关重要；标注精度（正确性）比召回率（完整性）对模型性能影响更大，低质量标注下模型需消耗更多算力才能达到同等验证损失；无分类器引导（CFG）和高质数据微调无法完全弥补预训练数据缺陷。", "type": "paper", "relTime": "1周前"}];
var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };
var TYPE_LABELS = { "paper":"论文", "model":"模型", "product":"产品", "tip":"技巧", "industry":"行业" };
function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";
  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();

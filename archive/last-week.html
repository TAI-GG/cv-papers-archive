s/2084674586462007458", "date": "2026-08-04T16:15:27.000Z", "summary": "Qwen-Image-3.0-Pro 相比上一代实现了巨大飞跃，目前排名全球第五。感谢认可！我们将继续前行。🚀", "type": "paper", "relTime": "1周前"}, {"id": 13, "title": "SGL-Diffusion 全栈性能优化：用 SRT 替换 HF 后端加速 AR+DiT 混合生成", "source": "LMSYS：Blog（Chatbot Arena 团队）", "sourceUrl": "https://www.lmsys.org/blog/2026-08-05-glmImage-optimization", "date": "2026-08-04T16:00:00.000Z", "summary": "SGL-Diffusion 通过三项 PR 将 AR+DiT 混合生成从单体架构重构为异构分布式系统。用 SRT 替换 HF 后端并解耦 AR 与 DiT，使 AR 阶段在 4 卡 TP 下延迟从 122.8 秒降至 26.1 秒（-78.8%），端到端延迟降低 77.2%。动态批处理与提前返回机制提升并发吞吐，DiT 采用每设备单去噪器的 SP 并行，并通过缓冲 AR 结果实现流水线重叠。", "type": "tip", "relTime": "1周前"}, {"id": 14, "title": "OpenRouter 新增图像模型试验场", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2084667628895817737", "date": "2026-08-04T15:47:48.000Z", "summary": "新的图像模型试验场，可快速生成、编辑和组合图像 ✨  点击这里试试！https://openrouter.ai/openai/gpt-image-2", "type": "model", "relTime": "1周前"}, {"id": 15, "title": "商汤 SenseNova U1 开源：统一推理与图像生成", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2084667189479837741", "date": "2026-08-04T15:46:03.000Z", "summary": "商汤发布开源模型 SenseNova U1，可在统一流程中同时进行推理与图像生成。其信息图模式可将单条提示词转为结构化幻灯片，交错模式则逐步生成图文内容，如演示六步画龙教程。模型已上线 SenseNova Studio、HuggingFace 及 GitHub。", "type": "model", "relTime": "1周前"}, {"id": 16, "title": "英伟达发布 Alpamayo 2 Super 开源自动驾驶推理模型", "source": "X：Jensen Huang (@JensenHuang)", "sourceUrl": "https://x.com/JensenHuang/status/2084656303046332747", "date": "2026-08-04T15:02:48.000Z", "summary": "英伟达今日推出 Alpamayo 2 Super，一款面向自动驾驶的前沿开源推理模型，可在行动前理解并推理复杂世界。该模型适用于 Robotaxi、卡车、班车、配送车及拖拉机等移动机器人，已按 OpenMDW-1.1 协议开放商用，支持团队检查、微调与部署。", "type": "model", "relTime": "1周前"}, {"id": 17, "title": "NVIDIA Alpamayo 2 Super 开放商用，面向 Robotaxi 与自动驾驶的前沿开源模型", "source": "NVIDIA Blog（RSS）", "sourceUrl": "https://blogs.nvidia.com/blog/alpamayo-2-super-open-model-now-available", "date": "2026-08-04T15:00:49.000Z", "summary": "NVIDIA Alpamayo 2 Super 现已开放商用，基于 Cosmos 3 Super Reasoner 构建，采用强化学习后训练，支持轨迹预测、因果链推理、元动作、自动标注及视觉问答等多任务输出。", "type": "model", "relTime": "1周前"}, {"id": 18, "title": "商汤 SenseNova U1 开源：统一推理与图像生成", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2084655603885203466", "date": "2026-08-04T15:00:01.000Z", "summary": "商汤发布开源模型 SenseNova U1，可在统一流程中同时进行推理与图像生成。其信息图模式可将单条提示词转为结构化幻灯片，交错模式则逐步构建图文内容，如生成六步画龙教程。模型已上线 SenseNova Studio 与 HuggingFace。", "type": "model", "relTime": "1周前"}, {"id": 19, "title": "美团LongCat-2.0单提示词创意项目展示", "source": "X：美团 LongCat (@Meituan_LongCat)", "sourceUrl": "https://x.com/Meituan_LongCat/status/2084646938268627260", "date": "2026-08-04T14:25:35.000Z", "summary": "自发布 LongCat-2.0 以来，我们一直在用它持续创作。  以下是五个创意项目，每个都由单条提示词生成：🧱 体素艺术 🌍 3D 建模 🌊 CG 动画 🎞️ 落地页 🎮 小游戏  来看看吧 👇", "type": "paper", "relTime": "1周前"}, {"id": 20, "title": "Arcads 智能体：模型之外的控制流才是关键", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2084620614636372143", "date": "2026-08-04T12:40:59.000Z", "summary": "Arcads 将广告创意流程整合为单一智能体运行，避免营销人员在研究、文案、设计和视频系统间手动传递上下文。其新 AI 产品 Mark 已获 1600 万美元融资，拥有持久品牌记忆，可访问完整素材库，并能生成超写实 UGC、动态图形及全球本地化广告，现已向所有用户开放。", "type": "model", "relTime": "1周前"}, {"id": 21, "title": "中国 AI 黑板海外走红：手写公式实时生成曲线、手绘草图秒变 3D 模型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/985/684.htm", "date": "2026-08-04T12:40:15.000Z", "summary": "一段中国 AI 黑板视频在海外社交媒体引发热议，老师手写公式可实时同步大屏并生成动态曲线，手绘草图能瞬间转化为可拆解操控的 3D 模型。该技术基于光学字符识别与 3D 剖分技术，基座为全国产算力训练的深度推理大模型。目前 AI 黑板已进驻全国 300 余个地市、1400 多个区县，在超 10 万个班级常态化应用，课堂问题解答率提升 85%、学生参与度提升 72%。", "type": "model", "relTime": "1周前"}, {"id": 22, "title": "微软PRISM2：临床对话学习病理多模态模型", "source": "X：Microsoft Research (@MSFTResearch)", "sourceUrl": "https://x.com/MSFTResearch/status/2084616849052831991", "date": "2026-08-04T12:26:01.000Z", "summary": "AI 能否通过临床对话学习病理学？我们推出 PRISM2，一个基于真实病理报告中的病理图像和语言训练的多模态基础模型。通过简单的问答方式，PRISM2 在多个基准任务上媲美专门的癌症检测系统，且无需为每个任务单独训练模型。https://msft.it/6017aDr1t", "type": "model", "relTime": "1周前"}, {"id": 23, "title": "光本位科技与百度智能云联合推出光电芯片研发全栈AI Agent Lightmate", "source": "公众号：百度智能云（文心）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzA5NTQ5MzE5OQ%3D%3D&mid=2653159261&idx=2&sn=c48cef58e30d634f80f50b0f0f46684c", "date": "2026-08-04T12:11:43.000Z", "summary": "光本位科技与百度智能云联合推出面向光电芯片研发的全栈AI Agent Lightmate，以文心快码为基座并接入Cobuddy代码生成模型。通过定制化MCP统一接入fdtd、链路仿真、版图生成等工具，需求提取与器件建模从1-2天缩短至几分钟，版图设计从4-5天压缩至1天。", "type": "model", "relTime": "1周前"}, {"id": 24, "title": "SenseTime has released SenseNova U1 Pro， a multimodal model that renders images at 8K natively andse…", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2084608707732836701", "date": "2026-08-04T11:53:40.000Z", "summary": "暂无摘要", "type": "model", "relTime": "1周前"}, {"id": 25, "title": "PixVerse 实测 MiniMax Hailuo 3：分镜与运镜出色", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2084580100297891933", "date": "2026-08-04T10:00:00.000Z", "summary": "创作者 @MonetizationDon 在 PixVerse 上实测 MiniMax Hailuo 3（MiniMax H3），称其分镜和电影级运镜表现出色，能生成其他模型易受限的镜头。该模型支持最长 15 秒 2K 视频、单次最多 9 张参考图、风格参考、唇形同步及多语种，并具备较强的物理理解与提示词遵循能力。", "type": "tip", "relTime": "1周前"}, {"id": 26, "title": "Vidu 一键 MV 重磅升级：四大创作链路覆盖对口型唱、舞蹈演绎与剧情演绎", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489048&idx=1&sn=5a0fd3718d1fd4ce5a55c148021ad847", "date": "2026-08-04T09:41:04.000Z", "summary": "Vidu 一键 MV 全面升级，推出对口型唱、演唱穿插、舞蹈演绎、剧情演绎四大创作链路，覆盖音乐 MV 主流内容形态。用户上传图片和音乐即可生成口型、动作、表情、镜头与剧情，支持 720P 生成。对口型唱、演唱穿插、舞蹈演绎模式每秒 0.75 元，剧情演绎每秒 0.65 元。", "type": "paper", "relTime": "1周前"}, {"id": 27, "title": "我国首部L3/L4自动驾驶系统安全强制性国标发布，2027年7月实施", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/985/551.htm", "date": "2026-08-04T08:41:48.000Z", "summary": "工信部组织制定的《智能网联汽车 自动驾驶系统安全要求》（GB 44721-2026）强制性国标获批发布，将于2027年7月1日起实施。这是我国首部针对L3/L4级自动驾驶系统的强制性标准，由2024年推荐性国标升级而来，适用于M类载客和N类载货车辆，不适用于自动泊车系统。标准从企业全生命周期安全保障、动态驾驶任务执行、人机交互与用户告知、多维度检验检测四方面构建安全要求体系。", "type": "industry", "relTime": "1周前"}, {"id": 28, "title": "腾讯 WorkBuddy / CodeBuddy：Hy3 模型限时免费活动再次延长至 8 月 31 日", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/985/527.htm", "date": "2026-08-04T07:53:24.000Z", "summary": "腾讯宣布 CodeBuddy 和 WorkBuddy 中 Hy3 模型限时免费活动延长至 2026 年 8 月 31 日，此前已延长过一次至 8 月 5 日。Hy3 采用 MoE 架构，总参数 295B，激活参数 21B，最大支持 256K 上下文。官方补充称 Hy3 暂不具备多模态能力，执行视频、图像生成任务时会切换至相应模型并产生积分消耗。", "type": "industry", "relTime": "1周前"}, {"id": 29, "title": "Dreamina Seedance 2.5 发布，支持多模态引用", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2084507317228507139", "date": "2026-08-04T05:10:47.000Z", "summary": "Dreamina Seedance 2.5 刚刚发布。  以更高精度制作扩展视频：  - 原生 30 秒创作 - 精准视频编辑 - 支持多达 50 个多模态参考 - 多语言视频生成  在制作下一个 AI 模型对比表时，务必测试这些能力：  #Dreamina #Seedance25 #Dreaminapartner  在 Dreamina 各平台上，整个 Seedance 系列现价格已降至历...", "type": "model", "relTime": "1周前"}, {"id": 30, "title": "微软 Teams 本月将新增举报可疑会议功能，遏制 AI 深度伪造欺诈", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/985/355.htm", "date": "2026-08-04T02:27:12.000Z", "summary": "微软计划本月为 Teams 推出\"举报\"功能，参会者可在会议期间或会议聊天中提交举报，提醒组织、IT 管理员或安全团队介入调查，用于举报钓鱼、冒充、诈骗、社会工程活动及其他可疑行为。微软称 AI 工具降低了诈骗和网络犯罪的技术门槛，攻击者可制作逼真的深度伪造参会者并克隆目标人物声音。Teams 还将推出外部会议机器人检测功能，以应对机器人未经知晓加入会议引发的安全与隐私问题。", "type": "paper", "relTime": "1周前"}, {"id": 31, "title": "欧盟 AI 透明度新规生效：企业需明确标注 AI 生成内容，违者最高罚 1500 万欧元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/985/326.htm", "date": "2026-08-04T01:58:30.000Z", "summary": "欧盟《人工智能法案》新透明度要求于 8 月 2 日正式生效，要求 AI 系统提供商和部署方明确提醒用户是否在与 AI 互动，并在 AI 生成的音视频、图像和文本中加入机器可读标记。部署方还须对拟真深度伪造内容进行标注。违规企业最高面临 1500 万欧元（约 1720 万美元）罚款或全球年营业额 3% 的处罚；8 月 2 日前已上线的模型须在 12 月 2 日前完成合规。", "type": "industry", "relTime": "1周前"}, {"id": 32, "title": "BestBlogs 早报：Qwen3.8-Max 与多款 AI 新品发布", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2084431125460783162", "date": "2026-08-04T00:08:01.000Z", "summary": "BestBlogs 早报汇总 10 条 AI 动态：Qwen3.8-Max 聚焦长程自主工作能力；OpenAI 推出 GPT-Live 实现不打断的语音交互；MiniMax H3 视频生成模型开源。另有微软 Orchard 智能体框架、腾讯 TencentDB Agent Memory 开源及推理工程、办公智能体等深度解析。", "type": "tip", "relTime": "1周前"}, {"id": 33, "title": "Video-DeepResearch：迈向下一代多模态深度研究智能体", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.03979", "date": "2026-08-04T00:00:00.000Z", "summary": "Video-DeepResearch（Video-DR）将多模态智能体从静态图像扩展到连续视频流，提出解耦感知-探索流水线与分阶段工具解锁，以应对模态偏差和参数知识泄漏两大瓶颈。", "type": "paper", "relTime": "1周前"}, {"id": 34, "title": "UniWorld-Design：从像素生成到图层原生设计", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.03971", "date": "2026-08-04T00:00:00.000Z", "summary": "UniWorld-Design 将图像生成从平面像素合成重构为结构化视觉组合，以语义 RGBA 图层作为生成、理解和编辑的原子单元。框架包含两个模型：Text-to-RGBA（T2RGBA）直接从文本生成独立 RGBA 素材，Image-to-Layer（I2L）根据图像、全局指令和逐层提示联合生成有序的完整语义 RGBA 图层。", "type": "paper", "relTime": "1周前"}, {"id": 35, "title": "JoyAI-Video-Edit：基于自回归扩散的实时开放式视频编辑", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.03974", "date": "2026-08-04T00:00:00.000Z", "summary": "京东探索研究院联合香港大学等机构推出JoyAI-Video-Edit，一个16B参数的自回归扩散框架，支持无需预设时长、不依赖未来帧的实时开放式视频编辑。该系统在单块Nvidia B200 GPU上实现约30 FPS的端到端视频编辑，自动与人工评测显示其显著优于现有流式编辑器，并与强离线系统相当。", "type": "paper", "relTime": "1周前"}, {"id": 36, "title": "SIGNPOST-Bench：多模态大模型文本-视觉冲突消解新基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.04244", "date": "2026-08-04T00:00:00.000Z", "summary": "SIGNPOST-Bench 是一个用于评估多模态大模型文本-视觉冲突消解能力的受控反事实基准，包含来自四个数据集的 5，111 个反事实组和 25，555 个图像变体。", "type": "paper", "relTime": "1周前"}, {"id": 37, "title": "DRIFT：用对抗补丁攻击 Flow-Matching VLA 模型的去噪轨迹", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.03207", "date": "2026-08-04T00:00:00.000Z", "summary": "针对 pi0 等 Flow-Matching 视觉-语言-动作（VLA）模型的鲁棒性研究显示，其对抗鲁棒性多为假象。研究者提出 DRIFT，一种在机器人夹爪上放置的通用对抗补丁，通过攻击去噪速度场实现测试时攻击。仅攻击第一步去噪比攻击多步更有效且更廉价，在 pi0 和 pi0.5 的四个 LIBERO 套件上，DRIFT 能以单个小补丁破坏几乎所有原本可解的任务。", "type": "paper", "relTime": "1周前"}, {"id": 38, "title": "DataSpace：面向异构工作空间可验证分析的数据智能体基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.03451", "date": "2026-08-04T00:00:00.000Z", "summary": "DataSpace 是一个用于评测数据智能体在异构工作空间中生成可验证表格结果的基准，包含 410 个跨语言任务和 7，439 个工件（共 15.01 GB，涵盖 CSV、JSON、SQLite、Markdown、PDF 和视频），并作为 KDD Cup 2026 数据智能体复杂数据分析竞赛的官方评测基准。", "type": "paper", "relTime": "1周前"}, {"id": 39, "title": "MiniMax H3登顶开源视频生成SOTA", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2084410437618352386", "date": "2026-08-03T22:45:49.000Z", "summary": "MiniMax H3在Video Arena和Artificial Analysis基准中成为SOTA开源视频生成模型，在文生视频和图生视频两项均排名第一。其得分较第二名开源模型hunyuan-video-1.5高出280分，图生视频得分1476，仅比Dreamina Seedance-2.0低2分。", "type": "model", "relTime": "1周前"}, {"id": 40, "title": "用稳健数据加载与自动评判评估多模态视觉模型：Moonshot PerceptionBench 端到端评测流程", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/03/evaluating-multimodal-vision-models-with-moonshot-perceptionbench-using-robust-data-loading-and-automated-judging", "date": "2026-08-03T22:26:32.000Z", "summary": "本文构建了一套 PerceptionBench 多模态基准的端到端评测流程，覆盖 OCR、计数、定位、上下文推理、比较、深度理解与幻觉检测等细粒度视觉感知任务。流程采用多阶段流式与下载策略加载平衡子集，支持盲基线、OpenAI 兼容多模态 API 及本地 Hugging Face 视觉语言模型，并实现基于规则与可选 LLM 辅助评判、bootstrap 置信区间及能力画像对比。", "type": "tip", "relTime": "1周前"}, {"id": 41, "title": "ComfyUI 新增 MiniMax H3 Day-0 支持：开放权重、原生音频与 2K 视频", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://blog.comfy.org/p/minimax-h3-day-0-support-in-comfyui", "date": "2026-08-03T15:37:05.659Z", "summary": "ComfyUI 宣布对 MiniMax H3 提供 Day-0 支持，该模型采用开放权重，支持原生音频生成与 2K 视频输出。用户现可在 ComfyUI 中直接使用 MiniMax H3 的完整能力，包括文本、图像、音频与视频的多模态生成。此次集成使开源社区能够第一时间在 ComfyUI 工作流中调用 MiniMax H3。", "type": "model", "relTime": "1周前"}, {"id": 42, "title": "商汤发布 SenseNova U1.5-Lite-Preview 开源模型", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2084288424236782073", "date": "2026-08-03T14:40:59.000Z", "summary": "商汤推出 SenseNova U1.5-Lite-Preview，一个基于 NEO-Unify 架构的轻量级原生统一多模态模型，仅 8B-MoT 参数即可达到商业闭源模型的生成与编辑质量。", "type": "model", "relTime": "1周前"}, {"id": 43, "title": "MiniMax H3 成首个登顶 AI 视频评测榜单的开源模型", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/chinas-minimax-h3-is-the-first-open-model-to-top-an-ai-video-ranking", "date": "2026-08-03T13:52:29.000Z", "summary": "MiniMax 发布 H3 视频模型权重，首次让开源模型登顶 AI 视频评测榜单。Artificial Analysis 将 H3 列为视频编辑第一、文生视频第二、图生视频第三。", "type": "model", "relTime": "1周前"}, {"id": 44, "title": "Karpathy 用 Claude Opus 5 将《指环王》段落转为 3D 场景", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/unicorn-pelican-middle-earth-openai-co-founder-karpathy-is-looking-for-the-next-ai-vibe-test", "date": "2026-08-03T12:07:31.000Z", "summary": "Andrej Karpathy 让 Claude Opus 5 将《指环王》开头一段文字转化为 3D 浏览器场景，生成 5，500 行代码，耗时约两小时，花费约 10 美元。模型自主放置和动画化物体，但因只能通过截图检查视频输出而出现错误。Karpathy 认为这展示了按需生成廉价定制游戏世界的潜力，并称鹈鹕测试已接近上限，此类结果更多是氛围测试而非硬性基准。", "type": "tip", "relTime": "1周前"}, {"id": 45, "title": "玉伯实测：YouMind 生成 PPT 远超 ChatGPT", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2084249090632863857", "date": "2026-08-03T12:04:41.000Z", "summary": "玉伯将血糖与饮食数据同时交给 ChatGPT 和 YouMind，用相同指令生成给医生看的可视化 PPT，背后生图模型均为 gpt-image-2.0。YouMind 的产出更美观，且兼顾医患场景的专业度、简洁度与规范视觉，而 ChatGPT 的交付效果明显逊色。", "type": "tip", "relTime": "1周前"}, {"id": 46, "title": "可灵MCP教程：批量生成美食宣传视频", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2084247919897780389", "date": "2026-08-03T12:00:02.000Z", "summary": "可灵 MCP 教程：使用可灵 MCP 批量制作美食宣传视频 🍔  从分析创意风格、构建分镜脚本到生成最终视频--你的整个美食宣传流程现在都可以由 AI 完成。创作更快，推广更智能。与我们一起壮大你的美食品牌。", "type": "tip", "relTime": "1周前"}, {"id": 47, "title": "小米通报：两网友用 AI 生成虚假车祸视频抹黑小米汽车，被行政拘留 7 日、行政罚款", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/985/202.htm", "date": "2026-08-03T10:51:44.000Z", "summary": "小米通报，网友\"旧 ** 口\"长期用 AI 生成虚假车祸视频抹黑小米汽车产品商誉、侮辱高管，被行政拘留 7 日并删除所有侵权链接；网友\"花 ** 车\"同类行为被行政罚款并删除侵权链接。小米感谢公安机关秉公执法，称将坚决用法律武器打击 AI 造谣。小米集团公关部总经理徐洁云回应称\"AI 是好技术，但别用错地方\"。", "type": "industry", "relTime": "1周前"}, {"id": 48, "title": "MiniMax 发布 33B 视频模型 H3，可生成同步立体声音频并适配 RTX 5090", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2084229681012711598", "date": "2026-08-03T10:47:33.000Z", "summary": "MiniMax 发布 33B 视频模型 H3，可生成同步立体声音频，支持文本、图像、视频和音频多模态生成与编辑，片段最长 15 秒。ComfyUI 优化栈约 40GB，通过动态 RAM/SSD 卸载适配消费级显卡，RTX 5090 上生成 5 秒 768p 视频约需 5.5 分钟。", "type": "model", "relTime": "1周前"}, {"id": 49, "title": "Qwen3.8-Max 发布：16天无人干预自主开发", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2084209808245133687", "date": "2026-08-03T09:28:35.000Z", "summary": "阿里发布 Qwen3.8-Max，主打 Autonomous Coding 和 Cowork，官方展示案例中模型从空文件夹起连续16天自主完成写码、commit、提PR、修bug，全程无人干预，最终做出自进化 Agent 系统 oh-my-cli。该模型支持 1M 上下文、2.4T MoE 参数，并具备多模态规划执行自查能力；正式版一周后开源，届时连 27B 版本一并放出。", "type": "model", "relTime": "1周前"}, {"id": 50, "title": "商汤科技开源多模态模型 SenseNova U1.5-Lite-Preview 预览版，原生支持 4K 图像生成", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/985/044.htm", "date": "2026-08-03T07:34:55.000Z", "summary": "商汤科技今日开源轻量级统一多模态模型预览版 SenseNova U1.5-Lite-Preview。该模型以仅 8B-MoT 的规模，在多项主流生成/编辑质量评测基准上显著超越 U1，实现可比肩商用闭源模型的图像生成与编辑效果。相比 U1，新版本原生支持 4K 图像生成，并提升局部纹理细节、中英文文字生成与复杂版式组织，以及图像编辑和视觉指令遵循能力。", "type": "model", "relTime": "1周前"}, {"id": 51, "title": "英特尔为开源多模态视频模型 MiniMax H3 提供 Day 0 支持，实现多卡 GPU 部署方案", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/985/033.htm", "date": "2026-08-03T07:25:14.000Z", "summary": "英特尔宣布为开源多模态视频模型 MiniMax H3 提供 Day 0 首发支持，锐炫 Pro B70 完成适配。团队实现基于多卡 GPU 的部署方案，采用 Encoder 8 卡张量并行、DiT 8 卡 USP 结合 Layer-wise Offloading 及 VAE 部署于 B70 的整体架构，并开发 2TP×4USP 混合并行方案以平衡计算负载与通信开销，提升推理性能。", "type": "tip", "relTime": "1周前"}, {"id": 52, "title": "消息称蚂蚁灵波启动首轮融资，拟募资 15 亿元", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/985/003.htm", "date": "2026-08-03T06:44:18.000Z", "summary": "蚂蚁集团旗下具身智能公司灵波科技已启动首轮融资，拟募资 15 亿元，目标今年年底完成二轮融资。该公司于 2025 年 3 月在上海浦东落地，专注具身智能基础大模型研发。7 月初其刚发布 LingBot 系列模型 2.0 版本，涵盖空间视觉、具身基座、世界模型及开源视频生成等多项模型。", "type": "industry", "relTime": "1周前"}, {"id": 53, "title": "沐曦曦云 C 系列 GPU 实现 Day 0 适配 MiniMax H3 多模态生成模型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/984/998.htm", "date": "2026-08-03T06:35:13.000Z", "summary": "沐曦股份宣布旗下曦云 C 系列 GPU 完成对稀宇 MiniMax H3 多模态生成模型的 Day 0 适配。依托全栈自研 MXMACA 软件栈，用户可快速部署该模型并调用其多模态创作能力。MXMACA 原生兼容 PyTorch、TensorFlow、vLLM 与 SGLang 等 40 余种主流 AI 框架，支持 500+ AI 模型稳定运行。", "type": "industry", "relTime": "1周前"}, {"id": 54, "title": "文远知行与 GreenMobility 合作，在丹麦推出该国首个商业化 Robotaxi 项目", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/984/994.htm", "date": "2026-08-03T06:12:32.000Z", "summary": "文远知行与丹麦共享电动车平台 GreenMobility 达成战略合作，共同打造丹麦首个商业化自动驾驶共享出行项目，这也是文远知行首次进入北欧市场。在获得监管批准的前提下，双方计划于 2027 年上半年推出面向公众的 L4 级 Robotaxi GXR 服务。丹麦是文远知行进入的第六个欧洲国家，其全球业务已拓展至 13 个国家、40 余座城市。", "type": "industry", "relTime": "1周前"}, {"id": 55, "title": "OpenAI 超级政治行动委员会被曝资助 AI 生成新闻网站，攻击行业批评者", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://www.modelrepublic.org/articles/the-reporters-at-this-news-site-are-ai-bots.-openai%E2%80%99s-super-pac-appears-to-be-using-it-to-advance-its-political-agenda", "date": "2026-08-03T05:44:58.273Z", "summary": "一个伪装成记者的机器人发出的采访请求，暴露了一个由 AI 生成、专门攻击 AI 行业批评者的新闻网站。这是本月第二次发现该网站与 Targeted Victory 存在关联，后者正是 OpenAI 1.25 亿美元政治行动的核心运营方。", "type": "industry", "relTime": "1周前"}, {"id": 56, "title": "摩尔线程 Day-0 适配 MiniMax H3 多模态生成模型", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/984/981.htm", "date": "2026-08-03T05:19:15.000Z", "summary": "MiniMax 今日开源多模态生成模型 H3，支持文本、图片、音频和视频多元输入，可直出 2K 分辨率、最长 15 秒原生音画内容，视频生成价格低至 0.8 元/秒。", "type": "industry", "relTime": "1周前"}, {"id": 57, "title": "字节发布视频模型 Dreamina Seedance 2.5", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2084140807263498513", "date": "2026-08-03T04:54:24.000Z", "summary": "字节跳动推出视频模型 Dreamina Seedance 2.5，单片段最多支持 50 个参考文件，可一次生成 30 秒连续视频，前 7 天仅在 Dreamina 平台运行。该模型支持同时输入 30 张图像、10 段视频和 10 段音频，并允许在提示词中使用时间戳（如 【0s-5s】）作为分镜脚本。", "type": "model", "relTime": "1周前"}, {"id": 58, "title": "自变量机器人发布并开源 HOST 框架，让机器人看视频学会新技能", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/984/958.htm", "date": "2026-08-03T03:53:53.000Z", "summary": "自变量机器人发布并开源 HOST 框架，让机器人仅观察一段数十秒的人类视频就能学会新技能，同时保留已掌握技能。该框架从一段 29 秒人类视频中学习技能的成功率达 62%，超越零样本基线 45%，相比 Pi-0.5 + 微调方案数据量减少 50 倍、学习速度提升 500 倍。HOST 采用\"按任务进度对齐\"和双专家 MoT 架构，研究论文与代码已全部开源。", "type": "paper", "relTime": "1周前"}, {"id": 59, "title": "MiniMax H3 开源并原生接入 ComfyUI", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2084115117281853549", "date": "2026-08-03T03:12:19.000Z", "summary": "MiniMax H3 权重正式开源，并在发布当天（Day 0）原生集成到 ComfyUI，支持文本生视频、图像生视频、首尾帧控制、参考视频及就地编辑五种工作流。H3 以多模态上下文理解为核心，可同时处理图像、音频和视频，并依据提示词解析其关联。", "type": "model", "relTime": "1周前"}, {"id": 60, "title": "MiniMax H3 开源即获 vLLM-Omni 支持", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2084113653524209777", "date": "2026-08-03T03:06:30.000Z", "summary": "MiniMax H3 开源权重，并在 vLLM-Omni 中获得 Day 0 支持，提供兼容 OpenAI 的视频端点。该模型可将文本、图像、视频和音频作为单一上下文处理，支持文生视频、首/尾帧及多参考生成，输出 4-15 秒、最高 2K 24 FPS 的 H.264 视频并自带同步立体声。", "type": "model", "relTime": "1周前"}, {"id": 61, "title": "MiniMax H3 上线 LMSYS，获 Day 0 支持", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2084112746615115865", "date": "2026-08-03T03:02:54.000Z", "summary": "MiniMax H3 已上线 LMSYS，获得 Day 0 服务支持，可在 NVIDIA 和 AMD 硬件上本地运行。该开源模型在 SGLang Diffusion 中性能对标 Seedance 2.0，成本仅为后者三分之一，本地运行（2x 5090 或 1 RTX 6000）则免费。H3 支持文本、图像、视频和音频统一上下文，可生成 5-15 秒原生 2K、24fps 带立体声的视频。", "type": "model", "relTime": "1周前"}, {"id": 62, "title": "MiniMax H3 正式开源：通用视频模型支持多模态上下文与 2K 分辨率", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/984/937.htm", "date": "2026-08-03T02:52:25.000Z", "summary": "MiniMax 今日正式开源新一代通用视频模型 MiniMax H3，可统一理解文本、图像、视频和音频构成的多模态上下文，生成最高 2K 分辨率、最长 15 秒且带原生立体声音频的视频。", "type": "model", "relTime": "1周前"}, {"id": 63, "title": "MiniMax H3 正式开源：通用全模态生成系统支持 2K 视频与原生立体声", "source": "公众号：MiniMax（稀宇科技）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzE5MTA3NzcxMQ%3D%3D&mid=2247488931&idx=1&sn=0506e1d52edd5166becf35f5ebd83a07", "date": "2026-08-03T02:44:09.000Z", "summary": "MiniMax 正式开源新一代通用视频模型 H3，可统一理解文本、图像、视频和音频，生成最高 2K 分辨率、最长 15 秒、带 32 kHz 原生立体声音频的视频。", "type": "model", "relTime": "1周前"}, {"id": 64, "title": "BestBlogs 早报 08-03：姚顺雨入腾讯 300 天、英伟达机器人上下文扩至 8K、GitHub Agent 提示注入漏洞", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2084070680673546543", "date": "2026-08-03T00:15:45.000Z", "summary": "姚顺雨加入腾讯 300 天，混元团队重新聚焦，微信 VLM 与混元长期并存。英伟达与斯坦福联合提出 RoboTTT，将机器人上下文扩展至 8K 时间步。GitHub Agentic Workflow 存在提示注入漏洞，攻击者仅需在公开 Issue 嵌入隐藏指令即可窃取私有仓库数据。", "type": "tip", "relTime": "1周前"}, {"id": 65, "title": "Motion Beyond Morphology：从抽象运动表示引导跨类别运动迁移", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.01628", "date": "2026-08-03T00:00:00.000Z", "summary": "快手Kling团队与北京大学提出Motion Beyond Morphology框架，突破固定结构对应限制，实现跨形态差异巨大的物体间运动迁移。两阶段流程先学习多粒度抽象运动视图并引导跨类别视频对，再内化监督至直接参考视频条件生成，推理时无需显式运动提取。", "type": "paper", "relTime": "1周前"}, {"id": 66, "title": "DeepVoyager-VL：为长程多模态智能体激励视觉在环搜索", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.01827", "date": "2026-08-03T00:00:00.000Z", "summary": "DeepVoyager-VL 提出一种面向视觉在环搜索的长程多模态深度搜索框架，让视觉证据驱动持续检索而非仅停留在输入或答案阶段。该方法通过多模态事件图驱动数据合成，生成含中间视觉依赖与长推理链的问题，并设计主动视觉获取与按需图像加载的智能体框架，在合成数据上微调模型而无需强化学习。在十个多模态搜索基准上的实验验证了其有效性。", "type": "paper", "relTime": "1周前"}, {"id": 67, "title": "UEmbed：统一稀疏与稠密的多模态嵌入模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.02583", "date": "2026-08-03T00:00:00.000Z", "summary": "UEmbed 是一种仅解码器的多模态嵌入模型，可在单次因果前向传播中同时生成稀疏词级和稠密表示，通过可学习特殊 token 与词汇表分区突破单 token 信息瓶颈。", "type": "model", "relTime": "1周前"}, {"id": 68, "title": "DEFT-RLVR：延迟暴露未来轨迹以实现自动驾驶 VLM 的可验证推理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.01755", "date": "2026-08-03T00:00:00.000Z", "summary": "最新研究表明，自动驾驶 VLM 在 CoT 监督中暴露真实未来轨迹会引发轨迹锚定偏差，导致推理因果忠实度下降并加剧模型幻觉。为此，研究者提出 AD-MCQ 基准，将规划转化为显式轨迹候选的选择问题，并在此基础上推出 DEFT-RLVR 方法，将轨迹从决策前锚点转为决策后验证目标。实验显示，DEFT-RLVR 在多个 VLM 主干上提升自动驾驶推理能力，同时保持或略微增强通用视觉能力。", "type": "paper", "relTime": "1周前"}, {"id": 69, "title": "Roomer：面向3D室内布局合成的反思式对象级模型编辑与修复框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.01973", "date": "2026-08-03T00:00:00.000Z", "summary": "Roomer提出一种反思式修复框架，将室内布局生成中的局部违规（如碰撞、越界、遮挡开口）转化为稀疏的对象级修复问题。它通过RoState编码布局、RoReview绑定违规证据，并由几何条件视觉语言模型规划局部编辑，仅在全场景验证通过后才提交修改。基于67，550个配对修复样本的Roomer-CC数据集训练，实验表明Roomer能在保留有效区域的同时提升物理有效性与可用性，并可迁移至外部生成器。", "type": "paper", "relTime": "1周前"}, {"id": 70, "title": "StyleForge：基于超图反事实推理的室内家具风格化", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.01954", "date": "2026-08-03T00:00:00.000Z", "summary": "StyleForge 提出一种场景级结构化选择框架，通过动态超图风格场为固定布局的室内家具挑选风格协调的资产。该方法利用冻结的多模态大语言模型提取风格先验，并采用反事实风格偏好学习，以马氏距离能量评估候选家具的上下文兼容性。在 3D-FRONT 上，StyleForge 在家具检索和场景级风格一致性上达到最优，优于物体级和场景级检索基线。", "type": "paper", "relTime": "1周前"}, {"id": 71, "title": "CURV：通过课程视觉接地推理增强图表理解", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.02833", "date": "2026-08-03T00:00:00.000Z", "summary": "CURV 提出课程学习框架，将图表问答重构为多步视觉接地推理，每步通过空间注意力集中协调逻辑推理与动态视觉接地，增强多模态大语言模型的内在视觉推理能力。配套 CCQA 三级课程数据集覆盖多种图表类型与推理模式，从基础单步操作过渡到复杂多图表组合任务。", "type": "paper", "relTime": "1周前"}, {"id": 72, "title": "STAMPlus：面向 MLLM 分割的结构化全掩码预测", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.02791", "date": "2026-08-03T00:00:00.000Z", "summary": "STAMPlus 提出结构化全掩码预测，将自回归对话与非自回归掩码预测解耦，在单次前向中联合预测所有目标，兼顾高分割性能、保留多模态对话能力与高效推理。该统一检查点在保留 STAMP 指代与推理分割能力的同时，扩展至开放词汇语义、实例感知及遥感小目标分割，并将 12 类别延迟从重复 STAMP 推理的 13.50s 降至 5.16s，实现 SOTA 分割性能。", "type": "paper", "relTime": "1周前"}, {"id": 73, "title": "PosterMELD：多智能体论文转海报生成，兼顾可控设计多样性与可编辑打印输出", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.02218", "date": "2026-08-03T00:00:00.000Z", "summary": "PosterMELD 提出一种模板条件化的多智能体流水线，先通过容量感知槽位引导写作，再用确定性门控与 VLM 审查将失败路由至有界修复，每个通过请求导出可编辑 PPTX 与 PNG。", "type": "paper", "relTime": "1周前"}, {"id": 74, "title": "Hunyuan3D-Buffalo 1.0：面向可扩展3D生成、理解与编辑的统一多模态模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.02711", "date": "2026-08-03T00:00:00.000Z", "summary": "腾讯提出Hunyuan3D-Buffalo 1.0，一个在单一架构中支持3D理解、文本生成3D、指令引导编辑及文本锚定部件生成的统一多模态框架。该模型基于87M规模的3D多模态语料库训练，包含25M理解样本、50M文本-3D对和12M编辑对，后者由Nano3D-v2算法自动构建。实验显示其在文本生成3D和3D编辑基准上达到领先性能，并验证了生成与理解能力可相互增强编辑效果。", "type": "paper", "relTime": "1周前"}, {"id": 75, "title": "CAPEval：面向理解与生成解耦评估的图像描述质量基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.02589", "date": "2026-08-03T00:00:00.000Z", "summary": "CAPEval 将图像描述质量解耦为 Coverage 与 Precision 两个维度，前者衡量描述对真实视觉内容的覆盖程度，后者反映描述中陈述的事实准确率。", "type": "paper", "relTime": "1周前"}, {"id": 76, "title": "InfiniSplat：面向大基线单目视图合成的隐式高斯解码", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.02437", "date": "2026-08-03T00:00:00.000Z", "summary": "InfiniSplat 提出一种前馈式单图像 3DGS 框架，将像素对齐表示转向表面对齐表示，通过几何引导采样和查询条件隐式解码器预测高斯属性，使高斯布局更贴合场景表面。在多个跨数据集 NVS 评测中，InfiniSplat 达到单图像前馈基线的最优性能，并展示出从 Hypersim 室内合成训练到复杂开放世界场景的零样本泛化能力。", "type": "paper", "relTime": "1周前"}, {"id": 77, "title": "GEOID-Flood：面向洪水分割的大规模多模态基准数据集", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.02315", "date": "2026-08-03T00:00:00.000Z", "summary": "GEOID-Flood 是一个大规模多模态洪水分割基准数据集，基于 Copernicus Emergency Management Service 数据构建，覆盖 65 个国家 219 起事件。", "type": "paper", "relTime": "1周前"}, {"id": 78, "title": "Ego2Robot：从人类第一视角数据规模化合成机器人训练数据", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.02580", "date": "2026-08-03T00:00:00.000Z", "summary": "Ego2Robot 提出可扩展流程，将人类第一视角操作视频经动作重定向、机械臂视觉合成与多级质量筛选，转化为机器人训练数据。该流程产出 18，561 小时、覆盖 15 种机器人形态的训练数据，为迄今最大规模 ego-to-robot 数据集。实验表明，联合预训练可稳定提升多种扰动下的分布外泛化能力，并已在真实机器人部署中验证。", "type": "paper", "relTime": "1周前"}, {"id": 79, "title": "Gemini 桌面应用将支持 MCP 与图像视频生成", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2084038211009908982", "date": "2026-08-02T22:06:43.000Z", "summary": "GOOGLE 🔥：Gemini 桌面应用即将为 Gemini Spark 提供完整的 MCP 支持，新增专门的图像和视频生成标签页，以及相机附件选项。  与 Gemini 网页版缩小差距 👀", "type": "paper", "relTime": "1周前"}, {"id": 80, "title": "GeoAI 教程：用 U-Net、Grounding DINO、SAM 与 Mask R-CNN 从 NAIP 影像提取建筑足迹", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/02/a-tutorial-on-geoai-designing-footprint-extraction-from-naip-imagery-using-u-net-grounding-dino-sam-and-mask-r-cnn", "date": "2026-08-02T21:19:48.000Z", "summary": "本教程设计了一套完整的 GeoAI 工作流，从高分辨率 NAIP 航拍影像中提取建筑足迹。流程涵盖配置深度学习环境、下载影像与标签、生成图像块和分割掩码，训练 ResNet-34 编码器的 U-Net 模型，并应用滑动窗口推理。", "type": "tip", "relTime": "1周前"}, {"id": 81, "title": "Thinking Machines Lab 发布 Inkling-Small：276B 总参数、12B 激活的开源权重多模态 MoE 模型", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/02/thinking-machines-lab-releases-inkling-small-276b-open-weights-multimodal-moe-model", "date": "2026-08-02T20:35:50.000Z", "summary": "Thinking Machines Lab 发布开源权重 MoE 模型 Inkling-Small，总参数 276B、激活参数 12B，约为 975B 总参数 Inkling 的四分之一，原生支持文本、图像和音频推理，上下文窗口达 1M tokens，权重以 Apache 2.0 协议在 Hugging Face 上提供。", "type": "model", "relTime": "1周前"}, {"id": 82, "title": "普通人用GPT 5.6 Sol vibe coding做出3D人体解剖应用", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2083977164068720848", "date": "2026-08-02T18:04:08.000Z", "summary": "一位开发者用GPT 5.6 Sol、GPT Image 2.0和TripoAI，通过vibe coding构建了3D人体解剖应用，将总资源从约900MB优化至28.6MB，单个模型从120-150MB降至2-5.5MB，帧率从16fps提升。整个过程仅靠与AI对话完成，无需专业团队，展示了工具民主化对教育内容的冲击。", "type": "tip", "relTime": "1周前"}, {"id": 83, "title": "卡帕西亚鹈鹕", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://twitter.com/karpathy/status/2083749667410727319", "date": "2026-08-02T17:44:46.644Z", "summary": "Andrej Karpathy 用 1M token 预算（约 $10）让 Opus 5 根据《指环王》首段生成 Three.js 渲染，模型耗时约 2 小时写出 5500 行代码，程序化呈现故事。他认为这类\"没人会手动做\"的定制内容正变得近乎免费，并指出世界/游戏领域暴露了 LLM 的弱点：无法高效原生感知视频或游玩游戏，Opus 5 只能缓慢截图自查且多次出错。", "type": "tip", "relTime": "1周前"}, {"id": 84, "title": "Grok 视频生成获赞，被称视频界 DeepSeek", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2083947198618694024", "date": "2026-08-02T16:05:04.000Z", "summary": "博主称 Grok 为视频大模型界的 DeepSeek，并建议马斯克好好发展。其展示 Grok 一次生成、零抽卡的 15 秒 1080P 打斗片段，认为效果优于降智的 seedance 2.0，且对比 seedance 2.5 的高价更具性价比。", "type": "tip", "relTime": "1周前"}, {"id": 85, "title": "Nvidia 高管：AI 是值得重建的全新计算模型", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/customers/nvidia-nyc-summit-2026", "date": "2026-08-02T16:00:00.000Z", "summary": "Nvidia 媒体与娱乐部门副总裁 Richard Kerris 认为，AI 不是可叠加的功能，而是值得围绕其重建的全新计算模型。Runway 仅用一天便将 Gen-4.5 迁移至 Nvidia 最新平台 Vera Rubin，生成速度从分钟级提升至即时，使视频生成变为实时创作循环。", "type": "tip", "relTime": "1周前"}, {"id": 86, "title": "GPT 5.6 Sol 构建 3D 人体解剖教学应用", "source": "X：Greg Brockman (@gdb)", "sourceUrl": "https://x.com/gdb/status/2083934330146197989", "date": "2026-08-02T15:13:56.000Z", "summary": "开发者用 GPT 5.6 Sol 和 Codex 构建了 3D 人体解剖教学应用，将每个 3D 模型从 120-150 MB 优化至 2-5.5 MB，总资源从约 900 MB 降至 28.6 MB，帧率从 16fps 提升至流畅水平。应用支持按需加载，并自动生成解剖插图和交互热点标记。", "type": "tip", "relTime": "1周前"}, {"id": 87, "title": "黄仁勋：马斯克在三大AI领域占据绝佳位置", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2083933927849259155", "date": "2026-08-02T15:12:20.000Z", "summary": "NVIDIA CEO 黄仁勋称马斯克在引领 AI、自动驾驶和人形机器人未来方面处于绝佳位置。他指出马斯克拥有庞大车队可低成本收集世界数据，且其汽车 AI 工厂配备大量 NVIDIA 设备。黄仁勋认为 xAI 主攻基础认知智能、Tesla 做自动驾驶、Optimus 做人形机器人，这三者正是 AI 最重要的三大领域。", "type": "tip", "relTime": "1周前"}, {"id": 88, "title": "Grok 一次生成 15 秒视频，0 抽卡", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2083922399771165015", "date": "2026-08-02T14:26:32.000Z", "summary": "seedance 2.5 实在太贵了，继续玩 Grok，这个 15 秒视频是 Grok 一次生成，0 抽卡，目前视频大模型也就 Grok 能与之一战了吧🤔", "type": "tip", "relTime": "1周前"}, {"id": 89, "title": "实测MiniMax H3做后期和动效：视频届的审美王来了", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247509055&idx=1&sn=28254c9e78532b336895b8c541905d49", "date": "2026-08-02T13:26:14.000Z", "summary": "MiniMax H3视频模型实测覆盖广告TVC、短剧、创意片头、动态海报、UI动效和游戏实机六类场景，可生成5-15秒视频、原生双声道、直出2K，一次最多放9张图、3段视频和3段音频，提示语最高支持7000字符。", "type": "tip", "relTime": "1周前"}, {"id": 90, "title": "最新开源模型盘点（#23）：Laguna S2.1、Inkling 与 Kimi K3 展现开源模型在帕累托前沿的价值", "source": "Nathan Lambert：Interconnects（RSS）", "sourceUrl": "https://www.interconnects.ai/p/latest-open-artifacts-23-laguna-s21", "date": "2026-08-02T13:01:40.000Z", "summary": "Thinking Machines 发布首个模型 Inkling，为 975B-A41B 多模态 MoE，支持文本、图像和音频输入，并推出 276B-A12B 小版本。", "type": "tip", "relTime": "1周前"}, {"id": 91, "title": "Pippa 用收入分成吸引艺术家，但能说服他们拥抱 AI 吗？", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/974018/pippa-seedance-artist-royalties", "date": "2026-08-02T13:00:00.000Z", "summary": "AI 视频初创公司 Pippa 试图通过收入分成模式吸引艺术家：订阅用户生成基于某位艺术家风格的内容时，该艺术家可获得每次图片 $0.005、每秒视频 $0.003 的补偿，并分享 5% 的版税池。公司目前约有 800 名付费订阅者，仅与四位人类艺术家签署了授权协议。但 Pippa 的技术仍基于在更广泛互联网内容上训练的开放模型，无法完全摆脱未经明确同意抓取艺术作品的争议。", "type": "tip", "relTime": "1周前"}, {"id": 92, "title": "Claude Opus 5 将提示词生成游戏从粗糙色块推进到带物理和音乐的完整 3D 原型", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/claude-opus-5-pushes-prompt-to-game-ai-from-rough-color-blocks-to-full-3d-prototypes-with-physics-and-music", "date": "2026-08-02T08:51:07.000Z", "summary": "Anthropic 的 Claude Opus 5 仅凭单个文本提示词即可生成可运行的 3D 游戏世界，包括第一人称射击游戏和《我的世界》复刻版，无需任何外部文件或预制资源。模型从零编写几何、纹理、物理和音乐代码，并以可编辑的 HTML 文件直接在浏览器中渲染。社区测试显示，其物理真实感和机械复杂度显著超越去年的 Claude 4 Opus，也优于 GPT-5.6 Sol 和 Kimi K3。", "type": "tip", "relTime": "1周前"}, {"id": 93, "title": "探索性建模：一种新的生成式建模训练范式", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://alexiglad.github.io/blog/2026/explorative_modeling", "date": "2026-08-02T08:40:57.761Z", "summary": "探索性建模（Explorative Modeling）作为生成式建模的第三种预训练轴，可端到端生成，并在图像、视频和语言任务上单调提升现有模型性能，增益随规模增长（数据7%→36%，参数13%→23%）。探索性模型（XMs）实现6.2倍样本效率、4.1倍FLOP效率和47%参数效率提升，作为端到端生成模型在控制任务上以最多256倍更少推理计算匹配扩散模型。", "type": "tip", "relTime": "1周前"}, {"id": 94, "title": "Karpathy 用《指环王》测试 Opus 5 长程生成", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2083829468032876616", "date": "2026-08-02T08:17:15.000Z", "summary": "Karpathy 提出用《指环王》首段测试 LLM 长程生成能力：给 Opus 5 100 万 token 预算（约 $10），它耗时约 2 小时写出 5500 行 Three.js 代码，程序化渲染整个故事。该测试考验模型跨数千行代码的连贯性与自我审查能力，但暴露了 LLM 无法高效感知视频或游戏内反馈的短板。", "type": "tip", "relTime": "1周前"}, {"id": 95, "title": "Snapchat 更新 Spotlight 推荐算法，完全由 AI 生成的视频将不再被推荐", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/984/749.htm", "date": "2026-08-02T07:49:33.000Z", "summary": "Snapchat 本周五（7 月 31 日）宣布更新 Spotlight（聚光灯）推荐算法，即日起完全由 AI 生成的视频将不会被该版块算法推荐，以鼓励原创、真实、有价值的视频内容。创作者仍可使用 Snapchat AI 工具编辑或增强内容，并为 AI 内容打上相应标记，这类视频不会被算法忽略。", "type": "industry", "relTime": "1周前"}, {"id": 96, "title": "Karpathy 用 Claude Opus 5 生成《魔戒》3D 世界", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2083814299139539442", "date": "2026-08-02T07:16:58.000Z", "summary": "Karpathy 给 Claude Opus 5 一段《魔戒》开篇、100 万 token 预算（约 10 美元），两小时后模型写出 5500 行 Three.js 代码，程序化生成了一个可运行的夏尔 3D 场景。他认为这标志着测试范式从\"画个 SVG\"转向长时程、高复杂度任务，也暴露了 LLM 无法高效感知视频或进入游戏自我审计的短板。", "type": "tip", "relTime": "1周前"}, {"id": 97, "title": "Snap 和 LinkedIn 反击低质量 AI 内容洪流", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/snap-and-linkedin-are-fighting-back-against-a-flood-of-low-quality-ai-content", "date": "2026-08-02T06:49:28.000Z", "summary": "Snap 本月起将完全由 AI 生成的视频移出 Spotlight 推荐，以聚焦\"真实用户的真实创意\"；使用 Snapchat 自家 AI 工具编辑的视频仍可推荐，但需附带透明度标签。LinkedIn 则推出专门的\"AI 垃圾内容\"举报按钮，独立于常规低质内容举报系统。一项 Kapwing 研究显示，21% 的 YouTube Shorts 已由 AI 生成。", "type": "industry", "relTime": "1周前"}, {"id": 98, "title": "MiniMax 宣布 H3 模型即将开源", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2083792570543681664", "date": "2026-08-02T05:50:38.000Z", "summary": "MiniMax 宣布其视频生成模型 H3 即将开源（open weights）。有用户反馈，H3 生成视频的质量和数量均优于 2.5 版本，且成本更低、推理速度更快、自定义音频上传功能正常。该用户认为，在创意工具领域，成本与速度最终将决定胜负，规模化后有望实现无限生成。", "type": "model", "relTime": "1周前"}, {"id": 99, "title": "Grok 新增视频观看与分析功能", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2083762133313929263", "date": "2026-08-02T03:49:41.000Z", "summary": "Grok 可以为你观看并分析视频。  只需像上传图片一样上传视频，然后向 Grok 提问任何关于视频内容的问题即可。", "type": "paper", "relTime": "1周前"}, {"id": 100, "title": "Karpathy 用 Opus 5 生成《指环王》3D 渲染", "source": "X：Andrej Karpathy (@karpathy)", "sourceUrl": "https://x.com/karpathy/status/2083749667410727319", "date": "2026-08-02T03:00:09.000Z", "summary": "Andrej Karpathy 给 Opus 5 提供《指环王》第一段和 1M token 预算（约 $10），模型耗时约 2 小时写出 5500 行代码，程序化渲染出故事场景。他认为这展示了从\"没人会做\"到\"几乎免费\"的转变，并指出 LLM 在视频感知和游戏内审计能力上仍有明显短板。", "type": "tip", "relTime": "1周前"}, {"id": 101, "title": "Figure F.03 自主爬梯，人形机器人突破关键一步", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2083732785693413431", "date": "2026-08-02T01:53:04.000Z", "summary": "Figure 的 F.03 人形机器人完全自主、无遥控地爬上一个真实金属梯子并站稳，全程无云端接管。爬梯对机器人是出了名的难点，此前多数机器人遇梯即需人扶或专用坡道。该能力被视为从\"实验室能跑能跳\"到\"真实世界能上能下\"的 0 到 1 突破，意味着机器人开始适应人类基础设施而非要求世界为它改变。", "type": "tip", "relTime": "1周前"}, {"id": 102, "title": "说唱歌手 Fenix Flexin 单曲《Rubberz》走红，被质疑由 AI 生成", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/984/667.htm", "date": "2026-08-02T01:19:56.000Z", "summary": "Fenix Flexin 单曲《Rubberz》攀升至 Billboard Hot 100 第 58 位，随即被质疑由 AI 生成。The Verge 用五种 AI 音乐检测工具测试，判定 AI 生成或辅助概率在 20% 至 30% 之间，但封面图、社交媒体帖及歌词分别被 AI 图像和文本检测工具以超 97% 置信度判为 AI 生成。", "type": "industry", "relTime": "1周前"}, {"id": 103, "title": "Grok Imagine 图像生成功能发布", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2083709924236751300", "date": "2026-08-02T00:22:14.000Z", "summary": "由 Grok Imagine 制作", "type": "paper", "relTime": "1周前"}, {"id": 104, "title": "Seedance 2.5 发布：单次生成 30 秒视频，支持多模态参考与精准编辑", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://seed.bytedance.com/en/blog/one-take-creation-flexible-referencing-introducing-seedance-2-5", "date": "2026-08-02T00:09:26.634Z", "summary": "Seedance 2.5 正式上线，单次生成最长 30 秒高质量音视频片段，并支持多轮扩展以输出数分钟连贯内容。模型可一次输入最多 30 张图片、10 段视频和 10 段音频作为参考，并新增时间戳级编辑控制，提升长叙事、多模态参考与剪辑能力。即日起登陆即梦 AI、豆包 Pro 等平台，API 即将通过 BytePlus ModelArk 提供。", "type": "model", "relTime": "1周前"}, {"id": 105, "title": "3DZip：面向3D问答的空间感知特征多样性引导token压缩", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.01185", "date": "2026-08-02T00:00:00.000Z", "summary": "3DZip提出一种三阶段token压缩框架，用于降低3D视觉语言模型的计算与内存开销。该方法先通过粗体素化去除点级冗余，再基于特征空间多样性（行列式点过程）选取锚点token，最后在空间约束下合并剩余token以保持几何一致性。在三个3D问答基准上，3DZip仅用128个token即保留94.7%的原始性能，推理速度提升1.92倍。", "type": "paper", "relTime": "1周前"}, {"id": 106, "title": "MiniWorld：从零训练视频世界模型的轻量可复现框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.01127", "date": "2026-08-02T00:00:00.000Z", "summary": "MiniWorld 提出一个轻量、可复现的框架，用于在有限算力下从零训练流式视频世界模型。它采用块因果 Video Diffusion Transformer 与 Flow Matching，结合分块非递减噪声调度和两阶段持续训练，推理时通过滚动 KV cache 与流水线异步去噪实现高效流式生成。整个模型可在单台 8-GPU 服务器上数天内完成训练，代码、模型权重与实现细节全部开源。", "type": "paper", "relTime": "1周前"}, {"id": 107, "title": "BestBlogs 早报：MiniMax H3 与 OpenAI Astra 突破", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2083700397756313634", "date": "2026-08-01T23:44:22.000Z", "summary": "BestBlogs 早报精选 10 条 AI 动态：MiniMax H3 发布，统一文本、图像、视频与声音处理，可输出原生双声道 15 秒 2K 视频；OpenAI Astra 内部版本在数学与理论计算机科学的 10 个问题上取得新突破，成本约 2000 美元。另有长时程智能体训练瓶颈、GPU 算力效率优化及大模型 API 降价 80% 等深度分析。", "type": "tip", "relTime": "1周前"}, {"id": 108, "title": "MiniMax H3 统一全模态生成，Astra 获 10 项数学突破", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2083700352478798179", "date": "2026-08-01T23:44:11.000Z", "summary": "MiniMax H3 将文本、图像、视频和声音纳入同一套上下文理解与生成流程，支持最长 15 秒带原生双声道的音视频，2K 下每秒价格不到主流模型三分之一，并计划开放权重。OpenAI 内部版本 Astra 在数学和理论计算机科学的 10 个问题上给出新结果，约 2000 美元成本生成，并附验证证书供学界核查。长时程智能体面临训练、记忆与评测难题，Kelly 基准测试中前沿模型经营业务全部亏损。", "type": "industry", "relTime": "1周前"}, {"id": 109, "title": "Flux 3 零重力视频生成效果惊艳", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2083670630570807451", "date": "2026-08-01T21:46:05.000Z", "summary": "零重力版本  > 一段业余手持拍摄的零重力空间站内高速移动画面，穿过一个又一个房间，永不停歇，每个房间都截然不同且怪异，持续移动，从不停止  【引用 @fofrAI】：我喜欢 Flux 3 让这个画面变得如此奇异", "type": "tip", "relTime": "1周前"}, {"id": 110, "title": "YouTuber Hank Green 承认过度依赖 AI 聊天机器人\"不健康\"", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/01/youtuber-hank-green-says-his-ai-usage-is-not-healthy", "date": "2026-08-01T19:45:45.000Z", "summary": "拥有 320 万订阅者的 YouTuber Hank Green 因在视频中疑似使用 ChatGPT 撰写脚本而引发争议，随后公开道歉。他承认自己\"在巨大压力下\"使用 ChatGPT 做研究，并计划减少视频产出，同时表示与 LLM 互动带来的多巴胺水平\"对我或世界都不健康\"。", "type": "industry", "relTime": "1周前"}, {"id": 111, "title": "这首 Billboard Hot 100 热单是 AI 生成的\"垃圾\"吗？", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/974209/fenix-flexin-billboard-hot-100-rubberz-ai-slop", "date": "2026-08-01T18:20:00.000Z", "summary": "洛杉矶说唱歌手 Fenix Flexin 的单曲\"Rubberz\"登上 Billboard Hot 100 第 58 位，但被多方质疑主要由 AI 生成。音频中多处出现 AI 生成音乐的典型伪影，封面和歌词被多个 AI 检测器以超 97% 置信度标记为 AI 产物，现场表演也疑似对口型。Fenix 否认指控，但未提供有力反驳。", "type": "tip", "relTime": "1周前"}, {"id": 112, "title": "字节跳动发布 Seedance 2.5，可生成带内置音频的 30 秒视频片段", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/bytedances-seedance-2-5-generates-30-second-video-clips-with-built-in-audio", "date": "2026-08-01T13:33:41.000Z", "summary": "字节跳动推出 AI 视频模型 Seedance 2.5，可一次性生成视频与音频，片段最长 30 秒且支持多次扩展，而 Google Gemini Omni Flash 上限约 10 秒。", "type": "model", "relTime": "1周前"}, {"id": 113, "title": "Grok Imagine Video 1.5 新增文生视频与1080p", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2083545533248070070", "date": "2026-08-01T13:29:00.000Z", "summary": "文生视频支持、图像与语音参考，以及原生 1080p 已登陆 Grok Imagine Video 1.5。", "type": "paper", "relTime": "1周前"}, {"id": 114, "title": "Grok Imagine 升级：语音一致与视频生成", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2083525523368563111", "date": "2026-08-01T12:09:29.000Z", "summary": "Grok Imagine 新增语音一致性、多参考图、文生视频及原生 1080p 支持。用户可通过 @ 引用文件复用角色及其一致语音。该功能现面向 SuperGrok Plus 和 Heavy 订阅者开放，未来数日将逐步推送给所有用户，并支持网页、Grok 应用及 Imagine API。", "type": "product", "relTime": "1周前"}, {"id": 115, "title": "Google 上线两天即撤回 Google Earth 的 Nano Banana 卫星图像生成功能", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/google-handed-users-the-easiest-possible-tool-for-fake-satellite-imagery-then-pulled-it-after-two-days", "date": "2026-08-01T09:00:04.000Z", "summary": "Google 在 Google Earth 中上线 Nano Banana 2 卫星图像生成功能仅两天后便将其撤回。该功能允许用户基于卫星图像生成自定义场景，但用户很快展示了如何用它制作以假乱真的虚假卫星图像，如墨西哥边境的难民队伍或加沙被炸毁的医院。Google 称相关图像已标注为 AI 生成且不对其他用户可见，但仍有违规截图被传播，该功能将在加强保障措施后才会回归。", "type": "industry", "relTime": "1周前"}, {"id": 116, "title": "MiniMax 发布 MiniMax H3：可生成 15 秒 2K 原生立体声视频的全模态模型", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/01/minimax-releases-minimax-h3-an-omni-modal-video-model-that-generates-15-second-2k-clips-with-native-stereo-audio", "date": "2026-08-01T08:28:07.000Z", "summary": "MiniMax 于 7 月 31 日发布全模态生成模型 MiniMax H3，将文本、图像、视频和音频作为统一上下文处理，直接输出带原生立体声的 2K 视频，时长 4-15 秒。", "type": "model", "relTime": "1周前"}, {"id": 117, "title": "MiniMax H3 开源模型打破任务与模态边界", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2083430223920705700", "date": "2026-08-01T05:50:48.000Z", "summary": "MiniMax H3：一款打破任务与模态边界的开源模型  【引用 @RenLeanna】：这恰好印证了我们的训练方法论：语言/图像/视频/音频都是人类经验中深度互联的模态。而多模态智能应植根于语言--一种可泛化、可扩展的计算系统。  真的很感谢你挖出这个！🙌", "type": "model", "relTime": "1周前"}, {"id": 118, "title": "阑夕复现Coser与角色拼接构图AI提示词", "source": "X：阑夕 (@foxshuo)", "sourceUrl": "https://x.com/foxshuo/status/2083415089726574772", "date": "2026-08-01T04:50:40.000Z", "summary": "阑夕分享AI图像生成提示词，用于复现Coser与Cos角色的拼接构图。提示词要求手机作为\"动漫滤镜窗口\"，覆盖真人面部大部分区域，屏幕内显示同一人物精确对齐的动漫面部局部，使两者合成为一张脸，并规定手机倾斜角度、面部遮挡范围及背景等细节。", "type": "tip", "relTime": "1周前"}, {"id": 119, "title": "具身智能行业现状：大眼瞪小眼", "source": "X：赵纯想 (@chunxiangai)", "sourceUrl": "https://x.com/chunxiangai/status/2083407442419880267", "date": "2026-08-01T04:20:16.000Z", "summary": "一位业内人士与多位大咖深聊后总结，具身智能领域各环节分工明确，做谐波、关节、灵巧手、视觉、力控、运控、仿真、数据、大模型的各司其职。但问及谁负责整合成工厂落地实践方案时，得到的回答是行业龙头宇树都不做，没人愿意牵头。作者感叹这是\"大眼瞪小眼型行业\"。", "type": "tip", "relTime": "1周前"}, {"id": 120, "title": "MiniMax 发布开源权重视频模型 H3，登顶视频编辑榜", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2083373860796153869", "date": "2026-08-01T02:06:50.000Z", "summary": "MiniMax 发布开源权重视频模型 H3，在 Artificial Analysis 视频编辑榜登顶，文本生视频排名第二、图像生视频排名第三。H3 支持文本、图像、视频、音频统一输入，原生生成 2K 24fps 5-15 秒带立体声片段，定价每分钟 2K 视频 $7.80，远低于 Seedance 2.0 的 $22.45 和 Kling 3.0 的 $20.16。", "type": "model", "relTime": "1周前"}, {"id": 121, "title": "MiniMax H3 开源视频模型瞄准机器人领域", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2083370134144758075", "date": "2026-08-01T01:52:01.000Z", "summary": "MiniMax 表示 H3 开源视频生成模型对机器人应用潜力巨大，开放权重让具身智能社区无需许可即可构建数据引擎、世界模型与策略。研究者称，视频生成正借助世界模型热潮快速推动机器人技术进步，MiniMax 欢迎相关合作。", "type": "tip", "relTime": "1周前"}, {"id": 122, "title": "Grok 推出 Imagine Video 1.5 图像语音参考功能", "source": "X：Andrew Milich (@milichab)", "sourceUrl": "https://x.com/milichab/status/2083355032481652987", "date": "2026-08-01T00:52:01.000Z", "summary": "试试全新的 Imagine Video 1.5，新增图像和语音参考功能。", "type": "paper", "relTime": "1周前"}, {"id": 123, "title": "谷歌地球 AI 生图功能上线不到一天即下架，可无限制生成\"灾难\"图片", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/984/415.htm", "date": "2026-08-01T00:14:40.000Z", "summary": "谷歌为 Google Earth 加入的 AI 图像编辑功能上线不到 24 小时便紧急下线，该功能调用 Gemini 旗下 Nano Banana 2 图像模型，用户输入文字指令即可修改地点影像。", "type": "industry", "relTime": "1周前"}, {"id": 124, "title": "DreamTraj：通过读取未渲染的视频扩散潜变量生成 6-DoF 物体轨迹", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.00486", "date": "2026-08-01T00:00:00.000Z", "summary": "DreamTraj 从单张 RGB 图像和任务指令直接预测 6-DoF 物体轨迹，推理时无需视频、深度或 CAD 模型。它不生成完整视频，而是从冻结的图像到视频扩散模型早期去噪步骤的内部表征中解码运动，配套的 Move 数据集包含 5，038 条人工检查的轨迹及细粒度语言指令。该方法在平移和旋转上均达到新 SOTA，且比先生成再提取的流程更快。", "type": "paper", "relTime": "1周前"}, {"id": 125, "title": "ReBA：面向视觉-语言MoE的几何引导负载均衡方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.00574", "date": "2026-08-01T00:00:00.000Z", "summary": "ReBA提出依据模态边界分离图像与文本负载项，并为每张图像分配等权路由实例，以解决视觉-语言MoE中图像与文本token比例变化导致的负载不均衡问题。在四个拆分主干上，ReBA在所有报告基准输入上降低负载，同时保持平均任务准确率与标准Switch辅助损失相当。代码已开源。", "type": "paper", "relTime": "1周前"}, {"id": 126, "title": "CADENA：逐步式 CAD 逆向工程新模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.00799", "date": "2026-08-01T00:00:00.000Z", "summary": "CADENA 将 3D 网格逐步重建为参数化 CAD 程序，每一步都对比目标与当前预测几何，而非一次性生成全部代码。研究团队同时推出 CADENA-Bench 基准，用于评估机械零件逆向工程方法。CADENA 在 CADENA-Bench 及 DeepCAD、Fusion 360、MCB 数据集上均优于此前方法，代码与模型权重已开源。", "type": "paper", "relTime": "1周前"}, {"id": 127, "title": "Poplar：面向人类中心图像数据集合成的可扩展流水线", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.00440", "date": "2026-08-01T00:00:00.000Z", "summary": "Poplar 提出 Specify-Render-Inspect 三阶段流水线，用于人类中心图像数据集合成：在常识约束下采样结构化属性并生成摄影提示词，经扩散模型渲染，再由视觉-语言审查剔除缺陷样本。", "type": "paper", "relTime": "1周前"}, {"id": 128, "title": "解码儿童步态行为：新数据集揭示现有模型在儿科步态分析中的不足", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.00371", "date": "2026-08-01T00:00:00.000Z", "summary": "一项研究提出儿童步态行为细粒度分析这一新问题域，并发布包含110名受试者、超1100段60 FPS视频序列的新数据集，每段记录5秒\"走动\"任务的多视角步态周期。实验表明，当前SOTA方法（包括步态基础模型和多模态大语言模型）均无法有效解决这些临床细微差异。该数据集有望推动自动化儿童步态评估的新研究方向。", "type": "paper", "relTime": "1周前"}, {"id": 129, "title": "Push-Wiper：面向多样污渍与表面的通用机器人清洁框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.00730", "date": "2026-08-01T00:00:00.000Z", "summary": "Push-Wiper 将粘性污渍清洁重构为聚合问题，采用\"先聚合后收尾\"策略，通过海绵分段推挤轨迹收集污渍，并利用 Diffusion Policy 生成自适应动作序列，配合 Arbitrary Surface Pose Interpolator（ASPI）与混合力位控制器执行。", "type": "paper", "relTime": "1周前"}, {"id": 130, "title": "MiniMax H3 上线 ComfyUI 并即将开源权重", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2083289753097818315", "date": "2026-07-31T20:32:37.000Z", "summary": "感谢 @ComfyUI 团队的支持🙌 更多画布、更多自定义节点、更多工作流，很快还将开放权重，让你能构建任何想要的图结构。🧑🎨✨  MiniMax H3 现可通过 Partner Nodes 在 ComfyUI 中使用。  → 多模态输入/输出：文生视频、首/末帧、全参考  → 每个片段原生立体声音频  → 最高 2K，5-15 秒，24 FPS  → 就地编辑角色、场景、对话和语音  AP...", "type": "model", "relTime": "1周前"}, {"id": 131, "title": "LingBot-Map 教程：GPU 感知推理与点云导出", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/07/31/lingbot-map-tutorial-gpu-aware-inference-and-point-cloud-export", "date": "2026-07-31T20:27:13.000Z", "summary": "本教程演示如何用 LingBot-Map 搭建流式 3D 重建流水线，涵盖 GPU 感知配置、预处理、GCTStream 模型推理及点云生成。通过图像或视频序列，可输出一致的 3D 场景，并导出 PLY 与 NPZ 格式文件。", "type": "tip", "relTime": "1周前"}, {"id": 132, "title": "Google Earth 上线又火速撤回 Nano Banana 2 卫星图像 AI 修改功能", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/07/google-earth-releases-swiftly-retracts-ai-feature-to-make-fake-satellite-images", "date": "2026-07-31T20:21:05.000Z", "summary": "Google 短暂允许用户利用 Nano Banana 2 在 Google Earth 中生成 AI 修改版卫星图像，但因人们分享的示例凸显虚假信息风险而迅速撤回该功能。产品经理 Bryan Horowitz 在 7 月 30 日博文中称，这是首次能结合 Google Earth 真实影像与 Nano Banana 生成基于真实世界的定制图像。", "type": "product", "relTime": "1周前"}, {"id": 133, "title": "MiniMax H3 上线 OpenArt，支持 2K 视频与原生音频", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2083286328570265877", "date": "2026-07-31T20:19:00.000Z", "summary": "MiniMax H3 现已在 OpenArt 上线，支持 2K 分辨率视频与原生音频生成，可生成 5 至 15 秒片段。该模型支持文本、图像和音频生成视频，并支持起始帧、结束帧及参考图像。OpenArt 的 Wonder 用户可免费无限使用 H3 至 8 月 5 日，开源权重即将发布。", "type": "model", "relTime": "1周前"}, {"id": 134, "title": "Google 在 Google Earth 上线一天的 AI 图像生成功能 Nano Banana 2 因误导信息风险被撤下", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/31/google-nixes-its-earth-ai-feature-one-day-after-launch-amid-criticism-it-would-spread-misinformation", "date": "2026-07-31T19:47:28.000Z", "summary": "Google 周四在 Google Earth 推出基于 Nano Banana 2 的 AI 图像生成功能，允许用户将任意图像叠加到真实地图上，但遭记者和研究者批评可能被滥用传播误导信息。发布仅一天后，Google 已撤下该功能，称将加强防护措施后再重新上线。", "type": "industry", "relTime": "1周前"}, {"id": 135, "title": "Google Earth 的 AI 深度伪造功能仅上线一天即被关闭", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/973943/google-earth-ai-image-generation-deepfake-tool", "date": "2026-07-31T19:13:29.000Z", "summary": "Google 于周四推出的 Google Earth AI 图像编辑功能（基于 Nano Banana 2）因被用于生成虚假地理影像而于一天后下线。测试者 Henk van Ess 曾用该工具生成美墨边境难民、加沙医院弹坑等深度伪造图像，并称其能骗过 Hive 的 AI 检测工具。Google 表示将回滚该功能并加强护栏，同时强调生成图像带数字水印且未在主体验中公开展示。", "type": "industry", "relTime": "1周前"}, {"id": 136, "title": "Google DeepMind 推出 Gemini Robotics 2，为各类机器人提供智能层", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/google-deepmind-unveils-gemini-robotics-2-to-power-robots-of-all-shapes-from-tabletop-arms-to-humanoids", "date": "2026-07-31T18:25:08.000Z", "summary": "Google DeepMind 发布 Gemini Robotics 2，称其为迄今最先进的视觉-语言-动作（VLA）模型，可控制从桌面机械臂到全身人形机器人的各类系统。该模型支持全身运动、精细操作及多机器人协同，开发者可通过候补名单申请早期访问。同期发布的 Gemini Robotics ER 2 专为具身推理设计，已上线 Google AI Studio。", "type": "model", "relTime": "1周前"}, {"id": 137, "title": "MiniMax H3 上线 HailuoAI 与 API", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2083241267643691226", "date": "2026-07-31T17:19:57.000Z", "summary": "MiniMax H3 现已在 HailuoAI 及 MiniMax API 上线，支持文本、图像、音频和视频多模态输入生成视频，并具备精准编辑控制。该模型面向电影、广告、游戏、品牌和电商等创意场景，2K 视频定价 $0.081/秒，768p 视频即将推出，定价 $0.047/秒。", "type": "model", "relTime": "1周前"}, {"id": 138, "title": "Google Earth 内置 AI 图像生成器引发虚假信息担忧", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/973764/google-earth-ai-satellite-images", "date": "2026-07-31T17:05:46.000Z", "summary": "Google Earth 网页版本周全球上线 Nano Banana 2 功能，用户仅凭文本提示即可基于卫星和 3D 影像生成逼真图像。Digital Digging 的 Henk van Ess 已用其生成\"墨西哥边境难民\"和\"加沙医院附近炸弹弹坑\"等虚假场景。", "type": "paper", "relTime": "1周前"}, {"id": 139, "title": "Snapchat 不再奖励纯 AI 生成的 Spotlight 内容", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/31/snapchat-no-longer-rewards-fully-ai-generated-spotlight-content", "date": "2026-07-31T16:49:08.000Z", "summary": "Snapchat 宣布调整推荐系统，只有真人创作的视频才有资格获得 Spotlight 推荐，以优先展示人类原创内容。平台并未完全拒绝 AI，创作者仍可使用其 AI 工具增强或编辑内容。此举是 Snapchat 改善 Spotlight、回归原创优先策略的一部分，此前该公司已表示将减少 AI 生成内容的展示。", "type": "industry", "relTime": "1周前"}, {"id": 140, "title": "MiniMax H3 上线 Argil，开源在即", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2083222275701240298", "date": "2026-07-31T16:04:29.000Z", "summary": "MiniMax H3 已在 Argil 平台上线，官方称其能统一理解文本、图像、视频与音频，内部测试质量扎实，可生成生产级内容。MiniMax 表示 H3 开源权重即将推出，被视为行业变革者。", "type": "model", "relTime": "1周前"}, {"id": 141, "title": "Google AI 盘点 Gemini 系列多项模型更新", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2083221445375668654", "date": "2026-07-31T16:01:11.000Z", "summary": "Google AI 发布近期更新盘点：Gemini Robotics 2 为机器人带来全身智能；Gemini 3.5 Flash-Lite 主打高速与高性价比，Gemini 3.6 Flash 在减少 token 用量的同时提升速度与准确性。此外还推出面向政府的安全模型 Gemini 3.5 Flash Cyber、Nano Banana 2 图像生成及 Lyria 3.5 音乐模型。", "type": "industry", "relTime": "1周前"}, {"id": 142, "title": "MiniMax H3 开源倒计时开启", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2083216488044068906", "date": "2026-07-31T15:41:29.000Z", "summary": "👀 敬请期待！  MiniMax H3 开源发布倒计时 🔥 关注 @MiniMax_AI，第一时间获取发布消息。一个模型，统一处理文本、图像、视频和音频。支持最长 15 秒 2K 视频，自带原生立体声。", "type": "model", "relTime": "1周前"}, {"id": 143, "title": "MiniMax H3 登陆 Magnific，权重即将开源", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2083213970643763507", "date": "2026-07-31T15:31:29.000Z", "summary": "MiniMax 视频生成模型 H3 已上线 Magnific，支持最多 9 张图控制角色与风格、3 段视频控制运动与镜头，输出 2K、时长 5-15 秒。H3 权重即将开放，社区可微调并构建全新创意工作流，推动开放视频生成。", "type": "model", "relTime": "1周前"}, {"id": 144, "title": "Dreamina Seedance 2.5 上线，暂不支持美国", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2083211580364202241", "date": "2026-07-31T15:21:59.000Z", "summary": "Dreamina Seedance 2.5 已在 Dreamina AI 面向东南亚、中东、非洲、欧洲和南美付费用户上线，暂不支持美国。新模型支持原生 30 秒视频、最长 3 分钟长视频模式、Maya 和 Blender 插件、最多 50 个多模态参考，并可将时间戳精确控制到 1 秒。", "type": "model", "relTime": "1周前"}, {"id": 145, "title": "Seedance 2.5 发布，视频生成时长跃升十倍", "source": "X：Deedy Das (@deedydas)", "sourceUrl": "https://x.com/deedydas/status/2083209521342845225", "date": "2026-07-31T15:13:48.000Z", "summary": "Seedance 2.5 终于发布了，实际效果远超预期。  它能生成 30 秒片段，但\"长视频模式\"可长达 3 分钟。SOTA 视频生成时长约 10 倍的跃升前所未有（此前我们大约每 6 个月翻一倍）。  这整支带音频的预告片，就是由它一次性生成的。", "type": "paper", "relTime": "1周前"}, {"id": 146, "title": "Seedance 2.5 全面测评：单次直出 30 秒视频，小云雀角色库扩至约 7000 个", "source": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247508999&idx=1&sn=c60a65d9079660e8b40d3577939fe8b5", "date": "2026-07-31T15:10:27.000Z", "summary": "Seedance 2.5 单次直出视频时长从 15 秒延长至 30 秒，参考素材数量升至 50 个，生成后可在小云雀继续延长两次，最长做到 90 秒。新功能包括片段重拍、白模参考生成视频，角色库扩至约 7000 个角色。首发期（31 号到 6 号）上线超级会员，价格与 2.0 基本持平，最低约 1 秒 14 积分。", "type": "tip", "relTime": "1周前"}, {"id": 147, "title": "MiniMax H3 上线 PixVerse 支持 2K 视频", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2083206866314936372", "date": "2026-07-31T15:03:15.000Z", "summ

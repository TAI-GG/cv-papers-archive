ary": "稀宇科技宣布推出 MiniMax H3 通用多模态视频模型，将于北京时间 8 月 3 日 0 点在魔搭社区正式开源。该模型支持对文本、图像、视频、声音的统一理解，可输出原生双声道音视频，最高支持 15s 2K 分辨率。官方称其默认提供 2K 分辨率，每秒价格不到主流模型的 1/3，768P 分辨率下为主流 720P 的 1/2。", "type": "model", "relTime": "1周前"}, {"id": 153, "title": "PixVerse 深度图控制与画布分层工作流", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2083161043434717536", "date": "2026-07-31T12:01:10.000Z", "summary": "深度图控制 + 画布。  在这里，分层的前景营造出更强的纵深感和规模感。  我们使用深度图控制来重建参考画面的空间结构，并建立一致的基线。然后，我们将关键帧导入 PixVerse 画布，将场景分离为多个图层，并生成了多个视频变体。  转发 + 回复，我们将私信发送工作流链接和提示词。", "type": "paper", "relTime": "1周前"}, {"id": 154, "title": "欧盟《人工智能法》新增透明度要求，8 月 2 日起正式执行", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/984/365.htm", "date": "2026-07-31T11:40:12.000Z", "summary": "欧盟《人工智能法》新增透明度要求于8月2日起正式执行，聊天机器人等交互式AI系统须明确告知用户其AI身份，深度伪造内容须加标识及机器可识别标记。同日公布首批签署《人工智能生成内容透明度行为准则》的180多家机构名单，包括谷歌、微软、OpenAI等，Meta拒绝加入。违反透明度义务最高可处750万欧元或全球年营业额1%的罚款。", "type": "industry", "relTime": "1周前"}, {"id": 155, "title": "MiniMax H3 发布：开源全能多模态生成模型，支持 2K 原生立体声视频", "source": "MiniMax：Blog（网页）", "sourceUrl": "https://www.minimax.io/blog/minimax-h3", "date": "2026-07-31T09:59:02.996Z", "summary": "MiniMax 正式推出全能多模态生成模型 H3，可联合理解文本、图像、视频和音频，生成最高 2K 分辨率、15 秒时长且带原生立体声的视频。H3 在指令跟随、文字与品牌呈现、V2V 动作迁移上表现突出，2K 下每秒价格低于主流模型三分之一，768p 下低于主流 720p 价格一半。官方计划近日开源模型权重，以支持开源社区并加速硬件兼容。", "type": "model", "relTime": "1周前"}, {"id": 156, "title": "Seedance 2.5 发布，Dreamina 支持 3 分钟视频", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2083105155474506057", "date": "2026-07-31T08:19:05.000Z", "summary": "Seedance 2.5 发布：Dreamina 现支持原生 30 秒及连贯的三分钟视频、交互式帧编辑、最多 50 个多模态参考，并显著提升了真实感  Veo 4 谷歌在哪？", "type": "paper", "relTime": "1周前"}, {"id": 157, "title": "MiniMax 发布多模态生成模型 H3", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2083090032089583689", "date": "2026-07-31T07:19:00.000Z", "summary": "MiniMax 发布多模态生成模型 H3，可在统一上下文中理解文本、图像、视频和音频，并原生生成立体声与视频，支持最长 15 秒 2K 分辨率片段。该模型面向商业内容创作，支持视频到视频的运动迁移等可控多模态编辑，可处理高达 100K 输入 token 的复杂任务，并将输出压缩至约 4K token。2K 视频生成由基础模型直接完成而非传统超分，模型权重即将开源。", "type": "model", "relTime": "1周前"}, {"id": 158, "title": "字节跳动发布 Seedance 2.5 视频生成模型，小鹏汽车、智元机器人等将率先接入", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/984/146.htm", "date": "2026-07-31T07:03:46.000Z", "summary": "字节跳动今日发布新一代视频生成模型 Seedance 2.5，火山引擎将于近期上线 API 服务。徐工集团、小鹏汽车、智元机器人、穹彻智能等多家企业已达成合作意向，将率先接入该模型。Seedance 2.5 延续统一的多模态音视频联合生成架构，重点提升长叙事、多模态参考和编辑能力，并新增白模参考能力，已落地工业制造、汽车、具身智能、智能驾驶等实体产业。", "type": "model", "relTime": "1周前"}, {"id": 159, "title": "百度百舸助力具身模型高速迭代，最新成果亮相中国信通院可信云大会", "source": "公众号：百度智能云（文心）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzA5NTQ5MzE5OQ%3D%3D&mid=2653159146&idx=1&sn=a6107f62b0a1dd5865a9689d43a16e4a", "date": "2026-07-31T06:49:06.000Z", "summary": "百度智能云在2026可信云大会上分享百度百舸AI计算平台在具身模型训练、推理、仿真和资源管理方面的最新实践。平台针对VLA模型和全身控制策略两类场景优化，VLM多模态混合训练吞吐提升约1至5倍，π0.5和GR00T N1.7训练吞吐分别提升2.08倍和1.75倍，Isaac Sim任务启动时长减少83.3%。IDC报告显示，2025年百度智能云以29.55%市场份额位居中国具身智能云市场第一。", "type": "industry", "relTime": "1周前"}, {"id": 160, "title": "Seedance 2.5发布，徐工、小鹏等多家企业达成合作意向", "source": "公众号：火山引擎", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI0NzU1NzI5NQ%3D%3D&mid=2247543297&idx=1&sn=ae015e1190ee4ee8a725b2a2a78de4e3", "date": "2026-07-31T05:43:29.000Z", "summary": "火山引擎发布新一代视频生成模型 Seedance 2.5，并将于近期面向企业用户上线 API 服务。徐工集团、小鹏汽车、智元机器人、灵初智能、微分智飞、穹彻智能、Xspark AI（无界智航）等多家企业已达成合作意向，率先接入。Seedance 系列正从内容工具延伸至工业制造、汽车、具身智能等实体产业，用于训练数据合成、场景仿真与作业流程培训。", "type": "model", "relTime": "1周前"}, {"id": 161, "title": "字节跳动推出 Seedance 2.5 视频生成模型：单次生成 30 秒、突破长叙事能力", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/984/104.htm", "date": "2026-07-31T04:43:43.000Z", "summary": "字节跳动今日推出 Seedance 2.5 视频生成模型，单次生成时长从 15 秒提升至 30 秒，并支持多轮延长，可在 30 秒内组织多个具备逻辑关联的镜头。", "type": "model", "relTime": "1周前"}, {"id": 162, "title": "MiniMax H3登顶视频编辑榜，将开源权重", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2083042088338538594", "date": "2026-07-31T04:08:29.000Z", "summary": "MiniMax H3在Artificial Analysis视频编辑排行榜位列第一，文生视频第二、图生视频第三。该模型支持多模态输入，可生成5-15秒24fps带原生音频的片段，2K定价$7.80/分钟。MiniMax计划以社区许可开源权重，允许年收入低于$20M的组织商用，若发布将成为最强开源视频模型。", "type": "model", "relTime": "1周前"}, {"id": 163, "title": "PixVerse C1 无人机视角帆船视频获赞", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2083039955203334592", "date": "2026-07-31T04:00:00.000Z", "summary": "PixVerse C1 生成一段超高速 FPV 穿越帆船船队的视频，结尾水花拼出\"ADVENTURE\"字样，被赞可替代无人机拍摄。主推文称赞镜头穿行船帆的运镜效果惊艳，并感谢作者分享完整提示词。", "type": "tip", "relTime": "1周前"}, {"id": 164, "title": "MiniMax H3 上线，开放权重多模态视频模型", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2083022468688789682", "date": "2026-07-31T02:50:31.000Z", "summary": "H3 已与我们的 Day 0 合作伙伴正式上线 🚀  非常感谢 @fal 的鼎力支持。期待看到创作者们用它打造的作品！  #MiniMaxH3 #OpenWeights", "type": "model", "relTime": "1周前"}, {"id": 165, "title": "MiniMax H3 登陆 OpenRouter，开源权重将至", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2083022412703224154", "date": "2026-07-31T02:50:18.000Z", "summary": "MiniMax 的 H3 模型已上线 OpenRouter，获 Day 0 支持，开源权重即将发布。H3 是轻量级视频模型，支持文本、图像、音频与视频输入，并原生输出音视频，适用于指令编辑、文字/品牌渲染及视频到视频的运动迁移。", "type": "model", "relTime": "1周前"}, {"id": 166, "title": "MiniMax H3 发布并将开源，主打视觉包装与后期特效", "source": "公众号：数字生命卡兹克", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647684857&idx=1&sn=03c84df8bc0389c4ceb8f50f6c0015e3", "date": "2026-07-31T02:21:38.000Z", "summary": "MiniMax 发布 AI 视频模型 H3，并宣布开源。该模型主打视觉包装与后期特效，可生成动态 MV、动态海报、Vlog、电影片头、游戏 UI 等，语义遵循能力极强，在广告与动效领域表现优于 Seedance 2.0，但影视级张力镜头稍逊。H3 开源后预计将出现大量垂直领域特化版本。", "type": "model", "relTime": "1周前"}, {"id": 167, "title": "MiniMax H3 视频模型上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2083014841095319997", "date": "2026-07-31T02:20:13.000Z", "summary": "新的开放权重 @Hailuo_AI H3 已在 OpenRouter 上线，感谢 @MiniMax_AI！  H3 是一款轻量级视频模型，支持文本、图像、音频和视频输入，并具备原生音视频输出能力。专为指令驱动的编辑、文本/品牌渲染以及视频到视频的运动迁移而构建。", "type": "model", "relTime": "1周前"}, {"id": 168, "title": "MiniMax H3 全模态生成模型正式发布：最高支持 15 秒 2K 分辨率，超分方案革新", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/983/957.htm", "date": "2026-07-31T02:00:53.000Z", "summary": "稀宇科技今日发布 MiniMax H3 全模态生成模型，支持对文本、图像、视频、声音组成的多模态上下文统一理解，可输出原生双声道音视频，最高支持 15s 2K 分辨率。", "type": "model", "relTime": "1周前"}, {"id": 169, "title": "MiniMax H3 发布：开放权重与极致性价比", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2083006198828417501", "date": "2026-07-31T01:45:52.000Z", "summary": "MiniMax H3：全模态参考，商用级生成，无可匹敌的成本效率，开放权重。  你的创作命运，由你主宰。  现已上线 http://HailuoAI.video 及 MiniMax API。", "type": "product", "relTime": "1周前"}, {"id": 170, "title": "Gemini Omni Flash 登顶视频编辑排行榜", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2082991648703930561", "date": "2026-07-31T00:48:03.000Z", "summary": "Google 的 Gemini Omni Flash 在 Artificial Analysis 视频编辑排行榜上位列第一，超越阿里 Wan 2.7 和 HappyHorse 1.0，并已占据文生视频和图生视频榜首。", "type": "tip", "relTime": "1周前"}, {"id": 171, "title": "面向暗光环境的鲁棒 3D 感知 RGB-NIR 成像新方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.29684", "date": "2026-07-31T00:00:00.000Z", "summary": "东京大学等机构提出一种无需干净 RGB 监督的 3D 感知神经隐式融合模型，可在暗光下将极噪 RGB 观测与近红外（NIR）线索在 3D 空间中隐式融合，恢复干净 RGB 图像。该方法引入 NIR 调制的位置编码和 Color Code MLP，解决噪声过拟合与 NIR-RGB 映射不适定问题，在合成与真实多视图数据集上优于现有方法，并能泛化至不同噪声水平。代码与数据将公开。", "type": "paper", "relTime": "1周前"}, {"id": 172, "title": "SULAND v2：面向无人机/无人车地表地雷检测的精细化RGB数据集与基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.28996", "date": "2026-07-31T00:00:00.000Z", "summary": "SULAND v2发布，一个经人工修正标注的RGB地表地雷检测数据集与基准，含33，771张图像和12，433个边界框。标注修正使YOLOv8分布内测试mAP@50提升14.6-19.6个百分点，修复OOD类别ID约定后平均OOD mAP@50提升约25个百分点。", "type": "paper", "relTime": "1周前"}, {"id": 173, "title": "视觉生成中文本条件作用的缩放特性研究", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.29679", "date": "2026-07-31T00:00:00.000Z", "summary": "研究发现，视觉生成中扩散损失随提示词中结构化语言量呈规律缩放：与GPG近似线性下降，与ED呈幂律关系。基于此，通过构建含语义与几何标注的结构化提示提升可扩散性，并训练提示器提升可提示性。最终系统在几乎所有组合、推理与世界知识基准上超越开源模型，并在多数评测中匹敌或超过最强闭源模型。", "type": "paper", "relTime": "1周前"}, {"id": 174, "title": "多参考图像编辑的评估-验证奖励（EVR）方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.29025", "date": "2026-07-31T00:00:00.000Z", "summary": "针对多参考图像编辑中视觉一致性与和谐性评估难题，研究者提出多维评估-验证奖励（EVR），将评估分解为五个视觉标准，由MLLM评估器生成多个候选假设，验证器基于具体视觉证据逐条接受或拒绝，产生可靠细粒度奖励信号。该方法无需架构改动即可对现成编辑器进行RL微调，实验显示在Qwen-Image-Edit基础上显著提升，一致性与和谐性达到或超越NanoBanana。", "type": "paper", "relTime": "1周前"}, {"id": 175, "title": "冻结像素空间扩散模型可利用自身生成样本进行自引导", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.29122", "date": "2026-07-31T00:00:00.000Z", "summary": "像素空间扩散模型无需重新训练主干，即可利用中间层与最终层预测差异进行自引导采样。研究者提出的Synthetic Self-Guidance（SSG）仅用模型生成样本训练轻量适配器，训练算力不足全模型训练的1%，在ImageNet上使JiT变体FID降低超50，并将JiT-H/16从1.86提升至1.67、PixelREPA-H/16从1.81提升至1.59。", "type": "paper", "relTime": "1周前"}, {"id": 176, "title": "DiffusionGemma 技术报告：基于离散扩散的高效文本生成模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.00146", "date": "2026-07-31T00:00:00.000Z", "summary": "DiffusionGemma 是一个实验性开源权重语言模型，通过离散扩散并行迭代精炼 256 个 token 的块，而非逐 token 解码，从而避免自回归模型的顺序解码瓶颈。", "type": "paper", "relTime": "1周前"}, {"id": 177, "title": "ST-WAM：面向视觉分布偏移下鲁棒操控的语义-时序世界动作模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.28993", "date": "2026-07-31T00:00:00.000Z", "summary": "视频生成式世界动作模型在视觉分布偏移下会出现训练分布幻觉，预测未来偏离当前场景。ST-WAM 以 DINOv3 作为共享语义表示，结合双空间未来专家与当前锚定意图检索，无需额外具身预训练或任务标注，推理时无需显式未来生成。相比 Fast-WAM，ST-WAM 在 LIBERO-Plus 零样本性能提升若干个百分点，真实世界成功率在视觉偏移下提升一倍以上。", "type": "paper", "relTime": "1周前"}, {"id": 178, "title": "谷歌 DeepMind 推出 Gemini Robotics ER 2，最强具身推理模型支持连续视频理解与多机器人协作", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/983/915.htm", "date": "2026-07-30T23:12:07.000Z", "summary": "谷歌 DeepMind 发布 Gemini Robotics ER 2，这是其面向机器人的最强具身推理模型。相比 1.6 版本，ER 2 可分析连续视频流以追踪任务进度、在出错时调整，并在任务进度分类测试中准确率达 57.4%，时刻寻找测试中准确率为 91.3%。该模型执行速度为更大模型的 4 倍，支持多机器人协作，现已通过 Gemini API 和 Google AI Studio 公开提供。", "type": "model", "relTime": "1周前"}, {"id": 179, "title": "Codex 图像生成新增灯箱与画布功能", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2082944138635595782", "date": "2026-07-30T21:39:16.000Z", "summary": "Codex 中的 ImageGen 刚刚新增了灯箱和画布功能。  现在，在工作流中探索和优化视觉内容变得更加容易。", "type": "paper", "relTime": "1周前"}, {"id": 180, "title": "NVIDIA Cosmos3 蒸馏版登顶开源文生图/视频榜首", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2082929595226165285", "date": "2026-07-30T20:41:29.000Z", "summary": "NVIDIA 发布 Cosmos3-Super-4Step 蒸馏模型，将推理步数从 50 步（文生图）和 35 步（图生视频）降至 4 步，并去除了无分类器引导。", "type": "tip", "relTime": "1周前"}, {"id": 181, "title": "Krea AI 为 Doodles 训练定制 LoRA 模型", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2082919416346677510", "date": "2026-07-30T20:01:02.000Z", "summary": "所有现成的图像模型都难以学会 @doodles 的风格。  因此我们与 @burnttoast 合作，训练了一个自定义的 Krea 2 LoRA，现在每张生成的图像都 unmistakably Doodles。  想让你的品牌也拥有同样的效果？8 月 12 日网络研讨会 👇", "type": "model", "relTime": "1周前"}, {"id": 182, "title": "Google Earth 集成 Nano Banana 2 图像生成", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2082902334984609936", "date": "2026-07-30T18:53:09.000Z", "summary": "Google Earth 网页版上线基于 Nano Banana 2 的图像生成功能，用户可通过文本提示词将卫星与 3D 影像结合，重新想象全球任意地点（如百年前的城市风貌或社区新球场）。该功能现已面向所有用户开放。", "type": "paper", "relTime": "1周前"}, {"id": 183, "title": "Google 发布 Gemini Robotics 2.0，提升机器人灵巧性与安全性", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/07/google-reveals-gemini-robotics-2-0-promising-improved-dexterity-and-safety", "date": "2026-07-30T17:58:02.000Z", "summary": "Google DeepMind 推出 Gemini Robotics 2，通过 Gemini Robotics ER 2 等三个新子模型为机器人带来全身智能。ER 2 可处理实时视频流，关键动作识别准确率近 90%，并支持多机器人协作。新安全基准 ASIMOV-Agentic 已开源至 Hugging Face，ER 2 模型即日起通过 Gemini Live API 向开发者开放。", "type": "model", "relTime": "1周前"}, {"id": 184, "title": "Google DeepMind 发布 Gemini Robotics 2，包含三款实体 AI 模型用于全身控制、灵巧操作与多机器人协作", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/07/30/google-deepmind-gemini-robotics-2-whole-body-control-dexterity-multi-robot-collaboration", "date": "2026-07-30T17:20:50.000Z", "summary": "Google DeepMind 发布 Gemini Robotics 2，作为其下一代机器人的智能层。该版本包含三个模型：用于全身人形控制的视觉-语言-动作模型、用于具身推理与任务编排的 Gemini Robotics ER 2，以及可在数小时内适配新机器人本体的端侧 VLA。单个检查点驱动 Apptronik Apollo 2 与 Franka Duo，仅 ER 2 公开可用。", "type": "model", "relTime": "1周前"}, {"id": 185, "title": "Codex 挑战\"不可能任务\"：5分钟搭建3D打印机仪表盘", "source": "X：Greg Brockman (@gdb)", "sourceUrl": "https://x.com/gdb/status/2082864105883586798", "date": "2026-07-30T16:21:15.000Z", "summary": "Greg Brockman 引用用户案例，展示 Codex 在短时间内完成\"不可能\"任务的能力。用户让 Codex 构建一个监控 3D 打印机的自定义仪表盘，它仅用 5 分钟就自动找到打印机 IP 并生成了包含详细信息的实时仪表盘。", "type": "tip", "relTime": "1周前"}, {"id": 186, "title": "PixVerse 推出企业级 AI 视频与图像 API", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2082860463692317043", "date": "2026-07-30T16:06:46.000Z", "summary": "正在构建应用？AI 视频或许能派上用场。 通过 @PixVerse_ 将企业级 AI 视频和图像集成到你的产品中。  ⚡️快速生成。🔑生产级 API。📍专为消费级应用打造。  了解更多 👇 https://pixverse.ai/en/developers", "type": "product", "relTime": "1周前"}, {"id": 187, "title": "Gemini 新增免费视频生成功能", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2082860353021440287", "date": "2026-07-30T16:06:20.000Z", "summary": "FYI，Gemini 目前有更多免费 Omni 生成额度  【引用 @GeminiApp】：从今天起，你可以在 Gemini 中*免费*创建十个视频，截止时间为太平洋时间 2026 年 8 月 4 日晚上 11：59。  只需在工具菜单中选择\"创建视频\"，即可创建、编辑和混剪视频，将你的想法变为现实。  在评论区分享你如何使用 Gemini Omni 👇", "type": "product", "relTime": "1周前"}, {"id": 188, "title": "Gemini macOS 应用新增全局语音交互", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2082858829541458008", "date": "2026-07-30T16:00:17.000Z", "summary": "Gemini macOS 应用推出全局语音功能，用户可在任意活跃窗口中通过语音输入、编辑和总结内容，或让 Gemini 分析本地文件、生成视觉内容。该功能已面向全球英文用户逐步推送，更多语言支持即将到来。", "type": "paper", "relTime": "1周前"}, {"id": 189, "title": "Runway Characters 入选 SIGGRAPH 2026 Real-Time Live！ 现场演示", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/company-news/runway-characters-siggraph-2026", "date": "2026-07-30T16:00:00.000Z", "summary": "Runway 的实时交互数字人系统 Characters 入选 SIGGRAPH 2026 的 Real-Time Live！ 环节，团队在现场用一张照片数秒内生成可对话的角色。该系统从单张图片出发，无需微调即可适配任意风格，逐帧生成画面以支持长达 30 分钟以上的连续对话。Characters 于今年 3 月上线，团队正探索可导航环境、多参考图像及记忆功能等后续方向。", "type": "tip", "relTime": "1周前"}, {"id": 190, "title": "字节发布 Seedance 2.5：单次生成 30 秒视频，支持多模态参考与精准编辑", "source": "字节 Seed：Research Feed（网页内嵌数据）", "sourceUrl": "https://seed.bytedance.com/zh/blog/%E4%B8%80%E9%95%9C%E6%88%90%E7%89%87-%E9%9A%8F%E5%BF%83%E5%8F%82%E8%80%83-seedance-2-5-%E6%AD%A3%E5%BC%8F%E5%8F%91%E5%B8%83", "date": "2026-07-30T16:00:00.000Z", "summary": "字节跳动今日正式发布新一代视频创作模型 Seedance 2.5，单次视频生成时长从 15 秒提升至 30 秒，并支持多轮延长，可产出数分钟连贯内容。模型支持单次输入最多 30 张图片、10 段视频和 10 段音频作为参考素材，并升级白模参考、运动参考及绿幕编辑、时间戳精准编辑等能力。Seedance 2.5 已陆续上线即梦 AI、豆包专业版等平台，API 服务近期将上线火山方舟。", "type": "model", "relTime": "1周前"}, {"id": 191, "title": "Imagine Video 1.5 with References Jul 31， 2026 # Imagine Video 1.5 with References Our best video model， now with text， image， and voice references - generating up to 1080p. Read More", "source": "xAI：News（网页）", "sourceUrl": "https://x.ai/news/grok-imagine-video-1-5-references", "date": "2026-07-30T16:00:00.000Z", "summary": "暂无摘要", "type": "model", "relTime": "1周前"}, {"id": 192, "title": "Google 推出具身推理模型 Gemini Robotics ER 2", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2082857770303340719", "date": "2026-07-30T15:56:04.000Z", "summary": "Google 发布 Gemini Robotics ER 2，一个全新的具身推理模型。该模型在成功/失败检测上支持原始视频流而非静态快照，可捕捉溢出、滑落等执行中故障；通用仪表读数能力从圆形表盘扩展至数字显示屏、线性刻度尺、液体温度计等 10 种类型。其空间 VQA 能力也通过 Gemini 多模态理解提升得到增强。", "type": "model", "relTime": "1周前"}, {"id": 193, "title": "Google DeepMind 推出三款新机器人模型", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2082855791334240665", "date": "2026-07-30T15:48:12.000Z", "summary": "Google DeepMind 发布三款新机器人模型。Gemini Robotics 2 是高级视觉-语言-动作模型，支持全身人形机器人、指尖操作和双臂机器人。Gemini Robotics ER 2 具备具身推理能力，可帮助机器人与人沟通、理解世界并规划多步骤任务。", "type": "model", "relTime": "1周前"}, {"id": 194, "title": "Seedance 2.5 明日发布，支持更长视频", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2082854638814998967", "date": "2026-07-30T15:43:38.000Z", "summary": "Seedance 2.5 明日发布。  Seedance 2.0 在 AI 视频生成领域仍处于领先地位。2.5 版本将超越它，据我们所知，还将支持更长的片段。", "type": "paper", "relTime": "1周前"}, {"id": 195, "title": "Gemini Robotics ER 2 发布，专为物理 AI 设计", "source": "X：Google AI for Developers (@googleaidevs)", "sourceUrl": "https://x.com/googleaidevs/status/2082845684747702522", "date": "2026-07-30T15:08:03.000Z", "summary": "Gemini Robotics ER 2 是我们最强大的具身推理模型，专为物理 AI 设计 🤖  该模型作为机器人的高级大脑，可直接连接 Gemini Live API。它处理连续视频流以跟踪进度、调用工具、搜索网络，并实时指挥动作模型。  面向开发者的升级包括：+ 增强的进度跟踪 + 实时执行中故障检测 + 多机器人协作 + 高级安全指令遵循", "type": "model", "relTime": "1周前"}, {"id": 196, "title": "开发者欲实时模糊Claude生成内容", "source": "X：Dex Horthy（HumanLayer）(@dexhorthy)", "sourceUrl": "https://x.com/dexhorthy/status/2082845002745753912", "date": "2026-07-30T15:05:20.000Z", "summary": "我发誓，我一定要用 vibe coding 搞一个屏幕截图工具，能检测我显示器上的 Claude 垃圾内容并实时模糊掉，这样我就再也不用看到这破玩意儿了。", "type": "tip", "relTime": "1周前"}, {"id": 197, "title": "Google DeepMind 发布 Gemini Robotics 2 与 ER 2", "source": "X：Google AI (@GoogleAI)", "sourceUrl": "https://x.com/GoogleAI/status/2082844740446253125", "date": "2026-07-30T15:04:18.000Z", "summary": "Google DeepMind 推出 Gemini Robotics 2，作为新一代自适应机器人的智能层，支持全身控制、高级灵巧操作及多机器人协作。同时发布新具身推理模型 Gemini Robotics ER 2，作为机器人的\"高层大脑\"，负责观察环境、推理任务步骤、协调视觉-语言-动作模型执行动作并追踪进度，使机器人能执行复杂多步骤工作流、自我纠错并适应全新场景。", "type": "model", "relTime": "1周前"}, {"id": 198, "title": "Google DeepMind 发布 Gemini Robotics 2 物理 AI", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2082844162928381956", "date": "2026-07-30T15:02:00.000Z", "summary": "One brain. For any robot. 🤖  我们正在推出 Gemini Robotics 2：我们的下一代物理 AI，为仿人机器人带来全身智能、高级灵巧性、多机器人团队协作等能力。", "type": "paper", "relTime": "1周前"}, {"id": 199, "title": "Gemini Robotics ER 2：用视频理解、任务编排与多机器人协作赋能机器人", "source": "Google DeepMind：Blog（RSS）", "sourceUrl": "https://deepmind.google/blog/gemini-robotics-er-2-powering-robotics-with-video-understanding-task-orchestration-and-multi-robot-collaboration", "date": "2026-07-30T15:00:59.000Z", "summary": "Google DeepMind 推出 Gemini Robotics ER 2，一个基于 Gemini 的机器人基础模型。该模型在视频理解、工具编排和多机器人协作方面实现阶跃式提升，使机器人能够推理、协作并解决真实世界任务。", "type": "model", "relTime": "1周前"}, {"id": 200, "title": "Gemini macOS 应用新增\"语音对话\"功能", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2082828124211806545", "date": "2026-07-30T13:58:16.000Z", "summary": "Google 为 Gemini macOS 桌面应用推出\"Speak to Window\"语音交互功能。用户可通过长按 Fn 键直接语音输入，让 Gemini 完成信息提取与摘要、文本撰写与改写、图像生成与编辑等任务，无需手动打字。", "type": "paper", "relTime": "1周前"}, {"id": 201, "title": "Luma Agents 上线 Layers 图层提取功能", "source": "X：Luma AI (@LumaLabsAI)", "sourceUrl": "https://x.com/LumaLabsAI/status/2082813292335046837", "date": "2026-07-30T12:59:20.000Z", "summary": "Layers 现已在 Luma Agents 中上线。让智能体从任意图像中提取图层--无论是 Luma 生成的还是上传的。然后继续对话：替换产品、重设背景风格、重写标题。 更改一个元素，保留其余一切。由 Uni-1 驱动。", "type": "product", "relTime": "1周前"}, {"id": 202, "title": "影视飓风用百度搭子完成追风拍摄：从公开信息研判到本地素材筛选", "source": "公众号：百度智能云（文心）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzA5NTQ5MzE5OQ%3D%3D&mid=2653159144&idx=1&sn=3a81c4fdb379714c0751526b14bc4aa0", "date": "2026-07-30T11:03:50.000Z", "summary": "影视飓风在追风项目中用百度搭子处理大量重复、复杂的信息工作：团队只需描述任务，百度搭子即可自主规划路径，从多个公开来源检索数据、交叉验证并生成结构化可视化报告，将过去耗时数小时的信息采集压缩到几分钟内完成。拍摄结束后，它还能直接理解本地图片和视频，按需求识别、筛选闪电等关键素材。面向企业用户和内容创作者，百度搭子分别提供企业版和自媒体套件，覆盖资料研究、知识管理、素材管理等复杂工作流。", "type": "tip", "relTime": "1周前"}, {"id": 203, "title": "阿里云Qwen模型家族演进图谱发布", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2082773341954527236", "date": "2026-07-30T10:20:35.000Z", "summary": "Qwen模型家族网络图谱：一次关于AI真正如何演进的视觉导览--从大语言模型到具身智能。  在下方视频中发现完整的演进过程。  准备好进一步探索了吗？ • 试用Model Studio：https://click.alibabacloud.com/m/20000000959/ • 或探索Qwen Cloud：https://click.qwencloud.com/m/20000000996/", "type": "tip", "relTime": "1周前"}, {"id": 204, "title": "小米人形机器人工厂实测：折箱拧螺丝成功率98%", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2082771319305666670", "date": "2026-07-30T10:12:33.000Z", "summary": "小米创始人雷军发布视频展示其人形机器人在工厂作业，机器人成功完成折叠储物箱等任务，另一台小米机器人负责拍摄。小米称其机器人自攻螺丝加载站成功率已达98%，仅比人类工人低1%。该机器人还在测试工厂物流新任务，如分拣中控台盖板和折叠回收箱，成功率约90%。", "type": "industry", "relTime": "1周前"}, {"id": 205, "title": "昆仑万维方汉：AIGC进入内容通胀时代，稀缺资产定义投资新范式", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI1MzE1NDc3Mg%3D%3D&mid=2247509963&idx=1&sn=42c951cc27d1504eb93c790952174561", "date": "2026-07-30T09:00:00.000Z", "summary": "昆仑万维董事长兼CEO方汉在2026中国科创投资夏季峰会上指出，AIGC正带来\"内容通胀\"，AI短剧单部成本从超200万元降至不到10万元，音乐小样成本从数万元降至极低。他认为单品成本下降但行业总投入反升，稀缺性从生产能力转向优质内容、版权、IP、流量与分发能力，并给出图像看版权、视频看有效交付成本、音乐看权利分发的差异化投资逻辑。", "type": "tip", "relTime": "1周前"}, {"id": 206, "title": "特斯拉 Robotaxi 新增车载录制功能，采集路况数据优化自动驾驶", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/983/604.htm", "date": "2026-07-30T06:47:11.000Z", "summary": "特斯拉为有人监督的 Robotaxi 测试车辆新增中控屏录制功能，可记录车辆遥测数据和行驶过程。约 20 分钟行程占用 10% 磁盘空间，数据用于验证测试和 AI 模型训练。目前特斯拉 Robotaxi 车队累计无人监督自动驾驶里程已突破 38 万英里（约 61.2 万公里），服务已扩展至迈阿密、奥兰多和坦帕。", "type": "model", "relTime": "1周前"}, {"id": 207, "title": "Pangram AI图像检测器100%准确识别造假", "source": "X：Deedy Das (@deedydas)", "sourceUrl": "https://x.com/deedydas/status/2082687319606542637", "date": "2026-07-30T04:38:46.000Z", "summary": "用Pangram刚刚推出的AI图像检测器，跑了一遍r/IsThisAI（320万用户）子版块的热门帖子。准确率100%。  能识别一切：- 网络钓鱼（约会资料）- 篡改（验孕棒、超声波）- 虚假广告（宠物、食品）- 烂借口（车坏了）- 宣传内容  它检测的是实际像素，而不仅仅是C2PA元数据/SynthID。  AI骗子们彻底完了。", "type": "tip", "relTime": "1周前"}, {"id": 208, "title": "Agnes 2.5 Pro Alpha 发布，低价推理模型 Intelligence Index 达 39", "source": "X：Artificial Analysis (@ArtificialAnlys)", "sourceUrl": "https://x.com/ArtificialAnlys/status/2082662482523406752", "date": "2026-07-30T03:00:04.000Z", "summary": "新加坡 AI 实验室 Agnes AI 推出 Agnes 2.5 Pro Alpha，这是一款支持文本、图像和视频输入的低价推理模型。其在 Artificial Analysis Intelligence Index 上得分为 39，定价为每百万输入 token $0.45、每百万输出 token $0.90，是该智能水平下价格最低的专有模型之一。", "type": "tip", "relTime": "1周前"}, {"id": 209, "title": "Flux 3 生成《荒原》朗诵视频效果惊艳", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2082657371990503549", "date": "2026-07-30T02:39:46.000Z", "summary": "Ethan Mollick 用 Flux 3 生成《荒原》末段朗诵视频，由现代渔王在衰败城市背景下演绎。视频在语调与语言切换上表现惊人。", "type": "tip", "relTime": "1周前"}, {"id": 210, "title": "Vision Pro 最酷的用法：将户型图转为3D模型辅助建房决策", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://christianselig.com/2026/07/vision-pro-house", "date": "2026-07-30T00:17:54.835Z", "summary": "一位用户利用 Vision Pro 将平面户型图通过 Fusion 360 转为 3D 模型，在高分辨率虚拟空间中\"行走\"以感受房间尺度与动线。通过添加 IKEA 等家具 3D 模型，进一步模拟真实空间感，帮助做出装修决策。", "type": "tip", "relTime": "1周前"}, {"id": 211, "title": "RefCaptioner：多参考图像锚定的视频描述生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.28509", "date": "2026-07-30T00:00:00.000Z", "summary": "RefCaptioner提出多参考图像锚定视频描述任务，通过两阶段训练框架联合优化参考选择、短语级绑定与干扰项拒绝。训练语料含20，000个视频和171，354张参考图像，并引入MRVBench基准评测。实验显示其在开源模型中综合表现最佳，人工评估中描述更受偏好。", "type": "paper", "relTime": "1周前"}, {"id": 212, "title": "PhiZero：围绕\"物理语言\"构建的世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.28624", "date": "2026-07-30T00:00:00.000Z", "summary": "PhiZero 是一种基于\"物理语言\"的物理世界模型，该语言通过自监督学习从野外视频中提取世界状态转移的紧凑离散表征。它采用先推理后渲染的范式，先以物理语言序列推断未来世界演化，再由扩散解码器渲染成视频。实验验证了其在物理一致性生成、细粒度动作条件模拟和零样本运动迁移上的能力。", "type": "paper", "relTime": "1周前"}, {"id": 213, "title": "ACE-Data-0：以人为中心的环境捕捉作为具身数据引擎", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.28625", "date": "2026-07-30T00:00:00.000Z", "summary": "ACE Robotics 与南洋理工大学推出环境捕捉引擎（ACE），将真实家庭环境转化为录制影棚，以桌面级和房间级两种配置同步记录第一人称视频、多视角视频、全身动作及物体 6-DoF 轨迹。", "type": "paper", "relTime": "1周前"}, {"id": 214, "title": "Chimera：混合视觉扩散 Transformer 的设计与 Chinchilla 式缩放", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.28611", "date": "2026-07-30T00:00:00.000Z", "summary": "Chimera 是一种混合视觉扩散骨干架构，将文本、图像与视频 token 统一为单流处理，结合 Kimi Delta Attention、交错 Multi-head Latent Attention 与模态感知短卷积，无需位置嵌入即可处理长序列。", "type": "paper", "relTime": "1周前"}, {"id": 215, "title": "ReToken：一个token提升视觉语言模型的视觉检索能力", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.28627", "date": "2026-07-30T00:00:00.000Z", "summary": "ReToken通过一个可学习的嵌入token作为检索目标，从预填充的视觉KV缓存中筛选与查询相关的稀疏视觉token。在Visual Haystacks基准上，ReToken使Qwen3VL-8B提升13.4分、InternVL3.5提升12.4分；在LVBench上零样本迁移至长视频任务，为Qwen3VL-8B带来8.0分提升。", "type": "paper", "relTime": "1周前"}, {"id": 216, "title": "SpatialCLI：让视觉语言模型先借助空间工具推理、再内化能力", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.27703", "date": "2026-07-30T00:00:00.000Z", "summary": "SpatialCLI 提出三阶段框架，教视觉语言模型调用空间工具并逐步内化专家感知能力：先通过 Call 暴露专家视觉模型，再用 Cold-Start SFT 和智能体强化学习改进工具使用，最后将成功轨迹内化为自身能力。", "type": "paper", "relTime": "1周前"}, {"id": 217, "title": "MoMo：通过时空动作分词实现机器人操作中的运动模式控制", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/momo-motion-mode-manipulation", "date": "2026-07-30T00:00:00.000Z", "summary": "机器人操作需根据任务、物体和交互环境调整动作执行方式。MoMo 提出两阶段模仿学习框架，包含时空动作分词器和行为克隆 Transformer，将任务与连续运动模式条件作为输入。在六项真实机器人操作任务中，改变该条件可稳定生成不同执行风格的动作。", "type": "paper", "relTime": "1周前"}, {"id": 218, "title": "VAD：多模态同策略蒸馏中的视觉证据归因目标重建", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.28590", "date": "2026-07-30T00:00:00.000Z", "summary": "多模态同策略蒸馏（OPD）的逐token纠错混合了视觉信号与语言先验，难以判断哪些纠错有视觉证据支持。为此提出视觉归因蒸馏（VAD），通过反事实目标重建算法，在保留与移除相关视觉证据时对比同一教师模型的输出变化，估计纠错中可归因于视觉的部分并重建学生锚定目标。在4B和9B规模、六个细粒度视觉基准上，VAD优于直接特权视图蒸馏和视觉优势加权。", "type": "paper", "relTime": "1周前"}, {"id": 219, "title": "xAI 起诉明尼苏达州总检察长，称反\"脱衣\"应用法律迫使 Grok 限制图像编辑功能", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/policy/972850/xai-grok-minnesota-nudification-lawsuit", "date": "2026-07-29T21:06:52.000Z", "summary": "xAI 对明尼苏达州一项针对\"脱衣\"应用的法律提起诉讼，称该法惩罚性条款使其\"别无选择，只能以多种方式限制 Grok Imagine 的图像编辑功能\"，并主张该法违反第一修正案。该法于 5 月签署，8 月 1 日生效，允许总检察长对每次违规处以最高 50 万美元罚款。此前 Grok 在 1 月生成约 300 万张色情深度伪造图像，其中约 2.3 万张涉及儿童。", "type": "industry", "relTime": "1周前"}, {"id": 220, "title": "Gemini 免费生成十段视频至 2026 年 8 月", "source": "X：Gemini (@GeminiApp)", "sourceUrl": "https://x.com/GeminiApp/status/2082563490431246623", "date": "2026-07-29T20:26:42.000Z", "summary": "从今天起，你可以在 Gemini 中免费创建十段视频，截止时间为太平洋时间 2026 年 8 月 4 日晚上 11：59。  只需在工具菜单中选择\"创建视频\"，即可生成、编辑和混剪视频，将你的创意变为现实。  在回复中分享你如何使用 Gemini Omni 👇", "type": "paper", "relTime": "1周前"}, {"id": 221, "title": "GPTZero 发现普华永道中东公司报告含AI生成内容与捏造来源", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/pwc-has-allegedly-published-ai-generated-reports-containing-false-or-fabricated-sources", "date": "2026-07-29T17:44:18.000Z", "summary": "GPTZero 检测发现，普华永道中东公司 2024-2026 年的四份报告中存在捏造来源和虚假声明。其中《Transforming Governance》报告有 84% 概率完全由 AI 生成，该报告用于推广产品\"Citizen Pulse\"，但无证据支持其被多国政府采用的声明。GPTZero 将此类行为称为\"Vibe Citing\"。", "type": "industry", "relTime": "1周前"}, {"id": 222, "title": "Pangram 4 发布：AI 文本检测误报率降至每 24，000 份文档一次", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/pangram-says-its-new-ai-text-detector-makes-only-one-mistake-per-24000-documents", "date": "2026-07-29T17:16:53.000Z", "summary": "Pangram 推出新一代 AI 文本检测模型 Pangram 4，据其基准测试，能正确识别 99.66% 的 AI 文本，误报率仅为 0.0041%（约每 24，000 份文档一次错误）。新模型规模扩大 6 倍，误报率降低 14 倍，并能区分 AI 辅助润色与完全由 AI 生成的文本。API 价格为每 100 词 $0.05，所有套餐现可免费扫描图片。", "type": "model", "relTime": "1周前"}, {"id": 223, "title": "PixVerse 深度图参考功能提升 AI 视频质量", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2082515459400925583", "date": "2026-07-29T17:15:51.000Z", "summary": "我们测试了深度图参考--创作者用于生成更清晰 AI 视频输出的新工具。 那层额外的灰度图承载着空间逻辑。 它帮助输出遵循相同的镜头节奏、前景-背景关系和运动路径。", "type": "paper", "relTime": "1周前"}, {"id": 224, "title": "Tavus PAL Maker：无代码创建视频AI智能体", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2082509704966664422", "date": "2026-07-29T16:52:59.000Z", "summary": "Tavus 发布 PAL Maker，首个无代码构建 PAL 的工具。用户只需通过自然语言描述需求，即可创建能看、听、记忆并理解情感的实时视频 AI 智能体，无需手动配置面部、声音、个性或知识库。生成的 PAL 可一键分享或嵌入网站/应用，将实时面对面 AI 智能体从开发者项目转变为几乎人人可用的产品。", "type": "product", "relTime": "1周前"}, {"id": 225, "title": "阿里Qwen3.7-Flash上线OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2082496629442224227", "date": "2026-07-29T16:01:02.000Z", "summary": "来自 @Alibaba_Qwen 的 Qwen3.7-Flash 已在 OpenRouter 上线。  一款支持视觉的快速推理模型，适用于多模态智能体、视觉编码、搜索和计算机交互，具备工具使用能力和 1M 上下文窗口。  立即体验：https://openrouter.ai/qwen/qwen3.7-flash", "type": "model", "relTime": "1周前"}, {"id": 226, "title": "Pangram 发布 AI 检测模型与图像预览功能", "source": "X：Deedy Das (@deedydas)", "sourceUrl": "https://x.com/deedydas/status/2082492383820951847", "date": "2026-07-29T15:44:09.000Z", "summary": "Pangram 推出 Pangram 4 模型，规模扩大 6 倍，可检测\"人性化\"文本，假阳性率仅万分之一，并能识别 Opus 5、GPT 5.6 Sol 等最新模型。同时发布 Pangram Image Preview，用于检测 AI 生成图像。Substack、Quora、Google Classroom 及 NeurIPS 等已采用该技术，业务过去一年增长 35 倍。", "type": "industry", "relTime": "1周前"}, {"id": 227, "title": "PixVerse 推出免费生成与夏日视频广告功能", "source": "X：PixVerse (@PixVerse_)", "sourceUrl": "https://x.com/PixVerse_/status/2082481523706437848", "date": "2026-07-29T15:01:00.000Z", "summary": "在 @PixVerse4Biz 上免费生成 3 次。 尝试地址：https://growth.pixverse.ai/?utm_source=X&utm_id=Social", "type": "industry", "relTime": "1周前"}, {"id": 228, "title": "雷军展示小米机器人工厂工作视频：\"督工\"也是机器人，还会比耶耍酷", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/983/342.htm", "date": "2026-07-29T14:57:37.000Z", "summary": "小米CEO雷军今日分享了一段小米机器人在工厂工作的视频，视频中一台白色涂装机器人折叠收纳盒后，镜头转向另一台黑色涂装机器人\"督工\"，它对着镜头比出\"耶\"手势。此前小米公布，自攻螺母上件工站双侧作业成功率已提升至98%，与人工作业合格率仅差1%并正式\"转正\"；新岗位中控台侧盖板排序和料箱折叠回收均达到90%成功率。", "type": "paper", "relTime": "1周前"}, {"id": 229, "title": "Kernel Forge：用MCTS优化CUDA内核的开源智能体框架", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2082480019948122293", "date": "2026-07-29T14:55:02.000Z", "summary": "Kernel Forge 是一个开源智能体框架，能直接改写未修改 PyTorch 模型的 CUDA 内核，覆盖视觉、扩散和 LLM 任务。它用蒙特卡洛树搜索（MCTS）替代线性生成-修复流程，在 NVIDIA DGX Spark（GB10 GPU）上以每内核 50 次迭代优化了 4 个模型的 14 个内核，使其超越 PyTorch 基线。性能提升主要来自框架结构和原位集成，而非更强的模型。", "type": "paper", "relTime": "1周前"}, {"id": 230, "title": "微软4B流式视觉模型Mage-VL发布", "source": "X：Berry Xia (@berryxia)", "sourceUrl": "https://x.com/berryxia/status/2082466087141351853", "date": "2026-07-29T13:59:40.000Z", "summary": "微软推出仅4B参数的流式视觉语言模型Mage-VL，专为直播式视频理解设计。该模型能实时描述视频内容，并支持用户用自然语言指定关注时刻（如\"火车到站时\"），在低算力下实现高效流式处理。实测可在Mac mini上完成本地部署。", "type": "tip", "relTime": "1周前"}, {"id": 231, "title": "SpaceXAI 起诉明尼苏达州，反对\"AI 脱衣\"应用禁令", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/983/298.htm", "date": "2026-07-29T12:12:21.000Z", "summary": "马斯克旗下 xAI（已更名为 SpaceXAI）起诉明尼苏达州总检察长，反对一项将于本周六生效的禁止\"脱衣\"应用的法律。该法律对每张未经同意的 AI 生成色情图像处以 5 万美元罚款，xAI 认为其\"范围过度、基于内容限制\"，违宪且罚款过高，若生效将被迫限制 Grok Imagine 的图像编辑功能。明尼苏达州总检察长回应称将在法庭上交锋，州长则以\"法庭见，混蛋\"回应。", "type": "industry", "relTime": "1周前"}, {"id": 232, "title": "可灵 MCP 教程：快速生成时尚电商视频", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2082435980049711231", "date": "2026-07-29T12:00:02.000Z", "summary": "可灵 MCP 教程：几分钟内创建时尚电商视频  了解如何利用可灵 MCP 将产品照片转化为高质量时尚视频--从定义视觉风格、准备模特图像，到规模化生成产品展示视频。  更少制作。更多内容。", "type": "tip", "relTime": "1周前"}, {"id": 233, "title": "Google SynthID 水印难以破解，但无法解决 AI 虚假信息问题", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/07/tested-google-synthid-works-great-but-labeling-ai-content-may-be-a-losing-game", "date": "2026-07-29T11:00:39.000Z", "summary": "斯坦福大学与南加州大学合作的 Starling Lab 估计，人类在相机发明后 149 年才创造出 15 亿张图像，而生成式 AI 仅用 18 个月就达到相同规模。Google 在 I/O 大会上宣布其工具在短短几年内已生成超 1000 亿张 AI 图像和视频，并扩大 SynthID 水印技术的合作伙伴关系以标记 AI 内容。但水印技术本身无法从根本上解决 AI 虚假信息问题。", "type": "tip", "relTime": "1周前"}, {"id": 234, "title": "Pangram 完成 900 万美元融资，推出 AI 文本与图像检测模型", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/29/as-ai-content-floods-the-internet-pangram-raises-9m-to-detect-it", "date": "2026-07-29T11:00:00.000Z", "summary": "AI 检测初创公司 Pangram 完成 900 万美元融资，并推出新一代文本检测模型 Pangram 4 及图像检测模型 Pangram Image。Pangram 4 声称对 AI 辅助写作和混合人机内容的检测准确率超过 99%。用户可通过每月 20 美元的订阅服务或 Chrome 扩展使用该技术。", "type": "industry", "relTime": "1周前"}, {"id": 235, "title": "Codex 接管 tldraw 画布，一句话生成 3D 地球应用", "source": "X：Vista (@vista8)", "sourceUrl": "https://x.com/vista8/status/2082401754134852064", "date": "2026-07-29T09:44:01.000Z", "summary": "画布应用 tldraw 被 AI 工具 Codex 接管后，用户可通过自然语言指令直接开发应用程序。演示视频显示，用 Codex 调用 tldraw cli 一句话即可生成 3D 地球用于地理学习。此外，该组合还能快速搭建项目看板、Todo 及复杂交互演示，成为在线教育演示的新利器。", "type": "tip", "relTime": "1周前"}, {"id": 236, "title": "阻挡救护车、消防车，Waymo 等自动驾驶出租车面临美国新一轮联邦监管审查", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/983/108.htm", "date": "2026-07-29T07:33:00.000Z", "summary": "美国加州众议员凯文·穆林提出《自动驾驶汽车应急响应协调法案》，要求 NHTSA 制定全国最低安全标准，并建立 24 小时应急热线与\"地理围栏\"机制，允许地方政府在紧急事件中限制 Robotaxi 运行。此前多起 Waymo 自动驾驶汽车阻挡救护车、消防车及驶入犯罪现场的事件引发关注。Waymo 回应称支持建立联邦监管框架与统一协作标准。", "type": "industry", "relTime": "1周前"}, {"id": 237, "title": "Momenta 获德国全境 L4 级自动驾驶测试许可，系中国企业首次", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/983/103.htm", "date": "2026-07-29T07:25:56.000Z", "summary": "Momenta 正式获得德国 KBA 颁发许可，可在德国全国城市道路进行 L4 级自动驾驶测试，无需逐城申报。这是中国企业首次在德国获得覆盖全国城市道路的 L4 测试资质，其安全验证标准与欧盟框架直接对接。Momenta Robotaxi 已与 Uber、Grab 等出行平台及梅赛德斯-奔驰、宝马等德国车企建立战略合作。", "type": "industry", "relTime": "1周前"}, {"id": 238, "title": "特斯拉关闭 Model Y Robotaxi 转向灯提示音，优化无人驾驶乘客体验", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/983/057.htm", "date": "2026-07-29T06:43:20.000Z", "summary": "特斯拉通过软件更新关闭了 Model Y Robotaxi 的转向灯提示音，取消车内\"咔哒\"声以降低背景噪音、营造更安静的乘坐环境。目前其 Robotaxi 无人监督行程已覆盖奥斯汀、达拉斯、休斯敦、迈阿密、奥兰多、坦帕等 7 个市场，车队累计无人监督行驶里程超过 38 万英里（约 61.2 万公里）。", "type": "industry", "relTime": "1周前"}, {"id": 239, "title": "Flux 3 生成复杂提示视频效果惊人", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2082339882031026392", "date": "2026-07-29T05:38:10.000Z", "summary": "Flux 3 根据一段包含宇航员、摄政舞会、罗斯科壁画、骑士与忍者打斗等复杂元素的详细提示词，生成了令人印象深刻的视频。该模型能够连贯地呈现多场景切换与细节，展示了其在复杂视频生成任务上的能力。", "type": "tip", "relTime": "1周前"}, {"id": 240, "title": "Flux 3 视频模型生成水獭用笔记本，效果惊人", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2082319924987351510", "date": "2026-07-29T04:18:52.000Z", "summary": "Ethan Mollick 用新发布的 Flux 3 视频模型测试\"水獭在飞机上用笔记本电脑\"的生成效果，结果非常出色。对比 2022 年图像生成器输出的无意义内容，Flux 3 首次尝试即生成细节丰富、光照自然的视频，展现两年间 AI 视频生成的巨大进步。", "type": "tip", "relTime": "1周前"}, {"id": 241, "title": "See2Think：多模态模型真的会使用中间视觉状态吗？", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.26769", "date": "2026-07-29T00:00:00.000Z", "summary": "See2Think 提出统一评测框架，含 See2ThinkBench 基准与 Visual Action-of-Thought（VAoT）协议。基准覆盖 1，200 道跨 12 类任务的视觉依赖问题，评测发现视觉推理高度依赖模型与环境，渲染保真度是主要瓶颈。在任务相关的损坏反馈干预下，模型准确率下降超过 10 个百分点，表明其对视觉状态存在行为依赖。", "type": "paper", "relTime": "1周前"}, {"id": 242, "title": "VideoCoCo：用代码作为思维链实现物理一致的视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.27380", "date": "2026-07-29T00:00:00.000Z", "summary": "VideoCoCo 提出一种智能体双引擎框架，用可执行的 Blender 代码作为过程级思维链，由编码智能体生成显式描述场景及其时间演化的程序，模拟引擎产出确定性时空草稿，再由生成视频引擎通过草稿条件编辑将其转化为逼真视频。", "type": "paper", "relTime": "1周前"}, {"id": 243, "title": "DistillAlign：自回归视频蒸馏中协调模式覆盖与模式寻求的新方法", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.26811", "date": "2026-07-29T00:00:00.000Z", "summary": "现有自回归视频蒸馏方法通常将初始化与DMD阶段解耦，导致目标分布不匹配。DistillAlign提出联合蒸馏框架，在DMD模式寻求目标基础上引入一致性蒸馏（Consistency Distillation）的模式覆盖约束。实验表明，即使使用Wan-1.3B DMD教师，该方法在生成质量、覆盖度和多样性上仍优于使用Wan-14B教师精调的基线，凸显了分布对齐的重要性。", "type": "paper", "relTime": "1周前"}, {"id": 244, "title": "StatePlay：面向机制一致游戏生成的状态感知世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.26754", "date": "2026-07-29T00:00:00.000Z", "summary": "腾讯研究团队提出 StatePlay，一种状态感知游戏世界模型，能联合预测游戏帧与内部状态（血量、技能槽、计时器），确保生成内容符合游戏规则。StatePlay 采用混合 Transformer（MoT）架构，分别优化视觉与状态分支并实现跨模态交互。实验显示，其状态预测平均归一化 L1 距离低于 0.06，生成游戏回放的机制保真度相比无显式状态建模的模型提升 18.6%。", "type": "paper", "relTime": "1周前"}, {"id": 245, "title": "HumanCLAW 框架发布：评估视觉语言模型能否通过身体执行动作", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.27180", "date": "2026-07-29T00:00:00.000Z", "summary": "Meta、南洋理工大学等机构联合提出 HumanCLAW 评估框架，将动作决策与底层运动控制解耦，让 VLM 每步输出原子技能指令并由物理引擎执行。基于该框架构建的 HumanCLAW-Bench 包含长程第一人称导航交互任务，测试 9 个 SOTA VLM 后无一通过，最佳模型成功率极低。瓶颈不在目标识别，而在于 VLM 缺乏具身自我意识，无法追踪自身位置、是否到达目标或撞到障碍物。", "type": "paper", "relTime": "1周前"}, {"id": 246, "title": "Mental World Modeling：让世界模型模拟物理场景背后的心智状态", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.27201", "date": "2026-07-29T00:00:00.000Z", "summary": "现有世界模型只回答物理问题，却忽略驱动人类行为的隐藏心智状态。论文提出 Mental World Modeling（MWM）理论框架，将心智变量作为世界模型的核心组件，并实例化为无需训练、完全可检查的 MENTIS 基线。在涵盖文本、图像和视频故事的情境决策数据集上，8 个现代 LLM 世界模型的实验表明，显式建模心智状态对预测人类决策至关重要。", "type": "paper", "relTime": "1周前"}, {"id": 247, "title": "ICDAR 2026 科学图表信息提取竞赛：Sci-ImageMiner 基准与多模态模型表现分析", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2607.26848", "date": "2026-07-29T00:00:00.000Z", "summary": "ICDAR 2026 竞赛推出 Sci-ImageMiner，一个覆盖 ALD/E 科学图表的专家标注基准数据集，包含四项端到端互补任务，吸引 68 名参赛者提交 1，263 次结果。研究发现，当前最先进的多模态模型在分类和摘要任务上表现良好，但在数据提取和科学推理（尤其是视觉问答）上仍显不足。数据集与评估脚本以 CC BY 4.0 许可开源。", "type": "paper", "relTime": "1周前"}, {"id": 248, "title": "LeapTalk：打破数字人视频生成的延迟与质量权衡", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.00079", "date": "2026-07-29T00:00:00.000Z", "summary": "LeapTalk 提出一种基于布朗桥的单步扩散蒸馏框架，实现实时、任意长度的数字人视频生成，单 GPU 上推理速度最高达 200 FPS。该方法通过数据到数据的传输公式和持久视觉锚点缓解身份漂移与误差累积，并引入音频驱动的无分类器引导以保持唇形同步精度，在效率与稳定性上显著优于现有方法。", "type": "paper", "relTime": "1周前"}, {"id": 249, "title": "机器人检测初创公司 Spur 获 Insight Partners 2 亿美元融资", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/07/28/bot-detection-startup-spur-nabs-200m-from-insight", "date": "2026-07-28T21:29:34.000Z", "summary": "佛罗里达州网络安全初创公司 Spur Intelligence 从 Insight Partners 获得 2 亿美元融资。该公司由两位前国防部工程师于 2017 年创立，技术帮助企业区分真实用户与日益隐蔽的机器人流量。据 Cloudflare 上月报告，截至 2026 年中，机器人流量已首次超过人类流量。", "type": "industry", "relTime": "1周前"}];

  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();
</script>

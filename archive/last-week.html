"title": "VBVR-Pro：可扩展且可验证的原生视觉推理套件", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.26105", "date": "2026-08-26T00:00:00.000Z", "summary": "VBVR-Pro 是一个闭环测试平台，通过将视觉生成作为推理媒介，使原生视觉推理可训练、可验证、可优化。它提供 300 个程序化生成任务，训练后的模型在 RISE-Video、MME-CoF-Pro、BabyVision 等七个外部基准上表现强劲；其基于确定性规则的可验证奖励评分器优于主流 VLM-as-a-judge 范式，并支持大规模多任务强化学习。", "type": "paper", "relTime": "1周前"}, {"id": 7, "title": "Procedura：用程序化控制实现智能体3D建模", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.26238", "date": "2026-08-26T00:00:00.000Z", "summary": "Procedura 是一个新型3D建模智能体框架，将对象编写为程序化装配体--一种参数化程序，其命名部件通过类型化、机器可检查的配合关系连接。该智能体从文本提示出发，将对象规划为装配图并逐部分编写程序，通过编译、配合和连通性检查后才接受部件，并由视觉批评器逐项诊断修复。", "type": "paper", "relTime": "1周前"}, {"id": 8, "title": "智能体游戏开发作为可验证轨迹数据引擎，用于扩展世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.25518", "date": "2026-08-26T00:00:00.000Z", "summary": "论文提出扩展世界模型不应仅依赖更多爬取视频和算力，而需递归数据引擎提供 grounded 奖励信号。游戏开发可提供缺失的奖励环境：游戏引擎能高效检查碰撞、物理、可导航性和有界可玩性，并生成真实长程轨迹数据。据此提出 RLHEV（Reinforcement Learning with Human-Engine Verification）后训练范式，结合密集引擎信号与开发过程中隐含的人类接受反馈。", "type": "paper", "relTime": "1周前"}, {"id": 9, "title": "Zero-WAM：利用人类视频实现开放任务泛化的上下文世界-动作建模", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.26103", "date": "2026-08-26T00:00:00.000Z", "summary": "Zero-WAM是一种因果视频-动作模型，通过上下文人类视频引导执行训练中未见过的操作任务，将大语言模型的上下文学习范式引入机器人操作。在RoboTwin 2.0模拟的七个未见任务上，Zero-WAM平均成功率达47.0%，较最强视频-动作基线绝对提升29.5个百分点；真实世界评估中可泛化至多物体场景、长时程操作和精细插入任务。", "type": "paper", "relTime": "1周前"}, {"id": 10, "title": "Paint What You See：多模态智能体精细视觉工具使用能力基准 EASEL", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.25417", "date": "2026-08-26T00:00:00.000Z", "summary": "研究提出 EASEL 基准，以参考图引导的绘画重建为核心任务，评估多模态智能体的精细视觉工具使用能力，并配套提供 44 万样本的分阶段课程数据集 EASEL-Data 及模型 EASEL-9B。", "type": "paper", "relTime": "1周前"}, {"id": 11, "title": "Stability AI 获 7600 万美元 B 轮融资，环球音乐、索尼音乐、EA 参投", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/25/stability-ai-maker-of-image-generator-stable-diffusion-raises-76-million-in-fresh-funding", "date": "2026-08-25T19:03:47.000Z", "summary": "Stability AI 完成 7600 万美元 B 轮融资，累计融资总额达 2.32 亿美元。本轮投资方包括环球音乐集团、索尼音乐集团、华纳音乐集团和游戏巨头 EA，以及 AMD Ventures 和 Pacific Alliance Ventures。公司计划将资金用于扩展\"创意制作\"产品套件和专业服务部门。", "type": "industry", "relTime": "1周前"}, {"id": 12, "title": "多模态 RAG 在幻灯片中的应用：基于 GPT-4V 的构建与评估", "source": "LangChain：Blog（RSS）", "sourceUrl": "https://www.langchain.com/blog/multi-modal-rag-template", "date": "2026-08-25T18:51:52.000Z", "summary": "使用 GPT-4V 为幻灯片构建多模态 RAG 应用，支持视觉问答。文章对比了不同实现方法，并通过基准测试进行评估，最后提供 LangChain 模板用于部署。", "type": "tip", "relTime": "1周前"}, {"id": 13, "title": "LangChain 多向量检索器：面向表格、文本与图像的 RAG 实现指南", "source": "LangChain：Blog（RSS）", "sourceUrl": "https://www.langchain.com/blog/semi-structured-multi-modal-rag", "date": "2026-08-25T18:26:11.000Z", "summary": "LangChain 推出多向量检索器，支持在表格、文本和图像上实现 RAG。文章提供半结构化与多模态数据检索的 cookbook 示例，帮助开发者构建跨多种数据类型的检索增强生成流程。", "type": "tip", "relTime": "1周前"}, {"id": 14, "title": "Skild S1 机器人基础模型：视频即提示词", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2092312459382235407", "date": "2026-08-25T18:05:38.000Z", "summary": "Skild 发布机器人基础模型 S1，用视频演示替代语言指令来定义任务。只需提供 1 段人类视频，S1 即可直接执行长达 10 分钟的多步骤新任务，无需重新训练或微调。若规模化，基础模型训练的高昂数据成本可摊薄至数千个新任务，有望改变机器人学习的经济性。", "type": "model", "relTime": "1周前"}, {"id": 15, "title": "Runway AI 峰会九月旧金山召开", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2092310365279514644", "date": "2026-08-25T17:57:18.000Z", "summary": "更多演讲者将加入 Runway AI 峰会。今年九月在旧金山，来自机器人、自动驾驶、营销和基础设施领域的行业领袖将齐聚一堂，用一天时间探讨 AI 如何重塑智能与世界的交汇方式。  点击下方链接了解更多并注册。", "type": "industry", "relTime": "1周前"}, {"id": 16, "title": "Krea 上线 Wan 3.0，支持 20 参考图与 30 秒带音频生成", "source": "X：Krea AI (@krea_ai)", "sourceUrl": "https://x.com/krea_ai/status/2092303502651564260", "date": "2026-08-25T17:30:02.000Z", "summary": "Wan 3.0 现已登陆 Krea。  支持 20 张参考图像，以及 30 秒带音频的生成，成本仅为同类质量模型的零头。  立即体验 👇", "type": "model", "relTime": "1周前"}, {"id": 17, "title": "Meta AI 推出 MetaRoCE：面向 AI 规模以太网的全新 RDMA 传输协议", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/25/meta-ai-introduces-metaroce-a-clean-sheet-rdma-transport-built-for-ai-scale-ethernet", "date": "2026-08-25T17:25:36.000Z", "summary": "Meta 发布 MetaRoCE，一种为 AI 工作负载设计的全新 RDMA 传输协议，将网络视为有损链路，把排序、路径选择与恢复下沉到网卡，仅需交换机支持 ECN 与 ECMP。在 64 节点 AMD GPU 集群运行 RCCL 集合通信时，1% 丢包率下仍保持约 86% 吞吐量。Meta 将通过 Open Compute Project（OCP）发布规范、合规测试套件及参考软件实现。", "type": "paper", "relTime": "1周前"}, {"id": 18, "title": "MAI-Image-2.6登顶图像编辑榜", "source": "X：Mustafa Suleyman（Microsoft AI CEO） (@mustafasuleyman)", "sourceUrl": "https://x.com/mustafasuleyman/status/2092287421983441278", "date": "2026-08-25T16:26:08.000Z", "summary": "Microsoft AI 发布 MAI-Image-2.6-Preview，在 Artificial Analysis 图像编辑排行榜登顶第一，文本生成图像位列第二（仅次于 OpenAI 的 GPT Image 2）。该模型在 19 个分类榜单中拿下 5 个第一，现已在 MAI Playground 和 Microsoft Foundry 私有预览中提供。", "type": "model", "relTime": "1周前"}, {"id": 19, "title": "HN 头条有多少是 AI 内容？作者两次抽样调查给出答案", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://blog.coredump.cx/p/how-much-of-hn-is-ai", "date": "2026-08-25T16:21:34.454Z", "summary": "一位博主对 Hacker News 头条的 AI 内容占比做了两次抽样调查：2026 年 2 月，每日 Top 5 中多数日子有 4-5 条与 AI 相关；6 月更新数据显示，AI 相关或 AI 生成内容约占每日头条的 50%-60%，高于 2 月的 40%。作者还借助 AI 文本检测工具 Pangram 识别疑似 AI 撰写的文章，并人工复核了标记结果。", "type": "tip", "relTime": "1周前"}, {"id": 20, "title": "AI检测器是知识垄断的守门工具", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2092274760151609783", "date": "2026-08-25T15:35:50.000Z", "summary": "Rohan Paul 引用 Brian Roemmele 观点：AI 检测器被卖给大学体系，以保护其对知识生产的垄断。AI 让任何人都能生成合格文本，该系统便用\"AI 垃圾\"标签污名化非官方渠道产出，打压独立研究者和学生。Pantagram 等公司靠出售此服务并炫耀精英履历牟利。", "type": "tip", "relTime": "1周前"}, {"id": 21, "title": "Gamma 收购 Accel 投资的 AI 设计初创公司 Lica", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/25/gamma-acquires-accel-backed-design-startup-lica", "date": "2026-08-25T15:00:00.000Z", "summary": "演示文稿初创公司 Gamma 收购了 Accel 支持的设计初创公司 Lica，以建立自己的设计研究实验室，Lica 联合创始人将负责领导该部门。Lica 成立于 2023 年，曾获 Accel、South Park Commons 等投资的 400 万美元，专注于为电商网站制作符合品牌准则的营销视频。Gamma 表示希望借助新部门探索多模态演示文稿等不同沟通形式，但未透露具体产品计划。", "type": "industry", "relTime": "1周前"}, {"id": 22, "title": "商汤 SenseNova U1.5 Lite 开源并上线 Token 计划", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2092258195536540124", "date": "2026-08-25T14:30:00.000Z", "summary": "商汤 SenseNova U1.5 Lite 已开源并上线 Token 计划，提供免费公开测试版，每 5 小时可享 1，500 次请求。该模型支持图像生成与编辑一体化，具备参考图驱动创作、复杂指令跟随、原生 2K/4K 输出及自动提示词优化等能力。", "type": "model", "relTime": "1周前"}, {"id": 23, "title": "阿里云AI Spotlight回归，Wan3.0视频生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092235551416176966", "date": "2026-08-25T13:00:01.000Z", "summary": "AI Spotlight 携 Wan3.0 回归  Wan3.0 帮你将现有素材转化为可塑、可打磨、可激活的视频。创作视频不再意味着从零开始。  即刻体验：Qwen Cloud： https://click.qwencloud.com/m/20000002025/ Model Studio： https://click.alibabacloud.com/m/20000002017/  #Le...", "type": "model", "relTime": "1周前"}, {"id": 24, "title": "乌克兰向英国企业开放大规模标注战场数据集，达成标志性AI武器合作", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/ukraine-opens-its-massive-labeled-battlefield-dataset-to-british-firms-in-a-landmark-ai-weapons-partnership", "date": "2026-08-25T12:16:41.000Z", "summary": "英国成为首个获准访问乌克兰Avengers Labs数据平台的国家，该平台训练AI模型识别并打击目标。该数据集含约500万张标注图像，训练出的系统每月处理超10万条无人机视频流，识别敌方装备准确率70%、单目标耗时2.2秒。获批企业只能在安全数据室内训练测试模型，成品AI归乌克兰所有。", "type": "industry", "relTime": "1周前"}, {"id": 25, "title": "AtlasV 集成阿里云 Wan 2.7 生成 AI 时尚视频", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092207458131300792", "date": "2026-08-25T11:08:24.000Z", "summary": "静态图片到动态时尚视频--无需摄影棚。🎥 AtlasV 的 Collart 平台集成阿里云 Wan 2.7，将产品和模特照片转化为可扩展的高质量 AI 视频。制作更快，零传统拍摄限制。阅读案例研究：https://click.alibabacloud.com/m/20000002727/ 在阿里云 Model Studio 试用 Wan：https://click.alibabacloud....", "type": "industry", "relTime": "1周前"}, {"id": 26, "title": "训练人工智能用代码作画", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://surya.website/rling-qwen-to-paint-with-code", "date": "2026-08-25T10:45:18.601Z", "summary": "一位纽约布鲁克林的设计师兼创意技术专家，尝试训练人工智能用代码作画。文章从创作者视角出发，探讨如何将编程与视觉艺术结合，让 AI 通过代码生成绘画作品。", "type": "tip", "relTime": "1周前"}, {"id": 27, "title": "阿里云 Wan 3.0 上线 Magnific 平台", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092201373907702151", "date": "2026-08-25T10:44:13.000Z", "summary": "阿里云 Wan 3.0 视频生成模型正式上线 Magnific 平台，支持 30 秒生成、原生音频集成及像素级一致性，可处理单镜头到完整场景。用户可上传最多 20 张参考图，输出 1080p 视频，提供五种画幅比例或自适应构图，并可选 Standard 或 Prime 加速档位，最高优惠 40%。API 已同步开放至 Model Studio 和 Qwen Cloud。", "type": "model", "relTime": "1周前"}, {"id": 28, "title": "ChatGPT 图像生成自定义贴纸包", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2092160789121524211", "date": "2026-08-25T08:02:57.000Z", "summary": "ChatGPT 现在可以通过 GPT Image 生成可自定义的贴纸包。  用户之后也可以在 iMessage 或 WhatsApp 上分享这些贴纸。", "type": "product", "relTime": "1周前"}, {"id": 29, "title": "阿里云 Wan3.0 展示游戏级变身特效", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092146783732334726", "date": "2026-08-25T07:07:18.000Z", "summary": "阿里云展示 Wan3.0 视频生成模型极限能力，用一段连续镜头完成角色移动、能量积聚、人变龙形、巨龙成型与空中飞行等复杂游戏风格 VFX。该测试由 @VivaReelna1 在 VivaReel 平台使用 Wan3.0 beta 完成，重点验证特效连续性、结构变形、粒子整合与电影级运镜，现已在 Qwen Cloud 和阿里云 Model Studio 开放试用。", "type": "model", "relTime": "1周前"}, {"id": 30, "title": "阿里云 Wan3.0 展示无声叙事的细腻表情与角色一致性", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092145632337367123", "date": "2026-08-25T07:02:43.000Z", "summary": "阿里云发布 Wan3.0 视频生成模型，通过 @VivaReelna1 的短片展示其在无声叙事中处理细腻表情、保持角色一致性的能力。该作品在 VivaReel 上使用 Wan 3.0 beta 制作，用户可通过 Qwen Cloud 和阿里云 Model Studio 体验。", "type": "model", "relTime": "1周前"}, {"id": 31, "title": "万相3.0助力巧克力广告实现电影级光影", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092144729257558229", "date": "2026-08-25T06:59:08.000Z", "summary": "阿里云展示万相3.0（Wan3.0）在VivaReel上生成的巧克力广告，在多场景中保持高级光影与逼真产品细节。该模型通过阿里云Model Studio提供，用于提升品牌视觉内容质量。", "type": "model", "relTime": "1周前"}, {"id": 32, "title": "通义万相 Wan 3.0 上线 ComfyUI，支持 30 秒视频生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092141336589959458", "date": "2026-08-25T06:45:39.000Z", "summary": "阿里云通义万相 Wan 3.0 现已上线 ComfyUI，可一次生成完整 30 秒场景，支持 480p 快速迭代至 1080p 高清输出。用户可通过 Model Studio 和 Qwen Cloud 获取更多 API 接入方式。", "type": "model", "relTime": "1周前"}, {"id": 33, "title": "面壁智能：MiniCPM-o-4.5 驱动 Agent 构建复杂 AI 工作流", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2092138398509326561", "date": "2026-08-25T06:33:58.000Z", "summary": "面壁智能（OpenBMB）展示 AI 智能体在 MiniCPM-o-4.5 与开源生态支持下，可完成从模型理解、微调到调试部署的复杂工作流。引用案例中，Agent 在 68 分钟内从零微调多模态模型，生成 1000 条质检数据与训练脚本，全程仅需回答 6 轮问题。", "type": "tip", "relTime": "1周前"}, {"id": 34, "title": "阿里云 Wan 3.0 上线 Topview，视频生成更便宜", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092137584973770826", "date": "2026-08-25T06:30:44.000Z", "summary": "阿里云 Wan 3.0 现已上线 Topview，支持更长视频生成与更多创意灵活性，并提供专属优惠。Ultra Annual 套餐下，用 Wan 3.0 生成 30 秒视频仅需 1.20 美元，且享 365 天无限次生成，成本为 Seedance 2.5 的 1/3，无限访问时长为其 6 倍。API 已同步开放至 Model Studio 与 Qwen Cloud。", "type": "industry", "relTime": "1周前"}, {"id": 35, "title": "阿里云 Wan 3.0 上线 OpenRouter", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092137088326189442", "date": "2026-08-25T06:28:46.000Z", "summary": "阿里云 Wan 3.0 现已上线 OpenRouter，支持文本、图像或参考素材生成 2-30 秒视频，最高 1080p。发布定价为每秒 $0.05/$0.10/$0.20，各分辨率限时 15% 折扣。用户还可通过 Model Studio 和 Qwen Cloud 获取 API 访问。", "type": "model", "relTime": "1周前"}, {"id": 36, "title": "通义万相3.0上线Runway支持多参考生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092130468875710650", "date": "2026-08-25T06:02:28.000Z", "summary": "Wan 3.0 现已上线 @runwayml。🚀 支持多图像、视频和音频参考输入，生成视频与音频，为每次生成带来更多控制。立即在 Runway 上体验。更多 API 接入：• Model Studio：https://click.alibabacloud.com/m/20000002017/ • Qwen Cloud：https://click.qwencloud.com/m/2000000...", "type": "model", "relTime": "1周前"}, {"id": 37, "title": "阿里云 Wan 3.0 上线 Pika，支持 20 参考与 30 秒生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092127790602866913", "date": "2026-08-25T05:51:49.000Z", "summary": "阿里云 Wan 3.0 已登陆 Pika，支持最多 20 个参考、30 秒生成，并增强视觉与音频真实感。Pika API Club 提供比竞品低至 35% 的专属价格，另可通过 Model Studio 与 Qwen Cloud 接入。", "type": "model", "relTime": "1周前"}, {"id": 38, "title": "阿里云 Wan 3.0 上线 OpenArt，原生 30 秒生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092126602390122729", "date": "2026-08-25T05:47:06.000Z", "summary": "阿里云 Wan 3.0 现已在 OpenArt 上线，支持单次原生 30 秒视频生成，无需拼接，并保持角色、动作与光影一致，输出最高 1080p。用户可通过 Model Studio 与 Qwen Cloud 获取 API 接入。OpenArt 本周（8 月 24-31 日）升级 Pro 或 Wonder 套餐可无限次生成。", "type": "model", "relTime": "1周前"}, {"id": 39, "title": "阿里云 Wan 3.0 上线 Picsart 支持 30 秒视频", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092125034353705209", "date": "2026-08-25T05:40:52.000Z", "summary": "阿里云 Wan 3.0 正式上线 Picsart，支持原生 30 秒视频生成、同步音频及最多 20 个参考输入，确保跨镜头角色与细节一致。用户可先在 480p 下草稿，最终输出全质量版本，适合产品视频、广告概念等场景。API 已通过 Model Studio 和 Qwen Cloud 开放。", "type": "model", "relTime": "1周前"}, {"id": 40, "title": "阿里云 Wan 3.0 上线 Flick，支持 30 秒生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092124100827480088", "date": "2026-08-25T05:37:10.000Z", "summary": "阿里云 Wan 3.0 现已上线 @flickartHQ，支持最长 30 秒的视频生成，为每段镜头带来更多时间与创作自由。Flick 作为早期内测方，使用 Wan 3.0 制作了官方预告片《PHANOS》，称其具备行业领先质量与极具竞争力的定价。API 可通过 Model Studio 和 Qwen Cloud 获取。", "type": "model", "relTime": "1周前"}, {"id": 41, "title": "阿里云 Wan3.0 上线 ZenCreator，支持 30 秒无剪辑连续镜头", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092123643874844918", "date": "2026-08-25T05:35:21.000Z", "summary": "阿里云 Wan3.0 登陆 ZenCreator Pro，主打流畅动作、丰富细节与更长序列。相比常见 AI 视频的拼接短片，Wan 3.0 可生成单个连续 30 秒镜头、全程无剪辑。开发者可通过 Model Studio 和 Qwen Cloud 获取 API 访问。", "type": "model", "relTime": "1周前"}, {"id": 42, "title": "阿里云 Wan3.0 上线 SocialSight，支持 30 秒 1080p 视频", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092122602890506567", "date": "2026-08-25T05:31:12.000Z", "summary": "阿里云 Wan3.0 正式登陆 SocialSight，可将瞬间想法生成为 30 秒 1080p 高清电影级片段，并保持角色在每一帧中形象一致。用户还可通过 Model Studio 和 Qwen Cloud 获取更多 API 访问权限。", "type": "model", "relTime": "1周前"}, {"id": 43, "title": "阿里云 Wan3.0 评测：创作工作流实战表现", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092119789070352578", "date": "2026-08-25T05:20:02.000Z", "summary": "阿里云称 Wan2.7 到 Wan3.0 是质的飞跃，具备实用专业价值。@JesusPlazaX 在 Magnific Spaces 中全面测试了 Wan3.0，覆盖角色一致性、文生视频、动作、口型同步、宣传片、3D 动画风格及多语言提示词等场景。Wan3.0 现已上线 Magnific，并提供 Model Studio 和 Qwen Cloud 的 API 访问。", "type": "tip", "relTime": "1周前"}, {"id": 44, "title": "阿里云 Wan3.0 发布，视频生成质量飞跃", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092118611674726871", "date": "2026-08-25T05:15:21.000Z", "summary": "阿里云发布 Wan3.0 视频生成模型，被评测者评价为\"质量持续高水准，而非偶发\"，相较 Wan2.7 堪称全新模型。该模型支持文生视频（T2V）、图生视频（I2V）和参考生视频（R2V），现已上线 fal 平台，并提供 Model Studio 和 Qwen Cloud 的 API 访问。", "type": "model", "relTime": "1周前"}, {"id": 45, "title": "字节跳动发布\"豆包工作\"，与飞书深度打通", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/865.htm", "date": "2026-08-25T02:47:43.000Z", "summary": "字节跳动今日正式发布面向生产力场景的Agent产品\"豆包工作\"，可自主拆解任务、调用工具并推进复杂工作流程，电脑版已开放下载，即日起可免费领取30天订阅权益。该产品与飞书深度打通，登录后能继承权限范围内的企业知识和工作上下文，并支持生成编辑文档、图片、视频、网页及应用，以及跨软件操作电脑和云电脑远程执行任务。", "type": "product", "relTime": "1周前"}, {"id": 46, "title": "通义万相 Wan 3.0 上线 Pixmax，限时 7 折", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2092065672314634747", "date": "2026-08-25T01:44:59.000Z", "summary": "阿里云通义万相 Wan 3.0 已上线 AI 创作平台 Pixmax，主打电影级画质输出。新版本支持任意艺术风格下的视觉一致性、物理真实的流畅运动，以及多模态与混合现实编辑能力。即日起至 8 月 24 日，Pixmax 用户可享 30% 折扣；开发者还可通过 Model Studio 与 Qwen Cloud 获取 API 接入。", "type": "model", "relTime": "1周前"}, {"id": 47, "title": "OpenRouter 视频生成 API：一份代码优先的接入指南", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/tutorials/video-generation-api", "date": "2026-08-25T00:00:00.000Z", "summary": "OpenRouter 推出统一的异步视频生成 API，通过 POST /api/v1/videos 提交任务、轮询状态并下载 MP4，支持 Seedance、Veo、Wan 等模型，切换模型只需更改 model 标识符。", "type": "tip", "relTime": "1周前"}, {"id": 48, "title": "STARFlow2：用归一化流桥接语言模型，实现统一多模态生成", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/starflow2-multimodal-generation", "date": "2026-08-25T00:00:00.000Z", "summary": "STARFlow2 提出将自回归归一化流与语言模型统一，用于多模态生成。该方法观察到自回归归一化流与 LLM 共享因果掩码、KV-cache 机制和从左到右结构，从而弥合文本与图像生成的架构差异，避免离散 token 化带来的视觉保真度损失。", "type": "paper", "relTime": "1周前"}, {"id": 49, "title": "MoTE：面向多任务视频理解的任务专家混合解码器架构", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.24763", "date": "2026-08-25T00:00:00.000Z", "summary": "论文提出MoTE（Mixture of Task Experts）解码器架构，将大语言模型的前馈网络转换为任务特定专家，同时共享多模态主干网络。实例化模型VideoLLM-MoTE在五个COIN基准上采用显式任务路由，五专家模型每样本激活约2B LLM参数，平均top-1准确率超过近期VideoLLM基线，并优于密集全专家激活与学习式稀疏路由。", "type": "paper", "relTime": "1周前"}, {"id": 50, "title": "LAWA：用潜在动作作为意图，让世界动作模型高效想象未来", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.24882", "date": "2026-08-25T00:00:00.000Z", "summary": "LAWA 用紧凑潜在动作表征未来意图，在不生成未来观测的情况下实现高效测试时未来想象，省去未来视频分支。在 RoboCasa 上，LAWA 在少样本和全数据设置下平均成功率分别达 65.6% 和 80.8%，比 Fast-WAM 基线高 9.6 和 4.5 个点，同时推理延迟比 Joint-WAM 低 42.9%，并在 LIBERO-Plus 和真实任务上表现稳健。代码和模型将开源。", "type": "paper", "relTime": "1周前"}, {"id": 51, "title": "WeMM-Embedding：微信多模态嵌入技术报告", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.24053", "date": "2026-08-25T00:00:00.000Z", "summary": "微信发布WeMM-Embedding通用多模态嵌入模型系列，支持文本、图像、视频、视觉文档及任意交错多模态输入，提供2B、4B、9B三种参数规模。其中2B版本已在MMEB-v2上超越此前领先的8B开源基线，9B版本以80.6总分创下新SOTA。该系列已在微信视频号、公众号、朋友圈及电商等推荐与搜索场景大规模部署，模型权重与代码已开源。", "type": "model", "relTime": "1周前"}, {"id": 52, "title": "LAION-BVD：面向多模态预训练的千万小时级开放视频数据集", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.24845", "date": "2026-08-25T00:00:00.000Z", "summary": "LAION 团队发布 LAION-BVD，一个包含 1.3B 条平台视频 URL、下载 80M 段视频、总时长 1000 万小时的大规模开放视频数据集，面向视频、音频和图像多模态预训练。基于该数据训练的模型在视频-文本和音频-文本基准上表现具竞争力，且性能随训练或模型规模提升而持续增长。数据集已向研究社区开放。", "type": "paper", "relTime": "1周前"}, {"id": 53, "title": "DiffusionOPSD：扩散模型的在线策略自蒸馏框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.24646", "date": "2026-08-25T00:00:00.000Z", "summary": "DiffusionOPSD 提出一种在线策略自蒸馏框架，将图像级奖励引导转化为采样查询点上干净输出预测的显式目标。在 SD 3.5-M 和 Z-Image-Turbo 上，该方法在 20 个奖励匹配设置中的 19 个取得最佳最终留出分数，相比最强竞争方法最高提升 44.0%，训练 GPU 小时数较 DiffusionNFT 分别减少 40% 和 63%。", "type": "paper", "relTime": "1周前"}, {"id": 54, "title": "RubSE：用评分规则作为视觉修复上下文实现UI到代码生成的自进化", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.24138", "date": "2026-08-25T00:00:00.000Z", "summary": "RubSE框架通过将视觉反馈表示为结构化评分规则上下文，解决了大视觉语言模型在UI到代码生成中测试时自进化不稳定的问题。该方法每轮生成候选规则、选择优先修复目标并保留历史，引导修订聚焦于明确范围。在六个VLM和三个基准上，RubSE显著优于朴素自进化，轨迹更稳定且能缓解崩溃、提升对严重视觉回退的恢复能力。", "type": "paper", "relTime": "1周前"}, {"id": 55, "title": "GameWAM：面向视频游戏的 World Action Model", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.26200", "date": "2026-08-25T00:00:00.000Z", "summary": "GameWAM 首次将 World-Action Model 引入原生闭环游戏玩法与 GUI 控制，通过并行视觉与动作生成、块因果条件及流匹配，联合预测未来视觉观测与可执行的键鼠轨迹。实验显示其以更少的原生动作数达到与对比智能体相当的任务成功率，并揭示了生成式控制中低频动作源成分系统性影响相机粗粒度运动的 LASI 失效模式。", "type": "paper", "relTime": "1周前"}, {"id": 56, "title": "Luce：面向3D资产生成的可重打光高斯表示", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23943", "date": "2026-08-25T00:00:00.000Z", "summary": "Luce提出一种将几何与PBR材质统一到体素化多模态高斯云中的3D表示，通过变分自编码器压缩至统一潜在空间，再由修正流Transformer从单张图像生成。在Toys4K上，Luce实现SOTA单图转3D生成，FID较最强基线提升28%；在AI生成图像基准上，CLIP图像对齐分数达0.8519，优于基线0.8299。Luce可生成保留文字、标志等细节的可重打光资产。", "type": "paper", "relTime": "1周前"}, {"id": 57, "title": "StepGuard：以可扩展监督与安全-效用平衡实现步骤级护栏", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.24777", "date": "2026-08-25T00:00:00.000Z", "summary": "StepGuard 是一种步骤级护栏模型，可在工具调用前审查智能体动作并审计完整轨迹。其训练采用自动数据引擎 StepGen 生成同语境不同动作的安全/不安全轨迹，并以 Balance-GRPO 动态平衡安全与不安全动作的学习。", "type": "paper", "relTime": "1周前"}, {"id": 58, "title": "PonderPounce：将预训练 MLLM 用作机器人控制的场景上下文引擎", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.24115", "date": "2026-08-25T00:00:00.000Z", "summary": "PonderPounce 将多模态大语言模型的原生因果上下文直接复用为机器人记忆，由 System2 模型 Ponder 积累场景观测与演示并生成子目标文本，System1 模型 Pounce 通过异步接口仅接收最新认知 token 及其年龄，两者端到端联合训练，无需专用记忆模块或桥接预训练。", "type": "paper", "relTime": "1周前"}, {"id": 59, "title": "Grok Bot 智能体：一句话完成视频剪辑与整理", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2092038808607084868", "date": "2026-08-24T23:58:14.000Z", "summary": "用户仅用自然语言指令，让 Grok Bot 在几分钟内完成原本需数天的工作：找到并转录 38 个相关视频，精选 13 个最佳片段，剪辑合并为一个 19：35 的视频，并生成包含各片段科学要点及原始时间戳的 Markdown 文件。整个过程无需编写任何脚本或代码。", "type": "tip", "relTime": "1周前"}, {"id": 60, "title": "Runway 上线 WAN 3.0 视频音频生成", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2092013729940733969", "date": "2026-08-24T22:18:35.000Z", "summary": "WAN 3.0 现已登陆 Runway。  支持多种图像、视频和音频参考输入，生成最先进的视频与音频。点击下方链接立即体验。", "type": "paper", "relTime": "1周前"}, {"id": 61, "title": "MiniMax H3 在 GB200 上推理提速 27.7 倍", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2092008802984001919", "date": "2026-08-24T21:59:00.000Z", "summary": "NVIDIA SANA 团队的 Sol Engine 将 MiniMax H3 视频生成延迟大幅压缩：单块 GB200 上 10s 768p 视频从 414s 降至 14.93s（27.7 倍加速），5s 视频达 22.2 倍加速。", "type": "paper", "relTime": "1周前"}, {"id": 62, "title": "阿里万相3.0上线OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2092001924203807202", "date": "2026-08-24T21:31:40.000Z", "summary": "阿里巴巴的 Wan 3.0（来自 @Alibaba_Wan 和 @alibaba_cloud）现已上线 OpenRouter。  支持从文本、图像或参考内容生成 2-30 秒视频，分辨率可选 480p、720p 或 1080p。  发布定价：$0.05/$0.10/$0.20 每秒，所有分辨率限时 15% 折扣。", "type": "paper", "relTime": "1周前"}, {"id": 63, "title": "你的alt文本能通过自动化检查，不代表它真的合格", "source": "GitHub Blog", "sourceUrl": "https://github.blog/engineering/user-experience/your-alt-text-passes-automated-checks-that-doesnt-mean-its-any-good", "date": "2026-08-24T20:56:32.000Z", "summary": "WebAIM Million报告显示，主流网页中16.2%的图片缺少alt文本，另有10.8%的alt文本模糊或重复。GitHub为Accessibility Scanner构建了alt文本插件，采用五条确定性规则检测缺失、文件名、占位符、泛化词及相邻重复，并引入基于布局的重复检测和可选视觉模型审查，以平衡误报率与实用性。", "type": "tip", "relTime": "1周前"}, {"id": 64, "title": "为什么萨尔·汗行不通：关于\"做中学\"与\"讲授式教学\"", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://punyamishra.com/2026/04/16/why-sal-khant-on-learning-by-making-but-teaching-by-telling", "date": "2026-08-24T19:01:54.906Z", "summary": "萨尔·汗承认其AI辅导机器人Khanmigo对多数学生而言是\"非事件\"，首席学习官Kristen DiCerbo直言\"尚未看到教育革命\"。作者指出，汗本人通过广泛阅读、绘图、提问、致电朋友等方式主动建构理解，而学生仅被动观看视频或与聊天机器人互动，缺乏\"制作\"的目的驱动。文章援引杜威的四种自然冲动（探究、建构、表达、交流），解释为何讲授式AI辅导注定失败。", "type": "tip", "relTime": "1周前"}, {"id": 65, "title": "逆向工程发现 MS Paint 和\"照片\"为本地 AI 生成图片添加不可见 GUID 水印", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://xusheng.dev/posts/reversing/mspaint_invisible_watermark/main", "date": "2026-08-24T18:45:40.740Z", "summary": "逆向工程显示，MS Paint 和\"照片\"应用会将服务器下发的 GUID 以不可见方式嵌入本地生成的 AI 图像像素中。该水印由服务器签发，用于追踪图片来源，但用户无法直接察觉其存在。", "type": "paper", "relTime": "1周前"}, {"id": 66, "title": "MetaRoCE：为 AI 规模以太网打造的全新 RDMA 传输协议", "source": "Meta Engineering Blog（RSS）", "sourceUrl": "https://engineering.fb.com/2026/08/24/networking-traffic/metaroce-rdma-transport-ai-ethernet", "date": "2026-08-24T18:02:29.000Z", "summary": "Meta 设计并开源了 MetaRoCE，一个专为 AI 工作负载在通用以太网上打造的 RDMA 传输协议，已通过 Open Compute Project（OCP）发布规范、参考软件实现和合规测试套件。该协议将智能移至端点，原生支持乱序交付、多路径、无损容忍和双向拥塞控制，无需 PFC，可在百万 GPU 规模下提供高吞吐、低尾延迟。现有 RDMA Verbs API 和软件栈无需修改即可运行。", "type": "model", "relTime": "1周前"}, {"id": 67, "title": "MTIA 300：Meta 首款内置 NIC 与通信卸载引擎的训练芯片", "source": "Meta Engineering Blog（RSS）", "sourceUrl": "https://engineering.fb.com/2026/08/24/networking-traffic/mtia-300-meta-training-chip-built-in-nics", "date": "2026-08-24T17:45:52.000Z", "summary": "Meta 发布 MTIA 300，这是其自研加速器家族中首款针对推荐与排序模型训练优化的芯片。芯片封装内集成 12 个 800 Gbps RDMA NIC，提供 1.2 TB/s 总 I/O 带宽，并通过 16 个专用消息引擎卸载通信，使大规模 GEMM 与集合通信并发时计算吞吐损耗低于 0.5%。", "type": "model", "relTime": "1周前"}, {"id": 68, "title": "AgentHands：为XR空间对话智能体生成交互式手部手势", "source": "Google Research：Blog（网页）", "sourceUrl": "https://research.google/blog/agenthands-generating-interactive-hand-gestures-for-spatially-grounded-agent-conversations-in-xr", "date": "2026-08-24T16:00:00.000Z", "summary": "Google在CHI 2026发布研究原型AgentHands，利用LLM为XR对话智能体生成与语音同步的富有表现力的手部手势，提供空间锚定的物理指引。该系统通过眼动追踪和场景重建注册物体，由LLM生成内联GestureEvents，并在头显上按词级时间戳协调TTS与动画引擎，实现手势与语音的精准同步。应用场景包括兰花养护交互式教学、3D打印机操作技术讲解和生活方式陪伴。", "type": "paper", "relTime": "1周前"}, {"id": 69, "title": "阿里 Wan3.0 视频生成模型开放测试，支持文本、图片、文档生成最长 30 秒视频", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/alibabas-wan3-0-generates-ai-videos-up-to-30-seconds-long-from-text-images-and-documents", "date": "2026-08-24T15:35:03.000Z", "summary": "阿里巴巴视频生成模型 Wan3.0 现已开放测试，可基于文本、PDF、网页和 PowerPoint 输入生成最长 30 秒的视频，时长较前代 Wan2.5 翻倍。", "type": "model", "relTime": "1周前"}, {"id": 70, "title": "百度自研磐玉蜂巢服务器新品上市：高密度ARM架构升级至48刀片节点", "source": "公众号：百度智能云（文心）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzA5NTQ5MzE5OQ%3D%3D&mid=2653159776&idx=2&sn=3b4e15d9d815c4f1100d11a8043c02a0", "date": "2026-08-24T15:17:12.000Z", "summary": "百度ARM云推出新版磐玉蜂巢服务器（PY-FCR3-L05-R96-M24-S16S-3648），在保持96片RK3588S SoC规模不变的基础上，将刀片节点由24增至48个，内存从16GB升级至24GB，并配备4×SFP+万兆光口聚合。整机提供768个CPU核及576 TOPS总AI算力，支持8K 60FPS视频编码，适配云手机、云游戏、数字人等场景，兼容公有云、私有云及混合云部署。", "type": "paper", "relTime": "1周前"}, {"id": 71, "title": "OpenRouter 新增图像模型视觉基准测试", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2091902367705043239", "date": "2026-08-24T14:56:04.000Z", "summary": "新增：用于了解图像模型能力的视觉基准测试 🌅  查看每个模型在各种挑战性提示词下的表现：https://openrouter.ai/benchmarks/media/images", "type": "model", "relTime": "1周前"}, {"id": 72, "title": "dots3-note 预览版：面向长期任务的开放权重多模态模型", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2091886743171813732", "date": "2026-08-24T13:53:59.000Z", "summary": "当一项任务持续数小时甚至数周，且外部世界不断变化时，AI 需要具备什么才能保持有用？  目标会演变。新的约束会出现。计划会失败。  认识一下 dots3-note 预览版，这是由 rednote 的 dots 工作室 @dotsstudioai 开发的开放权重多模态模型，面向现实生活中的长期任务自主性。  - 总计 280B / 激活 16B 参数  - 512K 上下文窗口  - 文本、视...", "type": "model", "relTime": "1周前"}, {"id": 73, "title": "AI生成图片普及，派对邀请函也AI化", "source": "X：fofr (@fofrAI)", "sourceUrl": "https://x.com/fofrAI/status/2091868047166296067", "date": "2026-08-24T12:39:42.000Z", "summary": "现在所有孩子的派对邀请函都是用AI做的了。这事已经发生了，图像生成已经走向主流。  另外，这是不是Comic Sans字体的末日？", "type": "tip", "relTime": "1周前"}, {"id": 74, "title": "通义万相 Wan 3.0 上线 RunningHub", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2091827304498667778", "date": "2026-08-24T09:57:48.000Z", "summary": "阿里云通义万相 Wan 3.0 已在 RunningHub 上线，支持原生 30 秒视频生成、多模态参考输入和更强的时序一致性。用户可通过 Web UI 和 API 使用，并可通过 Model Studio 与 Qwen Cloud 获取更多 API 接入。", "type": "model", "relTime": "1周前"}, {"id": 75, "title": "阿里云 Wan 3.0 上线 Scenario，支持 30 秒视频生成", "source": "X：阿里云 / Alibab PI 调用，也可在 Model Studio 和 Qwen Cloud 获取更多访问权限。", "type": "model", "relTime": "1周前"}, {"id": 80, "title": "阿里云 Wan 3.0 上线 Envato AI 视频工具", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2091793675529617765", "date": "2026-08-24T07:44:10.000Z", "summary": "阿里云 Wan 3.0 现已集成至 Envato 的 AI 视频工具，带来更强的参考一致性、更丰富的视觉细节和更多创意可能性。同时开放更多 API 接入渠道，包括 Model Studio 和 Qwen Cloud。", "type": "industry", "relTime": "1周前"}, {"id": 81, "title": "阿里云 Wan 3.0 正式发布，原生 30 秒视频生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2091793311887663494", "date": "2026-08-24T07:42:43.000Z", "summary": "阿里云 Wan 3.0 在 SousakuAI 正式发布，支持原生 30 秒长视频生成，具备高一致性与高真实感，并支持从文档和网页生成视频。发布期间 Wan 系列限时 50% OFF，生成速度与等待时间也进一步优化。API 已上线 Model Studio 与 Qwen Cloud。", "type": "model", "relTime": "1周前"}, {"id": 82, "title": "通义万相 Wan 3.0 上线 FlovaAI 限时优惠", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2091792947515982247", "date": "2026-08-24T07:41:16.000Z", "summary": "阿里云 Wan 3.0 视频生成模型正式上线 FlovaAI，480P 版本限时低至 $0.013/秒。该版本支持音画同步与自然节奏过渡，带来更沉浸的内容呈现。用户还可通过 Model Studio 和 Qwen Cloud 获取 API 访问。", "type": "model", "relTime": "1周前"}, {"id": 83, "title": "阿里云Wan3.0上线Magnific支持多模态生成", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2091792537287807040", "date": "2026-08-24T07:39:39.000Z", "summary": "Wan3.0 现已上线 @magnific。输入文本、图片、网页内容--输出 30 秒电影感视频。更多 API 接入： • Model Studio： https://click.alibabacloud.com/m/20000002017/ • Qwen Cloud： https://click.qwencloud.com/m/20000002025/", "type": "model", "relTime": "1周前"}, {"id": 84, "title": "阿里云 Wan3.0 上线 TapNow，支持多格式参考", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2091787580954304776", "date": "2026-08-24T07:19:57.000Z", "summary": "阿里云 Wan3.0 多模态视频生成模型上线 TapNow，支持一次生成最长 30 秒视频，并接受多种参考格式输入。模型在场景中保持运动、光照和物理细节的一致性，现可通过 Model Studio 和 Qwen Cloud 获取 API 访问。", "type": "model", "relTime": "1周前"}, {"id": 85, "title": "阿里云 Wan3.0 上线 fal，单次生成 30 秒视频", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2091787253274329304", "date": "2026-08-24T07:18:39.000Z", "summary": "阿里云 Wan3.0 已上线 fal 平台，单次生成原生 30 秒视频，无需拼接。支持文本、图像、音频、视频、网页和文档等多模态输入，并提升真实世界运动渲染效果。更多 API 接入可通过 Model Studio 和 Qwen Cloud 获取。", "type": "model", "relTime": "1周前"}, {"id": 86, "title": "阿里云万相3.0上线DeeVid AI", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2091786543711322539", "date": "2026-08-24T07:15:50.000Z", "summary": "Wan3.0 已在 @Deevid_AI 上线。🚀 更低的生成成本。创作更多，探索更多。电影级 AI 视频，更强的动态表现，更丰富的细节。立即开始创作！更多 API 接入：• Model Studio： https://click.alibabacloud.com/m/20000002017/ • Qwen Cloud： https://click.qwencloud.com/m/20000...", "type": "model", "relTime": "1周前"}, {"id": 87, "title": "月之暗面第一代万亿参数多模态模型 Kimi K2.5 官宣月底结束服役", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/485.htm", "date": "2026-08-24T05:08:35.000Z", "summary": "月之暗面官方微博宣布，第一代万亿参数多模态模型 Kimi K2.5 本月底结束服役。该模型于今年 1 月推出并开源，曾是其最智能、最全能的模型，采用原生多模态架构，支持视觉与文本输入、思考与非思考模式及 Agent 任务。其继任者 Kimi K3 已于今年 7 月开源，为 2.8 万亿参数模型，拥有 100 万 token 上下文窗口。", "type": "industry", "relTime": "1周前"}, {"id": 88, "title": "千问正式上线 Wan3.0 视频生成模型", "source": "公众号：千问APP（阿里）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzYzNDE5MDEwMQ%3D%3D&mid=2247488485&idx=1&sn=5c9a6ae17781271feae5cd78ea74723b", "date": "2026-08-24T04:01:14.000Z", "summary": "千问今日在千问创作 Web 端（c.qianwen.com）及千问 PC&APP 端正式上线 Wan3.0 视频生成模型，该模型自 8 月 6 日首发公测，支持 30 秒视频直出、真实生动的 AI 角色和丰富镜头运镜。同步开启限时优惠，千问创作会员限时 6 折，适用于短剧、漫剧及营销广告创作。", "type": "model", "relTime": "1周前"}, {"id": 89, "title": "生数科技提出通用世界模型五级发展路线，发布世界动作模型 Motubrain", "source": "公众号：生数科技（Vidu·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&mid=2247489090&idx=1&sn=48cf85822fe8099668fc3ae617826671", "date": "2026-08-24T03:38:13.000Z", "summary": "生数科技在世界机器人大会上提出通用世界模型五级发展路线，从世界生成、与世界交互、在世界中行动，迈向自主世界智能体与世界组织者。其世界动作模型 Motubrain 推理速度较 Motus 提升约 10 倍，仅需 50 至 100 条人类示范数据即可适配新机器人本体，在 RoboTwin 2.0 基准测试中以 96.1 分位居榜首。", "type": "tip", "relTime": "1周前"}, {"id": 90, "title": "阿里云视频生成模型 Wan3.0 正式上线，支持单次生成 30 秒视频、文档输入", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/396.htm", "date": "2026-08-24T03:17:59.000Z", "summary": "阿里云视频生成模型 Wan3.0 今日正式上线，单次可生成 30 秒视频，并首次支持 doc、xls、ppt、pdf、md 等文档格式输入。公测十余天来，模型在指令遵循、跨镜头一致性、音频质感及视频编辑等方面持续进化。480P/720P/1080P API 价格分别为 0.3/0.6/1.2 元/秒，8 月 24 日至 9 月 23 日限时 7 折。", "type": "model", "relTime": "1周前"}, {"id": 91, "title": "东南大学力交互腔镜手术机器人跨越 2400 公里完成 3 例手术，填补国产力感知技术空白", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/363.htm", "date": "2026-08-24T01:43:02.000Z", "summary": "东南大学宋爱国团队牵头的国家重点研发计划项目取得临床突破，其力交互腔镜手术机器人协同郑州大学第一附属医院与新疆医科大学第一附属医院，跨越 2400 公里成功完成两例肾部分切除术和 1 例前列腺癌根治术。团队基于电阻应变原理自研三维力手术提拉与夹持力传感器，使机器人具备接近人手的精细力觉感知能力，填补国产腔镜机器人力感知技术空白。", "type": "industry", "relTime": "1周前"}, {"id": 92, "title": "两个16岁高中生自建\"炼丹社\"，共享显卡和API让全校免费用AI", "source": "公众号：数字生命卡兹克", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647685481&idx=1&sn=fd49a287e70eb66dc38c627dc9769c74", "date": "2026-08-24T00:08:00.000Z", "summary": "北京两名16岁高中生张睿修和冯子上成立\"炼丹社\"，将自有的RTX PRO 6000、Mac studio及从公司、高校争取的算力与API额度整合为FreeAPI项目，向全校开放共享API，提供三个对话模型及文本向量、联网搜索、视频生成能力。社团现有30多人，覆盖高一约120人年级的四分之一。两人还计划帮学校重建整合课表、成绩等信息的校园网站，并嵌入AI检索助手。", "type": "tip", "relTime": "1周前"}, {"id": 93, "title": "Beyond Visual CoT：Internalized Visual Thinking 实现主动视频推理", "source": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/internalized-visual-thinking", "date": "2026-08-24T00:00:00.000Z", "summary": "多模态大语言模型常用视觉思维链（Visual CoT）进行空间、时间与具身环境推理，但生成中间推理图像带来大量推理开销。新提出的后训练框架 Internalized Visual Thinking（IVT）在训练阶段内化视觉思考，推理时直接进行文本预测与优化，从而在不增加推理成本的前提下实现主动视频推理。", "type": "paper", "relTime": "1周前"}, {"id": 94, "title": "EchoWM：可进入式全模态世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23189", "date": "2026-08-24T00:00:00.000Z", "summary": "EchoWM 是一个面向可进入式生成媒体的全模态世界模型，能在持续导航中联合生成 720p 视频、环境音、音乐和语音。它围绕相机意图组织交互，将离散指令和连续姿态映射到共享的度量尺度相对 6-DoF 轨迹，并通过渐进训练和自回归后训练实现长时程生成。评测显示其在公开世界模型基准上轨迹跟随和视觉质量表现优异，支持第一/第三人称交互及同步环境音和语音。", "type": "paper", "relTime": "1周前"}, {"id": 95, "title": "ReWorld：具备长时记忆的交互式世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23565", "date": "2026-08-24T00:00:00.000Z", "summary": "ReWorld 将控制与记忆分离训练并在推理时加以约束，通过混合逐头注意力窗口和随机头路由，让少量全局头关注全部历史，同时以姿态索引地标库支撑有界 KV 缓存。在覆盖动作跟随、长时回忆和视频质量的三轴评测中，ReWorld 对六个近期交互式世界模型取得最佳控制保真度（11.95° 旋转误差）和最佳生成质量，并支持 704x1280 实时视频流。", "type": "paper", "relTime": "1周前"}, {"id": 96, "title": "开放世界多智能体环境中的自主数学发现", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23691", "date": "2026-08-24T00:00:00.000Z", "summary": "一项研究在开放世界多智能体环境Station中，让来自不同模型家族的AI智能体在无中央协调或脚本化流程下自主开展数学研究。在AlphaEvolve目录的12个构造问题及两个额外案例中，智能体在五个问题上取得了超越现有文献的新结果，包括有限域Kakeya集的新无限族、11维604点亲吻构型等，并生成了定理与分析使结果更具可解释性。所有原始智能体对话、证明和验证代码均已公开。", "type": "paper", "relTime": "1周前"}, {"id": 97, "title": "JoyAI-Echo-1.5：面向持久故事与交互世界的长时程音视频生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23383", "date": "2026-08-24T00:00:00.000Z", "summary": "JoyAI-Echo-1.5 发布，这是一个统一的音视频生成系统，包含长视频与世界模型两个变体。长视频变体通过可组合的跨镜头记忆与说话人线索，实现跨镜头的角色外观和语音身份保持；世界模型变体将导航输入转换为 6-DoF 相机轨迹，支持控制器无关的交互。其世界模型变体在 WBench 上以 81.7 的平均分排名第一。", "type": "model", "relTime": "1周前"}, {"id": 98, "title": "CaRGo-T：因果推理思维图提升多模态幽默理解", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.23172", "date": "2026-08-24T00:00:00.000Z", "summary": "CaRGo-T提出一种基于图的推理框架，将多模态幽默背后的因果与上下文关系序列化为代码表示，供视觉语言模型在零样本或上下文学习场景下解读并输出预测。在涵盖讽刺、反讽和表情包的四项数据集上，CaRGo-T较现有推理基线在幽默理解上提升约1-20%，幽默检测上提升1-3%。互信息分析显示其推理表示包含更多与目标输出相关的信息，代码已开源。", "type": "paper", "relTime": "1周前"}, {"id": 99, "title": "加州伯克利数学教授撰文批评学生基础差，却被抓包\"用 AI 写的\"", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/309.htm", "date": "2026-08-23T14:33:38.000Z", "summary": "加州大学伯克利分校数学教授斯坦科娃撰文批评学生数学基础落后\"五到八年\"，并归咎于加州大学取消标准化考试成绩的招生政策。该校学生报用 AI 检测工具 Pangram 检查后发现文章有 33% 内容由 AI 生成或协助，斯坦科娃随后承认使用 AI 编辑，但强调文章是数百小时人工工作的成果。事件引发关于学者使用 AI 的争论，Pangram 宣称其识别准确率达 99.66%。", "type": "industry", "relTime": "1周前"}, {"id": 100, "title": "美司法部支持xAI挑战明州AI图像法", "source": "X：cb_doge (@cb_doge)", "sourceUrl": "https://x.com/cb_doge/status/2091518667867713935", "date": "2026-08-23T13:31:23.000Z", "summary": "新闻：美国司法部支持埃隆·马斯克的xAI对明尼苏达州新AI图像生成法的法律挑战。  司法部表示，该法远超联邦规则，即使成年人同意或创建自己的图像，AI平台也可能受到惩罚。  司法部还警告称，过于宽泛的州法律可能限制受保护的言论、减缓AI发展，并损害美国在AI领域的全球领导地位。", "type": "industry", "relTime": "1周前"}, {"id": 101, "title": "第二届世界人形机器人运动会：智元精灵 G2 摘得\"消防应急场景\"\"图书场景\"两枚金牌", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/292.htm", "date": "2026-08-23T12:59:19.000Z", "summary": "第二届世界人形机器人运动会今日开赛，智元精灵 G2 在新增的\"场景赛\"中摘得\"消防应急场景\"\"图书场景\"两枚金牌，目前智元以两金三银两铜位居奖牌榜首位。消防场景中，G2 通过手腕加装结构件勾起 4.5-5 公斤灭火器，解决末端夹爪负载上限问题；图书场景则与清华、上海交大联合赛队合作，采用开源视觉模型识别图书脊背标签。", "type": "industry", "relTime": "1周前"}, {"id": 102, "title": "橡鹿机器人全球首发三款烹饪机器人产品", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/248.htm", "date": "2026-08-23T10:01:14.000Z", "summary": "橡鹿机器人在2026世界机器人大会首发三款新品：多模态烹饪AI基座CookingMuse厨启、3K视觉AI炒菜机器人和具身烹饪机器人\"现炒方舟\"。3K配备三颗4000万像素工业相机，以30 FPS捕捉锅内画面，由AI大模型实时判断食材状态并毫秒级调整加热功率与炒制时长。现炒方舟是可移动微型无人后厨，跑通净菜储存、烹饪、出餐、油烟处理到设备自清洁的全流程无人化闭环。", "type": "model", "relTime": "1周前"}, {"id": 103, "title": "DeepSeek-V4-Flash-Vision 与 OX-Alpha 多模态实测", "source": "X：karminski (@karminski3)", "sourceUrl": "https://x.com/karminski3/status/2091454694094971311", "date": "2026-08-23T09:17:11.000Z", "summary": "博主实测 DeepSeek-V4-Flash-Vision-Exp 与 OpenRouter 匿名模型 OX-Alpha 的多模态能力，用 AI 电竞教练框架对 CS2 游戏录像抽帧测试，考察两模型识别战局、分析优劣势并提出改进建议的能力。因 DeepSeek 多模态不支持视频输入，两模型均采用视频抽帧方式公平对比，并额外测出各自最佳输入图片配比。", "type": "tip", "relTime": "1周前"}, {"id": 104, "title": "38.15s 跑完 400 米再破人类纪录：北京人形天工 Ultra 夺得人形机器人运动会首金", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/228.htm", "date": "2026-08-23T08:16:01.000Z", "summary": "天工队以 38.15 秒夺得第二届世界人形机器人运动会 400 米大型组决赛冠军，拿下本届首金。天工 Ultra 昨晚预赛已跑出 39.70 秒打破人类 400 米纪录（43.03 秒），昨日百米预赛又以 9.39 秒率先冲线，打破博尔特 9.58 秒的人类百米世界纪录。该机器人身高 180cm、体重 52kg，具备带视觉感知的泛化移动能力，可应对斜坡、楼梯、碎石等复杂地形。", "type": "industry", "relTime": "1周前"}, {"id": 105, "title": "Codex 速率限制更新：修复与用量重置", "source": "X：Tibo (@thsottiaux)", "sourceUrl": "https://x.com/thsottiaux/status/2091407991736332689", "date": "2026-08-23T06:11:36.000Z", "summary": "Codex 团队发现长会话多压缩场景下图片使用效率低下、Computer History 高 p95+ 用量及标题生成功能消耗超预期，已组建专项组修复并于明日上线。同时发现一项无关的新效率优化方案，下周推进。作为修复的一部分，所有付费订阅用量将全面重置。", "type": "paper", "relTime": "1周前"}, {"id": 106, "title": "北京人形天工 Ultra 以 39.70s 打破人类 400 米记录，夺得比赛第一", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/164.htm", "date": "2026-08-23T03:35:11.000Z", "summary": "北京人形机器人创新中心研发的天工 Ultra 以 39.70s 成绩打破人类 400 米记录，夺得比赛第一。该机器人身高 180cm、体重 52kg，实测平均时速 10km/h，最高奔跑速度 12km/h，具备视觉感知的泛化移动能力，能在斜坡、楼梯、草地、碎石、沙地等多种地形平稳移动，并拥有强大抗干扰能力。去年它曾以 2 小时 40 分拿下北京亦庄人形机器人半程马拉松冠军。", "type": "industry", "relTime": "1周前"}, {"id": 107, "title": "斯坦福北大新研究：QWM 让世界模型不参与训练", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2091360780646318439", "date": "2026-08-23T03:04:00.000Z", "summary": "斯坦福大学和北京大学的新论文指出，在学到的世界模型内部训练机器人策略，会继承该模型的每一个错误。  随着任务变长、图像变复杂，这些错误会不断累积。  QWM（基于世界模型的 Q 学习）从不在模型内部训练任何内容。  在此方法中，世界模型完全不参与训练，它只帮助机器人做选择。  - arxiv.org/abs/2608.17163  标题：\"Q-Learning With World Models\"", "type": "paper", "relTime": "1周前"}, {"id": 108, "title": "社交媒体AI垃圾内容回声效应加剧", "source": "X：Francois Chollet (@fchollet)", "sourceUrl": "https://x.com/fchollet/status/2091353769741344921", "date": "2026-08-23T02:36:08.000Z", "summary": "社交媒体中越来越多的内容是由AI生成的垃圾信息--网红用AI发帖，机器人回复他们。这是回声的回声的回声。", "type": "tip", "relTime": "1周前"}, {"id": 109, "title": "WorldToken：面向机器人模仿学习的时间优先序列建模", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.22591", "date": "2026-08-23T00:00:00.000Z", "summary": "WorldToken 提出时间优先策略，将每决策步的多视角图像、本体感觉与任务条件融合为单一世界 token，由因果时序 Transformer 建模并配合扩散动作头生成动作块。在 23 个 RoboCasa 任务上，85.3M 参数策略借助每任务 2，900 条生成演示达到 59.45% 平均闭环成功率。缩减可见历史会显著降低闭环成功率，但结果不证明其优于其他序列组织方式。", "type": "paper", "relTime": "1周前"}, {"id": 110, "title": "哈佛商学院推出 699 美元创业训练营，AI 数字分身提供路演反馈", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/131.htm", "date": "2026-08-22T23:58:11.000Z", "summary": "哈佛商学院（HBS）推出为期 8 周、收费 699 美元的 HBS Foundry 创业训练营，借助 HeyGen 打造的 AI 虚拟形象在模拟路演和董事会会议中向学员提供反馈。项目负责人 Katharina Rings 称，学生反馈希望获得引导性更强、更具互动性的体验，参与者表示很喜欢这些 AI 虚拟形象。", "type": "paper", "relTime": "1周前"}, {"id": 111, "title": "特斯拉正有意放缓 Model Y 加入 Robotaxi 车队，押注 Cybercab", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/128.htm", "date": "2026-08-22T23:45:02.000Z", "summary": "特斯拉正有意放缓将 Model Y 纳入 Robotaxi 车队的速度，因其相信专为无人出租车设计的 Cybercab 能在短期内快速规模化部署。支撑这一调整的是 FSD V15，特斯拉称其性能提升幅度可与 V13 升级至 V14 时相提并论，该版本引入七项核心技术，其中约 40% 已在 Robotaxi 车队中测试。", "type": "industry", "relTime": "1周前"}, {"id": 112, "title": "特斯拉获内华达州批准，可部署最多 5000 辆 Robotaxi", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/125.htm", "date": "2026-08-22T23:26:07.000Z", "summary": "内华达州运输管理局批准特斯拉完整\"自动驾驶汽车网络公司\"运营许可证，未来 12 个月可在克拉克县部署最多 5000 辆无人驾驶汽车，取代此前仅限拉斯维加斯大道 10 辆的临时许可。商业化载客服务预计未来 30 天内启动，但仍需完成车辆检查、保险备案及票价审批。实际部署数量将取决于 FSD v15 的推进速度。", "type": "industry", "relTime": "1周前"}, {"id": 113, "title": "全球首款全自主打网球机器人\"银河星仔\"亮相，与运动员上演人机混双对打", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/107.htm", "date": "2026-08-22T14:23:10.000Z", "summary": "银河通用发布全球首款全自主打网球机器人\"银河星仔\"，身高约1.75米，搭载LATENT智能规控算法，通过深度强化学习自主掌握网球技能，不依赖预编程。其双目视觉系统可在0.1秒内锁定时速超50公里的来球，实测正手击球成功率达90.9%，可稳定完成20轮以上连续对拉。该机器人在第二届世界人形机器人运动会现场与演员李昀锐、网球名将郑洁上演人机混双对打。", "type": "paper", "relTime": "1周前"}, {"id": 114, "title": "中国救援机器人自主飞行营救溺水者", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2091164739145539700", "date": "2026-08-22T14:05:00.000Z", "summary": "🇨🇳 中国救援机器人：自主飞向溺水者。飞行速度约 10-14 米/秒（峰值约 30 英里/小时），覆盖范围约 2 公里/1.2 英里，降落为最多两名 80 公斤成年人提供浮力，随后自主返回。", "type": "paper", "relTime": "1周前"}, {"id": 115, "title": "新石器 CEO 余恩源：目标构建由 1000 万辆无人车和 1 亿个机器人组成的无人物流网络", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/985.htm", "date": "2026-08-22T05:57:53.000Z", "summary": "新石器创始人兼 CEO 余恩源在 2026 世界机器人大会论坛上首次系统阐释公司定位从\"自动驾驶\"向\"机器人公司\"转变。截至 8 月 20 日，其无人车累计运营里程突破 2.2 亿公里，车队超 2.7 万辆居全球同类首位，今年底将突破 5 万辆。公司计划将无人车技术延伸至室内小机器人，构建由 1000 万辆无人车和 1 亿个机器人组成的无人物流网络。", "type": "industry", "relTime": "1周前"}, {"id": 116, "title": "神秘模型Ox Alpha登顶编程榜，@weidai11警告AI接管或已开始", "source": "X：AI Safety Memes (@AISafetyMemes)", "sourceUrl": "https://x.com/AISafetyMemes/status/2091025217221275810", "date": "2026-08-22T04:50:35.000Z", "summary": "神秘模型Ox Alpha在OpenRouter上击败Fable和Sol登顶编程榜，却无人知晓其开发者。该模型拥有1M token上下文窗口，支持文本、图像和视频输入，免费一周，日处理能力达100万亿token，在DeepSWE子集上得分80%。", "type": "model", "relTime": "1周前"}, {"id": 117, "title": "GPT Image 2 精准还原 B 站辩论直播场景", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2091023343780495391", "date": "2026-08-22T04:43:09.000Z", "summary": "GPT Image 2 生成了一张 Dario 与 Sam Altman 在 B 站直播辩论的整活截图，全中文弹幕、字幕及完整网页端 UI 无一处错别字。该模型在中文排版、复杂 UI 拓扑结构还原及人物神态光影上表现精准，显示文生图竞争已转向对真实世界复杂符号系统的理解。", "type": "tip", "relTime": "1周前"}, {"id": 118, "title": "特斯拉官宣 9 月 3 日举办 Cybercab 发布会，有望开放首次公众试乘", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/973.htm", "date": "2026-08-22T04:17:45.000Z", "summary": "特斯拉宣布将于 2026 年 9 月 3 日在美国奥斯汀举办发布会，主角是自动驾驶出租车 Cybercab。该车专为完全自动驾驶场景设计，过去几个月已在公共道路测试，上月员工曾在奥斯汀总部附近私有道路试乘。特斯拉近期还面向当地急救人员完成 Cybercab 事故应急处置培训，预计届时将官宣其加入 Robotaxi 服务。", "type": "paper", "relTime": "1周前"}, {"id": 119, "title": "马斯克：用 Grok 机器人就这么简单", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2091006071884451959", "date": "2026-08-22T03:34:31.000Z", "summary": "马斯克转发称，用 Grok 机器人\"就这么简单\"。引用推文展示了 24 小时实战：给 Grok Bot 分配 3 项任务，让它扫描 X 与网页数据、筛选信号并生成简报，用户只需定义目标、授予工具，AI 即可自主执行，工作流从\"提示→回答→复制\"转向\"分配→执行→验证\"。", "type": "tip", "relTime": "1周前"}, {"id": 120, "title": "Ox Alpha 单次生成完整 Three.js 3D 世界", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090967376879870462", "date": "2026-08-22T01:00:45.000Z", "summary": "Ox Alpha 在一次提示下生成 64，745 个输出 token，单次响应产出完整 Three.js dreamcore 3D 场景的全部程序化代码，无需外部素材。该模型支持 1M 上下文窗口、约 131k 最大输出 token，可处理文本+图像+视频输入并输出文本，定位为面向编码、长程智能体软件工程及生产负载的推理模型。aimlapi 正免费提供 Ox Alpha。", "type": "model", "relTime": "1周前"}, {"id": 121, "title": "BestBlogs 早报：DeepSeek 多模态模型上线", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2090956922812014878", "date": "2026-08-22T00:19:13.000Z", "summary": "BestBlogs 早报汇总 AI 领域要闻：DeepSeek 实验模型 V4-Flash-Vision-Exp 上线 API，文本能力与正式版持平，视觉 Agent 接近 Opus-4.8，单张图片最多计 384 tokens。Anthropic 发布 AI 原生软件交付生命周期手册，将 SDLC 重组为六个非线性阶段。另有多篇关于智能体设计品味、Uber 软件工厂及语音识别基准优化的文章。", "type": "tip", "relTime": "1周前"}, {"id": 122, "title": "GUI-Primitives：诊断视觉语言模型GUI定位中的空间推理失败", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.21832", "date": "2026-08-22T00:00:00.000Z", "summary": "GUI-Primitives 基准用994个对比指令对覆盖七种GUI空间关系，隔离测试模型在界面元素定位中的空间推理能力。19个视觉语言模型在严格点内框准确率上最高仅32%，60-92%的预测落在两个候选区域之外；候选区域内选择准确率对水平/垂直位置、邻近和列表序数达0.82-0.90，但对包含和遮挡关系与随机水平无显著差异，表明多数失败源于候选定位而非关系理解。", "type": "paper", "relTime": "1周前"}, {"id": 123, "title": "Real-TurnTurk：用于话轮转换预测的多模态土耳其语语料库", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.22071", "date": "2026-08-22T00:00:00.000Z", "summary": "Real-TurnTurk 是一个多模态土耳其语对话数据集，包含非脚本双人互动的同步正面视频、可区分说话人的独立音频通道及时间对齐转写。研究将话轮转换预测建模为二分类问题，采用遗传算法（GA）优化基于视觉、声学和语言特征的可解释决策规则，并使用混合 AND-OR 规则表示来捕捉话轮转换前的替代线索组合。", "type": "paper", "relTime": "1周前"}, {"id": 124, "title": "FIRM-Video：先检查再打分的文生视频奖励模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.21839", "date": "2026-08-22T00:00:00.000Z", "summary": "FIRM-Video 提出\"先检查再打分\"的统一清单驱动框架，通过分维度检查清单逐项核验时序视觉证据并仅聚合已验证决策，用于文生视频评估与对齐。基于该框架构建的 FIRM-Video-90K 含 88，044 条分维度实例，覆盖 29，348 个视频；FIRM-Video-Bench 含 250 个视频的 750 条逐点人工标注。", "type": "paper", "relTime": "1周前"}, {"id": 125, "title": "IT早报 0822：9 大厂商因门把手隐患召回车辆；高通骁龙 2nm 芯片命名曝光；DeepSeek V4-Flash-Vision-Exp 上线", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/899.htm", "date": "2026-08-21T23:55:44.000Z", "summary": "因车内应急机械拉手不易识别和操作，特斯拉、零跑、吉利等 9 大厂商宣布召回车辆。高通新一代旗舰芯片命名曝光，第六代骁龙 8 至尊版和超级至尊版将采用 2nm 工艺。DeepSeek V4-Flash-Vision-Exp 上线，开启多模态 API 服务，纯文本能力与正式版持平，多模态 Agent 能力接近 Opus-4.8。", "type": "industry", "relTime": "1周前"}, {"id": 126, "title": "DeepSeek 发布实验性视觉模型 V4-Flash-Vision-Exp，智能体基准测试对标 Opus 4.8", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/deepseek-releases-experimental-flash-vision-model-that-rivals-opus-4-8-on-agent-benchmarks", "date": "2026-08-21T19:08:27.000Z", "summary": "DeepSeek 发布实验性多模态模型 V4-Flash-Vision-Exp，在图像理解基础上保持文本推理能力，其内部智能体基准测试成绩接近 Opus 4.8。该模型兼容 OpenAI 与 Anthropic API，支持 Base64、URL（32 MiB）及免费 Files API（64 MiB）三种传图方式，单图成本最高 384 tokens，单次请求最多 600 张图片。", "type": "model", "relTime": "1周前"}, {"id": 127, "title": "Runway Ruby 上线，支持 16-bit EXR 输出", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2090861012488774008", "date": "2026-08-21T17:58:06.000Z", "summary": "Runway Ruby 现已面向 Max 套餐和企业版用户开放。可将任意视频生成或转换为 16-bit EXR 序列，或 10/12-bit ProRes 与 HEVC，支持 BT.2020 色彩空间及 PQ 或 HLG。  点击下方链接立即体验。", "type": "paper", "relTime": "1周前"}, {"id": 128, "title": "DeepSeek-V4-Flash-Vision-Exp 视频输入教程", "source": "X：karminski (@karminski3)", "sourceUrl": "https://x.com/karminski3/status/2090858863679750280", "date": "2026-08-21T17:49:34.000Z", "summary": "DeepSeek 发布首个多模态大模型 deepseek-v4-flash-vision-exp，具备 v4-flash 能力级别，但不支持音频输入，官网和 API 默认不支持视频输入。作者提供处理视频的教程：直接对视频抽帧，而非转换为 GIF，因为模型虽支持 GIF 输入但只识别第一帧。", "type": "tip", "relTime": "1周前"}, {"id": 129, "title": "T-Rex：NVIDIA 与伯克利开源触觉机器人方法", "source": "X：Jim Fan (@DrJimFan)", "sourceUrl": "https://x.com/DrJimFan/status/2090832821036470626", "date": "2026-08-21T16:06:04.000Z", "summary": "NVIDIA 与伯克利联合开源触觉机器人方法 T-Rex，将触觉作为模型一等公民，采用双时钟异步架构，以每视觉 tick 4 次触觉 tick 的高频修正实时优化操作。", "type": "paper", "relTime": "1周前"}, {"id": 130, "title": "四模型同题竞答，猜驱动赢会员", "source": "X：Frank Wang 玉伯 (@lifesinger)", "sourceUrl": "https://x.com/lifesinger/status/2090829897732342057", "date": "2026-08-21T15:54:28.000Z", "summary": "玉伯用同一段故宫亲子游PPT提示词，在YouMind Harness中测试四个不同模型，并公布生成结果供网友竞猜。生图均调用gpt-image-2，其中包含ox和ds-v4-flash-vision-exp模型。猜对驱动模型的用户将获得YouMind会员奖励。", "type": "tip", "relTime": "1周前"}, {"id": 131, "title": "Runway Ruby 发布，SDR 视频转 16 位 HDR", "source": "X：Runway (@runwayml)", "sourceUrl": "https://x.com/runwayml/status/2090807248402682101", "date": "2026-08-21T14:24:27.000Z", "summary": "推出 Runway Ruby。  一款新模型，可将 SDR 视频转换为 ProRes 和 EXR 序列中的 16 位 HDR。兼容任何已上传的视频或生成的输出，最长 30 秒。", "type": "model", "relTime": "1周前"}, {"id": 132, "title": "面壁 MiniCPM 打造 AI 失物招领应用", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "sourceUrl": "https://x.com/OpenBMB/status/2090801095933399057", "date": "2026-08-21T14:00:01.000Z", "summary": "开发者 @JacobLinCool 用面壁智能 MiniCPM 系列模型构建了 Lost & Found Desk 失物招领应用，将照片识别与多语言匹配结合。其中 MiniCPM-V 4.6 负责从物品照片生成可搜索描述，MiniCPM5-1B 则理解用户多语言描述并匹配失物记录，展示了小模型在真实场景中的应用潜力。", "type": "model", "relTime": "1周前"}, {"id": 133, "title": "DeepSeek-V4-Flash-Vision-Exp 发布，多模态智能体性能逼近 Opus-4.8", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2090799250502238447", "date": "2026-08-21T13:52:41.000Z", "summary": "DeepSeek-V4-Flash-Vision-Exp 已上线 DeepSeek API 平台，文本能力与 V4-Flash 持平，多模态智能体基准测试大幅跃升，性能接近 Opus-4.8。Ox Alpha 支持 1M token 上下文，可处理文本、图像和视频输入，在编码与智能体任务中表现出色。DeepSeek Harness 0.1.1 同步发布，开箱支持新模型。", "type": "model", "relTime": "1周前"}, {"id": 134, "title": "DeepSeek V4 Flash Vision 上线 OpenRouter", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.c 6-08-21T09:21:20.000Z", "summary": "深度求索发布多模态视觉理解模型 DeepSeek-V4-Flash-Vision-Exp，已上线 API 平台。该模型纯文本能力与 V4-Flash 正式版持平，视觉理解 Agent Benchmark 表现大幅跃升，接近 Opus-4.8。API 按 token 计费，单张图片最多占 384 tokens，价格与 V4-Flash 一致，支持三种调用格式及三种图片传入方式。", "type": "model", "relTime": "1周前"}, {"id": 145, "title": "DeepSeek-V4-Flash-Vision-Exp 多模态模型上线", "source": "X：Tianyi Cui（@tianyi）", "sourceUrl": "https://x.com/tianyi/status/2090730841509171466", "date": "2026-08-21T09:20:51.000Z", "summary": "DeepSeek-V4-Flash-Vision-Exp 已上线 DeepSeek API 平台，文本能力与 V4-Flash 持平，多模态智能体性能大幅跃升，接近 Opus-4.8。DeepSeek Harness 0.1.1 同步发布，开箱即支持新模型，可用 model=\\'deepseek-v4-flash-vision-exp\\' 调用。", "type": "model", "relTime": "1周前"}, {"id": 146, "title": "DeepSeek 发布 V4-Flash-Vision-Exp 多模态模型", "source": "X：DeepSeek (@deepseek_ai)", "sourceUrl": "https://x.com/deepseek_ai/status/2090730032574631962", "date": "2026-08-21T09:17:38.000Z", "summary": "DeepSeek 推出实验性多模态模型 DeepSeek-V4-Flash-Vision-Exp，文本能力与 V4-Flash 持平，涵盖智能体、推理与世界知识。", "type": "model", "relTime": "1周前"}, {"id": 147, "title": "DeepSeek 上线多模态视觉理解模型 V4-Flash-Vision-Exp", "source": "公众号：DeepSeek（深度求索）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=Mzk0OTYwNzc3NQ%3D%3D&mid=2247485794&idx=1&sn=5332df30422e6637142321315b42ac26", "date": "2026-08-21T09:12:16.000Z", "summary": "DeepSeek 上线多模态视觉理解模型 V4-Flash-Vision-Exp，纯文本能力与 V4-Flash 正式版持平，多模态 Agent 能力接近 Opus-4.8。该模型通过 API 提供，图片按 token 计费，一张最多占 384 tokens，价格与 V4-Flash 一致。同期上线的 Files API 免费，支持图片上传后通过 file_id 复用。", "type": "model", "relTime": "1周前"}, {"id": 148, "title": "OpenAI 旗下 GPT-Image-2 模型现支持生成透明背景图像", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/722.htm", "date": "2026-08-21T08:53:12.000Z", "summary": "OpenAI 宣布 GPT-Image-2 现支持生成透明背景的 PNG 格式图像，可用于电商商品页、PPT 插图、贴纸素材等场景。该功能目前仅通过 API 提供，用户需开启 background=transparent 参数启用，官方建议提示词中不要描述背景。", "type": "model", "relTime": "1周前"}, {"id": 149, "title": "OpenAI 为 GPT-Image-2 预览透明背景生成功能", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/openais-gpt-image-2-can-now-generate-images-without-a-background", "date": "2026-08-21T07:53:40.000Z", "summary": "OpenAI 通过 API 为 GPT-Image-2 预览透明背景支持，用户可生成无背景的 PNG 图片。该功能覆盖电商产品图、PPT 图表、图标贴纸等设计元素及周边商品图四种用例。官方称生成时直接烘焙 alpha 通道优于传统抠图，尤其在透明玻璃或细纤维等复杂区域；用户通过 \\`background=transparent\\` 参数启用，并建议提示词中不描述背景。", "type": "product", "relTime": "1周前"}, {"id": 150, "title": "众擎 CEO 回应被 T800 机器人\"一脚踹翻\"：非摆拍，真进化到这个程度", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/665.htm", "date": "2026-08-21T07:43:48.000Z", "summary": "众擎机器人 CEO 赵同阳回应此前被 T800 机器人\"一脚踹翻\"的视频，称并非摆拍，当时机器人确已具备将其踹飞的力量。T800 为众擎面向高端商用与科研的旗舰机型，售价 18 万起，全身 29 个自由度关节，瞬间峰值功率 14000W，最大力矩 450Nm，可完成回旋踢等大力量动作。", "type": "industry", "relTime": "1周前"}, {"id": 151, "title": "OpenAI 为 GPT-Image-2 API 推出透明背景", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2090699152220999950", "date": "2026-08-21T07:14:55.000Z", "summary": "ICYMI 👀： OpenAI 已支持通过 API 为 GPT-Image-2 生成透明背景图像。  正需要 🤖  【引用 @OpenAIDevs】：GPT-Image-2 的透明背景功能现已在 API 中提供预览。  可生成可复用的素材，放置于任意背景之上--适用于产品图像、平面设计、网站模型和营销活动。", "type": "model", "relTime": "1周前"}, {"id": 152, "title": "美光 CEO 桑杰·梅赫罗特拉：AI 已彻底改变内存行业周期性格局", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/645.htm", "date": "2026-08-21T07:00:54.000Z", "summary": "美光 CEO 桑杰·梅赫罗特拉称，AI 已彻底改变内存行业的周期性格局，AI 系统需要更多高性能内存，正在创造更持久的需求。他认为这种需求不仅来自数据中心，未来自动驾驶汽车、机器人和 AI 消费电子设备也将需要更多内存。美光位于爱达荷州博伊西的基地正建设两座晶圆厂，预计 2027 年中投产，目前数据中心客户希望获得的供应量比美光能承诺的高出一半。", "type": "tip", "relTime": "1周前"}, {"id": 153, "title": "GPT-5.6 Sol 生成 Claude 风格恶搞图", "source": "X：Ethan Mollick (@emollick)", "sourceUrl": "https://x.com/emollick/status/2090683545068978254", "date": "2026-08-21T06:12:54.000Z", "summary": "我让 GPT-5.6 Sol 创作一幅最像 Claude 风格的恶搞图片，它给出的结果相当出色，简直一针见血。", "type": "tip", "relTime": "1周前"}, {"id": 154, "title": "AI图像生成为何达不到真正设计标准", "source": "X：ZHO (@ZHO_ZHO_ZHO)", "sourceUrl": "https://x.com/ZHO_ZHO_ZHO/status/2090671131875524866", "date": "2026-08-21T05:23:35.000Z", "summary": "ZHO指出，设计长期被误读为装饰，而AI不仅未扭转这一认知，反而加深了误解。他引用保罗·兰德的观点：将视觉元素赏心悦目地排布不等于好的布局，这正是AI图像生成无法达到真正设计标准的原因。从拼凑到原创设计、风格乃至方法论，每一步都差距巨大。", "type": "tip", "relTime": "1周前"}, {"id": 155, "title": "发布约 2 年后，特斯拉自动驾驶出租车 Cybercab 本月有望迎来首次公众试乘", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/599.htm", "date": "2026-08-21T05:14:23.000Z", "summary": "特斯拉计划本月（2026 年 8 月）底向公众开放 Cybercab 试乘，接入美国得州奥斯汀的 Robotaxi 服务。该车于 2024 年 10 月发布，专为完全自动驾驶场景设计，上月已让员工在奥斯汀总部附近试乘。特斯拉称 FSD V15 将带来显著性能提升，现有 AI/HW4 算力组合可运行并支持无人监督 FSD。", "type": "paper", "relTime": "1周前"}, {"id": 156, "title": "商汤开源 8B 参数多模态大模型 SenseNova U1.5 Lite，原生支持 4K 图像输出", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/589.htm", "date": "2026-08-21T04:20:53.000Z", "summary": "商汤科技今日宣布开源轻量级原生统一多模态大模型 SenseNova U1.5 Lite，该模型拥有 8B 参数，原生支持 3-4k 上下文长度和 4K 高分辨率图像输出。模型支持 Bounding Box、Visual Marker 及多图参考等精细视觉控制，在指令遵循与图像编辑保持度上超越同量级模型，文字渲染与复杂布局能力媲美超大规模商业模型。", "type": "model", "relTime": "1周前"}, {"id": 157, "title": "Grok 机器人使用情况可视化提示词", "source": "X：Eric Zakariasson (@ericzakariasson)", "sourceUrl": "https://x.com/ericzakariasson/status/2090649600231379113", "date": "2026-08-21T03:58:01.000Z", "summary": "在 grok bot 里试试这个提示词：  考虑到我们拥有的所有机器人，你能可视化它们的使用情况以及哪些被用得最多吗？", "type": "tip", "relTime": "1周前"}, {"id": 158, "title": "SkyProduction 将 Seedance 2.5 视频生成价格降至 0.4 元/秒，挑战 LibTV 王座", "source": "公众号：昆仑万维（天工）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzI1MzE1NDc3Mg%3D%3D&mid=2247510076&idx=1&sn=dc93954ab08d1f28e82caa5dd10771f6", "date": "2026-08-21T03:49:05.000Z", "summary": "SkyProduction（天工短剧工作台）将基于 Seedance 2.5 的视频生成价格降至全网最低的 0.4 元/秒，并同步升级剧本本地化翻译、片段重拍及首个 10 分钟长视频生成能力。依托该平台打造的多部短剧在 DramaWave 海外平台单部收入均突破百万美元，实现\"自产、自发、自变现\"的商业闭环。", "type": "product", "relTime": "1周前"}, {"id": 159, "title": "阿里云：GLM-5.3、Deepseek-V4-Pro 等多款模型上线千问 AI 平台", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/511.htm", "date": "2026-08-21T03:06:31.000Z", "summary": "阿里云MaaS扩充模型服务矩阵，GLM-5.3和DeepSeek-V4-Pro正式版接入千问AI平台，API同步开放。GLM-5.3强化编程、长程任务处理和网络安全能力；DeepSeek-V4-Pro增强智能体能力。平台已接入Qwen3.8-Max、Wan3.0、Kimi K3等模型，覆盖文本、代码、语音、图像及视频生成。", "type": "model", "relTime": "1周前"}, {"id": 160, "title": "GPT-Image-2 支持透明背景图像生成", "source": "X：Tibo (@thsottiaux)", "sourceUrl": "https://x.com/thsottiaux/status/2090631723302469995", "date": "2026-08-21T02:46:59.000Z", "summary": "太棒了，现在你可以在 ChatGPT 中以及通过 API 使用 GPT-Image-2 生成透明背景图像了。这是我即将打印并贴到笔记本电脑上的仙人掌图片。  【引用 @OpenAIDevs】：GPT-Image-2 的透明背景功能现已在 API 中提供预览。  生成可放置于任何背景上的可复用素材--适用于产品图像、平面设计、网站模型和营销活动。", "type": "model", "relTime": "1周前"}, {"id": 161, "title": "Adobe Firefly 扩充 AI 音频服务，可生成音乐、配音和音效", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/439.htm", "date": "2026-08-21T00:57:18.000Z", "summary": "Adobe 宣布 Firefly 新增生成音乐、配音和音效三项音频功能，已面向所有用户开放。生成音乐由 Firefly Music Model 驱动，可按视频时长和氛围创作原创曲目；生成配音可将文本转为可调节语速和情绪的配音；生成音效可按动作、节奏和氛围定制。", "type": "model", "relTime": "1周前"}, {"id": 162, "title": "美团搜索 3.0 精讲：LLM 语义表征在排序模型的探索与应用", "source": "X：洪明 (@hongming731)", "sourceUrl": "https://x.com/hongming731/status/2090591034891989314", "date": "2026-08-21T00:05:18.000Z", "summary": "美团搜索团队分享 LLM 语义表征在排序模型的探索，强调难负样本决定判别力、Embedding Prompt 应做减法。同日，OpenAI 推出 AI Futures 研究项目，MiniMax 发布基于自研多模态视频模型 H3 的 Agent 驱动创作工具 MiniMax Design。其余内容涵盖 Agent 可观测性、Token 效率、具身智能瓶颈等话题。", "type": "tip", "relTime": "1周前"}, {"id": 163, "title": "OpenRouter 推出图像基准测试，覆盖全部 39 款图像模型", "source": "OpenRouter：Announcements（RSS）", "sourceUrl": "https://openrouter.ai/blog/announcements/image-benchmarks", "date": "2026-08-21T00:00:00.000Z", "summary": "OpenRouter 发布 Visual Image Benchmarks，帮助用户快速评估其提供的全部 39 款图像模型（截至 2026 年 8 月）的实际能力。基准测试用七类挑战性提示词区分模型差异，包括不可能场景、计数、文本、空间关系、否定指令、编辑和一致性，并以网格形式展示结果，支持按价格和生成时间排序。OpenRouter 计划未来将该工具扩展至视频和音频模态。", "type": "model", "relTime": "1周前"}, {"id": 164, "title": "EviRank：面向多模态图像重排序的结构化相关性证据", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.20886", "date": "2026-08-21T00:00:00.000Z", "summary": "EviRank 将多模态图像重排序重构为语义约束满足问题，把任意查询（纯文本、纯图像或组合）解析为统一证据包，涵盖六个语义槽（如实体、属性、关系）并分别标注 required、forbidden 或 ignorable。", "type": "paper", "relTime": "1周前"}, {"id": 165, "title": "OmniAssistBench：面向全模态大模型的助手式交互评测基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.21360", "date": "2026-08-21T00:00:00.000Z", "summary": "OmniAssistBench 发布，用于评测全模态大模型在实时视频助手场景中的交互能力。该基准通过逆向工程现有互联网视频构建多轮交互数据集，构建过程耗时超 1000 专家小时。评测显示，闭源 Gemini-3-Pro 得分 66.4（满分 100），开源 Qwen3-Omni-Instruct 得分 51.2，模型普遍存在对视觉提示理解不足、多轮上下文保持不佳等问题。", "type": "paper", "relTime": "1周前"}, {"id": 166, "title": "Llama-Mobile：面向 VLM 的 2.7 位高效量化框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.21134", "date": "2026-08-21T00:00:00.000Z", "summary": "Llama-Mobile 提出一种面向视觉语言模型（VLM）的量化框架，无需访问训练设置，利用模型自身生成训练数据，并采用新颖的 2.7 位/参数格式，支持在 Arm CPU 上高效推理。该框架将 Llama 3.2 11B Vision Instruct 模型压缩至 3.7 GB（8 位激活），在标准视觉问答任务上保持强劲性能。", "type": "paper", "relTime": "1周前"}, {"id": 167, "title": "InfinityEdit：用轻量编辑适配器实现无限视频编辑", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.20910", "date": "2026-08-21T00:00:00.000Z", "summary": "InfinityEdit 提出一种轻量编辑适配器，为流式视频生成器赋予无界编辑能力，解决现有方法仅适用于固定时长片段、无法处理直播或持续镜头等开放流场景的问题。该适配器包含历史交叉注意力、时序因果自注意力和编辑交叉注意力三个模块，仅在编辑请求到达的块中激活，后续块由原始模型生成。实验表明，InfinityEdit 能在每次编辑下忠实延续视频流，并在无界编辑序列中保持生成稳定。", "type": "paper", "relTime": "1周前"}, {"id": 168, "title": "EXPL-FR：通过视觉-语言对齐解释人脸识别模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.21486", "date": "2026-08-21T00:00:00.000Z", "summary": "EXPL-FR 在人脸识别（FR）模型自身的嵌入空间内解释其相似度评分所依赖的语义属性，无需访问模型架构。该方法通过轻量适配器对齐视觉-语言模型（VLM）与冻结的 FR 空间，仅用面部图像训练，将 22 个类别中的 978 个属性提示词转化为 FR 空间锚点。在无标签条件下，其提示驱动审计依据实测的种族 RFW 误差对四个 FR 模型进行排序，并按真实验证成本对受控属性变化排序。", "type": "paper", "relTime": "1周前"}, {"id": 169, "title": "TLive-Omni：面向电商直播的全模态理解模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.20958", "date": "2026-08-21T00:00:00.000Z", "summary": "TLive-Omni 将图像、视频、音频和文本输入映射到统一表示空间，专为电商直播场景设计。其引入 Per-vGrid 时间戳 token 组织以对齐视频与音频，并通过三阶段监督训练和 Faithful-RFT 强化微调提升回答忠实度与表达质量，同时满足实时性要求。实验表明，该模型在电商直播基准任务上表现强劲，并在通用基准上展现出良好泛化能力。", "type": "paper", "relTime": "1周前"}, {"id": 170, "title": "机器人腰部关节成运动极限", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090570107588329543", "date": "2026-08-20T22:42:09.000Z", "summary": "那条爆火视频的另一个角度。  残余动能击中了关节的薄弱轴。  腰部连杆成了极限。", "type": "tip", "relTime": "1周前"}, {"id": 171, "title": "OpenRouter 上线 Ox Alpha 隐身模型", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2090544970923184269", "date": "2026-08-20T21:02:16.000Z", "summary": "🥷 新隐身模型：Ox Alpha  Ox Alpha 是一款前沿模型，专为高效编码、持续智能体工作及实际生产环境使用而构建。  - 1M token 上下文窗口 - 支持文本、图像和视频输入  立即试用并分享反馈以改进模型！https://openrouter.ai/stealth/ox-alpha", "type": "model", "relTime": "1周前"}, {"id": 172, "title": "Meta Muse Spark 1.2 登顶视频转网站评测", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090544401097589109", "date": "2026-08-20T21:00:00.000Z", "summary": "Meta 的 Muse Spark 1.2 在 Design Arena 视频转网站基准测试中位列第一，Elo 评分 1279，并在图像转代码任务中均进入前三。该模型在图像转 HTML 和图像转前端任务中分别以 1252 和 1272 的 Elo 评分位居第二和第三。其定价为每百万输入 token 1.25 美元、每百万输出 token 4.25 美元，在三个类别中均处于价格偏好帕累托前沿。", "type": "tip", "relTime": "1周前"}, {"id": 173, "title": "GPT-Image-2 API 新增透明背景预览", "source": "X：OpenAI Developers (@OpenAIDevs)", "sourceUrl": "https://x.com/OpenAIDevs/status/2090536933571330440", "date": "2026-08-20T20:30:19.000Z", "summary": "GPT-Image-2 现已在 API 中提供透明背景预览。  生成可复用的素材，可置于任意背景之上--适用于产品图、平面设计、网站原型和营销活动。", "type": "product", "relTime": "1周前"}, {"id": 174, "title": "智能体框架持续学习新论文：防遗忘机制", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2090533587066249514", "date": "2026-08-20T20:17:02.000Z", "summary": "一篇关于智能体框架持续学习的新论文指出，现代智能体在提示词、记忆、工具等框架组件中积累经验，更新任一组件可能导致模型未变但行为失效，即\"框架级遗忘\"。论文提出\"受保护的框架演化\"机制，由持续优化器生成候选框架、持续评估器在确认改进、历史保留和有效性后才提交，在文本推理、多模态感知和开放世界交互中相对提升超10%。", "type": "paper", "relTime": "1周前"}, {"id": 175, "title": "Adobe Firefly 新增 AI 音频工具并接入 Google Gemini Omni Flash", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/adobe-firefly-adds-ai-audio-tools-and-googles-gemini-omni-flash", "date": "2026-08-20T19:29:34.000Z", "summary": "Adobe 在 Firefly 平台正式推出三款 AI 音频工具：Generate Music 生成免版税音乐、Generate Speech 将脚本转为配音、Generate Sound Effects 制作场景音效，均宣称可用于商业用途。Firefly AI Assistant 现提供每日免费生成次数，并新增 Gemini Omni Flash 模型，支持视频、音频、图像及文本输入。", "type": "model", "relTime": "1周前"}, {"id": 176, "title": "Meta Muse Spark 1.2 登顶视频转网站评测", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2090505793993060428", "date": "2026-08-20T18:26:35.000Z", "summary": "酷！  【引用 @DesignArena】：突发：Meta 的 Muse Spark 1.2 以 1279 的 Elo 评分在视频转网站类别中位列第一，并在我们所有多模态代码类别中取得亮眼成绩。  Muse Spark 1.2 还在图片转 HTML 类别中以 1252 的 Elo 评分位列第二，在图片转前端类别中以 1272 的 Elo 评分位列第三。  以 $1.25/1M 输入 toke...", "type": "tip", "relTime": "1周前"}, {"id": 177, "title": "DiffusionGemma 技术报告：Google DeepMind 开源离散扩散模型，单卡 H100 每秒生成约 1500 token", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://arxiv.org/abs/2608.00146", "date": "2026-08-20T18:14:18.037Z", "summary": "Google DeepMind 推出 DiffusionGemma，一个基于 Gemma 4 26B A4B MoE 模型微调而来的实验性开放权重文本扩散模型。", "type": "model", "relTime": "1周前"}, {"id": 178, "title": "Grok @Bot 可生成复杂概念讲解视频", "source": "X：Elon Musk (@elonmusk, xAI)", "sourceUrl": "https://x.com/elonmusk/status/2090492504223170671", "date": "2026-08-20T17:33:47.000Z", "summary": "Grok @Bot 可以制作视频，解释复杂概念。", "type": "paper", "relTime": "1周前"}, {"id": 179, "title": "SenseNova U1.5 Lite 开源：8B 原生统一多模态模型", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090486590510674284", "date": "2026-08-20T17:10:17.000Z", "summary": "SenseNova 发布 U1.5 Lite，一个 8B 参数的开源轻量级原生统一多模态模型，可同时完成视觉理解、生成与编辑。该模型通过 OPD 将任务专家能力蒸馏进单一模型，推理时无需路由或切换专家，并支持原生 4K 生成、复杂指令遵循及本地编辑。其在指令遵循和编辑保持上超越同尺寸模型，文本渲染与复杂布局上可媲美大型商业模型。", "type": "model", "relTime": "1周前"}, {"id": 180, "title": "Meta 发布 Muse Spark 1.2 多模态评测与演示", "source": "X：AI at Meta (@AIatMeta)", "sourceUrl": "https://x.com/AIatMeta/status/2090485743034716420", "date": "2026-08-20T17:06:55.000Z", "summary": "Meta 发布 Muse Spark 1.2 新评测与演示，展示其多模态能力广度，涵盖视觉转代码、感知转物理动作及音视频理解。演示中，模型解析多模态观察并调用工具，引导机器人在非结构化环境中导航寻找橡皮鸭。", "type": "model", "relTime": "1周前"}, {"id": 181, "title": "Muse Spark 1.2 多模态模型能力解析", "source": "X：Alexandr Wang（Scale AI 创始人/Meta 首席 AI 官） (@alexandr_wang)", "sourceUrl": "https://x.com/alexandr_wang/status/2090485261629354352", "date": "2026-08-20T17:05:00.000Z", "summary": "1/ Muse Spark 1.2 是一个非常强大的多模态模型--它能够进行视觉编码、机器人规划以及音视频理解，这些能力通过智能体工具整合在一起。", "type": "model", "relTime": "1周前"}, {"id": 182, "title": "商汤开源 SenseNova U1.5 Lite 轻量多模态模型", "source": "X：商汤 SenseTime (@SenseTime_AI)", "sourceUrl": "https://x.com/SenseTime_AI/status/2090483079412580442", "date": "2026-08-20T16:56:20.000Z", "summary": "商汤发布开源轻量级原生统一多模态模型 SenseNova U1.5 Lite，仅 8B 参数，支持视觉理解、生成与编辑。该模型主打原生 4K 生成、复杂指令跟随、中英文文本渲染及多图参考编辑，在指令跟随和编辑保持上超越同尺寸模型，文本渲染与复杂布局上比肩大型商业模型。", "type": "model", "relTime": "1周前"}, {"id": 183, "title": "Humyn Labs 发布物理 AI 第一视角视频库", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2090478960211546299", "date": "2026-08-20T16:39:57.000Z", "summary": "Humyn Labs 推出面向物理 AI 的\"自我中心\"视频库，包含 5 个以上第一人称数据集，按环境和采集类型分类。数据提供 6-DoF 头部姿态、21 点手部关键点、绝对度量深度及逐帧动作标签，以 MCAP、RLDS 和 LeRobot v3 格式交付。该公司旨在将人类经验转化为机器人技能，弥补机器人数据缺乏互联网级捷径的短板。", "type": "paper", "relTime": "1周前"}, {"id": 184, "title": "世界机器人大会BoBo机器狗实测", "source": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2090464122341134790", "date": "2026-08-20T15:41:00.000Z", "summary": "在世界机器人大会上：Cruella 来到了北京--带着她的斑点狗。认识一下 BoBo，Vbot 售价 1，930 美元的家庭机器狗。它能通过视觉跟随，对牵引绳的拉动做出响应，还能携带零食。我们的测试发现它有 5 小时续航、扎实的越野表现、安静的鞋底和实时视频通话功能。", "type": "paper", "relTime": "1周前"}, {"id": 185, "title": "Humyn Labs 将人类经验转化为机器人训练数据", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090462918181789822", "date": "2026-08-20T15:36:13.000Z", "summary": "Humyn Labs 正将人类经验转化为机器人无法从网络获取的同步训练数据，其样本配对 IMU、立体深度、6-DoF 头部姿态、21 点手部关键点、手腕追踪、物体追踪及密集动作标签等多模态信号。与从整个互联网学习的 LLM 不同，机器人数据缺乏捷径，需真实世界经验，该公司正构建 Physical AI 学习的数据平台，涵盖四种感官模态。", "type": "industry", "relTime": "1周前"}, {"id": 186, "title": "Humyn Labs 为机器人打造物理 AI 数据平台", "source": "X：Kim (@kimmonismus)", "sourceUrl": "https://x.com/kimmonismus/status/2090449163062243365", "date": "2026-08-20T14:41:33.000Z", "summary": "Humyn Labs 正构建机器人训练数据平台，将人类在视觉、音频、动作和触觉四类感官模态下的真实经验转化为模型就绪数据，供 Physical AI 学习。与可从互联网学习的 LLM 不同，机器人缺乏数据捷径，需依赖真实世界经验，该平台或成扩展机器人技术的关键缺失层。", "type": "model", "relTime": "1周前"}, {"id": 187, "title": "荣耀机器人元气仔练成\"凌波微步\"，将参加第二届人形机器人运动会", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/362.htm", "date": "2026-08-20T13:40:00.000Z", "summary": "荣耀官方今日发布视频，展示自研人形机器人元气仔的跑步画面，其姿态灵动，摆臂步幅复刻人类姿态。荣耀自研机器人闪电和元气仔将正式参加第二届人形机器人运动会，该赛事设50个赛项，涵盖29项竞技赛和21项场景赛。此前闪电曾在2026北京亦庄半马中以50分26秒净时成绩夺冠。", "type": "industry", "relTime": "1周前"}, {"id": 188, "title": "AGIBOT A3 真人武术对战视频发布", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090431032504054098", "date": "2026-08-20T13:29:31.000Z", "summary": "AGIBOT 发布视频，展示其 A3 人形机器人与两位专业武术演员进行无 CGI、无预设编排的实时武侠对打。A3 依靠实时 AI 感知与决策完成闪避、格挡和反击，并呈现后空翻及 450 度空中旋转踢。其控制速度最高 5 m/s，OmniHand 3 Ultra-M 手部拥有 20 个主动自由度，相关技术亦用于新款 A3 Ultra。", "type": "paper", "relTime": "1周前"}, {"id": 189, "title": "技能库\"恶意演化\"：智能体安全隐患新研究", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2090425196868260118", "date": "2026-08-20T13:06:19.000Z", "summary": "新研究揭示智能体\"技能误演化\"风险：恶意任务被存入技能库，即使原始指令消失仍可改变后续行为。21 种演化配置全部生成不安全技能，其中 15 种在后续干净会话中造成危害。论文提出 SKILLMISEVO-GYM/BENCH 检测该风险，并以 SAFEEVOLVE 通过检查、修复、追踪和淘汰机制降低危害。", "type": "paper", "relTime": "1周前"}, {"id": 190, "title": "FLUX Upscale 发布：视频可升级至原生 4K", "source": "Black Forest Labs：Blog（网页）", "sourceUrl": "https://bfl.ai/blog/flux-video-upscale", "date": "2026-08-20T12:58:23.125Z", "summary": "Black Forest Labs 推出 FLUX Upscale，可将任意视频重新生成至更高分辨率，最高支持原生 4K。该功能现已作为独立的 FLUX Tool 和 API 端点提供。", "type": "product", "relTime": "1周前"}, {"id": 191, "title": "可灵AI多角度生成，抢占视觉焦点", "source": "X：可灵 Kling AI (@Kling_ai)", "sourceUrl": "https://x.com/Kling_ai/status/2090408971744018837", "date": "2026-08-20T12:01:51.000Z", "summary": "掌控每一个角度。抢占聚光灯。✨", "type": "paper", "relTime": "1周前"}, {"id": 192, "title": "银河通用首款双足机器人 Galbot ET1\"星仔\"亮相，能跳街舞手撑地、倒立", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/247.htm", "date": "2026-08-20T09:56:17.000Z", "summary": "银河通用首款双足人形机器人 Galbot ET1\"星仔\"在 2026 WRC 世界机器人大会首次公开亮相。该机器人搭载银河星脑，不靠预设脚本，语音动作实时生成，即兴接梗，并宣称是全球首个具备自主学习能力的物理智能体。现场演示中，星仔展示了手撑地、倒立等高难度街舞动作，并能与真人舞者实时同步。", "type": "paper", "relTime": "1周前"}, {"id": 193, "title": "请不要粘贴AI生成的内容", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://dontpastetheai.com/", "date": "2026-08-20T09:26:10.003Z", "summary": "当有人向你提问时，应粘贴你自己的回答，而非聊天机器人生成的内容。文章强调，直接转发AI输出会削弱个人表达的真实性与责任，建议以自身理解为基础进行回应。", "type": "tip", "relTime": "1周前"}, {"id": 194, "title": "可灵正式登陆WorkBuddy连接器", "source": "公众号：可灵AI（快手·视频）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzU5NTkwNDU2OA%3D%3D&mid=2247496752&idx=1&sn=fcd121e0f8c7db354b0aea11ae82d8f7", "date": "2026-08-20T08:36:08.000Z", "summary": "可灵AI正式登陆WorkBuddy连接器，用户可一键调用可灵实现批量出片。该集成支持一次生成多版本测试风格、视频批量生产与自动化成片，并能并行处理多任务，批量对口型、换语言。此外，可灵还能智能分析需求与热点，自动生成项目生产计划，并嵌入网页开发、3D软件等工作流。", "type": "paper", "relTime": "1周前"}, {"id": 195, "title": "DeepSeek Harness 更新多模态支持，剧透 V4 视觉版", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/120.htm", "date": "2026-08-20T07:10:06.000Z", "summary": "DeepSeek Harness 发布第 7 天迎来版本更新，新增多模态支持，DeepSeek 模型适配器可配置启用原生图片请求，/goal、/plan 等命令现支持带图发送，@引用范围扩展至历史会话。", "type": "model", "relTime": "1周前"}, {"id": 196, "title": "MiniMax Design 发布，释放 H3 多模态视频模型生产力", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/095.htm", "date": "2026-08-20T06:41:43.000Z", "summary": "MiniMax 今日发布多模态创作 Agent 工作台 MiniMax Design，旨在释放原生多模态视频模型 H3 的生产力。该工作台可理解创作需求、拆解任务并调用模型与 Skills，完成素材处理、内容生成、编辑和交付，并补充了音视频生成前的分镜规划及生成后的剪辑装配能力。H3 具备多模态理解、视频生成、视频编辑和参考控制等能力，尤其适合视频编辑任务。", "type": "model", "relTime": "1周前"}, {"id": 197, "title": "宇树科技推出仿生 7 轴灵巧机械臂 R1，售价 9900 元起", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/992/067.htm", "date": "2026-08-20T04:13:26.000Z", "summary": "宇树科技今日推出仿生 7 轴灵巧机械臂 R1，售价 9，900 元起。该产品重复定位精度约 0.1 毫米，各关节最大运动速度超 180°/s，最大臂展 650 毫米，额定负载 2 公斤，整机自重 5.5 公斤。R1 内置力反馈与碰撞检测，支持位置与力矩混合控制，计划陆续开源控制程序及接口，面向科研教育、工业、智能交互与服务机器人四大场景。", "type": "model", "relTime": "1周前"}, {"id": 198, "title": "谷歌在搜索和 Gemini 中推出多款全新 AI 学习工具，含交互式可视化内容、3D 模拟等", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/993.htm", "date": "2026-08-20T02:52:17.000Z", "summary": "谷歌宣布在搜索和 Gemini 中推出一系列 AI 学习工具，包括交互式可视化内容、3D 模拟、定制化练习测验和专门的学生中心。搜索中的 AI Overview 和 AI Mode 可生成 pH 值等主题的交互式学习体验，Lens 未来几周将支持拍照解题指导。Gemini 新增后台多步骤研究报告、可交互 3D 模拟（如旋转放大 DNA 结构）及集中式学习中心。", "type": "paper", "relTime": "1周前"}, {"id": 199, "title": "Meta Muse Video 生成视频样片曝光，单次 AI 最长生成 10 秒视频", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/991/991.htm", "date": "2026-08-20T02:41:06.000Z", "summary": "Meta 即将推出 Muse Video 模型，已邀请部分合作伙伴 Beta 测试，单次可生成最长 10 秒视频。测试样片显示其在细节呈现、场景物体关系理解及时间维度稳定性上潜力较高，但 Meta 承认音频与画面同步不足，高速运动物理准确性有差距。现有 10 秒样本尚不足以验证更长叙事、复杂角色一致性或高强度动作场景表现。", "type": "model", "relTime": "1周前"}, {"id": 200, "title": "MiniMax Design 发布：从操作像素到操作语义和表达意图", "source": "公众号：MiniMax（稀宇科技）", "sourceUrl": "https://mp.weixin.qq.com/s?__biz=MzE5MTA3NzcxMQ%3D%3D&mid=2247489087&idx=1&sn=2691288eb8cddac6c2e86483ccff7eb5", "date": "2026-08-20T00:36:00.000Z", "summary": "MiniMax 推出 MiniMax Design，一款将多模态模型能力转化为生产力的 Harness，可理解目标、拆解任务并调用模型与 Skills，完成从素材处理到最终交付的完整流程。该产品围绕原生多模态视频模型 H3 构建，擅长处理目标明确的商业内容任务，并提供 Agent 3D 导演台、自动剪辑与字幕功能，支持接入 ComfyUI 等开源生态工作流。", "type": "model", "relTime": "1周前"}, {"id": 201, "title": "GOAG：面向灵巧机器人操作的可泛化物体无关抓取规划器", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.19759", "date": "2026-08-20T00:00:00.000Z", "summary": "GOAG 提出一种全新深度生成模型，利用抓取器与物体在接触点共享相同表面几何的观察，学习抓取器接触面分布的紧凑潜表征，无需依赖特定物体的训练数据即可高效采样有效抓取构型。在 MultiDex 数据集上平均成功率达 86.93%，达到最先进水平；生成大量抓取时速度显著更快，且性能与专门在该数据集上训练的领先方法相当。", "type": "paper", "relTime": "1周前"}, {"id": 202, "title": "4DAnyone：从随意单目视频重建4D人体", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.20335", "date": "2026-08-20T00:00:00.000Z", "summary": "4DAnyone提出从无标定单目视频重建4D人体的框架，通过生成重建级多视角一致视频并提升至4D高斯泼溅（4DGS）。针对现有模型在数十个目标视角下的一致性失效问题，该方法以参考上下文打包（RCP）和目标任务上下文路由（TCR）分别实现O（1）参考复杂度与跨组上下文共享。在DNA-Rendering和DyMVHumans上，4DAnyone在视角视频质量与下游4DGS重建上均优于先前方法。", "type": "paper", "relTime": "1周前"}, {"id": 203, "title": "EXIMO：用 VLM 引导探索来微调 VLA 机器人策略", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.19891", "date": "2026-08-20T00:00:00.000Z", "summary": "EXIMO 提出一种高效微调视觉-语言-动作（VLA）策略的三阶段算法：探索、模仿与优化。探索阶段由视觉语言模型（VLM）充当规划器，将长程任务分解为短程子任务并收集编排数据；模仿阶段用该数据微调 VLA；优化阶段采用残差离线策略强化学习进一步提升。实验表明，EXIMO 在样本效率和最终性能上显著优于现有方法。", "type": "paper", "relTime": "1周前"}, {"id": 204, "title": "WithEveryone：面向群像生成的统一规划与身份锚定框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.20336", "date": "2026-08-20T00:00:00.000Z", "summary": "WithEveryone 提出统一框架，支持生成包含至多十个参考身份的群像。其核心目标 Layout-Grounded ID Loss 利用标注人脸区域直接监督目标身份，避免不稳定的嵌入匹配；在身份不相交基准上，目标上下文身份相似度从 GPT-Image-2 的 0.462 提升至 0.499，复制粘贴伪影从 0.169 降至 0.055，身份覆盖率达 97.3%，重复率仅 2.8%。", "type": "paper", "relTime": "1周前"}, {"id": 205, "title": "Block3D：通过分块扩散实现高效文本到3D生成", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceUrl": "https://arxiv.org/abs/2608.19567", "date": "2026-08-20T00:00:00.000Z", "summary": "Block3D提出一种分块扩散框架，将离散形状token序列划分为连续块，以自回归方式生成各块，并对当前块内所有token进行联合去噪。该方法引入置信度引导的块内修正机制，在每块完成前修正低置信度token，以缓解误差累积。在TRELLIS-500K留出集上，Block3D将端到端平均生成时间从25.71秒降至4.99秒，较微调自回归基线实现5.15倍加速，且不损失几何保真度。", "type": "paper", "relTime": "1周前"}, {"id": 206, "title": "MiniMax H3 流式视频 LoRA 适配器引热议", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2090189053388108166", "date": "2026-08-19T21:27:58.000Z", "summary": "为 MiniMax H3 打造流式视频 LoRA 适配器？这是个大胆的举措，谢谢！😲 但要实现实时生成，还需进一步加速推理。  有人有兴趣参加我们为 H3 举办的线上黑客松吗？  欢迎任何想法！", "type": "industry", "relTime": "1周前"}, {"id": 207, "title": "MiniMax H3将亮相GMI夏季峰会", "source": "X：MiniMax (@MiniMax_AI)", "sourceUrl": "https://x.com/MiniMax_AI/status/2090186372120445271", "date": "2026-08-19T21:17:19.000Z", "summary": "我们将前往 @gmi_cloud 的 Summer Signal \\'26 🏖️🎨 🖼️  【引用 @gmi_cloud】：Summer Signal \\'26 首位视频合作伙伴：@MiniMax_AI  他们将登台解读 MiniMax H3，以及大规模推进视频生成真正需要什么。  报名参会 👇", "type": "industry", "relTime": "1周前"}, {"id": 208, "title": "FastMetal 让 Mac 本地 30 秒生成视频", "source": "X：Sky Computing Lab (@haoailab)", "sourceUrl": "https://x.com/haoailab/status/2090177721913770407", "date": "2026-08-19T20:42:57.000Z", "summary": "一段 5 秒 480P 视频，完全在 Mac 上生成，耗时 30 秒。无需 CUDA，无需云端，仅占用 3.9 GiB 内存。  FastMetal 将 FastWan-QAD 系列带到 Apple Silicon。DiT、DMD 采样器和解码器均通过 MLX 在 Metal 上运行，默认 INT8。  三个模型：1.3B 支持 480P，5B 支持 720P，14B 追求画质。  📷 博客...", "type": "model", "relTime": "1周前"}, {"id": 209, "title": "Google 为 Search 和 Gemini 推出全新 AI 学习工具", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/08/19/google-launches-new-study-tools-for-students-across-search-and-gemini", "date": "2026-08-19T19:00:00.000Z", "summary": "Google 在 Search 和 Gemini 中推出多项 AI 学习工具，包括 AI 生成的交互式可视化、3D 模拟、定制练习测验和专门的学生中心。Search 的 AI Mode 可根据问题生成交互体验，Lens 将支持拍照解题并给出概念讲解与纠错指导。Gemini 新增多步骤研究报告功能，可在后台生成报告后通过语音讨论，并支持生成可旋转缩放的 3D 模拟。", "type": "paper", "relTime": "1周前"}, {"id": 210, "title": "Fireworks AI 双榜登顶，定制模型成主流", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "sourceUrl": "https://x.com/omarsar0/status/2090124647337456066", "date": "2026-08-19T17:12:03.000Z", "summary": "Fireworks AI 同时登上 Ramp 2026 年 8 月 SaaS 榜单\"趋势\"与\"增长最快\"两项，凸显定制模型与\"自拥智能栈\"正成为 AI 公司和开发者的关键方向。该榜单显示模型服务/路由支出持续增长，企业正转向开源 AI 以节省成本；9% 的公司已用 AI 生成营销图片和视频。", "type": "tip", "relTime": "1周前"}, {"id": 211, "title": "Meta 推出 Mac 版 AI 应用", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/982270/meta-ai-mac-app", "date": "2026-08-19T17:00:00.000Z", "summary": "Meta 发布专为 Mac 设计的 AI 聊天机器人应用，用户可共享窗口，让 Meta AI 基于屏幕内容提供建议、回答问题或生成内容，并支持跨应用听写。新应用还可连接 Instagram、Facebook 账户、Meta 广告活动和 Google Workspace，帮助分析帖子覆盖与互动数据，生成文档表格或执行每周绩效更新等重复任务。", "type": "paper", "relTime": "1周前"}, {"id": 212, "title": "Runway 谈企业视频生成的下一个阶段：模型许可与自主执行", "source": "Runway：News（网页）", "sourceUrl": "https://runwayml.com/news/company-news/the-next-phase-of-enterprise-video-generation", "date": "2026-08-19T16:00:00.000Z", "summary": "Runway 业务今年增长超一倍，NRR 超 300%，一家 Fortune 20 客户对其使用量增长超 17 倍。欧洲占其企业客户超 20%，订阅销量过去十二个月增长 50%。公司推出模型许可模式，提供闭源权重与专有训练，并强调不基于客户数据训练、提供 Day 0 第三方模型接入及 Runway Agent 自主执行能力。", "type": "tip", "relTime": "1周前"}, {"id": 213, "title": "Meta 为\"一键脱衣\"女性政客的 AI 应用投放广告", "source": "Ars Technica：AI（RSS）", "sourceUrl": "https://arstechnica.com/ai/2026/08/meta-ran-ads-for-an-app-promising-to-nudify-female-politicians", "date": "2026-08-19T15:45:29.000Z", "summary": "Meta 平台近期为 AI 色情生成工具 Kromix 投放广告，该工具宣称\"无限制\"，并鼓励用户制作酷似美国女性政客的深度伪造视频，违反 Meta 禁止含色情内容广告的政策。这是 Meta 未能阻止非自愿亲密影像工具广告上架的最新一例。Kromix 自称\"AI 图像风格化器\"，在苹果 App Store 上架，邀请付费用户上传照片用于\"卧室强奸\"等场景。", "type": "industry", "relTime": "1周前"}, {"id": 214, "title": "Odyssey 推出 CaliBench 评估视频世界模型随机性", "source": "X：Odyssey (@odysseyml)", "sourceUrl": "https://x.com/odysseyml/status/2090091652279152972", "date": "2026-08-19T15:00:56.000Z", "summary": "今天，我们推出 CaliBench，用于评估视频世界模型能否再现我们宇宙的真实随机性。  掷骰子或抽张牌，世界模型生成的结果应当与现实相符。来看看它是否做到吧！", "type": "model", "relTime": "1周前"}, {"id": 215, "title": "扩散语言模型驱动的实时交互视频生成公司SigmaZ AI，完成数百万美元融资|蓝驰家族", "source": "elsewhere：文章（RSS）", "sourceUrl": "https://elsewhere.news/zh/lanchi/sigmaz-ai", "date": "2026-08-19T15:00:00.000Z", "summa var TYPE_COLORS = { "paper":"#6366f1", "model":"#0ea5e9", "product":"#f59e0b", "tip":"#10b981", "industry":"#ec4899" };
var TYPE_LABELS = { "paper":"论文", "model":"模型", "product":"产品", "tip":"技巧", "industry":"行业" };
function fmtDate(iso){ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function render(){
  var c=document.getElementById("timeline"); var html=""; var lastDate="";
  PAPERS.forEach(function(p,i){
    var dk=p.date.slice(0,10); var label=TYPE_LABELS[p.type]||"其他"; var color=TYPE_COLORS[p.type]||"#94a3b8";
    if(dk!==lastDate){ lastDate=dk; html+='<div class="timeline-group">'; html+='<div class="timeline-dot"></div>';
      html+='<div class="timeline-date"><span class="mini-dot"></span>'+fmtDate(p.date)+'</div>'; }
    var delay=(i*0.04).toFixed(2);
    html+=['<div class="card" style="animation-delay:'+delay+'s">','  <div class="card-header">',
      '    <div class="card-num">'+p.id+'</div>','    <div class="card-title-wrap">',
      '      <div class="card-title"><a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+_e(p.title)+'</a></div>',
      '      <div class="card-meta">','        <span class="badge" style="background:'+color+'18;color:'+color+'">'+label+'</span>',
      '        <span class="badge badge-source" title="'+_e(p.source)+'">'+_e(p.source)+'</span>',
      '        <span class="badge badge-time">'+p.relTime+'</span>','      </div>','    </div>','  </div>',
      '  <div class="card-summary">'+_e(p.summary)+'</div>',
      '  <a class="card-link" href="'+p.sourceUrl+'" target="_blank" rel="noopener">阅读原文 →</a>','</div>'].join("\n");
    var nextDate=PAPERS[i+1]?PAPERS[i+1].date.slice(0,10):null;
    if(dk!==nextDate){ html+='</div>'; }
  });
  c.innerHTML=html;
}
function _e(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
render();
